 GREATWAR_CB_DESC:0 "Ein großer Krieg, um das gesamte De-jure-Territorium eines Titels zu beanspruchen und alle Ländereien zu erobern, die rechtmäßig unter seine Zuständigkeit fallen."
 GREATWAR_REQUIRES_PRESTIGE:0 "Benötigt Prestigestufe §Y$PRESTIGE_LEVEL$§!"
 GREATWAR_DUCHY_TOOLTIP:0 "Das gesamte De-jure-Territorium eines Herzogtums beanspruchen"
 GREATWAR_KINGDOM_TOOLTIP:0 "Das gesamte De-jure-Territorium eines Königreichs beanspruchen"
 GREATWAR_EMPIRE_TOOLTIP:0 "Das gesamte De-jure-Territorium eines Kaiserreichs beanspruchen"
 GREATWAR_WAR_DESC:0 "Dies ist ein großer Krieg um das De-jure-Territorium von $TITLE$"
 DJC_VICTORY_DESC:0 "Der Angreifer nimmt Grafschaften im Zielgebiet des De-jure-Territoriums, die von den verteidigenden Reichen gehalten werden, einschließlich ihrer Baronien. Grafschaften, die bereits im Reich des Angreifers liegen, sowie Land außerhalb des Zielgebiets sind ausgeschlossen."
 DJC_WHITE_PEACE_DESC:0 "Es wechselt kein Territorium den Besitzer. Der Krieg endet in einem Weißen Frieden mit den üblichen Auswirkungen eines Invasionskriegs auf Prestige, Stress und Waffenstillstand."
 DJC_DEFEAT_DESC:0 "Es wechselt kein Territorium den Besitzer. Der Angreifer erleidet die üblichen Niederlage-Effekte eines Invasionskriegs, und es wird ein Waffenstillstand geschlossen."
