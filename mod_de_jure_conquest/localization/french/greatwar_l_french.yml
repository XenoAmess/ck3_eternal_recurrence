 DUCHY_DE_JURE_CONQUEST_WAR_NAME:0 "Guerre de Conquête de Duché de Jure"
 DUCHY_DE_JURE_CONQUEST_CB_NAME:0 "Conquête de Duché de Jure"
 KINGDOM_DE_JURE_CONQUEST_WAR_NAME:0 "Guerre de Conquête de Royaume de Jure"
 KINGDOM_DE_JURE_CONQUEST_CB_NAME:0 "Conquête de Royaume de Jure"
 EMPIRE_DE_JURE_CONQUEST_WAR_NAME:0 "Guerre de Conquête d'Empire de Jure"
 EMPIRE_DE_JURE_CONQUEST_CB_NAME:0 "Conquête d'Empire de Jure"
 GREATWAR_CB_DESC:0 "Une grande guerre pour revendiquer l'ensemble du territoire de jure d'un titre, en conquérant toutes les terres qui appartiennent de droit à sa juridiction."
 GREATWAR_REQUIRES_PRESTIGE:0 "Nécessite un niveau de prestige §Y$PRESTIGE_LEVEL$§!"
 GREATWAR_DUCHY_TOOLTIP:0 "Revendiquer l'ensemble du territoire de jure d'un duché"
 GREATWAR_KINGDOM_TOOLTIP:0 "Revendiquer l'ensemble du territoire de jure d'un royaume"
 GREATWAR_EMPIRE_TOOLTIP:0 "Revendiquer l'ensemble du territoire de jure d'un empire"
 GREATWAR_WAR_DESC:0 "Ceci est une grande guerre pour le territoire de jure de $TITLE$"
 DJC_VICTORY_DESC:0 "L'attaquant s'empare des comtés de la région de jure cible détenus par les royaumes en défense, y compris leurs baronnies. Les comtés déjà dans le royaume de l'attaquant et les terres en dehors de la région cible sont exclus."
 DJC_WHITE_PEACE_DESC:0 "Aucun territoire ne change de main. La guerre se termine par une paix blanche avec les effets normaux de prestige, de stress et de trêve d'une guerre d'invasion."
 DJC_DEFEAT_DESC:0 "Aucun territoire ne change de main. L'attaquant subit les effets normaux de défaite d'une guerre d'invasion, et une trêve est établie."
