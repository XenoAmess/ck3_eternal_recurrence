 GREATWAR_CB_DESC:0 "직위의 전체 법리 영토를 주장하여 그 관할 구역에 정당하게 속하는 모든 땅을 정복하는 대규모 전쟁."
 GREATWAR_REQUIRES_PRESTIGE:0 "위신 레벨 §Y$PRESTIGE_LEVEL$§! 필요"
 GREATWAR_DUCHY_TOOLTIP:0 "공국의 전체 법리 영토를 주장합니다"
 GREATWAR_KINGDOM_TOOLTIP:0 "왕국의 전체 법리 영토를 주장합니다"
 GREATWAR_EMPIRE_TOOLTIP:0 "제국의 전체 법리 영토를 주장합니다"
 GREATWAR_WAR_DESC:0 "$TITLE$의 법리 영토를 위한 대규모 전쟁입니다"
 DJC_VICTORY_DESC:0 "공격측은 목표 법리 영역 안에서 방어측 영지가 보유하고 있던 백작령과 그 남작령을 모두 가져갑니다. 이미 공격측 영지에 속한 백작령과 목표 영역 밖의 영토는 제외됩니다."
 DJC_WHITE_PEACE_DESC:0 "영토의 변경은 없습니다. 전쟁은 무조건 평화로 종료되며, 일반 침략 전쟁의 위신·스트레스·휴전 효과가 적용됩니다."
 DJC_DEFEAT_DESC:0 "영토의 변경은 없습니다. 공격측은 일반 침략 전쟁의 패배 효과를 받으며 휴전이 수립됩니다."
