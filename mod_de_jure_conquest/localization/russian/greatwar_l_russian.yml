 GREATWAR_CB_DESC:0 "Великая война за притязание на всю де-юре территорию титула, покоряющая все земли, что по праву принадлежат его юрисдикции."
 GREATWAR_REQUIRES_PRESTIGE:0 "Требуется уровень престижа §Y$PRESTIGE_LEVEL$§!"
 GREATWAR_DUCHY_TOOLTIP:0 "Притязать на всю де-юре территорию герцогства"
 GREATWAR_KINGDOM_TOOLTIP:0 "Притязать на всю де-юре территорию королевства"
 GREATWAR_EMPIRE_TOOLTIP:0 "Притязать на всю де-юре территорию империи"
 GREATWAR_WAR_DESC:0 "Это великая война за де-юре территорию $TITLE$"
 DJC_VICTORY_DESC:0 "Атакующий получает графства целевого де-юре региона, удерживаемые защищающимися королевствами, вместе с их барониями. Графства, уже входящие во владения атакующего, и земли за пределами целевого региона исключаются."
 DJC_WHITE_PEACE_DESC:0 "Никакие территории не переходят. Война завершается белым миром с обычными последствиями вторжения для престижа, стресса и перемирия."
 DJC_DEFEAT_DESC:0 "Никакие территории не переходят. Атакующий несёт обычные последствия поражения во вторжении, и устанавливается перемирие."
