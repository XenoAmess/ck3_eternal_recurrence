 GREATWAR_CB_DESC:0 "ある称号の法理全土を奪うための大戦争であり、正当な管轄下にあるすべての土地を征服する。"
 GREATWAR_REQUIRES_PRESTIGE:0 "威信レベル§Y$PRESTIGE_LEVEL$§!が必要"
