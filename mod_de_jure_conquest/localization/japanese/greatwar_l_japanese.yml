 DJC_VICTORY_DESC:0 "攻撃側は、防御側諸国が所有する目標法理地域内の各伯爵領を、その男爵領を含めて獲得する。攻撃側の領域に既に属する土地、ならびに目標地域外の土地は対象外となる。"
 DJC_WHITE_PEACE_DESC:0 "領土の移動はなく、通常の侵略戦争における威信・ストレス・停戦の効果とともに白和平で戦争が終結する。"
 DJC_DEFEAT_DESC:0 "領土の移動はなく、攻撃側は通常の侵略戦争における敗北の効果を被り、停戦が成立する。"
