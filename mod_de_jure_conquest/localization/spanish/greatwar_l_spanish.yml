 GREATWAR_CB_DESC:0 "Una gran guerra para reclamar todo el territorio de iure de un título, conquistando todas las tierras que legítimamente pertenecen a su jurisdicción."
 GREATWAR_REQUIRES_PRESTIGE:0 "Requiere nivel de prestigio §Y$PRESTIGE_LEVEL$§!"
 GREATWAR_DUCHY_TOOLTIP:0 "Reclamar todo el territorio de iure de un ducado"
 GREATWAR_KINGDOM_TOOLTIP:0 "Reclamar todo el territorio de iure de un reino"
 GREATWAR_EMPIRE_TOOLTIP:0 "Reclamar todo el territorio de iure de un imperio"
 GREATWAR_WAR_DESC:0 "Esta es una gran guerra por el territorio de iure de $TITLE$"
 DJC_VICTORY_DESC:0 "El atacante toma los condados de la región de iure objetivo que están en manos de los reinos defensores, incluyendo sus baronías. Los condados que ya pertenecen al atacante y las tierras fuera de la región objetivo quedan excluidos."
 DJC_WHITE_PEACE_DESC:0 "No se intercambian territorios. La guerra termina en paz blanca con los efectos habituales de prestigio, tensión y tregua de una guerra de invasión."
 DJC_DEFEAT_DESC:0 "No se intercambian territorios. El atacante sufre los efectos habituales de derrota de una guerra de invasión y se establece una tregua."
