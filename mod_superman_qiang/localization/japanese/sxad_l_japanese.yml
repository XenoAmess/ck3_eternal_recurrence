l_japanese:
 trait_sxad_sex_experience:0 "性経験"
 trait_sxad_sex_experience_desc:0 "《超人強》有効化後に、このModが記録した明確な性行為の回数を計上する。在世かつ18歳以上のキャラクターのみ対象。双方の経験値が異なる場合、経験が多い側が相手の移転可能スキルから1点の修正値を吸い取る。基礎能力は元の値を保持し、バニラのパーセンテージ修正と丸め処理はそのまま適用されるため、画面表示は必ずしも毎回ちょうど1点変化するとは限らない。"
 trait_sxad_sex_experience_character_desc:0 "有効化以降の累計性経験：#V [SCOPE.ScriptValue('sxad_experience_value')|0]#! 回。\n\n$trait_sxad_sex_experience_desc$"
 sxad_view_experience_interaction:0 "性経験を確認する"
 sxad_view_experience_interaction_desc:0 "[recipient.GetShortUIName]の『超人強』有効化以降の累計回数と現在の属性を確認する。確認しても経験値と属性は変動しない。"
 sxad_view_experience_interaction_notification:0 "性経験を確認する"
 sxad_view_experience_interaction_accept_tt:0 "[recipient.GetShortUIName]の性経験記録を確認する。"
 sxad.1.t:0 "超人強：性経験記録"
 sxad.1.desc:0 "[sxad_view_subject.GetShortUIName]はMod有効化後に記録された性行為の累計 #V [sxad_view_subject.MakeScope.ScriptValue('sxad_experience_value')|0]#! 回です。\n\n現在の能力値：外交 [sxad_view_subject.MakeScope.ScriptValue('sxad_diplomacy_value')|0]、軍事 [sxad_view_subject.MakeScope.ScriptValue('sxad_martial_value')|0]、管理 [sxad_view_subject.MakeScope.ScriptValue('sxad_stewardship_value')|0]、謀略 [sxad_view_subject.MakeScope.ScriptValue('sxad_intrigue_value')|0]、学識 [sxad_view_subject.MakeScope.ScriptValue('sxad_learning_value')|0]、武勇 [sxad_view_subject.MakeScope.ScriptValue('sxad_prowess_value')|0]。\n\n本Modによる累計ネット修正：外交 [sxad_view_subject.MakeScope.ScriptValue('sxad_diplomacy_balance_value')|0]、軍事 [sxad_view_subject.MakeScope.ScriptValue('sxad_martial_balance_value')|0]、管理 [sxad_view_subject.MakeScope.ScriptValue('sxad_stewardship_balance_value')|0]、謀略 [sxad_view_subject.MakeScope.ScriptValue('sxad_intrigue_balance_value')|0]、学識 [sxad_view_subject.MakeScope.ScriptValue('sxad_learning_balance_value')|0]、武勇 [sxad_view_subject.MakeScope.ScriptValue('sxad_prowess_balance_value')|0]。\n\nMod有効化後にバニラ共通の共有効果に至った明確な性行為のみを記録し、過去の出来事を遡って推計せず、日常の夫婦性生活も再現しない。既知の相手同士はそれぞれ1回ずつ加算され、匿名の相手は既知の側のみに1回加算される。行為前に経験が多い側が、等確率で選ばれた移転可能スキルから1点の修正値を吸い取る。経験が同値の場合は移動しない。基礎能力は元の値を保持し、パーセンテージ修正と丸め処理により表示上の変化が1点にならない場合もある。"
 sxad.1.a:0 "了解"
 sxad_absorbed_skill_modifier:0 "超人強：吸収スキル"
 sxad_drained_skill_modifier:0 "超人強：喪失スキル"
 sxad_diplomacy_gain_modifier:0 "$sxad_absorbed_skill_modifier$：$diplomacy$"
 sxad_diplomacy_loss_modifier:0 "$sxad_drained_skill_modifier$：$diplomacy$"
 sxad_martial_gain_modifier:0 "$sxad_absorbed_skill_modifier$：$martial$"
 sxad_martial_loss_modifier:0 "$sxad_drained_skill_modifier$：$martial$"
 sxad_stewardship_gain_modifier:0 "$sxad_absorbed_skill_modifier$：$stewardship$"
 sxad_stewardship_loss_modifier:0 "$sxad_drained_skill_modifier$：$stewardship$"
 sxad_intrigue_gain_modifier:0 "$sxad_absorbed_skill_modifier$：$intrigue$"
 sxad_intrigue_loss_modifier:0 "$sxad_drained_skill_modifier$：$intrigue$"
 sxad_learning_gain_modifier:0 "$sxad_absorbed_skill_modifier$：$learning$"
 sxad_learning_loss_modifier:0 "$sxad_drained_skill_modifier$：$learning$"
 sxad_prowess_gain_modifier:0 "$sxad_absorbed_skill_modifier$：$prowess$"
 sxad_prowess_loss_modifier:0 "$sxad_drained_skill_modifier$：$prowess$"
