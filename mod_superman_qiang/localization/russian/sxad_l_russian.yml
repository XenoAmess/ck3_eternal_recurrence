l_russian:
 trait_sxad_sex_experience:0 "Сексуальный опыт"
 trait_sxad_sex_experience_desc:0 "Записывает количество откровенных половых актов, зафиксированных модом после включения «Супермэна Цяна». Учитываются только живые персонажи в возрасте от 18 лет. При разном опыте более опытный партнёр забирает 1 очко модификатора из одной передаваемой характеристики у другого. Базовые характеристики сохраняют исходные значения; оригинальные процентные модификаторы и округление продолжают действовать, поэтому итоговое значение на панели может изменяться не ровно на 1."
 trait_sxad_sex_experience_character_desc:0 "Зафиксировано сексуального опыта после включения: #V [SCOPE.ScriptValue('sxad_experience_value')|0]#! раз.\n\n$trait_sxad_sex_experience_desc$"
 sxad_view_experience_interaction:0 "Посмотреть сексуальный опыт"
 sxad_view_experience_interaction_desc:0 "Посмотреть зафиксированные случаи и текущие навыки [recipient.GetShortUIName] после включения «Супермен Цян». Просмотр не меняет ни опыт, ни навыки."
 sxad_view_experience_interaction_notification:0 "Посмотреть сексуальный опыт"
 sxad_view_experience_interaction_accept_tt:0 "Посмотреть записи сексуального опыта [recipient.GetShortUIName]."
 sxad.1.t:0 "Супермен Цян: запись опыта"
 sxad.1.desc:0 "[sxad_view_subject.GetShortUIName]: после включения мода зафиксировано #V [sxad_view_subject.MakeScope.ScriptValue('sxad_experience_value')|0]#! случаев сексуального опыта.\n\nТекущие характеристики: Дипломатия [sxad_view_subject.MakeScope.ScriptValue('sxad_diplomacy_value')|0], Военное дело [sxad_view_subject.MakeScope.ScriptValue('sxad_martial_value')|0], Управление [sxad_view_subject.MakeScope.ScriptValue('sxad_stewardship_value')|0], Интриги [sxad_view_subject.MakeScope.ScriptValue('sxad_intrigue_value')|0], Учёность [sxad_view_subject.MakeScope.ScriptValue('sxad_learning_value')|0], Доблесть [sxad_view_subject.MakeScope.ScriptValue('sxad_prowess_value')|0].\n\nНакопленные модом чистые модификаторы: Дипломатия [sxad_view_subject.MakeScope.ScriptValue('sxad_diplomacy_balance_value')|0], Военное дело [sxad_view_subject.MakeScope.ScriptValue('sxad_martial_balance_value')|0], Управление [sxad_view_subject.MakeScope.ScriptValue('sxad_stewardship_balance_value')|0], Интриги [sxad_view_subject.MakeScope.ScriptValue('sxad_intrigue_balance_value')|0], Учёность [sxad_view_subject.MakeScope.ScriptValue('sxad_learning_balance_value')|0], Доблесть [sxad_view_subject.MakeScope.ScriptValue('sxad_prowess_balance_value')|0].\n\nУчитываются лишь откровенные акты, достигшие стандартного общего эффекта после включения мода; прошлый опыт не восстанавливается, а обычная супружеская жизнь не моделируется. Известные партнёры получают по 1 случаю; анонимный партнёр добавляет 1 только известному персонажу. Партнёр с большим опытом до акта с равной вероятностью забирает 1 очко модификатора из одной передаваемой характеристики; при равном опыте передачи нет. Базовые характеристики сохраняют исходные значения; процентные модификаторы и округление могут приводить к изменению на панели, отличному от 1 пункта."
 sxad.1.a:0 "Понятно"
 sxad_absorbed_skill_modifier:0 "Супермэн Цян: поглощённая характеристика"
 sxad_drained_skill_modifier:0 "Супермэн Цян: утраченная характеристика"
 sxad_diplomacy_gain_modifier:0 "$sxad_absorbed_skill_modifier$：$diplomacy$"
 sxad_diplomacy_loss_modifier:0 "$sxad_drained_skill_modifier$：$diplomacy$"
 sxad_martial_gain_modifier:0 "$sxad_absorbed_skill_modifier$：$martial$"
 sxad_martial_loss_modifier:0 "$sxad_drained_skill_modifier$：$martial$"
 sxad_stewardship_gain_modifier:0 "$sxad_absorbed_skill_modifier$：$stewardship$"
 sxad_stewardship_loss_modifier:0 "$sxad_drained_skill_modifier$：$stewardship$"
 sxad_intrigue_gain_modifier:0 "$sxad_absorbed_skill_modifier$：$intrigue$"
 sxad_intrigue_loss_modifier:0 "$sxad_drained_skill_modifier$：$intrigue$"
 sxad_learning_gain_modifier:0 "$sxad_absorbed_skill_modifier$：$learning$"
 sxad_learning_loss_modifier:0 "$sxad_drained_skill_modifier$：$learning$"
 sxad_prowess_gain_modifier:0 "$sxad_absorbed_skill_modifier$：$prowess$"
 sxad_prowess_loss_modifier:0 "$sxad_drained_skill_modifier$：$prowess$"
