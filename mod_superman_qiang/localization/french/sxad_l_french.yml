l_french:
 trait_sxad_sex_experience:0 "Expérience sexuelle"
 trait_sxad_sex_experience_desc:0 "Compte les rapports sexuels explicites capturés après l'activation de Superman Qiang, pour les personnages vivants âgés de 18 ans ou plus. Lorsque leur expérience diffère, le partenaire le plus expérimenté absorbe un point transférable d'une caractéristique de l'autre."
 trait_sxad_sex_experience_character_desc:0 "Expérience sexuelle cumulée depuis l'activation : #V [SCOPE.ScriptValue('sxad_experience_value')|0]#! rapports.\n\n$trait_sxad_sex_experience_desc$"
 sxad_view_experience_interaction:0 "Consulter l'expérience sexuelle"
 sxad_view_experience_interaction_desc:0 "Consulter le nombre cumulé de rapports et les caractéristiques actuelles de [recipient.GetShortUIName] depuis l'activation de Superman Qiang. La consultation ne modifie ni l'expérience ni les caractéristiques."
 sxad_view_experience_interaction_notification:0 "Consulter l'expérience sexuelle"
 sxad_view_experience_interaction_accept_tt:0 "Consulter le registre d'expérience sexuelle de [recipient.GetShortUIName]."
 sxad.1.t:0 "Superman Qiang : Registre d'expérience"
 sxad.1.desc:0 "[scope:sxad_view_subject.GetShortUIName] compte #V [scope:sxad_view_subject.MakeScope.ScriptValue('sxad_experience_value')|0]#! rapports enregistrés depuis l'activation du mod.\n\nCaractéristiques actuelles : Diplomatie [scope:sxad_view_subject.MakeScope.ScriptValue('sxad_diplomacy_value')|0], Martial [scope:sxad_view_subject.MakeScope.ScriptValue('sxad_martial_value')|0], Érudition [scope:sxad_view_subject.MakeScope.ScriptValue('sxad_stewardship_value')|0], Intrigue [scope:sxad_view_subject.MakeScope.ScriptValue('sxad_intrigue_value')|0], Apprentissage [scope:sxad_view_subject.MakeScope.ScriptValue('sxad_learning_value')|0], Vaillance [scope:sxad_view_subject.MakeScope.ScriptValue('sxad_prowess_value')|0].\n\nSeuls les rapports explicites atteignant l'effet partagé vanilla sont comptabilisés. Les rapports passés ne sont pas estimés et la vie maritale routinière n'est pas simulée. Les partenaires connus gagnent chacun un rapport ; les partenaires anonymes n'ajoutent un rapport qu'au personnage connu. Le partenaire ayant la plus grande expérience avant le rapport absorbe, avec une probabilité égale, un point d'une caractéristique transférable sélectionnée uniformément. Une expérience égale n'entraîne aucun transfert."
 sxad.1.a:0 "Compris"
