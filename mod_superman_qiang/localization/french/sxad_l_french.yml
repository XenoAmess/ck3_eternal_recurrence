l_french:
 trait_sxad_sex_experience:0 "Expérience sexuelle"
 trait_sxad_sex_experience_desc:0 "Enregistre le nombre de rapports sexuels explicites capturés par le mod après l'activation de Superman Qiang. Seuls les personnages vivants et âgés de 18 ans ou plus sont comptabilisés. Lorsque les deux partenaires ont une expérience différente, le plus expérimenté prélève 1 point de modificateur d'une compétence transférable de l'autre. Les compétences de base conservent leur valeur d'origine ; les modificateurs en pourcentage et l'arrondi du jeu de base continuent de s'appliquer, et la valeur affichée ne change pas nécessairement d'exactement 1 point."
 trait_sxad_sex_experience_character_desc:0 "Expérience sexuelle cumulée depuis l'activation : #V [SCOPE.ScriptValue('sxad_experience_value')|0]#! rapports.\n\n$trait_sxad_sex_experience_desc$"
 sxad_view_experience_interaction:0 "Consulter l'expérience sexuelle"
 sxad_view_experience_interaction_desc:0 "Consulter le nombre cumulé de rapports et les caractéristiques actuelles de [recipient.GetShortUIName] depuis l'activation de Superman Qiang. La consultation ne modifie ni l'expérience ni les caractéristiques."
 sxad_view_experience_interaction_notification:0 "Consulter l'expérience sexuelle"
 sxad_view_experience_interaction_accept_tt:0 "Consulter le registre d'expérience sexuelle de [recipient.GetShortUIName]."
 sxad.1.t:0 "Superman Qiang : Registre d'expérience"
 sxad.1.desc:0 "[scope:sxad_view_subject.GetShortUIName] a cumulé #V [scope:sxad_view_subject.MakeScope.ScriptValue('sxad_experience_value')|0]#! rapports sexuels depuis l'activation du mod.\n\nCompétences actuelles : Diplomatie [scope:sxad_view_subject.MakeScope.ScriptValue('sxad_diplomacy_value')|0], Martial [scope:sxad_view_subject.MakeScope.ScriptValue('sxad_martial_value')|0], Intendance [scope:sxad_view_subject.MakeScope.ScriptValue('sxad_stewardship_value')|0], Intrigue [scope:sxad_view_subject.MakeScope.ScriptValue('sxad_intrigue_value')|0], Érudition [scope:sxad_view_subject.MakeScope.ScriptValue('sxad_learning_value')|0], Prouesse [scope:sxad_view_subject.MakeScope.ScriptValue('sxad_prowess_value')|0].\n\nModificateurs nets cumulés par ce mod : Diplomatie [scope:sxad_view_subject.MakeScope.ScriptValue('sxad_diplomacy_balance_value')|0], Martial [scope:sxad_view_subject.MakeScope.ScriptValue('sxad_martial_balance_value')|0], Intendance [scope:sxad_view_subject.MakeScope.ScriptValue('sxad_stewardship_balance_value')|0], Intrigue [scope:sxad_view_subject.MakeScope.ScriptValue('sxad_intrigue_balance_value')|0], Érudition [scope:sxad_view_subject.MakeScope.ScriptValue('sxad_learning_balance_value')|0], Prouesse [scope:sxad_view_subject.MakeScope.ScriptValue('sxad_prowess_balance_value')|0].\n\nSeuls les rapports explicites atteignant l'effet partagé vanilla après l'activation du mod sont comptabilisés. Les rapports passés ne sont pas estimés et la vie conjugale quotidienne n'est pas simulée. Les partenaires connus gagnent chacun 1 rapport ; un partenaire anonyme n'ajoute 1 rapport qu'au personnage connu. Le partenaire ayant le plus d'expérience avant le rapport prélève, avec une chance égale, 1 point de modificateur d'une compétence transférable ; une expérience égale n'entraîne aucun transfert. Les compétences de base conservent leur valeur d'origine ; les modificateurs en pourcentage et l'arrondi peuvent faire varier l'affichage autrement que d'exactement 1 point."
 sxad.1.a:0 "Compris"
 sxad_absorbed_skill_modifier:0 "Superman Qiang : Compétence absorbée"
 sxad_drained_skill_modifier:0 "Superman Qiang : Compétence drainée"
 sxad_diplomacy_gain_modifier:0 "$sxad_absorbed_skill_modifier$：$diplomacy$"
 sxad_diplomacy_loss_modifier:0 "$sxad_drained_skill_modifier$：$diplomacy$"
 sxad_martial_gain_modifier:0 "$sxad_absorbed_skill_modifier$：$martial$"
 sxad_martial_loss_modifier:0 "$sxad_drained_skill_modifier$：$martial$"
 sxad_stewardship_gain_modifier:0 "$sxad_absorbed_skill_modifier$：$stewardship$"
 sxad_stewardship_loss_modifier:0 "$sxad_drained_skill_modifier$：$stewardship$"
 sxad_intrigue_gain_modifier:0 "$sxad_absorbed_skill_modifier$：$intrigue$"
 sxad_intrigue_loss_modifier:0 "$sxad_drained_skill_modifier$：$intrigue$"
 sxad_learning_gain_modifier:0 "$sxad_absorbed_skill_modifier$：$learning$"
 sxad_learning_loss_modifier:0 "$sxad_drained_skill_modifier$：$learning$"
 sxad_prowess_gain_modifier:0 "$sxad_absorbed_skill_modifier$：$prowess$"
 sxad_prowess_loss_modifier:0 "$sxad_drained_skill_modifier$：$prowess$"
