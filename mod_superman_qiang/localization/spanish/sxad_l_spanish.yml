l_spanish:
 trait_sxad_sex_experience:0 "Experiencia sexual"
 trait_sxad_sex_experience_desc:0 "Cuenta los encuentros sexuales explícitos capturados tras activar Superman Qiang, solo para personajes vivos de 18 años o más. Cuando su experiencia difiere, el más experimentado toma un punto de habilidad transferible del otro."
 trait_sxad_sex_experience_character_desc:0 "Experiencia sexual acumulada tras la activación: #V [SCOPE.ScriptValue('sxad_experience_value')|0]#! encuentros.\n\n$trait_sxad_sex_experience_desc$"
 sxad_view_experience_interaction:0 "Ver experiencia sexual"
 sxad_view_experience_interaction_desc:0 "Consulta los encuentros acumulados y las habilidades actuales de [recipient.GetShortUIName] tras activar Superman Qiang. La consulta no modifica la experiencia ni las habilidades."
 sxad_view_experience_interaction_notification:0 "Ver experiencia sexual"
 sxad_view_experience_interaction_accept_tt:0 "Consulta el registro de experiencia sexual de [recipient.GetShortUIName]."
 sxad.1.t:0 "Superman Qiang: Registro de experiencia"
 sxad.1.desc:0 "[scope:sxad_view_subject.GetShortUIName] acumula #V [scope:sxad_view_subject.MakeScope.ScriptValue('sxad_experience_value')|0]#! encuentros desde que activó el mod.\n\nHabilidades actuales: Diplomacia [scope:sxad_view_subject.MakeScope.ScriptValue('sxad_diplomacy_value')|0], Militar [scope:sxad_view_subject.MakeScope.ScriptValue('sxad_martial_value')|0], Administración [scope:sxad_view_subject.MakeScope.ScriptValue('sxad_stewardship_value')|0], Intriga [scope:sxad_view_subject.MakeScope.ScriptValue('sxad_intrigue_value')|0], Erudición [scope:sxad_view_subject.MakeScope.ScriptValue('sxad_learning_value')|0], Prowess [scope:sxad_view_subject.MakeScope.ScriptValue('sxad_prowess_value')|0].\n\nSolo se contabilizan los encuentros explícitos que alcanzan el efecto compartido del juego base. No se estiman encuentros pasados ni se simula la vida marital rutinaria. Las parejas conocidas suman un encuentro cada una; los anónimos solo suman uno al personaje conocido. Antes del acto, el participante con más experiencia absorbe al azar un punto de una habilidad transferible; si la experiencia es igual, no hay transferencia."
 sxad.1.a:0 "Entendido"
