l_spanish:
 trait_sxad_sex_experience:0 "Experiencia sexual"
 trait_sxad_sex_experience_desc:0 "Registra las relaciones sexuales explícitas capturadas por el mod tras activar «Superman Qiang». Solo se cuentan personajes vivos de 18 años o más. Cuando su experiencia difiere, el más experto toma 1 punto de modificador de un atributo transferible del otro. Los atributos base mantienen su valor original; los modificadores porcentuales y el redondeo vanilla siguen aplicándose, por lo que el total mostrado puede no variar exactamente 1 punto."
 trait_sxad_sex_experience_character_desc:0 "Experiencia sexual acumulada tras la activación: #V [SCOPE.ScriptValue('sxad_experience_value')|0]#! encuentros.\n\n$trait_sxad_sex_experience_desc$"
 sxad_view_experience_interaction:0 "Ver experiencia sexual"
 sxad_view_experience_interaction_desc:0 "Consulta los encuentros acumulados y las habilidades actuales de [recipient.GetShortUIName] tras activar Superman Qiang. La consulta no modifica la experiencia ni las habilidades."
 sxad_view_experience_interaction_notification:0 "Ver experiencia sexual"
 sxad_view_experience_interaction_accept_tt:0 "Consulta el registro de experiencia sexual de [recipient.GetShortUIName]."
 sxad.1.t:0 "Superman Qiang: Registro de experiencia"
 sxad.1.desc:0 "[sxad_view_subject.GetShortUIName] lleva #V [sxad_view_subject.MakeScope.ScriptValue('sxad_experience_value')|0]#! encuentros registrados desde la activación del mod.\n\nAtributos actuales: Diplomacia [sxad_view_subject.MakeScope.ScriptValue('sxad_diplomacy_value')|0], Marcial [sxad_view_subject.MakeScope.ScriptValue('sxad_martial_value')|0], Administración [sxad_view_subject.MakeScope.ScriptValue('sxad_stewardship_value')|0], Intriga [sxad_view_subject.MakeScope.ScriptValue('sxad_intrigue_value')|0], Erudición [sxad_view_subject.MakeScope.ScriptValue('sxad_learning_value')|0], Proeza [sxad_view_subject.MakeScope.ScriptValue('sxad_prowess_value')|0].\n\nModificadores netos acumulados por este mod: Diplomacia [sxad_view_subject.MakeScope.ScriptValue('sxad_diplomacy_balance_value')|0], Marcial [sxad_view_subject.MakeScope.ScriptValue('sxad_martial_balance_value')|0], Administración [sxad_view_subject.MakeScope.ScriptValue('sxad_stewardship_balance_value')|0], Intriga [sxad_view_subject.MakeScope.ScriptValue('sxad_intrigue_balance_value')|0], Erudición [sxad_view_subject.MakeScope.ScriptValue('sxad_learning_balance_value')|0], Proeza [sxad_view_subject.MakeScope.ScriptValue('sxad_prowess_balance_value')|0].\n\nSolo se cuentan los encuentros explícitos que alcanzan el efecto compartido vanilla tras activar el mod; no se estiman experiencias pasadas ni se simula la vida marital rutinaria. Las parejas conocidas suman 1 encuentro cada una; las anónimas solo suman 1 al personaje conocido. Antes del acto, quien tenga más experiencia absorbe con probabilidad uniforme 1 punto de modificador de un atributo transferible; con experiencia igual no hay transferencia. Los atributos base conservan su valor original; los porcentajes y el redondeo pueden hacer que el cambio mostrado difiera de 1 punto."
 sxad.1.a:0 "Entendido"
 sxad_absorbed_skill_modifier:0 "Superman Qiang: Atributo absorbido"
 sxad_drained_skill_modifier:0 "Superman Qiang: Atributo drenado"
 sxad_diplomacy_gain_modifier:0 "$sxad_absorbed_skill_modifier$：$diplomacy$"
 sxad_diplomacy_loss_modifier:0 "$sxad_drained_skill_modifier$：$diplomacy$"
 sxad_martial_gain_modifier:0 "$sxad_absorbed_skill_modifier$：$martial$"
 sxad_martial_loss_modifier:0 "$sxad_drained_skill_modifier$：$martial$"
 sxad_stewardship_gain_modifier:0 "$sxad_absorbed_skill_modifier$：$stewardship$"
 sxad_stewardship_loss_modifier:0 "$sxad_drained_skill_modifier$：$stewardship$"
 sxad_intrigue_gain_modifier:0 "$sxad_absorbed_skill_modifier$：$intrigue$"
 sxad_intrigue_loss_modifier:0 "$sxad_drained_skill_modifier$：$intrigue$"
 sxad_learning_gain_modifier:0 "$sxad_absorbed_skill_modifier$：$learning$"
 sxad_learning_loss_modifier:0 "$sxad_drained_skill_modifier$：$learning$"
 sxad_prowess_gain_modifier:0 "$sxad_absorbed_skill_modifier$：$prowess$"
 sxad_prowess_loss_modifier:0 "$sxad_drained_skill_modifier$：$prowess$"
