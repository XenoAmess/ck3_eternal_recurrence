l_german:
 trait_sxad_sex_experience:0 "Sexuelle Erfahrung"
 trait_sxad_sex_experience_desc:0 "Erfasst explizite sexuelle Begegnungen nach Aktivierung von Superman Qiang für lebende Charaktere ab 18 Jahren. Unterscheiden sich die Erfahrungen der beiden, entzieht die erfahrenere Person dem anderen einen übertragbaren Eigenschafts-Modifikatorpunkt. Die Basiswerte der Eigenschaften bleiben unverändert; die prozentualen Vanilla-Modifikatoren und Rundungen gelten weiterhin, sodass der angezeigte Gesamtwert nicht zwangsläufig um genau einen Punkt steigt oder sinkt."
 trait_sxad_sex_experience_character_desc:0 "Aufgezeichnete sexuelle Erfahrung: #V [SCOPE.ScriptValue('sxad_experience_value')|0]#! Begegnungen.\n\n$trait_sxad_sex_experience_desc$"
 sxad_view_experience_interaction:0 "Sexuelle Erfahrung anzeigen"
 sxad_view_experience_interaction_desc:0 "Zeigt [recipient.GetShortUIName]s aufgezeichnete Begegnungen und aktuellen Fertigkeiten seit Aktivierung von Superman Qiang. Das Anzeigen verändert weder Erfahrung noch Fertigkeiten."
 sxad_view_experience_interaction_notification:0 "Sexuelle Erfahrung anzeigen"
 sxad_view_experience_interaction_accept_tt:0 "[recipient.GetShortUIName]s Aufzeichnung der sexuellen Erfahrung anzeigen."
 sxad.1.t:0 "Superman Qiang: Erfahrungsaufzeichnung"
 sxad.1.desc:0 "[sxad_view_subject.GetShortUIName] hat seit Aktivierung des Mods #V [sxad_view_subject.MakeScope.ScriptValue('sxad_experience_value')|0]#! erfasste Begegnungen.\n\nAktuelle Eigenschaften: Diplomatie [sxad_view_subject.MakeScope.ScriptValue('sxad_diplomacy_value')|0], Kriegskunst [sxad_view_subject.MakeScope.ScriptValue('sxad_martial_value')|0], Verwaltung [sxad_view_subject.MakeScope.ScriptValue('sxad_stewardship_value')|0], Intrige [sxad_view_subject.MakeScope.ScriptValue('sxad_intrigue_value')|0], Bildung [sxad_view_subject.MakeScope.ScriptValue('sxad_learning_value')|0], Kampfkraft [sxad_view_subject.MakeScope.ScriptValue('sxad_prowess_value')|0].\n\nDurch diesen Mod akkumulierte Netto-Modifikatoren: Diplomatie [sxad_view_subject.MakeScope.ScriptValue('sxad_diplomacy_balance_value')|0], Kriegskunst [sxad_view_subject.MakeScope.ScriptValue('sxad_martial_balance_value')|0], Verwaltung [sxad_view_subject.MakeScope.ScriptValue('sxad_stewardship_balance_value')|0], Intrige [sxad_view_subject.MakeScope.ScriptValue('sxad_intrigue_balance_value')|0], Bildung [sxad_view_subject.MakeScope.ScriptValue('sxad_learning_balance_value')|0], Kampfkraft [sxad_view_subject.MakeScope.ScriptValue('sxad_prowess_balance_value')|0].\n\nNur explizite Begegnungen gezählt, die den gemeinsamen Vanilla-Effekt tatsächlich auslösen. Frühere Begegnungen werden nicht geschätzt und das gewöhnliche Eheleben wird nicht simuliert. Bekannte Partner erhalten je eine Begegnung; anonyme Partner zählen nur eine Begegnung für den bekannten Charakter. Der Partner mit höherer Erfahrung vor der Begegnung entzieht mit gleicher Wahrscheinlichkeit einer ausgewählten übertragbaren Eigenschaft einen Modifikatorpunkt. Bei gleicher Erfahrung erfolgt kein Transfer. Die Basiswerte der Eigenschaften bleiben unverändert; prozentuale Modifikatoren und Rundungen können dazu führen, dass die angezeigte Änderung nicht genau einem Punkt entspricht."
 sxad.1.a:0 "Verstanden"
 sxad_absorbed_skill_modifier:0 "Superman Qiang: absorbierte Eigenschaft"
 sxad_drained_skill_modifier:0 "Superman Qiang: verlorene Eigenschaft"
 sxad_diplomacy_gain_modifier:0 "$sxad_absorbed_skill_modifier$：$diplomacy$"
 sxad_diplomacy_loss_modifier:0 "$sxad_drained_skill_modifier$：$diplomacy$"
 sxad_martial_gain_modifier:0 "$sxad_absorbed_skill_modifier$：$martial$"
 sxad_martial_loss_modifier:0 "$sxad_drained_skill_modifier$：$martial$"
 sxad_stewardship_gain_modifier:0 "$sxad_absorbed_skill_modifier$：$stewardship$"
 sxad_stewardship_loss_modifier:0 "$sxad_drained_skill_modifier$：$stewardship$"
 sxad_intrigue_gain_modifier:0 "$sxad_absorbed_skill_modifier$：$intrigue$"
 sxad_intrigue_loss_modifier:0 "$sxad_drained_skill_modifier$：$intrigue$"
 sxad_learning_gain_modifier:0 "$sxad_absorbed_skill_modifier$：$learning$"
 sxad_learning_loss_modifier:0 "$sxad_drained_skill_modifier$：$learning$"
 sxad_prowess_gain_modifier:0 "$sxad_absorbed_skill_modifier$：$prowess$"
 sxad_prowess_loss_modifier:0 "$sxad_drained_skill_modifier$：$prowess$"
