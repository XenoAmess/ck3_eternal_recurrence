l_korean:
 trait_sxad_sex_experience:0 "성 경험"
 trait_sxad_sex_experience_desc:0 "启用《超人强》后，模组所记录的明确性行为次数。仅统计在世且年满18岁的角色。当双方经验不同时，经验较高者从对方一项可转移属性中吸取1点修正。基础属性保持原值；原版百分比修正与取整依然生效，因此面板显示的数值不保证每次恰好变化1点。"
 trait_sxad_sex_experience_character_desc:0 "启用 후 누적 성 경험: #V [SCOPE.ScriptValue('sxad_experience_value')|0]#! 회.\n\n$trait_sxad_sex_experience_desc$"
 sxad_view_experience_interaction:0 "성 경험 보기"
 sxad_view_experience_interaction_desc:0 "[recipient.GetShortUIName]의 《超人强》启用 후 누적 횟수와 현재 속성을 확인합니다. 확인만으로는 경험치나 속성이 변하지 않습니다."
 sxad_view_experience_interaction_notification:0 "성 경험 보기"
 sxad_view_experience_interaction_accept_tt:0 "[recipient.GetShortUIName]의 성 경험 기록을 확인합니다."
 sxad.1.t:0 "超人强: 성 경험 기록"
 sxad.1.desc:0 "[sxad_view_subject.GetShortUIName]启用模组后累计的性经验为 #V [sxad_view_subject.MakeScope.ScriptValue('sxad_experience_value')|0]#! 次。\n\n当前属性：外交 [sxad_view_subject.MakeScope.ScriptValue('sxad_diplomacy_value')|0]，军事 [sxad_view_subject.MakeScope.ScriptValue('sxad_martial_value')|0]，管理 [sxad_view_subject.MakeScope.ScriptValue('sxad_stewardship_value')|0]，谋略 [sxad_view_subject.MakeScope.ScriptValue('sxad_intrigue_value')|0]，学识 [sxad_view_subject.MakeScope.ScriptValue('sxad_learning_value')|0]，勇武 [sxad_view_subject.MakeScope.ScriptValue('sxad_prowess_value')|0]。\n\n本模组累计净修正：外交 [sxad_view_subject.MakeScope.ScriptValue('sxad_diplomacy_balance_value')|0]，军事 [sxad_view_subject.MakeScope.ScriptValue('sxad_martial_balance_value')|0]，管理 [sxad_view_subject.MakeScope.ScriptValue('sxad_stewardship_balance_value')|0]，谋略 [sxad_view_subject.MakeScope.ScriptValue('sxad_intrigue_balance_value')|0]，学识 [sxad_view_subject.MakeScope.ScriptValue('sxad_learning_balance_value')|0]，勇武 [sxad_view_subject.MakeScope.ScriptValue('sxad_prowess_balance_value')|0]。\n\n仅记录模组启用后、确实进入原版统一效果的明确性行为；不推算过往经历，也不模拟日常夫妻生活。已知双方各计1次；匿名对象仅为已知方计1次。行为前经验较高者等概率从一项可转移属性中吸取1点修正；经验相等时不发生吸取。基础属性保持原值；百分比修正与取整可能使面板变化并非恰好1点。"
 sxad.1.a:0 "알겠습니다"
 sxad_absorbed_skill_modifier:0 "超人强：吸收属性"
 sxad_drained_skill_modifier:0 "超人强：流失属性"
 sxad_diplomacy_gain_modifier:0 "$sxad_absorbed_skill_modifier$：$diplomacy$"
 sxad_diplomacy_loss_modifier:0 "$sxad_drained_skill_modifier$：$diplomacy$"
 sxad_martial_gain_modifier:0 "$sxad_absorbed_skill_modifier$：$martial$"
 sxad_martial_loss_modifier:0 "$sxad_drained_skill_modifier$：$martial$"
 sxad_stewardship_gain_modifier:0 "$sxad_absorbed_skill_modifier$：$stewardship$"
 sxad_stewardship_loss_modifier:0 "$sxad_drained_skill_modifier$：$stewardship$"
 sxad_intrigue_gain_modifier:0 "$sxad_absorbed_skill_modifier$：$intrigue$"
 sxad_intrigue_loss_modifier:0 "$sxad_drained_skill_modifier$：$intrigue$"
 sxad_learning_gain_modifier:0 "$sxad_absorbed_skill_modifier$：$learning$"
 sxad_learning_loss_modifier:0 "$sxad_drained_skill_modifier$：$learning$"
 sxad_prowess_gain_modifier:0 "$sxad_absorbed_skill_modifier$：$prowess$"
 sxad_prowess_loss_modifier:0 "$sxad_drained_skill_modifier$：$prowess$"
