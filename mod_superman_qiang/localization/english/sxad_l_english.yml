 sxad.1.desc:0 "[sxad_view_subject.GetShortUIName] has #V [sxad_view_subject.MakeScope.ScriptValue('sxad_experience_value')|0]#! recorded encounters since enabling the mod.\n\nCurrent skills: Diplomacy [sxad_view_subject.MakeScope.ScriptValue('sxad_diplomacy_value')|0], Martial [sxad_view_subject.MakeScope.ScriptValue('sxad_martial_value')|0], Stewardship [sxad_view_subject.MakeScope.ScriptValue('sxad_stewardship_value')|0], Intrigue [sxad_view_subject.MakeScope.ScriptValue('sxad_intrigue_value')|0], Learning [sxad_view_subject.MakeScope.ScriptValue('sxad_learning_value')|0], Prowess [sxad_view_subject.MakeScope.ScriptValue('sxad_prowess_value')|0].\n\nNet modifiers accumulated by this mod: Diplomacy [sxad_view_subject.MakeScope.ScriptValue('sxad_diplomacy_balance_value')|0], Martial [sxad_view_subject.MakeScope.ScriptValue('sxad_martial_balance_value')|0], Stewardship [sxad_view_subject.MakeScope.ScriptValue('sxad_stewardship_balance_value')|0], Intrigue [sxad_view_subject.MakeScope.ScriptValue('sxad_intrigue_balance_value')|0], Learning [sxad_view_subject.MakeScope.ScriptValue('sxad_learning_balance_value')|0], Prowess [sxad_view_subject.MakeScope.ScriptValue('sxad_prowess_balance_value')|0].\n\nOnly explicit encounters reaching the vanilla shared effect are counted. Past encounters are not estimated and routine married life is not simulated. Known partners each gain one encounter; anonymous partners add one only to the known character. The partner with more experience before the encounter takes one modifier point from a uniformly selected transferable skill. Equal experience causes no transfer. Base skills retain their original values; percentages and rounding can make the displayed change differ from one point."
 sxad.1.a:0 "Understood"
