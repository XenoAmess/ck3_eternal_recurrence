l_polish:
 trait_sxad_sex_experience:0 "Doświadczenie seksualne"
 trait_sxad_sex_experience_desc:0 "Zlicza jawne stosunki seksualne zarejestrowane po włączeniu Superman Qiang, wyłącznie dla żyjących postaci w wieku 18 lat lub starszych. Gdy doświadczenie partnerów się różni, bardziej doświadczony pobiera 1 punkt modyfikatora z jednej umiejętności podlegającej transferowi. Podstawowe umiejętności zachowują swoje pierwotne wartości; waniliowe modyfikatory procentowe i zaokrąglenia nadal obowiązują, więc wyświetlana wartość niekoniecznie zmieni się o dokładnie 1 punkt."
 trait_sxad_sex_experience_character_desc:0 "Łączne doświadczenie seksualne od włączenia: #V [SCOPE.ScriptValue('sxad_experience_value')|0]#! razy.\n\n$trait_sxad_sex_experience_desc$"
 sxad_view_experience_interaction:0 "Wyświetl doświadczenie seksualne"
 sxad_view_experience_interaction_desc:0 "Wyświetla liczbę zarejestrowanych spotkań i bieżące atrybuty [recipient.GetShortUIName] od włączenia Supermana Qianga. Wyświetlanie nie zmienia doświadczenia ani atrybutów."
 sxad_view_experience_interaction_notification:0 "Wyświetl doświadczenie seksualne"
 sxad_view_experience_interaction_accept_tt:0 "Wyświetl zapis doświadczenia seksualnego [recipient.GetShortUIName]."
 sxad.1.t:0 "Superman Qiang: zapis doświadczenia"
 sxad.1.desc:0 "[scope:sxad_view_subject.GetShortUIName] ma #V [scope:sxad_view_subject.MakeScope.ScriptValue('sxad_experience_value')|0]#! zarejestrowanych spotkań od włączenia moda.\n\nBieżące umiejętności: Dyplomacja [scope:sxad_view_subject.MakeScope.ScriptValue('sxad_diplomacy_value')|0], Wojskowość [scope:sxad_view_subject.MakeScope.ScriptValue('sxad_martial_value')|0], Gospodarność [scope:sxad_view_subject.MakeScope.ScriptValue('sxad_stewardship_value')|0], Intryga [scope:sxad_view_subject.MakeScope.ScriptValue('sxad_intrigue_value')|0], Wiedza [scope:sxad_view_subject.MakeScope.ScriptValue('sxad_learning_value')|0], Waleczność [scope:sxad_view_subject.MakeScope.ScriptValue('sxad_prowess_value')|0].\n\nModyfikatory netto zgromadzone przez ten mod: Dyplomacja [scope:sxad_view_subject.MakeScope.ScriptValue('sxad_diplomacy_balance_value')|0], Wojskowość [scope:sxad_view_subject.MakeScope.ScriptValue('sxad_martial_balance_value')|0], Gospodarność [scope:sxad_view_subject.MakeScope.ScriptValue('sxad_stewardship_balance_value')|0], Intryga [scope:sxad_view_subject.MakeScope.ScriptValue('sxad_intrigue_balance_value')|0], Wiedza [scope:sxad_view_subject.MakeScope.ScriptValue('sxad_learning_balance_value')|0], Waleczność [scope:sxad_view_subject.MakeScope.ScriptValue('sxad_prowess_balance_value')|0].\n\nLiczone są wyłącznie jawne spotkania, które aktywowały waniliowy wspólny efekt. Przeszłe spotkania nie są szacowane, a rutynowe pożycie małżeńskie nie jest symulowane. Znani partnerzy zyskują po 1 spotkaniu; anonimowi partnerzy dodają 1 tylko znanemu partnerowi. Partner z większym doświadczeniem przed spotkaniem pobiera 1 punkt modyfikatora z losowo wybranej umiejętności podlegającej transferowi. Równe doświadczenie oznacza brak transferu. Podstawowe umiejętności zachowują swoje pierwotne wartości; procenty i zaokrąglenia mogą sprawić, że wyświetlana zmiana różni się od 1 punktu."
 sxad.1.a:0 "Rozumiem"
 sxad_absorbed_skill_modifier:0 "Superman Qiang: Pochłonięta umiejętność"
 sxad_drained_skill_modifier:0 "Superman Qiang: Utracona umiejętność"
 sxad_diplomacy_gain_modifier:0 "$sxad_absorbed_skill_modifier$：$diplomacy$"
 sxad_diplomacy_loss_modifier:0 "$sxad_drained_skill_modifier$：$diplomacy$"
 sxad_martial_gain_modifier:0 "$sxad_absorbed_skill_modifier$：$martial$"
 sxad_martial_loss_modifier:0 "$sxad_drained_skill_modifier$：$martial$"
 sxad_stewardship_gain_modifier:0 "$sxad_absorbed_skill_modifier$：$stewardship$"
 sxad_stewardship_loss_modifier:0 "$sxad_drained_skill_modifier$：$stewardship$"
 sxad_intrigue_gain_modifier:0 "$sxad_absorbed_skill_modifier$：$intrigue$"
 sxad_intrigue_loss_modifier:0 "$sxad_drained_skill_modifier$：$intrigue$"
 sxad_learning_gain_modifier:0 "$sxad_absorbed_skill_modifier$：$learning$"
 sxad_learning_loss_modifier:0 "$sxad_drained_skill_modifier$：$learning$"
 sxad_prowess_gain_modifier:0 "$sxad_absorbed_skill_modifier$：$prowess$"
 sxad_prowess_loss_modifier:0 "$sxad_drained_skill_modifier$：$prowess$"
