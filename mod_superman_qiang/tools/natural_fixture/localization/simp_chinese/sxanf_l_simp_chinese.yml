 sxanf_baseline_title:0 "外置测试：月度模拟基线"
 sxanf_baseline_desc:0 "这不是产品界面。请先核对新建测试角色、婚姻/妾关系、实际孕中和不育状态及全部经验为零，保存独立基线并读回人物引用；然后只选择一次开始。日志标记不能替代保存证据。"
 sxanf_begin:0 "已保存并核对基线，开始同月测试"
 sxanf_month_title:0 "外置测试：同月检查结束"
 sxanf_month_desc:0 "请保留本阶段日志、角色经验和双向月度名单，并保存检查点。下一项将真实等待一个月再加两天；这段期间需要正常推进游戏。原生信仰回调观察与显式事件调用分别记录。"
 sxanf_advance_month:0 "开始真实跨月等待"
 sxanf_done_title:0 "外置测试：请保存并冷重载"
 sxanf_done_desc:0 "请保存最终检查点并独立核对经验、月份和伙伴名单。正常关闭游戏，用同一产品及夹具定义加载该保存；不重跑基线，不推进日期，重新保存并比对全部测试角色字段。未实际执行的冷重载仍是未完成。"
 sxanf_close:0 "保留窗口并进行保存取证"
