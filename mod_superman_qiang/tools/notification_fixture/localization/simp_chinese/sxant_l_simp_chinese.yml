l_simp_chinese:
 sxant_baseline_title:0 "专项夹具：通知基线"
 sxant_baseline_desc:0 "这是外置排查夹具。头像所示角色是全部分支的同一个对象。先经原生界面关注该角色并读回关注状态，清空准备阶段消息，再在选择分支前保存共同基线。每个格子均重新读取同一基线；此处尚未测得任何通知结果。"
 sxant_repetitions_title:0 "专项夹具：选择执行次数"
 sxant_repetitions_desc:0 "只选择一个次数。本次仅执行该格子的动作，随后停在死亡探针之前。下一格必须重载共同基线，不能在同一局中连续跑多个格子。"
 sxant_probe_ready_title:0 "专项夹具：动作完成，等待通知探针"
 sxant_probe_ready_desc:0 "此刻先保存真实双方身份、格子变量、经验、修正和动作阶段消息。清空现有消息并冻结探针前消息清单，再选择下项。该选项仅让同一对象自然死亡一次，用于观察原版角色死亡消息；死亡状态或夹具标记不证明消息次数，也不证明漏洞已修复。下一格必须重载共同基线。"
 sxant_probe_begin:0 "已取证，执行一次原版死亡探针"
 sxant_confirmation_title:0 "专项夹具：确认一次结算"
 sxant_confirmation_desc_1:0 "第1次结算，共5次。先读取本窗口实际事件实例和新的原生revision，留存真实双方身份，再仅确认一次本项。打开本事件不会调用性行为hook；选择本项才调用一次，并创建下一个可见事件。这是独立结算实例，不是完整勾引scheme。"
 sxant_confirmation_desc_2:0 "第2次结算，共5次。先核实实际调用计数为1，读取本次新事件实例和新的原生revision，再仅确认一次本项。提交结果未知时先读回，不得重复提交。"
 sxant_confirmation_desc_3:0 "第3次结算，共5次。先核实实际调用计数为2，读取本次新事件实例和新的原生revision，再仅确认一次本项。这仍是排查用结算，不是完整勾引scheme。"
 sxant_confirmation_desc_4:0 "第4次结算，共5次。先核实实际调用计数为3，读取本次新事件实例和新的原生revision，再仅确认一次本项。双方真实角色身份必须与本格基线一致。"
 sxant_confirmation_desc_5:0 "第5次结算，共5次。先核实实际调用计数为4，读取本次新事件实例和新的原生revision。本项仅调用一次hook，记录计数5后才完成动作阶段。随后的死亡探针窗口还须单独确认。"
 sxant_confirm_one_invocation:0 "仅确认本事件的一次hook调用"
 sxant_mode_1:0 "原版配对效果对照（无 SXAD 插入）"
 sxant_mode_2:0 "生产配对 hook：相等经验"
 sxant_mode_3:0 "生产配对 hook：不等经验"
 sxant_mode_4:0 "生产匿名 hook：仅已知对象"
 sxant_mode_5:0 "只调用 pair helper：相等经验"
 sxant_mode_6:0 "只调用 pair helper：不等经验"
 sxant_mode_7:0 "只调用计数与特质 helper"
 sxant_mode_8:0 "只重建对象的固定外交修正"
 sxant_n_0:0 "执行 0 次动作"
 sxant_n_1:0 "执行 1 次动作"
 sxant_n_2:0 "执行 2 次动作"
 sxant_n_5:0 "执行 5 次动作"

