 sxant_baseline_title:0 "Diagnosis fixture: notification baseline"
 sxant_baseline_desc:0 "This is an external investigation fixture. The portrait is the one target used by every branch. Pin this character through the native UI, read back the pinned state, drain setup messages, and save a baseline BEFORE choosing a branch. Reload that same save for each cell. No notification result has been measured."
 sxant_repetitions_title:0 "Diagnosis fixture: choose repetitions"
 sxant_repetitions_desc:0 "Choose one repetition count. This runs only that cell and then stops before the death probe. Never run two cells sequentially; reload the saved common baseline for the next cell."
 sxant_probe_ready_title:0 "Diagnosis fixture: actions completed, probe pending"
 sxant_probe_ready_desc:0 "Save the real actor/target identities, case variables, experience, modifiers, and any action messages now. Drain existing messages and freeze the pre-probe inventory. Continue only when ready: the next option makes the same target die naturally once, to observe original character death messages. A dead target or this event marker does not prove message count or a bug fix. Reload the common baseline before any other cell."
 sxant_probe_begin:0 "Record the baseline, then trigger the original death probe once"
