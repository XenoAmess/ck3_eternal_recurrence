l_english:
 sxant_baseline_title:0 "Diagnosis fixture: notification baseline"
 sxant_baseline_desc:0 "This is an external investigation fixture. The portrait is the one target used by every branch. Pin this character through the native UI, read back the pinned state, drain setup messages, and save a baseline BEFORE choosing a branch. Reload that same save for each cell. No notification result has been measured."
 sxant_repetitions_title:0 "Diagnosis fixture: choose repetitions"
 sxant_repetitions_desc:0 "Choose one repetition count. This runs only that cell and then stops before the death probe. Never run two cells sequentially; reload the saved common baseline for the next cell."
 sxant_probe_ready_title:0 "Diagnosis fixture: actions completed, probe pending"
 sxant_probe_ready_desc:0 "Save the real actor/target identities, case variables, experience, modifiers, and any action messages now. Drain existing messages and freeze the pre-probe inventory. Continue only when ready: the next option makes the same target die naturally once, to observe original character death messages. A dead target or this event marker does not prove message count or a bug fix. Reload the common baseline before any other cell."
 sxant_probe_begin:0 "Record the baseline, then trigger the original death probe once"
 sxant_confirmation_title:0 "Diagnosis fixture: confirm one settlement"
 sxant_confirmation_desc_1:0 "Settlement 1 of 5. Read this actual event instance and a fresh native revision, retain the actor/target identities, then confirm its one option once. Opening this event performs no sex hook. The option invokes the hook once and opens a new visible event. These are separate settlement instances, not complete seduction schemes."
 sxant_confirmation_desc_2:0 "Settlement 2 of 5. Verify the actual invocation counter is 1 and read this new event instance with a fresh native revision. Confirm the one option once. An unknown result must be read back before any further action."
 sxant_confirmation_desc_3:0 "Settlement 3 of 5. Verify the actual invocation counter is 2 and read this new event instance with a fresh native revision. Confirm the one option once. This is still a diagnostic settlement, not a complete seduction scheme."
 sxant_confirmation_desc_4:0 "Settlement 4 of 5. Verify the actual invocation counter is 3 and read this new event instance with a fresh native revision. Confirm the one option once. Keep the same actual actor and target identities."
 sxant_confirmation_desc_5:0 "Settlement 5 of 5. Verify the actual invocation counter is 4 and read this new event instance with a fresh native revision. This one option invokes the hook once, records counter 5, and completes the action stage. The following death-probe event requires a separate confirmation."
 sxant_confirm_one_invocation:0 "Confirm this event's single hook invocation once"
 sxant_mode_1:0 "vanilla-pair"
 sxant_mode_2:0 "hook-equal"
 sxant_mode_3:0 "hook-unequal"
 sxant_mode_4:0 "hook-unknown"
 sxant_mode_5:0 "helper-equal"
 sxant_mode_6:0 "helper-unequal"
 sxant_mode_7:0 "counter-only"
 sxant_mode_8:0 "modifier-rebuild"
 sxant_n_0:0 "Run 0 action(s)"
 sxant_n_1:0 "Run 1 action(s)"
 sxant_n_2:0 "Run 2 action(s)"
 sxant_n_5:0 "Run 5 action(s)"

