l_english:
 des_acceptance_original_rite_input_readback_decision: "Test: Observe the original clerical puppet input"
 des_acceptance_original_rite_input_readback_decision_desc: "Read the current Court Chaplain, theological puppet, reverse puppeteer and original scripted Rite eligibility. This observation does not submit an interaction or prove the full native draft Can."
 des_acceptance_original_rite_input_readback_decision_confirm: "Observe the actual original relationship"
 des_acceptance_original_rite_input_readback_decision_tooltip: "Readback only; no priest assignment, puppet creation, interaction acceptance or payment."
 des_acceptance_capture_created_decision: "Test: Observe the Rite actually created through its UI"
 des_acceptance_capture_created_decision_desc: "After creating the dynastic Rite through the original window, record its actual identity and convert three prepared controls. This test does not create or edit a Rite. Wait one natural day for the readback."
 des_acceptance_capture_created_decision_confirm: "Record and convert controls"
 des_acceptance_capture_created_decision_tooltip: "Test preparation and delayed native predicate readback."
 des_acceptance_same_faith_decision: "Test: Send one control to the original Rite"
 des_acceptance_same_faith_decision_desc: "Change the target to the saved original Rite, leaving its Dynasty untouched. The product must detect same-Faith apostasy. Wait one natural day, then inspect opinion and punishment previews."
 des_acceptance_same_faith_decision_confirm: "Change the target's Rite"
 des_acceptance_same_faith_decision_tooltip: "Apostasy input only; no trait, opinion or crime reason is added by the test."
 des_acceptance_cross_faith_decision: "Test: Send the target to Orthodox Christianity"
 des_acceptance_cross_faith_decision_desc: "Change the target's Faith and Rite to Orthodox and Byzantine while leaving its Dynasty untouched. Wait one natural day for the product readback."
 des_acceptance_cross_faith_decision_confirm: "Change the target's Faith"
 des_acceptance_cross_faith_decision_tooltip: "Test cross-Faith apostasy without setting product state."
 des_acceptance_repent_decision: "Test: Return the target to the created Rite"
 des_acceptance_repent_decision_desc: "Restore the target's actual Faith and Rite to the player's created Rite. Wait one natural day; the product must remove its own apostasy state and relationship."
 des_acceptance_repent_decision_confirm: "Return the target"
 des_acceptance_repent_decision_tooltip: "Repentance input; no product cleanup effect is called by the test."
 des_acceptance_closed_readback_decision: "Test: Observe the disabled setting"
 des_acceptance_closed_readback_decision_desc: "First use the original Edit Rite window to choose None and confirm. This test only observes retained identities and cleared product state."
 des_acceptance_closed_readback_decision_confirm: "Observe actual disabled state"
 des_acceptance_closed_readback_decision_tooltip: "No doctrine is edited by this test."
 des_acceptance_reopened_readback_decision: "Test: Observe the re-enabled setting"
 des_acceptance_reopened_readback_decision_desc: "First use the original Edit Rite window to enable Dynastic again and confirm. This test verifies that the original Dynasty was reused."
 des_acceptance_reopened_readback_decision_confirm: "Observe actual re-enabled state"
 des_acceptance_reopened_readback_decision_tooltip: "Read the actual two-way Rite/Dynasty binding."
