l_english:
 des_acceptance_extended_start_decision: "[TEST] Prepare birth, cadet house and House drift"
 des_acceptance_extended_start_decision_desc: "Convert the already-pregnant prepared parents to the primary rite, create a native cadet house, move one believer to an outsider House, and generate one new believer. Observe the next-day and 31-day readbacks. The separate pre-existing Orthodox descendant is only observed."
 des_acceptance_extended_start_decision_confirm: "Perform this disclosed test step"
 des_acceptance_extended_start_decision_tooltip: "Test preparation or native readback; business credit requires actual evidence."
 des_acceptance_second_rite_decision: "[TEST] Prepare a second stock dynamic rite"
 des_acceptance_second_rite_decision_desc: "Use the stock create_dynamic_rite effect for an explicitly prepared control founder, inheriting the dynastic doctrine. This is a cross-rite control input; it does not count as original GUI creation. Wait 31 natural days."
 des_acceptance_second_rite_decision_confirm: "Perform this disclosed test step"
 des_acceptance_second_rite_decision_tooltip: "Test preparation or native readback; business credit requires actual evidence."
 des_acceptance_cross_rites_decision: "[TEST] Create two distinct apostasy controls"
 des_acceptance_cross_rites_decision_desc: "Send one member of each bound dynasty to the original rite. Each observer must punish only its own dynasty's apostate. Wait one natural day."
 des_acceptance_cross_rites_decision_confirm: "Perform this disclosed test step"
 des_acceptance_cross_rites_decision_tooltip: "Test preparation or native readback; business credit requires actual evidence."
 des_acceptance_cross_migration_decision: "[TEST] Cross-convert the two targets"
 des_acceptance_cross_migration_decision_desc: "Send each apostate into the other dynastic rite. The product must move each target to the other dynasty and clear the former apostasy source. Wait one natural day."
 des_acceptance_cross_migration_decision_confirm: "Perform this disclosed test step"
 des_acceptance_cross_migration_decision_tooltip: "Test preparation or native readback; business credit requires actual evidence."
 des_acceptance_stock_crime_decision: "[TEST] Prepare a separate stock criminal reason"
 des_acceptance_stock_crime_decision_desc: "Prepare the stock attempted_murder_me_crime opinion from the player to the target, then make the target an apostate. This declared native input is not a naturally occurring murder attempt. Wait one natural day."
 des_acceptance_stock_crime_decision_confirm: "Perform this disclosed test step"
 des_acceptance_stock_crime_decision_tooltip: "Test preparation or native readback; business credit requires actual evidence."
 des_acceptance_stock_repent_decision: "[TEST] Observe repentance with another crime"
 des_acceptance_stock_repent_decision_desc: "Return the target to the primary rite. Only the product's apostasy source may disappear; the separately prepared stock criminal opinion and reasons must remain. Wait one natural day."
 des_acceptance_stock_repent_decision_confirm: "Perform this disclosed test step"
 des_acceptance_stock_repent_decision_tooltip: "Test preparation or native readback; business credit requires actual evidence."
 des_acceptance_pardon_prepare_decision: "[TEST] Prepare the actual pardon candidate"
 des_acceptance_pardon_prepare_decision_desc: "Remove only the separately prepared stock crime opinion, require a clean criminal baseline, then cause a new apostasy phase. This test does not pardon the target. Wait one natural day and use the real Pardon interaction."
 des_acceptance_pardon_prepare_decision_confirm: "Perform this disclosed test step"
 des_acceptance_pardon_prepare_decision_tooltip: "Test preparation or native readback; business credit requires actual evidence."
 des_acceptance_pardon_observe_decision: "[TEST] Observe the completed stock pardon"
 des_acceptance_pardon_observe_decision_desc: "First perform the real stock Pardon interaction. This decision only checks that criminal reasons were consumed while apostasy and its opinion remain, then checks again after 31 natural days."
 des_acceptance_pardon_observe_decision_confirm: "Perform this disclosed test step"
 des_acceptance_pardon_observe_decision_tooltip: "Test preparation or native readback; business credit requires actual evidence."
 des_acceptance_founder_death_decision: "[TEST] Prepare death of the second founder"
 des_acceptance_founder_death_decision_desc: "Use the stock death effect on the prepared NPC founder, leaving the human player unchanged. Generate another adherent and read the same binding, a living new dynasty head and continuing periodic maintenance after 31 days."
 des_acceptance_founder_death_decision_confirm: "Perform this disclosed test step"
 des_acceptance_founder_death_decision_tooltip: "Test preparation or native readback; business credit requires actual evidence."
 des_acceptance_cold_anchor_decision: "[TEST] Record the save-state anchor"
 des_acceptance_cold_anchor_decision_desc: "Record actual object identities and the pardoned apostate state before a real checkpoint and normal exit. This does not save or prove cold loading by itself."
 des_acceptance_cold_anchor_decision_confirm: "Perform this disclosed test step"
 des_acceptance_cold_anchor_decision_tooltip: "Test preparation or native readback; business credit requires actual evidence."
 des_acceptance_cold_readback_decision: "[TEST] Read the persisted state"
 des_acceptance_cold_readback_decision_desc: "After a separately proven cold saved-campaign run, compare actual state with the saved anchor. A successful marker alone does not prove that a new game process was used."
 des_acceptance_cold_readback_decision_confirm: "Perform this disclosed test step"
 des_acceptance_cold_readback_decision_tooltip: "Test preparation or native readback; business credit requires actual evidence."
 des_acceptance_legacy_before_decision: "[TEST] Observe the old save before initialization"
 des_acceptance_legacy_before_decision_desc: "Use this in a real save originally created without the product. Record the current rite, dynasty and House without changing product state, then use the product's normal Enable decision."
 des_acceptance_legacy_before_decision_confirm: "Perform this disclosed test step"
 des_acceptance_legacy_before_decision_tooltip: "Test preparation or native readback; business credit requires actual evidence."
 des_acceptance_legacy_after_decision: "[TEST] Observe the old-save bootstrap"
 des_acceptance_legacy_after_decision_desc: "After the product's real Enable decision, verify None, both known choices and unchanged rite, dynasty and House. This readback does not initialize anything."
 des_acceptance_legacy_after_decision_confirm: "Perform this disclosed test step"
 des_acceptance_legacy_after_decision_tooltip: "Test preparation or native readback; business credit requires actual evidence."
 des_acceptance_primary_heir_prepare_decision: "[TEST] Prepare the actual primary heir's rite"
 des_acceptance_primary_heir_prepare_decision_desc: "After all predecessor-owned observations, pin the real living adult primary heir and title. If the heir has another faith, apply the stock change to the player's faith, then apply the stock change to the player's current rite. Dynasty and House membership must form through the normal product path. No heir, House, dynasty, player or head is created or selected here. Wait at least one natural day and read actual membership. An old descendant used as this heir is an unconverted negative control only before this disclosed input. Ineligible inputs remain NOT_READY."
 des_acceptance_primary_heir_prepare_decision_confirm: "Apply this disclosed stock input"
 des_acceptance_primary_heir_prepare_decision_tooltip: "Preparation only; real inheritance and rite-head succession require independent evidence."
 des_acceptance_primary_heir_readback_decision: "[TEST] Read the settled primary heir"
 des_acceptance_primary_heir_readback_decision_desc: "After at least one natural day, compare the same real primary heir, title, rite, dynasty and House. This does not prove future succession or native editor eligibility."
 des_acceptance_primary_heir_readback_decision_confirm: "Read actual heir state"
 des_acceptance_primary_heir_readback_decision_tooltip: "Readback only; missing or changed identities remain NOT_READY."
 des_acceptance_edit_input_prepare_decision: "[TEST] Prepare the actual head's original edit input"
 des_acceptance_edit_input_prepare_decision_desc: "Reuse the actual legal chaplain and an empty theological-puppet slot on the first head or observed successor. A missing priest may use the stock assignment once. Preserve conflicting relationships and stock once-only variables. This is a disclosed input, not an interaction acceptance or payment receipt."
 des_acceptance_edit_input_prepare_decision_confirm: "Apply this disclosed stock input"
 des_acceptance_edit_input_prepare_decision_tooltip: "Read the relationship separately, then use the actual native editor and quote."
 des_acceptance_edit_input_readback_decision: "[TEST] Read original edit prerequisites"
 des_acceptance_edit_input_readback_decision_desc: "Observe actual chaplain, puppet, reverse puppeteer, action validity, current head and stock edit trigger. This does not certify full draft Can, a changed doctrine or affordability. Missing eligibility remains NOT_READY."
 des_acceptance_edit_input_readback_decision_confirm: "Read actual stock eligibility"
 des_acceptance_edit_input_readback_decision_tooltip: "Readback only; no relationship, stock variable or product state is changed."
 des_acceptance_primary_death_stage_decision: "[TEST] Stage the predecessor's stock death"
 des_acceptance_primary_death_stage_decision_desc: "After all old-actor observers, actual native edit to None and closed readback, schedule one stock natural-causes death for the next day. The engine chooses succession and head. Root must check the remaining budget, then observe the actor transition using independent native and Save identities. No player or head is assigned."
 des_acceptance_primary_death_stage_decision_confirm: "Stage the disclosed one-shot stock death"
 des_acceptance_primary_death_stage_decision_tooltip: "Irreversible test input on the predecessor; this is not succession proof."
 des_acceptance_successor_readback_decision: "[TEST] Read the successor and transfer finite fixture fields"
 des_acceptance_successor_readback_decision_desc: "First independently prove old-actor death, the pinned heir as current player, title succession and actual rite head. Compare these identities, then transfer only the finite existing fixture references and completed historical assertions. Copy no product state, stock once-only variables, pardon state, counters or cold anchors. Mismatches stay NOT_READY."
 des_acceptance_successor_readback_decision_confirm: "Read identities and transfer finite fixture fields"
 des_acceptance_successor_readback_decision_tooltip: "Historical flags retain predecessor evidence. Reopen natively, then run the entire pardon chain on this new head."
 des_acceptance_head_cells_decision: "Test: Prepare stock House-head input cells"
 des_acceptance_head_cells_decision_desc: "Create isolated generated-dynasty NPCs and use stock dynamic-rite creation: one has a real non-converting old-House successor, one is alone. Input readiness is not branch or business success. Independently inspect complete members, old and new Houses, dynasts and a pinned Save after two natural days."
 des_acceptance_head_cells_decision_confirm: "Perform this one disclosed stock-input attempt"
 des_acceptance_head_cells_decision_tooltip: "Never changes the player, titles, doctrines or product binding. Ineligible stock inputs remain INPUT_NOT_READY."
