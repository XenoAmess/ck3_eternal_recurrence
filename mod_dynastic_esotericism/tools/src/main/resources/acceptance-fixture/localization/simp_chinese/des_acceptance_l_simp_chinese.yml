l_simp_chinese:
 des_acceptance_capture_created_decision: "[验收] 观察原生界面实际创建的礼仪"
 des_acceptance_capture_created_decision_desc: "先通过原版窗口创建宗族化礼仪。本决议仅保存其实际身份，并将三个准备角色转入；不会创建或编辑礼仪。等待一个自然游戏日后读取结果。"
 des_acceptance_capture_created_decision_confirm: "保存身份并转换对照角色"
 des_acceptance_capture_created_decision_tooltip: "测试输入与延迟原生触发器读回。"
 des_acceptance_same_faith_decision: "[验收] 将目标转回原礼仪"
 des_acceptance_same_faith_decision_desc: "将目标改为已保存的原礼仪，保留宗族。产品必须识别同信仰不同礼仪的背离。等待一个自然游戏日，再查看好感与处罚预览。"
 des_acceptance_same_faith_decision_confirm: "改变目标礼仪"
 des_acceptance_same_faith_decision_tooltip: "仅提供背离输入；测试不添加产品特质、意见或罪行。"
 des_acceptance_cross_faith_decision: "[验收] 将目标改信东正教"
 des_acceptance_cross_faith_decision_desc: "将目标的信仰与礼仪改为东正教和拜占庭礼仪，保留宗族。等待一个自然游戏日后读取产品结果。"
 des_acceptance_cross_faith_decision_confirm: "改变目标信仰"
 des_acceptance_cross_faith_decision_tooltip: "不同信仰背离输入，不伪造产品状态。"
 des_acceptance_repent_decision: "[验收] 将目标转回新礼仪"
 des_acceptance_repent_decision_desc: "将目标的真实信仰与礼仪恢复为玩家创建的礼仪。等待一个自然游戏日，产品必须撤销自己的背离状态与关系来源。"
 des_acceptance_repent_decision_confirm: "让目标回归"
 des_acceptance_repent_decision_tooltip: "仅提供回归输入；不调用产品清理效果。"
 des_acceptance_closed_readback_decision: "[验收] 观察关闭宗族化后的状态"
 des_acceptance_closed_readback_decision_desc: "先通过原生编辑礼仪窗口选择“无”并实际确认。本决议只观察历史宗族身份保留及产品背离状态的清理。"
 des_acceptance_closed_readback_decision_confirm: "观察实际关闭状态"
 des_acceptance_closed_readback_decision_tooltip: "本测试不修改教义。"
 des_acceptance_reopened_readback_decision: "[验收] 观察重新开启后的状态"
 des_acceptance_reopened_readback_decision_desc: "先通过原生编辑礼仪窗口重新选择宗族化并实际确认。本决议核对原来的宗族是否被复用。"
 des_acceptance_reopened_readback_decision_confirm: "观察实际重启状态"
 des_acceptance_reopened_readback_decision_tooltip: "读取实际礼仪与宗族的双向绑定。"
