l_simp_chinese:
 des_preset_procreation_adopt_decision:0 "预置测试输入：采用繁育教派"
 des_preset_procreation_adopt_decision_desc:0 "在原信仰下生成两名真实成年对照人物，再以原版效果先转换当前玩家、后转换对照人物的信仰与礼仪。夹具不指定宗族、家族、领袖或产品绑定。"
 des_preset_procreation_adopt_decision_confirm:0 "仅应用一次公开输入"
 des_preset_procreation_leave_decision:0 "预置测试输入：目标背离繁育教派"
 des_preset_procreation_leave_decision_desc:0 "只通过原版效果让对照目标回到原信仰和礼仪。经过真实自然日后独立观察后态。"
 des_preset_procreation_leave_decision_confirm:0 "仅应用一次公开输入"
 des_preset_procreation_return_decision:0 "预置测试输入：目标回归繁育教派"
 des_preset_procreation_return_decision_desc:0 "再次以原版效果让对照目标采用繁育信仰和礼仪。夹具不修复或重置任何产品状态。"
 des_preset_procreation_return_decision_confirm:0 "仅应用一次公开输入"
 des_preset_vivhite_adopt_decision:0 "预置测试输入：采用白绮教派"
 des_preset_vivhite_adopt_decision_desc:0 "以原版效果让同一当前玩家采用白绮信仰和礼仪。两名对照人物仍信奉繁育教派。这不是通过宗教界面创建新信仰。"
 des_preset_vivhite_adopt_decision_confirm:0 "仅应用一次公开输入"
 des_preset_old_procreation_reason_decision:0 "预置测试输入：保留原礼仪观察者"
 des_preset_old_procreation_reason_decision_desc:0 "对照目标回到原信仰和礼仪，另一对照人物仍留在繁育教派。夹具不赋予犯罪、意见或产品旗标。"
 des_preset_old_procreation_reason_decision_confirm:0 "仅应用一次公开输入"
 des_preset_vivhite_join_decision:0 "预置测试输入：目标加入白绮教派"
 des_preset_vivhite_join_decision_desc:0 "以原版效果让目标采用白绮信仰和礼仪。独立核实其新归属，以及旧繁育教派犯罪和意见来源的撤销。"
 des_preset_vivhite_join_decision_confirm:0 "仅应用一次公开输入"
