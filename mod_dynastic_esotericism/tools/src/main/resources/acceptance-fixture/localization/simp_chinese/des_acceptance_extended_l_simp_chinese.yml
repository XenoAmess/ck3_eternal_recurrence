l_simp_chinese:
 des_acceptance_extended_start_decision: "[验收] 准备出生、旁支与家族漂移"
 des_acceptance_extended_start_decision_desc: "将已怀孕的准备父母转入主礼仪，用原版效果创建旁支，将一个信徒移入外族家族，并生成新信徒。观察翌日及31日后读回；另一个预先准备的东正教后代只读不改。"
 des_acceptance_extended_start_decision_confirm: "执行此声明的验收步骤"
 des_acceptance_extended_start_decision_tooltip: "测试准备或原生读回；业务通过仍须实际证据。"
 des_acceptance_second_rite_decision: "[验收] 准备第二个原生动态礼仪"
 des_acceptance_second_rite_decision_desc: "对独立准备的创建者使用原版create_dynamic_rite效果，继承宗族化教义。这是跨礼仪对照输入，不计作原生GUI创建验收。等待31个自然游戏日。"
 des_acceptance_second_rite_decision_confirm: "执行此声明的验收步骤"
 des_acceptance_second_rite_decision_tooltip: "测试准备或原生读回；业务通过仍须实际证据。"
 des_acceptance_cross_rites_decision: "[验收] 准备两个礼仪各自的背离者"
 des_acceptance_cross_rites_decision_desc: "将两个绑定宗族各一个成员转回原礼仪。每个礼仪的观察者只能处罚自己宗族的背离者。等待一个自然游戏日。"
 des_acceptance_cross_rites_decision_confirm: "执行此声明的验收步骤"
 des_acceptance_cross_rites_decision_tooltip: "测试准备或原生读回；业务通过仍须实际证据。"
 des_acceptance_cross_migration_decision: "[验收] 让两个目标交叉改宗"
 des_acceptance_cross_migration_decision_desc: "让两个背离者分别改信对方的宗族化礼仪。产品必须迁移其宗族并清除旧背离来源。等待一个自然游戏日。"
 des_acceptance_cross_migration_decision_confirm: "执行此声明的验收步骤"
 des_acceptance_cross_migration_decision_tooltip: "测试准备或原生读回；业务通过仍须实际证据。"
 des_acceptance_stock_crime_decision: "[验收] 准备独立原版犯罪理由"
 des_acceptance_stock_crime_decision_desc: "准备玩家对目标的原版attempted_murder_me_crime意见，再让目标背离。这是明确声明的原版输入，不声称自然发生过谋杀未遂。等待一个自然游戏日。"
 des_acceptance_stock_crime_decision_confirm: "执行此声明的验收步骤"
 des_acceptance_stock_crime_decision_tooltip: "测试准备或原生读回；业务通过仍须实际证据。"
 des_acceptance_stock_repent_decision: "[验收] 观察仍有其他罪行时的回归"
 des_acceptance_stock_repent_decision_desc: "让目标回归主礼仪。只有产品背离来源可以消失；独立准备的原版犯罪意见与理由必须保留。等待一个自然游戏日。"
 des_acceptance_stock_repent_decision_confirm: "执行此声明的验收步骤"
 des_acceptance_stock_repent_decision_tooltip: "测试准备或原生读回；业务通过仍须实际证据。"
 des_acceptance_pardon_prepare_decision: "[验收] 准备实际赦免对象"
 des_acceptance_pardon_prepare_decision_desc: "只移除此前准备的独立原版犯罪意见，核对无其他犯罪理由后开始新背离阶段。本决议不会赦免；等待一个自然游戏日后使用真实赦免交互。"
 des_acceptance_pardon_prepare_decision_confirm: "执行此声明的验收步骤"
 des_acceptance_pardon_prepare_decision_tooltip: "测试准备或原生读回；业务通过仍须实际证据。"
 des_acceptance_pardon_observe_decision: "[验收] 观察已完成的原版赦免"
 des_acceptance_pardon_observe_decision_desc: "先实际执行原版赦免交互。本决议只核对理由已被消耗、背离与意见仍在，再于31个自然游戏日后复查。"
 des_acceptance_pardon_observe_decision_confirm: "执行此声明的验收步骤"
 des_acceptance_pardon_observe_decision_tooltip: "测试准备或原生读回；业务通过仍须实际证据。"
 des_acceptance_founder_death_decision: "[验收] 准备第二礼仪创建者死亡"
 des_acceptance_founder_death_decision_desc: "对准备的NPC创建者使用原版死亡效果，不更换当前玩家。再生成一个信徒，31日后核对绑定未变、宗族有存活的新族长且周期维护继续。"
 des_acceptance_founder_death_decision_confirm: "执行此声明的验收步骤"
 des_acceptance_founder_death_decision_tooltip: "测试准备或原生读回；业务通过仍须实际证据。"
 des_acceptance_cold_anchor_decision: "[验收] 记录保存状态锚点"
 des_acceptance_cold_anchor_decision_desc: "在真实保存与正常退出前记录实际对象身份及已赦免背离者状态。本决议本身不保存，也不证明冷重载。"
 des_acceptance_cold_anchor_decision_confirm: "执行此声明的验收步骤"
 des_acceptance_cold_anchor_decision_tooltip: "测试准备或原生读回；业务通过仍须实际证据。"
 des_acceptance_cold_readback_decision: "[验收] 读取持久状态"
 des_acceptance_cold_readback_decision_desc: "在另有证据证明的冷载存档场次中，将实际状态与保存锚点比较。单独的成功标记不证明已使用新游戏进程。"
 des_acceptance_cold_readback_decision_confirm: "执行此声明的验收步骤"
 des_acceptance_cold_readback_decision_tooltip: "测试准备或原生读回；业务通过仍须实际证据。"
 des_acceptance_legacy_before_decision: "[验收] 观察初始化前的旧存档"
 des_acceptance_legacy_before_decision_desc: "用于真实由未安装本产品时创建的存档。只记录当前礼仪、宗族与家族，不改变产品状态；随后使用产品正式的启用决议。"
 des_acceptance_legacy_before_decision_confirm: "执行此声明的验收步骤"
 des_acceptance_legacy_before_decision_tooltip: "测试准备或原生读回；业务通过仍须实际证据。"
 des_acceptance_legacy_after_decision: "[验收] 观察旧存档初始化结果"
 des_acceptance_legacy_after_decision_desc: "实际执行产品正式启用决议后，核对默认无、两项知识及原礼仪、宗族、家族不变。本读回不执行初始化。"
 des_acceptance_legacy_after_decision_confirm: "执行此声明的验收步骤"
 des_acceptance_legacy_after_decision_tooltip: "测试准备或原生读回；业务通过仍须实际证据。"
 des_acceptance_primary_heir_prepare_decision: "[验收] 准备真实第一继承人的礼仪"
 des_acceptance_primary_heir_prepare_decision_desc: "完成前任全部长期观察后，固定真实存活成年第一继承人和主头衔。继承人信仰不同时先用原版效果转为玩家的当前信仰，再转为玩家的当前礼仪，由正常产品路径自然归族；不制造或另选继承人，不设置家族、宗族、玩家或领袖。至少推进一个自然日后独立读回归属。若该继承人也是旧后代负例，其未改信负例证明仅限本次公开输入之前；缺资格时保留 NOT_READY。"
 des_acceptance_primary_heir_prepare_decision_confirm: "施加公开的原版输入"
 des_acceptance_primary_heir_prepare_decision_tooltip: "仅属准备；真实继承和礼仪领袖仍须独立证明。"
 des_acceptance_primary_heir_readback_decision: "[验收] 读回实际第一继承人"
 des_acceptance_primary_heir_readback_decision_desc: "至少一个自然日后比较同一真实第一继承人、主头衔、礼仪、宗族和家族。本读回不证明未来继承成功或原生编辑资格。"
 des_acceptance_primary_heir_readback_decision_confirm: "读回实际继承人状态"
 des_acceptance_primary_heir_readback_decision_tooltip: "仅观察；身份缺失或变化时保留 NOT_READY。"
 des_acceptance_edit_input_prepare_decision: "[验收] 准备实际领袖的原版编辑前置"
 des_acceptance_edit_input_prepare_decision_desc: "对实际首位领袖或已观察的继任者，复用合法宫廷司祭及空缺神学傀儡槽。缺司祭时尝试一次原版任命，不清冲突关系、不改原版一次性变量。这是公开关系输入，不声称接受过互动或支付过费用。"
 des_acceptance_edit_input_prepare_decision_confirm: "施加公开的原版输入"
 des_acceptance_edit_input_prepare_decision_tooltip: "另行读回关系后，才使用实际原生编辑器和当时报价。"
 des_acceptance_edit_input_readback_decision: "[验收] 读回原版编辑前置"
 des_acceptance_edit_input_readback_decision_desc: "观察实际司祭、正向傀儡、反向操控者、动作资格、当前礼仪领袖和原版编辑触发器。不证明完整草案 Can、教义已变或费用足够；缺资格时保留 NOT_READY。"
 des_acceptance_edit_input_readback_decision_confirm: "读回真实原版资格"
 des_acceptance_edit_input_readback_decision_tooltip: "仅读回，不改变关系、原版变量或产品状态。"
 des_acceptance_primary_death_stage_decision: "[验收] 安排前任的原版死亡"
 des_acceptance_primary_death_stage_decision_desc: "全部旧角色观察、第一次真实原生编辑为无及关闭读回完成后，为下一自然日安排一次原版自然死亡。引擎决定继承及新领袖。Root须先核剩余预算，再合法推进角色边界并独立读取原生和存档身份；不指定玩家或领袖。"
 des_acceptance_primary_death_stage_decision_confirm: "安排公开的一次性原版死亡"
 des_acceptance_primary_death_stage_decision_tooltip: "这是对当前前任的不可逆测试输入，本身不是继承证据。"
 des_acceptance_successor_readback_decision: "[验收] 读回真实继任者并迁移有限夹具字段"
 des_acceptance_successor_readback_decision_desc: "先独立证明前任已死、固定继承人已为当前玩家、原头衔已继承且确为礼仪领袖。比较身份后仅迁移逐项列明且已经存在的夹具引用和历史断言。不复制产品状态、原版一次性变量、赦免状态、计数器或冷启动锚点；不匹配时保留 NOT_READY。"
 des_acceptance_successor_readback_decision_confirm: "读回身份并迁移有限夹具字段"
 des_acceptance_successor_readback_decision_tooltip: "历史旗标仍指向前任证据。先原生重新开启，再由本位新领袖完成整个赦免链。"
 des_acceptance_head_cells_decision: "测试：准备原版家族首领输入对照"
 des_acceptance_head_cells_decision_desc: "生成隔离的真实宗族NPC并调用原版动态礼仪工厂：一名保留真实同旧家族且不改信的接任者，另一名旧家族仅有自己。输入就绪不代表分支或业务通过；真实两日后独立检查完整成员、新旧家族、宗族长与精确保存。"
 des_acceptance_head_cells_decision_confirm: "执行这一次公开原版输入"
 des_acceptance_head_cells_decision_tooltip: "不更换玩家、头衔、教义或产品绑定。原版输入不合格时保留INPUT_NOT_READY。"
