l_polish:
 des_dynastic_membership_name:0 "Przynależność dynastyczna"
 des_dynastic_membership_desc:0 "Wybierz, czy ten obrzęd wiąże swoich wyznawców z jedną dynastią."
 des_doctrine_none_name:0 "Brak"
 des_doctrine_none_desc:0 "Ten obrzęd nie przypisuje swoim wyznawcom dynastii."
 des_doctrine_dynastic_name:0 "Dynastyczny"
 des_doctrine_dynastic_desc:0 "Wszyscy żyjący wyznawcy, w tym założyciel, dołączają do dynastii związanej z tym obrządkiem. Zastępuje to ich dotychczasowy ród i dynastię, co może wpłynąć na nazwiska, dziedziczenie, głowy dynastii i sławę dynastii. Jeśli głowa dawnego rodu musi przekazać władzę, związany z rodem tytuł szlachecki również przechodzi na następcę. Jeśli żaden z obecnych wyznawców nie może założyć dynastii, tworzona jest nowa, żyjąca postać tego samego obrządku jako jej założyciel. Członkowie dynastii wyznający inny obrządek stają się apostatami: wyznawcy tego obrządku otrzymują wobec nich modyfikator opinii −100 oraz podstawy do uwięzienia, wygnania i egzekucji. Zwykłe zasady jurysdykcji i wymagania interakcji nadal obowiązują."
 doctrine_parameter_des_dynastic_membership:0 "Wyznawcy dołączają do dynastii ściśle związanej z tym obrzędem. Członkowie wyznający inny obrzęd uzyskują od wyznawców tego obrzędu modyfikator opinii −100 oraz podstawy do poświęcenia, wygnania i egzekucji."
 trait_des_apostate:0 "Apostaata dynastyczny"
 trait_des_apostate_desc:0 "Ta postać należy do dynastii związanej z obrzędem, ale obecnie wyznaje inny obrzęd. Tylko wyznawcy obrzędu związanego z dynastią uzyskują wobec niej modyfikator opinii i podstawy do poświęcenia za apostazję dynastyczną."
 des_apostasy_opinion:0 "Zdradził obrzęd dynastii"
 des_initialize_decision:0 "Włącz dynastyczną ezoterykę"
 des_initialize_decision_desc:0 "Przygotuj tę istniejącą kampanię do Dynastycznej Ezoterystyki. Istniejące rytuały otrzymają domyślną opcję „Brak”, a żyjące postacie z natywną możliwością gry poznają obie opcje. Żaden istniejący rytuał nie stanie się dynastyczny automatycznie. Następnie wybierz opcję „Dynastyczny” w standardowym oknie tworzenia lub edycji rytuałów."
 des_initialize_decision_tooltip:0 "Zainicjuj opcje obrzędów w tej istniejącej kampanii"
 des_initialize_decision_confirm:0 "Włącz opcje obrzędów"
 des_initialize_decision_effect:0 "Zainicjuj opcje Brak / Dynastyczny, nie zmieniając nikomu aktualnej dynastii."
