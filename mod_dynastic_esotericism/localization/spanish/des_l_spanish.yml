l_spanish:
 des_dynastic_membership_name:0 "Dinastía"
 des_dynastic_membership_desc:0 "Elige si este rito vincula a sus seguidores con una única dinastía."
 des_doctrine_none_name:0 "Ninguna"
 des_doctrine_none_desc:0 "Este rito no asigna una dinastía a sus seguidores."
 des_doctrine_dynastic_name:0 "Dinástico"
 des_doctrine_dynastic_desc:0 "Todos los seguidores vivos, incluido el fundador, se unen a la dinastía vinculada a este rito. Esto sustituye su casa y dinastía anteriores y puede afectar a los apellidos, la sucesión, los jefes de dinastía y el renombre. Si el jefe de la casa anterior debe ceder el cargo, cualquier título de familia noble vinculado a ella también pasa al sucesor. Si ningún seguidor existente puede fundar la dinastía, se crea un nuevo personaje vivo del mismo rito como fundador. Los miembros de la dinastía que siguen otro rito se convierten en apóstatas: los seguidores de este rito reciben hacia ellos un modificador de opinión de −100 y motivos para encarcelarlos, desterrarlos y ejecutarlos. Siguen aplicándose las reglas habituales de jurisdicción y los requisitos de las interacciones."
 doctrine_parameter_des_dynastic_membership:0 "Los seguidores se unen a la dinastía vinculada a este rito exacto. Los miembros que siguen otro rito لحل un modificador de opinión de −100 y motivos para Commonly la imprisonment, the banishment and the execution from the followers of this rite."
 trait_des_apostate:0 "Apóstata dinástico"
 trait_des_apostate_desc:0 "Este personaje pertenece a una dinastía vinculada a un rito, pero actualmente sigue otro. Solo los seguidores del rito vinculado reciben el modificador de opinión y los motivos por apostasía dinástica."
 des_apostasy_opinion:0 "Traicionó el rito dinástico"
 des_initialize_decision:0 "Habilitar esoterismo dinástico"
 des_initialize_decision_desc:0 "Prepara esta campaña existente para la Esotericismo Dinástico. Los ritos existentes reciben la opción predeterminada «Ninguno», y los personajes vivos con elegibilidad jugable nativa aprenden ambas opciones. Ningún rito existente se vuelve dinástico automáticamente. Después, elige «Dinástico» en la ventana normal de creación o edición de ritos."
 des_initialize_decision_tooltip:0 "Inicializa las opciones de rito en esta campaña existente"
 des_initialize_decision_confirm:0 "Habilitar las opciones de rito"
 des_initialize_decision_effect:0 "Inicializa las opciones «Ninguna / Dinástico» sin cambiar la dinastía actual de nadie."
