l_japanese:
 des_dynastic_membership_name:0 "宗族所属"
 des_dynastic_membership_desc:0 "この儀礼が、すべての信徒を単一王朝へ帰属させるかどうかを選択します。"
 des_doctrine_none_name:0 "なし"
 des_doctrine_none_desc:0 "この儀礼は、信徒に特定の宗族所属を割り当てません。"
 des_doctrine_dynastic_name:0 "宗族所属"
 des_doctrine_dynastic_desc:0 "存命の信徒は創始者を含め、この儀礼に対応する宗族へ加入します。従来の家系・宗族への所属が置き換わり、姓、継承、宗族長、宗族の名声に影響する場合があります。元の家系の長を交代させる必要がある場合、既存の家系専用称号も後任へ引き継がれます。既存の信徒が誰も宗族を創設できない場合、同じ儀礼を信仰する存命の新しい人物が創始者として生成されます。他の儀礼を信仰する宗族員は背教者となり、この儀礼の信徒はその人物に対して−100の好感度補正と、投獄・追放・処刑の正当な理由を得ます。通常の管轄権と交流の実行条件は引き続き適用されます。"
 doctrine_parameter_des_dynastic_membership:0 "信徒は、この特定の儀礼に厳密に紐づく宗族へ加入します。他の儀礼を信仰する宗族会員は、この儀礼の信徒によって背教者と見なされ、−100の好感および投獄・追放・処刑の根拠が生じます。"
 trait_des_apostate:0 "宗族背教者"
 trait_des_apostate_desc:0 "この人物は、ある儀礼に紐づく宗族に属しながら、別の儀礼を信仰しています。紐づく儀礼の信徒のみが、宗族背教による好感修正と処罰の根拠を得ます。"
 des_apostasy_opinion:0 "宗族の儀礼を背棄した"
 des_initialize_decision:0 "宗族化密教を有効化"
 des_initialize_decision_desc:0 "この旧セーブに宗族化密教を初期化します。既存の儀礼にはデフォルトで「なし」が追加され、通常なら選択可能な条件を満たす生存キャラクターが両方の選択肢を習得します。既存の儀礼が自動的に宗族化されることはありません。その後、通常Creates ritesの画面で「宗族化」を選択できます。"
 des_initialize_decision_tooltip:0 "この既存のキャンペーンで儀礼の選択肢を初期化する"
 des_initialize_decision_confirm:0 "儀礼の選択肢を有効化"
 des_initialize_decision_effect:0 "「なし／宗族所属」の選択肢を初期化し、誰の現在の宗族も変更しません。"
