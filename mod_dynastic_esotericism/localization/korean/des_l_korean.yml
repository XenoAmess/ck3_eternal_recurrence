l_korean:
 des_dynastic_membership_name:0 "가문 귀속"
 des_dynastic_membership_desc:0 "이 의식이 모든 신도를 하나의 가문에 귀속시킬지 선택합니다."
 des_doctrine_none_name:0 "없음"
 des_doctrine_none_desc:0 "이 의식은 신도를 특정 가문에 귀속시키지 않습니다."
 des_doctrine_dynastic_name:0 "가문화"
 des_doctrine_dynastic_desc:0 "모든 생존 신도는 창시자를 포함하여 이 의식에 대응하는 왕조에 가입합니다. 기존 가문과 왕조 소속이 대체되므로 성씨, 상속, 왕조 수장과 왕조 명성에 영향을 줄 수 있습니다. 기존 가문의 수장을 교체해야 한다면 가문에 귀속된 귀족 작위도 후임에게 이전됩니다. 기존 신도 중 누구도 왕조를 창설할 수 없다면 같은 의식을 믿는 새로운 생존 인물이 창시자로 생성됩니다. 다른 의식을 믿는 왕조 구성원은 배교자가 됩니다. 이 의식의 신도들은 그 인물에 대해 −100의 의견 보정치와 투옥, 추방, 처형의 정당한 사유를 얻습니다. 일반적인 관할권과 상호작용의 실행 조건은 계속 적용됩니다."
 doctrine_parameter_des_dynastic_membership:0 "신도는 이 의식에 정확히 귀속된 가문에 들어갑니다. 같은 가문의 다른 의식 신도는 이 의식의 신도에게 배신자로 간주되며, −100 호감도와 금고, 추방, 처형의 범죄 근거를 받습니다."
 trait_des_apostate:0 "가문 의식 배신자"
 trait_des_apostate_desc:0 "이 인물은 어떤 의식에 귀속된 가문 소속이지만 현재 다른 의식을 믿고 있습니다. 귀속된 의식의 신도만 이 인물에게 배신 범죄의 호감도 수정치와 처벌 근거를 적용합니다."
 des_apostasy_opinion:0 "가문의 의식을 배신함"
 des_initialize_decision:0 "가문화 밀교 활성화"
 des_initialize_decision_desc:0 "이 기존 캠페인을 가문 esotericism을 위해 초기화합니다. 기존 의식에는 기본값으로 '없음'选项이 추가되며, 기본 플레이 조건을 충족하는 생존 캐릭터는 두 선택지를 모두 배웁니다. 기존 의식은 자동으로 가문화되지 않습니다. 이후 일반 의식 생성 또는 편집 창에서 '가문화'를 선택할 수 있습니다."
 des_initialize_decision_tooltip:0 "이 기존 캠페인에서 의식 선택지를 초기화합니다"
 des_initialize_decision_confirm:0 "의식 선택지 활성화"
 des_initialize_decision_effect:0 "누구님의 현재 가문도 변경하지 않고 ‘없음／가문화’ 선택지를 초기화합니다."
