l_russian:
 des_dynastic_membership_name:0 "Династическая принадлежность"
 des_dynastic_membership_desc:0 "Выберите, будет ли этот обряд привязывать всех его последователей к единой династии."
 des_doctrine_none_name:0 "Нет"
 des_doctrine_none_desc:0 "Этот обряд не привязывает его последователей к определённой династии."
 des_doctrine_dynastic_name:0 "Династический"
 des_doctrine_dynastic_desc:0 "Все живые последователи, включая основателя, присоединяются к династии, соответствующей этому обряду, заменяя прежнюю принадлежность к дому и династии. Это может повлиять на имена, наследование, глав династий и их репутацию. Члены, перешедшие к другому обряду, становятся отступниками: последователи этого обряда получают модификатор отношения −100 и основания для заключения в тюрьму, изгнания или казни. Обычные правила юрисдикции и взаимодействия по-прежнему действуют."
 doctrine_parameter_des_dynastic_membership:0 "Последователи присоединяются к династии, связанной именно с этим обрядом. Члены, исповедующие другой обряд, считаются отступниками и получают от последователей этого обряда −100 к отношению и основания для заключения в тюрьму, изгнания или казни."
 trait_des_apostate:0 "Династический отступник"
 trait_des_apostate_desc:0 "Этот персонаж принадлежит к династии, связанной с одним обрядом, но исповедует другой. Только последователи связанного обряда получают к нему модификатор отношения за династическое отступничество и основания для наказания."
 des_apostasy_opinion:0 "Отверг обряд династии"
 des_initialize_decision:0 "Включить династическую эзотерику"
 des_initialize_decision_desc:0 "Подготовить этот текущий сценарий к династической эзотерике. Для существующих обрядов будет добавлен вариант по умолчанию «Нет», а все живые персонажи, отвечающие обычным условиям игры на получение обрядов, получат доступ к обоим вариантам. Ни один существующий обряд не станет династическим автоматически. После этого вариант «Династический» можно выбрать в стандартном окне создания или изменения обрядов."
 des_initialize_decision_tooltip:0 "Инициализировать варианты обрядов в этой существующей кампании"
 des_initialize_decision_confirm:0 "Включить варианты обрядов"
 des_initialize_decision_effect:0 "Инициализировать варианты «Нет / Династический», не меняя текущую династию никого."
