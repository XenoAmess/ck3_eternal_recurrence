l_french:
 des_dynastic_membership_name:0 "Appartenance dynastique"
 des_dynastic_membership_desc:0 "Choisissez si ce rite lie ses adeptes à une seule dynastie."
 des_doctrine_none_name:0 "Aucun"
 des_doctrine_none_desc:0 "Ce rite n’assigne aucune dynastie à ses adeptes."
 des_doctrine_dynastic_name:0 "Dynastique"
 des_doctrine_dynastic_desc:0 "Tous les adeptes vivants, y compris le fondateur, rejoignent la dynastie liée à ce rite. Cela remplace leur ancienne maison et dynastie, ce qui affecte les noms, l’héritage, les chefs de dynastie et la renommée. Les membres suivant un autre rite sont des apostats : les adeptes de ce rite gagnent un modificateur d’opinion de −100 et peuvent les faire emprisonner, bannir ou exécuter. Les règles habituelles de juridiction et d’interaction s’appliquent toujours."
 doctrine_parameter_des_dynastic_membership:0 "Les adeptes rejoignent la dynastie liée exactement à ce rite. Les membres suivant un autre rite s’exposent à une opinion de −100 et à des motifsastraires d’emprisonnement, de bannissement et d’exécution de la part des adeptes de ce rite."
 trait_des_apostate:0 "Apostat dynastique"
 trait_des_apostate_desc:0 "Ce personnage appartient à une dynastie liée à un rite, mais suit actuellement un autre rite. Seuls les adeptes du rite lié obtiennent l”将 l’opinion et les motifsastraires de l’apostasie dynastique."
 des_apostasy_opinion:0 "A trahi le rite de sa dynastie"
 des_initialize_decision:0 "Activer l’ésotérisme dynastique"
 des_initialize_decision_desc:0 "Préparer cette campagne existante pour l’ésotérisme dynastique. Les rites existants reçoivent l’option par défaut « Aucun », et les personnages vivants éligibles selon les règles natives apprennent les deux choix. Aucun rite existant ne devient automatiquement dynastique. Vous pourrez ensuite choisir « Dynastique » dans la fenêtre habituelle de création ou de modification d’un rite."
 des_initialize_decision_tooltip:0 "Initialiser les options de rite dans cette campagne existante"
 des_initialize_decision_confirm:0 "Activer les options de rite"
 des_initialize_decision_effect:0 "Initialisez les options « Aucun / Dynastique » sans modifier la dynastie actuelle de quiconque."
