l_english:
 des_dynastic_membership_name: "Dynastic Membership"
 des_dynastic_membership_desc: "Choose whether this rite binds its adherents to a single dynasty."
 des_doctrine_none_name: "None"
 des_doctrine_none_desc: "This rite does not assign a dynasty to its adherents."
 des_doctrine_dynastic_name: "Dynastic"
 des_doctrine_dynastic_desc: "All living adherents, including the founder, join this rite's dynasty. This replaces their former house and dynasty, affecting names, inheritance, dynasty heads and renown. Members who follow another rite are apostates: this rite's adherents receive a −100 opinion modifier and grounds for imprisonment, banishment and execution. Normal jurisdiction and interaction rules still apply."
 doctrine_parameter_des_dynastic_membership: "Adherents join the dynasty bound to this exact rite. Members following another rite incur −100 opinion and criminal reasons from this rite's adherents."
 trait_des_apostate: "Dynastic Apostate"
 trait_des_apostate_desc: "This character belongs to a dynasty bound to a rite but currently follows another rite. Only adherents of the bound rite receive the dynastic apostasy opinion and criminal reasons."
 des_apostasy_opinion: "Betrayed the Dynasty's Rite"
 des_initialize_decision: "Enable Dynastic Esotericism"
 des_initialize_decision_desc: "Prepare this existing campaign for Dynastic Esotericism. Existing rites receive the default None option, and every living character learns both choices. No existing rite becomes dynastic automatically. Afterwards, choose Dynastic in the normal rite creation or editing window."
 des_initialize_decision_tooltip: "Initialize the rite options in this existing campaign"
 des_initialize_decision_confirm: "Enable the rite options"
 des_initialize_decision_effect: "Initialize the None / Dynastic options without changing anyone's current dynasty."
