l_simp_chinese:
 des_dynastic_membership_name: "宗族化"
 des_dynastic_membership_desc: "选择该礼仪是否将所有信徒归入一个对应的宗族。"
 des_doctrine_none_name: "无"
 des_doctrine_none_desc: "该礼仪不要求信徒加入特定宗族。"
 des_doctrine_dynastic_name: "宗族化"
 des_doctrine_dynastic_desc: "所有在世信徒（包括创建者）都会加入该礼仪对应的宗族，取代原来的家族与宗族归属，可能影响姓氏、继承、族长和宗族声望。宗族成员若改信其他礼仪，即成为背离者：本礼仪信徒对其获得−100好感修正，并拥有监禁、放逐、处决的罪行理由。原版管辖与交互资格仍然适用。"
 doctrine_parameter_des_dynastic_membership: "信徒加入与本礼仪精确绑定的宗族；同族的其他礼仪信徒被本礼仪信徒视为背离者，承受−100好感及监禁、放逐、处决理由。"
 trait_des_apostate: "背离宗族礼仪"
 trait_des_apostate_desc: "此人属于与某个礼仪绑定的宗族，却正信奉其他礼仪。只有绑定礼仪的信徒对其获得背离罪行的好感修正与处罚理由。"
 des_apostasy_opinion: "背离宗族礼仪"
 des_initialize_decision: "启用宗族化密教"
 des_initialize_decision_desc: "为此旧存档初始化宗族化密教。现存礼仪补入默认的“无”，所有在世角色学会两个选项，不会自动将任何已有礼仪宗族化。之后可在原版创建或改革礼仪窗口选择“宗族化”。"
 des_initialize_decision_tooltip: "在此旧存档中初始化宗族化选项"
 des_initialize_decision_confirm: "启用礼仪选项"
 des_initialize_decision_effect: "初始化“无／宗族化”选项，不改变任何人的现有宗族。"
