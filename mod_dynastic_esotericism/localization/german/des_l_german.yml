l_german:
 des_dynastic_membership_name:0 "Dynastische Zugehörigkeit"
 des_dynastic_membership_desc:0 "Wähle, ob dieses Ritual seine Anhänger an eine einzelne Dynastie bindet."
 des_doctrine_none_name:0 "Keine"
 des_doctrine_none_desc:0 "Dieses Ritual weist seinen Anhängern keine Dynastie zu."
 des_doctrine_dynastic_name:0 "Dynastisch"
 des_doctrine_dynastic_desc:0 "Alle lebenden Anhänger, einschließlich des Gründers, treten der diesem Ritus zugeordneten Dynastie bei. Ihre bisherige Haus- und Dynastiezugehörigkeit wird ersetzt, was Namen, Erbfolge, Dynastieoberhäupter und Dynastieruhm beeinflussen kann. Muss das bisherige Hausoberhaupt sein Amt übergeben, geht auch ein vorhandener Adelshaustitel an den Nachfolger über. Kann kein vorhandener Anhänger die Dynastie gründen, wird ein neuer lebender Charakter desselben Ritus als Gründer erschaffen. Dynastiemitglieder, die einem anderen Ritus folgen, werden zu Abtrünnigen: Die Anhänger dieses Ritus erhalten ihnen gegenüber einen Meinungsmodifikator von −100 sowie Gründe für Inhaftierung, Verbannung und Hinrichtung. Die üblichen Zuständigkeitsregeln und Voraussetzungen der Interaktionen gelten weiterhin."
 doctrine_parameter_des_dynastic_membership:0 "Anhänger treten der Dynastie bei, die exakt an dieses Ritual gebunden ist. Mitglieder eines anderen Rituals werden von den Anhängern dieses Rituals als Abtrünnige betrachtet und erleiden −100 Meinung sowie strafrechtliche Gründe für Inhaftierung, Verbannung und Hinrichtung."
 trait_des_apostate:0 "Dynastischer Abtrünniger"
 trait_des_apostate_desc:0 "Diese Person gehört einer Dynastie an, die an ein Ritual gebunden ist, folgt derzeit aber einem anderen Ritual. Nur die Anhänger des gebundenen Rituals erhalten die Meinungsmodifikation und die strafrechtlichen Gründe für dynastischen Abtrünnigismus."
 des_apostasy_opinion:0 "Hat das Ritual der Dynastie verraten"
 des_initialize_decision:0 "Dynastische Esoterik aktivieren"
 des_initialize_decision_desc:0 "Bereite diesen bestehenden Feldzug für Dynastische Esoterik vor. Vorhandene Rituale erhalten die Standardoption „Keine“, und lebende Figuren mit regulärer Spielberechtigung erlernen beide Optionen. Kein bestehendes Ritual wird automatisch dynastisch. Anschließend kannst du im normalen Fenster zur Erstellung oder Bearbeitung von Ritualen „Dynastisch“ auswählen."
 des_initialize_decision_tooltip:0 "Initialisiere die Ritualoptionen in diesem bestehenden Spiel"
 des_initialize_decision_confirm:0 "Ritualoptionen aktivieren"
 des_initialize_decision_effect:0 "Initialisiere die Optionen „Keine / Dynastisch“, ohne die aktuelle Dynastie einer Person zu ändern."
