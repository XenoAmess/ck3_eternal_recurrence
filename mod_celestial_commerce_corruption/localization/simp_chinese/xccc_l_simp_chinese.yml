l_simp_chinese:
 xccc_corruption_policy_decision:0 "定夺贪墨之策"
 xccc_corruption_policy_decision_desc:0 "官署账册之外，总有些不见天日的余地。我可以决定截留多少税赋，也可以在账目引来注视以前抽身。"
 xccc_corruption_policy_decision_tooltip:0 "为这名官员选择一项持续生效的贪腐策略"
 xccc_corruption_policy_decision_confirm:0 "翻开账册"
 xccc_corruption_policy_effect_tooltip:0 "选择向上级少缴多少税赋。贪腐会带来[barter_goods|E]，却会损害[merit|E]与民望。"

 trait_xccc_corruption_1:0 "官场油吏"
 trait_xccc_corruption_1_desc:0 "该角色把天朝税率降低5个百分点，并悄然经营一条易货门路。"
 trait_xccc_corruption_1_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip]把天朝税率降低5个百分点，表面上仍维持着体面。"
 trait_xccc_corruption_2:0 "聚敛能吏"
 trait_xccc_corruption_2_desc:0 "该角色把天朝税率降低10个百分点，以民望换取私门之利。"
 trait_xccc_corruption_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip]把天朝税率降低10个百分点。"
 trait_xccc_corruption_3:0 "贪墨成阀"
 trait_xccc_corruption_3_desc:0 "该角色把天朝税率降低15个百分点，并把利益输送织成了一张牢固的关系网。"
 trait_xccc_corruption_3_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip]借人情罗网把天朝税率降低15个百分点。"
 trait_xccc_corruption_4:0 "蠹国权奸"
 trait_xccc_corruption_4_desc:0 "该角色把天朝税率降低25个百分点，任由国库与治下百姓为庞大的私门网络付账。"
 trait_xccc_corruption_4_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip]肆无忌惮地把天朝税率降低25个百分点。"

 xccc.1001.t:0 "歧路账册"
 xccc.1001.desc:0 "居此官位，恰如舟行浊水。水至清则无鱼，泥沙太重又会拖沉船底。账册能够藏下一点分润，也能吞没一座金山；只是每一笔消失的税赋，终究都会留下痕迹。\n\n此后行止，当何以自处？"
 xccc.1001.a:0 "只取无伤大雅的一份"
 xccc.1001.a.tt:0 "把天朝税率降低5个百分点，并获得少量易货产出。"
 xccc.1001.b:0 "让聚敛成为惯例"
 xccc.1001.b.tt:0 "把天朝税率降低10个百分点，同时承受更重的民望与功绩惩罚。"
 xccc.1001.c:0 "把官署织成利益之网"
 xccc.1001.c.tt:0 "把天朝税率降低15个百分点，并经营一张丰厚的关系网。"
 xccc.1001.d:0 "榨尽这官位所能承受的一切"
 xccc.1001.d.tt:0 "把天朝税率降低25个百分点，换取最高易货产出与极其严厉的惩罚。"
 xccc.1001.f:0 "暂且收手，避一避风头"
 xccc.1001.f.tt:0 "移除当前贪腐策略；冷却结束后仍可再次选择。"
 xccc.1001.e:0 "从此封存这本账册"
 xccc.1001.e.tt:0 "移除当前贪腐策略，并为该角色永久隐藏此决议。"
