l_german:
 xccc_corruption_policy_decision:0 "Eine Korruptionspolitik einführen"
 xccc_corruption_policy_decision_desc:0 "Das Amt bietet Möglichkeiten, die in keinem offiziellen Rechnungsbuch auftauchen. Ich kann entscheiden, wie viele Einnahmen ich umleite, oder mich zurückziehen, bevor die Bücher auffallen."
 xccc_corruption_policy_decision_tooltip:0 "Wählt eine dauerhafte Korruptionspolitik für diesen Beamten"
 xccc_corruption_policy_decision_confirm:0 "Die Bücher prüfen"
 xccc_corruption_policy_effect_tooltip:0 "Entscheidet, wie viel Steuer Ihr Eurem Lehnsherrn vorenthaltet. Korrupte Maßnahmen bringen [barter_goods|E], mindern aber [merit|E] und die öffentliche Meinung."

 trait_xccc_corruption_1:0 "Kleiner Opportunist"
 trait_xccc_corruption_1_desc:0 "Dieser Charakter senkt seinen himmlischen Steuersatz um 5 Prozentpunkte und pflegt einen unauffälligen Strom von Tauschwaren."
 trait_xccc_corruption_1_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] senkt den himmlischen Steuersatz um 5 Prozentpunkte und wahrt dabei den Schein."
 trait_xccc_corruption_2:0 "Berechnender Profiteur"
 trait_xccc_corruption_2_desc:0 "Dieser Charakter senkt seinen himmlischen Steuersatz um 10 Prozentpunkte und tauscht öffentliches Vertrauen gegen private Vorteile."
 trait_xccc_corruption_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] senkt den himmlischen Steuersatz um 10 Prozentpunkte."
 trait_xccc_corruption_3:0 "Unersättlicher Schmarotzer"
 trait_xccc_corruption_3_desc:0 "Dieser Charakter senkt seinen himmlischen Steuersatz um 15 Prozentpunkte und hat die Korruption zu einem dauerhaften politischen Netzwerk verwoben."
 trait_xccc_corruption_3_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] senkt den himmlischen Steuersatz durch ein Geflecht von Gefälligkeiten um 15 Prozentpunkte."
 trait_xccc_corruption_4:0 "Korrupter Grand"
 trait_xccc_corruption_4_desc:0 "Dieser Charakter senkt seinen himmlischen Steuersatz um 25 Prozentpunkte und bereichert ein weitläufiges privates Netzwerk, während Staat und Grafschaften die Kosten tragen."
 trait_xccc_corruption_4_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] senkt den himmlischen Steuersatz ohne jede Zurückhaltung um 25 Prozentpunkte."

 xccc.1001.t:0 "Konten am Scheideweg"
 xccc.1001.desc:0 "Ein Amt zu bekleiden heißt, einen Kahn durch einen schlammigen Fluss zu steuern. Klares Wasser bietet wenig Nahrung; zu viel Schlamm zieht den Rumpf hinab. Die Bücher können eine maßvolle Veruntreuung verbergen – oder ein Vermögen –, doch jede fehlende Münze hinterlässt eine Spur.\n\nWie soll ich meine Geschäfte führen?"
 xccc.1001.a:0 "Die Veruntreuung diskret halten"
 xccc.1001.a.tt:0 "Senkt den himmlischen Steuersatz um 5 Prozentpunkte und bringt eine bescheidene Tauschproduktion."
 xccc.1001.b:0 "Gewinn zur Gewohnheit machen"
 xccc.1001.b.tt:0 "Senkt den himmlischen Steuersatz um 10 Prozentpunkte und nimmt stärkere Abzüge auf öffentliche Meinung und Verdienst in Kauf."
 xccc.1001.c:0 "Das Amt in ein Geflecht aus Gefallen verstricken"
 xccc.1001.c.tt:0 "Senkt den himmlischen Steuersatz um 15 Prozentpunkte und knüpft ein einträgliches Netzwerk."
 xccc.1001.d:0 "Alles aus dem Amt herausholen"
 xccc.1001.d.tt:0 "Senkt den himmlischen Steuersatz um 25 Prozentpunkte, um die Tauschproduktion zu maximieren, und bringt schwere Abzüge."
 xccc.1001.f:0 "Sich vorerst zurückziehen"
 xccc.1001.f.tt:0 "Entfernt die aktive Korruptionspolitik. Die Entscheidung kehrt nach ihrer Abklingzeit zurück."
 xccc.1001.e:0 "Diese Bücher für immer schließen"
 xccc.1001.e.tt:0 "Entfernt die aktive Korruptionspolitik und blendet diese Entscheidung für diesen Charakter dauerhaft aus."
