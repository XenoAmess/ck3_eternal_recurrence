l_spanish:
 xccc_corruption_policy_decision:0 "Adoptar una política de corrupción"
 xccc_corruption_policy_decision_desc:0 "El cargo ofrece oportunidades que nunca aparecen en las cuentas oficiales. Puedo elegir cuántos ingresos desviar o retirarme antes de que los libros llamen la atención."
 xccc_corruption_policy_decision_tooltip:0 "Elige una política de corrupción permanente para este funcionario"
 xccc_corruption_policy_decision_confirm:0 "Revisar las cuentas"
 xccc_corruption_policy_effect_tooltip:0 "Elige cuántos impuestos retener a tu señor. Las políticas corruptas producen [barter_goods|E], pero reducen [merit|E] y la opinión pública."

 trait_xccc_corruption_1:0 "Oportunista mezquino"
 trait_xccc_corruption_1_desc:0 "Este personaje reduce su tasa de impuesto celestial en 5 puntos porcentuales y cultiva un flujo discreto de bienes de trueque."
 trait_xccc_corruption_1_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] reduce la tasa de impuesto celestial en 5 puntos porcentuales manteniendo las apariencias."
 trait_xccc_corruption_2:0 "Especulador calculador"
 trait_xccc_corruption_2_desc:0 "Este personaje reduce su tasa de impuesto celestial en 10 puntos porcentuales, intercambiando confianza pública por beneficios privados."
 trait_xccc_corruption_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] reduce la tasa de impuesto celestial en 10 puntos porcentuales."
 trait_xccc_corruption_3:0 "Malversador insaciable"
 trait_xccc_corruption_3_desc:0 "Este personaje reduce su tasa de impuesto celestial en 15 puntos porcentuales y ha tejido la corrupción en una red política duradera."
 trait_xccc_corruption_3_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] reduce la tasa de impuesto celestial en 15 puntos porcentuales mediante una red de favores."
 trait_xccc_corruption_4:0 "Magnate corrupto"
 trait_xccc_corruption_4_desc:0 "Este personaje reduce su tasa de impuesto celestial en 25 puntos porcentuales, enriqueciendo una vasta red privada mientras el Estado y los condados soportan el coste."
 trait_xccc_corruption_4_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] reduce la tasa de impuesto celestial en 25 puntos porcentuales sin reparos."

 xccc.1001.t:0 "Cuentas en la encrucijada"
 xccc.1001.desc:0 "Ostentar un cargo es guiar una barca por un río cenagoso. El agua clara da poco sustento; demasiado barro hunde el casco. Los libros pueden ocultar un desvío calculado —o una fortuna—, pero cada moneda que falta deja rastro.\n\n¿Cómo he de llevar mis asuntos?"
 xccc.1001.a:0 "Mantener el desvío discreto"
 xccc.1001.a.tt:0 "Reduce la tasa de impuesto celestial en 5 puntos porcentuales y otorga una modesta producción de trueque."
 xccc.1001.b:0 "Hacer del beneficio una costumbre"
 xccc.1001.b.tt:0 "Reduce la tasa de impuesto celestial en 10 puntos porcentuales y acepta mayores penalizaciones de opinión pública y mérito."
 xccc.1001.c:0 "Atrapar el cargo en una red de favores"
 xccc.1001.c.tt:0 "Reduce la tasa de impuesto celestial en 15 puntos porcentuales y crea una red lucrativa."
 xccc.1001.d:0 "Tomar todo lo que el cargo pueda soportar"
 xccc.1001.d.tt:0 "Reduce la tasa de impuesto celestial en 25 puntos porcentuales a cambio de la máxima producción de trueque y severas penalizaciones."
 xccc.1001.f:0 "Apartarse por ahora"
 xccc.1001.f.tt:0 "Elimina la política de corrupción activa. La decisión vuelve tras su tiempo de reutilización."
 xccc.1001.e:0 "Cerrar estos libros para siempre"
 xccc.1001.e.tt:0 "Elimina la política de corrupción activa y oculta esta decisión de forma permanente para este personaje."
