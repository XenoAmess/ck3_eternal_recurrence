l_russian:
 xccc_corruption_policy_decision:0 "Установить политику казнокрадства"
 xccc_corruption_policy_decision_desc:0 "Должность открывает возможности, которых нет в официальных книгах. Я могу решить, сколько доходов утаить, или отойти в сторону, прежде чем счета привлекут внимание."
 xccc_corruption_policy_decision_tooltip:0 "Выберите постоянную политику казнокрадства для этого чиновника"
 xccc_corruption_policy_decision_confirm:0 "Проверить отчёты"
 xccc_corruption_policy_effect_tooltip:0 "Выберите, сколько налогов утаить от сюзерена. Коррупционная политика приносит [barter_goods|E], но снижает [merit|E] и народное одобрение."

 trait_xccc_corruption_1:0 "Мелкий приспособленец"
 trait_xccc_corruption_1_desc:0 "Этот персонаж снижает ставку мандатного налога на 5 процентных пунктов и заводит скрытый поток меновых товаров."
 trait_xccc_corruption_1_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] снижает ставку мандатного налога на 5 процентных пунктов, сохраняя видимость благопристойности."
 trait_xccc_corruption_2:0 "Расчётливый стяжатель"
 trait_xccc_corruption_2_desc:0 "Этот персонаж снижает ставку мандатного налога на 10 процентных пунктов, обменивая народное доверие на личную выгоду."
 trait_xccc_corruption_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] снижает ставку мандатного налога на 10 процентных пунктов."
 trait_xccc_corruption_3:0 "Ненасытный мздоимец"
 trait_xccc_corruption_3_desc:0 "Этот персонаж снижает ставку мандатного налога на 15 процентных пунктов и сплёл казнокрадство в прочную политическую сеть."
 trait_xccc_corruption_3_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] снижает ставку мандатного налога на 15 процентных пунктов через паутину услуг."
 trait_xccc_corruption_4:0 "Продажный вельможа"
 trait_xccc_corruption_4_desc:0 "Этот персонаж снижает ставку мандатного налога на 25 процентных пунктов, обогащая обширную частную сеть за счёт казны и графств."
 trait_xccc_corruption_4_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] без удержу снижает ставку мандатного налога на 25 процентных пунктов."

 xccc.1001.t:0 "Счета на распутье"
 xccc.1001.desc:0 "Быть у власти — всё равно что вести ладью по илистой реке. Прозрачная вода почти не кормит, а избыток ила утащит судно на дно. В книгах можно скрыть и скромный отвод средств, и целое состояние, но каждая недостающая монета оставляет след.\n\nКак мне вести свои дела?"
 xccc.1001.a:0 "Сохранить отвод средств в тайне"
 xccc.1001.a.tt:0 "Снизить ставку мандатного налога на 5 процентных пунктов и получить небольшой прирост производства меновых товаров."
 xccc.1001.b:0 "Сделать наживу привычкой"
 xccc.1001.b.tt:0 "Снизить ставку мандатного налога на 10 процентных пунктов и принять более сильные штрафы к народному одобрению и заслугам."
 xccc.1001.c:0 "Опутать должность сетью услуг"
 xccc.1001.c.tt:0 "Снизить ставку мандатного налога на 15 процентных пунктов и выстроить доходную сеть."
 xccc.1001.d:0 "Забрать всё, что должность может вынести"
 xccc.1001.d.tt:0 "Снизить ставку мандатного налога на 25 процентных пунктов ради максимального производства меновых товаров и тяжких штрафов."
 xccc.1001.f:0 "Отступить на время"
 xccc.1001.f.tt:0 "Отменить активную политику коррупции. Решение вернётся после периода восстановления."
 xccc.1001.e:0 "Закрыть эти книги навсегда"
 xccc.1001.e.tt:0 "Отменить активную политику коррупции и навсегда скрыть это решение для данного персонажа."
