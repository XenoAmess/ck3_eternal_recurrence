l_japanese:
 xccc_corruption_policy_decision:0 "汚職方針を採用"
 xccc_corruption_policy_decision_desc:0 "官職には、公式の帳簿には決して現れない機会がある。どれほどの収入を横流しするか、あるいは帳簿が人目を引く前に手を引くかを選べる。"
 xccc_corruption_policy_decision_tooltip:0 "この官吏に継続して適用する汚職方針を選ぶ"
 xccc_corruption_policy_decision_confirm:0 "帳簿を確認する"
 xccc_corruption_policy_effect_tooltip:0 "主君への税をどれほど差し引くか選ぶ。汚職方針は[barter_goods|E]を生むが、[merit|E]と民衆の評価を損なう。"

 trait_xccc_corruption_1:0 "小賢しい日和見主義者"
 trait_xccc_corruption_1_desc:0 "この人物は天朝制の税率を5ポイント引き下げ、密かに物々交換品の流れを育てている。"
 trait_xccc_corruption_1_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip]は体面を保ちながら、天朝制の税率を5ポイント引き下げる。"
 trait_xccc_corruption_2:0 "計算高い利得屋"
 trait_xccc_corruption_2_desc:0 "この人物は天朝制の税率を10ポイント引き下げ、民衆の信頼を私的な利益と引き換えにする。"
 trait_xccc_corruption_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip]は天朝制の税率を10ポイント引き下げる。"
 trait_xccc_corruption_3:0 "飽くなき収賄者"
 trait_xccc_corruption_3_desc:0 "この人物は天朝制の税率を15ポイント引き下げ、汚職を永続的な政治網へと織り上げている。"
 trait_xccc_corruption_3_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip]は恩顧の網によって天朝制の税率を15ポイント引き下げる。"
 trait_xccc_corruption_4:0 "腐敗した大物"
 trait_xccc_corruption_4_desc:0 "この人物は天朝制の税率を25ポイント引き下げ、国家と伯爵領に代償を負わせながら巨大な私的ネットワークを潤す。"
 trait_xccc_corruption_4_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip]は歯止めなく天朝制の税率を25ポイント引き下げる。"

 xccc.1001.t:0 "岐路の帳簿"
 xccc.1001.desc:0 "官に就くとは、泥に満ちた川で船を操るようなものだ。清らかな水では実りが乏しく、泥が多すぎれば船体は水底へ引き込まれる。帳簿には慎ましい横領も、ひと財産も隠せようが、欠けた硬貨の一つ一つが必ず痕跡を残す。\n\n今後、どのように務めを果たすべきだろうか？"
 xccc.1001.a:0 "横領は控えめにする"
 xccc.1001.a.tt:0 "天朝制の税率を5ポイント引き下げ、少量の物々交換品を生産する。"
 xccc.1001.b:0 "利益を習慣にする"
 xccc.1001.b.tt:0 "天朝制の税率を10ポイント引き下げ、民衆の評価と功徳へのより重いペナルティを受け入れる。"
 xccc.1001.c:0 "恩顧の網で官職を縛る"
 xccc.1001.c.tt:0 "天朝制の税率を15ポイント引き下げ、利益を生む人脈を築く。"
 xccc.1001.d:0 "官職が耐えうるすべてを奪う"
 xccc.1001.d.tt:0 "天朝制の税率を25ポイント引き下げ、物々交換品の生産を最大化する代わりに厳しいペナルティを受ける。"
 xccc.1001.f:0 "今は身を引く"
 xccc.1001.f.tt:0 "現在の汚職方針を解除する。クールダウン後、この決断は再び利用できる。"
 xccc.1001.e:0 "この帳簿を永久に閉じる"
 xccc.1001.e.tt:0 "現在の汚職方針を解除し、この人物にはこの決断を永久に表示しない。"
