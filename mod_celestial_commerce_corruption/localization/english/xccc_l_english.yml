l_english:
 xccc_corruption_policy_decision:0 "Adopt a Corruption Policy"
 xccc_corruption_policy_decision_desc:0 "Office offers opportunities that never appear in the official accounts. I may choose how much revenue to divert, or step away before the books draw attention."
 xccc_corruption_policy_decision_tooltip:0 "Choose an ongoing corruption policy for this official"
 xccc_corruption_policy_decision_confirm:0 "Review the accounts"
 xccc_corruption_policy_effect_tooltip:0 "Choose how much tax to withhold from your liege. Corrupt policies produce [barter_goods|E], but reduce [merit|E] and public opinion."

 trait_xccc_corruption_1:0 "Petty Opportunist"
 trait_xccc_corruption_1_desc:0 "This character cuts their celestial tax rate by 5 percentage points and cultivates a discreet flow of barter goods."
 trait_xccc_corruption_1_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] cuts the celestial tax rate by 5 percentage points while keeping up appearances."
 trait_xccc_corruption_2:0 "Calculating Profiteer"
 trait_xccc_corruption_2_desc:0 "This character cuts their celestial tax rate by 10 percentage points, trading public trust for private opportunity."
 trait_xccc_corruption_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] cuts the celestial tax rate by 10 percentage points."
 trait_xccc_corruption_3:0 "Insatiable Grafter"
 trait_xccc_corruption_3_desc:0 "This character cuts their celestial tax rate by 15 percentage points and has woven corruption into a durable political network."
 trait_xccc_corruption_3_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] cuts the celestial tax rate by 15 percentage points through a web of favors."
 trait_xccc_corruption_4:0 "Corrupt Grandee"
 trait_xccc_corruption_4_desc:0 "This character cuts their celestial tax rate by 25 percentage points, enriching a vast private network while the state and counties bear the cost."
 trait_xccc_corruption_4_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] cuts the celestial tax rate by 25 percentage points without restraint."

 xccc.1001.t:0 "Accounts at the Crossroads"
 xccc.1001.desc:0 "To hold office is to guide a boat through a silty river. Clear water yields little nourishment; too much mud drags the hull under. The ledgers can conceal a measured diversion—or a fortune—yet every missing coin leaves a trace.\n\nHow shall I conduct my affairs?"
 xccc.1001.a:0 "Keep the diversion discreet"
 xccc.1001.a.tt:0 "Cut the celestial tax rate by 5 percentage points and gain modest barter production."
 xccc.1001.b:0 "Make profit a habit"
 xccc.1001.b.tt:0 "Cut the celestial tax rate by 10 percentage points and accept stronger public and merit penalties."
 xccc.1001.c:0 "Bind the office in a web of favors"
 xccc.1001.c.tt:0 "Cut the celestial tax rate by 15 percentage points and build a lucrative network."
 xccc.1001.d:0 "Take everything the office can bear"
 xccc.1001.d.tt:0 "Cut the celestial tax rate by 25 percentage points for maximum barter production and severe penalties."
 xccc.1001.f:0 "Step back for now"
 xccc.1001.f.tt:0 "Remove the active corruption policy. The decision returns after its cooldown."
 xccc.1001.e:0 "Close these books forever"
 xccc.1001.e.tt:0 "Remove the active corruption policy and permanently hide this decision for this character."
