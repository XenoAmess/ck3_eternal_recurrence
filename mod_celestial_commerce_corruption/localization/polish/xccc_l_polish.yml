l_polish:
 xccc_corruption_policy_decision:0 "Przyjmij politykę korupcji"
 xccc_corruption_policy_decision_desc:0 "Urząd otwiera możliwości, które nigdy nie trafiają do oficjalnych ksiąg. Mogę zdecydować, ile dochodu przekierować, albo wycofać się, zanim rachunki zwrócą uwagę."
 xccc_corruption_policy_decision_tooltip:0 "Wybierz stałą politykę korupcji dla tego urzędnika"
 xccc_corruption_policy_decision_confirm:0 "Przejrzyj księgi"
 xccc_corruption_policy_effect_tooltip:0 "Wybierz, jaką część podatków zatrzymać przed swoim seniorem. Polityka korupcji zapewnia [barter_goods|E], lecz obniża [merit|E] i opinię publiczną."

 trait_xccc_corruption_1:0 "Drobny karierowicz"
 trait_xccc_corruption_1_desc:0 "Ta postać obniża niebiańską stawkę podatkową o 5 punktów procentowych i dyskretnie gromadzi towary wymienne."
 trait_xccc_corruption_1_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] obniża niebiańską stawkę podatkową o 5 punktów procentowych, zachowując pozory."
 trait_xccc_corruption_2:0 "Wyrachowany spekulant"
 trait_xccc_corruption_2_desc:0 "Ta postać obniża niebiańską stawkę podatkową o 10 punktów procentowych, wymieniając zaufanie publiczne na prywatne korzyści."
 trait_xccc_corruption_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] obniża niebiańską stawkę podatkową o 10 punktów procentowych."
 trait_xccc_corruption_3:0 "Nienasycony aferzysta"
 trait_xccc_corruption_3_desc:0 "Ta postać obniża niebiańską stawkę podatkową o 15 punktów procentowych i wplotła korupcję w trwałą sieć polityczną."
 trait_xccc_corruption_3_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] obniża niebiańską stawkę podatkową o 15 punktów procentowych dzięki sieci przysług."
 trait_xccc_corruption_4:0 "Skorumpowany wielmoża"
 trait_xccc_corruption_4_desc:0 "Ta postać obniża niebiańską stawkę podatkową o 25 punktów procentowych, wzbogacając rozległą prywatną sieć, podczas gdy państwo i hrabstwa ponoszą koszty."
 trait_xccc_corruption_4_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] bez skrupułów obniża niebiańską stawkę podatkową o 25 punktów procentowych."

 xccc.1001.t:0 "Rachunki na rozdrożu"
 xccc.1001.desc:0 "Sprawowanie urzędu przypomina prowadzenie łodzi po mulistej rzece. Czysta woda daje mało pożywienia; zbyt wiele mułu wciąga kadłub pod wodę. Księgi mogą skrywać umiarkowane sprzeniewierzenie — albo fortunę — lecz każda brakująca moneta zostawia ślad.\n\nJak mam prowadzić swoje sprawy?"
 xccc.1001.a:0 "Zachowaj dyskrecję"
 xccc.1001.a.tt:0 "Obniż niebiańską stawkę podatkową o 5 punktów procentowych i zyskaj niewielką produkcję towarów wymiennych."
 xccc.1001.b:0 "Uczyń zysk nawykiem"
 xccc.1001.b.tt:0 "Obniż niebiańską stawkę podatkową o 10 punktów procentowych i przyjmij większe kary do opinii publicznej i zasług."
 xccc.1001.c:0 "Opleć urząd siecią przysług"
 xccc.1001.c.tt:0 "Obniż niebiańską stawkę podatkową o 15 punktów procentowych i zbuduj dochodową sieć."
 xccc.1001.d:0 "Weź wszystko, co urząd może unieść"
 xccc.1001.d.tt:0 "Obniż niebiańską stawkę podatkową o 25 punktów procentowych, aby uzyskać maksymalną produkcję towarów wymiennych, kosztem dotkliwych kar."
 xccc.1001.f:0 "Na razie się wycofaj"
 xccc.1001.f.tt:0 "Usuń aktywną politykę korupcji. Decyzja powróci po zakończeniu czasu odnowienia."
 xccc.1001.e:0 "Zamknij te księgi na zawsze"
 xccc.1001.e.tt:0 "Usuń aktywną politykę korupcji i trwale ukryj tę decyzję dla tej postaci."
