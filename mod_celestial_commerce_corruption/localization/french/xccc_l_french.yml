l_french:
 xccc_corruption_policy_decision:0 "Adopter une politique de corruption"
 xccc_corruption_policy_decision_desc:0 "La charge offre des occasions qui n'apparaissent jamais dans les comptes officiels. Je peux choisir combien de revenus détourner, ou me retirer avant que les livres n'attirent l'attention."
 xccc_corruption_policy_decision_tooltip:0 "Choisir une politique de corruption durable pour ce fonctionnaire"
 xccc_corruption_policy_decision_confirm:0 "Vérifier les comptes"
 xccc_corruption_policy_effect_tooltip:0 "Choisir combien d'impôts ne pas verser à votre suzerain. Les politiques corrompues produisent des [barter_goods|E], mais réduisent le [merit|E] et l'opinion publique."

 trait_xccc_corruption_1:0 "Opportuniste mesquin"
 trait_xccc_corruption_1_desc:0 "Ce personnage réduit son taux d'imposition céleste de 5 points de pourcentage et cultive un flux discret de biens de troc."
 trait_xccc_corruption_1_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] réduit le taux d'imposition céleste de 5 points de pourcentage tout en soignant les apparences."
 trait_xccc_corruption_2:0 "Profiteur calculateur"
 trait_xccc_corruption_2_desc:0 "Ce personnage réduit son taux d'imposition céleste de 10 points de pourcentage, échangeant la confiance publique contre des avantages privés."
 trait_xccc_corruption_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] réduit le taux d'imposition céleste de 10 points de pourcentage."
 trait_xccc_corruption_3:0 "Concussionnaire insatiable"
 trait_xccc_corruption_3_desc:0 "Ce personnage réduit son taux d'imposition céleste de 15 points de pourcentage et a fait de la corruption un réseau politique durable."
 trait_xccc_corruption_3_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] réduit le taux d'imposition céleste de 15 points de pourcentage grâce à un réseau de faveurs."
 trait_xccc_corruption_4:0 "Grand corrompu"
 trait_xccc_corruption_4_desc:0 "Ce personnage réduit son taux d'imposition céleste de 25 points de pourcentage, enrichissant un vaste réseau privé tandis que l'État et les comtés en supportent le coût."
 trait_xccc_corruption_4_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] réduit le taux d'imposition céleste de 25 points de pourcentage sans retenue."

 xccc.1001.t:0 "Comptes à la croisée des chemins"
 xccc.1001.desc:0 "Exercer une charge, c'est guider une embarcation sur un fleuve limoneux. Une eau claire nourrit peu ; trop de vase entraîne la coque vers le fond. Les registres peuvent dissimuler un détournement mesuré — ou une fortune — pourtant chaque pièce absente laisse une trace.\n\nComment dois-je mener mes affaires ?"
 xccc.1001.a:0 "Garder le détournement discret"
 xccc.1001.a.tt:0 "Réduire le taux d'imposition céleste de 5 points de pourcentage et obtenir une modeste production de troc."
 xccc.1001.b:0 "Faire du profit une habitude"
 xccc.1001.b.tt:0 "Réduire le taux d'imposition céleste de 10 points de pourcentage et accepter de plus fortes pénalités d'opinion publique et de mérite."
 xccc.1001.c:0 "Lier la charge dans une toile de faveurs"
 xccc.1001.c.tt:0 "Réduire le taux d'imposition céleste de 15 points de pourcentage et bâtir un réseau lucratif."
 xccc.1001.d:0 "Prendre tout ce que la charge peut supporter"
 xccc.1001.d.tt:0 "Réduire le taux d'imposition céleste de 25 points de pourcentage pour une production de troc maximale et de sévères pénalités."
 xccc.1001.f:0 "Prendre du recul pour l'instant"
 xccc.1001.f.tt:0 "Supprimer la politique de corruption active. La décision réapparaît après son délai de récupération."
 xccc.1001.e:0 "Fermer ces livres à jamais"
 xccc.1001.e.tt:0 "Supprimer la politique de corruption active et masquer définitivement cette décision pour ce personnage."
