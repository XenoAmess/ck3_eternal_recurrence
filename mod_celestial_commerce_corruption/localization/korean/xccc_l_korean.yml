l_korean:
 xccc_corruption_policy_decision:0 "부패 방침 채택"
 xccc_corruption_policy_decision_desc:0 "관직에는 공식 장부에 결코 드러나지 않는 기회가 있다. 얼마만큼의 세입을 빼돌릴지 정할 수도 있고, 장부가 이목을 끌기 전에 손을 뗄 수도 있다."
 xccc_corruption_policy_decision_tooltip:0 "이 관리에게 지속적으로 적용할 부패 방침을 선택"
 xccc_corruption_policy_decision_confirm:0 "장부 검토"
 xccc_corruption_policy_effect_tooltip:0 "주군에게 낼 세금을 얼마나 덜 낼지 선택한다. 부패 방침은 [barter_goods|E]을 생산하지만 [merit|E]과 민중의 평가를 떨어뜨린다."

 trait_xccc_corruption_1:0 "소심한 기회주의자"
 trait_xccc_corruption_1_desc:0 "이 인물은 천조 세율을 5%포인트 낮추고 은밀하게 물물 교환 상품의 흐름을 가꾼다."
 trait_xccc_corruption_1_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip](은)는 체면을 유지하면서 천조 세율을 5%포인트 낮춘다."
 trait_xccc_corruption_2:0 "계산적인 모리배"
 trait_xccc_corruption_2_desc:0 "이 인물은 천조 세율을 10%포인트 낮추고 민중의 신뢰를 사적인 이익과 맞바꾼다."
 trait_xccc_corruption_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip](은)는 천조 세율을 10%포인트 낮춘다."
 trait_xccc_corruption_3:0 "탐욕스러운 수뢰자"
 trait_xccc_corruption_3_desc:0 "이 인물은 천조 세율을 15%포인트 낮추고 부패를 지속적인 정치망으로 엮었다."
 trait_xccc_corruption_3_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip](은)는 청탁의 그물을 통해 천조 세율을 15%포인트 낮춘다."
 trait_xccc_corruption_4:0 "부패한 권세가"
 trait_xccc_corruption_4_desc:0 "이 인물은 천조 세율을 25%포인트 낮추고 국가와 영지가 대가를 치르게 하면서 거대한 사적 조직을 살찌운다."
 trait_xccc_corruption_4_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip](은)는 거리낌 없이 천조 세율을 25%포인트 낮춘다."

 xccc.1001.t:0 "갈림길에 선 장부"
 xccc.1001.desc:0 "관직을 맡는다는 것은 진흙이 쌓인 강에서 배를 모는 것과 같다. 맑은 물에서는 얻을 것이 적지만, 진흙이 너무 많으면 선체가 가라앉는다. 장부에는 절제된 횡령도, 막대한 재산도 숨길 수 있으나 사라진 동전 하나하나가 흔적을 남긴다.\n\n앞으로 일을 어떻게 처리해야 할까?"
 xccc.1001.a:0 "횡령을 은밀하게 유지한다"
 xccc.1001.a.tt:0 "천조 세율을 5%포인트 낮추고 소량의 물물 교환 상품을 생산한다."
 xccc.1001.b:0 "이익을 습관으로 삼는다"
 xccc.1001.b.tt:0 "천조 세율을 10%포인트 낮추고 민중의 평가와 공덕에 더 큰 불이익을 받는다."
 xccc.1001.c:0 "관직을 청탁의 그물로 얽는다"
 xccc.1001.c.tt:0 "천조 세율을 15%포인트 낮추고 수익성 높은 인맥을 구축한다."
 xccc.1001.d:0 "관직이 버틸 수 있는 모든 것을 취한다"
 xccc.1001.d.tt:0 "천조 세율을 25%포인트 낮춰 물물 교환 상품 생산을 극대화하는 대신 심각한 불이익을 받는다."
 xccc.1001.f:0 "당분간 물러선다"
 xccc.1001.f.tt:0 "현재 부패 방침을 제거한다. 재사용 대기시간이 끝나면 이 결단을 다시 이용할 수 있다."
 xccc.1001.e:0 "이 장부를 영원히 덮는다"
 xccc.1001.e.tt:0 "현재 부패 방침을 제거하고 이 인물에게서 이 결단을 영구히 숨긴다."
