l_korean:
 enable_auto_build:0 "자동 건설 활성화"
 enable_auto_build_tooltip:0 "자동 건설 활성화"
 enable_auto_build_desc:0 "자동 건설 기능을 활성화합니다."
 enable_auto_build_text:0 "15일마다 직접 보유한 영지에 이미 존재하고 다음 단계가 있으며 조건을 충족하는 각 건물 연쇄가 한 단계씩 업그레이드됩니다.\n금화는 이 결정에서 선택한 자금 정책에 따라 지급되며, 단일 비용이 국고와 개인 금화로 분할되지 않습니다.\n업그레이드에는 할인 없는 CK3 1.19.0.6 기본 비용이 적용되며 즉시 완료됩니다.\n성채·도시·사원·부족·Mandala 사원 성채 영지의 주요·일반·공작령·특수 건물을 지원합니다. 건설 중인 영지, 모든 거처, 유목민 및 목축민 영지, Mandala Capital Great Project, 최종 단계 건물은 대상에서 제외됩니다."
 enable_auto_build_confirm:0 "물론입니다"
 enable_auto_build_choose_funding_button:0 "자금 출처 선택"
 aub_funding_treasury_only:0 "국고만 사용"
 aub_funding_treasury_only_desc:0 "국고에서만 금화를 지불합니다. 사용 가능한 국고가 없거나 전체 비용을 충당할 수 없으면 개인 금화를 사용하지 않고 업그레이드를 건너뜁니다."
 aub_funding_personal_only:0 "개인 금화만 사용"
 aub_funding_personal_only_desc:0 "개인 자금에서만 금화를 지불합니다. 개인 금화로 전체 비용을 충당할 수 없으면 국고를 사용하지 않고 업그레이드를 건너뜁니다."
 aub_funding_treasury_first:0 "국고 우선"
 aub_funding_treasury_first_desc:0 "국고로 전체 비용을 충당할 수 있으면 국고를 사용하고, 그렇지 않으면 개인 금화로 전체 비용을 지불합니다. 두 출처는 절대 합쳐지지 않습니다."
 disable_auto_build:0 "자동 건설 비활성화"
 disable_auto_build_tooltip:0 "자동 건설 비활성화"
 disable_auto_build_desc:0 "자동 건설 기능을 중단합니다."
 disable_auto_build_text:0 "자동 건설을 중단하고 자금 정책을 초기화합니다. 이미 대기 중인 검사는 부작용 없이 실행됩니다. 다시 활성화하여 새로운 자금 출처를 선택하세요."
 disable_auto_build_confirm:0 "물론입니다"
