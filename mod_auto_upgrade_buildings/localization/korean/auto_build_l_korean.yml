 aub_policy_treasury_first_continue_desc:0 "국고로 전체 비용을 충당할 수 있으면 국고를 사용하고, 그렇지 않으면 개인 금화로 전체 비용을 지불합니다. 직할령 한도를 초과해도 자동 건설을 계속합니다."
 aub_over_domain_pause_desc:0 "직할령 한도를 초과한 동안 전체 자동 건설 처리를 일시 중지합니다. 반복은 계속되며 한도 내로 돌아오면 자동으로 재개됩니다."
 aub_over_domain_continue_desc:0 "직할령 한도를 초과해도 자동 건설을 계속합니다."
 disable_auto_build:0 "자동 건설 비활성화"
 disable_auto_build_tooltip:0 "자동 건설 비활성화"
 disable_auto_build_desc:0 "자동 건설 기능을 중단합니다."
 disable_auto_build_text:0 "자동 건설을 중단하고 자금 및 직할령 한도 정책을 초기화합니다. 이미 대기 중인 검사는 부작용 없이 실행됩니다. 다시 활성화하여 새 정책을 선택하세요."
