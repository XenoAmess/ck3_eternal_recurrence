 enable_auto_build_desc:0 "자동 건설 기능을 활성화합니다."
 enable_auto_build_text:0 "15일마다 직접 보유한 영지에 이미 존재하고 다음 단계가 있으며 조건을 충족하는 각 건물 연쇄가 한 단계씩 업그레이드됩니다.\n왕국 금고를 먼저 사용하며, 금고로 비용을 충당할 수 없을 때만 개인 금화를 사용합니다. 필요한 자원이 부족하면 업그레이드를 건너뜁니다.\n업그레이드에는 할인 없는 CK3 1.19.0.6 기본 비용이 적용되며 즉시 완료됩니다.\n성채·도시·사원·부족·Mandala 사원 성채 영지의 주요·일반·공작령·특수 건물을 지원합니다. 건설 중인 영지, 모든 거처, 유목민 및 목축민 영지, Mandala Capital Great Project, 최종 단계 건물은 대상에서 제외됩니다."
 enable_auto_build_confirm:0 "물론입니다"
