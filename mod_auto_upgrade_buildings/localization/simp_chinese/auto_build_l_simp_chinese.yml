 aub_policy_personal_only_pause_choice_tooltip:0 "只使用个人金钱；个人金钱不足就跳过。超出直辖上限时暂停整轮修建。"
 aub_policy_personal_only_pause_confirm:0 "将启用自动建造：金币只由个人金钱全额支付，余额不足就跳过；超出直辖上限时暂停整轮修建，回到上限内后自动恢复。"
