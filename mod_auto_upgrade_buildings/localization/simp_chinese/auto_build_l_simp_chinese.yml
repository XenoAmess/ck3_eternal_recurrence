 enable_auto_build_text:0 "开启后，系统每隔15天检查你的直辖地产，并将每条符合条件、已有下一等级的建筑链提升一级。\n升级优先花费国库，国库不足时才花费个人金钱；所需资源不足则跳过。\n费用采用CK3 1.19.0.6原版基础费用，不受减免影响，升级瞬间完成。\n支持城堡、城市、神殿、部落和曼荼罗神殿城塞地产中的主建筑、普通建筑、公国建筑与特殊建筑；不会处理正在施工的地产、任何住所、游牧或牧民地产、曼荼罗都城伟大工程以及终级建筑。"
