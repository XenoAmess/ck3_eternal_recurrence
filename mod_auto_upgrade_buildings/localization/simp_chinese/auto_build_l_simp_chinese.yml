 aub_policy_treasury_first_continue_desc:0 "国库足额时优先使用国库，否则尝试个人金钱；即使超出直辖上限也继续自动修建。"
 aub_policy_treasury_first_continue_choice_tooltip:0 "优先使用国库；国库不足时改用个人金钱，绝不拆分付款。即使超出直辖上限也照常修建。"
 aub_policy_treasury_first_continue_confirm:0 "将启用自动建造：金币优先由国库全额支付，国库不足时改由个人金钱全额支付，绝不拆分付款；即使超出直辖上限也照常修建。"
