l_simp_chinese:
 enable_auto_build:0 "启用自动建造"
 enable_auto_build_tooltip:0 "启用自动建造"
 enable_auto_build_desc:0 "启用自动建造功能。"
 enable_auto_build_text:0 "开启后，系统每隔15天检查你的直辖地产，并将每条符合条件、已有下一等级的建筑链提升一级。\n金币按你在决议中选择的资金策略支付；任何一笔费用都不会拆分到国库与个人金钱。你还可以选择超出直辖上限时暂停整轮自动修建，或继续照常修建；暂停不会关闭循环，回到上限内后会自动恢复。\n费用采用CK3 1.19.0.6原版基础费用，不受减免影响，升级瞬间完成。\n支持城堡、城市、神殿、部落和曼荼罗神殿城塞地产中的主建筑、普通建筑、公国建筑与特殊建筑；不会处理正在施工的地产、任何住所、游牧或牧民地产、曼荼罗都城伟大工程以及终级建筑。"
 enable_auto_build_confirm:0 "当然"
 enable_auto_build_choose_policy_button:0 "选择资金与超直辖策略"
 aub_funding_treasury_only:0 "只用国库"
 aub_funding_treasury_only_desc:0 "每次升级只从国库支付金币；国库不存在或不足时直接跳过，不使用个人金钱。"
 aub_funding_personal_only:0 "只用个人金钱"
 aub_funding_personal_only_desc:0 "每次升级只从个人金钱支付金币；个人金钱不足时直接跳过，不使用国库。"
 aub_funding_treasury_first:0 "优先国库"
 aub_funding_treasury_first_desc:0 "国库可完整支付时使用国库；否则尝试由个人金钱完整支付。两者不会合并付款。"
 aub_policy_treasury_only_pause:0 "只用国库｜超直辖暂停"
 aub_policy_treasury_only_pause_desc:0 "每次升级只从国库支付金币；超出直辖上限时暂停整轮自动修建。"
 aub_policy_treasury_only_pause_choice_tooltip:0 "只使用国库；国库不足就跳过。超出直辖上限时暂停整轮修建。"
 aub_policy_treasury_only_pause_confirm:0 "将启用自动建造：金币只由国库全额支付，国库不足就跳过；超出直辖上限时暂停整轮修建，回到上限内后自动恢复。"
 aub_policy_treasury_only_continue:0 "只用国库｜超直辖继续"
 aub_policy_treasury_only_continue_desc:0 "每次升级只从国库支付金币；即使超出直辖上限也继续自动修建。"
 aub_policy_treasury_only_continue_choice_tooltip:0 "只使用国库；国库不足就跳过。即使超出直辖上限也照常修建。"
 aub_policy_treasury_only_continue_confirm:0 "将启用自动建造：金币只由国库全额支付，国库不足就跳过；即使超出直辖上限也照常修建。"
 aub_policy_personal_only_pause:0 "只用个人｜超直辖暂停"
