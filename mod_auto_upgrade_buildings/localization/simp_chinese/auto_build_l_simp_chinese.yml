 enable_auto_build:0 "启用自动建造"
 enable_auto_build_tooltip:0 "启用自动建造"
 enable_auto_build_desc:0 "启用自动建造功能。"
 enable_auto_build_text:0 "开启后，系统每隔15天检查你的直辖地产，并将每条符合条件、已有下一等级的建筑链提升一级。\n金币按你在决议中选择的资金策略支付；任何一笔费用都不会拆分到国库与个人金钱。\n费用采用CK3 1.19.0.6原版基础费用，不受减免影响，升级瞬间完成。\n支持城堡、城市、神殿、部落和曼荼罗神殿城塞地产中的主建筑、普通建筑、公国建筑与特殊建筑；不会处理正在施工的地产、任何住所、游牧或牧民地产、曼荼罗都城伟大工程以及终级建筑。"
 enable_auto_build_confirm:0 "当然"
 enable_auto_build_choose_funding_button:0 "选择资金来源"
 aub_funding_treasury_only:0 "只用国库"
 aub_funding_treasury_only_desc:0 "每次升级只从国库支付金币；国库不存在或不足时直接跳过，不使用个人金钱。"
 aub_funding_personal_only:0 "只用个人金钱"
 aub_funding_personal_only_desc:0 "每次升级只从个人金钱支付金币；个人金钱不足时直接跳过，不使用国库。"
 aub_funding_treasury_first:0 "优先国库"
 aub_funding_treasury_first_desc:0 "国库可完整支付时使用国库；否则尝试由个人金钱完整支付。两者不会合并付款。"
 disable_auto_build:0 "禁用自动建造"
 disable_auto_build_tooltip:0 "禁用自动建造"
 disable_auto_build_desc:0 "停止自动建造功能。"
 disable_auto_build_text:0 "停止自动建造并清除资金策略；已经排队的检查到达时不会产生副作用。重新启用时可以选择新的资金来源。"
