 aub_policy_treasury_only_continue_desc:0 "Оплачивать золото только из казны державы. Продолжать автостроительство даже при превышении лимита домена."
 aub_policy_treasury_only_continue_choice_tooltip:0 "Использовать только казну державы; пропустить улучшение, если она не покрывает полную стоимость. Продолжать строительство при превышении лимита домена."
