l_russian:
 enable_auto_build:0 "Включить автоматическое строительство"
 enable_auto_build_tooltip:0 "Включить автоматическое строительство"
 enable_auto_build_desc:0 "Включает функцию автоматического строительства."
 enable_auto_build_text:0 "Каждые 15 дней каждая существующая подходящая цепочка построек со следующим уровнем в ваших личных владениях улучшается на один уровень.\nЗолото оплачивается в соответствии с выбранным в этом решении режимом финансирования; одна стоимость никогда не разделяется между казной державы и личным золотом.\nДля улучшений применяется базовая стоимость CK3 1.19.0.6 без скидок, и они завершаются мгновенно.\nПоддерживаются главные, обычные, герцогские и особые постройки в замковых, городских, храмовых, племенных владениях и храмовых цитаделях Mandala. Не затрагиваются владения с текущим строительством, любые резиденции, кочевые и пастушеские владения, Великий проект столицы Mandala и постройки последнего уровня."
 enable_auto_build_confirm:0 "Разумеется"
 enable_auto_build_choose_funding_button:0 "Выбрать источник финансирования"
 aub_funding_treasury_only:0 "Только казна державы"
 aub_funding_treasury_only_desc:0 "Оплачивать золото только из казны державы. Если казна недоступна или её не хватает для полной стоимости, пропустить улучшение без использования личного золота."
 aub_funding_personal_only:0 "Только личное золото"
 aub_funding_personal_only_desc:0 "Оплачивать золото только из личных средств. Если личного золота не хватает для полной стоимости, пропустить улучшение без использования казны державы."
 aub_funding_treasury_first:0 "Сначала казна державы"
 aub_funding_treasury_first_desc:0 "Использовать казну державы, если она покрывает полную стоимость; иначе попытаться оплатить полную стоимость личным золотом. Два источника никогда не объединяются."
 disable_auto_build:0 "Отключить автоматическое строительство"
 disable_auto_build_tooltip:0 "Отключить автоматическое строительство"
 disable_auto_build_desc:0 "Останавливает автоматическое строительство."
 disable_auto_build_text:0 "Останавливает автоматическое строительство и сбрасывает режим финансирования. Уже запланированные проверки выполнятся без каких-либо последствий. Включите снова, чтобы выбрать новый источник финансирования."
 disable_auto_build_confirm:0 "Разумеется"
