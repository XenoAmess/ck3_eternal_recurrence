 enable_auto_build_text:0 "Каждые 15 дней каждая существующая подходящая цепочка построек со следующим уровнем в ваших личных владениях улучшается на один уровень.\nСначала используется казна державы; личное золото расходуется только тогда, когда казна не может покрыть стоимость. Если необходимых ресурсов не хватает, улучшение пропускается.\nДля улучшений применяется базовая стоимость CK3 1.19.0.6 без скидок, и они завершаются мгновенно.\nПоддерживаются главные, обычные, герцогские и особые постройки в замковых, городских, храмовых, племенных владениях и храмовых цитаделях Mandala. Не затрагиваются владения с текущим строительством, любые резиденции, кочевые и пастушеские владения, Mandala Capital Great Project и постройки последнего уровня."
