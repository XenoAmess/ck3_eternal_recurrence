l_russian:
 enable_auto_build:0 "Включить автоматическое строительство"
 enable_auto_build_tooltip:0 "Включить автоматическое строительство"
 enable_auto_build_desc:0 "Включает функцию автоматического строительства."
 enable_auto_build_text:0 "Каждые 15 дней каждая существующая подходящая цепочка построек со следующим уровнем в ваших личных владениях улучшается на один уровень.\nЗолото оплачивается в соответствии с выбранным в этом решении режимом финансирования; одна стоимость никогда не разделяется между казной державы и личным золотом. Можно также приостановить весь проход при превышении лимита домена или продолжить строительство; пауза не останавливает цикл и автоматически снимается после возвращения в пределы лимита.\nДля улучшений применяется базовая стоимость CK3 1.19.0.6 без скидок, и они завершаются мгновенно.\nПоддерживаются главные, обычные, герцогские и особые постройки в замковых, городских, храмовых, племенных владениях и храмовых цитаделях Mandala. Не затрагиваются владения с текущим строительством, любые резиденции, кочевые и пастушеские владения, Великий проект столицы Mandala и постройки последнего уровня."
 enable_auto_build_confirm:0 "Разумеется"
 enable_auto_build_choose_policy_button:0 "Выбрать политику финансирования и домена"
 aub_funding_treasury_only:0 "Только казна державы"
 aub_funding_treasury_only_desc:0 "Оплачивать золото только из казны державы. Если казна недоступна или её не хватает для полной стоимости, пропустить улучшение без использования личного золота."
 aub_funding_personal_only:0 "Только личное золото"
 aub_funding_personal_only_desc:0 "Оплачивать золото только из личных средств. Если личного золота не хватает для полной стоимости, пропустить улучшение без использования казны державы."
 aub_funding_treasury_first:0 "Сначала казна державы"
 aub_funding_treasury_first_desc:0 "Использовать казну державы, если она покрывает полную стоимость; иначе попытаться оплатить полную стоимость личным золотом. Два источника никогда не объединяются."
 aub_policy_treasury_only_pause:0 "Только казна | Пауза при превышении"
 aub_policy_treasury_only_pause_desc:0 "Оплачивать золото только из казны державы. Приостановить весь проход автостроительства при превышении лимита домена."
 aub_policy_treasury_only_pause_choice_tooltip:0 "Использовать только казну державы; пропустить улучшение, если она не покрывает полную стоимость. Приостановить весь цикл при превышении лимита домена."
 aub_policy_treasury_only_pause_confirm:0 "Автостроительство будет использовать только казну державы и пропускать улучшения, которые невозможно оплатить полностью. При превышении лимита домена весь цикл будет приостановлен и автоматически возобновится, как только вы вернётесь в лимит."
