l_french:
 enable_auto_build:0 "Activer la construction automatique"
 enable_auto_build_tooltip:0 "Activer la construction automatique"
 enable_auto_build_desc:0 "Active la fonction de construction automatique."
 enable_auto_build_text:0 "Tous les 15 jours, chaque chaîne de bâtiments existante et éligible disposant d'un niveau supérieur dans les provinces que vous détenez directement gagne un niveau.\nLe trésor du royaume est utilisé en premier ; votre or personnel ne l'est que si le trésor ne couvre pas le coût. Si les ressources requises sont indisponibles, l'amélioration est ignorée.\nLes améliorations utilisent les coûts de base de CK3 1.19.0.6 sans réduction et se terminent instantanément.\nLes bâtiments principaux, ordinaires, de duché et spéciaux sont pris en charge dans les domaines de château, de ville, de temple, tribaux et de citadelle-temple Mandala. Les constructions en cours, tous les domiciles, les domaines nomades et de bergers, le Mandala Capital Great Project et les niveaux terminaux ne sont pas affectés."
 enable_auto_build_confirm:0 "Bien sûr"
 disable_auto_build:0 "Désactiver la construction automatique"
 disable_auto_build_tooltip:0 "Désactiver la construction automatique"
 disable_auto_build_desc:0 "Arrête la fonction de construction automatique."
 disable_auto_build_text:0 "Arrête la construction automatique. Toute vérification déjà programmée s'exécutera sans produire d'effet."
 disable_auto_build_confirm:0 "Bien sûr"
