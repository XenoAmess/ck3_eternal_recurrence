l_french:
 enable_auto_build:0 "Activer la construction automatique"
 enable_auto_build_tooltip:0 "Activer la construction automatique"
 enable_auto_build_desc:0 "Active la fonction de construction automatique."
 enable_auto_build_text:0 "Tous les 15 jours, chaque chaîne de bâtiments existante éligible disposant d'un palier suivant dans vos provinces directement détenues est améliorée d'un niveau.\nL'or est payé selon la politique de financement choisie dans cette décision ; un même coût n'est jamais réparti entre le trésor du royaume et l'or personnel. Vous pouvez aussi mettre en pause toute la passe lorsque vous dépassez votre limite de domaine, ou continuer à construire ; une pause n'arrête pas la boucle et se lève automatiquement dès que vous êtes de nouveau dans la limite.\nLes améliorations utilisent les coûts de base de CK3 1.19.0.6 sans remise et s'achèvent instantanément.\nLes bâtiments principaux, réguliers, de duché et spéciaux sont pris en charge dans les holdings de type château, ville, temple, tribal et citadelle-temple Mandala. Les constructions en cours, tous les domiciles, les holdings nomades et de bergers, le Grand Projet de la Capitale Mandala ainsi que les paliers terminaux ne sont pas affectés."
 enable_auto_build_confirm:0 "Bien sûr"
 enable_auto_build_choose_policy_button:0 "Choisir la politique de financement et de domaine"
 aub_funding_treasury_only:0 "Trésor du royaume uniquement"
 aub_funding_treasury_only_desc:0 "Payer l'or uniquement depuis le trésor du royaume. Si aucun trésor n'est disponible ou s'il ne peut pas couvrir le coût total, ignorer l'amélioration sans utiliser l'or personnel."
 aub_funding_personal_only:0 "Or personnel uniquement"
 aub_funding_personal_only_desc:0 "Payer l'or uniquement depuis les fonds personnels. Si l'or personnel ne peut pas couvrir le coût total, ignorer l'amélioration sans utiliser le trésor du royaume."
 aub_funding_treasury_first:0 "Trésor du royaume en priorité"
 aub_funding_treasury_first_desc:0 "Utiliser le trésor du royaume lorsqu'il peut couvrir le coût total ; sinon, tenter de payer le coût total avec l'or personnel. Les deux sources ne sont jamais combinées."
 aub_policy_treasury_only_pause:0 "Trésor uniquement | Pause au-delà de la limite"
 aub_policy_treasury_only_pause_desc:0 "Payer l'or uniquement depuis le trésor du royaume. Mettre en pause toute la passe de construction automatique lorsque vous dépassez votre limite de domaine."
 aub_policy_treasury_only_pause_choice_tooltip:0 "Utiliser uniquement le trésor du royaume ; ignorer une amélioration s'il ne peut pas couvrir la totalité du coût. Mettre en pause toute la séquence tant que vous dépassez votre limite de domaine."
 aub_policy_treasury_only_pause_confirm:0 "La construction automatique utilisera uniquement le trésor du royaume et ignorera toute amélioration qu'il ne peut pas financer entièrement. Tant que vous dépassez votre limite de domaine, toute la séquence sera mise en pause et reprendra automatiquement une fois la limite respectée."
 aub_policy_treasury_only_continue:0 "Trésor uniquement | Construire au-delà de la limite"
 aub_policy_treasury_only_continue_desc:0 "Payer l'or uniquement depuis le trésor du royaume. Continuer la construction automatique même lorsque vous dépassez votre limite de domaine."
 aub_policy_treasury_only_continue_choice_tooltip:0 "Utiliser uniquement le trésor du royaume ; ignorer une amélioration s'il ne peut pas couvrir la totalité du coût. Continuer la construction même en dépassant votre limite de domaine."
 aub_policy_treasury_only_continue_confirm:0 "La construction automatique utilisera uniquement le trésor du royaume et ignorera toute amélioration qu'il ne peut pas financer entièrement. La construction se poursuivra même si vous dépassez votre limite de domaine."
 aub_policy_personal_only_pause:0 "Personnel uniquement | Pause au-delà de la limite"
 aub_policy_personal_only_pause_desc:0 "Payer l'or uniquement depuis les fonds personnels. Mettre en pause toute la passe de construction automatique lorsque vous dépassez votre limite de domaine."
 aub_policy_personal_only_pause_choice_tooltip:0 "Utiliser uniquement l'or personnel ; ignorer une amélioration s'il ne peut pas couvrir la totalité du coût. Mettre en pause toute la séquence tant que vous dépassez votre limite de domaine."
 aub_policy_personal_only_pause_confirm:0 "La construction automatique utilisera uniquement l'or personnel et ignorera toute amélioration qu'il ne peut pas financer entièrement. Tant que vous dépassez votre limite de domaine, toute la séquence sera mise en pause et reprendra automatiquement une fois la limite respectée."
 aub_policy_personal_only_continue:0 "Personnel uniquement | Construire au-delà de la limite"
 aub_policy_personal_only_continue_desc:0 "Payer l'or uniquement depuis les fonds personnels. Continuer la construction automatique même lorsque vous dépassez votre limite de domaine."
 aub_policy_personal_only_continue_choice_tooltip:0 "Utiliser uniquement l'or personnel ; ignorer une amélioration s'il ne peut pas couvrir la totalité du coût. Continuer la construction même en dépassant votre limite de domaine."
 aub_policy_personal_only_continue_confirm:0 "La construction automatique utilisera uniquement l'or personnel et ignorera toute amélioration qu'il ne peut pas financer entièrement. La construction se poursuivra même si vous dépassez votre limite de domaine."
 aub_policy_treasury_first_pause:0 "Trésor d'abord | Pause au-delà de la limite"
 aub_policy_treasury_first_pause_desc:0 "Utiliser le trésor du royaume s'il peut payer le coût total ; sinon, tenter de payer le coût total avec l'or personnel. Mettre en pause toute la passe de construction automatique lorsque vous dépassez votre limite de domaine."
 aub_policy_treasury_first_pause_choice_tooltip:0 "Utiliser le trésor du royaume en priorité ; s'il est insuffisant, essayer l'or personnel pour la totalité du coût. Ne jamais fractionner un paiement. Mettre en pause toute la séquence tant que vous dépassez votre limite de domaine."
 aub_policy_treasury_first_pause_confirm:0 "La construction automatique facturera la totalité du coût au trésor du royaume en priorité, ou à l'or personnel si le trésor est insuffisant, sans jamais fractionner un paiement. Tant que vous dépassez votre limite de domaine, toute la séquence sera mise en pause et reprendra automatiquement une fois la limite respectée."
 aub_policy_treasury_first_continue:0 "Trésor d'abord | Construire au-delà de la limite"
 aub_policy_treasury_first_continue_desc:0 "Utiliser le trésor du royaume s'il peut payer le coût total ; sinon, tenter de payer le coût total avec l'or personnel. Continuer la construction automatique même lorsque vous dépassez votre limite de domaine."
 aub_policy_treasury_first_continue_choice_tooltip:0 "Utiliser le trésor du royaume en priorité ; s'il est insuffisant, essayer l'or personnel pour la totalité du coût. Ne jamais fractionner un paiement. Continuer la construction même en dépassant votre limite de domaine."
 aub_policy_treasury_first_continue_confirm:0 "La construction automatique facturera la totalité du coût au trésor du royaume en priorité, ou à l'or personnel si le trésor est insuffisant, sans jamais fractionner un paiement. La construction se poursuivra même si vous dépassez votre limite de domaine."
 aub_over_domain_pause_desc:0 "Mettre en pause toute la passe de construction automatique lorsque vous dépassez votre limite de domaine. La boucle continue et reprend automatiquement dès que vous êtes de nouveau dans la limite."
 aub_over_domain_continue_desc:0 "Continuer la construction automatique même lorsque vous dépassez votre limite de domaine."
 disable_auto_build:0 "Désactiver la construction automatique"
 disable_auto_build_tooltip:0 "Désactiver la construction automatique"
 disable_auto_build_desc:0 "Arrête la fonction de construction automatique."
 disable_auto_build_text:0 "Arrêter la construction automatique et effacer les politiques de financement et de limite de domaine. Toute vérification déjà en file d'attente s'exécutera sans effet de bord. Réactivez la décision pour choisir de nouvelles politiques."
 disable_auto_build_confirm:0 "Bien sûr"
