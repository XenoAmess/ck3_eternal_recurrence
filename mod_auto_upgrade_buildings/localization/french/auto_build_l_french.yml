l_french:
 enable_auto_build:0 "Activer la construction automatique"
 enable_auto_build_tooltip:0 "Activer la construction automatique"
 enable_auto_build_desc:0 "Active la fonction de construction automatique."
 enable_auto_build_text:0 "Tous les 15 jours, chaque chaîne de bâtiments existante éligible ayant un palier suivant dans vos provinces directement tenues est améliorée d'un palier.\nL'or est payé selon la politique de financement sélectionnée dans cette décision ; un coût unique n'est jamais réparti entre le trésor du royaume et l'or personnel.\nLes améliorations utilisent les coûts de base de CK3 1.19.0.6 sans réduction et se terminent instantanément.\nLes bâtiments principaux, ordinaires, de duché et spéciaux sont pris en charge dans les domaines de château, de ville, de temple, tribaux et de citadelle-temple Mandala. Les constructions en cours, tous les domiciles, les domaines nomades et de bergers, le grand projet de capitale Mandala et les niveaux terminaux ne sont pas affectés."
 enable_auto_build_confirm:0 "Bien sûr"
 enable_auto_build_choose_funding_button:0 "Choisir la source de financement"
 aub_funding_treasury_only:0 "Trésor du royaume uniquement"
 aub_funding_treasury_only_desc:0 "Payer l'or uniquement depuis le trésor du royaume. Si aucun trésor n'est disponible ou s'il ne peut pas couvrir le coût total, ignorer l'amélioration sans utiliser l'or personnel."
 aub_funding_personal_only:0 "Or personnel uniquement"
 aub_funding_personal_only_desc:0 "Payer l'or uniquement depuis les fonds personnels. Si l'or personnel ne peut pas couvrir le coût total, ignorer l'amélioration sans utiliser le trésor du royaume."
 aub_funding_treasury_first:0 "Trésor du royaume en priorité"
 aub_funding_treasury_first_desc:0 "Utiliser le trésor du royaume lorsqu'il peut couvrir le coût total ; sinon, tenter de payer le coût total avec l'or personnel. Les deux sources ne sont jamais combinées."
 disable_auto_build:0 "Désactiver la construction automatique"
 disable_auto_build_tooltip:0 "Désactiver la construction automatique"
 disable_auto_build_desc:0 "Arrête la fonction de construction automatique."
 disable_auto_build_text:0 "Arrête la construction automatique et efface la politique de financement. Toute vérification déjà programmée s'exécutera sans effet. Réactivez-la pour choisir une nouvelle source de financement."
 disable_auto_build_confirm:0 "Bien sûr"
