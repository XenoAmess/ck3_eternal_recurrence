 enable_auto_build_desc:0 "Aktiviert den automatischen Ausbau."
 enable_auto_build_text:0 "Alle 15 Tage wird jede geeignete bestehende Gebäudekette mit einer nächsten Stufe in deinen direkt gehaltenen Provinzen um eine Stufe ausgebaut.\nZuerst wird die Reichsschatzkammer genutzt; persönliches Gold wird nur verwendet, wenn die Schatzkammer die Kosten nicht decken kann. Fehlen die erforderlichen Ressourcen, wird der Ausbau übersprungen.\nAusbauten verwenden die Basiskosten von CK3 1.19.0.6 ohne Rabatte und sind sofort abgeschlossen.\nHaupt-, gewöhnliche, Herzogtums- und Spezialgebäude werden in Burg-, Stadt-, Tempel-, Stammes- und Mandala-Tempelzitadellen-Besitztümern unterstützt. Laufende Bauarbeiten, sämtliche Domizile, Nomaden- und Hirtenbesitztümer, das Mandala Capital Great Project und Endstufen bleiben unberührt."
