l_german:
 enable_auto_build:0 "Automatischen Ausbau aktivieren"
 enable_auto_build_tooltip:0 "Automatischen Ausbau aktivieren"
 enable_auto_build_desc:0 "Aktiviert den automatischen Ausbau."
 enable_auto_build_text:0 "Alle 15 Tage wird jede berechtigte bestehende Gebäudekette mit einer nächsten Stufe in deinen direkt gehaltenen Provinzen um eine Stufe aufgewertet.\nGold wird gemäß der in diesem Beschluss gewählten Finanzierungsstrategie gezahlt; ein einzelner Kostenbetrag wird niemals zwischen Reichsschatz und persönlichem Gold aufgeteilt. Du kannst außerdem die gesamte Runde pausieren, wenn du dein Domänenlimit überschritten hast, oder weiterbauen; eine Pause stoppt die Schleife nicht und wird automatisch aufgehoben, sobald du wieder innerhalb des Limits bist.\nAufwertungen verwenden die Basiskosten von CK3 1.19.0.6 ohne Rabatte und werden sofort abgeschlossen.\nHaupt-, reguläre, Herzogtums- und Spezialgebäude werden in Burg-, Stadt-, Tempel-, Stammes- und Mandala-Tempelzitadellen-Besitztümern unterstützt. Laufende Bauvorhaben, alle Wohnsitze, Nomaden- und Hirtenbesitztümer, das Mandala-Hauptstadt-Großprojekt und Endstufen werden nicht berührt."
 enable_auto_build_confirm:0 "Gewiss"
 enable_auto_build_choose_policy_button:0 "Finanzierungs- und Domänenstrategie wählen"
 aub_funding_treasury_only:0 "Nur Reichsschatzkammer"
 aub_funding_treasury_only_desc:0 "Gold nur aus der Reichsschatzkammer zahlen. Ist keine Schatzkammer verfügbar oder deckt sie nicht die vollen Kosten, wird der Ausbau übersprungen, ohne persönliches Gold zu verwenden."
 aub_funding_personal_only:0 "Nur persönliches Gold"
 aub_funding_personal_only_desc:0 "Gold nur aus persönlichen Mitteln zahlen. Reicht das persönliche Gold nicht für die vollen Kosten, wird der Ausbau übersprungen, ohne die Reichsschatzkammer zu nutzen."
 aub_funding_treasury_first:0 "Reichsschatzkammer zuerst"
 aub_funding_treasury_first_desc:0 "Die Reichsschatzkammer verwenden, wenn sie die vollen Kosten deckt; andernfalls versuchen, die vollen Kosten mit persönlichem Gold zu zahlen. Die beiden Quellen werden niemals kombiniert."
 aub_policy_treasury_only_pause:0 "Nur Reichsschatz | Bei Limitüberschreitung pausieren"
 aub_policy_treasury_only_pause_desc:0 "Gold nur aus dem Reichsschatz zahlen. Die gesamte automatische Baurunde pausieren, wenn du dein Domänenlimit überschreitest."
 aub_policy_treasury_only_pause_choice_tooltip:0 "Nur den Reichsschatz verwenden; einen Ausbau überspringen, wenn er die vollen Kosten nicht decken kann. Die gesamte Baurunde pausieren, solange du über deinem Domänenlimit bist."
 aub_policy_treasury_only_pause_confirm:0 "Der automatische Ausbau verwendet nur den Reichsschatz und überspringt jeden Ausbau, den er nicht vollständig finanzieren kann. Solange du über deinem Domänenlimit bist, wird die gesamte Baurunde pausiert und automatisch fortgesetzt, sobald du wieder innerhalb des Limits bist."
 aub_policy_treasury_only_continue:0 "Nur Reichsschatz | Über Limit weiterbauen"
 aub_policy_treasury_only_continue_desc:0 "Gold nur aus dem Reichsschatz zahlen. Auch bei Überschreitung des Domänenlimits weiter automatisch bauen."
 aub_policy_treasury_only_continue_choice_tooltip:0 "Nur den Reichsschatz verwenden; einen Ausbau überspringen, wenn er die vollen Kosten nicht decken kann. Auch über dem Domänenlimit weiterbauen."
 aub_policy_treasury_only_continue_confirm:0 "Der automatische Ausbau verwendet nur den Reichsschatz und überspringt jeden Ausbau, den er nicht vollständig finanzieren kann. Auch über deinem Domänenlimit wird weitergebaut."
 aub_policy_personal_only_pause:0 "Nur persönlich | Bei Limitüberschreitung pausieren"
 aub_policy_personal_only_pause_desc:0 "Gold nur aus persönlichen Mitteln zahlen. Die gesamte automatische Baurunde pausieren, wenn du dein Domänenlimit überschreitest."
 aub_policy_personal_only_pause_choice_tooltip:0 "Nur persönliches Gold verwenden; einen Ausbau überspringen, wenn es die vollen Kosten nicht decken kann. Die gesamte Baurunde pausieren, solange du über deinem Domänenlimit bist."
 aub_policy_personal_only_pause_confirm:0 "Der automatische Ausbau verwendet nur persönliches Gold und überspringt jeden Ausbau, den es nicht vollständig finanzieren kann. Solange du über deinem Domänenlimit bist, wird die gesamte Baurunde pausiert und automatisch fortgesetzt, sobald du wieder innerhalb des Limits bist."
 aub_policy_personal_only_continue:0 "Nur persönlich | Über Limit weiterbauen"
 aub_policy_personal_only_continue_desc:0 "Gold nur aus persönlichen Mitteln zahlen. Auch bei Überschreitung des Domänenlimits weiter automatisch bauen."
 aub_policy_personal_only_continue_choice_tooltip:0 "Nur persönliches Gold verwenden; einen Ausbau überspringen, wenn es die vollen Kosten nicht decken kann. Auch über dem Domänenlimit weiterbauen."
 aub_policy_personal_only_continue_confirm:0 "Der automatische Ausbau verwendet nur persönliches Gold und überspringt jeden Ausbau, den es nicht vollständig finanzieren kann. Auch über deinem Domänenlimit wird weitergebaut."
 aub_policy_treasury_first_pause:0 "Reichsschatz zuerst | Bei Limitüberschreitung pausieren"
 aub_policy_treasury_first_pause_desc:0 "Den Reichsschatz verwenden, wenn er die vollen Kosten deckt; andernfalls die vollen Kosten mit persönlichem Gold zahlen. Die gesamte automatische Baurunde pausieren, wenn du dein Domänenlimit überschreitest."
 aub_policy_treasury_first_pause_choice_tooltip:0 "Zuerst den Reichsschatz verwenden; reicht er nicht, die vollen Kosten mit persönlichem Gold decken. Niemals eine Zahlung aufteilen. Die gesamte Baurunde pausieren, solange du über deinem Domänenlimit bist."
 aub_policy_treasury_first_pause_confirm:0 "Der automatische Ausbau belastet zuerst den Reichsschatz mit den vollen Kosten, andernfalls das persönliche Gold, falls der Reichsschatz nicht ausreicht, ohne eine Zahlung aufzuteilen. Solange du über deinem Domänenlimit bist, wird die gesamte Baurunde pausiert und automatisch fortgesetzt, sobald du wieder innerhalb des Limits bist."
 aub_policy_treasury_first_continue:0 "Reichsschatz zuerst | Über Limit weiterbauen"
 aub_policy_treasury_first_continue_desc:0 "Den Reichsschatz verwenden, wenn er die vollen Kosten deckt; andernfalls die vollen Kosten mit persönlichem Gold zahlen. Auch bei Überschreitung des Domänenlimits weiter automatisch bauen."
 aub_policy_treasury_first_continue_choice_tooltip:0 "Zuerst den Reichsschatz verwenden; reicht er nicht, die vollen Kosten mit persönlichem Gold decken. Niemals eine Zahlung aufteilen. Auch über dem Domänenlimit weiterbauen."
 aub_policy_treasury_first_continue_confirm:0 "Der automatische Ausbau belastet zuerst den Reichsschatz mit den vollen Kosten, andernfalls das persönliche Gold, falls der Reichsschatz nicht ausreicht, ohne eine Zahlung aufzuteilen. Auch über deinem Domänenlimit wird weitergebaut."
 aub_over_domain_pause_desc:0 "Die gesamte automatische Baurunde pausieren, wenn du dein Domänenlimit überschreitest. Die Schleife läuft weiter und wird automatisch fortgesetzt, sobald du wieder innerhalb des Limits bist."
 aub_over_domain_continue_desc:0 "Auch bei Überschreitung des Domänenlimits weiter automatisch bauen."
 disable_auto_build:0 "Automatischen Ausbau deaktivieren"
 disable_auto_build_tooltip:0 "Automatischen Ausbau deaktivieren"
 disable_auto_build_desc:0 "Beendet den automatischen Ausbau."
 disable_auto_build_text:0 "Automatisches Bauen stoppen und die Finanzierungs- sowie Domänenlimit-Strategien löschen. Bereits eingeplante Prüfungen werden ohne Nebenwirkungen ausgeführt. Erneut aktivieren, um neue Strategien zu wählen."
 disable_auto_build_confirm:0 "Gewiss"
