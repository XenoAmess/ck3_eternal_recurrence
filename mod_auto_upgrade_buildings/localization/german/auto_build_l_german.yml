l_german:
 enable_auto_build:0 "Automatischen Ausbau aktivieren"
 enable_auto_build_tooltip:0 "Automatischen Ausbau aktivieren"
 enable_auto_build_desc:0 "Aktiviert den automatischen Ausbau."
 enable_auto_build_text:0 "Alle 15 Tage wird jede geeignete bestehende Gebäudekette mit einer nächsten Stufe in deinen direkt gehaltenen Provinzen um eine Stufe ausgebaut.\nGold wird gemäß der in diesem Beschluss gewählten Finanzierungsrichtlinie bezahlt; ein einzelner Kostenbetrag wird niemals zwischen Reichsschatzkammer und persönlichem Gold aufgeteilt.\nAusbauten verwenden die Basiskosten von CK3 1.19.0.6 ohne Rabatte und sind sofort abgeschlossen.\nHaupt-, gewöhnliche, Herzogtums- und Spezialgebäude werden in Burg-, Stadt-, Tempel-, Stammes- und Mandala-Tempelzitadellen-Besitztümern unterstützt. Laufende Bauarbeiten, sämtliche Domizile, Nomaden- und Hirtenbesitztümer, das Mandala-Hauptstadt-Großprojekt und Endstufen bleiben unberührt."
 enable_auto_build_confirm:0 "Gewiss"
 enable_auto_build_choose_funding_button:0 "Finanzierungsquelle wählen"
 aub_funding_treasury_only:0 "Nur Reichsschatzkammer"
 aub_funding_treasury_only_desc:0 "Gold nur aus der Reichsschatzkammer zahlen. Ist keine Schatzkammer verfügbar oder deckt sie nicht die vollen Kosten, wird der Ausbau übersprungen, ohne persönliches Gold zu verwenden."
 aub_funding_personal_only:0 "Nur persönliches Gold"
 aub_funding_personal_only_desc:0 "Gold nur aus persönlichen Mitteln zahlen. Reicht das persönliche Gold nicht für die vollen Kosten, wird der Ausbau übersprungen, ohne die Reichsschatzkammer zu nutzen."
 aub_funding_treasury_first:0 "Reichsschatzkammer zuerst"
 aub_funding_treasury_first_desc:0 "Die Reichsschatzkammer verwenden, wenn sie die vollen Kosten deckt; andernfalls versuchen, die vollen Kosten mit persönlichem Gold zu zahlen. Die beiden Quellen werden niemals kombiniert."
 disable_auto_build:0 "Automatischen Ausbau deaktivieren"
 disable_auto_build_tooltip:0 "Automatischen Ausbau deaktivieren"
 disable_auto_build_desc:0 "Beendet den automatischen Ausbau."
 disable_auto_build_text:0 "Beendet den automatischen Ausbau und löscht die Finanzierungsrichtlinie. Bereits eingeplante Prüfungen werden ohne Auswirkungen ausgeführt. Erneut aktivieren, um eine neue Finanzierungsquelle zu wählen."
 disable_auto_build_confirm:0 "Gewiss"
