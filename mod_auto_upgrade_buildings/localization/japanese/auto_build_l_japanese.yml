 disable_auto_build:0 "自動建造を無効化"
 disable_auto_build_tooltip:0 "自動建造を無効化"
 disable_auto_build_desc:0 "自動建造機能を停止します。"
 disable_auto_build_text:0 "自動建造を停止し、資金と直轄上限の方針を消去します。すでに予約済みの判定は実行されますが、副作用は発生しません。再度有効化すると新しい方針を選択できます。"
