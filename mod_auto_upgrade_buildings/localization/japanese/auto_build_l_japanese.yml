 aub_policy_personal_only_continue_desc:0 "個人資金からのみ金貨を支払います。直轄上限を超えていても自動建造を続けます。"
 aub_policy_personal_only_continue_choice_tooltip:0 "個人の金貨のみを使用し、全額を支払えない場合はアップグレードをスキップします。直轄上限を超えていても建造を続けます。"
