l_japanese:
 enable_auto_build:0 "自動建造を有効化"
 enable_auto_build_tooltip:0 "自動建造を有効化"
 enable_auto_build_desc:0 "自動建造機能を有効にします。"
 enable_auto_build_text:0 "15日ごとに、直轄領内に存在し、次の段階があり条件を満たす各建造物チェーンを1段階アップグレードします。\n金貨はこの決断で選択した資金方針に従って支払われ、1回分の費用が国庫と個人の金貨に分割されることはありません。直轄上限を超えている間は処理全体を一時停止するか、そのまま建造を続けるかも選択できます。一時停止してもループは止まらず、上限内に戻ると自動的に再開します。\nアップグレードにはCK3 1.19.0.6の基本費用が適用され、割引なしで即座に完了します。\n城塞・都市・神殿・部族・Mandala神殿城塞の所領にある主建造物・通常建造物・公国建造物・特殊建造物が対象です。建設中の所領、すべての居所、遊牧民・牧畜民の所領、Mandala Capital Great Project、最終段階の建造物は対象外です。"
 enable_auto_build_confirm:0 "もちろん"
 enable_auto_build_choose_policy_button:0 "資金と直轄上限の方針を選択"
 aub_funding_treasury_only:0 "国庫のみ"
 aub_funding_treasury_only_desc:0 "国庫からのみ金貨を支払います。国庫がないか全額を賄えない場合、個人の金貨を使わずにアップグレードをスキップします。"
 aub_funding_personal_only:0 "個人の金貨のみ"
 aub_funding_personal_only_desc:0 "個人の金貨からのみ支払います。個人の金貨で全額を賄えない場合、国庫を使わずにアップグレードをスキップします。"
 aub_funding_treasury_first:0 "国庫優先"
 aub_funding_treasury_first_desc:0 "国庫で全額を賄える場合は国庫を使い、それ以外の場合は個人の金貨で全額の支払いを試みます。両方を併用することはありません。"
 aub_policy_treasury_only_pause:0 "国庫のみ｜上限超過で一時停止"
 aub_policy_treasury_only_pause_desc:0 "国庫からのみ金貨を支払います。直轄上限を超えている間は、自動建造の処理全体を一時停止します。"
 aub_policy_treasury_only_pause_choice_tooltip:0 "国庫のみを使用し、全額を支払えない場合はアップグレードをスキップします。直轄上限を超えている間は全工程を一時停止します。"
 aub_policy_treasury_only_pause_confirm:0 "自動建造は国庫のみを使用し、全額を支払えないアップグレードはスキップします。直轄上限を超えている間は全工程が一時停止し、上限内に戻ると自動的に再開します。"
 aub_policy_treasury_only_continue:0 "国庫のみ｜上限超過でも建造"
 aub_policy_treasury_only_continue_desc:0 "国庫からのみ金貨を支払います。直轄上限を超えていても自動建造を続けます。"
 aub_policy_treasury_only_continue_choice_tooltip:0 "国庫のみを使用し、全額を支払えない場合はアップグレードをスキップします。直轄上限を超えていても建造を続けます。"
 aub_policy_treasury_only_continue_confirm:0 "自動建造は国庫のみを使用し、全額を支払えないアップグレードはスキップします。直轄上限を超えていても建造は継続されます。"
 aub_policy_personal_only_pause:0 "個人資金のみ｜上限超過で一時停止"
