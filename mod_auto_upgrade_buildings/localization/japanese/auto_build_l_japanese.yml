l_japanese:
 enable_auto_build:0 "自動建造を有効化"
 enable_auto_build_tooltip:0 "自動建造を有効化"
 enable_auto_build_desc:0 "自動建造機能を有効にします。"
 enable_auto_build_text:0 "15日ごとに、直轄領内に存在し、次の段階があり条件を満たす各建造物チェーンを1段階アップグレードします。\n金貨はこの決断で選択した資金方針に従って支払われ、1回分の費用が国庫と個人の金貨に分割されることはありません。\nアップグレードにはCK3 1.19.0.6の基本費用が適用され、割引なしで即座に完了します。\n城塞・都市・神殿・部族・Mandala神殿城塞の所領にある主建造物・通常建造物・公国建造物・特殊建造物が対象です。建設中の所領、すべての居所、遊牧民・牧畜民の所領、Mandala Capital Great Project、最終段階の建造物は対象外です。"
 enable_auto_build_confirm:0 "もちろん"
 enable_auto_build_choose_funding_button:0 "資金源を選択"
 aub_funding_treasury_only:0 "国庫のみ"
 aub_funding_treasury_only_desc:0 "国庫からのみ金貨を支払います。国庫がないか全額を賄えない場合、個人の金貨を使わずにアップグレードをスキップします。"
 aub_funding_personal_only:0 "個人の金貨のみ"
 aub_funding_personal_only_desc:0 "個人の金貨からのみ支払います。個人の金貨で全額を賄えない場合、国庫を使わずにアップグレードをスキップします。"
 aub_funding_treasury_first:0 "国庫優先"
 aub_funding_treasury_first_desc:0 "国庫で全額を賄える場合は国庫を使い、それ以外の場合は個人の金貨で全額の支払いを試みます。両方を併用することはありません。"
 disable_auto_build:0 "自動建造を無効化"
 disable_auto_build_tooltip:0 "自動建造を無効化"
 disable_auto_build_desc:0 "自動建造機能を停止します。"
 disable_auto_build_text:0 "自動建造を停止し、資金方針を消去します。すでに予約済みの判定は実行されますが、何の効果も発生しません。再度有効化すると新しい資金源を選択できます。"
 disable_auto_build_confirm:0 "もちろん"
