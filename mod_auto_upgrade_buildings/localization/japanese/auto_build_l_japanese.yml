 aub_policy_personal_only_pause_choice_tooltip:0 "個人の金貨のみを使用し、全額を支払えない場合はアップグレードをスキップします。直轄上限を超えている間は全工程を一時停止します。"
 aub_policy_personal_only_pause_confirm:0 "自動建造は個人の金貨のみを使用し、全額を支払えないアップグレードはスキップします。直轄上限を超えている間は全工程が一時停止し、上限内に戻ると自動的に再開します。"
