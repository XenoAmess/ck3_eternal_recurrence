 aub_policy_treasury_first_pause:0 "国庫優先｜上限超過で一時停止"
 aub_policy_treasury_first_pause_desc:0 "国庫で全額を賄える場合は国庫を使い、それ以外の場合は個人の金貨で全額の支払いを試みます。直轄上限を超えている間は、自動建造の処理全体を一時停止します。"
