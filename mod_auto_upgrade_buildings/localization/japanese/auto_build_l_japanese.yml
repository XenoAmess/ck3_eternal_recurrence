 enable_auto_build_text:0 "15日ごとに、直轄領内に存在し、次の段階があり条件を満たす各建造物チェーンを1段階アップグレードします。\n国庫が優先的に使用され、国庫で費用を賄えない場合にのみ個人の金貨が使われます。必要な資源が不足している場合、アップグレードは行われません。\nアップグレードにはCK3 1.19.0.6の基本費用が適用され、割引なしで即座に完了します。\n城塞・都市・神殿・部族・Mandala神殿城塞の所領にある主建造物・通常建造物・公国建造物・特殊建造物が対象です。建設中の所領、すべての居所、遊牧民・牧畜民の所領、Mandala Capital Great Project、最終段階の建造物は対象外です。"
 enable_auto_build_confirm:0 "もちろん"
