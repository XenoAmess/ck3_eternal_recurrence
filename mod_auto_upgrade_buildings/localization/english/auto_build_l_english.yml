l_english:
 enable_auto_build:0 "Enable Auto Build"
 enable_auto_build_tooltip:0 "Enable Auto Build"
 enable_auto_build_desc:0 "Enable the auto build function."
 enable_auto_build_text:0 "Every 15 days, each eligible existing building chain with a next tier in your directly held provinces is upgraded by one tier.\nGold is paid according to the funding policy selected in this decision; a single cost is never split between the realm treasury and personal gold. You can also pause the entire pass while over your domain limit or keep building; a pause does not stop the loop and automatically lifts once you are back within the limit.\nUpgrades use the CK3 1.19.0.6 base costs without discounts and finish instantly.\nMain, regular, duchy, and special buildings are supported in castle, city, temple, tribal, and Mandala temple-citadel holdings. Ongoing construction, all domiciles, nomad and herder holdings, the Mandala Capital Great Project, and terminal tiers are not touched."
 enable_auto_build_confirm:0 "Certainly"
 enable_auto_build_choose_policy_button:0 "Choose Funding and Domain Policy"
 aub_funding_treasury_only:0 "Realm Treasury Only"
 aub_funding_treasury_only_desc:0 "Pay gold only from the realm treasury. If no treasury is available or it cannot cover the full cost, skip the upgrade without using personal gold."
 aub_funding_personal_only:0 "Personal Gold Only"
 aub_funding_personal_only_desc:0 "Pay gold only from personal funds. If personal gold cannot cover the full cost, skip the upgrade without using the realm treasury."
 aub_funding_treasury_first:0 "Realm Treasury First"
 aub_funding_treasury_first_desc:0 "Use the realm treasury when it can cover the full cost; otherwise try to pay the full cost from personal gold. The two sources are never combined."
 aub_policy_treasury_only_pause:0 "Treasury Only | Pause Over Limit"
 aub_policy_treasury_only_pause_desc:0 "Pay gold only from the realm treasury. Pause the entire auto-build pass while over your domain limit."
 aub_policy_treasury_only_pause_choice_tooltip:0 "Use only the realm treasury; skip an upgrade if it cannot cover the full cost. Pause the entire pass while over your domain limit."
 aub_policy_treasury_only_pause_confirm:0 "Auto Build will use only the realm treasury and skip any upgrade it cannot fully fund. While you are over your domain limit, the entire pass will pause and resume automatically once you are back within the limit."
 aub_policy_treasury_only_continue:0 "Treasury Only | Build Over Limit"
 aub_policy_treasury_only_continue_desc:0 "Pay gold only from the realm treasury. Keep auto building even while over your domain limit."
 aub_policy_treasury_only_continue_choice_tooltip:0 "Use only the realm treasury; skip an upgrade if it cannot cover the full cost. Keep building while over your domain limit."
 aub_policy_treasury_only_continue_confirm:0 "Auto Build will use only the realm treasury and skip any upgrade it cannot fully fund. Building will continue even while you are over your domain limit."
 aub_policy_personal_only_pause:0 "Personal Only | Pause Over Limit"
 aub_policy_personal_only_pause_desc:0 "Pay gold only from personal funds. Pause the entire auto-build pass while over your domain limit."
 aub_policy_personal_only_pause_choice_tooltip:0 "Use only personal gold; skip an upgrade if it cannot cover the full cost. Pause the entire pass while over your domain limit."
 aub_policy_personal_only_pause_confirm:0 "Auto Build will use only personal gold and skip any upgrade it cannot fully fund. While you are over your domain limit, the entire pass will pause and resume automatically once you are back within the limit."
 aub_policy_personal_only_continue:0 "Personal Only | Build Over Limit"
 aub_policy_personal_only_continue_desc:0 "Pay gold only from personal funds. Keep auto building even while over your domain limit."
 aub_policy_personal_only_continue_choice_tooltip:0 "Use only personal gold; skip an upgrade if it cannot cover the full cost. Keep building while over your domain limit."
 aub_policy_personal_only_continue_confirm:0 "Auto Build will use only personal gold and skip any upgrade it cannot fully fund. Building will continue even while you are over your domain limit."
 aub_policy_treasury_first_pause:0 "Treasury First | Pause Over Limit"
 aub_policy_treasury_first_pause_desc:0 "Use the realm treasury first, then personal gold as fallback. Pause the entire auto-build pass while over your domain limit."
 aub_policy_treasury_first_pause_choice_tooltip:0 "Use the realm treasury first; if it falls short, try personal gold for the full cost. Never split a payment. Pause the entire pass while over your domain limit."
 aub_policy_treasury_first_pause_confirm:0 "Auto Build will charge the full cost to the realm treasury first, or to personal gold if the treasury falls short, never splitting a payment. While you are over your domain limit, the entire pass will pause and resume automatically once you are back within the limit."
 aub_policy_treasury_first_continue:0 "Treasury First | Build Over Limit"
 aub_policy_treasury_first_continue_desc:0 "Use the realm treasury first, then personal gold as fallback. Keep auto building even while over your domain limit."
 aub_policy_treasury_first_continue_choice_tooltip:0 "Use the realm treasury first; if it falls short, try personal gold for the full cost. Never split a payment. Keep building while over your domain limit."
 aub_policy_treasury_first_continue_confirm:0 "Auto Build will charge the full cost to the realm treasury first, or to personal gold if the treasury falls short, never splitting a payment. Building will continue even while you are over your domain limit."
 aub_over_domain_pause_desc:0 "Pause the entire auto-build pass while over your domain limit. The loop continues and resumes automatically once you are back within the limit."
 aub_over_domain_continue_desc:0 "Keep auto building even while over your domain limit."
 disable_auto_build:0 "Disable Auto Build"
 disable_auto_build_tooltip:0 "Disable Auto Build"
 disable_auto_build_desc:0 "Stop the auto build function."
 disable_auto_build_text:0 "Stop auto building and clear the funding and domain-limit policies. Any already queued check will arrive without side effects. Re-enable it to choose new policies."
 disable_auto_build_confirm:0 "Certainly"
