l_spanish:
 enable_auto_build:0 "Activar construcción automática"
 enable_auto_build_tooltip:0 "Activar construcción automática"
 enable_auto_build_desc:0 "Activa la función de construcción automática."
 enable_auto_build_text:0 "Cada 15 días, cada cadena de edificios existente y apta que tenga un nivel siguiente en las provincias que posees directamente mejora un nivel.\nEl oro se paga según la política de financiación seleccionada en esta decisión; un único coste nunca se divide entre el tesoro del reino y el oro personal. También puedes pausar toda la pasada cuando superes tu límite de dominio o seguir construyendo; la pausa no detiene el bucle y se levanta automáticamente al volver a estar dentro del límite.\nLas mejoras usan los costes base de CK3 1.19.0.6 sin descuentos y finalizan al instante.\nSe admiten edificios principales, regulares, de ducado y especiales en dominios de castillo, ciudad, templo, tribales y ciudadelas-templo Mandala. No se modifican dominios con obras en curso, ningún domicilio, dominios nómadas o de pastores, el Gran Proyecto de la Capital Mandala ni los niveles finales."
 enable_auto_build_confirm:0 "Por supuesto"
 enable_auto_build_choose_policy_button:0 "Elegir política de financiación y de dominio"
 aub_funding_treasury_only:0 "Solo tesoro del reino"
 aub_funding_treasury_only_desc:0 "Pagar oro solo desde el tesoro del reino. Si no hay tesoro disponible o no puede cubrir el coste total, omitir la mejora sin usar oro personal."
 aub_funding_personal_only:0 "Solo oro personal"
 aub_funding_personal_only_desc:0 "Pagar oro solo con fondos personales. Si el oro personal no puede cubrir el coste total, omitir la mejora sin usar el tesoro del reino."
 aub_funding_treasury_first:0 "Tesoro del reino primero"
 aub_funding_treasury_first_desc:0 "Usar el tesoro del reino cuando pueda cubrir el coste total; si no, intentar pagar el coste total con oro personal. Las dos fuentes nunca se combinan."
 aub_policy_treasury_only_pause:0 "Solo tesoro | Pausar sobre el límite"
 aub_policy_treasury_only_pause_desc:0 "Pagar oro solo desde el tesoro del reino. Pausar toda la pasada de construcción automática mientras se supere el límite de dominio."
 aub_policy_treasury_only_continue:0 "Solo tesoro | Construir sobre el límite"
 aub_policy_treasury_only_continue_desc:0 "Pagar oro solo desde el tesoro del reino. Seguir construyendo automáticamente aunque se supere el límite de dominio."
 aub_policy_personal_only_pause:0 "Solo personal | Pausar sobre el límite"
 aub_policy_personal_only_pause_desc:0 "Pagar oro solo con fondos personales. Pausar toda la pasada de construcción automática mientras se supere el límite de dominio."
 aub_policy_personal_only_continue:0 "Solo personal | Construir sobre el límite"
 aub_policy_personal_only_continue_desc:0 "Pagar oro solo con fondos personales. Seguir construyendo automáticamente aunque se supere el límite de dominio."
 aub_policy_treasury_first_pause:0 "Tesoro primero | Pausar sobre el límite"
 aub_policy_treasury_first_pause_desc:0 "Usar el tesoro del reino si puede cubrir el coste total; si no, pagar el coste total con oro personal. Pausar toda la pasada de construcción automática mientras se supere el límite de dominio."
 aub_policy_treasury_first_continue:0 "Tesoro primero | Construir sobre el límite"
 aub_policy_treasury_first_continue_desc:0 "Usar el tesoro del reino si puede cubrir el coste total; si no, pagar el coste total con oro personal. Seguir construyendo automáticamente aunque se supere el límite de dominio."
 aub_over_domain_pause_desc:0 "Pausar toda la pasada de construcción automática mientras se supere el límite de dominio. El bucle continúa y se reanuda automáticamente al volver a estar dentro del límite."
 aub_over_domain_continue_desc:0 "Seguir construyendo automáticamente aunque se supere el límite de dominio."
 disable_auto_build:0 "Desactivar construcción automática"
 disable_auto_build_tooltip:0 "Desactivar construcción automática"
 disable_auto_build_desc:0 "Detiene la función de construcción automática."
 disable_auto_build_text:0 "Detener la construcción automática y borrar las políticas de financiación y de límite de dominio. Las comprobaciones ya programadas se ejecutarán sin efectos secundarios. Vuelve a activarla para elegir nuevas políticas."
 disable_auto_build_confirm:0 "Por supuesto"
