 disable_auto_build_tooltip:0 "Wyłącz automatyczną rozbudowę"
 disable_auto_build_desc:0 "Zatrzymuje funkcję automatycznej rozbudowy."
 disable_auto_build_text:0 "Zatrzymaj automatyczną rozbudowę i wyczyść polityki finansowania oraz limitu domeny. Każda już zaplanowana kontrola zostanie wykonana bez skutków ubocznych. Włącz ponownie, aby wybrać nowe polityki."
