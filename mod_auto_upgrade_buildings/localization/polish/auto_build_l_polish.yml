l_polish:
 enable_auto_build:0 "Włącz automatyczną rozbudowę"
 enable_auto_build_tooltip:0 "Włącz automatyczną rozbudowę"
 enable_auto_build_desc:0 "Włącza funkcję automatycznej rozbudowy."
 enable_auto_build_text:0 "Co 15 dni każdy istniejący łańcuch budowli spełniający warunki i posiadający kolejny poziom w twoich bezpośrednio posiadanych prowincjach jest ulepszany o jeden poziom.\nZłoto jest pobierane zgodnie z polityką finansowania wybraną w tej decyzji; pojedynczy koszt nigdy nie jest dzielony między skarbiec państwa a osobiste złoto. Możesz również wstrzymać cały przebieg po przekroczeniu limitu domeny albo kontynuować budowę; wstrzymanie nie zatrzymuje pętli i automatycznie kończy się po powrocie do limitu.\nUlepszenia korzystają z bazowych kosztów CK3 1.19.0.6 bez zniżek i kończą się natychmiast.\nGłówne, zwykłe, książęce i specjalne budowle są obsługiwane w posiadłościach zamkowych, miejskich, świątynnych, plemiennych oraz cytadelach świątynnych Mandala. Trwające budowy, wszystkie siedziby, posiadłości koczowników i pasterzy, Wielki Projekt Stolicy Mandala oraz poziomy końcowe nie są modyfikowane."
 enable_auto_build_confirm:0 "Oczywiście"
 enable_auto_build_choose_policy_button:0 "Wybierz politykę finansowania i domeny"
 aub_funding_treasury_only:0 "Tylko skarbiec państwa"
 aub_funding_treasury_only_desc:0 "Złoto jest pobierane wyłącznie ze skarbca państwa. Jeśli skarbiec jest niedostępny lub nie pokrywa pełnego kosztu, ulepszenie jest pomijane bez użycia osobistego złota."
 aub_funding_personal_only:0 "Tylko osobiste złoto"
 aub_funding_personal_only_desc:0 "Złoto jest pobierane wyłącznie ze środków osobistych. Jeśli osobiste złoto nie pokrywa pełnego kosztu, ulepszenie jest pomijane bez użycia skarbca państwa."
 aub_funding_treasury_first:0 "Najpierw skarbiec państwa"
 aub_funding_treasury_first_desc:0 "Użyj skarbca państwa, gdy pokryje pełny koszt; w przeciwnym razie spróbuj opłacić pełny koszt osobistym złotem. Te dwa źródła nigdy nie są łączone."
 aub_policy_treasury_only_pause:0 "Tylko skarbiec | Wstrzymaj po przekroczeniu"
 aub_policy_treasury_only_pause_desc:0 "Płać złoto wyłącznie ze skarbca państwa. Wstrzymaj cały przebieg automatycznej budowy po przekroczeniu limitu domeny."
 aub_policy_treasury_only_pause_choice_tooltip:0 "Korzystaj wyłącznie ze skarbca państwa; pomiń ulepszenie, jeśli nie pokryje pełnego kosztu. Wstrzymaj cały przebieg po przekroczeniu limitu domeny."
 aub_policy_treasury_only_pause_confirm:0 "Automatyczna rozbudowa będzie korzystać wyłącznie ze skarbca państwa i pomijać ulepszenia, których nie może w pełni sfinansować. Po przekroczeniu limitu domeny cały przebieg zostanie wstrzymany i automatycznie wznowiony po powrocie do limitu."
 aub_policy_treasury_only_continue:0 "Tylko skarbiec | Buduj po przekroczeniu"
 aub_policy_treasury_only_continue_desc:0 "Płać złoto wyłącznie ze skarbca państwa. Kontynuuj automatyczną budowę nawet po przekroczeniu limitu domeny."
 aub_policy_treasury_only_continue_choice_tooltip:0 "Korzystaj wyłącznie ze skarbca państwa; pomiń ulepszenie, jeśli nie pokryje pełnego kosztu. Kontynuuj budowanie po przekroczeniu limitu domeny."
 aub_policy_treasury_only_continue_confirm:0 "Automatyczna rozbudowa będzie korzystać wyłącznie ze skarbca państwa i pomijać ulepszenia, których nie może w pełni sfinansować. Budowanie będzie kontynuowane nawet po przekroczeniu limitu domeny."
