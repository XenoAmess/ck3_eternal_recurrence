 aub_policy_treasury_first_pause:0 "Najpierw skarbiec | Wstrzymaj po przekroczeniu"
 aub_policy_treasury_first_pause_desc:0 "Użyj skarbca państwa, gdy pokryje pełny koszt; w przeciwnym razie spróbuj opłacić pełny koszt osobistym złotem. Wstrzymaj cały przebieg automatycznej budowy po przekroczeniu limitu domeny."
 aub_policy_treasury_first_pause_choice_tooltip:0 "Najpierw korzystaj ze skarbca państwa; jeśli nie wystarczy, pokryj pełny koszt osobistym złotem. Nigdy nie dziel płatności. Wstrzymaj cały przebieg po przekroczeniu limitu domeny."
 aub_policy_treasury_first_pause_confirm:0 "Automatyczna rozbudowa obciąży pełnym kosztem najpierw skarbiec państwa, a w razie jego niedoboru osobiste złoto, nigdy nie dzieląc płatności. Po przekroczeniu limitu domeny cały przebieg zostanie wstrzymany i automatycznie wznowiony po powrocie do limitu."
