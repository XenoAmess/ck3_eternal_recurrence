 aub_policy_personal_only_pause_choice_tooltip:0 "Korzystaj wyłącznie z osobistego złota; pomiń ulepszenie, jeśli nie pokryje pełnego kosztu. Wstrzymaj cały przebieg po przekroczeniu limitu domeny."
