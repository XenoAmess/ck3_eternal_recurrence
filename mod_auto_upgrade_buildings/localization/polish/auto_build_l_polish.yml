 enable_auto_build_text:0 "Co 15 dni każda kwalifikująca się zwykła linia budynków w bezpośrednio posiadanych przez ciebie prowincjach zostaje ulepszona o jeden poziom.\nNajpierw wykorzystywany jest skarbiec państwa; osobiste złoto jest używane tylko wtedy, gdy skarbiec nie pokrywa kosztu. Jeśli nie wystarcza żadnego z nich, ulepszenie zostaje pominięte.\nUlepszenia korzystają z bazowego kosztu CK3 1.19.0.6 bez zniżek i kończą się natychmiast.\nPosiadłości, w których trwa budowa, oraz budynki główne, książęce, specjalne, plemienne, koczownicze i Mandala nie są modyfikowane."
