 aub_policy_personal_only_continue_choice_tooltip:0 "Korzystaj wyłącznie z osobistego złota; pomiń ulepszenie, jeśli nie pokryje pełnego kosztu. Kontynuuj budowanie po przekroczeniu limitu domeny."
