 aub_policy_treasury_first_continue_choice_tooltip:0 "Najpierw korzystaj ze skarbca państwa; jeśli nie wystarczy, pokryj pełny koszt osobistym złotem. Nigdy nie dziel płatności. Kontynuuj budowanie po przekroczeniu limitu domeny."
 aub_policy_treasury_first_continue_confirm:0 "Automatyczna rozbudowa obciąży pełnym kosztem najpierw skarbiec państwa, a w razie jego niedoboru osobiste złoto, nigdy nie dzieląc płatności. Budowanie będzie kontynuowane nawet po przekroczeniu limitu domeny."
 aub_over_domain_pause_desc:0 "Wstrzymaj cały przebieg automatycznej budowy po przekroczeniu limitu domeny. Pętla trwa dalej i wznawia się automatycznie po powrocie do limitu."
