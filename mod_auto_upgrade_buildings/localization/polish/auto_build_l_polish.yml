l_polish:
 enable_auto_build:0 "Włącz automatyczną rozbudowę"
 enable_auto_build_tooltip:0 "Włącz automatyczną rozbudowę"
 enable_auto_build_desc:0 "Włącza funkcję automatycznej rozbudowy."
 enable_auto_build_text:0 "Co 15 dni każdy istniejący łańcuch budowli spełniający warunki i posiadający kolejny poziom w twoich bezpośrednio posiadanych prowincjach jest ulepszany o jeden poziom.\nZłoto jest pobierane zgodnie z polityką finansowania wybraną w tej decyzji; pojedynczy koszt nigdy nie jest dzielony między skarbiec państwa a osobiste złoto.\nUlepszenia korzystają z bazowych kosztów CK3 1.19.0.6 bez zniżek i kończą się natychmiast.\nGłówne, zwykłe, książęce i specjalne budowle są obsługiwane w posiadłościach zamkowych, miejskich, świątynnych, plemiennych oraz cytadelach świątynnych Mandala. Trwające budowy, wszystkie siedziby, posiadłości koczowników i pasterzy, Wielki Projekt Stolicy Mandala oraz poziomy końcowe nie są modyfikowane."
 enable_auto_build_confirm:0 "Oczywiście"
 enable_auto_build_choose_funding_button:0 "Wybierz źródło finansowania"
 aub_funding_treasury_only:0 "Tylko skarbiec państwa"
 aub_funding_treasury_only_desc:0 "Złoto jest pobierane wyłącznie ze skarbca państwa. Jeśli skarbiec jest niedostępny lub nie pokrywa pełnego kosztu, ulepszenie jest pomijane bez użycia osobistego złota."
 aub_funding_personal_only:0 "Tylko osobiste złoto"
 aub_funding_personal_only_desc:0 "Złoto jest pobierane wyłącznie ze środków osobistych. Jeśli osobiste złoto nie pokrywa pełnego kosztu, ulepszenie jest pomijane bez użycia skarbca państwa."
 aub_funding_treasury_first:0 "Najpierw skarbiec państwa"
 aub_funding_treasury_first_desc:0 "Użyj skarbca państwa, gdy pokryje pełny koszt; w przeciwnym razie spróbuj opłacić pełny koszt osobistym złotem. Te dwa źródła nigdy nie są łączone."
 disable_auto_build:0 "Wyłącz automatyczną rozbudowę"
 disable_auto_build_tooltip:0 "Wyłącz automatyczną rozbudowę"
 disable_auto_build_desc:0 "Zatrzymuje funkcję automatycznej rozbudowy."
 disable_auto_build_text:0 "Zatrzymuje automatyczną rozbudowę i czyści politykę finansowania. Każda już zaplanowana kontrola zostanie wykonana bez żadnych skutków. Włącz ponownie, aby wybrać nowe źródło finansowania."
 disable_auto_build_confirm:0 "Oczywiście"
