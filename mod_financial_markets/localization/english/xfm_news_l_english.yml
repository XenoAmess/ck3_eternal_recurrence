l_english:
 xfm_news_kind_1_title:0 "Financial Debt Recorded"
 xfm_news_kind_1_desc:0 "[scope:xfm_news_actor.GetTitledFirstName] has recorded unpaid financial obligations. Actual creditors retain their claims; unpaid sums are not presented as money already received."
 xfm_news_kind_2_title:0 "Aid Has Been Paid"
 xfm_news_kind_2_desc:0 "A supporter has made an actual payment towards [scope:xfm_news_actor.GetTitledFirstName]'s debt. Only the paid amount reduces the creditors' claims; remaining obligations stay recorded."
 xfm_news_kind_3_title:0 "Creditors Agree to Restructuring"
 xfm_news_kind_3_desc:0 "The actual creditors of [scope:xfm_news_actor.GetTitledFirstName] have agreed to an extension or partial write down. Original obligations, payments and amendments remain traceable."
 xfm_news_kind_4_title:0 "Severe Financial Distress"
 xfm_news_kind_4_desc:0 "[scope:xfm_news_actor.GetTitledFirstName] faces sustained arrears and severe stress. Appeals and restructuring remain possible; distress does not decide a person's fate automatically."
 xfm_news_kind_5_title:0 "A Financial Tragedy"
 xfm_news_kind_5_desc:0 "[scope:xfm_news_actor.GetTitledFirstName] has died by suicide. The estate, actual creditor claims and independent issuing entities will be handled separately."
 xfm_news_kind_6_title:0 "Support during Distress"
 xfm_news_kind_6_desc:0 "[scope:xfm_news_actor.GetTitledFirstName] has gained respite and support. Recovery takes time, and unpaid obligations remain recorded."
 xfm_news_kind_7_title:0 "A Currency Enters the Market"
 xfm_news_kind_7_desc:0 "A currency project associated with [scope:xfm_news_actor.GetTitledFirstName] has announced a new market status. Subscriptions, fees and liquidity must all come from actual assets."
 xfm_news_kind_8_title:0 "Market Exit Notice"
 xfm_news_kind_8_desc:0 "A currency or trading venue associated with [scope:xfm_news_actor.GetTitledFirstName] has announced its exit. Delisting does not destroy holdings; contracts, claims and exit deadlines still require settlement."
 xfm_news_kind_9_title:0 "Market Investigation and Disclosure"
 xfm_news_kind_9_desc:0 "New public findings concern market activity associated with [scope:xfm_news_actor.GetTitledFirstName]. Traders may reassess risk; the news does not directly rewrite prices."
 xfm_news_kind_10_title:0 "Financing Has Not Completed"
 xfm_news_kind_10_desc:0 "Financing associated with [scope:xfm_news_actor.GetTitledFirstName] has not completed as planned. Refunds and remaining assets follow the actual ledger. Unraised money is never treated as income."
