l_english:
 xfm_redemption_panel_title:0 "Funded coin redemption"
 xfm_redemption_initialize:0 "View or set redemption"
 xfm_redemption_disclosure:0 "An issuer-funded offer to buy back coins. Only the published finite budget is payable. Returned coins stay in the project reserve; no additional trade fee. Each character may redeem once per market day."
 xfm_redemption_live_terms:0 "Window #[GetPlayer.MakeScope.Var('xfm_selected_coin').Var('xfm_redemption_window').Var('xfm_window_id').GetValue|0] · [Divide_CFixedPoint( GetPlayer.MakeScope.Var('xfm_selected_coin').Var('xfm_redemption_window').Var('xfm_price_cents').GetValue, '(CFixedPoint)100' )|2] gold per 100 coins\nRemaining budget [Divide_CFixedPoint( GetPlayer.MakeScope.Var('xfm_selected_coin').Var('xfm_redemption_window').Var('xfm_remaining_cents').GetValue, '(CFixedPoint)100' )|2] / original [Divide_CFixedPoint( GetPlayer.MakeScope.Var('xfm_selected_coin').Var('xfm_redemption_window').Var('xfm_initial_cents').GetValue, '(CFixedPoint)100' )|2] gold\nExpiry: market day [GetPlayer.MakeScope.Var('xfm_selected_coin').Var('xfm_redemption_window').Var('xfm_expiry_day').GetValue|0]; current day [GetPlayer.MakeScope.Var('xfm_exchange').Var('xfm_day').GetValue|0]. Total paid [Divide_CFixedPoint( GetPlayer.MakeScope.Var('xfm_selected_coin').Var('xfm_redemption_lifetime_paid_cents').GetValue, '(CFixedPoint)100' )|2] gold."
 xfm_redemption_sold_out:0 "Budget exhausted: no further full lot can be redeemed in this window."
 xfm_redemption_expired:0 "This window has expired. Unused cash can return to the project treasury."
 xfm_redemption_lots:0 "[GetPlayer.MakeScope.Var('xfm_redemption_lots').GetValue|0] lots (100 coins each)"
 xfm_redemption_redeem:0 "Review redemption"
 xfm_redemption_controller_title:0 "Issuer commitment"
 xfm_redemption_controller_terms:0 "Fund from the project treasury's available cash. Price, original budget and expiry stay fixed. Funds cannot be withdrawn early. Publish again only 7 market days after expiry, once unused cash is reclaimed."
 xfm_redemption_input_price:0 "Price [Divide_CFixedPoint( GetPlayer.MakeScope.Var('xfm_redemption_price_cents').GetValue, '(CFixedPoint)100' )|2]/100 coins"
 xfm_redemption_input_budget:0 "Budget [Divide_CFixedPoint( GetPlayer.MakeScope.Var('xfm_redemption_budget_cents').GetValue, '(CFixedPoint)100' )|2] gold"
 xfm_redemption_input_duration:0 "Duration [GetPlayer.MakeScope.Var('xfm_redemption_duration_days').GetValue|0] days (cycle)"
 xfm_redemption_publish:0 "Commit funded window"
 xfm_redemption_reclaim:0 "Reclaim expired unused cash"
 xfm_redemption_publish_title:0 "Commit a funded redemption window"
 xfm_redemption_publish_desc:0 "Coin #[SCOPE.ScriptValue('xfm_red_publish_coin_id')|0] · [Divide_CFixedPoint( SCOPE.ScriptValue('xfm_red_publish_price'), '(CFixedPoint)100' )|2] gold per 100 coins. Commit [Divide_CFixedPoint( SCOPE.ScriptValue('xfm_red_publish_budget'), '(CFixedPoint)100' )|2] gold from the project treasury until market day [SCOPE.ScriptValue('xfm_red_publish_expiry')|0]. These terms and this budget cannot change before expiry. Unused cash becomes reclaimable after expiry."
 xfm_redemption_publish_confirm:0 "Commit this budget"
 xfm_redemption_redeem_title:0 "Redeem coins at the published price"
 xfm_redemption_redeem_desc:0 "Coin #[SCOPE.ScriptValue('xfm_red_quote_coin_id')|0], window #[SCOPE.ScriptValue('xfm_red_quote_window_id')|0]. Return [SCOPE.ScriptValue('xfm_red_quote_units')|0] unreserved coins and receive [Divide_CFixedPoint( SCOPE.ScriptValue('xfm_red_quote_payment'), '(CFixedPoint)100' )|2] gold in wallet #[SCOPE.ScriptValue('xfm_red_quote_account_id')|0]. No extra fee. This confirmation is valid today only; changed terms, funds, ownership or available coins require a fresh review."
 xfm_redemption_redeem_confirm:0 "Return coins and receive payment"
 xfm_redemption_reclaim_title:0 "Reclaim unused project cash"
 xfm_redemption_reclaim_desc:0 "After expiry, return remaining cash from redemption window #[SCOPE.ScriptValue('xfm_red_reclaim_window_id')|0] to the same coin's project treasury. Returned coins stay in the redemption reserve. Cash returns to the project treasury."
 xfm_redemption_reclaim_confirm:0 "Return unused cash to the project"
 xfm_redemption_cancel:0 "Cancel"
 xfm_redemption_last_receipt:0 "Receipt #[GetPlayer.MakeScope.Var('xfm_redemption_last_receipt').Var('xfm_receipt_id').GetValue|0] · Coin #[GetPlayer.MakeScope.Var('xfm_redemption_last_receipt').Var('xfm_coin_id').GetValue|0] · Returned [GetPlayer.MakeScope.Var('xfm_redemption_last_receipt').Var('xfm_paid_units').GetValue|0] coins · Received [Divide_CFixedPoint( GetPlayer.MakeScope.Var('xfm_redemption_last_receipt').Var('xfm_paid_cents').GetValue, '(CFixedPoint)100' )|2] gold."
 xfm_redemption_action_result:0 "[Localize( Concatenate( 'xfm_redemption_action_result_', IntToString( FixedPointToInt( GetPlayer.MakeScope.Var('xfm_redemption_last_action_result').GetValue ) ) ) )]"
 xfm_redemption_action_result_0:0 "The operation did not complete. Review current terms, funds, ownership and available coins before trying again."
 xfm_redemption_action_result_1:0 "Completed. The current window and latest receipt show the result."
