l_english:
 rule_xfm_market_capacity:0 "Financial markets: currency capacity"
 setting_xfm_capacity_conservative:0 "2,048 currencies (conservative)"
 setting_xfm_capacity_conservative_desc:0 "Registers up to 2,048 currencies. New resting orders are limited to 32 per spot currency or futures contract. Lower capacity never erases existing orders, rights or debts."
 setting_xfm_capacity_standard:0 "4,096 currencies (default)"
 setting_xfm_capacity_standard_desc:0 "Registers up to 4,096 currencies. New resting orders are limited to 64 per spot currency or futures contract. Issuance still costs real gold; performance depends on the campaign."
 setting_xfm_capacity_extended:0 "8,192 currencies (experimental)"
 setting_xfm_capacity_extended_desc:0 "Registers up to 8,192 currencies and admits up to 128 resting orders per spot currency or futures contract. This can increase processing and save size; it is not a performance guarantee."
 rule_xfm_market_ai_activity:0 "Financial markets: AI activity"
 setting_xfm_ai_light:0 "Light: 128 per day"
 setting_xfm_ai_light_desc:0 "Processes up to 128 candidate characters per day, with at most six watched currencies each. Every social rank can take part."
 setting_xfm_ai_standard:0 "Standard: 512 per day"
 setting_xfm_ai_standard_desc:0 "Processes up to 512 characters through a rotating queue, including low-ranked and unlanded characters. At most eight new currencies list per day."
 setting_xfm_ai_dense:0 "Dense: 1,024 per day"
 setting_xfm_ai_dense_desc:0 "Processes up to 1,024 candidate characters per day, increasing market activity and processing cost."
 rule_xfm_market_spot:0 "Financial markets: new spot risk"
 setting_xfm_spot_enabled:0 "Open"
 setting_xfm_spot_enabled_desc:0 "Allows new spot purchases. Buyers need real funds and sellers need actual currency holdings."
 setting_xfm_spot_disabled:0 "Pause new risk"
 setting_xfm_spot_disabled_desc:0 "Stops new buying risk. Existing orders can be cancelled, holders can exit to funded buyers, and obligations continue."
 rule_xfm_market_futures:0 "Financial markets: new futures risk"
 setting_xfm_futures_enabled:0 "Open"
 setting_xfm_futures_enabled_desc:0 "Allows longs, shorts and leverage on eligible assets, with real counterparties and margin."
 setting_xfm_futures_disabled:0 "Existing positions only"
 setting_xfm_futures_disabled_desc:0 "Stops new positions. Margin additions, executable reductions, daily settlement, expiry, debts and claims continue."
 rule_xfm_market_ai_issuance:0 "Financial markets: AI issuance"
 setting_xfm_ai_issuance_enabled:0 "All AI may apply"
 setting_xfm_ai_issuance_enabled_desc:0 "Adult AI characters may apply regardless of title or land, subject to costs, cooldowns and market capacity."
 setting_xfm_ai_issuance_disabled:0 "Pause new AI applications"
 setting_xfm_ai_issuance_disabled_desc:0 "Pauses new AI issuance applications. Existing currencies, subscription refunds, normal AI trading and debts remain active."
 rule_xfm_market_crisis:0 "Financial markets: severe debt crises"
 setting_xfm_crisis_enabled:0 "Adult AI crisis consequences"
 setting_xfm_crisis_enabled_desc:0 "Severely indebted adult AI may receive aid, restructure debts or experience a death narrative. Debt never guarantees death; player characters are never automatically killed."
 setting_xfm_crisis_disabled:0 "Financial consequences only"
 setting_xfm_crisis_disabled_desc:0 "Keeps debts, claims, aid and political consequences while disabling automatic AI death narratives from this mod."
