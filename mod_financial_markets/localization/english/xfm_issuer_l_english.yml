l_english:
 xfm_issuer_unnamed:0 "Unnamed offering"
 xfm_issuer_charter_title:0 "Issuer and charter"
 xfm_issuer_charter_desc:0 "Permanent coin ID: [ROOT.Char.MakeScope.Var('xfm_view_coin_id').GetValue]. Issued supply: [ROOT.Char.MakeScope.Var('xfm_view_supply').GetValue]. Founder units still locked: [ROOT.Char.MakeScope.Var('xfm_view_locked').GetValue]. Actual subscriptions: [ROOT.Char.MakeScope.Var('xfm_view_raised').GetValue] gold. Maintenance arrears: [ROOT.Char.MakeScope.Var('xfm_view_maintenance').GetValue] gold.\n\nInitial supply is 15,000: 10,000 public offering units, 2,500 real maker units and 2,500 founder units locked for 365 days. One lot is 100 units. Failed subscriptions return the original buyers' reserved cash; performed registration services are not refundable.\n\nRegistration and listing fees, prepaid maintenance, performance bond and maker capital remain separate. Maintenance becomes revenue only as service is delivered. Bonds cover their disclosed obligations; maker capital can lose money. None implies guaranteed redemption.\n\nA new House, Dynasty, polity or faith controller inherits control without erasing the coin ID, holdings or liabilities. Endorsement does not grant unlimited guarantees. Promotion changes awareness; demand still requires real funded buyers. Issuer reputation: [ROOT.Char.MakeScope.Var('xfm_view_issuer_reputation').GetValue]."
