l_english:
 xfm_crisis_scene_1_title:0 "Silence at Court"
 xfm_crisis_scene_1_desc:0 "[xfm_news_actor.GetTitledFirstName] has died by suicide during a prolonged debt crisis. The court is arranging the aftermath; public responsibilities and the personal estate will be examined separately."
 xfm_crisis_scene_2_title:0 "A Letter from the Countryside"
 xfm_crisis_scene_2_desc:0 "News from the countryside confirms that [xfm_news_actor.GetTitledFirstName] has died by suicide. Relatives have received a final letter. Existing creditor claims remain recorded."
 xfm_crisis_scene_3_title:0 "Words beside the River"
 xfm_crisis_scene_3_desc:0 "Word from the riverside confirms that [xfm_news_actor.GetTitledFirstName] has died by suicide. Writings mention failed investments; their promises still require evidence from actual contracts."
 xfm_crisis_scene_4_title:0 "A Letter from the Coast"
 xfm_crisis_scene_4_desc:0 "Coastal messengers report that [xfm_news_actor.GetTitledFirstName] has died by suicide. Merchants are reassessing credit. Personal debts do not pass to every currency holder."
 xfm_crisis_scene_5_title:0 "Mist in the North"
 xfm_crisis_scene_5_desc:0 "News from the cold woodland confirms that [xfm_news_actor.GetTitledFirstName] has died by suicide. Friends are arranging care for the family, separately from the creditors' proceedings."
 xfm_crisis_scene_6_title:0 "The Mountain Letter"
 xfm_crisis_scene_6_desc:0 "A mountain messenger reports that [xfm_news_actor.GetTitledFirstName] has died by suicide. A final appeal has been preserved while unpaid obligations enter estate review."
 xfm_crisis_scene_7_title:0 "Grief beneath the Trees"
 xfm_crisis_scene_7_desc:0 "News from the woodland confirms that [xfm_news_actor.GetTitledFirstName] has died by suicide. Relatives are responding to the tragedy; the accounts retain their original evidence."
 xfm_crisis_scene_8_title:0 "No Return from the Wastes"
 xfm_crisis_scene_8_desc:0 "News from the open wastes confirms that [xfm_news_actor.GetTitledFirstName] has died by suicide. Scattered property and creditor claims must be examined individually, however distant they may be."
 xfm_crisis_scene_9_title:0 "The Counting House Lamp"
 xfm_crisis_scene_9_desc:0 "Despite a knowledge of money and administration, [xfm_news_actor.GetTitledFirstName] has died by suicide during a debt crisis. The accounts will be reviewed; financial skill did not erase the losses."
 xfm_crisis_scene_10_title:0 "Papers of an Ancestral Estate"
 xfm_crisis_scene_10_desc:0 "[xfm_news_actor.GetTitledFirstName] has died by suicide amid severe distress. The dynasty is examining the estate papers. Kinship alone does not create unlimited liability."
 xfm_crisis_scene_11_title:0 "An Empty Seat"
 xfm_crisis_scene_11_desc:0 "The sociable [xfm_news_actor.GetTitledFirstName] has died by suicide. Conversations among former friends have grown subdued, and earlier support or neglect has consequences of its own."
 xfm_crisis_scene_12_title:0 "A Quiet Family Letter"
 xfm_crisis_scene_12_desc:0 "The reserved [xfm_news_actor.GetTitledFirstName] has died by suicide after sustained distress. Friends have received a final family letter and are arranging the remaining obligations."
 xfm_crisis_scene_13_title:0 "A Knight Who Will Not Return"
 xfm_crisis_scene_13_desc:0 "The knight [xfm_news_actor.GetTitledFirstName] has died by suicide. Reputation and unpaid obligations leave separate legacies; martial renown does not become repayment money."
 xfm_crisis_scene_14_title:0 "The Back of the Ledger"
 xfm_crisis_scene_14_desc:0 "[xfm_news_actor.GetTitledFirstName] has died by suicide during a debt crisis. Writings beside the ledger reflect on promises and failure. Investigators must still establish every financial fact."
 xfm_crisis_scene_15_title:0 "News after Prayer"
 xfm_crisis_scene_15_desc:0 "The religiously devoted [xfm_news_actor.GetTitledFirstName] has died by suicide. Fellow believers are comforting the family while creditor proceedings continue separately."
 xfm_crisis_scene_16_title:0 "The Prison Report"
 xfm_crisis_scene_16_desc:0 "The prison reports that [xfm_news_actor.GetTitledFirstName] has died by suicide. Custodial responsibility and creditor claims will be examined separately. Debt alone creates no right to imprisonment."
 xfm_crisis_scene_17_title:0 "The Unsent Military Letter"
 xfm_crisis_scene_17_desc:0 "With war still ongoing, [xfm_news_actor.GetTitledFirstName] has died by suicide during a debt crisis. An unsent military letter remains with friends while the personal estate awaits review."
 xfm_crisis_scene_18_title:0 "The Sealed Challenge"
 xfm_crisis_scene_18_desc:0 "The accomplished swordsman [xfm_news_actor.GetTitledFirstName] has died by suicide. A challenge addressed to a friend has been sealed away. Friends and creditors face different consequences."
 xfm_crisis_scene_19_title:0 "A Dynasty in Mourning"
 xfm_crisis_scene_19_desc:0 "[xfm_news_actor.GetTitledFirstName] has died by suicide amid prolonged difficulties. The dynasty is arranging remembrance and family care. Relatives who made no guarantee do not become debtors automatically."
 xfm_crisis_scene_20_title:0 "The Last Outstanding Account"
 xfm_crisis_scene_20_desc:0 "[xfm_news_actor.GetTitledFirstName] has died by suicide after sustained debt distress and appeals for help. The account and unpaid obligations remain, subject to the ordinary estate process."
