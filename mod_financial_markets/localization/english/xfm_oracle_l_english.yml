 xfm_oracle_pending_explanation:0 "Independent trades or current observations are insufficient. Historical prices remain informational; new leveraged risk is blocked, while margin, debts and pending claims remain."
 xfm_oracle_single_venue_explanation:0 "Only this exchange's independent completed-day trades enter the reference. The fourteen-day window removes one highest and one lowest daily VWAP before averaging."
 xfm_oracle_thresholds:0 "Each day needs four independent buyer-seller pairs and ten gold of weighted notional. Seven valid completed days allow 3x; thirty days since listing and fourteen valid recent days allow 10x."
 xfm_oracle_sampling_limit:0 "At most eight qualified samples and sixteen distinct beneficiaries per day. Controller trades, same-beneficiary washes and tiny trades do not enter the settlement reference."
 xfm_oracle_stale:0 "The latest qualified completed trade day is stale. Real trading must restore the reference; there is no zero-price settlement."
 xfm_index_grain:0 "Grain observation index"
 xfm_index_military:0 "Military supply observation index"
 xfm_index_trade:0 "Trade observation index"
 xfm_index_disclosure:0 "The Mod computes these indexes from prosperity, control and the holders' wars in a fixed county basket. They are not native floating grain prices and promise no physical redemption."
 xfm_index_basket:0 "Fixed basket: at most thirty-two counties; at least eight must have actual holders and current daily observations."
 xfm_index_leverage:0 "Mod observation indexes permit at most 5x leverage. An index value does not guarantee liquidation liquidity."
 xfm_oracle_no_twenty:0 "20x requires genuinely independent qualified venues; no such source is currently certified."
