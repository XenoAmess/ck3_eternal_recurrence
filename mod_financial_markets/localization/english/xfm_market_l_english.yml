 xfm_market_issuance_costs:0 "Micro: 1 gold registration; listing 1 gold + 2% raised; upkeep 0.1 gold/month, 6 months prepaid; bond max(1 gold, 5% raised); maker cash max(2 gold, 10% raised), plus real coins. Current total paid/reserved: [GetPlayer.MakeScope.ScriptValue('xfm_market_ui_micro_total')|2] gold (funding cap: 50 gold).\nStandard: 5 gold registration; listing 10 gold + 2%; upkeep 1 gold/month, 6 months prepaid; bond max(10 gold, 5%); maker cash max(20 gold, 10%), plus coins. Current total: [GetPlayer.MakeScope.ScriptValue('xfm_market_ui_standard_total')|2] gold. Bond and maker capital retain their owners and are released only when eligible; these are not all fees."
