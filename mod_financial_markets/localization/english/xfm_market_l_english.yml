 xfm_market_management_title:0 "Confirm market management"
 xfm_market_management_confirm:0 "Confirm"
 xfm_market_concealed_mint_desc:0 "Coin #[SCOPE.ScriptValue('xfm_ui_confirmation_coin_id')|0]. Conceal [SCOPE.ScriptValue('xfm_ui_confirmation_concealed_units')|0] minted coins into the issuer treasury: 10% of reviewed supply, rounded down to 100 coins and capped by the charter. Changed supply, cap or authority rejects this confirmation. It does not edit prices; reputation falls and records may lead to investigation and political consequences."
 xfm_market_withdraw_liquidity_desc:0 "Coin #[SCOPE.ScriptValue('xfm_ui_confirmation_coin_id')|0]. Cancel the project's own maker orders and release eligible funds. Customer assets remain theirs; reputation, depth and listing eligibility may suffer."
 xfm_market_accumulate_desc:0 "Coin #[SCOPE.ScriptValue('xfm_ui_confirmation_coin_id')|0]. Submit a buy from account #[SCOPE.ScriptValue('xfm_ui_confirmation_account_id')|0] for [SCOPE.ScriptValue('xfm_ui_confirmation_lots')|0] lots at a limit of [Divide_CFixedPoint( SCOPE.ScriptValue('xfm_ui_confirmation_limit_cents'), '(CFixedPoint)100' )|2] gold/lot. Real funds and fees are required, and execution needs sellers."
 xfm_market_dump_desc:0 "Coin #[SCOPE.ScriptValue('xfm_ui_confirmation_coin_id')|0]. Submit a treasury sell for [SCOPE.ScriptValue('xfm_ui_confirmation_lots')|0] lots at a limit of [Divide_CFixedPoint( SCOPE.ScriptValue('xfm_ui_confirmation_limit_cents'), '(CFixedPoint)100' )|2] gold/lot. Only the project's unreserved coins are sold; proceeds remain in its treasury and execution needs funded buyers."
 xfm_market_freeze_supply_desc:0 "Coin #[SCOPE.ScriptValue('xfm_ui_confirmation_coin_id')|0]. Relinquish future mint authority and cap supply at its current level. Existing holders, locks and obligations remain."
 xfm_market_project_cash_desc:0 "Coin #[SCOPE.ScriptValue('xfm_ui_confirmation_coin_id')|0]. Move 1 gold of available treasury funds to the controller's primary account and record spending. Reserved margin and customer assets cannot be used."
 xfm_market_otc_offer_interaction:0 "Send OTC sale offer"
 xfm_market_otc_offer_interaction_desc:0 "Send this character a seven-day offer using the selected currency, lots and limit. Sending does not trade; the buyer must explicitly accept. OTC uses both primary accounts."
 xfm_market_otc_cancel_interaction:0 "Withdraw OTC offer"
