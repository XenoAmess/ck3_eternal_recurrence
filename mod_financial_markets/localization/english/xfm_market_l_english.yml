 xfm_market_issuer_title:0 "Issue and manage currencies"
 xfm_market_issuance_terms:0 "All adult characters, including the unlanded, can apply under the same rules. One active personal currency and one pending project; reissuance cooldown: 24 months. Registration is charged immediately; a pending offering does not guarantee listing."
