l_english:
 xfm_a0_coin:0 "Personal coin market identity"
 xfm_a0_position:0 "Personal coin position custody"
 xfm_a0_issue_decision:0 "Issue a Personal Coin (A0 Prototype)"
 xfm_a0_issue_decision_desc:0 "Establish a coin in your own name. Pay 5.6 gold: registration 1, listing 1, prepaid maintenance 0.6, performance bond 1, and market-making capital 2. The prepaid balance, bond and capital have separate accounts; market-making capital is not a fee.\n\nSupply is 10,000 coins, initially held entirely in finite market inventory. No subscriptions have raised any money. Trade lots of 100 coins against the pool. Each counterparty pays 0.3% of principal, with a minimum of 0.01 gold each; minimum fees are substantial on small trades.\n\nThis is a small A0 prototype: one personal coin per character and at most 32 registrations worldwide. Limit orders, leveraged futures, political rights, withdrawals and delisting are not implemented. Capacity and inheritance await in-game verification."
 xfm_a0_issue_decision_tooltip:0 "Pay 5.6 gold to establish a finite market; issuance requires sufficient gold, no existing personal coin, and a free registration slot."
 xfm_a0_issue_decision_confirm:0 "Pay and Register the Coin"
 xfm_a0_own_market_decision:0 "Open My Personal Coin Market"
 xfm_a0_own_market_decision_desc:0 "Inspect your coin's quotes and your position. Each confirmation buys or sells one lot of 100 coins. Repeat trades on the same day after obtaining a fresh quote."
 xfm_a0_own_market_decision_tooltip:0 "Open your coin's A0 quote page."
 xfm_a0_portfolio_decision:0 "Inspect a Personal Coin Position"
 xfm_a0_portfolio_decision_desc:0 "Open a random positive, unfrozen position owned by you. A0 has no full portfolio list; use this decision again to inspect another position. A coin has an independent ledger reference after its issuer dies. Frozen positions awaiting inheritance cannot trade."
 xfm_a0_portfolio_decision_tooltip:0 "Open a random tradable position."
 xfm_a0_open:0 "Open Market"
 xfm_a0_trade_interaction:0 "Personal Coin Market (A0)"
 xfm_a0_trade_interaction_desc:0 "Inspect this character's coin and trade lots of 100 using your real gold. This entry grants no guarantee, equity or redemption obligation from the issuer."
 xfm_a0_market_title:0 "Personal Coin Market: A0 Quote"
 xfm_a0_market_desc:0 "Issuer: [ROOT.Char.MakeScope.Var('xfm_view_issuer').Char.GetShortUINameNoTooltip]\nPool gold: [ROOT.Char.MakeScope.Var('xfm_view_pool_gold').GetValue]\nPool inventory: [ROOT.Char.MakeScope.Var('xfm_view_inventory').GetValue] coins; my available position: [ROOT.Char.MakeScope.Var('xfm_view_quantity').GetValue] coins.\n\nOne lot is 100 coins. Buy total: [ROOT.Char.MakeScope.Var('xfm_buy_quote').GetValue] gold, including your fee of [ROOT.Char.MakeScope.Var('xfm_buy_fee').GetValue]; the pool pays an equal fee separately.\nSell proceeds: [ROOT.Char.MakeScope.Var('xfm_sell_quote').GetValue] gold, after your fee of [ROOT.Char.MakeScope.Var('xfm_sell_fee').GetValue]; the pool pays an equal fee separately. Each side pays 0.3%, minimum 0.01 gold.\n\nQuotes use finite gold and inventory, with no subsidized buyers, guaranteed redemption, or direct random price multiplier. Repeat trades on the same day. Insufficient funds, inventory, positions or an outdated quote will reject a trade.\n\nA0 offers immediate whole-lot pool swaps. The full order book, futures, issuer withdrawals and political coin rights are not implemented. AI acts only within bounded, already-discovered candidate lists."
 xfm_a0_buy_option:0 "Buy 100 Coins (Pay [ROOT.Char.MakeScope.Var('xfm_buy_quote').GetValue] Gold)"
 xfm_a0_sell_option:0 "Sell 100 Coins (Receive [ROOT.Char.MakeScope.Var('xfm_sell_quote').GetValue] Gold)"
 xfm_a0_refresh_option:0 "Obtain a Fresh Quote"
 xfm_a0_close:0 "Close"
 xfm_a0_receipt_title:0 "Market Trade Receipt"
 xfm_a0_receipt_buy:0 "Bought 100 coins for [ROOT.Char.MakeScope.Var('xfm_last_trade_gold').GetValue] gold. Pool inventory fell by 100 coins and your position rose by 100. Principal and both counterparties' fees were booked separately."
 xfm_a0_receipt_sell:0 "Sold 100 coins and received [ROOT.Char.MakeScope.Var('xfm_last_trade_gold').GetValue] gold. The pool funded principal and its own fee, while your fee was deducted. Your position fell by 100 coins."
 xfm_a0_receipt_rejected:0 "No trade completed. The quote may have changed, funds, inventory or holdings may be insufficient, or a position ledger could not be created. Obtain a fresh quote."
 xfm_a0_back:0 "Return and Refresh Quote"
