l_simp_chinese:
 xfm_crisis_scene_1_title:0 "宫廷静默"
 xfm_crisis_scene_1_desc:0 "[xfm_news_actor.GetTitledFirstName]在长期债务危机中自尽。宫廷开始安排身后事，统治权与个人遗产的责任将分别核对。"
 xfm_crisis_scene_2_title:0 "乡野家书"
 xfm_crisis_scene_2_desc:0 "乡野传来了[xfm_news_actor.GetTitledFirstName]自尽的噩耗。家书已经送达亲族，未清偿的真实债权仍保留在账册中。"
 xfm_crisis_scene_3_title:0 "河畔遗书"
 xfm_crisis_scene_3_desc:0 "河畔传来[xfm_news_actor.GetTitledFirstName]自尽的消息。留下的文字谈及破灭的投资；其中的承诺仍须与真实合同核对。"
 xfm_crisis_scene_4_title:0 "海湾来信"
 xfm_crisis_scene_4_desc:0 "沿海传来了[xfm_news_actor.GetTitledFirstName]自尽的噩耗。往来商旅正重新评估信用，个人债务不会因此转给所有持币者。"
 xfm_crisis_scene_5_title:0 "寒地薄雾"
 xfm_crisis_scene_5_desc:0 "寒地确认了[xfm_news_actor.GetTitledFirstName]自尽的死讯。亲友开始照看留下的家属，照料与债权清理将分别进行。"
 xfm_crisis_scene_6_title:0 "山间绝笔"
 xfm_crisis_scene_6_desc:0 "山地传来[xfm_news_actor.GetTitledFirstName]自尽的噩耗。最后的求援信已被收存，未付款项进入遗产核查。"
 xfm_crisis_scene_7_title:0 "林间哀讯"
 xfm_crisis_scene_7_desc:0 "林地传来的消息证实[xfm_news_actor.GetTitledFirstName]已经自尽。亲族开始回应这场悲剧，账目仍保留原有来源。"
 xfm_crisis_scene_8_title:0 "荒原无归"
 xfm_crisis_scene_8_desc:0 "荒原传来[xfm_news_actor.GetTitledFirstName]自尽的消息。散落各处的财产与债权需要逐项核对，不会因消息遥远而消失。"
 xfm_crisis_scene_9_title:0 "账房灯火"
 xfm_crisis_scene_9_desc:0 "熟悉钱粮的[xfm_news_actor.GetTitledFirstName]在债务危机中自尽。经手的账目将被复核，理财才能并未消除真实损失。"
 xfm_crisis_scene_10_title:0 "祖业余书"
 xfm_crisis_scene_10_desc:0 "[xfm_news_actor.GetTitledFirstName]在严重困境中自尽。宗族正整理与祖业有关的文书；继承不意味着任何亲属承担无限债务。"
 xfm_crisis_scene_11_title:0 "空下的座位"
 xfm_crisis_scene_11_desc:0 "善于交际的[xfm_news_actor.GetTitledFirstName]已经自尽。往日友人的议论变得沉重，支持与冷落都留下了各自的余波。"
 xfm_crisis_scene_12_title:0 "闭门的家书"
 xfm_crisis_scene_12_desc:0 "少言的[xfm_news_actor.GetTitledFirstName]在持续困境中自尽。亲友收到最后的家书，开始整理留下的义务。"
 xfm_crisis_scene_13_title:0 "未归的骑士"
 xfm_crisis_scene_13_desc:0 "骑士[xfm_news_actor.GetTitledFirstName]已经自尽。其名誉与未偿借据成为不同的遗留问题，武名不会自动换成偿债金。"
 xfm_crisis_scene_14_title:0 "账本背页"
 xfm_crisis_scene_14_desc:0 "[xfm_news_actor.GetTitledFirstName]在债务危机中自尽。账本旁留下了关于承诺与失败的文字，调查仍只承认有来源的财务事实。"
 xfm_crisis_scene_15_title:0 "祈祷后的噩耗"
 xfm_crisis_scene_15_desc:0 "立有宗教誓愿的[xfm_news_actor.GetTitledFirstName]已经自尽。信众为家属提供慰藉，债权程序仍另行继续。"
 xfm_crisis_scene_16_title:0 "监牢晨报"
 xfm_crisis_scene_16_desc:0 "监牢通报[xfm_news_actor.GetTitledFirstName]自尽身亡。羁押责任与金融债权将分别核查，欠债本身不授予任何人监禁权。"
 xfm_crisis_scene_17_title:0 "未寄出的军书"
 xfm_crisis_scene_17_desc:0 "战事未息，[xfm_news_actor.GetTitledFirstName]在债务危机中自尽。未寄出的军书留给了亲友，个人遗产仍待清理。"
 xfm_crisis_scene_18_title:0 "封存的挑战书"
 xfm_crisis_scene_18_desc:0 "精于剑术的[xfm_news_actor.GetTitledFirstName]已经自尽。留给友人的挑战书被封存，亲友与债权人面对各自的余波。"
 xfm_crisis_scene_19_title:0 "宗族的哀讯"
 xfm_crisis_scene_19_desc:0 "[xfm_news_actor.GetTitledFirstName]在多重困境中自尽。宗族正商议追悼与家属照料，未担保的亲人不会自动成为债务人。"
 xfm_crisis_scene_20_title:0 "最后一份账单"
 xfm_crisis_scene_20_desc:0 "[xfm_news_actor.GetTitledFirstName]在持续债务危机与求助之后自尽。其账户和未偿义务仍然存在，财产进入正常的遗产程序。"
