 xfm_market_cancel_failed_supply_desc:0 "币 #[SCOPE.ScriptValue('xfm_ui_confirmation_coin_id')|0]。仅在没有外部持有人、冻结币或未决索偿时，销毁失败发行仍在项目金库和创始锁仓内的未分配库存，再尝试归档。不得销毁外部持币；发行冷却和失信历史不会清除。"
