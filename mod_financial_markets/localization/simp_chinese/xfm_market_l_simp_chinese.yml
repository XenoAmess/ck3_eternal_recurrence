 xfm_market_concealed_mint_desc:0 "币 #[SCOPE.ScriptValue('xfm_ui_confirmation_coin_id')|0]。隐瞒增发 [SCOPE.ScriptValue('xfm_ui_confirmation_concealed_units')|0] 枚，转入项目金库；数量为打开本窗口时供应的 10%，向下取整到 100 枚且受章程上限限制。供应、上限或权限变化则不执行。不会直接改价；声誉下降并留下记录，可能引发调查与政治追责。"
 xfm_market_withdraw_liquidity_desc:0 "币 #[SCOPE.ScriptValue('xfm_ui_confirmation_coin_id')|0]。撤销项目自有做市委托并释放可释放资金。不动用客户资产，但声誉、深度及上市资格可能受损。"
 xfm_market_accumulate_desc:0 "币 #[SCOPE.ScriptValue('xfm_ui_confirmation_coin_id')|0]。从账户 #[SCOPE.ScriptValue('xfm_ui_confirmation_account_id')|0] 提交 [SCOPE.ScriptValue('xfm_ui_confirmation_lots')|0] 手买单，限价 [Divide_CFixedPoint( SCOPE.ScriptValue('xfm_ui_confirmation_limit_cents'), '(CFixedPoint)100' )|2] 金/手。消耗真实资金与手续费，需要卖方才成交。"
 xfm_market_dump_desc:0 "币 #[SCOPE.ScriptValue('xfm_ui_confirmation_coin_id')|0]。由项目金库提交 [SCOPE.ScriptValue('xfm_ui_confirmation_lots')|0] 手卖单，限价 [Divide_CFixedPoint( SCOPE.ScriptValue('xfm_ui_confirmation_limit_cents'), '(CFixedPoint)100' )|2] 金/手。只卖项目未冻结的币，收益归项目金库，成交依赖真实买方资金。"
 xfm_market_freeze_supply_desc:0 "币 #[SCOPE.ScriptValue('xfm_ui_confirmation_coin_id')|0]。放弃后续增发权限，将供应上限固定到当前供应。既有持有人、锁仓和债务保持。"
 xfm_market_project_cash_desc:0 "币 #[SCOPE.ScriptValue('xfm_ui_confirmation_coin_id')|0]。将项目金库 1 金可用资金拨到控制者主账户，并登记项目支出。不能使用被冻结的保证金或客户资产。"
 xfm_market_otc_offer_interaction:0 "发送场外售币报价"
 xfm_market_otc_offer_interaction_desc:0 "向该角色发送市场票据选中的币、手数及限价，7 日有效。发送不成交，买方须另行明确接受。场外交易使用双方主账户。"
 xfm_market_otc_cancel_interaction:0 "撤回场外报价"
 xfm_market_otc_cancel_interaction_desc:0 "撤回向该角色发出的报价，旧窗口不能成交。"
 xfm_market_otc_received_title:0 "场外虚拟货币报价"
 xfm_market_otc_received_desc:0 "[xfm_ui_otc_seller.GetUIName] 提议出售币 #[xfm_ui_otc_coin.MakeScope.Var('xfm_coin_id').GetValue|0]：[SCOPE.ScriptValue('xfm_ui_otc_lots')|0] 手，单价 [Divide_CFixedPoint( SCOPE.ScriptValue('xfm_ui_otc_limit_cents'), '(CFixedPoint)100' )|2] 金/手。\n接受从你的主账户付款。修改、撤回、过期、参考版本变化或资产不足时不会按旧窗口成交。"
