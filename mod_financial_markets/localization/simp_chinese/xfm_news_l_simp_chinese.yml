l_simp_chinese:
 xfm_news_kind_1_title:0 "金融债务登记"
 xfm_news_kind_1_desc:0 "[xfm_news_actor.GetTitledFirstName]的金融账户存在已登记的未付义务。真实债权人保留索偿，尚未支付的部分不会显示为已经到账。"
 xfm_news_kind_2_title:0 "援助已经付款"
 xfm_news_kind_2_desc:0 "援助者已经为[xfm_news_actor.GetTitledFirstName]的债务实际付款。仅已支付部分减少债权，剩余义务仍按原账册处理。"
 xfm_news_kind_3_title:0 "债权人同意重整"
 xfm_news_kind_3_desc:0 "[xfm_news_actor.GetTitledFirstName]的实际债权人已同意展期或部分减记。原合同、付款与修订仍可追踪。"
 xfm_news_kind_4_title:0 "严重财务困境"
 xfm_news_kind_4_desc:0 "[xfm_news_actor.GetTitledFirstName]正承受持续逾期与严重压力。求援与重整仍在进行，困境不会直接决定其结局。"
 xfm_news_kind_5_title:0 "金融悲剧"
 xfm_news_kind_5_desc:0 "[xfm_news_actor.GetTitledFirstName]已经自尽。其遗产、真实债权与独立发行主体将分别处理。"
 xfm_news_kind_6_title:0 "困境中的支持"
 xfm_news_kind_6_desc:0 "[xfm_news_actor.GetTitledFirstName]获得了喘息与支持。恢复需要时间，未清偿的真实义务仍保留。"
 xfm_news_kind_7_title:0 "新币进入市场"
 xfm_news_kind_7_desc:0 "[xfm_news_actor.GetTitledFirstName]关联的币发行项目已经公布新的市场状态。认购资金、费用与流动性均须来自实际资产。"
 xfm_news_kind_8_title:0 "市场退出公告"
 xfm_news_kind_8_desc:0 "[xfm_news_actor.GetTitledFirstName]关联的币或交易场所发布退出公告。退市不销毁持仓；存量合约、索偿与退出期限仍须处理。"
 xfm_news_kind_9_title:0 "市场调查与披露"
 xfm_news_kind_9_desc:0 "[xfm_news_actor.GetTitledFirstName]关联的市场行为出现新的公开调查结果。交易者将依据披露重新评估风险，消息本身不直接改写币价。"
 xfm_news_kind_10_title:0 "发行融资未完成"
 xfm_news_kind_10_desc:0 "[xfm_news_actor.GetTitledFirstName]关联的融资未按计划完成。退款与剩余资产依实际账册处理，不能把未筹得的金币算作收入。"
