l_simp_chinese:
 rule_xfm_market_capacity:0 "金融市场：币种容量"
 setting_xfm_capacity_conservative:0 "2,048 种（节省资源）"
 setting_xfm_capacity_conservative_desc:0 "同时登记最多2,048种币；每币现货簿、每个期货合约最多接纳32笔新挂单余量。降低容量不删除已有订单、权利或债务。"
 setting_xfm_capacity_standard:0 "4,096 种（默认）"
 setting_xfm_capacity_standard_desc:0 "同时登记最多4,096种币；每币现货簿、每个期货合约最多接纳64笔新挂单余量。发行仍须支付真实成本，性能须按实际存档验证。"
 setting_xfm_capacity_extended:0 "8,192 种（实验）"
 setting_xfm_capacity_extended_desc:0 "同时登记最多8,192种币；每币现货簿、每个期货合约最多接纳128笔新挂单余量。可能增加处理耗时与存档大小，不代表已验证性能。"
 rule_xfm_market_ai_activity:0 "金融市场：AI 决策预算"
 setting_xfm_ai_light:0 "低：每日128名"
 setting_xfm_ai_light_desc:0 "每日最多处理128名候选角色，每人最多关注6种币；所有阶层均能轮到。"
 setting_xfm_ai_standard:0 "标准：每日512名"
 setting_xfm_ai_standard_desc:0 "每日最多处理512名候选角色，使用队列轮转，包含低阶与无地角色。每日全市场最多8种新币挂牌。"
 setting_xfm_ai_dense:0 "高：每日1,024名"
 setting_xfm_ai_dense_desc:0 "每日最多处理1,024名候选角色，提高市场参与频率，也增加处理开销。"
 rule_xfm_market_spot:0 "金融市场：新增现货风险"
 setting_xfm_spot_enabled:0 "开放"
 setting_xfm_spot_enabled_desc:0 "开放现货买单与新增持仓；买卖都需要真实资金或持币。"
 setting_xfm_spot_disabled:0 "暂停新增"
 setting_xfm_spot_disabled_desc:0 "停止新增买入风险；既有挂单可撤销，持币可通过真实买家退出，既有义务继续处理。"
 rule_xfm_market_futures:0 "金融市场：新增期货风险"
 setting_xfm_futures_enabled:0 "开放"
 setting_xfm_futures_enabled_desc:0 "合格标的开放做多、做空和杠杆，须真实对手盘与保证金。"
 setting_xfm_futures_disabled:0 "仅处理既有仓位"
 setting_xfm_futures_disabled_desc:0 "停止新开仓；补保证金、实际减仓、每日结算、到期、债务与索偿继续。"
 rule_xfm_market_ai_issuance:0 "金融市场：AI 发行"
 setting_xfm_ai_issuance_enabled:0 "所有 AI 可申请"
 setting_xfm_ai_issuance_enabled_desc:0 "成年AI无论头衔高低或是否有地，均可在付费、冷却和市场容量约束内申请发行。"
 setting_xfm_ai_issuance_disabled:0 "暂停 AI 新申请"
 setting_xfm_ai_issuance_disabled_desc:0 "暂停AI新申请发行；已发行币、认购退款、AI正常交易与债务继续处理。"
 rule_xfm_market_crisis:0 "金融市场：严重债务危机剧情"
 setting_xfm_crisis_enabled:0 "启用成人 AI 危机后果"
 setting_xfm_crisis_enabled_desc:0 "严重负债的成年AI可能经历援助、重整或离世剧情。债务不会必然导致死亡，玩家角色不被自动处死。"
 setting_xfm_crisis_disabled:0 "保留财务后果"
 setting_xfm_crisis_disabled_desc:0 "继续处理欠债、追索、援助和政治后果，关闭本模组自动触发的AI离世剧情。"
