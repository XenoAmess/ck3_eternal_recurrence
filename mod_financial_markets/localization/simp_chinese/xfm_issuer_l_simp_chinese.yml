 xfm_issuer_release_escrow:0 "退出后取回无争议、尚未消费的预存与保证金"
 xfm_issuer_release_project:0 "从项目自由现金拨付 1 金（不动冻结款）"
 xfm_issuer_restore_bond:0 "从项目自由金补足本轮履约保证金"
 xfm_issuer_restart_maker:0 "用项目真实金币和库存恢复做市资本"
