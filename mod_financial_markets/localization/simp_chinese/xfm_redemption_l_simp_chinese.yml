l_simp_chinese:
 xfm_redemption_panel_title:0 "预存资金兑付"
 xfm_redemption_initialize:0 "查看或设置兑付"
 xfm_redemption_disclosure:0 "发行人出资回购币，仅支付已公布的有限预算。兑回的币留在项目兑付储备，不另收交易费。每位角色每个市场日可兑付一次。"
 xfm_redemption_live_terms:0 "窗口 #[GetPlayer.MakeScope.Var('xfm_selected_coin').Var('xfm_redemption_window').Var('xfm_window_id').GetValue|0] · 每100枚 [Divide_CFixedPoint( GetPlayer.MakeScope.Var('xfm_selected_coin').Var('xfm_redemption_window').Var('xfm_price_cents').GetValue, '(CFixedPoint)100' )|2] 金\n剩余预算 [Divide_CFixedPoint( GetPlayer.MakeScope.Var('xfm_selected_coin').Var('xfm_redemption_window').Var('xfm_remaining_cents').GetValue, '(CFixedPoint)100' )|2] / 初始 [Divide_CFixedPoint( GetPlayer.MakeScope.Var('xfm_selected_coin').Var('xfm_redemption_window').Var('xfm_initial_cents').GetValue, '(CFixedPoint)100' )|2] 金\n到期：市场第 [GetPlayer.MakeScope.Var('xfm_selected_coin').Var('xfm_redemption_window').Var('xfm_expiry_day').GetValue|0] 日；当前第 [GetPlayer.MakeScope.Var('xfm_exchange').Var('xfm_day').GetValue|0] 日。累计已付 [Divide_CFixedPoint( GetPlayer.MakeScope.Var('xfm_selected_coin').Var('xfm_redemption_lifetime_paid_cents').GetValue, '(CFixedPoint)100' )|2] 金。"
 xfm_redemption_sold_out:0 "预算售罄：本窗口已不足兑付一整手。"
 xfm_redemption_expired:0 "窗口已到期，未用款项可退回项目金库。"
 xfm_redemption_lots:0 "[GetPlayer.MakeScope.Var('xfm_redemption_lots').GetValue|0] 手（每手100枚）"
 xfm_redemption_redeem:0 "核对兑付"
 xfm_redemption_controller_title:0 "发行人出资承诺"
 xfm_redemption_controller_terms:0 "从项目金库可用现金出资，单价、初始预算与到期日固定。到期前不能撤回资金。到期后取回未用款项，并冷却7个市场日，方可发布新窗口。"
 xfm_redemption_input_price:0 "每100枚 [Divide_CFixedPoint( GetPlayer.MakeScope.Var('xfm_redemption_price_cents').GetValue, '(CFixedPoint)100' )|2] 金"
 xfm_redemption_input_budget:0 "预算 [Divide_CFixedPoint( GetPlayer.MakeScope.Var('xfm_redemption_budget_cents').GetValue, '(CFixedPoint)100' )|2] 金"
 xfm_redemption_input_duration:0 "期限 [GetPlayer.MakeScope.Var('xfm_redemption_duration_days').GetValue|0] 日（切换）"
 xfm_redemption_publish:0 "出资并发布窗口"
 xfm_redemption_reclaim:0 "取回到期未用款项"
 xfm_redemption_publish_title:0 "发布预存资金兑付窗口"
 xfm_redemption_publish_desc:0 "币 #[SCOPE.ScriptValue('xfm_red_publish_coin_id')|0]，每100枚兑付 [Divide_CFixedPoint( SCOPE.ScriptValue('xfm_red_publish_price'), '(CFixedPoint)100' )|2] 金。从项目金库投入 [Divide_CFixedPoint( SCOPE.ScriptValue('xfm_red_publish_budget'), '(CFixedPoint)100' )|2] 金，至市场第 [SCOPE.ScriptValue('xfm_red_publish_expiry')|0] 日到期。到期前单价和预算不能变更，未用款项到期后方可取回。"
 xfm_redemption_publish_confirm:0 "承诺并投入这笔资金"
 xfm_redemption_redeem_title:0 "按公布价格兑回币"
 xfm_redemption_redeem_desc:0 "币 #[SCOPE.ScriptValue('xfm_red_quote_coin_id')|0]，窗口 #[SCOPE.ScriptValue('xfm_red_quote_window_id')|0]。交回 [SCOPE.ScriptValue('xfm_red_quote_units')|0] 枚未冻结的币，将有 [Divide_CFixedPoint( SCOPE.ScriptValue('xfm_red_quote_payment'), '(CFixedPoint)100' )|2] 金入账至钱包 #[SCOPE.ScriptValue('xfm_red_quote_account_id')|0]，不另收费。确认仅当日有效；条款、资金、所有权或可用币改变后须重新核对。"
 xfm_redemption_redeem_confirm:0 "交回币并收款"
 xfm_redemption_reclaim_title:0 "取回项目未用资金"
 xfm_redemption_reclaim_desc:0 "窗口 #[SCOPE.ScriptValue('xfm_red_reclaim_window_id')|0] 到期后，将剩余现金退回同一币的项目金库。兑回的币继续留在兑付储备，现金退回项目金库供项目使用。"
 xfm_redemption_reclaim_confirm:0 "将余款退回项目"
 xfm_redemption_cancel:0 "取消"
 xfm_redemption_last_receipt:0 "收据 #[GetPlayer.MakeScope.Var('xfm_redemption_last_receipt').Var('xfm_receipt_id').GetValue|0] · 币 #[GetPlayer.MakeScope.Var('xfm_redemption_last_receipt').Var('xfm_coin_id').GetValue|0] · 已交回 [GetPlayer.MakeScope.Var('xfm_redemption_last_receipt').Var('xfm_paid_units').GetValue|0] 枚 · 实收 [Divide_CFixedPoint( GetPlayer.MakeScope.Var('xfm_redemption_last_receipt').Var('xfm_paid_cents').GetValue, '(CFixedPoint)100' )|2] 金。"
 xfm_redemption_action_result:0 "[Localize( Concatenate( 'xfm_redemption_action_result_', IntToString( FixedPointToInt( GetPlayer.MakeScope.Var('xfm_redemption_last_action_result').GetValue ) ) ) )]"
 xfm_redemption_action_result_0:0 "操作未完成。请重新核对当前条款、资金、所有权及可用币，再行确认。"
 xfm_redemption_action_result_1:0 "已完成。请查看当前窗口与最新收据。"
