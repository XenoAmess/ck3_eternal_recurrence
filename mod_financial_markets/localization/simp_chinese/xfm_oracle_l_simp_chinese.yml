 xfm_oracle_single_venue_explanation:0 "参考仅使用本交易所完成日的独立成交。十四日窗口去除最高与最低两个日均价；成熟资格开放前限制杠杆。"
 xfm_oracle_thresholds:0 "每天至少四对独立买卖双方及十金加权成交额。至少七个有效完成日可用三倍；上市满三十日且近十四日全部有效可用十倍。"
 xfm_oracle_sampling_limit:0 "每天最多八笔合格样本、十六名不同受益人。发行控制者、同受益人对倒与微额成交不进入结算参考。"
 xfm_oracle_stale:0 "最近合格完成成交日已过期。等待真实交易恢复，不按零价结算。"
