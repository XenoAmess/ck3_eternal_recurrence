l_simp_chinese:
 xfm_a0_coin:0 "个人币市场身份"
 xfm_a0_position:0 "个人币持仓托管"
 xfm_a0_issue_decision:0 "发行个人币（A0 原型）"
 xfm_a0_issue_decision_desc:0 "以自己的名义建立一枚个人币。实际支付共 5.6 金：登记费 1、上市费 1、维护预存 0.6、履约保证金 1、做市资本 2。后两项和维护预存分别记录，做市资本并非手续费。\n\n总供应 10,000 枚，初始全部在有限做市库存内；尚无认购收入。每手 100 枚，可与做市池双向成交。交易双方各付本金的 0.3%，最低各 0.01 金；小额交易的最低费用占比很高。\n\n这是 A0 小规模原型：每角色一枚个人币、世界最多登记 32 枚；未实现限价订单簿、期货杠杆、政治权利、提现或退市流程。容量和继承仍待实机验证。"
 xfm_a0_issue_decision_tooltip:0 "花费 5.6 金建立有限做市市场；资金不足、已有个人币或登记容量已满时不可发行。"
 xfm_a0_issue_decision_confirm:0 "支付并登记个人币"
 xfm_a0_own_market_decision:0 "打开我的个人币市场"
 xfm_a0_own_market_decision_desc:0 "查看自己的个人币报价和持仓。每次确认交易只买卖一手 100 枚，可在同一天反复交易；每次成交后须重新取得报价。"
 xfm_a0_own_market_decision_tooltip:0 "打开个人币的 A0 报价页。"
 xfm_a0_portfolio_decision:0 "查看一项个人币持仓"
 xfm_a0_portfolio_decision_desc:0 "随机打开一项由本人持有、未冻结且数量大于零的个人币持仓。A0 尚未提供完整持仓列表，可再次执行本决议查看另一项。发行者死亡后，币的市场身份仍由独立账册引用；继承待定的冻结持仓不能交易。"
 xfm_a0_portfolio_decision_tooltip:0 "随机打开一项可交易持仓。"
 xfm_a0_open:0 "打开市场"
 xfm_a0_trade_interaction:0 "个人币市场（A0）"
 xfm_a0_trade_interaction_desc:0 "查看此角色发行的个人币，并用自己的真实金币买卖每手 100 枚。此入口不代表对方接受担保、股权或赎回义务。"
 xfm_a0_market_title:0 "个人币市场：A0 报价"
 xfm_a0_market_desc:0 "发行者：[ROOT.Char.MakeScope.Var('xfm_view_issuer').Char.GetShortUINameNoTooltip]\n做市池金币：[ROOT.Char.MakeScope.Var('xfm_view_pool_gold').GetValue]\n做市库存：[ROOT.Char.MakeScope.Var('xfm_view_inventory').GetValue] 枚；我的可用持仓：[ROOT.Char.MakeScope.Var('xfm_view_quantity').GetValue] 枚。\n\n每手 100 枚。买入总付：[ROOT.Char.MakeScope.Var('xfm_buy_quote').GetValue] 金，已含买方费用 [ROOT.Char.MakeScope.Var('xfm_buy_fee').GetValue] 金；做市池另付同额费用。\n卖出净收：[ROOT.Char.MakeScope.Var('xfm_sell_quote').GetValue] 金，已扣卖方费用 [ROOT.Char.MakeScope.Var('xfm_sell_fee').GetValue] 金；做市池另付同额费用。双方各付 0.3%，最低各 0.01 金。\n\n报价来自有限资金与库存；没有买家补贴、无担保赎回、无随机直接改价。同日可重复交易。若资金、库存、持仓或报价版本不符，交易会拒绝。\n\nA0 使用即时整手做市报价，尚无完整订单簿、期货、发行者提现和政治币权利；AI 只在已发现的有限候选中决策。"
 xfm_a0_buy_option:0 "买入 100 枚（总付 [ROOT.Char.MakeScope.Var('xfm_buy_quote').GetValue] 金）"
 xfm_a0_sell_option:0 "卖出 100 枚（净收 [ROOT.Char.MakeScope.Var('xfm_sell_quote').GetValue] 金）"
 xfm_a0_refresh_option:0 "重新取得报价"
 xfm_a0_close:0 "关闭"
 xfm_a0_receipt_title:0 "市场交易回执"
 xfm_a0_receipt_buy:0 "已买入 100 枚，实际支付 [ROOT.Char.MakeScope.Var('xfm_last_trade_gold').GetValue] 金。做市库存减少 100 枚，持仓增加 100 枚；成交本金和双方费用分别入账。"
 xfm_a0_receipt_sell:0 "已卖出 100 枚，实际收到 [ROOT.Char.MakeScope.Var('xfm_last_trade_gold').GetValue] 金。做市池支付本金及自身费用，卖方费用已扣；持仓减少 100 枚。"
 xfm_a0_receipt_rejected:0 "此次交易未成交。可能是报价已经变化、可用资金或库存不足、持仓不足，或持仓账册未能建立。请重新取得报价。"
 xfm_a0_back:0 "返回并刷新报价"
