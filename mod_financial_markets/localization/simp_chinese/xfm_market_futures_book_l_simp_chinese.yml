 xfm_market_futures_book_reference:0 "参考指数[Divide_CFixedPoint(GetPlayer.MakeScope.Var('xfm_selected_coin').Var('xfm_index_cents').GetValue,'(CFixedPoint)100')|2] · 结算标记[Divide_CFixedPoint(GetPlayer.MakeScope.Var('xfm_selected_coin').Var('xfm_mark_cents').GetValue,'(CFixedPoint)100')|2]，均非本合约成交。"
