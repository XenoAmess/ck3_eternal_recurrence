l_english:
 # GENERATED FILE: edit tools/gen_school_consent.py.
 lyd_c2_same_main_doctrines_tt:0 "The source and receiving communions' main rites have the same doctrines."
 lyd_c2_detach_requirements_tt:0 "I am an adult, landed initiate of a tradition in this mod, free to act and with at least 15 Learning. My tradition is not the current communion's main rite, has no current affiliation or leadership proposal, and is outside its transition and retry waiting periods."
 lyd_c2_review_requirements_tt:0 "I remain eligible to initiate, and this proposal still matches my tradition, communion, heads and receiving representative. Its current affiliation arrangements remain valid; changes require a new round."
 lyd_c2_cancel_requirements_tt:0 "I have a current proposal that has not been enacted. I may withdraw my own round even after losing eligibility to initiate."
 lyd_c2_join_requirements_tt:0 "I am eligible to initiate, my tradition may propose reunion, and neither side has a current affiliation or leadership proposal. The recipient must be a qualified scholar of another Confucian communion's main rite. A main rite with other affiliated rites cannot move through this proposal."
 lyd_c2_detach_open_tt:0 "Open our school's mandate round and consult every affected player. A two-thirds scholarly mandate and every affected player's express consent are required before signing, revalidation and enactment. Opening a proposal changes no affiliation and charges no separation cost."
 lyd_c2_review_open_tt:0 "Recheck this round's representatives, affiliation, mandates and terms, then open its review. Reviewing casts no vote, grants no signature, changes no affiliation and charges no transition cost."
 lyd_c2_cancel_round_tt:0 "End my current proposal and release only the arrangements held by my own round. This changes no rite or communion affiliation and charges no reunion or separation cost."
 lyd_c2_join_open_tt:0 "Propose reception of our tradition and separately consult our school, every active receiving rite and every affected player. Delivery is not consent: each school requires its two-thirds mandate or the prescribed current-holder endorsement, and every affected player must expressly consent. Opening changes no affiliation and charges no reunion cost."
 lyd_c2_propose_join_interaction:0 "Propose a Tradition's Reunion"
 lyd_c2_propose_join_interaction_desc:0 "Propose that the recipient's communion receive our tradition. Delivery is not consent: each school needs a two-thirds mandate, and every affected player must choose."
 lyd_c2_propose_detach_decision:0 "Propose an Independent Communion"
 lyd_c2_propose_detach_decision_desc:0 "Ask our school to consider its communal affiliation. Traditions may retain scholarly ties, and religious separation does not alter political allegiance."
 lyd_c2_propose_detach_decision_tooltip:0 "Open a separation proposal and seek a mandate"
 lyd_c2_propose_detach_decision_confirm:0 "Consult our school"
 lyd_c2_review_proposal_decision:0 "Review the Current Proposal"
 lyd_c2_review_proposal_decision_desc:0 "Review school mandates, the receiving party's reply and the terms. Changes in representatives or affiliation require a new round."
 lyd_c2_review_proposal_decision_tooltip:0 "Review and revalidate the current proposal"
 lyd_c2_review_proposal_decision_confirm:0 "Review the terms"
 lyd_c2_cancel_proposal_decision:0 "Withdraw the Current Proposal"
 lyd_c2_cancel_proposal_decision_desc:0 "Withdraw a proposal that has not been enacted. Withdrawal grants no consent and incurs no transition cost."
 lyd_c2_cancel_proposal_decision_tooltip:0 "End this round without changing affiliation"
 lyd_c2_cancel_proposal_decision_confirm:0 "Withdraw it"
 lyd_c2_proposal_t:0 "Consult before Changing Communion"
 lyd_c2_proposal_desc:0 "The proposal concerns the affiliation of this whole rite. It changes no core tenets and replaces no receiving main rite. Qualified scholars throughout the school vote individually; affected players separately consent or refuse. Authorization covers only this round's terms and expires after one year. This mandate also covers these office terms: reunion retires only the captured head title when the source faith contains this sole rite and that title is explicitly owned by this mod and that source faith. The former person, other titles and teaching record remain. This does not retire multi-rite or foreign offices. If the school's rules already provide a temporal head, separation installs the authorized initiating representative and creates only one dedicated head title; no-head rules are not covertly changed. A former head may record nonrecognition without substituting for school and affected-player decisions."
 lyd_c2_source_ballot_t:0 "Our School's Mandate"
 lyd_c2_source_ballot_desc:0 "Will you authorize this initiator to sign the current affiliation proposal for our school? Our learning and practice remain. This mandate does not dispose of another realm's state rites or property, nor decide for affected players. This mandate also covers these office terms: reunion retires only the captured head title when the source faith contains this sole rite and that title is explicitly owned by this mod and that source faith. The former person, other titles and teaching record remain. This does not retire multi-rite or foreign offices. If the school's rules already provide a temporal head, separation installs the authorized initiating representative and creates only one dedicated head title; no-head rules are not covertly changed. A former head may record nonrecognition without substituting for school and affected-player decisions."
 lyd_c2_target_ballot_t:0 "Mandate to Receive a Tradition"
 lyd_c2_target_ballot_desc:0 "Will you authorize the proposed representative to receive the incoming tradition? Our main rite remains and the incoming school retains its own rite. Two-thirds support creates a mandate; the representative must still reply personally. This mandate also covers these office terms: reunion retires only the captured head title when the source faith contains this sole rite and that title is explicitly owned by this mod and that source faith. The former person, other titles and teaching record remain. This does not retire multi-rite or foreign offices. If the school's rules already provide a temporal head, separation installs the authorized initiating representative and creates only one dedicated head title; no-head rules are not covertly changed. A former head may record nonrecognition without substituting for school and affected-player decisions."
 lyd_c2_holder_t:0 "Endorsement by This Rite's Current Holder"
 lyd_c2_holder_desc:0 "Our rite has followers or counties but no qualified scholar electorate in this round. As its current holder, I may expressly endorse or refuse. This is not a two-thirds scholarly vote and cannot replace consent from every affected player. An active rite without a real holder must first establish the required organization."
 lyd_c2_holder_yes:0 "I expressly endorse as the current holder"
 lyd_c2_holder_no:0 "I refuse; a new round is required"
 lyd_c2_vote_yes:0 "I authorize this representative for these terms"
 lyd_c2_vote_no:0 "I oppose this mandate"
 lyd_c2_player_consent_t:0 "My Communion's Affiliation"
 lyd_c2_player_consent_desc:0 "This proposal acts on a shared rite and may affect characters and counties in different realms. I may consent or refuse. A scholarly majority or a sponsor's resources cannot substitute for my choice. This mandate also covers these office terms: reunion retires only the captured head title when the source faith contains this sole rite and that title is explicitly owned by this mod and that source faith. The former person, other titles and teaching record remain. This does not retire multi-rite or foreign offices. If the school's rules already provide a temporal head, separation installs the authorized initiating representative and creates only one dedicated head title; no-head rules are not covertly changed. A former head may record nonrecognition without substituting for school and affected-player decisions."
 lyd_c2_player_yes:0 "I expressly consent to these affiliation terms"
 lyd_c2_player_no:0 "I refuse; this round must not proceed"
 lyd_c2_review_t:0 "Mandates and Terms"
 lyd_c2_review_desc:0 "Our votes: [ROOT.Char.MakeScope.Var('lyd_c2_source_yes').GetValue|0]/[ROOT.Char.MakeScope.Var('lyd_c2_source_total').GetValue|0]. Aggregate receiving votes: [ROOT.Char.MakeScope.Var('lyd_c2_target_yes').GetValue|0]/[ROOT.Char.MakeScope.Var('lyd_c2_target_total').GetValue|0], for reference only. Mandated active receiving rites: [ROOT.Char.MakeScope.Var('lyd_c2_mandated_receivers').GetValue|0]/[ROOT.Char.MakeScope.Var('lyd_c2_active_receivers').GetValue|0]. Dormant templates: [ROOT.Char.MakeScope.Var('lyd_c2_dormant_total').GetValue|0], excluded rather than counted as assent. Active rites lacking scholars and a valid holder: [ROOT.Char.MakeScope.Var('lyd_c2_unorganized_receivers').GetValue|0]; a teacher or organization is required first. Player consent: [ROOT.Char.MakeScope.Var('lyd_c2_player_yes').GetValue|0]/[ROOT.Char.MakeScope.Var('lyd_c2_player_total').GetValue|0]. Every active rite must authorize separately, followed by final revalidation."
 lyd_c2_sign_source:0 "Sign under our school's mandate"
 lyd_c2_sign_source_tt:0 "Sign these affiliation and disclosed head retirement/provisioning terms. Reunion also requires the receiving representative and valid head to reply. The former head's recognition does not replace the mandate or add a permanent veto."
 lyd_c2_receive_t:0 "The Receiving Representative's Reply"
 lyd_c2_receive_desc:0 "Every active rite of the receiving communion has formed its mandate. Dormant rites retain their templates and were not counted as assent. Will I personally sign the reception terms? I may consent or refuse; nomination alone was not consent. This mandate also covers these office terms: reunion retires only the captured head title when the source faith contains this sole rite and that title is explicitly owned by this mod and that source faith. The former person, other titles and teaching record remain. This does not retire multi-rite or foreign offices. If the school's rules already provide a temporal head, separation installs the authorized initiating representative and creates only one dedicated head title; no-head rules are not covertly changed. A former head may record nonrecognition without substituting for school and affected-player decisions."
 lyd_c2_receive_yes:0 "I consent and sign these terms"
 lyd_c2_receive_no:0 "I refuse these terms"
 lyd_c2_head_receive_t:0 "Reception by the Communion's Head"
 lyd_c2_head_receive_desc:0 "The school representative has signed for reception. As the current head, I must explicitly answer for this round's communal arrangement. My consent does not replace school mandates."
 lyd_c2_head_source_t:0 "The Source Communion's Reply"
 lyd_c2_head_source_desc:0 "Our school has authorized reunion. I may recognize it or record nonrecognition; an additional release permission cannot override the school mandate, both representatives' signatures and every affected player's consent. An expressly retired school-owned head title is the only office removed; my person, other titles and teaching record remain."
 lyd_c2_source_head_recognize:0 "I recognize this reunion"
 lyd_c2_source_head_withhold:0 "Record my nonrecognition; valid mandates remain"
 lyd_c2_peaceful_t:0 "Permission and Autonomy"
 lyd_c2_peaceful_desc:0 "The school requests its own communion. Will I recognize a peaceful separation? Refusal leaves it unrecognized, but cannot permanently veto autonomy supported by the school's own mandate."
 lyd_c2_peaceful_yes:0 "I recognize a peaceful separation"
 lyd_c2_peaceful_no:0 "I withhold recognition without cancelling the school's mandate"
 lyd_c2_confirm:0 "Enact the revalidated affiliation"
 lyd_c2_confirm_tt:0 "Reunion costs 300 gold and 1500 piety; separation costs 200 gold and 1000 piety. A successful transition sets a five-year school cooldown and changes no political allegiance."
 lyd_c2_native_pending:0 "Affiliation mechanics still await verification"
 lyd_c2_native_pending_tt:0 "This candidate can collect mandates, but final affiliation operations have not passed live verification. Consent is not a completed reunion or separation."
 lyd_c2_result_t:0 "The Record of This Round"
 lyd_c2_success_desc:0 "The immediate affiliation postconditions were met and costs collected. School identity remains; another proposal may follow after the cooldown. Subsequent communal state still requires observation."
 lyd_c2_rejected_desc:0 "This round lacked required consent and affiliation remains. Refusal does not permanently close negotiations; the school may reconsider after one year."
 lyd_c2_cancelled_desc:0 "The proposal was withdrawn without transition costs. A new round requires fresh authorization."
 lyd_c2_expired_desc:0 "This round's authorization expired before enactment. Old ballots and signatures cannot authorize new terms."
 lyd_c2_failed_desc:0 "The affiliation operation did not meet its postconditions. The actual state is preserved without claiming success; further adjustment requires investigation."
 lyd_c2_wait:0 "Await the parties' replies"
 lyd_c2_cancel:0 "Withdraw this round"
 lyd_c2_acknowledge:0 "Record this round"
