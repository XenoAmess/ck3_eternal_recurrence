 lyd_i3b_refuse_choice_tt:0 "Refuse the terms and close this proposal without enacting institutional changes."
 lyd_i3b_cancel_choice_tt:0 "Clear only my matching locks and roster for this round; an old popup cannot close a newer round."
 lyd_i3b_commit_choice_tt:0 "Recheck every authorization before enactment. Recognize success only after real native postconditions pass. Otherwise retain actual partial state, save a receipt and show failure."
 lyd_i3b_result_success_t:0 "Headship Attempt Postconditions Passed"
 lyd_i3b_result_success_desc:0 "This attempt passed its actual native postconditions. A receipt preserves its serial, Communion, main rite and real office title. The proposal is closed; use Read the Last Headship Attempt Receipt to revisit it. This result does not prove every other property of the political graph stayed unchanged."
 lyd_i3b_result_failure_t:0 "Headship Attempt Failed Its Postconditions"
 lyd_i3b_result_failure_desc:0 "This attempt failed its native postconditions. Success is not recognized and no fee is charged. Actual partial doctrine or title state is retained without an invented rollback. The proposal is closed and its serial, Communion, main rite and failure class are saved. Save and independently read back the actual state before deciding recovery. Read the Last Headship Attempt Receipt reopens this result without retrying or changing native objects."
 lyd_i3b_result_ack:0 "Acknowledge and Keep the Receipt"
 lyd_i3b_zero_fee_tt:0 "This institutional flow charges no fee."
 lyd_i3b_result_identity_failed_tt:0 "Failure class 2: Communion or main-rite identity differs from this attempt’s terms."
 lyd_i3b_result_factory_failed_tt:0 "Failure class 3: the real head office title, ownership or holder failed its postcondition."
 lyd_i3b_result_rites_failed_tt:0 "Failure class 4: the complete captured rite list does not share the target doctrine and Communion."
 lyd_i3b_result_political_failed_tt:0 "Failure class 5: at least one captured pre-existing political title no longer belongs to the initiator."
 lyd_i3b_result_native_hor_failed_tt:0 "The detached Communion’s actual native main-rite head no longer matches this round’s authorized initiator after enactment. The real native state is retained without assigning a replacement or claiming success."
 lyd_i3b_result_unclassified_tt:0 "Failure class 6: unclassified postcondition failure; independently read back the actual objects before investigation."
 lyd_i3b_doctrine_clause_tt:0 "Institution terms: the current Faith and complete following rite list replace no head with temporal head. Vanilla Jingxue/Daoxue do not opt out. Tenets, main rite and followers stay unchanged. First candidate: [lyd_i3b_actor.GetTitledFirstName]. Dormant rites are terms but contribute no affirmative votes."
 lyd_i3b_npc_support_tt:0 "Neutral NPC support/refusal weights are 60/40. Opinion of the first headship candidate (the initiator) of at least 50 raises support; at most -50 lowers it. Candidate Learning of at least 20 raises support; below 10 lowers it. These are finite weights: support and refusal remain possible and never replace human choices. Scholarly ballots cannot be recast this round; withdraw before improving relations or developing the candidate for a new round. School progress shows captured round records, subject to full roster and eligibility revalidation; every human must still consent separately."
