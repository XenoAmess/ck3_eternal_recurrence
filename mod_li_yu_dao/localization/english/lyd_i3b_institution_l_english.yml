 lyd_i3b_nominate_interaction:0 "Nominate a School Representative"
 lyd_i3b_terms_desc:0 "Players of vanilla Jingxue, Daoxue or a new LYD rite within vanilla Confucianism may propose a real Head of Faith without converting or becoming the Jingxue/Daoxue rite head. The original Faith, Jingxue, Daoxue, main rite and all tenets remain. This establishes temporal headship for the entire current Faith: every captured rite replaces no head with temporal head, including vanilla rites without an opt-out. The initiator is the first candidate. Each active school, including actual Jingxue and Daoxue, needs its own two-thirds scholarly mandate and nominated representative signature; every living human separately consents. Dormant rites contribute no affirmative votes but their institution changes remain terms. Legacy Communion initiation still requires the main rite; detached communities still require their actual native main-rite head. Existing heads, challengers or competing proposals block the round. Roster or eligibility changes require withdrawal and a new round. Existing political titles and their succession must not be reassigned. Success requires actual postconditions."
 lyd_i3b_nomination_t:0 "A Nomination, Not a Headship"
 lyd_i3b_ballot_t:0 "Our School’s Institutional Mandate"
 lyd_i3b_player_t:0 "My Consent to the Institution"
 lyd_i3b_sign_t:0 "Sign under Our School’s Mandate"
 lyd_i3b_review_t:0 "The Complete Roster and Terms"
 lyd_i3b_yes:0 "I expressly support these terms"
 lyd_i3b_no:0 "I refuse"
 lyd_i3b_sign:0 "Sign as the mandated representative"
 lyd_i3b_wait:0 "Await the parties"
 lyd_i3b_cancel:0 "Withdraw this round"
 lyd_i3b_confirm:0 "Enact the revalidated terms"
 lyd_i3b_pending:0 "This round is not ready for enactment"
 lyd_i3b_begin_valid_tt:0 "Requires a living adult Confucian player of vanilla Jingxue, Daoxue or a new LYD rite, with at least a duchy and permitted clergy gender. Vanilla Confucianism may initiate directly, preserving Faith and main rite while including every actual rite, including Jingxue and Daoxue, in independent authorization. Legacy Communion initiators must belong to the main rite; detached communities additionally require the actual native main-rite head. The Faith and all rites must be headless with compatible clergy, with no existing head, challenger, other office or pending proposal."
 lyd_i3b_nominate_valid_tt:0 "I must be living, adult, free, capable and have actual Learning of at least 15. Lower Learning does not prevent initiation, but prevents self-nomination. Withdraw first, then lawfully develop or recruit an eligible scholar of the same Faith and rite and start a new proposal. Cultivation grants Learning lifestyle experience, not a guaranteed direct Learning increase."
 lyd_i3b_seal_valid_tt:0 "The draft and roster must remain valid. Every active school needs an accepted eligible representative and a positive scholarly electorate. Nominate missing representatives first. If an active school has no eligible scholars, withdraw first. Use normal education, lifestyles or actually available recruitment, conversion and rite-adoption routes to prepare a living, adult, free, capable candidate of the same Faith and rite with actual Learning of at least 15, then initiate again. Court recruitment or lifestyle experience alone does not establish eligibility. A school with followers but no scholars is not dormant; no votes are invented, and each active school still needs its own two-thirds mandate and representative signature."
 lyd_i3b_current_valid_tt:0 "The initiator, Communion, main rite, full roster, eligibility and this round’s locks must still match. Withdraw and restart an invalid proposal."
 lyd_i3b_cancel_valid_tt:0 "Requires the living human initiator’s own active round. Withdrawal remains available after affiliation, faith or initiation eligibility changes."
 lyd_i3b_result_valid_tt:0 "Requires a living human player with a saved headship attempt receipt."
 lyd_i3b_nomination_actor_valid_tt:0 "The initiator’s draft, roster and eligibility must remain valid and the terms must be unsealed."
 lyd_i3b_nomination_target_valid_tt:0 "The nominee must be a qualified scholar of this Communion on this round’s roster, in an active school without an accepted representative. This scholar mandate does not appoint a native Head of Rite."
 lyd_i3b_quorum_valid_tt:0 "This school must have eligible scholars and at least two-thirds must expressly support the terms."
 lyd_i3b_commit_valid_tt:0 "Requires a revalidated full roster, each active school’s own two-thirds and representative signature, separate consent from every living human, unchanged ownership of captured political titles, and revalidated identity and authorization for this attempt."
 lyd_i3b_native_closed_tt:0 "This round does not yet meet its enactment conditions: recheck the complete roster, each school’s scholarly mandate, representative signatures and every living human’s consent. Withdraw and restart after identity or terms change."
 lyd_i3b_nomination_choice_tt:0 "Accept the scholarly nomination only. This casts no vote or signature and grants no native Head of Rite or Head of Faith office."
 lyd_i3b_ballot_choice_tt:0 "Record my single affirmative ballot for my own school’s mandate."
 lyd_i3b_ballot_no_choice_tt:0 "Record my single negative ballot without adding to my school’s affirmative votes."
