 lyd_i3b_result_review_desc:0 "查看本人上次已保存的制度实施结果与失败类别；不会重试实施、收费或改动原生对象。"
 lyd_i3b_nominate_interaction:0 "提名本派制度议案代表"
 lyd_i3b_terms_desc:0 "原版儒家的经学、道学及本模组新礼仪玩家均可发起建立真实宗主，不必改信或成为经学、道学的派领袖。议案保持原信仰、经学、道学、主礼仪及各派信条，但建立的是整个当前儒家信仰的世俗宗主制度：完整礼仪名单均由无宗主改为世俗宗主，原版经学、道学不豁免。首任候选人为发起者。每个活跃派（包括实际存在的经学、道学）须分别取得三分之二合格学者授权和提名代表签署；所有存活玩家须另行明确同意。休眠礼仪不贡献赞成票，但制度变化列入条款。旧独立共宗仍由主礼仪玩家发起，分离共同体仍须由实际主礼仪领袖发起。现有宗主、争议宗主或其他议案会阻止本轮；名单或资格改变须撤回重议。不得转移旧政治头衔或重写其继承。真实后置检查通过才确认成功。"
 lyd_i3b_nomination_t:0 "受议推举，尚非宗主"
 lyd_i3b_ballot_t:0 "本派的制度授权"
 lyd_i3b_player_t:0 "我的共同体制度同意"
 lyd_i3b_sign_t:0 "依本派授权签署"
 lyd_i3b_review_t:0 "完整名单与制度条款"
 lyd_i3b_yes:0 "我明确赞成所示条款"
 lyd_i3b_no:0 "我拒绝"
 lyd_i3b_sign:0 "以授权代表身份签署"
 lyd_i3b_wait:0 "待诸方答复"
 lyd_i3b_cancel:0 "撤回本轮"
 lyd_i3b_confirm:0 "按已重核授权实施"
 lyd_i3b_pending:0 "本轮制度实施条件尚未齐备"
 lyd_i3b_begin_valid_tt:0 "须为符合教士性别要求、在世成年且有公国以上头衔的儒家玩家，可属原版经学、道学或本模组新礼仪。原版儒家可直接发起，保留原信仰与主礼仪，并纳入全部实际礼仪（含经学、道学）的独立授权。旧独立共宗须属主礼仪；分离共同体还须本人为实际主礼仪领袖。信仰和全部礼仪须无宗主且教士制度兼容；不得已有宗主、争议宗主、其他职位或待办议案。"
 lyd_i3b_nominate_valid_tt:0 "本人须在世、成年、自由、非无能且实际学识至少15；学识不足仍可发起议案，但不能自提名。先撤回本轮，再合法培养或招揽同信仰、同礼仪的合格学者，实际达标后重议。践礼修身给予学识生活方式经验，不保证直接增加学识属性。"
 lyd_i3b_seal_valid_tt:0 "本轮草案与名单须仍有效；每个活跃派都须有已接受提名的合格学者代表与正数学者名额。缺代表须先推举。活跃派若无合格学者，请先撤回本轮，再通过正常教育、生活方式或实际可用的招揽、改信与转派途径，准备在世、成年、自由、非无能、同信仰同礼仪且实际学识至少15的人选，随后重新发起；仅招入宫廷或获得生活方式经验不等于达标。有信众但无学者的派不算休眠，不能补假票，各活跃派仍各需三分之二授权及代表签署。"
 lyd_i3b_current_valid_tt:0 "发起者、共同体、主礼仪、完整名单、资格与本轮占用须仍与议案一致；失效后请撤回重议。"
 lyd_i3b_cancel_valid_tt:0 "须为仍存活的玩家原发起者，且本人仍有本轮议案；转派、转信或失去发起资格仍可撤回。"
 lyd_i3b_result_valid_tt:0 "须为仍存活的玩家，且本人有已保存的制度实施回执。"
 lyd_i3b_nomination_actor_valid_tt:0 "发起者的本轮草案、名单与资格须仍有效，且尚未封定。"
 lyd_i3b_nomination_target_valid_tt:0 "候选人须为同共同体、本轮名册中的合格学者；其派须活跃、尚无已接受提名的代表。学者代表不等于现任原生派领袖。"
 lyd_i3b_quorum_valid_tt:0 "本派合格学者人数须为正数，且本派至少三分之二已明确赞成。"
 lyd_i3b_commit_valid_tt:0 "完整名单须重核通过；各活跃派各自达到三分之二并获代表签署，所有存活玩家另行同意，旧政治头衔仍归原主，且本次实施的身份与授权重核通过。"
 lyd_i3b_native_closed_tt:0 "本轮尚未满足实施条件：须重核完整名单、各派学者授权、代表签署与所有存活玩家的同意；身份或条款变化后须撤回重议。"
 lyd_i3b_nomination_choice_tt:0 "接受本派学者代表提名；这一步不投票、不签署，也不授予原生派领袖或宗主职位。"
 lyd_i3b_ballot_choice_tt:0 "记下本人的一张赞成票；只计入本人所属派的授权。"
 lyd_i3b_ballot_no_choice_tt:0 "记下本人的一张反对票，不增加本派赞成票。"
 lyd_i3b_player_choice_tt:0 "记下本人对本轮完整制度条款的明确玩家同意，与学者票分开。"
 lyd_i3b_sign_choice_tt:0 "仅按本派已经达到的授权签署，不代替其他派或其他玩家同意。"
 lyd_i3b_defer_choice_tt:0 "暂不签署；本派可在之后重新收到签署请求。"
 lyd_i3b_refuse_choice_tt:0 "拒绝本轮条款，并撤回本轮议案；不实施制度变更。"
 lyd_i3b_cancel_choice_tt:0 "仅清理本人本轮匹配的占用与名册；旧弹窗不能清理新轮。"
 lyd_i3b_commit_choice_tt:0 "在执行前再次重核全部授权；真实原生后置检查通过才承认成功。未通过则保留实际部分状态，保存回执并显示失败。"
 lyd_i3b_result_success_t:0 "宗主制度实施后置检查通过"
 lyd_i3b_result_success_desc:0 "本轮实际原生后置检查通过，并保存了本轮序号、共同体、主礼仪及真实办公头衔的回执。本轮审批已关闭；可用“查阅上次宗主制度实施回执”重看。该结果不证明政治全图的其他属性均不变。"
 lyd_i3b_result_failure_t:0 "宗主制度实施未获成功确认"
 lyd_i3b_result_failure_desc:0 "本轮原生后置检查未通过，不承认实施成功，也不收取费用。已保留真实的部分教义或头衔状态，没有伪造回滚；审批已关闭，保存本轮序号、共同体、主礼仪及失败类别。请先保存并独立读回实际状态，再作恢复决定；可用“查阅上次宗主制度实施回执”重新查看，此入口不会重试或修改原生对象。"
 lyd_i3b_result_ack:0 "知悉并保留回执"
 lyd_i3b_zero_fee_tt:0 "本轮制度流程费用为零。"
 lyd_i3b_result_identity_failed_tt:0 "失败类别 2：共同体或主礼仪身份与本轮条款不一致。"
 lyd_i3b_result_factory_failed_tt:0 "失败类别 3：真实宗主办公头衔、归属或持有人后置检查未通过。"
 lyd_i3b_result_rites_failed_tt:0 "失败类别 4：捕获的完整礼仪名单未全部处于目标教义及共同体。"
