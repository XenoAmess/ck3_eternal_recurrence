 lyd_rite_kongmen_desc:0 "以孔门的仁、礼与敬为本，学诗习礼，尊圣传道。祭礼的敬与哀须出于内心；贵重礼物不能代替诚意。此名概括经典中的共同传统，不声称古代存在同名独立教会。"
 lyd_rite_mengzi:0 "孟氏之学"
 lyd_rite_mengzi_adj:0 "孟氏之学"
 lyd_rite_mengzi_adherent:0 "孟氏之学之儒"
 lyd_rite_mengzi_adherent_plural:0 "孟氏之学诸儒"
 lyd_rite_mengzi_desc:0 "恻隐、羞恶、辞让与是非之心是成德的萌芽，须由行义扩充。养气依靠持续实践，礼义冲突则须辨经权；性善不意味着无需努力便已成圣。"
 lyd_rite_xunzi:0 "荀氏之学"
 lyd_rite_xunzi_adj:0 "荀氏之学"
 lyd_rite_xunzi_adherent:0 "荀氏之学之儒"
 lyd_rite_xunzi_adherent_plural:0 "荀氏之学诸儒"
 lyd_rite_xunzi_desc:0 "成德有赖师法、习礼与人为努力。丧祭与礼乐安顿情感和欲望；天的运行有常，祈雨不直接改变天时。起伪之伪指有意识的作为，绝非以欺诈为德。"
 lyd_rite_dongzhongshu:0 "公羊春秋·董氏传承"
 lyd_rite_dongzhongshu_adj:0 "公羊春秋·董氏传承"
 lyd_rite_dongzhongshu_adherent:0 "公羊春秋·董氏传承之儒"
 lyd_rite_dongzhongshu_adherent_plural:0 "公羊春秋·董氏传承诸儒"
 lyd_rite_dongzhongshu_desc:0 "以董仲舒相关公羊经说为重点，借春秋褒贬明义，将灾异理解为省过的谴告。它不代表所有今文家；灾异的解释可以争论，不能证明天神按人的请求施罚。"
 lyd_rite_guwen:0 "古文经传"
 lyd_rite_guwen_adj:0 "古文经传"
 lyd_rite_guwen_adherent:0 "古文经传之儒"
 lyd_rite_guwen_adherent_plural:0 "古文经传诸儒"
 lyd_rite_guwen_desc:0 "依据经传、旧注与可考的名物辨礼明义。汉代今古文之分不等于两套整齐神学，考证也不预设拒绝一切鬼神与祭祀。"
 lyd_rite_zhengxuan:0 "郑氏礼学"
 lyd_rite_zhengxuan_adj:0 "郑氏礼学"
 lyd_rite_zhengxuan_adherent:0 "郑氏礼学之儒"
 lyd_rite_zhengxuan_adherent_plural:0 "郑氏礼学诸儒"
 lyd_rite_zhengxuan_desc:0 "会通今古文的郑氏礼学区分昊天与五帝、圜丘与郊祭，并以感生与祖先配享解释祭礼。经师理论与各朝实际采用的祀典仍须分别考察。"
 lyd_rite_wangsu:0 "王氏礼学"
 lyd_rite_wangsu_adj:0 "王氏礼学"
 lyd_rite_wangsu_adherent:0 "王氏礼学之儒"
 lyd_rite_wangsu_adherent_plural:0 "王氏礼学诸儒"
 lyd_rite_wangsu_desc:0 "王肃主张天惟一体、丘郊一祭，将禘礼解释为追享祖源。它与郑氏有实际礼学分歧，仍共同重视经据、报本与诚敬；王肃不是王弼。"
 lyd_rite_wangbi:0 "王弼玄儒"
 lyd_rite_wangbi_adj:0 "王弼玄儒"
 lyd_rite_wangbi_adherent:0 "王弼玄儒之儒"
 lyd_rite_wangbi_adherent_plural:0 "王弼玄儒诸儒"
 lyd_rite_wangbi_desc:0 "以王弼的贵无、崇本与得意忘象为素材，追问经典的根本义。玄儒为跨儒道的概括标签，不将所有玄学划成儒家宗派。"
 lyd_rite_guoxiang:0 "郭象玄儒"
 lyd_rite_guoxiang_adj:0 "郭象玄儒"
 lyd_rite_guoxiang_adherent:0 "郭象玄儒之儒"
 lyd_rite_guoxiang_adherent_plural:0 "郭象玄儒诸儒"
 lyd_rite_guoxiang_desc:0 "从独化、性分与自得理解万物及名教自然。此跨界路线保留与王弼贵无论的差异，不另造同名古代教会。"
 lyd_rite_jingshu:0 "经疏正义"
 lyd_rite_jingshu_adj:0 "经疏正义"
 lyd_rite_jingshu_adherent:0 "经疏正义之儒"
 lyd_rite_jingshu_adherent_plural:0 "经疏正义诸儒"
 lyd_rite_jingshu_desc:0 "以南北经学及唐代经疏为基础，兼习诸经，尊重传注又辨其义理。祭序、礼器与丧服须据经说明，不将后世四书中心体系提前置入。"
 lyd_rite_hanyu:0 "韩氏原道"
 lyd_rite_hanyu_adj:0 "韩氏原道"
 lyd_rite_hanyu_adherent:0 "韩氏原道之儒"
 lyd_rite_hanyu_adherent_plural:0 "韩氏原道诸儒"
 lyd_rite_hanyu_desc:0 "以仁义人伦论道，尊孔孟、师道与圣道承传，并批评出世主张。论辩不自动成为对所有佛道人物的永久敌视。"
 lyd_rite_liao:0 "李氏复性"
 lyd_rite_liao_adj:0 "李氏复性"
 lyd_rite_liao_adherent:0 "李氏复性之儒"
 lyd_rite_liao_adherent_plural:0 "李氏复性诸儒"
 lyd_rite_liao_desc:0 "通过澄心静养恢复被邪妄之情遮蔽的本性，论诚与成圣。此说与佛道思想有复杂联系，不能与韩愈合成一种单纯反佛的学说。"
 lyd_rite_zhoudunyi:0 "濂溪之学"
 lyd_rite_zhoudunyi_adj:0 "濂溪之学"
 lyd_rite_zhoudunyi_adherent:0 "濂溪之学之儒"
 lyd_rite_zhoudunyi_adherent_plural:0 "濂溪之学诸儒"
 lyd_rite_zhoudunyi_desc:0 "以诚、阴阳生化与静养探讨成圣之道。周敦颐是北宋先驱，后世学统整理不能直接当作其时代的统一教会。"
 lyd_rite_chengbrothers:0 "二程洛学"
 lyd_rite_chengbrothers_adj:0 "二程洛学"
 lyd_rite_chengbrothers_adherent:0 "二程洛学之儒"
 lyd_rite_chengbrothers_adherent_plural:0 "二程洛学诸儒"
 lyd_rite_chengbrothers_desc:0 "论天理、仁与持敬，以学问和道德实践互相贯通；程颢、程颐之间仍有不同侧重。"
 lyd_rite_zhangzai:0 "横渠关学"
 lyd_rite_zhangzai_adj:0 "横渠关学"
 lyd_rite_zhangzai_adherent:0 "横渠关学之儒"
 lyd_rite_zhangzai_adherent_plural:0 "横渠关学诸儒"
 lyd_rite_zhangzai_desc:0 "以气化、天人联系和民胞物与论道，强调通过礼与实践变化气质。关学与洛学相互影响并有批评，不应全部折叠为同一说法。"
 lyd_rite_shaoyong:0 "先天象数之学"
 lyd_rite_shaoyong_adj:0 "先天象数之学"
 lyd_rite_shaoyong_adherent:0 "先天象数之学之儒"
 lyd_rite_shaoyong_adherent_plural:0 "先天象数之学诸儒"
 lyd_rite_shaoyong_desc:0 "借象数、观物与天道运行理解天地。推演表达解释与信念，不提供必然准确的未来预言。"
 lyd_rite_wanganshi:0 "荆公新学"
 lyd_rite_wanganshi_adj:0 "荆公新学"
 lyd_rite_wanganshi_adherent:0 "荆公新学之儒"
 lyd_rite_wanganshi_adherent_plural:0 "荆公新学诸儒"
 lyd_rite_wanganshi_desc:0 "重新解释诗、书、周礼等经典，以经义回应当时处境。此路不等于公羊春秋学，也不将全部变法政策当成宗教工夫。"
 lyd_rite_sushi:0 "苏氏之学"
 lyd_rite_sushi_adj:0 "苏氏之学"
 lyd_rite_sushi_adherent:0 "苏氏之学之儒"
 lyd_rite_sushi_adherent_plural:0 "苏氏之学诸儒"
 lyd_rite_sushi_desc:0 "以三苏及后学的经义、人情与礼义讨论为素材。学派边界有后世整理，不把所有蜀地学人或政治同党合为教会。"
 lyd_rite_huxiang:0 "湖湘之学"
 lyd_rite_huxiang_adj:0 "湖湘之学"
 lyd_rite_huxiang_adherent:0 "湖湘之学之儒"
 lyd_rite_huxiang_adherent_plural:0 "湖湘之学诸儒"
 lyd_rite_huxiang_desc:0 "以胡宏、张栻等人的仁、性与成德讨论为基础，察识与涵养有不同解释。湖湘有自己的学统，并非朱学的附庸。"
 lyd_rite_zhuxi:0 "朱子之学"
 lyd_rite_zhuxi_adj:0 "朱子之学"
 lyd_rite_zhuxi_adherent:0 "朱子之学之儒"
 lyd_rite_zhuxi_adherent_plural:0 "朱子之学诸儒"
 lyd_rite_zhuxi_desc:0 "以四书、理气及居敬穷理论成德，家礼将诚敬落实于日用丧祭。问学必须落实于行；其南宋形成过程与后世官方正统地位不能混为一谈。"
 lyd_rite_lujiuyuan:0 "象山之学"
 lyd_rite_lujiuyuan_adj:0 "象山之学"
 lyd_rite_lujiuyuan_adherent:0 "象山之学之儒"
 lyd_rite_lujiuyuan_adherent_plural:0 "象山之学诸儒"
 lyd_rite_lujiuyuan_desc:0 "发明本心、辨明大本，以立志改过和实践检验自得。它不主张任性便是道，也不废弃经典；陆学不等于后世成熟的阳明学。"
 lyd_rite_yongjia:0 "永嘉之学"
 lyd_rite_yongjia_adj:0 "永嘉之学"
 lyd_rite_yongjia_adherent:0 "永嘉之学之儒"
 lyd_rite_yongjia_adherent_plural:0 "永嘉之学诸儒"
 lyd_rite_yongjia_desc:0 "义理须在具体事务与实践效果中检验，义利关系需要辨析。事功不是以财富或胜利直接证明德性。"
 lyd_rite_yongkang:0 "永康之学"
 lyd_rite_yongkang_adj:0 "永康之学"
 lyd_rite_yongkang_adherent:0 "永康之学之儒"
 lyd_rite_yongkang_adherent_plural:0 "永康之学诸儒"
 lyd_rite_yongkang_desc:0 "陈亮相关传承从历史、道义与事功中论学。它与永嘉有联系，仍保留不同的思想来源。"
 lyd_rite_wucheng:0 "草庐会通"
 lyd_rite_wucheng_adj:0 "草庐会通"
 lyd_rite_wucheng_adherent:0 "草庐会通之儒"
 lyd_rite_wucheng_adherent_plural:0 "草庐会通诸儒"
 lyd_rite_wucheng_desc:0 "以元代吴澄的经籍整理、朱陆会通及德性工夫为基础。会通不是另造一套神谱，也不是元朝建立当天自动出现的统一学说。"
 lyd_rite_chenxianzhang:0 "白沙之学"
 lyd_rite_chenxianzhang_adj:0 "白沙之学"
 lyd_rite_chenxianzhang_adherent:0 "白沙之学之儒"
 lyd_rite_chenxianzhang_adherent_plural:0 "白沙之学诸儒"
 lyd_rite_chenxianzhang_desc:0 "陈献章以静养、自得及自身道德体认论学，主要发展于十五世纪后半。不将白沙直接并入后来的阳明学。"
 lyd_rite_zhanruoshui:0 "甘泉之学"
 lyd_rite_zhanruoshui_adj:0 "甘泉之学"
 lyd_rite_zhanruoshui_adherent:0 "甘泉之学之儒"
 lyd_rite_zhanruoshui_adherent_plural:0 "甘泉之学诸儒"
 lyd_rite_zhanruoshui_desc:0 "在动静、内外及具体处境中随处体认天理。湛若水与王阳明论辩，不能简化为王门附属。"
 lyd_rite_wangyangming:0 "阳明学"
 lyd_rite_wangyangming_adj:0 "阳明学"
 lyd_rite_wangyangming_adherent:0 "阳明学之儒"
 lyd_rite_wangyangming_adherent_plural:0 "阳明学诸儒"
 lyd_rite_wangyangming_desc:0 "致良知、知行合一与事上磨炼相互贯通，须持续去除自欺。成熟学说主要在十六世纪，不提前冒称早期开局已有同名学派。"
 lyd_rite_jiangyou:0 "江右王门"
 lyd_rite_jiangyou_adj:0 "江右王门"
 lyd_rite_jiangyou_adherent:0 "江右王门之儒"
 lyd_rite_jiangyou_adherent_plural:0 "江右王门诸儒"
 lyd_rite_jiangyou_desc:0 "以戒惧、慎独与良知持守为重点，成员在静养和实践上仍有差异。不以一个统一公式抹平王门内部讨论。"
 lyd_rite_taizhou:0 "泰州之学"
 lyd_rite_taizhou_adj:0 "泰州之学"
 lyd_rite_taizhou_adherent:0 "泰州之学之儒"
 lyd_rite_taizhou_adherent_plural:0 "泰州之学诸儒"
 lyd_rite_taizhou_desc:0 "普通人的日用生活亦可成圣，尊身与会讲成为学习内容。此路不将所有王艮后学视为同一思想，也不因出身直接判德性。"
 lyd_rite_liuzongzhou:0 "蕺山之学"
 lyd_rite_liuzongzhou_adj:0 "蕺山之学"
 lyd_rite_liuzongzhou_adherent:0 "蕺山之学之儒"
 lyd_rite_liuzongzhou_adherent_plural:0 "蕺山之学诸儒"
 lyd_rite_liuzongzhou_desc:0 "慎独诚意、检点微意与迁善改过是持续工夫。公开认错或做一场善事，不能替代隐微处的自省。"
 lyd_rite_donglin:0 "东林之学"
 lyd_rite_donglin_adj:0 "东林之学"
 lyd_rite_donglin_adherent:0 "东林之学之儒"
 lyd_rite_donglin_adherent_plural:0 "东林之学诸儒"
 lyd_rite_donglin_desc:0 "讲学、躬行义理及公共责任共同构成修养。学统与政治阵营须区别，不把全部东林同党改为教会。"
 lyd_rite_wangfuzhi:0 "船山气学"
 lyd_rite_wangfuzhi_adj:0 "船山气学"
 lyd_rite_wangfuzhi_adherent:0 "船山气学之儒"
 lyd_rite_wangfuzhi_adherent_plural:0 "船山气学诸儒"
 lyd_rite_wangfuzhi_desc:0 "以气化生生、人的判断和实践、知行相资论道。此学主要属于明清之际，不能套用现代无神论教会的标签。"
 lyd_rite_yanli:0 "颜李之学"
 lyd_rite_yanli_adj:0 "颜李之学"
 lyd_rite_yanli_adherent:0 "颜李之学之儒"
 lyd_rite_yanli_adherent_plural:0 "颜李之学诸儒"
 lyd_rite_yanli_desc:0 "礼乐射御书数须亲身习行，躬行而非空谈成德。六艺的实践不是现代教育产业，也不是仅有兵种增益。"
 lyd_rite_qianjia:0 "乾嘉汉学"
 lyd_rite_qianjia_adj:0 "乾嘉汉学"
 lyd_rite_qianjia_adherent:0 "乾嘉汉学之儒"
 lyd_rite_qianjia_adherent_plural:0 "乾嘉汉学诸儒"
 lyd_rite_qianjia_desc:0 "以故训、文献和名物明圣贤之道，考据不取消义理。惠栋、戴震等人仍有差异，情欲与义理的争论不能全部折叠为程朱旧说。"
 lyd_rite_changzhou:0 "常州今文经学"
 lyd_rite_changzhou_adj:0 "常州今文经学"
 lyd_rite_changzhou_adherent:0 "常州今文经学之儒"
 lyd_rite_changzhou_adherent_plural:0 "常州今文经学诸儒"
 lyd_rite_changzhou_desc:0 "据公羊经义、微言大义及时代处境解释经典。后学不断分化，不将康有为全部晚期主张回填到庄存与、刘逢禄。"
 lyd_rite_jingshi:0 "经世实学"
 lyd_rite_jingshi_adj:0 "经世实学"
 lyd_rite_jingshi_adherent:0 "经世实学之儒"
 lyd_rite_jingshi_adherent_plural:0 "经世实学诸儒"
 lyd_rite_jingshi_desc:0 "此为以明清道义、历史与现实事务之学组合的综合路线。亭林、梨洲等可有不同配置，不冒称顾、黄、王曾同属一个统一宗派。"
 lyd_tenet_reverent_heaven_name:0 "敬天明命"
 lyd_tenet_reverent_heaven_desc:0 "敬天意味着承认受命者的道德责任；天的解释可以因学统而异。 斋戒告天，省察失德与祭祀资格。"
 doctrine_parameter_lyd_reverent_heaven_practice:0 "斋戒告天，省察失德与祭祀资格。"
 lyd_tenet_sincerity_solitude_name:0 "诚敬慎独"
 lyd_tenet_sincerity_solitude_desc:0 "无人知晓时也须不自欺，诚敬须贯通意念和行为。 祭前整肃与私下改过；献金不能替代补过。"
 doctrine_parameter_lyd_sincerity_solitude_practice:0 "祭前整肃与私下改过；献金不能替代补过。"
 lyd_tenet_ritual_music_name:0 "礼乐成德"
 lyd_tenet_ritual_music_desc:0 "礼与乐给敬、哀和欲望以合宜形式，使实践成为成德之路。 在释奠、丧祭与雅乐中辨诚敬、节制和炫耀。"
 doctrine_parameter_lyd_ritual_music_practice:0 "在释奠、丧祭与雅乐中辨诚敬、节制和炫耀。"
 lyd_tenet_ancestral_reverence_name:0 "报本敬祖"
 lyd_tenet_ancestral_reverence_desc:0 "祖先追念、丧祭与生者责任互相联系。 以告祖与丧祭表达哀敬，并承担费用和照料之责。"
 doctrine_parameter_lyd_ancestral_reverence_practice:0 "以告祖与丧祭表达哀敬，并承担费用和照料之责。"
 lyd_tenet_names_duties_name:0 "正名践分"
 lyd_tenet_names_duties_desc:0 "名号与身份须与实际履行的责任相称。 说明或纠正僭号、失职与失礼。"
 doctrine_parameter_lyd_names_duties_practice:0 "说明或纠正僭号、失职与失礼。"
 lyd_tenet_humaneness_righteousness_name:0 "仁义为道"
 lyd_tenet_humaneness_righteousness_desc:0 "仁义不能被财富、权势与一时便利取代。 救助、恤孤与宽俘须接受资源代价；见利忘义损害修养。"
 doctrine_parameter_lyd_humaneness_righteousness_practice:0 "救助、恤孤与宽俘须接受资源代价；见利忘义损害修养。"
 lyd_tenet_righteous_remonstrance_name:0 "以义匡谏"
 lyd_tenet_righteous_remonstrance_desc:0 "对亲长和君主的责任也包含劝止不义。 承担进谏的关系代价，不以此制造无限牵制。"
 doctrine_parameter_lyd_righteous_remonstrance_practice:0 "承担进谏的关系代价，不以此制造无限牵制。"
 lyd_tenet_sage_transmission_name:0 "尊圣传道"
 lyd_tenet_sage_transmission_desc:0 "传承成德之道须以经典、教学与德行相互印证。 受业、传书与谒圣；真传之说须接受问学和德行检验。"
 doctrine_parameter_lyd_sage_transmission_practice:0 "受业、传书与谒圣；真传之说须接受问学和德行检验。"
 lyd_tenet_extend_sprouts_name:0 "扩充四端"
 lyd_tenet_extend_sprouts_desc:0 "恻隐、羞恶、辞让与是非之心是善的萌芽，仍须扩充。 在连续抉择中践行善端，不能只自称心善。"
 doctrine_parameter_lyd_extend_sprouts_practice:0 "在连续抉择中践行善端，不能只自称心善。"
 lyd_tenet_deliberate_cultivation_name:0 "化性起伪"
 lyd_tenet_deliberate_cultivation_desc:0 "师法、习礼和有意识的努力改变未经养成的欲望。 反复学习并约束争夺；人为之伪不是欺骗。"
 doctrine_parameter_lyd_deliberate_cultivation_practice:0 "反复学习并约束争夺；人为之伪不是欺骗。"
 lyd_tenet_righteous_qi_name:0 "集义养气"
 lyd_tenet_righteous_qi_desc:0 "浩然之气由持续行义积累，不能由一次表演获得。 守已承担的义务，临事违义损害积累。"
 doctrine_parameter_lyd_righteous_qi_practice:0 "守已承担的义务，临事违义损害积累。"
 lyd_tenet_portent_reflection_name:0 "灾异省身"
 lyd_tenet_portent_reflection_desc:0 "灾异可被解释为省过之警，但解释需要论辩。 灾后问礼、告祭和省过；不能召唤灾害。"
 doctrine_parameter_lyd_portent_reflection_practice:0 "灾后问礼、告祭和省过；不能召唤灾害。"
 lyd_tenet_qi_kinship_name:0 "气化同体"
 lyd_tenet_qi_kinship_desc:0 "气化连接天地万物，民胞物与带来道德责任。 在丧祭与照料中思索生死，承担实际责任。"
 doctrine_parameter_lyd_qi_kinship_practice:0 "在丧祭与照料中思索生死，承担实际责任。"
 lyd_tenet_investigate_principle_name:0 "格物穷理"
 lyd_tenet_investigate_principle_desc:0 "经书、礼仪和日用人伦皆可成为探求理的对象。 考察伦理疑案并践行所得，不止积累章句。"
 doctrine_parameter_lyd_investigate_principle_practice:0 "考察伦理疑案并践行所得，不止积累章句。"
 lyd_tenet_reverent_attention_name:0 "居敬涵养"
 lyd_tenet_reverent_attention_desc:0 "敬须贯通动静与日用，省察骄矜及私欲。 持续约束自欺与骄矜，不禁止正常情感。"
 doctrine_parameter_lyd_reverent_attention_practice:0 "持续约束自欺与骄矜，不禁止正常情感。"
 lyd_tenet_original_heart_name:0 "发明本心"
 lyd_tenet_original_heart_desc:0 "本心的道德根据不能与任性的欲求等同。 在权势与良心冲突中辨大本，改过和行动检验自得。"
 doctrine_parameter_lyd_original_heart_practice:0 "在权势与良心冲突中辨大本，改过和行动检验自得。"
 lyd_tenet_innate_knowing_name:0 "致良知"
 lyd_tenet_innate_knowing_desc:0 "落实良知须持续去除自欺。 联系意念与处境，向不同出身者问道。"
 doctrine_parameter_lyd_innate_knowing_practice:0 "联系意念与处境，向不同出身者问道。"
 lyd_tenet_knowing_acting_name:0 "知行合一"
 lyd_tenet_knowing_acting_desc:0 "真知与践行不可被空谈割裂。 用明确承担的行动验证许诺，失约须补过。"
 doctrine_parameter_lyd_knowing_acting_practice:0 "用明确承担的行动验证许诺，失约须补过。"
 lyd_tenet_textual_ritual_name:0 "据经考礼"
 lyd_tenet_textual_ritual_desc:0 "礼器、祭序及配享须能说明其经据。 论礼与诚敬共同决定实践，贵重器物不自动正确。"
 doctrine_parameter_lyd_textual_ritual_practice:0 "论礼与诚敬共同决定实践，贵重器物不自动正确。"
 lyd_tenet_classical_synthesis_name:0 "诸经会通"
 lyd_tenet_classical_synthesis_desc:0 "多部经传可相互阐发，同时须辨异同。 比较传注与跨经义案，不以一本书包办所有真义。"
 doctrine_parameter_lyd_classical_synthesis_practice:0 "比较传注与跨经义案，不以一本书包办所有真义。"
 lyd_tenet_annals_judgment_name:0 "春秋明义"
 lyd_tenet_annals_judgment_desc:0 "春秋褒贬与经义解释关乎行为之义。 以论经辨现实伦理，不将史论无限转成处罚。"
 doctrine_parameter_lyd_annals_judgment_practice:0 "以论经辨现实伦理，不将史论无限转成处罚。"
 lyd_tenet_constant_heaven_name:0 "天行有常"
 lyd_tenet_constant_heaven_desc:0 "自然运行有常，道德责任应在人事中求。 祈雨和灾异可依礼文解释，拒绝天谴不取消祭礼。"
 doctrine_parameter_lyd_constant_heaven_practice:0 "祈雨和灾异可依礼文解释，拒绝天谴不取消祭礼。"
 lyd_tenet_restore_nature_name:0 "澄心复性"
 lyd_tenet_restore_nature_desc:0 "善性可能被邪妄之情遮蔽，静养有助复性。 澄心返观，避免以静养为逃避人伦责任。"
 doctrine_parameter_lyd_restore_nature_practice:0 "澄心返观，避免以静养为逃避人伦责任。"
 lyd_tenet_ordinary_life_name:0 "百姓日用"
 lyd_tenet_ordinary_life_desc:0 "普通人的日用也有成圣可能。 会讲、日用伦理与跨身份问学。"
 doctrine_parameter_lyd_ordinary_life_practice:0 "会讲、日用伦理与跨身份问学。"
 lyd_tenet_six_arts_name:0 "六艺习行"
 lyd_tenet_six_arts_desc:0 "六艺须亲身习行，不能仅凭书本空谈。 持续习礼、雅乐与射礼，承担训练成本。"
 doctrine_parameter_lyd_six_arts_practice:0 "持续习礼、雅乐与射礼，承担训练成本。"
 lyd_tenet_philological_way_name:0 "循文见道"
 lyd_tenet_philological_way_desc:0 "故训和文献证据可通向圣贤之道。 校勘辨伪后说明伦理意义，也接受依据动摇。"
 doctrine_parameter_lyd_philological_way_practice:0 "校勘辨伪后说明伦理意义，也接受依据动摇。"
 lyd_tenet_moral_achievement_name:0 "道义事功"
 lyd_tenet_moral_achievement_desc:0 "道义须面对实践与后果，逐利不因此成为德性。 检验救助和礼义抉择的实际结果。"
 doctrine_parameter_lyd_moral_achievement_practice:0 "检验救助和礼义抉择的实际结果。"
 lyd_tenet_restrain_violence_name:0 "制暴安民"
 lyd_tenet_restrain_violence_desc:0 "义战须受禁暴救民之义约束。 祭告与誓约约束私利、滥杀和抢掠；常设修会须另建制度。"
 doctrine_parameter_lyd_restrain_violence_practice:0 "祭告与誓约约束私利、滥杀和抢掠；常设修会须另建制度。"
 lyd_tenet_subtle_intentions_name:0 "微意改过"
 lyd_tenet_subtle_intentions_desc:0 "极微意念亦须检点，改过不能靠公开表演。 私下省察并具体补过，不以反复认错代替持续修养。"
 doctrine_parameter_lyd_subtle_intentions_practice:0 "私下省察并具体补过，不以反复认错代替持续修养。"
 lyd_tenet_responsive_interpretation_name:0 "义理通变"
 lyd_tenet_responsive_interpretation_desc:0 "可依据经义回应时代处境，各家传承仍有不同。 提出有经据的变通，承受旧说争论。"
 doctrine_parameter_lyd_responsive_interpretation_practice:0 "提出有经据的变通，承受旧说争论。"
 lyd_tenet_images_numbers_name:0 "观象体易"
 lyd_tenet_images_numbers_desc:0 "象数、运行与观物可表达对天道的理解。 论易解象，不保证预言或操控未来。"
 doctrine_parameter_lyd_images_numbers_practice:0 "论易解象，不保证预言或操控未来。"
 lyd_tenet_profound_interpretation_name:0 "会通玄理"
 lyd_tenet_profound_interpretation_desc:0 "贵无、独化与名教自然有不同解释。 通过解经与论辩辨根本，不将王弼郭象宇宙论合一。"
 doctrine_parameter_lyd_profound_interpretation_practice:0 "通过解经与论辩辨根本，不将王弼郭象宇宙论合一。"
 lyd_tenet_knowing_acting_support_name:0 "知行相资"
 lyd_tenet_knowing_acting_support_desc:0 "知与行各有功用并相互支持。 问学与实践交互推进，不等同阳明的全部命题。"
 doctrine_parameter_lyd_knowing_acting_support_practice:0 "问学与实践交互推进，不等同阳明的全部命题。"
 lyd_tenet_ongoing_generation_name:0 "万物生生"
 lyd_tenet_ongoing_generation_desc:0 "天地生成与阴阳变化进入生命与道德的解释。 在祭仪、养性与生死问题中保留各家的理气差异。"
 doctrine_parameter_lyd_ongoing_generation_practice:0 "在祭仪、养性与生死问题中保留各家的理气差异。"
 lyd_tenet_quiet_self_attainment_name:0 "静养自得"
 lyd_tenet_quiet_self_attainment_desc:0 "静养与自身体认可助于得道。 辨静养、读经与自得，不因独处自动成圣。"
 doctrine_parameter_lyd_quiet_self_attainment_practice:0 "辨静养、读经与自得，不因独处自动成圣。"
 lyd_tenet_recognition_everywhere_name:0 "随处体认"
 lyd_tenet_recognition_everywhere_desc:0 "天理须在动静内外及具体处境中体认。 在祭仪和日用中求理，不预设天理与良知完全同义。"
 doctrine_parameter_lyd_recognition_everywhere_practice:0 "在祭仪和日用中求理，不预设天理与良知完全同义。"
 lyd_practice_kongmen_t:0 "祭礼中的诚敬"
 lyd_practice_kongmen_desc:0 "谒圣祭礼将近，礼生呈来器物与雅乐的安排。有人主张以华丽陈设显扬你的敬意，但你知道，若心不在礼，繁华也只是摆设。该如何准备这次祭礼？"
 lyd_practice_kongmen_a:0 "减去浮饰，亲自习礼。"
 lyd_practice_kongmen_a_tt:0 "用合宜的器物与亲身准备表达敬意。"
 lyd_practice_kongmen_b:0 "备齐乐舞，也给礼生留足准备。"
 lyd_practice_kongmen_b_tt:0 "礼乐可相助，筹备与授业也有代价。"
 lyd_practice_kongmen_c:0 "让贵重礼物替我说明诚意。"
 lyd_practice_kongmen_c_tt:0 "陈设足以引人注目，却不能代替内在诚敬。"
 lyd_practice_mengzi_t:0 "善端与眼前之人"
 lyd_practice_mengzi_desc:0 "祭礼筹备时，一名送来器物的人受伤倒下。你的礼生担心误了时辰，劝你先把祝辞读完。此刻的恻隐之心，应怎样成为真正的行动？"
 lyd_practice_mengzi_a:0 "先安排救护，我承担误时之责。"
 lyd_practice_mengzi_a_tt:0 "在经权抉择中扩充恻隐，承担费用与议论。"
 lyd_practice_mengzi_b:0 "由我另遣人照料，祭礼从简举行。"
 lyd_practice_mengzi_b_tt:0 "兼顾照料与礼仪，仍须实际出资。"
 lyd_practice_mengzi_c:0 "我心中已有恻隐，照旧诵礼便是。"
 lyd_practice_mengzi_c_tt:0 "善端若不扩充到行动，不能只凭自称心善成德。"
 lyd_practice_xunzi_t:0 "给哀伤以礼"
 lyd_practice_xunzi_desc:0 "丧祭习礼中，礼生只顾催促每一步仪节，哀者反而愈加慌乱。礼既非任情失序，也不该成为空洞的动作。你决定如何重新准备？"
 lyd_practice_xunzi_a:0 "依师法重习，让仪节安顿哀情。"
 lyd_practice_xunzi_a_tt:0 "反复习礼，以人为努力使情感得到合宜表达。"
 lyd_practice_xunzi_b:0 "先安顿众人，再删去不合宜的铺陈。"
 lyd_practice_xunzi_b_tt:0 "礼须养情，节制铺陈并非取消祭祀。"
 lyd_practice_xunzi_c:0 "动作整齐就够了，不必管心中如何。"
 lyd_practice_xunzi_c_tt:0 "失去养情之实，仪节易成为空文。"
 lyd_practice_zhengxuan_t:0 "丘郊与配享之辨"
 lyd_practice_zhengxuan_desc:0 "祖祭之前，礼生拿来一份用于讲礼的祭图，竟把昊天与感生帝、圜丘与郊祭的说明混在一起。祖先配享的依据也因此含混。你不愿僭行国礼，但须决定如何澄清这份解说。"
 lyd_practice_zhengxuan_a:0 "据郑氏之说，分别考定祭祀对象与配享。"
 lyd_practice_zhengxuan_a_tt:0 "先辨祭祀对象与资格，再说明丘郊之别。"
 lyd_practice_zhengxuan_b:0 "请礼生保存异说，祖祭只用已明之礼。"
 lyd_practice_zhengxuan_b_tt:0 "保留论礼证据，同时不将疑案变成僭祀。"
 lyd_practice_zhengxuan_c:0 "只要祝辞气派，何必分得这样细？"
 lyd_practice_zhengxuan_c_tt:0 "忽略对象与配享，铺张无法弥补礼据不足。"
 lyd_practice_wangsu_t:0 "禘礼与祖源"
 lyd_practice_wangsu_desc:0 "祖祭筹备时，礼生据一份旧解，把追享祖源写成向感生帝祈福。你所学的王氏礼说却不这样解释禘。如何面对这份有分歧的解说？"
 lyd_practice_wangsu_a:0 "考明祖源，重写解说中的祭祀对象。"
 lyd_practice_wangsu_a_tt:0 "依王氏之义辨禘享祖源，不混同感生与祖先。"
 lyd_practice_wangsu_b:0 "并列郑王异说，先守合资格的家祭。"
 lyd_practice_wangsu_b_tt:0 "论礼可以容纳异说，实际祭礼仍须守其资格。"
 lyd_practice_wangsu_c:0 "把所有称谓都添上，总会有一个受享。"
 lyd_practice_wangsu_c_tt:0 "不辨名实的堆砌，与据经考礼相背。"
 lyd_practice_jingshu_t:0 "传注之间的问礼"
 lyd_practice_jingshu_desc:0 "一件丧服疑案摆在眼前。两种传注的用语相近，适用的亲属关系却不同。有人建议只用最贵的服饰，以免显得失礼；你仍须说明此礼为何合宜。"
 lyd_practice_jingshu_a:0 "核对经文与旧注，再说明适用关系。"
 lyd_practice_jingshu_a_tt:0 "在具体名物与亲属关系中据经辨礼。"
 lyd_practice_jingshu_b:0 "向师长问明异同，也保留尚未解开的疑义。"
 lyd_practice_jingshu_b_tt:0 "问学允许存疑，不能假装已通尽诸经。"
 lyd_practice_jingshu_c:0 "购置最贵的服饰，免去查考。"
 lyd_practice_jingshu_c_tt:0 "贵重不能替代礼据和诚敬。"
 lyd_practice_zhuxi_t:0 "问理而后行礼"
 lyd_practice_zhuxi_desc:0 "祖祭的礼文已誊清，但你发现自己只会复述步骤，未能说明为何如此。礼生问你，是先把经义和实际礼事相对照，还是只求在众人面前完成一次漂亮的祭礼？"
 lyd_practice_zhuxi_a:0 "问明此礼之理，再亲身习行。"
 lyd_practice_zhuxi_a_tt:0 "把穷理、持敬与报本连在实际行动中。"
 lyd_practice_zhuxi_b:0 "先从简持敬，将疑处记下继续问学。"
 lyd_practice_zhuxi_b_tt:0 "承认理解未足，持续涵养而不废祭礼。"
 lyd_practice_zhuxi_c:0 "多添供物，别人看不出我未明其理。"
 lyd_practice_zhuxi_c_tt:0 "炫示会遮蔽问学，礼物不能代替成德工夫。"
 lyd_practice_lujiuyuan_t:0 "祝辞与本心"
 lyd_practice_lujiuyuan_desc:0 "祭礼前读祝时，你发现其中赞扬自身德行的话，远过于自己真正做过的事。众人也许不会察觉，但你知道这份夸饰。发明本心，该如何落实在眼前？"
 lyd_practice_lujiuyuan_a:0 "删去自饰之辞，承认我仍须改过。"
 lyd_practice_lujiuyuan_a_tt:0 "显明本心须去自欺，承担名声和意念中的代价。"
 lyd_practice_lujiuyuan_b:0 "据经问师，使祝辞与实际行为相称。"
 lyd_practice_lujiuyuan_b_tt:0 "本心与问学可以相助，陆学不等于拒绝经典。"
 lyd_practice_lujiuyuan_c:0 "既然我自认为有德，照旧读下去。"
 lyd_practice_lujiuyuan_c_tt:0 "自信不能把任性或夸饰变成道德根据。"
 lyd_practice_dongzhongshu_t:0 "灾异之后，谁当省过？"
 lyd_practice_dongzhongshu_desc:0 "一场异象引起议论，讲席有人从《春秋》褒贬追问失德，有人急于把它解释成对仇人的天罚。祭前的敬畏若只用来指责别人，还能成为自己的省察吗？"
 lyd_practice_dongzhongshu_a:0 "先检我所失，不借灾异推过。"
 lyd_practice_dongzhongshu_a_tt:0 "以谴告之说要求自身改过，承担损失颜面与省察的压力。"
 lyd_practice_dongzhongshu_b:0 "并读经说，保留不同的解释。"
 lyd_practice_dongzhongshu_b_tt:0 "以公羊经义讨论责任，不把争议的征兆当作已证天罚。"
 lyd_practice_dongzhongshu_c:0 "宣称天只责我的对手。"
 lyd_practice_dongzhongshu_c_tt:0 "借天命之名取得声势，却避开自身所当承担的义。"
 lyd_practice_guwen_t:0 "名物异文与祭器"
 lyd_practice_guwen_desc:0 "一件旧祭器的名称与传注不同，新抄本又给出另一种读法。礼生盼你立即定说，你却尚未辨明经文、旧注与实物各自能证明什么。"
 lyd_practice_guwen_a:0 "辨故训与实物，暂缓定说。"
 lyd_practice_guwen_a_tt:0 "把名物考证用于礼义，付出反复查验的工夫。"
 lyd_practice_guwen_b:0 "列明异说，依可据之礼备祭。"
 lyd_practice_guwen_b_tt:0 "保留传注的限度，也让祭前准备有可说明的经据。"
 lyd_practice_guwen_c:0 "器物贵重，自可证明其正确。"
 lyd_practice_guwen_c_tt:0 "以财力代替经据，外观的声望难以成为明礼之学。"
 lyd_practice_wangbi_t:0 "象、言与所指之义"
 lyd_practice_wangbi_desc:0 "讲《易》时，众人争相临摹卦象，却少有人说明它们所指的义。有人还建议祭前增添符饰，声称图样越多便越能掌握天道。"
 lyd_practice_wangbi_a:0 "循言象求义，再问其根本。"
 lyd_practice_wangbi_a_tt:0 "崇本并非无需读经，须从解释进入所要理解的义。"
 lyd_practice_wangbi_b:0 "减去无谓符饰，使习礼归于本意。"
 lyd_practice_wangbi_b_tt:0 "不拘装饰而保留合宜仪节，把理解用于亲身习礼。"
 lyd_practice_wangbi_c:0 "凭更多符饰宣称已能操纵天道。"
 lyd_practice_wangbi_c_tt:0 "执图样为实效，背离求义；此宣称不会产生真实法术。"
 lyd_practice_guoxiang_t:0 "性分与强作"
 lyd_practice_guoxiang_desc:0 "习礼中，一位学者要求所有人照同一种姿态、同一种声调完成仪节。新学者愈学愈拘，原有的责任也被搁置。何种自得才与名教相容？"
 lyd_practice_guoxiang_a:0 "因各人性分施教，仍使其履行礼责。"
 lyd_practice_guoxiang_a_tt:0 "自得不取消责任，须花工夫辨其所能而使礼有实。"
 lyd_practice_guoxiang_b:0 "去强作而安其分，重新习礼。"
 lyd_practice_guoxiang_b_tt:0 "减少勉强模仿的负担，保留各自所当承担的仪节。"
 lyd_practice_guoxiang_c:0 "既言自然，失礼失职也无需问。"
 lyd_practice_guoxiang_c_tt:0 "把自然当作逃避责任的借口，不能由此证明自得。"
 lyd_practice_hanyu_t:0 "祭圣之日，何谓传道？"
 lyd_practice_hanyu_desc:0 "祭圣之前，讲席论及师道与人伦。有门人提议只须高声排斥佛道，便能证明真传；另一人却问，传道者是否先履行了眼前的仁义。"
 lyd_practice_hanyu_a:0 "据仁义辩原道，也审我之所行。"
 lyd_practice_hanyu_a_tt:0 "把论辩落在人伦与师道，承受被问难的压力。"
 lyd_practice_hanyu_b:0 "奉祀先师，亲自承担授业与照料。"
 lyd_practice_hanyu_b_tt:0 "圣道承传须有躬行，仪节与承担不能只停留于口号。"
 lyd_practice_hanyu_c:0 "让不相干的佛道人物替我背过。"
 lyd_practice_hanyu_c_tt:0 "排斥他人可以招来声势，却不能代替仁义和改过。"
 lyd_practice_liao_t:0 "复性与未平之情"
 lyd_practice_liao_desc:0 "祭前省察时，你发现愤怒与求名不断搅动心念。有学者劝你澄心，也有人说只要毫无悲喜便已复性。诚如何贯通静养与行事？"
 lyd_practice_liao_a:0 "澄心去妄，辨明纷扰所从来。"
 lyd_practice_liao_a_tt:0 "静养用于去妄，暂离求名以减轻心念纷扰。"
 lyd_practice_liao_b:0 "把所辨之诚落实于祭前与待人。"
 lyd_practice_liao_b_tt:0 "以实际准备检验内心，承担自省而非只求空静。"
 lyd_practice_liao_c:0 "强压哀喜，宣称我已全无情。"
 lyd_practice_liao_c_tt:0 "逞示无情不能替代诚与复性，压抑也带来负担。"
 lyd_practice_zhoudunyi_t:0 "诚与静，如何落于日用？"
 lyd_practice_zhoudunyi_desc:0 "你在讲席读到阴阳生化与诚的讨论。门人备下图说，盼你把它挂在祭所；可你的心仍被求名牵动。观图与静养，应当怎样相助？"
 lyd_practice_zhoudunyi_a:0 "静养少欲，先使祭前诚心有本。"
 lyd_practice_zhoudunyi_a_tt:0 "以静养检点欲念，减少外求声名而养诚。"
 lyd_practice_zhoudunyi_b:0 "研读生化之说，再以日用验其诚。"
 lyd_practice_zhoudunyi_b_tt:0 "图说须与成德相贯，不把解释天地变成陈设而已。"
 lyd_practice_zhoudunyi_c:0 "只请人悬图，便宣称我已得道。"
 lyd_practice_zhoudunyi_c_tt:0 "以符号代替工夫，图说本身不会赋予圣德或法力。"
 lyd_practice_chengbrothers_t:0 "仁的体认与持敬的工夫"
 lyd_practice_chengbrothers_desc:0 "讲席讨论仁与敬。有门人偏重体认人与万物的联系，另有人强调整肃心念与求理。祭前的一次怠慢使你看见，讲得明白未必等于行得真切。"
 lyd_practice_chengbrothers_a:0 "由待人之仁反求祭礼之敬。"
 lyd_practice_chengbrothers_a_tt:0 "以仁的体认检验待人，出资照料并减少隔阂。"
 lyd_practice_chengbrothers_b:0 "持敬求理，逐项反省怠慢所由。"
 lyd_practice_chengbrothers_b_tt:0 "整肃心念并持续问学，工夫更重而非仅守外形。"
 lyd_practice_chengbrothers_c:0 "只说天理在我，何须再问待人？"
 lyd_practice_chengbrothers_c_tt:0 "以天理之名自免省察，不能由此证明仁或敬。"
 lyd_practice_zhangzai_t:0 "报本与民胞物与"
 lyd_practice_zhangzai_desc:0 "讲席以气化论天人联系，祭礼却使你先看见自身仍有偏私。有族人问：若只敬自己的祖先，而全然不顾眼前他人的哀苦，如何说民胞物与？"
 lyd_practice_zhangzai_a:0 "亲习礼以变化气质，先改自身偏私。"
 lyd_practice_zhangzai_a_tt:0 "气质之性须经工夫变化，反复习礼并非一言悟道。"
 lyd_practice_zhangzai_b:0 "敬祖之余，也承担对哀者的照料。"
 lyd_practice_zhangzai_b_tt:0 "把民胞物与落实于照料，报本与待人各有实际责任。"
 lyd_practice_zhangzai_c:0 "既都由气化，便不必哀敬或照料。"
 lyd_practice_zhangzai_c_tt:0 "以宇宙解释卸去人的工夫，背离礼与变化气质之责。"
 lyd_practice_shaoyong_t:0 "观物不等于预知"
 lyd_practice_shaoyong_desc:0 "有人带来象数推演，请你在祭礼讲席宣布来岁祸福已定。你愿意由观物理解天地，却也知道，说明一种秩序与准确预知每件事并非一回事。"
 lyd_practice_shaoyong_a:0 "细读象数，说明所能解释与所不能知。"
 lyd_practice_shaoyong_a_tt:0 "观物成为问学工夫，承认未知可能损及神秘声望。"
 lyd_practice_shaoyong_b:0 "以时序安排习礼，不许必应之诺。"
 lyd_practice_shaoyong_b_tt:0 "将对天道运行的理解用于合宜准备，仍不操纵天时。"
 lyd_practice_shaoyong_c:0 "宣称推演已证明所有未来。"
 lyd_practice_shaoyong_c_tt:0 "以确定预言取悦听众，越过解释的限度；不会生成预知能力。"
 lyd_practice_wanganshi_t:0 "旧注、新义与祭前问学"
 lyd_practice_wanganshi_desc:0 "重读《周礼》时，新义与旧注在一处仪节解释上相异。门人盼你只宣布新说胜出，你却要说明，经义怎样回应眼前处境而不成为任意的借口。"
 lyd_practice_wanganshi_a:0 "并核经文与旧注，使新义经得起问难。"
 lyd_practice_wanganshi_a_tt:0 "重新解释仍须经据与论证，不能因名为新学便自免问学。"
 lyd_practice_wanganshi_b:0 "据可说明的经义改进这次习礼。"
 lyd_practice_wanganshi_b_tt:0 "把经义用于具体处境，另付准备费用并承担说明责任。"
 lyd_practice_wanganshi_c:0 "既是我的新义，便无需再核经据。"
 lyd_practice_wanganshi_c_tt:0 "以学派名号代替经义，声势不能证明理解。"
 lyd_practice_sushi_t:0 "人情在礼中何所安？"
 lyd_practice_sushi_desc:0 "丧祭讲席上，一篇经义解释得十分整齐，却使哀者无从表达真情。另一篇只谈旷达，又近乎略去礼责。你要如何在经义、人情与礼的分寸之间求义？"
 lyd_practice_sushi_a:0 "辨经义所指，不以整齐辞句盖过人情。"
 lyd_practice_sushi_a_tt:0 "经义的理解接受人情与仪节的检验，增加问学负担。"
 lyd_practice_sushi_b:0 "因哀者真情简繁合宜，使礼有所安。"
 lyd_practice_sushi_b_tt:0 "以费用和亲身筹备安顿哀敬，不以放达免去礼责。"
 lyd_practice_sushi_c:0 "自称旷达，连哀敬与仪节也省去。"
 lyd_practice_sushi_c_tt:0 "以名士姿态省去承担，不能由此证明经义已明。"
 lyd_practice_huxiang_t:0 "察识之后，如何涵养？"
 lyd_practice_huxiang_desc:0 "一位门人自称已察识仁心，祭前遇到烦扰却仍轻慢待人。另一位只求安静，又不愿检点临事所发。识得与养得，究竟怎样相互检验？"
 lyd_practice_huxiang_a:0 "察所发之心，辨一念中有无自欺。"
 lyd_practice_huxiang_a_tt:0 "察识不能只成一句自称，须承受辨心与改过的工夫。"
 lyd_practice_huxiang_b:0 "以日用涵养，使所得见于待人习礼。"
 lyd_practice_huxiang_b_tt:0 "持续涵养以检验所得，减少纷扰而非逃避实际责任。"
 lyd_practice_huxiang_c:0 "既已识仁，今后行为便无须再问。"
 lyd_practice_huxiang_c_tt:0 "一次体认之名不能免除后续工夫。"
 lyd_practice_yongjia_t:0 "成效能否代替义？"
 lyd_practice_yongjia_desc:0 "祭前筹备兼有照料哀者之责。一位门人只计算名声与支出，另一位只空谈义理而不问事情是否真正办成。经义怎样在具体事情中接受检验？"
 lyd_practice_yongjia_a:0 "据名物与经义查明此礼应尽之责。"
 lyd_practice_yongjia_a_tt:0 "不以抽象口号代替具体查验，也不唯计一时利得。"
 lyd_practice_yongjia_b:0 "出资补足照料，使礼义有实际结果。"
 lyd_practice_yongjia_b_tt:0 "事功须受义的检验；资源支出换来承担而非财富即德。"
 lyd_practice_yongjia_c:0 "只要赚得声名，便算义利皆得。"
 lyd_practice_yongjia_c_tt:0 "把有利结果当成德性的充分证明，削弱求义工夫。"
 lyd_practice_yongkang_t:0 "读史之义与眼前祭礼"
 lyd_practice_yongkang_desc:0 "讲席以往事争论道义与事功，一人只称功业足以证明一切，另一人只赞清谈却不肯承担祭前照料。你愿让史学问难怎样进入自己的工夫？"
 lyd_practice_yongkang_a:0 "辨成败中的道义，不凭结果抹去责任。"
 lyd_practice_yongkang_a_tt:0 "历史问难须同时看道义与处境，可能损失直截声名。"
 lyd_practice_yongkang_b:0 "将所知之义付诸此次照料与习礼。"
 lyd_practice_yongkang_b_tt:0 "行义养气有具体代价，不能只借往事激昂自许。"
 lyd_practice_yongkang_c:0 "我所赞的强盛，当然也就是德性。"
 lyd_practice_yongkang_c_tt:0 "以强盛压倒求义，功业的声势不能免除辨析。"
 lyd_practice_wucheng_t:0 "会通要不要抹平异说？"
 lyd_practice_wucheng_desc:0 "经籍整理时，两种注解在求理与发明本心上各有侧重。门人盼把不同处删去，写成一篇毫无疑义的定论。你当如何使会通仍保留问学？"
 lyd_practice_wucheng_a:0 "校订经籍，明列各说所能与所未明。"
 lyd_practice_wucheng_a_tt:0 "会通需要细读差异，不能以同一结论省去论证。"
 lyd_practice_wucheng_b:0 "让居敬与反求本心共同进入习礼。"
 lyd_practice_wucheng_b_tt:0 "以实际工夫相互检验，仍承担准备与讲论的费用。"
 lyd_practice_wucheng_c:0 "删去难处，宣布诸家从来没有分歧。"
 lyd_practice_wucheng_c_tt:0 "表面一致换来声望，却遮蔽了会通所须面对的问题。"
 lyd_practice_chenxianzhang_t:0 "静养所得，能否不问人？"
 lyd_practice_chenxianzhang_desc:0 "静养时，你觉得纷扰渐息，却也想让众人知道自己已有所得。门人问，内在自得是否可以免去受教与日常待人的检验。"
 lyd_practice_chenxianzhang_a:0 "守静养而不急于示人所得。"
 lyd_practice_chenxianzhang_a_tt:0 "自得不靠旁人喝彩，暂舍声名而减轻纷扰。"
 lyd_practice_chenxianzhang_b:0 "在日用与受教中检验我所自得。"
 lyd_practice_chenxianzhang_b_tt:0 "内在体认须接受自身行为的检验，继续问学而非任意。"
 lyd_practice_chenxianzhang_c:0 "宣称我已自得，所有问难皆可不理。"
 lyd_practice_chenxianzhang_c_tt:0 "以自得之名拒绝检验，声望不能证明真实工夫。"
 lyd_practice_zhanruoshui_t:0 "此处亦能体认天理吗？"
 lyd_practice_zhanruoshui_desc:0 "祭前有器物待整，也有宾客待迎。一位门人说只有离开这些俗务、长坐无事，才可能体认天理。你却要问动静内外是否真能如此截断。"
 lyd_practice_zhanruoshui_a:0 "就在整器待人之间反省所发之心。"
 lyd_practice_zhanruoshui_a_tt:0 "随处体认要求临事省察，日常处境同样有工夫负担。"
 lyd_practice_zhanruoshui_b:0 "并论动静之说，再以此礼相互检验。"
 lyd_practice_zhanruoshui_b_tt:0 "问学与体认相助，不因处境繁忙便取消经义说明。"
 lyd_practice_zhanruoshui_c:0 "既称处处天理，我的怠慢也无需改。"
 lyd_practice_zhanruoshui_c_tt:0 "把天理之名当作失责的护符，无法替代省察。"
 lyd_practice_wangyangming_t:0 "知道恻隐，然后呢？"
 lyd_practice_wangyangming_desc:0 "祭前你已看见一名受委屈者，也知道自己的允诺尚未兑现。门人称赞你已有良知，你却明白，知道该做什么与真实承担不能彼此割裂。"
 lyd_practice_wangyangming_a:0 "兑现我所知应尽之责，不再推延。"
 lyd_practice_wangyangming_a_tt:0 "在事上磨炼承担资源与名声代价，不以心善自免行动。"
 lyd_practice_wangyangming_b:0 "检点自欺，使祭前诚意与所行相合。"
 lyd_practice_wangyangming_b_tt:0 "致良知须持续去蔽，问学与习礼服务于实际工夫。"
 lyd_practice_wangyangming_c:0 "知道行善已经足够，允诺可以不兑现。"
 lyd_practice_wangyangming_c_tt:0 "把知与行截断，以良知之名掩饰自欺。"
 lyd_practice_jiangyou_t:0 "戒惧是警醒，还是表演？"
 lyd_practice_jiangyou_desc:0 "祭前独处时，一个求名的念头使你不安。有门人劝你时时检点，也有人只让你反复说戒惧之辞，仿佛外在紧张便能证明内心真实。"
 lyd_practice_jiangyou_a:0 "于隐微处慎独，诚实辨认求名之念。"
 lyd_practice_jiangyou_a_tt:0 "戒惧用于不自欺，须承担持续检点的压力。"
 lyd_practice_jiangyou_b:0 "静养持守，再把所得用于待人习礼。"
 lyd_practice_jiangyou_b_tt:0 "良知持守与实际行为相检验，安静不等于放弃责任。"
 lyd_practice_jiangyou_c:0 "只显出惶恐姿态，便算已有真工夫。"
 lyd_practice_jiangyou_c_tt:0 "外在戒惧之貌代替慎独，紧张本身不能证明诚意。"
 lyd_practice_taizhou_t:0 "日用之学，谁可来问？"
 lyd_practice_taizhou_desc:0 "一场会讲之后，有身份卑微的听者问能否从自己的日用生活修己。也有人只想把自得解释成随意而行。尊身与日用成圣，如何不失自省？"
 lyd_practice_taizhou_a:0 "使会讲回应日用之问，也要求各人修己。"
 lyd_practice_taizhou_a_tt:0 "学习不因身份卑微而失去意义，授业仍须费用与承担。"
 lyd_practice_taizhou_b:0 "尊身养护，却不以便利免去礼责。"
 lyd_practice_taizhou_b_tt:0 "日用工夫包含照顾身体与省察行为，减少耗损并非任性。"
 lyd_practice_taizhou_c:0 "凡我觉得自在的，就直接称为道。"
 lyd_practice_taizhou_c_tt:0 "便利与自得被混为一谈，失去持续修己的要求。"
 lyd_practice_liuzongzhou_t:0 "无人知处的一点求名"
 lyd_practice_liuzongzhou_desc:0 "你准备在祭前公开认错，却发现心中仍盼众人称赞。若连认错也藏着求名之意，怎样才算迁善改过，而不是又一次表演？"
 lyd_practice_liuzongzhou_a:0 "独处检点微意，记录所当改的真实过失。"
 lyd_practice_liuzongzhou_a_tt:0 "慎独诚意须在隐微处用力，承受不求赞许的省察。"
 lyd_practice_liuzongzhou_b:0 "先补过于实际，不让认错代替补过。"
 lyd_practice_liuzongzhou_b_tt:0 "迁善落实于修复责任，资源支出不能只换得表演名声。"
 lyd_practice_liuzongzhou_c:0 "办一场隆重认错，让众人忘记后续责任。"
 lyd_practice_liuzongzhou_c_tt:0 "公开姿态掩去微意与补过，声望不能替代持续诚意。"
 lyd_practice_donglin_t:0 "讲席的公义与同党的声名"
 lyd_practice_donglin_desc:0 "会讲后有人提出祭前筹备中的失责，另一人劝你只维护同门声名，不必听外人的问难。尊师与共同讲学，是否也要求反过来检验自己的行为？"
 lyd_practice_donglin_a:0 "让问难进入讲席，不因同门而掩过。"
 lyd_practice_donglin_a_tt:0 "以义匡谏首先接受自身被检验，付出名声与心力代价。"
 lyd_practice_donglin_b:0 "由我补足礼责，使讲学见于躬行。"
 lyd_practice_donglin_b_tt:0 "公共承担须有实际筹备，不能只以讲席声誉为德。"
 lyd_practice_donglin_c:0 "同党有名，便无需再辨其所行。"
 lyd_practice_donglin_c_tt:0 "把政治归属代替义理判断，讲学的工夫因此受损。"
 lyd_practice_wangfuzhi_t:0 "气化生生与丧祭的哀敬"
 lyd_practice_wangfuzhi_desc:0 "讲席以气化生生说明天地与人的联系。丧祭将近，有人据此劝你不必再哀敬，仿佛理解生化便取消了人所当尽的报本之责。"
 lyd_practice_wangfuzhi_a:0 "细辨气化与人情，求理解而不卸责任。"
 lyd_practice_wangfuzhi_a_tt:0 "解释天地仍须人的判断，问学与承担不能被截断。"
 lyd_practice_wangfuzhi_b:0 "使知行相资，在丧祭中亲自报本。"
 lyd_practice_wangfuzhi_b_tt:0 "报本敬祖以实际仪节表达哀敬，工夫不止于论气。"
 lyd_practice_wangfuzhi_c:0 "只称万物气化，便不哀、不祭、不照料。"
 lyd_practice_wangfuzhi_c_tt:0 "把气化之说变成卸责之词，不能证明知行相资。"
 lyd_practice_yanli_t:0 "六艺须亲身习行"
 lyd_practice_yanli_desc:0 "讲席已能背诵礼乐射御书数，真正习礼时却只剩纸上的动作。有人劝你让旁人代练，自己只保留熟读的名声。躬行之学应当如何开始？"
 lyd_practice_yanli_a:0 "亲身习行六艺，接受从笨拙开始。"
 lyd_practice_yanli_a_tt:0 "习行要求器具、时间与用力，不能由熟背取代。"
 lyd_practice_yanli_b:0 "以礼乐相助循序演习，也辨书中之义。"
 lyd_practice_yanli_b_tt:0 "实践与说明相互检验，给身体与心志合宜节奏。"
 lyd_practice_yanli_c:0 "请人代习，我只展示熟背之学。"
 lyd_practice_yanli_c_tt:0 "把知名与习行分离，背诵难以替代亲身成德。"
 lyd_practice_qianjia_t:0 "考得一个字，是否已明其义？"
 lyd_practice_qianjia_desc:0 "你在旧注中查得祭器一字的故训，门人称赞此说已足以压倒一切义理讨论。可是合宜祭礼与人之情欲，仍有尚待说明的问题。"
 lyd_practice_qianjia_a:0 "校文辨训，明确证据与尚未定处。"
 lyd_practice_qianjia_a_tt:0 "考据须承认论证限度，持续查验而非凭声名定说。"
 lyd_practice_qianjia_b:0 "以名物明礼，也问仪节如何安顿人情。"
 lyd_practice_qianjia_b_tt:0 "故训与义理相检验，不以一句定训取消道德判断。"
 lyd_practice_qianjia_c:0 "有此字训，待人失义也无需再问。"
 lyd_practice_qianjia_c_tt:0 "把考据成果当作德性的护符，反而舍去求义。"
 lyd_practice_changzhou_t:0 "微言大义应怎样回应此时？"
 lyd_practice_changzhou_desc:0 "同读公羊经说，门人对一处褒贬有不同解释。有人催你一概照搬师门新说，另有人又说旧名例足以包办眼前一切责任。时代处境与经义应怎样相辨？"
 lyd_practice_changzhou_a:0 "细辨名例，保留传承中尚有的异说。"
 lyd_practice_changzhou_a_tt:0 "微言大义须有经据，不因路线相近便混成一说。"
 lyd_practice_changzhou_b:0 "据经义说明此时的礼责，不夸称万世定论。"
 lyd_practice_changzhou_b_tt:0 "回应处境仍须辨义与说明，不把门人的新说冒称先师定论。"
 lyd_practice_changzhou_c:0 "把门人的新说都说成先师早已定下。"
 lyd_practice_changzhou_c_tt:0 "借整齐传承取得声势，遮蔽实际分化与经义限度。"
 lyd_practice_jingshi_t:0 "经世之义也从一场丧祭开始"
 lyd_practice_jingshi_desc:0 "读史与谈世务时，门人赞你有经世之名；眼前丧祭的照料与费用却仍无人承担。懂得天下之事，能否免去身边所当尽的责任？"
 lyd_practice_jingshi_a:0 "辑史求义，检验所论是否真能承担。"
 lyd_practice_jingshi_a_tt:0 "经世不是只谈成败，须以义与实际处境反求自身。"
 lyd_practice_jingshi_b:0 "先把照料与丧祭办实，再言经世。"
 lyd_practice_jingshi_b_tt:0 "躬行义理承担资源代价，成效仍受仁义检验。"
 lyd_practice_jingshi_c:0 "有经世声名便足够，具体责任让他人承担。"
 lyd_practice_jingshi_c_tt:0 "综合学说被用作名号，声望不能替代实际承担。"
