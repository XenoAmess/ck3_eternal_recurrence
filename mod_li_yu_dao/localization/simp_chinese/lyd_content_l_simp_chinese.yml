l_simp_chinese:
 # GENERATED FILE — edit tools/content_data.py and rerun tools/gen_content.py.
 lyd_rite_kongmen:0 "孔门经礼"
 lyd_rite_kongmen_adj:0 "孔门经礼"
 lyd_rite_kongmen_adherent:0 "孔门经礼之儒"
 lyd_rite_kongmen_adherent_plural:0 "孔门经礼诸儒"
 lyd_rite_kongmen_desc:0 "以孔门的仁、礼与敬为本，学诗习礼，尊圣传道。祭礼的敬与哀须出于内心；贵重礼物不能代替诚意。此名概括经典中的共同传统，不声称古代存在同名独立教会。"
 lyd_rite_mengzi:0 "孟氏之学"
 lyd_rite_mengzi_adj:0 "孟氏之学"
 lyd_rite_mengzi_adherent:0 "孟氏之学之儒"
 lyd_rite_mengzi_adherent_plural:0 "孟氏之学诸儒"
 lyd_rite_mengzi_desc:0 "恻隐、羞恶、辞让与是非之心是成德的萌芽，须由行义扩充。养气依靠持续实践，礼义冲突则须辨经权；性善不意味着无需努力便已成圣。"
 lyd_rite_xunzi:0 "荀氏之学"
 lyd_rite_xunzi_adj:0 "荀氏之学"
 lyd_rite_xunzi_adherent:0 "荀氏之学之儒"
 lyd_rite_xunzi_adherent_plural:0 "荀氏之学诸儒"
 lyd_rite_xunzi_desc:0 "成德有赖师法、习礼与人为努力。丧祭与礼乐安顿情感和欲望；天的运行有常，祈雨不直接改变天时。起伪之伪指有意识的作为，绝非以欺诈为德。"
 lyd_rite_zhengxuan:0 "郑氏礼学"
 lyd_rite_zhengxuan_adj:0 "郑氏礼学"
 lyd_rite_zhengxuan_adherent:0 "郑氏礼学之儒"
 lyd_rite_zhengxuan_adherent_plural:0 "郑氏礼学诸儒"
 lyd_rite_zhengxuan_desc:0 "会通今古文的郑氏礼学区分昊天与五帝、圜丘与郊祭，并以感生与祖先配享解释祭礼。经师理论与各朝实际采用的祀典仍须分别考察。"
 lyd_rite_wangsu:0 "王氏礼学"
 lyd_rite_wangsu_adj:0 "王氏礼学"
 lyd_rite_wangsu_adherent:0 "王氏礼学之儒"
 lyd_rite_wangsu_adherent_plural:0 "王氏礼学诸儒"
 lyd_rite_wangsu_desc:0 "王肃主张天惟一体、丘郊一祭，将禘礼解释为追享祖源。它与郑氏有实际礼学分歧，仍共同重视经据、报本与诚敬；王肃不是王弼。"
 lyd_rite_jingshu:0 "经疏正义"
 lyd_rite_jingshu_adj:0 "经疏正义"
 lyd_rite_jingshu_adherent:0 "经疏正义之儒"
 lyd_rite_jingshu_adherent_plural:0 "经疏正义诸儒"
 lyd_rite_jingshu_desc:0 "以南北经学及唐代经疏为基础，兼习诸经，尊重传注又辨其义理。祭序、礼器与丧服须据经说明，不将后世四书中心体系提前置入。"
 lyd_rite_zhuxi:0 "朱子之学"
 lyd_rite_zhuxi_adj:0 "朱子之学"
 lyd_rite_zhuxi_adherent:0 "朱子之学之儒"
 lyd_rite_zhuxi_adherent_plural:0 "朱子之学诸儒"
 lyd_rite_zhuxi_desc:0 "以四书、理气及居敬穷理论成德，家礼将诚敬落实于日用丧祭。问学必须落实于行；其南宋形成过程与后世官方正统地位不能混为一谈。"
 lyd_rite_lujiuyuan:0 "象山之学"
 lyd_rite_lujiuyuan_adj:0 "象山之学"
 lyd_rite_lujiuyuan_adherent:0 "象山之学之儒"
 lyd_rite_lujiuyuan_adherent_plural:0 "象山之学诸儒"
 lyd_rite_lujiuyuan_desc:0 "发明本心、辨明大本，以立志改过和实践检验自得。它不主张任性便是道，也不废弃经典；陆学不等于后世成熟的阳明学。"
 lyd_tenet_reverent_heaven_name:0 "敬天明命"
 lyd_tenet_reverent_heaven_desc:0 "敬天意味着承认受命者的道德责任；天的解释可以因学统而异。 斋戒告天，省察失德与祭祀资格。"
 doctrine_parameter_lyd_reverent_heaven_practice:0 "斋戒告天，省察失德与祭祀资格。"
 lyd_tenet_sincerity_solitude_name:0 "诚敬慎独"
 lyd_tenet_sincerity_solitude_desc:0 "无人知晓时也须不自欺，诚敬须贯通意念和行为。 祭前整肃与私下改过；献金不能替代补过。"
 doctrine_parameter_lyd_sincerity_solitude_practice:0 "祭前整肃与私下改过；献金不能替代补过。"
 lyd_tenet_ritual_music_name:0 "礼乐成德"
 lyd_tenet_ritual_music_desc:0 "礼与乐给敬、哀和欲望以合宜形式，使实践成为成德之路。 在释奠、丧祭与雅乐中辨诚敬、节制和炫耀。"
 doctrine_parameter_lyd_ritual_music_practice:0 "在释奠、丧祭与雅乐中辨诚敬、节制和炫耀。"
 lyd_tenet_ancestral_reverence_name:0 "报本敬祖"
 lyd_tenet_ancestral_reverence_desc:0 "祖先追念、丧祭与生者责任互相联系。 以告祖与丧祭表达哀敬，并承担费用和照料之责。"
 doctrine_parameter_lyd_ancestral_reverence_practice:0 "以告祖与丧祭表达哀敬，并承担费用和照料之责。"
 lyd_tenet_humaneness_righteousness_name:0 "仁义为道"
 lyd_tenet_humaneness_righteousness_desc:0 "仁义不能被财富、权势与一时便利取代。 救助、恤孤与宽俘须接受资源代价；见利忘义损害修养。"
 doctrine_parameter_lyd_humaneness_righteousness_practice:0 "救助、恤孤与宽俘须接受资源代价；见利忘义损害修养。"
 lyd_tenet_sage_transmission_name:0 "尊圣传道"
 lyd_tenet_sage_transmission_desc:0 "传承成德之道须以经典、教学与德行相互印证。 受业、传书与谒圣；真传之说须接受问学和德行检验。"
 doctrine_parameter_lyd_sage_transmission_practice:0 "受业、传书与谒圣；真传之说须接受问学和德行检验。"
 lyd_tenet_extend_sprouts_name:0 "扩充四端"
 lyd_tenet_extend_sprouts_desc:0 "恻隐、羞恶、辞让与是非之心是善的萌芽，仍须扩充。 在连续抉择中践行善端，不能只自称心善。"
 doctrine_parameter_lyd_extend_sprouts_practice:0 "在连续抉择中践行善端，不能只自称心善。"
 lyd_tenet_deliberate_cultivation_name:0 "化性起伪"
 lyd_tenet_deliberate_cultivation_desc:0 "师法、习礼和有意识的努力改变未经养成的欲望。 反复学习并约束争夺；人为之伪不是欺骗。"
 doctrine_parameter_lyd_deliberate_cultivation_practice:0 "反复学习并约束争夺；人为之伪不是欺骗。"
 lyd_tenet_righteous_qi_name:0 "集义养气"
 lyd_tenet_righteous_qi_desc:0 "浩然之气由持续行义积累，不能由一次表演获得。 守已承担的义务，临事违义损害积累。"
 doctrine_parameter_lyd_righteous_qi_practice:0 "守已承担的义务，临事违义损害积累。"
 lyd_tenet_investigate_principle_name:0 "格物穷理"
 lyd_tenet_investigate_principle_desc:0 "经书、礼仪和日用人伦皆可成为探求理的对象。 考察伦理疑案并践行所得，不止积累章句。"
 doctrine_parameter_lyd_investigate_principle_practice:0 "考察伦理疑案并践行所得，不止积累章句。"
 lyd_tenet_reverent_attention_name:0 "居敬涵养"
 lyd_tenet_reverent_attention_desc:0 "敬须贯通动静与日用，省察骄矜及私欲。 持续约束自欺与骄矜，不禁止正常情感。"
 doctrine_parameter_lyd_reverent_attention_practice:0 "持续约束自欺与骄矜，不禁止正常情感。"
 lyd_tenet_original_heart_name:0 "发明本心"
 lyd_tenet_original_heart_desc:0 "本心的道德根据不能与任性的欲求等同。 在权势与良心冲突中辨大本，改过和行动检验自得。"
 doctrine_parameter_lyd_original_heart_practice:0 "在权势与良心冲突中辨大本，改过和行动检验自得。"
 lyd_tenet_textual_ritual_name:0 "据经考礼"
 lyd_tenet_textual_ritual_desc:0 "礼器、祭序及配享须能说明其经据。 论礼与诚敬共同决定实践，贵重器物不自动正确。"
 doctrine_parameter_lyd_textual_ritual_practice:0 "论礼与诚敬共同决定实践，贵重器物不自动正确。"
 lyd_tenet_classical_synthesis_name:0 "诸经会通"
 lyd_tenet_classical_synthesis_desc:0 "多部经传可相互阐发，同时须辨异同。 比较传注与跨经义案，不以一本书包办所有真义。"
 doctrine_parameter_lyd_classical_synthesis_practice:0 "比较传注与跨经义案，不以一本书包办所有真义。"
 lyd_tenet_constant_heaven_name:0 "天行有常"
 lyd_tenet_constant_heaven_desc:0 "自然运行有常，道德责任应在人事中求。 祈雨和灾异可依礼文解释，拒绝天谴不取消祭礼。"
 doctrine_parameter_lyd_constant_heaven_practice:0 "祈雨和灾异可依礼文解释，拒绝天谴不取消祭礼。"
 lyd_practice_kongmen_t:0 "祭礼中的诚敬"
 lyd_practice_kongmen_desc:0 "谒圣祭礼将近，礼生呈来器物与雅乐的安排。有人主张以华丽陈设显扬你的敬意，但你知道，若心不在礼，繁华也只是摆设。该如何准备这次祭礼？"
 lyd_practice_kongmen_a:0 "减去浮饰，亲自习礼。"
 lyd_practice_kongmen_a_tt:0 "用合宜的器物与亲身准备表达敬意。"
 lyd_practice_kongmen_b:0 "备齐乐舞，也给礼生留足准备。"
 lyd_practice_kongmen_b_tt:0 "礼乐可相助，筹备与授业也有代价。"
 lyd_practice_kongmen_c:0 "让贵重礼物替我说明诚意。"
 lyd_practice_kongmen_c_tt:0 "陈设足以引人注目，却不能代替内在诚敬。"
 lyd_practice_mengzi_t:0 "善端与眼前之人"
 lyd_practice_mengzi_desc:0 "祭礼筹备时，一名送来器物的人受伤倒下。你的礼生担心误了时辰，劝你先把祝辞读完。此刻的恻隐之心，应怎样成为真正的行动？"
 lyd_practice_mengzi_a:0 "先安排救护，我承担误时之责。"
 lyd_practice_mengzi_a_tt:0 "在经权抉择中扩充恻隐，承担费用与议论。"
 lyd_practice_mengzi_b:0 "由我另遣人照料，祭礼从简举行。"
 lyd_practice_mengzi_b_tt:0 "兼顾照料与礼仪，仍须实际出资。"
 lyd_practice_mengzi_c:0 "我心中已有恻隐，照旧诵礼便是。"
 lyd_practice_mengzi_c_tt:0 "善端若不扩充到行动，不能只凭自称心善成德。"
 lyd_practice_xunzi_t:0 "给哀伤以礼"
 lyd_practice_xunzi_desc:0 "丧祭习礼中，礼生只顾催促每一步仪节，哀者反而愈加慌乱。礼既非任情失序，也不该成为空洞的动作。你决定如何重新准备？"
 lyd_practice_xunzi_a:0 "依师法重习，让仪节安顿哀情。"
 lyd_practice_xunzi_a_tt:0 "反复习礼，以人为努力使情感得到合宜表达。"
 lyd_practice_xunzi_b:0 "先安顿众人，再删去不合宜的铺陈。"
 lyd_practice_xunzi_b_tt:0 "礼须养情，节制铺陈并非取消祭祀。"
 lyd_practice_xunzi_c:0 "动作整齐就够了，不必管心中如何。"
 lyd_practice_xunzi_c_tt:0 "失去养情之实，仪节易成为空文。"
 lyd_practice_zhengxuan_t:0 "丘郊与配享之辨"
 lyd_practice_zhengxuan_desc:0 "祖祭之前，礼生拿来一份用于讲礼的祭图，竟把昊天与感生帝、圜丘与郊祭的说明混在一起。祖先配享的依据也因此含混。你不愿僭行国礼，但须决定如何澄清这份解说。"
 lyd_practice_zhengxuan_a:0 "据郑氏之说，分别考定祭者与配享。"
 lyd_practice_zhengxuan_a_tt:0 "先辨祭祀对象与资格，再说明丘郊之别。"
 lyd_practice_zhengxuan_b:0 "请礼生保存异说，祖祭只用已明之礼。"
 lyd_practice_zhengxuan_b_tt:0 "保留论礼证据，同时不将疑案变成僭祀。"
 lyd_practice_zhengxuan_c:0 "只要祝辞气派，何必分得这样细？"
 lyd_practice_zhengxuan_c_tt:0 "忽略对象与配享，铺张无法弥补礼据不足。"
 lyd_practice_wangsu_t:0 "禘礼与祖源"
 lyd_practice_wangsu_desc:0 "祖祭筹备时，礼生据一份旧解，把追享祖源写成向感生帝祈福。你所学的王氏礼说却不这样解释禘。如何面对这份有分歧的解说？"
 lyd_practice_wangsu_a:0 "考明祖源，重写解说中的祭祀对象。"
 lyd_practice_wangsu_a_tt:0 "依王氏之义辨禘享祖源，不混同感生与祖先。"
 lyd_practice_wangsu_b:0 "并列郑王异说，先守合资格的家祭。"
 lyd_practice_wangsu_b_tt:0 "论礼可以容纳异说，实际祭礼仍须守其资格。"
 lyd_practice_wangsu_c:0 "把所有称谓都添上，总会有一个受享。"
 lyd_practice_wangsu_c_tt:0 "不辨名实的堆砌，与据经考礼相背。"
 lyd_practice_jingshu_t:0 "传注之间的问礼"
 lyd_practice_jingshu_desc:0 "一件丧服疑案摆在眼前。两种传注的用语相近，适用的亲属关系却不同。有人建议只用最贵的服饰，以免显得失礼；你仍须说明此礼为何合宜。"
 lyd_practice_jingshu_a:0 "核对经文与旧注，再说明适用关系。"
 lyd_practice_jingshu_a_tt:0 "在具体名物与亲属关系中据经辨礼。"
 lyd_practice_jingshu_b:0 "向师长问明异同，也保留尚未解开的疑义。"
 lyd_practice_jingshu_b_tt:0 "问学允许存疑，不能假装已通尽诸经。"
 lyd_practice_jingshu_c:0 "购置最贵的服饰，免去查考。"
 lyd_practice_jingshu_c_tt:0 "贵重不能替代礼据和诚敬。"
 lyd_practice_zhuxi_t:0 "问理而后行礼"
 lyd_practice_zhuxi_desc:0 "祖祭的礼文已誊清，但你发现自己只会复述步骤，未能说明为何如此。礼生问你，是先把经义和实际礼事相对照，还是只求在众人面前完成一次漂亮的祭礼？"
 lyd_practice_zhuxi_a:0 "问明此礼之理，再亲身习行。"
 lyd_practice_zhuxi_a_tt:0 "把穷理、持敬与报本连在实际行动中。"
 lyd_practice_zhuxi_b:0 "先从简持敬，将疑处记下继续问学。"
 lyd_practice_zhuxi_b_tt:0 "承认理解未足，持续涵养而不废祭礼。"
 lyd_practice_zhuxi_c:0 "多添供物，别人看不出我未明其理。"
 lyd_practice_zhuxi_c_tt:0 "炫示会遮蔽问学，礼物不能代替成德工夫。"
 lyd_practice_lujiuyuan_t:0 "祝辞与本心"
 lyd_practice_lujiuyuan_desc:0 "祭礼前读祝时，你发现其中赞扬自身德行的话，远过于自己真正做过的事。众人也许不会察觉，但你知道这份夸饰。发明本心，该如何落实在眼前？"
 lyd_practice_lujiuyuan_a:0 "删去自饰之辞，承认我仍须改过。"
 lyd_practice_lujiuyuan_a_tt:0 "显明本心须去自欺，承担名声和意念中的代价。"
 lyd_practice_lujiuyuan_b:0 "据经问师，使祝辞与实际行为相称。"
 lyd_practice_lujiuyuan_b_tt:0 "本心与问学可以相助，陆学不等于拒绝经典。"
 lyd_practice_lujiuyuan_c:0 "既然我自认为有德，照旧读下去。"
 lyd_practice_lujiuyuan_c_tt:0 "自信不能把任性或夸饰变成道德根据。"
