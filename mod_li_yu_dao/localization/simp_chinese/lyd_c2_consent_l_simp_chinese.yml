 lyd_c2_review_proposal_decision_tooltip:0 "查看并复核当前议案"
 lyd_c2_review_proposal_decision_confirm:0 "逐项复核"
 lyd_c2_cancel_proposal_decision:0 "撤回本轮议案"
 lyd_c2_cancel_proposal_decision_desc:0 "撤回尚未实施的议案。撤回不替任何一方认可归属，也不收取合流或分立的费用。"
 lyd_c2_cancel_proposal_decision_tooltip:0 "结束本轮议案，不改变礼仪归属"
 lyd_c2_cancel_proposal_decision_confirm:0 "撤回议案"
 lyd_c2_proposal_t:0 "议经论礼，先问诸儒"
 lyd_c2_proposal_desc:0 "议案只涉及本派整项礼仪的共同体归属，不改核心信条，不替换接收方主流。各地具备问学资格者将各自表决，受影响玩家另有同意或拒绝的选择。授权仅用于本轮条款，一年内未成即须重议。 职位条款亦在本轮授权范围内：仅来源信仰恰有本派一项礼仪、且其捕获宗主头衔明确属于本mod与该来源faith时，来归才退休这一项职位；旧人、其他头衔与授业记录保留。多派来源或外来头衔不由此退休。若本派章程采用世俗宗主，另立时由本轮获授权的发起代表担任，并只建立一个专属宗主头衔；无宗主章程不暗改。旧宗主可以记录不认可，但不能替代学派与受影响玩家的决定。 本轮不迁移军会、圣人登记或圣物。来源或接收共同体现有军会或圣人登记时，归属调整须停止，原归属、组织、圣物持有人及引用保留；不收取迁移费用。没有这些绑定对象时仍须满足其余全部授权条件。"
 lyd_c2_source_ballot_t:0 "本派授权之议"
 lyd_c2_source_ballot_desc:0 "是否授权本轮发起者代表本派签署这项归属议案？本派经典、祭修与学统将保留；此授权不处分他国国礼或祀产，亦不替受影响玩家作决定。 职位条款亦在本轮授权范围内：仅来源信仰恰有本派一项礼仪、且其捕获宗主头衔明确属于本mod与该来源faith时，来归才退休这一项职位；旧人、其他头衔与授业记录保留。多派来源或外来头衔不由此退休。若本派章程采用世俗宗主，另立时由本轮获授权的发起代表担任，并只建立一个专属宗主头衔；无宗主章程不暗改。旧宗主可以记录不认可，但不能替代学派与受影响玩家的决定。 本轮不迁移军会、圣人登记或圣物。来源或接收共同体现有军会或圣人登记时，归属调整须停止，原归属、组织、圣物持有人及引用保留；不收取迁移费用。没有这些绑定对象时仍须满足其余全部授权条件。"
 lyd_c2_target_ballot_t:0 "接纳来归之议"
 lyd_c2_target_ballot_desc:0 "是否授权本轮所提代表同意接纳来归学统？现有主流保持，来归者保留自身礼仪。三分之二支持形成授权，代表仍须亲自答复。 职位条款亦在本轮授权范围内：仅来源信仰恰有本派一项礼仪、且其捕获宗主头衔明确属于本mod与该来源faith时，来归才退休这一项职位；旧人、其他头衔与授业记录保留。多派来源或外来头衔不由此退休。若本派章程采用世俗宗主，另立时由本轮获授权的发起代表担任，并只建立一个专属宗主头衔；无宗主章程不暗改。旧宗主可以记录不认可，但不能替代学派与受影响玩家的决定。 本轮不迁移军会、圣人登记或圣物。来源或接收共同体现有军会或圣人登记时，归属调整须停止，原归属、组织、圣物持有人及引用保留；不收取迁移费用。没有这些绑定对象时仍须满足其余全部授权条件。"
 lyd_c2_holder_t:0 "本派现任持有者的背书"
 lyd_c2_holder_desc:0 "本派仍有信众或伯爵领，本轮却没有符合问学资格的表决者。作为现任礼仪持有者，我可以明确背书，也可以拒绝；这不是三分之二学者票，且不能替代所有受影响玩家的同意。没有真实持有者的活跃礼仪须先补足组织条件。"
 lyd_c2_holder_yes:0 "我以现任持有者身份明确背书"
 lyd_c2_holder_no:0 "我拒绝，本轮须重新议定"
 lyd_c2_vote_yes:0 "我授权此人签署本轮条款"
 lyd_c2_vote_no:0 "我不赞成这项授权"
 lyd_c2_player_consent_t:0 "我的共同体归属"
 lyd_c2_player_consent_desc:0 "本轮议案将作用于共享的礼仪共同体，可能影响各地人物与伯爵领。我可以同意，也可以拒绝。学者票数和保护者出资不能替代我的选择。 职位条款亦在本轮授权范围内：仅来源信仰恰有本派一项礼仪、且其捕获宗主头衔明确属于本mod与该来源faith时，来归才退休这一项职位；旧人、其他头衔与授业记录保留。多派来源或外来头衔不由此退休。若本派章程采用世俗宗主，另立时由本轮获授权的发起代表担任，并只建立一个专属宗主头衔；无宗主章程不暗改。旧宗主可以记录不认可，但不能替代学派与受影响玩家的决定。 本轮不迁移军会、圣人登记或圣物。来源或接收共同体现有军会或圣人登记时，归属调整须停止，原归属、组织、圣物持有人及引用保留；不收取迁移费用。没有这些绑定对象时仍须满足其余全部授权条件。"
 lyd_c2_player_yes:0 "我明确同意本轮归属条款"
 lyd_c2_player_no:0 "我拒绝，本轮不得实施"
 lyd_c2_review_t:0 "授权与条款"
 lyd_c2_review_desc:0 "本派赞成票：[ROOT.Char.MakeScope.Var('lyd_c2_source_yes').GetValue|0]/[ROOT.Char.MakeScope.Var('lyd_c2_source_total').GetValue|0]。接收方汇总赞成票：[ROOT.Char.MakeScope.Var('lyd_c2_target_yes').GetValue|0]/[ROOT.Char.MakeScope.Var('lyd_c2_target_total').GetValue|0]，仅供参考。接收方已授权的活跃礼仪：[ROOT.Char.MakeScope.Var('lyd_c2_mandated_receivers').GetValue|0]/[ROOT.Char.MakeScope.Var('lyd_c2_active_receivers').GetValue|0]；休眠模板：[ROOT.Char.MakeScope.Var('lyd_c2_dormant_total').GetValue|0]，不计作赞成。缺少合格学者及有效持有者的活跃礼仪：[ROOT.Char.MakeScope.Var('lyd_c2_unorganized_receivers').GetValue|0]，须先补足教师或组织条件。受影响玩家同意：[ROOT.Char.MakeScope.Var('lyd_c2_player_yes').GetValue|0]/[ROOT.Char.MakeScope.Var('lyd_c2_player_total').GetValue|0]。每个活跃礼仪须单独授权；签署后仍须最终复核。"
 lyd_c2_sign_source:0 "依本派授权，签署此议"
 lyd_c2_sign_source_tt:0 "签署本轮归属与已展示的宗主退休／另立条款；合流还须接收方代表及其有效领袖答复。旧领袖离开认可不能替代授权，也不构成额外永久否决。"
 lyd_c2_receive_t:0 "接收方的答复"
 lyd_c2_receive_desc:0 "接收共同体各活跃礼仪的授权已经形成；休眠礼仪仅保留模板，没有被记作赞成。是否亲自签署接纳条款？我可以同意或拒绝；被提名为代表本身不等于已经同意。 职位条款亦在本轮授权范围内：仅来源信仰恰有本派一项礼仪、且其捕获宗主头衔明确属于本mod与该来源faith时，来归才退休这一项职位；旧人、其他头衔与授业记录保留。多派来源或外来头衔不由此退休。若本派章程采用世俗宗主，另立时由本轮获授权的发起代表担任，并只建立一个专属宗主头衔；无宗主章程不暗改。旧宗主可以记录不认可，但不能替代学派与受影响玩家的决定。 本轮不迁移军会、圣人登记或圣物。来源或接收共同体现有军会或圣人登记时，归属调整须停止，原归属、组织、圣物持有人及引用保留；不收取迁移费用。没有这些绑定对象时仍须满足其余全部授权条件。"
 lyd_c2_receive_yes:0 "我同意并签署本轮条款"
 lyd_c2_receive_no:0 "我拒绝接纳本轮条款"
 lyd_c2_head_receive_t:0 "共同体领袖的接纳"
 lyd_c2_head_receive_desc:0 "学派代表已提出接纳意见。作为当前有效领袖，我仍须对这一轮的共同体安排明确答复；我的同意不能替代各派授权。"
 lyd_c2_head_source_t:0 "来源共同体的答复"
 lyd_c2_head_source_desc:0 "本派已议定来归。我可以认可，也可以记下不认可；额外的离开许可不能推翻本派授权、双方代表签署与全体受影响玩家的同意。若本轮明确退休本派专属宗主头衔，只解除并退休捕获的该职位，保留我本人、其他头衔与授业记录。"
 lyd_c2_source_head_recognize:0 "我认可此次来归"
 lyd_c2_source_head_withhold:0 "记录我不认可，仍按有效授权处理"
 lyd_c2_peaceful_t:0 "请立与另立"
 lyd_c2_peaceful_desc:0 "本派请求另立共同体。是否认可为和平请立？拒绝会留下未获认可的记录，但不能永远阻止已有本派授权的自主自立。"
 lyd_c2_peaceful_yes:0 "我认可和平请立"
 lyd_c2_peaceful_no:0 "我不认可，但这不取消本派之议"
 lyd_c2_confirm:0 "复核无误，实施本轮归属"
 lyd_c2_confirm_tt:0 "合流费用为300金币、1500虔诚；自立为200金币、1000虔诚。成功后本派调整期五年；不改变政治领属。"
 lyd_c2_native_pending:0 "本轮尚待归属机制核验"
 lyd_c2_native_pending_tt:0 "候选版本可以议定授权，最终归属操作尚未通过实机核验。授权不能当作已完成合流或分立。"
 lyd_c2_result_t:0 "本轮议案的记录"
 lyd_c2_success_desc:0 "本轮归属操作的即时条件已符合，费用已收取。学统身份保留，调整期届满可以重新议定；后续仍须观察共同体状态。"
 lyd_c2_rejected_desc:0 "本轮未取得所需同意，礼仪归属保持。拒绝不会永久关闭来日协商；本派一年后可以重新议定。"
 lyd_c2_cancelled_desc:0 "议案已撤回，没有收取归属调整费用。另议须重新取得授权。"
 lyd_c2_expired_desc:0 "本轮授权已届期，尚未实施的议案结束。旧票与旧签署不能用于新的条款。"
 lyd_c2_failed_desc:0 "归属操作后的状态未符合所议条件。当前实际状态保留，不伪作成功；需停止调整并查验。"
 lyd_c2_wait:0 "先待诸方答复"
 lyd_c2_cancel:0 "撤回本轮议案"
 lyd_c2_acknowledge:0 "记下本轮经过"
 lyd_m3_source_assets_clear_tt:0 "来源共同体没有原生军会或圣人登记；本轮不转移这些绑定对象。"
 lyd_m3_target_assets_clear_tt:0 "接收共同体没有原生军会或圣人登记；本轮不转移这些绑定对象。"
 lyd_m3_current_assets_clear_tt:0 "来源与接收共同体的实际对象仍有效，且没有军会或圣人登记；否则本轮不得调整归属。"
 lyd_m3_assets_blocked:0 "现有共同体绑定对象须保留"
 lyd_m3_assets_blocked_tt:0 "本轮不支持军会或圣人登记的跨共同体迁移。原归属、组织及圣物保留，不扣迁移费用；可以等待或撤回，另议不能绕过此条件。"
