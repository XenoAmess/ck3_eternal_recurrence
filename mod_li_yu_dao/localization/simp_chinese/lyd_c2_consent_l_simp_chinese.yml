 # GENERATED FILE: edit tools/gen_school_consent.py.
 lyd_c2_same_main_doctrines_tt:0 "来源与接收共同体主流礼仪的教义相同。"
 lyd_c2_detach_requirements_tt:0 "我已入儒门，成年且有领地，能够自由理事，学识至少为15；本派属于本模组学统、不是当前共同体主流，且没有正在议定的归属或领袖议案，也不在归属调整或重议等待期。"
 lyd_c2_review_requirements_tt:0 "我仍具备发起资格，且本轮议案仍对应我的学统、共同体、领袖及接收代表；本派与接收方的本轮归属约定仍有效。人选或归属变化后须重新议定。"
 lyd_c2_cancel_requirements_tt:0 "我有尚未实施的当前议案；即使已失去发起资格，仍可撤回自己的这一轮议案。"
 lyd_c2_join_requirements_tt:0 "我具备发起资格，本派可以议定来归，且双方没有正在议定的归属或领袖议案。对方须是另一儒家共同体主流的合格学者；多礼仪共同体的主流不能随本议案迁出。"
 lyd_c2_detach_open_tt:0 "召集本派授权之议，并征询所有受影响玩家。本派须取得三分之二学者授权，所有受影响玩家须明确同意，之后方可签署、复核与实施；提出议案时不改变归属，也不收取分立费用。"
 lyd_c2_review_open_tt:0 "重新核对本轮人选、归属、授权与条款，并打开复核议案。查阅本身不替任何一方投票或签署，也不实施归属或收取迁移费用。"
 lyd_c2_cancel_round_tt:0 "结束自己的当前议案，仅解除属于自己这一轮的议案占用。不改变礼仪或共同体归属，也不收取合流或分立费用。"
 lyd_c2_join_open_tt:0 "提出接纳本派的议案，并分别征询本派、接收共同体各活跃礼仪与所有受影响玩家。送达不等于同意；各派须取得三分之二授权或规定的现任持有者背书，所有受影响玩家仍须明确同意。提出时不改变归属，也不收取合流费用。"
 lyd_c2_propose_join_interaction:0 "议定学统来归"
 lyd_c2_propose_join_interaction_desc:0 "向对方提出接纳本派的议案。发出议案不代表任何一方已同意；本派与接收方须各得三分之二授权，受影响玩家亦须明确选择。"
 lyd_c2_propose_detach_decision:0 "议请另立学统"
 lyd_c2_propose_detach_decision_desc:0 "就本派的共同体归属召集议论。诸家之学仍可往来，另立共同体也不改变政治领属。"
 lyd_c2_propose_detach_decision_tooltip:0 "提出本派独立议案，先征求授权"
