 xalw_curse_2_name:0 "Appétit aristocratique"
 xalw_curse_3_desc:0 "Désactive 1/2/3 emplacements stables positifs ; les autres événements positifs ont 75/50/25 % de leurs chances ; stress trimestriel +15/25/40."
 xalw_curse_3_name:0 "Corps versatile"
 xalw_curse_4_desc:0 "Secret -10/-20/-30 points ; 20/35/50 % de chances trimestrielles d'exposer un véritable secret personnel."
 xalw_curse_4_name:0 "Grande bouche"
 xalw_curse_5_desc:0 "Bénéfices passifs positifs à 90/80/70 % ; 10/20/35 % de chances trimestrielles de transférer l'objet original à un destinataire légitime."
 xalw_curse_5_name:0 "Fugueur"
 xalw_curse_6_desc:0 "Les vrais conjoints accordent -15/-30/-50 d'opinion à l'objet équipé ; chaque année, un ressentiment peut toucher conjoint ou amant pendant deux ans."
 xalw_curse_6_name:0 "Amant jaloux"
 xalw_curse_7_desc:0 "L'objet équipé perd 2/4/7 points de durabilité par mois ; lors de la fin de mois, si la durabilité de l'original est observée en hausse, chaque année cela peut coûter 5/10/15 pièces d'or et 15/25/40 de stress."
 xalw_curse_7_name:0 "Faim de rouille"
 xalw_curse_8_desc:0 "Croissance mensuelle du contrôle -0,2/-0,4/-0,7 ; perte trimestrielle possible de 10/20/35 contrôle et 15/30/50 d'opinion populaire."
 xalw_curse_8_name:0 "Royaume sans sommeil"
