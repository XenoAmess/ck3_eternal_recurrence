l_french:
 rule_xalw_awakening:0 "Artefacts vivants : Chance d'éveil"
 rule_xalw_backlash:0 "Artefacts vivants : Faim de base"
 setting_xalw_awakening_frequent:0 "Fréquent (15 %)"
 setting_xalw_awakening_frequent_desc:0 "Chaque artefact personnel éligible a 15 % de chances de s'éveiller à sa première découverte, pour tout possesseur."
 setting_xalw_awakening_none:0 "Aucun nouvel éveil (0 %)"
 setting_xalw_awakening_none_desc:0 "Plus aucun nouvel éveil. Les artefacts vivants existants continuent de croître normalement."
 setting_xalw_awakening_normal:0 "Standard (5 %)"
 setting_xalw_awakening_normal_desc:0 "Chaque artefact personnel éligible a 5 % de chances de s'éveiller à sa première découverte, pour tout possesseur."
 setting_xalw_awakening_rare:0 "Rare (1 %)"
 setting_xalw_awakening_rare_desc:0 "Chaque artefact personnel éligible a 1 % de chances de s'éveiller à sa première découverte, pour tout possesseur."
 setting_xalw_backlash_mild:0 "Léger"
 setting_xalw_backlash_mild_desc:0 "La faim de base n'ajoute qu'un stress trimestriel, sans coût de santé. Les malédictions restent pleinement actives."
 setting_xalw_backlash_standard:0 "Standard"
 setting_xalw_backlash_standard_desc:0 "La faim de base de chaque artefact coûte santé et stress trimestriel. Les artefacts s'accumulent ; les malédictions ajoutent leurs propres coûts."
 xalw.10.appease:0 "Apaiser la faim de base pendant 365 jours"
 xalw.10.close:0 "Compris"
 xalw.10.desc:0 "Personnalité : [xalw_artifact.Custom('XalwPersonality')]　Alimentation : [xalw_artifact.Custom('XalwDiet')]\nReste à réprimer : [xalw_artifact.MakeScope.ScriptValue('xalw_suppression_remaining_days_value')|0] jour(s)\n\nNiveau : #V [xalw_artifact.MakeScope.Var('xalw_level').GetValue|0]#!　Expérience : #V [xalw_artifact.MakeScope.Var('xalw_xp_in_level').GetValue|0]#! / [xalw_artifact.MakeScope.ScriptValue('xalw_next_level_xp_value')|0]\nRésonance : #V [xalw_artifact.MakeScope.Var('xalw_resonance').GetValue|0]#!/100\n[xalw_artifact.Custom('XalwAffixes')][xalw_artifact.Custom('XalwCurses')]\n\nUne fois équipé, l’objet gagne 8 points d’expérience chaque mois. Il monte automatiquement de niveau dès le seuil atteint, sans confirmation. Le retirer est gratuit, mais interrompt la progression et les effets continus de l’arme vivante. L’alimentation n’a aucun délai de réutilisation.\nRépression : [xalw_artifact.MakeScope.ScriptValue('xalw_suppression_cost_value')|0] or, 50 de prestige, 10 de stress ; apaisement : [xalw_artifact.MakeScope.ScriptValue('xalw_appease_cost_value')|0] or, 10 de stress.\n\nLes quatre options ci-dessous choisissent, dans la rareté correspondante, le matériau sûr ayant la moindre durabilité. L’objet exact est affiché avant confirmation de sa destruction. Vous pouvez annuler et protéger les objets que vous souhaitez conserver, ou choisir précisément un matériau via le sélecteur de l’objet."
 xalw.10.feed:0 "Le sélectionner comme cible de nourrissage"
 xalw.10.feed_common:0 "Choisir un équipement courant comme nourriture"
 xalw.10.feed_famed:0 "Choisir un équipement célèbre comme nourriture"
 xalw.10.feed_illustrious:0 "Choisir un équipement illustre comme nourriture"
 xalw.10.feed_masterwork:0 "Choisir un equipment d’œuvre de maître comme nourriture"
 xalw.10.renew:0 "Payer pour prolonger la suppression de 90 jours"
 xalw.10.suppress:0 "Payer pour supprimer la croissance pendant 90 jours"
 xalw.10.t:0 "[xalw_artifact.GetName] : Murmure vivant"
 xalw.10.train:0 "Entraînement de résonance (50 prestige, 10 stress, +25 XP)"
 xalw.11.cancel:0 "Conserver la matière"
 xalw.11.confirm:0 "Le laisser dévorer la matière"
 xalw.11.desc:0 "Expérience totale (alimentation comprise) : #V [SCOPE.ScriptValue('xalw_selected_feed_xp_value')|0]#!\n\nNourrir #V [xalw_artifact.GetName]#! avec #V [xalw_material.GetName]#! ?\n\nExpérience de base du matériau : [xalw_material.MakeScope.ScriptValue('xalw_feed_base_xp_value')|0] ; multipliée par 1,25 s’il correspond à l’alimentation.\nL’expérience est acquise dès la destruction effective du matériau et peut franchir plusieurs niveaux, ainsi que provoquer des malédictions. L’alimentation n’a aucun délai de recharge ; ce choix vaut consommation du matériau, sans autorisation supplémentaire pour monter de niveau."
 xalw.11.t:0 "Confirmation de nourrissage : la matière disparaîtra à jamais"
 xalw.12.desc:0 "Faites un clic droit sur votre propre portrait et choisissez #V Gérer l’arme vivante#! pour sélectionner un objet avec le sélecteur natif.\nVous pourrez ensuite l’entraîner, payer sa répression, l’apaiser ou utiliser #V Nourrir l’arme vivante sélectionnée#! pour choisir un matériau.\nTous les détenteurs vivants, y compris les IA, les barons, les courtisans sans domaine et les chevaliers, suivent la même progression et|subissent les mêmes coûts.\n#warning Les objets équipés progressent automatiquement, même sans lire les notifications. Les retirer est gratuit, mais interrompt leur progression et les effets vivants.#!\n\nCi-dessous, vous pouvez écouter directement une arme vivante équipée, en privilégiant celle du niveau le plus élevé. Pour指定的 autre objet, utilisez votre interaction de sélection d’objets."
 xalw.12.open:0 "Écouter [xalw_artifact.GetName]"
 xalw.12.t:0 "Gestion des artefacts vivants"
 xalw_affix_10_desc:0 "Le déverrouillage réel d'une compétence de vie accorde 5/10/15 % d'expérience mensuelle pour le mode de vie Apprentissage pendant 365 jours et coûte 40/60/80 prestige."
 xalw_affix_10_name:0 "Accro à l'encre"
 xalw_affix_10_rank_1_desc:0 "#T $xalw_affix_10_name$（#V 1#!）#!\nLe déverrouillage réel d'une compétence de vie accorde #V 5#! % d'expérience mensuelle pour le mode de vie Apprentissage pendant 365 jours et coûte #V 40#! prestige."
