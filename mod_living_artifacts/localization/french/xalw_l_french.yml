 xalw.10.desc:0 "Personnalité : [xalw_artifact.Custom('XalwPersonality')]　Alimentation : [xalw_artifact.Custom('XalwDiet')]\nReste à réprimer : [xalw_artifact.MakeScope.ScriptValue('xalw_suppression_remaining_days_value')|0] jour(s)\n\nNiveau : #V [xalw_artifact.MakeScope.Var('xalw_level').GetValue|0]#!　Expérience : #V [xalw_artifact.MakeScope.Var('xalw_xp_in_level').GetValue|0]#! / [xalw_artifact.MakeScope.ScriptValue('xalw_next_level_xp_value')|0]\nRésonance : #V [xalw_artifact.MakeScope.Var('xalw_resonance').GetValue|0]#!/100\n\n[xalw_artifact.Custom('XalwAffixes')]\n[xalw_artifact.Custom('XalwCurses')]\n\nUne fois équipé, l’objet gagne 8 points d’expérience chaque mois. Il monte automatiquement de niveau dès le seuil atteint, sans confirmation. Le retirer est gratuit, mais interrompt la progression et les effets continus de l’arme vivante. L’alimentation n’a aucun délai de réutilisation.\nRépression : [xalw_artifact.MakeScope.ScriptValue('xalw_suppression_cost_value')|0] or, 50 de prestige, 10 de stress ; apaisement : [xalw_artifact.MakeScope.ScriptValue('xalw_appease_cost_value')|0] or, 10 de stress.\n\nLes quatre options ci-dessous choisissent, dans la rareté correspondante, le matériau sûr ayant la moindre durabilité. L’objet exact est affiché avant confirmation de sa destruction. Vous pouvez annuler et protéger les objets que vous souhaitez conserver, ou choisir précisément un matériau via le sélecteur de l’objet."
 xalw.10.feed_common:0 "Choisir un équipement courant comme nourriture"
 xalw.10.feed_famed:0 "Choisir un équipement célèbre comme nourriture"
 xalw.10.feed_illustrious:0 "Choisir un équipement illustre comme nourriture"
 xalw.10.feed_masterwork:0 "Choisir un equipment d’œuvre de maître comme nourriture"
 xalw.12.desc:0 "Faites un clic droit sur votre propre portrait et choisissez #V Gérer l’arme vivante#! pour sélectionner un objet avec le sélecteur natif.\nVous pourrez ensuite l’entraîner, payer sa répression, l’apaiser ou utiliser #V Nourrir l’arme vivante sélectionnée#! pour choisir un matériau.\nTous les détenteurs vivants, y compris les IA, les barons, les courtisans sans domaine et les chevaliers, suivent la même progression et|subissent les mêmes coûts.\n#warning Les objets équipés progressent automatiquement, même sans lire les notifications. Les retirer est gratuit, mais interrompt leur progression et les effets vivants.#!\n\nCi-dessous, vous pouvez écouter directement une arme vivante équipée, en privilégiant celle du niveau le plus élevé. Pour指定的 autre objet, utilisez votre interaction de sélection d’objets."
 xalw.12.open:0 "Écouter [xalw_artifact.GetName]"
