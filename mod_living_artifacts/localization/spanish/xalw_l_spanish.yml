l_spanish:
 rule_xalw_awakening:0 "Artefactos vivientes: probabilidad de despertar"
 rule_xalw_backlash:0 "Artefactos vivientes: hambre básica"
 setting_xalw_awakening_frequent:0 "Frecuente (15 %)"
 setting_xalw_awakening_frequent_desc:0 "Cada artefacto personal elegible tiene un 15 % de probabilidad de despertar al descubrirlo por primera vez, para cualquier propietario."
 setting_xalw_awakening_none:0 "Desactivar nuevos despertares (0 %)"
 setting_xalw_awakening_none_desc:0 "No habrá nuevos despertares. Los artefactos vivientes existentes seguirán creciendo normalmente."
 setting_xalw_awakening_normal:0 "Estándar (5 %)"
 setting_xalw_awakening_normal_desc:0 "Cada artefacto personal elegible tiene un 5 % de probabilidad de despertar al descubrirlo por primera vez, para cualquier propietario."
 setting_xalw_awakening_rare:0 "Raro (1 %)"
 setting_xalw_awakening_rare_desc:0 "Cada artefacto personal elegible tiene un 1 % de probabilidad de despertar al descubrirlo por primera vez, para cualquier propietario."
 setting_xalw_backlash_mild:0 "Leve"
 setting_xalw_backlash_mild_desc:0 "El hambre básica solo añade estrés trimestral y no reduce la salud. Las maldiciones concretas no se reducen."
 setting_xalw_backlash_standard:0 "Estándar"
 setting_xalw_backlash_standard_desc:0 "El hambre básica de cada artefacto cuesta salud y estrés trimestral. Los efectos se acumulan; cada maldición añade sus propios costes."
 xalw.10.appease:0 "Calmar el hambre básica durante 365 días"
 xalw.10.close:0 "Entendido"
 xalw.10.desc:0 "Personalidad: [xalw_artifact.Custom('XalwPersonality')]　Dieta: [xalw_artifact.Custom('XalwDiet')]\nSupresión restante: [xalw_artifact.MakeScope.ScriptValue('xalw_suppression_remaining_days_value')|0] días\n\nNivel: #V [xalw_artifact.MakeScope.Var('xalw_level').GetValue|0]#!　Experiencia: #V [xalw_artifact.MakeScope.Var('xalw_xp_in_level').GetValue|0]#! / [xalw_artifact.MakeScope.ScriptValue('xalw_next_level_xp_value')|0]\nResonancia: #V [xalw_artifact.MakeScope.Var('xalw_resonance').GetValue|0]#!/100\n[xalw_artifact.Custom('XalwAffixes')][xalw_artifact.Custom('XalwCurses')]\n\nLos artefactos equipados ganan 8 de experiencia mensualmente y suben de nivel automáticamente. Al quitártelos, gratis, se detienen el crecimiento y los efectos continuos del arma viva. La alimentación no tiene tiempo de recarga.\nSupresión: [xalw_artifact.MakeScope.ScriptValue('xalw_suppression_cost_value')|0] de oro, 50 de prestigio y 10 de estrés. Apaciguamiento: [xalw_artifact.MakeScope.ScriptValue('xalw_appease_cost_value')|0] de oro y 10 de estrés.\n\nLas cuatro opciones de alimentación siguientes escogerán el material seguro con menos durabilidad de la rareza correspondiente. Primero se mostrará el objeto concreto y después confirmarás su destrucción. Puedes cancelar y proteger los objetos que no quieras alimentar; también puedes elegir uno específico mediante la interacción de selección de artefactos."
 xalw.10.feed:0 "Seleccionarlo como objetivo de alimentación"
 xalw.10.feed_common:0 "Elige un equipo normal para alimentar"
 xalw.10.feed_famed:0 "Elige un equipo famoso para alimentar"
 xalw.10.feed_illustrious:0 "Elige un equipo illustrísimo para alimentar"
 xalw.10.feed_masterwork:0 "Elige un equipo magistral para alimentar"
 xalw.10.renew:0 "Pagar para prolongar la supresión 90 días"
 xalw.10.suppress:0 "Pagar para suprimir el crecimiento 90 días"
 xalw.10.t:0 "[xalw_artifact.GetName]: Un susurro viviente"
 xalw.10.train:0 "Entrenamiento de resonancia (50 de prestigio, 10 de estrés, +25 XP)"
 xalw.11.cancel:0 "Conservar el material"
 xalw.11.confirm:0 "Dejar que lo devore"
 xalw.11.desc:0 "Experiencia incluida la dieta: #V [SCOPE.ScriptValue('xalw_selected_feed_xp_value')|0]#!\n\n¿Alimentar a #V [xalw_artifact.GetName]#! con #V [xalw_material.GetName]#!?\n\nExperiencia base del material: [xalw_material.MakeScope.ScriptValue('xalw_feed_base_xp_value')|0]; se multiplica por 1,25 si coincide con la dieta.\nTras destruirse realmente el material, la experiencia se otorga inmediatamente, lo que puede superar varios niveles y provocar maldiciones. La alimentación no tiene tiempo de espera; esta elección autoriza el consumo del material y la subida de nivel no requiere permiso."
 xalw.11.t:0 "Confirmación de alimentación: el material será destruido permanentemente"
 xalw.12.desc:0 "Haz clic derecho en tu propio retrato y selecciona #V Gestionar artefacto vivo#! para elegir un artefacto con el selector nativo.\nDespués podrás entrenarlo, pagar por la supresión, apaciguarlo o usar #V Alimentar artefacto vivo seleccionado#! para elegir el material.\nTodos los propietarios vivos, incluidos la IA, los barones, los courtier sin tierras y los caballeros, tienen el mismo crecimiento y costes.\n#warning Los artefactos equipados crecen automáticamente, aunque no leas los avisos. Al quitártelos, gratis, se detienen el crecimiento y los efectos del artefacto vivo.#!\n\nA continuación puedes escuchar directamente un artefacto vivo equipado (priorizando el de mayor nivel); para especificar otro, usa tu interacción de selección de artefactos."
 xalw.12.open:0 "Escuchar a [xalw_artifact.GetName]"
 xalw.12.t:0 "Gestión de artefactos vivientes"
 xalw_affix_10_desc:0 "Una desbloqueo real de una perk otorga un 5/10/15% más de experiencia de aprendizaje durante 365 días y cuesta 40/60/80 de prestigio."
 xalw_affix_10_name:0 "Adicción a la tinta"
