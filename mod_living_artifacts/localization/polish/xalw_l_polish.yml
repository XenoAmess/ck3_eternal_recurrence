 xalw_feed_interaction:0 "Nakarm wybrany żywy artefakt"
 xalw_feed_interaction_desc:0 "Wybierz niezalozony, zwykły, niechroniony osobisty artefakt jako pożywienie. Jego faktyczna rzadkość określa doświadczenie. Bez cooldowna. Potwierdzenie niszczy materiał."
 xalw_feed_selector_help:0 "Cel wybrany. Kliknij prawym przyciskiem swój portret, wybierz Nakarm wybrany żywy artefakt, a następnie wybierz jego pożywienie. Możesz anulować przed zniszczeniem."
 xalw_growth_text:0 "[xalw_artifact.GetName] automatycznie osiągnął poziom [xalw_artifact.MakeScope.Var('xalw_level').GetValue|0]. Nowe moce lub klątwy już zaczęły obowiązywać."
 xalw_growth_title:0 "Żywy artefakt urósł"
 xalw_hunger_1_modifier:0 "Żywy głód (1)"
