 xalw_hunger_5_modifier:0 "Żywy głód (5)"
 xalw_keep_interaction:0 "Przełącz ochronę przed karmieniem"
 xalw_keep_interaction_desc:0 "Oznacz osobisty artefakt jako chroniony lub zdejmij tę ochronę. Chronione artefakty nie mogą zostać skonsumowane."
 xalw_living_description:0 "【Żyje】\n[xalw_described_artifact.GetDesc]"
 xalw_manage_decision:0 "Wsłuchaj się w żywe artefakty"
 xalw_manage_decision_confirm:0 "Wsłuchaj się"
 xalw_manage_decision_desc:0 "Niektóre skarby oddychają, pamiętają i żądają zapłaty. Dowiedz się, jak je sprawdzać i hodować."
 xalw_manage_decision_tooltip:0 "Otwórz wskazówki zarządzania żywym artefaktem"
 xalw_manage_interaction:0 "Zarządzaj żywym artefaktem"
 xalw_manage_interaction_desc:0 "Wybierz swój żywy artefakt, aby sprawdzić jego wzrost, moce, klątwy i opcje hodowli."
