l_polish:
 rule_xalw_awakening:0 "Żywe artefakty: szansa przebudzenia"
 rule_xalw_backlash:0 "Żywe artefakty: głód bazowy"
 setting_xalw_awakening_frequent:0 "Częste (15%)"
 setting_xalw_awakening_frequent_desc:0 "Każdy kwalifikujący się osobisty artefakt ma 15% szans na przebudzenie przy pierwszym odkryciu, dla każdego właściciela."
 setting_xalw_awakening_none:0 "Brak nowych przebudzeń (0%)"
 setting_xalw_awakening_none_desc:0 "Nowe artefakty nie będą się przebudzać. Istniejące żywe artefakty nadal rosną normalnie."
 setting_xalw_awakening_normal:0 "Standardowe (5%)"
 setting_xalw_awakening_normal_desc:0 "Każdy kwalifikujący się osobisty artefakt ma 5% szans na przebudzenie przy pierwszym odkryciu, dla każdego właściciela."
 setting_xalw_awakening_rare:0 "Rzadkie (1%)"
 setting_xalw_awakening_rare_desc:0 "Każdy kwalifikujący się osobisty artefakt ma 1% szans na przebudzenie przy pierwszym odkryciu, dla każdego właściciela."
 setting_xalw_backlash_mild:0 "Łagodne"
 setting_xalw_backlash_mild_desc:0 "Głód bazowy dodaje jedynie kwartalny stres, nie zmniejsza zdrowia. Konkretne klątwy pozostają w pełni aktywne."
 setting_xalw_backlash_standard:0 "Standardowe"
 setting_xalw_backlash_standard_desc:0 "Głód bazowy każdego artefaktu kosztuje zdrowie i kwartalny stres. Wiele artefaktów się kumuluje; klątwy dodają własne koszty."
 xalw.10.appease:0 "Ułagodź głód bazowy na 365 dni"
 xalw.10.close:0 "Rozumiem"
 xalw.10.desc:0 "Osobowość: [xalw_artifact.Custom('XalwPersonality')]　Dieta: [xalw_artifact.Custom('XalwDiet')]\nPozostałe stłumienie: [xalw_artifact.MakeScope.ScriptValue('xalw_suppression_remaining_days_value')|0] dni\n\nPoziom: #V [xalw_artifact.MakeScope.Var('xalw_level').GetValue|0]#!　PD: #V [xalw_artifact.MakeScope.Var('xalw_xp_in_level').GetValue|0]#! / [xalw_artifact.MakeScope.ScriptValue('xalw_next_level_xp_value')|0]\nRezonans: #V [xalw_artifact.MakeScope.Var('xalw_resonance').GetValue|0]#!/100\n[xalw_artifact.Custom('XalwAffixes')][xalw_artifact.Custom('XalwCurses')]\n\nWyposażone artefakty zdobywają automatycznie 8 PD miesięcznie i awansują po osiągnięciu progu, bez potrzeby potwierdzania. Zdjęcie bezpłatnie zatrzymuje poziom, a także trwałe efekty żywej broni. Karmienie nie ma czasu odnowienia.\nKoszt stłumienia: [xalw_artifact.MakeScope.ScriptValue('xalw_suppression_cost_value')|0] złota, 50 prestiżu, 10 stresu; koszt uspokojenia: [xalw_artifact.MakeScope.ScriptValue('xalw_appease_cost_value')|0] złota, 10 stresu.\n\nCztery opcje karmienia poniżej wybierają bezpieczny materiał o najniższej trwałości w danej rzadkości. Przed zniszczeniem zostanie wyświetlona konkretna rzecz, którą będziesz mógł potwierdzić. Możesz anulować i oznaczyć jako chronione przedmioty, których nie chcesz karmić, albo wybrać konkretny materiał przez interakcję artefaktu."
 xalw.10.feed:0 "Wybierz jako cel karmienia"
 xalw.10.feed_common:0 "Wybierz zwykłe wyposażenie do karmienia"
 xalw.10.feed_famed:0 "Wybierz słynne wyposażenie do karmienia"
 xalw.10.feed_illustrious:0 "Wybierz wybitne wyposażenie do karmienia"
 xalw.10.feed_masterwork:0 "Wybierz wyposażenie masterskie do karmienia"
 xalw.10.renew:0 "Opłać przedłużenie tłumienia o 90 dni"
 xalw.10.suppress:0 "Opłać tłumienie wzrostu na 90 dni"
 xalw.10.t:0 "[xalw_artifact.GetName]: Szept Żywej Istoty"
 xalw.10.train:0 "Trening rezonansu (50 prestiżu, 10 stresu, +25 PD)"
 xalw.11.cancel:0 "Zatrzymaj materiał"
 xalw.11.confirm:0 "Pozwól mu pochłonąć ten ekwipunek"
 xalw.11.desc:0 "Doświadczenie (z uwzględnieniem diety): #V [SCOPE.ScriptValue('xalw_selected_feed_xp_value')|0]#!\n\nNakarmić #V [xalw_material.GetName]#! przedmiot #V [xalw_artifact.GetName]#!?\n\nPodstawowe PD materiału: [xalw_material.MakeScope.ScriptValue('xalw_feed_base_xp_value')|0]; zgodność z dietą zwiększa wartość 1,25 razy.\nPD trafiają natychmiast po rzeczywistym zniszczeniu materiału, co może spowodować automatyczny awans o kilka poziomów i wywołanie klątw. Karmienie nie ma czasu odnowienia; wybór dotyczy zużycia materiału, a poziomowanie nie wymaga zgody."
 xalw.11.t:0 "Karmienie: materiał zostanie zniszczony"
 xalw.12.desc:0 "Kliknij prawym przyciskiem własny portret i wybierz #V Zarządzaj żywym artefaktem#!, aby wskazać przedmiot za pomocą standardowego selektora artefaktów.\nPo wybraniu celu możesz go trenować, opłacić stłumienie, uspokoić lub skorzystać z #V Karmienia wybranego żywego artefaktu#!, aby wybrać materiał.\nWszyscy żywymi właścicielami, w tym AI, baronowie, dworzanie bez ziemi i rycerze, podlegają takiemu samemu wzrostowi i kosztom.\n#warning Wyposażone artefakty rosną automatycznie, nawet jeśli nie przeczytasz powiadomień. Zdjęcie bezpłatnie zatrzymuje wzrost i efekty żywego artefaktu.#!\n\nPoniżej możesz bezpośrednio wysłuchać wyposażony żywy artefakt, z pierwszeństwem dla najwyższego poziomu. Aby wskazać inny przedmiot, nadal możesz skorzystać z własnej interakcji wyboru artefaktu."
 xalw.12.open:0 "Wysłuchaj [xalw_artifact.GetName]"
 xalw.12.t:0 "Zarządzanie żywym artefaktem"
 xalw_affix_10_desc:0 "Po faktycznym odblokowaniu zalet生活方式 zwiększa miesięczne doświadczenie stylu życia nauki o 5/10/15% na 365 dni, kosztem 40/60/80 prestiżu."
