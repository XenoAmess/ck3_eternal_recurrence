 xalw.10.desc:0 "Osobowość: [xalw_artifact.Custom('XalwPersonality')]　Dieta: [xalw_artifact.Custom('XalwDiet')]\nPozostałe stłumienie: [xalw_artifact.MakeScope.ScriptValue('xalw_suppression_remaining_days_value')|0] dni\n\nPoziom: #V [xalw_artifact.MakeScope.Var('xalw_level').GetValue|0]#!　PD: #V [xalw_artifact.MakeScope.Var('xalw_xp_in_level').GetValue|0]#! / [xalw_artifact.MakeScope.ScriptValue('xalw_next_level_xp_value')|0]\nRezonans: #V [xalw_artifact.MakeScope.Var('xalw_resonance').GetValue|0]#!/100\n\n[xalw_artifact.Custom('XalwAffixes')]\n[xalw_artifact.Custom('XalwCurses')]\n\nWyposażone artefakty zdobywają automatycznie 8 PD miesięcznie i awansują po osiągnięciu progu, bez potrzeby potwierdzania. Zdjęcie bezpłatnie zatrzymuje poziom, a także trwałe efekty żywej broni. Karmienie nie ma czasu odnowienia.\nKoszt stłumienia: [xalw_artifact.MakeScope.ScriptValue('xalw_suppression_cost_value')|0] złota, 50 prestiżu, 10 stresu; koszt uspokojenia: [xalw_artifact.MakeScope.ScriptValue('xalw_appease_cost_value')|0] złota, 10 stresu.\n\nCztery opcje karmienia poniżej wybierają bezpieczny materiał o najniższej trwałości w danej rzadkości. Przed zniszczeniem zostanie wyświetlona konkretna rzecz, którą będziesz mógł potwierdzić. Możesz anulować i oznaczyć jako chronione przedmioty, których nie chcesz karmić, albo wybrać konkretny materiał przez interakcję artefaktu."
 xalw.10.feed_common:0 "Wybierz zwykłe wyposażenie do karmienia"
 xalw.10.feed_famed:0 "Wybierz słynne wyposażenie do karmienia"
 xalw.10.feed_illustrious:0 "Wybierz wybitne wyposażenie do karmienia"
 xalw.10.feed_masterwork:0 "Wybierz wyposażenie masterskie do karmienia"
 xalw.12.desc:0 "Kliknij prawym przyciskiem własny portret i wybierz #V Zarządzaj żywym artefaktem#!, aby wskazać przedmiot za pomocą standardowego selektora artefaktów.\nPo wybraniu celu możesz go trenować, opłacić stłumienie, uspokoić lub skorzystać z #V Karmienia wybranego żywego artefaktu#!, aby wybrać materiał.\nWszyscy żywymi właścicielami, w tym AI, baronowie, dworzanie bez ziemi i rycerze, podlegają takiemu samemu wzrostowi i kosztom.\n#warning Wyposażone artefakty rosną automatycznie, nawet jeśli nie przeczytasz powiadomień. Zdjęcie bezpłatnie zatrzymuje wzrost i efekty żywego artefaktu.#!\n\nPoniżej możesz bezpośrednio wysłuchać wyposażony żywy artefakt, z pierwszeństwem dla najwyższego poziomu. Aby wskazać inny przedmiot, nadal możesz skorzystać z własnej interakcji wyboru artefaktu."
 xalw.12.open:0 "Wysłuchaj [xalw_artifact.GetName]"
