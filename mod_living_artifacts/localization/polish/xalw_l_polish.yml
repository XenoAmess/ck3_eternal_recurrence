 xalw_curse_2_desc:0 "Miesięcznie: większa z kwot 15/30/50 złota lub 20/35/50% pozytywnego dochodu; brak dolicza 15/25/40 stresu."
 xalw_curse_2_empty:0 ""
 xalw_curse_2_name:0 "Arystokratyczny apetyt"
 xalw_curse_3_desc:0 "Wyłącza 1/2/3 stabilne pozytywne sloty; inne pozytywne zdarzenia mają 75/50/25% swej szansy; kwartalny stres +15/25/40."
 xalw_curse_3_name:0 "Kapryśne ciało"
 xalw_curse_4_desc:0 "Tajność -10/-20/-30 punktów; kwartalnie 20/35/50% szans na ujawnienie prawdziwego osobistego sekretu."
 xalw_curse_4_name:0 "Plotkarz"
 xalw_curse_5_desc:0 "Pozytywne pasywne korzyści na poziomie 90/80/70%; kwartalnie 10/20/35% szans na przeniesienie oryginału do prawowitego odbiorcy."
 xalw_curse_5_name:0 "Uciekinier"
 xalw_curse_6_desc:0 "Prawdziwi małżonkowie zyskują wyposażoną opinię -15/-30/-50; coroczna uraza może dotknąć małżonka lub kochanka."
 xalw_curse_6_name:0 "Zazdrosny kochanek"
 xalw_curse_7_desc:0 "Traci 2/4/7 trwałości każdego miesiąca z wyposażeniem; obserwowane odzyskanie trwałości oryginału może kosztować rocznie 5/10/15 złota i 15/25/40 stresu."
 xalw_curse_7_name:0 "Głód rdzy"
 xalw_curse_8_desc:0 "Miesięczny wzrost kontroli -0,2/-0,4/-0,7; kwartalnie może stracić 10/20/35 kontroli i 15/30/50 opinii ludu."
