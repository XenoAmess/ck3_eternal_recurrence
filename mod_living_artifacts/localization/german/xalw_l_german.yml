l_german:
 rule_xalw_awakening:0 "Lebende Artefakte: Erweckungswahrscheinlichkeit"
 rule_xalw_backlash:0 "Lebende Artefakte: Grundhunger"
 setting_xalw_awakening_frequent:0 "Häufig (15 %)"
 setting_xalw_awakening_frequent_desc:0 "Jedes geeignete persönliche Artefakt hat bei erstmaligem Fund eine 15-prozentige Erweckungschance, für jeden Besitzer weltweit."
 setting_xalw_awakening_none:0 "Keine neuen Erweckungen (0 %)"
 setting_xalw_awakening_none_desc:0 "Neue Artefakte erwachen nicht mehr. Bestehende lebende Artefakte wachsen weiterhin normal."
 setting_xalw_awakening_normal:0 "Standard (5 %)"
 setting_xalw_awakening_normal_desc:0 "Jedes geeignete persönliche Artefakt hat bei erstmaligem Fund eine 5-prozentige Erweckungschance, für jeden Besitzer weltweit."
 setting_xalw_awakening_rare:0 "Selten (1 %)"
 setting_xalw_awakening_rare_desc:0 "Jedes geeignete persönliche Artefakt hat bei erstmaligem Fund eine 1-prozentige Erweckungschance, für jeden Besitzer weltweit."
 setting_xalw_backlash_mild:0 "Mild"
 setting_xalw_backlash_mild_desc:0 "Grundhunger fügt nur vierteljährlichen Stress hinzu, keine Gesundheitseinbuße. Bestimmte Flüche bleiben ungehindert aktiv."
 setting_xalw_backlash_standard:0 "Standard"
 setting_xalw_backlash_standard_desc:0 "Jedes Artefakt verursacht durch Grundhunger Kosten an Gesundheit und vierteljährlichem Stress. Mehrere Artefakte stapeln sich; Flüche addieren eigene Kosten."
 xalw.10.appease:0 "Grundhunger für 365 Tage besänftigen"
 xalw.10.close:0 "Verstanden"
 xalw.10.desc:0 "Charakter: [xalw_artifact.Custom('XalwPersonality')] Nahrung: [xalw_artifact.Custom('XalwDiet')]\nVerbleibende Unterdrückung: [xalw_artifact.MakeScope.ScriptValue('xalw_suppression_remaining_days_value')|0] Tage\n\nStufe: #V [xalw_artifact.MakeScope.Var('xalw_level').GetValue|0]#! EP: #V [xalw_artifact.MakeScope.Var('xalw_xp_in_level').GetValue|0]#! / [xalw_artifact.MakeScope.ScriptValue('xalw_next_level_xp_value')|0]\nResonanz: #V [xalw_artifact.MakeScope.Var('xalw_resonance').GetValue|0]#!/100\n[xalw_artifact.Custom('XalwAffixes')][xalw_artifact.Custom('XalwCurses')]\n\nAusgerüstete Artefakte erhalten monatlich 8 EP und steigen automatisch auf. Beim Ablegen endet das Wachstum und die anhaltenden Effekte kostenlos. Das Füttern hat keine Abklingzeit.\nUnterdrückung: [xalw_artifact.MakeScope.ScriptValue('xalw_suppression_cost_value')|0] Gold, 50 Prestige, 10 Stress; Besänftigung: [xalw_artifact.MakeScope.ScriptValue('xalw_appease_cost_value')|0] Gold, 10 Stress.\n\nDie vier Fütterstufen unten wählen das sichere Material mit der geringsten Haltbarkeit derselben Seltenheit aus. Der genaue Gegenstand wird vor der Bestätigung der Zerstörung angezeigt. Du kannst abbrechen und unerwünschte Gegenstände schützen oder über die Artefaktauswahl gezielt auswählen."
 xalw.10.feed:0 "Als Fütterungsziel festlegen"
 xalw.10.feed_common:0 "Wähle gewöhnliche Ausrüstung als Futter"
 xalw.10.feed_famed:0 "Wähle berühmte Ausrüstung als Futter"
 xalw.10.feed_illustrious:0 "Wähle außergewöhnliche Ausrüstung als Futter"
 xalw.10.feed_masterwork:0 "Wähle Meisterwerk-Ausrüstung als Futter"
 xalw.10.renew:0 "Unterdrückung um 90 Tage verlängern (kostenpflichtig)"
 xalw.10.suppress:0 "Wachstum 90 Tage unterdrücken (kostenpflichtig)"
 xalw.10.t:0 "[xalw_artifact.GetName]: Ein lebendiges Flüstern"
 xalw.10.train:0 "Resonanztraining (50 Prestige, 10 Stress, +25 EP)"
 xalw.11.cancel:0 "Material behalten"
 xalw.11.confirm:0 "Es das Material verschlingen lassen"
 xalw.11.desc:0 "Erfahrung inklusive Nahrung:#V [SCOPE.ScriptValue('xalw_selected_feed_xp_value')|0]#!\n\n#V [xalw_material.GetName]#! an #V [xalw_artifact.GetName]#! füttern?\n\nBasiserfahrung des Materials:[xalw_material.MakeScope.ScriptValue('xalw_feed_base_xp_value')|0]; bei Übereinstimmung mit der Nahrung mit 1,25 multipliziert.\nDie Erfahrung wird gutgeschrieben, sobald das Material tatsächlich zerstört wurde, und kann automatisch mehrere Stufen überspringen sowie Flüche verursachen. Füttern hat keine Abklingzeit; durch diese Wahl wird Material verbraucht, und ein Stufenaufstieg erfordert keine Zustimmung."
 xalw.11.t:0 "Fütterungsbestätigung: Das Material wird dauerhaft verschwinden"
 xalw.12.desc:0 "Klicke mit der rechten Maustaste auf dein eigenes Porträt und wähle #V Lebendes Artefakt verwalten#!, um mit der nativen Artefaktauswahl einen Gegenstand zu wählen.\nNach der Auswahl kannst du ihn trainieren, gegen Bezahlung unterdrücken, besänftigen oder mit #V Ausgewähltes lebendes Artefakt füttern#! Material auswählen.\nAlle lebenden Besitzer, darunter KI, Barone, landlose Höflinge und Ritter, haben dieselben Wachstums- und Kostenregeln.\n#warning Ausgerüstete Artefakte wachsen automatisch, selbst wenn Benachrichtigungen nicht gelesen werden. Beim Ablegen enden Wachstum und lebende Effekte kostenlos.#!\n\nUnten kannst du direkt ein ausgerüstetes lebendes Artefakt belauschen, wobei die höchste Stufe bevorzugt wird; für einen anderen bestimmten Gegenstand verwende weiterhin deine Artefaktinteraktion."
 xalw.12.open:0 "[xalw_artifact.GetName] belauschen"
 xalw.12.t:0 "Verwaltung lebender Artefakte"
 xalw_affix_10_desc:0 "Ein echter Bonusvorteil gewährt 365 Tage lang +5/10/15% monatliche Lernerfahrung und kostet 40/60/80 Prestige."
