l_simp_chinese:
 rule_xalw_awakening:0 "活武器：新觉醒概率"
 rule_xalw_backlash:0 "活武器：基础饥渴"
 setting_xalw_awakening_frequent:0 "常见（15%）"
 setting_xalw_awakening_frequent_desc:0 "每件合格个人装备首次发现时有15%概率觉醒，全世界同规则。"
 setting_xalw_awakening_none:0 "关闭新觉醒（0%）"
 setting_xalw_awakening_none_desc:0 "新装备不再觉醒。已有活武器仍按正常规则成长。"
 setting_xalw_awakening_normal:0 "标准（5%）"
 setting_xalw_awakening_normal_desc:0 "每件合格个人装备首次发现时有5%概率觉醒，全世界同规则。"
 setting_xalw_awakening_rare:0 "罕见（1%）"
 setting_xalw_awakening_rare_desc:0 "每件合格个人装备首次发现时有1%概率觉醒，全世界同规则。"
 setting_xalw_backlash_mild:0 "温和"
 setting_xalw_backlash_mild_desc:0 "基础饥渴仅增加季度压力，不减少健康。具体诅咒不受减轻。"
 setting_xalw_backlash_standard:0 "标准"
 setting_xalw_backlash_standard_desc:0 "每件基础饥渴造成健康与季度压力代价。多件叠加；具体诅咒另算。"
 xalw.10.appease:0 "安抚基础饥渴365日"
 xalw.10.close:0 "我知道了"
 xalw.10.desc:0 "性格：[xalw_artifact.Custom('XalwPersonality')]　食性：[xalw_artifact.Custom('XalwDiet')]\n镇压剩余：[xalw_artifact.MakeScope.ScriptValue('xalw_suppression_remaining_days_value')|0]日\n\n等级：#V [xalw_artifact.MakeScope.Var('xalw_level').GetValue|0]#!　经验：#V [xalw_artifact.MakeScope.Var('xalw_xp_in_level').GetValue|0]#! / [xalw_artifact.MakeScope.ScriptValue('xalw_next_level_xp_value')|0]\n共鸣：#V [xalw_artifact.MakeScope.Var('xalw_resonance').GetValue|0]#!/100\n\n[xalw_artifact.Custom('XalwAffixes')]\n[xalw_artifact.Custom('XalwCurses')]\n\n装备时每月自动获得8经验。达到门槛就升级，无须确认。卸下免费停级，同时停止活武器持续效果。喂养无冷却。\n镇压报价：[xalw_artifact.MakeScope.ScriptValue('xalw_suppression_cost_value')|0]金币、50威望、10压力；安抚报价：[xalw_artifact.MakeScope.ScriptValue('xalw_appease_cost_value')|0]金币、10压力。"
 xalw.10.feed:0 "把它设为喂养目标"
 xalw.10.renew:0 "付费续镇90日"
 xalw.10.suppress:0 "付费镇压成长90日"
 xalw.10.t:0 "[xalw_artifact.GetName]：活物的低语"
 xalw.10.train:0 "共鸣训练（50威望，10压力，+25经验）"
 xalw.11.cancel:0 "保留材料"
 xalw.11.confirm:0 "让它吞下这件装备"
 xalw.11.desc:0 "本次经验（已含食性）：#V [owner.MakeScope.ScriptValue('xalw_selected_feed_xp_value')|0]#!\n\n将#V [xalw_material.GetName]#!喂给#V [xalw_artifact.GetName]#!？\n\n材料基础经验：[xalw_material.MakeScope.ScriptValue('xalw_feed_base_xp_value')|0]；符合食性再乘1.25。\n材料真实销毁后经验立即到账，可能自动跨越多个等级并产生诅咒。喂养没有冷却；材料消费才是此处的选择，升级不会征求许可。"
 xalw.11.t:0 "喂养确认：材料将永久消失"
 xalw.12.desc:0 "右键自己的头像，选择#V 管理活武器#!，使用原生宝物选择器挑选物品。\n选定目标后可训练、付费镇压、安抚，也可用#V 喂养选定的活武器#!选择材料。\n所有在世持有者，包括AI、男爵、无地廷臣与骑士，遵守相同成长与代价。\n#warning 活武器装备时会自行成长；不查看通知也照常升级。卸下免费停级，同时失去活武器效果。#!"
 xalw.12.t:0 "活武器管理"
 xalw_affix_10_desc:0 "实际解锁生活技能后，365日月度学识生活方式经验增加5/10/15%，损失40/60/80威望。"
 xalw_affix_10_name:0 "墨水成瘾"
 xalw_affix_11_desc:0 "精神崩溃真正结算后减压10/15/20，失去20/35/50威望。"
 xalw_affix_11_name:0 "笑到失态"
 xalw_affix_12_desc:0 "争夺另一件活装备的能力；连续三月会影响下一次自然突变。"
 xalw_affix_12_name:0 "嫉妒的首席"
