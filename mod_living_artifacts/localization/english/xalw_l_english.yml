 rule_xalw_awakening:0 "Living Artifacts: Awakening Chance"
 rule_xalw_backlash:0 "Living Artifacts: Base Hunger"
 setting_xalw_awakening_frequent:0 "Frequent (15%)"
 setting_xalw_awakening_frequent_desc:0 "Each eligible personal artifact has a 15% awakening chance on first discovery, for every owner."
 setting_xalw_awakening_none:0 "No New Awakenings (0%)"
 setting_xalw_awakening_none_desc:0 "No new awakenings. Existing living artifacts continue to grow normally."
 setting_xalw_awakening_normal:0 "Standard (5%)"
 setting_xalw_awakening_normal_desc:0 "Each eligible personal artifact has a 5% awakening chance on first discovery, for every owner."
 setting_xalw_awakening_rare:0 "Rare (1%)"
 setting_xalw_awakening_rare_desc:0 "Each eligible personal artifact has a 1% awakening chance on first discovery, for every owner."
 setting_xalw_backlash_mild:0 "Mild"
 setting_xalw_backlash_mild_desc:0 "Base hunger only adds quarterly stress. Curses remain fully active."
 setting_xalw_backlash_standard:0 "Standard"
 setting_xalw_backlash_standard_desc:0 "Each artifact's base hunger costs health and quarterly stress. Multiple artifacts stack; curses add their own costs."
 xalw.10.appease:0 "Appease Base Hunger for 365 Days"
 xalw.10.close:0 "Understood"
 xalw.10.desc:0 "Personality: [xalw_artifact.Custom('XalwPersonality')]  Diet: [xalw_artifact.Custom('XalwDiet')]\nSuppression remaining: [xalw_artifact.MakeScope.ScriptValue('xalw_suppression_remaining_days_value')|0] days\n\nLevel: #V [xalw_artifact.MakeScope.Var('xalw_level').GetValue|0]#!  XP: #V [xalw_artifact.MakeScope.Var('xalw_xp_in_level').GetValue|0]#! / [xalw_artifact.MakeScope.ScriptValue('xalw_next_level_xp_value')|0]\nResonance: #V [xalw_artifact.MakeScope.Var('xalw_resonance').GetValue|0]#!/100\n\n[xalw_artifact.Custom('XalwAffixes')]\n[xalw_artifact.Custom('XalwCurses')]\n\nEquipped artifacts gain 8 XP monthly and level automatically. Unequipping stops growth and ongoing effects. Feeding has no cooldown.\nSuppression: [xalw_artifact.MakeScope.ScriptValue('xalw_suppression_cost_value')|0] gold, 50 prestige, 10 stress. Appeasement: [xalw_artifact.MakeScope.ScriptValue('xalw_appease_cost_value')|0] gold, 10 stress.\n\nRarity feeding picks the safe material with the least durability in that rarity. Review the exact item before confirming destruction. Cancel and protect anything you want to keep, or use the artifact picker for a specific choice."
 xalw.10.feed:0 "Select it as the Feeding Target"
 xalw.10.feed_common:0 "Choose Common Equipment as Food"
 xalw.10.feed_famed:0 "Choose Famed Equipment as Food"
 xalw.10.feed_illustrious:0 "Choose Illustrious Equipment as Food"
 xalw.10.feed_masterwork:0 "Choose Masterwork Equipment as Food"
 xalw.10.renew:0 "Pay to Extend Suppression by 90 Days"
 xalw.10.suppress:0 "Pay to Suppress Growth for 90 Days"
 xalw.10.t:0 "[xalw_artifact.GetName]: A Living Whisper"
 xalw.10.train:0 "Resonance Training (50 prestige, 10 stress, +25 XP)"
 xalw.11.cancel:0 "Keep the Material"
 xalw.11.confirm:0 "Let It Devour the Material"
 xalw.11.desc:0 "Experience including diet: #V [owner.MakeScope.ScriptValue('xalw_selected_feed_xp_value')|0]#!\n\nFeed #V [xalw_material.GetName]#! to #V [xalw_artifact.GetName]#!?\n\nBase material XP: [xalw_material.MakeScope.ScriptValue('xalw_feed_base_xp_value')|0], multiplied by 1.25 if it matches the diet.\nExperience arrives after actual destruction, immediately resolving every level and curse. Feeding has no cooldown. This choice authorizes material consumption; leveling requires no consent."
 xalw.11.t:0 "Feeding: The Material Will Be Destroyed"
 xalw.12.desc:0 "Right-click your own portrait and choose #V Manage Living Artifact#! to select an artifact with the native picker.\nThen train, pay for suppression, appease, or use #V Feed Selected Living Artifact#! to choose material.\nLiving owners including AI, barons, unlanded courtiers, and knights share the same growth and costs.\n#warning Equipped artifacts grow automatically, even without reading notices. Unequipping stops growth and living effects for free.#!\n\nBelow, listen directly to an equipped living artifact, prioritizing the highest level. Use your artifact interaction to select another specific item."
 xalw.12.open:0 "Listen to [xalw_artifact.GetName]"
 xalw.12.t:0 "Living Artifact Management"
 xalw_affix_10_desc:0 "A genuine perk unlock grants 5/10/15% monthly learning lifestyle experience for 365 days and costs 40/60/80 prestige."
 xalw_affix_10_name:0 "Ink Addiction"
 xalw_affix_11_desc:0 "After an actual mental break resolves, loses 10/15/20 stress and 20/35/50 prestige."
