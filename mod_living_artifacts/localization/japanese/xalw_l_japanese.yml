 xalw_feed_interaction:0 "選択中の生ける装備に餌をや"
 xalw_feed_interaction_desc:0 "装備していない通常の保護なし個人装備を食べ物として選択。実 rarity で経験値を取得しクールダウンなし。確認で素材消滅。"
