 xalw_affix_6_name:0 "夢の中の貸し付け"
 xalw_affix_7_desc:0 "実際に発見した秘密を保存する。新しい所有者はそのうち一つを本当に知ることができる。"
 xalw_affix_7_name:0 "秘密嗅ぎ犬"
 xalw_affix_8_desc:0 "所有者に対する実際に発見された敵対的な策略は、恐怖度+5/10/15、威厳-15/30/45を与え、その主謀者を推測することはない。"
 xalw_affix_8_name:0 "アリバイ"
 xalw_affix_9_desc:0 "実際に未記録の目的地に到達すると、20/35/50の学識経験と8ストレスを獲得する。"
 xalw_affix_9_name:0 "地図をかじる者"
