l_japanese:
 rule_xalw_awakening:0 "活性武器：新覚醒確率"
 rule_xalw_backlash:0 "活性武器：基礎飢え"
 setting_xalw_awakening_frequent:0 "頻繁（15%）"
 setting_xalw_awakening_frequent_desc:0 "条件を満たす個人装備は(ownerごとに)初発見時に15%の確率で覚醒する。"
 setting_xalw_awakening_none:0 "新規覚醒を無効（0%）"
 setting_xalw_awakening_none_desc:0 "新規装備は覚醒しない。既存の活性武器は通常どおり成長する。"
 setting_xalw_awakening_normal:0 "標準（5%）"
 setting_xalw_awakening_normal_desc:0 "条件を満たす個人装備は(ownerごとに)初発見時に5%の確率で覚醒する。"
 setting_xalw_awakening_rare:0 "希少（1%）"
 setting_xalw_awakening_rare_desc:0 "条件を満たす個人装備は(ownerごとに)初発見時に1%の確率で覚醒する。"
 setting_xalw_backlash_mild:0 "温和"
 setting_xalw_backlash_mild_desc:0 "基礎飢えは四半期ごとにストレスを加えるだけで、健康-determには影響しない。呪いは軽減されない。"
 setting_xalw_backlash_standard:0 "標準"
 setting_xalw_backlash_standard_desc:0 "各装備の基礎飢えが健康と四半期ストレスを減少させる。複数装備は重複し、呪いは別途Tl。"
 xalw.10.appease:0 "基礎飢えを365日間鎮める"
 xalw.10.close:0 " perfeccionました"
 xalw.10.feed:0 "給餌対象に設定"
 xalw.10.renew:0 "金貨で鎮圧を90日間延長"
 xalw.10.suppress:0 "金貨で90日間成長を抑止"
 xalw.10.t:0 "[xalw_artifact.GetName]：生きたものの囁き"
 xalw.10.train:0 "共鳴訓練（名声50、ストレス10、+25経験）"
 xalw.11.cancel:0 "素材を保持"
 xalw.11.confirm:0 "装備を DEVOUR させる"
 xalw.11.desc:0 "今回の経験値（食性込み）：#V [SCOPE.ScriptValue('xalw_selected_feed_xp_value')|0]#!\n\n#V [xalw_material.GetName]#!を#V [xalw_artifact.GetName]#!に給餌する？\n\n材料の基礎経験値：[xalw_material.MakeScope.ScriptValue('xalw_feed_base_xp_value')|0]；食性に合致すればさらに1.25倍。\n材料が実際に破壊された時点で経験値が即時付与され、複数レベル跨ぎの自動昇級や呪いが生じ得る。給餌にクールダウンはない；この選択は材料消費を許可するものであり、昇級に同意を問う必要はない。"
 xalw.11.t:0 "給餌確認：素材は完全に消費される"
 xalw.12.t:0 "活性武器の管理"
 xalw_affix_10_desc:0 "実際の生活スキルを解放すると、365日間の月次学問ライフスタイル経験値が5/10/15%増加し、40/60/80の威厳が失われる。"
 xalw_affix_10_name:0 "インク中毒"
 xalw_affix_11_desc:0 "精神崩壊が実際に発生した場合、ストレスが10/15/20、名声が20/35/50減少する。"
 xalw_affix_11_name:0 "不自然な笑い声"
 xalw_affix_12_desc:0 "別の活性装備と競合する。3か月連続で次の自然突然変異に影響する。"
 xalw_affix_12_name:0 "嫉妬するプリマ"
