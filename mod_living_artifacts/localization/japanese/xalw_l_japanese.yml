 xalw.10.desc:0 "性格：[xalw_artifact.Custom('XalwPersonality')]　食性：[xalw_artifact.Custom('XalwDiet')]\n鎮圧残り：[xalw_artifact.MakeScope.ScriptValue('xalw_suppression_remaining_days_value')|0]日\n\n等級：#V [xalw_artifact.MakeScope.Var('xalw_level').GetValue|0]#!　経験値：#V [xalw_artifact.MakeScope.Var('xalw_xp_in_level').GetValue|0]#! / [xalw_artifact.MakeScope.ScriptValue('xalw_next_level_xp_value')|0]\n共鳴：#V [xalw_artifact.MakeScope.Var('xalw_resonance').GetValue|0]#!/100\n\n[xalw_artifact.Custom('XalwAffixes')]\n[xalw_artifact.Custom('XalwCurses')]\n\n装備中は毎月自動的に8経験値を獲得します。しきい値に達すれば確認なしに昇級します。解除すれば無料で成長が止まり、活兵器の持続”也同時に停止します。給餌にクールダウンはありません。\n鎮圧費用：[xalw_artifact.MakeScope.ScriptValue('xalw_suppression_cost_value')|0]金币、威信50、ストレス10。安撫費用：[xalw_artifact.MakeScope.ScriptValue('xalw_appease_cost_value')|0]金币、ストレス10。\n\n下の4段階の給餌では、同じ希少度の安全素材のうち耐久値が最も低いものを選び、具体的な品物を表示してから破壊を確認します。キャンセルして給餌したくない品物を保護することも、宝物の自選対話から正確に選ぶこともできます。"
 xalw.10.feed_common:0 "通常の装備を1件選んで給餌する"
 xalw.10.feed_famed:0 "名匠装備を1件選んで給餌する"
 xalw.10.feed_illustrious:0 "卓越装備を1件選んで給餌する"
 xalw.10.feed_masterwork:0 "マスタークラフト装備を1件選んで給餌する"
 xalw.12.desc:0 "自分の肖像画を右クリックし、#V 活兵器を管理#!を選んで、標準の宝物選択画面で品物を選びます。\n対象を選択後、訓練、有料での鎮圧、安撫を行い、#V 選択した活兵器に給餌#!で素材を選ぶこともできます。\nAI、男爵、無領廷臣、騎士など、生きたすべての所有者は、同じ成長とコストを負担します。\n#warning 活兵器は装備中に自動的に成長します。通知を確認しなくても昇級します。解除すれば無料で成長と活兵器の効果が停止します。#!\n\n下から、装備済みの活兵器を直接聞けます（優先して等級が高いもの）。別の品物を指定する場合は、自己の宝物選択対話を使用できます。"
 xalw.12.open:0 "[xalw_artifact.GetName]を聞く"
