 xalw_curse_2_desc:0 "毎月、固定15/30/50ゴールドか正月の収入20/35/50%のいずれか高い方を徴収。不足分にはさらにストレス15/25/40。"
 xalw_curse_2_empty:0 ""
 xalw_curse_2_name:0 "貴族の食欲"
 xalw_curse_3_desc:0 "安定した1/2/3つの肯定 randomly スロットが無効化。ほかの肯定イベントの確率は75/50/25%。四半期ごとにストレス+15/25/40。"
 xalw_curse_3_name:0 "変わりやすい身体"
 xalw_curse_4_desc:0 "秘密保持-10/-20/-30ポイント。四半期ごとに20/35/50%の確率で実際の个人的秘密が明らかになる。"
 xalw_curse_4_name:0 "おしゃべり"
 xalw_curse_5_desc:0 "肯定的な受動効果が90/80/70%になる。四半期ごとに10/20/35%の確率で原件が正当な受取人の手元へ移る。"
 xalw_curse_5_name:0 "家出"
 xalw_curse_6_desc:0 "真の配偶者equip.opinion-15/-30/-50。毎年、配偶者または愛人に2年間の怨恨を与える可能性がある。"
 xalw_curse_6_name:0 "嫉妒する恋人"
 xalw_curse_7_desc:0 "装備している月ごとに耐久性を2/4/7失う。月次処理で原件の耐久性の回復が確認された場合、毎年、5/10/15金币と15/25/40ストレスを請求される可能性がある。"
 xalw_curse_7_name:0 "錆の飢え"
 xalw_curse_8_desc:0 "月光の統制力成長-0.2/-0.4/-0.7。四半期ごとに10/20/35統制力と15/30/50民衆的好感を失う可能性がある。"
 xalw_curse_8_name:0 "安眠の王国"
