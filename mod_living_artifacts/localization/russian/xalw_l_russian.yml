 xalw_hunger_5_modifier:0 "Голод живого (5)"
 xalw_keep_interaction:0 "Переключить защиту от кормления"
 xalw_keep_interaction_desc:0 "Отметить личное снаряжение как защищённое или снять защиту; защищённые предметы нельзя скормить."
 xalw_manage_decision:0 "Прислушаться к живому оружию"
 xalw_manage_decision_confirm:0 "Послушать их голоса"
 xalw_manage_decision_desc:0 "Некоторые сокровища дышат, помнят и требуют плату. Узнайте, как осматривать и взращивать живое оружие."
 xalw_manage_decision_tooltip:0 "Открыть руководство по управлению живым оружием"
 xalw_manage_interaction:0 "Управление живым оружием"
 xalw_manage_interaction_desc:0 "Выберите своё живое оружие, чтобы осмотреть его рост, свойства, проклятия и варианты воспитания."
