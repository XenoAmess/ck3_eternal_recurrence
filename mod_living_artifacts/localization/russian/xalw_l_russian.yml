l_russian:
 rule_xalw_awakening:0 "Живые артефакты: шанс пробуждения"
 rule_xalw_backlash:0 "Живые артефакты: базовый голод"
 setting_xalw_awakening_frequent:0 "Часто (15%)"
 setting_xalw_awakening_frequent_desc:0 "Каждый подходящий личный артефакт имеет 15% шанс пробуждения при первом обнаружении, у любого владельца."
 setting_xalw_awakening_none:0 "Новые пробуждения отключены (0%)"
 setting_xalw_awakening_none_desc:0 "Новые артефакты более не пробуждаются. Существующие живые артефакты продолжают расти по обычным правилам."
 setting_xalw_awakening_normal:0 "Стандартно (5%)"
 setting_xalw_awakening_normal_desc:0 "Каждый подходящий личный артефакт имеет 5% шанс пробуждения при первом обнаружении, у любого владельца."
 setting_xalw_awakening_rare:0 "Редко (1%)"
 setting_xalw_awakening_rare_desc:0 "Каждый подходящий личный артефакт имеет 1% шанс пробуждения при первом обнаружении, у любого владельца."
 setting_xalw_backlash_mild:0 "Мягко"
 setting_xalw_backlash_mild_desc:0 "Базовый голод лишь добавляет квартальный стресс и не снижает здоровье. Конкретные проклятия не ослабляются."
 setting_xalw_backlash_standard:0 "Стандартно"
 setting_xalw_backlash_standard_desc:0 "Базовый голод каждого артефакта стоит здоровья и квартального стресса. Несколько артефактов складываются; проклятия добавляют свои издержки."
 xalw.10.appease:0 "Утолить базовый голод на 365 дней"
 xalw.10.close:0 "Понятно"
 xalw.10.feed:0 "Назначить целью кормления"
 xalw.10.renew:0 "Продлить подавление на 90 дней за плату"
 xalw.10.suppress:0 "Оплатить подавление роста на 90 дней"
 xalw.10.t:0 "[xalw_artifact.GetName]: Живой шёпот"
 xalw.10.train:0 "Тренировка резонанса (50 престижа, 10 стресса, +25 опыта)"
 xalw.11.cancel:0 "Оставить материал"
 xalw.11.confirm:0 "Позволить ему поглотить снаряжение"
 xalw.11.desc:0 "Опыт с учётом рациона: #V [owner.MakeScope.ScriptValue('xalw_selected_feed_xp_value')|0]#!\n\nСкормить #V [xalw_material.GetName]#! объекту #V [xalw_artifact.GetName]#!?\n\nБазовый опыт материала: [xalw_material.MakeScope.ScriptValue('xalw_feed_base_xp_value')|0]; при соответствии рациону умножается на 1,25.\nПосле фактического уничтожения материала опыт начисляется сразу, может автоматически повысить несколько уровней и вызвать проклятия. Кормление не имеет перезарядки; именно расходование материала является выбором здесь, повышение уровня не требует разрешения."
 xalw.11.t:0 "Подтверждение кормления: материал будет уничтожен"
 xalw.12.t:0 "Управление живым оружием"
 xalw_affix_10_desc:0 "Действительное открытие жизненного навыка увеличивает ежемесячный опыт образа жизни «Учёба» на 5/10/15% в течение 365 дней и снижает престиж на 40/60/80."
 xalw_affix_10_name:0 "Зависимость от чернил"
 xalw_affix_11_desc:0 "После реального завершения нервного срыва снимает 10/15/20 стресса и стоит 20/35/50 престижа."
 xalw_affix_11_name:0 "Неуместный смех"
 xalw_affix_12_desc:0 "Соперничает с другим живым предметом; три месяца подряд влияет на следующую естественную мутацию."
 xalw_affix_12_name:0 "Ревнивая примадонна"
