 xalw.10.desc:0 "Характер: [xalw_artifact.Custom('XalwPersonality')]　Рацион: [xalw_artifact.Custom('XalwDiet')]\nОсталось подавления: [xalw_artifact.MakeScope.ScriptValue('xalw_suppression_remaining_days_value')|0] дн.\n\nУровень: #V [xalw_artifact.MakeScope.Var('xalw_level').GetValue|0]#!　Опыт: #V [xalw_artifact.MakeScope.Var('xalw_xp_in_level').GetValue|0]#! / [xalw_artifact.MakeScope.ScriptValue('xalw_next_level_xp_value')|0]\nРезонанс: #V [xalw_artifact.MakeScope.Var('xalw_resonance').GetValue|0]#!/100\n\n[xalw_artifact.Custom('XalwAffixes')]\n[xalw_artifact.Custom('XalwCurses')]\n\nЭкипированные артефакты ежемесячно получают 8 опыта и автоматически повышают уровень при достижении порога, без подтверждения. Снятие бесплатно останавливает рост и эффекты живого оружия. Кормление не имеет перезарядки.\nСтоимость подавления: [xalw_artifact.MakeScope.ScriptValue('xalw_suppression_cost_value')|0] зол., 50 престижа, 10 стресса; стоимость усмирения: [xalw_artifact.MakeScope.ScriptValue('xalw_appease_cost_value')|0] зол., 10 стресса.\n\nЧетыре варианта кормления ниже выбирают самый прочный безопасный материал той же редкости; перед подтверждением уничтожения сначала показывается конкретный предмет. Можно отменить действие и защитить ненужные предметы либо точно выбрать материал через взаимодействие с самостоятельным выбором сокровищ."
 xalw.10.feed_common:0 "Выберите обычное снаряжение для кормления"
 xalw.10.feed_famed:0 "Выберите снаряжение известного качества для кормления"
 xalw.10.feed_illustrious:0 "Выберите снаряжение выдающегося качества для кормления"
 xalw.10.feed_masterwork:0 "Выберите снаряжение мастерского качества для кормления"
 xalw.12.desc:0 "Щёлкните правой кнопкой по своему портрету и выберите #V Управление живым артефактом#!, чтобы выбрать предмет с помощью стандартного средства выбора сокровищ.\nПосле выбора цели её можно тренировать, оплачивать подавление, усмирять или выбрать материал через #V Кормление выбранного живого артефакта#!.\nВсе живые владельцы, включая ИИ, баронов, безземельных придворных и рыцарей, имеют одинаковый рост и расходы.\n#warning Экипированные артефакты растут автоматически, даже если не читать уведомления. Снятие бесплатно останавливает рост и эффекты живого оружия.#!\n\nНиже можно напрямую выслушать один экипированный живой артефакт, приоритет отдавая наивысшему уровню. Чтобы выбрать другой предмет, используйте взаимодействие с самостоятельным выбором сокровищ."
 xalw.12.open:0 "Выслушать [xalw_artifact.GetName]"
