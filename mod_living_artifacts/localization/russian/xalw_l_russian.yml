 xalw_feed_interaction:0 "Покормить выбранное живое оружие"
 xalw_feed_interaction_desc:0 "Выберите неэкипированное обычное незащищённое личное снаряжение в качестве пищи. Его реальная редкость определяет количество опыта. Перезарядки нет. После подтверждения материал уничтожается."
 xalw_feed_selector_help:0 "Цель выбрана. Щёлкните правой кнопкой по своему портрету, выберите «Покормить выбранное живое оружие», затем выберите материал. До уничтожения материала можно отменить."
 xalw_growth_text:0 "[xalw_artifact.GetName] автоматически достиг [xalw_artifact.MakeScope.Var('xalw_level').GetValue|0] уровня. Новые способности или проклятия уже вступили в силу."
 xalw_growth_title:0 "Живое оружие выросло само"
