 xalw_curse_2_desc:0 "Ежемесячно: большее из 15/30/50 золота или 20/35/50% положительного дохода; нехватка добавляет 15/25/40 стресса."
 xalw_curse_2_empty:0 ""
 xalw_curse_2_name:0 "Дворянский аппетит"
 xalw_curse_3_desc:0 "Блокирует 1/2/3 стабильных положительных слота; прочие позитивные события с шансом 75/50/25%; квартальный стресс +15/25/40."
 xalw_curse_3_name:0 "Изменчивое тело"
 xalw_curse_4_desc:0 "Скрытность -10/-20/-30 пунктов; ежеквартально 20/35/50% шанс раскрыть реальный личный секрет."
 xalw_curse_4_name:0 "Болтун"
 xalw_curse_5_desc:0 "Положительные пассивные бонусы на уровне 90/80/70%; ежеквартально 10/20/35% шанс передать оригинал предмета законному получателю."
 xalw_curse_5_name:0 "Беглец"
 xalw_curse_6_desc:0 "Настоящие супруги получают -15/-30/-50 мнения от этого предмета; ежегодно у супруга или возлюбленного может появиться обида сроком на два года."
 xalw_curse_6_name:0 "Ревнивец"
 xalw_curse_7_desc:0 "Каждый месяц использования отнимает 2/4/7 прочности; если при закрытии месяца прочность оригинала восстановится, ежегодно можно потерять 5/10/15 золота и получить 15/25/40 стресса."
 xalw_curse_7_name:0 "Ржавый голод"
 xalw_curse_8_desc:0 "Ежемесячный прирост контроля -0,2/-0,4/-0,7; ежеквартально может потерять 10/20/35 контроля и 15/30/50 народного мнения."
 xalw_curse_8_name:0 "Неугомонное королевство"
