l_korean:
 rule_xalw_awakening:0 "산성 무기: 신규 각성 확률"
 rule_xalw_backlash:0 "산성 무기: 기본 허기"
 setting_xalw_awakening_frequent:0 "빈번함 (15%)"
 setting_xalw_awakening_frequent_desc:0 "모든 소유자의 적합한 개인 장비는 최초 발견 시 15% 확률로 각성합니다."
 setting_xalw_awakening_none:0 "신규 각성 없음 (0%)"
 setting_xalw_awakening_none_desc:0 "새 장비는 더 이상 각성하지 않습니다. 기존 산성 무기는 정상 규칙에 따라 계속 성장합니다."
 setting_xalw_awakening_normal:0 "표준 (5%)"
 setting_xalw_awakening_normal_desc:0 "모든 소유자의 적합한 개인 장비는 최초 발견 시 5% 확률로 각성합니다."
 setting_xalw_awakening_rare:0 "희귀함 (1%)"
 setting_xalw_awakening_rare_desc:0 "모든 소유자의 적합한 개인 장비는 최초 발견 시 1% 확률로 각성합니다."
 setting_xalw_backlash_mild:0 "완화"
 setting_xalw_backlash_mild_desc:0 "기본 허기는 분기별 스트레스만 증가시키며 건강은 감소시키지 않습니다. 개별 축복은 완화되지 않습니다."
 setting_xalw_backlash_standard:0 "표준"
 setting_xalw_backlash_standard_desc:0 "각 장비의 기본 허기는 건강과 분기별 스트레스를 소모합니다. 여러 장비의 효과는 중첩되며 개별 축복 비용은 별도로 적용됩니다."
 xalw.10.appease:0 "기본 허기 완화 365일"
 xalw.10.close:0 "알겠습니다"
 xalw.10.feed:0 "급여 대상으로 지정"
 xalw.10.renew:0 "90일 연장 비용 지불"
 xalw.10.suppress:0 "성장을 90일 동안 유료 진압"
 xalw.10.t:0 "[xalw_artifact.GetName]: 살아 있는 속삭임"
 xalw.10.train:0 "공명 훈련 (명성 50, 스트레스 10, 경험치 +25)"
 xalw.11.cancel:0 "재료 유지"
 xalw.11.confirm:0 "이 장비를 삼키게 하기"
 xalw.11.desc:0 "이번 경험치(식성 반영): #V [owner.MakeScope.ScriptValue('xalw_selected_feed_xp_value')|0]#!\n\n#V [xalw_material.GetName]#!을(를) #V [xalw_artifact.GetName]#!에게(에게) 먹일까?\n\n재료 기본 경험치: [xalw_material.MakeScope.ScriptValue('xalw_feed_base_xp_value')|0]. 식성과 맞으면 1.25배를 적용합니다.\n재료가 실제로 소멸된 즉시 경험치가 지급되며 여러 레벨을 한 번에 넘거나 저주가 발생할 수 있습니다. 급여에는 쿨타임이 없으며, 선택은 재료 소비에 대한 승인뿐이고 레벨업에는 승인이 필요하지 않습니다."
 xalw.11.t:0 "급여 확인: 재료는 영구히 사라집니다"
 xalw.12.t:0 "산성 무기 관리"
 xalw_affix_10_desc:0 "실제로 생활 기술을 해제하면 365일간 월간 학식 생활방식 경험치 5/10/15% 증가, 권위 40/60/80 소모."
 xalw_affix_10_name:0 "잉크 중독"
 xalw_affix_11_desc:0 "실제로 정신 붕괴가 해결되면 스트레스 10/15/20이 감소하고 명성 20/35/50을 잃습니다."
 xalw_affix_11_name:0 "품위를 잃은 웃음"
 xalw_affix_12_desc:0 "다른 산성 장비와 경쟁하며 3개월 연속 활성화되면 다음 자연 변이에 영향을 줍니다."
