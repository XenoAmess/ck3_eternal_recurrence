 xalw.10.feed_masterwork:0 "먹이 줄 대가품 등급 장비 선택"
 xalw.12.desc:0 "자신의 초상화를 오른클릭하고 #V 살아 있는 유물 관리#!를 선택한 뒤 기본 보물 선택기로 물품을 고르세요.\n대상을 선택하면 훈련하고, 비용을 내어 진압하거나 달랠 수 있으며, #V 선택한 살아 있는 유물 먹이기#!로 재료를 고를 수도 있습니다.\nAI를 포함한 모든 소유자와 남작, 영지 없는 코트아르, 기사는 동일한 성장과 비용을 적용받습니다.\n#warning 살아 있는 유물을 장착하면 알림을 읽지 않아도 자동으로 성장합니다. 해제하면 무료로 성장이 멈추고 살아 있는 유물의 효과도 사라집니다.#!\n\n아래에서 장착된 살아 있는 유물 하나를 직접 들을 수 있으며(가장 높은 등급 우선), 다른 특정 아이템을 선택하려면 자신의 보물 선택 상호작용을 사용하세요."
 xalw.12.open:0 "[xalw_artifact.GetName] 듣기"
