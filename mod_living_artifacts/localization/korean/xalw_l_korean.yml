 xalw.10.desc:0 "성격: [xalw_artifact.Custom('XalwPersonality')]　식성: [xalw_artifact.Custom('XalwDiet')]\n진압 남은 기간: [xalw_artifact.MakeScope.ScriptValue('xalw_suppression_remaining_days_value')|0]일\n\n등급: #V [xalw_artifact.MakeScope.Var('xalw_level').GetValue|0]#!　경험치: #V [xalw_artifact.MakeScope.Var('xalw_xp_in_level').GetValue|0]#! / [xalw_artifact.MakeScope.ScriptValue('xalw_next_level_xp_value')|0]\n공명: #V [xalw_artifact.MakeScope.Var('xalw_resonance').GetValue|0]#!/100\n\n[xalw_artifact.Custom('XalwAffixes')]\n[xalw_artifact.Custom('XalwCurses')]\n\n장착 시 매달 자동으로 8의 경험치를 얻습니다. 기준에 도달하면 확인 없이 성장합니다. 해제하면 무료로 성장이 멈추고 살아 있는 무기의 지속 효과도 종료됩니다. 먹이 주기에는 재사용 대기 시간이 없습니다.\n진압 비용: 금화 [xalw_artifact.MakeScope.ScriptValue('xalw_suppression_cost_value')|0], 위엄 50, 스트레스 10; 달生产成本: 금화 [xalw_artifact.MakeScope.ScriptValue('xalw_appease_cost_value')|0], 스트레스 10.\n\n아래 네 등급의 먹이 주기에서는 해당 희귀도에서 내구도가 가장 낮은 안전한 재료를 선택합니다. 먼저 具体적인 아이템을 확인한 뒤 파괴를 확정할 수 있습니다. 취소하고 먹이고 싶지 않은 아이템을 보호할 수도 있으며, 보물의 선택 상호작용으로 정확히 고를 수도 있습니다."
 xalw.10.feed_common:0 "먹이 줄 일반 등급 장비 선택"
