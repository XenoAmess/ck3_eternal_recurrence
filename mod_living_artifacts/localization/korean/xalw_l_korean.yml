 xalw_curse_2_desc:0 "매월 금화 15/30/50 또는 양수 수입의 20/35/50% 중 더 큰 금액을 징수합니다. 부족하면 스트레스 15/25/40이 추가됩니다."
 xalw_curse_2_empty:0 ""
 xalw_curse_2_name:0 "귀족의 식욕"
 xalw_curse_3_desc:0 "고정된 긍정 특성 1/2/3칸의 긍정 효과를 무력화하고, 다른 긍정 사건 확률은 75/50/25%가 됩니다. 분기별 스트레스 15/25/40이 추가됩니다."
 xalw_curse_3_name:0 "변덕스러운 육체"
 xalw_curse_4_desc:0 "비밀 유지 -10/-20/-30%포인트. 분기마다 20/35/50% 확률로 실제 개인 비밀이 공개됩니다."
 xalw_curse_4_name:0 "입이 무거움"
 xalw_curse_5_desc:0 "긍정적인 지속 효과는 90/80/70%로 적용됩니다. 분기마다 10/20/35% 확률로 원본을 합법적인 새 주인에게 넘길 수 있습니다."
 xalw_curse_5_name:0 "집离家出走"
 xalw_curse_6_desc:0 "실제 배우자의 장착 시 의견 -15/-30/-50. 해마다 배우자나 연인에게 2년간 원망을 남길 수 있음."
 xalw_curse_6_name:0 "질투하는 연인"
 xalw_curse_7_desc:0 "장착한 매월 내구도 2/4/7 감소. 월말에 원본의 내구도가 회복된 것이 관측되면, 해마다 금화 5/10/15 및 스트레스 15/25/40을 요구할 수 있음."
 xalw_curse_7_name:0 "녹의 허기"
 xalw_curse_8_desc:0 "월간 통치력 증가 -0.2/-0.4/-0.7. 분기마다 통치력 10/20/35와民心 15/30/50을 잃을 수 있습니다."
 xalw_curse_8_name:0 "잠 못 드는 나라"
