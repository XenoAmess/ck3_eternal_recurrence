 xalw_feed_interaction:0 "선택한 산성 무기 급여"
 xalw_feed_interaction_desc:0 "장착하지 않았고 산성 장비가 아니며 보호되지 않은 개인 장비를 먹이로 선택합니다. 실제 4단계 희귀도에 따라 경험치가 결정되며 대기 시간은 없습니다. 확인하면 재료가 파괴됩니다."
 xalw_feed_selector_help:0 "이 물건이 선택되었습니다. 자신의 초상화를 우클릭하고 ‘선택한 산성 무기 급여’를 선택한 뒤 재료를 고르세요. 재료가 파괴되기 전에는 취소할 수 있습니다."
 xalw_growth_text:0 "[xalw_artifact.GetName]이(가) 자동으로 [xalw_artifact.MakeScope.Var('xalw_level').GetValue|0] 레벨에 도달했습니다. 새로운 이상 능력 또는 저주가 이미 적용되었습니다."
