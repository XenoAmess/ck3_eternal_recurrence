l_korean:
 zg361_cl_digest_title:0 "This Round of Career Plans Is Recorded"
 zg361_cl_digest_desc:0 "The offices have closed this round of career-mobility and learning matters. Six matters concerning transfer, trial assignment, transfer petitions, counteroffers, former-office contact, or training bonds carry the assessed official's named answer; the other sixteen were resolved under standing rules, with a deadline and receipt retained for each. Protected hours may be borrowed only while the official or manager is at war; a peacetime request is recorded as non-performance. This round closed [ROOT.Var('zg361_cl_portfolio_ah_completed')|0] internal-mobility matters and [ROOT.Var('zg361_cl_portfolio_ai_completed')|0] learning matters; obligations still in progress will be reported when due."
 zg361_cl_digest_ack:0 "Take the docket and proceed."
 zg361_cl_m314_title:0 "A Distant Posting in Writing"
 zg361_cl_m314_desc:0 "The relocation budget totals 20 gold: 15 from the office treasury and 5 from the manager's purse, recorded as 10 for the move, 6 for a temporary allowance, and 4 for the household. The answer given here does not change this review's rating."
 zg361_cl_m314_route_a:0 "Accept the transfer; the office pays 15 gold and the manager pays 5"
 zg361_cl_m314_route_b:0 "Decline the transfer, keep the present post and rating"
 zg361_cl_m315_title:0 "Ninety Days to Test the Post"
 zg361_cl_m315_desc:0 "The proposed trial lasts ninety days. The former office retains 40 percent of the credit and the new office receives 60 percent. You and both offices may end a poor fit, and a return to the former post is not treated as a low rating."
 zg361_cl_m315_route_a:0 "Begin the ninety-day trial under the 40/60 credit split"
 zg361_cl_m315_route_b:0 "Decline the ninety-day trial, remain in the source post, and receive no low rating"
 zg361_cl_m318_title:0 "Two Petitions, Two Chances"
 zg361_cl_m318_desc:0 "This round allows two formal transfer petitions. Filing consumes one chance even if the petition is later withdrawn; an unfiled petition consumes nothing."
 zg361_cl_m318_route_a:0 "File the transfer petition and use one chance"
 zg361_cl_m318_route_b:0 "Do not file and keep this transfer chance"
 zg361_cl_m319_title:0 "One Last Offer"
 zg361_cl_m319_desc:0 "The final written counteroffer has no proof of delivery behind its promise. A transfer can be completed within thirty days; an undelivered counteroffer closes after ninety days as a broken promise charged to the official who made it."
 zg361_cl_m319_route_a:0 "Decline the counteroffer and begin the thirty-day transfer"
 zg361_cl_m319_route_b:0 "Accept the counteroffer; charge an undelivered promise after ninety days"
 zg361_cl_m321_title:0 "Old Colleagues, By Mutual Consent"
 zg361_cl_m321_desc:0 "The former office enclosed a calling card in the departure file and asks to keep one line of contact. Maintaining it requires consent and costs 6 gold: 4 from the office treasury and 2 from the manager's purse. Ending contact removes only the contact entry and preserves the earlier case record."
 zg361_cl_m321_route_a:0 "Accept the card; the office pays 4 gold and the manager pays 2"
 zg361_cl_m321_route_b:0 "Return the card, end contact, and preserve the earlier case record"
 zg361_cl_m333_title:0 "The Bond That Paid for Learning"
 zg361_cl_m333_desc:0 "The training is funded with 18 gold from the office treasury and 6 from the sponsor's purse. The service bond is discharged through continued service; voluntary early departure makes 18 gold due after ninety days, while an involuntary dismissal waives repayment."
 zg361_cl_m333_route_a:0 "Remain in service and discharge the training bond"
 zg361_cl_m333_route_b:0 "Leave early and repay 18 gold after ninety days"
