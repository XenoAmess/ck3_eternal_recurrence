l_korean:
 zg361b1.200.t:0 "Sealed Self-Review"
 zg361b1.200.desc:0 "The evidence window is closing. Your statement will be sealed beside the mid-cycle record. It may explain visibility, but it cannot rewrite the hard facts."
 zg361b1.200.a:0 "State the record as it stands."
 zg361b1.200.b:0 "Present the strongest possible account."
 zg361b1.200.c:0 "Understate my own contribution."
 zg361b1.201.t:0 "Non-Final Shadow Grade"
 zg361b1.201.desc:0 "Your manager has issued a provisional assessment. Frozen gap magnitude: [ROOT.Char.MakeScope.Var('zg361_b1_shadow_gap_magnitude').GetValue|0]; response window: [ROOT.Char.MakeScope.Var('zg361_b1_shadow_deadline_days').GetValue|0] days. It grants no reward and occupies no final quota yet."
 zg361b1.201.grade_375:0 "The provisional assessment is #P 3.75: exceeds expectations#!."
 zg361b1.201.grade_35:0 "The provisional assessment is #V 3.5: meets expectations#!."
 zg361b1.201.grade_325:0 "The provisional assessment is #N 3.25: needs improvement#!."
 zg361b1.201.a:0 "Accept the shadow record."
 zg361b1.201.b:0 "Submit supplementary evidence."
 zg361b1.126.t:0 "Your Rating Has Been Posted"
 zg361b1.126.desc:0 "Your manager has posted your stable row without waiting for unrelated pending cases. This notice freezes revision [ROOT.Char.MakeScope.Var('zg361_b1_local_publish_revision').GetValue|0] of your own review object; it grants no early reward and does not expose another subject's case."
 zg361b1.126.grade_375:0 "Current posted rating: #P 3.75#!."
 zg361b1.126.grade_35:0 "Current posted rating: #V 3.5#!."
 zg361b1.126.grade_325:0 "Current posted rating: #N 3.25#!."
 zg361b1.126.initial:0 "This is the first stable publication for your row."
 zg361b1.126.appended:0 "A pending milestone has resolved, so your row has now been appended independently."
 zg361b1.126.reopened:0 "Fresh evidence reopened your row; this revision supersedes the earlier publication."
 zg361b1.126.a:0 "At least I did not have to wait for the whole department."
