 zg361workforcenormalexitfact.1.t:0 "Departure Formalities Completed"
 zg361workforcenormalexitfact.1.desc:0 "The employee has left normally: the agreed fifty-gold payment was made, the appointment ended, and one occupied staffing place moved into the frozen ledger. The earlier low performance result remains unchanged; any future reappointment will be checked against this departure record."
 zg361workforcenormalexitfact.1.a:0 "Close the departure without rewriting the old result."
