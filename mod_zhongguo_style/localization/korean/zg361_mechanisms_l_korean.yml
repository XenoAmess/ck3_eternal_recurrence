 zg361m.69.t:0 "No.069 · 공식 인도와 항의 시계"
 zg361m.69.desc:0 "[K / P0] 이 정책은 공유 조직 원장을 통해 실행된다. 선택한 규칙은 인도, 증거, 신뢰, 업무량, 리스크, 인재, 재정 압력에 영향을 주므로 이후 팀 성과와 관리자 본인의 평가에도 영향을 미친다."
 zg361m.69.a:0 "동결된 기록을 직접 전달하고 이의 서명 수령을 허용하며, 거부 시 증인을 통해 항목별로 항의와 정산 시계를 시작한다."
 zg361m.69.b:0 "발표 즉시 모두 송달된 것으로 간주하고 바로 정산해 가장 빠르게 집행에 들어가되, 사유를 보지 못한 사람이 이의 신청을 놓쳐 절차가 뒤집히는 위험을 감수한다."
 zg361m.69.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.70.t:0 "No.070 · 이의 신청 후 보복 금지 관찰 기간"
 zg361m.70.desc:0 "[K / P1] 이 정책은 공유 조직 원장에 따라 시행된다. 선택한 규칙은 전달, 증거, 신뢰, 업무량, 위험, 인재 또는 재정 압력을 변화시키므로 이후 팀 성과와 관리자 본인의 평가에도 영향을 준다."
 zg361m.70.a:0 "1년간 인사이동, 해임, 급여 삭감, 새로운 부정적 피드백에 새로운 사실이 있어야 한다는 규정을 적용하고 독립적으로 표본 점검하며, 지속되는 감독 업무를 감수한다."
 zg361m.70.b:0 "이의 신청 직후 통제 회복을 위해 관리자가 즉시 역할과 권한을 재배치하도록 허용해 신속히 움직이나, 번복된 사유가 보복으로 보이게 만든다."
 zg361m.70.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.71.t:0 "No.071 · 내부 포럼 장문과 공개적 에스컬레이션"
 zg361m.71.desc:0 "[K / P2] 이 정책은 공유 조직 장부를 통해 실행됩니다. 선택한 규칙에 따라 전달, 증거, 신뢰, 업무량, 리스크, 인재, 재정 압력이 달라지므로 이후 팀 성과와 관리자 본인 평가에 영향을 줍니다."
 zg361m.71.a:0 "사적 대화와 공식 항소가 모두 소진된 뒤, 증거에 기반한 실명 글이 중재 심의에 들어오도록 허용하고 조정과 사실 확인에 자금을 투입한다."
 zg361m.71.b:0 "당사자가 즉시 실명 또는 익명 폭로를 게시해 지지를 끌어모으게 두어, 고위층의 빠른 관심을 얻는 대신 양측 평판과 내부 신뢰를 모두 소진시킨다."
 zg361m.71.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.72.t:0 "No.072 · 평가 등급의 조기 유출"
