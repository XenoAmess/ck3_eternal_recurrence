 zg361m.75.t:0 "No.075 · 깨끗한 이력의 자발적 퇴직 패키지"
 zg361m.75.desc:0 "[K / P2] 이 정책은 공유 조직 원장을 통해 시행됩니다. 선택한 규칙은 전달, 증거, 신뢰, 업무량, 위험, 인재 또는 재정 압박을 변화시키며, 이후 팀 성과와 관리자 본인 평가에 영향을 줍니다."
