 zg361m.35.a:0 "절대 기준과 상대 평가를 혼합해 분포를 유지하되, 진정으로 기준을 통과한 사람에게는 최하위 제재를 완화하고 이중 검증 비용을 감당한다."
 zg361m.35.b:0 "3-6-1을 엄격히 집행하고 최하위 자리를 빠짐없이 채워, 규칙을 명확하고 빠르게 만들지만 전원이 잘해도 희생양을 만든다."
