 zg361m.72.a:0 "캘리브레이션 접근을 제한하고 열람을 기록하며 공통 전달 시각을 사용해 모두가 동등하게 항소를 준비하도록 하되, 기밀 관리 비용을 감수한다."
 zg361m.72.b:0 "측근에게 사적으로 주의를 주거나 등급을 흘려 팀의 반응을 시험하여 상황을 일찍 통제하되, 조기 퇴사, 공조된 진술, 패널 불신을 촉발한다."
