 zg361m.43.desc:0 "[G / P1] 이 정책은 공유 조직 장부를 통해 실행됩니다. 선택한 규칙은 전달, 증거, 신뢰, 업무량, 리스크, 인재, 재정 압력에 변화를 주므로 이후 팀 성과와 관리자 본인 평가에도 영향을 미칩니다."
 zg361m.43.a:0 "사전에 소수의 발언 좌석을 배정하고, 경계선 후보에게는 서면 증거를 요구하며, 관리자가 사용하는 주의력과 정치 자본을 기록한다."
 zg361m.43.b:0 "관리자가 마음에 드는 사람을 위해 시간을 넘겨가며 평가가 바뀔 때까지 논쟁하도록 둔다. 한 명을 빠르게 구할 수는 있지만, 조용한 기여자를 밀어내고 상사의 인내심을 소진시킬 수 있다."
