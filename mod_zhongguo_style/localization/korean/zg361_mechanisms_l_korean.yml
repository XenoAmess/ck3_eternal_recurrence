 zg361m.40.t:0 "No.040 · 떠나는 사람에게 C 떠넘기기"
 zg361m.40.desc:0 "[G / P1] 이 정책은 공유 조직 원장에 따라 실행됩니다. 선택한 규칙에 따라 전달, 증거, 신뢰, 업무량, 리스크, 인재, 재정 압력이 바뀌고, 따라서 이후 팀 성과와 관리자 본인 심사에도 영향을 줍니다."
 zg361m.40.a:0 "퇴임자 실적을 동결된 실제 성과로 평가하고 조직 정리, 퇴직, 후속 채용은 별도 계정으로 처리하여 진짜 공석과 할당량 압박을 감수한다."
 zg361m.40.b:0 "이미 떠나려는 사람에게 최하위 자리를 떠넘겨 현 팀이 즉시 통과하도록 하나, 분포 조작과 채용 왜곡, 인재 판단 왜곡을 남긴다."
 zg361m.40.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.41.t:0 "No.041 · 신입 보호·포함·희생 중 선택"
 zg361m.41.desc:0 "[G / P1] 이 정책은 공유 조직 원장에 따라 실행됩니다. 선택한 규칙에 따라 전달, 증거, 신뢰, 업무량, 리스크, 인재, 재정 압력이 바뀌고, 따라서 이후 팀 성과와 관리자 본인 심사에도 영향을 줍니다."
 zg361m.41.a:0 "신규 인원을 첫 사이클 할당량에서 보호하고, 램프 목표와 멘토, 고정 합류일을 설정하여 양성 비용과 기존 직원 부담을 감수한다."
 zg361m.41.b:0 "신규 인원을 즉시 전체 평가에 포함시키고 1차 하위 슬롯 후보로 지정해 C 등급을 빠르게 채우되, 멘토와 채용 평판, 잔존율을 손상시킨다."
 zg361m.41.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.42.t:0 "No.042 · 사이클을 넘겨 C 등급 돌리기"
 zg361m.42.desc:0 "[G / P2] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review. This item has no connected business case yet: it configures policy and changes only the organizational ledger; it does not directly execute the example personnel, payment, or resource action."
