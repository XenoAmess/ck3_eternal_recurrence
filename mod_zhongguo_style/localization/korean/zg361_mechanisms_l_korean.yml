 zg361m.76.a:0 "판결 뒤에는 증거 누락, 감독 실패, 설계 오류, 허위 주장을 각자의 다음 관리 점수에 분담해 기록하고, 공동 복기를 수용한다."
 zg361m.76.b:0 "직속 매니저 또는 정무위원이 전체 절차 실패를 홀로 지게 하여 빠르게 사건을 종결하고, 책임 소재는 분명히 하되 시스템 결함을 은폐하며 떠넘기기를 조장한다."
 zg361m.76.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.77.t:0 "No.077 · 독립 심사자 순환제"
 zg361m.77.desc:0 "[K / P1] 이 정책은 공유 조직 원장에 의해 운영된다. 선택한 규칙은 전달 방식, 증거, 신뢰, 업무량, 위험, 인재, 재정적 압력에 변화를 주므로 이후 팀 성과와 매니저 본인 평가에 영향을 미친다."
 zg361m.77.a:0 "무관한 동급 매니저들 사이에서 심사위원을 순환 배치하고, 양측에 각각 한 번의 사유 있는 기피를 허용하며, 심사 품질을 기록한다. 인력 비용이 발생한다."
 zg361m.77.b:0 "원래 패널이 제한된 새 증거만으로 빠르게 자체 수정하도록 한다. 관리 시간을 절약하지만, 같은 사람들이 자기 판단을 변호하게 된다."
 zg361m.77.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.78.t:0 "No.078 · 배분 공정성 대시보드"
 zg361m.78.desc:0 "[K / P2] 이 정책은 공유 조직 원장을 통해 실행된다. 선택한 규칙은 전달, 증거, 신뢰, 업무량, 리스크, 인력, 재정 압력에 영향을 주므로 이후 팀 성과와 매니저 본인 심사에도 작용한다."
 zg361m.78.a:0 "신규자, 전환자, 친족/비친족, 파벌, 직무, 근속연수별로 수년간의 차이를 보여주고 기회 데이터와 연동하여, 이상치만 사람 검토로 보낸다."
 zg361m.78.b:0 "특정 하위 집단의 비율이 이상으로 보일 때마다 평가 등급을 강제 조정하거나 매니저를 징계한다. 가장 빠르지만, 작은 표본과 실제 업무상 차이를 차별로 오인한다."
 zg361m.78.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.79.t:0 "No.079 · 차상급 면담 시간"
 zg361m.79.desc:0 "[K / P2] 이 정책은 공유 조직 장부를 통해 실행됩니다. 선택한 규칙은 전달, 증거, 신뢰, 업무량, 위험, 인재, 재정 압력에 영향을 주며, 이후 팀 결과와 관리자 본인 평가에도 작용합니다."
 zg361m.79.a:0 "매 주기마다 예약 좌석 몇 개를 열어 장애, 성과, 이의 제기를 접수하고 조사 과제를 생성하되, 고위층의 시간을 소모하면서 현장 등급은 바꾸지 않는다."
 zg361m.79.b:0 "고위층이 접견 중 직접 자원 제공이나 손급 관료의 등급 변경을 약속하도록 허용하여 신속히 여론에 응하되, 직속 관리자를 우회시켜 차상급 정치질을 부추긴다."
 zg361m.79.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.80.t:0 "No.080 · 공개 지표 결함 티켓"
 zg361m.80.desc:0 "[K / P1] 이 정책은 공유 조직 장부를 통해 실행됩니다. 선택한 규칙은 전달, 증거, 신뢰, 업무량, 위험, 인재, 재정 압력에 영향을 주며, 이후 팀 결과와 관리자 본인 평가에도 작용합니다."
 zg361m.80.a:0 "조작 가능하거나 충돌하거나 왜곡된 지표 결함을 공개 등록하고, 책임자가 수정하거나 서면으로 위험을 수용하도록 요구하며, 제보자의 제도적 기여도를 기록한다."
 zg361m.80.b:0 "책임자에게 결함 티켓을 즉시 닫고 평가 기간까지 현 지표를 유지하도록 명령하여, 단기적 비교 가능성은 확보하되 추후 폭발 시 책임을 설계자에게 확산시킨다."
 zg361m.80.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.81.t:0 "No.081 · 성과 정보 계층 압축"
