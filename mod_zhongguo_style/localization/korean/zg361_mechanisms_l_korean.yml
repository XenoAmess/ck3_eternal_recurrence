 zg361m.37.a:0 "두 팀이 기여도·난이도·과거 미이수를 근거로 하나의 등급 자리를 교환하도록 허용하고, 정치적 신용·자원·다음 사이클 상환 의무를 기록한다."
 zg361m.37.b:0 "협상을 금지하고 각 팀이 자체 쿼터를 채우도록 강제해 빠르게 마감하므로, 소규모 팀의 우연성과 실제 품질 차이는 보정되지 않는다."
