 zg361m.33.a:0 "데이터형, 보호형 등 관리자 성향에 안정적인 가중치와 사유 코드를 부여하고 엄격한 증거 상한으로 묶으며, 설명 유지 비용을 감수한다"
 zg361m.33.b:0 "성격과 관계가 경계 증거를 빠르게 처리하기 위해 우선하도록 허용하여, 강렬한 인물을 만들지만 유사한 사례를 재현하기 어렵게 만듭니다."
