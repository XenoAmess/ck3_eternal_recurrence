 zg361m.32.t:0 "No.032 · 관리자 자신의 팀 성과"
 zg361m.32.desc:0 "[F / P0] 이 정책은 공유 조직 장부를 통해 시행됩니다. 선택된 규칙은 전달, 증거, 신뢰, 업무량, 위험, 인재, 재정 압력에 영향을 주며, 이후 팀 결과와 관리자 본인 평가에 영향을 미칩니다."
 zg361m.32.a:0 "이전 주기의 동결 목표, 정기 성과 심사, 결정 번복, PIP, 인재 유지 및 HC를 기준으로 관리자를 평가하되, 주기 간 회계 비용을 감수합니다."
 zg361m.32.b:0 "현재 팀 순위만 보고, 거부·저평점·이탈을 즉시 강하게 처벌하며, 손자급 사례를 재귀적으로 관리자 탓으로 돌린다."
 zg361m.32.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.33.t:0 "No.033 · 관리자 유형과 설명 가능한 사유 코드"
