 zg361m.47.a:0 "주기 시작 시 1년 전체 또는 주요 마일스톤 근거 창을 고정하고 초기 성과를 반박용으로 보존하며 완전한 근거 보관 비용을 떠안음"
 zg361m.47.b:0 "최종 평가에서 최근의 성패에 크게 무게를 둬 새 국면에 빠르게 응답하지만, 연말 스프린트, 숨긴 리스크, 초기 성과를 지우는 행위를 조장"
