 zg361m.81.a:0 "원본 증거, 요약, 중앙 검토에 대한 역할 기반 접근 권한을 부여하고 누가 무엇을 봤는지 기록하여, 권한과 개인정보 관리 비용을 감수한다."
 zg361m.81.b:0 "의사결정을 빠르게 하기 위해 각 계층이 하나의 순위 요약만 보고하도록 강제하여, 정보 흐름은 가장 짧아지지만 실적 가로채기, 왜곡, 시정 불가한 블랙박스가 커진다."
 zg361m.81.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
