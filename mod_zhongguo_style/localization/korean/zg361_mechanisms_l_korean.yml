 zg361m.34.a:0 "다주기 동결 성과, 성장률, 역할 적합도로 나인박스를 보정한 뒤 사분면별로 개발 또는 이동 예산을 배정합니다."
 zg361m.34.b:0 "이번 분기 평가와 인재 데이터를 근거로 고성과 잠재력자 또는 퇴출 대상을 신속히 라벨링하여 자원을 집중하되, 한 번의 결과가 커리어를 결정하도록 둡니다."
 zg361m.34.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
