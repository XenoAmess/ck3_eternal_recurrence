 zg361m.53.desc:0 "[H / P2] 이 정책은 공유 조직 장부를 통해 실행됩니다. 선택한 규칙은 전달, 증거, 신뢰, 업무량, 위험, 인재, 재정 압력에 변동을 주며, 이후 팀 결과와 관리자 본인 평가에 영향을 미칩니다."
