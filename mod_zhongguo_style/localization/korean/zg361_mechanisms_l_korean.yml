 zg361m.36.a:0 "매년 평가, 정정, PIP, 승진, HC, 보너스, 이탈률, 실질 거버넌스를 각각 동결하고 10년 추세를 집계하여 장기 보고 비용을 감수한다."
 zg361m.36.b:0 "현재 표와 일부 두드러진 지표만 공개하여 곧바로 성공 서사를 만들되, 이탈과 거버넌스 침체를 깔끔한 분포 뒤로 숨긴다."
