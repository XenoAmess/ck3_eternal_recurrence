l_korean:
 zg361_next_mechanism_decision:0 "다음 성과 정책 검토"
 zg361_next_mechanism_decision_desc:0 "Open the next unresolved policy. Every choice enters the organizational ledger immediately; only items with a connected business case also execute character, payment, appointment, or transfer actions."
 zg361_next_mechanism_decision_tooltip:0 "다음 361 정책 카드를 엽니다."
 zg361_next_mechanism_decision_confirm:0 "다음 정책 담당자 호출"
 zg361_reference_charter_decision:0 "표준 361 헌장 배포"
 zg361_reference_charter_decision_desc:0 "Adopt all 361 recommended defaults and write their organizational indicators and policy debt immediately. This configures policy in bulk; items without a business case do not invent payments, appointments, hires, transfers, or refunds."
 zg361_reference_charter_decision_tooltip:0 "Configure all 361 ledger choices; concrete actions still require a connected business case."
 zg361_reference_charter_decision_confirm:0 "전체 포트폴리오 출시"
 zg361_mechanism_choice_a_tt:0 "지속 가능한 길: 행정·재정·단기 납품 역량을 소모하면서 증거·신뢰·역량을 강화합니다."
 zg361_mechanism_choice_b_tt:0 "질주 길: 단기 성과는 좋아지지만, 위험·번아웃·기술 부채·소청 부채는 다음 검토로 떠넘깁니다."
 zg361_mechanism_choice_c_tt:0 "Shelve for this campaign: this item will not be proposed again automatically; policy debt is recorded immediately and feeds your superior's review."
 zg361_scoreboard_tab_system:0 "정책 콕핏"
 zg361_ledger_title:0 "361 정책 장부: 대시보드 뒤편에 숨은 진실"
 zg361_ledger_configured:0 "확정된 메커니즘"
 zg361_ledger_checksum:0 "포트폴리오 체크섬"
 zg361_ledger_explainer:0 "양수가 항상 좋은 건 아닙니다. 행정 부담, 소청 위험, 기술 부채, 번아웃, HC 압력, 보수 부채, 정책 부채, 예산 압력은 수치가 높아질수록 위험해집니다."
 zg361_ledger_evidence:0 "증거 품질"
 zg361_ledger_trust:0 "조직 신뢰"
 zg361_ledger_admin_load:0 "성과 행정 부담"
 zg361_ledger_appeal_risk:0 "소청 및 절차 위험"
 zg361_ledger_delivery:0 "실제 납품 가치"
 zg361_ledger_stability:0 "안정성"
 zg361_ledger_tech_debt:0 "기술 부채"
 zg361_ledger_data_quality:0 "데이터 신뢰도"
 zg361_ledger_burnout:0 "조직 번아웃"
 zg361_ledger_talent:0 "인재 건강도"
 zg361_ledger_hc_pressure:0 "HC 압력"
 zg361_ledger_pay_debt:0 "보수 부채"
 zg361_ledger_policy_debt:0 "정책 부채"
 zg361_ledger_budget_pressure:0 "예산 압력"
 zg361_ledger_hint:0 "이 장부들은 팀의 다음 KPI와 상사의 관리자 평가에 반영됩니다."
 zg361_org_high_trust:0 "조직 신뢰: 경영진이 말을 지킨다"
 zg361_org_high_trust_desc:0 "증거, 피드백, 실행이 서로를 강화하는 선순환."
 zg361_org_admin_overload:0 "성과 행정 과부하"
 zg361_org_admin_overload_desc:0 "모두가 다들 바쁜 이유를 설명하느라 바쁩니다."
 zg361_org_burnout_crisis:0 "조직 번아웃 위기"
 zg361_org_burnout_crisis_desc:0 "온라인 시간은 훌륭하지만 사람의 배터리는 그렇지 않습니다."
 zg361_org_delivery_stable:0 "안정적 납품 문화"
 zg361_org_delivery_stable_desc:0 "매번 출시할 때마다 반성문을 먼저 쓰지 않아도 됩니다."
 zg361_org_tech_debt_crisis:0 "기술 부채 눈덩이"
 zg361_org_tech_debt_crisis_desc:0 "어제의 지름길이 오늘의 요금소가 되었습니다."
 zg361_org_talent_healthy:0 "인재 파이프라인 건강"
 zg361_org_talent_healthy_desc:0 "스타 플레이어든, 후계자든, 꾸준히 성과 내는 구성원든 모두 앞으로의 길을 볼 수 있다."
 zg361m.1.t:0 "No.001 · 항목별 KPI 증거표"
 zg361m.1.desc:0 "[A / P0] 이 정책은 공유 조직 장부를 통해 실행됩니다. 선택한 규칙은 성과, 증거, 신뢰, 업무 부담, 리스크, 인재, 재정 압력에 영향을 주며, 이후 팀 성과와 관리자 본인의 평가에도 영향을 미칩니다."
 zg361m.1.a:0 "항목별 증거표를 작성하고, 산출·효율·성장·협업·가치 영역의 사례를 동결한 뒤, 기재 및 검토 업무 비용을 부담한다."
 zg361m.1.b:0 "총점과 상사의 인상을 근거로 즉시 등급을 정하고 빠르게 게시하되, 누락과 오류를 추적하기 어렵게 둔다."
 zg361m.1.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.2.t:0 "No.002 · 연간 OKR 방향과 KPI 합의서"
 zg361m.2.desc:0 "[A / P0] 이 정책은 공유 조직 장부를 통해 실행됩니다. 선택한 규칙은 성과, 증거, 신뢰, 업무 부담, 리스크, 인재, 재정 압력에 영향을 주며, 이후 팀 성과와 관리자 본인의 평가에도 영향을 미칩니다."
 zg361m.2.a:0 "직무별로 방향, 기준선, 정상 목표를 동결하고, 위기 시 증거를 바탕으로 한 번만 재설정하도록 허용하되 지속적 추적 비용을 부담한다."
 zg361m.2.b:0 "모든 부서에 공격적 목표를 일괄 부과하고 기존 기준선을 유지하여 책임 추궁하며, 단기 스프린트로 성장을 얻지만 지표 조작과 은폐된 리스크를 유발한다."
 zg361m.2.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.3.t:0 "No.003 · 중간 점검과 목표 재설정"
 zg361m.3.desc:0 "[A / P1] 이 정책은 공유 조직 원장을 통해 실행됩니다. 선택한 규칙은 전달, 증거, 신뢰, 업무량, 위험, 인재, 재정 압력에 영향을 주므로 이후 팀 성과와 관리자 본인의 평가에도 작용합니다."
 zg361m.3.a:0 "중간 코칭 점검을 실시하고 위험과 자원을 기록하며, 한 차례 문서화된 위기 재설정을 허용하고 설명 가능한 최종 평가를 위해 관리 시간을 투입한다"
 zg361m.3.b:0 "초기 목표를 유지하고 기한 내 따라잡기를 요구해 재설정 업무는 피하되, 전략 변경을 개인 책임으로 돌리고 늦은 악화 보고를 유도할 위험이 있다"
 zg361m.3.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.4.t:0 "No.004 · 자기 평가와 인식 차이"
 zg361m.4.desc:0 "[A / P1] 이 정책은 공유 조직 장부를 통해 집행됩니다. 선택한 규칙은 전달, 증거, 신뢰, 업무량, 위험, 인재, 재정 압력에 영향을 주므로 이후 팀 성과와 관리자 본인의 평가에 영향을 미칩니다."
 zg361m.4.a:0 "대표적 성과로 뒷받침된 자기 평가를 요구하고, 상사가 각 인식 차이에 응답하게 하여, 검토 가능한 기록을 남기는 대화 비용을 감수한다."
 zg361m.4.b:0 "한 페이지 자기 소개서를 받아 과장이나 겸손을 빠르게 주관적으로 보정하여 시간을 아끼지만, 표현 능력을 실제 성과와 혼동하게 된다."
 zg361m.4.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.5.t:0 "No.005 · 직무별 성과표"
 zg361m.5.desc:0 "[A / P1] 이 정책은 공유 조직 장부를 통해 실행됩니다. 선택한 규칙에 따라 납품, 증거, 신뢰, 업무량, 위험, 인재, 재정 압력이 달라지며, 이후 팀 성과와 관리자 본인 평가에도 영향을 줍니다."
 zg361m.5.a:0 "거버넌스, 군사, 재정, 경영 직무의 평가 가중치를 미리 고정해 둔 뒤, 같은 직접 평가 집단을 보정하여 다중 평가표 유지 비용을 감수한다."
 zg361m.5.b:0 "모든 직무를 하나의 결과표로 강제 순위 매겨 빠르게 집행하되, 측정하기 어려운 업무는 체계적으로 불리해지고 직무 부적합은 더 부각된다."
 zg361m.5.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.6.t:0 "No.006 · 출발선과 난이도 보정"
 zg361m.6.desc:0 "[A / P2] 이 정책은 공유 조직 장부를 통해 실행됩니다. 선택한 규칙에 따라 납품, 증거, 신뢰, 업무량, 위험, 인재, 재정 압력이 달라지며, 이후 팀 성과와 관리자 본인 평가에도 영향을 줍니다."
 zg361m.6.a:0 "인수한 기준선, 자원 여건, 직무 난이도를 고정하고 상한이 있는 소폭 보정만 허용하며, 감사 업무를 투입해 비교의 공정성을 높인다."
 zg361m.6.b:0 "연말 절대 실적만으로 평가하고 풍요로운 단위에 더 높은 목표를 부과해, 표는 빠르게 나오지만 묵은 살을 먹고 정리하는 일은 벌을 받게 된다."
 zg361m.6.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.7.t:0 "No.007 · 연속 360도 평가 초대장"
 zg361m.7.desc:0 "[B / P0] 이 정책은 공유 조직 원장에 따라 시행됩니다. 선택한 규칙은 전달, 근거, 신뢰, 업무량, 위험, 인재, 재정 압력에 영향을 주므로 이후 팀 성과와 관리자 본인 평가에도 영향을 미칩니다."
 zg361m.7.a:0 "소수의 진짜 협업자만 초대하고 구체적인 사례를 요구해 교차 검증하며, 초대와 중복 제거의 행정 비용을 부담한다."
 zg361m.7.b:0 "광범위하게 평가를 요청하고 즉시 고득표·저득표를 가중치로 반영해 신호를 빠르게 확대하되, 상호 칭찬·보복·형식적 피드백을 불러들인다."
 zg361m.7.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.8.t:0 "No.008 · 평가자 관대도와 동료 신뢰도"
 zg361m.8.desc:0 "[B / P1] 이 정책은 공유 조직 장부를 통해 시행됩니다. 선택한 규칙은 전달, 증거, 신뢰, 업무량, 위험, 인재 또는 재정 압박을 변화시키며, 따라서 이후 팀 성과와 관리자 본인의 평가에도 영향을 미칩니다."
 zg361m.8.a:0 "각 평가자의 과거 평균, 분산, 번복률과 적중률을 유지하고 그에 따라 가중치를 보정하여 장기적 데이터 거버넌스 비용을 감수한다."
 zg361m.8.b:0 "이번 라운드는 원시 동료 평가를 그대로 수용하고, 항소 이후에만 왜곡자를 제재한다. 빠르게 정산되지만 먼저 관대한 평가자와 엄격한 평가자가 순위를 좌우한다."
 zg361m.8.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.9.t:0 "No.009 · 보정 회의 대시보드"
 zg361m.9.desc:0 "[B / P0] 이 정책은 공유 조직 원장을 통해 집행됩니다. 선택된 규칙은 전달, 증거, 신뢰, 업무량, 리스크, 인재, 재정 압력을 변화시키며 따라서 이후 팀 성과와 매니저 본인의 평가에도 영향을 미칩니다."
 zg361m.9.a:0 "KPI, 가치관, 목표, 360도 피드백, 추세, 항소 증거를 함께 표시하고, 모든 등급 변동은 쿼터 중립적 교환으로 기록한다."
 zg361m.9.b:0 "현재 총점과 남은 할당량만으로 한 차례 회의에서 안건 종결, 빠르게 마감하되 경계 사례와 보이지 않는 공헌은 짓눌릴 수 있음."
 zg361m.9.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.10.t:0 "No.010 · C등 부여와 부하 보호"
 zg361m.10.desc:0 "[B / P0] 이 정책은 공유 조직 장부를 통해 시행됩니다. 선정된 규칙은 전달, 증거, 신뢰, 업무량, 위험, 인재, 재정 압력에 변화를 주며, 이후 팀 성과와 관리자 본인의 평가에도 영향을 미칩니다."
 zg361m.10.a:0 "동결된 증거에 따라 최하위 등급을 선정함. 관리자가 누군가를 보호한다면, 위신과 다음 사이클의 관리 KPI를 공개적으로 차감하여 팀의 신뢰는 유지하되 제도적 비용을 부담하게 함."
 zg361m.10.b:0 "신규 입사자나 비핵심 구성원에게 C를 직접 할당하여 할당량을 충족하고, 지금 바로 배분을 마무리하는 대신 호감도·반감·이직 위험을 쌓아 둔다."
 zg361m.10.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.11.t:0 "No.011 · 격층 보정 및 HR 스튜어드 좌석"
 zg361m.11.desc:0 "[B / P1] 이 정책은 공유 조직 원장에 따라 실행됩니다. 선택한 규칙에 따라 전달 방식, 근거, 신뢰, 업무량, 리스크, 인재, 재정 압력이 달라지며, 이후 팀 성과와 관리자 본인 평가에 영향을 줍니다."
 zg361m.11.a:0 "스킵레벨 상급자에게 분포, 극단 근거, 절차만 검토하게 하고, 미흡한 건은 추가 회의 비용을 들여 직속 매니저로 돌려보낸다."
 zg361m.11.b:0 "스킵레벨이 재작성을 생략하고 손자급 평가 등급을 즉시 수정해 직속 평가 권한을 훼손하고, 단기간에 넘어서는 청탁의 여지를 만든다."
 zg361m.11.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.12.t:0 "No.012 · 이해관계 공개와 회피"
 zg361m.12.desc:0 "[B / P1] 이 정책은 공유 조직 원장에 따라 실행됩니다. 선택한 규칙에 따라 전달 방식, 근거, 신뢰, 업무량, 리스크, 인재, 재정 압력이 달라지며, 이후 팀 성과와 관리자 본인 평가에 영향을 줍니다."
 zg361m.12.a:0 "캘리브레이션 전에 친족, 금전, 원한, 후원 관계를 공개하고, 회피자는 독립 심의석으로 교체해 인력 보강과 지연 비용을 감당한다."
 zg361m.12.b:0 "매니저가 공개적으로 고수하거나 사적으로 움직여 누군가를 빠르게 보호하거나 견제하도록 허용해 결과를 통제하지만, 번복과 본인 감점 위험이 크게 커진다."
 zg361m.12.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.13.t:0 "No.013 · 투명 / 단계별 / 블랙박스 공개"
 zg361m.13.desc:0 "[B / P2] 이 정책은 공유 조직 원장에 따라 실행됩니다. 선택한 규칙에 따라 전달 방식, 근거, 신뢰, 업무량, 리스크, 인재, 재정 압력이 달라지며, 이후 팀 성과와 관리자 본인 평가에 영향을 줍니다."
 zg361m.13.a:0 "각 대상자에게 동결 사유와 이의 제기 경로를 안내하고, 등급과 집계 기준을 팀 전체에 공개하며, 민감한 동료 평가에 대한 접근 권한을 분리·관리한다."
 zg361m.13.b:0 "각자에게 최종 등급만 구두로 알리고 사유를 비공개로 봉인하여, 공개적 갈등은 빠르게 누르지만 의심·상향 관리·이의 제기를 키운다."
 zg361m.13.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.14.t:0 "No.014 · 성과 이의제기 서류철"
 zg361m.14.desc:0 "[C / P0] 관료가 직접 상사와 사건을 논의한 뒤 증거를 동결하여 이의 제기한다. 받아들여지면 상사가 결과를 재보정하여 3.25에 따른 지방 국고·개인 금화·공덕의 세 가지 즉각 징수를 항목별로 환급하고, 아직 끝나지 않은 1년 봉록 25% 삭감을 즉시 중단하며 순위를 바로잡는다. 기각되거나 악의적인 이의 제기일 경우 위신과 신뢰도가 하락한다."
 zg361m.14.a:0 "오류 유형별로 동결 증거를 수집하고, 독립 심의 전에 논의를 요구하며, 재보정과 세 건의 즉시 환급 및 녹봉 감액 중단 항목을 각각 대조·기록한다."
 zg361m.14.b:0 "기존 상사가 현장에서 즉시 평가 등급을 거부하거나 수정하도록 허용하여 분쟁을 빨리 끝내지만, 중복 제재, 잘못된 환불, 그리고 확정된 이해 상충의 위험을 감수한다."
 zg361m.14.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.15.t:0 "No.015 · PIP 개선 헌장"
 zg361m.15.desc:0 "[C / P0] 이 정책은 공유 조직 원장에 따라 집행됩니다. 선정된 규칙은 전달, 증거, 신뢰, 업무량, 위험, 인재 또는 재정 압력을 변경하여 이후 팀 성과와 관리자 본인 평가에 영향을 미니다."
 zg361m.15.a:0 "주체의 권한 범위 안에서 검증 가능한 이정표, 지원, 점검 회의를 협의하고, 실현 가능한 개선 기회에 자원을 투입한다."
 zg361m.15.b:0 "강압적인 이정표와 엄격한 기한을 부과하고 거부를 중대한 부정 증거로 기록하여, 결정처럼 보이는 탈출로를 빠르게 마련한다."
 zg361m.15.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.16.t:0 "No.016 · PIP 지원 예산"
 zg361m.16.desc:0 "[C / P1] 이 정책은 공유 조직 원장에 따라 실행됩니다. 선택한 규칙은 전달 방식, 증거, 신뢰, 업무량, 리스크, 인재, 재정 압력에 영향을 주므로 이후 팀 성과와 관리자 본인 평가에도 작용합니다."
 zg361m.16.a:0 "PIP 대상에게 멘토, 임시 거버넌스 자원, 정기적 관심을 지원하고 모든 투입을 기록하며, 실제 개선을 검증하기 위해 예산을 편성한다."
 zg361m.16.b:0 "자원 없이 목표만 설정하고 기한을 강제해 당기 예산은 절약하되, 실패가 항소 자료와 관리자 점수에 불이익으로 작용하도록 만든다."
 zg361m.16.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.17.t:0 "No.017 · 저성과자 처리 사다리"
 zg361m.17.desc:0 "[C / P0] 이 정책은 공유 조직 장부를 통해 실행됩니다. 선택한 규칙에 따라 납품, 근거, 신뢰, 업무량, 위험, 인재, 재정 압력이 달라지므로 이후 팀 성과와 관리자 본인 평가에 영향을 미칩니다."
 zg361m.17.a:0 "첫 저성적 평가는 대화, PIP, 합법적 전배로 처리하고, 반복 실패 시에만 권한을 축소하거나 HC를 해제하며, 개발 비용과 결원 계획 비용을 부담한다."
 zg361m.17.b:0 "하위 성과자의 승진을 즉시 동결하거나 강등·해임하여 인재 밀도를 높이고 빠르게 자리 확보, 그러나 두려움, 공석, 집중 항의 발생."
 zg361m.17.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
