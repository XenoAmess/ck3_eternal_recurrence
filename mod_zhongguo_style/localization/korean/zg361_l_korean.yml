 zg361_refused_jingcha:0 "거부한 경차"
 zg361.40.t:0 "경차 기한 도래"
 zg361.40.desc:0 "명부, 회계 및 공적 기록이 갖춰졌습니다. 규정에 따라, 저는 직속 재직 관리들을 거처로 소집하여 경차를 거행해야 하며, 국고와 사금은 모두 청구할 수 없습니다.\n\n이 의무를 어기면 직속 상관은 이를 중대한 통치 실패로 기록합니다. 상관이 없다면, 제도 자체의 위신을 잃게 됩니다."
 zg361.40.a:0 "규정대로 경차를 개최한다"
 zg361.40.a.tt:0 "무료 활동 계획기를 열어라. 경차는 300일 이내에 결론지어야 한다. 단순히 계획기를 열고 닫는 것만으로는 의무를 이행한 것으로 보지 않는다."
 zg361.40.b:0 "올해는 개최하지 않겠다"
 zg361.40.b.tt:0 "직속 상관이 있는 경우: 상관의 당신에 대한 견해가 하락하며, 다음 평가에서 1회용 KPI 50 감점을 받는다.\n독립 최고 군주인 경우: 위신 200을 잃고, 허위 자기 평가는 없다."
 zg361.41.t:0 "경차 기한 초과"
 zg361.41.desc:0 "경차의 마감 기한이 결론 없이 지났습니다."
 zg361.41.a:0 "이행 기록을 정산한다"
