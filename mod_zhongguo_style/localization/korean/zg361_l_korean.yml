l_korean:
 # Game rules
 rule_zg361_enabled:0 "봉신 성과 심사 (361제)"
 setting_zg361_on:0 "활성화"
 setting_zg361_on_desc:0 "공작 등급 이상의 천하 통치자는 매 기수 직접 관리를 평가해 3.75/3.5/3.25로 361 강제 분포 배분하며, 백작과 남작은 평가를 받기만 하고 평가하지는 않는다."
 setting_zg361_off:0 "비활성화"
 setting_zg361_off_desc:0 "성과 평가 시스템을 비활성화합니다."
 rule_zg361_frequency:0 "평가 주기"
 setting_zg361_freq_yearly:0 "연간 평가"
 setting_zg361_freq_yearly_desc:0 "일 년에 한 번 성과 시즌."
 setting_zg361_freq_three_year:0 "삼년 일고"
 setting_zg361_freq_three_year_desc:0 "삼년에 한 번, 옛 방식 그대로 진행되는 대평가."
 rule_zg361_bottom_ratio:0 "하위 비율"
 setting_zg361_ratio_strict:0 "엄격 361 (10%)"
 setting_zg361_ratio_strict_desc:0 "361 분포를 강제한다. 모두 기대치에 부합하더라도 규모가 충분하면 누군가는 3.25를 받아야 한다."
 setting_zg361_ratio_relaxed:0 "완화 (5%)"
 setting_zg361_ratio_relaxed_desc:0 "361 등급은 유지하되, 강제 하위 10% 쿼터는 풀어준다."
 setting_zg361_ratio_off:0 "방임 (0%)"
 setting_zg361_ratio_off_desc:0 "하위 등급 강제를 없앤다. 평가는 형식에 그친다."
 # Decision group & decisions
 decision_group_type_zg361:0 "성과 평가"
 zg361_review_now_decision:0 "지금 즉시 성과 평가 실시"
 zg361_review_now_decision_desc:0 "연례 시즌을 기다리지 말고 평가국에 명해 직속 인원을 즉시 등급 매기게 한다. 올해 이미 평가된 관료는 다시 평가되지 않는다."
 zg361_review_now_decision_tooltip:0 "즉시 최소 한 명의 현직 직속 관료를 평가한다. 같은 해에는 다시 실시할 수 없다."
 zg361_review_now_decision_confirm:0 "순위 발표!"
 zg361_ratio_strict_decision:0 "최하위 비율: 엄격 361 (10%)"
 zg361_ratio_strict_decision_desc:0 "분포를 강제합니다: 평가 인원이 5명 이상이면 누군가는 3.25를 받아야 합니다."
 zg361_ratio_strict_decision_tooltip:0 "이 평가 단위의 강제 최하위 비율을 10%로 설정합니다."
 zg361_ratio_strict_decision_confirm:0 "엄격하게 갑시다."
 zg361_ratio_relaxed_decision:0 "최하위 비율: 완화 (5%)"
 zg361_ratio_relaxed_decision_desc:0 "361 등급은 유지하되, 강제 10% 최하위 할당은 완화합니다."
 zg361_ratio_relaxed_decision_tooltip:0 "이 평가 단위의 강제 최하위 비율을 5%로 설정합니다."
 zg361_ratio_relaxed_decision_confirm:0 "완화하자."
 zg361_ratio_off_decision:0 "최하위 비율: 자율 (0%)"
 zg361_ratio_off_decision_desc:0 "강제 최하위 등급 없음. 평가는 형식에 불과해집니다."
 zg361_ratio_off_decision_tooltip:0 "이 평가 단위에서 강제 최하위 할당을 제거합니다."
 zg361_ratio_off_decision_confirm:0 "자율로 둡시다."
 # Character interactions
 zg361_appeal_interaction:0 "성과 평가 이의 제기"
 zg361_appeal_interaction_desc:0 "이번 사이클의 평가 결과에 정식으로 이의를 제기하고 재평가를 요구합니다. 영향력 150 소모."
 zg361_review_talk_interaction:0 "성과 면담"
 zg361_review_talk_interaction_desc:0 "이번 사이클에 결과가 발표된 신하와 일대일 성과 면담을 진행합니다. 마음을 가라앉힙니다."
 zg361_recommend_interaction:0 "추천"
 zg361_recommend_interaction_desc:0 "함께 소속된 직속 군주에게 이 동료의 실적을 추천합니다: 다음 평가 +10."
 zg361_slander_interaction:0 "공세"
 zg361_slander_interaction_desc:0 "이 동료에 대한 독설적인 탄핵 상서를 제출합니다: 다음 평가에서 70% 확률로 -15; 들키면 오히려 본인이 역풍을 맞습니다."
 zg361_purge_interaction:0 "하위권 처리: 직위 박탈"
 zg361_purge_interaction_desc:0 "연속 두 차례 3.25를 받은 관리에게 하위권 퇴출을 집행합니다: 직위를 박탈합니다(합법적 사유, 폭정 수치 없음)."
 zg361_force_retire_interaction:0 "하위권 처리: 강제 퇴임"
 zg361_force_retire_interaction_desc:0 "연속 두 차례 3.25를 받은 관리에게 체면을 갖춰줍니다: 강제 퇴임, 공적은 유지."
 # Modifiers (grades)
 zg361_grade_375:0 "성과 3.75 · 기대 초과"
 zg361_grade_375_desc:0 "이번 주기 결과: 3.75. 결과, 난이도, 영향력에서 현 직급의 기대를 명확히 초과했습니다. 승진 추천이 부여됩니다."
 zg361_grade_35:0 "성과 3.5 · 기대 부합"
 zg361_grade_35_desc:0 "이번 주기 결과: 3.5. 직급이 요구하는 만큼 해냈습니다. 잘했습니다. 계속 유지하세요."
 zg361_grade_325:0 "성과 3.25 · 개선 필요"
 zg361_grade_325_desc:0 "이번 주기 평가 결과: 3.25. 네 가지 조치: 지방 국고 -50, 개인 금화 -25, 지원 시 공덕 -60, 그리고 해당 시 1년간 녹봉 -25%."
 zg361_pip:0 "성과 개선 계획"
 zg361_pip_desc:0 "성과 개선 계획(PIP)에 편입되었습니다. 연속 두 사이클 3.25는 최하위 퇴출 프로세스로 이어집니다."
 zg361_demoted:0 "강등 후 잔류"
 zg361_demoted_desc:0 "관대 처리 결과: 강등 후 잔류, 봉록 절반. 다음 평가군 결과를 지켜보겠습니다."
 zg361_promotion_track:0 "승진 트랙"
 zg361_promotion_track_desc:0 "연속 두 사이클 3.75: 승진 트랙이 열렸습니다. 임명 후보 점수가 크게 상승하며, 품계 상한이 일시적으로 상향됩니다."
 # Opinions
 zg361_favored:0 "상관의 총애"
 zg361_poor_review:0 "평정 부진"
 zg361_annoyed:0 "끈질긴 항소"
 zg361_purged:0 "하위 등급으로 퇴출"
 zg361_forced_retire:0 "강제 은퇴"
 zg361_merciful:0 "법외의 은총"
 zg361_rigged:0 "조작된 평가"
 zg361_appeal_rejected:0 "항소 기각"
 zg361_talked:0 "성과 면담"
 zg361_slandered_me:0 "악의적 비방"
 zg361_jingcha_attended:0 "대평가 참석"
 # Activity
 activity_zg361_jingcha:0 "행정 대평가"
 activity_zg361_jingcha_desc:0 "직속 현직 관료를 부소로 소집하여 직접 그 기록을 심사합니다. 평가가 끝나는 즉시 순위가 공지됩니다."
 activity_zg361_jingcha_host_desc:0 "경관 대사를 주재하여 직속 관료의 업적을 직접 심사하고, 막을 내리기 직전에 순위를 게시한다."
 activity_zg361_jingcha_guest_desc:0 "본거지로 나아가 소속 군주의 직접 심사에 응한다."
 activity_zg361_jingcha_selection_tooltip:0 "소속 재직 관료를 본거지로 소집하여 심사한다."
 activity_zg361_jingcha_conclusion_desc:0 "대규모 행정 평가(징차)가 종료되었으며, 결과가 게시되었습니다."
 zg361_jingcha_province_desc:0 "관할 청사에서 대규모 정기 인사 평가를 진행하라."
 zg361_jingcha_phase:0 "평가"
 # Events
 zg361.1.t:0 "당신이 진행한 심사: 명부 확정"
 zg361.1.desc:0 "이 평가는 당신이 소속 관료를 대상으로 직접 진행한 성과 심사이며, 상급자가 당신을 평가한 결과가 아니다. 고공사가 해당 등급의 현행 미달 비율 규칙에 따라 명부를 확정했다.\n\n이번 주기: 기대 초과 [TopScope.GetValue('zg361_n_375')|0]명, 기대 충족 [TopScope.GetValue('zg361_n_35')|0]명, 개선 필요 [TopScope.GetValue('zg361_n_325')|0]명, 하위 등급 퇴출 대상 [TopScope.GetValue('zg361_n_elim')|0]명.\n\n상급자가 당신을 평가할 경우, 등급·KPI·순위를 명시한 별도 고시가 별도로 발부된다."
 zg361.1.a:0 "확인했습니다."
 zg361.2.t:0 "상사의 평가: 3.75 · 기대 초과"
 zg361.2.desc:0 "[zg361_reviewing_superior.GetShortUIName] 님이 이번 평가에서 등급을 부여했습니다.\n\n평가 등급: 3.75 (기대 초과)\nKPI: [TopScope.GetValue('zg361_result_kpi')|0]   평가군 순위: [TopScope.GetValue('zg361_result_cohort_n')|0] 명 중 [TopScope.GetValue('zg361_result_rank')|0] 위\n\n성과, 난이도, 영향 범위가 현 직급을 훌쩍 넘었습니다. 인재 추천, 지방 국고, 승진 후보 보상은 직위와 제도가 뒷받침될 때만 적용됩니다."
 zg361.2.a:0 "주군, 은혜에 감사드립니다!"
 zg361.3.t:0 "상사의 평가: 3.5 · 기대 부합"
 zg361.3.desc:0 "[zg361_reviewing_superior.GetShortUIName] 님이 이번 평가에서 등급을 부여했습니다.\n\n평가 등급: 3.5 (기대 부합)\nKPI: [TopScope.GetValue('zg361_result_kpi')|0]   평가군 순위: [TopScope.GetValue('zg361_result_cohort_n')|0] 명 중 [TopScope.GetValue('zg361_result_rank')|0] 위\n\n현 직급에서 요구하는 만큼의 일은 했습니다. 딱 거기까지입니다."
 zg361.3.a:0 "……현상 유지하겠습니다."
 zg361.4.t:0 "상사의 평가: 3.25 · 개선 필요"
 zg361.4.desc:0 "[zg361_reviewing_superior.GetShortUIName]님이 이번 평가에서 등급을 정했다.\n\n당신의 등급: 3.25 (개선 필요)\nKPI: [TopScope.GetValue('zg361_result_kpi')|0]   평가군 내 순위: [TopScope.GetValue('zg361_result_cohort_n')|0]명 중 [TopScope.GetValue('zg361_result_rank')|0]등\n\n현재 직책 기준선에 미달한다. 네 가지 조치가 적용된다: 지방 금고에서 50(있는 경우), 개인 금화 25, 공덕 60(지원되는 경우), 그리고 해당되는 경우 1년간 녹봉 25% 삭감. 성과 개선 계획이 시작되며, 3.25가 한 번 더 나오면 최하위 탈락이다."
 zg361.4.a:0 "승인합니다. (스트레스 감소)"
 zg361.4.b:0 "이의 제기! 이번 평가는 조작되었다! (영향력 150 소모, 30% 확률로 뒤집힘)"
 zg361.4.c:0 "포기한다. 그냥 흘러간다. (스트레스 감소, 내년도 평가 -10)"
 zg361.4.d:0 "열심히 뛴다. 내년 결과로 보여준다. (스트레스 증가, 내년도 평가 +10)"
 zg361.5.t:0 "하위 등급 퇴출 명단"
 zg361.5.desc:0 "이번 주기에 [TopScope.GetValue('zg361_n_elim')|0]명의 관리가 두 주기 연속 3.25를 기록해 하위 등급 퇴출 대상이다. 명단이 책상에 펼쳐져 있고, 주필이 손에 들려 있다. (조정 화면에서 한 명씩 처리할 수도 있다.)\n\n어떻게 처리하겠는가?"
 zg361.5.a:0 "법대로 한다. (각각을 실적·호감·능력으로 심사하여 파면, 강제 은퇴 또는 강등)"
 zg361.5.b:0 "자비를 베풀어 모두 강등만 하고 현직에 남긴다. (명성 -100)"
 zg361.5.c:0 "한 해의 관찰 기간을 더 준다. (명성 -50, 조정이 너그러움에 감격한다)"
 zg361.6.t:0 "당신이 퇴출 명단에 올랐다"
 zg361.6.desc:0 "두 번 연속 3.25를 받자, 결국 하위권 퇴출의 칼날이 너에게 떨어졌다. 군주의 관리들이 이미 명부를 들고 출발했다.\n\n마지막 기회가 한 번 남아 있다."
 zg361.6.a:0 "최후 항소! 재심의를 요구하라! (영향력 200 소모, 40% 확률로 강등 처리되며 — 실패하면 작위를 잃는다)"
 zg361.6.b:0 "재산을 풀어 윗사람들의 손을 잡아라. (금전 300 소모, 강등되지만 현직 유지)"
 zg361.6.c:0 "운명을 받아들이고 체면 차려 퇴장하라."
 zg361.6.d:0 "테이블을 뒤엎고 일어서라! (독립 파벌을 결성하여 군주에 맞선다)"
 zg361.10.t:0 "성과 보정 회의"
 zg361.10.desc:0 "형부에서 올린 초안 명부가 네 책상 위에 놓여 있다: 기대 이상 [TopScope.GetValue('zg361_n_375')|0]명, 기대 부합 [TopScope.GetValue('zg361_n_35')|0]명, 개선 필요 [TopScope.GetValue('zg361_n_325')|0]명.\n\n공표 전이니, 명부는 아직 네 수중이다. 누구를 들어 주고 누구를 누를지는 붓끝 한 번에 달렸다 — 다만 조작이 드러나면, 관리들은 그대로 지적할 것이다: 조작된 평가라고."
 zg361.10.a:0 "명부가 정확하다. 그대로 게시하라."
 zg361.10.b:0 "한 명을 들어 주라: 최하위 3.75와 최상위 3.5를 맞바꿔라."
 zg361.10.c:0 "한 명 밀어내기: 최하위 3.5를 3.25로 내린다."
 zg361.11.t:0 "붉은 붓이 내려졌다"
 zg361.11.desc:0 "붉은 붓을 들어 목록에서 한 이름을 살짝 위로 올린다. 밀려난 사람은 주군이 하룻밤 사이에 마음을 바꿨다는 사실을 영원히 모를 것이다."
 zg361.11.a:0 "결과를 공지한다."
 zg361.12.t:0 "주석 붓이 떨어졌다"
 zg361.12.desc:0 "당신은 주서 붓을 들어 명단 가장자리에 이름을 적는다. 누군가는 이 3.25를 뒤집어써야 한다 — 그 사람도 괜찮지 않겠는가?"
 zg361.12.a:0 "결과를 공시한다."
 zg361.20.t:0 "인사 평가"
 zg361.20.desc:0 "인사 평가가 진행 중이다."
 zg361.20.a:0 "계속."
 zg361.30.t:0 "들개와 하얀 토끼"
 zg361.30.desc:0 "평가조의 기밀 메모에 별도 한 페이지가 첨부되었다: 성과가 뛰어나지만 가치관이 썩은 [TopScope.GetValue('zg361_n_dog')|0] 마리의 \"들개\"와, 충성스럽기만 하고 일은 안 되는 [TopScope.GetValue('zg361_n_rabbit')|0] 마리의 \"흰 토끼\".\n\n두 부류 모두 장기적으로 유지할 인물이 아니다. 어떻게 하겠나?"
 zg361.30.a:0 "너그럽고 엄격하게: 들개는 그대로 두고 관찰하며, 토끼에게는 다정한 말로 달랜다."
 zg361.30.b:0 "망나니를 벌주고, 능력 없는 직원을 정리한다. (+50 위엄; 망나니는 공적을 깎아내려 PIP에 돌입하고, 능력 없는 직원은 퇴직한다)"
 zg361_scoreboard_open:0 "성과 게시판"
 zg361_scoreboard_open_tooltip:0 "최근에 공표된 관리자 성과 게시판을 연다."
 zg361_scoreboard_title:0 "천조 관리자 성과 게시판"
 zg361_scoreboard_year:0 "평가 연도"
 zg361_scoreboard_total:0 "평가군"
 zg361_scoreboard_grade_375:0 "#P 3.75#!"
 zg361_scoreboard_grade_35:0 "#V 3.5#!"
 zg361_scoreboard_grade_325:0 "#N 3.25#!"
 zg361_scoreboard_dash:0 "—"
 zg361_scoreboard_status_promotion:0 "#P 승진 트랙#!"
 zg361_scoreboard_status_pip:0 "#N PIP#!"
 zg361_scoreboard_col_rank:0 "순위"
