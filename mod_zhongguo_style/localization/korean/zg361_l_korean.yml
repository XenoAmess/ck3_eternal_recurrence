l_korean:
 # Game rules
 rule_zg361_enabled:0 "Vassal Performance Review (361 System)"
 setting_zg361_on:0 "Enabled"
 setting_zg361_on_desc:0 "Celestial rulers review their vassals every cycle, sorting them into 3.75 / 3.5 / 3.25 under a forced 30/60/10 distribution."
 setting_zg361_off:0 "Disabled"
 setting_zg361_off_desc:0 "Disables the performance review system."
 rule_zg361_frequency:0 "Review Cycle"
 setting_zg361_freq_yearly:0 "Annual Review"
 setting_zg361_freq_yearly_desc:0 "One performance season every year."
 setting_zg361_freq_three_year:0 "Triennial Review"
 setting_zg361_freq_three_year_desc:0 "One grand evaluation every three years, in the old style."
 rule_zg361_bottom_ratio:0 "Bottom Quota"
 setting_zg361_ratio_strict:0 "Strict 361 (10%)"
 setting_zg361_ratio_strict_desc:0 "The 361 distribution is enforced: even if everyone meets expectations, someone in a large enough pool must take the 3.25."
 setting_zg361_ratio_relaxed:0 "Relaxed (5%)"
 setting_zg361_ratio_relaxed_desc:0 "Keep the 361 grading, but loosen the rigid bottom-10 quota."
 setting_zg361_ratio_off:0 "Hands-off (0%)"
 setting_zg361_ratio_off_desc:0 "No forced bottom tier. The review becomes a formality."
 # Modifiers (grades)
 zg361_grade_375:0 "Performance 3.75 · Exceeds Expectations"
 zg361_grade_375_desc:0 "This cycle's result: 3.75. Results, difficulty and impact clearly exceeded the expectations of the current rank. Promotion nomination granted."
 zg361_grade_35:0 "Performance 3.5 · Meets Expectations"
 zg361_grade_35_desc:0 "This cycle's result: 3.5. You did the job your rank requires. Good work. Keep it up."
 zg361_grade_325:0 "Performance 3.25 · Needs Improvement"
 zg361_grade_325_desc:0 "This cycle's result: 3.25. Output, influence or working style fell below team expectations. This is an unmistakably negative signal."
 zg361_pip:0 "Performance Improvement Plan"
 zg361_pip_desc:0 "Placed on a Performance Improvement Plan (PIP). Two consecutive 3.25 cycles trigger the bottom-tier elimination process."
 zg361_demoted:0 "Demoted but Retained"
 zg361_demoted_desc:0 "Lenient elimination outcome: demoted and retained, with reduced terms. We will see how next cycle goes."
 zg361_promotion_track:0 "Promotion Track"
 zg361_promotion_track_desc:0 "Two consecutive 3.75 cycles: the promotion track is open. Appointment candidate score greatly increased; merit level cap temporarily raised."
 # Opinions
 zg361_favored:0 "Imperial Favor"
 zg361_poor_review:0 "Poor Review"
 zg361_annoyed:0 "Tiresome Appeals"
 zg361_purged:0 "Eliminated as Bottom Tier"
 zg361_forced_retire:0 "Forced into Retirement"
 zg361_merciful:0 "Shown Mercy"
 # Events
 zg361.1.t:0 "Annual Performance Review Season"
 zg361.1.desc:0 "The Ministry of Personnel has delivered this cycle's review roster, and the 30/60/10 distribution has been settled.\n\nSome exceeded expectations. Some met them. Some... require improvement. Performance was never about whether you hit your targets — it is about how you rank against your peers.\n\nThe results are posted. Rewards and punishments have been applied."
 zg361.1.a:0 "Noted."
 zg361.2.t:0 "Your Performance Is 3.75"
 zg361.2.desc:0 "The result is in: 3.75 — exceeds expectations.\n\nYour results, the difficulty of what you took on, and the scope of your impact clearly exceeded your current rank. The imperial vermilion brush has signed off: a promotion nomination and an immediate performance bonus.\n\n\"Let the results speak.\""
 zg361.2.a:0 "Thank you for your guidance, Your Majesty!"
 zg361.3.t:0 "Your Performance Is 3.5"
 zg361.3.desc:0 "The result is in: 3.5 — meets expectations.\n\nYou did the work your rank requires. Nothing more, nothing less.\n\n\"Good work. Keep it up next year.\""
 zg361.3.a:0 "...Keeping it up."
 zg361.4.t:0 "You Got a 3.25"
 zg361.4.desc:0 "The result is in: 3.25 — needs improvement.\n\nThe ministry's wording is polite, but the message is unmistakable: you are below the bar for your current post. A Performance Improvement Plan has already been arranged. One more of these, and it is bottom-tier elimination.\n\nYour fists clench."
 zg361.4.a:0 "Accept it. (Stress reduced)"
 zg361.4.b:0 "Appeal! This review is rigged! (Costs 150 influence, 30% chance to overturn)"
 zg361.4.c:0 "Give up. Just coast. (Stress reduced, -10 to next year's review)"
 zg361.4.d:0 "Grind. Let next year's results speak. (Stress increased, +10 to next year's review)"
 zg361.5.t:0 "Bottom-Tier Elimination List"
 zg361.5.desc:0 "The following officials have scored 3.25 for two consecutive cycles and are due for bottom-tier elimination. The list lies on the imperial desk. The vermilion brush is in your hand.\n\nHow will you dispose of them?"
 zg361.5.a:0 "By the book. (Each is judged by record, favor and ability: purge, forced retirement, or demotion)"
 zg361.5.b:0 "Show mercy — demote them all, but keep them. (-100 prestige)"
 zg361.5.c:0 "Grant one more year of observation. (-50 prestige, the court is grateful)"
 zg361.6.t:0 "You Are on the Elimination List"
 zg361.6.desc:0 "Two consecutive 3.25s, and the blade of bottom-tier elimination has finally fallen on you. His Majesty's eunuchs have already set out with the roster.\n\nYou have one last window."
 zg361.6.a:0 "Final appeal! Demand a re-review! (Costs 200 influence, 40% chance to be demoted instead — failure means losing your title)"
 zg361.6.b:0 "Spend your fortune on the right palms. (Costs 300 gold, demoted but retained)"
 zg361.6.c:0 "Accept retirement with dignity."
