 zg361m.26.b:0 "Attribuer rapidement les points subjectifs selon la qualité de la présentation et l'intensité relationnelle de ce cycle, récompensant immédiatement les démonstrateurs tout en laissant temporairement la matière creuse l'emporter sur la gouvernance."
