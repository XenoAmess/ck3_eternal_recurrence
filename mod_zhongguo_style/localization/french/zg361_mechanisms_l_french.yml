 zg361m.50.t:0 "No.050 · Pactes d'éloges mutuels et trahison"
 zg361m.50.desc:0 "[H / P1] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review. This item has no connected business case yet: it configures policy and changes only the organizational ledger; it does not directly execute the example personnel, payment, or resource action."
 zg361m.50.a:0 "Record route A preference: Screen rater pairs for reciprocal correlation and sample shared-project evidence, accepting anti-collusion analysis and hearing costs. (organizational ledger only)"
 zg361m.50.b:0 "Record route B preference: Immediately down-weight suspected mutual boosters or reward the first accuser, breaking pacts fast while encouraging preemptive betrayal and false reports. (organizational ledger only)"
 zg361m.50.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
