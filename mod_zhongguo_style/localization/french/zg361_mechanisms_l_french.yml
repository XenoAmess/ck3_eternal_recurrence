 zg361m.32.t:0 "No.032 · Performance de la propre équipe du manager"
 zg361m.32.desc:0 "[F / P0] Cette politique s'applique via le registre organisationnel partagé. Sa règle retenue modifie la livraison, les preuves, la confiance, la charge de travail, le risque, les talents ou la pression budgétaire, et influe donc sur les résultats ultérieurs de l'équipe et sur la propre évaluation du manager."
 zg361m.32.a:0 "Évaluer les managers sur les objectifs gelés du cycle précédent, la Jingcha, les recours, les PIP, la rétention et les HC, en acceptant le coût d'une comptabilité inter-cycles."
 zg361m.32.b:0 "Ne juger que le rang actuel de l'équipe et sanctionner immédiatement les évaluations esquivées, les notes basses et l'attrition : exécution ferme, mais les cas chez les petits-enfants rejaillissent récursivement sur le manager."
 zg361m.32.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.33.t:0 "No.033 · Archétypes de manager et codes de motifs explicables"
 zg361m.33.desc:0 "[F / P0] Cette politique s'applique via le registre organisationnel partagé. Sa règle retenue modifie la livraison, les preuves, la confiance, la charge de travail, le risque, les talents ou la pression budgétaire, et influe donc sur les résultats ultérieurs de l'équipe et sur la propre évaluation du manager."
 zg361m.33.a:0 "Attribuer des pondérations stables et des codes de motifs aux profils data-driven, protecteurs, etc., plafonnés par des preuves dures, en acceptant le coût de maintenance des explications."
 zg361m.33.b:0 "Laisser la personnalité et les relations écraser les preuves limites pour une décision rapide : des souverains plus tranchants, mais des dossiers semblables impossibles à rejouer."
 zg361m.33.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.34.t:0 "No.034 · Grille 9 cases Performance × Potentiel"
 zg361m.34.desc:0 "[F / P1] Cette politique s'applique via le registre organisationnel partagé. Sa règle retenue modifie la livraison, les preuves, la confiance, la charge de travail, le risque, les talents ou la pression budgétaire, et influe donc sur les résultats ultérieurs de l'équipe et sur la propre évaluation du manager."
 zg361m.34.a:0 "Calibrer la grille 9 cases sur la performance gelée multi-cycles, la croissance et l'adéquation au poste, puis financer développement ou mobilité par quadrant."
 zg361m.34.b:0 "Étiqueter vite hauts potentiels et sortants d'après la note et le talent du cycle : ressources concentrées, mais un seul résultat décide d'une carrière."
 zg361m.34.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.35.t:0 "No.035 · 361 strict, souple ou hybride"
 zg361m.35.desc:0 "[F / P2] Cette politique s'applique via le registre organisationnel partagé. Sa règle retenue modifie la livraison, les preuves, la confiance, la charge de travail, le risque, les talents ou la pression budgétaire, et influe donc sur les résultats ultérieurs de l'équipe et sur la propre évaluation du manager."
 zg361m.35.a:0 "Adopter un hybride seuils absolus et classement relatif : garder le signal de distribution tout en allégeant la sanction du bas de tableau pour les vrais passes-partout, au prix d'une double validation."
 zg361m.35.b:0 "Imposer le 3-6-1 strict et remplir chaque place du bas : règle la plus claire et palmarès le plus rapide, mais fabrique une victime même quand tout le monde performe."
 zg361m.35.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.36.t:0 "No.036 · Rapport institutionnel décennal"
 zg361m.36.desc:0 "[F / P2] Cette politique s'applique via le registre organisationnel partagé. Sa règle retenue modifie la livraison, les preuves, la confiance, la charge de travail, le risque, les talents ou la pression budgétaire, et influe donc sur les résultats ultérieurs de l'équipe et sur la propre évaluation du manager."
 zg361m.36.a:0 "Geler annuellement notes, recours, PIP, promotions, HC, bonus, attrition et gouvernance réelle, puis agréger une tendance sur dix ans, en acceptant le coût d'un reporting de long terme."
 zg361m.36.b:0 "Ne publier que le tableau courant et quelques chiffres phares : récit de succès immédiat, mais attrition et recul de gouvernance masqués derrière une belle distribution."
 zg361m.36.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.37.t:0 "No.037 · Échange de quotas entre équipes"
 zg361m.37.desc:0 "[G / P1] Cette politique s'applique via le registre organisationnel partagé. Sa règle retenue modifie la livraison, les preuves, la confiance, la charge de travail, le risque, les talents ou la pression budgétaire, et influe donc sur les résultats ultérieurs de l'équipe et sur la propre évaluation du manager."
