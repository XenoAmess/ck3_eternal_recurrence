 zg361m.36.t:0 "No.036 · Rapport institutionnel décennal"
 zg361m.36.desc:0 "[F / P2] Cette politique s'applique via le registre organisationnel partagé. Sa règle retenue modifie la livraison, les preuves, la confiance, la charge de travail, le risque, les talents ou la pression budgétaire, et influe donc sur les résultats ultérieurs de l'équipe et sur la propre évaluation du manager."
 zg361m.36.a:0 "Geler annuellement notes, recours, PIP, promotions, HC, bonus, attrition et gouvernance réelle, puis agréger une tendance sur dix ans, en acceptant le coût d'un reporting de long terme."
 zg361m.36.b:0 "Ne publier que le tableau courant et quelques chiffres phares : récit de succès immédiat, mais attrition et recul de gouvernance masqués derrière une belle distribution."
