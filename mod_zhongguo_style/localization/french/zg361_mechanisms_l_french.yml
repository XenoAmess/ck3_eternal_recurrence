 zg361m.41.a:0 "Protéger les nouveaux arrivants du quota du premier cycle, fixer des objectifs de montée en compétence, un parrain ou une marraine et une date d'intégration précise, en acceptant le coût de développement et la pression sur le personnel en place."
 zg361m.41.b:0 "Évaluer immédiatement et intégralement les nouveaux et en faire les premiers candidats au dernier créneau, remplissant vite le quota de C au prix de l'atteinte portée aux mentors, à la réputation de recrutement et à la rétention."
 zg361m.41.c:0 "Reporter la décision et inscrire une dette politique explicite"
