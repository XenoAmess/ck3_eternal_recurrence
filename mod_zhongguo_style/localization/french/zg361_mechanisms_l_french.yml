 zg361m.49.a:0 "Sceller les évaluations par les pairs en dos-à-dos et n'autoriser qu'une seule soumission tardive supervisée, payée en crédibilité, en notant son effet sur la complétude des preuves."
 zg361m.49.b:0 "Fermer définitivement à l'échéance et annuler toute évaluation tardive, application nette mais laissant une collaboration réelle sans témoin et encourageant la coordination de pré-échéance."
