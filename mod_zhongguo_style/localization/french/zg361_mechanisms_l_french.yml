 zg361m.41.b:0 "Évaluer immédiatement et intégralement les nouveaux et en faire les premiers candidats au dernier créneau, remplissant vite le quota de C au prix de l'atteinte portée aux mentors, à la réputation de recrutement et à la rétention."
