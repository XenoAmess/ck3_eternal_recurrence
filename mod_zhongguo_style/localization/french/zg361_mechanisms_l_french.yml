 zg361m.41.t:0 "No.041 · Protéger, inclure ou sacrifier les nouveaux"
 zg361m.41.desc:0 "[G / P1] Cette politique est appliquée via le grand livre organisationnel partagé. La règle choisie modifie la livraison, les preuves, la confiance, la charge de travail, le risque, le talent ou la pression budgétaire, et influence donc les résultats futurs de l'équipe ainsi que la propre évaluation du manager."
