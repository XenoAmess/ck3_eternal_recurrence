 zg361m.40.b:0 "Imputer le dernier créneau à quelqu'un qui part déjà pour faire passer l'équipe actuelle, gagnant une paix immédiate au prix d'une distribution falsifiée, de remplacements erronés et d'un jugement de talent faussé."
