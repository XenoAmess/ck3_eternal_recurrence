 zg361m.47.a:0 "Geler une fenêtre de preuves sur l'année entière ou sur des jalons majeurs au début du cycle et conserver les premiers résultats pour contestation, en acceptant le coût d'un stockage complet."
 zg361m.47.b:0 "Pondérer fortement le dernier succès ou échec lors de l'évaluation finale, répondant vite à l'actualité mais encourageant sprints de fin d'année, risques cachés et effacement des travaux antérieurs."
 zg361m.47.c:0 "Reporter la décision et inscrire une dette politique explicite"
 zg361m.48.t:0 "No.048 · Charge de travail des évaluateurs et quotas d'invitation"
 zg361m.48.desc:0 "[H / P1] Cette politique est appliquée via le grand livre organisationnel partagé. La règle choisie modifie la livraison, les preuves, la confiance, la charge de travail, le risque, le talent ou la pression budgétaire, et influence donc les résultats futurs de l'équipe ainsi que la propre évaluation du manager."
 zg361m.48.a:0 "Limiter chaque personne à de véritables collaborateurs, échantillonner la qualité des dossiers et autoriser les refus sans contact, sacrifiant la couverture pour protéger le temps de revue."
 zg361m.48.b:0 "Imposer une évaluation par les pairs étendue et compter le volume de formulaires comme de la collaboration, remplissant vite les données mais produisant formulaires génériques, fatigue et invitations politiques."
 zg361m.48.c:0 "Reporter la décision et inscrire une dette politique explicite"
 zg361m.49.t:0 "No.049 · Clôture scellée et échéance de soumission"
