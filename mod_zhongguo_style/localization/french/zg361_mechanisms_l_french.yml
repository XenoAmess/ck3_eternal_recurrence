l_french:
 zg361_next_mechanism_decision:0 "Examiner la prochaine politique de performance"
 zg361_next_mechanism_decision_desc:0 "Ouvrir le prochain point non résolu du catalogue de politiques 361 et faire un choix qui entre dans le grand livre de l'organisation."
 zg361_next_mechanism_decision_tooltip:0 "Ouvrir la prochaine fiche de politique 361."
 zg361_next_mechanism_decision_confirm:0 "Faire entrer le prochain responsable de politique"
 zg361_reference_charter_decision:0 "Déployer la Charte de référence 361"
 zg361_reference_charter_decision_desc:0 "Adopter d'un coup les valeurs par défaut recommandées pour toutes les politiques 361. Cela économise des décennies de réunions et emporte immédiatement toutes les conséquences administratives, budgétaires et organisationnelles."
 zg361_reference_charter_decision_tooltip:0 "Résoudre les 361 points en une seule vraie série qui change l'état du jeu."
 zg361_reference_charter_decision_confirm:0 "Livrer tout le portefeuille"
 zg361_mechanism_choice_a_tt:0 "Voie durable : renforce les preuves, la confiance ou les capacités, mais consomme de la capacité administrative, budgétaire ou de livraison à court terme."
 zg361_mechanism_choice_b_tt:0 "Voie sprint : améliore le résultat immédiat, mais reporte le risque, l'épuisement, la dette technique ou la dette de recours sur les revues suivantes."
 zg361_mechanism_choice_c_tt:0 "Voie report : économise des efforts maintenant, mais inscrit une dette de politique qui nourrira la prochaine revue de votre propre supérieur."
 zg361_scoreboard_tab_system:0 "Cockpit des politiques"
 zg361_ledger_title:0 "Grand livre des politiques 361 : ce qui se cache sous le tableau de bord"
 zg361_ledger_configured:0 "Mécanismes configurés"
 zg361_ledger_checksum:0 "Somme de contrôle du portefeuille"
 zg361_ledger_explainer:0 "Un positif n'est pas toujours bon : charge administrative, risque de recours, dette technique, épuisement, pression sur les HC, dette salariale, dette de politique et pression budgétaire deviennent dangereux quand ils montent."
 zg361_ledger_evidence:0 "Qualité des preuves"
 zg361_ledger_trust:0 "Confiance organisationnelle"
 zg361_ledger_admin_load:0 "Charge d'administration de la performance"
 zg361_ledger_appeal_risk:0 "Risque de recours et de procédure"
 zg361_ledger_delivery:0 "Valeur livrée"
 zg361_ledger_stability:0 "Stabilité"
 zg361_ledger_tech_debt:0 "Dette technique"
 zg361_ledger_data_quality:0 "Qualité des données"
 zg361_ledger_burnout:0 "Épuisement organisationnel"
 zg361_ledger_talent:0 "Santé des talents"
 zg361_ledger_hc_pressure:0 "Pression sur les effectifs"
 zg361_ledger_pay_debt:0 "Dette salariale"
 zg361_ledger_policy_debt:0 "Dette de politique"
 zg361_ledger_budget_pressure:0 "Pression budgétaire"
 zg361_ledger_hint:0 "Ces comptes alimentent le prochain KPI de l'équipe et l'évaluation de votre performance managériale par votre supérieur."
 zg361_org_high_trust:0 "Confiance organisationnelle : la direction tient parole"
 zg361_org_high_trust_desc:0 "Les preuves, le feedback et la livraison se renforcent mutuellement."
 zg361_org_admin_overload:0 "Surcharge administrative de la performance"
 zg361_org_admin_overload_desc:0 "Tout le monde est occupé à expliquer pourquoi tout le monde est occupé."
 zg361_org_burnout_crisis:0 "Crise d'épuisement organisationnel"
 zg361_org_burnout_crisis_desc:0 "Les heures en ligne sont excellentes ; les batteries humaines, moins."
 zg361_org_delivery_stable:0 "Culture de livraison stable"
 zg361_org_delivery_stable_desc:0 "Toute livraison ne commence pas par la rédaction d'un mea culpa."
 zg361_org_tech_debt_crisis:0 "Dette technique qui compose ses intérêts"
 zg361_org_tech_debt_crisis_desc:0 "Le raccourci d'hier est devenu le péage d'aujourd'hui."
 zg361_org_talent_healthy:0 "Pipeline de talents sain"
 zg361_org_talent_healthy_desc:0 "Les étoiles, les successeurs et les contributeurs réguliers voient tous une voie devant eux."
 zg361m.1.t:0 "No.001 · Fiche de preuves KPI détaillée"
 zg361m.1.desc:0 "[A / P0] Cette politique passe par le grand livre organisationnel partagé. La règle choisie modifie la livraison, les preuves, la confiance, la charge de travail, le risque, les talents ou la pression budgétaire et influence donc les résultats ultérieurs de l'équipe et la propre revue du manager."
 zg361m.1.a:0 "Construire une fiche de preuves détaillée, geler les cas pour la production, l'efficacité, la croissance, la collaboration et les valeurs, et financer le travail de saisie et de revue."
 zg361m.1.b:0 "Fixer la note immédiatement à partir du score total et de l'impression du supérieur, publier vite tout en rendant les omissions et erreurs difficiles à tracer."
 zg361m.1.c:0 "Reporter et inscrire une dette de politique explicite"
 zg361m.2.t:0 "No.002 · Lettre de mission annuelle : direction OKR + résultat KPI"
 zg361m.2.desc:0 "[A / P0] Cette politique passe par le grand livre organisationnel partagé. La règle choisie modifie la livraison, les preuves, la confiance, la charge de travail, le risque, les talents ou la pression budgétaire et influence donc les résultats ultérieurs de l'équipe et la propre revue du manager."
 zg361m.2.a:0 "Geler la direction, les baselines et les cibles normales par poste, n'autoriser qu'une seule réinitialisation de crise étayée par des preuves, au prix d'un suivi continu."
 zg361m.2.b:0 "Imposer des cibles agressives à toutes les unités et tenir la ligne d'origine, acheter un sprint court au risque du détournement des indicateurs et de risques dissimulés."
 zg361m.2.c:0 "Reporter et inscrire une dette de politique explicite"
 zg361m.3.t:0 "No.003 · Bilan de mi-cycle et réinitialisation des cibles"
 zg361m.3.desc:0 "[A / P1] Cette politique passe par le grand livre organisationnel partagé. La règle choisie modifie la livraison, les preuves, la confiance, la charge de travail, le risque, les talents ou la pression budgétaire et influence donc les résultats ultérieurs de l'équipe et la propre revue du manager."
 zg361m.3.a:0 "Mener une revue de coaching de mi-cycle, enregistrer les risques et les ressources, et autoriser une réinitialisation de crise documentée, dépenser du temps managérial pour une note finale explicable."
 zg361m.3.b:0 "Maintenir les cibles initiales et exiger une remise à niveau avant échéance, éviter le travail de réinitialisation mais risquer d'imputer les changements de stratégie à des échecs personnels et de retarder les mauvaises nouvelles."
 zg361m.3.c:0 "Reporter et inscrire une dette de politique explicite"
 zg361m.4.t:0 "No.004 · Auto-évaluation et écart de perception"
 zg361m.4.desc:0 "[A / P1] Cette politique passe par le grand livre organisationnel partagé. La règle choisie modifie la livraison, les preuves, la confiance, la charge de travail, le risque, les talents ou la pression budgétaire et influence donc les résultats ultérieurs de l'équipe et la propre revue du manager."
 zg361m.4.a:0 "Exiger une auto-note appuyée par des résultats représentatifs et faire répondre le supérieur point par point sur les écarts de perception, accepter le coût de la discussion pour une trace vérifiable."
 zg361m.4.b:0 "Recevoir une autopromo d'une page et ajuster rapidement la note subjective selon la vantardise ou la modestie, gagner du temps tout en confondant la présentation avec la performance."
 zg361m.4.c:0 "Reporter et inscrire une dette de politique explicite"
 zg361m.5.t:0 "No.005 · Scorecards par poste"
 zg361m.5.desc:0 "[A / P1] Cette politique passe par le grand livre organisationnel partagé. La règle choisie modifie la livraison, les preuves, la confiance, la charge de travail, le risque, les talents ou la pression budgétaire et influence donc les résultats ultérieurs de l'équipe et la propre revue du manager."
 zg361m.5.a:0 "Geler des pondérations distinctes pour les rôles de gouvernance, militaire, fiscal et managérial avant de calibrer la même cohorte directe, accepter le coût de plusieurs scorecards."
 zg361m.5.b:0 "Forcer le classement de tous les rôles sur un seul tableau de résultats pour une exécution rapide, défavoriser systématiquement les travaux difficiles à mesurer et amplifier les mauvais appariements."
 zg361m.5.c:0 "Reporter et inscrire une dette de politique explicite"
 zg361m.6.t:0 "No.006 · Ajustement du point de départ et de la difficulté"
 zg361m.6.desc:0 "[A / P2] Cette politique passe par le grand livre organisationnel partagé. La règle choisie modifie la livraison, les preuves, la confiance, la charge de travail, le risque, les talents ou la pression budgétaire et influence donc les résultats ultérieurs de l'équipe et la propre revue du manager."
 zg361m.6.a:0 "Geler les baselines héritées, les ressources et la difficulté du poste, n'autoriser que des ajustements plafonnés, dépenser du travail d'audit pour rendre les comparaisons plus justes."
 zg361m.6.b:0 "Juger uniquement sur les résultats absolus de fin d'année et pousser plus fort les unités plus riches, produire un tableau rapide tout en récompensant l'héritage et en pénalisant le nettoyage."
 zg361m.6.c:0 "Reporter et inscrire une dette de politique explicite"
 zg361m.7.t:0 "No.007 · Invitations 360 en dos à dos"
 zg361m.7.desc:0 "[B / P0] Cette politique passe par le grand livre organisationnel partagé. La règle choisie modifie la livraison, les preuves, la confiance, la charge de travail, le risque, les talents ou la pression budgétaire et influence donc les résultats ultérieurs de l'équipe et la propre revue du manager."
 zg361m.7.a:0 "Inviter un petit ensemble de véritables collaborateurs, exiger des cas concrets et les recouper, payer le coût administratif de sollicitation et de dédoublonnage."
 zg361m.7.b:0 "Solliciter largement et pondérer immédiatement les votes hauts et bas, amplifier vite le signal tout en laissant place à la louange réciproque, aux représailles et aux retours formatés."
 zg361m.7.c:0 "Reporter et inscrire une dette de politique explicite"
 zg361m.8.t:0 "No.008 · Indulgence des évaluateurs et crédibilité des pairs"
 zg361m.8.desc:0 "[B / P1] Cette politique passe par le grand livre organisationnel partagé. La règle choisie modifie la livraison, les preuves, la confiance, la charge de travail, le risque, les talents ou la pression budgétaire et influence donc les résultats ultérieurs de l'équipe et la propre revue du manager."
 zg361m.8.a:0 "Conserver la moyenne historique, la variance, le taux de retournement et la précision de chaque évaluateur et calibrer leur poids, accepter le coût de gouvernance des données sur le long terme."
 zg361m.8.b:0 "Accepter les notations brutes des pairs ce cycle-ci et sanctionner les distorsiionnaires après recours, régler vite en laissant les évaluateurs indulgents et sévères façonner le classement d'abord."
 zg361m.8.c:0 "Reporter et inscrire une dette de politique explicite"
 zg361m.9.t:0 "No.009 · Cockpit de la réunion de calibration"
 zg361m.9.desc:0 "[B / P0] Cette politique passe par le grand livre organisationnel partagé. La règle choisie modifie la livraison, les preuves, la confiance, la charge de travail, le risque, les talents ou la pression budgétaire et influence donc les résultats ultérieurs de l'équipe et la propre revue du manager."
 zg361m.9.a:0 "Afficher ensemble KPI, valeurs, objectifs, feedback 360, tendances et preuves de recours, et enregistrer chaque changement de note comme un échange neutre en quotas."
 zg361m.9.b:0 "Fermer le tableau en une seule réunion à partir des totaux actuels et des quotas restants, aller vite en écrasant les cas limites et les contributions invisibles."
 zg361m.9.c:0 "Reporter et inscrire une dette de politique explicite"
 zg361m.10.t:0 "No.010 · Attribuer le C et protéger un subordonné"
 zg361m.10.desc:0 "[B / P0] Cette politique passe par le grand livre organisationnel partagé. La règle choisie modifie la livraison, les preuves, la confiance, la charge de travail, le risque, les talents ou la pression budgétaire et influence donc les résultats ultérieurs de l'équipe et la propre revue du manager."
 zg361m.10.a:0 "Choisir la note basse à partir de preuves gelées ; si le manager protège quelqu'un, facturer ouvertement le prestige et le KPI managérial du cycle suivant, préserver la confiance à un vrai coût institutionnel."
 zg361m.10.b:0 "Attribuer directement le C à un nouveau venu ou un membre périphérique pour satisfaire le quota, fermer la distribution maintenant tout en accumulant recours, ressentiment et risque d'attrition."
 zg361m.10.c:0 "Reporter et inscrire une dette de politique explicite"
 zg361m.11.t:0 "No.011 · Calibration inter-niveaux / siège de steward RH"
 zg361m.11.desc:0 "[B / P1] Cette politique passe par le grand livre organisationnel partagé. La règle choisie modifie la livraison, les preuves, la confiance, la charge de travail, le risque, les talents ou la pression budgétaire et influence donc les résultats ultérieurs de l'équipe et la propre revue du manager."
 zg361m.11.a:0 "Faire inspecter au supérieur inter-niveau la distribution, les preuves extrêmes et la procédure uniquement, renvoyer les cas faibles au manager direct au prix d'une réunion supplémentaire."
 zg361m.11.b:0 "Laisser le siège inter-niveau modifier directement les notes des petits-enfants pour une correction rapide, court-circuiter le retraitement tout en érodant l'autorité du manager direct et en invitant le lobbying."
 zg361m.11.c:0 "Reporter et inscrire une dette de politique explicite"
 zg361m.12.t:0 "No.012 · Divulgation des conflits et récusation"
 zg361m.12.desc:0 "[B / P1] Cette politique passe par le grand livre organisationnel partagé. La règle choisie modifie la livraison, les preuves, la confiance, la charge de travail, le risque, les talents ou la pression budgétaire et influence donc les résultats ultérieurs de l'équipe et la propre revue du manager."
 zg361m.12.a:0 "Divulguer les liens de parenté, d'intimité, d'hostilité et de parrainage avant la calibration et remplacer les évaluateurs récusés par un siège indépendant, accepter les coûts de staffing et de délai."
 zg361m.12.b:0 "Laisser le manager insister ouvertement ou manœuvrer en privé pour protéger ou punir quelqu'un vite, contrôler le résultat tout en augmentant fortement le risque de retournement et la note personnelle."
 zg361m.12.c:0 "Reporter et inscrire une dette de politique explicite"
 zg361m.13.t:0 "No.013 · Publication transparente, par niveaux, ou boîte noire"
 zg361m.13.desc:0 "[B / P2] Cette politique passe par le grand livre organisationnel partagé. La règle choisie modifie la livraison, les preuves, la confiance, la charge de travail, le risque, les talents ou la pression budgétaire et influence donc les résultats ultérieurs de l'équipe et la propre revue du manager."
 zg361m.13.a:0 "Donner à chaque personne des raisons gelées et une voie de recours, publier les notes et les règles agrégées à l'équipe, et administrer des contrôles d'accès pour le feedback sensible des pairs."
 zg361m.13.b:0 "Ne dire à chacun que la note finale et sceller les raisons, réduire vite les conflits ouverts tout en augmentant suspicion, management ascendant et recours."
 zg361m.13.c:0 "Reporter et inscrire une dette de politique explicite"
 zg361m.14.t:0 "No.014 · Dossier de recours de performance"
 zg361m.14.desc:0 "[C / P0] Un fonctionnaire fait appel avec preuves gelées après avoir discuté l'affaire avec son supérieur direct. Si l'appel est recevable, le supérieur recalibre le résultat, rembourse une à une les trois retenues immédiates du 3.25 (trésor local, or personnel et mérite), arrête immédiatement la retenue de salaire inachevée de 25 % sur un an et corrige le classement ; un appel rejeté ou abusif coûte du prestige et de la crédibilité."
 zg361m.14.a:0 "Recueillir les preuves gelées par type d'erreur, exiger la discussion avant la révision indépendante et concorder la recalibration, les trois remboursements immédiats et la fin de la retenue de salaire, un élément à la fois."
 zg361m.14.b:0 "Laisser le supérieur d'origine rejeter ou réviser la note sur-le-champ, clore vite le litige au risque de doubles sanctions, mauvais remboursements et conflits confirmés."
 zg361m.14.c:0 "Reporter et inscrire une dette de politique explicite"
 zg361m.15.t:0 "No.015 · Charte d'amélioration PIP"
 zg361m.15.desc:0 "[C / P0] Cette politique passe par le grand livre organisationnel partagé. La règle choisie modifie la livraison, les preuves, la confiance, la charge de travail, le risque, les talents ou la pression budgétaire et influence donc les résultats ultérieurs de l'équipe et la propre revue du manager."
 zg361m.15.a:0 "Négocier des jalons vérifiables, du soutien et des points de contrôle dans le périmètre d'autorité de la personne, dépenser des ressources pour une chance d'amélioration réellement faisable."
 zg361m.15.b:0 "Imposer des jalons à haute pression et une échéance dure, enregistrer le refus comme preuve négative majeure, agir vite tout en rendant la sortie prédéterminée."
 zg361m.15.c:0 "Reporter et inscrire une dette de politique explicite"
 zg361m.16.t:0 "No.016 · Budget de soutien PIP"
 zg361m.16.desc:0 "[C / P1] Cette politique passe par le grand livre organisationnel partagé. La règle choisie modifie la livraison, les preuves, la confiance, la charge de travail, le risque, les talents ou la pression budgétaire et influence donc les résultats ultérieurs de l'équipe et la propre revue du manager."
 zg361m.16.a:0 "Financer mentor, ressources temporaires de gouvernance et attention planifiée pour le PIP, enregistrer chaque apport, payer du budget pour tester une vraie amélioration."
 zg361m.16.b:0 "Fixer des cibles sans ressources et appliquer l'échéance, économiser le budget courant tout en transformant l'échec en preuve de recours et en coup dur sur la note du manager."
 zg361m.16.c:0 "Reporter et inscrire une dette de politique explicite"
 zg361m.17.t:0 "No.017 · Échelle de disposition des moins performants"
 zg361m.17.desc:0 "[C / P0] Cette politique passe par le grand livre organisationnel partagé. La règle choisie modifie la livraison, les preuves, la confiance, la charge de travail, le risque, les talents ou la pression budgétaire et influence donc les résultats ultérieurs de l'équipe et la propre revue du manager."
 zg361m.17.a:0 "Utiliser discussion, PIP et réaffectation légale pour une première note basse, réduire l'autorité ou libérer les HC seulement après échec répété, payer le coût de développement."
 zg361m.17.b:0 "Geler immédiatement la promotion, rétrograder ou retirer le moins performant pour augmenter la densité de talents, ouvrir vite des postes tout en créant peur, vacances et recours concentrés."
 zg361m.17.c:0 "Reporter et inscrire une dette de politique explicite"
 zg361m.18.t:0 "No.018 · Dossier personnel et règlement quadruple"
 zg361m.18.desc:0 "[C / P0] Ce dossier gelé affiche la note, le KPI, le rang, le supérieur et les motifs. Pour le 3.25, il indique aussi trésor local -50, or personnel -25, mérite -60, salaire -25 % pendant un an, ainsi que le statut de remboursement ou d'arrêt de retenue issu de l'appel."
 zg361m.18.a:0 "Geler à la liquidation la note, le rang, le supérieur, les motifs, les trois retenues immédiates (trésor, or personnel et mérite) et la retenue de salaire d'un an, en marquant séparément chaque paiement, remboursement et arrêt de retenue."
 zg361m.18.b:0 "Combiner les prélèvements à partir des valeurs live à l'ouverture du dossier et les afficher immédiatement, raccourcir le flux tout en risquant des erreurs après changement de supérieur ou de solde et des ouvertures répétées."
 zg361m.18.c:0 "Reporter et inscrire une dette de politique explicite"
 zg361m.19.t:0 "No.019 · Portes d'éligibilité à la promotion"
 zg361m.19.desc:0 "[D / P0] Cette politique passe par le grand livre organisationnel partagé. La règle choisie modifie la livraison, les preuves, la confiance, la charge de travail, le risque, les talents ou la pression budgétaire et influence donc les résultats ultérieurs de l'équipe et la propre revue du manager."
 zg361m.19.a:0 "Vérifier la haute performance soutenue, les valeurs, le statut PIP, l'ancienneté et un poste vacant légal avant d'ouvrir un dossier de promotion, accepter le coût de revue des candidats."
 zg361m.19.b:0 "Laisser un sponsor nominer la star du cycle en passant certains portillons pour la retenir vite, risquer une promotion creuse et des contestations sur l'historique."
 zg361m.19.c:0 "Reporter et inscrire une dette de politique explicite"
 zg361m.20.t:0 "No.020 · Dossier de promotion et défense inter-unités"
 zg361m.20.desc:0 "[D / P1] Cette politique passe par le grand livre organisationnel partagé. La règle choisie modifie la livraison, les preuves, la confiance, la charge de travail, le risque, les talents ou la pression budgétaire et influence donc les résultats ultérieurs de l'équipe et la propre revue du manager."
 zg361m.20.a:0 "Construire le dossier de promotion à partir de résultats de gouvernance gelés, d'impact d'équipe et de méthodes réutilisables, puis enregistrer le jugement aux frontières par un panel inter-unités."
 zg361m.20.b:0 "Laissons un parrain mener un unique oral et trancher vite : on récompense une présentation soignée, au risque que la mise en scène l'emporte sur les résultats durables."
 zg361m.20.c:0 "Reporter et inscrire une dette de politique explicite"
 zg361m.21.t:0 "No.021 · Matrice bonus-augmentation"
 zg361m.21.desc:0 "[D / P1] Un dirigeant attribue un pool de bonus limité : le 3.75 reçoit un bonus ou une hausse de salaire de courte durée, le 3.5 reste inchangé et le 3.25 conserve la pénalité quadruple. Les récompenses de tête consomment de vraies finances, tandis qu'un talent 3.75 non récompensé à répétition peut demander une mutation ou partir."
 zg361m.21.a:0 "Publier à l'avance la matrice note-bonus-augmentation et verrouiller le pool total, financer réellement la tête de file au prix d'un coût budgétaire courant."
 zg361m.21.b:0 "Concentrer le cash limité sur quelques notes de tête et différer les ajustements de salaire de base, durcir vite le signal tout en accumulant dette salariale, inversion et risque de débauchage."
 zg361m.21.c:0 "Reporter et inscrire une dette de politique explicite"
 zg361m.22.t:0 "No.022 · Budget d'effectifs / HC souples"
 zg361m.22.desc:0 "[D / P1] Cette politique passe par le grand livre organisationnel partagé. La règle choisie modifie la livraison, les preuves, la confiance, la charge de travail, le risque, les talents ou la pression budgétaire et influence donc les résultats ultérieurs de l'équipe et la propre revue du manager."
 zg361m.22.a:0 "Fixer un budget annuel de recrutement, développement et remplacement à partir des résultats, des finances et des postes vacants, suivre chaque slot usage et récupération."
 zg361m.22.b:0 "Étendre ou geler la capacité à la demande selon la pression et la préférence du supérieur, soutenir vite les priorités tout en affamant les équipes peu visibles et en encourageant le stockage de slots."
 zg361m.22.c:0 "Reporter et inscrire une dette de politique explicite"
 zg361m.23.t:0 "No.023 · Défense HC et ROI d'équipe"
 zg361m.23.desc:0 "[D / P1] Cette politique passe par le grand livre organisationnel partagé. La règle choisie modifie la livraison, les preuves, la confiance, la charge de travail, le risque, les talents ou la pression budgétaire et influence donc les résultats ultérieurs de l'équipe et la propre revue du manager."
 zg361m.23.a:0 "Défendre les HC avec livraison des objectifs, retournements, attrition et efficacité budgétaire, enregistrer les engagements pour la revue du cycle suivant, accepter le travail de revue annuelle."
 zg361m.23.b:0 "Emprunter ou ajouter de la capacité immédiatement à partir de l'urgence et des relations, délester la pression maintenant tout en amplifiant le risque crédit HC et épuisement si les promesses échouent."
