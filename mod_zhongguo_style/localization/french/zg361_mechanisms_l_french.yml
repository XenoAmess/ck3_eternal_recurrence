 zg361m.25.a:0 "Ne faire des offres écrites chiffrées qu'aux hauts performeurs durables dont l'avancement stagne et pour un poste vacant légal, en exigeant de l'ancien manager une réponse par un vrai rôle ou une vraie rémunération."
 zg361m.25.b:0 "Razzier les stars visibles avec des promesses verbales de promotion pour renforcer vite l'effectif, au prix d'une inflation salariale, d'engagements vides et de représailles entre équipes."
