 zg361m.44.desc:0 "[G / P2] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review. This item has no connected business case yet: it configures policy and changes only the organizational ledger; it does not directly execute the example personnel, payment, or resource action."
