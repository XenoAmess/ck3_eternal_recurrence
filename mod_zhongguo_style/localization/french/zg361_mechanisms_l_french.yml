 zg361m.46.a:0 "Record route A preference: Audit rich domains, key projects, reinforcements, and exposure before calibration, acknowledge unequal opportunity, and apply only capped difficulty adjustments. (organizational ledger only)"
 zg361m.46.b:0 "Record route B preference: Judge final results alone and reward those given the best opportunities, keeping a simple standard while laundering favoritism into potential and performance. (organizational ledger only)"
