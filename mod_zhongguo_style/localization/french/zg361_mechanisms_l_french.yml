 zg361m.42.b:0 "Record route B preference: Down-weight the whole group and break the pact as soon as rotation is suspected, deterring collusion quickly while risking false positives and betrayal resentment. (organizational ledger only)"
 zg361m.42.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
