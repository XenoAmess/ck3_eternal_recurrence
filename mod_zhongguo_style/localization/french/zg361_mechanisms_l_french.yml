 zg361m.47.t:0 "No.047 · Biais de récence et fenêtre de preuves"
 zg361m.47.desc:0 "[G / P2] Cette politique est appliquée via le grand livre organisationnel partagé. La règle choisie modifie la livraison, les preuves, la confiance, la charge de travail, le risque, le talent ou la pression budgétaire, et influence donc les résultats futurs de l'équipe ainsi que la propre évaluation du manager."
 zg361m.47.a:0 "Geler une fenêtre de preuves sur l'année entière ou sur des jalons majeurs au début du cycle et conserver les premiers résultats pour contestation, en acceptant le coût d'un stockage complet."
 zg361m.47.b:0 "Pondérer fortement le dernier succès ou échec lors de l'évaluation finale, répondant vite à l'actualité mais encourageant sprints de fin d'année, risques cachés et effacement des travaux antérieurs."
 zg361m.47.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.48.t:0 "No.048 · Charge de travail des évaluateurs et quotas d'invitation"
 zg361m.48.desc:0 "[H / P1] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review. This item has no connected business case yet: it configures policy and changes only the organizational ledger; it does not directly execute the example personnel, payment, or resource action."
