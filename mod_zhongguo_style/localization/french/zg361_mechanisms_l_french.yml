 zg361m.42.b:0 "Déprécier l'ensemble du groupe et rompre le pacte dès qu'une rotation est suspectée, dissuadant vite la collusion au risque de faux positifs et d'une forte rancœur de trahison."
 zg361m.42.c:0 "Reporter la décision et inscrire une dette politique explicite"
