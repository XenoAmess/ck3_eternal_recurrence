 zg361m.43.c:0 "Reporter la décision et inscrire une dette politique explicite"
 zg361m.44.t:0 "No.044 · Première passe à l'aveugle et révision nominative"
 zg361m.44.desc:0 "[G / P2] Cette politique est appliquée via le grand livre organisationnel partagé. La règle choisie modifie la livraison, les preuves, la confiance, la charge de travail, le risque, le talent ou la pression budgétaire, et influence donc les résultats futurs de l'équipe ainsi que la propre évaluation du manager."
 zg361m.44.a:0 "Classer d'abord les preuves sans nom ni relation, puis ajouter la difficulté du poste lors d'une passe nominative et revoir les grands écarts, en acceptant deux tours de travail."
 zg361m.44.b:0 "Classer d'emblée par nom sous un supérieur familier, plus rapide mais laissant favoritisme, hostilités et visibilité immédiate s'inviter dans le résultat."
 zg361m.44.c:0 "Reporter la décision et inscrire une dette politique explicite"
 zg361m.45.t:0 "No.045 · Dette de feedback « sans surprise »"
 zg361m.45.desc:0 "[G / P1] Cette politique est appliquée via le grand livre organisationnel partagé. La règle choisie modifie la livraison, les preuves, la confiance, la charge de travail, le risque, le talent ou la pression budgétaire, et influence donc les résultats futurs de l'équipe ainsi que la propre évaluation du manager."
 zg361m.45.a:0 "Consigner le fait, le coaching et la réponse du collaborateur dès qu'un problème apparaît et revoir l'amélioration avant la note finale, en acceptant un travail de feedback continu."
 zg361m.45.b:0 "Dévoiler un 3.25 pour la première fois en fin d'année et imposer l'acceptation par le résultat, soldant vite la discussion difficile mais augmentant fortement les retournements et la dette de feedback du manager."
 zg361m.45.c:0 "Reporter la décision et inscrire une dette politique explicite"
 zg361m.46.t:0 "No.046 · Audit de l'allocation des opportunités"
 zg361m.46.desc:0 "[G / P1] Cette politique est appliquée via le grand livre organisationnel partagé. La règle choisie modifie la livraison, les preuves, la confiance, la charge de travail, le risque, le talent ou la pression budgétaire, et influence donc les résultats futurs de l'équipe ainsi que la propre évaluation du manager."
 zg361m.46.a:0 "Auditer domaines riches, projets clés, renforts et exposition avant la calibration, reconnaître l'inégalité des opportunités et n'appliquer que des ajustements de difficulté plafonnés."
 zg361m.46.b:0 "Juger les résultats finaux seuls et récompenser ceux qui ont reçu les meilleures opportunités, conservant un standard simple tout en blanchissant le favoritisme en potentiel et performance."
 zg361m.46.c:0 "Reporter la décision et inscrire une dette politique explicite"
 zg361m.47.t:0 "No.047 · Biais de récence et fenêtre de preuves"
