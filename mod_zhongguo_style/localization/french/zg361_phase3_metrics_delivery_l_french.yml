l_french:
 zg361p3.229.t:0 "Who Owns the Metric Dictionary?"
 zg361p3.229.desc:0 "A metric without an owner is a slogan with a denominator. Freeze who may define it and who must sign later changes."
 zg361p3.229.a:0 "Name one accountable owner."
 zg361p3.229.b:0 "Require owner and steward co-signature."
 zg361p3.229.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361p3.230.t:0 "Two Dashboards, One Number"
 zg361p3.230.desc:0 "Two sources disagree. The review needs a recorded reconciliation rule, not whichever screenshot looks kinder."
 zg361p3.230.a:0 "Use the named authoritative source."
 zg361p3.230.b:0 "Reconcile jointly and publish the delta."
 zg361p3.230.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361p3.231.t:0 "The Denominator Moved"
 zg361p3.231.desc:0 "A denominator change can rescue any KPI. Choose how the old and new versions coexist before calibration."
 zg361p3.231.a:0 "Restate both periods on the new denominator."
 zg361p3.231.b:0 "Keep both versions side by side."
 zg361p3.231.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361p3.232.t:0 "The Spreadsheet Has a Hole"
 zg361p3.232.desc:0 "Missing data demands a visible backfill rule and an owner for the estimate error."
 zg361p3.232.a:0 "Backfill with audit samples."
 zg361p3.232.b:0 "Impute and show an uncertainty band."
 zg361p3.232.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361p3.233.t:0 "Who May See the Dashboard?"
 zg361p3.233.desc:0 "Access asymmetry creates performance asymmetry. Freeze a queryable visibility route for the assessed official."
 zg361p3.233.a:0 "Open the full dashboard."
 zg361p3.233.b:0 "Expose role-bounded detail and a query channel."
 zg361p3.233.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361p3.234.t:0 "Leading Signals, Lagging Results"
 zg361p3.234.desc:0 "Separate effort signals from eventual outcomes so a late result cannot rewrite the work already observed."
 zg361p3.234.a:0 "Weight leading signals first."
 zg361p3.234.b:0 "Balance signals and outcomes."
 zg361p3.234.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361p3.235.t:0 "A KPI Needs Guardrails"
 zg361p3.235.desc:0 "Hitting the primary number while breaking quality is not delivery. Freeze the guardrail share before the run."
 zg361p3.235.a:0 "Give guardrails equal weight."
 zg361p3.235.b:0 "Keep a sixty-forty balance."
 zg361p3.235.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361p3.236.t:0 "The KPI Cliff"
 zg361p3.236.desc:0 "One decimal point should not turn a year of work into zero. Lock the scoring curve before results arrive."
 zg361p3.236.a:0 "Use a continuous curve."
 zg361p3.236.b:0 "Use a hybrid threshold with partial credit."
 zg361p3.236.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361p3.237.t:0 "The Most Beautiful Time Window"
 zg361p3.237.desc:0 "A flattering time window is still cherry-picking. Register the window and the comparison period now."
 zg361p3.237.a:0 "Use the preregistered full window."
 zg361p3.237.b:0 "Publish full and selected windows together."
 zg361p3.237.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361p3.240.t:0 "Everyone Wants the Same Sample"
 zg361p3.240.desc:0 "Two teams cannot both claim a clean experiment on the same population. Spend a slot, partition it, or admit contamination."
 zg361p3.240.a:0 "Reserve one exclusive sample slot."
 zg361p3.240.b:0 "Partition one slot with a signed boundary."
 zg361p3.240.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361p3.238.t:0 "Vanity Is Not Value"
 zg361p3.238.desc:0 "Traffic can rise while the final value stays flat. Settle both ledgers instead of promoting the louder chart."
 zg361p3.238.a:0 "Weight verified value heavily."
 zg361p3.238.b:0 "Balance adoption and value."
 zg361p3.238.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361p3.239.t:0 "A Failed Experiment Still Learned"
 zg361p3.239.desc:0 "A preregistered failure may buy useful knowledge. Decide how much bounded learning credit survives the miss."
 zg361p3.239.a:0 "Credit verified learning strongly."
 zg361p3.239.b:0 "Split credit between learning and delivery."
 zg361p3.239.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361p3.241.t:0 "Who Owns the Long Tail?"
 zg361p3.241.desc:0 "Impact arrives after the team has moved on. Freeze attribution shares now so future value cannot be grabbed retroactively."
 zg361p3.241.a:0 "Credit the builder most."
 zg361p3.241.b:0 "Split builder, operator and successor evenly."
 zg361p3.241.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361p3.301.t:0 "The Core-Business Halo"
 zg361p3.301.desc:0 "A tailwind is not personal magic. Separate inherited momentum from controllable contribution before calibration."
 zg361p3.301.a:0 "Normalize the halo aggressively."
 zg361p3.301.b:0 "Use a peer benchmark adjustment."
 zg361p3.301.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361p3.302.t:0 "The Declining Business Headwind"
 zg361p3.302.desc:0 "A shrinking market should not automatically become one official's failure. Freeze the uncontrollable headwind share."
 zg361p3.302.a:0 "Normalize against the market decline."
 zg361p3.302.b:0 "Compare with matched declining teams."
 zg361p3.302.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361p3.303.t:0 "Incubation Needs a Clock"
 zg361p3.303.desc:0 "A new team needs protection, but not an immortal exemption. Sign its protected window and expiry."
 zg361p3.303.a:0 "Grant one short protected cycle."
 zg361p3.303.b:0 "Use milestone-gated protection."
 zg361p3.303.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361p3.304.t:0 "Two Parents, One Review"
 zg361p3.304.desc:0 "Project and functional managers both claim authority. Freeze weights and goal shares before either writes the review."
 zg361p3.304.a:0 "Give the project parent sixty percent."
 zg361p3.304.b:0 "Use equal parent weights."
 zg361p3.304.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361p3.305.t:0 "Reorg Quiet Period"
 zg361p3.305.desc:0 "A reporting-line change must not rewrite a nearly finished review. Choose the protected quiet-period rule."
 zg361p3.305.a:0 "Freeze ratings until calibration ends."
 zg361p3.305.b:0 "Allow evidence additions but no score edits."
 zg361p3.305.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361p3.306.t:0 "One Head, Two Hats"
 zg361p3.306.desc:0 "A temporary dual-role lead has finite capacity. Split both responsibility and review weight to one hundred percent."
 zg361p3.306.a:0 "Split thirty-seventy toward the expert role."
 zg361p3.306.b:0 "Split fifty-fifty."
 zg361p3.306.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361p3.307.t:0 "Profit Center or Cost Center?"
 zg361p3.307.desc:0 "Revenue and enablement teams need different scorecards. Pick one before comparing their outcomes."
 zg361p3.307.a:0 "Use a profit-center scorecard."
 zg361p3.307.b:0 "Use a cost-and-service scorecard."
 zg361p3.307.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361p3.308.t:0 "Managers or Experts?"
 zg361p3.308.desc:0 "Changing the title mix must conserve total HC. Choose the composition without manufacturing headcount."
 zg361p3.308.a:0 "Keep twenty managers and eighty experts."
 zg361p3.308.b:0 "Use a thirty-seventy mix."
 zg361p3.308.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361p3.309.t:0 "The Far Team Is Quiet"
 zg361p3.309.desc:0 "Visibility work consumes management capacity. Spend it on a visit, a review forum, or accept a documented discount."
 zg361p3.309.a:0 "Spend capacity on an on-site visit."
 zg361p3.309.b:0 "Spend capacity on a remote evidence forum."
 zg361p3.309.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361p3.310.t:0 "Old Ratings, New Org"
 zg361p3.310.desc:0 "A reorg changes reporting lines, not historical authorship. Map the old case without moving its frozen owner."
 zg361p3.310.a:0 "Map by frozen historical owner."
 zg361p3.310.b:0 "Map through a dual-signed bridge."
 zg361p3.310.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361p3.311.t:0 "A Pivot Is Not a Time Machine"
 zg361p3.311.desc:0 "New strategy may change future goals, never the old signed target. Freeze the boundary between both records."
 zg361p3.311.a:0 "Close the old target and open a new one."
 zg361p3.311.b:0 "Bridge them with explicit split credit."
 zg361p3.311.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361p3.334.t:0 "One Door for Every Demand"
 zg361p3.334.desc:0 "A demand without a source tag becomes free work. Record who asked, why, and where it entered."
 zg361p3.334.a:0 "Tag it as superior-sponsored."
 zg361p3.334.b:0 "Tag it as territory demand."
 zg361p3.334.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361p3.335.t:0 "Everything Is Urgent"
 zg361p3.335.desc:0 "An emergency label spends a real slot. Use one, trade scope, or send the request through the ordinary queue."
 zg361p3.335.a:0 "Spend one emergency slot."
 zg361p3.335.b:0 "Trade equal scope instead of a slot."
 zg361p3.335.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361p3.336.t:0 "Definition of Ready"
 zg361p3.336.desc:0 "A request enters delivery only after benefit, boundary and dependencies are signed—or its sponsor owns the ambiguity."
 zg361p3.336.a:0 "Return it for completion."
 zg361p3.336.b:0 "Admit a bounded exploration."
 zg361p3.336.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361p3.338.t:0 "Scope, Time, Quality: Pick Two"
 zg361p3.338.desc:0 "The delivery triangle cannot be wished away. Freeze which corner moves and whose signature accepts the tradeoff."
 zg361p3.338.a:0 "Cut scope and sign it."
 zg361p3.338.b:0 "Extend time and sign it."
 zg361p3.338.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361p3.339.t:0 "Estimate the Work, Not the Hero"
 zg361p3.339.desc:0 "Rewarding only on-time delivery trains sandbagging and heroics. Compare estimate error with its recorded cause."
 zg361p3.339.a:0 "Credit calibrated accuracy."
 zg361p3.339.b:0 "Credit transparent uncertainty."
 zg361p3.339.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361p3.340.t:0 "Stop Starting, Start Finishing"
 zg361p3.340.desc:0 "New work consumes delivery capacity and a WIP position. Respect the limit, sign an exception, or hide debt in plain sight."
 zg361p3.340.a:0 "Start within the WIP limit."
 zg361p3.340.b:0 "Start with a signed WIP exception."
 zg361p3.340.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361p3.342.t:0 "Who Owns the Blocked Time?"
 zg361p3.342.desc:0 "Blocked hours belong to a cause and an unblock owner, not automatically to the delivery team."
 zg361p3.342.a:0 "Charge the external dependency."
 zg361p3.342.b:0 "Split shared causation."
 zg361p3.342.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361p3.337.t:0 "A Change Request Has a Tax"
 zg361p3.337.desc:0 "Changing scope after work starts must move time, scope or capacity. A true disaster gets one recorded waiver."
 zg361p3.337.a:0 "Pay ten capacity hours and extend time."
 zg361p3.337.b:0 "Pay ten capacity hours and remove equal scope."
 zg361p3.337.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361p3.341.t:0 "Unfinished Work Crosses the Line"
 zg361p3.341.desc:0 "Carryover is not free progress. Release the current reservation and charge the next cycle exactly once."
 zg361p3.341.a:0 "Carry the whole remainder."
 zg361p3.341.b:0 "Split and accept a finished slice."
 zg361p3.341.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361p3.343.t:0 "Three Signatures, One Delivery"
 zg361p3.343.desc:0 "Delivery is not complete because the builder says so. Freeze proposer, executor and acceptor signatures with the outcome."
 zg361p3.343.a:0 "Accept with all three signatures."
 zg361p3.343.b:0 "Accept conditionally with follow-up debt."
 zg361p3.343.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361p3.344.t:0 "Launch Is Not Value"
 zg361p3.344.desc:0 "Settle launch, adoption and verified value as three conserved shares; no stage may mint a second hundred percent."
 zg361p3.344.a:0 "Front-load launch credit."
 zg361p3.344.b:0 "Use a balanced staged settlement."
 zg361p3.344.c:0 "Defer this mechanism and open one next-cycle policy debt."
