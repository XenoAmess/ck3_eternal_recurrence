 zg361_scoreboard_col_rank:0 "Rang"
 zg361_scoreboard_col_official:0 "Officier / Fonction"
 zg361_scoreboard_col_kpi:0 "KPI"
 zg361_scoreboard_col_values:0 "Valeurs"
 zg361_scoreboard_col_grade:0 "Évaluation"
 zg361_scoreboard_col_streak:0 "Série"
 zg361_scoreboard_col_status:0 "Statut"
 zg361_scoreboard_hint:0 "Sélectionnez un officier pour ouvrir sa fiche de personnage. Le dernier effectif publié conserve les officiers qui ont quitté leurs fonctions par la suite."
 zg361_scoreboard_tab_managed:0 "Officiers sous votre évaluation"
 zg361_scoreboard_tab_received:0 "Votre cohorte d'évaluation"
 zg361_scoreboard_reviewer:0 "Suzerain évaluateur"
 zg361_scoreboard_former_official:0 "Ancien officier (maintenu sur ce tableau publié)"
 zg361_jingcha_phase_desc:0 "Les officiers directs viennent rendre compte de leur travail tandis que leur suzerain examine les dossiers en personne."
 activity_zg361_jingcha_destination_selection:0 "Choisir le lieu de l'évaluation"
 activity_zg361_jingcha_guest_help_text:0 "Les officiers directs en fonction seront invités au siège de leur suzerain pour l'évaluation."
 activity_zg361_jingcha_cooldown:0 "La Grande Évaluation administrative est en cooldown"
 activity_zg361_jingcha_predicted_cost:0 "La Grande Évaluation administrative est un devoir statutaire et ne coûte ni les richesses du Trésor ni l'or personnel."
 activity_zg361_jingcha_host_an_a:0 "$host_activity_a$"
 zg361_refused_jingcha:0 "A refusé la Grande Évaluation"
 zg361.40.t:0 "L'évaluation arrive à échéance"
 zg361.40.desc:0 "Les registres, comptes et archives de mérites sont prêts. Selon la loi, je dois convoquer mes officiers directs en fonction à mon siège pour une Grande Évaluation administrative, sans imputer la dépense au Trésor ni à ma cassette personnelle.\n\nSi je défie ce devoir, mon supérieur direct consigne une faute majeure de gouvernance. Si je n'ai aucun supérieur, c'est l'institution elle-même qui perd de son prestige."
 zg361.40.a:0 "Tenir l'évaluation comme requis"
 zg361.40.a.tt:0 "Ouvre le planificateur d'activité gratuit. L'évaluation doit se conclure sous 300 jours ; se contenter d'ouvrir et de fermer le planificateur n'accomplit pas le devoir."
 zg361.40.b:0 "Je ne la tiendrai pas cette année"
 zg361.40.b.tt:0 "Avec un supérieur direct : son Opinion de vous chute, et votre prochaine évaluation reçoit une pénalité de KPI de 50 à usage unique.\nEn tant que suzerain suprême indépendant : perdez 200 de Prestige, sans auto-évaluation fabriquée."
 zg361.41.t:0 "Évaluation en retard"
 zg361.41.desc:0 "Le délai de la Grande Évaluation administrative est passé sans qu'elle se conclue."
 zg361.41.a:0 "Le dossier de conformité est réglé"
