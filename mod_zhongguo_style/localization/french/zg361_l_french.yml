l_french:
 # Game rules
 rule_zg361_enabled:0 "Évaluation des performances des vassaux (système 361)"
 setting_zg361_on:0 "Activé"
 setting_zg361_on_desc:0 "Les souverains célestes de rang ducal ou supérieur évaluent leurs officiers titulaires directs, en les répartissant en 3.75 / 3.5 / 3.25 ; comtes et barons sont évalués mais n'évaluent personne."
 setting_zg361_off:0 "Désactivé"
 setting_zg361_off_desc:0 "Désactive le système d'évaluation des performances."
 rule_zg361_frequency:0 "Cycle d'évaluation"
 setting_zg361_freq_yearly:0 "Évaluation annuelle"
 setting_zg361_freq_yearly_desc:0 "Une saison d'évaluation par an."
 setting_zg361_freq_three_year:0 "Évaluation triennale"
 setting_zg361_freq_three_year_desc:0 "Une grande inspection tous les trois ans, à l'ancienne."
 rule_zg361_bottom_ratio:0 "Quota du bas du classement"
 setting_zg361_ratio_strict:0 "361 strict (10 %)"
 setting_zg361_ratio_strict_desc:0 "La distribution 361 s'impose : même si tout le monde atteint les objectifs, quelqu'un dans un vivier assez grand doit écoper du 3.25."
 setting_zg361_ratio_relaxed:0 "Assoupli (5 %)"
 setting_zg361_ratio_relaxed_desc:0 "On garde la notation 361, mais on assouplit le quota rigide des 10 % en bas."
 setting_zg361_ratio_off:0 "Libre (0 %)"
 setting_zg361_ratio_off_desc:0 "Plus de palier inférieur imposé. L'évaluation devient une formalité."
 # Decision group & decisions
 decision_group_type_zg361:0 "Évaluation des performances"
 zg361_review_now_decision:0 "Lancer une évaluation maintenant"
 zg361_review_now_decision_desc:0 "Ordonnez au bureau des examens de classer immédiatement vos officiers directs au lieu d'attendre la saison annuelle. Les officiers déjà évalués cette année seront réexaminés."
 zg361_review_now_decision_tooltip:0 "Réévaluer immédiatement au moins un titulaire en poste direct."
 zg361_review_now_decision_confirm:0 "Publier les résultats !"
 zg361_ratio_strict_decision:0 "Quota du bas : 361 strict (10 %)"
 zg361_ratio_strict_decision_desc:0 "Imposer la distribution : à partir de cinq personnes dans le vivier, quelqu'un doit écoper du 3.25."
 zg361_ratio_strict_decision_tooltip:0 "Fixer à 10 % le quota inférieur forcé de cette unité d'évaluation."
 zg361_ratio_strict_decision_confirm:0 "Rester strict."
 zg361_ratio_relaxed_decision:0 "Quota du bas : assoupli (5 %)"
 zg361_ratio_relaxed_decision_desc:0 "On garde la notation 361, mais on assouplit le quota rigide des 10 % en bas."
 zg361_ratio_relaxed_decision_tooltip:0 "Fixer à 5 % le quota inférieur forcé de cette unité d'évaluation."
 zg361_ratio_relaxed_decision_confirm:0 "Assouplir."
 zg361_ratio_off_decision:0 "Quota du bas : libre (0 %)"
 zg361_ratio_off_decision_desc:0 "Plus de palier inférieur imposé. L'évaluation devient une formalité."
 zg361_ratio_off_decision_tooltip:0 "Supprimer le quota inférieur forcé de cette unité d'évaluation."
 zg361_ratio_off_decision_confirm:0 "Laisser faire."
 # Character interactions
 zg361_appeal_interaction:0 "Contester l'évaluation"
 zg361_appeal_interaction_desc:0 "Contester formellement le résultat de ce cycle et exiger une réévaluation. Coûte 150 d'influence."
 zg361_review_talk_interaction:0 "Entretien d'évaluation"
 zg361_review_talk_interaction_desc:0 "Tenir un entretien individuel d'évaluation avec un vassal dont le résultat a été publié ce cycle. Apaise les tensions."
 zg361_recommend_interaction:0 "Recommander"
 zg361_recommend_interaction_desc:0 "Recommander le bilan de ce pair à votre suzerain direct commun : +10 à sa prochaine évaluation."
 zg361_slander_interaction:0 "Dénigrer"
 zg361_slander_interaction_desc:0 "Déposer un mémorial venimeux contre ce pair : 70 % de chances de -15 à sa prochaine évaluation ; si découvert, cela se retourne contre vous."
 zg361_purge_interaction:0 "Sort du bas du classement : retrait du titre"
 zg361_purge_interaction_desc:0 "Appliquer l'élimination du bas du classement à un officier ayant deux 3.25 consécutifs : retrait de sa charge (motif légal, sans tyrannie)."
 zg361_force_retire_interaction:0 "Sort du bas du classement : retraite forcée"
 zg361_force_retire_interaction_desc:0 "Accorder une sortie digne à un officier ayant deux 3.25 consécutifs : retraite forcée, mérite intact."
 # Modifiers (grades)
 zg361_grade_375:0 "Performance 3.75 · Dépasse les attentes"
 zg361_grade_375_desc:0 "Résultat de ce cycle : 3.75. Résultats, difficulté et impact ont clairement dépassé les attentes du rang actuel. Nomination à la promotion accordée."
 zg361_grade_35:0 "Performance 3.5 · Conforme aux attentes"
 zg361_grade_35_desc:0 "Résultat de ce cycle : 3.5. Vous avez fait le travail qu'exige votre rang. Bon travail. Continuez."
 zg361_grade_325:0 "Performance 3.25 · À améliorer"
 zg361_grade_325_desc:0 "Résultat de ce cycle : 3.25. Conséquence quadruple : trésorerie locale -50, or personnel -25, mérite -60 lorsque pris en charge, et traitement -25 % pendant un an le cas échéant."
 zg361_pip:0 "Plan d'amélioration des performances"
 zg361_pip_desc:0 "Inscrit à un Plan d'amélioration des performances (PIP). Deux cycles 3.25 consécutifs déclenchent la procédure d'élimination du bas du classement."
 zg361_demoted:0 "Rétrogradé mais maintenu"
 zg361_demoted_desc:0 "Issue indulgente de l'élimination : rétrogradé et maintenu en poste, gages réduits de moitié. On verra au prochain cycle."
 zg361_promotion_track:0 "Voie de promotion"
 zg361_promotion_track_desc:0 "Deux cycles 3.75 consécutifs : la voie de promotion s'ouvre. Le score de candidat à une nomination est nettement augmenté ; le plafond de rang de mérite est temporairement relevé."
 # Opinions
 zg361_favored:0 "Faveur du suzerain"
 zg361_poor_review:0 "Mauvaise évaluation"
 zg361_annoyed:0 "Recours harassants"
 zg361_purged:0 "Éliminé comme bas du classement"
 zg361_forced_retire:0 "Forcé à la retraite"
 zg361_merciful:0 "Grâce accordée"
 zg361_rigged:0 "Évaluation truquée"
 zg361_appeal_rejected:0 "Recours rejeté"
 zg361_talked:0 "Entretien d'évaluation"
 zg361_slandered_me:0 "Dénigrement malveillant"
 zg361_jingcha_attended:0 "A assisté à la grande inspection"
 # Activity
 activity_zg361_jingcha:0 "Grande inspection administrative"
 activity_zg361_jingcha_desc:0 "Convoquez vos officiers titulaires directs à votre siège et examinez leurs bilans en personne. À la clôture de l'assemblée, les classements sont publiés sur-le-champ."
 activity_zg361_jingcha_host_desc:0 "Présider la grande inspection administrative, évaluer vos officiers directs en face à face, et publier les classements à la clôture."
 activity_zg361_jingcha_guest_desc:0 "Vous rendre au siège de votre suzerain direct pour subir son évaluation en personne."
 activity_zg361_jingcha_selection_tooltip:0 "Convoquer vos officiers titulaires directs à votre siège pour évaluation."
 activity_zg361_jingcha_conclusion_desc:0 "La grande inspection administrative s'est achevée, les résultats sont publiés."
 zg361_jingcha_province_desc:0 "Tenir la grande inspection administrative en votre siège."
 zg361_jingcha_phase:0 "Évaluation"
 # Events
 zg361.1.t:0 "Évaluation que vous avez menée : liste finalisée"
 zg361.1.desc:0 "Il s'agit de l'évaluation des performances que vous avez menée pour vos officiers directs, et non de votre propre notation par un supérieur. Le bureau des examens a finalisé la liste selon la règle de quota inférieur actuelle de ce rang.\n\nCe cycle : [TopScope.GetValue('zg361_n_375')|0] ont dépassé les attentes, [TopScope.GetValue('zg361_n_35')|0] les ont atteintes, [TopScope.GetValue('zg361_n_325')|0] doivent s'améliorer ; [TopScope.GetValue('zg361_n_elim')|0] sont désormais soumis à la procédure d'élimination du bas du classement.\n\nSi un supérieur vous évalue, un document distinct indiquera explicitement votre note, vos KPI et votre rang."
 zg361.1.a:0 "Compris."
 zg361.2.t:0 "Évaluation du supérieur : 3.75 · Dépasse les attentes"
 zg361.2.desc:0 "[zg361_reviewing_superior.GetShortUIName] a fixé votre notation pour cette évaluation.\n\nVotre note : 3.75 (dépasse les attentes)\nKPI : [TopScope.GetValue('zg361_result_kpi')|0]   Rang dans la cohorte : [TopScope.GetValue('zg361_result_rank')|0] sur [TopScope.GetValue('zg361_result_cohort_n')|0]\n\nVos résultats, votre niveau de difficulté et l'ampleur de votre impact dépassent votre rang actuel. Les récompenses de mérite, de trésorerie locale et de nomination sont appliquées là où votre poste et vos institutions les permettent."
 zg361.2.a:0 "Merci pour vos orientations, mon seigneur !"
 zg361.3.t:0 "Évaluation du supérieur : 3.5 · Conforme aux attentes"
 zg361.3.desc:0 "[zg361_reviewing_superior.GetShortUIName] a fixé votre notation pour cette évaluation.\n\nVotre note : 3.5 (conforme aux attentes)\nKPI : [TopScope.GetValue('zg361_result_kpi')|0]   Rang dans la cohorte : [TopScope.GetValue('zg361_result_rank')|0] sur [TopScope.GetValue('zg361_result_cohort_n')|0]\n\nVous avez fait le travail qu'exige votre rang. Ni plus, ni moins."
 zg361.3.a:0 "...Continuer sur cette lancée."
 zg361.4.t:0 "Évaluation du supérieur : 3.25 · À améliorer"
 zg361.4.desc:0 "[zg361_reviewing_superior.GetShortUIName] a attribué votre note pour cette évaluation.\n\nVotre échelon : 3.25 (à améliorer)\nKPI : [TopScope.GetValue('zg361_result_kpi')|0]   Rang dans la cohorte : [TopScope.GetValue('zg361_result_rank')|0] sur [TopScope.GetValue('zg361_result_cohort_n')|0]\n\nVous êtes sous le seuil requis pour votre poste. La liquidation quadruple s'applique : 50 du trésor local lorsqu'il est présent, 25 pièces d'or personnelles, 60 de mérite si cela est pris en charge, et une réduction de salaire de 25 % pendant un an, le cas échéant. Un plan d'amélioration des performances débute ; un 3.25 de plus entraîne l'élimination du niveau le plus bas."
 zg361.4.a:0 "L'accepter. (Stress réduit)"
 zg361.4.b:0 "Faire appel ! Cette évaluation est truquée ! (Coûte 150 d'influence, 30 % de chances d'être annulée)"
 zg361.4.c:0 "Abandonner. Laisser couler. (Stress réduit, -10 à l'évaluation de l'an prochain)"
 zg361.4.d:0 "Serrer les dents. Laisser parler les résultats l'an prochain. (Stress accru, +10 à l'évaluation de l'an prochain)"
 zg361.5.t:0 "Liste d'élimination du dernier échelon"
 zg361.5.desc:0 "Ce cycle, [TopScope.GetValue('zg361_n_elim')|0] fonctionnaires ont obtenu 3.25 deux fois de suite et sont candidats à l'élimination du dernier échelon. La liste est sur votre bureau ; le pinceau vermillon est dans votre main. (Vous pouvez aussi les traiter un par un depuis la vue de la cour.)\n\nComment souhaitez-vous les traiter ?"
 zg361.5.a:0 "Selon les règles. (Chacun est jugé selon son dossier, sa faveur et ses capacités : purge, retraite forcée ou rétrogradation)"
 zg361.5.b:0 "Faire preuve de clémence — les rétrograder tous, mais les garder. (-100 de prestige)"
 zg361.5.c:0 "Accorder une année supplémentaire d'observation. (-50 de prestige, la cour est reconnaissante)"
 zg361.6.t:0 "Vous figurez sur la liste d'élimination"
 zg361.6.desc:0 "Deux 3.25 consécutifs, et la lame de l'élimination du dernier échelon s'est enfin abattue sur vous. Les officiers de votre seigneur sont déjà partis avec le registre.\n\nIl vous reste une dernière fenêtre."
 zg361.6.a:0 "Appel final ! Exiger une réévaluation ! (Coûte 200 d'influence, 40 % de chances d'être simplement rétrogradé — en cas d'échec, vous perdez votre titre)"
 zg361.6.b:0 "Dépenser votre fortune pour graisser les bonnes paumes. (Coûte 300 pièces d'or, rétrogradé mais maintenu en poste)"
 zg361.6.c:0 "Accepter la retraite avec dignité."
 zg361.6.d:0 "Se soulever ! (Fonder une faction d'indépendance contre votre seigneur)"
 zg361.10.t:0 "Réunion de calibration des performances"
 zg361.10.desc:0 "Le projet de liste du ministère est sur votre bureau : [TopScope.GetValue('zg361_n_375')|0] personnes dépassent les attentes, [TopScope.GetValue('zg361_n_35')|0] y répondent, [TopScope.GetValue('zg361_n_325')|0] nécessitent une amélioration.\n\nAvant la publication des résultats, le pinceau est encore entre vos mains. Élever quelqu'un, enfoncer quelqu'un — mais si la cour flaire la manipulation, elle l'appellera par son nom : une évaluation truquée."
 zg361.10.a:0 "La liste est correcte. La publier."
 zg361.10.b:0 "En élever un : échanger le dernier 3.75 avec le premier 3.5."
 zg361.10.c:0 "En enfoncer un : faire basculer le dernier 3.5 en 3.25."
 zg361.11.t:0 "Le pinceau vermillon est tombé"
 zg361.11.desc:0 "Vous soulevez le pinceau vermillon et faites remonter doucement un nom sur la liste. Celui qui a été écarté ne saura jamais que son seigneur a changé d'avis du jour au lendemain."
 zg361.11.a:0 "Publier les résultats."
 zg361.12.t:0 "Le pinceau vermillon est tombé"
 zg361.12.desc:0 "Vous soulevez le pinceau vermillon et ajoutez un nom en bout de liste. Quelqu'un doit bien porter ce 3.25 — pourquoi pas lui ?"
 zg361.12.a:0 "Publier les résultats."
 zg361.20.t:0 "Évaluation des performances"
 zg361.20.desc:0 "L'évaluation des performances est en cours."
 zg361.20.a:0 "Continuer."
 zg361.30.t:0 "Les chiens sauvages et les petits lapins blancs"
 zg361.30.desc:0 "Le bureau d'évaluation a annexé une seconde page à son mémorial confidentiel : [TopScope.GetValue('zg361_n_dog')|0] \"chiens sauvages\" — résultats stellaires, valeurs douteuses ; et [TopScope.GetValue('zg361_n_rabbit')|0] \"petits lapins blancs\" — loyaux à l'excès, incompétents à la tâche.\n\nNi les uns ni les autres ne sont des éléments à garder sur le long terme. Quel est votre bon plaisir ?"
 zg361.30.a:0 "Miséricorde équilibrée : garder les chiens sauvages sous surveillance, réconforter les lapins."
 zg361.30.b:0 "Punir les chiens sauvages et mettre les lapins à la retraite. (+50 prestige ; les chiens sauvages perdent leur mérite et entrent en PIP, les lapins partent à la retraite)"
 zg361_scoreboard_open:0 "Tableau des performances"
 zg361_scoreboard_open_tooltip:0 "Ouvrir le dernier tableau officiel de performance publié."
 zg361_scoreboard_title:0 "Tableau de performance des officiers célestes"
 zg361_scoreboard_year:0 "Année de revue"
