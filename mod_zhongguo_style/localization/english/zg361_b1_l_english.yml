l_english:
 zg361b1.200.t:0 "How Will You State This Cycle's Work?"
 zg361b1.200.desc:0 "The evidence window is about to close. Your account will be sealed beside the mid-cycle record; the factual record itself will remain unchanged."
 zg361b1.200.a:0 "Submit the mid-cycle evidence unchanged."
 zg361b1.200.b:0 "Submit a self-rating raised by up to 15 points."
 zg361b1.200.c:0 "Submit a self-rating lowered by up to 15 points."
 zg361b1.201.t:0 "Provisional Assessment"
 zg361b1.201.desc:0 "Your manager has issued an early view of your standing. It differs from the sealed facts by [ROOT.Char.MakeScope.Var('zg361_b1_shadow_gap_magnitude').GetValue|0], and you have [ROOT.Char.MakeScope.Var('zg361_b1_shadow_deadline_days').GetValue|0] days to respond. No reward or final-rating place is assigned during this window."
 zg361b1.201.grade_375:0 "Current provisional rating: #P 3.75 — exceeds expectations#!."
 zg361b1.201.grade_35:0 "Current provisional rating: #V 3.5 — meets expectations#!."
 zg361b1.201.grade_325:0 "Current provisional rating: #N 3.25 — needs improvement#!."
 zg361b1.201.a:0 "Accept it with no calibration adjustment."
 zg361b1.201.b:0 "Check current results; adjust calibration by at most 10 points."
 zg361b1.126.t:0 "Your Rating Has Been Posted"
 zg361b1.126.desc:0 "Other pending cases no longer hold back your final rating; this is revision [ROOT.Char.MakeScope.Var('zg361_b1_local_publish_revision').GetValue|0] of your case. Rewards and penalties will still be applied at formal settlement, and no other official's pending case is disclosed here."
 zg361b1.126.grade_375:0 "Current posted rating: #P 3.75#!."
 zg361b1.126.grade_35:0 "Current posted rating: #V 3.5#!."
 zg361b1.126.grade_325:0 "Current posted rating: #N 3.25#!."
 zg361b1.126.initial:0 "This is the first settled revision of your case this cycle."
 zg361b1.126.appended:0 "The previously pending matter has been resolved, so your result has now been added to the board."
 zg361b1.126.reopened:0 "New evidence triggered another review; this revision replaces the previous result."
 zg361b1.126.a:0 "Note this rating and revision."
