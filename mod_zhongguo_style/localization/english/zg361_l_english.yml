 zg361_jingcha_phase_desc:0 "Direct officials report on their work while their liege reviews the records in person."
 activity_zg361_jingcha_destination_selection:0 "Choose the Evaluation Venue"
 activity_zg361_jingcha_guest_help_text:0 "Direct incumbent officials will be invited to their liege's seat for evaluation."
 activity_zg361_jingcha_cooldown:0 "The Grand Administrative Evaluation is on cooldown"
 activity_zg361_jingcha_predicted_cost:0 "The Grand Administrative Evaluation is a statutory duty and costs neither Treasury wealth nor personal gold."
 activity_zg361_jingcha_host_an_a:0 "$host_activity_a$"
 zg361_refused_jingcha:0 "Refused the Grand Evaluation"
 zg361.40.t:0 "The Evaluation Comes Due"
 zg361.40.desc:0 "The registers, accounts, and records of merit are ready. By law, I must summon my direct incumbent officials to my seat for a Grand Administrative Evaluation, without charging either the Treasury or my private purse.\n\nIf I defy this duty, my direct superior will record a major failure of governance. If I have no superior, the institution itself will lose standing."
 zg361.40.a:0 "Hold the evaluation as required"
 zg361.40.a.tt:0 "Open the free activity planner. The evaluation must conclude within 300 days; only completing the activity fulfills the duty."
 zg361.40.b:0 "I will not hold it this year"
 zg361.40.b.tt:0 "With a direct superior: their Opinion falls; the one-use -50 KPI applies only if they are your eligible reviewer next cycle.\nAs an independent top liege: lose 200 Prestige, with no fabricated self-review."
 zg361.41.t:0 "Evaluation Overdue"
 zg361.41.desc:0 "The deadline for the Grand Administrative Evaluation has passed without its conclusion."
 zg361.41.a:0 "The compliance record is settled"
 # v0.4 phase-two first slice: KPI evidence, formal service, personal statement
 zg361_view_result_statement_decision:0 "View Personal Review Statement"
 zg361_view_result_statement_decision_desc:0 "Reopen your latest personal review case. Facts, final grade, KPI detail, service, and settlement appear according to the case stage and disclosure permissions."
 zg361_view_result_statement_decision_tooltip:0 "View your latest personal review statement without recalculating it."
 zg361_view_result_statement_decision_confirm:0 "Open the case file"
 zg361.50.t:0 "3.25 Performance Notice: Signature Requested"
 zg361.50.desc:0 "Your formal performance notice has arrived; the reviewer is [zg361_reviewing_superior.GetShortUIName].\n\nFinal grade: 3.25 (needs improvement)\nFactual assessment: 3.25 (needs improvement)\nFrozen performance score: [TopScope.GetValue('zg361_notice_kpi')|0]   Cohort rank: [TopScope.GetValue('zg361_notice_rank')|0] of [TopScope.GetValue('zg361_notice_cohort')|0]\n\nAcknowledging the notice confirms receipt, not agreement. You may acknowledge it directly, acknowledge it with an objection, or refuse it and have it served before witnesses seven days later. None of these responses alone erases the rating, settlement, or improvement plan."
 zg361.50.a:0 "Acknowledge it. Received does not mean enjoyed."
 zg361.50.b:0 "Acknowledge with an objection. Signature is not consent."
 zg361.50.c:0 "Refuse to sign. (Witnessed service in seven days)"
 zg361.51.t:0 "3.25 Performance Notice: Witnessed Service"
 zg361.51.desc:0 "Witnessed service after refusal has been processed."
 zg361.52.t:0 "Performance Appeal Clock"
 zg361.52.desc:0 "The formal appeal window for this case has expired."
 zg361.53.t:0 "Personal Performance Settlement Statement"
 zg361.53.desc:0 "Review owner: [zg361_reviewing_superior.GetShortUIName]\nFrozen KPI: [TopScope.GetValue('zg361_stmt_kpi')|0]   Cohort rank: [TopScope.GetValue('zg361_stmt_rank')|0] of [TopScope.GetValue('zg361_stmt_cohort')|0]"
 zg361.53.absolute_375:0 "\n#bold Factual band: 3.75 (absolute facts exceed expectations)#!"
 zg361.53.absolute_35:0 "\n#bold Factual band: 3.5 (absolute facts meet expectations)#!"
 zg361.53.absolute_325:0 "\n#bold Factual band: 3.25 (absolute facts need improvement)#!"
 zg361.53.grade_375:0 "Final grade: #P 3.75 (exceeds expectations)#!"
 zg361.53.grade_35:0 "Final grade: #V 3.5 (meets expectations)#!"
 zg361.53.grade_325:0 "Final grade: #N 3.25 (needs improvement)#!"
 zg361.53.reason_0:0 "Grade reason: the factual band and final grade agree."
 zg361.53.reason_1:0 "Grade reason: calibration displaced you from a 3.75 slot."
 zg361.53.reason_2:0 "Grade reason: calibration raised you into a 3.75 slot."
 zg361.53.reason_3:0 "Grade reason: calibration moved you into 3.25."
 zg361.53.reason_4:0 "Grade reason: calibration rescued you from a 3.25 slot."
 zg361.53.reason_5_c:0 "Grade reason: #N your facts met the bar, but mandatory distribution needed a C and quota made you carry it.#!"
 zg361.53.reason_5:0 "Grade reason: mandatory distribution lowered your final band below the factual band."
 zg361.53.reason_6:0 "Grade reason: newcomer protection prevented an immediate C this cycle."
 zg361.53.reason_7:0 "Grade reason: rank and quota lifted you above your factual band."
 zg361.53.reason_8:0 "Grade reason: a one-to-two-person cohort bypassed forced distribution, so the final grade was neutralized to 3.5."
 zg361.53.evidence:0 "\n#bold Itemized KPI evidence#!\nGovernance [TopScope.GetValue('zg361_stmt_governance')|0]   Capability [TopScope.GetValue('zg361_stmt_capability')|0]   Growth [TopScope.GetValue('zg361_stmt_growth')|0]   Superior [TopScope.GetValue('zg361_stmt_superior')|0]\nValues [TopScope.GetValue('zg361_stmt_values')|0]   Collaboration [TopScope.GetValue('zg361_stmt_collaboration')|0]   Jingcha [TopScope.GetValue('zg361_stmt_jingcha')|0]   Organization [TopScope.GetValue('zg361_stmt_organization')|0]\nFrozen values score [TopScope.GetValue('zg361_stmt_values_score')|0]"
 zg361.53.service:0 "\n#bold Service record#!\nThe notice was formally served in [TopScope.GetValue('zg361_stmt_delivered_year')|0]. Its service method, appeal window, and ruling are stated in plain language on the dossier's audit page."
 zg361.53.receipts:0 "\n#bold Fourfold settlement receipts#!\nPaid: local treasury [TopScope.GetValue('zg361_stmt_treasury_paid')|0]   personal gold [TopScope.GetValue('zg361_stmt_gold_paid')|0]   merit [TopScope.GetValue('zg361_stmt_merit_paid')|0]\nRefunded: local treasury [TopScope.GetValue('zg361_stmt_treasury_refunded')|0]   personal gold [TopScope.GetValue('zg361_stmt_gold_refunded')|0]   merit [TopScope.GetValue('zg361_stmt_merit_refunded')|0]\nThe dossier's audit page states whether salary withholding remains active."
 zg361.53.state_1:0 "\nCase state: prepared for service; no fourfold settlement has posted yet."
 zg361.53.state_2:0 "\nCase state: signature refused, awaiting witnessed service; refusal cannot erase the grade."
 zg361.53.state_3:0 "\nCase state: formally served/published; every applicable settlement has posted idempotently."
 zg361.53.state_4:0 "\nCase state: appeal window expired without correction."
 zg361.53.state_5:0 "\nCase state: #P corrected to 3.5; fixed penalties were refunded once from receipts and future salary withholding stopped.#!"
 zg361.53.a:0 "Close the case file."
