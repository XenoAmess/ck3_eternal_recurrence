l_english:
 # Game rules
 rule_zg361_enabled:0 "Vassal Performance Review (361 System)"
 setting_zg361_on:0 "Enabled"
 setting_zg361_on_desc:0 "Celestial rulers of duke tier or above review their direct incumbent officials, sorting them into 3.75 / 3.5 / 3.25; counts and barons are reviewed but do not run reviews."
 setting_zg361_off:0 "Disabled"
 setting_zg361_off_desc:0 "Disables the performance review system."
 rule_zg361_frequency:0 "Review Cycle"
 setting_zg361_freq_yearly:0 "Annual Review"
 setting_zg361_freq_yearly_desc:0 "One performance season every year."
 setting_zg361_freq_three_year:0 "Triennial Review"
 setting_zg361_freq_three_year_desc:0 "One grand evaluation every three years, in the old style."
 rule_zg361_bottom_ratio:0 "Bottom Quota"
 setting_zg361_ratio_strict:0 "Strict 361 (10%)"
 setting_zg361_ratio_strict_desc:0 "The 361 distribution is enforced: even if everyone meets expectations, someone in a large enough pool must take the 3.25."
 setting_zg361_ratio_relaxed:0 "Relaxed (5%)"
 setting_zg361_ratio_relaxed_desc:0 "Keep the 361 grading, but loosen the rigid bottom-10 quota."
 setting_zg361_ratio_off:0 "Hands-off (0%)"
 setting_zg361_ratio_off_desc:0 "No forced bottom tier. The review becomes a formality."
 # Decision group & decisions
 decision_group_type_zg361:0 "Performance Review"
 zg361_review_now_decision:0 "Conduct Performance Review Now"
 zg361_review_now_decision_desc:0 "Order the evaluation bureau to rank your direct roster immediately instead of waiting for the annual season. You may settle only one review per calendar year; officials already covered by your settled review that year will not be evaluated again."
 zg361_review_now_decision_tooltip:0 "Immediately review at least one direct incumbent official; you cannot settle another review in the same calendar year."
 zg361_review_now_decision_confirm:0 "Publish the rankings!"
 zg361_ratio_strict_decision:0 "Bottom Quota: Strict 361 (10%)"
 zg361_ratio_strict_decision_desc:0 "Enforce the distribution: with five or more in the pool, someone must take the 3.25."
 zg361_ratio_strict_decision_tooltip:0 "Set this review unit's forced bottom quota to 10%."
 zg361_ratio_strict_decision_confirm:0 "Stay strict."
 zg361_ratio_relaxed_decision:0 "Bottom Quota: Relaxed (5%)"
 zg361_ratio_relaxed_decision_desc:0 "Keep the 361 grading, but loosen the rigid bottom-10 quota."
 zg361_ratio_relaxed_decision_tooltip:0 "Set this review unit's forced bottom quota to 5%."
 zg361_ratio_relaxed_decision_confirm:0 "Loosen it."
 zg361_ratio_off_decision:0 "Bottom Quota: Hands-off (0%)"
 zg361_ratio_off_decision_desc:0 "No forced bottom tier. The review becomes a formality."
 zg361_ratio_off_decision_tooltip:0 "Remove the forced bottom quota from this review unit."
 zg361_ratio_off_decision_confirm:0 "Hands off."
 # Character interactions
 zg361_appeal_interaction:0 "Appeal Performance Review"
 zg361_appeal_interaction_desc:0 "Formally appeal this cycle's review result and demand a re-evaluation. Costs 150 influence."
 zg361_review_talk_interaction:0 "Performance Talk"
 zg361_review_talk_interaction_desc:0 "Hold a one-on-one performance talk with a vassal whose result has been posted this cycle. Calms nerves."
 zg361_recommend_interaction:0 "Recommend"
 zg361_recommend_interaction_desc:0 "Recommend this peer's record to your shared direct liege: +10 to their next review."
 zg361_slander_interaction:0 "Slander"
 zg361_slander_interaction_desc:0 "File a venomous memorial against this peer: 70% chance of -15 to their next review; if seen through, it backfires on you."
 zg361_purge_interaction:0 "Bottom-Tier Disposition: Strip Title"
 zg361_purge_interaction_desc:0 "Execute bottom-tier elimination on an official with two consecutive 3.25s: strip office (lawful cause, no tyranny)."
 zg361_force_retire_interaction:0 "Bottom-Tier Disposition: Forced Retirement"
 zg361_force_retire_interaction_desc:0 "Grant an official with two consecutive 3.25s a dignified exit: forced retirement, merit intact."
 # Modifiers (grades)
 zg361_grade_375:0 "Performance 3.75 · Exceeds Expectations"
 zg361_grade_375_desc:0 "This cycle's result: 3.75. Results, difficulty and impact clearly exceeded the expectations of the current rank. Promotion nomination granted."
 zg361_grade_35:0 "Performance 3.5 · Meets Expectations"
 zg361_grade_35_desc:0 "This cycle's result: 3.5. You did the job your rank requires. Good work. Keep it up."
 zg361_grade_325:0 "Performance 3.25 · Needs Improvement"
 zg361_grade_325_desc:0 "This cycle's result: 3.25. Fourfold consequence: local treasury -50, personal gold -25, merit -60 where supported, and salary -25% for one year where applicable."
 zg361_pip:0 "Performance Improvement Plan"
 zg361_pip_desc:0 "Placed on a Performance Improvement Plan (PIP). Two consecutive 3.25 cycles trigger the bottom-tier elimination process."
 zg361_demoted:0 "Demoted but Retained"
 zg361_demoted_desc:0 "Lenient elimination outcome: demoted and retained, salary halved. We will see how next cycle goes."
 zg361_promotion_track:0 "Promotion Track"
 zg361_promotion_track_desc:0 "Two consecutive 3.75 cycles: the promotion track is open. Appointment candidate score greatly increased; merit level cap temporarily raised."
 # Opinions
 zg361_favored:0 "Liege's Favor"
 zg361_poor_review:0 "Poor Review"
 zg361_annoyed:0 "Tiresome Appeals"
 zg361_purged:0 "Eliminated as Bottom Tier"
 zg361_forced_retire:0 "Forced into Retirement"
 zg361_merciful:0 "Shown Mercy"
 zg361_rigged:0 "Rigged Review"
 zg361_appeal_rejected:0 "Appeal Rejected"
 zg361_talked:0 "Performance Talk"
 zg361_slandered_me:0 "Malicious Slander"
 zg361_jingcha_attended:0 "Attended the Grand Evaluation"
 # Activity
 activity_zg361_jingcha:0 "Grand Administrative Evaluation"
 activity_zg361_jingcha_desc:0 "Summon your direct incumbent officials to your seat and review their records in person. When the assembly concludes, the rankings are posted immediately."
 activity_zg361_jingcha_host_desc:0 "Preside over the Grand Administrative Evaluation, review your direct officials face to face, and post the rankings at its conclusion."
 activity_zg361_jingcha_guest_desc:0 "Travel to your direct liege's seat and face their evaluation in person."
 activity_zg361_jingcha_selection_tooltip:0 "Summon your direct incumbent officials to your seat for evaluation."
 activity_zg361_jingcha_conclusion_desc:0 "The Grand Administrative Evaluation has concluded, and the results are posted."
 zg361_jingcha_province_desc:0 "Hold the Grand Administrative Evaluation at your seat."
 zg361_jingcha_phase:0 "Evaluation"
 # Events
 zg361.1.t:0 "Review You Conducted: Roster Finalized"
 zg361.1.desc:0 "This is the performance review you conducted for your direct officials, not your own rating from a superior. The evaluation bureau has finalized the roster under this tier's current bottom-quota rule.\n\nThis cycle: [TopScope.GetValue('zg361_n_375')|0] exceeded expectations, [TopScope.GetValue('zg361_n_35')|0] met them, [TopScope.GetValue('zg361_n_325')|0] must improve; [TopScope.GetValue('zg361_n_elim')|0] now face bottom-tier elimination.\n\nIf a superior evaluates you, a separate writ will state your grade, KPI, and rank explicitly."
 zg361.1.a:0 "Noted."
 zg361.2.t:0 "Superior's Rating: 3.75 · Exceeds Expectations"
 zg361.2.desc:0 "[zg361_reviewing_superior.GetShortUIName] has assigned your rating for this review.\n\nYour grade: 3.75 (exceeds expectations)\nKPI: [TopScope.GetValue('zg361_result_kpi')|0]   Cohort rank: [TopScope.GetValue('zg361_result_rank')|0] of [TopScope.GetValue('zg361_result_cohort_n')|0]\n\nYour results, difficulty, and scope of impact exceeded your current rank. Merit, local-treasury, and nomination rewards are applied where your post and institutions support them."
 zg361.2.a:0 "Thank you for your guidance, my liege!"
 zg361.3.t:0 "Superior's Rating: 3.5 · Meets Expectations"
 zg361.3.desc:0 "[zg361_reviewing_superior.GetShortUIName] has assigned your rating for this review.\n\nYour grade: 3.5 (meets expectations)\nKPI: [TopScope.GetValue('zg361_result_kpi')|0]   Cohort rank: [TopScope.GetValue('zg361_result_rank')|0] of [TopScope.GetValue('zg361_result_cohort_n')|0]\n\nYou did the work your rank requires. Nothing more, nothing less."
 zg361.3.a:0 "...Keeping it up."
 zg361.4.t:0 "Superior's Rating: 3.25 · Needs Improvement"
 zg361.4.desc:0 "[zg361_reviewing_superior.GetShortUIName] has assigned your rating for this review.\n\nYour grade: 3.25 (needs improvement)\nKPI: [TopScope.GetValue('zg361_result_kpi')|0]   Cohort rank: [TopScope.GetValue('zg361_result_rank')|0] of [TopScope.GetValue('zg361_result_cohort_n')|0]\n\nYou are below the bar for your post. Fourfold settlement applies: 50 from the local treasury when present, 25 personal gold, 60 merit where supported, and a 25% salary cut for one year where applicable. A Performance Improvement Plan begins; one more 3.25 means bottom-tier elimination."
 zg361.4.a:0 "Accept it. (Stress reduced)"
 zg361.4.b:0 "Appeal! This review is rigged! (Costs 150 influence, 30% chance to overturn)"
 zg361.4.c:0 "Give up. Just coast. (Stress reduced, -10 to next year's review)"
 zg361.4.d:0 "Grind. Let next year's results speak. (Stress increased, +10 to next year's review)"
 zg361.5.t:0 "Bottom-Tier Elimination List"
 zg361.5.desc:0 "This cycle, [TopScope.GetValue('zg361_n_elim')|0] officials have scored 3.25 twice in a row and are due for bottom-tier elimination. The list lies on your desk; the vermilion brush is in your hand. (You may also dispose of them one by one from the court view.)\n\nHow will you dispose of them?"
 zg361.5.a:0 "By the book. (Each is judged by record, favor and ability: purge, forced retirement, or demotion)"
 zg361.5.b:0 "Show mercy — demote them all, but keep them. (-100 prestige)"
 zg361.5.c:0 "Grant one more year of observation. (-50 prestige, the court is grateful)"
 zg361.6.t:0 "You Are on the Elimination List"
 zg361.6.desc:0 "Two consecutive 3.25s, and the blade of bottom-tier elimination has finally fallen on you. Your liege's officers have already set out with the roster.\n\nYou have one last window."
 zg361.6.a:0 "Final appeal! Demand a re-review! (Costs 200 influence, 40% chance to be demoted instead — failure means losing your title)"
 zg361.6.b:0 "Spend your fortune on the right palms. (Costs 300 gold, demoted but retained)"
 zg361.6.c:0 "Accept retirement with dignity."
 zg361.6.d:0 "Rise up! (Found an independence faction against your liege)"
 zg361.10.t:0 "Performance Calibration Meeting"
 zg361.10.desc:0 "The ministry's draft roster lies on your desk: [TopScope.GetValue('zg361_n_375')|0] marked as exceeding expectations, [TopScope.GetValue('zg361_n_35')|0] meeting them, [TopScope.GetValue('zg361_n_325')|0] needing improvement.\n\nBefore the results are posted, the brush is still yours. Lift someone up, push someone down — but if the court catches wind of tampering, they will call it what it is: a rigged review."
 zg361.10.a:0 "The list is correct. Post it."
 zg361.10.b:0 "Lift one up: swap the lowest 3.75 with the highest 3.5."
 zg361.10.c:0 "Push one down: drop the lowest 3.5 into 3.25."
 zg361.11.t:0 "The Vermilion Brush Has Fallen"
 zg361.11.desc:0 "You lift the vermilion brush and gently move a name up the list. The one pushed down will never know their liege changed course overnight."
 zg361.11.a:0 "Post the results."
 zg361.12.t:0 "The Vermilion Brush Has Fallen"
 zg361.12.desc:0 "You lift the vermilion brush and add a name at the edge of the list. Someone has to take this 3.25 — why not him?"
 zg361.12.a:0 "Post the results."
 zg361.20.t:0 "Performance Review"
 zg361.20.desc:0 "The performance review is underway."
 zg361.20.a:0 "Continue."
 zg361.30.t:0 "Wild Dogs and White Rabbits"
 zg361.30.desc:0 "The evaluation bureau appended a second page to its confidential memorial: [TopScope.GetValue('zg361_n_dog')|0] \"wild dogs\" — stellar results, rotten values; and [TopScope.GetValue('zg361_n_rabbit')|0] \"white rabbits\" — loyal to a fault, hopeless at the job.\n\nNeither kind is a long-term keeper. What is your pleasure?"
 zg361.30.a:0 "Balanced mercy: keep the wild dogs under watch, comfort the rabbits."
 zg361.30.b:0 "Punish the wild dogs and retire the rabbits. (+50 prestige; wild dogs lose merit and enter a PIP, rabbits are retired)"
 zg361_scoreboard_open:0 "Performance Board"
 zg361_scoreboard_open_tooltip:0 "Open the latest published official performance board."
 zg361_scoreboard_title:0 "Celestial Official Performance Board"
 zg361_scoreboard_year:0 "Review Year"
 zg361_scoreboard_total:0 "Cohort"
 zg361_scoreboard_grade_375:0 "#P 3.75#!"
 zg361_scoreboard_grade_35:0 "#V 3.5#!"
 zg361_scoreboard_grade_325:0 "#N 3.25#!"
 zg361_scoreboard_dash:0 "—"
 zg361_scoreboard_status_promotion:0 "#P Promotion Track#!"
 zg361_scoreboard_status_pip:0 "#N PIP#!"
 zg361_scoreboard_col_rank:0 "Rank"
 zg361_scoreboard_col_official:0 "Official / Office"
 zg361_scoreboard_col_kpi:0 "KPI"
 zg361_scoreboard_col_values:0 "Values"
 zg361_scoreboard_col_grade:0 "Rating"
 zg361_scoreboard_col_streak:0 "Streak"
 zg361_scoreboard_col_status:0 "Status"
 zg361_scoreboard_hint:0 "Select an official to open their character view. The latest published roster retains officials who later left office."
 zg361_scoreboard_tab_managed:0 "Officials You Review"
 zg361_scoreboard_tab_received:0 "Your Review Cohort"
 zg361_scoreboard_reviewer:0 "Reviewing Liege"
 zg361_scoreboard_former_official:0 "Former official (retained on this published board)"
 zg361_jingcha_phase_desc:0 "Direct officials report on their work while their liege reviews the records in person."
 activity_zg361_jingcha_destination_selection:0 "Choose the Evaluation Venue"
 activity_zg361_jingcha_guest_help_text:0 "Direct incumbent officials will be invited to their liege's seat for evaluation."
 activity_zg361_jingcha_cooldown:0 "The Grand Administrative Evaluation is on cooldown"
 activity_zg361_jingcha_predicted_cost:0 "The Grand Administrative Evaluation is a statutory duty and costs neither Treasury wealth nor personal gold."
 activity_zg361_jingcha_host_an_a:0 "$host_activity_a$"
 zg361_refused_jingcha:0 "Refused the Grand Evaluation"
 zg361.40.t:0 "The Evaluation Comes Due"
 zg361.40.desc:0 "The registers, accounts, and records of merit are ready. By law, I must summon my direct incumbent officials to my seat for a Grand Administrative Evaluation, without charging either the Treasury or my private purse.\n\nIf I defy this duty, my direct superior will record a major failure of governance. If I have no superior, the institution itself will lose standing."
 zg361.40.a:0 "Hold the evaluation as required"
 zg361.40.a.tt:0 "Open the free activity planner. The evaluation must conclude within 300 days; merely opening and closing the planner does not fulfill the duty."
 zg361.40.b:0 "I will not hold it this year"
 zg361.40.b.tt:0 "With a direct superior: their Opinion of you falls, and your next review receives a one-use KPI penalty of 50.\nAs an independent top liege: lose 200 Prestige, with no fabricated self-review."
 zg361.41.t:0 "Evaluation Overdue"
 zg361.41.desc:0 "The deadline for the Grand Administrative Evaluation has passed without its conclusion."
 zg361.41.a:0 "The compliance record is settled"
 # v0.4 phase-two first slice: KPI evidence, formal service, personal statement
 zg361_view_result_statement_decision:0 "View Personal Review Statement"
 zg361_view_result_statement_decision_desc:0 "Reopen your latest frozen review case: its factual band, final grade, itemized KPI evidence, service status, and actual settlement receipts."
 zg361_view_result_statement_decision_tooltip:0 "View your latest personal review statement without recalculating it."
 zg361_view_result_statement_decision_confirm:0 "Open the case file"
 zg361.50.t:0 "3.25 Performance Notice: Signature Requested"
 zg361.50.desc:0 "[zg361_reviewing_superior.GetShortUIName] has served your formal performance notice.\n\nFinal grade: 3.25 (needs improvement)\nFrozen KPI: [TopScope.GetValue('zg361_notice_kpi')|0]   Cohort rank: [TopScope.GetValue('zg361_notice_rank')|0] of [TopScope.GetValue('zg361_notice_cohort')|0]\nFactual-band code: [TopScope.GetValue('zg361_notice_absolute_grade')|0] (3=3.75, 2=3.5, 1=3.25)\n\nYou may sign, or sign while recording an objection. Refusing the signature changes only the route to witnessed service seven days later; it does not erase the grade, PIP, or fourfold settlement. The system's favorite sentence is ready: you may disagree, but the notice can still show as delivered."
 zg361.50.a:0 "Acknowledge it. Received does not mean enjoyed."
 zg361.50.b:0 "Acknowledge with an objection. Signature is not consent."
 zg361.50.c:0 "Refuse to sign. (Witnessed service in seven days)"
 zg361.51.t:0 "3.25 Performance Notice: Witnessed Service"
 zg361.51.desc:0 "Witnessed service after refusal has been processed."
 zg361.52.t:0 "Performance Appeal Clock"
 zg361.52.desc:0 "The formal appeal window for this case has expired."
 zg361.53.t:0 "Personal Performance Settlement Statement"
 zg361.53.desc:0 "Review owner: [zg361_reviewing_superior.GetShortUIName]\nFrozen KPI: [TopScope.GetValue('zg361_stmt_kpi')|0]   Cohort rank: [TopScope.GetValue('zg361_stmt_rank')|0] of [TopScope.GetValue('zg361_stmt_cohort')|0]"
 zg361.53.absolute_375:0 "\n#bold Factual band: 3.75 (absolute facts exceed expectations)#!"
 zg361.53.absolute_35:0 "\n#bold Factual band: 3.5 (absolute facts meet expectations)#!"
 zg361.53.absolute_325:0 "\n#bold Factual band: 3.25 (absolute facts need improvement)#!"
 zg361.53.grade_375:0 "Final grade: #P 3.75 (exceeds expectations)#!"
 zg361.53.grade_35:0 "Final grade: #V 3.5 (meets expectations)#!"
 zg361.53.grade_325:0 "Final grade: #N 3.25 (needs improvement)#!"
 zg361.53.reason_0:0 "Grade reason: the factual band and final grade agree."
 zg361.53.reason_1:0 "Grade reason: calibration displaced you from a 3.75 slot."
 zg361.53.reason_2:0 "Grade reason: calibration raised you into a 3.75 slot."
 zg361.53.reason_3:0 "Grade reason: calibration moved you into 3.25."
 zg361.53.reason_4:0 "Grade reason: calibration rescued you from a 3.25 slot."
 zg361.53.reason_5_c:0 "Grade reason: #N your facts met the bar, but mandatory distribution needed a C and quota made you carry it.#!"
 zg361.53.reason_5:0 "Grade reason: mandatory distribution lowered your final band below the factual band."
 zg361.53.reason_6:0 "Grade reason: newcomer protection prevented an immediate C this cycle."
 zg361.53.reason_7:0 "Grade reason: rank and quota lifted you above your factual band."
 zg361.53.reason_8:0 "Grade reason: a one-to-two-person cohort bypassed forced distribution, so the final grade was neutralized to 3.5."
 zg361.53.evidence:0 "\n#bold Itemized KPI evidence#!\nGovernance [TopScope.GetValue('zg361_stmt_governance')|0]   Capability [TopScope.GetValue('zg361_stmt_capability')|0]   Growth [TopScope.GetValue('zg361_stmt_growth')|0]   Superior [TopScope.GetValue('zg361_stmt_superior')|0]\nValues [TopScope.GetValue('zg361_stmt_values')|0]   Collaboration [TopScope.GetValue('zg361_stmt_collaboration')|0]   Jingcha [TopScope.GetValue('zg361_stmt_jingcha')|0]   Organization [TopScope.GetValue('zg361_stmt_organization')|0]\nFrozen values score [TopScope.GetValue('zg361_stmt_values_score')|0]"
 zg361.53.service:0 "\n#bold Service record#!\nMethod code [TopScope.GetValue('zg361_stmt_delivery_method')|0] (1 acknowledged, 2 objection, 3 witnessed, 4 automatic)   Service year [TopScope.GetValue('zg361_stmt_delivered_year')|0]   Appeal-open flag [TopScope.GetValue('zg361_stmt_appeal_open')|0]"
 zg361.53.receipts:0 "\n#bold Fourfold settlement receipts#!\nPaid: local treasury [TopScope.GetValue('zg361_stmt_treasury_paid')|0]   personal gold [TopScope.GetValue('zg361_stmt_gold_paid')|0]   merit [TopScope.GetValue('zg361_stmt_merit_paid')|0]   salary-cut flag [TopScope.GetValue('zg361_stmt_salary_cut')|0]\nRefunded: local treasury [TopScope.GetValue('zg361_stmt_treasury_refunded')|0]   personal gold [TopScope.GetValue('zg361_stmt_gold_refunded')|0]   merit [TopScope.GetValue('zg361_stmt_merit_refunded')|0]"
 zg361.53.state_1:0 "\nCase state: prepared for service; no fourfold settlement has posted yet."
 zg361.53.state_2:0 "\nCase state: signature refused, awaiting witnessed service; refusal cannot erase the grade."
 zg361.53.state_3:0 "\nCase state: formally served/published; every applicable settlement has posted idempotently."
 zg361.53.state_4:0 "\nCase state: appeal window expired without correction."
 zg361.53.state_5:0 "\nCase state: #P corrected to 3.5; fixed penalties were refunded once from receipts and future salary withholding stopped.#!"
 zg361.53.a:0 "Close the case file."
