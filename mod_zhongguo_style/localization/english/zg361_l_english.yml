l_english:
 # Game rules
 rule_zg361_enabled:0 "Vassal Performance Review (361 System)"
 setting_zg361_on:0 "Enabled"
 setting_zg361_on_desc:0 "Celestial rulers of duke tier or above review their direct incumbent officials, sorting them into 3.75 / 3.5 / 3.25; counts and barons are reviewed but do not run reviews."
 setting_zg361_off:0 "Disabled"
 setting_zg361_off_desc:0 "Disables the performance review system."
 rule_zg361_frequency:0 "Review Cycle"
 setting_zg361_freq_yearly:0 "Annual Review"
 setting_zg361_freq_yearly_desc:0 "One performance season every year."
 setting_zg361_freq_three_year:0 "Triennial Review"
 setting_zg361_freq_three_year_desc:0 "One grand evaluation every three years, in the old style."
 rule_zg361_bottom_ratio:0 "Bottom Quota"
 setting_zg361_ratio_strict:0 "Strict 361 (10%)"
 setting_zg361_ratio_strict_desc:0 "Bottom slots are floor(10% of the cohort), with at least one 3.25 once the cohort reaches five."
 setting_zg361_ratio_relaxed:0 "Relaxed (5%)"
 setting_zg361_ratio_relaxed_desc:0 "Bottom slots are floor(5% of the cohort), with no minimum; cohorts below twenty have no forced bottom slot."
 setting_zg361_ratio_off:0 "Hands-off (0%)"
 setting_zg361_ratio_off_desc:0 "No forced bottom tier. The review becomes a formality."
 # Decision group & decisions
 decision_group_type_zg361:0 "Performance Review"
 zg361_review_now_decision:0 "Conduct Performance Review Now"
 zg361_review_now_decision_desc:0 "Start this year's review now and freeze the direct-official roster. Self review, peer evidence, calibration, and publication follow in later stages; results usually arrive about six months later. Starts must be at least one year apart, and only one review may settle per calendar year."
 zg361_review_now_decision_tooltip:0 "Start the review and freeze at least one direct incumbent official; this does not create an immediate ranking."
 zg361_review_now_decision_confirm:0 "Start the review"
 zg361_ratio_strict_decision:0 "Bottom Quota: Strict 361 (10%)"
 zg361_ratio_strict_decision_desc:0 "Enforce the distribution: with five or more in the pool, someone must take the 3.25."
 zg361_ratio_strict_decision_tooltip:0 "Set this review unit's forced bottom quota to 10%."
 zg361_ratio_strict_decision_confirm:0 "Use a 10% forced-bottom quota"
 zg361_ratio_relaxed_decision:0 "Bottom Quota: Relaxed (5%)"
 zg361_ratio_relaxed_decision_desc:0 "Bottom slots are floor(5%) with no minimum; a cohort below twenty gets zero forced bottom slots."
 zg361_ratio_relaxed_decision_tooltip:0 "Set this tier's bottom share to floor(5%) for the next quota calculation."
 zg361_ratio_relaxed_decision_confirm:0 "Use a 5% forced-bottom quota"
 zg361_ratio_off_decision:0 "Bottom Quota: Hands-off (0%)"
 zg361_ratio_off_decision_desc:0 "No forced bottom tier. The review becomes a formality."
 zg361_ratio_off_decision_tooltip:0 "Remove the forced bottom quota from this review unit."
 zg361_ratio_off_decision_confirm:0 "Disable the forced-bottom quota"
 # Character interactions
 zg361_appeal_interaction:0 "Appeal Performance Review"
 zg361_appeal_interaction_desc:0 "Formally appeal this cycle's review result and demand a re-evaluation. Costs 150 influence."
 zg361_review_talk_interaction:0 "Performance Talk"
 zg361_review_talk_interaction_desc:0 "Meet privately with a vassal whose result was posted this cycle, explain the rating, and ease the tension."
 zg361_recommend_interaction:0 "Recommend"
 zg361_recommend_interaction_desc:0 "During this cycle's independent peer window, submit one named positive record for an official in the same live war, side, case, and slot. Duplicates are barred; only a successful submission changes collaboration, facts, and credibility, charges cost, or starts cooldown."
 zg361_slander_interaction:0 "Slander"
 zg361_slander_interaction_desc:0 "During this cycle's independent peer window, submit one named negative record for an official in the same live war, side, case, and slot. Duplicates are barred; only a successful submission changes collaboration, facts, and credibility or charges Prestige."
 zg361_peer_submission_invalid_tt:0 "Both officials must belong to the same active review case and the same side of one live war; the peer window must be open, capacity available, and no prior record may exist from this evaluator. A denunciation also requires at least 50 Prestige."
 zg361_purge_interaction:0 "Bottom-Tier Disposition: Strip Title"
 zg361_purge_interaction_desc:0 "Execute bottom-tier elimination on an official with two consecutive 3.25s: strip office (lawful cause, no tyranny)."
 zg361_force_retire_interaction:0 "Bottom-Tier Disposition: Forced Retirement"
 zg361_force_retire_interaction_desc:0 "Grant an official with two consecutive 3.25s a dignified exit: forced retirement, merit intact."
 zg361_adverse_action_appeal_pending_tt:0 "The official must still be this cycle's adverse-action candidate, with no unresolved appeal or separate review."
 # Modifiers (grades)
 zg361_grade_375:0 "Performance 3.75 · Exceeds Expectations"
 zg361_grade_375_desc:0 "This cycle's result: 3.75. Results, difficulty and impact clearly exceeded the expectations of the current rank. Promotion nomination granted."
 zg361_grade_35:0 "Performance 3.5 · Meets Expectations"
 zg361_grade_35_desc:0 "This cycle's result: 3.5. You completed the duties of your rank and met expectations."
 zg361_grade_325:0 "Performance 3.25 · Needs Improvement"
 zg361_grade_325_desc:0 "This cycle's result: 3.25. Fourfold consequence: local treasury -50, personal gold -25, merit -60 where supported, and salary -25% for one year where applicable."
 zg361_pip:0 "Performance Improvement Plan"
 zg361_pip_desc:0 "Rated 3.25 this cycle; another bottom-band result next cycle triggers elimination review."
 zg361_demoted:0 "Demoted but Retained"
 zg361_demoted_desc:0 "A lenient outcome keeps the official in service at a lower rank and half salary, pending the next review."
 zg361_promotion_track:0 "Promotion Track"
 zg361_promotion_track_desc:0 "After two consecutive 3.75 ratings, appointment candidacy rises sharply and the merit-rank cap increases temporarily."
 # Opinions
 zg361_favored:0 "Liege's Favor"
 zg361_poor_review:0 "Poor Review"
 zg361_annoyed:0 "Tiresome Appeals"
 zg361_purged:0 "Eliminated as Bottom Tier"
 zg361_forced_retire:0 "Forced into Retirement"
 zg361_merciful:0 "Shown Mercy"
 zg361_rigged:0 "Rigged Review"
 zg361_appeal_rejected:0 "Appeal Rejected"
 zg361_talked:0 "Performance Talk"
 zg361_slandered_me:0 "Malicious Slander"
 zg361_jingcha_attended:0 "Attended the Grand Evaluation"
 # Activity
 activity_zg361_jingcha:0 "Grand Administrative Evaluation"
 activity_zg361_jingcha_desc:0 "Summon direct incumbent officials, review their records in person, and discharge the Jingcha duty. The review season continues through its later stages after the activity."
 activity_zg361_jingcha_host_desc:0 "Preside over the evaluation and review direct officials in person; ending the activity does not create the final ranking immediately."
 activity_zg361_jingcha_guest_desc:0 "Travel to your direct liege's seat and face their evaluation in person."
 activity_zg361_jingcha_selection_tooltip:0 "Summon your direct incumbent officials to your seat for evaluation."
 activity_zg361_jingcha_conclusion_desc:0 "The Jingcha duty has concluded and its record is filed; calibration and publication continue separately."
 zg361_jingcha_province_desc:0 "Hold the Grand Administrative Evaluation at your seat."
 zg361_jingcha_phase:0 "Evaluation"
 # Events
 zg361.1.t:0 "Review You Conducted: Roster Finalized"
 zg361.1.desc:0 "This is the performance review you conducted for your direct officials, not your own rating from a superior. The evaluation bureau has finalized the roster under this tier's current bottom-quota rule.\n\nThis cycle: [TopScope.GetValue('zg361_n_375')|0] exceeded expectations, [TopScope.GetValue('zg361_n_35')|0] met them, [TopScope.GetValue('zg361_n_325')|0] must improve; [TopScope.GetValue('zg361_n_elim')|0] now face bottom-tier elimination.\n\nIf a superior evaluates you, a separate writ will state your grade, KPI, and rank explicitly."
 zg361.1.a:0 "Noted."
 zg361.2.t:0 "Superior's Rating: 3.75 · Exceeds Expectations"
 zg361.2.desc:0 "This review has reached a final rating; the reviewer is [zg361_reviewing_superior.GetShortUIName].\n\nYour grade: 3.75 (exceeds expectations)\nPerformance score: [TopScope.GetValue('zg361_result_kpi')|0]   Cohort rank: [TopScope.GetValue('zg361_result_rank')|0] of [TopScope.GetValue('zg361_result_cohort_n')|0]\n\nYour results, difficulty, and scope of impact exceeded your current rank. Merit, local-treasury, and nomination rewards are applied where your post and institutions support them."
 zg361.2.a:0 "Thank you for your guidance, my liege!"
 zg361.3.t:0 "Superior's Rating: 3.5 · Meets Expectations"
 zg361.3.desc:0 "This review has reached a final rating; the reviewer is [zg361_reviewing_superior.GetShortUIName].\n\nYour grade: 3.5 (meets expectations)\nPerformance score: [TopScope.GetValue('zg361_result_kpi')|0]   Cohort rank: [TopScope.GetValue('zg361_result_rank')|0] of [TopScope.GetValue('zg361_result_cohort_n')|0]\n\nYou completed the work expected of your current rank."
 zg361.3.a:0 "...Keeping it up."
 zg361.4.t:0 "Superior's Rating: 3.25 · Needs Improvement"
 zg361.4.desc:0 "This review has reached a final rating; the reviewer is [zg361_reviewing_superior.GetShortUIName].\n\nYour grade: 3.25 (needs improvement)\nPerformance score: [TopScope.GetValue('zg361_result_kpi')|0]   Cohort rank: [TopScope.GetValue('zg361_result_rank')|0] of [TopScope.GetValue('zg361_result_cohort_n')|0]\n\nYou are below the bar for your post. Fourfold settlement applies: 50 from the local treasury when present, 25 personal gold, 60 merit where supported, and a 25% salary cut for one year where applicable. A Performance Improvement Plan begins; one more 3.25 means bottom-tier elimination."
 zg361.4.a:0 "Accept it. (Stress reduced)"
 zg361.4.b:0 "Appeal! This review is wrong! (Costs 150 influence; 30% base chance, 40% with strong evidence)"
 zg361.4.c:0 "Give up. Just coast. (Stress reduced, -10 to next year's review)"
 zg361.4.d:0 "Grind. Let next year's results speak. (Stress increased, +10 to next year's review)"
 zg361.5.t:0 "Bottom-Tier Elimination List"
 zg361.5.desc:0 "This cycle, [TopScope.GetValue('zg361_n_elim')|0] officials have scored 3.25 twice in a row and are due for bottom-tier elimination. The list lies on your desk; the vermilion brush is in your hand. (You may also dispose of them one by one from the court view.)\n\nHow will you dispose of them?"
 zg361.5.a:0 "By the book. (Each is judged by record, favor and ability: purge, forced retirement, or demotion)"
 zg361.5.b:0 "Show mercy — demote them all, but keep them. (-100 prestige)"
 zg361.5.c:0 "Use leniency: observe those below three strikes for another year; demote three-strike cases now. (-50 prestige)"
 zg361.6.t:0 "You Are on the Elimination List"
 zg361.6.desc:0 "Two consecutive 3.25s, and the blade of bottom-tier elimination has finally fallen on you. Your liege's officers have already set out with the roster.\n\nYou have one last window."
 zg361.6.a:0 "Final appeal! Demand a re-review! (Costs 200 influence, 40% chance to be demoted instead — failure means losing your title)"
 zg361.6.b:0 "Spend your fortune on the right palms. (Costs 300 gold, demoted but retained)"
 zg361.6.c:0 "Accept retirement with dignity."
 zg361.6.d:0 "Rise up! (Found an independence faction against your liege)"
 zg361.10.t:0 "Performance Calibration Meeting"
 zg361.10.desc:0 "The ministry's draft roster lies on your desk: [TopScope.GetValue('zg361_n_375')|0] marked as exceeding expectations, [TopScope.GetValue('zg361_n_35')|0] meeting them, [TopScope.GetValue('zg361_n_325')|0] needing improvement.\n\nBefore the results are posted, the brush is still yours. Lift someone up, push someone down — but if the court catches wind of tampering, they will call it what it is: a rigged review."
 zg361.10.a:0 "The list is correct. Post it."
 zg361.10.b:0 "Lift one up: swap the lowest 3.75 with the highest 3.5."
 zg361.10.c:0 "Push one down: drop the lowest 3.5 into 3.25."
 zg361.11.t:0 "The Vermilion Brush Has Fallen"
 zg361.11.desc:0 "You lift the vermilion brush and gently move a name up the list. The one pushed down will never know their liege changed course overnight."
 zg361.11.a:0 "Post the results."
 zg361.12.t:0 "The Vermilion Brush Has Fallen"
 zg361.12.desc:0 "You lift the vermilion brush and add a name at the edge of the list. Someone has to take this 3.25 — why not him?"
 zg361.12.a:0 "Post the results."
 zg361.30.t:0 "Wild Dogs and White Rabbits"
 zg361.30.desc:0 "The evaluation bureau appended a second page to its confidential memorial: [TopScope.GetValue('zg361_n_dog')|0] \"wild dogs\" — stellar results, rotten values; and [TopScope.GetValue('zg361_n_rabbit')|0] \"white rabbits\" — loyal to a fault, hopeless at the job.\n\nNeither kind is a long-term keeper. What is your pleasure?"
 zg361.30.a:0 "Keep the present outcome: open no separate watch case for wild dogs this cycle, and comfort the rabbits."
 zg361.30.b:0 "Punish the wild dogs and retire the rabbits. (+50 prestige; wild dogs lose merit and enter a performance improvement plan, rabbits are retired)"
