 zg361_mechanism_choice_b_tt:0 "Sprint route: improves the immediate result while carrying risk, burnout, technical debt, or appeal debt into later reviews."
 zg361_mechanism_choice_c_tt:0 "Deferral route: saves effort now but records policy debt that feeds your own superior's next review."
