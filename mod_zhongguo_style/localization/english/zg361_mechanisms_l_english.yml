 zg361m.1.t:0 "No.001 · Itemized KPI Evidence Sheet"
 zg361m.1.desc:0 "[A / P0] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.1.a:0 "Build an itemized evidence sheet, freeze cases for output, efficiency, growth, collaboration, and values, and fund the filing and review work."
 zg361m.1.b:0 "Set the rating immediately from the total score and the superior's impression, publishing fast while leaving omissions and errors hard to trace."
 zg361m.1.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.2.t:0 "No.002 · Annual OKR Direction and KPI Compact"
 zg361m.2.desc:0 "[A / P0] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.2.a:0 "Freeze role-specific direction, baselines, and normal targets, allowing one evidence-backed crisis reset at the cost of continuous tracking."
 zg361m.2.b:0 "Impose aggressive targets across units and hold the original line, buying a short sprint at the risk of metric gaming and concealed trouble."
 zg361m.2.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.3.t:0 "No.003 · Mid-Cycle Check-in and Target Reset"
 zg361m.3.desc:0 "[A / P1] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.3.a:0 "Run a mid-cycle coaching review, record risks and resources, and permit one documented crisis reset, spending management time for an explainable final rating."
 zg361m.3.b:0 "Keep the opening targets and demand a deadline catch-up, avoiding reset work but risking personal blame for strategy changes and delayed bad-news reporting."
 zg361m.3.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.4.t:0 "No.004 · Self-Assessment and Perception Gap"
 zg361m.4.desc:0 "[A / P1] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.4.a:0 "Require a self-rating backed by representative results and have the superior answer each perception gap, accepting discussion cost for a reviewable record."
 zg361m.4.b:0 "Take a one-page self-pitch and rapidly adjust the subjective score for boasting or modesty, saving time while confusing presentation with performance."
 zg361m.4.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.5.t:0 "No.005 · Role-Specific Scorecards"
 zg361m.5.desc:0 "[A / P1] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.5.a:0 "Freeze distinct weights for governance, military, fiscal, and management roles before calibrating the same direct cohort, accepting the cost of multiple scorecards."
 zg361m.5.b:0 "Force-rank every role on one results table for fast execution, systematically disadvantaging hard-to-measure work and amplifying role mismatch."
 zg361m.5.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.6.t:0 "No.006 · Starting-Point and Difficulty Adjustment"
 zg361m.6.desc:0 "[A / P2] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.6.a:0 "Freeze inherited baselines, resources, and role difficulty and allow only capped adjustments, spending audit work to make comparisons fairer."
 zg361m.6.b:0 "Judge only absolute year-end results and push richer units harder, producing a fast table while rewarding inherited wealth and punishing clean-up work."
 zg361m.6.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.7.t:0 "No.007 · Back-to-Back 360 Review Invitations"
 zg361m.7.desc:0 "[B / P0] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.7.a:0 "Invite a small set of genuine collaborators, require concrete cases, and cross-check them, paying the administrative cost of solicitation and deduplication."
 zg361m.7.b:0 "Solicit broadly and weight high and low votes immediately, amplifying signal quickly while inviting reciprocal praise, retaliation, and boilerplate feedback."
 zg361m.7.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.8.t:0 "No.008 · Rater Leniency and Peer Credibility"
 zg361m.8.desc:0 "[B / P1] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.8.a:0 "Maintain each rater's historical mean, variance, overturn rate, and accuracy and calibrate their weight, accepting long-term data-governance cost."
 zg361m.8.b:0 "Accept raw peer ratings this cycle and punish distorters only after appeals, settling quickly while lenient and harsh raters shape the ranking first."
 zg361m.8.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.9.t:0 "No.009 · Calibration Meeting Dashboard"
 zg361m.9.desc:0 "[B / P0] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.9.a:0 "Display KPI, values, goals, 360 feedback, trends, and appeal evidence together, and record every rating move as a quota-neutral swap."
 zg361m.9.b:0 "Close the table in one meeting using current totals and remaining quotas, moving fast while squeezing out boundary cases and invisible contributions."
 zg361m.9.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.10.t:0 "No.010 · Assigning the C and Protecting a Subordinate"
 zg361m.10.desc:0 "[B / P0] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.10.a:0 "Choose the bottom rating from frozen evidence; if the manager protects someone, charge prestige and next-cycle management KPI openly, preserving trust at a real institutional cost."
 zg361m.10.b:0 "Assign the C directly to a newcomer or peripheral member to satisfy the quota, closing distribution now while accumulating appeal, resentment, and attrition risk."
 zg361m.10.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.11.t:0 "No.011 · Skip-Level Calibration and HR Steward Seat"
 zg361m.11.desc:0 "[B / P1] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.11.a:0 "Have the skip-level superior inspect distribution, extreme evidence, and process only, returning weak cases to the direct manager at the cost of another meeting."
 zg361m.11.b:0 "Let the skip-level seat directly edit grandchildren's ratings for a quick correction, bypassing rework while eroding direct-manager authority and inviting lobbying."
 zg361m.11.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.12.t:0 "No.012 · Conflict Disclosure and Recusal"
 zg361m.12.desc:0 "[B / P1] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.12.a:0 "Disclose kinship, intimacy, hostility, and sponsorship before calibration and replace recused raters with an independent seat, accepting staffing and delay costs."
 zg361m.12.b:0 "Let the manager insist or maneuver privately to protect or punish someone quickly, controlling the result while sharply raising reversal and personal-rating risk."
 zg361m.12.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.13.t:0 "No.013 · Transparent, Tiered, or Black-Box Publication"
 zg361m.13.desc:0 "[B / P2] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.13.a:0 "Give each subject frozen reasons and an appeal path, publish ratings and aggregate rules to the team, and administer access controls for sensitive peer feedback."
 zg361m.13.b:0 "Tell each person only the final rating and seal the reasons, reducing open conflict quickly while increasing suspicion, upward management, and appeals."
 zg361m.13.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.14.t:0 "No.014 · Performance Appeal Dossier"
 zg361m.14.desc:0 "[C / P0] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.14.a:0 "Collect frozen evidence by error type, require discussion before independent review, and reconcile recalibration, all three immediate refunds, and the salary-cut termination item by item."
 zg361m.14.b:0 "Let the original superior reject or revise the rating on the spot, ending the dispute quickly while risking duplicate penalties, bad refunds, and confirmed conflicts."
 zg361m.14.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.15.t:0 "No.015 · PIP Improvement Charter"
 zg361m.15.desc:0 "[C / P0] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.15.a:0 "Negotiate verifiable milestones, support, and checkpoints within the subject's authority, spending resources on a genuinely achievable improvement chance."
 zg361m.15.b:0 "Impose high-pressure milestones and a hard deadline and record refusal as major negative evidence, acting fast while making exit look predetermined."
 zg361m.15.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.16.t:0 "No.016 · PIP Support Budget"
 zg361m.16.desc:0 "[C / P1] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.16.a:0 "Fund a mentor, temporary governance resources, and scheduled attention for the PIP and record every input, paying budget to test real improvement."
 zg361m.16.b:0 "Set targets without resources and enforce the deadline, saving current budget while turning failure into appeal evidence and a hit to the manager's score."
 zg361m.16.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.17.t:0 "No.017 · Bottom-Performer Disposition Ladder"
 zg361m.17.desc:0 "[C / P0] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.17.a:0 "Use discussion, PIP, and lawful reassignment for a first low rating, reducing authority or releasing HC only after repeated failure and paying the development cost."
 zg361m.17.b:0 "Immediately freeze promotion, demote, or remove the bottom performer to raise talent density, opening capacity fast while creating fear, vacancies, and concentrated appeals."
 zg361m.17.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.18.t:0 "No.018 · Personal Record and Fourfold Settlement"
 zg361m.18.desc:0 "[C / P0] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review. This item has no connected business case yet: it configures policy and changes only the organizational ledger; it does not directly execute the example personnel, payment, or resource action."
 zg361m.18.a:0 "Record route A preference: Freeze rating, rank, superior, reasons, the three immediate treasury, personal-gold, and merit charges, and the one-year salary cut at settlement, marking every payment, refund, and termination separately. (organizational ledger only)"
 zg361m.18.b:0 "Record route B preference: Combine charges from live values when the record is opened and display them immediately, shortening the flow while risking errors after superior or balance changes and repeated opens. (organizational ledger only)"
 zg361m.18.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.19.t:0 "No.019 · Promotion Eligibility Gates"
 zg361m.19.desc:0 "[D / P0] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review. This item has no connected business case yet: it configures policy and changes only the organizational ledger; it does not directly execute the example personnel, payment, or resource action."
 zg361m.19.a:0 "Record route A preference: Verify sustained high performance, values, PIP status, tenure, and a lawful vacancy before opening a promotion case, accepting candidate-review cost. (organizational ledger only)"
 zg361m.19.b:0 "Record route B preference: Let a sponsor nominate this cycle's star past some gates to retain them quickly, risking hollow promotion and disputes over prior history. (organizational ledger only)"
 zg361m.19.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.20.t:0 "No.020 · Promotion Packet and Cross-Unit Defense"
 zg361m.20.desc:0 "[D / P1] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review. This item has no connected business case yet: it configures policy and changes only the organizational ledger; it does not directly execute the example personnel, payment, or resource action."
 zg361m.20.a:0 "Record route A preference: Build the promotion packet from frozen governance results, team impact, and reusable methods, then record a cross-unit panel's boundary judgment. (organizational ledger only)"
 zg361m.20.b:0 "Record route B preference: Let a sponsor drive a single oral pitch and decide quickly, favoring strong presentation while risking packaging outranking sustained results. (organizational ledger only)"
 zg361m.20.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.21.t:0 "No.021 · Bonus and Salary Matrix"
 zg361m.21.desc:0 "[D / P1] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review. This item has no connected business case yet: it configures policy and changes only the organizational ledger; it does not directly execute the example personnel, payment, or resource action."
 zg361m.21.a:0 "Record route A preference: Publish the rating-to-bonus-and-raise matrix in advance and lock the total pool, funding top ratings for real at a current fiscal cost. (organizational ledger only)"
 zg361m.21.b:0 "Record route B preference: Concentrate limited cash on a few top ratings and defer base-pay adjustments, sharpening the signal quickly while building pay debt, inversion, and poaching risk. (organizational ledger only)"
 zg361m.21.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.22.t:0 "No.022 · Soft Headcount Budget"
 zg361m.22.desc:0 "[D / P1] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review. This item has no connected business case yet: it configures policy and changes only the organizational ledger; it does not directly execute the example personnel, payment, or resource action."
 zg361m.22.a:0 "Record route A preference: Set an annual recruiting, development, and backfill budget from team results, finances, and vacancies, tracking each slot through use and recovery. (organizational ledger only)"
 zg361m.22.b:0 "Record route B preference: Expand or freeze capacity ad hoc from current pressure and superior preference, reinforcing priorities fast while starving low-visibility teams and encouraging slot hoarding. (organizational ledger only)"
 zg361m.22.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.23.t:0 "No.023 · HC Defense and Team Return on Investment"
 zg361m.23.desc:0 "[D / P1] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review. This item has no connected business case yet: it configures policy and changes only the organizational ledger; it does not directly execute the example personnel, payment, or resource action."
 zg361m.23.a:0 "Record route A preference: Defend HC with goal delivery, reversals, attrition, and fiscal efficiency and record commitments for next-cycle review, accepting annual review work. (organizational ledger only)"
 zg361m.23.b:0 "Record route B preference: Borrow or add capacity immediately from urgency and relationships, relieving pressure now while magnifying HC-credit and burnout risk if promises fail. (organizational ledger only)"
 zg361m.23.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.24.t:0 "No.024 · Internal Mobility Bargaining"
 zg361m.24.desc:0 "[D / P1] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review. This item has no connected business case yet: it configures policy and changes only the organizational ledger; it does not directly execute the example personnel, payment, or resource action."
 zg361m.24.a:0 "Record route A preference: Freeze prior history, set a new baseline, and agree handoff and backfill for transfers, spending time on a lawful path for mismatches and stars. (organizational ledger only)"
 zg361m.24.b:0 "Record route B preference: Let the old manager block or the new manager seize the employee immediately, preserving or gaining output now while creating hoarding, vacancy, and reputation debt. (organizational ledger only)"
 zg361m.24.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.25.t:0 "No.025 · Poaching High Performers and Counteroffers"
 zg361m.25.desc:0 "[D / P2] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review. This item has no connected business case yet: it configures policy and changes only the organizational ledger; it does not directly execute the example personnel, payment, or resource action."
 zg361m.25.a:0 "Record route A preference: Make costed written offers only to sustained top performers with stalled advancement and a lawful vacancy, requiring the old manager to answer with a real role or pay. (organizational ledger only)"
 zg361m.25.b:0 "Record route B preference: Raid visible stars with verbal promotion promises to strengthen quickly, driving pay inflation, hollow commitments, and inter-team retaliation. (organizational ledger only)"
 zg361m.25.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
