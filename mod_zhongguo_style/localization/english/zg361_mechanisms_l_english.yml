 zg361_org_delivery_stable:0 "Stable Delivery Culture"
 zg361_org_delivery_stable_desc:0 "Not every release begins with drafting an apology."
 zg361_org_tech_debt_crisis:0 "Compounding Technical Debt"
 zg361_org_tech_debt_crisis_desc:0 "Yesterday's shortcut has become today's toll gate."
 zg361_org_talent_healthy:0 "Healthy Talent Pipeline"
 zg361_org_talent_healthy_desc:0 "Stars, successors, and steady contributors can all see a path forward."
 zg361m.1.t:0 "#001 · Itemized KPI Evidence Sheet"
 zg361m.1.desc:0 "[A / P0] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.1.a:0 "Build an itemized evidence sheet, freeze cases for output, efficiency, growth, collaboration, and values, and fund the filing and review work."
 zg361m.1.b:0 "Set the rating immediately from the total score and the superior's impression, publishing fast while leaving omissions and errors hard to trace."
 zg361m.1.c:0 "Defer it and record explicit policy debt"
 zg361m.2.t:0 "#002 · Annual OKR Direction and KPI Compact"
 zg361m.2.desc:0 "[A / P0] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.2.a:0 "Freeze role-specific direction, baselines, and normal targets, allowing one evidence-backed crisis reset at the cost of continuous tracking."
 zg361m.2.b:0 "Impose aggressive targets across units and hold the original line, buying a short sprint at the risk of metric gaming and concealed trouble."
 zg361m.2.c:0 "Defer it and record explicit policy debt"
 zg361m.3.t:0 "#003 · Mid-Cycle Check-in and Target Reset"
 zg361m.3.desc:0 "[A / P1] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.3.a:0 "Run a mid-cycle coaching review, record risks and resources, and permit one documented crisis reset, spending management time for an explainable final rating."
 zg361m.3.b:0 "Keep the opening targets and demand a deadline catch-up, avoiding reset work but risking personal blame for strategy changes and delayed bad-news reporting."
 zg361m.3.c:0 "Defer it and record explicit policy debt"
 zg361m.4.t:0 "#004 · Self-Assessment and Perception Gap"
 zg361m.4.desc:0 "[A / P1] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.4.a:0 "Require a self-rating backed by representative results and have the superior answer each perception gap, accepting discussion cost for a reviewable record."
 zg361m.4.b:0 "Take a one-page self-pitch and rapidly adjust the subjective score for boasting or modesty, saving time while confusing presentation with performance."
 zg361m.4.c:0 "Defer it and record explicit policy debt"
 zg361m.5.t:0 "#005 · Role-Specific Scorecards"
 zg361m.5.desc:0 "[A / P1] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.5.a:0 "Freeze distinct weights for governance, military, fiscal, and management roles before calibrating the same direct cohort, accepting the cost of multiple scorecards."
 zg361m.5.b:0 "Force-rank every role on one results table for fast execution, systematically disadvantaging hard-to-measure work and amplifying role mismatch."
 zg361m.5.c:0 "Defer it and record explicit policy debt"
 zg361m.6.t:0 "#006 · Starting-Point and Difficulty Adjustment"
 zg361m.6.desc:0 "[A / P2] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.6.a:0 "Freeze inherited baselines, resources, and role difficulty and allow only capped adjustments, spending audit work to make comparisons fairer."
 zg361m.6.b:0 "Judge only absolute year-end results and push richer units harder, producing a fast table while rewarding inherited wealth and punishing clean-up work."
 zg361m.6.c:0 "Defer it and record explicit policy debt"
 zg361m.7.t:0 "#007 · Back-to-Back 360 Review Invitations"
 zg361m.7.desc:0 "[B / P0] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.7.a:0 "Invite a small set of genuine collaborators, require concrete cases, and cross-check them, paying the administrative cost of solicitation and deduplication."
 zg361m.7.b:0 "Solicit broadly and weight high and low votes immediately, amplifying signal quickly while inviting reciprocal praise, retaliation, and boilerplate feedback."
 zg361m.7.c:0 "Defer it and record explicit policy debt"
 zg361m.8.t:0 "#008 · Rater Leniency and Peer Credibility"
 zg361m.8.desc:0 "[B / P1] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.8.a:0 "Maintain each rater's historical mean, variance, overturn rate, and accuracy and calibrate their weight, accepting long-term data-governance cost."
 zg361m.8.b:0 "Accept raw peer ratings this cycle and punish distorters only after appeals, settling quickly while lenient and harsh raters shape the ranking first."
 zg361m.8.c:0 "Defer it and record explicit policy debt"
 zg361m.9.t:0 "#009 · Calibration Meeting Dashboard"
 zg361m.9.desc:0 "[B / P0] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.9.a:0 "Display KPI, values, goals, 360 feedback, trends, and appeal evidence together, and record every rating move as a quota-neutral swap."
 zg361m.9.b:0 "Close the table in one meeting using current totals and remaining quotas, moving fast while squeezing out boundary cases and invisible contributions."
 zg361m.9.c:0 "Defer it and record explicit policy debt"
 zg361m.10.t:0 "#010 · Assigning the C and Protecting a Subordinate"
 zg361m.10.desc:0 "[B / P0] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.10.a:0 "Choose the bottom rating from frozen evidence; if the manager protects someone, charge prestige and next-cycle management KPI openly, preserving trust at a real institutional cost."
 zg361m.10.b:0 "Assign the C directly to a newcomer or peripheral member to satisfy the quota, closing distribution now while accumulating appeal, resentment, and attrition risk."
 zg361m.10.c:0 "Defer it and record explicit policy debt"
 zg361m.11.t:0 "#011 · Skip-Level Calibration and HR Steward Seat"
 zg361m.11.desc:0 "[B / P1] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.11.a:0 "Have the skip-level superior inspect distribution, extreme evidence, and process only, returning weak cases to the direct manager at the cost of another meeting."
 zg361m.11.b:0 "Let the skip-level seat directly edit grandchildren's ratings for a quick correction, bypassing rework while eroding direct-manager authority and inviting lobbying."
 zg361m.11.c:0 "Defer it and record explicit policy debt"
 zg361m.12.t:0 "#012 · Conflict Disclosure and Recusal"
 zg361m.12.desc:0 "[B / P1] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.12.a:0 "Disclose kinship, intimacy, hostility, and sponsorship before calibration and replace recused raters with an independent seat, accepting staffing and delay costs."
 zg361m.12.b:0 "Let the manager insist or maneuver privately to protect or punish someone quickly, controlling the result while sharply raising reversal and personal-rating risk."
 zg361m.12.c:0 "Defer it and record explicit policy debt"
 zg361m.13.t:0 "#013 · Transparent, Tiered, or Black-Box Publication"
 zg361m.13.desc:0 "[B / P2] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.13.a:0 "Give each subject frozen reasons and an appeal path, publish ratings and aggregate rules to the team, and administer access controls for sensitive peer feedback."
 zg361m.13.b:0 "Tell each person only the final rating and seal the reasons, reducing open conflict quickly while increasing suspicion, upward management, and appeals."
 zg361m.13.c:0 "Defer it and record explicit policy debt"
 zg361m.14.t:0 "#014 · Performance Appeal Dossier"
 zg361m.14.desc:0 "[C / P0] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.14.a:0 "Collect frozen evidence by error type, require discussion before independent review, and reconcile recalibration, all three immediate refunds, and the salary-cut termination item by item."
 zg361m.14.b:0 "Let the original superior reject or revise the rating on the spot, ending the dispute quickly while risking duplicate penalties, bad refunds, and confirmed conflicts."
 zg361m.14.c:0 "Defer it and record explicit policy debt"
 zg361m.15.t:0 "#015 · PIP Improvement Charter"
 zg361m.15.desc:0 "[C / P0] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.15.a:0 "Negotiate verifiable milestones, support, and checkpoints within the subject's authority, spending resources on a genuinely achievable improvement chance."
 zg361m.15.b:0 "Impose high-pressure milestones and a hard deadline and record refusal as major negative evidence, acting fast while making exit look predetermined."
 zg361m.15.c:0 "Defer it and record explicit policy debt"
 zg361m.16.t:0 "#016 · PIP Support Budget"
 zg361m.16.desc:0 "[C / P1] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.16.a:0 "Fund a mentor, temporary governance resources, and scheduled attention for the PIP and record every input, paying budget to test real improvement."
 zg361m.16.b:0 "Set targets without resources and enforce the deadline, saving current budget while turning failure into appeal evidence and a hit to the manager's score."
 zg361m.16.c:0 "Defer it and record explicit policy debt"
 zg361m.17.t:0 "#017 · Bottom-Performer Disposition Ladder"
 zg361m.17.desc:0 "[C / P0] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.17.a:0 "Use discussion, PIP, and lawful reassignment for a first low rating, reducing authority or releasing HC only after repeated failure and paying the development cost."
 zg361m.17.b:0 "Immediately freeze promotion, demote, or remove the bottom performer to raise talent density, opening capacity fast while creating fear, vacancies, and concentrated appeals."
 zg361m.17.c:0 "Defer it and record explicit policy debt"
 zg361m.18.t:0 "#018 · Personal Record and Fourfold Settlement"
 zg361m.18.desc:0 "[C / P0] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.18.a:0 "Freeze rating, rank, superior, reasons, the three immediate treasury, personal-gold, and merit charges, and the one-year salary cut at settlement, marking every payment, refund, and termination separately."
 zg361m.18.b:0 "Combine charges from live values when the record is opened and display them immediately, shortening the flow while risking errors after superior or balance changes and repeated opens."
 zg361m.18.c:0 "Defer it and record explicit policy debt"
 zg361m.19.t:0 "#019 · Promotion Eligibility Gates"
 zg361m.19.desc:0 "[D / P0] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.19.a:0 "Verify sustained high performance, values, PIP status, tenure, and a lawful vacancy before opening a promotion case, accepting candidate-review cost."
 zg361m.19.b:0 "Let a sponsor nominate this cycle's star past some gates to retain them quickly, risking hollow promotion and disputes over prior history."
 zg361m.19.c:0 "Defer it and record explicit policy debt"
 zg361m.20.t:0 "#020 · Promotion Packet and Cross-Unit Defense"
 zg361m.20.desc:0 "[D / P1] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.20.a:0 "Build the promotion packet from frozen governance results, team impact, and reusable methods, then record a cross-unit panel's boundary judgment."
 zg361m.20.b:0 "Let a sponsor drive a single oral pitch and decide quickly, favoring strong presentation while risking packaging outranking sustained results."
 zg361m.20.c:0 "Defer it and record explicit policy debt"
 zg361m.21.t:0 "#021 · Bonus and Salary Matrix"
 zg361m.21.desc:0 "[D / P1] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.21.a:0 "Publish the rating-to-bonus-and-raise matrix in advance and lock the total pool, funding top ratings for real at a current fiscal cost."
 zg361m.21.b:0 "Concentrate limited cash on a few top ratings and defer base-pay adjustments, sharpening the signal quickly while building pay debt, inversion, and poaching risk."
 zg361m.21.c:0 "Defer it and record explicit policy debt"
 zg361m.22.t:0 "#022 · Soft Headcount Budget"
 zg361m.22.desc:0 "[D / P1] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.22.a:0 "Set an annual recruiting, development, and backfill budget from team results, finances, and vacancies, tracking each slot through use and recovery."
 zg361m.22.b:0 "Expand or freeze capacity ad hoc from current pressure and superior preference, reinforcing priorities fast while starving low-visibility teams and encouraging slot hoarding."
 zg361m.22.c:0 "Defer it and record explicit policy debt"
 zg361m.23.t:0 "#023 · HC Defense and Team Return on Investment"
 zg361m.23.desc:0 "[D / P1] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.23.a:0 "Defend HC with goal delivery, reversals, attrition, and fiscal efficiency and record commitments for next-cycle review, accepting annual review work."
 zg361m.23.b:0 "Borrow or add capacity immediately from urgency and relationships, relieving pressure now while magnifying HC-credit and burnout risk if promises fail."
 zg361m.23.c:0 "Defer it and record explicit policy debt"
 zg361m.24.t:0 "#024 · Internal Mobility Bargaining"
 zg361m.24.desc:0 "[D / P1] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.24.a:0 "Freeze prior history, set a new baseline, and agree handoff and backfill for transfers, spending time on a lawful path for mismatches and stars."
 zg361m.24.b:0 "Let the old manager block or the new manager seize the employee immediately, preserving or gaining output now while creating hoarding, vacancy, and reputation debt."
 zg361m.24.c:0 "Defer it and record explicit policy debt"
 zg361m.25.t:0 "#025 · Poaching High Performers and Counteroffers"
 zg361m.25.desc:0 "[D / P2] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.25.a:0 "Make costed written offers only to sustained top performers with stalled advancement and a lawful vacancy, requiring the old manager to answer with a real role or pay."
 zg361m.25.b:0 "Raid visible stars with verbal promotion promises to strengthen quickly, driving pay inflation, hollow commitments, and inter-team retaliation."
 zg361m.25.c:0 "Defer it and record explicit policy debt"
 zg361m.26.t:0 "#026 · Real Contribution and Superior Visibility Ledgers"
 zg361m.26.desc:0 "[E / P0] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.26.a:0 "Freeze real contribution and superior visibility separately and use skip-level interviews to recover low-visibility work, accepting extra verification effort."
 zg361m.26.b:0 "Allocate subjective points quickly from this cycle's presentation quality and relationship heat, rewarding showmanship now while letting hollow material beat governance temporarily."
 zg361m.26.c:0 "Defer it and record explicit policy debt"
 zg361m.27.t:0 "#027 · Cross-Unit Contribution Ledger"
 zg361m.27.desc:0 "[E / P1] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.27.a:0 "Freeze owner, lead, collaborator, rescuer, and blocker roles for joint work and divide one capped outcome pool, accepting ledger maintenance cost."
 zg361m.27.b:0 "Let the project owner claim the result and leave others to argue afterward, settling fast while encouraging credit capture and duplicate claims."
 zg361m.27.c:0 "Defer it and record explicit policy debt"
 zg361m.28.t:0 "#028 · Credit-Grab Arbitration and Blame Review"
 zg361m.28.desc:0 "[E / P1] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.28.a:0 "Assign a unique responsibility ID to each result or incident and apportion credit or blame from ledgers, witnesses, and frozen versions, paying for a hearing."
 zg361m.28.b:0 "Name a hero or scapegoat immediately to end the dispute, stabilizing the story fast while damaging peer trust and creating an appeal path for a bad ruling."
 zg361m.28.c:0 "Defer it and record explicit policy debt"
 zg361m.29.t:0 "#029 · Metric Gaming, Fraud, and Jingcha Audit"
 zg361m.29.desc:0 "[E / P1] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.29.a:0 "Audit metrics against real governance baselines, record gaming side effects, and claw back rewards while charging enablers when fraud is proven."
 zg361m.29.b:0 "Reward striking tax or order numbers first and investigate only after failure, stimulating short-term figures while magnifying delayed harm and fraud payoff."
 zg361m.29.c:0 "Defer it and record explicit policy debt"
 zg361m.30.t:0 "#030 · Resource Horse Race"
 zg361m.30.desc:0 "[E / P2] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.30.a:0 "Fund small competing pilots under common milestones and freeze budget conservation and recovery dates, paying the cost of two trials."
 zg361m.30.b:0 "Let a sponsor choose one team and stake HC and budget at once, creating focus quickly while magnifying a well-packaged failure into organizational loss."
 zg361m.30.c:0 "Defer it and record explicit policy debt"
 zg361m.31.t:0 "#031 · Sponsor Network"
 zg361m.31.desc:0 "[E / P2] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.31.a:0 "Let sponsors bring candidates to the table only with disclosed ties, expiring endorsements, and intact hard-evidence gates."
 zg361m.31.b:0 "Let patrons jump promotion, HC, or review queues directly, mobilizing power fast while tying the organization to connections and patron survival."
 zg361m.31.c:0 "Defer it and record explicit policy debt"
 zg361m.32.t:0 "#032 · The Manager's Own Team Performance"
 zg361m.32.desc:0 "[F / P0] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.32.a:0 "Assess managers on prior-cycle frozen goals, Jingcha, reversals, PIP, retention, and HC, accepting the cost of cross-cycle accounting."
 zg361m.32.b:0 "Judge only the current team rank and punish skipped reviews, low ratings, and attrition immediately, enforcing hard while recursively blaming managers for grandchildren's cases."
 zg361m.32.c:0 "Defer it and record explicit policy debt"
 zg361m.33.t:0 "#033 · Manager Archetypes and Explainable Reason Codes"
 zg361m.33.desc:0 "[F / P0] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.33.a:0 "Give data-driven, protective, and other manager styles stable weights and reason codes bounded by hard evidence, accepting explanation maintenance cost."
 zg361m.33.b:0 "Let personality and relationships override boundary evidence for fast disposition, producing vivid rulers while making like cases irreproducible."
 zg361m.33.c:0 "Defer it and record explicit policy debt"
 zg361m.34.t:0 "#034 · Performance-Potential Nine-Box"
 zg361m.34.desc:0 "[F / P1] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.34.a:0 "Calibrate the nine-box from multi-cycle frozen performance, growth rate, and role fit, then fund development or mobility by quadrant."
 zg361m.34.b:0 "Label high potentials and exits quickly from this cycle's rating and talent, focusing resources while letting one result determine a career."
 zg361m.34.c:0 "Defer it and record explicit policy debt"
 zg361m.35.t:0 "#035 · Strict, Relaxed, or Hybrid 361"
 zg361m.35.desc:0 "[F / P2] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.35.a:0 "Use a hybrid of absolute thresholds and relative ranking, retaining distribution while softening bottom sanctions for true passers and paying for dual validation."
 zg361m.35.b:0 "Enforce strict 3-6-1 and fill every bottom slot, making the rule clear and fast while creating a sacrifice even when everyone performs well."
 zg361m.35.c:0 "Defer it and record explicit policy debt"
 zg361m.36.t:0 "#036 · Ten-Year Institution Report"
 zg361m.36.desc:0 "[F / P2] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.36.a:0 "Freeze annual ratings, reversals, PIP, promotions, HC, bonuses, attrition, and real governance and aggregate a ten-year trend, accepting long-term reporting cost."
 zg361m.36.b:0 "Publish only the current table and a few headline metrics, creating a success story quickly while hiding attrition and governance decline behind a neat distribution."
 zg361m.36.c:0 "Defer it and record explicit policy debt"
 zg361m.37.t:0 "#037 · Cross-Team Quota Trading"
 zg361m.37.desc:0 "[G / P1] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review."
 zg361m.37.a:0 "Let two teams trade one rating slot using contribution, difficulty, and historical debt, recording political credit, resources, and next-cycle repayment."
 zg361m.37.b:0 "Ban negotiation and force each team to fill its local quota, closing quickly while leaving small-team randomness and real quality differences uncorrected."
 zg361m.37.c:0 "Defer it and record explicit policy debt"
 zg361m.38.t:0 "#038 · Small-Cohort Pooled Calibration"
