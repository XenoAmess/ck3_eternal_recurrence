 zg361_reference_charter_decision:0 "Deploy the Reference 361 Charter"
 zg361_reference_charter_decision_desc:0 "Adopt the recommended default for all 361 policies at once. It saves decades of meetings and immediately carries the full administrative, fiscal, and organizational consequences."
