 zg361m.88.a:0 "Podziel pulę podwyżek na księgi: rzadkość rynkową, nagrodę 3.75 i wewnętrzną sprawiedliwość, ustalaj kolejność wg dowodów i publikuj kompromis budżetowy."
 zg361m.88.b:0 "Przeznacz całą pulę podwyżek dla obecnych wykonawców 3.75, by wyostrzyć sygnał, działając zdecydowanie, lecz zostawiając rzadkie role i odwróconych pracowników otwartych na kradzież."
 zg361m.88.c:0 "Odłóż to i zapisz jawny dług polityki"
 zg361m.89.t:0 "No.089 · Rozdzielenie rangi, nominacji, władzy i gotówki"
 zg361m.89.desc:0 "[L / P1] Ta polityka jest wdrażana przez wspólną księgę organizacyjną. Wybrana reguła zmienia dostarczanie wyników, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję fiskalną, a więc wpływa na późniejsze wyniki zespołu i własną ocenę menedżera."
 zg361m.89.a:0 "Zdefiniuj oddzielnie władzę, gotówkę i terminy dostarczenia dla podwyżek, rangi eksperckiej, pełnomocnictwa i formalnych wakatów, akceptując wielotorową administrację rolami."
 zg361m.89.b:0 "Przyznaj bezgotówkowy, bezwładzny poziom lub nieokreślony tytuł pełniącego obowiązki, by uspokoić gwiazdę minimalnym kosztem, budując ryzyko pustej promocji i odejść."
 zg361m.89.c:0 "Odłóż to i zapisz jawny dług polityki"
 zg361m.90.t:0 "No.090 · Nagrody celowe"
 zg361m.90.desc:0 "[L / P1] Ta polityka jest wdrażana przez wspólną księgę organizacyjną. Wybrana reguła zmienia dostarczanie wyników, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję fiskalną, a więc wpływa na późniejsze wyniki zespołu i własną ocenę menedżera."
 zg361m.90.a:0 "Stwórz małą, oddzielną pulę za gaszenie pożarów, wsparcie między jednostkami i budowanie instytucji, wypłacaj wg unikalnego ID wkładu bez zmiany rankingu końcowego."
 zg361m.90.b:0 "Pozwól menedżerowi natychmiast wynagrodzić najbardziej widocznego ratownika z puli zespołu, sygnalizując szybko, lecz omijając 361 i drenując premie innych."
 zg361m.90.c:0 "Odłóż to i zapisz jawny dług polityki"
 zg361m.91.t:0 "No.091 · Oddzielne nagrody za staż i wyniki"
 zg361m.91.desc:0 "[L / P2] Ta polityka jest wdrażana przez wspólną księgę organizacyjną. Wybrana reguła zmienia dostarczanie wyników, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję fiskalną, a więc wpływa na późniejsze wyniki zespołu i własną ocenę menedżera."
 zg361m.91.a:0 "Prowadź długą służbę, trudną służbę i bieżące wyniki w osobnych księgach i pulach oraz płać każdą jawnie, akceptując wyższe, lecz wytłumaczalne zobowiązanie skarbca."
 zg361m.91.b:0 "Płać tylko z bieżącej oceny, by zachować silny rozkład, upraszczając rozliczenie, lecz pozwalając jednemu słabemu cyklowi wymazać całą wartość retencyjną stażysty."
 zg361m.91.c:0 "Odłóż to i zapisz jawny dług polityki"
 zg361m.92.t:0 "No.092 · Ścieżki kariery eksperckiej i menedżerskiej"
 zg361m.92.desc:0 "[M / P1] Ta polityka jest wdrażana przez wspólną księgę organizacyjną. Wybrana reguła zmienia dostarczanie wyników, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję fiskalną, a więc wpływa na późniejsze wyniki zespołu i własną ocenę menedżera."
 zg361m.92.a:0 "Zbuduj ścieżki ekspercką i menedżerską o porównywalnej nagrodzie, lecz odrębnych władzy, ryzyku i kartach wyników, finansując próby i szkolenia przy przejściu między nimi."
 zg361m.92.b:0 "Promuj najsilniejszego indywidualnego wykonawcę bezpośrednio do menedżmentu, by wypełnić wakat, zyskując lidera teraz, lecz ryzykując utratę eksperckiej produktywności i jakości zarządzania."
 zg361m.92.c:0 "Odłóż to i zapisz jawny dług polityki"
 zg361m.93.t:0 "No.093 · Powrót nieudanego menedżera na ścieżkę ekspercką"
 zg361m.93.desc:0 "[M / P1] Ta polityka jest wdrażana przez wspólną księgę organizacyjną. Wybrana reguła zmienia dostarczanie wyników, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję fiskalną, a więc wpływa na późniejsze wyniki zespołu i własną ocenę menedżera."
 zg361m.93.a:0 "Zdejmij władzę menedżerską, zachowaj sprawdzoną rangę ekspercką i godne wynagrodzenie oraz pozwól na wspomagany powrót, akceptując koszt przeniesienia i rozwoju."
 zg361m.93.b:0 "Zdegraduj i obetnij pełne wynagrodzenie lub zmuś osobę do pozostania menedżerem, działając twardo, lecz ryzykując utratę silnego eksperta lub eskalując rotację zespołu."
 zg361m.93.c:0 "Odłóż to i zapisz jawny dług polityki"
 zg361m.94.t:0 "No.094 · Mikropoziomy i bufor „pół-awansu”"
