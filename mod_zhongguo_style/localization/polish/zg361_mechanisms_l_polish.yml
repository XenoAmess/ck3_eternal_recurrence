 zg361_ledger_budget_pressure:0 "Presja budżetowa"
 zg361_ledger_hint:0 "Te księgi zasilają kolejne KPI zespołu i ocenę twoich umiejętności menedżerskich przez przełożonego."
 zg361_org_high_trust:0 "Zaufanie organizacyjne: zarząd dotrzymuje słowa"
 zg361_org_high_trust_desc:0 "Dowody, informacja zwrotna i dostarczanie wzajemnie się wzmacniają."
 zg361_org_admin_overload:0 "Przeciążenie administracją wydajności"
 zg361_org_admin_overload_desc:0 "Wszyscy są zajęci tłumaczeniem, dlaczego wszyscy są zajęci."
 zg361_org_burnout_crisis:0 "Kryzys wypalenia organizacyjnego"
 zg361_org_burnout_crisis_desc:0 "Godziny online wyglądają świetnie; baterie ludzi już nie."
 zg361_org_delivery_stable:0 "Stabilna kultura dostarczania"
 zg361_org_delivery_stable_desc:0 "Nie każde wydanie zaczyna się od pisania przeprosin."
 zg361_org_tech_debt_crisis:0 "Narastający dług techniczny"
 zg361_org_tech_debt_crisis_desc:0 "Wczorajszy skrót stał się dzisiejszym bramkowaniem."
 zg361_org_talent_healthy:0 "Zdrowy pipeline talentów"
 zg361_org_talent_healthy_desc:0 "Gwiazdy, następcy i stali współpracownicy widzą przed sobą ścieżkę."
 zg361m.1.t:0 "No.001 · Zestawienie dowodów KPI w pozycjach"
 zg361m.1.desc:0 "[A / P0] Ta polityka jest realizowana poprzez wspólną księgę organizacyjną. Wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie pracą, ryzyko, talenty lub presję budżetową, a tym samym wpływa na późniejsze wyniki zespołu i własną ocenę menedżera."
 zg361m.1.a:0 "Zbuduj zestawienie dowodów w pozycjach, zamroź przypadki dla wyniku, efektywności, wzrostu, współpracy i wartości oraz sfinansuj pracę nad wypełnianiem i przeglądem."
 zg361m.1.b:0 "Ustaw ocenę natychmiast na podstawie sumy punktów i wrażenia przełożonego, publikując szybko, lecz utrudniając śledzenie pominięć i błędów."
 zg361m.1.c:0 "Odłóż to i zapisz jawny dług polityczny"
 zg361m.2.t:0 "No.002 · Roczna dyrektywa OKR i umowa KPI"
 zg361m.2.desc:0 "[A / P0] Ta polityka jest realizowana poprzez wspólną księgę organizacyjną. Wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie pracą, ryzyko, talenty lub presję budżetową, a tym samym wpływa na późniejsze wyniki zespołu i własną ocenę menedżera."
 zg361m.2.a:0 "Zamroź kierunek, punkt odniesienia i zwykłe cele dla danego stanowiska, pozwalając na jedno poparte dowodami ponowne ustalenie w sytuacji kryzysowej, kosztem ciągłego śledzenia."
 zg361m.2.b:0 "Nałóż agresywne cele na wszystkie jednostki i trzymaj się pierwotnej linii, kupując krótki sprint ryzykiem gry wskaźnikami i ukrywania kłopotów."
 zg361m.2.c:0 "Odłóż to i zapisz jawny dług polityczny"
 zg361m.3.t:0 "No.003 · Śródokresowy przegląd i ponowne ustalenie celów"
 zg361m.3.desc:0 "[A / P1] Ta polityka jest realizowana poprzez wspólną księgę organizacyjną. Wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie pracą, ryzyko, talenty lub presję budżetową, a tym samym wpływa na późniejsze wyniki zespołu i własną ocenę menedżera."
 zg361m.3.a:0 "Przeprowadź śródokresową rozmowę rozwojową, zapisz ryzyka i zasoby oraz zezwól na jedno udokumentowane ponowne ustalenie w kryzysie, poświęcając czas zarządzania na wytłumaczalną ocenę końcową."
 zg361m.3.b:0 "Utrzymaj cele otwarcia i żądaj nadrabiania do terminu, unikając pracy resetu, lecz ryzykując obwinianiem za zmiany strategiczne i opóźnione złe wiadomości."
 zg361m.3.c:0 "Odłóż to i zapisz jawny dług polityczny"
 zg361m.4.t:0 "No.004 · Samoocena i luka percepcji"
 zg361m.4.desc:0 "[A / P1] Ta polityka jest realizowana poprzez wspólną księgę organizacyjną. Wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie pracą, ryzyko, talenty lub presję budżetową, a tym samym wpływa na późniejsze wyniki zespołu i własną ocenę menedżera."
 zg361m.4.a:0 "Wymagaj samoceny popartej reprezentatywnymi wynikami i niech przełożony odpowie na każdą lukę percepcji, akceptując koszt rozmów dla dającego się zrewidować zapisu."
 zg361m.4.b:0 "Weź jednostronicowy self-pitch i szybko skoryguj subiektywny wynik za przechwałki lub skromność, oszczędzając czas, lecz myląc prezentację z wydajnością."
 zg361m.4.c:0 "Odłóż to i zapisz jawny dług polityczny"
 zg361m.5.t:0 "No.005 · Karty wyników specyficzne dla roli"
 zg361m.5.desc:0 "[A / P1] Ta polityka jest realizowana poprzez wspólną księgę organizacyjną. Wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie pracą, ryzyko, talenty lub presję budżetową, a tym samym wpływa na późniejsze wyniki zespołu i własną ocenę menedżera."
 zg361m.5.a:0 "Zamroź odrębne wagi dla ról zarządzania, wojskowych, fiskalnych i menedżerskich przed kalibracją tej samej kohorty bezpośredniej, akceptując koszt wielu kart wyników."
 zg361m.5.b:0 "Wymuś ranking każdej roli na jednej tabeli wyników dla szybkiego wykonania, systematycznie faworyzując łatwe do zmierzenia role i wzmacniając niedopasowanie."
 zg361m.5.c:0 "Odłóż to i zapisz jawny dług polityczny"
 zg361m.6.t:0 "No.006 · Korekta punktu startu i trudności"
 zg361m.6.desc:0 "[A / P2] Ta polityka jest realizowana poprzez wspólną księgę organizacyjną. Wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie pracą, ryzyko, talenty lub presję budżetową, a tym samym wpływa na późniejsze wyniki zespołu i własną ocenę menedżera."
 zg361m.6.a:0 "Zamroź odziedziczone baseline'y, zasoby i trudność roli oraz pozwalaj tylko na ograniczone korekty, poświęcając pracę audytową dla większej sprawiedliwości porównań."
 zg361m.6.b:0 "Oceniaj tylko bezwzględne wyniki końca roku i popychaj bogatsze jednostki mocniej, uzyskując szybszą tabelę, ale nagradzając odziedziczony dobrobyt i karząc porządkowanie."
 zg361m.6.c:0 "Odłóż to i zapisz jawny dług polityczny"
 zg361m.7.t:0 "No.007 · Zaproszenia do przeglądu 360 plecami do siebie"
 zg361m.7.desc:0 "[B / P0] Ta polityka jest realizowana poprzez wspólną księgę organizacyjną. Wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie pracą, ryzyko, talenty lub presję budżetową, a tym samym wpływa na późniejsze wyniki zespołu i własną ocenę menedżera."
 zg361m.7.a:0 "Zaproś mały zestaw prawdziwych współpracowników, wymagaj konkretnych przypadków i krzyżowo je weryfikuj, płacąc koszt administracyjny zaproszeń i deduplikacji."
 zg361m.7.b:0 "Zapraszaj szeroko i natychmiast waż wysokie i niskie głosy, szybko wzmacniając sygnał, lecz otwierając drzwi wzajemnym pochlebstwom, odwetowi i szablonowemu spamowi."
 zg361m.7.c:0 "Odłóż to i zapisz jawny dług polityczny"
 zg361m.8.t:0 "No.008 · Surowość oceniającego i wiarygodność rówieśników"
 zg361m.8.desc:0 "[B / P1] Ta polityka jest realizowana poprzez wspólną księgę organizacyjną. Wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie pracą, ryzyko, talenty lub presję budżetową, a tym samym wpływa na późniejsze wyniki zespołu i własną ocenę menedżera."
 zg361m.8.a:0 "Utrzymuj historyczną średnią, wariancję, wskaźnik wywróceń i trafność każdego oceniającego i kalibruj ich wagę, akceptując długoterminowy koszt zarządzania danymi."
 zg361m.8.b:0 "Przyjmij surowe oceny rówieśników w tym cyklu i karz zniekształcających dopiero po odwołaniach, rozliczając szybko, lecz pozwalając łagodnym i surowym oceniającym najpierw ukształtować ranking."
 zg361m.8.c:0 "Odłóż to i zapisz jawny dług polityczny"
 zg361m.9.t:0 "No.009 · Kokpit spotkania kalibracyjnego"
 zg361m.9.desc:0 "[B / P0] Ta polityka jest realizowana poprzez wspólną księgę organizacyjną. Wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie pracą, ryzyko, talenty lub presję budżetową, a tym samym wpływa na późniejsze wyniki zespołu i własną ocenę menedżera."
 zg361m.9.a:0 "Wyświetlaj razem KPI, wartości, cele, opinie 360, trendy i dowody odwołań oraz zapisuj każdą zmianę oceny jako kwotowo neutralną zamianę."
 zg361m.9.b:0 "Zamknij tabelę na jednym spotkaniu przy użyciu bieżących sum i pozostałych kwot, działając szybko, ale wyciskając przypadki graniczne i niewidoczne wkłady."
 zg361m.9.c:0 "Odłóż to i zapisz jawny dług polityczny"
 zg361m.10.t:0 "No.010 · Przydzielenie C i ochrona podwładnego"
 zg361m.10.desc:0 "[B / P0] Ta polityka jest realizowana poprzez wspólną księgę organizacyjną. Wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie pracą, ryzyko, talenty lub presję budżetową, a tym samym wpływa na późniejsze wyniki zespołu i własną ocenę menedżera."
 zg361m.10.a:0 "Wybierz ocenę najniższą z zamrożonych dowodów; jeśli menedżer kogoś chroni, obciąż to otwarcie prestiżem i KPI menedżerskimi następnego cyklu, zachowując zaufanie za realną cenę instytucjonalną."
 zg361m.10.b:0 "Przydziel C bezpośrednio nowicjuszowi lub peryferyjnemu członkowi, by zaspokoić kwotę, zamykając dystrybucję teraz, lecz akumulując odwołania, urazę i ryzyko odejść."
 zg361m.10.c:0 "Odłóż to i zapisz jawny dług polityczny"
 zg361m.11.t:0 "No.011 · Kalibracja między poziomami i miejsce stewarda HR"
 zg361m.11.desc:0 "[B / P1] Ta polityka jest realizowana poprzez wspólną księgę organizacyjną. Wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie pracą, ryzyko, talenty lub presję budżetową, a tym samym wpływa na późniejsze wyniki zespołu i własną ocenę menedżera."
 zg361m.11.a:0 "Spraw, by przełożony wyższego poziomu kontrolował jedynie dystrybucję, skrajne dowody i proces, zwracając słabe przypadki bezpośredniemu menedżerowi kosztem kolejnego spotkania."
 zg361m.11.b:0 "Pozwól miejscu wyższego poziomu bezpośrednio edytować oceny wnuków dla szybkiej korekty, omijając ponowną pracę, lecz podkopując autorytet bezpośredniego menedżera i zapraszając lobbing."
 zg361m.11.c:0 "Odłóż to i zapisz jawny dług polityczny"
 zg361m.12.t:0 "No.012 · Ujawnienie konfliktu i wycofanie się"
 zg361m.12.desc:0 "[B / P1] Ta polityka jest realizowana poprzez wspólną księgę organizacyjną. Wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie pracą, ryzyko, talenty lub presję budżetową, a tym samym wpływa na późniejsze wyniki zespołu i własną ocenę menedżera."
 zg361m.12.a:0 "Ujawnij pokrewieństwo, bliskość, wrogość i patronat przed kalibracją i zastąp wycofanych oceniających niezależnym miejscem, akceptując koszty obsady i opóźnień."
 zg361m.12.b:0 "Pozwól menedżerowi upierać się lub manipulować prywatnie, by szybko kogoś chronić lub ukarać, kontrolując wynik, lecz znacząco podnosząc ryzyko wywrócenia i własnej obniżki oceny."
 zg361m.12.c:0 "Odłóż to i zapisz jawny dług polityczny"
 zg361m.13.t:0 "No.013 · Przejrzysta, warstwowa lub black-boxowa publikacja"
 zg361m.13.desc:0 "[B / P2] Ta polityka jest realizowana poprzez wspólną księgę organizacyjną. Wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie pracą, ryzyko, talenty lub presję budżetową, a tym samym wpływa na późniejsze wyniki zespołu i własną ocenę menedżera."
 zg361m.13.a:0 "Daj każdemu ocenianemu zamrożone powody i ścieżkę odwoławczą, publikuj oceny i zasady zbiorcze zespołowi oraz administruj kontrolą dostępu dla wrażliwych opinii rówieśników."
 zg361m.13.b:0 "Powiedz każdej osobie tylko ostateczną ocenę i zapieczętuj powody, szybko redukując otwarty konflikt, ale zwiększając podejrzliwość, zarządzanie w górę i odwołania."
 zg361m.13.c:0 "Odłóż to i zapisz jawny dług polityczny"
 zg361m.14.t:0 "No.014 · Teczka odwołania od oceny"
 zg361m.14.desc:0 "[C / P0] Urzędnik składa apelację z zabezpieczonymi dowodami po omówieniu sprawy z bezpośrednim przełożonym. Jeśli zostanie uwzględniona, przełożony ponownie kalibruje wynik, zwraca kolejno trzy natychmiastowe obciążenia 3.25 na rzecz skarbca lokalnego, złota osobistego i zasługi, natychmiast wstrzymuje niedokończone roczne obcięcie pensji o 25% oraz koryguje ranking; odrzucone lub nadużywane apelacje kosztują pozycję i wiarygodność."
 zg361m.14.a:0 "Zbierz zabezpieczone dowody według typu błędu, wymagaj rozmowy przed niezależną weryfikacją i uzgodnij ponowną kalibrację, wszystkie trzy natychmiastowe zwroty oraz zakończenie obcięcia pensji — punkt po punkcie."
 zg361m.14.b:0 "Pozwól pierwotnemu przełożonemu odrzucić lub zmienić ocenę na miejscu, szybko kończąc spór, lecz ryzykując podwójne kary, złe zwroty i potwierdzone konflikty."
 zg361m.14.c:0 "Odłóż to i zapisz jawny dług polityczny"
 zg361m.15.t:0 "No.015 · Karta poprawy PIP"
 zg361m.15.desc:0 "[C / P0] Ta polityka jest realizowana poprzez wspólną księgę organizacyjną. Wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie pracą, ryzyko, talenty lub presję budżetową, a tym samym wpływa na późniejsze wyniki zespołu i własną ocenę menedżera."
 zg361m.15.a:0 "Negocjuj weryfikowalne kamienie milowe, wsparcie i punkty kontrolne w zakresie uprawnień ocenianego, poświęcając zasoby na realnie osiągalną szansę poprawy."
 zg361m.15.b:0 "Nałóż wysokociśnieniowe kamienie milowe i twardy termin oraz zapisz odmowę jako poważny dowód negatywny, działając szybko, lecz sprawiając, że wyjście wygląda na z góry zaaranżowane."
 zg361m.15.c:0 "Odłóż to i zapisz jawny dług polityczny"
 zg361m.16.t:0 "No.016 · Budżet wsparcia PIP"
 zg361m.16.desc:0 "[C / P1] Ta polityka jest realizowana poprzez wspólną księgę organizacyjną. Wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie pracą, ryzyko, talenty lub presję budżetową, a tym samym wpływa na późniejsze wyniki zespołu i własną ocenę menedżera."
 zg361m.16.a:0 "Sfinansuj mentora, tymczasowe zasoby zarządzania i zaplanowaną uwagę dla PIP oraz rejestruj każdy wkład, płacąc budżetem za test prawdziwej poprawy."
 zg361m.16.b:0 "Ustaw cele bez zasobów i egzekwuj termin, oszczędzając bieżący budżet, lecz zamieniając porażkę w dowód odwoławczy i cios w ocenę menedżera."
 zg361m.16.c:0 "Odłóż to i zapisz jawny dług polityczny"
 zg361m.17.t:0 "No.017 · Drabinka dyspozycji dla najsłabszych"
 zg361m.17.desc:0 "[C / P0] Ta polityka jest realizowana poprzez wspólną księgę organizacyjną. Wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie pracą, ryzyko, talenty lub presję budżetową, a tym samym wpływa na późniejsze wyniki zespołu i własną ocenę menedżera."
 zg361m.17.a:0 "Użyj dyskusji, PIP i legalnej zmiany stanowiska przy pierwszej niskiej ocenie, obniżając uprawnienia lub zwalniając HC dopiero po powtarzających się porażkach, płacąc koszt rozwoju."
 zg361m.17.b:0 "Natychmiast zamroź awanse, zdegraduj lub usuń najsłabszego, by podnieść gęstość talentów, szybko otwierając pojemność, ale tworząc strach, wakaty i skoncentrowane odwołania."
 zg361m.17.c:0 "Odłóż to i zapisz jawny dług polityczny"
 zg361m.18.t:0 "No.018 · Kartoteka osobowa i czterokrotne rozliczenie"
