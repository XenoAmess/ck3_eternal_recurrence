 zg361_next_mechanism_decision_tooltip:0 "Otwórz następną kartę polityki 361."
 zg361_next_mechanism_decision_confirm:0 "Wezwij następnego właściciela polityki"
 zg361_reference_charter_decision:0 "Wdróż wzorcowy dokument 361"
 zg361_reference_charter_decision_desc:0 "Przyjmij naraz zalecane wartości domyślne dla wszystkich polityk 361. Oszczędza to dekady spotkań i natychmiast pociąga za sobą pełne konsekwencje administracyjne, budżetowe i organizacyjne."
 zg361_reference_charter_decision_tooltip:0 "Rozstrzygnij wszystkie 361 pozycji w jednej realnej, zmieniającej stan partii."
 zg361_reference_charter_decision_confirm:0 "Wypuść całe portfolio"
 zg361_mechanism_choice_a_tt:0 "Ścieżka trwała: poprawia dowody, zaufanie lub zdolności, ale zużywa zasoby administracyjne, budżetowe lub krótkoterminową zdolność dostarczania."
 zg361_mechanism_choice_b_tt:0 "Ścieżka sprintu: poprawia natychmiastowy wynik, ale przenosi ryzyko, wypalenie, dług techniczny lub dług odwołań do późniejszych przeglądów."
 zg361_mechanism_choice_c_tt:0 "Ścieżka odroczenia: oszczędza wysiłek teraz, ale rejestruje dług polityczny, który trafi do przeglądu twojego przełożonego."
