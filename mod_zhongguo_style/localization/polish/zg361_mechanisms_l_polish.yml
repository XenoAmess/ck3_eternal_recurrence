 zg361m.94.b:0 "Często nadawaj tytuły pół-poziomu, odraczając gotówkę i władzę, szybko łagodząc niepokój awansu, lecz tworząc inflację tytułów i dług obietnic."
 zg361m.94.c:0 "Odłóż to i zapisz jawny dług polityki"
 zg361m.95.t:0 "No.095 · Coroczny przegląd nominacji wyższej kadry menedżerskiej"
 zg361m.95.desc:0 "[M / P1] Ta polityka jest wdrażana przez wspólną księgę organizacyjną. Wybrana reguła zmienia dostarczanie wyników, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję fiskalną, a więc wpływa na późniejsze wyniki zespołu i własną ocenę menedżera."
 zg361m.95.a:0 "Przeglądaj co rok uprawnienia 361 wg zgodności z Jingcha, wyników zespołu, odwróceń, rotacji i następstwa, doradzając lub zacieśniając budżety bez nielegalnego odbierania tytułów."
 zg361m.95.b:0 "Po jednym złym cyklu zabieraj miejsca przeglądu, władzę personalną i budżet, szybko pociągając liderów do odpowiedzialności, lecz zamieniając krótkoterminową zmienność w wstrząs organizacyjny."
 zg361m.95.c:0 "Odłóż to i zapisz jawny dług polityki"
 zg361m.96.t:0 "No.096 · Pakiet awansu nadzwyczajnego"
 zg361m.96.desc:0 "[M / P2] Ta polityka jest wdrażana przez wspólną księgę organizacyjną. Wybrana reguła zmienia dostarczanie wyników, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję fiskalną, a więc wpływa na późniejsze wyniki zespołu i własną ocenę menedżera."
 zg361m.96.a:0 "Używaj małego limitu wyjątków tylko dla trwałych ponadprzeciętnych wyników lub decydującej służby, wskaż pominięty staż i odłożonego kandydata oraz przeglądaj w następnym roku."
 zg361m.96.b:0 "Pozwól sponsorowi natychmiast przeskoczyć kogoś za jeden spektakularny czyn, szybko zatrzymując bohatera, lecz zużywając normalne miejsca i przerzucając ryzyko przyszłego roku na panel."
 zg361m.96.c:0 "Odłóż to i zapisz jawny dług polityki"
 zg361m.97.t:0 "No.097 · Międzyzespołowa kalibracja awansów"
 zg361m.97.desc:0 "[M / P1] Ta polityka jest wdrażana przez wspólną księgę organizacyjną. Wybrana reguła zmienia dostarczanie wyników, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję fiskalną, a więc wpływa na późniejsze wyniki zespołu i własną ocenę menedżera."
 zg361m.97.a:0 "Wymagaj porównywalnych pakietów awansowych i każ panelowi międzyzespołowemu oceniać wpływ poza bieżący poziom, zapisując jakość nieudanych nominacji."
 zg361m.97.b:0 "Szybko przydziel miejsca awansowe wg wpływu menedżera i lokalnego numeru jeden każdego zespołu, zamykając spotkanie, lecz pozwalając, by lokalny ranking pokonywał wpływ międzyorganizacyjny."
 zg361m.97.c:0 "Odłóż to i zapisz jawny dług polityki"
 zg361m.98.t:0 "No.098 · Trzy rodzaje HC: wzrost, uzupełnienie, projekt"
 zg361m.98.desc:0 "[N / P1] Ta polityka jest wdrażana przez wspólną księgę organizacyjną. Wybrana reguła zmienia dostarczanie wyników, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję fiskalną, a więc wpływa na późniejsze wyniki zespołu i własną ocenę menedżera."
 zg361m.98.a:0 "Rejestruj HC wzrostu, uzupełnienia i projektu z osobnym celem, czasem trwania i odbiorem oraz wymagaj nowej obrony przy konwersji, akceptując trzy księgi."
 zg361m.98.b:0 "Połącz wszystkie trzy w elastyczną pulę do natychmiastowego użycia przez menedżera, wzmacniając szybko gorące punkty, lecz pozwalając, by projekty tymczasowe stały się ukrytym stałym wzrostem."
 zg361m.98.c:0 "Odłóż to i zapisz jawny dług polityki"
 zg361m.99.t:0 "No.099 · Wygaśnięcie HC, przeniesienie i rekrutacja na koniec roku"
 zg361m.99.desc:0 "[N / P1] Ta polityka jest wdrażana przez wspólną księgę organizacyjną. Wybrana reguła zmienia dostarczanie wyników, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję fiskalną, a więc wpływa na późniejsze wyniki zespołu i własną ocenę menedżera."
 zg361m.99.a:0 "Decyduj o wygaśnięciu lub jednym udokumentowanym przeniesieniu wg pipeline rekrutacyjnego i zaliczaj dobrowolne zwroty do budżetu następnego cyklu, akceptując planowaną lukę pojemności."
 zg361m.99.b:0 "Pędź rekrutacje pod koniec roku, by zachować miejsca i mianownik, zapobiegając teraz odzyskaniu, lecz zwiększając niedopasowanie, niepowodzenia próby i obciążenie mentorów."
 zg361m.99.c:0 "Odłóż to i zapisz jawny dług polityki"
 zg361m.100.t:0 "No.100 · Zamrożenie rekrutacji i wyjątki dla ról kluczowych"
 zg361m.100.desc:0 "[N / P1] Ta polityka jest wdrażana przez wspólną księgę organizacyjną. Wybrana reguła zmienia dostarczanie wyników, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję fiskalną, a więc wpływa na późniejsze wyniki zespołu i własną ocenę menedżera."
 zg361m.100.a:0 "Zamroź HC wzrostu, lecz przyznawaj pisemne wyjątki wg ryzyka roli, zobowiązanych projektów i progów bezpieczeństwa oraz audytuj tańsze alternatywy."
 zg361m.100.b:0 "Wstrzymaj wszystkie rekrutacje poza rolami kluczowymi wyznaczonymi przez władcę, stabilizując finanse teraz, lecz zapraszając szukanie rent i głodząc mniej widoczne, kluczowe prace."
 zg361m.100.c:0 "Odłóż to i zapisz jawny dług polityki"
 zg361m.101.t:0 "No.101 · Jeden senior, dwóch zwykłych lub potok uczniów"
 zg361m.101.desc:0 "[N / P1] Ta polityka jest realizowana poprzez wspólną księgę organizacyjną. Wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję fiskalną i dlatego wpływa na późniejsze wyniki zespołu oraz własną ocenę menedżera."
 zg361m.101.a:0 "Zaprojektuj miks seniora, zwykłych i uczniów, uwzględniając termin dostarczenia, ryzyko jednego kluczowego pracownika i potrzeby sukcesji, oraz zarezerwuj budżet mentorów dla potoku."
 zg361m.101.b:0 "Przeznacz cały budżet na jednego seniora, który dostarczy natychmiast, przyspieszając, ale zwiększając siłę negocjacyjną i tworząc pojedynczy punkt sukcesji."
 zg361m.101.c:0 "Odłóż to i zapisz jawny dług polityki"
 zg361m.102.t:0 "No.102 · Przegląd etatów od zera"
