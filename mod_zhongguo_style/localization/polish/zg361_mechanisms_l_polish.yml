 zg361m.39.t:0 "No.039 · Zarządzanie mianownikiem i blokada listy"
 zg361m.39.desc:0 "[G / P1] Ta zasada jest realizowana poprzez wspólną księgę organizacyjną. Jej wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję fiskalną, a więc wpływa na późniejsze wyniki zespołu i własną ocenę przełożonego."
 zg361m.39.a:0 "Przed kalibracją zablokuj listę oddelegowanych, nieobecnych, przeniesionych i odchodzących; każda zmiana wymaga formalnego powodu i ścieżki audytu."
 zg361m.39.b:0 "Tuż przed terminem usuwaj mocnych lub wpisuj słabych, by wypełnić kwoty — chroń rdzeń teraz, ryzykując wznowienie kalibracji i zarzuty menedżerskie."
 zg361m.39.c:0 "Odłóż to i zapisz jawny dług regulaminowy"
 zg361m.40.t:0 "No.040 · Zrzucenie C na odchodzącego"
 zg361m.40.desc:0 "[G / P1] Ta zasada jest realizowana poprzez wspólną księgę organizacyjną. Jej wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję fiskalną, a więc wpływa na późniejsze wyniki zespołu i własną ocenę przełożonego."
 zg361m.40.a:0 "Oceń odchodzących pracowników na podstawie zamrożonej faktycznej efektywności i rozliczaj osobno odejścia organizacyjne oraz uzupełnienie etatów, akceptując realną presję wakatów i limitów."
 zg361m.40.b:0 "Przypisz ostatnie miejsce komuś, kto i tak odchodzi, by obecny zespół zdał egzamin – zyskujesz chwilowy spokój, ale fałszujesz rozkład wyników, dobór zastępstwa i ocenę talentów."
 zg361m.40.c:0 "Odłóż to i zapisz jawny dług regulaminowy"
 zg361m.41.t:0 "No.041 · Ochrona, udział lub poświęcenie nowicjuszy"
 zg361m.41.desc:0 "[G / P1] Ta zasada jest realizowana poprzez wspólną księgę organizacyjną. Jej wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję fiskalną, a więc wpływa na późniejsze wyniki zespołu i własną ocenę przełożonego."
 zg361m.41.a:0 "Chroń nowicjuszy przed kwotą pierwszego cyklu, wyznacz cele rozwojowe, mentora i datę włączenia, akceptując koszt wdrożenia i presję na stałych pracowników."
 zg361m.41.b:0 "Od razu w pełni oceniaj nowicjuszy i czyń ich pierwszymi kandydatami do ostatniego miejsca — szybko wypełnisz kwotę C, lecz ucierpi mentor, reputacja rekrutacji i retencja."
 zg361m.41.c:0 "Odłóż to i zapisz jawny dług regulaminowy"
 zg361m.42.t:0 "No.042 · Rotacyjne zrzucanie C między cyklami"
 zg361m.42.desc:0 "[G / P2] Ta zasada jest realizowana poprzez wspólną księgę organizacyjną. Jej wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję fiskalną, a więc wpływa na późniejsze wyniki zespołu i własną ocenę przełożonego."
 zg361m.42.a:0 "Audytuj stałe wzorce rotacji między cyklami, odbuduj indywidualne dowody i mediuj obietnice rekompensaty, poświęcając czas przeglądu na przywrócenie zróżnicowania."
 zg361m.42.b:0 "Obniż wagę całej grupy i zerwij pakt, gdy tylko rotacja jest podejrzewana — szybko odstraszasz zmowę, lecz ryzykujesz fałszywe trafienia i urazę zdrady."
 zg361m.42.c:0 "Odłóż to i zapisz jawny dług regulaminowy"
 zg361m.43.t:0 "No.043 · Miejsca do zabrania głosu na kalibracji i budżet uwagi"
 zg361m.43.desc:0 "[G / P1] Ta zasada jest realizowana poprzez wspólną księgę organizacyjną. Jej wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję fiskalną, a więc wpływa na późniejsze wyniki zespołu i własną ocenę przełożonego."
 zg361m.43.a:0 "Przydziel z góry kilka miejsc do zabrania głosu, wymagaj pisemnych dowodów dla kandydatów granicznych i rozliczaj uwagę oraz kapitał polityczny przełożonego."
 zg361m.43.b:0 "Pozwól przełożonym kłócić się w nadgodzinach o faworytów, aż ocena się zmieni — może uratować jedną osobę szybko, lecz wypiera cichych współpracowników i wyczerpuje cierpliwość przełożonych."
 zg361m.43.c:0 "Odłóż to i zapisz jawny dług regulaminowy"
 zg361m.44.t:0 "No.044 · Ślepy pierwszy przebieg i imienne rozpatrzenie"
 zg361m.44.desc:0 "[G / P2] Ta zasada jest realizowana poprzez wspólną księgę organizacyjną. Jej wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję fiskalną, a więc wpływa na późniejsze wyniki zespołu i własną ocenę przełożonego."
 zg361m.44.a:0 "Najpierw uszereguj dowody bez nazwisk i relacji, potem dodaj trudność stanowiska w imiennym przebiegu i przeglądaj duże różnice, akceptując dwie rundy pracy."
 zg361m.44.b:0 "Od początku szereguj imiennie pod znanym przełożonym — szybsze wyniki, lecz od razu dopuszcza faworytyzm, wrogość i widoczność rezultatu."
 zg361m.44.c:0 "Odłóż to i zapisz jawny dług regulaminowy"
 zg361m.45.t:0 "No.045 · Dług informacji zwrotnej „bez niespodzianek”"
 zg361m.45.desc:0 "[G / P1] Ta zasada jest realizowana poprzez wspólną księgę organizacyjną. Jej wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję fiskalną, a więc wpływa na późniejsze wyniki zespołu i własną ocenę przełożonego."
 zg361m.45.a:0 "Gdy pojawi się problem, od razu zapisz fakt, coaching i odpowiedź pracownika, a przed oceną końcową zweryfikuj postępy, akceptując ciągłą pracę nad informacją zwrotną."
 zg361m.45.b:0 "Po raz pierwszy ujawnij 3.25 na koniec roku i wymuś akceptację wynikiem — szybko kończysz trudną rozmowę, lecz znacząco rośnie liczba odwołań i dług informacji zwrotnej przełożonego."
 zg361m.45.c:0 "Odłóż to i zapisz jawny dług regulaminowy"
 zg361m.46.t:0 "No.046 · Audyt podziału szans"
 zg361m.46.desc:0 "[G / P1] Ta zasada jest realizowana poprzez wspólną księgę organizacyjną. Jej wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję fiskalną, a więc wpływa na późniejsze wyniki zespołu i własną ocenę przełożonego."
 zg361m.46.a:0 "Przed kalibracją audytuj bogate domeny, kluczowe projekty, wzmocnienia i ekspozycję, uznaj nierówne szanse i stosuj jedynie ograniczone korekty trudności."
 zg361m.46.b:0 "Oceniaj wyłącznie wyniki końcowe i nagradzaj tych, którzy dostali najlepsze szanse — prosty standard, lecz przemywa faworytyzm w potencjał i wyniki."
 zg361m.46.c:0 "Odłóż to i zapisz jawny dług regulaminowy"
 zg361m.47.t:0 "No.047 · Błąd świeżości i okno dowodowe"
 zg361m.47.desc:0 "[G / P2] Ta zasada jest realizowana poprzez wspólną księgę organizacyjną. Jej wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję fiskalną, a więc wpływa na późniejsze wyniki zespołu i własną ocenę przełożonego."
 zg361m.47.a:0 "Na starcie cyklu zamroź pełnoroczne lub oparte na kamieniach milowych okno dowodowe i zachowaj wczesne wyniki do odwołań, akceptując koszt pełnego przechowywania dowodów."
 zg361m.47.b:0 "Przy ocenie końcowej mocno waż najnowszy sukces lub porażkę — szybka reakcja na nową sytuację, lecz zachęca do końcowych sprintów, ukrywania ryzyk i kasowania wczesnej pracy."
 zg361m.47.c:0 "Odłóż to i zapisz jawny dług regulaminowy"
 zg361m.48.t:0 "No.048 · Obciążenie oceniających i limity zaproszeń"
 zg361m.48.desc:0 "[H / P1] Ta zasada jest realizowana poprzez wspólną księgę organizacyjną. Jej wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję fiskalną, a więc wpływa na późniejsze wyniki zespołu i własną ocenę przełożonego."
 zg361m.48.a:0 "Ogranicz każdą osobę do prawdziwych współpracowników, sprawdzaj jakość przypadków i dopuszczaj odmowy bez kontaktu — poświęcaj zasięg, by chronić czas przeglądu."
 zg361m.48.b:0 "Narzuć szeroką ocenę równorzędną i licz liczbę formularzy jako współpracę — szybko zapełnisz dane, lecz powstają szablony, zmęczenie i polityczne zaproszenia."
 zg361m.48.c:0 "Odłóż to i zapisz jawny dług regulaminowy"
 zg361m.49.t:0 "No.049 · Zamknięte złożenie i termin"
 zg361m.49.desc:0 "[H / P1] Ta zasada jest realizowana poprzez wspólną księgę organizacyjną. Jej wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję fiskalną, a więc wpływa na późniejsze wyniki zespołu i własną ocenę przełożonego."
 zg361m.49.a:0 "Zamykaj oceny równorzędne jedna za drugą i pozwól na jedno nadzorowane spóźnione złożenie opłacone wiarygodnością, zapisując jego wpływ na kompletność dowodów."
 zg361m.49.b:0 "Zamknij definitywnie w terminie i unieważnij każdą spóźnioną ocenę — najczystsze egzekwowanie, lecz zostawia prawdziwą współpracę bez świadków i zachęca do koordynacji przed terminem."
 zg361m.49.c:0 "Odłóż to i zapisz jawny dług regulaminowy"
 zg361m.50.t:0 "No.050 · Pakty wzajemnego chwalenia i zdrada"
 zg361m.50.desc:0 "[H / P1] Ta zasada jest realizowana poprzez wspólną księgę organizacyjną. Jej wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję fiskalną, a więc wpływa na późniejsze wyniki zespołu i własną ocenę przełożonego."
 zg361m.50.a:0 "Sprawdzaj pary oceniających pod kątem korelacji wzajemnej i pobieraj próbki dowodów wspólnych projektów, akceptując koszty analizy antyzmowowej i przesłuchań."
 zg361m.50.b:0 "Natychmiast obniż wagę podejrzanym wzajemnym chwalcom lub nagrodź pierwszego denuncjatora — szybko łamiesz pakty, lecz zachęcasz do wyprzedzającej zdrady i fałszywych donosów."
 zg361m.50.c:0 "Odłóż to i zapisz jawny dług regulaminowy"
 zg361m.51.t:0 "No.051 · Możliwa do ustalenia anonimowość i minimalna próba"
 zg361m.51.desc:0 "[H / P1] Polityka realizowana jest przez wspólny rejestr organizacyjny. Wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję budżetową, więc wpływa na późniejsze wyniki zespołu i własną ocenę przełożonego."
 zg361m.51.a:0 "Gdy liczba oceniających spada poniżej minimum, łącz streszczenia, opóźniaj ujawnienie lub uzyskaj zgodę podpisaną; utrzymuj kontrolę dostępu do feedbacku, poświęcając szczegółowość, by chronić oceniających."
 zg361m.51.b:0 "Natychmiast publikuj kilka anonimowych cytatów dla użyteczności, zyskując ostry szczegół, lecz czyniąc autorów możliwymi do ustalenia i zachęcając do odwetu oraz ciszy."
 zg361m.51.c:0 "Odłóż i zapisz jawny dług polityki"
 zg361m.52.t:0 "No.052 · Zachowaj kształt, nie tylko średnią"
 zg361m.52.desc:0 "[H / P1] Polityka realizowana jest przez wspólny rejestr organizacyjny. Wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję budżetową, więc wpływa na późniejsze wyniki zespołu i własną ocenę przełożonego."
 zg361m.52.a:0 "Zachowaj rozkłady źródłowe i polaryzację, osobno badaj konflikty ocen w górę i w dół, akceptując więcej analizy zamiast spłaszczania do średniej."
 zg361m.52.b:0 "Uśredniaj każdą ocenę równorzędną do jednego wyniku rankingowego, porównując najszybciej, lecz traktując rzetelnych współpracowników i osoby oceniane tylko z góry tak samo."
 zg361m.52.c:0 "Odłóż i zapisz jawny dług polityki"
 zg361m.53.t:0 "No.053 · Rozwój jako jedyne zastosowanie 360"
 zg361m.53.desc:0 "[H / P2] Polityka realizowana jest przez wspólny rejestr organizacyjny. Wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję budżetową, więc wpływa na późniejsze wyniki zespołu i własną ocenę przełożonego."
 zg361m.53.a:0 "Używaj 360 do rozwoju i czerwonych linii wartości, podczas gdy wynagrodzenie zależy od zamrożonej oceny; finansuj osobne coachingi w zamian za szczerość."
 zg361m.53.b:0 "Przywiązuj oceny równorzędne bezpośrednio do premii i stopnia, by zwiększyć ich stawkę, wzmacniając kontrolę teraz, lecz tworząc sojusze, odwet i anonimową nieprzejrzystość."
 zg361m.53.c:0 "Odłóż i zapisz jawny dług polityki"
 zg361m.54.t:0 "No.054 · Raportowanie wypiera dostarczanie"
 zg361m.54.desc:0 "[I / P1] Polityka realizowana jest przez wspólny rejestr organizacyjny. Wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję budżetową, więc wpływa na późniejsze wyniki zespołu i własną ocenę przełożonego."
 zg361m.54.a:0 "Ogranicz raportowanie do jednostronicowej karty faktów i wyjątków, chroń godziny dostarczania, sprawdzaj fakty wyrywkowo, akceptując projekt szablonu i celne czytanie przez przełożonego."
 zg361m.54.b:0 "Wymagaj od wszystkich dopracowanych, długich raportów tygodniowych dla maksymalnej widoczności, zyskując informację teraz, lecz zamieniając czas zarządzania w wyścig zbrojeń raportowania."
 zg361m.54.c:0 "Odłóż i zapisz jawny dług polityki"
 zg361m.55.t:0 "No.055 · Miejsca w uwadze przełożonego"
 zg361m.55.desc:0 "[I / P1] Polityka realizowana jest przez wspólny rejestr organizacyjny. Wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję budżetową, więc wpływa na późniejsze wyniki zespołu i własną ocenę przełożonego."
 zg361m.55.a:0 "Rotuj miejsca głębokiej lektury i audiencji według ryzyka, kamieni milowych i trwałej niskiej widoczności oraz śledź dostawy po dostępie, akceptując koszty harmonogramowania."
 zg361m.55.b:0 "Pozwól sponsorom i najbardziej asertywnym kandydatom przeskakiwać kolejkę, słysząc silne głosy szybko, lecz wypierając ratowników i nagradzając dostęp bez dostaw."
 zg361m.55.c:0 "Odłóż i zapisz jawny dług polityki"
 zg361m.56.t:0 "No.056 · Przechwytywanie zasług przez warstwy raportowania"
 zg361m.56.desc:0 "[I / P1] Polityka realizowana jest przez wspólny rejestr organizacyjny. Wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję budżetową, więc wpływa na późniejsze wyniki zespołu i własną ocenę przełożonego."
 zg361m.56.a:0 "Dołączaj do raportów w górę oryginalnych autorów, wersje i sygnatury wkładu zespołu, a przełożonym przyznawaj punkty za rozwijanie talentów, akceptując koszt utrzymania atrybucji."
 zg361m.56.b:0 "Pozwól średniej kadrze zarządzającej przypisywać sobie wyniki podwładnych jako własne osiągnięcie koordynacji, szybko zwiększając widoczność u góry, lecz gromadząc dowody obejścia przełożonych, nielojalność i rotację."
 zg361m.56.c:0 "Odłóż i zapisz jawny dług polityki"
 zg361m.57.t:0 "No.057 · Ślady wkładu i sygnatury wersji"
 zg361m.57.desc:0 "[I / P1] Polityka realizowana jest przez wspólny rejestr organizacyjny. Wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję budżetową, więc wpływa na późniejsze wyniki zespołu i własną ocenę przełożonego."
 zg361m.57.a:0 "Zamrażaj własność, współpracę i sygnatury wersji w kluczowych kamieniach milowych i używaj ich tylko przy sporach, awansach lub audycie, poświęcając skromną uwagę na bieżąco dla identyfikowalności."
 zg361m.57.b:0 "Nie prowadź śladu wersji i ustalaj wkład post factum przez władzę oraz perswazję, minimalizując codzienną pracę, lecz oddając spory przegranym walki o zasługi."
 zg361m.57.c:0 "Odłóż i zapisz jawny dług polityki"
 zg361m.58.t:0 "No.058 · Kopiowanie pominięcia szczebla i polityka informacyjna"
 zg361m.58.desc:0 "[I / P1] Polityka realizowana jest przez wspólny rejestr organizacyjny. Wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję budżetową, więc wpływa na późniejsze wyniki zespołu i własną ocenę przełożonego."
 zg361m.58.a:0 "Kopiowanie pominięcia szczebla dozwól tylko dla istotnych wyników lub ryzyk według protokołu, wymagaj reakcji bezpośredniego przełożonego i zachowaj trop audytowy, akceptując dodatkowe zarządzanie informacją."
 zg361m.58.b:0 "Zakazuj pominięcia szczebla i zmuszaj do przekazywania wszystkich informacji przez bezpośredniego przełożonego, szybko przywracając łańcuch dowodzenia, lecz ryzykując stłumienie złych wieści i niewidocznych wkładów."
 zg361m.58.c:0 "Odłóż i zapisz jawny dług polityki"
 zg361m.59.t:0 "No.059 · Złe wieści: wcześnie, późno lub ukryte"
 zg361m.59.desc:0 "[I / P1] Polityka realizowana jest przez wspólny rejestr organizacyjny. Wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję budżetową, więc wpływa na późniejsze wyniki zespołu i własną ocenę przełożonego."
 zg361m.59.a:0 "Zamroź czas, znane fakty i decyzję o wezwaniu pomocy, gdy ryzyko zgłoszono wcześnie; wspieraj transparentnych zgłaszających i dokonuj przeglądu po wyniku, akceptując koszt ratownictwa."
 zg361m.59.b:0 "Wymagaj, by zespoły same rozwiązały problem i zgłosiły po przeglądzie, chroniąc metryki i uwagę teraz, lecz nakładając odpowiedzialność za uczciwość i nadzór, jeśli wybuchnie."
 zg361m.59.c:0 "Odłóż i zapisz jawny dług polityki"
 zg361m.60.t:0 "No.060 · Wycieki materiałów i kradzież pomysłów"
 zg361m.60.desc:0 "[I / P2] Polityka realizowana jest przez wspólny rejestr organizacyjny. Wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję budżetową, więc wpływa na późniejsze wyniki zespołu i własną ocenę przełożonego."
 zg361m.60.a:0 "Zachowuj oryginalne wersje, zapisy dostępu i warunki wspólnego projektu; własność rozstrzyga niezależne miejsce, akceptując koszty dowodów i arbitrażu."
 zg361m.60.b:0 "Pozwól zespołowi odbierającemu natychmiast opakować i zgłosić wyciekły materiał, by przejąć zasoby, zyskując możliwy start, lecz ryzykując ostry zwrot przy ujawnieniu sygnatur."
 zg361m.60.c:0 "Odłóż i zapisz jawny dług polityki"
 zg361m.61.t:0 "No.061 · Krótkie briefy i długie raporty narracyjne"
 zg361m.61.desc:0 "[I / P2] Polityka realizowana jest przez wspólny rejestr organizacyjny. Wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję budżetową, więc wpływa na późniejsze wyniki zespołu i własną ocenę przełożonego."
 zg361m.61.a:0 "Ustandaryzuj jednostronicową kartę faktów z załącznikami dla złożonej współpracy i rezerwuj długie narracje na wyjątki, akceptując utrzymanie szablonów i indeksów materiałów."
 zg361m.61.b:0 "Wymagaj pełnych raportów narracyjnych, by przełożony mógł od razu wchłonąć kontekst, zyskując szczegółowość teraz, lecz nagradzając zdatność literacką i rozszerzając ceremonialne obciążenie."
 zg361m.61.c:0 "Odłóż i zapisz jawny dług polityki"
 zg361m.62.t:0 "No.062 · Konflikt celów linii stałej i przerywanej"
 zg361m.62.desc:0 "[J / P1] Polityka realizowana jest przez wspólny rejestr organizacyjny. Wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję budżetową, więc wpływa na późniejsze wyniki zespołu i własną ocenę przełożonego."
 zg361m.62.a:0 "Przy sprzecznych celach niech obaj przełożeni wspólnie orzekają o priorytecie, odpowiedzialności i własności dowodów, akceptując opóźnienie dla jednego wykonalnego kierunku."
 zg361m.62.b:0 "Nakazuj urzędnikowi posłuszeństwo stałej linii i ignorowanie dostarczania po linii przerywanej, natychmiast wyjaśniając dowodzenie, lecz tworząc krytykę projektu i dług między jednostkami."
 zg361m.62.c:0 "Odłóż i zapisz jawny dług polityki"
 zg361m.63.t:0 "No.063 · Kontrakt wag na otwarcie cyklu"
 zg361m.63.desc:0 "[J / P1] Polityka realizowana jest przez wspólny rejestr organizacyjny. Wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję budżetową, więc wpływa na późniejsze wyniki zespołu i własną ocenę przełożonego."
 zg361m.63.a:0 "Niech obaj przełożeni podpiszą na początku cyklu wagi ocen, granice dostarczania i warunki zmiany w kryzysie, akceptując koszty negocjacji i utrzymania wersji."
 zg361m.63.b:0 "Pozwól silniejszemu przełożonemu przepisywać wagi pod koniec roku, by chronić priorytetowe wyniki, szybko rozwiązując konflikt, lecz zachęcając do podwójnych obietnic i obniżając jakość zarządzania."
 zg361m.63.c:0 "Odłóż i zapisz jawny dług polityki"
 zg361m.64.t:0 "No.064 · Dwupodpisane przekazanie przy zmianie przełożonego"
 zg361m.64.desc:0 "[J / P1] Polityka realizowana jest przez wspólny rejestr organizacyjny. Wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję budżetową, więc wpływa na późniejsze wyniki zespołu i własną ocenę przełożonego."
 zg361m.64.a:0 "Stary przełożony zamraża zakończone prace i zapiski coachingowe, a nowy współpodpisuje pozostałe cele z jednym resetem priorytetów, akceptując spotkanie przekazujące."
 zg361m.64.b:0 "Pozwól nowemu przełożonemu unieważnić stare zobowiązania i natychmiast przeliczyć wg nowych zasad, szybko zyskując swobodę, lecz łamiąc ciągłość dowodów i zapraszając udane odwołania."
 zg361m.64.c:0 "Odłóż i zapisz jawny dług polityki"
 zg361m.65.t:0 "No.065 · Spadochronowy przełożony i pakiet lojalistów"
 zg361m.65.desc:0 "[J / P2] Polityka realizowana jest przez wspólny rejestr organizacyjny. Wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję budżetową, więc wpływa na późniejsze wyniki zespołu i własną ocenę przełożonego."
 zg361m.65.a:0 "Pozwól spadochronowemu przełożonemu na mały, o określonej roli zespół lojalistów, jednocześnie audytując szanse, utrzymanie i transfer wiedzy, akceptując koszt przejścia dwutorowego."
 zg361m.65.b:0 "Szeroko zastępuj odziedziczony zespół lojalistami, szybko ujednolicając wykonanie, lecz tworząc wakaty, audyty nepotyzmu i utratę pamięci organizacyjnej."
 zg361m.65.c:0 "Odłóż i zapisz jawny dług polityki"
 zg361m.66.t:0 "No.066 · Oddzielenie anulowania projektu od porażki osobistej"
 zg361m.66.desc:0 "[J / P1] Polityka realizowana jest przez wspólny rejestr organizacyjny. Wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję budżetową, więc wpływa na późniejsze wyniki zespołu i własną ocenę przełożonego."
 zg361m.66.a:0 "Zamroź zweryfikowane kamienie milowe, osąd stop-loss i powody anulowania; oceń strategię osobno od wkładu jednostki, akceptując dedykowany przegląd."
 zg361m.66.b:0 "Wyzeruj wszystkie zasługi i ukarz zespół projektowy przy anulowaniu, szybko zamykając księgi, lecz popychając wszystkich ku krótkim projektom i ukrywając złą strategię."
 zg361m.66.c:0 "Odłóż i zapisz jawny dług polityki"
 zg361m.67.t:0 "No.067 · Dwóch ludzi na jednym stanowisku po fuzji"
 zg361m.67.desc:0 "[J / P2] Polityka realizowana jest przez wspólny rejestr organizacyjny. Wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję budżetową, więc wpływa na późniejsze wyniki zespołu i własną ocenę przełożonego."
 zg361m.67.a:0 "Rozwiąż duplikujących się liderów poprzez otwarty konkurs, okres przejściowy dla dwóch osób i zgodne z prawem przeniesienie; zapisuj dowody porównania i ponoś tymczasowy koszt podwójnej roli."
 zg361m.67.b:0 "Wybierz uprzednio faworyta i natychmiast usuń drugiego lidera, szybko eliminując nakładanie się, lecz pogarszając frakcje, odwołania i utratę kluczowego doświadczenia."
 zg361m.67.c:0 "Odłóż i zapisz jawny dług polityki"
 zg361m.68.t:0 "No.068 · Przenośna historia i lokalne ponowne dowodzenie"
 zg361m.68.desc:0 "[J / P1] Polityka realizowana jest przez wspólny rejestr organizacyjny. Wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję budżetową, więc wpływa na późniejsze wyniki zespołu i własną ocenę przełożonego."
 zg361m.68.a:0 "Przenieś zamrożone oceny, kontekst wyników, spory i otwarty PIP do nowej roli oraz wyznacz jeden chroniony okres wdrożenia z jasnymi celami ponownego udowodnienia."
 zg361m.68.b:0 "Włącz przenoszonego od razu w pełny lokalny rozkład i pozwól nowemu przełożonemu wybiórczo korzystać z historii, szybko integrując z konkurencją, lecz ryzykując podwójną karę lub przejęcie limitu."
 zg361m.68.c:0 "Odłóż i zapisz jawny dług polityki"
 zg361m.69.t:0 "No.069 · Formalne doręczenie i zegar odwołań"
 zg361m.69.desc:0 "[K / P0] Polityka realizowana jest przez wspólny rejestr organizacyjny. Wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję budżetową, więc wpływa na późniejsze wyniki zespołu i własną ocenę przełożonego."
 zg361m.69.a:0 "Doręczaj zamrożony dokument osobiście, pozwalaj na podpis z zastrzeżeniem i używaj świadka przy odmowie, uruchamiając zegar odwołań i rozliczeń pozycja po pozycji."
 zg361m.69.b:0 "Uznaj każdy wynik za doręczony publikacją i rozliczaj natychmiast, działając najszybciej, lecz powodując, że osoby bez uzasadnienia przegapiają odwołania i obrócą proces."
 zg361m.69.c:0 "Odłóż i zapisz jawny dług polityki"
 zg361m.70.t:0 "No.070 · Okno antyodwetowe po odwołaniu"
 zg361m.70.desc:0 "[K / P1] Polityka realizowana jest przez wspólny rejestr organizacyjny. Wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję budżetową, więc wpływa na późniejsze wyniki zespołu i własną ocenę przełożonego."
 zg361m.70.a:0 "Przez rok wymagaj nowych faktów przy przeniesieniu, zwolnieniu, obniżeniu wynagrodzenia i nowej negatywnej ocenie oraz sprawdzaj je niezależnie, akceptując pracę monitorującą."
 zg361m.70.b:0 "Pozwól przełożonemu od razu po odwołaniu przeorganizować role i uprawnienia, by przywrócić kontrolę, działając szybko, lecz sprawiając, że odwrócone uzasadnienia wyglądają na odwet."
 zg361m.70.c:0 "Odłóż i zapisz jawny dług polityki"
 zg361m.71.t:0 "No.071 · Esej na forum wewnętrznym i eskalacja publiczna"
 zg361m.71.desc:0 "[K / P2] Polityka realizowana jest przez wspólny rejestr organizacyjny. Wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję budżetową, więc wpływa na późniejsze wyniki zespołu i własną ocenę przełożonego."
 zg361m.71.a:0 "Po wyczerpaniu rozmów prywatnych i formalnego odwołania pozwól na podpisany esej poparty dowodami w moderowanym przeglądzie i sfinansuj mediację oraz weryfikację faktów."
 zg361m.71.b:0 "Pozwól autorowi natychmiast opublikować podpisany lub anonimowy materiał obnażający dla wsparcia, zyskując szybką uwagę wyższego szczebla, lecz paląc obie reputacje i zaufanie wewnętrzne."
 zg361m.71.c:0 "Odłóż i zapisz jawny dług polityki"
 zg361m.72.t:0 "No.072 · Wcześniejszy wyciek ocen wyników"
 zg361m.72.desc:0 "[K / P1] Polityka realizowana jest przez wspólny rejestr organizacyjny. Wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję budżetową, więc wpływa na późniejsze wyniki zespołu i własną ocenę przełożonego."
 zg361m.72.a:0 "Ogranicz dostęp do materiałów kalibracji, loguj wyświetlenia i stosuj wspólny czas doręczenia, by wszyscy równo przygotowali odwołania, akceptując koszt administracji poufności."
 zg361m.72.b:0 "Prywatnie ostrzegaj faworytów lub rozsyłaj oceny, by wybadać reakcję zespołu, zarządzając reakcją wcześnie, lecz wywołując przedwczesne odejścia, uzgodnione narracje i nieufność panelu."
 zg361m.72.c:0 "Odłóż i zapisz jawny dług polityki"
 zg361m.73.t:0 "No.073 · Złośliwe wycieki i sygnalizowanie w dobrej wierze"
 zg361m.73.desc:0 "[K / P1] Polityka realizowana jest przez wspólny rejestr organizacyjny. Wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję budżetową, więc wpływa na późniejsze wyniki zespołu i własną ocenę przełożonego."
 zg361m.73.a:0 "Niech niezależne miejsce zweryfikuje autentyczność, cel publiczny i elementy odwetu, chroniąc prawdziwe zgłoszenia i karząc manipulację kosztem dochodzenia."
 zg361m.73.b:0 "Klasyfikuj każdy nieautoryzowany wyciek jako naruszenie i karz natychmiast, szybko przywracając tajemnicę, lecz tłumiąc prawdziwe dowody nadużyć."
 zg361m.73.c:0 "Odłóż i zapisz jawny dług polityki"
 zg361m.74.t:0 "No.074 · Uczciwa redundancja kontra wybielane oceny"
 zg361m.74.desc:0 "[K / P1] Polityka realizowana jest przez wspólny rejestr organizacyjny. Wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję budżetową, więc wpływa na późniejsze wyniki zespołu i własną ocenę przełożonego."
 zg361m.74.a:0 "Usuń stanowisko otwarcie z powodów organizacyjnych, zapłać koszt odejścia ze skarbca i zachowaj neutralny zapis, wydając pieniądze dla czystej historii wyników."
 zg361m.74.b:0 "Najpierw wpisz 3.25, potem tnij tanio osobę za słabe wyniki, szybko zmniejszając zatrudnienie, lecz ryzykując przywrócenie sankcji i poważne szkody na dwóch szczeblach zarządzania."
 zg361m.74.c:0 "Odłóż i zapisz jawny dług polityki"
 zg361m.75.t:0 "No.075 · Pakiet dobrowolnego odejścia z czystym rekordem"
 zg361m.75.desc:0 "[K / P2] Polityka realizowana jest przez wspólny rejestr organizacyjny. Wybrana reguła zmienia dostarczanie, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję budżetową, więc wpływa na późniejsze wyniki zespołu i własną ocenę przełożonego."
 zg361m.75.a:0 "Zaoferuj wykonawcy na dolnej granicy realną odprawę, neutralny zapis i jasne zwolnienie HC, ponosząc koszt skarbca i zachowując realne prawo do odmowy."
 zg361m.75.b:0 "Wymagaj do terminu nieodpłatnego dobrowolnego odejścia, w przeciwnym razie natychmiast uruchom PIP, szybko obniżając koszty, lecz ryzykując reklasyfikację jako przymusową redundancję."
 zg361m.75.c:0 "Odłóż i zapisz jawny dług polityki"
 zg361m.76.t:0 "No.076 · Procesowa porażka z wielopoziomową odpowiedzialnością"
 zg361m.76.desc:0 "[K / P1] Ta polityka jest wdrażana przez wspólną księgę organizacyjną. Wybrana reguła zmienia dostarczanie wyników, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję fiskalną, a więc wpływa na późniejsze wyniki zespołu i własną ocenę menedżera."
 zg361m.76.a:0 "Po odwróceniu decyzji rozdziel odpowiedzialność za brakujące dowody, nadzór, błąd projektowy i fałszywe zeznania do następnej oceny menedżerskiej każdej ze stron, akceptując wspólny przegląd."
 zg361m.76.b:0 "Każ bezpośredniemu menedżerowi lub pełnomocnikowi ponieść całą porażkę procesową, by szybko zamknąć sprawę — odpowiedzialność jest jasna, lecz ukrywa wady systemu i zachęca do zrzucania winy."
 zg361m.76.c:0 "Odłóż to i zapisz jawny dług polityki"
 zg361m.77.t:0 "No.077 · Rotacja niezależnych recenzentów"
 zg361m.77.desc:0 "[K / P1] Ta polityka jest wdrażana przez wspólną księgę organizacyjną. Wybrana reguła zmienia dostarczanie wyników, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję fiskalną, a więc wpływa na późniejsze wyniki zespołu i własną ocenę menedżera."
 zg361m.77.a:0 "Rotuj recenzentów spośród niezwiązanych menedżerów równorzędnych, daj każdej stronie jedno uzasadnione wyłączenie i śledź jakość recenzji, akceptując koszt kadrowy."
 zg361m.77.b:0 "Poleć pierwotnemu panelowi szybką samokorektę z ograniczonymi nowymi dowodami, oszczędzając czas menedżerski, lecz pozwalając tym samym osobom bronić własnych wniosków."
 zg361m.77.c:0 "Odłóż to i zapisz jawny dług polityki"
 zg361m.78.t:0 "No.078 · Panel rozkładu sprawiedliwości"
 zg361m.78.desc:0 "[K / P2] Ta polityka jest wdrażana przez wspólną księgę organizacyjną. Wybrana reguła zmienia dostarczanie wyników, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję fiskalną, a więc wpływa na późniejsze wyniki zespołu i własną ocenę menedżera."
 zg361m.78.a:0 "Pokazuj wieloletnie różnice według nowicjusza, transferu, pokrewieństwa, frakcji, roli i stażu oraz łącz je z danymi o szansach, wysyłając anomalie wyłącznie do ludzkiego wyjaśnienia."
 zg361m.78.b:0 "Wymuś zmiany ocen lub karz menedżera za każdym razem, gdy wskaźnik podgrupy wygląda anomalnie — najszybsza korekta, lecz myli małe próby i realne różnice biznesowe z uprzedzeniami."
 zg361m.78.c:0 "Odłóż to i zapisz jawny dług polityki"
 zg361m.79.t:0 "No.079 · Dni otwarte na szczeblach wyższych"
 zg361m.79.desc:0 "[K / P2] Ta polityka jest wdrażana przez wspólną księgę organizacyjną. Wybrana reguła zmienia dostarczanie wyników, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję fiskalną, a więc wpływa na późniejsze wyniki zespołu i własną ocenę menedżera."
 zg361m.79.a:0 "Otwieraj co cykl kilka umówionych miejsc na przeszkody, wyniki i tropy odwołań, twórz zadania dochodzeniowe, poświęcając czas wyższej kadry bez zmieniania ocen na miejscu."
 zg361m.79.b:0 "Pozwól starszemu władcy obiecywać zasoby lub zmieniać ocenę podwładnego niższego szczebla podczas audiencji — szybka odpowiedź na nastroje, lecz omija bezpośrednich menedżerów i napędza politykę przeskakiwania szczebli."
 zg361m.79.c:0 "Odłóż to i zapisz jawny dług polityki"
 zg361m.80.t:0 "No.080 · Publiczny bilet defektu metryki"
 zg361m.80.desc:0 "[K / P1] Ta polityka jest wdrażana przez wspólną księgę organizacyjną. Wybrana reguła zmienia dostarczanie wyników, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję fiskalną, a więc wpływa na późniejsze wyniki zespołu i własną ocenę menedżera."
 zg361m.80.a:0 "Rejestruj otwarcie defekty metryk grywalnych, sprzecznych lub zniekształconych, wymagaj od właściciela pisemnej naprawy lub akceptacji ryzyka i zapisuj wkład instytucjonalny zgłaszającego."
 zg361m.80.b:0 "Każ właścicielowi natychmiast zamknąć bilet defektu i utrzymać metrykę przez okres przeglądu — krótkoterminowo zachowana zgodność, lecz gdy sprawa wybuchnie, odpowiedzialność przenosi się na projektanta."
 zg361m.80.c:0 "Odłóż to i zapisz jawny dług polityki"
 zg361m.81.t:0 "No.081 · Hierarchiczna kompresja informacji o wynikach"
 zg361m.81.desc:0 "[K / P2] Ta polityka jest wdrażana przez wspólną księgę organizacyjną. Wybrana reguła zmienia dostarczanie wyników, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję fiskalną, a więc wpływa na późniejsze wyniki zespołu i własną ocenę menedżera."
 zg361m.81.a:0 "Przyznaj dostęp oparty na roli do surowych dowodów, podsumowań i centralnego przeglądu oraz loguj kto co widział, akceptując koszt administracji uprawnieniami i prywatności."
 zg361m.81.b:0 "Wymuś na każdym szczeblu przesyłanie tylko jednego rankingu podsumowującego, by przyspieszyć decyzje — najkrótszy przepływ, lecz potęguje przechwytywanie zasług, zniekształcenia i nieodwracalną czarną skrzynkę."
 zg361m.81.c:0 "Odłóż to i zapisz jawny dług polityki"
 zg361m.82.t:0 "No.082 · Formuła łącznej nagrody"
 zg361m.82.desc:0 "[L / P1] Ta polityka jest wdrażana przez wspólną księgę organizacyjną. Wybrana reguła zmienia dostarczanie wyników, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję fiskalną, a więc wpływa na późniejsze wyniki zespołu i własną ocenę menedżera."
 zg361m.82.a:0 "Rozdziel stałą stawkę, dodatek funkcyjny, premię wynikową, nagrodę celową i nagrodę odroczoną, finansując każdą ze skarbca przy limitach zdolności płatniczej."
 zg361m.82.b:0 "Przenieś wynagrodzenie mocno w bieżące premie wynikowe, by wzmocnić 361 — silny krótkoterminowy bodziec, lecz potęguje niepokój, podbieranie zasług i zmienność fiskalną."
 zg361m.82.c:0 "Odłóż to i zapisz jawny dług polityki"
 zg361m.83.t:0 "No.083 · Mnożniki premii: domena, zespół i jednostka"
 zg361m.83.desc:0 "[L / P1] Ta polityka jest wdrażana przez wspólną księgę organizacyjną. Wybrana reguła zmienia dostarczanie wyników, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję fiskalną, a więc wpływa na późniejsze wyniki zespołu i własną ocenę menedżera."
 zg361m.83.a:0 "Zamroź mnożniki domeny, zespołu i jednostki na starcie cyklu, zachowując podział zespołowy i nagrodę indywidualną kosztem bardziej złożonego rozliczenia."
 zg361m.83.b:0 "Przenieś nagle wagę premii na oceny indywidualne, szybko poszerzając rozpiętość najwyższego szczebla, lecz pozwalając podbieraniu zasług i rywalizacji w przegrywających zespołach wymknąć się spod kontroli."
 zg361m.83.c:0 "Odłóż to i zapisz jawny dług polityki"
 zg361m.84.t:0 "No.084 · Premia odroczona i nabywanie praw"
 zg361m.84.desc:0 "[L / P2] Ta polityka jest wdrażana przez wspólną księgę organizacyjną. Wybrana reguła zmienia dostarczanie wyników, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję fiskalną, a więc wpływa na późniejsze wyniki zespołu i własną ocenę menedżera."
 zg361m.84.a:0 "Stwórz trzyletnią księgę nabywania praw dla nagród długoterminowych, zarezerwuj środki skarbca, określ warunki odejścia i odwrócenia oraz wypłacaj rocznie, akceptując przyszłe zobowiązania fiskalne."
 zg361m.84.b:0 "Wypłać całą nagrodę teraz dla silnego sygnału retencyjnego, upraszczając rozliczenie, lecz utrudniając odzyskanie w razie nadużycia lub odwrócenia projektu i obciążając bieżący skarbiec."
 zg361m.84.c:0 "Odłóż to i zapisz jawny dług polityki"
 zg361m.85.t:0 "No.085 · Klif premii retencyjnej"
 zg361m.85.desc:0 "[L / P2] Ta polityka jest wdrażana przez wspólną księgę organizacyjną. Wybrana reguła zmienia dostarczanie wyników, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję fiskalną, a więc wpływa na późniejsze wyniki zespołu i własną ocenę menedżera."
 zg361m.85.a:0 "Śledź wcześnie końce nabywania praw, rezerwuj pakiety odnowieniowe wg krytyczności i ryzyka następstwa oraz porównuj otwarcie rówieśników, akceptując długoterminowy koszt budżetowy."
 zg361m.85.b:0 "Czekaj aż odejście będzie bliskie i składaj awaryjną kontr ofertę lub ustną obietnicę odnowienia, oszczędzając teraz, lecz tworząc klify odejść, dług obietnic i nierówności płac."
 zg361m.85.c:0 "Odłóż to i zapisz jawny dług polityki"
 zg361m.86.t:0 "No.086 · Wstrzymanie premii i clawback"
 zg361m.86.desc:0 "[L / P1] Ta polityka jest wdrażana przez wspólną księgę organizacyjną. Wybrana reguła zmienia dostarczanie wyników, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję fiskalną, a więc wpływa na późniejsze wyniki zespołu i własną ocenę menedżera."
 zg361m.86.a:0 "Z góry określ wskaźniki wstrzymania, daty audytu i warunki clawback za nadużycie dla projektów wysokiego ryzyka oraz przechowuj rekord rozliczenia dla każdej płatności."
 zg361m.86.b:0 "Wstrzymaj lub cofnij pełną nagrodę, gdy tylko pojawi się podejrzenie, szybko chroniąc skarbiec, lecz prowokując odwołania i odejścia przez retrospektywne zasady."
 zg361m.86.c:0 "Odłóż to i zapisz jawny dług polityki"
 zg361m.87.t:0 "No.087 · Pasma płacowe i pozycja w paśmie"
 zg361m.87.desc:0 "[L / P1] Ta polityka jest wdrażana przez wspólną księgę organizacyjną. Wybrana reguła zmienia dostarczanie wyników, dowody, zaufanie, obciążenie, ryzyko, talenty lub presję fiskalną, a więc wpływa na późniejsze wyniki zespołu i własną ocenę menedżera."
 zg361m.87.a:0 "Przeprowadź audyt stażu, rzadkości rynkowej, historii wyników i pozycji w paśmie, napraw najpierw poparte dowodami niskie miejsca i odwrócenia, akceptując koszt budżetu płacowego."
 zg361m.87.b:0 "Twardo limituj płacę podstawową, a gwiazdom na szczycie pasma daj tylko premię celową, szybko broniąc pasma, lecz zwiększając odejścia najlepszych wykonawców i odwróconych stażystów."
 zg361m.87.c:0 "Odłóż to i zapisz jawny dług polityki"
 zg361m.88.t:0 "No.088 · Podwyżki rynkowe kontra podwyżkom wynikowym"
