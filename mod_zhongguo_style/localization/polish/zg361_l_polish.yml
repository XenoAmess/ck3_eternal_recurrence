l_polish:
 # Game rules
 rule_zg361_enabled:0 "Ocena Wyników Wasali (System 361)"
 setting_zg361_on:0 "Włączone"
 setting_zg361_on_desc:0 "Niebiański władca rangi książęcej lub wyższej cyklicznie ocenia swoich bezpośrednich urzędników, dzieląc ich na 3.75 / 3.5 / 3.25; hrabiowie i baronowie są oceniani, lecz nikogo nie oceniają."
 setting_zg361_off:0 "Wyłączone"
 setting_zg361_off_desc:0 "Wyłącza system oceny wyników."
 rule_zg361_frequency:0 "Cykl Oceny"
 setting_zg361_freq_yearly:0 "Roczna Ocena"
 setting_zg361_freq_yearly_desc:0 "Jeden sezon oceny co roku."
 setting_zg361_freq_three_year:0 "Trzyletnia Ocena"
 setting_zg361_freq_three_year_desc:0 "Jeden wielki przegląd co trzy lata, w dawnym stylu."
 rule_zg361_bottom_ratio:0 "Kwota Końcowa"
 setting_zg361_ratio_strict:0 "Sztywne 361 (10%)"
 setting_zg361_ratio_strict_desc:0 "Rozkład 361 jest egzekwowany: nawet jeśli wszyscy spełniają oczekiwania, ktoś w dostatecznie dużej puli musi otrzymać 3.25."
 setting_zg361_ratio_relaxed:0 "Poluzowane (5%)"
 setting_zg361_ratio_relaxed_desc:0 "Zachowaj ocenianie 361, lecz poluzuj sztywną kwotę końcowych 10%."
 setting_zg361_ratio_off:0 "Bez nadzoru (0%)"
 setting_zg361_ratio_off_desc:0 "Bez wymuszonej dolnej warstwy. Ocena staje się formalnością."
 # Decision group & decisions
 decision_group_type_zg361:0 "Ocena Wyników"
 zg361_review_now_decision:0 "Przeprowadź Ocenę Wyników Teraz"
 zg361_review_now_decision_desc:0 "Rozkaż biuru ocen natychmiast uszeregować twoich bezpośrednich podwładnych, zamiast czekać na sezon roczny. Urzędnicy już ocenieni w tym roku nie zostaną ocenieni ponownie."
 zg361_review_now_decision_tooltip:0 "Natychmiast oceń co najmniej jednego bezpośredniego urzędnika na aktywnym stanowisku; w tym samym roku nie można przeprowadzić kolejnej oceny."
 zg361_review_now_decision_confirm:0 "Ogłość rankingi!"
 zg361_ratio_strict_decision:0 "Kwota Końcowa: Sztywne 361 (10%)"
 zg361_ratio_strict_decision_desc:0 "Egzekwuj rozkład: przy pięciu lub więcej w puli ktoś musi otrzymać 3.25."
 zg361_ratio_strict_decision_tooltip:0 "Ustaw wymuszoną kwotę końcową tej jednostki oceniającej na 10%."
 zg361_ratio_strict_decision_confirm:0 "Bądź surowy."
 zg361_ratio_relaxed_decision:0 "Kwota Końcowa: Poluzowane (5%)"
 zg361_ratio_relaxed_decision_desc:0 "Zachowaj ocenianie 361, lecz poluzuj sztywną kwotę końcowych 10%."
 zg361_ratio_relaxed_decision_tooltip:0 "Ustaw wymuszoną kwotę końcową tej jednostki oceniającej na 5%."
 zg361_ratio_relaxed_decision_confirm:0 "Poluzuj to."
 zg361_ratio_off_decision:0 "Kwota Końcowa: Bez nadzoru (0%)"
 zg361_ratio_off_decision_desc:0 "Bez wymuszonej dolnej warstwy. Ocena staje się formalnością."
 zg361_ratio_off_decision_tooltip:0 "Usuń wymuszoną kwotę końcową z tej jednostki oceniającej."
 zg361_ratio_off_decision_confirm:0 "Odejdź."
 # Character interactions
 zg361_appeal_interaction:0 "Odwołanie od Oceny Wyników"
 zg361_appeal_interaction_desc:0 "Złóż formalne odwołanie od wyniku oceny tego cyklu i zażądaj ponownej rewizji. Koszt: 150 wpływów."
 zg361_review_talk_interaction:0 "Rozmowa o Wynikach"
 zg361_review_talk_interaction_desc:0 "Przeprowadź indywidualną rozmowę o wynikach z wasalem, którego ocena została ogłoszona w tym cyklu. Uspokaja nerwy."
 zg361_recommend_interaction:0 "Rekomendacja"
 zg361_recommend_interaction_desc:0 "Zarekomenduj dokonania tego rówieśnika waszemu wspólnemu bezpośredniemu zwierzchnikowi: +10 do jego następnej oceny."
 zg361_slander_interaction:0 "Pomówienie"
 zg361_slander_interaction_desc:0 "Złóż jadowity memoriał przeciwko temu rówieśnikowi: 70% szans na -15 do jego następnej oceny; jeśli zostanie przejrzany, obróci się przeciwko tobie."
 zg361_purge_interaction:0 "Dyspozycja Końcowa: Utrata Tytułu"
 zg361_purge_interaction_desc:0 "Wykonaj eliminację końcową na urzędniku z dwoma kolejnymi 3.25: pozbaw urzędu (zgodne z prawem, bez tyranii)."
 zg361_force_retire_interaction:0 "Dyspozycja Końcowa: Wymuszona Emerytura"
 zg361_force_retire_interaction_desc:0 "Zapewnij urzędnikowi z dwoma kolejnymi 3.25 godne wyjście: wymuszona emerytura, zasługi zachowane."
 # Modifiers (grades)
 zg361_grade_375:0 "Wynik 3.75 · Przekracza Oczekiwania"
 zg361_grade_375_desc:0 "Wynik tego cyklu: 3.75. Rezultaty, trudność i wpływ wyraźnie przekroczyły oczekiwania obecnej rangi. Przyznano nominację do awansu."
 zg361_grade_35:0 "Wynik 3.5 · Spełnia Oczekiwania"
 zg361_grade_35_desc:0 "Wynik tego cyklu: 3.5. Wykonałeś pracę, jakiej wymaga twoja ranga. Dobra robota. Tak trzymaj."
 zg361_grade_325:0 "Wynik 3.25 · Wymaga Poprawy"
 zg361_grade_325_desc:0 "Wynik tego cyklu: 3.25. Czterokrotna konsekwencja: skarb lokalny -50, złoto osobiste -25, zasługa -60 tam, gdzie jest to wspierane, oraz wynagrodzenie -25% przez rok, tam gdzie to ma zastosowanie."
 zg361_pip:0 "Plan Poprawy Wyników"
 zg361_pip_desc:0 "Umieszczony na Planie Poprawy Wyników (PIP). Dwa kolejne cykle 3.25 uruchamiają proces eliminacji końcowej."
 zg361_demoted:0 "Zdegradowany, lecz Pozostawiony"
 zg361_demoted_desc:0 "Łagodny wynik eliminacji: zdegradowany i pozostawiony, żołd zmniejszony o połowę. Zobaczymy, jak pójdzie w następnym cyklu."
 zg361_promotion_track:0 "Ścieżka Awansu"
 zg361_promotion_track_desc:0 "Dwa kolejne cykle 3.75: ścieżka awansu otwarta. Wynik kandydata na mianowanie znacznie wzrasta; tymczasowo podniesiono limit poziomu zasług."
 # Opinions
 zg361_favored:0 "Łaska Zwierzchnika"
 zg361_poor_review:0 "Słaba Ocena"
 zg361_annoyed:0 "Męczące Odwołania"
 zg361_purged:0 "Wyeliminowany jako Końcowy"
 zg361_forced_retire:0 "Zmuszony do Emerytury"
 zg361_merciful:0 "Okazana Łaska"
 zg361_rigged:0 "Sfałszowana Ocena"
 zg361_appeal_rejected:0 "Odwołanie Odrzucone"
 zg361_talked:0 "Rozmowa o Wynikach"
 zg361_slandered_me:0 "Złośliwe Pomówienie"
 zg361_jingcha_attended:0 "Uczestniczył w Wielkim Przeglądzie"
 # Activity
 activity_zg361_jingcha:0 "Wielki Przegląd Administracyjny"
 activity_zg361_jingcha_desc:0 "Zwołaj swoich bezpośrednich urzędników do swojej siedziby i osobiście oceń ich dokonania. Gdy zgromadzenie dobiegnie końca, rankingi zostają ogłoszone natychmiast."
 activity_zg361_jingcha_host_desc:0 "Przewodnicz Wielkiemu Przeglądowi Administracyjnemu, oceń swoich bezpośrednich urzędników twarzą w twarz i ogłoś rankingi po jego zakończeniu."
 activity_zg361_jingcha_guest_desc:0 "Udaj się do siedziby swego bezpośredniego zwierzchnika i osobiście staw się do oceny."
 activity_zg361_jingcha_selection_tooltip:0 "Zwołaj swoich bezpośrednich urzędników do swej siedziby na ocenę."
 activity_zg361_jingcha_conclusion_desc:0 "Wielki Przegląd Administracyjny dobiegł końca, wyniki zostały wywieszone."
 zg361_jingcha_province_desc:0 "Przeprowadź Wielki Przegląd Administracyjny w swojej siedzibie."
 zg361_jingcha_phase:0 "Ocena"
 # Events
 zg361.1.t:0 "Przeprowadzona Przez Ciebie Ocena: Lista Sfinalizowana"
 zg361.1.desc:0 "To jest ocena wyników, którą przeprowadziłeś dla swoich bezpośrednich urzędników, nie twoja własna ocena od zwierzchnika. Biuro ocen sfinalizowało listę zgodnie z obecną regułą kwoty końcowej tej warstwy.\n\nW tym cyklu: [TopScope.GetValue('zg361_n_375')|0] przekroczyło oczekiwania, [TopScope.GetValue('zg361_n_35')|0] spełniło, [TopScope.GetValue('zg361_n_325')|0] musi się poprawić; [TopScope.GetValue('zg361_n_elim')|0] staje teraz w obliczu eliminacji końcowej.\n\nJeśli zwierzchnik oceni ciebie, osobny dokument wprost poda twój stopień, KPI i rangę."
 zg361.1.a:0 "Przyjęto do wiadomości."
 zg361.2.t:0 "Ocena zwierzchnika: 3.75 · Powyżej oczekiwań"
 zg361.2.desc:0 "[zg361_reviewing_superior.GetShortUIName] przypisał Ci ocenę w tej rewizji.\n\nTwoja nota: 3.75 (powyżej oczekiwań)\nKPI: [TopScope.GetValue('zg361_result_kpi')|0]   Pozycja w kohorcie: [TopScope.GetValue('zg361_result_rank')|0] z [TopScope.GetValue('zg361_result_cohort_n')|0]\n\nTwoje wyniki, trudność i zakres wpływu przewyższyły Twoją obecną rangę. Należne nagrody za zasługi, skarb lokalny i nominację zostaną zaksięgowane wszędzie tam, gdzie pozwalają na to Twoja funkcja i instytucje."
 zg361.2.a:0 "Dziękuję za Twoje wskazówki, mój panie!"
 zg361.3.t:0 "Ocena zwierzchnika: 3.5 · Zgodnie z oczekiwaniami"
 zg361.3.desc:0 "[zg361_reviewing_superior.GetShortUIName] przypisał Ci ocenę w tej rewizji.\n\nTwoja nota: 3.5 (zgodnie z oczekiwaniami)\nKPI: [TopScope.GetValue('zg361_result_kpi')|0]   Pozycja w kohorcie: [TopScope.GetValue('zg361_result_rank')|0] z [TopScope.GetValue('zg361_result_cohort_n')|0]\n\nWykonano pracę wymaganą na Twojej randze. Ani więcej, ani mniej."
 zg361.3.a:0 "...Tak trzymać."
 zg361.4.t:0 "Ocena zwierzchnika: 3.25 · Wymaga poprawy"
 zg361.4.desc:0 "[zg361_reviewing_superior.GetShortUIName] przypisał Twoją ocenę w tym przeglądzie.\n\nTwoja nota: 3.25 (wymaga poprawy)\nKPI: [TopScope.GetValue('zg361_result_kpi')|0]   Pozycja w kohorcie: [TopScope.GetValue('zg361_result_rank')|0] z [TopScope.GetValue('zg361_result_cohort_n')|0]\n\nNie spełniasz wymagań na swoim stanowisku. Obowiązuje poczwórne rozliczenie: 50 z lokalnego skarbca, jeśli istnieje, 25 złota osobistego, 60 zasług tam, gdzie to wspierane, oraz 25% obniżenia uposażenia na rok, jeśli dotyczy. Rozpoczyna się Plan Poprawy Wyników — jeszcze jedno 3.25 oznacza eliminację z najniższego szczebla."
 zg361.4.a:0 "Przyjąć to. (Stres zmniejszony)"
 zg361.4.b:0 "Odwołanie! Ta ocena jest sfałszowana! (Koszt: 150 wpływów, 30% szans na odwrócenie)"
 zg361.4.c:0 "Mam to gdzieś. Odpuszczam. (Stres zmniejszony, -10 do przyszłorocznej oceny)"
 zg361.4.d:0 "Zaciskam zęby. Niech przemówią wyniki za rok. (Stres zwiększony, +10 do przyszłorocznej oceny)"
 zg361.5.t:0 "Lista eliminacji z ostatniego koszyka"
 zg361.5.desc:0 "W tym cyklu [TopScope.GetValue('zg361_n_elim')|0] urzędników otrzymało 3.25 dwa razy z rzędu i czeka ich eliminacja z ostatniego koszyka. Lista leży na Twoim biurku; pędzel z cynobru jest w Twojej dłoni. (Możesz też usuwać ich po kolei z widoku dworu.)\n\nJak zamierzasz ich rozdysponować?"
 zg361.5.a:0 "Według procedury. (Każdy oceniany według kartoteki, łaski i zdolności: czystka, przymusowa emerytura lub degradacja)"
 zg361.5.b:0 "Okaż łaskę — zdegraduj wszystkich, ale zostaw ich na służbie. (-100 prestiżu)"
 zg361.5.c:0 "Daj jeszcze rok obserwacji. (-50 prestiżu, dwór jest wdzięczny)"
 zg361.6.t:0 "Jesteś na liście eliminacji"
 zg361.6.desc:0 "Dwa kolejne 3.25 i ostrze eliminacji z ostatniego koszyka wreszcie spadło na Ciebie. Urzędnicy Twojego pana już ruszyli z listą.\n\nMasz ostatnie okno."
 zg361.6.a:0 "Ostatnie odwołanie! Żądaj ponownej rewizji! (Koszt: 200 wpływów, 40% szans na degradację zamiast tego — porażka oznacza utratę tytułu)"
 zg361.6.b:0 "Rozdaj fortunę we właściwe ręce. (Koszt: 300 złota, degradacja, ale pozostajesz na służbie)"
 zg361.6.c:0 "Przyjmij emeryturę z godnością."
 zg361.6.d:0 "Do powstania! (Załóż frakcję niepodległościową przeciw swojemu panu)"
 zg361.10.t:0 "Spotkanie kalibracyjne wyników"
 zg361.10.desc:0 "Projekt listy ministerstwa leży na Twoim biurku: [TopScope.GetValue('zg361_n_375')|0] oznaczonych jako powyżej oczekiwań, [TopScope.GetValue('zg361_n_35')|0] spełniających je, [TopScope.GetValue('zg361_n_325')|0] wymagających poprawy.\n\nZanim lista zostanie wywieszona, pędzel wciąż jest Twój. Podnieś kogoś, pchnij kogoś w dół — lecz jeśli dwór zwęszy manipulację, nazwą rzecz po imieniu: sfałszowana ocena."
 zg361.10.a:0 "Lista jest poprawna. Wywieś ją."
 zg361.10.b:0 "Podnieś jednego: zamień ostatniego 3.75 z pierwszym 3.5."
 zg361.10.c:0 "Pchnij jednego w dół: przenieś ostatnie 3.5 do 3.25."
 zg361.11.t:0 "Pędzel z cynobru spadł"
 zg361.11.desc:0 "Unosisz pędzel z cynobru i delikatnie przesuwasz nazwisko w górę listy. Ten zepchnięty nigdy się nie dowie, że jego pan zmienił zdanie z dnia na dzień."
 zg361.11.a:0 "Wywieś wyniki."
 zg361.12.t:0 "Pędzel z cynobru spadł"
 zg361.12.desc:0 "Unosisz pędzel z cynobru i dopisujesz nazwisko na skraju listy. Ktoś musi dostać to 3.25 — czemu nie on?"
 zg361.12.a:0 "Wywieś wyniki."
 zg361.20.t:0 "Ocena wyników"
 zg361.20.desc:0 "Trwa ocena wyników."
 zg361.20.a:0 "Kontynuuj."
 zg361.30.t:0 "Dzikie psy i białe króliki"
 zg361.30.desc:0 "Biuro ocen dołączyło drugą stronę do swego poufnego memoriału: [TopScope.GetValue('zg361_n_dog')|0] \"dzikich psów\" — świetne wyniki, mierne wartości; oraz [TopScope.GetValue('zg361_n_rabbit')|0] \"białych królików\" — lojalni ponad miarę, beznadziejni w robocie.\n\nŻaden z tych rodzajów nie nadaje się na dłuższą metę. Co rozkażesz?"
 zg361.30.a:0 "Zrównoważona łaska: zostaw dzikie psy pod obserwacją, pociesz króliki."
 zg361.30.b:0 "Ukarać dzikie psy i odstrzelić króliki. (+50 do prestiżu; dzikie psy tracą zasługi i trafiają na PIP, króliki zostają odstrzelone)"
 zg361_scoreboard_open:0 "Tablica wyników"
 zg361_scoreboard_open_tooltip:0 "Otwórz ostatnią opublikowaną oficjalną tablicę wyników."
 zg361_scoreboard_title:0 "Niebiańska Tablica Wyników Urzędników"
 zg361_scoreboard_year:0 "Rok oceny"
 zg361_scoreboard_total:0 "Kohorta"
 zg361_scoreboard_grade_375:0 "#P 3.75#!"
 zg361_scoreboard_grade_35:0 "#V 3.5#!"
 zg361_scoreboard_grade_325:0 "#N 3.25#!"
 zg361_scoreboard_dash:0 "—"
 zg361_scoreboard_status_promotion:0 "#P Ścieżka awansu#!"
 zg361_scoreboard_status_pip:0 "#N PIP#!"
 zg361_scoreboard_col_rank:0 "Pozycja"
 zg361_scoreboard_col_official:0 "Urzędnik / Urząd"
 zg361_scoreboard_col_kpi:0 "KPI"
 zg361_scoreboard_col_values:0 "Wartości"
 zg361_scoreboard_col_grade:0 "Ocena"
 zg361_scoreboard_col_streak:0 "Seria"
 zg361_scoreboard_col_status:0 "Status"
 zg361_scoreboard_hint:0 "Wybierz urzędnika, aby otworzyć jego kartę. Lista opublikowana jako ostatnia zachowuje urzędników, którzy później opuścili urząd."
 zg361_scoreboard_tab_managed:0 "Urzędnicy przez Ciebie oceniani"
 zg361_scoreboard_tab_received:0 "Twoja kohorta oceniająca"
 zg361_scoreboard_reviewer:0 "Pan oceniający"
 zg361_scoreboard_former_official:0 "Były urzędnik (zachowany na opublikowanej tablicy)"
 zg361_jingcha_phase_desc:0 "Bezpośredni urzędnicy zdają raporty ze swej pracy, podczas gdy ich pan osobiście przegląda zapisy."
 activity_zg361_jingcha_destination_selection:0 "Wybierz miejsce oceny"
 activity_zg361_jingcha_guest_help_text:0 "Bezpośredni czynni urzędnicy zostaną zaproszeni do siedziby swego pana na ocenę."
 activity_zg361_jingcha_cooldown:0 "Wielka Ewaluacja Administracyjna jest w trakcie odnowienia"
 activity_zg361_jingcha_predicted_cost:0 "Wielka Ewaluacja Administracyjna jest obowiązkiem ustawowym i nie kosztuje ani bogactwa Skarbu, ani złota osobistego."
 activity_zg361_jingcha_host_an_a:0 "$host_activity_a$"
 zg361_refused_jingcha:0 "Odmówiono Wielkiej Ewaluacji"
 zg361.40.t:0 "Nadszedł termin oceny"
 zg361.40.desc:0 "Rejestry, rachunki i księgi zasług są gotowe. Z mocy prawa muszę wezwać moich bezpośrednich czynnych urzędników do mojej siedziby na Wielką Ewaluację Administracyjną, nie obciążając przy tym ani Skarbu, ani mojej prywatnej kiesy.\n\nJeśli sprzeciwię się temu obowiązkowi, mój bezpośredni zwierzchnik odnotuje poważny błąd w zarządzaniu. Jeśli nie mam zwierzchnika, ucierpi autorytet samej instytucji."
 zg361.40.a:0 "Przeprowadź ocenę zgodnie z wymogiem"
 zg361.40.a.tt:0 "Otwórz darmowy planer aktywności. Ocena musi zakończyć się w ciągu 300 dni; samo otwarcie i zamknięcie planera nie spełnia obowiązku."
 zg361.40.b:0 "W tym roku jej nie zwołuję"
 zg361.40.b.tt:0 "Z bezpośrednim zwierzchnikiem: jego Opinia o Tobie spada, a Twoja następna ocena otrzymuje jednorazową karę KPI w wysokości 50.\nJako niezależny najwyższy pan: tracisz 200 Prestiżu, bez fałszowania samooceny."
 zg361.41.t:0 "Ocena zaległa"
 zg361.41.desc:0 "Termin Wielkiej Ewaluacji Administracyjnej minął bez jej zakończenia."
 zg361.41.a:0 "Rekord zgodności został rozliczony"
