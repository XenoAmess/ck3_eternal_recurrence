l_spanish:
 # Game rules
 rule_zg361_enabled:0 "Evaluación de Rendimiento de Vasallos (Sistema 361)"
 setting_zg361_on:0 "Activado"
 setting_zg361_on_desc:0 "Los soberanos celestiales de rango ducal o superior evalúan a sus oficiales titulares directos, clasificándolos en 3.75 / 3.5 / 3.25; los condes y barones son evaluados, pero no dirigen evaluaciones."
 setting_zg361_off:0 "Desactivado"
 setting_zg361_off_desc:0 "Desactiva el sistema de evaluación del rendimiento."
 rule_zg361_frequency:0 "Ciclo de Evaluación"
 setting_zg361_freq_yearly:0 "Evaluación Anual"
 setting_zg361_freq_yearly_desc:0 "Una temporada de rendimiento cada año."
 setting_zg361_freq_three_year:0 "Evaluación Trienal"
 setting_zg361_freq_three_year_desc:0 "Una gran evaluación cada tres años, al viejo estilo."
 rule_zg361_bottom_ratio:0 "Cupo de Cola"
 setting_zg361_ratio_strict:0 "361 Estricto (10%)"
 setting_zg361_ratio_strict_desc:0 "La distribución 361 se impone: aun cuando todos cumplan las expectativas, alguien en un grupo lo bastante grande debe asumir el 3.25."
 setting_zg361_ratio_relaxed:0 "Relajado (5%)"
 setting_zg361_ratio_relaxed_desc:0 "Mantén la calificación 361, pero afloja la cuota rígida del 10% inferior."
 setting_zg361_ratio_off:0 "Laissez-faire (0%)"
 setting_zg361_ratio_off_desc:0 "Sin tramo inferior forzado. La evaluación se vuelve un formalismo."
 # Decision group & decisions
 decision_group_type_zg361:0 "Evaluación de Rendimiento"
 zg361_review_now_decision:0 "Realizar Evaluación de Rendimiento Ahora"
 zg361_review_now_decision_desc:0 "Ordena a la oficina de evaluación que clasifique a tu cuadro directivo de inmediato en lugar de esperar a la temporada anual. Los oficiales ya evaluados este año no serán evaluados de nuevo."
 zg361_review_now_decision_tooltip:0 "Evalúa inmediatamente al menos a un cargo titular directo en activo; no puedes realizar otra evaluación en el mismo año natural."
 zg361_review_now_decision_confirm:0 "¡Publica las clasificaciones!"
 zg361_ratio_strict_decision:0 "Cupo de Cola: 361 Estricto (10%)"
 zg361_ratio_strict_decision_desc:0 "Aplica la distribución: con cinco o más en el grupo, alguien debe asumir el 3.25."
 zg361_ratio_strict_decision_tooltip:0 "Fija al 10% el cupo inferior forzado de esta unidad de evaluación."
 zg361_ratio_strict_decision_confirm:0 "Mantener la estrictez."
 zg361_ratio_relaxed_decision:0 "Cupo de Cola: Relajado (5%)"
 zg361_ratio_relaxed_decision_desc:0 "Mantén la calificación 361, pero afloja la cuota rígida del 10% inferior."
 zg361_ratio_relaxed_decision_tooltip:0 "Fija al 5% el cupo inferior forzado de esta unidad de evaluación."
 zg361_ratio_relaxed_decision_confirm:0 "Aflojar."
 zg361_ratio_off_decision:0 "Cupo de Cola: Laissez-faire (0%)"
 zg361_ratio_off_decision_desc:0 "Sin tramo inferior forzado. La evaluación se vuelve un formalismo."
 zg361_ratio_off_decision_tooltip:0 "Elimina el cupo inferior forzado de esta unidad de evaluación."
 zg361_ratio_off_decision_confirm:0 "Dejar correr."
 # Character interactions
 zg361_appeal_interaction:0 "Apelar la Evaluación de Rendimiento"
 zg361_appeal_interaction_desc:0 "Apela formalmente el resultado de este ciclo y exige una reevaluación. Cuesta 150 de influencia."
 zg361_review_talk_interaction:0 "Charla de Rendimiento"
 zg361_review_talk_interaction_desc:0 "Mantén una charla individual de rendimiento con un vasallo cuyo resultado se haya publicado este ciclo. Calma los nervios."
 zg361_recommend_interaction:0 "Recomendar"
 zg361_recommend_interaction_desc:0 "Recomienda el historial de este par ante tu señor feudal común: +10 en su próxima evaluación."
 zg361_slander_interaction:0 "Calumniar"
 zg361_slander_interaction_desc:0 "Presenta un memorial venenoso contra este par: 70% de probabilidad de -15 en su próxima evaluación; si te descubren, te sale el tiro por la culata."
 zg361_purge_interaction:0 "Disposición de Cola: Quitar Título"
 zg361_purge_interaction_desc:0 "Ejecuta la eliminación de cola a un oficial con dos 3.25 consecutivos: se le retira el cargo (causa legal, sin tiranía)."
 zg361_force_retire_interaction:0 "Disposición de Cola: Jubilación Forzada"
 zg361_force_retire_interaction_desc:0 "Concede a un oficial con dos 3.25 consecutivos una salida digna: jubilación forzosa, mérito intacto."
 # Modifiers (grades)
 zg361_grade_375:0 "Rendimiento 3.75 · Supera Expectativas"
 zg361_grade_375_desc:0 "Resultado de este ciclo: 3.75. Los resultados, la dificultad y el impacto superaron claramente las expectativas del rango actual. Nominación a ascenso concedida."
 zg361_grade_35:0 "Rendimiento 3.5 · Cumple Expectativas"
 zg361_grade_35_desc:0 "Resultado de este ciclo: 3.5. Hiciste el trabajo que tu rango exige. Buen trabajo. Sigue así."
 zg361_grade_325:0 "Rendimiento 3.25 · Necesita Mejorar"
 zg361_grade_325_desc:0 "Resultado de este ciclo: 3.25. Consecuencia cuádruple: tesorería local -50, oro personal -25, mérito -60 si procede, y salario -25% durante un año cuando sea aplicable."
 zg361_pip:0 "Plan de Mejora del Rendimiento"
 zg361_pip_desc:0 "Incluido en un Plan de Mejora del Rendimiento (PIP). Dos ciclos consecutivos de 3.25 activan el proceso de eliminación de cola."
 zg361_demoted:0 "Degradado pero Mantenido"
 zg361_demoted_desc:0 "Resultado de eliminación indulgente: degradado y mantenido, salario a la mitad. Veremos cómo va el próximo ciclo."
 zg361_promotion_track:0 "Vía de Ascenso"
 zg361_promotion_track_desc:0 "Dos ciclos consecutivos de 3.75: la vía de ascenso queda abierta. La puntuación de candidato a nombramiento aumenta mucho; el tope de nivel de mérito se eleva temporalmente."
 # Opinions
 zg361_favored:0 "Favor del Señor"
 zg361_poor_review:0 "Evaluación Deficiente"
 zg361_annoyed:0 "Apelación Agotadora"
 zg361_purged:0 "Eliminado como Cola"
 zg361_forced_retire:0 "Forzado a Jubilarse"
 zg361_merciful:0 "Indulto Concedido"
 zg361_rigged:0 "Evaluación Amañada"
 zg361_appeal_rejected:0 "Apelación Rechazada"
 zg361_talked:0 "Charla de Rendimiento"
 zg361_slandered_me:0 "Calumnia Maliciosa"
 zg361_jingcha_attended:0 "Asistió a la Gran Evaluación"
 # Activity
 activity_zg361_jingcha:0 "Gran Evaluación Administrativa"
 activity_zg361_jingcha_desc:0 "Convoca a tus oficiales titulares directos en tu sede y revisa sus historiales en persona. Cuando concluya la asamblea, las clasificaciones se publican de inmediato."
 activity_zg361_jingcha_host_desc:0 "Preside la Gran Evaluación Administrativa, evalúa a tus oficiales directos cara a cara y publica las clasificaciones al concluir."
 activity_zg361_jingcha_guest_desc:0 "Viaja a la sede de tu señor feudal directo y enfrenta su evaluación en persona."
 activity_zg361_jingcha_selection_tooltip:0 "Convoca a tus oficiales titulares directos en tu sede para la evaluación."
 activity_zg361_jingcha_conclusion_desc:0 "La Gran Evaluación Administrativa ha concluido y los resultados están publicados."
 zg361_jingcha_province_desc:0 "Celebra la Gran Evaluación Administrativa en tu sede."
 zg361_jingcha_phase:0 "Evaluación"
 # Events
 zg361.1.t:0 "Evaluación que Realizaste: Plantilla Finalizada"
 zg361.1.desc:0 "Esta es la evaluación de rendimiento que realizaste a tus oficiales directos, no tu propia calificación de un superior. La oficina de evaluación ha finalizado la plantilla bajo la regla actual de cupo de cola de este nivel.\n\nEste ciclo: [TopScope.GetValue('zg361_n_375')|0] superaron expectativas, [TopScope.GetValue('zg361_n_35')|0] las cumplieron, [TopScope.GetValue('zg361_n_325')|0] deben mejorar; [TopScope.GetValue('zg361_n_elim')|0] afrontan ahora la eliminación de cola.\n\nSi un superior te evalúa, un escrito aparte indicará tu grado, KPI y rango explícitamente."
 zg361.1.a:0 "Entendido."
 zg361.2.t:0 "Calificación del superior: 3.75 · Supera las expectativas"
 zg361.2.desc:0 "[zg361_reviewing_superior.GetShortUIName] te ha asignado tu calificación en esta evaluación.\n\nTu nota: 3.75 (supera las expectativas)\nKPI: [TopScope.GetValue('zg361_result_kpi')|0]   Posición en la cohorte: [TopScope.GetValue('zg361_result_rank')|0] de [TopScope.GetValue('zg361_result_cohort_n')|0]\n\nTus resultados, dificultad y alcance del impacto superaron tu rango actual. Las recompensas de mérito, tesoro local y nominación se aplican donde tu cargo e instituciones lo permitan."
 zg361.2.a:0 "¡Gracias por su guía, mi señor!"
 zg361.3.t:0 "Calificación del superior: 3.5 · Conforme a las expectativas"
 zg361.3.desc:0 "[zg361_reviewing_superior.GetShortUIName] te ha asignado tu calificación en esta evaluación.\n\nTu nota: 3.5 (conforme a las expectativas)\nKPI: [TopScope.GetValue('zg361_result_kpi')|0]   Posición en la cohorte: [TopScope.GetValue('zg361_result_rank')|0] de [TopScope.GetValue('zg361_result_cohort_n')|0]\n\nHiciste el trabajo que tu rango exige. Ni más, ni menos."
 zg361.3.a:0 "...A seguir así."
 zg361.4.t:0 "Calificación del superior: 3.25 · Necesita mejorar"
 zg361.4.desc:0 "[zg361_reviewing_superior.GetShortUIName] ha asignado tu calificación para esta revisión.\n\nTu nota: 3.25 (necesita mejorar)\nKPI: [TopScope.GetValue('zg361_result_kpi')|0]   Posición en la cohorte: [TopScope.GetValue('zg361_result_rank')|0] de [TopScope.GetValue('zg361_result_cohort_n')|0]\n\nNo llegas al nivel exigido para tu puesto. Se aplica la liquidación cuádruple: 50 del tesoro local si existe, 25 de oro personal, 60 de mérito cuando el sistema lo permita, y un recorte salarial del 25% durante un año cuando proceda. Comienza un Plan de Mejora del Rendimiento; un 3.25 más supone la eliminación del último nivel."
 zg361.4.a:0 "Aceptarlo. (Estrés reducido)"
 zg361.4.b:0 "¡Apelar! ¡Esta evaluación está amañada! (Cuesta 150 de influencia, 30% de probabilidad de revocarla)"
 zg361.4.c:0 "Rendirse. Ir a la deriva. (Estrés reducido, -10 a la evaluación del próximo año)"
 zg361.4.d:0 "Dar el callo. Que los resultados del próximo año hablen. (Estrés aumentado, +10 a la evaluación del próximo año)"
 zg361.5.t:0 "Lista de eliminación del último nivel"
 zg361.5.desc:0 "Este ciclo, [TopScope.GetValue('zg361_n_elim')|0] funcionarios han sacado 3.25 dos veces seguidas y les toca la eliminación del último nivel. La lista está sobre tu escritorio; el pincel bermellón, en tu mano. (También puedes deshacerte de ellos uno por uno desde la vista de la corte.)\n\n¿Cómo te deshaces de ellos?"
 zg361.5.a:0 "Por la ley. (Cada uno se juzga por expediente, favor y habilidad: purga, jubilación forzosa o degradación)"
 zg361.5.b:0 "Muestra clemencia: degrada a todos, pero consérvalos. (-100 de prestigio)"
 zg361.5.c:0 "Concede un año más de observación. (-50 de prestigio, la corte agradece tu clemencia)"
 zg361.6.t:0 "Estás en la lista de eliminación"
 zg361.6.desc:0 "Dos 3.25 seguidos, y por fin ha caído sobre ti la cuchilla de la eliminación del último nivel. Los oficiales de tu señor ya han salido con la lista.\n\nTe queda una última ventana."
 zg361.6.a:0 "¡Apelación final! ¡Exige una reevaluación! (Cuesta 200 de influencia, 40% de probabilidad de ser degradado en su lugar — si fracasa, pierdes el título)"
 zg361.6.b:0 "Gasta tu fortuna en las manos adecuadas. (Cuesta 300 de oro, degradado pero retenido)"
 zg361.6.c:0 "Acepta la jubilación con dignidad."
 zg361.6.d:0 "¡Levantarse! (Funda una facción independentista contra tu señor)"
 zg361.10.t:0 "Reunión de calibración del desempeño"
 zg361.10.desc:0 "El borrador de la lista del ministerio está sobre tu escritorio: [TopScope.GetValue('zg361_n_375')|0] marcados como superan las expectativas, [TopScope.GetValue('zg361_n_35')|0] las cumplen, [TopScope.GetValue('zg361_n_325')|0] necesitan mejorar.\n\nAntes de que los resultados se publiquen, el pincel aún es tuyo. Eleva a alguien, hunde a alguien — pero si la corte olisquea la manipulación, lo llamará por su nombre: una evaluación amañada."
 zg361.10.a:0 "La lista es correcta. Publicarla."
 zg361.10.b:0 "Elevar a uno: intercambiar el último 3.75 con el primer 3.5."
 zg361.10.c:0 "Hundir a uno: bajar al último 3.5 a 3.25."
 zg361.11.t:0 "El pincel bermellón ha caído"
 zg361.11.desc:0 "Levantas el pincel bermellón y subes con cuidado un nombre en la lista. El que ha sido relegado jamás sabrá que su señor cambió de parecer de la noche a la mañana."
 zg361.11.a:0 "Publicar los resultados."
 zg361.12.t:0 "El pincel bermellón ha caído"
 zg361.12.desc:0 "Levantas el pincel bermellón y añades un nombre en el borde de la lista. Alguien tiene que cargar con este 3.25 — ¿por qué no él?"
 zg361.12.a:0 "Publicar los resultados."
 zg361.20.t:0 "Evaluación del desempeño"
 zg361.20.desc:0 "La evaluación del desempeño está en curso."
 zg361.20.a:0 "Continuar."
 zg361.30.t:0 "Perros salvajes y conejitos blancos"
 zg361.30.desc:0 "La oficina de evaluación añadió una segunda página a su memorial confidencial: [TopScope.GetValue('zg361_n_dog')|0] \"perros salvajes\" — resultados estelares, valores podridos; y [TopScope.GetValue('zg361_n_rabbit')|0] \"conejitos blancos\" — leales hasta el exceso, un desastre en el trabajo.\n\nNingún tipo sirve a largo plazo. ¿Cuál es tu gusto?"
 zg361.30.a:0 "Clemencia equilibrada: mantener a los perros salvajes bajo vigilancia, consolar a los conejos."
 zg361.30.b:0 "Castigar a los perros salvajes y jubilar a los conejos. (+50 de prestigio; los perros salvajes pierden mérito y entran en un PIP, los conejos son jubilados)"
 zg361_scoreboard_open:0 "Tablero de desempeño"
 zg361_scoreboard_open_tooltip:0 "Abrir el último tablero oficial de desempeño publicado."
 zg361_scoreboard_title:0 "Tablero de desempeño de los funcionarios celestiales"
 zg361_scoreboard_year:0 "Año de evaluación"
 zg361_scoreboard_total:0 "Cohorte"
 zg361_scoreboard_grade_375:0 "#P 3.75#!"
 zg361_scoreboard_grade_35:0 "#V 3.5#!"
 zg361_scoreboard_grade_325:0 "#N 3.25#!"
 zg361_scoreboard_dash:0 "—"
 zg361_scoreboard_status_promotion:0 "#P Vía de ascenso#!"
 zg361_scoreboard_status_pip:0 "#N PIP#!"
 zg361_scoreboard_col_rank:0 "Rango"
 zg361_scoreboard_col_official:0 "Funcionario / Cargo"
 zg361_scoreboard_col_kpi:0 "KPI"
 zg361_scoreboard_col_values:0 "Valores"
 zg361_scoreboard_col_grade:0 "Calificación"
 zg361_scoreboard_col_streak:0 "Racha"
 zg361_scoreboard_col_status:0 "Estado"
 zg361_scoreboard_hint:0 "Selecciona un funcionario para abrir su vista de personaje. La última lista publicada conserva a los funcionarios que después dejaron el cargo."
 zg361_scoreboard_tab_managed:0 "Funcionarios que evalúas"
 zg361_scoreboard_tab_received:0 "Tu cohorte de evaluación"
 zg361_scoreboard_reviewer:0 "Señor evaluador"
 zg361_scoreboard_former_official:0 "Ex funcionario (conservado en este tablero publicado)"
 zg361_jingcha_phase_desc:0 "Los funcionarios directos presentan su trabajo mientras su señor revisa los expedientes en persona."
 activity_zg361_jingcha_destination_selection:0 "Elige la sede de la evaluación"
 activity_zg361_jingcha_guest_help_text:0 "Los funcionarios directos en activo serán invitados a la sede de su señor para la evaluación."
 activity_zg361_jingcha_cooldown:0 "La Gran Evaluación Administrativa está en enfriamiento"
 activity_zg361_jingcha_predicted_cost:0 "La Gran Evaluación Administrativa es un deber estatutario y no cuesta ni riqueza del Tesoro ni oro personal."
 activity_zg361_jingcha_host_an_a:0 "$host_activity_a$"
 zg361_refused_jingcha:0 "Rehusó celebrar la Gran Evaluación"
 zg361.40.t:0 "Llega el turno de la evaluación"
 zg361.40.desc:0 "Los registros, las cuentas y los expedientes de mérito están listos. Por ley, debo convocar a mis funcionarios directos en activo a mi sede para una Gran Evaluación Administrativa, sin cobrar ni al Tesoro ni a mi bolsa privada.\n\nSi desobedezco este deber, mi superior directo anotará un fracaso grave de gobierno. Si no tengo superior, será la propia institución la que pierda su autoridad."
 zg361.40.a:0 "Celebrar la evaluación según lo exigido"
 zg361.40.a.tt:0 "Abrir el planificador de actividades gratuito. La evaluación debe concluir en 300 días; abrir y cerrar el planificador no cumple con el deber."
 zg361.40.b:0 "No la celebraré este año"
 zg361.40.b.tt:0 "Con un superior directo: su Opinión sobre ti cae, y tu próxima evaluación recibe una penalización de KPI de un solo uso de 50.\nComo señor supremo independiente: pierdes 200 de Prestigio, sin autoevaluación falsificada."
 zg361.41.t:0 "Evaluación vencida"
 zg361.41.desc:0 "El plazo de la Gran Evaluación Administrativa ha pasado sin que concluya."
 zg361.41.a:0 "El registro de cumplimiento está liquidado"
