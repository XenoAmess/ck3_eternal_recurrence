l_spanish:
 zg361cp.26.t:0 "Work and Visibility Are Different Ledgers"
 zg361cp.26.desc:0 "Delivery, reporting and relationship hours spend the same finite project capacity, but only delivery creates hard output."
 zg361cp.26.a:0 "Protect delivery and keep reporting lean."
 zg361cp.26.b:0 "Balance delivery with a fuller account."
 zg361cp.26.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361cp.27.t:0 "Sign One Hundred Percent of the Credit"
 zg361cp.27.desc:0 "The subject, direct manager and cross-department contributor must sign a complete ten-thousand-basis-point allocation."
 zg361cp.27.a:0 "Give the subject the clear majority."
 zg361cp.27.b:0 "Use a balanced cross-functional split."
 zg361cp.27.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361cp.28.t:0 "Credit Claim and Audit Reversal"
 zg361cp.28.desc:0 "A credit transfer must be net zero, and a rejected grab must be reversed without rewriting the signed baseline."
 zg361cp.28.a:0 "Uphold a bounded manager claim."
 zg361cp.28.b:0 "Reverse the grab after evidence review."
 zg361cp.28.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361cp.29.t:0 "Metric Packaging and Audit"
 zg361cp.29.desc:0 "Short-term KPI gain, delayed cost and fraud clawback settle as separate traceable entries."
 zg361cp.29.a:0 "Record a genuine improvement."
 zg361cp.29.b:0 "Record gaming and its delayed cost."
 zg361cp.29.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361cp.30.t:0 "One Project Wins the Capacity Race"
 zg361cp.30.desc:0 "One bounded project slot and a finite capacity book must be reserved before anyone spends project hours."
 zg361cp.30.a:0 "Fund a forty-hour subject-led project."
 zg361cp.30.b:0 "Fund a sixty-hour cross-functional project."
 zg361cp.30.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361cp.31.t:0 "Sponsor Credit Has a Cap and Expiry"
 zg361cp.31.desc:0 "Sponsor visibility is temporary, bounded and cannot manufacture hard output."
 zg361cp.31.a:0 "Grant a small transparent introduction."
 zg361cp.31.b:0 "Spend a bounded sponsor balance."
 zg361cp.31.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361cp.54.t:0 "Reporting Consumes Delivery Capacity"
 zg361cp.54.desc:0 "Building the packet spends real hours from the project without creating hard output."
 zg361cp.54.a:0 "Build the signed short fact sheet."
 zg361cp.54.b:0 "Build the long narrative and pay four hours."
 zg361cp.54.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361cp.55.t:0 "Routing Is Not Reading"
 zg361cp.55.desc:0 "A routed report becomes visible only when a manager spends one of two finite deep-read slots."
 zg361cp.55.a:0 "Spend one slot on the direct manager."
 zg361cp.55.b:0 "Spend both slots on direct and skip-level readers."
 zg361cp.55.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361cp.56.t:0 "Forward Without Quietly Taking Credit"
 zg361cp.56.desc:0 "Forwarded attribution starts from the signed contribution book and every transfer remains net zero."
 zg361cp.56.a:0 "Forward the signed shares unchanged."
 zg361cp.56.b:0 "Transfer five hundred basis points to the manager."
 zg361cp.56.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361cp.57.t:0 "Freeze the Report Version"
 zg361cp.57.desc:0 "Only a complete ten-thousand-basis-point attribution may receive the author's version signature."
 zg361cp.57.a:0 "Sign version one."
 zg361cp.57.b:0 "Sign version two after evidence review."
 zg361cp.57.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361cp.58.t:0 "Signed Material Before Routing"
 zg361cp.58.desc:0 "Direct and skip-level routing records recipients, but does not itself consume an attention slot."
 zg361cp.58.a:0 "Route to the direct manager only."
 zg361cp.58.b:0 "Route to direct and skip-level managers."
 zg361cp.58.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361cp.59.t:0 "Bad News Has a Timestamp"
 zg361cp.59.desc:0 "Early, delayed and hidden risk reports produce different remaining loss and integrity receipts."
 zg361cp.59.a:0 "Report early and halve the remaining loss."
 zg361cp.59.b:0 "Report late and retain the full loss."
 zg361cp.59.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361cp.60.t:0 "The Signed Version Owns the Idea"
 zg361cp.60.desc:0 "Idea theft is arbitrated against the frozen author signature and cross-department provenance."
 zg361cp.60.a:0 "Uphold the original author."
 zg361cp.60.b:0 "Recognize a proven joint authorship."
 zg361cp.60.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361cp.61.t:0 "Choose the Reporting Regime First"
 zg361cp.61.desc:0 "Short facts, long narrative and exception-only reporting carry different capacity costs."
 zg361cp.61.a:0 "Use short factual reports."
 zg361cp.61.b:0 "Require long narrative reports."
 zg361cp.61.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361cp.62.t:0 "Two Lines, One Recorded Choice"
 zg361cp.62.desc:0 "Conflicting priorities must resolve by frozen weights, joint arbitration or an explicit integrity debt."
 zg361cp.62.a:0 "Follow the heavier solid-line weight."
 zg361cp.62.b:0 "Use joint arbitration."
 zg361cp.62.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361cp.63.t:0 "Lock Solid and Dotted Weights"
 zg361cp.63.desc:0 "Two manager weights are frozen at cycle start and must total exactly one hundred."
 zg361cp.63.a:0 "Use seventy-thirty toward the solid line."
 zg361cp.63.b:0 "Use equal weights."
 zg361cp.63.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361cp.64.t:0 "A Manager Handoff Needs Two Signatures"
 zg361cp.64.desc:0 "Only old and new managers together may move future responsibility; historical case ownership never moves."
 zg361cp.64.a:0 "Collect both signatures and finalize."
 zg361cp.64.b:0 "Record only the old manager's signature."
 zg361cp.64.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361cp.65.t:0 "An Airborne Manager Brings a Staff Pack"
 zg361cp.65.desc:0 "Imported staff reduce retained institutional memory and can trigger a favoritism audit."
 zg361cp.65.a:0 "Import two of ten staff."
 zg361cp.65.b:0 "Import three and trigger the audit threshold."
 zg361cp.65.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361cp.66.t:0 "Business Cancellation Is Not Personal Failure"
 zg361cp.66.desc:0 "A strategic cancellation releases unspent capacity while preserving independently verified contribution."
 zg361cp.66.a:0 "Cancel now and preserve verified credit."
 zg361cp.66.b:0 "Approve a later cancellation without rewriting credit."
 zg361cp.66.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361cp.67.t:0 "Two Incumbents Need One Terminal Owner"
 zg361cp.67.desc:0 "Competition, retention or a bounded transition must end with exactly one accountable role owner."
 zg361cp.67.a:0 "Retain the assessed official."
 zg361cp.67.b:0 "Retain the cross-department incumbent."
 zg361cp.67.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361cp.68.t:0 "History Travels; Authorship Does Not"
 zg361cp.68.desc:0 "Ratings and an open PIP may travel as priors, but do not consume current quota or re-own old cases."
 zg361cp.68.a:0 "Carry one protected cycle and any open PIP."
 zg361cp.68.b:0 "Carry ratings without the PIP."
 zg361cp.68.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361cp.129.t:0 "Promotion Is a Queue With Real Slots"
 zg361cp.129.desc:0 "FIFO eligibility and one bounded award slot prevent duplicate or out-of-order promotion."
 zg361cp.129.a:0 "Queue the subject for the next opening."
 zg361cp.129.b:0 "Queue and allocate the one available slot."
 zg361cp.129.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361cp.130.t:0 "Do Not Dump a Hidden PIP"
 zg361cp.130.desc:0 "Transfer provenance records PIP disclosure, role evidence, trial outcome and source-manager accountability."
 zg361cp.130.a:0 "Disclose the PIP and run a supported trial."
 zg361cp.130.b:0 "Rescue a proven wrong-role placement."
 zg361cp.130.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361cp.131.t:0 "Exploration and Commitment Are Different Tracks"
 zg361cp.131.desc:0 "The project track and its success rule are frozen at registration, before results are known."
 zg361cp.131.a:0 "Register an exploration track."
 zg361cp.131.b:0 "Register a commitment track."
 zg361cp.131.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361cp.132.t:0 "A Timely Stop Can Earn Credit"
 zg361cp.132.desc:0 "A stop decision releases unspent capacity and keeps business outcome separate from individual judgement."
 zg361cp.132.a:0 "Stop on strong evidence and grant timely-stop credit."
 zg361cp.132.b:0 "Stop late and record named accountability."
 zg361cp.132.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361cp.133.t:0 "Learning and Liability Need Separate Tracks"
 zg361cp.133.desc:0 "System causes and learning actions are recorded without blanket punishment; proven violations remain named."
 zg361cp.133.a:0 "Record learning with no proven violation."
 zg361cp.133.b:0 "Record system learning and one named violation."
 zg361cp.133.c:0 "Defer this mechanism and open one next-cycle policy debt."
 zg361cp.134.t:0 "A Shared Metric Still Has One Owner"
 zg361cp.134.desc:0 "Contributors and dependencies may be many, but settlement authority is assigned exactly once."
 zg361cp.134.a:0 "Assign the subject as sole owner."
 zg361cp.134.b:0 "Assign the direct manager as sole owner."
 zg361cp.134.c:0 "Defer this mechanism and open one next-cycle policy debt."
