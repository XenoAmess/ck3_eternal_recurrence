l_spanish:
 zg361_next_mechanism_decision:0 "Revisar la siguiente política de rendimiento"
 zg361_next_mechanism_decision_desc:0 "Open the next unresolved policy. Every choice enters the organizational ledger immediately; only items with a connected business case also execute character, payment, appointment, or transfer actions."
 zg361_next_mechanism_decision_tooltip:0 "Abre la siguiente tarjeta de política 361."
 zg361_next_mechanism_decision_confirm:0 "Hacer pasar al siguiente responsable de política"
 zg361_reference_charter_decision:0 "Desplegar el Charter 361 de referencia"
 zg361_reference_charter_decision_desc:0 "Adopt all 361 recommended defaults and write their organizational indicators and policy debt immediately. This configures policy in bulk; items without a business case do not invent payments, appointments, hires, transfers, or refunds."
 zg361_reference_charter_decision_tooltip:0 "Configure all 361 ledger choices; concrete actions still require a connected business case."
 zg361_reference_charter_decision_confirm:0 "Lanzar todo el porfolio ya"
 zg361_mechanism_choice_a_tt:0 "Vía duradera: mejora pruebas, confianza o capacidad, consumiendo capacidad administrativa, presupuestaria o de entrega a corto plazo."
 zg361_mechanism_choice_b_tt:0 "Vía sprint: mejora el resultado inmediato, pero arrastra riesgo, burnout, deuda técnica o deuda de apelaciones a revisiones futuras."
 zg361_mechanism_choice_c_tt:0 "Shelve for this campaign: this item will not be proposed again automatically; policy debt is recorded immediately and feeds your superior's review."
 zg361_scoreboard_tab_system:0 "Cabina de políticas"
 zg361_ledger_title:0 "Libro contable 361: lo que hay bajo el cuadro de mando"
 zg361_ledger_configured:0 "Mecanismos configurados"
 zg361_ledger_checksum:0 "Suma de comprobación del porfolio"
 zg361_ledger_explainer:0 "Positivo no siempre es bueno: carga administrativa, riesgo de apelación, deuda técnica, burnout, presión de HC, deuda salarial, deuda de política y presión presupuestaria se vuelven peligrosas conforme suben."
 zg361_ledger_evidence:0 "Calidad de las pruebas"
 zg361_ledger_trust:0 "Confianza organizativa"
 zg361_ledger_admin_load:0 "Carga administrativa de rendimiento"
 zg361_ledger_appeal_risk:0 "Riesgo de apelación y procedimiento"
 zg361_ledger_delivery:0 "Valor entregado"
 zg361_ledger_stability:0 "Estabilidad"
 zg361_ledger_tech_debt:0 "Deuda técnica"
 zg361_ledger_data_quality:0 "Fiabilidad de los datos"
 zg361_ledger_burnout:0 "Burnout organizativo"
 zg361_ledger_talent:0 "Salud del talento"
 zg361_ledger_hc_pressure:0 "Presión de headcount"
 zg361_ledger_pay_debt:0 "Deuda salarial"
 zg361_ledger_policy_debt:0 "Deuda de política"
 zg361_ledger_budget_pressure:0 "Presión presupuestaria"
 zg361_ledger_hint:0 "Estos libros contables alimentan el próximo KPI del equipo y la evaluación que tu superior hará de tu desempeño directivo."
 zg361_org_high_trust:0 "Confianza organizativa: la dirección cumple su palabra"
 zg361_org_high_trust_desc:0 "Las pruebas, el feedback y la entrega se refuerzan entre sí."
 zg361_org_admin_overload:0 "Sobrecarga administrativa de rendimiento"
 zg361_org_admin_overload_desc:0 "Todo el mundo está ocupado explicando por qué todo el mundo está ocupado."
 zg361_org_burnout_crisis:0 "Crisis de burnout organizativo"
 zg361_org_burnout_crisis_desc:0 "Las horas conectado se ven excelentes; la batería de las personas, no tanto."
 zg361_org_delivery_stable:0 "Cultura de entrega estable"
 zg361_org_delivery_stable_desc:0 "No todas las puestas en producción empiezan redactando una disculpa."
 zg361_org_tech_debt_crisis:0 "Deuda técnica acumulativa"
 zg361_org_tech_debt_crisis_desc:0 "El atajo de ayer se ha convertido en el peaje de hoy."
 zg361_org_talent_healthy:0 "Cantera de talento sana"
 zg361_org_talent_healthy_desc:0 "Las estrellas, los sucesores y los colaboradores estables pueden ver un camino por delante."
 zg361m.1.t:0 "No.001 · Ficha detallada de evidencias de KPI"
 zg361m.1.desc:0 "[A / P0] Esta política se aplica a través del libro contable organizativo compartido. La regla seleccionada modifica la entrega, la evidencia, la confianza, la carga de trabajo, el riesgo, el talento o la presión fiscal, y por tanto afecta a los resultados posteriores del equipo y a la propia evaluación del responsable."
 zg361m.1.a:0 "Crear una ficha de evidencias detallada, congelar casos de producción, eficiencia, crecimiento, colaboración y valores, y asumir las horas de registro y revisión."
 zg361m.1.b:0 "Fijar la calificación de inmediato a partir de la puntuación total y la impresión del superior, publicándola rápido pero dificultando el rastreo de omisiones y errores."
 zg361m.1.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.2.t:0 "No.002 · Dirección anual de OKR y compromiso de KPI"
 zg361m.2.desc:0 "[A / P0] Esta política se aplica a través del libro contable organizativo compartido. La regla seleccionada modifica la entrega, la evidencia, la confianza, la carga de trabajo, el riesgo, el talento o la presión fiscal, y por tanto afecta a los resultados posteriores del equipo y a la propia evaluación del responsable."
 zg361m.2.a:0 "Congelar la dirección, las líneas base y los objetivos normales por puesto, permitiendo solo una reasignación por crisis con evidencia, a cambio del coste de seguimiento continuo."
 zg361m.2.b:0 "Imponer objetivos ambiciosos en todas las unidades y mantener la línea original, comprando un sprint corto a riesgo de manipular métricas y ocultar problemas."
 zg361m.2.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.3.t:0 "No.003 · Revisión de medio ciclo y reajuste de objetivos"
 zg361m.3.desc:0 "[A / P1] Esta política se aplica a través del libro contable organizativo compartido. La regla seleccionada modifica la entrega, la evidencia, la confianza, la carga de trabajo, el riesgo, el talento o la presión fiscal, y por tanto afecta a los resultados posteriores del equipo y a la propia evaluación del responsable."
 zg361m.3.a:0 "Realizar una revisión de coaching a mitad de ciclo, registrar riesgos y recursos, y permitir un reajuste documentado por crisis, dedicando tiempo de gestión para una calificación final justificable."
 zg361m.3.b:0 "Mantener los objetivos iniciales y exigir un esfuerzo de recuperación antes de la fecha límite, evitando el trabajo de reajuste pero arriesgando el reproche personal por cambios estratégicos y el retraso en malas noticias."
 zg361m.3.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.4.t:0 "No.004 · Autoevaluación y brecha de percepción"
 zg361m.4.desc:0 "[A / P1] Esta política se aplica a través del libro contable organizativo compartido. La regla seleccionada modifica la entrega, la evidencia, la confianza, la carga de trabajo, el riesgo, el talento o la presión fiscal, y por tanto afecta a los resultados posteriores del equipo y a la propia evaluación del responsable."
 zg361m.4.a:0 "Exigir una autoevaluación respaldada por resultados representativos y que el superior responda a cada brecha de percepción, asumiendo el coste del diálogo y dejando un registro revisable."
 zg361m.4.b:0 "Aceptar una autopresentación de una página y ajustar rápidamente la puntuación subjetiva por alardes o modestia, ahorrando tiempo pero confundiendo la exposición con el desempeño real."
 zg361m.4.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.5.t:0 "No.005 · Fichas de puntuación por puesto"
 zg361m.5.desc:0 "[A / P1] Esta política se aplica a través del registro organizativo compartido. Su regla seleccionada modifica entregas, evidencias, confianza, carga de trabajo, riesgo, talento o presión fiscal y, por tanto, afecta a los resultados posteriores del equipo y a la propia evaluación de la persona responsable."
 zg361m.5.a:0 "Congela pesos distintos para los puestos de gobernanza, militares, fiscales y de gestión antes de calibrar la misma cohorte directa, asumiendo el coste de mantener varias fichas."
 zg361m.5.b:0 "Clasifica por fuerza todos los puestos en una sola tabla de resultados para ejecutar rápido, perjudicando de forma sistemática el trabajo difícil de medir y amplificando los desajustes de puesto."
 zg361m.5.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.6.t:0 "No.006 · Ajuste de punto de partida y dificultad"
 zg361m.6.desc:0 "[A / P2] Esta política se aplica a través del registro organizativo compartido. Su regla seleccionada modifica entregas, evidencias, confianza, carga de trabajo, riesgo, talento o presión fiscal y, por tanto, afecta a los resultados posteriores del equipo y a la propia evaluación de la persona responsable."
 zg361m.6.a:0 "Congela las líneas base heredadas, los recursos y la dificultad del puesto, y solo permite ajustes con tope, dedicando horas de auditoría a una comparación más justa."
 zg361m.6.b:0 "Juzga solo los resultados absolutos a fin de año y exige más a las unidades más ricas, sacando una tabla rápida pero premiando la riqueza heredada y castigando a quien recoge los restos."
 zg361m.6.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.7.t:0 "No.007 · Invitaciones a evaluación 360 espalda con espalda"
 zg361m.7.desc:0 "[B / P0] Esta política se aplica a través del registro organizativo compartido. Su regla seleccionada modifica entregas, evidencias, confianza, carga de trabajo, riesgo, talento o presión fiscal y, por tanto, afecta a los resultados posteriores del equipo y a la propia evaluación de la persona responsable."
 zg361m.7.a:0 "Invita a un pequeño grupo de colaboradores genuinos, exige casos concretos y contrástalos, asumiendo el coste administrative de solicitar y deduplicar."
 zg361m.7.b:0 "Solicita ampliamente y pondera de inmediato los votos altos y bajos, amplificando rápido la señal pero abriendo la puerta a elogios cruzados, represalias y comentarios de plantilla."
 zg361m.7.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.8.t:0 "No.008 · Flexibilidad del evaluador y credibilidad entre iguales"
 zg361m.8.desc:0 "[B / P1] Esta política se aplica a través del registro organizativo compartido. Su regla seleccionada modifica entregas, evidencias, confianza, carga de trabajo, riesgo, talento o presión fiscal y, por tanto, afecta a los resultados posteriores del equipo y a la propia evaluación de la persona responsable."
 zg361m.8.a:0 "Mantén la media histórica, la varianza, la tasa de revocación y la precisión de cada evaluador y calibra su peso, asumiendo un coste de gobernanza de datos a largo plazo."
 zg361m.8.b:0 "Acepta este ciclo las puntuaciones brutas entre iguales y castiga a los distorsores solo tras las apelaciones, cerrando rápido pero dejando que evaluadores laxos y severos moldeen antes el ranking."
 zg361m.8.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.9.t:0 "No.009 · Panel de la reunión de calibración"
 zg361m.9.desc:0 "[B / P0] Esta política se aplica a través del libro contable organizativo compartido. La regla seleccionada modifica entregas, evidencias, confianza, carga de trabajo, riesgo, talento o presión fiscal y, por tanto, afecta a los resultados posteriores del equipo y a la propia evaluación del responsable."
 zg361m.9.a:0 "Mostrar juntos los KPI, valores, objetivos, feedback 360, tendencias y evidencias de apelación, y registrar cada movimiento de valoración como un intercambio de cuota neutral."
 zg361m.9.b:0 "Cerrar la tabla en una sola reunión con los totales actuales y las cuotas restantes, actuando rápido pero dejando fuera los casos límite y las contribuciones invisibles."
 zg361m.9.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.10.t:0 "No.010 · Asignar la C y proteger a un subordinado"
 zg361m.10.desc:0 "[B / P0] Esta política se aplica a través del libro contable organizativo compartido. La regla seleccionada modifica entregas, evidencias, confianza, carga de trabajo, riesgo, talento o presión fiscal y, por tanto, afecta a los resultados posteriores del equipo y a la propia evaluación del responsable."
 zg361m.10.a:0 "Elegir la valoración más baja a partir de la evidencia congelada; si el responsable protege a alguien, cargar abiertamente el prestigio y el KPI de gestión del próximo ciclo, preservando la confianza a un coste institucional real."
 zg361m.10.b:0 "Asignar la C directamente a un recién llegado o miembro periférico para satisfacer la cuota, cerrando la distribución ahora pero acumulando riesgo de apelación, resentimiento y rotación."
 zg361m.10.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.11.t:0 "No.011 · Revisión por el superior indirecto y asiento de responsable de RR. HH."
 zg361m.11.desc:0 "[B / P1] Esta política se aplica a través del libro contable compartido de la organización. La regla elegida modifica la entrega, las pruebas, la confianza, la carga de trabajo, el riesgo, el talento o la presión fiscal y, por tanto, afecta a los resultados posteriores del equipo y a la propia evaluación del directivo."
 zg361m.11.a:0 "Hacer que el superior de nivel intermedio revise solo la distribución, las pruebas extremas y el proceso, devolviendo los casos débiles al mando directo a costa de otra reunión."
 zg361m.11.b:0 "Dejar que el nivel intermedio edite al instante los baremos de los subordinados de segunda línea para una corrección rápida, eludiendo el retrabajo pero erosionando la autoridad del mando directo y abriendo la puerta al cabildeo."
 zg361m.11.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.12.t:0 "No.012 · Divulgación de conflictos y recusación"
 zg361m.12.desc:0 "[B / P1] Esta política se aplica a través del libro contable compartido de la organización. La regla elegida modifica la entrega, las pruebas, la confianza, la carga de trabajo, el riesgo, el talento o la presión fiscal y, por tanto, afecta a los resultados posteriores del equipo y a la propia evaluación del directivo."
 zg361m.12.a:0 "Divulgar parentesco, intimidad, hostilidad y patronazgo antes de la calibración y sustituir a los evaluadores recusados por un puesto independiente, asumiendo costes de personal y demora."
 zg361m.12.b:0 "Permitir que el directivo insista o maniobre en privado para proteger o castigar a alguien con rapidez, controlando el resultado a costa de aumentar mucho el riesgo de revocación y el de sanción personal."
 zg361m.12.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.13.t:0 "No.013 · Publicación transparente, por niveles o de caja negra"
 zg361m.13.desc:0 "[B / P2] Esta política se aplica a través del libro contable compartido de la organización. La regla elegida modifica la entrega, las pruebas, la confianza, la carga de trabajo, el riesgo, el talento o la presión fiscal y, por tanto, afecta a los resultados posteriores del equipo y a la propia evaluación del directivo."
 zg361m.13.a:0 "Entrega a cada persona motivos congelados y una vía de recurso, publica las valoraciones y las reglas agregadas al equipo y aplica controles de acceso para la retroalimentación sensible entre pares."
 zg361m.13.b:0 "Comunica a cada persona solo la valoración final y sella los motivos, reduciendo el conflicto abierto deprisa aunque aumente la sospecha, el «gestión hacia arriba» y los recursos."
 zg361m.13.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.14.t:0 "No.014 · Expediente de recurso de desempeño"
 zg361m.14.desc:0 "[C / P0] Un funcionario recurre con pruebas congeladas tras comentar el caso con su superior directo. Si se estima, el superior recalibra el resultado, devuelve una por una las tres sanciones inmediatas de 3.25 al erario local, al oro personal y al mérito, interrumpe la reducción salarial inacabada del 25% durante un año y corrige la clasificación; los recursos fallidos o abusivos cuestan reputación y credibilidad."
 zg361m.14.a:0 "Recopilar pruebas congeladas por tipo de error, exigir una charla antes de la revisión independiente y conciliar, una por una, la recalibración, las tres devoluciones inmediatas y la finalización del recorte salarial."
 zg361m.14.b:0 "Deja que el superior original rechace o revise la valoración en el acto, cerrando la disputa deprisa a riesgo de duplicar sanciones, devoluciones erróneas y conflictos de intereses confirmados."
 zg361m.14.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.15.t:0 "No.015 · Pliego de mejora PIP"
 zg361m.15.desc:0 "[C / P0] Esta política se aplica mediante el libro contable organizativo compartido. La regla elegida modifica entregas, evidencias, confianza, carga, riesgo, talento o presión fiscal y, por tanto, afecta a los resultados posteriores del equipo y a la propia evaluación del responsable."
 zg361m.15.a:0 "Negocia hitos verificables, apoyo y puntos de control dentro de la autoridad del interesado, gastando recursos a cambio de una oportunidad de mejora realmente viable."
 zg361m.15.b:0 "Impón hitos de alta presión y un plazo firme y registra el rechazo como evidencia negativa grave, actuando rápido aunque la salida parezca predeterminada."
 zg361m.15.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.16.t:0 "No.016 · Presupuesto de apoyo PIP"
 zg361m.16.desc:0 "[C / P1] Esta política se aplica mediante el libro contable organizativo compartido. La regla elegida modifica entregas, evidencias, confianza, carga, riesgo, talento o presión fiscal y, por tanto, afecta a los resultados posteriores del equipo y a la propia evaluación del responsable."
 zg361m.16.a:0 "Financia un tutor, recursos temporales de gobernanza y atención programada para el PIP, y registra cada aporte, asumiendo presupuesto para probar una mejora real."
 zg361m.16.b:0 "Fija objetivos sin recursos y aplica el plazo, ahorrando presupuesto actual pero convirtiendo el fracaso en evidencia de recurso y un golpe a la nota del responsable."
 zg361m.16.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.17.t:0 "No.017 · Escalera de disposición del último de la clase"
 zg361m.17.desc:0 "[C / P0] Esta política se aplica mediante el libro contable organizativo compartido. La regla elegida modifica entregas, evidencias, confianza, carga, riesgo, talento o presión fiscal y, por tanto, afecta a los resultados posteriores del equipo y a la propia evaluación del responsable."
 zg361m.17.a:0 "Aplica, ante la primera valoración baja, discusión, PIP y reasignación legal, reduciendo autoridad o liberando HC solo tras fracaso repetido y asumiendo el coste de desarrollo."
 zg361m.17.b:0 "Congela de inmediato el ascenso, degrada o destituye al peor desempeño para aumentar la densidad de talento, abriendo capacidad rápido a costa de generar miedo, vacantes y apelaciones concentradas."
 zg361m.17.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.18.t:0 "No.018 · Historial personal y liquidación cuádruple"
 zg361m.18.desc:0 "[C / P0] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review. This item has no connected business case yet: it configures policy and changes only the organizational ledger; it does not directly execute the example personnel, payment, or resource action."
 zg361m.18.a:0 "Record route A preference: Freeze rating, rank, superior, reasons, the three immediate treasury, personal-gold, and merit charges, and the one-year salary cut at settlement, marking every payment, refund, and termination separately. (organizational ledger only)"
 zg361m.18.b:0 "Record route B preference: Combine charges from live values when the record is opened and display them immediately, shortening the flow while risking errors after superior or balance changes and repeated opens. (organizational ledger only)"
 zg361m.18.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.19.t:0 "No.019 · Umbrales de Elegibilidad para Ascenso"
 zg361m.19.desc:0 "[D / P0] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review. This item has no connected business case yet: it configures policy and changes only the organizational ledger; it does not directly execute the example personnel, payment, or resource action."
 zg361m.19.a:0 "Record route A preference: Verify sustained high performance, values, PIP status, tenure, and a lawful vacancy before opening a promotion case, accepting candidate-review cost. (organizational ledger only)"
 zg361m.19.b:0 "Record route B preference: Let a sponsor nominate this cycle's star past some gates to retain them quickly, risking hollow promotion and disputes over prior history. (organizational ledger only)"
 zg361m.19.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.20.t:0 "No.020 · Expediente de Ascenso y Defensa Interunidades"
 zg361m.20.desc:0 "[D / P1] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review. This item has no connected business case yet: it configures policy and changes only the organizational ledger; it does not directly execute the example personnel, payment, or resource action."
 zg361m.20.a:0 "Record route A preference: Build the promotion packet from frozen governance results, team impact, and reusable methods, then record a cross-unit panel's boundary judgment. (organizational ledger only)"
 zg361m.20.b:0 "Record route B preference: Let a sponsor drive a single oral pitch and decide quickly, favoring strong presentation while risking packaging outranking sustained results. (organizational ledger only)"
 zg361m.20.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.21.t:0 "No.021 · Matriz de Bonus y Salario"
 zg361m.21.desc:0 "[D / P1] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review. This item has no connected business case yet: it configures policy and changes only the organizational ledger; it does not directly execute the example personnel, payment, or resource action."
 zg361m.21.a:0 "Record route A preference: Publish the rating-to-bonus-and-raise matrix in advance and lock the total pool, funding top ratings for real at a current fiscal cost. (organizational ledger only)"
 zg361m.21.b:0 "Record route B preference: Concentrate limited cash on a few top ratings and defer base-pay adjustments, sharpening the signal quickly while building pay debt, inversion, and poaching risk. (organizational ledger only)"
 zg361m.21.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.22.t:0 "No.022 · Presupuesto de HC Suave"
 zg361m.22.desc:0 "[D / P1] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review. This item has no connected business case yet: it configures policy and changes only the organizational ledger; it does not directly execute the example personnel, payment, or resource action."
 zg361m.22.a:0 "Record route A preference: Set an annual recruiting, development, and backfill budget from team results, finances, and vacancies, tracking each slot through use and recovery. (organizational ledger only)"
 zg361m.22.b:0 "Record route B preference: Expand or freeze capacity ad hoc from current pressure and superior preference, reinforcing priorities fast while starving low-visibility teams and encouraging slot hoarding. (organizational ledger only)"
 zg361m.22.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.23.t:0 "No.023 · Defensa de HC y Retorno de Inversión del Equipo"
