l_german:
 zg361p3.9000.t:0 "How This Portfolio Will Be Heard"
 zg361p3.9000.desc:0 "The metrics, reorganization, and delivery portfolio for [zg361_p3_aa_subject.GetShortUIName] is open. It contains thirty-five items: twenty-two routine matters can follow one common standard, while thirteen matters involving resources, people, or final settlement must be presented individually. Common handling still preserves a formal file, deadline, and receipt for every matter. This portfolio has recorded [ROOT.Var('zg361_p3_player_policy_debt_disclosed_n').GetValue|0] policy debts so far."
 zg361p3.9000.a:0 "Resolve twenty-two routine matters by evidence; present any failed preflight separately."
 zg361p3.9000.b:0 "Resolve twenty-two routine matters for delivery; present any failed preflight separately."
 zg361p3.9000.c:0 "Defer twenty-two routine matters and record one next-cycle policy debt for each."
 zg361p3.9000.d:0 "Present all thirty-five matters one by one for my separate ruling."
 zg361p3.229.t:0 "Who Owns the Metric Dictionary?"
 zg361p3.229.desc:0 "The metric has no named owner, and later changes have no accountable signer. Two readings of the same number are already circulating. This portfolio has recorded [ROOT.Var('zg361_p3_player_policy_debt_disclosed_n').GetValue|0] policy debts so far."
 zg361p3.229.a:0 "Name one accountable owner."
 zg361p3.229.b:0 "Require owner and steward co-signature."
 zg361p3.229.c:0 "Close this item and record policy debt."
 zg361p3.229.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361p3.230.t:0 "Two Dashboards, One Number"
 zg361p3.230.desc:0 "Two sources disagree. The review needs a recorded reconciliation rule, not whichever screenshot looks kinder."
 zg361p3.230.a:0 "Use the named authoritative source."
 zg361p3.230.b:0 "Reconcile jointly and publish the delta."
 zg361p3.230.c:0 "Close this item and record policy debt."
 zg361p3.230.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361p3.231.t:0 "The Denominator Moved"
 zg361p3.231.desc:0 "A changed denominator has produced two incompatible results for the same period. The file does not yet say which version governs calibration."
 zg361p3.231.a:0 "Restate both periods on the new denominator."
 zg361p3.231.b:0 "Keep both versions side by side."
 zg361p3.231.c:0 "Close this item and record policy debt."
 zg361p3.231.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361p3.232.t:0 "The Spreadsheet Has a Hole"
 zg361p3.232.desc:0 "One section of the table is empty. The file contains neither a visible backfill rule nor anyone accountable for estimation error."
 zg361p3.232.a:0 "Backfill with audit samples."
 zg361p3.232.b:0 "Impute and show an uncertainty band."
 zg361p3.232.c:0 "Close this item and record policy debt."
 zg361p3.232.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361p3.233.t:0 "Who May See the Dashboard?"
 zg361p3.233.desc:0 "The assessed official can see only a summary score. The underlying detail and a query route are both missing from the file."
 zg361p3.233.a:0 "Open the full dashboard."
 zg361p3.233.b:0 "Expose role-bounded detail and a query channel."
 zg361p3.233.c:0 "Close this item and record policy debt."
 zg361p3.233.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361p3.234.t:0 "Leading Signals, Lagging Results"
 zg361p3.234.desc:0 "Effort signals and eventual outcomes currently share one ledger, allowing a late result to rewrite work that was already observed."
 zg361p3.234.a:0 "Weight leading signals first."
 zg361p3.234.b:0 "Balance signals and outcomes."
 zg361p3.234.c:0 "Close this item and record policy debt."
 zg361p3.234.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361p3.235.t:0 "A KPI Needs Guardrails"
 zg361p3.235.desc:0 "The primary metric has risen while its quality guardrail has fallen. Their relative weight is absent from the settlement file."
 zg361p3.235.a:0 "Give guardrails equal weight."
 zg361p3.235.b:0 "Keep a sixty-forty balance."
 zg361p3.235.c:0 "Close this item and record policy debt."
 zg361p3.235.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361p3.236.t:0 "The KPI Cliff"
 zg361p3.236.desc:0 "The current scoring rule drops from full credit to zero at one threshold. A tiny measurement change can erase a full cycle of work."
 zg361p3.236.a:0 "Use a continuous curve."
 zg361p3.236.b:0 "Use a hybrid threshold with partial credit."
 zg361p3.236.c:0 "Close this item and record policy debt."
 zg361p3.236.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361p3.237.t:0 "The Most Beautiful Time Window"
 zg361p3.237.desc:0 "The submitted chart shows only its most favorable interval. Neither the full observation window nor the comparison period appears in the file."
 zg361p3.237.a:0 "Use the preregistered full window."
 zg361p3.237.b:0 "Publish full and selected windows together."
 zg361p3.237.c:0 "Close this item and record policy debt."
 zg361p3.237.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361p3.240.t:0 "Everyone Wants the Same Sample"
 zg361p3.240.desc:0 "The same population appears in two experiment files. Both teams currently claim a clean sample and the same sample slot is counted twice. This portfolio has recorded [ROOT.Var('zg361_p3_player_policy_debt_disclosed_n').GetValue|0] policy debts so far."
 zg361p3.240.a:0 "Reserve one exclusive sample slot."
 zg361p3.240.b:0 "Partition one slot with a signed boundary."
 zg361p3.240.c:0 "Close this item and record policy debt."
 zg361p3.240.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361p3.238.t:0 "Vanity Is Not Value"
 zg361p3.238.desc:0 "Traffic has risen while verified value remains flat. The louder adoption chart is currently crowding out the value ledger."
 zg361p3.238.a:0 "Weight verified value heavily."
 zg361p3.238.b:0 "Balance adoption and value."
 zg361p3.238.c:0 "Close this item and record policy debt."
 zg361p3.238.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361p3.239.t:0 "A Failed Experiment Still Learned"
 zg361p3.239.desc:0 "The preregistered experiment missed its business target but left verified new knowledge. The dispute is how much bounded credit that evidence deserves."
 zg361p3.239.a:0 "Credit verified learning strongly."
 zg361p3.239.b:0 "Split credit between learning and delivery."
 zg361p3.239.c:0 "Close this item and record policy debt."
 zg361p3.239.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361p3.241.t:0 "Who Owns the Long Tail?"
 zg361p3.241.desc:0 "The team has dispersed, but its impact is still arriving. No attribution shares govern the value that appears after handoff. This portfolio has recorded [ROOT.Var('zg361_p3_player_policy_debt_disclosed_n').GetValue|0] policy debts so far."
 zg361p3.241.a:0 "Credit the builder most."
 zg361p3.241.b:0 "Split builder, operator and successor evenly."
 zg361p3.241.c:0 "Close this item and record policy debt."
 zg361p3.241.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361p3.301.t:0 "The Core-Business Halo"
 zg361p3.301.desc:0 "The team inherited strong momentum, but the assessment file currently credits all of it as controllable personal contribution."
 zg361p3.301.a:0 "Remove most inherited momentum from personal credit."
 zg361p3.301.b:0 "Adjust personal credit against a peer benchmark."
 zg361p3.301.c:0 "Close this item and record policy debt."
 zg361p3.301.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361p3.302.t:0 "The Declining Business Headwind"
 zg361p3.302.desc:0 "The market contracted during the assessment period, but the file does not separate that uncontrollable headwind from personal contribution."
 zg361p3.302.a:0 "Normalize against the market decline."
 zg361p3.302.b:0 "Compare with matched declining teams."
 zg361p3.302.c:0 "Close this item and record policy debt."
 zg361p3.302.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361p3.303.t:0 "Incubation Needs a Clock"
 zg361p3.303.desc:0 "The new team is still ramping up, yet its file contains neither a protection period nor an expiry. Permanent immunity would hide later underperformance."
 zg361p3.303.a:0 "Grant the new team one short protected cycle."
 zg361p3.303.b:0 "Protect the new team only at signed milestones."
 zg361p3.303.c:0 "Close this item and record policy debt."
 zg361p3.303.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361p3.304.t:0 "Two Parents, One Review"
 zg361p3.304.desc:0 "Project and functional managers both claim authority. The file has no single frozen set of weights and goal shares, and neither manager has personally replied."
 zg361p3.304.a:0 "Direct a sixty-percent project-line weight."
 zg361p3.304.b:0 "Direct equal parent weights."
 zg361p3.304.c:0 "Close this item and record policy debt."
 zg361p3.304.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361p3.305.t:0 "Reorg Quiet Period"
 zg361p3.305.desc:0 "The reporting line changed just before the review closed. Without a quiet-period rule, the incoming manager can rewrite an almost finished case."
 zg361p3.305.a:0 "Freeze ratings until calibration ends."
 zg361p3.305.b:0 "Allow evidence additions but no score edits."
 zg361p3.305.c:0 "Close this item and record policy debt."
 zg361p3.305.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361p3.306.t:0 "One Head, Two Hats"
 zg361p3.306.desc:0 "The temporary dual-role lead has one finite pool of time, while current responsibility and review weights do not yet close to one hundred percent."
 zg361p3.306.a:0 "Split thirty-seventy toward the expert role."
 zg361p3.306.b:0 "Split management and expert roles fifty-fifty."
 zg361p3.306.c:0 "Close this item and record policy debt."
 zg361p3.306.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361p3.307.t:0 "Profit Center or Cost Center?"
 zg361p3.307.desc:0 "Revenue and enablement teams are currently measured with the same scorecard, mixing growth with cost control before comparison."
 zg361p3.307.a:0 "Use a profit-center scorecard."
 zg361p3.307.b:0 "Use a cost-and-service scorecard."
 zg361p3.307.c:0 "Close this item and record policy debt."
 zg361p3.307.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361p3.308.t:0 "Managers or Experts?"
 zg361p3.308.desc:0 "Management and specialist roles are competing for the same fixed headcount. Any new mix must remain within that total."
 zg361p3.308.a:0 "Keep twenty managers and eighty experts."
 zg361p3.308.b:0 "Use a thirty-seventy mix."
 zg361p3.308.c:0 "Close this item and record policy debt."
 zg361p3.308.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361p3.309.t:0 "The Far Team Is Quiet"
 zg361p3.309.desc:0 "The remote team is nearly absent from current review material. Management has bandwidth for only one additional verification, while the visibility gap is already distorting the assessment. This portfolio has recorded [ROOT.Var('zg361_p3_player_policy_debt_disclosed_n').GetValue|0] policy debts so far."
 zg361p3.309.a:0 "Spend capacity on an on-site visit."
 zg361p3.309.b:0 "Spend capacity on a remote evidence forum."
 zg361p3.309.c:0 "Close this item and record policy debt."
 zg361p3.309.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361p3.310.t:0 "Old Ratings, New Org"
 zg361p3.310.desc:0 "The reporting line has changed, but historical authorship remains with the old owner. The mapping record does not yet name both old and new accountable owners. This portfolio has recorded [ROOT.Var('zg361_p3_player_policy_debt_disclosed_n').GetValue|0] policy debts so far."
 zg361p3.310.a:0 "Map by the frozen historical owner."
 zg361p3.310.b:0 "Record both old and new owners in the bridge."
 zg361p3.310.c:0 "Close this item and record policy debt."
 zg361p3.310.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361p3.311.t:0 "A Pivot Is Not a Time Machine"
 zg361p3.311.desc:0 "The new strategy is in force, while the old cycle still has signed goals. An unclear boundary would let future priorities rewrite past commitments. This portfolio has recorded [ROOT.Var('zg361_p3_player_policy_debt_disclosed_n').GetValue|0] policy debts so far."
 zg361p3.311.a:0 "Close the old target and open a new one."
 zg361p3.311.b:0 "Bridge them with explicit split credit."
 zg361p3.311.c:0 "Close this item and record policy debt."
 zg361p3.311.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361p3.334.t:0 "One Door for Every Demand"
 zg361p3.334.desc:0 "One demand has arrived without a requester, business reason or intake label. In that state, its cost will fall into unowned overtime."
 zg361p3.334.a:0 "Tag it as superior-sponsored."
 zg361p3.334.b:0 "Tag it as territory demand."
 zg361p3.334.c:0 "Close this item and record policy debt."
 zg361p3.334.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361p3.335.t:0 "Everything Is Urgent"
 zg361p3.335.desc:0 "Several demands are marked urgent, but the portfolio has only one remaining slot and no free scope. The labels promise more capacity than exists. This portfolio has recorded [ROOT.Var('zg361_p3_player_policy_debt_disclosed_n').GetValue|0] policy debts so far."
 zg361p3.335.a:0 "Spend one emergency slot."
 zg361p3.335.b:0 "Trade equal scope instead of a slot."
 zg361p3.335.c:0 "Close this item and record policy debt."
 zg361p3.335.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361p3.336.t:0 "Definition of Ready"
 zg361p3.336.desc:0 "A request enters delivery only after benefit, boundary and dependencies are signed—or its sponsor owns the ambiguity."
 zg361p3.336.a:0 "Return the demand to complete benefit, boundary and dependencies."
 zg361p3.336.b:0 "Admit the demand as a bounded exploration."
 zg361p3.336.c:0 "Close this item and record policy debt."
 zg361p3.336.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361p3.338.t:0 "Scope, Time, Quality: Pick Two"
 zg361p3.338.desc:0 "The demand has strained both scope and deadline, but the file names no signer for either tradeoff. The delivery team cannot own that choice by silence. This portfolio has recorded [ROOT.Var('zg361_p3_player_policy_debt_disclosed_n').GetValue|0] policy debts so far."
 zg361p3.338.a:0 "Cut scope and sign it."
 zg361p3.338.b:0 "Extend time and sign it."
 zg361p3.338.c:0 "Close this item and record policy debt."
 zg361p3.338.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361p3.339.t:0 "Estimate the Work, Not the Hero"
 zg361p3.339.desc:0 "The current on-time reward has produced both padded estimates and last-minute heroics. Estimate errors are not yet paired with their recorded causes."
 zg361p3.339.a:0 "Credit calibrated accuracy."
 zg361p3.339.b:0 "Credit transparent uncertainty."
 zg361p3.339.c:0 "Close this item and record policy debt."
 zg361p3.339.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361p3.340.t:0 "Stop Starting, Start Finishing"
 zg361p3.340.desc:0 "The pending start would exceed both delivery capacity and the work-in-progress limit. No signed exception covers that excess. This portfolio has recorded [ROOT.Var('zg361_p3_player_policy_debt_disclosed_n').GetValue|0] policy debts so far."
 zg361p3.340.a:0 "Start within the WIP limit."
 zg361p3.340.b:0 "Start with a signed WIP exception."
 zg361p3.340.c:0 "Close this item and record policy debt."
 zg361p3.340.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361p3.342.t:0 "Who Owns the Blocked Time?"
 zg361p3.342.desc:0 "A block of stalled time has been charged directly to the delivery team, while the file names neither its cause nor anyone responsible for clearing it."
 zg361p3.342.a:0 "Name the independent reviewer as unblock owner; assign all blocked time to obstacles beyond the delivery team's control and apply no team penalty."
 zg361p3.342.b:0 "Split blocked hours across shared causes."
 zg361p3.342.c:0 "Close this item and record policy debt."
 zg361p3.342.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361p3.337.t:0 "A Change Request Has a Tax"
 zg361p3.337.desc:0 "The requested scope change has consumed capacity after work began. Its added cost is absent from both the deadline ledger and the remaining-scope ledger. This portfolio has recorded [ROOT.Var('zg361_p3_player_policy_debt_disclosed_n').GetValue|0] policy debts so far."
 zg361p3.337.a:0 "Pay ten capacity hours and extend time."
 zg361p3.337.b:0 "Pay ten capacity hours and remove equal scope."
 zg361p3.337.c:0 "Close this item and record policy debt."
 zg361p3.337.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361p3.341.t:0 "Unfinished Work Crosses the Line"
 zg361p3.341.desc:0 "The unfinished work still occupies this cycle's reservation, while the next-cycle ledger is ready to charge it again. That would count the same capacity twice. This portfolio has recorded [ROOT.Var('zg361_p3_player_policy_debt_disclosed_n').GetValue|0] policy debts so far."
 zg361p3.341.a:0 "Carry the whole remainder."
 zg361p3.341.b:0 "Split and accept a finished slice."
 zg361p3.341.c:0 "Close this item and record policy debt."
 zg361p3.341.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361p3.343.t:0 "Three Parties, One Delivery Ruling"
 zg361p3.343.desc:0 "The executor reports completion, but the file contains no acceptance conclusion visible to proposer, executor and acceptor. A delivery record is not their personal consent. This portfolio has recorded [ROOT.Var('zg361_p3_player_policy_debt_disclosed_n').GetValue|0] policy debts so far."
 zg361p3.343.a:0 "Serve all three parties and accept."
 zg361p3.343.b:0 "Serve a conditional acceptance with follow-up debt."
 zg361p3.343.c:0 "Close this item and record policy debt."
 zg361p3.343.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361p3.344.t:0 "Launch Is Not Value"
 zg361p3.344.desc:0 "Launch, adoption and verified value have each been credited as a fresh hundred percent. The portfolio ledger is counting the same result more than once. This portfolio has recorded [ROOT.Var('zg361_p3_player_policy_debt_disclosed_n').GetValue|0] policy debts so far."
 zg361p3.344.a:0 "Put most credit in the launch stage."
 zg361p3.344.b:0 "Split credit evenly across all three stages."
 zg361p3.344.c:0 "Close this item and record policy debt."
 zg361p3.344.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
