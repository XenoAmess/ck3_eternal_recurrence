 zg361we.handoff.1.t:0 "Handoff I: The Record Must Be Written"
 zg361we.handoff.1.subject.desc:0 "The handoff period has begun. You are [zg361_we_m264_handoff_subject_scope.GetShortUIName], and the rules, rolls, and unfinished matters in your care are still unfiled; without a readable record for the successor today, this stage remains incomplete."
 zg361we.handoff.1.owner.desc:0 "The handoff period has begun. [zg361_we_m264_handoff_subject_scope.GetShortUIName] cannot answer personally, and the papers on hand still require verification. You are [zg361_we_m264_handoff_owner_scope.GetShortUIName]; judge this stage only from the record you have verified yourself."
 zg361we.handoff.1.subject.complete:0 "File the record and give it to the successor"
 zg361we.handoff.1.subject.refuse:0 "Leave the record unfinished and let the successor cope"
 zg361we.handoff.1.owner.complete:0 "The record is complete; I confirm delivery"
 zg361we.handoff.1.owner.refuse:0 "The record is incomplete; I mark this stage failed"
 zg361we.handoff.2.t:0 "Handoff II: Hearing Is Not Accompanying"
 zg361we.handoff.2.subject.desc:0 "Thirty days have passed since the record was delivered. You are [zg361_we_m264_handoff_subject_scope.GetShortUIName], yet the successor has not accompanied you through one real matter; whether that learning occurred must be settled today."
 zg361we.handoff.2.owner.desc:0 "Thirty days have passed since the record was delivered. [zg361_we_m264_handoff_subject_scope.GetShortUIName] cannot answer personally, so only you, [zg361_we_m264_handoff_owner_scope.GetShortUIName], can judge from direct observation whether the successor truly accompanied the work."
 zg361we.handoff.2.subject.complete:0 "Guide the successor through one real matter"
 zg361we.handoff.2.subject.refuse:0 "Arrange no further accompanied work"
 zg361we.handoff.2.owner.complete:0 "I witnessed the work and confirm completion"
 zg361we.handoff.2.owner.refuse:0 "I saw no completed work and mark this stage failed"
 zg361we.handoff.3.t:0 "Handoff III: A Written Brief Is Not Practice"
 zg361we.handoff.3.subject.desc:0 "Another thirty days have passed since the accompanied work. You are [zg361_we_m264_handoff_subject_scope.GetShortUIName], and the successor has yet to handle a matter alone under your inspection; final payment awaits that result."
 zg361we.handoff.3.owner.desc:0 "Another thirty days have passed since the accompanied work. [zg361_we_m264_handoff_subject_scope.GetShortUIName] cannot answer personally, and the file does not yet establish whether the successor handled a matter independently. You are [zg361_we_m264_handoff_owner_scope.GetShortUIName]; final payment must follow only the work you inspected yourself."
 zg361we.handoff.3.subject.complete:0 "Have the successor work alone and inspect it"
 zg361we.handoff.3.subject.refuse:0 "Refuse the practical trial and end the handoff"
