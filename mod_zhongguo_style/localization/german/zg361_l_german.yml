l_german:
 # Game rules
 rule_zg361_enabled:0 "Vasallen-Leistungsbeurteilung (361-System)"
 setting_zg361_on:0 "Aktiviert"
 setting_zg361_on_desc:0 "Himmlische Herrscher ab Herzogsstufe und höher prüfen ihre direkt untergebenen Amtsinhaber und sortieren sie in 3.75 / 3.5 / 3.25; Grafen und Barone werden mitbewertet, führen aber keine Prüfungen durch."
 setting_zg361_off:0 "Deaktiviert"
 setting_zg361_off_desc:0 "Deaktiviert das Leistungsbeurteilungssystem."
 rule_zg361_frequency:0 "Prüfungszyklus"
 setting_zg361_freq_yearly:0 "Jährliche Beurteilung"
 setting_zg361_freq_yearly_desc:0 "Eine Beurteilungssaison pro Jahr."
 setting_zg361_freq_three_year:0 "Dreijährige Beurteilung"
 setting_zg361_freq_three_year_desc:0 "Eine große Evaluierung alle drei Jahre, im alten Stil."
 rule_zg361_bottom_ratio:0 "Mindestquote"
 setting_zg361_ratio_strict:0 "Strenges 361 (10%)"
 setting_zg361_ratio_strict_desc:0 "Die 361-Verteilung wird durchgesetzt: Selbst wenn alle die Erwartungen erfüllen, muss in einem großen Pool jemand die 3.25 erhalten."
 setting_zg361_ratio_relaxed:0 "Gelockert (5%)"
 setting_zg361_ratio_relaxed_desc:0 "Die 361-Bewertung bleibt, aber die starre 10%-Mindestquote wird gelockert."
 setting_zg361_ratio_off:0 "Lax (0%)"
 setting_zg361_ratio_off_desc:0 "Keine erzwungene untere Stufe. Die Beurteilung wird zur Formalität."
 # Decision group & decisions
 decision_group_type_zg361:0 "Leistungsbeurteilung"
 zg361_review_now_decision:0 "Leistungsbeurteilung jetzt durchführen"
 zg361_review_now_decision_desc:0 "Befiehl dem Prüfungsamt, deine direkten Untergebenen sofort zu reihen, statt auf die Saisonrunde zu warten. Bereits in diesem Jahr bewertete Beamte werden nicht erneut beurteilt."
 zg361_review_now_decision_tooltip:0 "Sofort mindestens einen direkten Amtsinhaber beurteilen; im selben Kalenderjahr kann keine weitere Beurteilung abgeschlossen werden."
 zg361_review_now_decision_confirm:0 "Ranglisten veröffentlichen!"
 zg361_ratio_strict_decision:0 "Mindestquote: Strenges 361 (10%)"
 zg361_ratio_strict_decision_desc:0 "Verteilung durchsetzen: Bei fünf oder mehr Personen im Pool muss jemand die 3.25 erhalten."
 zg361_ratio_strict_decision_tooltip:0 "Erzwungene Mindestquote dieser Prüfungseinheit auf 10% festlegen."
 zg361_ratio_strict_decision_confirm:0 "Streng bleiben."
 zg361_ratio_relaxed_decision:0 "Mindestquote: Gelockert (5%)"
 zg361_ratio_relaxed_decision_desc:0 "Die 361-Bewertung bleibt, aber die starre 10%-Mindestquote wird gelockert."
 zg361_ratio_relaxed_decision_tooltip:0 "Erzwungene Mindestquote dieser Prüfungseinheit auf 5% festlegen."
 zg361_ratio_relaxed_decision_confirm:0 "Lockern."
 zg361_ratio_off_decision:0 "Mindestquote: Lax (0%)"
 zg361_ratio_off_decision_desc:0 "Keine erzwungene untere Stufe. Die Beurteilung wird zur Formalität."
 zg361_ratio_off_decision_tooltip:0 "Erzwungene Mindestquote dieser Prüfungseinheit aufheben."
 zg361_ratio_off_decision_confirm:0 "Lax halten."
 # Character interactions
 zg361_appeal_interaction:0 "Leistungsbeurteilung anfechten"
 zg361_appeal_interaction_desc:0 "Gegen das Ergebnis dieser Runde formell Einspruch erheben und eine Neubewertung verlangen. Kostet 150 Einfluss."
 zg361_review_talk_interaction:0 "Leistungsgespräch"
 zg361_review_talk_interaction_desc:0 "Führe mit einem Vasallen, dessen Ergebnis diese Runde erschienen ist, ein eins-zu-eins-Leistungsgespräch. Beruhigt die Nerven."
 zg361_recommend_interaction:0 "Empfehlen"
 zg361_recommend_interaction_desc:0 "Empfehle das Dossier dieses Gleichgestellten deinem gemeinsamen direkten Lehnsherrn: +10 auf seine nächste Bewertung."
 zg361_slander_interaction:0 "Verleumdung"
 zg361_slander_interaction_desc:0 "Reiche eine giftige Denkschrift gegen diesen Kollegen ein: 70 % Chance, dass seine nächste Bewertung -15 erhält; falls man dich durchschaut, schlägt es auf dich zurück."
 zg361_purge_interaction:0 "Letzter Platz · Titelentzug"
 zg361_purge_interaction_desc:0 "Führe die Aussonderung der untersten Stufe an einem Beamten mit zwei aufeinanderfolgenden 3.25 durch: Entzug des Amtes (rechtmäßiger Grund, keine Tyrannei)."
 zg361_force_retire_interaction:0 "Letzter Platz · Zwangsruhestand"
 zg361_force_retire_interaction_desc:0 "Gewähre einem Beamten mit zwei aufeinanderfolgenden 3.25 einen würdevollen Abgang: Zwangsruhestand, Verdienste bleiben unangetastet."
 # Modifiers (grades)
 zg361_grade_375:0 "Leistung 3.75 · Übertrifft die Erwartungen"
 zg361_grade_375_desc:0 "Ergebnis dieses Zyklus: 3.75. Ergebnisse, Schwierigkeit und Wirkung haben die Erwartungen des aktuellen Ranges deutlich übertroffen. Beförderung vorgeschlagen."
 zg361_grade_35:0 "Leistung 3.5 · Erfüllt die Erwartungen"
 zg361_grade_35_desc:0 "Ergebnis dieses Zyklus: 3.5. Du hast die Arbeit erledigt, die dein Rang verlangt. Gut gemacht. Weiter so."
 zg361_grade_325:0 "Leistung 3.25 · Verbesserungswürdig"
 zg361_grade_325_desc:0 "Ergebnis dieses Zyklus: 3.25. Vierfache Konsequenz: lokale Staatskasse -50, persönliches Gold -25, Verdienst -60, sofern unterstützt, und Gehalt -25% für ein Jahr, sofern zutreffend."
 zg361_pip:0 "Leistungsverbesserungsplan"
 zg361_pip_desc:0 "In einen Leistungsverbesserungsplan (PIP) aufgenommen. Zwei aufeinanderfolgende 3.25-Zyklen lösen das Aussonderungsverfahren der untersten Stufe aus."
 zg361_demoted:0 "Degradiert, aber weiterbeschäftigt"
 zg361_demoted_desc:0 "Milde Aussonderung: degradiert und weiterbeschäftigt, Gehalt halbiert. Wir beobachten, wie der nächste Zyklus läuft."
 zg361_promotion_track:0 "Beförderungspfad"
 zg361_promotion_track_desc:0 "Zwei aufeinanderfolgende 3.75-Zyklen: der Beförderungspfad ist offen. Kandidatenwert für Ernennungen stark gestiegen; Obergrenze des Verdienstgrades vorübergehend angehoben."
 # Opinions
 zg361_favored:0 "Huld des Lehnsherrn"
 zg361_poor_review:0 "Schlechte Beurteilung"
 zg361_annoyed:0 "Lästige Einsprüche"
 zg361_purged:0 "Als unterste Stufe aussortiert"
 zg361_forced_retire:0 "In den Ruhestand gedrängt"
 zg361_merciful:0 "Gnade gewährt"
 zg361_rigged:0 "Manipulierte Bewertung"
 zg361_appeal_rejected:0 "Einspruch abgelehnt"
 zg361_talked:0 "Leistungsgespräch"
 zg361_slandered_me:0 "Böswillige Verleumdung"
 zg361_jingcha_attended:0 "Bei der Großen Evaluation anwesend"
 # Activity
 activity_zg361_jingcha:0 "Große Verwaltungsprüfung"
 activity_zg361_jingcha_desc:0 "Lade deine direkt untergebenen Amtsträger zu dir ein und prüfe ihre Akten persönlich. Sobald die Versammlung endet, werden die Rankings sofort ausgehängt."
 activity_zg361_jingcha_host_desc:0 "Leite die Große Verwaltungsbewertung, prüfe deine direkten Untergebenen persönlich und hänge die Rankings zum Abschluss sofort aus."
 activity_zg361_jingcha_guest_desc:0 "Reise zum Sitz deines direkten Lehnsherrn und stelle dich seiner Bewertung persönlich."
 activity_zg361_jingcha_selection_tooltip:0 "Rufe deine direkten amtierenden Beamten zur Bewertung an deinen Sitz."
 activity_zg361_jingcha_conclusion_desc:0 "Die Große Verwaltungsprüfung ist beendet und die Ergebnisse sind ausgehängt."
 zg361_jingcha_province_desc:0 "Halte in deinem Regierungssitz die Große Verwaltungsprüfung ab."
 zg361_jingcha_phase:0 "Prüfung"
 # Events
 zg361.1.t:0 "Von dir durchgeführte Prüfung: Liste finalisiert"
 zg361.1.desc:0 "Dies ist die Leistungsbeurteilung, die du für deine direkt unterstellten Beamten durchgeführt hast, nicht deine eigene Bewertung durch einen Vorgesetzten. Die Prüfstelle hat das Verzeichnis nach der aktuellen Mindestquotenregel dieser Stufe endgültig festgelegt.\n\nDieser Zyklus: [TopScope.GetValue('zg361_n_375')|0] haben die Erwartungen übertroffen, [TopScope.GetValue('zg361_n_35')|0] haben sie erfüllt, [TopScope.GetValue('zg361_n_325')|0] müssen sich verbessern; [TopScope.GetValue('zg361_n_elim')|0] stehen nun vor der Eliminierung der unteren Stufe.\n\nWenn ein Vorgesetzter dich bewertet, wird eine separate Urkunde deine Note, deine KPI und deinen Rang ausdrücklich festhalten."
 zg361.1.a:0 "Zur Kenntnis genommen."
 zg361.2.t:0 "Vorgesetztenbewertung: 3.75 · Übertrifft die Erwartungen"
 zg361.2.desc:0 "[zg361_reviewing_superior.GetShortUIName] hat Ihre Bewertung für diese Beurteilung festgelegt.\n\nIhre Note: 3.75 (übertrifft die Erwartungen)\nKPI: [TopScope.GetValue('zg361_result_kpi')|0]   Kohortenrang: [TopScope.GetValue('zg361_result_rank')|0] von [TopScope.GetValue('zg361_result_cohort_n')|0]\n\nIhre Ergebnisse, Ihr Schwierigkeitsgrad und Ihre Wirkung haben Ihren aktuellen Rang übertroffen. Verdienst-, Lokalschatz- und Nominierungsbelohnungen werden angewendet, wo Ihr Amt und Ihre Institutionen dies zulassen."
 zg361.2.a:0 "Dank für Eure Führung, mein Lehnsherr!"
 zg361.3.t:0 "Vorgesetztenbewertung: 3.5 · Erwartungen erfüllt"
 zg361.3.desc:0 "[zg361_reviewing_superior.GetShortUIName] hat Ihre Bewertung für diese Beurteilung festgelegt.\n\nIhre Note: 3.5 (erwartungen erfüllt)\nKPI: [TopScope.GetValue('zg361_result_kpi')|0]   Kohortenrang: [TopScope.GetValue('zg361_result_rank')|0] von [TopScope.GetValue('zg361_result_cohort_n')|0]\n\nSie haben die Arbeit geleistet, die Ihr Rang verlangt. Nicht mehr, nicht weniger."
 zg361.3.a:0 "...Weitermachen."
 zg361.4.t:0 "Vorgesetztenbewertung: 3.25 · Verbesserungsbedarf"
 zg361.4.desc:0 "[zg361_reviewing_superior.GetShortUIName] hat deine Bewertung für diese Überprüfung festgelegt.\n\nDeine Note: 3.25 (verbesserungswürdig)\nKPI: [TopScope.GetValue('zg361_result_kpi')|0]   Kohortenrang: [TopScope.GetValue('zg361_result_rank')|0] von [TopScope.GetValue('zg361_result_cohort_n')|0]\n\nDu liegst unter dem Anspruch deiner Position. Die vierfache Abrechnung greift: 50 aus der lokalen Schatzkammer, falls vorhanden, 25 persönliches Gold, 60 Verdienst, wo unterstützt, sowie 25 % Gehaltskürzung für ein Jahr, sofern zutreffend. Ein Leistungsverbesserungsplan (PIP) beginnt – eine weitere 3.25 bedeutet Ausschluss aus der untersten Stufe."
 zg361.4.a:0 "Es akzeptieren. (Stress reduziert)"
 zg361.4.b:0 "Einspruch! Diese Beurteilung ist manipuliert! (Kostet 150 Einfluss, 30 % Chance auf Aufhebung)"
 zg361.4.c:0 "Aufgeben. Einfach gemütlich treiben lassen. (Stress reduziert, -10 auf die Beurteilung des nächsten Jahres)"
 zg361.4.d:0 "Anpacken. Die Ergebnisse des nächsten Jahres sprechen lassen. (Stress erhöht, +10 auf die Beurteilung des nächsten Jahres)"
 zg361.5.t:0 "Eliminationsliste der untersten Stufe"
 zg361.5.desc:0 "In diesem Zyklus haben [TopScope.GetValue('zg361_n_elim')|0] Beamte zweimal hintereinander 3.25 erreicht und stehen für die Eliminierung auf der untersten Stufe an. Die Liste liegt auf Ihrem Schreibtisch; der Zinnoberpinsel liegt in Ihrer Hand. (Sie können sie auch einzeln in der Hofansicht entsorgen.)\n\nWie werden Sie mit ihnen verfahren?"
 zg361.5.a:0 "Nach Vorschrift. (Jeder wird nach Akte, Gunst und Fähigkeit beurteilt: Säuberung, Zwangsruhestand oder Degradierung)"
 zg361.5.b:0 "Gnade zeigen — alle degradieren, aber behalten. (-100 Prestige)"
 zg361.5.c:0 "Ein weiteres Jahr Beobachtung gewähren. (-50 Prestige, der Hof ist dankbar)"
 zg361.6.t:0 "Sie stehen auf der Eliminationsliste"
 zg361.6.desc:0 "Zwei aufeinanderfolgende 3.25, und das Beil der Eliminierung auf der untersten Stufe ist endlich auf Sie gefallen. Die Beamten Ihres Lehnsherrn sind bereits mit der Liste aufgebrochen.\n\nSie haben ein letztes Zeitfenster."
 zg361.6.a:0 "Letzter Einspruch! Eine Neubeurteilung verlangen! (Kostet 200 Einfluss, 40 % Chance, stattdessen degradiert zu werden — bei Misserfolg verlieren Sie Ihren Titel)"
 zg361.6.b:0 "Ihr Vermögen in die richtigen Hände fließen lassen. (Kostet 300 Gold, degradiert, aber behalten)"
 zg361.6.c:0 "Den Ruhestand mit Würde annehmen."
 zg361.6.d:0 "Auflehnen! (Eine Unabhängigkeitsfraktion gegen Ihren Lehnsherrn gründen)"
 zg361.10.t:0 "Kalibrierungssitzung zur Leistungsbeurteilung"
 zg361.10.desc:0 "Der Entwurf des Ministeriums liegt auf Ihrem Schreibtisch: [TopScope.GetValue('zg361_n_375')|0] als die Erwartungen übertreffend markiert, [TopScope.GetValue('zg361_n_35')|0] als diese erfüllend, [TopScope.GetValue('zg361_n_325')|0] als verbesserungsbedürftig.\n\nBevor die Ergebnisse ausgehängt werden, liegt der Pinsel noch bei Ihnen. Jemanden hochheben, jemanden herunterdrücken — aber wenn der Hof von der Manipulation Wind bekommt, wird er es beim Namen nennen: eine fingierte Beurteilung."
 zg361.10.a:0 "Die Liste ist korrekt. Aushängen."
 zg361.10.b:0 "Einen hochheben: das niedrigste 3.75 mit dem höchsten 3.5 tauschen."
 zg361.10.c:0 "Einen herunterdrücken: das niedrigste 3.5 in 3.25 fallen lassen."
 zg361.11.t:0 "Der Zinnoberpinsel ist gefallen"
 zg361.11.desc:0 "Sie heben den Zinnoberpinsel und schieben einen Namen sanft die Liste hinauf. Der Hinuntergestoßene wird nie erfahren, dass sein Lehnsherr über Nacht den Kurs änderte."
 zg361.11.a:0 "Die Ergebnisse aushängen."
 zg361.12.t:0 "Der Zinnoberpinsel ist gefallen"
 zg361.12.desc:0 "Sie heben den Zinnoberpinsel und fügen einen Namen am Rand der Liste hinzu. Irgendjemand muss diese 3.25 tragen — warum nicht er?"
 zg361.12.a:0 "Die Ergebnisse aushängen."
 zg361.20.t:0 "Leistungsbeurteilung"
 zg361.20.desc:0 "Die Leistungsbeurteilung ist im Gange."
 zg361.20.a:0 "Fortfahren."
 zg361.30.t:0 "Wilde Hunde und weiße Kaninchen"
 zg361.30.desc:0 "Das Bewertungsbüro heftet seinem vertraulichen Memorandum eine zweite Seite bei: [TopScope.GetValue('zg361_n_dog')|0] \"wilde Hunde\" — glänzende Ergebnisse, verdorbene Werte; und [TopScope.GetValue('zg361_n_rabbit')|0] \"weiße Kaninchen\" — treu bis zum Fehler, hoffnungslos im Job.\n\nKeine der beiden Sorten ist auf Dauer zu halten. Was ist Euer Vergnügen?"
 zg361.30.a:0 "Ausgewogene Gnade: die wilden Hunde unter Beobachtung behalten, die Kaninchen trösten."
 zg361.30.b:0 "Die wilden Hunde bestrafen und die Kaninchen in den Ruhestand schicken. (+50 Prestige; wilde Hunde verlieren Verdienst und kommen in ein PIP, Kaninchen werden in den Ruhestand geschickt)"
 zg361_scoreboard_open:0 "Leistungstafel"
 zg361_scoreboard_open_tooltip:0 "Die zuletzt veröffentlichte offizielle Leistungstafel öffnen."
 zg361_scoreboard_title:0 "Leistungstafel der himmlischen Beamten"
 zg361_scoreboard_year:0 "Beurteilungsjahr"
 zg361_scoreboard_total:0 "Kohorte"
 zg361_scoreboard_grade_375:0 "#P 3.75#!"
 zg361_scoreboard_grade_35:0 "#V 3.5#!"
 zg361_scoreboard_grade_325:0 "#N 3.25#!"
 zg361_scoreboard_dash:0 "—"
 zg361_scoreboard_status_promotion:0 "#P Beförderungsstrecke#!"
 zg361_scoreboard_status_pip:0 "#N PIP#!"
 zg361_scoreboard_col_rank:0 "Rang"
 zg361_scoreboard_col_official:0 "Beamter / Amt"
 zg361_scoreboard_col_kpi:0 "KPI"
 zg361_scoreboard_col_values:0 "Werte"
 zg361_scoreboard_col_grade:0 "Bewertung"
 zg361_scoreboard_col_streak:0 "Serie"
 zg361_scoreboard_col_status:0 "Status"
 zg361_scoreboard_hint:0 "Einen Beamten auswählen, um seine Charakteransicht zu öffnen. Die zuletzt veröffentlichte Liste behält Beamte, die später aus dem Amt schieden."
 zg361_scoreboard_tab_managed:0 "Beamte, die Sie beurteilen"
 zg361_scoreboard_tab_received:0 "Ihre Beurteilungskohorte"
 zg361_scoreboard_reviewer:0 "Beurteilender Lehnsherr"
 zg361_scoreboard_former_official:0 "Ehemaliger Beamter (auf dieser veröffentlichten Tafel weiterhin geführt)"
 zg361_jingcha_phase_desc:0 "Direkte Beamte berichten über ihre Arbeit, während ihr Lehnsherr die Akten persönlich prüft."
 activity_zg361_jingcha_destination_selection:0 "Den Ort der Beurteilung wählen"
 activity_zg361_jingcha_guest_help_text:0 "Direkte aktive Beamte werden an den Sitz ihres Lehnsherrn zur Beurteilung eingeladen."
 activity_zg361_jingcha_cooldown:0 "Die Große Verwaltungsbeurteilung befindet sich in der Abklingzeit"
 activity_zg361_jingcha_predicted_cost:0 "Die Große Verwaltungsbeurteilung ist eine gesetzliche Pflicht und kostet weder Schatzkammervermögen noch persönliches Gold."
 activity_zg361_jingcha_host_an_a:0 "$host_activity_a$"
 zg361_refused_jingcha:0 "Die Große Beurteilung verweigert"
 zg361.40.t:0 "Die Beurteilung steht an"
 zg361.40.desc:0 "Die Register, Konten und Verdienstaufzeichnungen liegen bereit. Laut Gesetz muss ich meine direkten aktiven Beamten an meinen Sitz zur Großen Verwaltungsbeurteilung laden, ohne dafür die Schatzkammer oder meine Privatkasse zu belasten.\n\nWenn ich diese Pflicht verweigere, wird mein direkter Vorgesetzter dies als schweres Versagen in der Amtsführung vermerken. Habe ich keinen Vorgesetzten, verliert die Institution selbst an Ansehen."
 zg361.40.a:0 "Die Beurteilung wie vorgeschrieben abhalten"
 zg361.40.a.tt:0 "Den kostenlosen Aktivitätenplaner öffnen. Die Beurteilung muss innerhalb von 300 Tagen abgeschlossen sein; den Planer nur zu öffnen und zu schließen erfüllt die Pflicht nicht."
 zg361.40.b:0 "Ich werde sie dieses Jahr nicht abhalten"
 zg361.40.b.tt:0 "Mit einem direkten Vorgesetzten: Seine Meinung über Sie sinkt, und Ihre nächste Beurteilung erhält eine einmalige KPI-Strafe von 50.\nAls unabhängiger oberster Lehnsherr: 200 Prestige verlieren, ohne gefälschte Selbstbeurteilung."
 zg361.41.t:0 "Beurteilung überfällig"
 zg361.41.desc:0 "Die Frist für die Große Verwaltungsbeurteilung ist verstrichen, ohne dass sie abgeschlossen wurde."
 zg361.41.a:0 "Der Erfüllungsnachweis ist abgeschlossen"
 zg361_view_result_statement_decision:0 "Persönliche Leistungsbilanz anzeigen"
 zg361_view_result_statement_decision_desc:0 "Letzten eingefrorenen Überprüfungsfall erneut öffnen: Faktenband, Endnote, aufgeschlüsselte KPI-Belege, Zustellstatus und tatsächliche Abrechnungsbelege."
 zg361_view_result_statement_decision_tooltip:0 "Deine letzte persönliche Leistungsbilanz ansehen, ohne sie neu zu berechnen."
 zg361_view_result_statement_decision_confirm:0 "Akte einsehen"
 zg361.50.t:0 "3.25-Leistungsmitteilung: Unterschrift erbeten"
 zg361.50.desc:0 "[zg361_reviewing_superior.GetShortUIName] hat dir die förmliche Leistungsmitteilung zugestellt.\n\nEndnote: 3.25 (verbesserungswürdig)\nEingefrorene KPI: [TopScope.GetValue('zg361_notice_kpi')|0]   Rang in der Kohorte: [TopScope.GetValue('zg361_notice_rank')|0] von [TopScope.GetValue('zg361_notice_cohort')|0]\nFaktenband-Code: [TopScope.GetValue('zg361_notice_absolute_grade')|0] (3=3.75, 2=3.5, 1=3.25)\n\nDu kannst unterschreiben oder unter Vorbehalt unterschreiben. Eine verweigerte Unterschrift ändert nur den Weg zur Zeugenzustellung sieben Tage später; die Note, den PIP und die vierfache Abrechnung löscht sie nicht. Der Lieblingssatz des Systems steht bereit: Du darfst widersprechen, aber die Mitteilung gilt trotzdem als zugestellt."
 zg361.50.a:0 "Zur Kenntnis nehmen. Empfangen heißt nicht gemocht."
 zg361.50.b:0 "Mit Vorbehalt zur Kenntnis nehmen. Unterschrift ist kein Einverständnis."
 zg361.50.c:0 "Unterschrift verweigern. (Zeugenzustellung in sieben Tagen)"
 zg361.51.t:0 "3.25-Leistungsmitteilung: Zeugenzustellung"
 zg361.51.desc:0 "Die Zeugenzustellung nach Verweigerung wurde abgerechnet."
 zg361.52.t:0 "Leistungsbeschwerde-Uhr"
 zg361.52.desc:0 "Das formale Beschwerdefenster für diesen Fall ist abgelaufen."
 zg361.53.t:0 "Persönliche Leistungs-Abrechnung"
 zg361.53.desc:0 "Prüfungsverantwortlicher: [zg361_reviewing_superior.GetShortUIName]\nEingefrorene KPI: [TopScope.GetValue('zg361_stmt_kpi')|0]   Rang in der Kohorte: [TopScope.GetValue('zg361_stmt_rank')|0] von [TopScope.GetValue('zg361_stmt_cohort')|0]"
 zg361.53.absolute_375:0 "\n#bold Faktenband: 3.75 (absolute Fakten übertreffen die Erwartungen)#!"
 zg361.53.absolute_35:0 "\n#bold Faktenband: 3.5 (absolute Fakten erfüllen die Erwartungen)#!"
 zg361.53.absolute_325:0 "\n#bold Faktenband: 3.25 (absolute Fakten sind verbesserungswürdig)#!"
 zg361.53.grade_375:0 "Endnote: #P 3.75 (übertrifft die Erwartungen)#!"
 zg361.53.grade_35:0 "Endnote: #V 3.5 (erfüllt die Erwartungen)#!"
 zg361.53.grade_325:0 "Endnote: #N 3.25 (verbesserungswürdig)#!"
 zg361.53.reason_0:0 "Begründung der Note: Faktenband und Endnote stimmen überein."
