 zg361_next_mechanism_decision_desc:0 "Den nächsten ungeklärten Punkt im 361-Politikkatalog öffnen und eine Entscheidung treffen, die in das Organisationsregister eingeht."
 zg361_next_mechanism_decision_tooltip:0 "Nächste 361-Politikkarte öffnen."
 zg361_next_mechanism_decision_confirm:0 "Hol den nächsten Leistungsträger rein"
 zg361_reference_charter_decision:0 "Referenz-361-Charta einsetzen"
 zg361_reference_charter_decision_desc:0 "Die empfohlenen Standardwerte für alle 361 Policies auf einmal übernehmen. Spart Jahrzehnte an Meetings und trägt sofort die vollen administrativen, finanziellen und organisatorischen Konsequenzen."
 zg361_reference_charter_decision_tooltip:0 "Alle 361 Punkte in einem echten, zustandsändernden Stapel abhaken."
 zg361_reference_charter_decision_confirm:0 "Gesamtes Portfolio ausrollen"
 zg361_mechanism_choice_a_tt:0 "Nachhaltiger Weg: verbessert Evidenz, Vertrauen oder Fähigkeit, kostet jedoch administrative, finanzielle oder kurzfristige Lieferkapazität."
 zg361_mechanism_choice_b_tt:0 "Sprint-Weg: verbessert das sofortige Ergebnis, lässt jedoch Risiko, Burnout, technische Schulden oder Beschwerde-Schulden in spätere Reviews mitlaufen."
 zg361_mechanism_choice_c_tt:0 "Aufschub-Variante: Spart jetzt Aufwand, erzeugt aber Politikschulden, die in die nächste Überprüfung deines Vorgesetzten einfließen."
