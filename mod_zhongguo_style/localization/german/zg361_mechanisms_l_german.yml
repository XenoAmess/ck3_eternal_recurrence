 zg361m.353.a:0 "Formulare, Sitzungen, Einsprüche und Unterbrechungen messen; Schritte mit geringem Wert entfernen und Fehler verfolgen"
 zg361m.353.b:0 "Kontrollen ohne Messung des Verwaltungsaufwands einführen und Compliance über Kapazität stellen"
 zg361m.353.c:0 "Verschieben und explizite Richtlinienschulden vermerken"
 zg361m.354.t:0 "No.354 · Spielerei mit der Fairness-Kennzahl"
