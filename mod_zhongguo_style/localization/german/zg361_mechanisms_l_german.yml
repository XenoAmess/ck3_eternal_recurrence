 zg361m.359.desc:0 "[AL / P1] Diese Richtlinie wird über das gemeinsame organisatorische Hauptbuch umgesetzt. Die gewählte Regel verändert Lieferung, Evidenz, Vertrauen, Arbeitslast, Risiko, Talent oder fiskalischen Druck und beeinflusst damit spätere Teamergebnisse sowie die eigene Bewertung der Führungskraft."
 zg361m.359.a:0 "Reservequote nutzen oder Grenzfälle überprüfen und alle betroffenen Beamten mit Einspruchsrecht erneut zustellen"
 zg361m.359.b:0 "Einen Grenzfall stillschweigend herunterstufen, um die Quote wiederherzustellen, ohne die Kette erneut zu eröffnen"
 zg361m.359.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.360.t:0 "No.360 · Kollektive Weigerung der Manager, eine C aufzuzwingen"
 zg361m.360.desc:0 "[AL / P2] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review. This item has no connected business case yet: it configures policy and changes only the organizational ledger; it does not directly execute the example personnel, payment, or resource action."
 zg361m.360.a:0 "Record route A preference: Let managers jointly seek an evidenced exception or public reform at a management-score cost (organizational ledger only)"
 zg361m.360.b:0 "Record route B preference: Order each manager to force a bottom rating and preserve the talent-density narrative (organizational ledger only)"
