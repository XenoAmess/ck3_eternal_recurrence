 zg361m.28.a:0 "Jedem Ergebnis oder Vorfall eine eindeutige Verantwortungs-ID zuweisen und Verdienst oder Schuld anhand von Konten, Zeugen und eingefrorenen Versionen verteilen – Kosten für Anhörung tragen."
 zg361m.28.b:0 "Sofort einen Helden oder Sündenbock benennen, um den Streit zu beenden, die Erzählung schnell stabilisieren, aber Peer-Vertrauen schädigen und für Fehlurteile eine Beschwerde-Option offen lassen."
 zg361m.28.c:0 "Verschieben und explizite Politikschulden vermerken"
