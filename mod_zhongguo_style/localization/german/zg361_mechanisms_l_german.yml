 zg361m.29.a:0 "Kennzahlen gegen reale Governance-Baselines prüfen, Nebenwirkungen der Optimierung dokumentieren und Belohnungen zurückfordern; bei nachgewiesenem Betrug auch Mittäter belasten."
 zg361m.29.b:0 "Zunächst auffällige Steuer- oder Ordnungszahlen belohnen und erst nach einem Fehlschlag tief prüfen – kurzfristige Zahlen werden stimuliert, aber verzögerte Schäden und Betrugsgewinne verstärkt."
 zg361m.29.c:0 "Verschieben und explizite Politikschulden vermerken"
