 zg361m.37.a:0 "Zwei Teams dürfen einen Bewertungs-Slot gegen Beitrag, Schwierigkeit und historische Schulden tauschen; politisches Kapital, Ressourcen und Rückzahlung der nächsten Periode werden vermerkt."
 zg361m.37.b:0 "Verhandlungen verbieten und jedes Team sein lokales Kontingent füllen lassen – schneller Abschluss, aber zufällige Schlusslichter kleiner Teams und echte Qualitätsunterschiede bleiben unkorrigiert."
