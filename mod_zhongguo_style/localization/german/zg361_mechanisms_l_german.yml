 zg361m.38.a:0 "Kleine Stichproben mit vergleichbaren Funktionen poolen oder durch eine externe absolute Schwellenprüfung vorläufig von der Pflichtverteilung ausnehmen – Koordinations- und Erklärungskosten zwischen Einheiten tragen."
 zg361m.38.b:0 "3-6-1 innerhalb von drei oder vier Personen erzwingen, um Autonomie zu wahren – Pooling entfällt, aber versehentliche Cs, Einsprüche und Abgänge steigen deutlich."
