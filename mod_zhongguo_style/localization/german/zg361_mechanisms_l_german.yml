 zg361m.36.a:0 "Jährliche Bewertungen, Revisionen, PIP, Beförderungen, HC, Boni, Fluktuation und reale Governance einfrieren und zu einem Zehn-Jahres-Trend aggregieren – langfristige Berichtskosten tragen."
 zg361m.36.b:0 "Nur die aktuelle Tabelle und wenige Schlagzeilen-Kennzahlen veröffentlichen – schnell eine Erfolgsgeschichte erzeugen, aber Fluktuation und Governance-Verfall hinter einer schicken Verteilung verstecken."
