 zg361m.34.a:0 "Die Neun-Felder-Matrix aus mehrperiodisch eingefrorener Leistung, Wachstumstempo und Rollenpassung kalibrieren und pro Quadrant Entwicklungs- oder Versetzungsbudgets bereitstellen."
 zg361m.34.b:0 "Hochpotenziale und Abgänger schnell anhand dieser Periodenbewertung und des Talentes markieren – Ressourcen bündeln sich, aber ein einzelnes Ergebnis bestimmt die langfristige Laufbahn."
