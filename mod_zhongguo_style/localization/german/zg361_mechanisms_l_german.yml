 zg361_org_admin_overload:0 "Überlastung der Performance-Verwaltung"
 zg361_org_admin_overload_desc:0 "Alle sind damit beschäftigt zu erklären, warum alle beschäftigt sind."
 zg361_org_burnout_crisis:0 "Krise durch Organisations-Burnout"
 zg361_org_burnout_crisis_desc:0 "Online-Stunden sehen hervorragend aus; menschliche Batterien nicht."
 zg361_org_delivery_stable:0 "Stabile Lieferkultur"
 zg361_org_delivery_stable_desc:0 "Nicht jeder Release beginnt mit dem Entwurf einer Entschuldigung."
 zg361_org_tech_debt_crisis:0 "Wachsende technische Schulden"
 zg361_org_tech_debt_crisis_desc:0 "Die Abkürzung von gestern ist heute die Mautstelle."
 zg361_org_talent_healthy:0 "Gesunde Talentpipeline"
 zg361_org_talent_healthy_desc:0 "Sterne, Nachfolger und stetig Beitragende können alle einen Weg nach vorne sehen."
 zg361m.1.t:0 "No.001 · Aufgeschlüsselter KPI-Nachweisbogen"
 zg361m.1.desc:0 "[A / P0] Diese Politik wird über das gemeinsame Organisations-Register umgesetzt. Ihre gewählte Regel verändert Leistung, Nachweise, Vertrauen, Arbeitslast, Risiko, Talent oder finanziellen Druck und beeinflusst daher spätere Teamergebnisse sowie die eigene Beurteilung der Führungskraft."
 zg361m.1.a:0 "Einen aufgeschlüsselten Nachweisbogen erstellen, Fälle zu Leistung, Effizienz, Wachstum, Zusammenarbeit und Werten einfrieren und den Aufwand für Erfassung und Prüfung tragen."
 zg361m.1.b:0 "Die Bewertung sofort aus Gesamtscore und Vorgesetzteneindruck festlegen, rasch veröffentlichen, aber Lücken und Fehler schwer nachvollziehbar lassen."
 zg361m.1.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.2.t:0 "No.002 · Jährliche OKR-Ausrichtung und KPI-Vereinbarung"
 zg361m.2.desc:0 "[A / P0] Diese Politik wird über das gemeinsame Organisations-Register umgesetzt. Ihre gewählte Regel verändert Leistung, Nachweise, Vertrauen, Arbeitslast, Risiko, Talent oder finanziellen Druck und beeinflusst daher spätere Teamergebnisse sowie die eigene Beurteilung der Führungskraft."
 zg361m.2.a:0 "Friere rollenspezifische Richtung, Ausgangswerte und normale Zielvorgaben ein und erlaube eine faktenbasierte Krisen-Neufestsetzung – auf Kosten einer lückenlosen Nachverfolgung."
 zg361m.2.b:0 "Allen Einheiten aggressive Ziele aufzwingen und an der ursprünglichen Linie festhalten, einen kurzen Sprint erkaufen, aber Kennzahlenspiel und versteckte Probleme riskieren."
 zg361m.2.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.3.t:0 "No.003 · Zwischengespräch und Ziel-Neufestsetzung"
 zg361m.3.desc:0 "[A / P1] Diese Politik wird über das gemeinsame Organisations-Register umgesetzt. Ihre gewählte Regel verändert Leistung, Nachweise, Vertrauen, Arbeitslast, Risiko, Talent oder finanziellen Druck und beeinflusst daher spätere Teamergebnisse sowie die eigene Beurteilung der Führungskraft."
 zg361m.3.a:0 "Führe eine coachingorientierte Zwischenbilanz durch, halte Risiken und Ressourcen fest und genehmige eine dokumentierte Krisen-Neubewertung – du investierst Führungszeit für eine nachvollziehbare Endnote."
 zg361m.3.b:0 "Behalte die Eröffnungsziele bei und fordere eine Aufholjagd bis zur Frist – das spart die Neufestlegung, aber du riskierst, dass Strategieänderungen als persönliches Versagen gewertet und schlechte Nachrichten verspätet gemeldet werden."
 zg361m.3.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.4.t:0 "No.004 · Selbstbewertung und Wahrnehmungslücke"
 zg361m.4.desc:0 "[A / P1] Diese Politik wird über das gemeinsame Organisations-Register umgesetzt. Ihre gewählte Regel verändert Leistung, Nachweise, Vertrauen, Arbeitslast, Risiko, Talent oder finanziellen Druck und beeinflusst daher spätere Teamergebnisse sowie die eigene Beurteilung der Führungskraft."
 zg361m.4.a:0 "Eine Selbstbewertung mit repräsentativen Ergebnissen verlangen und den Vorgesetzten jede Wahrnehmungslücke beantworten lassen, Diskussionskosten für einen überprüfbaren Datensatz akzeptieren."
 zg361m.4.b:0 "Ein einseitiges Selbst-Pitch annehmen und die subjektive Note rasch für Übertreibung oder Bescheidenheit anpassen, Zeit sparen, aber Darstellung mit Leistung verwechseln."
 zg361m.4.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.5.t:0 "No.005 · Rollenspezifische Scorecards"
 zg361m.5.desc:0 "[A / P1] Diese Politik wird über das gemeinsame Organisations-Register umgesetzt. Ihre gewählte Regel verändert Leistung, Nachweise, Vertrauen, Arbeitslast, Risiko, Talent oder finanziellen Druck und beeinflusst daher spätere Teamergebnisse sowie die eigene Beurteilung der Führungskraft."
 zg361m.5.a:0 "Unterschiedliche Gewichtungen für Verwaltung, Militär, Finanzen und Management einfrieren, bevor dieselbe direkte Kohorte kalibriert wird, die Kosten mehrerer Scorecards tragen."
 zg361m.5.b:0 "Alle Rollen auf einer Ergebnistabelle zum schnellen Vollzug forcieren, schwer messbare Arbeit systematisch benachteiligen und Rollenfehlbesetzung verstärken."
 zg361m.5.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.6.t:0 "No.006 · Startpunkt- und Schwierigkeitsanpassung"
 zg361m.6.desc:0 "[A / P2] Diese Politik wird über das gemeinsame Organisations-Register umgesetzt. Ihre gewählte Regel verändert Leistung, Nachweise, Vertrauen, Arbeitslast, Risiko, Talent oder finanziellen Druck und beeinflusst daher spätere Teamergebnisse sowie die eigene Beurteilung der Führungskraft."
 zg361m.6.a:0 "Übernommene Baselines, Ressourcen und Rollen­schwierigkeit einfrieren und nur begrenzte Anpassungen erlauben, Prüfaufwand für fairere Vergleiche investieren."
 zg361m.6.b:0 "Nur absolute Jahresendergebnisse bewerten und reichere Einheiten stärker fordern, schnelleres Ranking, aber belohnt ererbten Wohlstand und bestraft Aufräumarbeit."
 zg361m.6.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.7.t:0 "No.007 · Back-to-Back 360°-Bewertungseinladungen"
 zg361m.7.desc:0 "[B / P0] Diese Politik wird über das gemeinsame Organisations-Register umgesetzt. Ihre gewählte Regel verändert Leistung, Nachweise, Vertrauen, Arbeitslast, Risiko, Talent oder finanziellen Druck und beeinflusst daher spätere Teamergebnisse sowie die eigene Beurteilung der Führungskraft."
 zg361m.7.a:0 "Eine kleine Gruppe echter Mitstreiter einladen, konkrete Fälle verlangen und kreuzweise prüfen, den Verwaltungsaufwand für Einladung und Dublettenbereinigung tragen."
 zg361m.7.b:0 "Breit einladen und hohe wie niedrige Stimmen sofort gewichten, Signal schnell verstärken, aber gegenseitige Lobhudelei, Vergeltung und Fließband-Feedback einladen."
 zg361m.7.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.8.t:0 "No.008 · Bewerter-Milde und Glaubwürdigkeit der Peers"
 zg361m.8.desc:0 "[B / P1] Diese Politik wird über das gemeinsame Organisations-Register umgesetzt. Ihre gewählte Regel verändert Leistung, Nachweise, Vertrauen, Arbeitslast, Risiko, Talent oder finanziellen Druck und beeinflusst daher spätere Teamergebnisse sowie die eigene Beurteilung der Führungskraft."
 zg361m.8.a:0 "Historischen Mittelwert, Varianz, Aufhebungsquote und Trefferquote jedes Bewerters pflegen und deren Gewichtung kalibrieren, langfristige Daten-Governance-Kosten tragen."
 zg361m.8.b:0 "Rohe Peer-Bewertungen diese Runde annehmen und Verzerrer erst nach Einsprüchen bestrafen, rasch abschließen, aber milde und strenge Bewerter das Ranking zunächst prägen lassen."
 zg361m.8.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.9.t:0 "No.009 · Kalibrierungs-Cockpit"
 zg361m.9.desc:0 "[B / P0] Diese Richtlinie wird über das gemeinsame organisatorische Hauptbuch umgesetzt. Ihre gewählte Regel verändert Lieferung, Evidenz, Vertrauen, Arbeitslast, Risiko, Talent oder fiskalischen Druck und beeinflusst daher spätere Teamergebnisse sowie die eigene Beurteilung der Managerin."
 zg361m.9.a:0 "KPI, Werte, Ziele, 360-Feedback, Trends und Anfechtungsbeweise gemeinsam anzeigen und jede Bewertungsänderung als quotenneutralen Tausch protokollieren."
 zg361m.9.b:0 "Den Tisch in einer Sitzung anhand aktueller Summen und verbleibender Quoten schließen, schnell handeln und Grenzfälle sowie unsichtbare Beiträge ausquetschen."
 zg361m.9.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.10.t:0 "No.010 · C zuweisen und einen Untergebenen schützen"
 zg361m.10.desc:0 "[B / P0] Diese Richtlinie wird über das gemeinsame organisatorische Hauptbuch umgesetzt. Ihre gewählte Regel verändert Lieferung, Evidenz, Vertrauen, Arbeitslast, Risiko, Talent oder fiskalischen Druck und beeinflusst daher spätere Teamergebnisse sowie die eigene Beurteilung der Managerin."
 zg361m.10.a:0 "Die niedrigste Bewertung aus gefrorener Evidenz wählen; schützt die Managerin jemanden, werden Prestige und Management-KPI des nächsten Zyklus offen verrechnet, wodurch Vertrauen zu echten institutionellen Kosten erhalten bleibt."
 zg361m.10.b:0 "Das C direkt einem Neuling oder Randmitglied zuweisen, um die Quote zu erfüllen, die Verteilung sofort abschließen und dabei Anfechtungs-, Groll- und Abwanderungsrisiko aufbauen."
 zg361m.10.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.11.t:0 "No.011 · Hierarchieübergreifende Überprüfung und Sitz des Personalbeauftragten"
 zg361m.11.desc:0 "[B / P1] Diese Richtlinie wird über das gemeinsame organisatorische Hauptbuch umgesetzt. Ihre gewählte Regel verändert Lieferung, Evidenz, Vertrauen, Arbeitslast, Risiko, Talent oder fiskalischen Druck und beeinflusst daher spätere Teamergebnisse sowie die eigene Beurteilung der Managerin."
 zg361m.11.a:0 "Die übergeordnete Instanz nur Verteilung, extreme Evidenz und Prozess prüfen lassen und schwache Fälle an die direkte Managerin zurückgeben, was eine weitere Sitzung kostet."
 zg361m.11.b:0 "Lass den hierarchieübergreifenden Sitz die Bewertungen der Enkel direkt anpassen, um rasch zu korrigieren – das spart Rückläufe, untergräbt jedoch die Autorität der direkten Führungskraft und lädt zu Einflussnahme ein."
 zg361m.11.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.12.t:0 "No.012 · Konfliktoffenlegung und Befangenheit"
 zg361m.12.desc:0 "[B / P1] Diese Richtlinie wird über das gemeinsame organisatorische Hauptbuch umgesetzt. Ihre gewählte Regel verändert Lieferung, Evidenz, Vertrauen, Arbeitslast, Risiko, Talent oder fiskalischen Druck und beeinflusst daher spätere Teamergebnisse sowie die eigene Beurteilung der Managerin."
 zg361m.12.a:0 "Verwandtschaft, Nähe, Feindschaft und Förderung vor der Kalibrierung offenlegen und befangene Bewertende durch einen unabhängigen Sitz ersetzen, was Personal- und Verzögerungskosten verursacht."
 zg361m.12.b:0 "Die Managerin öffentlich bestehen oder heimlich manövrieren lassen, um jemanden schnell zu schützen oder zu bestrafen, das Ergebnis kontrollieren und gleichzeitig das Umstoß- sowie das persönliche Bewertungsrisiko stark erhöhen."
 zg361m.12.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.13.t:0 "No.013 · Transparente, abgestufte oder Black-Box-Veröffentlichung"
 zg361m.13.desc:0 "[B / P2] Diese Richtlinie wird über das gemeinsame organisatorische Hauptbuch umgesetzt. Ihre gewählte Regel verändert Lieferung, Evidenz, Vertrauen, Arbeitslast, Risiko, Talent oder fiskalischen Druck und beeinflusst daher spätere Teamergebnisse sowie die eigene Beurteilung der Managerin."
 zg361m.13.a:0 "Jeder betroffenen Person gefrorene Gründe und einen Anfechtungsweg geben, Bewertungen und Aggregatregeln im Team veröffentlichen und Zugriffskontrollen für sensibles Peer-Feedback einrichten."
 zg361m.13.b:0 "Jeder Person nur die finale Bewertung mitteilen und die Gründe versiegeln, offene Konflikte schnell reduzieren und dabei Misstrauen, Aufwärtsmanagement und Anfechtungen erhöhen."
 zg361m.13.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.14.t:0 "No.014 · Leistungsanfechtungs-Dossier"
 zg361m.14.desc:0 "[C / P0] Ein Beamter legt nach einem Gespräch mit dem direkten Vorgesetzten einen Einspruch mit eingefrorenen Beweisen vor. Wird der Einspruch stattgegeben, korrigiert der Vorgesetzte das Ergebnis, erstattet die drei sofortigen 3.25-Abzüge an die lokale Staatskasse, das persönliche Gold und die Verdienste einzeln zurück, beendet die noch laufende einjährige Gehaltskürzung um 25% und berichtigt die Rangordnung; erfolglose oder missbräuchliche Einsprüche kosten Ansehen und Glaubwürdigkeit."
 zg361m.14.a:0 "Eingefrorene Beweise nach Fehlertyp sammeln, ein Gespräch vor der unabhängigen Überprüfung verlangen und Neukalibrierung, alle drei sofortigen Rückerstattungen sowie die Beendigung der Gehaltskürzung einzeln abstimmen."
 zg361m.14.b:0 "Die ursprüngliche Vorgesetzte die Bewertung sofort ablehnen oder revidieren lassen, den Streit schnell beenden und dabei Doppelstrafen, fehlerhafte Rückzahlungen und bestätigte Konflikte riskieren."
 zg361m.14.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.15.t:0 "No.015 · PIP-Verbesserungs-Charta"
 zg361m.15.desc:0 "[C / P0] Diese Richtlinie wird über das gemeinsame organisatorische Hauptbuch umgesetzt. Ihre gewählte Regel verändert Lieferung, Evidenz, Vertrauen, Arbeitslast, Risiko, Talent oder fiskalischen Druck und beeinflusst daher spätere Teamergebnisse sowie die eigene Beurteilung der Managerin."
 zg361m.15.a:0 "Überprüfbare Meilensteine, Unterstützung und Kontrollpunkte innerhalb der Befugnis der betroffenen Person aushandeln und Ressourcen für eine tatsächlich erreichbare Verbesserungschance ausgeben."
 zg361m.15.b:0 "Hochdruck-Meilensteine und eine harte Frist auferlegen und eine Ablehnung als schwerwiegenden negativen Beleg festhalten, schnell handeln und den Ausstieg wie vorbestimmt wirken lassen."
 zg361m.15.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.16.t:0 "No.016 · PIP-Unterstützungsbudget"
 zg361m.16.desc:0 "[C / P1] Diese Richtlinie wird über das gemeinsame organisatorische Hauptbuch umgesetzt. Ihre gewählte Regel verändert Lieferung, Evidenz, Vertrauen, Arbeitslast, Risiko, Talent oder fiskalischen Druck und beeinflusst daher spätere Teamergebnisse sowie die eigene Beurteilung der Managerin."
 zg361m.16.a:0 "Mentor, temporäre Governance-Ressourcen und geplante Aufmerksamkeit für das PIP finanzieren und jeden Einsatz protokollieren, Budget zahlen, um echte Verbesserung zu prüfen."
 zg361m.16.b:0 "Ziele ohne Ressourcen setzen und die Frist durchsetzen, aktuelles Budget sparen und aus dem Scheitern Anfechtungsevldenz und einen Schlag gegen die Managerinnenbewertung machen."
 zg361m.16.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.17.t:0 "No.017 · Stufensystem für die Behandlung von Schlusslichtern"
 zg361m.17.desc:0 "[C / P0] Diese Richtlinie wird über das gemeinsame organisatorische Hauptbuch umgesetzt. Ihre gewählte Regel verändert Lieferung, Evidenz, Vertrauen, Arbeitslast, Risiko, Talent oder fiskalischen Druck und beeinflusst daher spätere Teamergebnisse sowie die eigene Beurteilung der Managerin."
 zg361m.17.a:0 "Bei einer ersten niedrigen Bewertung Diskussion, PIP und rechtmäßige Versetzung nutzen, Befugnisse erst nach wiederholtem Versagen reduzieren oder HC freigeben und die Entwicklungskosten tragen."
 zg361m.17.b:0 "Sofort Beförderung einfrieren, herabstufen oder die Schlusslichtperson entfernen, um die Talentdichte zu erhöhen, schnell Kapazität schaffen und dabei Angst, Vakanzen und konzentrierte Anfechtungen erzeugen."
 zg361m.17.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.18.t:0 "No.018 · Persönliche Urkunde und Vierfachabrechnung"
 zg361m.18.desc:0 "[C / P0] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review. This item has no connected business case yet: it configures policy and changes only the organizational ledger; it does not directly execute the example personnel, payment, or resource action."
 zg361m.18.a:0 "Record route A preference: Freeze rating, rank, superior, reasons, the three immediate treasury, personal-gold, and merit charges, and the one-year salary cut at settlement, marking every payment, refund, and termination separately. (organizational ledger only)"
 zg361m.18.b:0 "Record route B preference: Combine charges from live values when the record is opened and display them immediately, shortening the flow while risking errors after superior or balance changes and repeated opens. (organizational ledger only)"
 zg361m.18.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.19.t:0 "No.019 · Beförderungs-Eignungsschwellen"
 zg361m.19.desc:0 "[D / P0] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review. This item has no connected business case yet: it configures policy and changes only the organizational ledger; it does not directly execute the example personnel, payment, or resource action."
 zg361m.19.a:0 "Record route A preference: Verify sustained high performance, values, PIP status, tenure, and a lawful vacancy before opening a promotion case, accepting candidate-review cost. (organizational ledger only)"
 zg361m.19.b:0 "Record route B preference: Let a sponsor nominate this cycle's star past some gates to retain them quickly, risking hollow promotion and disputes over prior history. (organizational ledger only)"
 zg361m.19.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.20.t:0 "No.020 · Beförderungspaket und bereichsübergreifende Verteidigung"
 zg361m.20.desc:0 "[D / P1] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review. This item has no connected business case yet: it configures policy and changes only the organizational ledger; it does not directly execute the example personnel, payment, or resource action."
 zg361m.20.a:0 "Record route A preference: Build the promotion packet from frozen governance results, team impact, and reusable methods, then record a cross-unit panel's boundary judgment. (organizational ledger only)"
 zg361m.20.b:0 "Record route B preference: Let a sponsor drive a single oral pitch and decide quickly, favoring strong presentation while risking packaging outranking sustained results. (organizational ledger only)"
 zg361m.20.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.21.t:0 "No.021 · Bonus- und Gehaltsmatrix"
 zg361m.21.desc:0 "[D / P1] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review. This item has no connected business case yet: it configures policy and changes only the organizational ledger; it does not directly execute the example personnel, payment, or resource action."
 zg361m.21.a:0 "Record route A preference: Publish the rating-to-bonus-and-raise matrix in advance and lock the total pool, funding top ratings for real at a current fiscal cost. (organizational ledger only)"
 zg361m.21.b:0 "Record route B preference: Concentrate limited cash on a few top ratings and defer base-pay adjustments, sharpening the signal quickly while building pay debt, inversion, and poaching risk. (organizational ledger only)"
