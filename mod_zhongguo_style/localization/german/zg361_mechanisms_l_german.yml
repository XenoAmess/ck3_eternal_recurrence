 zg361m.32.a:0 "Führungskräfte anhand eingefrorener Vorperioden-Ziele, Jingcha, Revisionen, PIP, Haltekraft und HC bewerten und die Kosten der periodenübergreifenden Buchführung tragen."
 zg361m.32.b:0 "Nur das aktuelle Teaming bewerten und verweigerte Reviews, niedrige Bewertungen und Fluktuation sofort hart bestrafen – strikte Durchsetzung, aber Fälle aus der Enkelgeneration werden rekursiv der Führungskraft angelastet."
 zg361m.32.c:0 "Verschieben und explizite Politikschulden vermerken"
