 zg361m.116.a:0 "Lege nach der internen Einstellung ein festes Freigabefenster fest und erlaube nur eine Verlängerung für eine kritische Lieferung mit Nachfolgeplan, wobei du die Übergabe und die Nachbesetzungskoordination akzeptierst."
 zg361m.116.b:0 "Lass die alte Führungskraft aus Geschäftsgründen immer wieder verzögern, bis das Projekt endet. So sicherst du kurzfristig die Leistung, treibst aber das neue Team weg und hinterlässt einen blockierenden Eintrag."
