 zg361m.114.a:0 "Belohne Manager, die starke Leistungsträger freigeben, mit Entwicklungsgutschrift, Nachbesetzungspriorität und teamübergreifendem Wohlwollen, verlange aber gleichzeitig einen Nachfolgeplan und nimm eine Übergangslücke in Kauf."
