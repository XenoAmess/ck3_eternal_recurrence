 zg361m.355.a:0 "Wiederholbare Fähigkeit von Zufallsgewinnen trennen, Zielwachstum begrenzen und Ressourcen oder Befugnisse hinzufügen"
 zg361m.355.b:0 "Setze den Höchstwert des letzten Zyklus als neue Untergrenze und erhöhe den Druck für mehr Leistung"
 zg361m.355.c:0 "Verschieben und explizite Richtlinienschulden vermerken"
 zg361m.356.t:0 "No.356 · Horten guter Nachrichten und Stichtags-Arbitrage"
 zg361m.356.desc:0 "[AL / P1] Diese Richtlinie wird über das gemeinsame organisatorische Hauptbuch umgesetzt. Die gewählte Regel verändert Lieferung, Evidenz, Vertrauen, Arbeitslast, Risiko, Talent oder fiskalischen Druck und beeinflusst damit spätere Teamergebnisse sowie die eigene Bewertung der Führungskraft."
 zg361m.356.a:0 "Tatsächliche Fertigstellungszeitpunkte prüfen und Ratschen begrenzen, damit vollständige Ergebnisse zeitnah gemeldet werden"
 zg361m.356.b:0 "Verbuche erst zum Stichtag und schraube die Ziele kontinuierlich hoch – überlasse es den Verantwortlichen, die Leistung zwischenzupuffern"
 zg361m.356.c:0 "Verschieben und explizite Richtlinienschulden vermerken"
 zg361m.357.t:0 "No.357 · Fakten vor Anwendung der 361-Quote sichern"
 zg361m.357.desc:0 "[AL / P1] Diese Richtlinie wird über das gemeinsame organisatorische Hauptbuch umgesetzt. Die gewählte Regel verändert Lieferung, Evidenz, Vertrauen, Arbeitslast, Risiko, Talent oder fiskalischen Druck und beeinflusst damit spätere Teamergebnisse sowie die eigene Bewertung der Führungskraft."
 zg361m.357.a:0 "Absolute Leistung und Evidenz zuerst einfrieren, dann relative Quoten anwenden und Herunterstufungen kennzeichnen"
 zg361m.357.b:0 "Bewertungen in einer Kalibrierungssitzung festlegen und Gründe nachträglich einfüllen, um die Quote zu erfüllen"
 zg361m.357.c:0 "Verschieben und explizite Richtlinienschulden vermerken"
 zg361m.358.t:0 "No.358 · Prinzip der Nicht-Verschärfung im Einspruchsverfahren"
 zg361m.358.desc:0 "[AL / P1] Diese Richtlinie wird über das gemeinsame organisatorische Hauptbuch umgesetzt. Die gewählte Regel verändert Lieferung, Evidenz, Vertrauen, Arbeitslast, Risiko, Talent oder fiskalischen Druck und beeinflusst damit spätere Teamergebnisse sowie die eigene Bewertung der Führungskraft."
 zg361m.358.a:0 "Ein Einspruch darf nur bestätigen oder mildern; bei neu entdecktem Betrug einen separat zugestellten Fall eröffnen"
 zg361m.358.b:0 "Prüfern erlauben, Strafen im selben Einspruch zu erhöhen, um schwache Anträge zu entmutigen"
 zg361m.358.c:0 "Verschieben und explizite Richtlinienschulden vermerken"
 zg361m.359.t:0 "No.359 · Quotenrückfluss und Kettenzustellung nach einer Aufhebung"
 zg361m.359.desc:0 "[AL / P1] Diese Richtlinie wird über das gemeinsame organisatorische Hauptbuch umgesetzt. Die gewählte Regel verändert Lieferung, Evidenz, Vertrauen, Arbeitslast, Risiko, Talent oder fiskalischen Druck und beeinflusst damit spätere Teamergebnisse sowie die eigene Bewertung der Führungskraft."
 zg361m.359.a:0 "Reservequote nutzen oder Grenzfälle überprüfen und alle betroffenen Beamten mit Einspruchsrecht erneut zustellen"
 zg361m.359.b:0 "Einen Grenzfall stillschweigend herunterstufen, um die Quote wiederherzustellen, ohne die Kette erneut zu eröffnen"
 zg361m.359.c:0 "Verschieben und explizite Richtlinienschulden vermerken"
 zg361m.360.t:0 "No.360 · Kollektive Weigerung der Manager, eine C aufzuzwingen"
 zg361m.360.desc:0 "[AL / P2] Diese Richtlinie wird über das gemeinsame organisatorische Hauptbuch umgesetzt. Die gewählte Regel verändert Lieferung, Evidenz, Vertrauen, Arbeitslast, Risiko, Talent oder fiskalischen Druck und beeinflusst damit spätere Teamergebnisse sowie die eigene Bewertung der Führungskraft."
 zg361m.360.a:0 "Manager gemeinsam eine belegte Ausnahme oder öffentliche Reform anstreben lassen, mit Kosten für den Management-Score"
 zg361m.360.b:0 "Jeden Manager anweisen, eine Endnote durchzudrücken und das Narrativ der Talentdichte wahren"
 zg361m.360.c:0 "Verschieben und explizite Richtlinienschulden vermerken"
