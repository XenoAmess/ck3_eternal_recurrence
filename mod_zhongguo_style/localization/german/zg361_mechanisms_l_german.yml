 zg361m.30.a:0 "Konkurrierende kleine Pilotprojekte unter gemeinsamen Meilensteinen finanzieren, Budgeterhalt und Rückforderungstermine einfrieren und die Kosten zweier Probeläufe tragen."
 zg361m.30.b:0 "Einen Sponsor ein Team wählen und sofort HC und Budget darauf verwenden lassen – Fokus entsteht schnell, aber ein geschickt verpackter Fehlschlag wird zum Organisationsverlust."
 zg361m.30.c:0 "Verschieben und explizite Politikschulden vermerken"
