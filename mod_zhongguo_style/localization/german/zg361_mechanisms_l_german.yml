 zg361m.26.a:0 "Friere echten Beitrag und Vorgesetztensichtbarkeit getrennt ein und nutze hierarchieübergreifende Gespräche, um Arbeit mit geringer Sichtbarkeit aufzudecken – du akzeptierst zusätzlichen Prüfaufwand."
 zg361m.26.b:0 "Subjektive Punkte schnell anhand von Präsentationsqualität und Beziehungsnähe dieser Runde verteilen, Selbstdarsteller sofort belohnen und hohle Inhalte vorübergehend über Governance siegen lassen."
 zg361m.26.c:0 "Verschieben und explizite Politikschulden vermerken"
