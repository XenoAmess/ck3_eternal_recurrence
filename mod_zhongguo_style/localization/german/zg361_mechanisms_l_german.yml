 zg361m.105.a:0 "Lege vorab fest, ob die Nachbesetzung an das Team zurückgeht, in einen zentralen Pool fließt oder mit der Aufgabe übertragen wird, und verknüpfe das Freigabeverhalten mit der künftigen Priorität, wobei du den Pflegeaufwand für die Regelungen in Kauf nimmst."
 zg361m.105.b:0 "Halte den Mitarbeiter bis nach der Leistungsüberprüfung zurück, um die Nachbesetzung zu sichern – du behältst die Stelle jetzt, verzögerst aber die Mobilität und verzerrst den Zeitpunkt des Ausscheidens."
