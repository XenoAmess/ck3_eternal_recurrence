 zg361m.97.b:0 "Beförderungsplätze schnell nach Manager-Einfluss und lokalem Nummer-Eins jedes Teams zuteilen, was die Sitzung schließt, aber lokalen Rang über bereichsübergreifende Wirkung siegen lässt."
