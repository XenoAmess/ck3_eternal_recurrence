 zg361m.111.b:0 "Melde jeden Abgang als gesunde Optimierung, um den aktuellen Score der Managerin zu schützen, verbesserst die Tabelle jetzt, verbirgst aber Halte-Versagen und falsche Niedrigbewertungen."
