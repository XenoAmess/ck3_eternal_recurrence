 zg361m.41.a:0 "Neueinsteiger im ersten Zyklus von der Quote ausnehmen, eigene Rampen-Ziele, einen Mentor und einen festen Einbeziehungstermin festlegen – Entwicklungskosten und Druck auf Stammbelegschaft tragen."
 zg361m.41.b:0 "Neue sofort vollständig bewerten und bevorzugt als untere Slots einplanen – das C-Kontingent füllt sich schnell, doch Mentorenwert, Recruiting-Reputation und Bindung leiden."
