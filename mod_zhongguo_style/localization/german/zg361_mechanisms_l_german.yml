 zg361m.39.a:0 "Vor der Kalibrierung die Liste von Leihgaben, Abwesenden, Wechslern und Abgängern einfrieren und jede Änderung mit formalem Grund und Prüfpfad belegen."
 zg361m.39.b:0 "Vor Fristablauf starke Personen heraus- oder schwache Personen hineinverschieben, um Kontingente zu füllen – der Kern wird sofort geschützt, aber Re-Kalibrierung und Führungshaftung drohen."
