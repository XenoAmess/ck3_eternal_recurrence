 zg361m.33.a:0 "Für datengetriebene, schützende und andere Führungsstile stabile Gewichte und Begründungscodes festlegen, durch Hart-evidenz gedeckelt – Erklärungspflege-Kosten in Kauf nehmen."
 zg361m.33.b:0 "Persönlichkeit und Beziehungen Grenzebenen kurzfristig überstimmen lassen – farbige Führungspersönlichkeiten, aber gleiche Fälle werden nicht reproduzierbar entschieden."
