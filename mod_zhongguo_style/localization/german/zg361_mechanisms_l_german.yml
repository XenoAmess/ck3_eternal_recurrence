 zg361m.103.a:0 "Verlange für lange vakante Rollen eine echte Kandidatenpipeline, gib den Slot zurück oder verleihe ihn befristet, prüfe monatlich und akzeptiere geringere künftige Optionalität."
 zg361m.103.b:0 "Nutze Phantomkandidaten und wiederholte Verzögerungen bei der Ausschreibung, um den Slot zu halten, vermeidest jetzt Rückforderung, überlastest aber das Team und verlierst HC-Glaubwürdigkeit bei Aufdeckung."
