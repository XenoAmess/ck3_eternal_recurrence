 zg361m.40.a:0 "Bewerte ausscheidende Mitarbeiter nach eingefrorener tatsächlicher Leistung und rechne organisatorischen Abgang und Nachbesetzung getrennt ab, wobei der echte Leerstand und der Quotendruck akzeptiert werden."
 zg361m.40.b:0 "Lade den untersten Rang jemandem auf, der das Unternehmen ohnehin verlässt, damit das aktuelle Team sofort besteht – das verschafft sofort Ruhe, verfälscht aber Verteilung, Nachbesetzung und Talenturteil."
