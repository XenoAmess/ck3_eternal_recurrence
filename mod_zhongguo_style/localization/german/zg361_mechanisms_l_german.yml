 zg361m.27.a:0 "Friere Verantwortlicher, Federführung, Unterstützer, Feuerwehr und Hindernis für die gemeinsame Arbeit ein und teile einen gedeckelten Ergebnistopf auf, wobei die Buchführungspflege akzeptiert wird."
 zg361m.27.b:0 "Den Projekteigner das Ergebnis für sich beanspruchen lassen und andere im Nachgang streiten, rasch abrechnen, aber Verdienstabschöpfung und Doppelmeldungen fördern."
 zg361m.27.c:0 "Verschieben und explizite Politikschulden vermerken"
 zg361m.28.t:0 "No.028 · Kreditklau-Schlichtung und Schuld-Rückblick"
