 zg361m.44.a:0 "Zunächst ohne Namen und Beziehungen nach Evidenz reihen, dann in einem namentlichen Lauf Rollen-Schwierigkeit ergänzen und große Abweichungen prüfen lassen – doppelten Arbeitsaufwand tragen."
 zg361m.44.b:0 "Von Beginn an namentlich unter einem vertrauten Vorgesetzten reihen – schneller Abschluss, aber Vetternwirtschaft, Abneigung und Lautstärke wirken sofort auf das Ergebnis."
