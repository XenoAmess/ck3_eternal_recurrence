 zg361m.35.a:0 "Hybrid aus absoluten Schwellen und relativer Rangfolge verwenden, Verteilungssignal behalten und Sanktionen am unteren Ende für echte Erfüller mildern – doppelte Prüfung tragen."
 zg361m.35.b:0 "Strenges 3-6-1 erzwingen und jeden unteren Slot füllen – klarste Regel und schnellste Veröffentlichung, aber selbst bei durchgängig guter Leistung entsteht ein Opfer."
