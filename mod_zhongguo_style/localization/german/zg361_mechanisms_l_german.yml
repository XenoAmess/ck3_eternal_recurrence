 zg361m.42.a:0 "Prüfe feste Rotationsmuster über Zyklen hinweg, rekonstruiere individuelle Belege und vermittle Kompensationsversprechen – du gibst Überprüfungszeit aus, um die Differenzierung wiederherzustellen."
 zg361m.42.b:0 "Die ganze Gruppe abwerten und den Pakt beim Verdacht sofort aufbrechen – Abschreckung gegen Kollusion ist schnell, aber falsche Positive und Bitterkeit durch gebrochene Zusagen sind möglich."
