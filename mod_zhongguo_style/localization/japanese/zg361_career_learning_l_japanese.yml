l_japanese:
 zg361_cl_digest_title:0 "This Round of Career Plans Is Recorded"
 zg361_cl_digest_desc:0 "This round's career and learning docket is complete: [ROOT.Var('zg361_cl_portfolio_ah_completed')|0] internal-mobility matters and [ROOT.Var('zg361_cl_portfolio_ai_completed')|0] training matters were recorded. Transfers, trials, and training commitments still in progress will be reported when they fall due."
 zg361_cl_digest_ack:0 "Take the docket and proceed."
 zg361_cl_m314_title:0 "A Distant Posting in Writing"
 zg361_cl_m314_desc:0 "[ROOT.GetLiege.GetShortUIName] has offered you a distant posting. Its written relocation budget assigns 10 gold to the move, 6 to a temporary allowance, and 4 to your household. You may accept the arrangement or decline without changing this review's rating."
 zg361_cl_m314_route_a:0 "Accept the transfer with its relocation terms"
 zg361_cl_m314_route_b:0 "Decline and remain at the present post"
 zg361_cl_m315_title:0 "Ninety Days to Test the Post"
 zg361_cl_m315_desc:0 "The new office offers a ninety-day trial. Your former office retains 40 percent of the credit and the new office receives 60 percent; you and both offices may end the arrangement. A poor fit returns you to your former post without being treated as a low rating."
 zg361_cl_m315_route_a:0 "Begin the ninety-day trial"
 zg361_cl_m315_route_b:0 "Decline and return to the former post"
 zg361_cl_m318_title:0 "Two Petitions, Two Chances"
 zg361_cl_m318_desc:0 "You have two formal transfer petitions in this round. Once a petition is filed, withdrawing it later still uses one chance; if you do not file now, the chance remains yours."
 zg361_cl_m318_route_a:0 "File the petition and use one chance"
 zg361_cl_m318_route_b:0 "Wait and keep this chance"
 zg361_cl_m319_title:0 "One Last Offer"
 zg361_cl_m319_desc:0 "[ROOT.GetLiege.GetShortUIName] has sent one final written offer to keep you. Decline it to begin a transfer due within thirty days. The other choice is to remain on a promise that has no proof of delivery; after ninety days it will close as a broken promise charged to the official who made it."
 zg361_cl_m319_route_a:0 "Decline and begin the thirty-day transfer"
 zg361_cl_m319_route_b:0 "Remain on an unfulfilled promise; settle it in ninety days"
 zg361_cl_m321_title:0 "Old Colleagues, By Mutual Consent"
 zg361_cl_m321_desc:0 "Your former office asks to keep one line of contact after your departure. Old ties may continue only with your consent; returning the card ends future contact, but does not erase the record of what came before."
 zg361_cl_m321_route_a:0 "Accept the card and remain in contact"
 zg361_cl_m321_route_b:0 "Return the card and part ways"
 zg361_cl_m333_title:0 "The Bond That Paid for Learning"
 zg361_cl_m333_desc:0 "The office will pay 18 gold from its treasury and 6 from the sponsor's purse for your training. Remain and honour the service bond through your work; leave voluntarily and 18 gold falls due after ninety days. An involuntary dismissal waives repayment."
 zg361_cl_m333_route_a:0 "Remain in service and honour the bond"
 zg361_cl_m333_route_b:0 "Leave early and repay the balance"
