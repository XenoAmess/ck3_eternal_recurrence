 zg361cp.batch.t:0 "Method for This Portfolio"
 zg361cp.batch.desc:0 "This project portfolio is assembled: [scope:zg361_cp_e_subject.GetShortUIName] is the subject, and [scope:zg361_cp_e_owner.GetShortUIName] will decide it. Eleven entries are routine records; the other sixteen involve payment, response, deadlines, personnel disposition, or settlement and still require individual judgment. Existing unresolved policy debt: [scope:zg361_cp_e_subject.MakeScope.Var('zg361_cp_policy_debt_open_n').GetValue|0]."
 zg361cp.batch.a:0 "Resolve eleven routine cases by traceable evidence; report any case lacking conditions separately."
 zg361cp.batch.b:0 "Resolve eleven routine cases for execution speed; report any case lacking conditions separately."
 zg361cp.batch.c:0 "Close eleven routine cases with one policy debt each; report any case lacking conditions separately."
 zg361cp.batch.d:0 "Keep all twenty-seven case records and decide each one."
 zg361cp.batch.c.tt:0 "The number added equals the routine cases actually closed, at no more than one debt per case; an already resolved case is never recorded twice. The other sixteen cases involving payment, response, deadlines, personnel disposition, or settlement still arrive for individual judgment."
 zg361cp.26.t:0 "Work and Visibility Are Different Ledgers"
 zg361cp.26.desc:0 "A contribution and time ledger is open: [scope:zg361_cp_e_subject.GetShortUIName] is the subject, and [scope:zg361_cp_e_owner.GetShortUIName] will decide the case. Delivery, reporting and relationship hours spend the same finite project capacity, but only delivery creates hard output."
 zg361cp.26.a:0 "Protect delivery and keep reporting lean."
 zg361cp.26.b:0 "Balance delivery with a fuller account."
 zg361cp.26.c:0 "Close this item and record policy debt."
 zg361cp.26.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361cp.27.t:0 "Allocate One Hundred Percent of the Credit"
 zg361cp.27.desc:0 "A contribution and time ledger is open: [scope:zg361_cp_e_subject.GetShortUIName] is the subject, and [scope:zg361_cp_e_owner.GetShortUIName] will decide the case. The decision owner must issue one complete ten-thousand-basis-point allocation across the subject, direct manager and cross-department contributor. It records an allocation, not three personal signatures."
 zg361cp.27.a:0 "Allocate a clear majority to the subject."
 zg361cp.27.b:0 "Use a balanced cross-functional allocation."
 zg361cp.27.c:0 "Close this item and record policy debt."
 zg361cp.27.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361cp.28.t:0 "Credit Claim and Audit Reversal"
 zg361cp.28.desc:0 "A contribution and time ledger is open: [scope:zg361_cp_e_subject.GetShortUIName] is the subject, and [scope:zg361_cp_e_owner.GetShortUIName] will decide the case. A credit transfer must be net zero, and a rejected grab must be reversed without rewriting the frozen allocation baseline."
 zg361cp.28.a:0 "Uphold a bounded manager claim."
 zg361cp.28.b:0 "Reverse the grab after evidence review."
 zg361cp.28.c:0 "Close this item and record policy debt."
 zg361cp.28.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361cp.29.t:0 "Metric Packaging and Audit"
 zg361cp.29.desc:0 "A contribution and time ledger is open: [scope:zg361_cp_e_subject.GetShortUIName] is the subject, and [scope:zg361_cp_e_owner.GetShortUIName] will decide the case. The audit has reached one disputed gain. The file must distinguish a genuine improvement from metric gaming and preserve any delayed cost as a traceable entry."
 zg361cp.29.a:0 "Record a genuine improvement."
 zg361cp.29.b:0 "Record gaming and its delayed cost."
 zg361cp.29.c:0 "Close this item and record policy debt."
 zg361cp.29.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361cp.30.t:0 "One Project Wins the Capacity Race"
 zg361cp.30.desc:0 "A contribution and time ledger is open: [scope:zg361_cp_e_subject.GetShortUIName] is the subject, and [scope:zg361_cp_e_owner.GetShortUIName] will decide the case. One bounded project slot and a finite capacity book must be reserved before anyone spends project hours."
 zg361cp.30.a:0 "Fund a forty-hour subject-led project."
 zg361cp.30.b:0 "Fund a sixty-hour cross-functional project."
 zg361cp.30.c:0 "Close this item and record policy debt."
 zg361cp.30.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361cp.31.t:0 "Sponsor Credit Has a Cap and Expiry"
 zg361cp.31.desc:0 "A contribution and time ledger is open: [scope:zg361_cp_e_subject.GetShortUIName] is the subject, and [scope:zg361_cp_e_owner.GetShortUIName] will decide the case. Sponsor visibility is temporary, bounded and cannot manufacture hard output."
 zg361cp.31.a:0 "Grant a small transparent introduction."
 zg361cp.31.b:0 "Spend a bounded sponsor balance."
 zg361cp.31.c:0 "Close this item and record policy debt."
 zg361cp.31.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361cp.54.t:0 "Reporting Consumes Delivery Capacity"
 zg361cp.54.desc:0 "A project reporting file has arrived: [scope:zg361_cp_i_subject.GetShortUIName] is the subject, and [scope:zg361_cp_i_owner.GetShortUIName] will decide the case. Building the packet spends real hours from the project without creating hard output."
 zg361cp.54.a:0 "Build the frozen short fact sheet."
 zg361cp.54.b:0 "Build the long narrative and pay four hours."
 zg361cp.54.c:0 "Close this item and record policy debt."
 zg361cp.54.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361cp.55.t:0 "Routing Is Not Reading"
 zg361cp.55.desc:0 "A project reporting file has arrived: [scope:zg361_cp_i_subject.GetShortUIName] is the subject, and [scope:zg361_cp_i_owner.GetShortUIName] will decide the case. A routed report becomes visible only when a manager spends one of two finite deep-read slots."
 zg361cp.55.a:0 "Spend one slot on the direct manager."
 zg361cp.55.b:0 "Spend both slots on direct and skip-level readers."
 zg361cp.55.c:0 "Close this item and record policy debt."
 zg361cp.55.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361cp.56.t:0 "Forward Without Quietly Taking Credit"
 zg361cp.56.desc:0 "A project reporting file has arrived: [scope:zg361_cp_i_subject.GetShortUIName] is the subject, and [scope:zg361_cp_i_owner.GetShortUIName] will decide the case. Forwarded attribution starts from the frozen contribution book and every transfer remains net zero."
 zg361cp.56.a:0 "Forward the frozen shares unchanged."
 zg361cp.56.b:0 "Transfer five hundred basis points to the manager."
 zg361cp.56.c:0 "Close this item and record policy debt."
 zg361cp.56.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361cp.57.t:0 "Freeze the Report Version"
 zg361cp.57.desc:0 "A project reporting file has arrived: [scope:zg361_cp_i_subject.GetShortUIName] is the subject, and [scope:zg361_cp_i_owner.GetShortUIName] will decide the case. Only a complete ten-thousand-basis-point attribution may be frozen as the subject-authored report version. Freezing authorship does not claim a new personal signature."
 zg361cp.57.a:0 "Freeze version one."
 zg361cp.57.b:0 "Freeze version two after evidence review."
 zg361cp.57.c:0 "Close this item and record policy debt."
 zg361cp.57.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361cp.58.t:0 "Freeze Material Before Routing"
 zg361cp.58.desc:0 "A project reporting file has arrived: [scope:zg361_cp_i_subject.GetShortUIName] is the subject, and [scope:zg361_cp_i_owner.GetShortUIName] will decide the case. Direct and skip-level routing records recipients, but does not itself consume an attention slot."
 zg361cp.58.a:0 "Route to the direct manager only."
 zg361cp.58.b:0 "Route to direct and skip-level managers."
 zg361cp.58.c:0 "Close this item and record policy debt."
 zg361cp.58.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361cp.59.t:0 "Bad News Has a Timestamp"
 zg361cp.59.desc:0 "A project reporting file has arrived: [scope:zg361_cp_i_subject.GetShortUIName] is the subject, and [scope:zg361_cp_i_owner.GetShortUIName] will decide the case. The risk has entered its reporting window. Every delay now leaves more loss unresolved and weakens the integrity receipt attached to the file."
 zg361cp.59.a:0 "Report early and halve the remaining loss."
 zg361cp.59.b:0 "Report late and retain the full loss."
 zg361cp.59.c:0 "Close this item and record policy debt."
 zg361cp.59.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361cp.60.t:0 "The Frozen Version Owns the Idea"
 zg361cp.60.desc:0 "A project reporting file has arrived: [scope:zg361_cp_i_subject.GetShortUIName] is the subject, and [scope:zg361_cp_i_owner.GetShortUIName] will decide the case. Idea theft is arbitrated against the frozen author record and cross-department provenance."
 zg361cp.60.a:0 "Uphold the original author."
 zg361cp.60.b:0 "Recognize a proven joint authorship."
 zg361cp.60.c:0 "Close this item and record policy debt."
 zg361cp.60.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361cp.61.t:0 "Choose the Reporting Regime First"
 zg361cp.61.desc:0 "A project reporting file has arrived: [scope:zg361_cp_i_subject.GetShortUIName] is the subject, and [scope:zg361_cp_i_owner.GetShortUIName] will decide the case. No common reporting rule exists yet. A short fact sheet and a long narrative consume different shares of the same project capacity."
 zg361cp.61.a:0 "Use short factual reports."
 zg361cp.61.b:0 "Require long narrative reports."
 zg361cp.61.c:0 "Close this item and record policy debt."
 zg361cp.61.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361cp.62.t:0 "Two Lines, One Recorded Choice"
 zg361cp.62.desc:0 "A cross-line appointment case has arrived: [scope:zg361_cp_j_subject.GetShortUIName] is the subject, and [scope:zg361_cp_j_owner.GetShortUIName] will decide it. Two managers have issued incompatible priorities. The frozen weights and a joint arbitration are the available grounds for leaving one accountable instruction."
 zg361cp.62.a:0 "Follow the heavier solid-line weight."
 zg361cp.62.b:0 "Use joint arbitration."
 zg361cp.62.c:0 "Close this item and record policy debt."
 zg361cp.62.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361cp.63.t:0 "Lock Solid and Dotted Weights"
 zg361cp.63.desc:0 "A cross-line appointment case has arrived: [scope:zg361_cp_j_subject.GetShortUIName] is the subject, and [scope:zg361_cp_j_owner.GetShortUIName] will decide it. Two managers are competing for the same assessment authority this cycle, while the solid- and dotted-line weights do not yet close to one hundred."
 zg361cp.63.a:0 "Use seventy-thirty toward the solid line."
 zg361cp.63.b:0 "Use equal weights."
 zg361cp.63.c:0 "Close this item and record policy debt."
 zg361cp.63.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361cp.64.t:0 "A Manager Handoff Needs Both Owners Named"
 zg361cp.64.desc:0 "A cross-line appointment case has arrived: [scope:zg361_cp_j_subject.GetShortUIName] is the subject, and [scope:zg361_cp_j_owner.GetShortUIName] will decide it. The decision owner may order a future-responsibility handoff only after naming both old and new managers; historical case ownership never moves. This record is not their personal consent."
 zg361cp.64.a:0 "Name both managers and finalize the ordered handoff."
 zg361cp.64.b:0 "Record only the old manager and leave the handoff pending."
 zg361cp.64.c:0 "Close this item and record policy debt."
 zg361cp.64.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361cp.65.t:0 "An Airborne Manager Brings a Staff Pack"
 zg361cp.65.desc:0 "A cross-line appointment case has arrived: [scope:zg361_cp_j_subject.GetShortUIName] is the subject, and [scope:zg361_cp_j_owner.GetShortUIName] will decide it. Imported staff reduce retained institutional memory and can trigger a favoritism audit."
 zg361cp.65.a:0 "Import two of ten staff."
 zg361cp.65.b:0 "Import three and trigger the audit threshold."
 zg361cp.65.c:0 "Close this item and record policy debt."
 zg361cp.65.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361cp.66.t:0 "Business Cancellation Is Not Personal Failure"
 zg361cp.66.desc:0 "A cross-line appointment case has arrived: [scope:zg361_cp_j_subject.GetShortUIName] is the subject, and [scope:zg361_cp_j_owner.GetShortUIName] will decide it. The strategic review supports cancellation, but the file still mixes unspent capacity with independently verified personal contribution."
 zg361cp.66.a:0 "Cancel now and preserve verified credit."
 zg361cp.66.b:0 "Approve a later cancellation without rewriting credit."
 zg361cp.66.c:0 "Close this item and record policy debt."
 zg361cp.66.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361cp.67.t:0 "Two Incumbents Need One Terminal Owner"
 zg361cp.67.desc:0 "A cross-line appointment case has arrived: [scope:zg361_cp_j_subject.GetShortUIName] is the subject, and [scope:zg361_cp_j_owner.GetShortUIName] will decide it. Two incumbents are recorded against the same office. The file cannot close until exactly one of them remains accountable for it."
 zg361cp.67.a:0 "Retain the assessed official."
 zg361cp.67.b:0 "Retain the cross-department incumbent."
 zg361cp.67.c:0 "Close this item and record policy debt."
 zg361cp.67.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361cp.68.t:0 "History Travels; Authorship Does Not"
 zg361cp.68.desc:0 "A cross-line appointment case has arrived: [scope:zg361_cp_j_subject.GetShortUIName] is the subject, and [scope:zg361_cp_j_owner.GetShortUIName] will decide it. Ratings and an open PIP may travel as priors, but do not consume current quota or re-own old cases."
 zg361cp.68.a:0 "Carry one protected cycle and any open PIP."
 zg361cp.68.b:0 "Carry ratings without the PIP."
 zg361cp.68.c:0 "Close this item and record policy debt."
 zg361cp.68.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361cp.129.t:0 "Promotion Is a Queue With Real Slots"
 zg361cp.129.desc:0 "An active project file has arrived: [scope:zg361_cp_r_subject.GetShortUIName] is the subject, and [scope:zg361_cp_r_owner.GetShortUIName] will decide it. FIFO eligibility and one bounded award slot prevent duplicate or out-of-order promotion."
 zg361cp.129.a:0 "Queue the subject for the next opening."
 zg361cp.129.b:0 "Queue and allocate the one available slot."
 zg361cp.129.c:0 "Close this item and record policy debt."
 zg361cp.129.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361cp.130.t:0 "Do Not Dump a Hidden PIP"
 zg361cp.130.desc:0 "An active project file has arrived: [scope:zg361_cp_r_subject.GetShortUIName] is the subject, and [scope:zg361_cp_r_owner.GetShortUIName] will decide it. Transfer provenance records PIP disclosure, role evidence, trial outcome and source-manager accountability."
 zg361cp.130.a:0 "Disclose the PIP and run a supported trial."
 zg361cp.130.b:0 "Rescue a proven wrong-role placement."
 zg361cp.130.c:0 "Close this item and record policy debt."
 zg361cp.130.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361cp.131.t:0 "Exploration and Commitment Are Different Tracks"
 zg361cp.131.desc:0 "An active project file has arrived: [scope:zg361_cp_r_subject.GetShortUIName] is the subject, and [scope:zg361_cp_r_owner.GetShortUIName] will decide it. Results are not known yet. Registration must now fix whether this is exploratory work or a firm commitment and bind the matching success rule."
 zg361cp.131.a:0 "Register an exploration track."
 zg361cp.131.b:0 "Register a commitment track."
 zg361cp.131.c:0 "Close this item and record policy debt."
 zg361cp.131.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361cp.132.t:0 "A Timely Stop Can Earn Credit"
 zg361cp.132.desc:0 "An active project file has arrived: [scope:zg361_cp_r_subject.GetShortUIName] is the subject, and [scope:zg361_cp_r_owner.GetShortUIName] will decide it. A stop decision releases unspent capacity and keeps business outcome separate from individual judgement."
 zg361cp.132.a:0 "Stop on strong evidence and grant timely-stop credit."
 zg361cp.132.b:0 "Stop late and record named accountability."
 zg361cp.132.c:0 "Close this item and record policy debt."
 zg361cp.132.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361cp.133.t:0 "Learning and Liability Need Separate Tracks"
 zg361cp.133.desc:0 "An active project file has arrived: [scope:zg361_cp_r_subject.GetShortUIName] is the subject, and [scope:zg361_cp_r_owner.GetShortUIName] will decide it. System causes and learning actions are recorded without blanket punishment; proven violations remain named."
 zg361cp.133.a:0 "Record learning with no proven violation."
 zg361cp.133.b:0 "Record system learning and one named violation."
 zg361cp.133.c:0 "Close this item and record policy debt."
 zg361cp.133.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
 zg361cp.134.t:0 "A Shared Metric Still Has One Owner"
 zg361cp.134.desc:0 "An active project file has arrived: [scope:zg361_cp_r_subject.GetShortUIName] is the subject, and [scope:zg361_cp_r_owner.GetShortUIName] will decide it. Several contributors appear in the file, but final settlement authority can be assigned only once. Both the subject and the direct manager have a documented claim."
 zg361cp.134.a:0 "Assign the subject as sole owner."
 zg361cp.134.b:0 "Assign the direct manager as sole owner."
 zg361cp.134.c:0 "Close this item and record policy debt."
 zg361cp.134.c.tt:0 "No business action is taken. One next-cycle policy debt is recorded, and this item will not be proposed again automatically."
