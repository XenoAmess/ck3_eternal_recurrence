 zg361m.357.b:0 "一つのキャリブレーション会議で評定を決定し、配分を満たすため遡って理由を埋める"
 zg361m.357.c:0 "保留し明確な制度債務として記録する"
 zg361m.358.t:0 "#358 · 異議申立てにおける不加重原則"
 zg361m.358.desc:0 "[AL / P1] 本制度は共有組織台帳を通じて運用される。選択された規則は成果・証拠・信頼・業務量・リスク・人材・財務圧力を変え、ひいては後のチーム実績と管理者自身の評価にも影響する。"
 zg361m.358.a:0 "異議申立ては現状維持または軽減のみ可能とし、新規に発見された不正は別途告知した案件として扱う"
 zg361m.358.b:0 "根拠の弱い申立てを抑止するため、同じ異議申立て内で懲罰を強化することを認める"
 zg361m.358.c:0 "保留し明確な制度債務として記録する"
 zg361m.359.t:0 "#359 · 評価の覆り後の割当再配分と再通知"
 zg361m.359.desc:0 "[AL / P1] 本制度は共有組織台帳を通じて運用される。選択された規則は成果・証拠・信頼・業務量・リスク・人材・財務圧力を変え、ひいては後のチーム実績と管理者自身の評価にも影響する。"
 zg361m.359.a:0 "予備枠を使用するか境界事案を再審し、影響を受ける職員全員に異議申立て権を告知し直す"
 zg361m.359.b:0 "境界事案を内密に降格させ、一連の再手続きを開かずに配分を即時回復する"
 zg361m.359.c:0 "保留し明確な制度債務として記録する"
 zg361m.360.t:0 "#360 · C 強制に対するマネージャーの集団拒否"
 zg361m.360.desc:0 "[AL / P2] 本制度は共有組織台帳を通じて運用される。選択された規則は成果・証拠・信頼・業務量・リスク・人材・財務圧力を変え、ひいては後のチーム実績と管理者自身の評価にも影響する。"
 zg361m.360.a:0 "マネージャーが共同して証拠ある例外または公開改革を求め、管理スコアを犠牲にする"
 zg361m.360.b:0 "各マネージャーに最下位評定を強制させ、組織的強制力で人材密度の物語を維持する"
 zg361m.360.c:0 "保留し明確な制度債務として記録する"
 zg361m.361.t:0 "#361 · 361 パフォーマンス憲章"
 zg361m.361.desc:0 "[AL / P2] 本制度は共有組織台帳を通じて運用される。選択された規則は成果・証拠・信頼・業務量・リスク・人材・財務圧力を変え、ひいては後のチーム実績と管理者自身の評価にも影響する。"
 zg361m.361.a:0 "証拠・長期イノベーション・組織健全性を優先し、十年監査を伴う改訂可能な憲章を採用する"
 zg361m.361.b:0 "強制競争と即時納品を優先する硬質な憲章を採用し、人材密度のために高圧で運営する"
 zg361m.361.c:0 "保留し明確な制度債務として記録する"
