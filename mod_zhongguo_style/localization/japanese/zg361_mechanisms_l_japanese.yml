l_japanese:
 zg361_next_mechanism_decision:0 "次期制度をレビュー"
 zg361_next_mechanism_decision_desc:0 "未決の361制度の次項目を開き、組織台帳に記録される選択を行う。"
 zg361_next_mechanism_decision_tooltip:0 "次の361制度カードを開く。"
 zg361_next_mechanism_decision_confirm:0 "次の制度責任者を呼び込む"
 zg361_reference_charter_decision:0 "361リファレンス憲章を展開"
 zg361_reference_charter_decision_desc:0 "全361制度の推奨デフォルトを一括採用する。数十年分の会議を節約し、行政・予算・組織への影響を即座にすべて背負う。"
 zg361_reference_charter_decision_tooltip:0 "361項目を一度に実際に処理する。表示だけのものではない。"
 zg361_reference_charter_decision_confirm:0 "ポートフォリオを全部出す"
 zg361_mechanism_choice_a_tt:0 "耐久ルート:証拠、信頼、能力を強化しつつ、行政・予算・短期デリバリの体力を消費する。"
 zg361_mechanism_choice_b_tt:0 "スプリントルート:目先の成果は良くなるが、リスク・燃え尽き・技術的負債・異議申立ての負債は次回以降のレビューに先送りされる。"
 zg361_mechanism_choice_c_tt:0 "先送りルート:今は手間を省けるが、制度上の負債として記録され、あなた自身の上司の次回レビューに流れる。"
 zg361_scoreboard_tab_system:0 "制度コックピット"
 zg361_ledger_title:0 "361制度台帳:ダッシュボードの裏側"
 zg361_ledger_configured:0 "確定済み制度"
 zg361_ledger_checksum:0 "ポートフォリオ・チェックサム"
 zg361_ledger_explainer:0 "正の値が常に良いとは限らない。行政負荷、異議申立てリスク、技術的負債、燃え尽き、HCプレッシャー、給与負債、制度負債、予算プレッシャーは数値上昇時に危険度も上がる。"
 zg361_ledger_evidence:0 "証拠の質"
 zg361_ledger_trust:0 "組織信頼"
 zg361_ledger_admin_load:0 "業績管理負荷"
 zg361_ledger_appeal_risk:0 "異議申立て・手続きリスク"
 zg361_ledger_delivery:0 "提供価値"
 zg361_ledger_stability:0 "安定性"
 zg361_ledger_tech_debt:0 "技術的負債"
 zg361_ledger_data_quality:0 "データの信頼性"
 zg361_ledger_burnout:0 "組織的燃え尽き"
 zg361_ledger_talent:0 "人材健全性"
 zg361_ledger_hc_pressure:0 "HCプレッシャー"
 zg361_ledger_pay_debt:0 "給与負債"
 zg361_ledger_policy_debt:0 "制度負債"
 zg361_ledger_budget_pressure:0 "予算プレッシャー"
 zg361_ledger_hint:0 "これらの台帳はチームの次期KPIに反映され、上司によるあなたのマネジメント評価にも使われる。"
 zg361_org_high_trust:0 "組織信頼:経営陣は約束を守る"
 zg361_org_high_trust_desc:0 "証拠、フィードバック、実績が互いに強化し合う。"
 zg361_org_admin_overload:0 "業績管理過負荷"
 zg361_org_admin_overload_desc:0 "全員が、なぜ全員が忙しいのかを説明するのに忙しい。"
 zg361_org_burnout_crisis:0 "組織的燃え尽き危機"
 zg361_org_burnout_crisis_desc:0 "オンライン時間は上出来だが、バッテリー残量はそうではない。"
 zg361_org_delivery_stable:0 "安定したデリバリー文化"
 zg361_org_delivery_stable_desc:0 "毎回リリースを謝罪文の下書きから始めるわけではない。"
 zg361_org_tech_debt_crisis:0 "複利化する技術的負債"
 zg361_org_tech_debt_crisis_desc:0 "昨日の近道が、今日の料金所になっている。"
 zg361_org_talent_healthy:0 "健全な人材パイプライン"
 zg361_org_talent_healthy_desc:0 "スターも後継者も堅実な貢献者にも、将来への道筋が見えている。"
 zg361m.1.t:0 "#001 · KPI 分項証拠シート"
 zg361m.1.desc:0 "[A / P0] この政策は共有される組織台帳を通じて実施される。選択されたルールは成果、証拠、信頼、業務量、リスク、人材、財務負担を変化させるため、後のチーム成績と管理者本人の評価に影響する。"
 zg361m.1.a:0 "成果・効率・成長・協働・価値観の各ケースを項目ごとに凍結し、記入とレビューの工数を確保して証拠シートを構築する。"
 zg361m.1.b:0 "総合点と上司の印象で即座に格付けし、素早く公開する。ただし抜けや誤りは追跡しづらくなる。"
 zg361m.1.c:0 "今四半期は保留し、制度上の負債として記録する"
 zg361m.2.t:0 "#002 · 年度目標責任書：OKR 方針と KPI 合意"
 zg361m.2.desc:0 "[A / P0] この政策は共有される組織台帳を通じて実施される。選択されたルールは成果、証拠、信頼、業務量、リスク、人材、財務負担を変化させるため、後のチーム成績と管理者本人の評価に影響する。"
 zg361m.2.a:0 "職務ごとに方針・基準値・通常目標を凍結し、裏付けのある危機時再設定のみ一回認める代わりに継続的な追跡コストを引き受ける。"
 zg361m.2.b:0 "各部署に一律の攻めた目標を課し当初の基準で責任を追及し、短距離走と引き換えに指標の歪みや隠れた火種を招く。"
 zg361m.2.c:0 "今四半期は保留し、制度上の負債として記録する"
 zg361m.3.t:0 "#003 · 期中チェックインと目標再設定"
 zg361m.3.desc:0 "[A / P1] この政策は共有される組織台帳を通じて実施される。選択されたルールは成果、証拠、信頼、業務量、リスク、人材、財務負担を変化させるため、後のチーム成績と管理者本人の評価に影響する。"
 zg361m.3.a:0 "期中コーチング・レビューを実施し、リスクと資源を記録し、裏付けのある一回限りの危機再設定を許可し、管理工費を投じて説明可能な最終評価を得る。"
 zg361m.3.b:0 "年初の目標を維持し期限内に挽回を求める。再設定作業を省けるが、戦略変更が個人の失敗とみなされ、悪報告が遅れる恐れがある。"
 zg361m.3.c:0 "今四半期は保留し、制度上の負債として記録する"
 zg361m.4.t:0 "#004 · 自己評価と認識ギャップ"
 zg361m.4.desc:0 "[A / P1] この政策は共有される組織台帳を通じて実施される。選択されたルールは成果、証拠、信頼、業務量、リスク、人材、財務負担を変化させるため、後のチーム成績と管理者本人の評価に影響する。"
 zg361m.4.a:0 "代表成果に基づく自己評価を必須とし、認識ギャップごとに上司が回答する。対話コストを受け入れ、再確認できる記録を残す。"
 zg361m.4.b:0 "一枚の自己PRだけを受け取り、誇張や謙遜に応じて主観点を素早く調整する。時間は節約できるが、表現力を実績と混同させる。"
 zg361m.4.c:0 "今四半期は保留し、制度上の負債として記録する"
 zg361m.5.t:0 "#005 · 職種別スコアカード"
 zg361m.5.desc:0 "[A / P1] 本ポリシーは共有組織台帳を通じて運用される。選択されたルールは成果・根拠・信頼・業務量・リスク・人材・財政圧力を変え、その後のチーム成果と管理者自身の評価にも影響する。"
 zg361m.5.a:0 "ガバナンス・軍事・財務・管理の各職種で異なる重みを校準前に固定し、複数のスコアカードを運用するコストを受け入れる。"
 zg361m.5.b:0 "全職種を単一の結果表で強制順位付けし、迅速な実行を優先する一方、定量化困難な業務を体系的に不利にし、ミスマッチを拡大する。"
 zg361m.5.c:0 "今期は先送りし、明示的に制度負債として記録する"
 zg361m.6.t:0 "#006 · スタート地点と難易度補正"
 zg361m.6.desc:0 "[A / P2] 本ポリシーは共有組織台帳を通じて運用される。選択されたルールは成果・根拠・信頼・業務量・リスク・人材・財政圧力を変え、その後のチーム成果と管理者自身の評価にも影響する。"
 zg361m.6.a:0 "引き継いだ基準値・資源・職種の難易度を凍結し、上限を設けた小幅補正のみを行い、横断比較の公平化のために監査工数を費やす。"
 zg361m.6.b:0 "期末の絶対成果のみを判定し、裕福なユニットにはより高い目標を課すことで、ランキングは速やかに出るが、先行きの利益や後始末業務が不当に評価される恐れがある。"
 zg361m.6.c:0 "今期は先送りし、明示的に制度負債として記録する"
 zg361m.7.t:0 "#007 · 背中合わせ 360 度評価の招待"
 zg361m.7.desc:0 "[B / P0] 本ポリシーは共有組織台帳を通じて運用される。選択されたルールは成果・根拠・信頼・業務量・リスク・人材・財政圧力を変え、その後のチーム成果と管理者自身の評価にも影響する。"
 zg361m.7.a:0 "実際に協働した少数の評価者のみを招待し、具体的な事例を必須として相互検証し、招待と名寄せの事務コストを受け入れる。"
 zg361m.7.b:0 "広く募集し、票の高低を即時に重み付けすることで迅速にシグナルを増幅する一方、相互賛辞や報復、テンプレ評価の余地を生む。"
 zg361m.7.c:0 "今期は先送りし、明示的に制度負債として記録する"
 zg361m.8.t:0 "#008 · 評価者の甘辛評価と同僚の信用"
 zg361m.8.desc:0 "[B / P1] 本ポリシーは共有組織台帳を通じて運用される。選択されたルールは成果・根拠・信頼・業務量・リスク・人材・財政圧力を変え、その後のチーム成果と管理者自身の評価にも影響する。"
 zg361m.8.a:0 "各評価者の過去平均・分散・覆権率・命中率を保持し、それに基づき重みを補正し、長期的なデータガバナンスコストを受け入れる。"
 zg361m.8.b:0 "今サイクルは同僚からの生の評価をそのまま受け入れ、歪曲者は申し立て後に処罰する。早期決着はできるが、まず甘い評価者と厳しい評価者が順位を形成する。"
 zg361m.8.c:0 "今期は先送りし、明示的に制度負債として記録する"
 zg361m.9.t:0 "#009 · キャリブレーション会議ダッシュボード"
 zg361m.9.desc:0 "[B / P0] 本方針は共有の組織台帳を通じて運用される。選択されたルールは納期、根拠、信頼、業務量、リスク、人材、財政圧力を変化させ、その結果として後続のチーム成績と管理者自身の評価に影響する。"
 zg361m.9.a:0 "KPI、価値観、目標、360 フィードバック、推移、申し立て根拠を一括表示し、すべての評定変更を枠中立の入れ替えとして記録する。"
 zg361m.9.b:0 "現時点の合計点と残余枠だけで 1 回の会議で締め、境界事例や見えにくい貢献を圧縮しながら高速で結論する。"
 zg361m.9.c:0 "今期は保留し、制度としての負債を明記する"
 zg361m.10.t:0 "#010 ・ C を誰かに押し付け、部下の盾になる"
 zg361m.10.desc:0 "[B / P0] 本方針は共有の組織台帳を通じて運用される。選択されたルールは納期、根拠、信頼、業務量、リスク、人材、財政圧力を変化させ、その結果として後続のチーム成績と管理者自身の評価に影響する。"
 zg361m.10.a:0 "凍結された確定根拠から最下位評定を選ぶ。部下を庇うなら、威信と次サイクル管理 KPI を明示的に差し出し、信頼を制度コストと引き換えに守る。"
 zg361m.10.b:0 "枠を満たすため新人や周辺人物に直接 C を押し付け、分布は今すぐ確定させるが、申し立て・怨恨・離職の危険を蓄積する。"
 zg361m.10.c:0 "今期は保留し、制度としての負債を明記する"
 zg361m.11.t:0 "#011 ・ 越階層のキャリブレーションと HR 政委席"
 zg361m.11.desc:0 "[B / P1] 本方針は共有の組織台帳を通じて運用される。選択されたルールは納期、根拠、信頼、業務量、リスク、人材、財政圧力を変化させ、その結果として後続のチーム成績と管理者自身の評価に影響する。"
 zg361m.11.a:0 "越階層上司は分布・極端な根拠・手順だけを査閲し、根拠の薄い案件は追加会議のコストをかけて直属マネージャへ差し戻す。"
 zg361m.11.b:0 "越階層席に孫役の評定を直接書き換えさせ、手戻りなしで素早く修正する一方、直属マネージャの権限を侵食し陳情を招く。"
 zg361m.11.c:0 "今期は保留し、制度としての負債を明記する"
 zg361m.12.t:0 "#012 ・ 利益相反の開示と忌避"
 zg361m.12.desc:0 "[B / P1] 本方針は共有の組織台帳を通じて運用される。選択されたルールは納期、根拠、信頼、業務量、リスク、人材、財政圧力を変化させ、その結果として後続のチーム成績と管理者自身の評価に影響する。"
 zg361m.12.a:0 "キャリブレーション前に親族・親密・敵対・後ろ盾関係を全て開示し、忌避する評価者は独立席に置き換えて、組席と遅延コストを引き受ける。"
 zg361m.12.b:0 "上司に表で主張させるか、あるいは水面下で素早く誰かを庇護したり罰したりするよう仕向け、結果は掌握しつつも覆しや個人評価への逆風を大きく高める。"
 zg361m.12.c:0 "今期は保留し、制度としての負債を明記する"
 zg361m.13.t:0 "#013 ・ 透明・半透明・ブラックボックス公示"
 zg361m.13.desc:0 "[B / P2] 本方針は共有の組織台帳を通じて運用される。選択されたルールは納期、根拠、信頼、業務量、リスク、人材、財政圧力を変化させ、その結果として後続のチーム成績と管理者自身の評価に影響する。"
 zg361m.13.a:0 "本人には凍結された理由と申し立て経路を公開し、チームには評定と集計ルールを公開し、機微な同僚評価にはアクセス制御を設ける。"
 zg361m.13.b:0 "本人には最終評定だけを口頭で伝え、理由は封印する。表面の衝突は減るが、疑心・上向きマネジメント・申し立てが増える。"
 zg361m.13.c:0 "今期は保留し、制度としての負債を明記する"
 zg361m.14.t:0 "#014 ・ 業績評価の申し立て資料"
 zg361m.14.desc:0 "[C / P0] 直属上司との協議を経た後、被評価者が凍結された証拠を添えて異議を申し立てた。認められた場合、上司が結果を再校正し、地方国庫・個人の金・功徳に対する 3.25 の即時三項目課金を一件ずつ返金し、まだ残っている一年間の 25% 俸給減額措置を直ちに停止し、序列を修正する。却下された、あるいは悪意ある異議申立ては、立場と信用を損なう。"
 zg361m.14.a:0 "誤り分類ごとに凍結証拠を収集し、独立した検証の前に協議を必須とし、再校正・三件の即時返金・俸給減額の停止の各項目を一つずつ照合する。"
 zg361m.14.b:0 "元の上司にその場で却下または印象で評定を修正させ、紛争は即決する一方、二重処罰・誤還付・利益相反の確定を招く危険がある。"
 zg361m.14.c:0 "今期は保留し、制度としての負債を明記する"
 zg361m.15.t:0 "#015 ・ PIP 改善計画書"
 zg361m.15.desc:0 "[C / P0] 本方針は共有の組織台帳を通じて運用される。選択されたルールは納期、根拠、信頼、業務量、リスク、人材、財政圧力を変化させ、その結果として後続のチーム成績と管理者自身の評価に影響する。"
 zg361m.15.a:0 "本人の権限内で検証可能な節目・支援・確認点を交渉し、実際に達成しうる改善機会のために資源を投入する。"
 zg361m.15.b:0 "高圧的な節目と硬い期限を一方的に課し、拒絶は重大なマイナス根拠として記録する。即効性はあるが、退場を前提としたように見える。"
 zg361m.15.c:0 "今期は保留し、制度としての負債を明記する"
 zg361m.16.t:0 "#016 ・ PIP 支援予算と「指標だけで資源は渡さない」"
 zg361m.16.desc:0 "[C / P1] 本方針は共有の組織台帳を通じて運用される。選択されたルールは納期、根拠、信頼、業務量、リスク、人材、財政圧力を変化させ、その結果として後続のチーム成績と管理者自身の評価に影響する。"
 zg361m.16.a:0 "PIP にメンター・一時的ガバナンス資源・定例レビューを充当し、すべての投入を記録し、真の改善を検証するため予算を支出する。"
 zg361m.16.b:0 "資源を一切渡さず目標だけを設定し、期限通り厳格に検証する。当期予算は浮くが、失敗は申し立て根拠となり上司の管理 KPI を逆襲する。"
 zg361m.16.c:0 "今期は保留し、制度としての負債を明記する"
 zg361m.17.t:0 "#017 ・ 最下位者の処遇ステップ"
 zg361m.17.desc:0 "[C / P0] 本方針は共有の組織台帳を通じて運用される。選択されたルールは納期、根拠、信頼、業務量、リスク、人材、財政圧力を変化させ、その結果として後続のチーム成績と管理者自身の評価に影響する。"
 zg361m.17.a:0 "初回の低評定は協議・PIP・合法的な配置転換で対応し、繰り返しの失敗後にのみ権限を剥奪するか HC を開放し、人材開発コストと欠員計画コストを引き受ける。"
 zg361m.17.b:0 "最下位者に対し即時に昇進停止・降格・解任を行い、人材密度を直ちに引き上げる。席は素早く空くが、恐怖・空席・申し立て集中を生む。"
 zg361m.17.c:0 "今期は保留し、制度としての負債を明記する"
 zg361m.18.t:0 "#018 · 個人調書と四重決算"
 zg361m.18.desc:0 "[C / P0] この凍結記録には評価、KPI、序列、上司、理由が表示される。3.25 の事案ではさらに地方国庫 -50、個人の金 -25、功徳 -60、一年間の俸給 -25% の四重処罰、および異議申立てによる返金もしくは停止措置の状況も表示される。"
 zg361m.18.a:0 "決算時に段位・順位・上官・理由、および地方国庫・個人の金・功徳の三件の即時徴収と一年間の俸給減額を凍結し、支払い・返金・停止をそれぞれ個別に記録する。"
 zg361m.18.b:0 "履歴を開く時点の現在値で課金を合算し即時表示する。流れは短縮されるが、上司交代、残高変動、または再表示により誤算・重複計算が起きる危険がある。"
 zg361m.18.c:0 "今期は保留し、制度としての負債を明記する"
 zg361m.19.t:0 "#019 ・ 昇格資格のゲート"
 zg361m.19.desc:0 "[D / P0] 本方針は共有の組織台帳を通じて運用される。選択されたルールは納期、根拠、信頼、業務量、リスク、人材、財政圧力を変化させ、その結果として後続のチーム成績と管理者自身の評価に影響する。"
 zg361m.19.a:0 "連続高業績・価値観・PIP 状況・在職年数・合法的な欠員を全て検証してから昇格案件を開く。候補者審査コストを引き受ける。"
 zg361m.19.b:0 "スポンサーに本サイクル目の逸材について一部のゲートを飛ばして即時推薦させ、人材を迅速に引き留める一方、空洞昇格と過去の履歴を巡る紛争を招く危険がある。"
 zg361m.19.c:0 "今期は保留し、制度としての負債を明記する"
 zg361m.20.t:0 "#020 ・ 昇格資料と部門横断ヒアリング"
 zg361m.20.desc:0 "[D / P1] 本方針は共有の組織台帳を通じて運用される。選択されたルールは納期、根拠、信頼、業務量、リスク、人材、財政圧力を変化させ、その結果として後続のチーム成績と管理者自身の評価に影響する。"
 zg361m.20.a:0 "凍結されたガバナンス実績・チーム影響・再利用可能な手法から昇格資料を作成し、部門横断パネルの境界判定を記録する。"
 zg361m.20.b:0 "スポンサーに単回の口頭プレゼンだけを主導させ速やかに決裁する。表現力があれば有利だが、包装が継続実績を凌駕する危険がある。"
 zg361m.20.c:0 "今期は保留し、制度としての負債を明記する"
 zg361m.21.t:0 "#021 ・ ボーナス・昇給マトリクス"
 zg361m.21.desc:0 "[D / P1] 統治者が限られた賞与原資を配分する。3.75 は賞与または短期昇給、3.5 は据え置き、3.25 は四重罰を維持する。最高評価への褒賞は実財政を圧迫し、繰り返し報われない 3.75 の人材は転属や離任を求める可能性がある。"
 zg361m.21.a:0 "評定とボーナス・昇給の対応表を事前に公開し、プール総額を固定し、当期財政コストをかけて上位評定を現実に支給する。"
 zg361m.21.b:0 "限られた資金を少数の上位評定に集中し、定例昇給を後ろ倒しする。シグナルは素早く強化されるが、欠賞・給与逆転・引き抜きの危険を蓄積する。"
 zg361m.21.c:0 "今期は保留し、制度としての負債を明記する"
 zg361m.22.t:0 "#022 ・ ソフト HC / 定員予算"
 zg361m.22.desc:0 "[D / P1] 本方針は共有の組織台帳を通じて運用される。選択されたルールは納期、根拠、信頼、業務量、リスク、人材、財政圧力を変化させ、その結果として後続のチーム成績と管理者自身の評価に影響する。"
 zg361m.22.a:0 "チーム実績・財政・欠員状況から年間採用・育成・補員予算を策定し、各枠の用途と回収を項目ごとに追跡する。"
 zg361m.22.b:0 "現在の圧力と上司の意向に従い、定員を場当たり的に増減または凍結する。重点支援は迅速だが、可視性の低いチームは慢性的に不足し、枠占有を助長する。"
 zg361m.22.c:0 "今期は保留し、制度としての負債を明記する"
 zg361m.23.t:0 "#023 ・ HC ヒアリングとチーム投資対効果"
 zg361m.23.desc:0 "[D / P1] 本方針は共有の組織台帳を通じて運用される。選択されたルールは納期、根拠、信頼、業務量、リスク、人材、財政圧力を変化させ、その結果として後続のチーム成績と管理者自身の評価に影響する。"
 zg361m.23.a:0 "目標達成度、異議申し立て、離職率、財政効率でHCを擁護し、次サイクル見直しに向けて約束事項を記録し、年度レビューの作業時間を受け入れる。"
 zg361m.23.b:0 "切迫した事情と人脈を頼りに即時に借調または増員し、今すぐ負荷を減らす一方、約束が果たされない場合は HC 信用と燃え尽きリスクを拡大させる。"
 zg361m.23.c:0 "今期は保留し、制度としての負債を明記する"
 zg361m.24.t:0 "#024 ・ 社内流動と配置転換の駆け引き"
 zg361m.24.desc:0 "[D / P1] 本方針は共有の組織台帳を通じて運用される。選択されたルールは納期、根拠、信頼、業務量、リスク、人材、財政圧力を変化させ、その結果として後続のチーム成績と管理者自身の評価に影響する。"
 zg361m.24.a:0 "前職履歴を凍結し、新たな基準を設け、異動者の引き継ぎと後任補充に合意し、ミスマッチやエースに法的な流動経路を整えるために時間を費やす。"
 zg361m.24.b:0 "旧上司が即座に拒否するか、新上司が即座に引き抜き、短期的に成果を確保または獲得する一方、囲い込み・欠員・管理評判の負債を残す。"
 zg361m.24.c:0 "今期は保留し、制度としての負債を明記する"
 zg361m.25.t:0 "#025 ・ 高業績人材の引き抜きと対抗オファー"
 zg361m.25.desc:0 "[D / P2] 本方針は共有の組織台帳を通じて運用される。選択されたルールは納期、根拠、信頼、業務量、リスク、人材、財政圧力を変化させ、その結果として後続のチーム成績と管理者自身の評価に影響する。"
 zg361m.25.a:0 "合法的な欠員があり昇格が停滞している連続上位人材にのみ、コストを伴う書面オファーを出し、旧上司には実職または俸給で応答させる。"
 zg361m.25.b:0 "見える化された逸材を昇進の口約束で広く引き抜き、迅速に戦力を補強する一方、賃上げ競争・空約束・チーム間の報復を招く。"
 zg361m.25.c:0 "今期は保留し、制度としての負債を明記する"
 zg361m.26.t:0 "#026 · 実貢献と上司の可視性、二重台帳"
 zg361m.26.desc:0 "[E / P0] この方針は組織共有台帳を通じて運用される。選択されたルールは納品・証跡・信頼・業務負荷・リスク・人材・財務圧迫を変え、後のチーム成果と上司自身の評価にも影響する。"
 zg361m.26.a:0 "実貢献と上司の可視性を別々に凍結し、隔階層インタビューで低可視性の成果を復元する。追加の検証工数を受け入れる。"
 zg361m.26.b:0 "今期の発表品質と関係の熱量から主観点を迅速に配分し、見せ上手を即時に評価する。空虚な資料が一時的にガバナンスに勝つことを許容する。"
 zg361m.26.c:0 "今回は保留し、明確な制度負債として記録する"
 zg361m.27.t:0 "#027 · 部門横断の貢献台帳"
 zg361m.27.desc:0 "[E / P1] この方針は組織共有台帳を通じて運用される。選択されたルールは納品・証跡・信頼・業務負荷・リスク・人材・財務圧迫を変え、後のチーム成果と上司自身の評価にも影響する。"
 zg361m.27.a:0 "共同作業ではオーナー、主担当、協力者、救世主、ブローカーの役割を凍結し、単一の上限付き成果プールを分配し、台帳の維持コストを受け入れる。"
 zg361m.27.b:0 "讓件の責任者に成果を独占させ、残りは後で言い分を争わせる。迅速に決着する一方、功績の横取りや重複申請を助長する。"
 zg361m.27.c:0 "今回は保留し、明確な制度負債として記録する"
 zg361m.28.t:0 "#028 · 功績奪取の仲裁 / 責任転嫁の振り返り"
 zg361m.28.desc:0 "[E / P1] この方針は組織共有台帳を通じて運用される。選択されたルールは納品・証跡・信頼・業務負荷・リスク・人材・財務圧迫を変え、後のチーム成果と上司自身の評価にも影響する。"
 zg361m.28.a:0 "成果または事案ごとに唯一の責任 ID を付与し、貢献台帳・証人・凍結版に基づき功績または責任を配分する。聴聞と振り返りのコストを負担する。"
 zg361m.28.b:0 "即座に英雄またはスケープゴートを指名して争いを終わらせ、物語を速やかに安定させる。一方で同朋の信頼を傷つけ、不当な裁定への上訴経路を残す。"
 zg361m.28.c:0 "今回は保留し、明確な制度負債として記録する"
 zg361m.29.t:0 "#029 · 指標の水増し、不正、そして京察監査"
 zg361m.29.desc:0 "[E / P1] この方針は共通の組織台帳を通じて運用される。選択されたルールは成果、証拠、信頼、業務量、リスク、人材、財務負担を変化させ、後のチーム成績と管理者自身の評価に影響を与える。"
 zg361m.29.a:0 "実績に基づく統治基準で指標を監査し、水増しの副作用を記録し、不正が証明された場合は褒賞を回収し、ほう助者を処分する。"
 zg361m.29.b:0 "まず税収や治安の突出した数字で評価し、失敗があってから調査する。短期の数字は刺激されるが、遅延損害と不正の利益が増幅される。"
 zg361m.29.c:0 "今回は保留し、制度上の負債として記録する"
 zg361m.30.t:0 "#030 · 資源の競馬"
 zg361m.30.desc:0 "[E / P2] この方針は共通の組織台帳を通じて運用される。選択されたルールは成果、証拠、信頼、業務量、リスク、人材、財務負担を変化させ、後のチーム成績と管理者自身の評価に影響を与える。"
 zg361m.30.a:0 "共通の節目のもとで競い合う小規模な試行に資金を提供し、予算保全と回収期日を凍結し、二つの試行のコストを負担する。"
 zg361m.30.b:0 "一チームの選定をスポンサーに委ね、HCと予算を一括で賭けさせ、短期間に重点を作る一方、上手に包装された失敗を組織全体の損失へと拡大させる。"
 zg361m.30.c:0 "先送りし、制度的な負債として明示的に記録する"
 zg361m.31.t:0 "#031・スポンサー・ネットワーク"
 zg361m.31.desc:0 "[E / P2] この方針は組織全体で共有される台帳を通じて運用される。選択されたルールは成果、証拠、信頼、業務量、リスク、人材、財政圧力を変化させるため、後続のチームの結果や上司自身の評価に影響を及ぼす。"
 zg361m.31.a:0 "スポンサーは関係を明示し、推薦に有効期限を設け、客観的な証拠審査を維持したうえで候補者をテーブルに連れてくることができる。"
 zg361m.31.b:0 "パトロンが昇進・HC・レビューの順番に直接割り込めるようにし、権力を迅速に動員する一方、組織を人脈とパトロンの存続に縛り付ける。"
 zg361m.31.c:0 "先送りし、制度的な負債として明示的に記録する"
 zg361m.32.t:0 "#032・管理者自身のチーム業績"
 zg361m.32.desc:0 "[F / P0] この政策は共有組織台帳を通じて運用される。選択されたルールは実績・証跡・信頼・業務量・リスク・人材・財政圧力を変化させ、後のチーム成果と上司自身の評価に影響する。"
 zg361m.32.a:0 "前サイクルで凍結された目標、京察、評価の覆り、PIP、人材定着、HCに基づいてマネージャーを評価し、サイクル横断的な会計コストを受け入れる。"
 zg361m.32.b:0 "当サイクルチームの順位のみで判定し、評定未実施・低評価・離職を直ちに厳罰化する。執行力は高いが、孫案件の責任を再帰的にマネージャーへ被せる。"
 zg361m.32.c:0 "今サイクルは見送り、制度上の負債として記録する"
 zg361m.33.t:0 "#033 · マネージャー類型と説明可能な理由コード"
 zg361m.33.desc:0 "[F / P0] この政策は共有組織台帳を通じて運用される。選択されたルールは実績・証跡・信頼・業務量・リスク・人材・財政圧力を変化させ、後のチーム成果と上司自身の評価に影響する。"
 zg361m.33.a:0 "データ派・護犢型など各類型の安定した重みと理由コードを設け、硬質な証跡で上限を縛り、説明維持のコストを引き受ける。"
 zg361m.33.b:0 "上司の性格と関係が境界証跡を直接上書きして迅速裁可できるようにする。人物像は鮮烈になるが、同一案件の処理が再現困難になる。"
 zg361m.33.c:0 "今サイクルは見送り、制度上の負債として記録する"
 zg361m.34.t:0 "#034 · 実績×可能性ナイン・ボックス"
 zg361m.34.desc:0 "[F / P1] この政策は共有組織台帳を通じて運用される。選択されたルールは実績・証跡・信頼・業務量・リスク・人材・財政圧力を変化させ、後のチーム成果と上司自身の評価に影響する。"
 zg361m.34.a:0 "複数サイクル凍結の実績、成長率、職務適合度でナイン・ボックスを較正し、各象限に育成または配置転換の予算を配分する。"
 zg361m.34.b:0 "当サイクルの評定と才能から高潜力和退出見込みを素早くラベリングし、資源集中は容易になるが、一度の評価が長期キャリアを決めてしまう。"
 zg361m.34.c:0 "今サイクルは見送り、制度上の負債として記録する"
 zg361m.35.t:0 "#035 · 厳格 361 / 緩和 361 / 混合しきい値"
 zg361m.35.desc:0 "[F / P2] 本方針は共有される組織台帳を通じて運用される。選定された規則は、業績・根拠・信頼・業務量・リスク・人材・財務圧力を変化させるため、後のチーム実績および管理者本人の評価に影響する。"
 zg361m.35.a:0 "絶対基準と相対ランキングを併用するハイブリッド方式を採用する。分布は維持しつつ、真の達成者への最下位制裁を緩和し、二重検証のコストを負担する。"
 zg361m.35.b:0 "3-6-1 を厳格に執行し、最下位枠をすべて強制的に埋める。制度は明快で発表も最速だが、全員が優秀であっても犠牲者を生み出す。"
 zg361m.35.c:0 "今四半期は先送りし、制度債務として明示的に記録する"
 zg361m.36.t:0 "#036 · 十年制度レポート"
 zg361m.36.desc:0 "[F / P2] 本方針は共有される組織台帳を通じて運用される。選定された規則は、業績・根拠・信頼・業務量・リスク・人材・財務圧力を変化させるため、後のチーム実績および管理者本人の評価に影響する。"
 zg361m.36.a:0 "年間評価、反転、PIP、昇進、HC、ボーナス、離職率、そして実際のガバナンスを凍結し、十年分の傾向を集計して長期的な報告コストを受け入れる。"
 zg361m.36.b:0 "現在の表と一部の目立つ指標だけを公開し、速やかに成功物語を作る。整った分布の裏にある離職とガバナンスの後退は覆い隠される。"
 zg361m.36.c:0 "今四半期は先送りし、制度債務として明示的に記録する"
 zg361m.37.t:0 "#037 · 部門横断クォータ取引"
 zg361m.37.desc:0 "[G / P1] 本方針は共有される組織台帳を通じて運用される。選定された規則は、業績・根拠・信頼・業務量・リスク・人材・財務圧力を変化させるため、後のチーム実績および管理者本人の評価に影響する。"
 zg361m.37.a:0 "両チームが貢献・難易度・過去の負債を基準に一つの評価枠を取引することを認め、政治的信用・資源・次サイクル返済義務を記録する。"
 zg361m.37.b:0 "交渉を禁じ、各チームに現地クォータどおりの確定を強制する。迅速に榜を閉じるが、小チームの偶然の最下位や真の品質差は是正されない。"
 zg361m.37.c:0 "今四半期は先送りし、制度債務として明示的に記録する"
 zg361m.38.t:0 "#038 · 小規模コホートの合算校正"
 zg361m.38.desc:0 "[G / P1] 本方針は共有される組織台帳を通じて運用される。選定された規則は、業績・根拠・信頼・業務量・リスク・人材・財務圧力を変化させるため、後のチーム実績および管理者本人の評価に影響する。"
 zg361m.38.a:0 "職能が近い小サンプルをまとめて合算するか、外部による絶対しきい値の審査を利用し、部門横断の調整と説明コストを受け入れる。"
 zg361m.38.b:0 "3〜6〜1 を 3〜4 人の範囲で無理に適用して自律性を維持し、合算を避けつつ、想定外の C 評価・異議申立て・離職を急増させる。"
 zg361m.38.c:0 "今期は保留し、制度上の負債として明記する"
 zg361m.39.t:0 "#039 · 分母の管理と名簿の固定"
 zg361m.39.desc:0 "[G / P1] この方針は共有の組織台帳を通じて運用される。選択されたルールは成果・根拠・信頼・業務量・リスク・人材・財務負担を変え、その後のチーム実績やマネージャー本人の評価に影響する。"
 zg361m.39.a:0 "キャリブレーション前に、借調・長期欠勤・転入・離任者の名簿を凍結し、変更には正式な理由と監査記録を必須とする。"
 zg361m.39.b:0 "締め切り直前に優秀者を外したり低業績者を押し込んで割当てを埋め、現コアを守るが、キャリブレーションの再開催と管理者責任のリスクを抱える。"
 zg361m.39.c:0 "今期は保留し、制度上の負債として明記する"
 zg361m.40.t:0 "#040 · 離任者に C を押し付ける"
 zg361m.40.desc:0 "[G / P1] この方針は共有の組織台帳を通じて運用される。選択されたルールは成果・根拠・信頼・業務量・リスク・人材・財務負担を変え、その後のチーム実績やマネージャー本人の評価に影響する。"
 zg361m.40.a:0 "凍結された実際業績で離職予定者を評価し、組織の退出と補充を別建てで計上し、真の欠員枠と割り当て圧力を引き受ける。"
 zg361m.40.b:0 "最下位枠をすでに去る予定の人物に押し付け、現チームが即座に全員合格できるようにして、配分・補充・人材判断の歪みを偽造したまま、その場しのぎの安寧を得る。"
 zg361m.40.c:0 "今期は保留し、制度上の負債として明記する"
 zg361m.41.t:0 "#041 · 新人を保護するか・含めるか・犠牲にするか"
 zg361m.41.desc:0 "[G / P1] この方針は共有の組織台帳を通じて運用される。選択されたルールは成果・根拠・信頼・業務量・リスク・人材・財務負担を変え、その後のチーム実績やマネージャー本人の評価に影響する。"
 zg361m.41.a:0 "新人を守りの対象として割当てから外し、ラーニング目標・メンター・合流日を設定し、育成コストと既存メンバーの枠圧迫を受け入れる。"
 zg361m.41.b:0 "新人を即時に本格評価し、最安値の最下位候補にして C 枠を最速で埋めるが、メンターの評価・採用評判・新人定着を損なう。"
 zg361m.41.c:0 "今期は保留し、制度上の負債として明記する"
 zg361m.42.t:0 "#042 · 周期をまたぐ C の順番回し"
 zg361m.42.desc:0 "[G / P2] この方針は共有の組織台帳を通じて運用される。選択されたルールは成果・根拠・信頼・業務量・リスク・人材・財務負担を変え、その後のチーム実績やマネージャー本人の評価に影響する。"
 zg361m.42.a:0 "周期をまたぐ固定的な順番回しを監査し、個人ごとの根拠を再構築して補償合意を仲介し、レビュー工を費やし評価の弁別力を取り戻す。"
 zg361m.42.b:0 "順番回しを疑った時点でグループ全体を低評価にし、即座に協定を破棄し、迅速に合謀を抑止するが、誤検知や裏切りへの恨みのリスクがある。"
 zg361m.42.c:0 "今期は保留し、制度上の負債として明記する"
 zg361m.43.t:0 "#043 · キャリブレーション会議の発言枠と注意予算"
 zg361m.43.desc:0 "[G / P1] この方針は共有の組織台帳を通じて運用される。選択されたルールは成果・根拠・信頼・業務量・リスク・人材・財務負担を変え、その後のチーム実績やマネージャー本人の評価に影響する。"
 zg361m.43.a:0 "少数の発言枠を事前に割り当て、ボーダーライン候補には書面根拠を要求し、マネージャーが使う注意力と政治資本を記録する。"
 zg361m.43.b:0 "マネージャーがお気に入りを時間超過で主張し評価が動くのを許し、一人だけは即救うかもしれないが、縁の下の貢献者を押しのけ上位者の忍耐を消耗させる。"
 zg361m.43.c:0 "今期は保留し、制度上の負債として明記する"
 zg361m.44.t:0 "#044 · 匿名での一次仕分けと記名での再審議"
 zg361m.44.desc:0 "[G / P2] この方針は共有の組織台帳を通じて運用される。選択されたルールは成果・根拠・信頼・業務量・リスク・人材・財務負担を変え、その後のチーム実績やマネージャー本人の評価に影響する。"
 zg361m.44.a:0 "氏名・関係を伏せて根拠だけで順位を付け、記名の段階で役割の難しさを加えて両段階の差分を再点検の対象とし、二回の工数を受け入れる。"
 zg361m.44.b:0 "最初から氏名付きで、業務に詳しい上位者が一括して順位を確定し、出番は早いが、ひいき・怨念・声量が早くから結果に入り込む。"
 zg361m.44.c:0 "今期は保留し、制度上の負債として明記する"
 zg361m.45.t:0 "#045 · 「サプライズ禁止」のフィードバック負債"
 zg361m.45.desc:0 "[G / P1] この方針は共有の組織台帳を通じて運用される。選択されたルールは成果・根拠・信頼・業務量・リスク・人材・財務負担を変え、その後のチーム実績やマネージャー本人の評価に影響する。"
 zg361m.45.a:0 "問題発生時に事実・コーチング・本人の反応を記録し、最終評価前に改善を確認し、継続的なフィードバック工と確認作業を受け入れる。"
 zg361m.45.b:0 "年末に初めて 3.25 を提示し、結果で押し付けて受諾させ、難しい会話を即終わらせるが、覆し案件とマネージャーのフィードバック負債が急増する。"
 zg361m.45.c:0 "今期は保留し、制度上の負債として明記する"
 zg361m.46.t:0 "#046 · 機会配分の監査"
 zg361m.46.desc:0 "[G / P1] この方針は共有の組織台帳を通じて運用される。選択されたルールは成果・根拠・信頼・業務量・リスク・人材・財務負担を変え、その後のチーム実績やマネージャー本人の評価に影響する。"
 zg361m.46.a:0 "キャリブレーション前に好条件の領域・重要案件・増援・経営層露出を監査し、機会の不均等さを認め、上限付きの難度補正のみを適用する。"
 zg361m.46.b:0 "最終結果だけで判定し、良い機会を得た者を即座に報いることで基準は単純だが、ひいきを高潜力と高成果に偽装する循環を生む。"
 zg361m.46.c:0 "今期は保留し、制度上の負債として明記する"
 zg361m.47.t:0 "#047 · 近接バイアスと根拠の対象期間"
 zg361m.47.desc:0 "[G / P2] この方針は共有の組織台帳を通じて運用される。選択されたルールは成果・根拠・信頼・業務量・リスク・人材・財務負担を変え、その後のチーム実績やマネージャー本人の評価に影響する。"
 zg361m.47.a:0 "周期開始時に全年等価または重要マイルストーンを対象期間として固定し、初期成果を反論用に保持し、根拠の完全保管コストを受け入れる。"
 zg361m.47.b:0 "最終評価で最新の成功や失敗を大幅に重視し、迅速に対応する一方、年末の駆け込み、リスク隠蔽、そして初期成果の抹消を助長する。"
 zg361m.47.c:0 "今期は保留し、制度上の負債として明記する"
 zg361m.48.t:0 "#048 · 評価者の工数と招待枠"
 zg361m.48.desc:0 "[H / P1] この方針は共有の組織台帳を通じて運用される。選択されたルールは成果・根拠・信頼・業務量・リスク・人材・財務負担を変え、その後のチーム実績やマネージャー本人の評価に影響する。"
 zg361m.48.a:0 "各自の評価対象を実際の協力関係にある相手だけに限定し、抜き取り検査で事例品質を確認し、非接触の辞退を認め、カバレッジを犠牲にして評価時間を守る。"
 zg361m.48.b:0 "全員に広範な相互レビューを強制し、記入量で協力度を測ることでデータを迅速に集めるが、定型文の量産や疲労、政治的なレビュー依頼が増える。"
 zg361m.48.c:0 "今期は保留し、制度上の負債として明記する"
 zg361m.49.t:0 "#049 · 提出封入と締切"
 zg361m.49.desc:0 "[H / P1] この方針は共有の組織台帳を通じて運用される。選択されたルールは成果・根拠・信頼・業務量・リスク・人材・財務負担を変え、その後のチーム実績やマネージャー本人の評価に影響する。"
 zg361m.49.a:0 "同僚評価は背中合わせに封入し、遅刻時は一度だけ信用を支払って監督下での補完提出を認め、根拠の完全性への影響を記録する。"
 zg361m.49.b:0 "締め切り時点で恒久的に閉鎖し遅延レビューをすべて無効化する。執行は潔いが、実際の連携が支援されず、締め切り前の事前調整を助長する。"
 zg361m.49.c:0 "今期は保留し、制度上の負債として明記する"
 zg361m.50.t:0 "#050 · 相互称賛契約と裏切り"
 zg361m.50.desc:0 "[H / P1] この方針は共有の組織台帳を通じて運用される。選択されたルールは成果・根拠・信頼・業務量・リスク・人材・財務負担を変え、その後のチーム実績やマネージャー本人の評価に影響する。"
 zg361m.50.a:0 "評価者ペアを相互相関で精査し、共同プロジェクトの証言を抽出して検証する。談合防止分析とヒアリングのコストを受け入れる。"
 zg361m.50.b:0 "疑わしい相互提灯持ちを即時に双方降格するか、最初に告発した者を報奨する。契約を速やかに瓦解させるが、先回りの裏切りと虚偽通報を煽る。"
 zg361m.50.c:0 "今期は保留し、制度上の負債として明記する"
 zg361m.51.t:0 "#051 · 推測可能な匿名性と最小サンプル数"
 zg361m.51.desc:0 "[H / P1] 本制度は共有組織台帳を通じて運用される。選択されたルールは進捗、根拠、信頼、業務量、リスク、人材、財務圧力を変化させ、後のチーム成果とマネージャー自身の評価に影響する。"
 zg361m.51.a:0 "最小サンプル数を下回る場合は集約・延期・記名同意を取得し、評価者保護のために詳細を犠牲にしてフィードバックのアクセス権を管理する。"
 zg361m.51.b:0 "行動に移しやすくするため匿名の生声を即座に少量公開し、情報は鋭くなるが投稿者が推測可能となり、報復と沈黙を招く。"
 zg361m.51.c:0 "今期は保留し、制度上の負債として記録する"
 zg361m.52.t:0 "#052 · 平均点だけでなく評価の形状を残す"
 zg361m.52.desc:0 "[H / P1] 本制度は共有組織台帳を通じて運用される。選択されたルールは進捗、根拠、信頼、業務量、リスク、人材、財務圧力を変化させ、後のチーム成果とマネージャー自身の評価に影響する。"
 zg361m.52.a:0 "情報源ごとの分布と二極化構造を保存し、上司と部下からの評価の衝突は別途調査する。差異を平均に潰さず、分析負担を受け入れる。"
 zg361m.52.b:0 "すべての同僚評価を平均化して一つのランキングスコアにし、信頼できる協力者と上ばかり気にするタイプを同列に扱うことで、最速の比較を行う。"
 zg361m.52.c:0 "今期は保留し、制度上の負債として記録する"
 zg361m.53.t:0 "#053 · 360度評価を開発目的に限定し賞与に連動させない"
 zg361m.53.desc:0 "[H / P2] 本制度は共有組織台帳を通じて運用される。選択されたルールは進捗、根拠、信頼、業務量、リスク、人材、財務圧力を変化させ、後のチーム成果とマネージャー自身の評価に影響する。"
 zg361m.53.a:0 "360度評価は開発助言と価値観のレッドラインにのみ用い、賞与は凍結した業績で決定する。別個のコーチング費用を負担することで率直さを引き出す。"
 zg361m.53.b:0 "同僚評価の得点を賞与と評価区分に直接連動させ重みを高める。統制は即座に強化されるが、派閥・報復・匿名の不透明性を生む温床となる。"
 zg361m.53.c:0 "今期は保留し、制度上の負債として記録する"
 zg361m.54.t:0 "#054 · 報告業務が実業務時間を奪う"
 zg361m.54.desc:0 "[I / P1] 本制度は共有組織台帳を通じて運用される。選択されたルールは進捗、根拠、信頼、業務量、リスク、人材、財務圧力を変化させ、後のチーム成果とマネージャー自身の評価に影響する。"
 zg361m.54.a:0 "報告を一枚サマリと例外報告に限定し、実業務時間を保護し事実をサンプリング点検する。テンプレート設計とマネージャーの精読コストを受け入れる。"
 zg361m.54.b:0 "可視性を最大化するため、全員に精巧な週間長文資料の提出を義務付ける。短期的には情報は潤沢になるが、ガバナンスの時間が報告競争に変わる。"
 zg361m.54.c:0 "今期は保留し、制度上の負債として記録する"
 zg361m.55.t:0 "#055 · 上司の注意力をめぐる席"
 zg361m.55.desc:0 "[I / P1] 本制度は共有組織台帳を通じて運用される。選択されたルールは進捗、根拠、信頼、業務量、リスク、人材、財務圧力を変化させ、後のチーム成果とマネージャー自身の評価に影響する。"
 zg361m.55.a:0 "リスク、マイルストーン、長期間可視性が低い案件に応じて深読み・面談枠を輪番制にし、席を得た後の成果を別途記録する。スケジューリングコストは受け入れる。"
 zg361m.55.b:0 "スポンサーや最も前に出る候補者が列に割り込むことを許し、強い声を迅速に拾う一方、火消し役を退け、席を得るが成果は伴わない者を称賛してしまう。"
 zg361m.55.c:0 "今期は保留し、制度上の負債として記録する"
 zg361m.56.t:0 "#056 · 階層報告における功績の横取り"
 zg361m.56.desc:0 "[I / P1] 本制度は共有組織台帳を通じて運用される。選択されたルールは進捗、根拠、信頼、業務量、リスク、人材、財務圧力を変化させ、後のチーム成果とマネージャー自身の評価に影響する。"
 zg361m.56.a:0 "上位への報告に原作者・バージョン・チームの貢献署名を添付し、人材育成の功績をマネージャーに加算する。帰属管理コストは受け入れる。"
 zg361m.56.b:0 "中間管理職が部下の成果を自らの調整成果として一元的に署名し、上層部での可視性を即座に高める一方、越級証拠・離反・人材流出を蓄積させる。"
 zg361m.56.c:0 "今期は保留し、制度上の負債として記録する"
 zg361m.57.t:0 "#057 · 貢献の証跡とバージョン署名"
 zg361m.57.desc:0 "[I / P1] 本制度は共有組織台帳を通じて運用される。選択されたルールは進捗、根拠、信頼、業務量、リスク、人材、財務圧力を変化させ、後のチーム成果とマネージャー自身の評価に影響する。"
 zg361m.57.a:0 "主要マイルストーンで主担当・協働・バージョン署名を凍結し、紛争・昇進・監査時にのみ参照する。継続的な軽微な注意力を投じて追跡可能性を得る。"
 zg361m.57.b:0 "バージョン履歴を残さず、事後に力と弁論で貢献を裁定する。日々の負荷は最小化するが、紛争は功績横取り派に有利になる。"
 zg361m.57.c:0 "今期は保留し、制度上の負債として記録する"
 zg361m.58.t:0 "#058 · 越級CCと情報政治"
 zg361m.58.desc:0 "[I / P1] 本制度は共有組織台帳を通じて運用される。選択されたルールは進捗、根拠、信頼、業務量、リスク、人材、財務圧力を変化させ、後のチーム成果とマネージャー自身の評価に影響する。"
 zg361m.58.a:0 "重大な成果またはリスクについてのみプロトコルに従い越級コピーを許可し、直属上司の対応を求め、監査の手がかりを残す。追加情報処理コストは受け入れる。"
 zg361m.58.b:0 "越級を禁止しすべての情報を直属マネージャー経由とする。指揮系統は即座に強化されるが、悪い知らせや見えにくい貢献が抑圧される恐れがある。"
 zg361m.58.c:0 "今期は保留し、制度上の負債として記録する"
 zg361m.59.t:0 "#059 · 悪い知らせの即報・遅延・隠蔽"
 zg361m.59.desc:0 "[I / P1] 本制度は共有組織台帳を通じて運用される。選択されたルールは進捗、根拠、信頼、業務量、リスク、人材、財務圧力を変化させ、後のチーム成果とマネージャー自身の評価に影響する。"
 zg361m.59.a:0 "リスクが早期に報告された時点で時刻・既知事実・支援要請を凍結し、透明な報告者を支援し、結果確定後にレビューする。消火予算を受け入れる。"
 zg361m.59.b:0 "チームに自力解決と考査後の報告を求め、指標と注意力を短期的に守るが、爆発した際には誠実性と監督責任の減点が積み重なる。"
 zg361m.59.c:0 "今期は保留し、制度上の負債として記録する"
 zg361m.60.t:0 "#060 · 資料漏洩とアイデア窃取"
 zg361m.60.desc:0 "[I / P2] 本制度は共有組織台帳を通じて運用される。選択されたルールは進捗、根拠、信頼、業務量、リスク、人材、財務圧力を変化させ、後のチーム成果とマネージャー自身の評価に影響する。"
 zg361m.60.a:0 "原案バージョン・接触記録・共同立件条件を保管し、独立した席が帰属を裁定する。証拠保全と仲裁コストは受け入れる。"
 zg361m.60.b:0 "資料を受け取ったチームが即座に再構成して報告し資源の獲得競争に打って出る。短期で先行できる可能性があるが、署名が浮上した際には重大な反転リスクを伴う。"
 zg361m.60.c:0 "今期は保留し、制度上の負債として記録する"
 zg361m.61.t:0 "#061 · 短資料／長文報告制度"
 zg361m.61.desc:0 "[I / P2] 本制度は共有組織台帳を通じて運用される。選択されたルールは進捗、根拠、信頼、業務量、リスク、人材、財務圧力を変化させ、後のチーム成果とマネージャー自身の評価に影響する。"
 zg361m.61.a:0 "一枚サマリを標準化し複雑な協働には附属資料をリンクし、長文は例外のみに限定する。テンプレートと資料索引の整備コストは受け入れる。"
 zg361m.61.b:0 "上司が全体像を一気に把握できるよう、完全な詳細報告を義務付ける。短期的に細部を得する一方で文章力を評価し、儀式的な業務負荷を増大させる。"
 zg361m.61.c:0 "今期は保留し、制度上の負債として記録する"
 zg361m.62.t:0 "#062 · 実線と点線の目標衝突"
 zg361m.62.desc:0 "[J / P1] 本制度は共有組織台帳を通じて運用される。選択されたルールは進捗、根拠、信頼、業務量、リスク、人材、財務圧力を変化させ、後のチーム成果とマネージャー自身の評価に影響する。"
 zg361m.62.a:0 "目標が衝突したときは、両上位者が優先順位・責任・根拠の帰属を合同で裁定する。遅延コストは受けるが、実行可能な単一方向性を与える。"
 zg361m.62.b:0 "部下には実線の上司に従い点線の納期を無視するよう命令する。指揮は即座に明確になるが、プロジェクト側からの低評価と部門横断の負債を残す。"
 zg361m.62.c:0 "今期は保留し、制度上の負債として記録する"
 zg361m.63.t:0 "#063 · 周期初めの比重契約"
 zg361m.63.desc:0 "[J / P1] 本制度は共有組織台帳を通じて運用される。選択されたルールは進捗、根拠、信頼、業務量、リスク、人材、財務圧力を変化させ、後のチーム成果とマネージャー自身の評価に影響する。"
 zg361m.63.a:0 "サイクル開始時に、両上位者が評価ウェイト、納品範囲、危機変更条件に双方署名し、交渉と版数維持コストを引き受ける。"
 zg361m.63.b:0 "年末により強い上位者がウェイトを書き直し、重要結果を保護することを認める。迅速に争いを解決する一方、二重約束を奨励し、管理品質を損なう。"
 zg361m.63.c:0 "今期は保留し、明確な制度負債として記録する"
 zg361m.64.t:0 "#064 · マネージャー交代の双方署名引き継ぎ"
 zg361m.64.desc:0 "[J / P1] この方針は共有組織台帳を通じて運用される。選択されたルールは納品、証拠、信頼、業務負荷、リスク、人材、財務負担を変化させるため、後続するチーム成果とマネージャー本人の評価に影響する。"
 zg361m.64.a:0 "旧上司は完了業務と指導記録を凍結し、新上司が残余目標に双方署名し優先度を一度だけ再設定することを認め、引き継ぎ会議のコストを引き受ける。"
 zg361m.64.b:0 "新上司が旧コミットを無効化し即座に再計算する。裁量を迅速に得る一方、証拠の連続性を断ち、成功率の高い不服申し立てを招く。"
 zg361m.64.c:0 "今期は保留し、明確な制度負債として記録する"
 zg361m.65.t:0 "#065 · 外部招聘マネージャーと側近パッケージ"
 zg361m.65.desc:0 "[J / P2] この方針は共有組織台帳を通じて運用される。選択されたルールは納品、証拠、信頼、業務負荷、リスク、人材、財務負担を変化させるため、後続するチーム成果とマネージャー本人の評価に影響する。"
 zg361m.65.a:0 "外部招聘マネージャーに職務を明確化した少人数の側近帯同を認め、機会・定着・知識継承を監査しつつ、二重軌道の移行コストを引き受ける。"
 zg361m.65.b:0 "既存チームを側近で広く入れ替え、迅速に実行を統一する一方、空席・縁故監査・組織記憶の喪失を招く。"
 zg361m.65.c:0 "今期は保留し、明確な制度負債として記録する"
 zg361m.66.t:0 "#066 · プロジェクト中止と個人失敗の分離"
 zg361m.66.desc:0 "[J / P1] この方針は共有組織台帳を通じて運用される。選択されたルールは納品、証拠、信頼、業務負荷、リスク、人材、財務負担を変化させるため、後続するチーム成果とマネージャー本人の評価に影響する。"
 zg361m.66.a:0 "検証済みマイルストーン、損切判断、中止理由を凍結し、戦略と個人貢献を分けて評価する。専門レビューのコストを引き受ける。"
 zg361m.66.b:0 "中止時に成果を全てゼロにし、プロジェクトチームを罰する。早期決算の一方、全員を短期プロジェクトへ走らせ、不正戦略を隠蔽する。"
 zg361m.66.c:0 "今期は保留し、明確な制度負債として記録する"
 zg361m.67.t:0 "#067 · 合併後の「一職二人」"
 zg361m.67.desc:0 "[J / P2] この方針は共有組織台帳を通じて運用される。選択されたルールは納品、証拠、信頼、業務負荷、リスク、人材、財務負担を変化させるため、後続するチーム成果とマネージャー本人の評価に影響する。"
 zg361m.67.a:0 "重複する責任者は、公開競争・二人体制の移行・合法的配置転換で処理し、比較根拠を記録しつつ短期の二重役職コストを負担する。"
 zg361m.67.b:0 "お気に入りの候補を内定し、もう一方のリーダーを即座に解任する。重複を迅速に解消する一方、派閥・不服申し立て・重要経験の流出を悪化させる。"
 zg361m.67.c:0 "今期は保留し、明確な制度負債として記録する"
 zg361m.68.t:0 "#068 · 携帯可能な経歴と現地での再証明"
 zg361m.68.desc:0 "[J / P1] この方針は共有組織台帳を通じて運用される。選択されたルールは納品、証拠、信頼、業務負荷、リスク、人材、財務負担を変化させるため、後続するチーム成果とマネージャー本人の評価に影響する。"
 zg361m.68.a:0 "凍結された評価、成果の文脈、論争、未解決 PIP を新職に持ち越し、保護期間と明確な再証明目標を一度だけ設定する。"
 zg361m.68.b:0 "異動者は即座に新グループの配分に完全参加し、新上司が旧履歴を選択的に参照する。競争に迅速に統合する一方、処罰の重複や枠占有のリスクがある。"
 zg361m.68.c:0 "今期は保留し、明確な制度負債として記録する"
 zg361m.69.t:0 "#069 · 正式な送達と不服申立の時計"
 zg361m.69.desc:0 "[K / P0] この方針は共有組織台帳を通じて運用される。選択されたルールは納品、証拠、信頼、業務負荷、リスク、人材、財務負担を変化させるため、後続するチーム成果とマネージャー本人の評価に影響する。"
 zg361m.69.a:0 "凍結記録を対面で送達し、署名を伴う異議を認め、拒否には証人を用いる。項目ごとに不服申立と決済の時計を開始する。"
 zg361m.69.b:0 "公開と同時に全結果が通知されたと見なし、直ちに決済する。最速で実行へ移行できるが、理由を確認していない人は異議申し立ての機会を逃し、プロセスが覆る恐れがある。"
 zg361m.69.c:0 "今期は保留し、明確な制度負債として記録する"
 zg361m.70.t:0 "#070 · 不服申立後の報復防止観察期間"
 zg361m.70.desc:0 "[K / P1] この方針は共有組織台帳を通じて運用される。選択されたルールは納品、証拠、信頼、業務負荷、リスク、人材、財務負担を変化させるため、後続するチーム成果とマネージャー本人の評価に影響する。"
 zg361m.70.a:0 "一年間、異動・解任・減給・新規の否定的評価には新事実を要求し、独立枠が抽出調査する。継続的な監督工数を負担する。"
 zg361m.70.b:0 "不服申立後にマネージャーが即座に役割と権限を再配置し統制を回復することを認める。迅速に行動する一方、覆された理由は報復とみなされる。"
 zg361m.70.c:0 "今期は保留し、明確な制度負債として記録する"
 zg361m.71.t:0 "#071 · 社内フォーラムの長文投稿と公開エスカレーション"
 zg361m.71.desc:0 "[K / P2] この方針は共有組織台帳を通じて運用される。選択されたルールは納品、証拠、信頼、業務負荷、リスク、人材、財務負担を変化させるため、後続するチーム成果とマネージャー本人の評価に影響する。"
 zg361m.71.a:0 "私的対話と正式な不服申立を尽くした後、凍結証拠を伴う実名の長文投稿を管理された再審査に許可し、調停と事実確認に資金を投入する。"
 zg361m.71.b:0 "当人が実名または匿名の暴露記事を即座に公開し支持を集めることを認める。上位の関心を迅速に集める一方、両者の評判と内部の信頼を損なう。"
 zg361m.71.c:0 "今期は保留し、明確な制度負債として記録する"
 zg361m.72.t:0 "#072 · 評価の早期リーク"
 zg361m.72.desc:0 "[K / P1] この方針は共有組織台帳を通じて運用される。選択されたルールは納品、証拠、信頼、業務負荷、リスク、人材、財務負担を変化させるため、後続するチーム成果とマネージャー本人の評価に影響する。"
 zg361m.72.a:0 "キャリブ資料へのアクセスを制限し、閲覧を記録し、共通の送達時刻を設けて全員が対等に不服申立を準備できるようにする。機密管理コストを負担する。"
 zg361m.72.b:0 "側近に私的に警告するか、反応を探るためチームに評価を流す。前もって場を制御する一方、早期離職・口裏合わせ・キャリブ席の不信を招く。"
 zg361m.72.c:0 "今期は保留し、明確な制度負債として記録する"
 zg361m.73.t:0 "#073 · 悪意あるリークと善意の内部通報の振り分け"
 zg361m.73.desc:0 "[K / P1] この方針は共有組織台帳を通じて運用される。選択されたルールは納品、証拠、信頼、業務負荷、リスク、人材、財務負担を変化させるため、後続するチーム成果とマネージャー本人の評価に影響する。"
 zg361m.73.a:0 "独立枠が資料の真偽、公共目的、報復要素を検証し、真の通報を保護して改竄を罰する。調査コストを負担する。"
 zg361m.73.b:0 "全ての未許可リークを不正行為と見なし即座に罰する。迅速に機密を回復する一方、不正の物的証拠を抑え込む。"
 zg361m.73.c:0 "今期は保留し、明確な制度負債として記録する"
 zg361m.74.t:0 "#074 · 正直な人員整理と「実績水増し解雇」"
 zg361m.74.desc:0 "[K / P1] この方針は共有組織台帳を通じて運用される。選択されたルールは納品、証拠、信頼、業務負荷、リスク、人材、財務負担を変化させるため、後続するチーム成果とマネージャー本人の評価に影響する。"
 zg361m.74.a:0 "組織理由で職を公的に撤廃し、国庫から退出費を支払い、中立的な記録を保持する。金銭を費やし業績履歴を清浄に保つ。"
 zg361m.74.b:0 "まず 3.25 を押し付け、業績不良として低コストで人員を削減する。迅速に縮小する一方、覆された場合は処分が取り消され、二段の管理職を深刻に傷つける。"
 zg361m.74.c:0 "今期は保留し、明確な制度負債として記録する"
 zg361m.75.t:0 "#075 · 経歴保全付きの自発的退職パッケージ"
 zg361m.75.desc:0 "[K / P2] この方針は共有組織台帳を通じて運用される。選択されたルールは納品、証拠、信頼、業務負荷、リスク、人材、財務負担を変化させるため、後続するチーム成果とマネージャー本人の評価に影響する。"
 zg361m.75.a:0 "境界線の最低評価者に現実的な退職金、中立的な経歴、明確な HC 解放を提示する。国庫支出を負担し、真の拒否権を保障する。"
 zg361m.75.b:0 "期限内に無補償の自発的退職を要求し、応じなければ即座に PIP を開始する。迅速にコスト削減する一方、強制解雇と再分類されるリスクがある。"
 zg361m.75.c:0 "今期は保留し、明確な制度負債として記録する"
 zg361m.76.t:0 "#076 · プロセス失敗に対する多段階の責任"
 zg361m.76.desc:0 "[K / P1] この方針は共有組織台帳を通じて運用される。選択されたルールは、成果・証拠・信頼・業務量・リスク・人材・財政圧力を変化させ、その後のチーム成果と管理者自身の評価に影響する。"
 zg361m.76.a:0 "評価の覆り後、証拠の欠如、監視不行き届き、制度設計の誤り、虚偽の申告について責任を各担当者の次回マネジメント評価に配分し、共同レビューを受け入れる。"
 zg361m.76.b:0 "直属マネージャーまたは政委にプロセス失敗の全責任を負わせて迅速に決着させ、処罰を明確化する一方でシステム欠陥を隠し、責任転嫁を助長する。"
 zg361m.76.c:0 "今四半期は保留し、制度上の負債として記録する"
 zg361m.77.t:0 "#077 · 独立審査員の輪番制"
 zg361m.77.desc:0 "[K / P1] この方針は共有組織台帳を通じて運用される。選択されたルールは、成果・証拠・信頼・業務量・リスク・人材・財政圧力を変化させ、その後のチーム成果と管理者自身の評価に影響する。"
 zg361m.77.a:0 "直接関係のない同格マネージャーから審査員を輪番で選出し、両当事者に一度ずつ理由のある忌避権を付与し、審査品質を記録する(人員コスト負担を受容)。"
 zg361m.77.b:0 "新規証拠を限定しつつ、元の担当者に迅速に自己修正させ、管理工数を節約する。同じ人物が自身の判断を擁護するため、信頼性は下がる。"
 zg361m.77.c:0 "今四半期は保留し、制度上の負債として記録する"
 zg361m.78.t:0 "#078 · 分布公平性ダッシュボード"
 zg361m.78.desc:0 "[K / P2] この方針は共有組織台帳を通じて運用される。選択されたルールは、成果・証拠・信頼・業務量・リスク・人材・財政圧力を変化させ、その後のチーム成果と管理者自身の評価に影響する。"
 zg361m.78.a:0 "新入社員・異動者・血縁/非血縁・派閥・役職・勤続年数別の多年差異を表示し、機会データと連動させ、異常は人間の説明のみに回す。"
 zg361m.78.b:0 "あるサブグループの比率に異常が見られるたびに評価変更を強制したりマネージャーを処罰したりし、最速で是正する一方、小サンプルや実際の業務差を偏見と誤認する。"
 zg361m.78.c:0 "今四半期は保留し、制度上の負債として記録する"
 zg361m.79.t:0 "#079 · 飛び階層オープンアワー"
 zg361m.79.desc:0 "[K / P2] この方針は共有組織台帳を通じて運用される。選択されたルールは、成果・証拠・信頼・業務量・リスク・人材・財政圧力を変化させ、その後のチーム成果と管理者自身の評価に影響する。"
 zg361m.79.a:0 "各サイクルごとに少数の予約席を設け、障害・成果・不服申立ての糸口のみを聴取し調査タスクを生成する。上位の時間を費やすが、その場で評価は変更しない。"
 zg361m.79.b:0 "高位統治者が面談中に孫階層の役人のリソースを約束したり評価を直接変更したりできるようにし、素早く民意に応える一方、直属マネージャーを形骸化し越階層の政治を煽る。"
 zg361m.79.c:0 "今四半期は保留し、制度上の負債として記録する"
 zg361m.80.t:0 "#080 · 公開指標欠陥チケット"
 zg361m.80.desc:0 "[K / P1] この方針は共有組織台帳を通じて運用される。選択されたルールは、成果・証拠・信頼・業務量・リスク・人材・財政圧力を変化させ、その後のチーム成果と管理者自身の評価に影響する。"
 zg361m.80.a:0 "不正操作可能・矛盾・歪曲された指標の欠陥を公開登録し、所有者に書面での修正またはリスク受容を義務付け、報告者の制度的貢献を保全する。"
 zg361m.80.b:0 "欠陥チケットを即時クローズし評価まで現状指標を維持するよう所有者に命じることで短期の比較可能性を保つ一方、後日の失敗責任が設計者に拡散する。"
 zg361m.80.c:0 "今四半期は保留し、制度上の負債として記録する"
 zg361m.81.t:0 "#081 · 業績情報の階層圧縮"
