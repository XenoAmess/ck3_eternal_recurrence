 zg361m.81.b:0 "各階層にランキング要約1枚のみを提出させ意思決定を高速化するが、情報経路を最短化する一方、成果横取り・歪曲・是正不能なブラックボックスを拡大する。"
 zg361m.81.c:0 "今四半期は保留し、制度上の負債として記録する"
 zg361m.82.t:0 "#082 · 総合報酬フォーミュラ"
