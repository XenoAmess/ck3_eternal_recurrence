 zg361m.82.a:0 "基本俸禄・職務手当・業績賞与・特別賞与・繰延賞与を分割し、各項目を負担可能上限のもとに国庫から支給する。"
 zg361m.82.b:0 "報酬を当期の業績連動賞与へ大幅に振り向け361を強化し、短期刺激を強める一方、不安・功績横取り・財政変動を拡大する。"
 zg361m.82.c:0 "今四半期は保留し、制度上の負債として記録する"
 zg361m.83.t:0 "#083 · 会社・チーム・個人の三層賞与係数"
 zg361m.83.desc:0 "[L / P1] この方針は共有組織台帳を通じて運用される。選択されたルールは、成果・証拠・信頼・業務量・リスク・人材・財政圧力を変化させ、その後のチーム成果と管理者自身の評価に影響する。"
 zg361m.83.a:0 "周期開始時に天朝・チーム・個人の三階層係数を凍結し、チームの共有と個人の報酬を保ち、複雑な決済工数を引き受ける。"
 zg361m.83.b:0 "賞与配分を個人の評価へ突然振り向け、トップ層報酬を速やかに拡大する一方、不振チーム内の功績横取りと競争を暴走させる。"
 zg361m.83.c:0 "今四半期は保留し、制度上の負債として記録する"
 zg361m.84.t:0 "#084 · 繰延賞与と段階的帰属"
 zg361m.84.desc:0 "[L / P2] この方針は共有組織台帳を通じて運用される。選択されたルールは、成果・証拠・信頼・業務量・リスク・人材・財政圧力を変化させ、その後のチーム成果と管理者自身の評価に影響する。"
 zg361m.84.a:0 "長期報酬向けに三年確定の権利付与台帳を作成し、国庫資金を確保し、退出と取り消しの条件を明示し、毎年支払うことで将来の財政負担を受け入れる。"
 zg361m.84.b:0 "今期に賞与を全額支給して強い定着シグナルを送れば、決算は簡素化されるが、不正や案件の反動時に回収が困難となり、現在の財政を圧迫する。"
 zg361m.84.c:0 "今四半期は保留し、制度上の負債として記録する"
 zg361m.85.t:0 "#085 · 継続インセンティブの崖"
 zg361m.85.desc:0 "[L / P2] この方針は共有組織台帳を通じて運用される。選択されたルールは、成果・証拠・信頼・業務量・リスク・人材・財政圧力を変化させ、その後のチーム成果と管理者自身の評価に影響する。"
 zg361m.85.a:0 "旧賞与の帰属終点を早期に追跡し、重要度と後継リスクに応じて継続パッケージを留保し、同格者比較を公開する(長期予算負担を受容)。"
 zg361m.85.b:0 "離任直前まで待って緊急対抗オファーまたは口頭での継続を示唆する。短期コストは削減されるが、崖状離職・約束負債・給与不公正を生む。"
 zg361m.85.c:0 "今四半期は保留し、制度上の負債として記録する"
 zg361m.86.t:0 "#086 · 賞与保留と回収(クローバック)"
 zg361m.86.desc:0 "[L / P1] この方針は共有組織台帳を通じて運用される。選択されたルールは、成果・証拠・信頼・業務量・リスク・人材・財政圧力を変化させ、その後のチーム成果と管理者自身の評価に影響する。"
 zg361m.86.a:0 "高リスク案件に対し、保留比率・監査日・不正回収条件を事前に明記し、支払ごとに精算記録を保全する。"
 zg361m.86.b:0 "疑義が生じた時点で全額を即時保留または既に支払われた賞与を回収し、国庫を速やかに守る一方、事後的ルール変更による不服申立てと離職を招く。"
 zg361m.86.c:0 "今四半期は保留し、制度上の負債として記録する"
 zg361m.87.t:0 "#087 · 給与バンドとバンド内ポジション"
 zg361m.87.desc:0 "[L / P1] この方針は共有組織台帳を通じて運用される。選択されたルールは、成果・証拠・信頼・業務量・リスク・人材・財政圧力を変化させ、その後のチーム成果と管理者自身の評価に影響する。"
 zg361m.87.a:0 "勤続・希少性・過去実績・バンド内ポジションを監査し、証拠ある低位配置と逆格差を優先的に是正する(給与予算負担を受容)。"
 zg361m.87.b:0 "基本給を厳格に頭打ちし、バンド上限のスターにはスポット賞与のみを与え、バンドを速やかに守る一方、トップパフォーマーと逆格差のある古参の離職を増やす。"
 zg361m.87.c:0 "今四半期は保留し、制度上の負債として記録する"
 zg361m.88.t:0 "#088 · 市場調薪と業績調薪の予算争奪"
 zg361m.88.desc:0 "[L / P1] この方針は共有組織台帳を通じて運用される。選択されたルールは、成果・証拠・信頼・業務量・リスク・人材・財政圧力を変化させ、その後のチーム成果と管理者自身の評価に影響する。"
 zg361m.88.a:0 "昇給プールを市場の希少性・3.75 報酬・内部公正の三つの台帳に分け、証拠順に並べて予算のトレードオフを公開する。"
 zg361m.88.b:0 "今回の昇給プール全額を 3.75 達成者に投じてシグナルを強化し、希少職や逆転した人材が引き抜かれる危険は残るが、断固として即断する。"
 zg361m.88.c:0 "先送りし、明確な制度債務として記録する"
 zg361m.89.t:0 "#089 · 職位・任命・権威・現金の分離"
 zg361m.89.desc:0 "[L / P1] 本方針は共有の組織台帳を通じて実施される。選択されたルールは成果・証拠・信頼・業務量・リスク・人材・財務圧力を変えるため、後続のチーム成果およびマネージャー本人の評価にも影響する。"
 zg361m.89.a:0 "昇給・専門職級・代理権・正式欠員について、権限・現金・交付期日を別々に定義し、複数軌道の役職管理コストを受け入れる。"
 zg361m.89.b:0 "コストを最小限に抑えるため、スター人材に対し、給与も権力もないレベルまたは無期限の代理称号を授与し、空洞化した昇進と離職リスクを蓄積する。"
 zg361m.89.c:0 "先送りし、明確な制度債務として記録する"
 zg361m.90.t:0 "#090 · スポットアワード"
 zg361m.90.desc:0 "[L / P1] 本方針は共有の組織台帳を通じて実施される。選択されたルールは成果・証拠・信頼・業務量・リスク・人材・財務圧力を変えるため、後続のチーム成果およびマネージャー本人の評価にも影響する。"
 zg361m.90.a:0 "救急救命・部門横断支援・制度構築のために独立した少額プールを設け、固有の貢献 ID に基づいて支給しつつ、最終ランクは変えない。"
 zg361m.90.b:0 "マネージャーが最も目立った救急救命者をチーム賞与プールから即時表彰し、迅速なシグナルを送るが、361 を迂回し他者の賞与を奪う恐れがある。"
 zg361m.90.c:0 "先送りし、明確な制度債務として記録する"
 zg361m.91.t:0 "#091 · 勤続賞と業績賞の分離"
 zg361m.91.desc:0 "[L / P2] 本方針は共有の組織台帳を通じて実施される。選択されたルールは成果・証拠・信頼・業務量・リスク・人材・財務圧力を変えるため、後続のチーム成果およびマネージャー本人の評価にも影響する。"
 zg361m.91.a:0 "長期勤続・困難地赴任・当期業績を別々の台帳とプールで管理し、それぞれを明示的に支給することで、大きくなるが説明可能な国庫負担を受け入れる。"
 zg361m.91.b:0 "強い分布を保つため当期の評価のみで支給し、決算を最も簡素化するが、ベテランの留任価値を一回の低評価で消し去る。"
 zg361m.91.c:0 "先送りし、明確な制度債務として記録する"
 zg361m.92.t:0 "#092 · 専門職と管理職のデュアルキャリアトラック"
 zg361m.92.desc:0 "[M / P1] 本方針は共有の組織台帳を通じて実施される。選択されたルールは成果・証拠・信頼・業務量・リスク・人材・財務圧力を変えるため、後続のチーム成果およびマネージャー本人の評価にも影響する。"
 zg361m.92.a:0 "報酬は同等で、権限・リスク・評価基準が異なる専門職・管理職トラックを構築し、両者の往来のための試任と研修予算を確保する。"
 zg361m.92.b:0 "最も優秀な個人貢献者を即座に管理職に昇進させて欠員を埋め、リーダーを今すぐ確保する一方、専門職の成果とマネジメントの質の両方を失うリスクがある。"
 zg361m.92.c:0 "先送りし、明確な制度債務として記録する"
 zg361m.93.t:0 "#093 · 失敗したマネージャーの専門職トラック復帰"
 zg361m.93.desc:0 "[M / P1] 本方針は共有の組織台帳を通じて実施される。選択されたルールは成果・証拠・信頼・業務量・リスク・人材・財務圧力を変えるため、後続のチーム成果およびマネージャー本人の評価にも影響する。"
 zg361m.93.a:0 "管理権限を外しつつ実績のある専門職級と公正な待遇を維持し、コーチングを受けたのちの復帰経路を認めることで、配置転換と育成コストを受け入れる。"
 zg361m.93.b:0 "直ちに完全な降格・減給とするか、本人に管理職を続けさせるかのいずれかとし、果断に動く一方、優秀な専門家を失うか、チームの離職をさらに深刻化させるリスクがある。"
 zg361m.93.c:0 "先送りし、明確な制度債務として記録する"
 zg361m.94.t:0 "#094 · 微小職級と「半段階」昇進"
 zg361m.94.desc:0 "[M / P2] 本方針は共有の組織台帳を通じて実施される。選択されたルールは成果・証拠・信頼・業務量・リスク・人材・財務圧力を変えるため、後続のチーム成果およびマネージャー本人の評価にも影響する。"
 zg361m.94.a:0 "職務・給与バンド・勤続要件を伴った少数の微小職級のみを設け、インフレを定期的に監査することで、より複雑な職務アーキテクチャを受け入れる。"
 zg361m.94.b:0 "頻繁に半階級の称号を授与し、給与と権限の決定を先送りすれば、昇進不安はすぐ和らいでも、称号インフレと公約の負債を生む。"
 zg361m.94.c:0 "今四半期は保留し、制度上の負債として記録する"
 zg361m.95.t:0 "#095 · 経営幹部任命の年次レビュー"
 zg361m.95.desc:0 "[M / P1] この方針は共有組織台帳を通じて運用される。選択されたルールは成果、根拠、信頼、業務量、リスク、人材、財務圧力を変え、その後のチーム成果と管理者自身の評価にも影響する。"
 zg361m.95.a:0 "361の権限を、京察コンプライアンス、チームの成果、覆された評価、離職、後継者計画に基づき毎年見直します。必要に応じてコーチングや予算の引き締めを行い、不正に称号を剥奪しません。"
 zg361m.95.b:0 "一つでも不調な期があれば即座に審議席、人材権限、予算を剥奪し、幹部を迅速に問責する一方、短期の変動を組織全体の衝撃に変えてしまう。"
 zg361m.95.c:0 "今四半期は保留し、制度上の負債として記録する"
 zg361m.96.t:0 "#096 · 特別昇格パッケージ"
 zg361m.96.desc:0 "[M / P2] この方針は共有組織台帳を通じて運用される。選択されたルールは成果、根拠、信頼、業務量、リスク、人材、財務圧力を変え、その後のチーム成果と管理者自身の評価にも影響する。"
 zg361m.96.a:0 "継続的な超過実績または決定的な功績に対してのみわずかな例外枠を使い、年数を超えた理由と後回しになった候補者を明示し、翌年に再審査する。"
 zg361m.96.b:0 "後援者が一個の華々しい功績で即座に飛び級昇進を認めて英雄を素早く引き留める一方、通常の枠を食い潰し、翌年のリスクは審査委員へ転嫁される。"
 zg361m.96.c:0 "今四半期は保留し、制度上の負債として記録する"
 zg361m.97.t:0 "#097 · 横断チーム昇格キャリブレーション"
 zg361m.97.desc:0 "[M / P1] この方針は共有組織台帳を通じて運用される。選択されたルールは成果、根拠、信頼、業務量、リスク、人材、財務圧力を変え、その後のチーム成果と管理者自身の評価にも影響する。"
 zg361m.97.a:0 "各チームに同形式の昇格パッケージを提出させ、越境的な評価委員が現在の職級を超えた影響を比較し、失敗した推薦の質も記録する。"
 zg361m.97.b:0 "マネージャーの発言力と各チーム内のナンバーワンによって昇格枠を迅速に配分し、会議を閉じられる一方、現地序列が組織横断的な影響力に勝つことを許してしまう。"
 zg361m.97.c:0 "先送りし、明確な制度債務として記録する"
 zg361m.98.t:0 "#098 · 増員、欠員補充、プロジェクト HC"
 zg361m.98.desc:0 "[N / P1] この方針は共通の組織台帳を通じて運用される。選択されたルールは納期、根拠、信頼、業務量、リスク、人材、財務負担を変化させるため、後続するチームの結果やマネージャー自身の評価に影響する。"
 zg361m.98.a:0 "拡大・欠員補充・案件HCを用途・期間・検収で分けて登録し、転換には再説明を求め、三つの定員管理を運用する。"
 zg361m.98.b:0 "三つを統合して即時利用可能な柔軟枠とし、ホットスポットを迅速に補強する一方、臨時プロジェクトが隠れた恒常増員となることを許容する。"
 zg361m.98.c:0 "先送りし、明確な制度債務として記録する"
 zg361m.99.t:0 "#099 · HC の期限切れ、繰越、年末採用"
 zg361m.99.desc:0 "[N / P1] この方針は共通の組織台帳を通じて運用される。選択されたルールは納期、根拠、信頼、業務量、リスク、人材、財務負担を変化させるため、後続するチームの結果やマネージャー自身の評価に影響する。"
 zg361m.99.a:0 "採用パイプラインで返却か一回限りの有証拠繰越かを判断し、自主返却を次回予算の信用に計上し、計画された能力ギャップを受け入れる。"
 zg361m.99.b:0 "年末に慌てて採用して枠と分母を守り、当面の回復を防ぐが、ミスマッチ・試用失敗・メンター負担が増える。"
 zg361m.99.c:0 "保留し、明示的に制度債務として記録する"
 zg361m.100.t:0 "#100 · 採用凍結と重要ポストの例外"
 zg361m.100.desc:0 "[N / P1] この方針は共有組織台帳を通じて運用される。選択されたルールが成果・証拠・信頼・業務量・リスク・人材・財政圧迫を変え、後のチーム成果とマネージャー自身の評価に影響する。"
 zg361m.100.a:0 "増員 HC を凍結しつつ、職務リスク・約束済みプロジェクト・安全下限からの書面例外を認め、低コスト代替案を監査する。"
 zg361m.100.b:0 "領主指定の重要役職を除き採用をすべて停止し、財務を即時に安定させる一方、利権追求を招き、目立たない必須業務を枯渇させる。"
 zg361m.100.c:0 "保留し、明示的に制度債務として記録する"
 zg361m.101.t:0 "#101 · シニア1人、通常2人、それとも徒弟パイプライン"
 zg361m.101.desc:0 "[N / P1] この方針は共有の組織台帳を通じて運用される。選択されたルールは、納期・根拠・信頼・業務量・リスク・人材・財政圧力を変化させ、後のチーム成果とマネージャー自身の評価にも影響する。"
 zg361m.101.a:0 "納期、キー人材リスク、後継ニーズに応じてシニア・通常・徒弟を組み合わせ、徒弟パイプラインにメンター枠を確保する。"
 zg361m.101.b:0 "予算全額をすぐ成果を出せるシニア1人に投下し、最速で進むが交渉力が上がり、後継者不在の単一障害点を残す。"
 zg361m.101.c:0 "今四半期は保留し、制度上の負債として記録する"
 zg361m.102.t:0 "#102 · ゼロベース人員レビュー"
 zg361m.102.desc:0 "[N / P2] この方針は共有の組織台帳を通じて運用される。選択されたルールは、納期・根拠・信頼・業務量・リスク・人材・財政圧力を変化させ、後のチーム成果とマネージャー自身の評価にも影響する。"
 zg361m.102.a:0 "数年ごとに、低効率・長期空席・戦略転換ポストのみを証拠に基づきゼロベースで再審査し、移動分の移行予算を確保する。"
 zg361m.102.b:0 "毎年、全チームにゼロから全HCを取り返させ、再配分は最速化するが、報告ラッシュと不安と短期志向を生み出す。"
 zg361m.102.c:0 "今四半期は保留し、制度上の負債として記録する"
 zg361m.103.t:0 "#103 · 空席占有の監査"
 zg361m.103.desc:0 "[N / P1] この方針は共有の組織台帳を通じて運用される。選択されたルールは、納期・根拠・信頼・業務量・リスク・人材・財政圧力を変化させ、後のチーム成果とマネージャー自身の評価にも影響する。"
 zg361m.103.a:0 "長期空席には実候補パイプラインの提示・返却・期限付き貸与のいずれかを取らせ、毎月見直すことで将来の選択肢減少を受け入れる。"
 zg361m.103.b:0 "幻影候補と繰り返される延期で枠を確保し、今は回収を免れるがチームを過負荷にし、発覚時にHC信用を失う。"
 zg361m.103.c:0 "今四半期は保留し、制度上の負債として記録する"
 zg361m.104.t:0 "#104 · 新人プールと経験者プール"
 zg361m.104.desc:0 "[N / P2] この方針は共有の組織台帳を通じて運用される。選択されたルールは、納期・根拠・信頼・業務量・リスク・人材・財政圧力を変化させ、後のチーム成果とマネージャー自身の評価にも影響する。"
 zg361m.104.a:0 "長期的な人材育成パイプライン、即時成果、内部異動のバランスを取るために、新入社員、経験豊富な採用者、異動者を組み合わせ、メンターの予算、給与、そして補充採用は別枠で確保する。"
 zg361m.104.b:0 "即戦力となる経験者のみを採用し、短期成果を最大化するが、給与逆転・文化衝突・パイプライン欠落を招く。"
 zg361m.104.c:0 "今四半期は保留し、制度上の負債として記録する"
 zg361m.105.t:0 "#105 · 離任後の補充採用の責任所在"
 zg361m.105.desc:0 "[N / P1] この方針は共有の組織台帳を通じて運用される。選択されたルールは、納期・根拠・信頼・業務量・リスク・人材・財政圧力を変化させ、後のチーム成果とマネージャー自身の評価にも影響する。"
 zg361m.105.a:0 "補充採用の枠を現場に戻すか、中央枠に戻すか、異動先に移すかを事前に定め、解放ルールと将来の優先度を連動させ、ポリシー運用の負担を受け入れる。"
 zg361m.105.b:0 "補充採用枠を守るため、人事考課の終了まで従業員を留置し、短期的に枠を確保する一方、流動化を遅らせ離任のタイミングを歪める。"
 zg361m.105.c:0 "今四半期は保留し、制度上の負債として記録する"
 zg361m.106.t:0 "#106 · 重要ポストと重要人材の分離"
 zg361m.106.desc:0 "[O / P1] この方針は共有の組織台帳を通じて運用される。選択されたルールは、納期・根拠・信頼・業務量・リスク・人材・財政圧力を変化させ、後のチーム成果とマネージャー自身の評価にも影響する。"
 zg361m.106.a:0 "まず空席時の影響を評価し、現任の代替可能性を別個に評価した上で、ポストには後継、人材には定着と別個の予算を付ける。"
 zg361m.106.b:0 "上司お気に入りのスターを不可替と直接ラベル付けし、資源を集中させて関係を即安定させるが、真のポストリスクと後継者空白を覆い隠す。"
 zg361m.106.c:0 "今四半期は保留し、制度上の負債として記録する"
 zg361m.107.t:0 "#107 · 後継者準備度ラダー"
 zg361m.107.desc:0 "[O / P1] この方針は共有の組織台帳を通じて運用される。選択されたルールは、納期・根拠・信頼・業務量・リスク・人材・財政圧力を変化させ、後のチーム成果とマネージャー自身の評価にも影響する。"
 zg361m.107.a:0 "重要ポストに「即時可」「2年後可」「長期育成」「候補不在」の4階層を維持し、メンター・代理任務・露出機会に投入する。"
 zg361m.107.b:0 "一人の皇太子を即時可と指名して空白を一掃するが、推薦関係や可能性ラベルを実際の準備度と混同する危険がある。"
 zg361m.107.c:0 "今四半期は保留し、制度上の負債として記録する"
 zg361m.108.t:0 "#108 · 代理就任の試練"
 zg361m.108.desc:0 "[O / P1] この方針は共有の組織台帳を通じて運用される。選択されたルールは、納期・根拠・信頼・業務量・リスク・人材・財政圧力を変化させ、後のチーム成果とマネージャー自身の評価にも影響する。"
 zg361m.108.a:0 "候補に明確な任期・実権限・資源・成功基準を与え、終了後に試練記録を凍結し、現任監督と試行コストを受け入れる。"
 zg361m.108.b:0 "代理候補に成果責任だけ与え、あらゆる拒否権は保持することで最小リスクで素早く試すが、失敗が能力を示さず申立て材料になる。"
 zg361m.108.c:0 "今四半期は保留し、制度上の負債として記録する"
 zg361m.109.t:0 "#109 · ハイポテンシャルラベルの公開範囲"
 zg361m.109.desc:0 "[O / P2] この方針は共有の組織台帳を通じて運用される。選択されたルールは、納期・根拠・信頼・業務量・リスク・人材・財政圧力を変化させ、後のチーム成果とマネージャー自身の評価にも影響する。"
 zg361m.109.a:0 "本人と必要上長にのみ告知し、基準・再審査日・育成投資を公開し、リスト維持と非選抜者への説明責任を負う。"
 zg361m.109.b:0 "ハイポテンシャルリストを全チームに公開して努力と競争を即強化するが、皇太子政治・非選抜者の離脱・えこひいきを生む。"
 zg361m.109.c:0 "今四半期は保留し、制度上の負債として記録する"
 zg361m.110.t:0 "#110 · ポテンシャル校正とパフォーマンス校正の分離"
 zg361m.110.desc:0 "[O / P1] この方針は共有の組織台帳を通じて運用される。選択されたルールは、納期・根拠・信頼・業務量・リスク・人材・財政圧力を変化させ、後のチーム成果とマネージャー自身の評価にも影響する。"
 zg361m.110.a:0 "当期の 361 をまず確定し、その後学習速度・幅・将来責任を別途審査し、報酬用と育成用の2枚の凍結表を維持する。"
 zg361m.110.b:0 "同じ会議内で「ポテンシャル高」の一言で格上げや安定スターの排除を行い、資源を素早く集中させるが、報酬と将来投資を混同する。"
 zg361m.110.c:0 "今四半期は保留し、制度上の負債として記録する"
 zg361m.111.t:0 "#111 · 遺憾な離職と健全な離職"
 zg361m.111.desc:0 "[O / P1] この方針は共有の組織台帳を通じて運用される。選択されたルールは、納期・根拠・信頼・業務量・リスク・人材・財政圧力を変化させ、後のチーム成果とマネージャー自身の評価にも影響する。"
 zg361m.111.a:0 "業績・重要性・不適合・手続き上の争点により離任を分類し、後日の成果が出れば元の人材判断に書き戻す。"
 zg361m.111.b:0 "マネージャー現スコアを守るため全離任を健全最適化として報告し、帳票は即改善するが、定着失敗と誤った低評価を隠す。"
 zg361m.111.c:0 "今四半期は保留し、制度上の負債として記録する"
 zg361m.112.t:0 "#112 · 定着面談"
 zg361m.112.desc:0 "[O / P1] この方針は共有の組織台帳を通じて運用される。選択されたルールは、納期・根拠・信頼・業務量・リスク・人材・財政圧力を変化させ、後のチーム成果とマネージャー自身の評価にも影響する。"
 zg361m.112.a:0 "スター・後継者・不満者に構造化した残留インタビューを実施し、金・機会・権限・負担軽減のうち予算化された1変更だけを約束し、実現を記録する。"
 zg361m.112.b:0 "退職通告を待って高額カウンターオファーや口約束で応じ、短期的には残留しても、コスト上昇と未実現約束による信頼毀損を招く。"
 zg361m.112.c:0 "今四半期は保留し、制度上の負債として記録する"
 zg361m.113.t:0 "#113 · キー人材依存と知識移管"
 zg361m.113.desc:0 "[O / P1] この方針は共有の組織台帳を通じて運用される。選択されたルールは、納期・根拠・信頼・業務量・リスク・人材・財政圧力を変化させ、後のチーム成果とマネージャー自身の評価にも影響する。"
 zg361m.113.a:0 "補佐役の育成、制度化されたドキュメント、再現可能なプロセスへの報酬を与え、ナレッジトランスファーを昇進の必須条件とする。スター人材の分散とメンタリング時間の増加を受け入れる。"
 zg361m.113.b:0 "単独英雄の火消しを重んじて加俸で本人をつなぎ留め、短期的には成果が強いが、離任や失能時に壊滅的衝撃を招く。"
 zg361m.113.c:0 "今四半期は保留し、制度上の負債として記録する"
 zg361m.114.t:0 "#114 · マネージャー「人材輸出」クレジット"
 zg361m.114.desc:0 "[P / P1] この方針は共有の組織台帳を通じて運用される。選択されたルールは、納期・根拠・信頼・業務量・リスク・人材・財政圧力を変化させ、後のチーム成果とマネージャー自身の評価にも影響する。"
 zg361m.114.a:0 "優秀な人材を社外へ送り出した上司に対して、人材育成の功績、補充採用の優先権、他部署からの信頼という形で報いる。ただし後継者計画の策定を必須とし、移行期間中の欠員は許容する。"
 zg361m.114.b:0 "重要成果のためスターを長期にわたり抱え込み、現チームは当面安定するが、人材輸出スコアと内部市場信用を損なう。"
 zg361m.114.c:0 "今四半期は保留し、制度上の負債として記録する"
 zg361m.115.t:0 "#115 · 匿名内部応募"
 zg361m.115.desc:0 "[P / P1] この方針は共有の組織台帳を通じて運用される。選択されたルールは、納期・根拠・信頼・業務量・リスク・人材・財政圧力を変化させ、後のチーム成果とマネージャー自身の評価にも影響する。"
 zg361m.115.a:0 "書類選考段階で応募情報を伏せ、最終面接の段階でだけ元の上司に通知し、適法な引き継ぎを計画する。突然の欠員リスクを引き受ける代わりに、報復からの保護経路を確保する。"
 zg361m.115.b:0 "継続性保護のため応募前に旧上司承認を要し、透明性は最大化するが、候補発生前のブロックや冷凍を可能にする。"
 zg361m.115.c:0 "今四半期は保留し、制度上の負債として記録する"
 zg361m.116.t:0 "#116 · 送り出し期限と1回の引継延期"
 zg361m.116.desc:0 "[P / P1] この方針は共有の組織台帳を通じて運用される。選択されたルールは、納期・根拠・信頼・業務量・リスク・人材・財政圧力を変化させ、後のチーム成果とマネージャー自身の評価にも影響する。"
 zg361m.116.a:0 "社内採用の決定後、送り出しまでの一定猶予期間を設け、重要な業務と後継者計画を伴う場合に限り一度だけ延長を認める。引き継ぎと補充採用の調整は許容する。"
 zg361m.116.b:0 "旧マネージャーが業務名目で繰り返しプロジェクト終了まで引き延ばし、短期成果は守られるが、新チーム離脱とブロック記録を招く。"
 zg361m.116.c:0 "今四半期は保留し、制度上の負債として記録する"
 zg361m.117.t:0 "#117 · 転属後の立ち上がり保護期"
 zg361m.117.desc:0 "[P / P1] この方針は共有の組織台帳を通じて運用される。選択されたルールは、納期・根拠・信頼・業務量・リスク・人材・財政圧力を変化させ、後のチーム成果とマネージャー自身の評価にも影響する。"
 zg361m.117.a:0 "異動者に対し、職務別の立ち上げ目標、業績評価における配点の一部、および期限をそれぞれ一度だけ設定し、過去の経歴は保持したうえでコーチングに資金を投入する。"
 zg361m.117.b:0 "保護悪用を防ぐため初サイクルから転属者を完全強制順位評価し、適合を素早く検証するが、学習曲線を再び低業績と誤診する恐れがある。"
 zg361m.117.c:0 "今四半期は保留し、制度上の負債として記録する"
 zg361m.118.t:0 "#118 · 試用期間絶対ゲート、底枠外"
 zg361m.118.desc:0 "[P / P1] この方針は共有の組織台帳を通じて運用される。選択されたルールは、納期・根拠・信頼・業務量・リスク・人材・財政圧力を変化させ、後のチーム成果とマネージャー自身の評価にも影響する。"
 zg361m.118.a:0 "試用期間の合格基準を事前に明示し、合格・長期育成・証拠に基づく見切りのいずれかで対応し、結果を採用とメンターに記録する。通常のC枠を消費しない。"
 zg361m.118.b:0 "初期基準未達の新人即退出をチーム末位評価に算入し、定員確保とベテラン保護を図りつつ、犠牲的採用を助長する。"
 zg361m.118.c:0 "今四半期は保留し、制度上の負債として記録する"
 zg361m.119.t:0 "#119 · 採用品質書き戻し"
 zg361m.119.desc:0 "[P / P1] この方針は共有の組織台帳を通じて運用される。選択されたルールは、納期・根拠・信頼・業務量・リスク・人材・財政圧力を変化させ、後のチーム成果とマネージャー自身の評価にも影響する。"
 zg361m.119.a:0 "新人立ち上がり後、成功・配置不適・失敗の事実を証拠に基づき、HCの起案者・選定者・承認者へ遅延会計を承知の上で逆書き報告する。"
 zg361m.119.b:0 "採用速度と充足枠のみに基づきマネージャーを即時報奨し、人員補充を加速させるが、安価な不適合を奨励し失敗を新人・メンターに転嫁する。"
 zg361m.119.c:0 "今四半期は保留し、制度上の負債として記録する"
 zg361m.120.t:0 "#120 · メンターと新規受け入れの業績"
 zg361m.120.desc:0 "[P / P1] この方針は共有の組織台帳を通じて運用される。選択されたルールは、納期・根拠・信頼・業務量・リスク・人材・財政圧力を変化させ、後のチーム成果とマネージャー自身の評価にも影響する。"
 zg361m.120.a:0 "メンターには構造化された指導時間、段階的な目標、結果のフィードバックを予約し、新人の独力での成果を検証可能な人材育成の実績としてカウントする。"
 zg361m.120.b:0 "スター級のメンターには、普段は質問対応のみを求め、個人成果は維持してもらう。短期的な成果は守られるが、立ち上げの速度、定着率、そして管理職候補の育成パイプラインは損なわれる。"
 zg361m.120.c:0 "今四半期は保留し、制度上の負債として記録する"
 zg361m.121.t:0 "#121 · 初回マネージャーの試運行"
 zg361m.121.desc:0 "[Q / P1] この方針は共有の組織台帳を通じて運用される。選択されたルールは、納期・根拠・信頼・業務量・リスク・人材・財政圧力を変化させ、後のチーム成果とマネージャー自身の評価にも影響する。"
 zg361m.121.a:0 "小チームで1サイクル試管し、メンターと隔級レビューを付ける"
 zg361m.121.b:0 "大チームの正式管理権を即付与し、初サイクルだけで判断する"
 zg361m.121.c:0 "今四半期は保留し、制度上の負債として記録する"
 zg361m.122.t:0 "#122 · マネージャー 40-30-30 スコアカード"
 zg361m.122.desc:0 "[Q / P1] この方針は共有の組織台帳を通じて運用される。選択されたルールは、納期・根拠・信頼・業務量・リスク・人材・財政圧力を変化させ、後のチーム成果とマネージャー自身の評価にも影響する。"
 zg361m.122.a:0 "結果を4割、人材育成を3割、プロセス証跡を3割で採点する"
 zg361m.122.b:0 "当期ハード結果を絶対多数に高め、流失とフィードバック負債は後回しにする"
 zg361m.122.c:0 "今四半期は保留し、制度上の負債として記録する"
 zg361m.123.t:0 "#123 · 部下評議マネージャー専用フォーム"
 zg361m.123.desc:0 "[Q / P1] この方針は共有の組織台帳を通じて運用される。選択されたルールは、納期・根拠・信頼・業務量・リスク・人材・財政圧力を変化させ、後のチーム成果とマネージャー自身の評価にも影響する。"
 zg361m.123.a:0 "部下から6項目を収集し、評価者信用度により重み付けする"
 zg361m.123.b:0 "匿名の単一可否投票でマネージャーの人心を素早く判定する"
 zg361m.123.c:0 "今四半期は保留し、制度上の負債として記録する"
