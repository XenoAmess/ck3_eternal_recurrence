l_japanese:
 # Game rules
 rule_zg361_enabled:0 "封臣パフォーマンスレビュー（361制度）"
 setting_zg361_on:0 "有効"
 setting_zg361_on_desc:0 "公爵以上の天朝諸侯は直属の在任官僚を定期に考査し、3.75 / 3.5 / 3.25 に振り分ける。伯爵と男爵は考査されるのみで、考査は行わない。"
 setting_zg361_off:0 "無効"
 setting_zg361_off_desc:0 "パフォーマンスレビュー制度を無効化する。"
 rule_zg361_frequency:0 "評価サイクル"
 setting_zg361_freq_yearly:0 "年次評価"
 setting_zg361_freq_yearly_desc:0 "毎年1回の評価シーズン。"
 setting_zg361_freq_three_year:0 "三年評価"
 setting_zg361_freq_three_year_desc:0 "3年ごとに盛大で格式ある評価を。古き良きスタイル。"
 rule_zg361_bottom_ratio:0 "最下位枠"
 setting_zg361_ratio_strict:0 "厳格な361（10%）"
 setting_zg361_ratio_strict_desc:0 "361の配点を厳守する。たとえ全員が期待に達していても、母集団が十分に大きければ、誰かが3.25を背負わなければならない。"
 setting_zg361_ratio_relaxed:0 "緩和（5%）"
 setting_zg361_ratio_relaxed_desc:0 "361方式の評価は維持しつつ、最下位1割の硬直的な枠を緩和する。"
 setting_zg361_ratio_off:0 "放任（0%）"
 setting_zg361_ratio_off_desc:0 "最下位を強制しない。評価は形骸化する。"
 # Decision group & decisions
 decision_group_type_zg361:0 "業績考課"
 zg361_review_now_decision:0 "今すぐ業績考課を実施"
 zg361_review_now_decision_desc:0 "年度の考課季を待たず、直ちに考功司に命じて直属の序列を公表させる。今年すでに考課を受けた官吏は再評価されない。"
 zg361_review_now_decision_tooltip:0 "直属の現職官吏を少なくとも一名、ただちに考課する。同じ暦年内に再度実施することはできない。"
 zg361_review_now_decision_confirm:0 "ランキングを発表する！"
 zg361_ratio_strict_decision:0 "最下位枠：厳格な361（10%）"
 zg361_ratio_strict_decision_desc:0 "強制配分を徹底する。評価プールが5名以上の場合は、必ず誰かが3.25を背負う。"
 zg361_ratio_strict_decision_tooltip:0 "この評価ユニットの強制最下位枠を10%に設定する。"
 zg361_ratio_strict_decision_confirm:0 "厳格にいく。"
 zg361_ratio_relaxed_decision:0 "最下位枠：緩和（5%）"
 zg361_ratio_relaxed_decision_desc:0 "361方式の評定は維持しつつ、硬直した1割の最下位枠を緩める。"
 zg361_ratio_relaxed_decision_tooltip:0 "この評価ユニットの強制最下位枠を5%に設定する。"
 zg361_ratio_relaxed_decision_confirm:0 "緩める。"
 zg361_ratio_off_decision:0 "最下位枠：放任（0%）"
 zg361_ratio_off_decision_desc:0 "強制の最下位層は廃止。評価は形骸化してしまう。"
 zg361_ratio_off_decision_tooltip:0 "この評価ユニットの強制最下位枠を解除する。"
 zg361_ratio_off_decision_confirm:0 "放任する。"
 # Character interactions
 zg361_appeal_interaction:0 "考課結果への異議申立て"
 zg361_appeal_interaction_desc:0 "今期の評価結果に対して正式に異議を申し立て、再評価を求める。影響力150を消費する。"
 zg361_review_talk_interaction:0 "考課面談"
 zg361_review_talk_interaction_desc:0 "今期すでに結果が発表された封臣と1対1で考課面談を行い、感情を鎮める。"
 zg361_recommend_interaction:0 "推薦"
 zg361_recommend_interaction_desc:0 "共通の直属君主にこの同格者の業績を推薦する：相手の次期評価に+10。"
 zg361_slander_interaction:0 "悪口"
 zg361_slander_interaction_desc:0 "この同僚に対する辛辣な上申書を提出する。70%の確率で次の評価が-15される。発覚すれば逆に自分が不利になる。"
 zg361_purge_interaction:0 "最下位処分: 爵位剥奪"
 zg361_purge_interaction_desc:0 "3.25を2期連続でつけた官吏に対して最下層淘汰を実施：官職を剥奪する（合法的な理由によるため、暴政扱いとはならない）。"
 zg361_force_retire_interaction:0 "最下位処分: 強制退職"
 zg361_force_retire_interaction_desc:0 "3.25が連続2回ついた官僚に体面を保った退場を認める。強制退職となるが、功績は維持される。"
 # Modifiers (grades)
 zg361_grade_375:0 "業績3.75・期待を超える"
 zg361_grade_375_desc:0 "今サイクルの評価：3.75。実績・難易度・影響範囲ともに現職階の期待を明確に上回っており、昇格候補として推薦済みです。"
 zg361_grade_35:0 "業績3.5・期待どおり"
 zg361_grade_35_desc:0 "今サイクルの評価：3.5。職階で求められる業務はきちんとこなしました。良い調子です。このまま継続してください。"
 zg361_grade_325:0 "パフォーマンス 3.25 · 改善が必要"
 zg361_grade_325_desc:0 "今回の評価結果：3.25。四重処分の内容：地方国庫 -50（該当時）、個人の金 -25、功徳 -60（制度対応時）、および俸給 -25%（該当時・一年間）。"
 zg361_pip:0 "パフォーマンス改善計画"
 zg361_pip_desc:0 "業績改善計画（PIP）に編入済。連続2サイクルで3.25となった場合、最下位淘汰プロセスに移行する。"
 zg361_demoted:0 "降格・継続雇用"
 zg361_demoted_desc:0 "寛大な淘汰結果：降格・留任、俸給は半減。次のサイクルでの様子を見ましょう。"
 zg361_promotion_track:0 "昇格ルート"
 zg361_promotion_track_desc:0 "3.75が2期連続したため、昇格ルートが開通。任命候補者の評価が大きく伸び、品等上限が一時的に引き上げられる。"
 # Opinions
 zg361_favored:0 "上官のお眼鏡"
 zg361_poor_review:0 "考績不良"
 zg361_annoyed:0 "執拗な異議申し立て"
 zg361_purged:0 "最下層として粛清"
 zg361_forced_retire:0 "強制退職"
 zg361_merciful:0 "温情措置"
 zg361_rigged:0 "イカサマ考課"
 zg361_appeal_rejected:0 "異議申し立て却下"
 zg361_talked:0 "面談"
 zg361_slandered_me:0 "悪意ある誹謗"
 zg361_jingcha_attended:0 "京察に列席"
 # Activity
 activity_zg361_jingcha:0 "京察（大臣考課）"
 activity_zg361_jingcha_desc:0 "直属の在任官吏を居所へ召喚し、目の前で実績を査閲する。京察が閉じたその瞬間、ランキングが即刻公示される。"
 activity_zg361_jingcha_host_desc:0 "京察大計を主宰し、直属の属官を直接審査し、終了時にランキングを掲示する。"
 activity_zg361_jingcha_guest_desc:0 "直属君主の居城へ赴き、直接の評価を受ける。"
 activity_zg361_jingcha_selection_tooltip:0 "直属の在任官吏を居所へ召喚して査閲する。"
 activity_zg361_jingcha_conclusion_desc:0 "京察大評定は終了し、成績が掲示板に公開された。"
 zg361_jingcha_province_desc:0 "治所で京察大評定を開催する。"
 zg361_jingcha_phase:0 "評定"
 # Events
 zg361.1.t:0 "あなたが実施した評価：名簿確定"
 zg361.1.desc:0 "これは直属の官吏に対してあなたが実施した業績評価であり、上司からあなた自身への評定ではない。考功司は現在の階層における最下位枠ルールに基づき名簿を確定した。\n\n今サイクル: 期待を超える評価は[TopScope.GetValue('zg361_n_375')|0]名、期待どおりの評価は[TopScope.GetValue('zg361_n_35')|0]名、改善が必要なのは[TopScope.GetValue('zg361_n_325')|0]名。最下位淘汰プロセスに移行するのは[TopScope.GetValue('zg361_n_elim')|0]名。\n\nあなた自身の業績が上司によって評定される場合、評価、KPI、序列を明記した別の文書が発給される。"
 zg361.1.a:0 "承知。"
 zg361.2.t:0 "上司評定：3.75 · 期待を超える"
 zg361.2.desc:0 "[zg361_reviewing_superior.GetShortUIName] が今回の考課であなたの評価を確定しました。\n\nあなたの評点：3.75（期待を超える）\nKPI：[TopScope.GetValue('zg361_result_kpi')|0]　同グループ順位：[TopScope.GetValue('zg361_result_rank')|0] 位 / 全 [TopScope.GetValue('zg361_result_cohort_n')|0] 名\n\n成果・難易度・影響範囲ともに、現在の職階を上回っています。功績・地方財政・昇進推挙の褒賞は、あなたの役職と制度が許す範囲で適用されます。"
 zg361.2.a:0 "君主に鍛えていただき、誠にありがとうございます！"
 zg361.3.t:0 "上司評定：3.5 · 期待どおり"
 zg361.3.desc:0 "[zg361_reviewing_superior.GetShortUIName] が今期の評価であなたの等級を確定しました。\n\nあなたの評価：3.5（期待どおり）\nKPI：[TopScope.GetValue('zg361_result_kpi')|0]　同グループ内順位：[TopScope.GetValue('zg361_result_rank')|0] / [TopScope.GetValue('zg361_result_cohort_n')|0]\n\n現等級に求められる業務は、無難にこなしました。良くも悪くもなく、このままです。"
 zg361.3.a:0 "……そのまま続けてください。"
 zg361.4.t:0 "上司評価：3.25 · 要改善"
 zg361.4.desc:0 "[zg361_reviewing_superior.GetShortUIName]が今期評価のあなたの等級を割り当てました。\n\nあなたの評価:3.25(要改善)\nKPI:[TopScope.GetValue('zg361_result_kpi')|0]　同コホート順位:[TopScope.GetValue('zg361_result_cohort_n')|0]人中[TopScope.GetValue('zg361_result_rank')|0]位\n\nあなたは現職階層の基準を下回っています。四重決済が適用されます:地方国庫(あれば)から50、個人の金から25、制度が対応する箇所では功徳から60、そして該当する箇所では一年間の俸給を25%減額。業績改善計画が始まり、もう一度3.25を取れば最下位淘汰となります。"
 zg361.4.a:0 "甘受する。（ストレス軽減）"
 zg361.4.b:0 "異議あり！この考課は不正だ！（影響力150を消費、覆る確率は三割）"
 zg361.4.c:0 "諦める。とりあえず手を抜く。（ストレス軽減、翌年の考課-10）"
 zg361.4.d:0 "努力する。来年の実績で証明する。（ストレス増加、翌年の考課+10）"
 zg361.5.t:0 "下位淘汰リスト"
 zg361.5.desc:0 "今期、[TopScope.GetValue('zg361_n_elim')|0] 名の官吏が 3.25 を二度続けて記録し、最下位による淘汰の対象となっている。リストはあなたの机の上にあり、朱筆があなたの手の中にある。（廷臣画面から一人ずつ処分することもできる。）\n\n彼らをどう処分するか？"
 zg361.5.a:0 "規定どおりに裁く。（それぞれ政績・寵愛・能力で判定：罷免・強制退職・左遷のいずれか）"
 zg361.5.b:0 "慈悲深く——全員降格だが在籍させる。（威信-100）"
 zg361.5.c:0 "もう一年、観察期間を与える。（威信-50、宮中は感謝する）"
 zg361.6.t:0 "あなたは淘汰リストに載っている"
 zg361.6.desc:0 "2回連続で3.25を叩き出され、ついに下位淘汰の刃があなたの首元に落ちた。主君の官吏たちはすでに名簿を手に出立した。\n\n今だけは、まだ猶予がある。"
 zg361.6.a:0 "最終異議申し立て！再審査を要求する！（影響力200を消費、40%の確率で降格に変わる。失敗すれば爵位を剥奪）"
 zg361.6.b:0 "懐を痛めて手回しを頼む。（金貨300を消費、降格だが留任）"
 zg361.6.c:0 "潔く引退する。"
 zg361.6.d:0 "反旗を翻す！（主君への独立派閥を結成）"
 zg361.10.t:0 "業績評価会議"
 zg361.10.desc:0 "役所からの素案が机に広がっている：期待以上 [TopScope.GetValue('zg361_n_375')|0]名、期待通り [TopScope.GetValue('zg361_n_35')|0]名、要改善 [TopScope.GetValue('zg361_n_325')|0]名。\n\n結果が公表される前なら、まだ朱筆はあなたのものだ。誰かを引き上げ、誰かを引きずり下ろすこと自体は自由だが、もし手心を加えたと宮廷に嗅ぎつけられれば、業績改ざんと呼ばれるだろう。"
 zg361.10.a:0 "名簿に誤りはない。公表する。"
 zg361.10.b:0 "1名を上げる：最下位3.75を最上位3.5と入れ替える。"
 zg361.10.c:0 "1名を引きずり下ろす：最下位3.5を3.25へ叩き落とす。"
 zg361.11.t:0 "朱筆定まる"
 zg361.11.desc:0 "朱筆を取り上げ、リストの下方の名を静かに上へ押し上げる。押し下げられた者は、主君が寝返って方針を変えたことなど知る由もない。"
 zg361.11.a:0 "結果を公表する。"
 zg361.12.t:0 "朱筆定まる"
 zg361.12.desc:0 "朱筆を取り、名簿の端にひとつの名をやい行をそっと書き足す。誰かがこの3.25を引き受けねばならぬ——なぜ彼ではいけないのか。"
 zg361.12.a:0 "結果を公表する。"
 zg361.20.t:0 "業績評価"
 zg361.20.desc:0 "業績評価が進行中である。"
 zg361.20.a:0 "続行。"
 zg361.30.t:0 "野良犬と白い兎"
 zg361.30.desc:0 "考課局は密奏に別紙を添えた。[TopScope.GetValue('zg361_n_dog')|0] 匹の\"野良犬\"——成績は抜群だが価値観が壊れている。そして [TopScope.GetValue('zg361_n_rabbit')|0] 羽の\"白い兎\"——忠诚は申し分ないが仕事ができない。\n\nどちらも長く飼っておく類ではない。いかがなさいますか？"
 zg361.30.a:0 "寛厳よろしきを得る：野良犬は監視付きで残留させ、兎は慰める。"
 zg361.30.b:0 "野良犬を罰し、兎を引退させる。（威信+50；野良犬は功績点を没収されPIP入り、兎は退職）"
 zg361_scoreboard_open:0 "考課ボード"
 zg361_scoreboard_open_tooltip:0 "直近に公示された公式考課ボードを開きます。"
 zg361_scoreboard_title:0 "天朝官吏考課榜"
 zg361_scoreboard_year:0 "考課年"
 zg361_scoreboard_total:0 "対象人数"
 zg361_scoreboard_grade_375:0 "#P 3.75#!"
 zg361_scoreboard_grade_35:0 "#V 3.5#!"
 zg361_scoreboard_grade_325:0 "#N 3.25#!"
 zg361_scoreboard_dash:0 "—"
 zg361_scoreboard_status_promotion:0 "#P 昇進ルート#!"
 zg361_scoreboard_status_pip:0 "#N PIP#!"
 zg361_scoreboard_col_rank:0 "順位"
 zg361_scoreboard_col_official:0 "官吏／官職"
 zg361_scoreboard_col_kpi:0 "KPI"
 zg361_scoreboard_col_values:0 "価値観"
 zg361_scoreboard_col_grade:0 "考課"
 zg361_scoreboard_col_streak:0 "連続回数"
 zg361_scoreboard_col_status:0 "状態"
 zg361_scoreboard_hint:0 "官吏を選んで人物画面を開けます。最新の公示名簿は、すでに行なった者の記録もそのまま残します。"
 zg361_scoreboard_tab_managed:0 "所管の官吏"
 zg361_scoreboard_tab_received:0 "あなたの考課ユニット"
 zg361_scoreboard_reviewer:0 "考課担当君主"
 zg361_scoreboard_former_official:0 "すでに離任（本期の公示榜に残存）"
 zg361_jingcha_phase_desc:0 "直属の在任官吏が治所へ赴き、その君主が帳簿を直接校閲する。"
 activity_zg361_jingcha_destination_selection:0 "京察の開催地を選ぶ"
 activity_zg361_jingcha_guest_help_text:0 "直属の在任官吏を招き、治所で考課を行う。"
 activity_zg361_jingcha_cooldown:0 "京察大計はクールダウン中です"
 activity_zg361_jingcha_predicted_cost:0 "京察大計は法廷の義務であり、国庫・私財のいずれも消費しない。"
 activity_zg361_jingcha_host_an_a:0 "$host_activity_a$"
 zg361_refused_jingcha:0 "京察への抗命"
 zg361.40.t:0 "京察の期限"
 zg361.40.desc:0 "戸籍、会計、功過簿が整った。規定により、直属の在任官吏を治所に招いて京察大計を行なわねばならず、国庫にも私財にも請求はできない。\n\nこの義務を拒めば、直属の上司は重大な失政と記録する。上司がおらず独立の最上位君主であれば、朝廷制度の威信が損なわれる。"
 zg361.40.a:0 "規定どおりに開催する"
 zg361.40.a.tt:0 "無料の活動プランナー（業務時間制約対応版）を開く。京察は300日以内に終えねばならない。プランナーを開いたり閉じたりしただけでは義務履行とはみなされない。"
 zg361.40.b:0 "今年は行なわない"
 zg361.40.b.tt:0 "直属の上司がいる場合：あなたの評価が下がり、次回の受審時に一度限りのKPIペナルティ50を科す。\n独立の最上位君主の場合：威威信を200失い、自己評価の捏造は一切行わない。"
 zg361.41.t:0 "京察の遅延"
 zg361.41.desc:0 "京察大計の期限が過ぎても、まだ終結していない。"
 zg361.41.a:0 "コンプライアンス記録はすでに確定"
