l_japanese:
 zg361pp.grade.375:0 "Frozen performance: 3.75. Relax; this page has not started praising you yet."
 zg361pp.grade.350:0 "Frozen performance: 3.5. In plain speech: plenty delivered, with a few traps left for the review."
 zg361pp.grade.325:0 "Frozen performance: 3.25. Slides call it growth space; the ledger calls it an evidence starting point."
 zg361pp.outcome.evidence:0 "Evidence led: the process is not kinder, but it finally left something auditable."
 zg361pp.outcome.political:0 "Politics led: the business stayed flexible and responsibility stayed reliably attached to the manager."
 zg361pp.outcome.mixed:0 "The routes tied: policy and politics each won half; meeting time lost all of it."
 zg361pp.terminal.second_pip:0 "Terminal: second PIP. The improvement plan has improved itself into a subscription."
 zg361pp.terminal.graduated:0 "Terminal: no same-category relapse. The improvement plan did not renew its subscription this time."
 zg361pp.terminal.transfer:0 "Terminal: real transfer. This moves a vacancy and receiving manager, not merely the problem into another chat."
 zg361pp.terminal.exit:0 "Terminal: exit. Vacancy, handover, overtime and replacement costs all survived the optimization."
 zg361pp.151.subject.a:0 "Acknowledge receipt and agree."
 zg361pp.151.subject.b:0 "Acknowledge receipt, preserve my objection, and appeal."
 zg361pp.166.subject.a:0 "Withdraw my promotion packet."
 zg361pp.166.subject.b:0 "Continue; let the manager handle the remaining procedure."
 zg361pp.190.subject.a:0 "Attach my minimum-disclosure statement."
 zg361pp.190.subject.b:0 "Withhold my statement and retain only the procedural receipt."
 zg361pp.146.t:0 "Plain rating or softened wording"
 zg361pp.146.desc:0 "Consumer: 反馈会和申诉时钟读取同一冻结档位. This writes a reviewable case receipt; 'business needs' cannot skip the state machine."
 zg361pp.146.a:0 "State the frozen rating plainly and record understanding."
 zg361pp.146.b:0 "Use indirect wording, preserve the rating, and record misunderstanding debt."
 zg361pp.146.c:0 "Defer, but bind an owner, deadline and policy-debt receipt."
 zg361pp.147.t:0 "Forced praise-and-critique template"
 zg361pp.147.desc:0 "Consumer: 反馈质量表消费证据链接与套话数. This writes a reviewable case receipt; 'business needs' cannot skip the state machine."
 zg361pp.147.a:0 "Let frozen evidence determine praise and critique counts."
 zg361pp.147.b:0 "Force both polarities and flag unsupported boilerplate."
 zg361pp.147.c:0 "Defer, but bind an owner, deadline and policy-debt receipt."
 zg361pp.148.t:0 "Evidence first or rating first"
 zg361pp.148.desc:0 "Consumer: 纪要保存步骤顺序、确认和异议. This writes a reviewable case receipt; 'business needs' cannot skip the state machine."
 zg361pp.148.a:0 "Confirm each evidence item before announcing the rating."
 zg361pp.148.b:0 "Announce the rating first while preserving the same evidence and disputes."
 zg361pp.148.c:0 "Defer, but bind an owner, deadline and policy-debt receipt."
 zg361pp.149.t:0 "Performance-result bargain package"
 zg361pp.149.desc:0 "Consumer: 个人谈判页核销实际付款回执. This writes a reviewable case receipt; 'business needs' cannot skip the state machine."
 zg361pp.149.a:0 "Freeze written terms, owner and due date without changing the current lower rating."
 zg361pp.149.b:0 "Record an oral assurance without pretending the debt is fulfilled."
 zg361pp.149.c:0 "Defer, but bind an owner, deadline and policy-debt receipt."
 zg361pp.150.t:0 "A promise for this cycle's sacrifice"
 zg361pp.150.desc:0 "Consumer: 承诺时间线到期后结算履约或背约. This writes a reviewable case receipt; 'business needs' cannot skip the state machine."
 zg361pp.150.a:0 "Open a funded, dated, non-rating compensation obligation."
 zg361pp.150.b:0 "Make an oral promise and expose it as unfulfilled debt."
 zg361pp.150.c:0 "Defer, but bind an owner, deadline and policy-debt receipt."
 zg361pp.151.t:0 "Receipt is not agreement"
 zg361pp.151.desc:0 "Consumer: 收据行、见证送达与申诉案卷分别消费. This writes a reviewable case receipt; 'business needs' cannot skip the state machine."
 zg361pp.151.a:0 "Record delivery, agreement and objection separately; keep appeal available."
 zg361pp.151.b:0 "Coerce receipt into agreement and post procedural debt."
 zg361pp.151.c:0 "Defer, but bind an owner, deadline and policy-debt receipt."
 zg361pp.152.t:0 "Feedback actionability score"
 zg361pp.152.desc:0 "Consumer: 经理反馈质量表按收件人一次性回写. This writes a reviewable case receipt; 'business needs' cannot skip the state machine."
 zg361pp.152.a:0 "Freeze specificity, controllability, deadline and resource scores."
 zg361pp.152.b:0 "Record sentiment only; vague advice cannot receive full actionability credit."
 zg361pp.152.c:0 "Defer, but bind an owner, deadline and policy-debt receipt."
 zg361pp.153.t:0 "Post-feedback action closure"
 zg361pp.153.desc:0 "Consumer: 行动时间线只接受一个终态回执. This writes a reviewable case receipt; 'business needs' cannot skip the state machine."
 zg361pp.153.a:0 "Open one action with an owner, original due date and acceptance evidence."
 zg361pp.153.b:0 "Allow change or cancellation while preserving history and reasons."
 zg361pp.153.c:0 "Defer, but bind an owner, deadline and policy-debt receipt."
 zg361pp.154.t:0 "Full minutes or summary minutes"
 zg361pp.154.desc:0 "Consumer: 申诉投影只读纪要版本和更正附录. This writes a reviewable case receipt; 'business needs' cannot skip the state machine."
 zg361pp.154.a:0 "Keep complete append-only minutes with evidence references."
 zg361pp.154.b:0 "Keep a summary while retaining result and evidence references."
 zg361pp.154.c:0 "Defer, but bind an owner, deadline and policy-debt receipt."
 zg361pp.155.t:0 "Public praise and private criticism boundary"
 zg361pp.155.desc:0 "Consumer: 团队公告与私人反馈使用不同字段投影. This writes a reviewable case receipt; 'business needs' cannot skip the state machine."
 zg361pp.155.a:0 "Publish approved achievements and keep sensitive feedback private."
 zg361pp.155.b:0 "Name bottom performers publicly and incur shaming and retaliation costs."
 zg361pp.155.c:0 "Defer, but bind an owner, deadline and policy-debt receipt."
 zg361pp.156.t:0 "Team result briefing"
 zg361pp.156.desc:0 "Consumer: 政策面板读取说明会收据或流言风险. This writes a reviewable case receipt; 'business needs' cannot skip the state machine."
 zg361pp.156.a:0 "Brief the distribution rule, common issues and resource plan after publication."
 zg361pp.156.b:0 "Skip the briefing and post information-vacuum debt."
 zg361pp.156.c:0 "Defer, but bind an owner, deadline and policy-debt receipt."
 zg361pp.157.t:0 "Self-nomination and manager nomination"
 zg361pp.157.desc:0 "Consumer: 提名队列生成一人一包的冻结案号. This writes a reviewable case receipt; 'business needs' cannot skip the state machine."
 zg361pp.157.a:0 "Allow eligible self-nomination with a sponsor and recorded manager opinion."
 zg361pp.157.b:0 "Keep manager-only access and record the support or rejection reason."
 zg361pp.157.c:0 "Defer, but bind an owner, deadline and policy-debt receipt."
 zg361pp.158.t:0 "Manager nomination quota"
 zg361pp.158.desc:0 "Consumer: 额度账校验已用、归还与剩余恒等. This writes a reviewable case receipt; 'business needs' cannot skip the state machine."
 zg361pp.158.a:0 "Concentrate scarce slots on evidence-backed candidates and rank them."
 zg361pp.158.b:0 "Spread slots across boundary packets and dilute coaching hours."
 zg361pp.158.c:0 "Defer, but bind an owner, deadline and policy-debt receipt."
 zg361pp.159.t:0 "Shelving an eligible star"
 zg361pp.159.desc:0 "Consumer: 逾期审计每周期只扣一次经理人才分. This writes a reviewable case receipt; 'business needs' cannot skip the state machine."
 zg361pp.159.a:0 "Freeze a successor plan and a dated nomination path for the star."
 zg361pp.159.b:0 "Shelve the star for current output and post overdue talent debt."
 zg361pp.159.c:0 "Defer, but bind an owner, deadline and policy-debt receipt."
 zg361pp.160.t:0 "Department prescreen"
 zg361pp.160.desc:0 "Consumer: 预审队列只把真实席位数量的包送进答辩. This writes a reviewable case receipt; 'business needs' cannot skip the state machine."
 zg361pp.160.a:0 "Prescreen on packet completeness, level evidence and strategic fit."
 zg361pp.160.b:0 "Use a political cut while preserving the rejection reason."
 zg361pp.160.c:0 "Defer, but bind an owner, deadline and policy-debt receipt."
 zg361pp.161.t:0 "Filler packets and sham competition"
 zg361pp.161.desc:0 "Consumer: 经理公平信用和主推包合法性消费陪跑识别. This writes a reviewable case receipt; 'business needs' cannot skip the state machine."
 zg361pp.161.a:0 "Submit only candidates the manager genuinely supports."
 zg361pp.161.b:0 "Insert a filler packet and charge its preparation hours and fairness debt."
 zg361pp.161.c:0 "Defer, but bind an owner, deadline and policy-debt receipt."
 zg361pp.162.t:0 "Tenure exception application"
 zg361pp.162.desc:0 "Consumer: 破格额度账与后续能力评审保持分离. This writes a reviewable case receipt; 'business needs' cannot skip the state machine."
 zg361pp.162.a:0 "Reserve an exception slot and vote on admission before merit review."
 zg361pp.162.b:0 "Package ordinary evidence as exceptional and spend future credibility."
 zg361pp.162.c:0 "Defer, but bind an owner, deadline and policy-debt receipt."
 zg361pp.163.t:0 "Promotion observation window"
 zg361pp.163.desc:0 "Consumer: 预审只读取冻结窗口内的完整候选历史. This writes a reviewable case receipt; 'business needs' cannot skip the state machine."
 zg361pp.163.a:0 "Freeze the last two cycles up front and attach reorganization context."
 zg361pp.163.b:0 "Cherry-pick the best cycle and retain the window audit diff."
 zg361pp.163.c:0 "Defer, but bind an owner, deadline and policy-debt receipt."
 zg361pp.164.t:0 "Cross-team evidence in the packet"
 zg361pp.164.desc:0 "Consumer: 晋升包消费有来源的贡献份额而非团队总分. This writes a reviewable case receipt; 'business needs' cannot skip the state machine."
 zg361pp.164.a:0 "Admit cross-team evidence after old-owner cosign or independent review with bounded shares."
 zg361pp.164.b:0 "Claim the team total as personal impact and post attribution debt."
 zg361pp.164.c:0 "Defer, but bind an owner, deadline and policy-debt receipt."
 zg361pp.165.t:0 "Next-level trial evidence"
 zg361pp.165.desc:0 "Consumer: 预审消费试岗验收回执，不改当期绩效. This writes a reviewable case receipt; 'business needs' cannot skip the state machine."
 zg361pp.165.a:0 "Freeze authority, compensation, deadline and exit condition together."
 zg361pp.165.b:0 "Add next-level work without authority and post level debt."
 zg361pp.165.c:0 "Defer, but bind an owner, deadline and policy-debt receipt."
 zg361pp.166.t:0 "Candidate packet withdrawal"
 zg361pp.166.desc:0 "Consumer: 下轮材料版本读取已验证工件与准备度风险. This writes a reviewable case receipt; 'business needs' cannot skip the state machine."
 zg361pp.166.a:0 "Withdraw before prescreen, return the slot and retain only verified artifacts."
 zg361pp.166.b:0 "Push the weak packet forward and preserve the failure reason."
 zg361pp.166.c:0 "Defer, but bind an owner, deadline and policy-debt receipt."
 zg361pp.167.t:0 "Sponsor promotion credit"
 zg361pp.167.desc:0 "Consumer: 后续胜任观察只结算一次 sponsor 信用. This writes a reviewable case receipt; 'business needs' cannot skip the state machine."
 zg361pp.167.a:0 "Make a bounded factual endorsement and settle credit after observation."
 zg361pp.167.b:0 "Guarantee strongly and accept an equal credibility discount on mismatch."
 zg361pp.167.c:0 "Defer, but bind an owner, deadline and policy-debt receipt."
 zg361pp.168.t:0 "Manager nomination hit rate"
 zg361pp.168.desc:0 "Consumer: 上司下一轮辅导或收紧额度时消费成熟样本. This writes a reviewable case receipt; 'business needs' cannot skip the state machine."
 zg361pp.168.a:0 "Weight passage and later competence by difficulty and count omitted qualified staff."
 zg361pp.168.b:0 "Nominate only sure wins and display risk-avoidance debt beside the hit rate."
 zg361pp.168.c:0 "Defer, but bind an owner, deadline and policy-debt receipt."
 zg361pp.169.t:0 "Panel expertise matching"
 zg361pp.169.desc:0 "Consumer: 答辩计分器按事前权重消费每席评分. This writes a reviewable case receipt; 'business needs' cannot skip the state machine."
 zg361pp.169.a:0 "Freeze expert and external weights that sum to one hundred."
 zg361pp.169.b:0 "Give familiar reviewers the majority and expose relationship risk."
 zg361pp.169.c:0 "Defer, but bind an owner, deadline and policy-debt receipt."
 zg361pp.170.t:0 "Random and familiar panelists"
 zg361pp.170.desc:0 "Consumer: 复跑以同一 seed 得到同一无重复席位. This writes a reviewable case receipt; 'business needs' cannot skip the state machine."
 zg361pp.170.a:0 "Draw unique panelists from the cross-unit pool with a frozen seed."
 zg361pp.170.b:0 "Accept some familiar nominees without letting the candidate appoint a majority."
 zg361pp.170.c:0 "Defer, but bind an owner, deadline and policy-debt receipt."
 zg361pp.171.t:0 "Panel conflict recusal"
 zg361pp.171.desc:0 "Consumer: 投票器只接受回避后的活跃评委集合. This writes a reviewable case receipt; 'business needs' cannot skip the state machine."
 zg361pp.171.a:0 "Disclose conflicts and replace each seat with a clean peer of the same kind."
 zg361pp.171.b:0 "Hide conflicts and post full-packet re-review debt when found."
 zg361pp.171.c:0 "Defer, but bind an owner, deadline and policy-debt receipt."
 zg361pp.172.t:0 "Veto, majority or trimmed mean"
 zg361pp.172.desc:0 "Consumer: 最终决定只消费冻结规则下的一人一票. This writes a reviewable case receipt; 'business needs' cannot skip the state machine."
 zg361pp.172.a:0 "Freeze the rule before voting and require a reviewable reason for every veto."
 zg361pp.172.b:0 "Change the rule midstream for a favored candidate and post rule-drift debt."
 zg361pp.172.c:0 "Defer, but bind an owner, deadline and policy-debt receipt."
 zg361pp.173.t:0 "Blind packet and live defense"
 zg361pp.173.desc:0 "Consumer: 评委质量复盘比较不可变盲分与现场分. This writes a reviewable case receipt; 'business needs' cannot skip the state machine."
 zg361pp.173.a:0 "Freeze identity-blind packet scores before the named live defense."
 zg361pp.173.b:0 "Review live with relationship anchors and retain the missing-artifact gap."
 zg361pp.173.c:0 "Defer, but bind an owner, deadline and policy-debt receipt."
 zg361pp.174.t:0 "Defense time budget"
 zg361pp.174.desc:0 "Consumer: 答辩记录校验陈述加质询等于冻结总时长. This writes a reviewable case receipt; 'business needs' cannot skip the state machine."
 zg361pp.174.a:0 "Protect twenty of sixty minutes for questions and use the rest for presentation."
 zg361pp.174.b:0 "Let slides consume most of the session while total time still conserves."
 zg361pp.174.c:0 "Defer, but bind an owner, deadline and policy-debt receipt."
 zg361pp.175.t:0 "Mock-defense coaching pool"
 zg361pp.175.desc:0 "Consumer: 辅导账校验已分配工时不超过开放池. This writes a reviewable case receipt; 'business needs' cannot skip the state machine."
 zg361pp.175.a:0 "Allocate finite hours from a transparent shared coaching pool."
 zg361pp.175.b:0 "Coach favorites and record unequal opportunity evidence."
 zg361pp.175.c:0 "Defer, but bind an owner, deadline and policy-debt receipt."
 zg361pp.176.t:0 "Individual attribution of team results"
 zg361pp.176.desc:0 "Consumer: 评委只按冻结个人份额计算影响证据. This writes a reviewable case receipt; 'business needs' cannot skip the state machine."
 zg361pp.176.a:0 "Split candidate and peer contribution shares to exactly one hundred."
 zg361pp.176.b:0 "Claim the team result wholesale and post credit-grab debt."
 zg361pp.176.c:0 "Defer, but bind an owner, deadline and policy-debt receipt."
 zg361pp.177.t:0 "Project scale versus personal leverage"
 zg361pp.177.desc:0 "Consumer: 目标职级判定同时消费两个独立维度. This writes a reviewable case receipt; 'business needs' cannot skip the state machine."
 zg361pp.177.a:0 "Freeze project scale and personal leverage as separate scores."
 zg361pp.177.b:0 "Substitute project halo for personal leverage and retain the gap."
 zg361pp.177.c:0 "Defer, but bind an owner, deadline and policy-debt receipt."
 zg361pp.178.t:0 "Artifacts and narrative as dual evidence"
 zg361pp.178.desc:0 "Consumer: 双门槛结果决定投票或补材料. This writes a reviewable case receipt; 'business needs' cannot skip the state machine."
 zg361pp.178.a:0 "Require both artifacts and narrative to clear frozen thresholds before voting."
 zg361pp.178.b:0 "Advance on narrative alone and mark the missing-artifact deferral."
 zg361pp.178.c:0 "Defer, but bind an owner, deadline and policy-debt receipt."
 zg361pp.179.t:0 "Named owner for rejection feedback"
 zg361pp.179.desc:0 "Consumer: 下轮材料对照同一 gap，不得无故换口径. This writes a reviewable case receipt; 'business needs' cannot skip the state machine."
 zg361pp.179.a:0 "Bind each gap and next evidence item to an actual panelist."
 zg361pp.179.b:0 "Write a vague improvement slogan and charge reviewer-quality debt."
 zg361pp.179.c:0 "Defer, but bind an owner, deadline and policy-debt receipt."
 zg361pp.180.t:0 "Promotion retry cooldown and refresh"
 zg361pp.180.desc:0 "Consumer: 重试只复用版本化旧材料并追加新影响. This writes a reviewable case receipt; 'business needs' cannot skip the state machine."
 zg361pp.180.a:0 "Cool down for one cycle, with early retry after every frozen gap is closed."
 zg361pp.180.b:0 "Retry immediately and accumulate panel congestion."
 zg361pp.180.c:0 "Defer, but bind an owner, deadline and policy-debt receipt."
 zg361pp.181.t:0 "Skill, will or role-mismatch triage"
 zg361pp.181.desc:0 "Consumer: PIP 入口按唯一主类别选择训练、纪律或转岗. This writes a reviewable case receipt; 'business needs' cannot skip the state machine."
 zg361pp.181.a:0 "Triage from evidence and route role mismatch to a real transfer without rewriting the rating."
 zg361pp.181.b:0 "Assume unwillingness and post misdiagnosis and appeal risk."
 zg361pp.181.c:0 "Defer, but bind an owner, deadline and policy-debt receipt."
 zg361pp.182.t:0 "PIP evidence threshold"
 zg361pp.182.desc:0 "Consumer: 启动门把红线违纪分流到独立纪律案. This writes a reviewable case receipt; 'business needs' cannot skip the state machine."
 zg361pp.182.a:0 "Open a formal PIP only after the frozen evidence combination meets threshold."
 zg361pp.182.b:0 "Auto-start from a 3.25 rating and record false-positive risk."
 zg361pp.182.c:0 "Defer, but bind an owner, deadline and policy-debt receipt."
 zg361pp.183.t:0 "Dual-signature PIP goals"
 zg361pp.183.desc:0 "Consumer: 任务页区分送达、认同、拒签和一次修订. This writes a reviewable case receipt; 'business needs' cannot skip the state machine."
 zg361pp.183.a:0 "Start the clock after dual signature on goals, resources and deadlines."
 zg361pp.183.b:0 "Preserve refusal reasons for independent reasonableness review."
 zg361pp.183.c:0 "Defer, but bind an owner, deadline and policy-debt receipt."
 zg361pp.184.t:0 "Manager PIP caseload"
 zg361pp.184.desc:0 "Consumer: 容量面板按终态一次释放每案预留. This writes a reviewable case receipt; 'business needs' cannot skip the state machine."
 zg361pp.184.a:0 "Reserve manager hours or add mentor and staggered capacity."
 zg361pp.184.b:0 "Overbook cases and assign support-failure liability to the manager."
 zg361pp.184.c:0 "Defer, but bind an owner, deadline and policy-debt receipt."
 zg361pp.185.t:0 "PIP midpoint review"
 zg361pp.185.desc:0 "Consumer: PIP 时间线消费进度、资源交付和目标有效性. This writes a reviewable case receipt; 'business needs' cannot skip the state machine."
 zg361pp.185.a:0 "Run one midpoint and allow one evidence-backed correction."
 zg361pp.185.b:0 "Skip the midpoint; later resource or goal corrections become invalid."
 zg361pp.185.c:0 "Defer, but bind an owner, deadline and policy-debt receipt."
 zg361pp.186.t:0 "PIP goal-creep lock"
 zg361pp.186.desc:0 "Consumer: 变更账比较基线、当前工作量和补偿路线. This writes a reviewable case receipt; 'business needs' cannot skip the state machine."
 zg361pp.186.a:0 "Add work only with equal replacement, extension or emergency review."
 zg361pp.186.b:0 "Add workload directly and post a goal-creep violation."
 zg361pp.186.c:0 "Defer, but bind an owner, deadline and policy-debt receipt."
 zg361pp.187.t:0 "PIP graduation gate"
 zg361pp.187.desc:0 "Consumer: 毕业或失败只读取 B2 唯一结算回执，绝不直接写档位. This writes a reviewable case receipt; 'business needs' cannot skip the state machine."
 zg361pp.187.a:0 "Read the unique case's graduation or failure receipt; the manager chooses only the review procedure."
 zg361pp.187.b:0 "Request procedural review without signing for the subject or declaring graduation for the settler."
 zg361pp.187.c:0 "Defer, but bind an owner, deadline and policy-debt receipt."
 zg361pp.188.t:0 "Post-graduation relapse window"
 zg361pp.188.desc:0 "Consumer: 观察标记到期一次；新问题必须另开案. This writes a reviewable case receipt; 'business needs' cannot skip the state machine."
 zg361pp.188.a:0 "Observe exactly one cycle and escalate only the same problem category."
 zg361pp.188.b:0 "Apply a long-lived label and record overbreadth risk."
 zg361pp.188.c:0 "Defer, but bind an owner, deadline and policy-debt receipt."
 zg361pp.189.t:0 "Second PIP, transfer or exit"
 zg361pp.189.desc:0 "Consumer: 终局决定页只接受一个排他终态. This writes a reviewable case receipt; 'business needs' cannot skip the state machine."
 zg361pp.189.a:0 "Choose one legal route from support sufficiency, role mismatch and real vacancy."
 zg361pp.189.b:0 "Force exit and settle vacancy, handover and replacement costs."
 zg361pp.189.c:0 "Defer, but bind an owner, deadline and policy-debt receipt."
 zg361pp.190.t:0 "Minimum PIP transfer disclosure"
 zg361pp.190.desc:0 "Consumer: 转岗包按 ACL 投影最小字段. This writes a reviewable case receipt; 'business needs' cannot skip the state machine."
 zg361pp.190.a:0 "Disclose goals, support, outcome and the subject statement only to the real receiving manager."
 zg361pp.190.b:0 "Apply a coarse label without inventing details or rewriting the old rating."
 zg361pp.190.c:0 "Defer, but bind an owner, deadline and policy-debt receipt."
 zg361pp.191.t:0 "Team cost statement after PIP exit"
 zg361pp.191.desc:0 "Consumer: 团队成本表和经理记分卡消费同一净额. This writes a reviewable case receipt; 'business needs' cannot skip the state machine."
 zg361pp.191.a:0 "Post vacancy, handover, overtime and replacement net cost from actual receipts."
 zg361pp.191.b:0 "Report gross savings and move hidden costs to manager debt."
 zg361pp.191.c:0 "Defer, but bind an owner, deadline and policy-debt receipt."
 zg361pp.9001.t:0 "361 Case Closed: Feedback bargaining and promise debt"
 zg361pp.9001.desc:0 "All receipts, resources and deadlines in this domain have closed. You may still hate the policy; at least its ledger now signs its name."
 zg361pp.9001.a:0 "File it. Continue mutually enabling each other next cycle."
