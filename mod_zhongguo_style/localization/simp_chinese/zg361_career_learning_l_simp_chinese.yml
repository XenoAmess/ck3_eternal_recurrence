l_simp_chinese:
 zg361_cl_digest_title:0 "本轮人才安排已经登记"
 zg361_cl_digest_desc:0 "官署已审结本轮人才流动与进修案。六宗涉及调任、试任、求调、挽留、旧部往来或培训旧约，均取得当事人具名答复；其余十六宗依既定章程直接办结，并逐案保留期限与回执。保护工时只有在当事人或主官处于战事时才可借用，无战事的申请按未履约入账。本轮已办结内部调任 [ROOT.Var('zg361_cl_portfolio_ah_completed')|0] 件、进修培养 [ROOT.Var('zg361_cl_portfolio_ai_completed')|0] 件；仍在履行期内的约定会在到期时另行呈报。"
 zg361_cl_digest_ack:0 "收存本轮人才案回执；不新增付款或期限。"
 zg361_cl_m314_title:0 "一纸异地调令"
 zg361_cl_m314_desc:0 "安置预算共二十金：官署公帑十五金、主官私库五金；其中迁费十金、临时津贴六金、家眷安置四金。本次考课档次不受这次答复影响。"
 zg361_cl_m314_route_a:0 "接受调任；公帑支十五金、主官私库支五金"
 zg361_cl_m314_route_b:0 "谢绝调任：不领取二十金，仍守本职且考课不改档"
 zg361_cl_m315_title:0 "先试九十日，再定去留"
 zg361_cl_m315_desc:0 "这次试任以九十日为限：原任官署保留四成功劳，新任官署记六成。你与两方官署都可因职事不合终止试任；按约回任不作低档论。"
 zg361_cl_m315_route_a:0 "开始九十日试任，按四六分记功劳"
 zg361_cl_m315_route_b:0 "不开始九十日试任，留在原职且不记低档"
 zg361_cl_m318_title:0 "两封求调书，两次落笔"
 zg361_cl_m318_desc:0 "本轮只受理两次正式求调。文书一经投出，日后即使撤回，也算用去一次；未曾递交便不占名额。"
 zg361_cl_m318_route_a:0 "递交求调文书，用去一次名额"
 zg361_cl_m318_route_b:0 "暂不递交，保留这次求调名额"
 zg361_cl_m319_title:0 "离任前的最后挽留"
 zg361_cl_m319_desc:0 "最后一份书面挽留仍没有兑现凭据。调任可在三十日内办结；挽留承诺若九十日仍未交付，便按失约结案，责任记在许诺者名下。"
 zg361_cl_m319_route_a:0 "拒绝挽留，启动三十日调任"
 zg361_cl_m319_route_b:0 "接受挽留；若九十日未兑现，按失约追责"
 zg361_cl_m321_title:0 "旧袍泽，也须两厢情愿"
 zg361_cl_m321_desc:0 "旧官署在离任案卷中夹了一张名帖，希望日后仍能联络。维持往来须征得你同意，并支出六金：官署公帑四金、主官私库二金；终止联络只删去往来名册，昔日案卷仍旧留存。"
 zg361_cl_m321_route_a:0 "收下名帖；公帑支四金、主官私库支二金"
 zg361_cl_m321_route_b:0 "退回名帖：不支六金，终止往来且保留昔日案卷"
 zg361_cl_m333_title:0 "学成之后，尚有一纸旧约"
 zg361_cl_m333_desc:0 "这次进修由官署支付公帑十八金，提名者另出六金。任职期满即可履清培训旧约；自愿提前离任须在九十日后归还十八金，若是官署裁撤则免于追偿。"
 zg361_cl_m333_route_a:0 "留下任职至旧约履清，不触发十八金追偿"
 zg361_cl_m333_route_b:0 "提前离任，九十日后归还十八金"
