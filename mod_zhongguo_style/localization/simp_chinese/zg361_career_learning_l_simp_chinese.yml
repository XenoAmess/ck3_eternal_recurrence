l_simp_chinese:
 zg361_cl_digest_title:0 "本轮人才安排已经登记"
 zg361_cl_digest_desc:0 "本轮人才流动与进修案卷已经汇齐：内部调任 [ROOT.Var('zg361_cl_portfolio_ah_completed')|0] 件，进修培养 [ROOT.Var('zg361_cl_portfolio_ai_completed')|0] 件。尚在履行期内的调任、试任与培训约定，将在到期时另行呈报。"
 zg361_cl_digest_ack:0 "收下案卷，照章续办。"
 zg361_cl_m314_title:0 "一纸异地调令"
 zg361_cl_m314_desc:0 "[ROOT.GetLiege.GetShortUIName] 派人送来一纸异地调令，并把二十金的安置预算写得分明：迁费十金、临时津贴六金、家眷安置四金。你可以接受这项安排，也可以谢绝；本次考课不会因此改档。"
 zg361_cl_m314_route_a:0 "接受附有安置条款的调任方案"
 zg361_cl_m314_route_b:0 "谢绝调任，仍守本职"
 zg361_cl_m315_title:0 "先试九十日，再定去留"
 zg361_cl_m315_desc:0 "新官署愿给你九十日试任：原任官署保留四成功劳，新任官署记六成；你与两方官署都可在职事不合时终止试任。若最终回任，试任不成也不会被记作低档。"
 zg361_cl_m315_route_a:0 "依约开始九十日试任"
 zg361_cl_m315_route_b:0 "职事不合，按约回任"
 zg361_cl_m318_title:0 "两封求调书，两次落笔"
 zg361_cl_m318_desc:0 "本轮你只有两次正式求调的机会。文书一经投出，日后即使撤回，也算用去一次；若现在不投，这次名额仍为你保留。"
 zg361_cl_m318_route_a:0 "递交文书，用去一次名额"
 zg361_cl_m318_route_b:0 "暂不递交，保留这次机会"
 zg361_cl_m319_title:0 "离任前的最后挽留"
 zg361_cl_m319_desc:0 "[ROOT.GetLiege.GetShortUIName] 命人送来最后一份书面挽留。拒绝之后，三十日调任程序便会启动；另一条路是留下，接受一份尚无兑现凭据的承诺，九十日后按失约结案，责任记在许诺者名下。"
 zg361_cl_m319_route_a:0 "拒绝挽留，启动三十日调任"
 zg361_cl_m319_route_b:0 "接受未兑现的挽留，九十日后追责"
 zg361_cl_m321_title:0 "旧袍泽，也须两厢情愿"
 zg361_cl_m321_desc:0 "离任之后，旧官署仍想与你保留一条联络。旧谊可以延续，却不能逼你应允；若退回名帖，往来名册会被删除，但昔日案卷不会随之抹去。"
 zg361_cl_m321_route_a:0 "收下名帖，容后往来"
 zg361_cl_m321_route_b:0 "退回名帖，就此别过"
 zg361_cl_m333_title:0 "学成之后，尚有一纸旧约"
 zg361_cl_m333_desc:0 "官署愿为你的进修支付公帑十八金，提名者另出六金。留下任职，便以所学履行旧约；若自愿提前离任，九十日后须归还十八金。若是官署裁撤，则免于追偿。"
 zg361_cl_m333_route_a:0 "留下任职，以所学偿约"
 zg361_cl_m333_route_b:0 "提前离任，归还余款"
