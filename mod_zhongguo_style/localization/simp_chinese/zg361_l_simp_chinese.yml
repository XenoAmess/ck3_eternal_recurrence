l_simp_chinese:
 # 游戏规则
 rule_zg361_enabled:0 "封臣绩效考核（361制）"
 setting_zg361_on:0 "开启"
 setting_zg361_on_desc:0 "天朝制公爵及以上领主定期考核直属在任官员，按361强制分布分出3.75/3.5/3.25；伯爵与男爵只被考核。"
 setting_zg361_off:0 "关闭"
 setting_zg361_off_desc:0 "直属官员不会进入新的 361 考核周期，也不会因本制度获得档位、奖惩或末位处置。"
 rule_zg361_frequency:0 "考核周期"
 setting_zg361_freq_yearly:0 "年度考核"
 setting_zg361_freq_yearly_desc:0 "每年一次绩效季。"
 setting_zg361_freq_three_year:0 "三年一考"
 setting_zg361_freq_three_year_desc:0 "每三年一次京察大计，古风古韵。"
 rule_zg361_bottom_ratio:0 "末位比例"
 setting_zg361_ratio_strict:0 "刚性361（10%）"
 setting_zg361_ratio_strict_desc:0 "末位名额按人数的 10% 向下取整；考核池达到 5 人时至少 1 人进入 3.25。"
 setting_zg361_ratio_relaxed:0 "松绑（5%）"
 setting_zg361_ratio_relaxed_desc:0 "末位名额按人数的 5% 向下取整，不设最低人数；不足 20 人时不会产生强制末位。"
 setting_zg361_ratio_off:0 "放养（0%）"
 setting_zg361_ratio_off_desc:0 "不再强制产生末位名额；考核、排名与其他档位仍照常进行。"
 # 决议组与决议
 decision_group_type_zg361:0 "绩效考核"
 zg361_review_now_decision:0 "提前启动本年度考核"
 zg361_review_now_decision_desc:0 "不等下一次京察召集，现在就提前启动本年度考核并冻结直属官员名册。本决议只开启与京察共用的考核流程，不举办“京察大计”，也不视为完成京察履责。自评、互评、校准与公示会在后续阶段依次推进，通常约三百三十日后出榜。每次发起至少间隔一年，且同一自然年最多结算一次。"
 zg361_review_now_decision_tooltip:0 "提前开启考核季并冻结至少一名直属在任官员；不举办京察，也不视为完成京察履责。"
 zg361_review_now_business_ready:0 "当前没有未办结的考核季，且至少有一名直属在任官员可受评。"
 zg361_review_now_decision_confirm:0 "提前开考"
 zg361_ratio_policy_decision:0 "调整末位比例"
 zg361_ratio_policy_title_strict:0 "调整末位比例·刚性10%"
 zg361_ratio_policy_title_relaxed:0 "调整末位比例·松绑5%"
 zg361_ratio_policy_title_off:0 "调整末位比例·不设末位"
 zg361_ratio_policy_decision_desc:0 "重新审定本层考核单元的强制末位口径。确认后将在案前列出三档方案；新口径从下一次配额计算起生效。"
 zg361_ratio_policy_decision_tooltip:0 "打开三档末位比例方案，并显示当前生效口径。"
 zg361_ratio_policy_decision_ready:0 "当前没有另一道末位比例调令等待入卷。"
 zg361_ratio_policy_decision_confirm:0 "召集廷议"
 zg361_ratio_policy_current_strict:0 "现行口径：刚性361（10%）。考核池达到五人时，至少一人进入3.25。"
 zg361_ratio_policy_current_relaxed:0 "现行口径：松绑（5%）。末位名额向下取整且不保底，不足二十人时为零。"
 zg361_ratio_policy_current_off:0 "现行口径：不设强制末位（0%）。考核、排名与其他档位照常进行。"
 zg361_ratio_policy_already_current:0 "此项已是现行口径。"
 zg361.54.t:0 "厘定末位比例"
 zg361.54.desc:0 "考功司呈上三份定额草案。你选定的口径从下一次配额计算起施行；本期已经冻结的案卷不作倒改。"
 zg361.54.a:0 "守刚性之制（10%）"
 zg361.54.a.tt:0 "按人数的10%向下取整；考核池达到五人时，至少保留一个3.25名额。"
 zg361.54.b:0 "改行松绑（5%）"
 zg361.54.b.tt:0 "按人数的5%向下取整且不保底；考核池不足二十人时不产生强制末位。"
 zg361.54.c:0 "不设强制末位（0%）"
 zg361.54.c.tt:0 "不强制产生3.25名额；考核、排名与其他档位照常进行。"
 # 角色互动
 zg361_appeal_interaction:0 "绩效申诉"
 zg361_appeal_interaction_desc:0 "对本周期考核结果提出正式申诉，请求复核。花费150影响力。"
 zg361_review_talk_interaction:0 "绩效沟通"
 zg361_review_talk_interaction_desc:0 "单独召见本周期已出榜的封臣，说明定档依据并安抚情绪。"
 zg361_recommend_interaction:0 "举荐"
 zg361_recommend_interaction_desc:0 "在本期独立互评窗口内，为同一有效战争、同一阵营中的同案同槽官员提交一次具名举荐。不得重复；成功提交会同时调整协作、事实与信用记录。条件不符时不收费、也不进入冷却。"
 zg361_slander_interaction:0 "攻讦"
 zg361_slander_interaction_desc:0 "在本期独立互评窗口内，对同一有效战争、同一阵营中的同案同槽官员提交一次具名负评。不得重复；成功提交才收取威望，并同时调整协作、事实与信用记录。"
 zg361_peer_submission_invalid_tt:0 "双方必须处于同一期有效考核案卷、同一场仍在进行的战争且同属一方；互评窗口须开启、名额未满，并且此前没有向该官员提交过记录。攻讦另需至少50威望。"
 zg361_purge_interaction:0 "末位处置·夺爵"
 zg361_purge_interaction_desc:0 "对连续两个周期 3.25 的官员执行末位淘汰：无暴政地夺去所持领地与官职；贤能制下还会损失大量贤能。"
 zg361_force_retire_interaction:0 "末位处置·勒令致仕"
 zg361_force_retire_interaction_desc:0 "对连续两个周期3.25的官员给个体面：勒令致仕，保留贤能。"
 zg361_adverse_action_appeal_pending_tt:0 "该官员必须仍是本期末位处置对象，且当前没有尚未裁决的申诉或独立复核。"
 # 修正（考绩档位）
 zg361_grade_375:0 "绩效3.75·超出预期"
 zg361_grade_375_desc:0 "本周期绩效考核结果：3.75。在结果、难度与影响范围上明显超出当前职级预期，已获晋升提名。"
 zg361_grade_35:0 "绩效3.5·符合预期"
 zg361_grade_35_desc:0 "本周期绩效考核结果：3.5。完成岗位要求，表现符合预期。"
 zg361_grade_325:0 "绩效3.25·待改进"
 zg361_grade_325_desc:0 "本周期绩效考核结果：3.25。四重问责：制度支持时地方国库扣50、个人金币扣25、制度支持时贤能扣60，以及有俸禄时一年俸禄减25%。"
 zg361_pip:0 "绩效改进计划"
 zg361_pip_desc:0 "本期定档为 3.25；下一考核周期若再次落入末档，将进入末位淘汰流程。"
 zg361_demoted:0 "降岗留用"
 zg361_demoted_desc:0 "末位处置从宽：保留任用但降低职级，俸禄减半，以观后效。"
 zg361_promotion_track:0 "晋升通道"
 zg361_promotion_track_desc:0 "连续两个周期达到 3.75 后，任命候选评分大幅提高，品级上限临时提升。"
 # 好感
 zg361_favored:0 "上官垂青"
 zg361_poor_review:0 "考绩不佳"
 zg361_annoyed:0 "申诉纠缠"
 zg361_purged:0 "被末位淘汰"
 zg361_forced_retire:0 "被迫致仕"
 zg361_merciful:0 "法外开恩"
 zg361_rigged:0 "考核黑幕"
 zg361_appeal_rejected:0 "申诉被驳回"
 zg361_talked:0 "绩效沟通"
 zg361_slandered_me:0 "攻讦构陷"
 zg361_jingcha_attended:0 "同赴京察"
 # 活动
 activity_zg361_jingcha:0 "京察大计"
 activity_zg361_jingcha_desc:0 "召集直属在任官员赴治所，当面核阅政绩并完成京察履责。活动真正落幕时，每名参会官员会对你增加 10 好感，持续两年并随时间衰减；实行贤能制者还会获得少量贤能。考核季随后仍按既定阶段推进。"
 activity_zg361_jingcha_host_desc:0 "主持京察大计，当面核阅直属属官政绩。办结时，参会官员会对你增加 10 好感，持续两年并随时间衰减；实行贤能制者还会获得少量贤能。活动不会立即生成最终排名。"
 activity_zg361_jingcha_guest_desc:0 "赴治所应考，接受直属领主当面考核。活动真正落幕后，你会对主办者增加 10 好感，持续两年并随时间衰减；实行贤能制时还会获得少量贤能。"
 activity_zg361_jingcha_selection_tooltip:0 "召集直属在任官员赴治所考核；办结时，参会官员会对你增加 10 好感，持续两年并随时间衰减，实行贤能制者另获少量贤能。"
 activity_zg361_jingcha_conclusion_desc:0 "京察差事已告一段落，履责记录已经入案；参会官员的好感与适用的贤能奖励已经结算，考核季将另行推进至校准与公示。"
 zg361_jingcha_province_desc:0 "于治所召开京察大计。"
 zg361_jingcha_phase:0 "京察"
 # 事件
 zg361.1.t:0 "你主持的考核：名册已定"
 zg361.1.desc:0 "这是你对本周期直属官员主持的绩效考核，并非上司对你本人的考评。考功司已按本层当前末位规则排定名册。\n\n本周期：超出预期 [TopScope.GetValue('zg361_n_375')|0] 人，符合预期 [TopScope.GetValue('zg361_n_35')|0] 人，待改进 [TopScope.GetValue('zg361_n_325')|0] 人；进入末位淘汰流程 [TopScope.GetValue('zg361_n_elim')|0] 人。\n\n你本人的绩效若由上司评定，会另发一份直接写明分数、绩效指标与名次的考绩告身。"
 zg361.1.a:0 "知道了。"
 zg361.2.t:0 "上司考定：3.75 · 超出预期"
 zg361.2.desc:0 "本轮考绩已经定档；考核人为 [zg361_reviewing_superior.GetShortUIName]。\n\n你的绩效：3.75（超出预期）\n绩效指标：[TopScope.GetValue('zg361_result_kpi')|0]　同组位次：第 [TopScope.GetValue('zg361_result_rank')|0] 名 / 共 [TopScope.GetValue('zg361_result_cohort_n')|0] 人\n\n你在结果、难度与影响范围上明显超出当前职级。相应贤能、地方国库与晋升提名奖励，会按你的职位和可用制度入账。"
 zg361.2.a:0 "谢主君栽培！"
 zg361.3.t:0 "上司考定：3.5 · 符合预期"
 zg361.3.desc:0 "本轮考绩已经定档；考核人为 [zg361_reviewing_superior.GetShortUIName]。\n\n你的绩效：3.5（符合预期）\n绩效指标：[TopScope.GetValue('zg361_result_kpi')|0]　同组位次：第 [TopScope.GetValue('zg361_result_rank')|0] 名 / 共 [TopScope.GetValue('zg361_result_cohort_n')|0] 人\n\n你正常完成了当前职级要求，表现符合预期。"
 zg361.3.a:0 "守住本分，来年再进一步。"
 zg361.4.t:0 "上司考定：3.25 · 待改进"
 zg361.4.desc:0 "本轮考绩已经定档；考核人为 [zg361_reviewing_superior.GetShortUIName]。\n\n你的绩效：3.25（待改进）\n绩效指标：[TopScope.GetValue('zg361_result_kpi')|0]　同组位次：第 [TopScope.GetValue('zg361_result_rank')|0] 名 / 共 [TopScope.GetValue('zg361_result_cohort_n')|0] 人\n\n你低于当前岗位预期，四重清算开始：地方国库（若有）扣50、个人金币扣25、制度支持时贤能扣60，并在有俸禄时将一年俸禄削减25%。绩效改进计划已经启动——再来一次，就是末位淘汰。"
 zg361.4.a:0 "认命。（压力减小）"
 zg361.4.b:0 "申诉！这考核有问题！（花费 150 影响力；基础三成，证据充分时四成机会翻案）"
 zg361.4.c:0 "摆烂。开摆。（压力减小，明年考核-10）"
 zg361.4.d:0 "奋发。明年拿结果说话。（压力增加，明年考核+10）"
 zg361.5.t:0 "末位淘汰名单"
 zg361.5.desc:0 "本周期有 [TopScope.GetValue('zg361_n_elim')|0] 名官员连续两个周期绩效3.25，按律当进入末位淘汰流程。名单摊在案头，朱笔在你手里。（也可在廷臣界面逐人处置。）\n\n如何处置？"
 zg361.5.a:0 "依律处置。（按政绩、好感、能力分别裁决：夺爵、致仕或降岗）"
 zg361.5.b:0 "法外开恩，全部降岗留用。（-100威望）"
 zg361.5.c:0 "从宽处置：未满三次者再观察一年；连续三次者立即降岗留用。（-50 威望）"
 zg361.6.t:0 "你被列入末位淘汰名单"
 zg361.6.desc:0 "连续两个3.25，末位淘汰的铡刀终于落到你头上。主君的属吏已经带着名册出门了。\n\n你还有最后一个窗口期。"
 zg361.6.a:0 "最后申诉！要求复核！（花费200影响力，四成机会改判降岗，失败则夺爵）"
 zg361.6.b:0 "散尽家财，上下打点。（花费300金币，改判降岗留用）"
 zg361.6.c:0 "认命致仕，体面退场。"
 zg361.6.d:0 "掀桌起兵！（建立独立派系，对抗主君）"
 zg361.10.t:0 "绩效校准会议"
 zg361.10.desc:0 "考功司的初排名单已经拟好：超出预期 [TopScope.GetValue('zg361_n_375')|0] 人，符合预期 [TopScope.GetValue('zg361_n_35')|0] 人，待改进 [TopScope.GetValue('zg361_n_325')|0] 人。\n\n公示之前，名单还压在你的案头。抬谁一手，踩谁一脚，全在朱笔一念之间——只是动手脚若被察觉，属官必议「考核黑幕」。"
 zg361.10.a:0 "名单无误，张榜公示。"
 zg361.10.b:0 "抬一个人：末名3.75与头名3.5互换。"
 zg361.10.c:0 "踩一个人：末名3.5打进3.25。"
 zg361.11.t:0 "朱批已定"
 zg361.11.desc:0 "你以朱笔将[zg361_calibration_promote_incoming.GetShortUIName]从3.50档抬入3.75档，并把[zg361_calibration_promote_outgoing.GetShortUIName]从3.75档降到3.50档。榜单会按这次交换公示。"
 zg361.11.a:0 "公示这次交换。"
 zg361.12.t:0 "朱批已定"
 zg361.12.desc:0 "你以朱笔将[zg361_calibration_demote_lowered.GetShortUIName]从3.50档降到3.25档，并把[zg361_calibration_demote_rescued.GetShortUIName]从3.25档救回3.50档。榜单会按这次交换公示。"
 zg361.12.a:0 "公示这次交换。"
 zg361.30.t:0 "野狗与小白兔"
 zg361.30.desc:0 "考功司的密折另附了一页双轨评语：业绩出众但价值观堪忧的[TopScope.GetValue('zg361_n_dog')|0]名「野狗」官员，以及忠诚可嘉但业绩拉胯的[TopScope.GetValue('zg361_n_rabbit')|0]名「小白兔」官员。\n\n两类人都不是长期保留对象。如何处置？"
 zg361.30.a:0 "维持现状：野狗本轮不另立观察案，小白兔好言安抚。"
 zg361.30.b:0 "严惩野狗、劝退小白兔。（+50威望；野狗扣贤能、进绩效改进计划；小白兔致仕）"
 zg361_scoreboard_open:0 "绩效榜与制度账本"
 zg361_scoreboard_open_tooltip:0 "打开最近一期官员绩效榜，或切换到已定案制度及组织影响。"
 zg361_scoreboard_title:0 "天朝绩效榜与制度账本"
 zg361_scoreboard_year:0 "考核年份"
 zg361_scoreboard_total:0 "参评人数"
 zg361_scoreboard_grade_375:0 "#P 3.75#!"
 zg361_scoreboard_grade_35:0 "#V 3.5#!"
