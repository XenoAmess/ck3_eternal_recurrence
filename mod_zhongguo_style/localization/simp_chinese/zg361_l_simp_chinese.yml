 zg361.40.t:0 "京察之期"
 zg361.40.desc:0 "吏籍、钱粮与功过簿已俱备。按制，我应召集直属在任官员赴治所举行京察，且此项公务不得向国库或私帑取费。\n\n若我抗命不办，直属上司将视之为重大失察；若我已无上司，损失的则是朝廷制度的威信。"
 zg361.40.a:0 "依例举办京察"
 zg361.40.a.tt:0 "打开免费的京察活动规划器。须在 300 日内办结；只有活动真正落幕才算履责，并结算参会官员对主办者的 10 好感与适用的少量贤能奖励。"
 zg361.40.b:0 "今年不办，悉听处分"
 zg361.40.b.tt:0 "有直属上司：对方好感降低；只有对方是本期合格考核人时，你下次受考核的绩效指标才扣 50（一次）。\n独立最高领主：扣 200 威望，不伪造自我绩效。"
