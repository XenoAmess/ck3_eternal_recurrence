 zg361_scoreboard_col_status:0 "状态"
 zg361_scoreboard_hint:0 "点击任一官员可打开人物界面；名单取自最近一期公示，离任者仍保留在本期榜上。"
 zg361_scoreboard_tab_managed:0 "所辖官员"
 zg361_scoreboard_tab_received:0 "本人所属考核单元"
 zg361_scoreboard_reviewer:0 "考核领主"
