 zg361_refused_jingcha:0 "抗命拒办京察"
 zg361.40.t:0 "京察之期"
 zg361.40.desc:0 "吏籍、钱粮与功过簿已俱备。按制，我应召集直属在任官员赴治所举行京察，且此项公务不得向国库或私帑取费。\n\n若我抗命不办，直属上司将视之为重大失察；若我已无上司，损失的则是朝廷制度的威信。"
 zg361.40.a:0 "依例举办京察"
 zg361.40.a.tt:0 "打开免费的京察活动规划器。须在300日内办结；只有活动真正落幕才算履责。"
 zg361.40.b:0 "今年不办，悉听处分"
 zg361.40.b.tt:0 "有直属上司：上司对你的好感降低，且你下次受考核时 KPI 扣 50（只生效一次）。\n独立最高领主：扣200威望，不伪造自我绩效。"
 zg361.41.t:0 "京察逾期"
 zg361.41.desc:0 "京察召集令已逾期未结。"
 zg361.41.a:0 "履责记录已结算"
