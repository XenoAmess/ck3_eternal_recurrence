 zg361_jingcha_phase_desc:0 "直属属官赴治所述职，由领主当面校阅政绩。"
 activity_zg361_jingcha_destination_selection:0 "选择京察举办地"
 activity_zg361_jingcha_guest_help_text:0 "直属在任官员将受邀赴治所参加考核。"
 activity_zg361_jingcha_cooldown:0 "京察大计尚在冷却期"
 activity_zg361_jingcha_predicted_cost:0 "京察是法定公务，不消耗国库财富或个人金币。"
 activity_zg361_jingcha_host_an_a:0 "$host_activity_a$"
 zg361_refused_jingcha:0 "抗命拒办京察"
 zg361.40.t:0 "京察之期"
 zg361.40.desc:0 "吏籍、钱粮与功过簿已俱备。按制，我应召集直属在任官员赴治所举行京察，且此项公务不得向国库或私帑取费。\n\n若我抗命不办，直属上司将视之为重大失察；若我已无上司，损失的则是朝廷制度的威信。"
 zg361.40.a:0 "依例举办京察"
 zg361.40.a.tt:0 "打开免费的京察活动规划器。须在300日内办结；只有活动真正落幕才算履责。"
 zg361.40.b:0 "今年不办，悉听处分"
 zg361.40.b.tt:0 "有直属上司：上司对你的好感降低，且你下次受考核时 KPI 扣 50（只生效一次）。\n独立最高领主：扣200威望，不伪造自我绩效。"
 zg361.41.t:0 "京察逾期"
 zg361.41.desc:0 "京察召集令已逾期未结。"
 zg361.41.a:0 "履责记录已结算"
 # v0.4 二期首纵切：KPI证据、正式送达、个人清算单
 zg361_view_result_statement_decision:0 "查看个人考核清算单"
 zg361_view_result_statement_decision_desc:0 "重新打开最近一期已冻结的个人考核案卷：事实档、最终档、KPI分项、送达状态与实际清算收据一并可查。"
 zg361_view_result_statement_decision_tooltip:0 "查看本人最近一期考核清算单；不会重新结算。"
 zg361_view_result_statement_decision_confirm:0 "调阅案卷"
 zg361.50.t:0 "3.25绩效通知：请签收"
 zg361.50.desc:0 "[zg361_reviewing_superior.GetShortUIName]送来了你的正式考绩告身。\n\n最终绩效：3.25（待改进）\n冻结 KPI：[TopScope.GetValue('zg361_notice_kpi')|0]　同组位次：第 [TopScope.GetValue('zg361_notice_rank')|0] 名 / 共 [TopScope.GetValue('zg361_notice_cohort')|0] 人\n事实档代码：[TopScope.GetValue('zg361_notice_absolute_grade')|0]（3=3.75，2=3.5，1=3.25）\n\n你可以签收，也可以写下异议再签。拒绝签字只会把送达改为七日后见证送达，不会让结果、PIP或四重清算消失。毕竟大厂的经典技术是：「你可以不同意，但系统可以显示已送达。」"
 zg361.50.a:0 "签收。收到不等于喜欢。"
 zg361.50.b:0 "签收并保留异议。签字不等于认同。"
 zg361.50.c:0 "拒绝签收。（七日后见证送达）"
 zg361.51.t:0 "3.25绩效通知：见证送达"
 zg361.51.desc:0 "拒收后的见证送达已结算。"
 zg361.52.t:0 "绩效申诉时钟"
 zg361.52.desc:0 "本案卷的正式申诉期已届满。"
 zg361.53.t:0 "个人考核清算单"
 zg361.53.desc:0 "考核人：[zg361_reviewing_superior.GetShortUIName]\n冻结 KPI：[TopScope.GetValue('zg361_stmt_kpi')|0]　同组位次：第 [TopScope.GetValue('zg361_stmt_rank')|0] 名 / 共 [TopScope.GetValue('zg361_stmt_cohort')|0] 人"
 zg361.53.absolute_375:0 "\n#bold 事实档：3.75（绝对事实超出预期）#!"
 zg361.53.absolute_35:0 "\n#bold 事实档：3.5（绝对事实符合预期）#!"
 zg361.53.absolute_325:0 "\n#bold 事实档：3.25（绝对事实待改进）#!"
 zg361.53.grade_375:0 "最终档：#P 3.75（超出预期）#!"
 zg361.53.grade_35:0 "最终档：#V 3.5（符合预期）#!"
 zg361.53.grade_325:0 "最终档：#N 3.25（待改进）#!"
 zg361.53.reason_0:0 "定档理由：事实档与最终档一致。"
 zg361.53.reason_1:0 "定档理由：校准会中被挤出 3.75 名额。"
 zg361.53.reason_2:0 "定档理由：校准会中被抬入 3.75 名额。"
 zg361.53.reason_3:0 "定档理由：校准会将你调整为 3.25。"
 zg361.53.reason_4:0 "定档理由：校准会将你从 3.25 名额中换出。"
