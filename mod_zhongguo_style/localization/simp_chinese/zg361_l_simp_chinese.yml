 zg361_scoreboard_reviewer:0 "考核人"
 zg361_scoreboard_col_dossier:0 "案卷"
 zg361_scoreboard_detail_open:0 "案卷"
 zg361_scoreboard_detail_open_tooltip:0 "在考核榜内查看这名官员的冻结绩效案卷。"
 zg361_scoreboard_detail_back:0 "返回名单"
 zg361_scoreboard_detail_tab_facts:0 "事实"
 zg361_scoreboard_detail_tab_peer:0 "互评"
 zg361_scoreboard_detail_tab_quota:0 "配额"
 zg361_scoreboard_detail_tab_audit:0 "案卷记录"
 zg361_scoreboard_detail_facts_hint:0 "这里只读取本轮已经封存的事实、自评与暂定评价；后续变化不会改写旧案。"
 zg361_scoreboard_detail_peer_hint:0 "这里只显示匿名封存后的汇总结果；本人收到的案卷不会记录评价者身份、原话或回避人身份。"
 zg361_scoreboard_detail_quota_hint:0 "本轮封存的校准依据会说明暂定评价如何形成最终档位。"
 zg361_scoreboard_detail_audit_hint:0 "考核结果、案卷归属、封存状态与阶段确认记录会一并留档，后续变化不会改写旧案。"
 zg361_scoreboard_detail_unavailable:0 "当前没有可供查阅的冻结记录"
 zg361_scoreboard_detail_field_kpi_frozen:0 "冻结绩效指标总分"
 zg361_scoreboard_detail_field_values_frozen:0 "冻结价值观分"
 zg361_scoreboard_detail_field_evidence_governance:0 "证据：治理成果"
 zg361_scoreboard_detail_field_evidence_capability:0 "证据：个人能力"
