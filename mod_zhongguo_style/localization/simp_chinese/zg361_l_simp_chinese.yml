 zg361_scoreboard_col_grade:0 "绩效"
 zg361_scoreboard_col_streak:0 "连续次数"
 zg361_scoreboard_col_status:0 "状态"
 zg361_scoreboard_hint:0 "官员页可点人物查看冻结案卷；制度页只列政策账本，不含官员行。"
 zg361_scoreboard_tab_managed:0 "所辖官员"
