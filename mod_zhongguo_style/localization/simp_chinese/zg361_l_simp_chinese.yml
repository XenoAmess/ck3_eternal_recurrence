 zg361.50.desc:0 "正式考绩告身已经送达；考核人为 [zg361_reviewing_superior.GetShortUIName]。\n\n最终绩效：3.25（待改进）\n事实评价：3.25（待改进）\n冻结绩效指标：[TopScope.GetValue('zg361_notice_kpi')|0]　同组位次：第 [TopScope.GetValue('zg361_notice_rank')|0] 名 / 共 [TopScope.GetValue('zg361_notice_cohort')|0] 人\n\n签收只确认收到，不代表认同；拒收时，告身会在七日后改由见证人送达。无论如何回应，既定档位、清算与改进安排都不会自动撤销。"
 zg361.50.a:0 "签收。收到不等于喜欢。"
