 zg361_scoreboard_dash:0 "—"
 zg361_scoreboard_status_promotion:0 "#P 晋升通道#!"
 zg361_scoreboard_status_pip:0 "#N 改进计划#!"
 zg361_scoreboard_col_rank:0 "名次"
 zg361_scoreboard_col_official:0 "官员 / 官职"
