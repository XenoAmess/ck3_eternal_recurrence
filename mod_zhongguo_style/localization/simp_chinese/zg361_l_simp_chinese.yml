 setting_zg361_on_desc:0 "天朝制公爵及以上领主定期考核直属在任官员，按361强制分布分出3.75/3.5/3.25；伯爵与男爵只被考核。"
 setting_zg361_off:0 "关闭"
 setting_zg361_off_desc:0 "关闭绩效考核系统。"
 rule_zg361_frequency:0 "考核周期"
 setting_zg361_freq_yearly:0 "年度考核"
 setting_zg361_freq_yearly_desc:0 "每年一次绩效季。"
 setting_zg361_freq_three_year:0 "三年一考"
 setting_zg361_freq_three_year_desc:0 "每三年一次京察大计，古风古韵。"
 rule_zg361_bottom_ratio:0 "末位比例"
 setting_zg361_ratio_strict:0 "刚性361（10%）"
 setting_zg361_ratio_strict_desc:0 "361的打分要坚持：哪怕全员达标，只要考核池够大，就必须有人背3.25。"
 setting_zg361_ratio_relaxed:0 "松绑（5%）"
 setting_zg361_ratio_relaxed_desc:0 "361的打分要坚持，但刚性1比例需要松绑。"
 setting_zg361_ratio_off:0 "放养（0%）"
 setting_zg361_ratio_off_desc:0 "不再强制末位，考核沦为形式主义。"
 # 决议组与决议
 decision_group_type_zg361:0 "绩效考核"
 zg361_review_now_decision:0 "立即开展绩效考核"
 zg361_review_now_decision_desc:0 "不等年度绩效季，现在就命考功司开榜排名。你每个自然年只能结算一次考核；本年度已纳入你结算考核的直属官员不会重复评定。"
 zg361_review_now_decision_tooltip:0 "立即考核至少一名直属在任官员；同一自然年不能再次结算考核。"
 zg361_review_now_decision_confirm:0 "开榜！"
 zg361_ratio_strict_decision:0 "末位比例：刚性361（10%）"
 zg361_ratio_strict_decision_desc:0 "坚持强制分布：考核池五人以上时，必须有人背3.25。"
 zg361_ratio_strict_decision_tooltip:0 "将本层考核单元的强制末位比例设为10%。"
 zg361_ratio_strict_decision_confirm:0 "从严！"
 zg361_ratio_relaxed_decision:0 "末位比例：松绑（5%）"
 zg361_ratio_relaxed_decision_desc:0 "361的打分要坚持，但刚性1比例需要松绑。"
 zg361_ratio_relaxed_decision_tooltip:0 "将本层考核单元的强制末位比例设为5%。"
 zg361_ratio_relaxed_decision_confirm:0 "松绑"
 zg361_ratio_off_decision:0 "末位比例：放养（0%）"
 zg361_ratio_off_decision_desc:0 "不再强制末位。考核沦为形式主义。"
 zg361_ratio_off_decision_tooltip:0 "取消本层考核单元的强制末位名额。"
 zg361_ratio_off_decision_confirm:0 "放养"
 # 角色互动
 zg361_appeal_interaction:0 "绩效申诉"
 zg361_appeal_interaction_desc:0 "对本周期考核结果提出正式申诉，请求复核。花费150影响力。"
 zg361_review_talk_interaction:0 "绩效沟通"
 zg361_review_talk_interaction_desc:0 "与本周期已出榜的封臣进行一对一绩效沟通，安抚情绪。"
 zg361_recommend_interaction:0 "举荐"
 zg361_recommend_interaction_desc:0 "向共同的直属上官举荐这位同侪的政绩：对方下周期考核+10。"
 zg361_slander_interaction:0 "攻讦"
 zg361_slander_interaction_desc:0 "上书攻讦这位同侪：七成让对方下周期考核-15；若被看穿，反噬自己。"
 zg361_purge_interaction:0 "末位处置·夺爵"
 zg361_purge_interaction_desc:0 "对连续两个周期3.25的官员执行末位淘汰：剥夺官职（合法理由，无暴政）。"
 zg361_force_retire_interaction:0 "末位处置·勒令致仕"
 zg361_force_retire_interaction_desc:0 "对连续两个周期3.25的官员给个体面：勒令致仕，保留贤能。"
 # 修正（考绩档位）
 zg361_grade_375:0 "绩效3.75·超出预期"
 zg361_grade_375_desc:0 "本周期绩效考核结果：3.75。在结果、难度与影响范围上明显超出当前职级预期，已获晋升提名。"
 zg361_grade_35:0 "绩效3.5·符合预期"
 zg361_grade_35_desc:0 "本周期绩效考核结果：3.5。正常完成岗位要求。你做得很好，继续保持。"
 zg361_grade_325:0 "绩效3.25·待改进"
 zg361_grade_325_desc:0 "本周期绩效考核结果：3.25。四重问责：制度支持时地方国库扣50、个人金币扣25、制度支持时贤能扣60，以及有俸禄时一年俸禄减25%。"
 zg361_pip:0 "绩效改进计划"
 zg361_pip_desc:0 "已纳入绩效改进计划（PIP）。连续两个周期3.25将进入末位淘汰流程。"
 zg361_demoted:0 "降岗留用"
 zg361_demoted_desc:0 "末位淘汰从宽处置：降岗留用，俸禄减半，以观后效。"
 zg361_promotion_track:0 "晋升通道"
 zg361_promotion_track_desc:0 "连续两个周期3.75，晋升通道开启：任命候选人分数大幅提高，品级上限临时提升。"
 # 好感
 zg361_favored:0 "上官垂青"
 zg361_poor_review:0 "考绩不佳"
 zg361_annoyed:0 "申诉纠缠"
 zg361_purged:0 "被末位淘汰"
 zg361_forced_retire:0 "被迫致仕"
 zg361_merciful:0 "法外开恩"
 zg361_rigged:0 "考核黑幕"
 zg361_appeal_rejected:0 "申诉被驳回"
 zg361_talked:0 "绩效沟通"
 zg361_slandered_me:0 "攻讦构陷"
 zg361_jingcha_attended:0 "京察同朝"
 # 活动
 activity_zg361_jingcha:0 "京察大计"
 activity_zg361_jingcha_desc:0 "召集直属在任官员赴治所，当面考核政绩。京察落幕之时，即刻开榜排名。"
 activity_zg361_jingcha_host_desc:0 "主持京察大计，当面考核直属属官政绩，落幕时立即开榜。"
 activity_zg361_jingcha_guest_desc:0 "赴治所应考，接受直属领主当面考核。"
 activity_zg361_jingcha_selection_tooltip:0 "召集直属在任官员赴治所考核。"
 activity_zg361_jingcha_conclusion_desc:0 "京察大计已落下帷幕，考核结果张榜公示。"
 zg361_jingcha_province_desc:0 "于治所召开京察大计。"
 zg361_jingcha_phase:0 "京察"
 # 事件
 zg361.1.t:0 "你主持的考核：名册已定"
 zg361.1.desc:0 "这是你对本周期直属官员主持的绩效考核，并非上司对你本人的考评。考功司已按本层当前末位规则排定名册。\n\n本周期：超出预期 [TopScope.GetValue('zg361_n_375')|0] 人，符合预期 [TopScope.GetValue('zg361_n_35')|0] 人，待改进 [TopScope.GetValue('zg361_n_325')|0] 人；进入末位淘汰流程 [TopScope.GetValue('zg361_n_elim')|0] 人。\n\n你本人的绩效若由上司评定，会另发一份直接写明分数、KPI与名次的考绩告身。"
 zg361.1.a:0 "知道了。"
 zg361.2.t:0 "上司考定：3.75 · 超出预期"
 zg361.2.desc:0 "[zg361_reviewing_superior.GetShortUIName]已在本轮考核中为你定档。\n\n你的绩效：3.75（超出预期）\nKPI：[TopScope.GetValue('zg361_result_kpi')|0]　同组位次：第 [TopScope.GetValue('zg361_result_rank')|0] 名 / 共 [TopScope.GetValue('zg361_result_cohort_n')|0] 人\n\n你在结果、难度与影响范围上明显超出当前职级。相应贤能、地方国库与晋升提名奖励，会按你的职位和可用制度入账。"
 zg361.2.a:0 "谢主君栽培！"
 zg361.3.t:0 "上司考定：3.5 · 符合预期"
 zg361.3.desc:0 "[zg361_reviewing_superior.GetShortUIName]已在本轮考核中为你定档。\n\n你的绩效：3.5（符合预期）\nKPI：[TopScope.GetValue('zg361_result_kpi')|0]　同组位次：第 [TopScope.GetValue('zg361_result_rank')|0] 名 / 共 [TopScope.GetValue('zg361_result_cohort_n')|0] 人\n\n你正常完成了当前职级应该完成的工作。不好不坏，不上不下。"
 zg361.3.a:0 "……继续努力。"
 zg361.4.t:0 "上司考定：3.25 · 待改进"
 zg361.4.desc:0 "[zg361_reviewing_superior.GetShortUIName]已在本轮考核中为你定档。\n\n你的绩效：3.25（待改进）\nKPI：[TopScope.GetValue('zg361_result_kpi')|0]　同组位次：第 [TopScope.GetValue('zg361_result_rank')|0] 名 / 共 [TopScope.GetValue('zg361_result_cohort_n')|0] 人\n\n你低于当前岗位预期，四重清算开始：地方国库（若有）扣50、个人金币扣25、制度支持时贤能扣60，并在有俸禄时将一年俸禄削减25%。绩效改进计划已经启动——再来一次，就是末位淘汰。"
 zg361.4.a:0 "认命。（压力减小）"
 zg361.4.b:0 "申诉！这考核有问题！（花费150影响力，三成机会翻案）"
 zg361.4.c:0 "摆烂。开摆。（压力减小，明年考核-10）"
 zg361.4.d:0 "奋发。明年拿结果说话。（压力增加，明年考核+10）"
 zg361.5.t:0 "末位淘汰名单"
 zg361.5.desc:0 "本周期有 [TopScope.GetValue('zg361_n_elim')|0] 名官员连续两个周期绩效3.25，按律当进入末位淘汰流程。名单摊在案头，朱笔在你手里。（也可在廷臣界面逐人处置。）\n\n如何处置？"
 zg361.5.a:0 "依律处置。（按政绩、好感、能力分别裁决：夺爵、致仕或降岗）"
 zg361.5.b:0 "法外开恩，全部降岗留用。（-100威望）"
 zg361.5.c:0 "网开一面，再观察一年。（-50威望，众人感念宽仁）"
 zg361.6.t:0 "你被列入末位淘汰名单"
 zg361.6.desc:0 "连续两个3.25，末位淘汰的铡刀终于落到你头上。主君的属吏已经带着名册出门了。\n\n你还有最后一个窗口期。"
 zg361.6.a:0 "最后申诉！要求复核！（花费200影响力，四成机会改判降岗，失败则夺爵）"
 zg361.6.b:0 "散尽家财，上下打点。（花费300金币，改判降岗留用）"
 zg361.6.c:0 "认命致仕，体面退场。"
 zg361.6.d:0 "掀桌起兵！（建立独立派系，对抗主君）"
 zg361.10.t:0 "绩效校准会议"
 zg361.10.desc:0 "考功司的初排名单已经拟好：超出预期 [TopScope.GetValue('zg361_n_375')|0] 人，符合预期 [TopScope.GetValue('zg361_n_35')|0] 人，待改进 [TopScope.GetValue('zg361_n_325')|0] 人。\n\n公示之前，名单还压在你的案头。抬谁一手，踩谁一脚，全在朱笔一念之间——只是动手脚若被察觉，属官必议「考核黑幕」。"
 zg361.10.a:0 "名单无误，张榜公示。"
 zg361.10.b:0 "抬一个人：末名3.75与头名3.5互换。"
 zg361.10.c:0 "踩一个人：末名3.5打进3.25。"
 zg361.11.t:0 "朱批已定"
 zg361.11.desc:0 "你提起朱笔，把榜单末尾那个名字轻轻勾了上去。被顶下来的人不会知道，上座的人昨夜改了主意。"
 zg361.11.a:0 "公示结果。"
 zg361.12.t:0 "朱批已定"
 zg361.12.desc:0 "你提起朱笔，在名单边缘添了一个名字。总有人要背这个3.25——为什么不能是他？"
 zg361.12.a:0 "公示结果。"
 zg361.20.t:0 "绩效考核"
 zg361.20.desc:0 "绩效考核进行中。"
 zg361.20.a:0 "继续。"
 zg361.30.t:0 "野狗与小白兔"
 zg361.30.desc:0 "考功司的密折另附了一页双轨评语：业绩 [TopScope.GetValue('zg361_n_dog')|0] 条「野狗」——业绩出众但价值观堪忧；[TopScope.GetValue('zg361_n_rabbit')|0] 只「小白兔」——忠诚可嘉但业绩拉胯。\n\n两类人都不是长期保留对象。如何处置？"
 zg361.30.a:0 "宽严相济：野狗留用观察，小白兔好言安抚。"
 zg361.30.b:0 "严惩野狗、劝退小白兔。（+50威望；野狗扣贤能、入PIP，小白兔劝退致仕）"
 zg361_scoreboard_open:0 "考核榜"
 zg361_scoreboard_open_tooltip:0 "打开最近一期已经公示的官员考核榜。"
