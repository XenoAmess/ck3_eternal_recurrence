 zg361workforceremediationfact.1.t:0 "空缺仍记得那次拒绝"
 zg361workforceremediationfact.1.desc:0 "[scope:zg361_workforce_remediation_fact_ticket_subject.GetShortUIName] 拒绝录用已经 30 日。只有把那次拒绝暴露的问题逐项记清，并确认同一个问题确已整改，冻结编制才有资格释放。计划、承诺和一枚空勾都不是完成回执。"
 zg361workforceremediationfact.1.complete:0 "确认整改已完成并通过核验"
 zg361workforceremediationfact.1.fail:0 "如实记录整改失败"
 zg361workforceremediationfact.1.reason_pay:0 "冻结整改项：以候选人能够复核的新条款纠正报酬不足。"
 zg361workforceremediationfact.1.reason_role:0 "冻结整改项：以候选人能够复核的新条款纠正岗位或权限不符。"
 zg361workforceremediationfact.1.reason_move:0 "冻结整改项：以候选人能够复核的新条款纠正调动或报到条件。"
 zg361workforceremediationfact.1.reason_unknown:0 "来源没有给出有效拒绝类别，不得声称整改已经完成。"
