l_simp_chinese:
 zg361wad.referral.t:0 "内推必须有亲笔署名"
 zg361wad.referral.desc:0 "你是候选人 [scope:zg361_wad_referral_subject_scope.GetShortUIName] 的实名内推人。请公开关系并留下绑定本案的回执，或者明确否认；任何经理都不能替你落款。"
 zg361wad.referral.submit:0 "提交我的内推，并公开关系"
 zg361wad.referral.decline:0 "这份内推不是我提交的"
 zg361wad.vote.t:0 "封存你自己的面试票"
 zg361wad.vote.desc:0 "你是候选人 [scope:zg361_wad_panel_subject_scope.GetShortUIName] 的三名独立评委之一。复盘开始前，请亲自写下判断；回执会把这张票与你和这名候选人一并冻结。"
 zg361wad.vote.a:0 "证据充分：推进候选人"
 zg361wad.vote.b:0 "证据混合：继续审查"
 zg361wad.vote.c:0 "证据不足：不予推进"
 zg361wad.offer.t:0 "这份录用邀约只能由你回答"
 zg361wad.offer.desc:0 "[ROOT.MakeScope.Var('zg361_wad_offer_source_owner').Char.GetShortUIName] 已向你送达录用邀约。当前游戏事实没有在本卡提供更细的薪资或权限清单，因此只有在现有提议足够时才接受；否则应写明真正阻止任命的类别。直属上司不能替你回答。"
 zg361wad.offer.accept:0 "接受录用邀约"
 zg361wad.offer.refuse_pay:0 "拒绝：报酬不足"
 zg361wad.offer.refuse_role:0 "拒绝：岗位或权限不符"
 zg361wad.offer.refuse_move:0 "拒绝：调动或报到条件不可接受"
