l_simp_chinese:
 zg361ip.result.ok:0 "将这份结论封入簿册"
 zg361ip.190.t:0 "事故余波入册"
 zg361ip.190.desc:0 "本轮事故已经收尾。谁在值守、事态有多重、何时发生转折、补救交给谁，都已逐项核清；受评官员在处置中留下的得失，将随下一轮考核一并呈报。"
 zg361ip.290.t:0 "积弊清理到期"
 zg361ip.290.desc:0 "本轮清理旧务的期限已经届满。反复耗费的人力、累积的债务、留出的偿还时间、验收门槛与离岗交接都有了落款；下一轮复核将据此判断积弊是否真的减轻。"
 zg361ip.390.t:0 "共享底座各归其账"
 zg361ip.390.desc:0 "共享底座的本轮改造已经收尾。哪些团队采用、谁承担迁移、共同花费多少、贡献如何分配以及故障牵连到谁，均已各自记账；任何一方都不能再拿总成绩遮去自己的得失。"
