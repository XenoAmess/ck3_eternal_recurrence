 zg361ip.result.ok:0 "归档此案；下轮据此核算功过。"
 zg361ip.190.t:0 "事故余波入册"
 zg361ip.190.desc:0 "事故处置已经结案。在[zg361_ip_result_subject.GetShortUIName]经手的事故响应中，值守人、事态轻重、转折时点与补救责任均已逐项核清；此人应得的功过将随下一轮考核呈报。"
 zg361ip.290.t:0 "积弊清理到期"
 zg361ip.290.desc:0 "旧务整治已经到了核验日。[zg361_ip_result_subject.GetShortUIName]名下反复耗费的人力、累积债务、偿还期限、验收门槛与离岗交接均有落款；下一轮考核将据此判断此人是否真正减轻积弊。"
 zg361ip.390.t:0 "共享底座各归其账"
 zg361ip.390.desc:0 "共享底座的改造已经结案。与[zg361_ip_result_subject.GetShortUIName]有关的采用范围、迁移责任、共同花费、贡献归属与故障牵连均已分别记账；下一轮考核只按此人应负的得失入账。"
