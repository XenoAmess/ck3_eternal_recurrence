l_simp_chinese:
 zg361p3.229.t:0 "指标字典归谁管"
 zg361p3.229.desc:0 "没有口径主人的指标，就是一个带分母的口号。先冻结谁能定义、谁要为改口径签字。"
 zg361p3.229.a:0 "指定一名口径责任人。"
 zg361p3.229.b:0 "责任人与数据管家双签。"
 zg361p3.229.c:0 "交给委员会集体负责。"
 zg361p3.230.t:0 "两张看板，一个数字"
 zg361p3.230.desc:0 "两套数据源打起来了。考核需要一条可追溯的对账规则，而不是挑那张更好看的截图。"
 zg361p3.230.a:0 "采用预先指定的权威源。"
 zg361p3.230.b:0 "联合对账并公开差额。"
 zg361p3.230.c:0 "暂缓该指标并记录不确定性。"
 zg361p3.231.t:0 "分母怎么又变了"
 zg361p3.231.desc:0 "分母一改，什么 KPI 都能被救活。校准前先决定新旧版本如何共存。"
 zg361p3.231.a:0 "按新分母重算两个时期。"
 zg361p3.231.b:0 "新旧口径并列展示。"
 zg361p3.231.c:0 "本周期继续沿用旧分母。"
 zg361p3.232.t:0 "表里少了一块"
 zg361p3.232.desc:0 "缺失数据不能靠沉默填平：人工回填规则和估算误差都要有人署名。"
 zg361p3.232.a:0 "抽样审计后回填。"
 zg361p3.232.b:0 "插补并展示误差带。"
 zg361p3.232.c:0 "保留缺口，不假装完整。"
 zg361p3.233.t:0 "谁能看见这张看板"
 zg361p3.233.desc:0 "看不见数据，就只能靠猜绩效。为被考核者冻结一条可查询的可见路径。"
 zg361p3.233.a:0 "开放完整看板。"
 zg361p3.233.b:0 "按职责开放明细，并保留查询通道。"
 zg361p3.233.c:0 "只开放签字后的摘要。"
 zg361p3.234.t:0 "领先指标与滞后结果"
 zg361p3.234.desc:0 "把过程信号和最终结果分账，别让迟到的结果倒改已经发生的工作。"
 zg361p3.234.a:0 "领先信号优先。"
 zg361p3.234.b:0 "过程与结果各半。"
 zg361p3.234.c:0 "已验证结果优先。"
 zg361p3.235.t:0 "主指标也得系安全带"
 zg361p3.235.desc:0 "冲上主指标却把质量撞碎，不叫交付。开跑前先冻结护栏权重。"
 zg361p3.235.a:0 "主指标与护栏各半。"
 zg361p3.235.b:0 "主指标六、护栏四。"
 zg361p3.235.c:0 "允许有限度偏向主指标。"
 zg361p3.236.t:0 "KPI 悬崖"
 zg361p3.236.desc:0 "一个小数点不该把一年努力清零。结果出来前，先把计分曲线锁死。"
 zg361p3.236.a:0 "采用连续计分。"
 zg361p3.236.b:0 "阈值与部分得分混合。"
 zg361p3.236.c:0 "保留硬悬崖并承担风险。"
 zg361p3.237.t:0 "截最美的一段"
 zg361p3.237.desc:0 "好看的时间窗也可能是挑数据。现在就登记观察窗和对照期。"
 zg361p3.237.a:0 "使用预注册完整时间窗。"
 zg361p3.237.b:0 "完整窗与精选窗并列。"
 zg361p3.237.c:0 "允许截取，但挂上审计标记。"
 zg361p3.240.t:0 "大家都想抢这批样本"
 zg361p3.240.desc:0 "同一批人不能同时给两支团队当“纯净样本”。要么占槽，要么切分，要么承认污染。"
 zg361p3.240.a:0 "占用一个独享样本槽。"
 zg361p3.240.b:0 "占用一个槽并签字切分。"
 zg361p3.240.c:0 "排队等待，不声称纯净实验。"
 zg361p3.238.t:0 "热闹不等于价值"
 zg361p3.238.desc:0 "流量可以很热闹，最终价值却原地踏步。两本账都结，别只奖嗓门大的图。"
 zg361p3.238.a:0 "大幅偏向已验证价值。"
 zg361p3.238.b:0 "采用与价值均衡结算。"
 zg361p3.238.c:0 "先认覆盖面，但保留价值债。"
 zg361p3.239.t:0 "实验失败，学习不能归零"
 zg361p3.239.desc:0 "预注册实验失败，也可能买到真知识。决定有多少有界学习收益能留下。"
 zg361p3.239.a:0 "充分认可已验证学习。"
 zg361p3.239.b:0 "学习与交付分账。"
 zg361p3.239.c:0 "只入知识库，不计绩效分。"
 zg361p3.241.t:0 "长尾效果算谁的"
 zg361p3.241.desc:0 "效果在团队散场后才慢慢冒出来。现在冻结归属份额，免得未来价值被倒抢。"
 zg361p3.241.a:0 "建设者拿大头。"
 zg361p3.241.b:0 "建设、运营、继任近似均分。"
 zg361p3.241.c:0 "长期运营者拿大头。"
 zg361p3.301.t:0 "核心业务光环"
 zg361p3.301.desc:0 "顺风不是个人法术。校准前，把继承来的势能和可控贡献拆开。"
 zg361p3.301.a:0 "强力剥离光环。"
 zg361p3.301.b:0 "按同类基准校正。"
 zg361p3.301.c:0 "保留原始结果，但标注顺风。"
 zg361p3.302.t:0 "衰退业务的逆风"
 zg361p3.302.desc:0 "大盘缩水不能自动变成某个人的罪。先冻结不可控逆风的份额。"
 zg361p3.302.a:0 "按市场跌幅校正。"
 zg361p3.302.b:0 "与同类衰退团队比较。"
 zg361p3.302.c:0 "保留原始结果并写明限制。"
 zg361p3.303.t:0 "孵化保护也要到点"
 zg361p3.303.desc:0 "新团队需要保护，但不能拿永久免死金牌。把保护期和到期日一起签了。"
 zg361p3.303.a:0 "给一个短周期保护。"
 zg361p3.303.b:0 "按里程碑逐段保护。"
 zg361p3.303.c:0 "不保护分布，但追加支持。"
 zg361p3.304.t:0 "两个家长，一份绩效"
 zg361p3.304.desc:0 "项目线和职能线都说自己说了算。写评语前，先冻结权重与目标份额。"
 zg361p3.304.a:0 "项目家长六成。"
 zg361p3.304.b:0 "双方各半。"
 zg361p3.304.c:0 "职能家长六成。"
 zg361p3.305.t:0 "重组静默期"
 zg361p3.305.desc:0 "汇报线刚换，不能顺手重写快结束的考核。请选择静默期规则。"
 zg361p3.305.a:0 "校准结束前冻结评级。"
 zg361p3.305.b:0 "可补证据，不许改分。"
 zg361p3.305.c:0 "只有双签才能修改。"
 zg361p3.306.t:0 "一个脑袋，两顶帽子"
 zg361p3.306.desc:0 "临时双帽负责人只有一份时间。责任和考核权重都必须拆到百分之百。"
 zg361p3.306.a:0 "管理三、专业七。"
 zg361p3.306.b:0 "两边各半。"
 zg361p3.306.c:0 "管理七、专业三。"
 zg361p3.307.t:0 "利润中心还是成本中心"
 zg361p3.307.desc:0 "创收团队和支撑团队不能共用一把尺。比较结果前先选记分卡。"
 zg361p3.307.a:0 "采用利润中心记分卡。"
 zg361p3.307.b:0 "采用成本与服务记分卡。"
 zg361p3.307.c:0 "采用签字确认的混合记分卡。"
 zg361p3.308.t:0 "管理岗还是专业岗"
 zg361p3.308.desc:0 "调岗位结构不能凭空长编制。请在总 HC 守恒下选择构成。"
 zg361p3.308.a:0 "二十管理、八十专业。"
 zg361p3.308.b:0 "三十管理、七十专业。"
 zg361p3.308.c:0 "四十管理、六十专业。"
 zg361p3.309.t:0 "边远团队没声量"
 zg361p3.309.desc:0 "让边远团队被看见，也要占用管理带宽。走访、评审会，或者明着承认可见度折损。"
 zg361p3.309.a:0 "花带宽实地走访。"
 zg361p3.309.b:0 "花带宽开远程证据会。"
 zg361p3.309.c:0 "接受可见度折损并记债。"
 zg361p3.310.t:0 "旧档怎么搬进新组织"
 zg361p3.310.desc:0 "重组会换汇报线，不会穿越回去换作者。映射旧案，但历史 owner 不能漂移。"
 zg361p3.310.a:0 "按冻结历史 owner 映射。"
 zg361p3.310.b:0 "通过双签桥接映射。"
 zg361p3.310.c:0 "旧案独立保留一个周期。"
 zg361p3.311.t:0 "战略转向不是时光机"
 zg361p3.311.desc:0 "新战略可以改未来目标，不能倒改旧签字目标。把两份记录的边界冻结。"
 zg361p3.311.a:0 "关闭旧目标，另开新目标。"
 zg361p3.311.b:0 "明确拆分贡献后桥接。"
 zg361p3.311.c:0 "推迟到下一周期再转向。"
 zg361p3.334.t:0 "需求统一从正门进"
 zg361p3.334.desc:0 "没来源标签的需求，最后都会变成免费加班。把谁提的、为什么、从哪进来的记清楚。"
 zg361p3.334.a:0 "标为上级发起。"
 zg361p3.334.b:0 "标为属地需求。"
 zg361p3.334.c:0 "标为事故驱动。"
 zg361p3.335.t:0 "怎么每件事都紧急"
 zg361p3.335.desc:0 "“紧急”标签要吃真实槽位。占一个、拿范围交换，或者老老实实排队。"
 zg361p3.335.a:0 "消耗一个紧急插单槽。"
 zg361p3.335.b:0 "等量换出范围，不占槽。"
 zg361p3.335.c:0 "不认紧急，按原顺序排队。"
 zg361p3.336.t:0 "准入完成定义"
 zg361p3.336.desc:0 "收益、边界、依赖没签清楚，就不算能开工；硬塞进来，模糊责任归发起人。"
 zg361p3.336.a:0 "退回补全。"
 zg361p3.336.b:0 "准入一个有边界的探索。"
 zg361p3.336.c:0 "强制准入，发起人背模糊责任。"
 zg361p3.338.t:0 "范围、期限、质量：请签字"
 zg361p3.338.desc:0 "交付铁三角不会被口号消灭。冻结哪一角要动，以及谁签字承担取舍。"
 zg361p3.338.a:0 "缩范围并签字。"
 zg361p3.338.b:0 "延期限并签字。"
 zg361p3.338.c:0 "加 HC，并给预算签字。"
 zg361p3.339.t:0 "校准估算，不奖赌命"
 zg361p3.339.desc:0 "只奖准时，会训练出灌水和赌命。把估算误差和已记录原因一起校准。"
 zg361p3.339.a:0 "奖励校准后的准确度。"
 zg361p3.339.b:0 "奖励公开不确定性。"
 zg361p3.339.c:0 "认可救火，但记录估算债。"
 zg361p3.340.t:0 "少开工，多完工"
 zg361p3.340.desc:0 "新开工要同时占交付容量和 WIP 位。守上限、签例外，或者把偷开的债明着记下来。"
 zg361p3.340.a:0 "在 WIP 上限内开工。"
 zg361p3.340.b:0 "签署 WIP 例外后开工。"
 zg361p3.340.c:0 "超限开工并记录隐性工作债。"
 zg361p3.342.t:0 "阻塞时间算谁的"
 zg361p3.342.desc:0 "阻塞工时要归因到原因和解阻人，不能自动扣在交付团队头上。"
 zg361p3.342.a:0 "计入外部依赖。"
 zg361p3.342.b:0 "按共同原因拆分。"
 zg361p3.342.c:0 "暂计团队，但挂复核标记。"
 zg361p3.337.t:0 "改需求要交税"
 zg361p3.337.desc:0 "开工后改范围，必须动期限、范围或容量。真灾害可以用一次有记录的豁免。"
 zg361p3.337.a:0 "支付十小时容量并延期。"
 zg361p3.337.b:0 "支付十小时容量并等量减范围。"
 zg361p3.337.c:0 "使用一次灾害豁免并记录政策债。"
 zg361p3.341.t:0 "未完工跨周期"
 zg361p3.341.desc:0 "跨周期不是免费进度。释放本周期预留，并且只向下周期精确记账一次。"
 zg361p3.341.a:0 "整体结转剩余工作。"
 zg361p3.341.b:0 "拆分并验收已完成部分。"
 zg361p3.341.c:0 "取消剩余部分并关闭其债。"
 zg361p3.343.t:0 "提出、执行、验收三方签收"
 zg361p3.343.desc:0 "不是执行者说“好了”就算交付。把提出、执行、验收三方签字和结论一起冻结。"
 zg361p3.343.a:0 "三方签字后验收。"
 zg361p3.343.b:0 "有条件验收，并留下跟进债。"
 zg361p3.343.c:0 "附签字缺陷清单后拒收。"
 zg361p3.344.t:0 "上线不等于价值"
 zg361p3.344.desc:0 "上线、采用、验证价值要拆成三份守恒账；任何阶段都不能再印一套百分之百。"
 zg361p3.344.a:0 "前置认可上线。"
 zg361p3.344.b:0 "三阶段均衡结算。"
 zg361p3.344.c:0 "把大头留给已验证价值。"
