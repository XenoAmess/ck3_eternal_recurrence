l_simp_chinese:
 zg361p3.9000.t:0 "本轮办案方式"
 zg361p3.9000.desc:0 "当事人 [zg361_p3_aa_subject.GetShortUIName] 的指标、改组与交付案已经立卷。全案共三十五项：二十二项常规案可以统一口径办理，十三项涉及资源、人物去留或最终结算，必须单独呈报。统一办理仍为每项保留正式案卷、期限与回执。本轮已经登记制度债 [ROOT.Var('zg361_p3_player_policy_debt_disclosed_n').GetValue|0] 笔。"
 zg361p3.9000.a:0 "证据完整、可复核者统一办理二十二项；条件不足则逐案呈报。"
 zg361p3.9000.b:0 "以迅速交付为先统一办理二十二项；条件不足则逐案呈报。"
 zg361p3.9000.c:0 "搁置二十二项常规案，每件各记一笔下周期制度债。"
 zg361p3.9000.d:0 "全部三十五项逐案呈报，由我分别裁决。"
 zg361p3.229.t:0 "指标字典归谁管"
 zg361p3.229.desc:0 "这项指标没有具名口径责任人，后续改动也无人签认；同一个数字已经流传出两种解释。本轮已经登记制度债 [ROOT.Var('zg361_p3_player_policy_debt_disclosed_n').GetValue|0] 笔。"
 zg361p3.229.a:0 "指定受评者为唯一口径责任人，并由直属上司共同维护。"
 zg361p3.229.b:0 "指定直属上司为口径责任人，并由数据管家共同维护；登记一笔口径债。"
 zg361p3.229.c:0 "关闭本项，登记制度债。"
 zg361p3.229.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361p3.230.t:0 "两张看板，一个数字"
 zg361p3.230.desc:0 "两套数据源打起来了。考核需要一条可追溯的对账规则，而不是挑那张更好看的截图。"
 zg361p3.230.a:0 "采用预先指定的权威源。"
 zg361p3.230.b:0 "联合对账并公开差额。"
 zg361p3.230.c:0 "关闭本项，登记制度债。"
 zg361p3.230.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361p3.231.t:0 "分母怎么又变了"
 zg361p3.231.desc:0 "分母变更后，同一周期出现了两份互不相容的结果；案卷还没有说明校准应以哪一版为准。"
 zg361p3.231.a:0 "按新分母重算两个时期。"
 zg361p3.231.b:0 "新旧口径并列展示。"
 zg361p3.231.c:0 "关闭本项，登记制度债。"
 zg361p3.231.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361p3.232.t:0 "表里少了一块"
 zg361p3.232.desc:0 "表中有一段数据空缺；案卷里既没有公开回填规则，也没有人为估算误差负责。"
 zg361p3.232.a:0 "用审计样本回填全部十个缺失单元，并由独立复核人批准。"
 zg361p3.232.b:0 "插补其中八个缺失单元，展示误差带，并由独立复核人批准。"
 zg361p3.232.c:0 "关闭本项，登记制度债。"
 zg361p3.232.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361p3.233.t:0 "谁能看见这张看板"
 zg361p3.233.desc:0 "受评者目前只能看见汇总分；底层明细和可查询路径都还没有写进案卷。"
 zg361p3.233.a:0 "开放完整看板。"
 zg361p3.233.b:0 "按职责开放明细，并保留查询通道。"
 zg361p3.233.c:0 "关闭本项，登记制度债。"
 zg361p3.233.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361p3.234.t:0 "领先指标与滞后结果"
 zg361p3.234.desc:0 "过程信号与最终结果目前挤在同一本账里，迟到的结果因此能倒改早已发生的工作。"
 zg361p3.234.a:0 "按领先信号六成、滞后结果四成结算。"
 zg361p3.234.b:0 "按领先信号与滞后结果各五成结算，并进入校准。"
 zg361p3.234.c:0 "关闭本项，登记制度债。"
 zg361p3.234.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361p3.235.t:0 "主指标也得系安全带"
 zg361p3.235.desc:0 "主指标已经上涨，质量护栏却同步下跌；结算案卷里还没有两者的相对权重。"
 zg361p3.235.a:0 "按主指标与质量护栏各五成结算；护栏失守时不得获最高功劳。"
 zg361p3.235.b:0 "按主指标六成、质量护栏四成结算；由责任人承担护栏失守。"
 zg361p3.235.c:0 "关闭本项，登记制度债。"
 zg361p3.235.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361p3.236.t:0 "绩效指标悬崖"
 zg361p3.236.desc:0 "现行规则在一道阈值上从满分骤降为零，极小的测量变化就可能抹掉整周期工作。"
 zg361p3.236.a:0 "改用连续计分，避免阈值附近的成绩骤然归零。"
 zg361p3.236.b:0 "保留达标阈值，但按接近程度给予部分得分。"
 zg361p3.236.c:0 "关闭本项，登记制度债。"
 zg361p3.236.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361p3.237.t:0 "截最美的一段"
 zg361p3.237.desc:0 "上报图表只截取了最有利的一段；完整观察窗与对照期都没有出现在案卷里。"
 zg361p3.237.a:0 "按考核开始前事先登记的三百六十五日完整时间窗结算。"
 zg361p3.237.b:0 "并列公开三百六十五日完整窗与九十日精选窗。"
 zg361p3.237.c:0 "关闭本项，登记制度债。"
 zg361p3.237.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361p3.240.t:0 "大家都想抢这批样本"
 zg361p3.240.desc:0 "同一批受评者同时出现在两份实验案卷中；两支团队都声称拿到了未受干扰的样本，因而重复计入了同一批人。本轮已经登记制度债 [ROOT.Var('zg361_p3_player_policy_debt_disclosed_n').GetValue|0] 笔。"
 zg361p3.240.a:0 "将这批样本独占分配给当前实验。"
 zg361p3.240.b:0 "由独立复核人签字，将样本划分给两项实验。"
 zg361p3.240.c:0 "关闭本项，登记制度债。"
 zg361p3.240.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361p3.238.t:0 "热闹不等于价值"
 zg361p3.238.desc:0 "采用数据十分热闹，验证价值却原地踏步；声量更大的图表正在挤掉价值账。"
 zg361p3.238.a:0 "按声量一成、已验证价值七成、未验证两成结算；追回一成功劳。"
 zg361p3.238.b:0 "按声量三成、已验证价值五成、未验证两成结算；追回三成功劳。"
 zg361p3.238.c:0 "关闭本项，登记制度债。"
 zg361p3.238.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361p3.239.t:0 "实验失败，学习不能归零"
 zg361p3.239.desc:0 "实验规则已在开始前登记，实验虽未达到业务目标，却留下了可验证的新知识；争议在于这些学习证据应获得多少有界权重。"
 zg361p3.239.a:0 "给事先登记且可复核、可复用的学习证据七成功劳；业务交付仍记失败。"
 zg361p3.239.b:0 "给学习证据四成功劳，并与失败的业务交付分账。"
 zg361p3.239.c:0 "关闭本项，登记制度债。"
 zg361p3.239.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361p3.241.t:0 "长尾效果算谁的"
 zg361p3.241.desc:0 "团队已经散场，长期效果却还在出现；交接后的新增价值目前没有归属份额可依。本轮已经登记制度债 [ROOT.Var('zg361_p3_player_policy_debt_disclosed_n').GetValue|0] 笔。"
 zg361p3.241.a:0 "按建设者五成、运营者三成、继任者两成分配长尾功劳与成本。"
 zg361p3.241.b:0 "按建设者三成三、运营者三成三、继任者三成四分配长尾功劳与成本。"
 zg361p3.241.c:0 "关闭本项，登记制度债。"
 zg361p3.241.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361p3.301.t:0 "核心业务光环"
 zg361p3.301.desc:0 "团队继承了强劲势能，考核案卷却把它全部记成了个人可控贡献。"
 zg361p3.301.a:0 "从原始结果一百二十分中扣除三十分继承势能，个人功劳记九十分。"
 zg361p3.301.b:0 "按同类基准扣除二十分继承势能，个人功劳记一百分。"
 zg361p3.301.c:0 "关闭本项，登记制度债。"
 zg361p3.301.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361p3.302.t:0 "衰退业务的逆风"
 zg361p3.302.desc:0 "考核期内大盘已经缩水，案卷却没有把不可控逆风与个人贡献拆开。"
 zg361p3.302.a:0 "按市场跌幅校正。"
 zg361p3.302.b:0 "与同类衰退团队比较。"
 zg361p3.302.c:0 "关闭本项，登记制度债。"
 zg361p3.302.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361p3.303.t:0 "孵化保护也要到点"
 zg361p3.303.desc:0 "新团队仍在爬坡，案卷里却既没有保护期，也没有到期日；永久豁免又会遮住后续失责。"
 zg361p3.303.a:0 "给予新团队一个周期保护；到期后恢复正常考核。"
 zg361p3.303.b:0 "只在签字里程碑处保护新团队，保护最多持续两个周期。"
 zg361p3.303.c:0 "关闭本项，登记制度债。"
 zg361p3.303.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361p3.304.t:0 "两个家长，一份绩效"
 zg361p3.304.desc:0 "项目线和职能线都声称自己说了算；案卷里还没有唯一冻结的权重、目标份额和最终责任人。"
 zg361p3.304.a:0 "责令项目线权重为六成。"
 zg361p3.304.b:0 "责令双方权重各半。"
 zg361p3.304.c:0 "关闭本项，登记制度债。"
 zg361p3.304.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361p3.305.t:0 "重组静默期"
 zg361p3.305.desc:0 "汇报线在考核收口前刚刚变更；若没有静默期规则，新任上司就能改写一宗几乎结案的考核。"
 zg361p3.305.a:0 "校准结束前冻结评级。"
 zg361p3.305.b:0 "可补证据，不许改分。"
 zg361p3.305.c:0 "关闭本项，登记制度债。"
 zg361p3.305.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361p3.306.t:0 "一个脑袋，两顶帽子"
 zg361p3.306.desc:0 "临时双帽负责人只有一份时间，而当前责任份额与考核权重都还没有合计到百分之百。"
 zg361p3.306.a:0 "按管理责任三成、专业责任七成分配考核权。"
 zg361p3.306.b:0 "按管理责任与专业责任各五成分配考核权。"
 zg361p3.306.c:0 "关闭本项，登记制度债。"
 zg361p3.306.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361p3.307.t:0 "利润中心还是成本中心"
 zg361p3.307.desc:0 "创收团队与支撑团队目前共用一张记分卡，收入增长和成本控制在比较前就被混到了一起。"
 zg361p3.307.a:0 "采用利润中心记分卡。"
 zg361p3.307.b:0 "采用成本与服务记分卡。"
 zg361p3.307.c:0 "关闭本项，登记制度债。"
 zg361p3.307.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361p3.308.t:0 "管理岗还是专业岗"
 zg361p3.308.desc:0 "管理岗与专业岗正在争用同一份固定编制；任何新构成都不能突破总额。"
 zg361p3.308.a:0 "把百人编制调整为二十名管理岗、八十名专业岗。"
 zg361p3.308.b:0 "把百人编制调整为三十名管理岗、七十名专业岗。"
 zg361p3.308.c:0 "关闭本项，登记制度债。"
 zg361p3.308.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361p3.309.t:0 "边远团队没声量"
 zg361p3.309.desc:0 "边远团队在本期考核材料中几乎不可见；管理层只剩一次额外核验的带宽，可见度差距却已经开始扭曲考核。本轮已经登记制度债 [ROOT.Var('zg361_p3_player_policy_debt_disclosed_n').GetValue|0] 笔。"
 zg361p3.309.a:0 "投入十小时管理容量实地走访；增加十点可见度，不增加交付产出。"
 zg361p3.309.b:0 "投入十小时管理容量举办远程证据会；增加十点可见度，不增加交付产出。"
 zg361p3.309.c:0 "关闭本项，登记制度债。"
 zg361p3.309.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361p3.310.t:0 "旧档怎么搬进新组织"
 zg361p3.310.desc:0 "汇报线已经变更，既有案卷的署名责任仍由原任承担；归档记录尚未同时标明原责任人与接任者。本轮已经登记制度债 [ROOT.Var('zg361_p3_player_policy_debt_disclosed_n').GetValue|0] 笔。"
 zg361p3.310.a:0 "旧案仍归原责任人名下。"
 zg361p3.310.b:0 "另立交接记录，同时列明原责任人与接任者。"
 zg361p3.310.c:0 "关闭本项，登记制度债。"
 zg361p3.310.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361p3.311.t:0 "战略转向不是时光机"
 zg361p3.311.desc:0 "新战略已经生效，旧周期仍留有签字目标；两份记录边界不清，就会让未来优先级倒改过去承诺。本轮已经登记制度债 [ROOT.Var('zg361_p3_player_policy_debt_disclosed_n').GetValue|0] 笔。"
 zg361p3.311.a:0 "关闭旧目标，另开新目标。"
 zg361p3.311.b:0 "分别核清新旧目标的贡献，再衔接两份案卷。"
 zg361p3.311.c:0 "关闭本项，登记制度债。"
 zg361p3.311.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361p3.334.t:0 "需求统一从正门进"
 zg361p3.334.desc:0 "一条需求已经送达，却没有提出者、业务理由和入口标签；照此推进，成本只会落成无人负责的加班。"
 zg361p3.334.a:0 "标为上级发起。"
 zg361p3.334.b:0 "标为属地需求。"
 zg361p3.334.c:0 "关闭本项，登记制度债。"
 zg361p3.334.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361p3.335.t:0 "怎么每件事都紧急"
 zg361p3.335.desc:0 "多条需求都贴着“紧急”标签，组合账本却只剩一个槽位，也没有空余范围；标签承诺的容量已经超过现实。本轮已经登记制度债 [ROOT.Var('zg361_p3_player_policy_debt_disclosed_n').GetValue|0] 笔。"
 zg361p3.335.a:0 "占用唯一的紧急插单槽；不削减原需求范围。"
 zg361p3.335.b:0 "换出十小时原需求范围；保留紧急插单槽。"
 zg361p3.335.c:0 "关闭本项，登记制度债。"
 zg361p3.335.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361p3.336.t:0 "开工条件尚未齐备"
 zg361p3.336.desc:0 "收益、边界、依赖没签清楚，就不算能开工；硬塞进来，模糊责任归发起人。"
 zg361p3.336.a:0 "退回需求且不准入；先补齐收益、边界与依赖。"
 zg361p3.336.b:0 "按有界探索准入需求；预估占用十小时容量。"
 zg361p3.336.c:0 "关闭本项，登记制度债。"
 zg361p3.336.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361p3.338.t:0 "范围、期限、质量：请签字"
 zg361p3.338.desc:0 "需求已经同时挤压范围与期限，案卷却没有给任何一项列出签字责任人；交付团队不能因沉默独吞取舍。本轮已经登记制度债 [ROOT.Var('zg361_p3_player_policy_debt_disclosed_n').GetValue|0] 笔。"
 zg361p3.338.a:0 "削减十小时范围并由发起人签字；期限不变。"
 zg361p3.338.b:0 "期限延长一个周期并由发起人签字；范围不变。"
 zg361p3.338.c:0 "关闭本项，登记制度债。"
 zg361p3.338.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361p3.339.t:0 "校准估算，不奖赌命"
 zg361p3.339.desc:0 "现行准时奖励同时养出了灌水估算和临门赌命；估算误差尚未与已记录原因对应起来。"
 zg361p3.339.a:0 "按实际八小时结算校准后的估算；不记灌水。"
 zg361p3.339.b:0 "公开四小时外部阻塞：实际十二小时按八小时校准结算。"
 zg361p3.339.c:0 "关闭本项，登记制度债。"
 zg361p3.339.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361p3.340.t:0 "少开工，多完工"
 zg361p3.340.desc:0 "这项待开任务会同时突破交付容量与在制任务上限，案卷里也没有覆盖超额部分的签字例外。本轮已经登记制度债 [ROOT.Var('zg361_p3_player_policy_debt_disclosed_n').GetValue|0] 笔。"
 zg361p3.340.a:0 "占用一个在制任务槽，并按需求估算值预留容量后开工。"
 zg361p3.340.b:0 "签署例外后占用两个在制任务槽；额外预留十小时容量。"
 zg361p3.340.c:0 "关闭本项，登记制度债。"
 zg361p3.340.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361p3.342.t:0 "阻塞时间算谁的"
 zg361p3.342.desc:0 "一段阻塞工时被直接扣在交付团队名下，案卷却既没有记录阻塞原因，也没有列出解阻责任人。"
 zg361p3.342.a:0 "指定独立复核人解阻；阻塞工时全归团队不可控阻碍，交付团队不扣分。"
 zg361p3.342.b:0 "阻塞工时由团队与外部原因各承担一半；交付团队不作低产出扣分。"
 zg361p3.342.c:0 "关闭本项，登记制度债。"
 zg361p3.342.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361p3.337.t:0 "改需求要交税"
 zg361p3.337.desc:0 "开工后的范围变更已经吃掉额外容量，但新增成本既没有进入期限账，也没有进入剩余范围账。本轮已经登记制度债 [ROOT.Var('zg361_p3_player_policy_debt_disclosed_n').GetValue|0] 笔。"
 zg361p3.337.a:0 "支付十小时容量并延期。"
 zg361p3.337.b:0 "支付十小时容量并等量减范围。"
 zg361p3.337.c:0 "关闭本项，登记制度债。"
 zg361p3.337.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361p3.341.t:0 "未完工跨周期"
 zg361p3.341.desc:0 "未完工作仍占着本周期预留，下周期账本却准备再次扣减；同一份容量将被重复计算。本轮已经登记制度债 [ROOT.Var('zg361_p3_player_policy_debt_disclosed_n').GetValue|0] 笔。"
 zg361p3.341.a:0 "结转十小时剩余工作；本期释放原预留，下期预占十小时容量。"
 zg361p3.341.b:0 "验收已完成部分并结转五小时；本期释放原预留，下期预占五小时。"
 zg361p3.341.c:0 "关闭本项，登记制度债。"
 zg361p3.341.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361p3.343.t:0 "提出、执行、验收三方送达"
 zg361p3.343.desc:0 "执行人已经报称完成，案卷里却没有一份让提出人、执行人和验收人共同可见的结论；交付记录也不等于三方亲自同意。本轮已经登记制度债 [ROOT.Var('zg361_p3_player_policy_debt_disclosed_n').GetValue|0] 笔。"
 zg361p3.343.a:0 "向提出人、执行人和验收人送达结论，并通过验收。"
 zg361p3.343.b:0 "向提出人、执行人和验收人送达结论，并作有条件验收。"
 zg361p3.343.c:0 "关闭本项，登记制度债。"
 zg361p3.343.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361p3.344.t:0 "上线不等于价值"
 zg361p3.344.desc:0 "上线、采用与验证价值目前各记了一套百分之百，组合总账因此把同一成果重复计功。本轮已经登记制度债 [ROOT.Var('zg361_p3_player_policy_debt_disclosed_n').GetValue|0] 笔。"
 zg361p3.344.a:0 "按上线六成、采用两成五、已验证价值一成五分配功劳。"
 zg361p3.344.b:0 "按上线三成、采用三成、已验证价值四成分配功劳。"
 zg361p3.344.c:0 "关闭本项，登记制度债。"
 zg361p3.344.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
