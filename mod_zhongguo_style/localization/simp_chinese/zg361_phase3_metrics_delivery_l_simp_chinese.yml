 zg361p3.9000.t:0 "本轮办案方式"
 zg361p3.9000.desc:0 "当事人 [scope:zg361_p3_aa_subject.GetShortUIName] 的指标、改组与交付案已经立卷。全案共三十五项：二十二项常规案可以统一口径办理，十三项涉及资源、人物去留或最终结算，必须单独呈报。统一办理仍为每项保留正式案卷、期限与回执。本轮已经登记制度债 [ROOT.MakeScope.Var('zg361_p3_player_policy_debt_disclosed_n').GetValue|0] 笔。"
 zg361p3.9000.a:0 "二十二项常规案以证据完整、可复核为准统一办理；条件不足者单独呈报。"
 zg361p3.9000.b:0 "常规案以迅速交付为先统一办理，承担相应约束与风险；条件不足者单独呈报。"
 zg361p3.9000.c:0 "搁置二十二项常规案，每件各记一笔下周期制度债；十三项关键案仍单独呈报。"
 zg361p3.9000.d:0 "全部三十五项逐案呈报，由我分别裁决。"
