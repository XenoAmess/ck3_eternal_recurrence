l_simp_chinese:
 zg361ch.950.t:0 "确定本轮办案方式"
 zg361ch.950.desc:0 "本轮共有四十四项职业与编制裁决。涉及付款、调动、放人期限或具名人员的二十二项仍会逐项呈报；其余二十二项可按统一口径办理。统一办理仍会逐案留下正式记录；任一案件条件不足时，便改为单独呈报。"
 zg361ch.950.a:0 "以可追溯证据为准，统一办理二十二项常规案；条件不足者单独呈报。"
 zg361ch.950.b:0 "以执行速度为先，统一办理二十二项常规案；条件不足者单独呈报。"
 zg361ch.950.c:0 "搁置二十二项常规案，每案记下一笔下周期制度债。"
 zg361ch.950.d:0 "全部四十四项逐案呈报，由我分别裁决。"
 zg361ch.901.t:0 "职业安排办理完毕"
 zg361ch.901.desc:0 "晋升、调任、留任与相关钱账已经分别归档；尚在期限内的安排会按到期日继续结算。"
 zg361ch.901.a:0 "归档。下轮再见。"
 zg361ch.902.t:0 "职级路径办理完毕"
 zg361ch.902.desc:0 "专业与管理路径、过渡职级和破格名额已经落定；本轮不会再改写这些选择。"
 zg361ch.902.a:0 "归档。下轮再见。"
 zg361ch.903.t:0 "编制处置办理完毕"
 zg361ch.903.desc:0 "保留、占用、回收与补岗责任已经写入各自名额；下一轮将沿用本次结论。"
 zg361ch.903.a:0 "归档。下轮再见。"
 zg361ch.904.t:0 "继任盘点办理完毕"
 zg361ch.904.desc:0 "关键岗位、候选准备度与知识移交已经归档；未到期的试任和留任条件仍会继续履行。"
 zg361ch.904.a:0 "归档。下轮再见。"
 zg361ch.905.t:0 "内部流动办理完毕"
 zg361ch.905.desc:0 "应聘、放人、爬坡、补岗与带教责任已经分开登记；后续只按各自期限结算。"
 zg361ch.905.a:0 "归档。下轮再见。"
 zg361ch.906.t:0 "管理复审办理完毕"
 zg361ch.906.desc:0 "试任、权重、下属反馈、继任与授权记录已经写入本轮管理评价。"
 zg361ch.906.a:0 "归档。下轮再见。"
 zg361ch.m019.name:0 "晋升资格门槛"
 zg361ch.m019.desc:0 "当事人 [scope:zg361_ch_d_event_subject.GetShortUIName]；裁决者 [scope:zg361_ch_d_event_owner.GetShortUIName]。晋升材料已过初核，但资格证据与提名关系并不一致；现在必须决定是否把当事人列入候选册。本项最迟在 90 日内结算。"
 zg361ch.m019.a:0 "按资格门槛列为可晋升"
 zg361ch.m019.b:0 "绕过提名担保直接列入候选"
 zg361ch.m019.c:0 "搁置本项，记下周期制度债；本局不再提案。"
 zg361ch.m020.name:0 "晋升包与跨部门答辩"
 zg361ch.m020.desc:0 "当事人 [scope:zg361_ch_d_event_subject.GetShortUIName]；裁决者 [scope:zg361_ch_d_event_owner.GetShortUIName]。候选材料已经送齐，跨部门证据与提名担保人的陈述互有出入；评审包必须在本阶段定稿。本项最迟在 90 日内结算。"
 zg361ch.m020.a:0 "提交跨部门评审材料"
 zg361ch.m020.b:0 "提交由提名担保人主导的材料"
 zg361ch.m020.c:0 "搁置本项，记下周期制度债；本局不再提案。"
 zg361ch.m021.name:0 "奖金—调薪矩阵"
 zg361ch.m021.desc:0 "当事人 [scope:zg361_ch_d_event_subject.GetShortUIName]；裁决者 [scope:zg361_ch_d_event_owner.GetShortUIName]。本轮绩效已经冻结，奖金与调薪只能从同一笔预算兑现；任何支付都会同时记入双方钱账。本项最迟在 90 日内结算。"
 zg361ch.m021.a:0 "按奖金与调薪矩阵兑现薪酬；上司公私各付5，当事人公私各收5"
 zg361ch.m021.b:0 "把同一预算集中为一次现金激励；上司公私各付5，当事人公私各收5"
 zg361ch.m021.c:0 "搁置本项，记下周期制度债；本局不再提案。"
 zg361ch.m022.name:0 "软编制名额 / 编制预算"
 zg361ch.m022.desc:0 "当事人 [scope:zg361_ch_d_event_subject.GetShortUIName]；裁决者 [scope:zg361_ch_d_event_owner.GetShortUIName]。拟任岗位尚未取得稳定编制，现有名额又已被其他承诺占用；本阶段必须确定这处空缺是否继续保留。本项最迟在 90 日内结算。"
 zg361ch.m022.a:0 "为该岗位预留编制预算"
 zg361ch.m022.b:0 "因例外安排冻结该编制"
 zg361ch.m022.c:0 "搁置本项，记下周期制度债；本局不再提案。"
 zg361ch.m023.name:0 "编制名额答辩与团队投入产出"
 zg361ch.m023.desc:0 "当事人 [scope:zg361_ch_d_event_subject.GetShortUIName]；裁决者 [scope:zg361_ch_d_event_owner.GetShortUIName]。团队已经提交增员理由，但下一周期名额也有人预先占用；这次答辩必须留下可追责的编制结论。本项最迟在 180 日内结算。"
 zg361ch.m023.a:0 "完成编制答辩且不借用名额"
 zg361ch.m023.b:0 "以紧急名义借用下一周期名额"
 zg361ch.m023.c:0 "搁置本项，记下周期制度债；本局不再提案。"
 zg361ch.m024.name:0 "内部活水与转岗博弈"
 zg361ch.m024.desc:0 "当事人 [scope:zg361_ch_d_event_subject.GetShortUIName]；裁决者 [scope:zg361_ch_d_event_owner.GetShortUIName]。当事人提出内部调动，原任岗位的交接与补岗尚无定案；流动窗口将在本阶段结束。本项最迟在 180 日内结算。"
 zg361ch.m024.a:0 "安排下一周期转岗"
 zg361ch.m024.b:0 "阻止本次内部流动"
 zg361ch.m024.c:0 "搁置本项，记下周期制度债；本局不再提案。"
 zg361ch.m025.name:0 "高绩效人才被挖与反录用邀约"
 zg361ch.m025.desc:0 "当事人 [scope:zg361_ch_d_event_subject.GetShortUIName]；裁决者 [scope:zg361_ch_d_event_owner.GetShortUIName]。外部邀约已经送到当事人手中，留任预算与口头承诺不能混为一谈；挽留条件须在离任前落定。本项最迟在 90 日内结算。"
 zg361ch.m025.a:0 "发出书面留任邀约；上司公私各付5，当事人公私各收5"
 zg361ch.m025.b:0 "支付反邀约款，但只给口头留任承诺；上司公私各付5，当事人公私各收5"
 zg361ch.m025.c:0 "搁置本项，记下周期制度债；本局不再提案。"
 zg361ch.m092.name:0 "专业 / 管理双通道"
 zg361ch.m092.desc:0 "当事人 [scope:zg361_ch_m_event_subject.GetShortUIName]；裁决者 [scope:zg361_ch_m_event_owner.GetShortUIName]。当事人的专业贡献已经达到进阶门槛，但管理职责尚未接受检验；专业进阶与转任管理的依据彼此冲突。本项最迟在 90 日内结算。"
 zg361ch.m092.a:0 "保持专业与管理双通道分离"
 zg361ch.m092.b:0 "把明星专家直接转为管理者"
 zg361ch.m092.c:0 "搁置本项，记下周期制度债；本局不再提案。"
 zg361ch.m093.name:0 "失败经理回归专家岗"
 zg361ch.m093.desc:0 "当事人 [scope:zg361_ch_m_event_subject.GetShortUIName]；裁决者 [scope:zg361_ch_m_event_owner.GetShortUIName]。现任管理者未能完成管理职责，专业能力却仍有价值；本阶段要为其确定可继续承担的岗位。本项最迟在 90 日内结算。"
 zg361ch.m093.a:0 "让失败经理回到专家岗"
 zg361ch.m093.b:0 "强留管理岗或降级"
 zg361ch.m093.c:0 "搁置本项，记下周期制度债；本局不再提案。"
 zg361ch.m094.name:0 "微职级与“升半级”缓冲"
 zg361ch.m094.desc:0 "当事人 [scope:zg361_ch_m_event_subject.GetShortUIName]；裁决者 [scope:zg361_ch_m_event_owner.GetShortUIName]。完整晋升条件尚未满足，但职责已经扩大；若授予过渡职级，权责与薪酬边界必须同时留下记录。本项最迟在 180 日内结算。"
 zg361ch.m094.a:0 "授予有边界的微职级"
 zg361ch.m094.b:0 "只给半级头衔而不补权责"
 zg361ch.m094.c:0 "搁置本项，记下周期制度债；本局不再提案。"
 zg361ch.m095.name:0 "高级管理任命年度复审"
 zg361ch.m095.desc:0 "当事人 [scope:zg361_ch_m_event_subject.GetShortUIName]；裁决者 [scope:zg361_ch_m_event_owner.GetShortUIName]。年度管理复审已经到期，在任者的团队结果与履责记录均已冻结；本期权限需要重新确认。本项最迟在 90 日内结算。"
 zg361ch.m095.a:0 "复审通过，维持本期管理权限"
 zg361ch.m095.b:0 "复审不通过，撤销本期管理权限"
 zg361ch.m095.c:0 "搁置本项，记下周期制度债；本局不再提案。"
 zg361ch.m096.name:0 "破格晋升包"
 zg361ch.m096.desc:0 "当事人 [scope:zg361_ch_m_event_subject.GetShortUIName]；裁决者 [scope:zg361_ch_m_event_owner.GetShortUIName]。候选人请求跳过通常年限，破格名额只有一个；战功、绩效与担保关系必须在本次裁决中分开。本项最迟在 90 日内结算。"
 zg361ch.m096.a:0 "预留一个破格晋升名额"
 zg361ch.m096.b:0 "按提名担保关系破格"
 zg361ch.m096.c:0 "搁置本项，记下周期制度债；本局不再提案。"
 zg361ch.m097.name:0 "跨团队晋升校准"
 zg361ch.m097.desc:0 "当事人 [scope:zg361_ch_m_event_subject.GetShortUIName]；裁决者 [scope:zg361_ch_m_event_owner.GetShortUIName]。多个团队争用同一批晋升名额，各自的本地排名不能直接互比；跨团队校准已经进入分配阶段。本项最迟在 90 日内结算。"
 zg361ch.m097.a:0 "按跨团队校准结果分配名额"
 zg361ch.m097.b:0 "按本地工作量分配名额"
 zg361ch.m097.c:0 "搁置本项，记下周期制度债；本局不再提案。"
 zg361ch.m098.name:0 "增长、补缺、项目三类编制名额"
 zg361ch.m098.desc:0 "当事人 [scope:zg361_ch_n_event_subject.GetShortUIName]；裁决者 [scope:zg361_ch_n_event_owner.GetShortUIName]。一处新名额正在增长、补缺与临时项目之间争用；用途一旦登记，就会约束后续空缺。本项最迟在 90 日内结算。"
 zg361ch.m098.a:0 "把名额绑定到明确岗位类型"
 zg361ch.m098.b:0 "把名额作为通用空编使用"
 zg361ch.m098.c:0 "搁置本项，记下周期制度债；本局不再提案。"
 zg361ch.m099.name:0 "编制名额到期、结转与年底突击招募"
 zg361ch.m099.desc:0 "当事人 [scope:zg361_ch_n_event_subject.GetShortUIName]；裁决者 [scope:zg361_ch_n_event_owner.GetShortUIName]。本周期留下一个未用名额，招聘进度不足以自动保留它；到期前必须决定是否允许一次结转。本项最迟在 90 日内结算。"
 zg361ch.m099.a:0 "只结转一次未用名额"
 zg361ch.m099.b:0 "年底收回未用名额"
 zg361ch.m099.c:0 "搁置本项，记下周期制度债；本局不再提案。"
 zg361ch.m100.name:0 "冻结期与关键岗位特批"
 zg361ch.m100.desc:0 "当事人 [scope:zg361_ch_n_event_subject.GetShortUIName]；裁决者 [scope:zg361_ch_n_event_owner.GetShortUIName]。冻结期内出现关键岗位申请，普通增员已经停办；这项例外必须留下岗位风险和批准责任。本项最迟在 90 日内结算。"
 zg361ch.m100.a:0 "仅为关键岗位批准冻结期例外"
 zg361ch.m100.b:0 "因关系安排冻结名额"
 zg361ch.m100.c:0 "搁置本项，记下周期制度债；本局不再提案。"
 zg361ch.m101.name:0 "一个资深 / 两个普通 / 学徒梯队"
 zg361ch.m101.desc:0 "当事人 [scope:zg361_ch_n_event_subject.GetShortUIName]；裁决者 [scope:zg361_ch_n_event_owner.GetShortUIName]。同一笔编制预算只能组成一支人才梯队，资深交付与后备培养正在争用名额。本项最迟在 90 日内结算。"
 zg361ch.m101.a:0 "按一名资深、两名普通与学徒梯队占用编制；上司公私各付5，当事人公私各收5"
 zg361ch.m101.b:0 "把全部编制投向资深人选；上司公私各付5，当事人公私各收5"
 zg361ch.m101.c:0 "搁置本项，记下周期制度债；本局不再提案。"
 zg361ch.m102.name:0 "零基编制重审"
 zg361ch.m102.desc:0 "当事人 [scope:zg361_ch_n_event_subject.GetShortUIName]；裁决者 [scope:zg361_ch_n_event_owner.GetShortUIName]。旧编制已经进入零基重审，部分岗位仍无近期工作量；保留与回收都必须在本阶段落账。本项最迟在 180 日内结算。"
 zg361ch.m102.a:0 "按零基重审重新预留编制"
 zg361ch.m102.b:0 "年度结算时收回编制"
 zg361ch.m102.c:0 "搁置本项，记下周期制度债；本局不再提案。"
 zg361ch.m103.name:0 "空编占坑审计"
 zg361ch.m103.desc:0 "当事人 [scope:zg361_ch_n_event_subject.GetShortUIName]；裁决者 [scope:zg361_ch_n_event_owner.GetShortUIName]。一处编制长期空置，候选管线仍未形成；继续占用将挤压其他团队的真实补员需求。本项最迟在 180 日内结算。"
 zg361ch.m103.a:0 "收回长期空置的占坑编制"
 zg361ch.m103.b:0 "以虚拟候选继续冻结编制"
 zg361ch.m103.c:0 "搁置本项，记下周期制度债；本局不再提案。"
 zg361ch.m104.name:0 "新人池 / 成熟人才池之争"
 zg361ch.m104.desc:0 "当事人 [scope:zg361_ch_n_event_subject.GetShortUIName]；裁决者 [scope:zg361_ch_n_event_owner.GetShortUIName]。新人培养与成熟人才采购争用同一笔补员预算；两类渠道的候选与薪酬记录目前都未落定。本项最迟在 90 日内结算。"
 zg361ch.m104.a:0 "同时补入新人和成熟人才；上司公私各付5，当事人公私各收5"
 zg361ch.m104.b:0 "只补入成熟人才；上司公私各付5，当事人公私各收5"
 zg361ch.m104.c:0 "搁置本项，记下周期制度债；本局不再提案。"
 zg361ch.m105.name:0 "离任后的补岗归属"
 zg361ch.m105.desc:0 "当事人 [scope:zg361_ch_n_event_subject.GetShortUIName]；裁决者 [scope:zg361_ch_n_event_owner.GetShortUIName]。有人离任后留下岗位空缺，原团队与中央编制池都主张名额归己；补岗责任必须先确定。本项最迟在 90 日内结算。"
 zg361ch.m105.a:0 "把补岗责任绑定到离任岗位"
 zg361ch.m105.b:0 "阻止释放补岗名额"
 zg361ch.m105.c:0 "搁置本项，记下周期制度债；本局不再提案。"
 zg361ch.m106.name:0 "关键岗位与关键人才分离"
 zg361ch.m106.desc:0 "当事人 [scope:zg361_ch_o_event_subject.GetShortUIName]；裁决者 [scope:zg361_ch_o_event_owner.GetShortUIName]。当前岗位的重要性与现任者的受宠程度被混在一起；两者若继续混写，继任依据就会失真。本项最迟在 90 日内结算。"
 zg361ch.m106.a:0 "分别登记关键岗位与关键人才"
 zg361ch.m106.b:0 "把受宠者直接等同于关键岗位"
 zg361ch.m106.c:0 "搁置本项，记下周期制度债；本局不再提案。"
 zg361ch.m107.name:0 "继任准备度阶梯"
 zg361ch.m107.desc:0 "当事人 [scope:zg361_ch_o_event_subject.GetShortUIName]；裁决者 [scope:zg361_ch_o_event_owner.GetShortUIName]。继任候选已经进入盘点，但准备程度尚无统一证据；本次登记会决定其后续培养位置。本项最迟在 90 日内结算。"
 zg361ch.m107.a:0 "按证据登记继任准备度"
 zg361ch.m107.b:0 "直接登记为已具备继任资格"
 zg361ch.m107.c:0 "搁置本项，记下周期制度债；本局不再提案。"
 zg361ch.m108.name:0 "代理任职试炼"
 zg361ch.m108.desc:0 "当事人 [scope:zg361_ch_o_event_subject.GetShortUIName]；裁决者 [scope:zg361_ch_o_event_owner.GetShortUIName]。候选人即将开始代理任职，责任、权限与资源仍未完全对齐；试任条件必须在开始前写清。本项最迟在 180 日内结算。"
 zg361ch.m108.a:0 "同时授予代理权限、资源与目标"
 zg361ch.m108.b:0 "只加责任而不给资源权限"
 zg361ch.m108.c:0 "搁置本项，记下周期制度债；本局不再提案。"
 zg361ch.m109.name:0 "高潜标签的公开层级"
 zg361ch.m109.desc:0 "当事人 [scope:zg361_ch_o_event_subject.GetShortUIName]；裁决者 [scope:zg361_ch_o_event_owner.GetShortUIName]。高潜名单已经形成，公开范围却尚未确定；披露过多会伤害未入选者，过少则妨碍培养。本项最迟在 180 日内结算。"
 zg361ch.m109.a:0 "只向必要知情人披露高潜标签"
 zg361ch.m109.b:0 "向全体人员公开高潜标签"
 zg361ch.m109.c:0 "搁置本项，记下周期制度债；本局不再提案。"
