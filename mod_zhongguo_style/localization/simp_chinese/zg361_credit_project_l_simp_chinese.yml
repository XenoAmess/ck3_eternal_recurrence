l_simp_chinese:
 zg361cp.26.t:0 "实绩与可见度分账"
 zg361cp.26.desc:0 "交付、汇报与关系工时花的是同一份项目容量，只有交付工时会生成真实产出。"
 zg361cp.26.a:0 "保护交付，只做精简汇报。"
 zg361cp.26.b:0 "交付与完整汇报并重。"
 zg361cp.26.c:0 "延期本机制，并登记一笔下周期制度债。"
 zg361cp.27.t:0 "把百分之百贡献签清楚"
 zg361cp.27.desc:0 "受评者、直属上司与跨部门贡献者必须把一万基点完整签清。"
 zg361cp.27.a:0 "让受评者取得明确多数。"
 zg361cp.27.b:0 "采用均衡的跨部门分配。"
 zg361cp.27.c:0 "延期本机制，并登记一笔下周期制度债。"
 zg361cp.28.t:0 "抢功申诉与审计回拨"
 zg361cp.28.desc:0 "功劳转移必须净额为零；抢功不成立时必须完整回拨，不能改写签字底稿。"
 zg361cp.28.a:0 "支持一笔有界的上司主张。"
 zg361cp.28.b:0 "审证后完整回拨抢功。"
 zg361cp.28.c:0 "延期本机制，并登记一笔下周期制度债。"
 zg361cp.29.t:0 "指标包装与审计"
 zg361cp.29.desc:0 "短期指标收益、延迟成本与造假回拨必须分账结算并可追溯。"
 zg361cp.29.a:0 "记录真实改善。"
 zg361cp.29.b:0 "记录指标博弈及其延迟成本。"
 zg361cp.29.c:0 "延期本机制，并登记一笔下周期制度债。"
 zg361cp.30.t:0 "资源赛马只产生一个赢家"
 zg361cp.30.desc:0 "开工前必须从唯一项目席位和有限容量账本中真实预留资源。"
 zg361cp.30.a:0 "给受评者主导的项目四十小时。"
 zg361cp.30.b:0 "给跨部门项目六十小时。"
 zg361cp.30.c:0 "延期本机制，并登记一笔下周期制度债。"
 zg361cp.31.t:0 "恩主信用有上限也会到期"
 zg361cp.31.desc:0 "恩主带来的可见度必须临时、有界，也不能凭空制造真实产出。"
 zg361cp.31.a:0 "给予一次透明的小额引荐。"
 zg361cp.31.b:0 "动用一笔有界恩主信用。"
 zg361cp.31.c:0 "延期本机制，并登记一笔下周期制度债。"
 zg361cp.54.t:0 "汇报会挤占交付容量"
 zg361cp.54.desc:0 "制作材料会真实消耗项目工时，却不会直接生成交付产出。"
 zg361cp.54.a:0 "制作签字短事实表。"
 zg361cp.54.b:0 "制作长叙事，并支付四小时。"
 zg361cp.54.c:0 "延期本机制，并登记一笔下周期制度债。"
 zg361cp.55.t:0 "送达不等于阅读"
 zg361cp.55.desc:0 "材料送达后，只有上司实际消耗两个有限深读席位之一，才算真正看见。"
 zg361cp.55.a:0 "让直属上司消耗一个阅读席位。"
 zg361cp.55.b:0 "直属与越级上司各消耗一个席位。"
 zg361cp.55.c:0 "延期本机制，并登记一笔下周期制度债。"
 zg361cp.56.t:0 "逐级上报不能悄悄截功"
 zg361cp.56.desc:0 "逐级上报必须从签字贡献底稿出发，任何转移都必须净额为零。"
 zg361cp.56.a:0 "原样转发签字份额。"
 zg361cp.56.b:0 "向上司转移五百基点。"
 zg361cp.56.c:0 "延期本机制，并登记一笔下周期制度债。"
 zg361cp.57.t:0 "冻结汇报版本签名"
 zg361cp.57.desc:0 "只有合计一万基点的完整归属表，才能取得作者的版本签名。"
 zg361cp.57.a:0 "签署第一版。"
 zg361cp.57.b:0 "审证后签署第二版。"
 zg361cp.57.c:0 "延期本机制，并登记一笔下周期制度债。"
 zg361cp.58.t:0 "先签字，再路由"
 zg361cp.58.desc:0 "直属与越级路由只记录收件人，本身不会消耗阅读席位。"
 zg361cp.58.a:0 "只送直属上司。"
 zg361cp.58.b:0 "同时送直属与越级上司。"
 zg361cp.58.c:0 "延期本机制，并登记一笔下周期制度债。"
 zg361cp.59.t:0 "坏消息必须有时间戳"
 zg361cp.59.desc:0 "早报、迟报与隐瞒会产生不同的剩余损失和诚信收执。"
 zg361cp.59.a:0 "提前报告，把剩余损失减半。"
 zg361cp.59.b:0 "延迟报告，承担全部损失。"
 zg361cp.59.c:0 "延期本机制，并登记一笔下周期制度债。"
 zg361cp.60.t:0 "创意归属服从签字版本"
 zg361cp.60.desc:0 "创意窃取争议以冻结作者签名和跨部门来源为裁判依据。"
 zg361cp.60.a:0 "支持原作者。"
 zg361cp.60.b:0 "认可证据充分的共同作者。"
 zg361cp.60.c:0 "延期本机制，并登记一笔下周期制度债。"
 zg361cp.61.t:0 "先定汇报制度"
 zg361cp.61.desc:0 "短事实、长叙事与仅报异常三种制度，消耗的容量不同。"
 zg361cp.61.a:0 "采用短事实汇报。"
 zg361cp.61.b:0 "要求长叙事汇报。"
 zg361cp.61.c:0 "延期本机制，并登记一笔下周期制度债。"
 zg361cp.62.t:0 "两条汇报线，只能留下一个选择"
 zg361cp.62.desc:0 "目标冲突必须按冻结权重、联合仲裁或明确的诚信债处理。"
 zg361cp.62.a:0 "服从权重更高的实线。"
 zg361cp.62.b:0 "提交联合仲裁。"
 zg361cp.62.c:0 "延期本机制，并登记一笔下周期制度债。"
 zg361cp.63.t:0 "锁定实线与虚线权重"
 zg361cp.63.desc:0 "周期开始时冻结两名管理者的权重，合计必须正好一百。"
 zg361cp.63.a:0 "实线七成、虚线三成。"
 zg361cp.63.b:0 "双方各半。"
 zg361cp.63.c:0 "延期本机制，并登记一笔下周期制度债。"
 zg361cp.64.t:0 "换老板必须双签"
 zg361cp.64.desc:0 "只有新旧上司共同签字才能转移未来责任；历史案卷 owner 永远不动。"
 zg361cp.64.a:0 "收齐双方签名并完成交接。"
 zg361cp.64.b:0 "只记录旧上司签名。"
 zg361cp.64.c:0 "延期本机制，并登记一笔下周期制度债。"
 zg361cp.65.t:0 "空降主管与旧部包"
 zg361cp.65.desc:0 "随空降主管带入的旧部会挤掉组织记忆，也可能触发任人唯亲审计。"
 zg361cp.65.a:0 "十人中带入两名旧部。"
 zg361cp.65.b:0 "带入三人并触发审计阈值。"
 zg361cp.65.c:0 "延期本机制，并登记一笔下周期制度债。"
 zg361cp.66.t:0 "业务取消不等于个人失败"
 zg361cp.66.desc:0 "战略取消会释放未花容量，同时保留已独立验证的个人贡献。"
 zg361cp.66.a:0 "立即取消，并保留已验证功劳。"
 zg361cp.66.b:0 "批准稍后取消，不改写个人功劳。"
 zg361cp.66.c:0 "延期本机制，并登记一笔下周期制度债。"
 zg361cp.67.t:0 "一岗两人最终只能有一个 owner"
 zg361cp.67.desc:0 "公开竞争、直接保留或有界过渡，最终都必须留下唯一责任人。"
 zg361cp.67.a:0 "保留受评官员。"
 zg361cp.67.b:0 "保留跨部门现任者。"
 zg361cp.67.c:0 "延期本机制，并登记一笔下周期制度债。"
 zg361cp.68.t:0 "履历可携带，历史作者不改写"
 zg361cp.68.desc:0 "评级与未结 PIP 可以作为先验携带，但不占本期名额，也不能改写旧案 owner。"
 zg361cp.68.a:0 "携带一个保护周期及未结 PIP。"
 zg361cp.68.b:0 "只携带评级，不携带 PIP。"
 zg361cp.68.c:0 "延期本机制，并登记一笔下周期制度债。"
 zg361cp.129.t:0 "晋升是有真实槽位的队列"
 zg361cp.129.desc:0 "先进先出资格与一个有界授予槽，防止重复或插队晋升。"
 zg361cp.129.a:0 "把受评者排入下一空缺。"
 zg361cp.129.b:0 "入队并分配唯一可用槽位。"
 zg361cp.129.c:0 "延期本机制，并登记一笔下周期制度债。"
 zg361cp.130.t:0 "不能把隐藏 PIP 倾倒给别组"
 zg361cp.130.desc:0 "调动来源必须记录 PIP 披露、岗位证据、试用结果与原上司责任。"
 zg361cp.130.a:0 "披露 PIP，并进行有支持的试用。"
 zg361cp.130.b:0 "以错岗证据完成岗位救援。"
 zg361cp.130.c:0 "延期本机制，并登记一笔下周期制度债。"
 zg361cp.131.t:0 "探索项目与承诺项目分轨"
 zg361cp.131.desc:0 "项目类型和成功口径必须在登记时、结果未知前冻结。"
 zg361cp.131.a:0 "登记为探索型项目。"
 zg361cp.131.b:0 "登记为承诺型项目。"
 zg361cp.131.c:0 "延期本机制，并登记一笔下周期制度债。"
 zg361cp.132.t:0 "及时止损也可以算功"
 zg361cp.132.desc:0 "止损会释放未花容量，并把业务结果与个人判断分账。"
 zg361cp.132.a:0 "证据充分时止损，并给予及时止损功劳。"
 zg361cp.132.b:0 "迟到止损，并记录具名责任。"
 zg361cp.132.c:0 "延期本机制，并登记一笔下周期制度债。"
 zg361cp.133.t:0 "复盘学习与具名责任分轨"
 zg361cp.133.desc:0 "系统原因与学习行动不触发连坐；证据成立的违规仍须具名。"
 zg361cp.133.a:0 "记录学习，不认定个人违规。"
 zg361cp.133.b:0 "记录系统学习及一项具名违规。"
 zg361cp.133.c:0 "延期本机制，并登记一笔下周期制度债。"
 zg361cp.134.t:0 "共享指标仍然只有一个 owner"
 zg361cp.134.desc:0 "贡献者和依赖方可以很多，但最终结算责任只能分配一次。"
 zg361cp.134.a:0 "指定受评者为唯一 owner。"
 zg361cp.134.b:0 "指定直属上司为唯一 owner。"
 zg361cp.134.c:0 "延期本机制，并登记一笔下周期制度债。"
