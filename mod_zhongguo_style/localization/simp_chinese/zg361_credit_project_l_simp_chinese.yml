l_simp_chinese:
 zg361cp.batch.t:0 "本轮办案方式"
 zg361cp.batch.desc:0 "本轮项目案卷已经归集：[zg361_cp_e_subject.GetShortUIName]是当事人，[zg361_cp_e_owner.GetShortUIName]将作裁决。其中十一项属于常规登记，其余十六项涉及付款、回应、期限、去留或结算，仍须逐案审理。当前未清制度债为[zg361_cp_e_subject.MakeScope.Var('zg361_cp_policy_debt_open_n').GetValue|0]笔。"
 zg361cp.batch.a:0 "证据优先统一办理十一案；条件不足则逐案呈报。"
 zg361cp.batch.b:0 "速度优先统一办理十一案；条件不足则逐案呈报。"
 zg361cp.batch.c:0 "关闭十一项常规案，各记一笔制度债。"
 zg361cp.batch.d:0 "保留全部二十七项案卷，逐项裁决。"
 zg361cp.batch.c.tt:0 "实际新增数严格等于本次真正关闭的常规案数，每案至多记一笔；已经办结的案卷不会重复记账。涉及付款、回应、期限、去留或结算的其余十六项仍会逐案呈报，另行裁决。"
 zg361cp.26.t:0 "实绩与可见度分账"
 zg361cp.26.desc:0 "当事人：[zg361_cp_e_subject.GetShortUIName]；裁决者：[zg361_cp_e_owner.GetShortUIName]。容量账显示交付、汇报与关系事务正在争用同一份余额；目前只有交付工时产出了实际成果。"
 zg361cp.26.a:0 "分配二十小时交付、两小时汇报及一小时关系事务；共占二十三小时容量。"
 zg361cp.26.b:0 "分配十五小时交付、四小时汇报及三小时关系事务；共占二十二小时容量。"
 zg361cp.26.c:0 "关闭本项，登记制度债。"
 zg361cp.26.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361cp.27.t:0 "把百分之百贡献分配清楚"
 zg361cp.27.desc:0 "当事人：[zg361_cp_e_subject.GetShortUIName]；裁决者：[zg361_cp_e_owner.GetShortUIName]。受评者、直属上司与跨部门贡献者都对同一成果提出了主张；案卷尚无合计一万基点的完整归属表，冻结事实也不足以唯一推出一种比例。"
 zg361cp.27.a:0 "暂按受评者七成、直属上司两成、跨部门一成登记功劳。"
 zg361cp.27.b:0 "暂按受评者五成、直属上司三成、跨部门两成登记功劳。"
 zg361cp.27.c:0 "关闭本项，登记制度债。"
 zg361cp.27.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361cp.28.t:0 "抢功申诉与审计回拨"
 zg361cp.28.desc:0 "当事人：[zg361_cp_e_subject.GetShortUIName]；裁决者：[zg361_cp_e_owner.GetShortUIName]。直属上司要求从冻结归属表取得五百基点，但本案没有足以支持或驳回该要求的审证结论；任何获准转移都不能改变总量。"
 zg361cp.28.a:0 "批准所请转移：从受评者向直属上司转移五百基点。"
 zg361cp.28.b:0 "驳回并撤销拟议的五百基点转移，维持原份额。"
 zg361cp.28.c:0 "关闭本项，登记制度债。"
 zg361cp.28.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361cp.29.t:0 "指标包装与审计"
 zg361cp.29.desc:0 "当事人：[zg361_cp_e_subject.GetShortUIName]；裁决者：[zg361_cp_e_owner.GetShortUIName]。账面指标突然上升，复核尚未查清收益来源与后续成本；本次选择只登记暂定核算口径，不冒充已经查明的事实。"
 zg361cp.29.a:0 "暂按真实改善口径登记：短期收益十，延迟成本为零。"
 zg361cp.29.b:0 "暂按指标博弈口径登记：短期收益二十、延迟成本八。"
 zg361cp.29.c:0 "关闭本项，登记制度债。"
 zg361cp.29.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361cp.30.t:0 "资源赛马只产生一个赢家"
 zg361cp.30.desc:0 "当事人：[zg361_cp_e_subject.GetShortUIName]；裁决者：[zg361_cp_e_owner.GetShortUIName]。一份由当事人主导的四十小时提案与一份六十小时跨部门提案正在争夺唯一项目席位；容量账尚未预留工时。"
 zg361cp.30.a:0 "批准当事人主导的四十小时项目。"
 zg361cp.30.b:0 "批准六十小时跨部门项目。"
 zg361cp.30.c:0 "关闭本项，登记制度债。"
 zg361cp.30.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361cp.31.t:0 "恩主信用有上限也会到期"
 zg361cp.31.desc:0 "当事人：[zg361_cp_e_subject.GetShortUIName]；裁决者：[zg361_cp_e_owner.GetShortUIName]。恩主愿意出面引荐，但可用信用有限且会到期；这份人情没有附带任何新的交付证据。"
 zg361cp.31.a:0 "接受二十点恩主信用但暂不动用；增加五点可见度，不增加交付产出。"
 zg361cp.31.b:0 "接受三十点恩主信用并动用十点；增加十点可见度，不增加交付产出。"
 zg361cp.31.c:0 "关闭本项，登记制度债。"
 zg361cp.31.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361cp.54.t:0 "汇报会挤占交付容量"
 zg361cp.54.desc:0 "当事人：[zg361_cp_i_subject.GetShortUIName]；裁决者：[zg361_cp_i_owner.GetShortUIName]。汇报材料尚未制作；投入其中的每个小时都会从项目剩余容量中扣除，却不会增加交付产出。"
 zg361cp.54.a:0 "制作冻结的短事实表，支付一小时。"
 zg361cp.54.b:0 "制作长叙事，支付四小时。"
 zg361cp.54.c:0 "关闭本项，登记制度债。"
 zg361cp.54.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361cp.55.t:0 "送达不等于阅读"
 zg361cp.55.desc:0 "直属上司[zg361_cp_i_owner.GetShortUIName]已经收到[zg361_cp_i_subject.GetShortUIName]的材料，两个深读席位却都尚未使用；仅有送达记录，不能证明任何人真正读过。"
 zg361cp.55.a:0 "消耗一个阅读席位，让直属上司深读；增加五点可见度。"
 zg361cp.55.b:0 "消耗两个阅读席位，让直属与越级上司各深读一次；增加十点可见度。"
 zg361cp.55.c:0 "关闭本项，登记制度债。"
 zg361cp.55.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361cp.56.t:0 "逐级上报不能悄悄截功"
 zg361cp.56.desc:0 "当事人：[zg361_cp_i_subject.GetShortUIName]；裁决者：[zg361_cp_i_owner.GetShortUIName]。冻结贡献底稿即将上送，一名上司要求取得五百基点；本案没有冻结支持该要求的审证结论，无论如何登记都必须保持总量不变。"
 zg361cp.56.a:0 "原样转发冻结份额。"
 zg361cp.56.b:0 "登记上司所请的五百基点转移，但不声称已经审证。"
 zg361cp.56.c:0 "关闭本项，登记制度债。"
 zg361cp.56.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361cp.57.t:0 "冻结汇报版本"
 zg361cp.57.desc:0 "当事人：[zg361_cp_i_subject.GetShortUIName]；裁决者：[zg361_cp_i_owner.GetShortUIName]。当前归属表已经合计一万基点；本案没有显示版本一与版本二之间的内容差异，本次选择只决定用哪个版本号冻结同一张表。"
 zg361cp.57.a:0 "将当前未改动的归属表冻结为版本一。"
 zg361cp.57.b:0 "将当前未改动的归属表冻结为版本二。"
 zg361cp.57.c:0 "关闭本项，登记制度债。"
 zg361cp.57.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361cp.58.t:0 "先冻结版本，再路由"
 zg361cp.58.desc:0 "当事人：[zg361_cp_i_subject.GetShortUIName]；裁决者：[zg361_cp_i_owner.GetShortUIName]。材料已经冻结并等待送出；收件记录只能证明去向，真正阅读之前不会消耗注意力席位。"
 zg361cp.58.a:0 "只送直属上司；暂不计入已阅读。"
 zg361cp.58.b:0 "同时送直属与越级上司；暂不计入已阅读。"
 zg361cp.58.c:0 "关闭本项，登记制度债。"
 zg361cp.58.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361cp.59.t:0 "坏消息必须有时间戳"
 zg361cp.59.desc:0 "当事人：[zg361_cp_i_subject.GetShortUIName]；裁决者：[zg361_cp_i_owner.GetShortUIName]。风险已经进入报告时限。此后每拖延一步，未化解的损失都会增加，案卷上的诚信回执也会变差。"
 zg361cp.59.a:0 "立即报告：剩余损失降至五，诚信记录增加一点。"
 zg361cp.59.b:0 "延迟报告：保留九点损失，诚信记录不增加。"
 zg361cp.59.c:0 "关闭本项，登记制度债。"
 zg361cp.59.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361cp.60.t:0 "创意归属服从冻结版本"
 zg361cp.60.desc:0 "争议双方[zg361_cp_i_subject.GetShortUIName]与跨部门贡献者[zg361_cp_i_cross_reviewer.GetShortUIName]同时认领同一项创意，冻结作者记录与跨部门来源对两人的贡献给出了冲突线索。"
 zg361cp.60.a:0 "支持原作者。"
 zg361cp.60.b:0 "认可证据充分的共同作者。"
 zg361cp.60.c:0 "关闭本项，登记制度债。"
 zg361cp.60.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361cp.61.t:0 "先定汇报制度"
 zg361cp.61.desc:0 "当事人：[zg361_cp_i_subject.GetShortUIName]；裁决者：[zg361_cp_i_owner.GetShortUIName]。眼下没有统一汇报规则，各团队送来的材料长短悬殊，对项目容量的消耗也因此无法预估。"
 zg361cp.61.a:0 "采用短事实汇报制度；每份材料占用一小时容量。"
 zg361cp.61.b:0 "采用长叙事汇报制度；每份材料占用四小时容量。"
 zg361cp.61.c:0 "关闭本项，登记制度债。"
 zg361cp.61.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361cp.62.t:0 "两条汇报线，只能留下一个选择"
 zg361cp.62.desc:0 "对[zg361_cp_j_subject.GetShortUIName]发令的两名上司[zg361_cp_j_owner.GetShortUIName]与[zg361_cp_j_cross_reviewer.GetShortUIName]下达了互不相容的目标；若同时照办，案卷只会留下两项矛盾承诺，没有唯一责任指令。"
 zg361cp.62.a:0 "服从权重更高的实线。"
 zg361cp.62.b:0 "提交联合仲裁。"
 zg361cp.62.c:0 "关闭本项，登记制度债。"
 zg361cp.62.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361cp.63.t:0 "锁定实线与虚线权重"
 zg361cp.63.desc:0 "两名上司[zg361_cp_j_owner.GetShortUIName]与[zg361_cp_j_cross_reviewer.GetShortUIName]在本周期争用对[zg361_cp_j_subject.GetShortUIName]的考核权，而案卷中的实线与虚线权重还没有合计到一百。"
 zg361cp.63.a:0 "按实线七成、虚线三成分配考核权。"
 zg361cp.63.b:0 "按实线与虚线各五成分配考核权。"
 zg361cp.63.c:0 "关闭本项，登记制度债。"
 zg361cp.63.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361cp.64.t:0 "换上司必须列明新旧责任人"
 zg361cp.64.desc:0 "官员[zg361_cp_j_subject.GetShortUIName]的职司交接已经提上日程；未来责任可以从[zg361_cp_j_owner.GetShortUIName]转给继任者[zg361_cp_j_successor_manager.GetShortUIName]，历史案卷仍归[zg361_cp_j_owner.GetShortUIName]，案卷尚未同时列明新旧上司。"
 zg361cp.64.a:0 "列明新旧上司并完成交接；未来责任转给继任者，旧案仍归原上司。"
 zg361cp.64.b:0 "只记录旧上司，交接保持待定；未来责任暂不转移。"
 zg361cp.64.c:0 "关闭本项，登记制度债。"
 zg361cp.64.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361cp.65.t:0 "空降主管与旧部包"
 zg361cp.65.desc:0 "新任主管[zg361_cp_j_owner.GetShortUIName]准备把旧部带进[zg361_cp_j_subject.GetShortUIName]所在的十人团队；每占一个席位都会挤掉组织记忆，任人唯亲的审计阈值也已逼近。"
 zg361cp.65.a:0 "十人中带入两名旧部，保留八名原团队成员。"
 zg361cp.65.b:0 "带入三名旧部，保留七名原团队成员并触发任人唯亲审计。"
 zg361cp.65.c:0 "关闭本项，登记制度债。"
 zg361cp.65.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361cp.66.t:0 "业务取消不等于个人失败"
 zg361cp.66.desc:0 "上司[zg361_cp_j_owner.GetShortUIName]主持的战略复核已经支持取消[zg361_cp_j_subject.GetShortUIName]负责的项目，案卷却仍把未花容量与已独立验证的个人贡献混在一起。"
 zg361cp.66.a:0 "立即取消，释放全部剩余容量并保留已验证功劳。"
 zg361cp.66.b:0 "登记稍后取消；暂不释放容量，也不改写个人功劳。"
 zg361cp.66.c:0 "关闭本项，登记制度债。"
 zg361cp.66.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361cp.67.t:0 "一岗两人最终只能有一个责任人"
 zg361cp.67.desc:0 "同一职司名下同时挂着[zg361_cp_j_subject.GetShortUIName]与[zg361_cp_j_cross_reviewer.GetShortUIName]两名现任者。[zg361_cp_j_owner.GetShortUIName]只有在其中一人成为唯一责任人后才能结清案卷。"
 zg361cp.67.a:0 "保留受评官员。"
 zg361cp.67.b:0 "保留跨部门现任者。"
 zg361cp.67.c:0 "关闭本项，登记制度债。"
 zg361cp.67.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361cp.68.t:0 "履历可携带，历史作者不改写"
 zg361cp.68.desc:0 "调入者[zg361_cp_j_subject.GetShortUIName]带着旧评级与未结绩效改进计划到[zg361_cp_j_active_manager.GetShortUIName]麾下，旧案仍由[zg361_cp_j_historical_owner.GetShortUIName]负责。接收团队尚未确定哪些历史只作先验，它们都不能占用本期名额或改写旧案责任人。"
 zg361cp.68.a:0 "携带一个保护周期及仍未结案的绩效改进计划；不占本期名额。"
 zg361cp.68.b:0 "携带一个保护周期及旧评级，不携带绩效改进计划；不占本期名额。"
 zg361cp.68.c:0 "关闭本项，登记制度债。"
 zg361cp.68.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361cp.129.t:0 "晋升是有真实槽位的队列"
 zg361cp.129.desc:0 "晋升案卷由[zg361_cp_r_owner.GetShortUIName]掌管，队列已经排定资格先后，本周期却只有一个授予槽；[zg361_cp_r_subject.GetShortUIName]尚未与这个空缺完成匹配。"
 zg361cp.129.a:0 "把受评者排入下一空缺；保留两周期资格，但本期不授予。"
 zg361cp.129.b:0 "把受评者入队并占用唯一槽位；本期立即授予，资格保留两周期。"
 zg361cp.129.c:0 "关闭本项，登记制度债。"
 zg361cp.129.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361cp.130.t:0 "不能把隐藏绩效改进计划倾倒给别组"
 zg361cp.130.desc:0 "调动申请人[zg361_cp_r_subject.GetShortUIName]拟从[zg361_cp_r_owner.GetShortUIName]麾下转往[zg361_cp_r_cross_reviewer.GetShortUIName]处，同时带着未结绩效改进计划与错岗主张；披露、岗位证据、试用结果和原上司责任尚未连成完整链条。"
 zg361cp.130.a:0 "披露绩效改进计划，并进行有支持的试用。"
 zg361cp.130.b:0 "以错岗证据完成岗位救援。"
 zg361cp.130.c:0 "关闭本项，登记制度债。"
 zg361cp.130.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361cp.131.t:0 "探索项目与承诺项目分轨"
 zg361cp.131.desc:0 "官员[zg361_cp_r_subject.GetShortUIName]所涉项目尚无结果，[zg361_cp_r_owner.GetShortUIName]手中的案卷也没有登记类型和对应成功口径；探索任务与承诺任务本来就不该用同一把尺。"
 zg361cp.131.a:0 "登记为探索型项目。"
