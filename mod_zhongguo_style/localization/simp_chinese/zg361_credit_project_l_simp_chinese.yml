 zg361cp.batch.t:0 "本轮办案方式"
 zg361cp.batch.desc:0 "本轮项目案卷已经归集：[scope:zg361_cp_e_subject.GetShortUIName]是当事人，[scope:zg361_cp_e_owner.GetShortUIName]将作裁决。其中十一项属于常规登记，其余十六项涉及付款、回应、期限、去留或结算，仍须逐案审理。当前未清制度债为[scope:zg361_cp_e_subject.MakeScope.Var('zg361_cp_policy_debt_open_n').GetValue|0]笔。"
 zg361cp.batch.a:0 "以可追溯证据为准，统一办理十一项常规案；条件不足者单独呈报。"
 zg361cp.batch.b:0 "以执行速度为先，统一办理十一项常规案；条件不足者单独呈报。"
 zg361cp.batch.c:0 "关闭十一项常规案并各记一笔制度债；条件不足者单独呈报。"
 zg361cp.batch.d:0 "保留全部二十七项案卷，逐项裁决。"
 zg361cp.batch.c.tt:0 "实际新增数严格等于本次真正关闭的常规案数，每案至多记一笔；已经办结的案卷不会重复记账。涉及付款、回应、期限、去留或结算的其余十六项仍会逐案呈报，另行裁决。"
 zg361cp.26.t:0 "实绩与可见度分账"
 zg361cp.26.desc:0 "一份贡献与工时底稿已经摊开：[scope:zg361_cp_e_subject.GetShortUIName]是本案当事人，[scope:zg361_cp_e_owner.GetShortUIName]将作裁决。交付、汇报与关系工时花的是同一份项目容量，只有交付工时会生成真实产出。"
 zg361cp.26.a:0 "保护交付，只做精简汇报。"
 zg361cp.26.b:0 "交付与完整汇报并重。"
 zg361cp.26.c:0 "关闭本项，登记制度债。"
 zg361cp.26.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
