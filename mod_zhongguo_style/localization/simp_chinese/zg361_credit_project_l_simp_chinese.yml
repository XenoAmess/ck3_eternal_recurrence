 zg361cp.28.desc:0 "一份贡献与工时底稿已经摊开：[scope:zg361_cp_e_subject.GetShortUIName]是本案当事人，[scope:zg361_cp_e_owner.GetShortUIName]将作裁决。功劳转移必须净额为零；抢功不成立时必须完整回拨，不能改写冻结的归属底稿。"
