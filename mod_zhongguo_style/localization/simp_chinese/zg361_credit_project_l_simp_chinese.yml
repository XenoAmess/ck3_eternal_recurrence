l_simp_chinese:
 zg361cp.26.t:0 "实绩与可见度分账"
 zg361cp.26.desc:0 "当事人：[scope:zg361_cp_e_subject.GetShortUIName]；裁决者：[scope:zg361_cp_e_owner.GetShortUIName]。交付、汇报与关系工时花的是同一份项目容量，只有交付工时会生成真实产出。 路线甲、乙会执行所述业务选择；路线丙只关闭本项并登记制度债。 本卡承接同一项目案卷的上一项回执，选择会立即写入；按钮写明本项实际处理。"
 zg361cp.26.a:0 "保护交付，只做精简汇报。"
 zg361cp.26.b:0 "交付与完整汇报并重。"
 zg361cp.26.c:0 "本轮不执行该业务动作并关闭本项；登记一笔下周期制度债，且不会自动重提。"
 zg361cp.27.t:0 "把百分之百贡献分配清楚"
 zg361cp.27.desc:0 "当事人：[scope:zg361_cp_e_subject.GetShortUIName]；裁决者：[scope:zg361_cp_e_owner.GetShortUIName]。裁决者必须在受评者、直属上司与跨部门贡献者之间完整分配一万基点。这是裁决者签发的归属底稿，不冒充三人亲自签字。 路线甲、乙会执行所述业务选择；路线丙只关闭本项并登记制度债。 本卡承接同一项目案卷的上一项回执，选择会立即写入；按钮写明本项实际处理。"
 zg361cp.27.a:0 "让受评者取得明确多数。"
 zg361cp.27.b:0 "采用均衡的跨部门分配。"
 zg361cp.27.c:0 "本轮不执行该业务动作并关闭本项；登记一笔下周期制度债，且不会自动重提。"
 zg361cp.28.t:0 "抢功申诉与审计回拨"
 zg361cp.28.desc:0 "当事人：[scope:zg361_cp_e_subject.GetShortUIName]；裁决者：[scope:zg361_cp_e_owner.GetShortUIName]。功劳转移必须净额为零；抢功不成立时必须完整回拨，不能改写冻结的归属底稿。 路线甲、乙会执行所述业务选择；路线丙只关闭本项并登记制度债。 本卡承接同一项目案卷的上一项回执，选择会立即写入；按钮写明本项实际处理。"
 zg361cp.28.a:0 "支持一笔有界的上司主张。"
 zg361cp.28.b:0 "审证后完整回拨抢功。"
 zg361cp.28.c:0 "本轮不执行该业务动作并关闭本项；登记一笔下周期制度债，且不会自动重提。"
 zg361cp.29.t:0 "指标包装与审计"
 zg361cp.29.desc:0 "当事人：[scope:zg361_cp_e_subject.GetShortUIName]；裁决者：[scope:zg361_cp_e_owner.GetShortUIName]。短期指标收益、延迟成本与造假回拨必须分账结算并可追溯。 路线甲、乙会执行所述业务选择；路线丙只关闭本项并登记制度债。 本卡承接同一项目案卷的上一项回执，选择会立即写入；按钮写明本项实际处理。"
 zg361cp.29.a:0 "记录真实改善。"
 zg361cp.29.b:0 "记录指标博弈及其延迟成本。"
 zg361cp.29.c:0 "本轮不执行该业务动作并关闭本项；登记一笔下周期制度债，且不会自动重提。"
 zg361cp.30.t:0 "资源赛马只产生一个赢家"
 zg361cp.30.desc:0 "当事人：[scope:zg361_cp_e_subject.GetShortUIName]；裁决者：[scope:zg361_cp_e_owner.GetShortUIName]。开工前必须从唯一项目席位和有限容量账本中真实预留资源。 路线甲、乙会执行所述业务选择；路线丙只关闭本项并登记制度债。 本卡承接同一项目案卷的上一项回执，选择会立即写入；按钮写明本项实际处理。"
 zg361cp.30.a:0 "给受评者主导的项目四十小时。"
 zg361cp.30.b:0 "给跨部门项目六十小时。"
 zg361cp.30.c:0 "本轮不执行该业务动作并关闭本项；登记一笔下周期制度债，且不会自动重提。"
 zg361cp.31.t:0 "恩主信用有上限也会到期"
 zg361cp.31.desc:0 "当事人：[scope:zg361_cp_e_subject.GetShortUIName]；裁决者：[scope:zg361_cp_e_owner.GetShortUIName]。恩主带来的可见度必须临时、有界，也不能凭空制造真实产出。 路线甲、乙会执行所述业务选择；路线丙只关闭本项并登记制度债。 本卡承接同一项目案卷的上一项回执，选择会立即写入；按钮写明本项实际处理。"
 zg361cp.31.a:0 "给予一次透明的小额引荐。"
 zg361cp.31.b:0 "动用一笔有界恩主信用。"
 zg361cp.31.c:0 "本轮不执行该业务动作并关闭本项；登记一笔下周期制度债，且不会自动重提。"
 zg361cp.54.t:0 "汇报会挤占交付容量"
 zg361cp.54.desc:0 "当事人：[scope:zg361_cp_i_subject.GetShortUIName]；裁决者：[scope:zg361_cp_i_owner.GetShortUIName]。制作材料会真实消耗项目工时，却不会直接生成交付产出。 路线甲、乙会执行所述业务选择；路线丙只关闭本项并登记制度债。 本卡承接同一项目案卷的上一项回执，选择会立即写入；按钮写明本项实际处理。"
 zg361cp.54.a:0 "制作冻结的短事实表。"
 zg361cp.54.b:0 "制作长叙事，并支付四小时。"
 zg361cp.54.c:0 "本轮不执行该业务动作并关闭本项；登记一笔下周期制度债，且不会自动重提。"
 zg361cp.55.t:0 "送达不等于阅读"
 zg361cp.55.desc:0 "当事人：[scope:zg361_cp_i_subject.GetShortUIName]；裁决者：[scope:zg361_cp_i_owner.GetShortUIName]。材料送达后，只有上司实际消耗两个有限深读席位之一，才算真正看见。 路线甲、乙会执行所述业务选择；路线丙只关闭本项并登记制度债。 本卡承接同一项目案卷的上一项回执，选择会立即写入；按钮写明本项实际处理。"
 zg361cp.55.a:0 "让直属上司消耗一个阅读席位。"
 zg361cp.55.b:0 "直属与越级上司各消耗一个席位。"
 zg361cp.55.c:0 "本轮不执行该业务动作并关闭本项；登记一笔下周期制度债，且不会自动重提。"
 zg361cp.56.t:0 "逐级上报不能悄悄截功"
 zg361cp.56.desc:0 "当事人：[scope:zg361_cp_i_subject.GetShortUIName]；裁决者：[scope:zg361_cp_i_owner.GetShortUIName]。逐级上报必须从冻结的贡献底稿出发，任何转移都必须净额为零。 路线甲、乙会执行所述业务选择；路线丙只关闭本项并登记制度债。 本卡承接同一项目案卷的上一项回执，选择会立即写入；按钮写明本项实际处理。"
 zg361cp.56.a:0 "原样转发冻结份额。"
 zg361cp.56.b:0 "向上司转移五百基点。"
 zg361cp.56.c:0 "本轮不执行该业务动作并关闭本项；登记一笔下周期制度债，且不会自动重提。"
 zg361cp.57.t:0 "冻结汇报版本"
 zg361cp.57.desc:0 "当事人：[scope:zg361_cp_i_subject.GetShortUIName]；裁决者：[scope:zg361_cp_i_owner.GetShortUIName]。只有合计一万基点的完整归属表，才能冻结为受评者署名的汇报版本；冻结作者身份不等于冒充本人新签字。 路线甲、乙会执行所述业务选择；路线丙只关闭本项并登记制度债。 本卡承接同一项目案卷的上一项回执，选择会立即写入；按钮写明本项实际处理。"
 zg361cp.57.a:0 "冻结第一版。"
 zg361cp.57.b:0 "审证后冻结第二版。"
 zg361cp.57.c:0 "本轮不执行该业务动作并关闭本项；登记一笔下周期制度债，且不会自动重提。"
 zg361cp.58.t:0 "先冻结版本，再路由"
 zg361cp.58.desc:0 "当事人：[scope:zg361_cp_i_subject.GetShortUIName]；裁决者：[scope:zg361_cp_i_owner.GetShortUIName]。直属与越级路由只记录收件人，本身不会消耗阅读席位。 路线甲、乙会执行所述业务选择；路线丙只关闭本项并登记制度债。 本卡承接同一项目案卷的上一项回执，选择会立即写入；按钮写明本项实际处理。"
 zg361cp.58.a:0 "只送直属上司。"
 zg361cp.58.b:0 "同时送直属与越级上司。"
 zg361cp.58.c:0 "本轮不执行该业务动作并关闭本项；登记一笔下周期制度债，且不会自动重提。"
 zg361cp.59.t:0 "坏消息必须有时间戳"
 zg361cp.59.desc:0 "当事人：[scope:zg361_cp_i_subject.GetShortUIName]；裁决者：[scope:zg361_cp_i_owner.GetShortUIName]。早报、迟报与隐瞒会产生不同的剩余损失和诚信回执。 路线甲、乙会执行所述业务选择；路线丙只关闭本项并登记制度债。 本卡承接同一项目案卷的上一项回执，选择会立即写入；按钮写明本项实际处理。"
 zg361cp.59.a:0 "提前报告，把剩余损失减半。"
 zg361cp.59.b:0 "延迟报告，承担全部损失。"
 zg361cp.59.c:0 "本轮不执行该业务动作并关闭本项；登记一笔下周期制度债，且不会自动重提。"
 zg361cp.60.t:0 "创意归属服从冻结版本"
 zg361cp.60.desc:0 "当事人：[scope:zg361_cp_i_subject.GetShortUIName]；裁决者：[scope:zg361_cp_i_owner.GetShortUIName]。创意窃取争议以冻结作者记录和跨部门来源为裁判依据。 路线甲、乙会执行所述业务选择；路线丙只关闭本项并登记制度债。 本卡承接同一项目案卷的上一项回执，选择会立即写入；按钮写明本项实际处理。"
 zg361cp.60.a:0 "支持原作者。"
 zg361cp.60.b:0 "认可证据充分的共同作者。"
 zg361cp.60.c:0 "本轮不执行该业务动作并关闭本项；登记一笔下周期制度债，且不会自动重提。"
 zg361cp.61.t:0 "先定汇报制度"
 zg361cp.61.desc:0 "当事人：[scope:zg361_cp_i_subject.GetShortUIName]；裁决者：[scope:zg361_cp_i_owner.GetShortUIName]。短事实、长叙事与仅报异常三种制度，消耗的容量不同。 路线甲、乙会执行所述业务选择；路线丙只关闭本项并登记制度债。 本卡承接同一项目案卷的上一项回执，选择会立即写入；按钮写明本项实际处理。"
 zg361cp.61.a:0 "采用短事实汇报。"
 zg361cp.61.b:0 "要求长叙事汇报。"
 zg361cp.61.c:0 "本轮不执行该业务动作并关闭本项；登记一笔下周期制度债，且不会自动重提。"
 zg361cp.62.t:0 "两条汇报线，只能留下一个选择"
 zg361cp.62.desc:0 "当事人：[scope:zg361_cp_j_subject.GetShortUIName]；裁决者：[scope:zg361_cp_j_owner.GetShortUIName]。目标冲突必须按冻结权重、联合仲裁或明确的诚信债处理。 路线甲、乙会执行所述业务选择；路线丙只关闭本项并登记制度债。 本卡承接同一项目案卷的上一项回执，选择会立即写入；按钮写明本项实际处理。"
 zg361cp.62.a:0 "服从权重更高的实线。"
 zg361cp.62.b:0 "提交联合仲裁。"
 zg361cp.62.c:0 "本轮不执行该业务动作并关闭本项；登记一笔下周期制度债，且不会自动重提。"
 zg361cp.63.t:0 "锁定实线与虚线权重"
 zg361cp.63.desc:0 "当事人：[scope:zg361_cp_j_subject.GetShortUIName]；裁决者：[scope:zg361_cp_j_owner.GetShortUIName]。周期开始时冻结两名管理者的权重，合计必须正好一百。 路线甲、乙会执行所述业务选择；路线丙只关闭本项并登记制度债。 本卡承接同一项目案卷的上一项回执，选择会立即写入；按钮写明本项实际处理。"
 zg361cp.63.a:0 "实线七成、虚线三成。"
 zg361cp.63.b:0 "双方各半。"
 zg361cp.63.c:0 "本轮不执行该业务动作并关闭本项；登记一笔下周期制度债，且不会自动重提。"
 zg361cp.64.t:0 "换上司必须列明新旧责任人"
 zg361cp.64.desc:0 "当事人：[scope:zg361_cp_j_subject.GetShortUIName]；裁决者：[scope:zg361_cp_j_owner.GetShortUIName]。裁决者只有列明新旧上司后，才能下令转移未来责任；历史案卷责任人永远不动。这份命令不冒充两名上司亲自同意。 路线甲、乙会执行所述业务选择；路线丙只关闭本项并登记制度债。 本卡承接同一项目案卷的上一项回执，选择会立即写入；按钮写明本项实际处理。"
 zg361cp.64.a:0 "列明新旧上司并完成责令交接。"
 zg361cp.64.b:0 "只记录旧上司，交接保持待定。"
 zg361cp.64.c:0 "本轮不执行该业务动作并关闭本项；登记一笔下周期制度债，且不会自动重提。"
 zg361cp.65.t:0 "空降主管与旧部包"
 zg361cp.65.desc:0 "当事人：[scope:zg361_cp_j_subject.GetShortUIName]；裁决者：[scope:zg361_cp_j_owner.GetShortUIName]。随空降主管带入的旧部会挤掉组织记忆，也可能触发任人唯亲审计。 路线甲、乙会执行所述业务选择；路线丙只关闭本项并登记制度债。 本卡承接同一项目案卷的上一项回执，选择会立即写入；按钮写明本项实际处理。"
 zg361cp.65.a:0 "十人中带入两名旧部。"
 zg361cp.65.b:0 "带入三人并触发审计阈值。"
 zg361cp.65.c:0 "本轮不执行该业务动作并关闭本项；登记一笔下周期制度债，且不会自动重提。"
 zg361cp.66.t:0 "业务取消不等于个人失败"
 zg361cp.66.desc:0 "当事人：[scope:zg361_cp_j_subject.GetShortUIName]；裁决者：[scope:zg361_cp_j_owner.GetShortUIName]。战略取消会释放未花容量，同时保留已独立验证的个人贡献。 路线甲、乙会执行所述业务选择；路线丙只关闭本项并登记制度债。 本卡承接同一项目案卷的上一项回执，选择会立即写入；按钮写明本项实际处理。"
 zg361cp.66.a:0 "立即取消，并保留已验证功劳。"
 zg361cp.66.b:0 "批准稍后取消，不改写个人功劳。"
 zg361cp.66.c:0 "本轮不执行该业务动作并关闭本项；登记一笔下周期制度债，且不会自动重提。"
 zg361cp.67.t:0 "一岗两人最终只能有一个责任人"
 zg361cp.67.desc:0 "当事人：[scope:zg361_cp_j_subject.GetShortUIName]；裁决者：[scope:zg361_cp_j_owner.GetShortUIName]。公开竞争、直接保留或有界过渡，最终都必须留下唯一责任人。 路线甲、乙会执行所述业务选择；路线丙只关闭本项并登记制度债。 本卡承接同一项目案卷的上一项回执，选择会立即写入；按钮写明本项实际处理。"
 zg361cp.67.a:0 "保留受评官员。"
 zg361cp.67.b:0 "保留跨部门现任者。"
 zg361cp.67.c:0 "本轮不执行该业务动作并关闭本项；登记一笔下周期制度债，且不会自动重提。"
 zg361cp.68.t:0 "履历可携带，历史作者不改写"
 zg361cp.68.desc:0 "当事人：[scope:zg361_cp_j_subject.GetShortUIName]；裁决者：[scope:zg361_cp_j_owner.GetShortUIName]。评级与未结绩效改进计划可以作为先验携带，但不占本期名额，也不能改写旧案责任人。 路线甲、乙会执行所述业务选择；路线丙只关闭本项并登记制度债。 本卡承接同一项目案卷的上一项回执，选择会立即写入；按钮写明本项实际处理。"
 zg361cp.68.a:0 "携带一个保护周期及未结绩效改进计划。"
 zg361cp.68.b:0 "只携带评级，不携带绩效改进计划。"
 zg361cp.68.c:0 "本轮不执行该业务动作并关闭本项；登记一笔下周期制度债，且不会自动重提。"
 zg361cp.129.t:0 "晋升是有真实槽位的队列"
 zg361cp.129.desc:0 "当事人：[scope:zg361_cp_r_subject.GetShortUIName]；裁决者：[scope:zg361_cp_r_owner.GetShortUIName]。先进先出资格与一个有界授予槽，防止重复或插队晋升。 路线甲、乙会执行所述业务选择；路线丙只关闭本项并登记制度债。 本卡承接同一项目案卷的上一项回执，选择会立即写入；按钮写明本项实际处理。"
 zg361cp.129.a:0 "把受评者排入下一空缺。"
 zg361cp.129.b:0 "入队并分配唯一可用槽位。"
 zg361cp.129.c:0 "本轮不执行该业务动作并关闭本项；登记一笔下周期制度债，且不会自动重提。"
 zg361cp.130.t:0 "不能把隐藏绩效改进计划倾倒给别组"
 zg361cp.130.desc:0 "当事人：[scope:zg361_cp_r_subject.GetShortUIName]；裁决者：[scope:zg361_cp_r_owner.GetShortUIName]。调动来源必须记录绩效改进计划披露、岗位证据、试用结果与原上司责任。 路线甲、乙会执行所述业务选择；路线丙只关闭本项并登记制度债。 本卡承接同一项目案卷的上一项回执，选择会立即写入；按钮写明本项实际处理。"
