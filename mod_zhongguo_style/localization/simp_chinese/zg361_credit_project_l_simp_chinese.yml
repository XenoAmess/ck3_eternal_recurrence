l_simp_chinese:
 zg361cp.batch.t:0 "本轮办案方式"
 zg361cp.batch.desc:0 "本轮项目案卷已经归集：[zg361_cp_e_subject.GetShortUIName]是当事人，[zg361_cp_e_owner.GetShortUIName]将作裁决。其中十一项属于常规登记，其余十六项涉及付款、回应、期限、去留或结算，仍须逐案审理。当前未清制度债为[scope:zg361_cp_e_subject.MakeScope.Var('zg361_cp_policy_debt_open_n').GetValue|0]笔。"
 zg361cp.batch.a:0 "证据优先统一办理十一案；条件不足则逐案呈报。"
 zg361cp.batch.b:0 "速度优先统一办理十一案；条件不足则逐案呈报。"
 zg361cp.batch.c:0 "关闭十一项常规案，各记一笔制度债。"
 zg361cp.batch.d:0 "保留全部二十七项案卷，逐项裁决。"
 zg361cp.batch.c.tt:0 "实际新增数严格等于本次真正关闭的常规案数，每案至多记一笔；已经办结的案卷不会重复记账。涉及付款、回应、期限、去留或结算的其余十六项仍会逐案呈报，另行裁决。"
 zg361cp.26.t:0 "实绩与可见度分账"
 zg361cp.26.desc:0 "容量账显示交付、汇报与关系事务正在争用同一份余额；目前只有交付工时产出了实际成果。"
 zg361cp.26.a:0 "保护交付，只做精简汇报。"
 zg361cp.26.b:0 "交付与完整汇报并重。"
 zg361cp.26.c:0 "关闭本项，登记制度债。"
 zg361cp.26.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361cp.27.t:0 "把百分之百贡献分配清楚"
 zg361cp.27.desc:0 "受评者、直属上司与跨部门贡献者都对同一成果提出了主张；案卷尚无合计一万基点的完整归属表，三人也都没有亲自签字。"
 zg361cp.27.a:0 "受评者七成、直属上司两成、跨部门一成。"
 zg361cp.27.b:0 "受评者五成、直属上司三成、跨部门两成。"
 zg361cp.27.c:0 "关闭本项，登记制度债。"
 zg361cp.27.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361cp.28.t:0 "抢功申诉与审计回拨"
 zg361cp.28.desc:0 "直属上司对冻结归属表提出了加功主张；任何获准转移都不能改变总量，未获支持的改账也不能污染原底稿。"
 zg361cp.28.a:0 "从受评者向直属上司转移五百基点。"
 zg361cp.28.b:0 "审证后撤销五百基点转移，恢复原份额。"
 zg361cp.28.c:0 "关闭本项，登记制度债。"
 zg361cp.28.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361cp.29.t:0 "指标包装与审计"
 zg361cp.29.desc:0 "账面指标突然上升，复核却尚未查清收益来源，后续成本也仍未入账。"
 zg361cp.29.a:0 "确认真实改善：短期收益十，无延迟成本。"
 zg361cp.29.b:0 "认定指标博弈：短期收益二十、延迟成本八。"
 zg361cp.29.c:0 "关闭本项，登记制度债。"
 zg361cp.29.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361cp.30.t:0 "资源赛马只产生一个赢家"
 zg361cp.30.desc:0 "三份提案正在争夺唯一项目席位，有限容量账本里还没有为任何一项预留工时。"
 zg361cp.30.a:0 "给受评者主导的项目四十小时。"
 zg361cp.30.b:0 "给跨部门项目六十小时。"
 zg361cp.30.c:0 "关闭本项，登记制度债。"
 zg361cp.30.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361cp.31.t:0 "恩主信用有上限也会到期"
 zg361cp.31.desc:0 "恩主愿意出面引荐，但可用信用有限且会到期；这份人情没有附带任何新的交付证据。"
 zg361cp.31.a:0 "透明授信二十点，不动余额并增加五点可见度。"
 zg361cp.31.b:0 "动用十点恩主信用，增加十点可见度。"
 zg361cp.31.c:0 "关闭本项，登记制度债。"
 zg361cp.31.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361cp.54.t:0 "汇报会挤占交付容量"
 zg361cp.54.desc:0 "汇报材料尚未制作；投入其中的每个小时都会从项目剩余容量中扣除，却不会增加交付产出。"
 zg361cp.54.a:0 "制作冻结的短事实表，支付一小时。"
 zg361cp.54.b:0 "制作长叙事，支付四小时。"
 zg361cp.54.c:0 "关闭本项，登记制度债。"
 zg361cp.54.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361cp.55.t:0 "送达不等于阅读"
 zg361cp.55.desc:0 "材料已经送到管理层，两个深读席位却都尚未使用；仅有送达记录，不能证明任何人真正读过。"
 zg361cp.55.a:0 "让直属上司消耗一个阅读席位。"
 zg361cp.55.b:0 "直属与越级上司各消耗一个席位。"
 zg361cp.55.c:0 "关闭本项，登记制度债。"
 zg361cp.55.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361cp.56.t:0 "逐级上报不能悄悄截功"
 zg361cp.56.desc:0 "冻结贡献底稿即将上送，其中一名上司同时提出改份额；无论是否调整，归属总量都不能变化。"
 zg361cp.56.a:0 "原样转发冻结份额。"
 zg361cp.56.b:0 "向上司转移五百基点。"
 zg361cp.56.c:0 "关闭本项，登记制度债。"
 zg361cp.56.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361cp.57.t:0 "冻结汇报版本"
 zg361cp.57.desc:0 "多份修改稿都在争当正式版本；归属合计到一万基点后才能冻结为受评者署名稿，目前并没有新增的本人签字。"
 zg361cp.57.a:0 "冻结第一版归属表。"
 zg361cp.57.b:0 "审证后冻结第二版归属表。"
 zg361cp.57.c:0 "关闭本项，登记制度债。"
 zg361cp.57.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361cp.58.t:0 "先冻结版本，再路由"
 zg361cp.58.desc:0 "材料已经冻结并等待送出；收件记录只能证明去向，真正阅读之前不会消耗注意力席位。"
 zg361cp.58.a:0 "只送直属上司。"
 zg361cp.58.b:0 "同时送直属与越级上司。"
 zg361cp.58.c:0 "关闭本项，登记制度债。"
 zg361cp.58.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361cp.59.t:0 "坏消息必须有时间戳"
 zg361cp.59.desc:0 "风险已经进入报告时限。此后每拖延一步，未化解的损失都会增加，案卷上的诚信回执也会变差。"
 zg361cp.59.a:0 "提前报告，把剩余损失减半。"
 zg361cp.59.b:0 "延迟报告，承担全部损失。"
 zg361cp.59.c:0 "关闭本项，登记制度债。"
 zg361cp.59.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361cp.60.t:0 "创意归属服从冻结版本"
 zg361cp.60.desc:0 "两方同时认领同一项创意，冻结作者记录与跨部门来源对各自贡献给出了冲突线索。"
 zg361cp.60.a:0 "支持原作者。"
 zg361cp.60.b:0 "认可证据充分的共同作者。"
 zg361cp.60.c:0 "关闭本项，登记制度债。"
 zg361cp.60.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361cp.61.t:0 "先定汇报制度"
 zg361cp.61.desc:0 "眼下没有统一汇报规则，各团队送来的材料长短悬殊，对项目容量的消耗也因此无法预估。"
 zg361cp.61.a:0 "采用短事实汇报。"
 zg361cp.61.b:0 "要求长叙事汇报。"
 zg361cp.61.c:0 "关闭本项，登记制度债。"
 zg361cp.61.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361cp.62.t:0 "两条汇报线，只能留下一个选择"
 zg361cp.62.desc:0 "两名上司下达了互不相容的目标；若同时照办，案卷只会留下两项矛盾承诺，没有唯一责任指令。"
 zg361cp.62.a:0 "服从权重更高的实线。"
 zg361cp.62.b:0 "提交联合仲裁。"
 zg361cp.62.c:0 "关闭本项，登记制度债。"
 zg361cp.62.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361cp.63.t:0 "锁定实线与虚线权重"
 zg361cp.63.desc:0 "两名上司在本周期争用同一份考核权，而案卷中的实线与虚线权重还没有合计到一百。"
 zg361cp.63.a:0 "实线七成、虚线三成。"
 zg361cp.63.b:0 "实线与虚线各占五成。"
 zg361cp.63.c:0 "关闭本项，登记制度债。"
 zg361cp.63.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361cp.64.t:0 "换上司必须列明新旧责任人"
 zg361cp.64.desc:0 "职司交接已经提上日程；未来责任可以转给继任者，历史案卷仍归旧上司，两人目前都没有亲自表示同意。"
 zg361cp.64.a:0 "列明新旧上司并完成责令交接。"
 zg361cp.64.b:0 "只记录旧上司，交接保持待定。"
 zg361cp.64.c:0 "关闭本项，登记制度债。"
 zg361cp.64.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361cp.65.t:0 "空降主管与旧部包"
 zg361cp.65.desc:0 "新任主管准备把旧部带进十人团队；每占一个席位都会挤掉组织记忆，任人唯亲的审计阈值也已逼近。"
 zg361cp.65.a:0 "十人中带入两名旧部。"
 zg361cp.65.b:0 "带入三人并触发审计阈值。"
 zg361cp.65.c:0 "关闭本项，登记制度债。"
 zg361cp.65.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361cp.66.t:0 "业务取消不等于个人失败"
 zg361cp.66.desc:0 "战略复核已经支持取消项目，案卷却仍把未花容量与已独立验证的个人贡献混在一起。"
 zg361cp.66.a:0 "立即取消，并保留已验证功劳。"
 zg361cp.66.b:0 "批准稍后取消，不改写个人功劳。"
 zg361cp.66.c:0 "关闭本项，登记制度债。"
 zg361cp.66.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361cp.67.t:0 "一岗两人最终只能有一个责任人"
 zg361cp.67.desc:0 "同一职司名下同时挂着两名现任者。案卷只有在其中一人成为唯一责任人后才能结清。"
 zg361cp.67.a:0 "保留受评官员。"
 zg361cp.67.b:0 "保留跨部门现任者。"
 zg361cp.67.c:0 "关闭本项，登记制度债。"
 zg361cp.67.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361cp.68.t:0 "履历可携带，历史作者不改写"
 zg361cp.68.desc:0 "一名调入者带着旧评级与未结绩效改进计划到岗；接收团队尚未确定哪些历史只作先验，它们都不能占用本期名额或改写旧案责任人。"
 zg361cp.68.a:0 "携带一个保护周期及未结绩效改进计划。"
 zg361cp.68.b:0 "只携带评级，不携带绩效改进计划。"
 zg361cp.68.c:0 "关闭本项，登记制度债。"
 zg361cp.68.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361cp.129.t:0 "晋升是有真实槽位的队列"
 zg361cp.129.desc:0 "晋升队列已经排定资格先后，本周期却只有一个授予槽；受评者尚未与这个空缺完成匹配。"
 zg361cp.129.a:0 "把受评者排入下一空缺。"
 zg361cp.129.b:0 "入队并分配唯一可用槽位。"
 zg361cp.129.c:0 "关闭本项，登记制度债。"
 zg361cp.129.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361cp.130.t:0 "不能把隐藏绩效改进计划倾倒给别组"
 zg361cp.130.desc:0 "一宗调动申请同时带着未结绩效改进计划与错岗主张；披露、岗位证据、试用结果和原上司责任尚未连成完整链条。"
 zg361cp.130.a:0 "披露绩效改进计划，并进行有支持的试用。"
 zg361cp.130.b:0 "以错岗证据完成岗位救援。"
 zg361cp.130.c:0 "关闭本项，登记制度债。"
 zg361cp.130.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361cp.131.t:0 "探索项目与承诺项目分轨"
 zg361cp.131.desc:0 "结果尚未出现，项目案卷也没有登记类型和对应成功口径；探索任务与承诺任务本来就不该用同一把尺。"
 zg361cp.131.a:0 "登记为探索型项目。"
 zg361cp.131.b:0 "登记为承诺型项目。"
 zg361cp.131.c:0 "关闭本项，登记制度债。"
 zg361cp.131.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361cp.132.t:0 "及时止损也可以算功"
 zg361cp.132.desc:0 "项目仍在消耗容量，支持止损的证据却不断累积；案卷尚未把业务结果与个人判断是否及时分开。"
 zg361cp.132.a:0 "证据充分时止损，并给予及时止损功劳。"
 zg361cp.132.b:0 "迟到止损，并记录具名责任。"
 zg361cp.132.c:0 "关闭本项，登记制度债。"
 zg361cp.132.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361cp.133.t:0 "复盘学习与具名责任分轨"
 zg361cp.133.desc:0 "复盘同时发现系统缺陷与一项可能成立的具名违规；混成一个结论，要么造成连坐，要么抹掉已有责任证据。"
 zg361cp.133.a:0 "记录学习，不认定个人违规。"
 zg361cp.133.b:0 "记录系统学习及一项具名违规。"
 zg361cp.133.c:0 "关闭本项，登记制度债。"
 zg361cp.133.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
 zg361cp.134.t:0 "共享指标仍然只有一个责任人"
 zg361cp.134.desc:0 "案卷列出了多名贡献者，但最终结算责任只能分配一次；受评者与直属上司都留有可核的责任主张。"
 zg361cp.134.a:0 "指定受评者为唯一责任人。"
 zg361cp.134.b:0 "指定直属上司为唯一责任人。"
 zg361cp.134.c:0 "关闭本项，登记制度债。"
 zg361cp.134.c.tt:0 "不执行业务动作；登记一笔下周期制度债。本项不会自动重提。"
