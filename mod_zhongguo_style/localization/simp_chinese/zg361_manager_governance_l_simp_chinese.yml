l_simp_chinese:
 zg361mg.120.t:0 "本轮管理评定"
 zg361mg.120.desc:0 "案卷将你的本轮管理总评定为 #high [ROOT.Var('zg361_mg_report_manager_score').GetValue|0]#!。这不是一枚没有来由的数字：校准记录贡献 [ROOT.Var('zg361_mg_reason_calibration').GetValue|0]，申诉改判贡献 [ROOT.Var('zg361_mg_reason_appeal').GetValue|0]，改进成效贡献 [ROOT.Var('zg361_mg_reason_pip').GetValue|0]，任务兑现贡献 [ROOT.Var('zg361_mg_reason_delivery').GetValue|0]，编制运用贡献 [ROOT.Var('zg361_mg_reason_hc').GetValue|0]，上下级关系修正贡献 [ROOT.Var('zg361_mg_reason_relationship_once').GetValue|0]；六项加权说明合计 [ROOT.Var('zg361_mg_report_reason_total').GetValue|0]。若本轮曾拒办京察，该项只在总评中扣除一次。"
 zg361mg.120.desc_score_only:0 "案卷将你的本轮管理总评定为 #high [ROOT.Var('zg361_mg_report_manager_score').GetValue|0]#!，但现存记录不足以拆出可靠依据。本轮只登记分数，不编造理由，也不据此判断任职位置；待下次取得完整复核记录后再补做说明。"
 zg361mg.120.desc_reasons_only:0 "现存记录不足以发布可靠的管理总评，但足以列明已经核对的依据：校准记录贡献 [ROOT.Var('zg361_mg_reason_calibration').GetValue|0]，申诉改判贡献 [ROOT.Var('zg361_mg_reason_appeal').GetValue|0]，改进成效贡献 [ROOT.Var('zg361_mg_reason_pip').GetValue|0]，任务兑现贡献 [ROOT.Var('zg361_mg_reason_delivery').GetValue|0]，编制运用贡献 [ROOT.Var('zg361_mg_reason_hc').GetValue|0]，上下级关系修正贡献 [ROOT.Var('zg361_mg_reason_relationship_once').GetValue|0]；六项加权说明合计 [ROOT.Var('zg361_mg_report_reason_total').GetValue|0]。这份残缺记录不用于判断任职位置。"
 zg361mg.120.desc_unavailable:0 "现存的结案材料太少，既不足以发布管理总评，也不足以列出可信理由。本轮只能如实记作材料不全，不判断任职位置；下次完整复核必须先补齐依据再下结论。"
 zg361mg.120.a:0 "归档本轮评定与现有依据。"
 zg361mg.220.t:0 "官署考核事务复核"
 zg361mg.220.desc:0 "官署本轮复核了 [ROOT.Var('zg361_mg_audit_sample_n').GetValue|0] 份记录。办完表册、例会、申诉和校准事务后，尚余 #high [ROOT.Var('zg361_mg_admin_capacity_remaining').GetValue|0]#! 点治理精力；本轮耗费将在下一次管理者考核中结算。"
 zg361mg.220.fairness_deferred:0 "本轮没有完成实质性的公平性对照，相关底账会保留到下一次复核。"
 zg361mg.220.fairness_remediation:0 "把申诉、改判与正常离任的原始记录逐项对照后，官署发现呈报数字与底账不符。整改方案必须在下一考核期接受复核。"
 zg361mg.220.fairness_clear:0 "把申诉、改判与正常离任的原始记录逐项对照后，官署没有发现需要立即整改的差异。"
 zg361mg.220.a:0 "归档本轮复核，将未结差异与公平性底账转入下期核验。"
