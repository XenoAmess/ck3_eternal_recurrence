l_simp_chinese:
 zg361comp.1.t:0 "薪酬案卷"
 zg361comp.1.desc:0 "案吏发现阶段签押与账簿互不相符，因而封存了这份案卷。国库与私库均不会据此付款。"
 zg361comp.1.l1:0 "案吏已经汇齐 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 的固定俸、职务津贴与冻结绩效记录。奖金尚未从国库或你的私库支出。"
 zg361comp.1.l2:0 "此前为 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 预留的奖励已经进入留任复核。已付款与未付预留仍依原凭据分账记载。"
 zg361comp.1.l3:0 "本轮复核已经冻结 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 的薪带位置。权责与未来俸额都尚未交付，须分别登记。"
 zg361comp.1.l4:0 "案前摆着一份给 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 的专项奖申请。两处付款账户仍各自封存，尚未为此支出。"
 zg361comp.1.ae1:0 "当事人 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 的年度薪酬单已经开立。周期与绩效结果均已冻结，额外月俸尚待核算。"
 zg361comp.1.ae2:0 "案吏已经逐项列明应付 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 的薪酬。国库与私库所负份额都尚未支付，任何延期都必须承接同一笔冻结欠款。"
 zg361comp.1.ae3:0 "晋升记录表明 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 已经承担相应职责。兑现承诺、同档调薪与下周期基础俸额都还没有入账。"
 zg361comp.1.ae4:0 "冻结薪酬单显示 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 偏离了目标薪带。纠偏金额与披露方式必须写在同一张凭据上。"
 zg361comp.1.ae5:0 "案卷已经冻结 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 与新进人员十五比二十的俸额对照。此次申诉只能改钱账，不能改写绩效档。"
 zg361comp.1.af1:0 "长期功赏资格取决于 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 已冻结的三点七五绩效结果。符合条件才可授予，获得提名本身并不产生权益。"
 zg361comp.1.af2:0 "转换簿仍在等待当事人 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 的执行指令。现金、转换份额与可变现价值将分别记账。"
 zg361comp.1.af3:0 "归属簿显示，授予 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 的份额仍未归属。首次归属日与后续每一期日程都须在此刻冻结。"
 zg361comp.1.af4:0 "归属簿仍将当事人 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 的服务份额与绩效份额分账保留。下一次有效归属发生前，不能发起离任分类。"
 zg361comp.1.af5:0 "离任审议开始前，案吏已冻结 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 的已归属与未归属份额。回购款尚未支付，也未进入队列。"
 zg361comp.1.l1.r1:0 "为 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 定总报酬四十五，其中本阶段奖金二十；国库出十四、私库出六：现付十四，余六待结。"
 zg361comp.1.l1.r2:0 "为 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 定总报酬三十七，其中本阶段奖金十六；国库出十一、私库出五：现付十，余六待结。"
 zg361comp.1.l1.r3:0 "现在只保留 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 的固定俸，奖金记零；国库与私库都不付款，也不留下到期项。"
 zg361comp.1.l2.r1:0 "保留 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 的余奖六，原到期日从冻结预留付清；下次续授定在两年后，今日不再付款。"
 zg361comp.1.l2.r2:0 "现向 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 追回二，国库、私库各收一；余六到期按四、二退回，下次续授定在一年后。"
 zg361comp.1.l2.r3:0 "不再续授 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName]；余六到期退回国库四、私库二。今日不付款，也不留新期限。"
 zg361comp.1.l3.r1:0 "现在授予 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 相应权责，并在下一张薪酬单中由你的账户加付四；今日不付款。"
 zg361comp.1.l3.r2:0 "现在按现有薪带外待遇授予 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 相应权责；本次不再加俸，不设付款期限。"
 zg361comp.1.l3.r3:0 "现在驳回待遇包；不给 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 新权责或调薪，款项为零，也不留下未来付款。"
 zg361comp.1.l4.r1:0 "现在向 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 支付十：国库出七，你的私库出三；账面分作年功三、绩效七。"
 zg361comp.1.l4.r2:0 "现在向 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 支付六：国库出四，你的私库出二；账面分作年功四、绩效二。"
 zg361comp.1.l4.r3:0 "现在驳回专项奖；国库与私库都向 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 支付零，也不留下欠款。"
 zg361comp.1.ae1.r1:0 "为 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 登记固定额外月俸六，按十二个月全额折算；今日支付零，冻结金额留待薪酬单结算。"
 zg361comp.1.ae1.r2:0 "若冻结结果为三点七五，为 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 登记绩效月俸三，按半年折算；今日支付零，日后由你的账户结算。"
 zg361comp.1.ae1.r3:0 "为 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 登记酌情额外月俸零；国库与私库现在、以后都不付款。"
 zg361comp.1.ae2.r1:0 "现在依冻结凭据中的国库与私库份额，全额付清 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 的薪酬单；再补发四，国库出三、你的私库出一。"
 zg361comp.1.ae2.r2:0 "今日支付零；把 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 的完整冻结薪酬延至九十日后，并将补发四一并记为欠款。"
 zg361comp.1.ae2.r3:0 "今日支付零；把 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 的完整冻结薪酬延至一百八十日后，并驳回补发四的请求。"
 zg361comp.1.ae3.r1:0 "职责先加、俸额未跟：欠 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 补发四，下轮复核到期；另欠调薪四。今日不付，下期基础俸减二。"
 zg361comp.1.ae3.r2:0 "职责先加、俸额未跟：欠 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 补发二，第二轮复核到期；另欠校准二。今日不付，保留现俸。"
 zg361comp.1.ae3.r3:0 "不为 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 新增欠款；国库与私库今日都支付零，下周期基础俸减四。"
 zg361comp.1.ae4.r1:0 "在本张薪酬单上欠 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 固定追补四；今日支付零，具体金额只向当事双方披露。"
 zg361comp.1.ae4.r2:0 "在本张薪酬单上欠 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 一次奖四；今日支付零，并将薪带公开一轮。"
 zg361comp.1.ae4.r3:0 "现在准许 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 薪带外例外一轮；新增与支付均为零，只公布匿名分布。"
 zg361comp.1.ae5.r1:0 "欠 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 倒挂修复四；现在另付申诉纠正四，国库出三、你的私库出一，绩效档不动。"
 zg361comp.1.ae5.r2:0 "欠 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 倒挂修复二、部分申诉二；今日支付零，两笔都留在薪酬单上。"
 zg361comp.1.ae5.r3:0 "现在驳回两项修复；欠付与实付 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 均为零，冻结绩效档不动。"
 zg361comp.1.af1.r1:0 "若 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 的冻结绩效为三点七五，授予一百份高风险份额；否则不授。现金均为零。"
 zg361comp.1.af1.r2:0 "若 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 的冻结绩效为三点七五，授予八十份限制份额；否则不授。现金均为零。"
 zg361comp.1.af1.r3:0 "若 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 的冻结绩效为三点七五，不授份额，现付十：国库七、私库三；否则两项均为零。"
 zg361comp.1.af2.r1:0 "若 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 具资格，奖金四转份额、现付六：国库四、私库二；否则均为零，流动性记五成。"
 zg361comp.1.af2.r2:0 "不作转换，现在向 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 全付十：国库出七，你的私库出三；按完全流动记账。"
 zg361comp.1.af2.r3:0 "不为 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 创建转换；国库与私库都支付零，流动性记零，也不留期限。"
 zg361comp.1.af3.r1:0 "把 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 的首次归属定在三百六十五日后，此后每三十日一期、共十二期；今日现金为零。"
 zg361comp.1.af3.r2:0 "把 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 的首次归属定在一百八十日后，此后每九十日一期、共四期；今日现金为零。"
 zg361comp.1.af3.r3:0 "把 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 的首次归属定在七百三十日后，此后三百六十五日一期、共一期；今日现金为零。"
 zg361comp.1.af4.r1:0 "为 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 服务份额与绩效份额各记五成，并按同一进度归属。首次归属后报离任分类，现金为零。"
 zg361comp.1.af4.r2:0 "为 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 服务记七成、绩效三成；只归属服务份额，绩效继续冻结。首次归属后报离任分类，现金为零。"
 zg361comp.1.af4.r3:0 "把 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 全数记为服务份额，依服务期限归属。首次归属后再等一期，不报离任分类，现金为零。"
 zg361comp.1.af5.r1:0 "现在把 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 定为正常离任，没收全部未归属份额，并支付回购款十：国库出七，你的私库出三。"
 zg361comp.1.af5.r2:0 "现在把 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 定为有责离任，没收未归属份额；九十日后回购十，届时国库出七、你的私库出三。"
 zg361comp.1.af5.r3:0 "把 [ROOT.Var('zg361_comp_portfolio_subject').Char.GetShortUIName] 定为内部调动：没收未归属、保留已归属，不申请回购，支付零。"
 zg361comp.289.t:0 "薪酬单申诉"
 zg361comp.289.desc:0 "薪酬单已经逐项送达，绩效档与钱账分轨封存。案卷中尚无本轮申诉回执。"
 zg361comp.289.a:0 "提出薪酬申诉，等待主管裁定钱账；绩效档不重审，不花金币。"
 zg361comp.289.b:0 "接受薪酬单，放弃本轮钱账申诉；绩效档不重审，不花金币。"
 zg361comp.900.t:0 "薪酬案结清"
 zg361comp.900.desc:0 "奖金已对账：总额 [ROOT.Var('zg361_comp_bonus_total').GetValue|0]；已付 [ROOT.Var('zg361_comp_bonus_paid_gross').GetValue|0]；追回 [ROOT.Var('zg361_comp_bonus_returned').GetValue|0]；没收 [ROOT.Var('zg361_comp_bonus_forfeited').GetValue|0]；专项奖 [ROOT.Var('zg361_comp_m090_spot_gross').GetValue|0]。"
 zg361comp.901.t:0 "递延奖励已处理"
 zg361comp.901.desc:0 "冻结预留已经履约：累计已付 [ROOT.Var('zg361_comp_bonus_paid_gross').GetValue|0]；追回 [ROOT.Var('zg361_comp_bonus_returned').GetValue|0]；没收 [ROOT.Var('zg361_comp_bonus_forfeited').GetValue|0]。"
 zg361comp.902.t:0 "薪酬单已关闭"
 zg361comp.902.desc:0 "本轮钱账落定：应付 [ROOT.Var('zg361_comp_ae_statement_payable').GetValue|0]，实付 [ROOT.Var('zg361_comp_ae_statement_paid').GetValue|0]，欠付 [ROOT.Var('zg361_comp_ae_statement_owed').GetValue|0]，退回 [ROOT.Var('zg361_comp_ae_statement_returned').GetValue|0]。冻结绩效档未改写。"
 zg361comp.902.private:0 "披露方式：金额只向当事双方公开。"
 zg361comp.902.public:0 "披露方式：薪带公开，个人金额仍只载于薪酬单。"
 zg361comp.902.anonymous:0 "披露方式：只公示匿名分布。"
 zg361comp.902.unknown:0 "披露方式尚无有效记录，因此不作更强声明。"
 zg361comp.903.t:0 "长期份额归属"
 zg361comp.903.desc:0 "本期份额变化如下：总份额 [ROOT.Var('zg361_comp_af_total_units').GetValue|0]，未归属服务 [ROOT.Var('zg361_comp_af_unvested_service').GetValue|0]，未归属绩效 [ROOT.Var('zg361_comp_af_unvested_performance').GetValue|0]，已归属 [ROOT.Var('zg361_comp_af_vested_units').GetValue|0]。现值 [ROOT.Var('zg361_comp_m294_current_value').GetValue|0]；可变现值 [ROOT.Var('zg361_comp_m294_liquid_value').GetValue|0]。"
 zg361comp.904.t:0 "长期激励结清"
 zg361comp.904.desc:0 "账簿最后记下：已归属 [ROOT.Var('zg361_comp_af_vested_units').GetValue|0]，没收 [ROOT.Var('zg361_comp_af_forfeited_units').GetValue|0]，已回购 [ROOT.Var('zg361_comp_af_repurchased_units').GetValue|0]。较早授予的份额先处理；国库与个人付款义务分账核算。"
 zg361comp.904.good:0 "离任分类：正常离任。"
 zg361comp.904.bad:0 "离任分类：有责离任；仍可依法追索。"
 zg361comp.904.transfer:0 "离任分类：内部调动；保留已归属份额。"
 zg361comp.904.unknown:0 "离任分类尚无有效回执，因此不作更强声明。"
 zg361comp.900.a:0 "收存奖金结算凭据；此举不再改动账目。"
 zg361comp.901.a:0 "收存递延奖励凭据；此举不再改动账目。"
 zg361comp.902.a:0 "收存薪酬单凭据；此举不改动冻结绩效档。"
 zg361comp.903.a:0 "收存本期归属凭据；此举不改动份额。"
 zg361comp.904.a:0 "收存长期功赏结算凭据；此举不再改动账目。"
