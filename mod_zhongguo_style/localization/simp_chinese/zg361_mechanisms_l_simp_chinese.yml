 zg361m.292.b.tt:0 "统一发可能归零的高上限期权，以纸面财富节省现金。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.292.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.293.t:0 "第293号 · 当期奖金自愿换长期份额"
 zg361m.293.desc:0 "换份额缓解当前国库并增加留任，也把未来波动转给个人；选择后只能按既定退出规则处理。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.293.a:0 "事前公开转换价与退出规则，让个人自选现金、比例换股或全递延（仅记账）。"
 zg361m.293.b:0 "将合资格奖金自动全额递延，迅速缓解当期国库（仅记账）。"
