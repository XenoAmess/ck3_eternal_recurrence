 zg361_next_mechanism_decision_desc:0 "从尚未定案的 361 项制度中提取下一项。选择会立即写入组织账本；只有已经接入业务案卷的条目才会进一步执行人物、支付、任命或调岗动作。"
 zg361_next_mechanism_decision_tooltip:0 "打开下一项 361 制度卡片。"
