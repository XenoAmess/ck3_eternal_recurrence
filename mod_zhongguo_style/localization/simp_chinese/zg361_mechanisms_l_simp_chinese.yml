 zg361m.297.t:0 "第297号 · 服务归属与绩效归属分轨"
 zg361m.297.desc:0 "纯留任份额不会因一次 3.25 全没收，绩效份额则按冻结条件失效；防止模糊合同任意解释。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.297.a:0 "每批写明服务与绩效归属占比，用冻结条件分别结算（仅记账）。"
 zg361m.297.b:0 "一次 3.25 即取消全部未归属份额，不再区分留任部分（仅记账）。"
 zg361m.297.c:0 "这项制度本局不再提案；记下一笔制度债"
