 zg361m.291.a:0 "授予时冻结份额或价值公式及上下限，价格风险按合同承担（仅记账）。"
 zg361m.291.b:0 "兑现时再选对组织最省的份额或价值口径（仅记账）。"
 zg361m.291.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.291.a.tt:0 "授予时冻结份额或价值公式及上下限，价格风险按合同承担。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.291.b.tt:0 "兑现时再选对组织最省的份额或价值口径。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.291.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.292.t:0 "第292号 · 高风险期权式 / 保底份额式"
 zg361m.292.desc:0 "冒险型人才可能押注组织增长，保守者换确定性；选择不改变原绩效，也不能由经理强迫接“纸面财富”。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.292.a:0 "让受奖者知情选择期权、归属即有价值的限制份额或少量现金（仅记账）。"
 zg361m.292.b:0 "统一发可能归零的高上限期权，以纸面财富节省现金（仅记账）。"
 zg361m.292.c:0 "这项制度本局不再提案；记下一笔制度债"
