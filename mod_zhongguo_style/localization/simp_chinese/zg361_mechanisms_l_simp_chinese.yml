 zg361m.295.t:0 "第295号 · 首授归属等待期长短"
 zg361m.295.desc:0 "长归属等待期金手铐强、临界裁撤争议大，短归属等待期可信但留任力弱；与续授断崖分别结算。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.295.a:0 "采用常规一年归属等待期后开始归属，并保留所有旧批次合同（仅记账）。"
 zg361m.295.b:0 "采用两年归属等待期后加速归属，以更长等待强化金手铐（仅记账）。"
