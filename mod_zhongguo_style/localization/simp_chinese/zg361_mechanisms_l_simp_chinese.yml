 zg361_next_mechanism_decision:0 "召开下一项制度评审"
 zg361_next_mechanism_decision_desc:0 "从尚未定案的 361 机制中提取下一项，作出会进入组织账本的真实选择。"
 zg361_next_mechanism_decision_tooltip:0 "打开下一项 361 制度卡片。"
 zg361_next_mechanism_decision_confirm:0 "叫下一位产品经理进来"
 zg361_reference_charter_decision:0 "一键部署《大厂全家桶》"
 zg361_reference_charter_decision_desc:0 "一次性采用 361 项推荐默认值。省下三十年开会时间，也会立刻背上完整的行政、预算和组织后果。"
 zg361_reference_charter_decision_tooltip:0 "一次结算全部 361 项，不是纯展示按钮。"
 zg361_reference_charter_decision_confirm:0 "我全都要，现在就要"
 zg361_mechanism_choice_a_tt:0 "长期路线：证据、信任或能力更强，但要支付行政、预算或短期交付成本。"
 zg361_mechanism_choice_b_tt:0 "冲刺路线：眼前结果更漂亮，但把风险、倦怠、技术债或申诉债留给未来。"
 zg361_mechanism_choice_c_tt:0 "暂缓路线：现在少开一场会，但明确增加制度债；它会进入你自己的上司考核。"
 zg361_scoreboard_tab_system:0 "制度驾驶舱"
 zg361_ledger_title:0 "361 制度账本：漂亮报表下面那一层"
