 zg361_ledger_checksum:0 "组合校验码"
 zg361_ledger_explainer:0 "正值不都代表好事：行政负担、申诉风险、技术债、倦怠、HC 压力、薪酬债、制度债和预算压力越高越危险。"
 zg361_ledger_evidence:0 "证据质量"
 zg361_ledger_trust:0 "组织信任"
 zg361_ledger_admin_load:0 "绩效行政负担"
 zg361_ledger_appeal_risk:0 "申诉与程序风险"
 zg361_ledger_delivery:0 "真实交付价值"
 zg361_ledger_stability:0 "稳定性"
 zg361_ledger_tech_debt:0 "技术债"
 zg361_ledger_data_quality:0 "数据可信度"
 zg361_ledger_burnout:0 "组织倦怠"
 zg361_ledger_talent:0 "人才健康"
 zg361_ledger_hc_pressure:0 "HC 压力"
 zg361_ledger_pay_debt:0 "薪酬债"
 zg361_ledger_policy_debt:0 "制度债"
 zg361_ledger_budget_pressure:0 "预算压力"
 zg361_ledger_hint:0 "这些账会进入团队下一轮 KPI，也会进入上司对你的管理绩效考核。"
 zg361_org_high_trust:0 "组织信任：这届管理层说话还算数"
 zg361_org_high_trust_desc:0 "证据、反馈与兑现形成正循环。"
 zg361_org_admin_overload:0 "绩效行政过载"
 zg361_org_admin_overload_desc:0 "大家忙着解释为什么大家都在忙。"
 zg361_org_burnout_crisis:0 "组织倦怠危机"
 zg361_org_burnout_crisis_desc:0 "在线时长很漂亮，人的电量不太漂亮。"
 zg361_org_delivery_stable:0 "稳定交付文化"
 zg361_org_delivery_stable_desc:0 "不是每次上线都要先准备一份检讨。"
 zg361_org_tech_debt_crisis:0 "技术债利滚利"
 zg361_org_tech_debt_crisis_desc:0 "昨日的捷径已成为今日的收费站。"
 zg361_org_talent_healthy:0 "人才梯队健康"
 zg361_org_talent_healthy_desc:0 "明星、接班人和普通人都还有路可走。"
 zg361m.1.t:0 "第001号 · KPI 分项证据单"
 zg361m.1.desc:0 "【A · 目标、证据与评分／P0】\n\n决策：考核者能看见治理成果、效率、成长、协作、价值观、京察履责、奖惩和政治修正分别贡献多少。\n\n后果：高低分必须附具体事例；申诉、PIP 和晋升包复用同一份冻结证据，杜绝事件窗口读取下一年的 live 值。"
 zg361m.1.a:0 "建立分项证据单，逐项冻结产出、效率、增长、协作与价值观案例，并承担填报和复核工时。"
 zg361m.1.b:0 "凭总分和上司印象当场定档，迅速出榜，但让漏项与错项失去可追溯依据。"
 zg361m.1.c:0 "这季度先不碰，登记制度债"
 zg361m.2.t:0 "第002号 · 年度目标责任书：OKR 方向 + KPI 结果"
 zg361m.2.desc:0 "【A · 目标、证据与评分／P0】\n\n决策：京察时为直属官员选择财政、治安、军备、发展或跨部门协作方向；官员可接受激进目标、协商普通目标或报保守目标。\n\n后果：激进目标提高 3.75 与“高潜”上限但失败风险更高；保守目标容易完成但不能只靠完成率获得头档。原生治理成果承担主要分值，目标只决定权重与证据上下文。"
 zg361m.2.a:0 "按岗位冻结方向、基线与正常目标，只允许危机时凭事实重定一次，承担持续跟踪成本。"
 zg361m.2.b:0 "给各单位统一压上进取目标并按原线追责，以短期冲刺换增长，但诱发刷指标和隐瞒风险。"
 zg361m.2.c:0 "这季度先不碰，登记制度债"
 zg361m.3.t:0 "第003号 · 期中 Check-in 与目标重置"
 zg361m.3.desc:0 "【A · 目标、证据与评分／P1】\n\n决策：每轮一次，管理者可辅导、加压、补资源或不干预；战争、叛乱等明确外部冲击允许一次 rebaseline。\n\n后果：提前救回风险官员，或留下“上司早已预警/从未提供支持”的 PIP 与申诉证据。"
 zg361m.3.a:0 "安排期中辅导，记录风险、资源与一次有据可查的危机重设，花管理工时换取可解释终评。"
 zg361m.3.b:0 "维持年初目标并限期追赶，省去重设流程，却可能把战略变化算成个人失败并逼人迟报坏消息。"
 zg361m.3.c:0 "这季度先不碰，登记制度债"
 zg361m.4.t:0 "第004号 · 自评与认知差"
 zg361m.4.desc:0 "【A · 目标、证据与评分／P1】\n\n决策：官员先报 3.75 / 3.5 / 3.25 并提交代表成果；可诚实、邀功或故作谦逊。\n\n后果：自评不会直接定档，但巨大高估会伤价值观/可信度，低估会错失曝光，高质量证据能进入校准案卷。"
 zg361m.4.a:0 "要求自评档位附代表性成果，由上司逐项回应认知差，承担谈话成本并留下可复核记录。"
 zg361m.4.b:0 "只收一页自我推介并据夸大或谦抑快速修正主观分，省时但把表达能力误当真实绩效。"
 zg361m.4.c:0 "这季度先不碰，登记制度债"
 zg361m.5.t:0 "第005号 · 岗位化记分卡"
 zg361m.5.desc:0 "【A · 目标、证据与评分／P1】\n\n决策：地方治理、军务、财政、管理岗使用不同证据权重，但仍在直属 cohort 中横向校准。\n\n后果：避免所有人都堆同一属性；转岗可以成为救济，也会失去原岗位优势。"
 zg361m.5.a:0 "为治理、军事、财政和管理岗位预先冻结不同权重，再在同一直属池中校准，承担维护多套量表的成本。"
 zg361m.5.b:0 "所有岗位共用一张结果榜快速强排，便于执行，却会系统性牺牲难量化岗位并放大错配。"
 zg361m.5.c:0 "这季度先不碰，登记制度债"
 zg361m.6.t:0 "第006号 · 起点与难度校正"
 zg361m.6.desc:0 "【A · 目标、证据与评分／P2】\n\n决策：接烂摊子换取更低基线，或守富庶地但承担更高目标。\n\n后果：考核改善量而非只看绝对繁荣；校正只能小幅封顶，不能成为长期失败豁免。"
 zg361m.6.a:0 "冻结接任基线、资源禀赋和岗位难度，只做有上限的小幅校正，花审计工时换横向可比。"
 zg361m.6.b:0 "只看期末绝对结果并对富庶单位加码，出榜更快，却可能奖励吃老本、惩罚收拾残局。"
 zg361m.6.c:0 "这季度先不碰，登记制度债"
 zg361m.7.t:0 "第007号 · 背靠背 360 邀评"
 zg361m.7.desc:0 "【B · 背靠背互评与校准政治／P0】\n\n决策：被评人、上司和系统各可邀请少量真正有共同任务/战争/治理关系的同侪或下属；评价业绩、协作、价值观并附事例。\n\n后果：补足跨部门贡献的可见性；360 总权重封顶 10%–15%，不能单独跨越两个绩效档。"
 zg361m.7.a:0 "只邀请有真实协作的少数评价者，要求具体案例并交叉核验，承担邀评与去重工时。"
 zg361m.7.b:0 "广撒邀评并立刻按高低票加权，迅速放大声量，却给互抬、报复和模板灌水留下空间。"
 zg361m.7.c:0 "这季度先不碰，登记制度债"
 zg361m.8.t:0 "第008号 · 评价者“手松手紧”与同侪信用"
 zg361m.8.desc:0 "【B · 背靠背互评与校准政治／P1】\n\n决策：系统按历史均值、离散度、举荐准确率和翻案率显示“宽松/严苛/可信/惯犯”。\n\n后果：互相抬轿会逐轮贬值，恶意低分可能反噬评价者自己的价值观和管理信誉。"
 zg361m.8.a:0 "维护评价者历史均值、方差、翻案率与命中率，并据此校正权重，承担长期数据治理成本。"
 zg361m.8.b:0 "本轮照单全收原始互评分，待申诉再处罚失真者，能迅速结算但先让手松手紧左右名次。"
 zg361m.8.c:0 "这季度先不碰，登记制度债"
 zg361m.9.t:0 "第009号 · 校准会驾驶舱"
 zg361m.9.desc:0 "【B · 背靠背互评与校准政治／P0】\n\n决策：按 KPI、价值观、目标、360、历史趋势和申诉风险筛选；点名抬一人时必须点名同档边界的承担者进行配额中性交换。\n\n后果：玩家真正做“为什么是他，不是别人”的人事决定；AI 经理会按数据、关系、性格和财政争档位。"
 zg361m.9.a:0 "在驾驶舱并列展示 KPI、价值观、目标、360、趋势与申诉证据，所有翻档都以配额中性的交换留痕。"
 zg361m.9.b:0 "只按当前总分和剩余配额在一场会上拍板，快速关榜，但边界人物与隐形贡献容易被挤掉。"
 zg361m.9.c:0 "这季度先不碰，登记制度债"
 zg361m.10.t:0 "第010号 · “背 C”与护人"
 zg361m.10.desc:0 "【B · 背靠背互评与校准政治／P0】\n\n决策：当所有人都达标但仍有末位名额时，管理者必须指定承担者；可以牺牲新人/边缘人、按硬证据选末位，或消耗自己威望与下轮管理 KPI 保护一人。\n\n后果：背 C 者产生怨恨、申诉和流失风险；护人会让上司认为管理者“分布失真”，但提高团队忠诚。"
 zg361m.10.a:0 "按冻结硬证据确定末位；若护人则由经理公开支付威望和下轮管理 KPI，保留团队信任但承担制度债。"
 zg361m.10.b:0 "把 C 直接压给新人或边缘人以满足配额，立即完成分布，却积累申诉、怨恨和流失风险。"
 zg361m.10.c:0 "这季度先不碰，登记制度债"
 zg361m.11.t:0 "第011号 · 隔级校准 / HR 政委席"
 zg361m.11.desc:0 "【B · 背靠背互评与校准政治／P1】\n\n决策：隔级上司只审查直属管理者的分布、极端证据和流程，不直接给孙级官员打分；政委可要求补证、回避或重开校准。\n\n后果：压制护犊子和恶意打压，同时制造“业务经理 vs 政委”的权力矛盾。"
 zg361m.11.a:0 "让隔级上司只审分布、极端证据和程序，并把缺证榜单退回直属经理重做，支付一次复会成本。"
 zg361m.11.b:0 "由隔级席当场点改孙级档位以快速纠偏，省去退回流程，却破坏直属评分权并制造越级寻租。"
 zg361m.11.c:0 "这季度先不碰，登记制度债"
 zg361m.12.t:0 "第012号 · 利益冲突与回避"
 zg361m.12.desc:0 "【B · 背靠背互评与校准政治／P1】\n\n决策：亲族、挚友、情人、仇敌或恩主关系在校准前暴露；管理者可回避、公开坚持或暗箱操作。\n\n后果：不回避可短期保人/踩人，但提高申诉翻案率和管理者自身被扣分的风险。"
 zg361m.12.a:0 "校准前披露亲族、恩怨与恩主关系，由独立复核席替代回避者，承担组席和延时成本。"
 zg361m.12.b:0 "允许经理公开坚持或暗中操作以迅速保人踩人，短期掌控结果，却显著提高翻案和自身扣分风险。"
 zg361m.12.c:0 "这季度先不碰，登记制度债"
 zg361m.13.t:0 "第013号 · 透明 / 半透明 / 黑箱公示制度"
 zg361m.13.desc:0 "【B · 背靠背互评与校准政治／P2】\n\n决策：选择公开完整名次与理由、只公开档位，或只让本人看结果。\n\n后果：透明提高公平感但加剧竞争和羞辱；黑箱减少公开冲突却加剧猜忌、向上管理与申诉。"
 zg361m.13.a:0 "向本人开放冻结理由和申诉路径，向团队公开档位与汇总口径，并为敏感互评建立权限隔离。"
 zg361m.13.b:0 "只口头告知本人最终档位并封闭理由，能压低公开冲突，却把猜忌、向上管理和申诉推高。"
 zg361m.13.c:0 "这季度先不碰，登记制度债"
 zg361m.14.t:0 "第014号 · 绩效申诉案卷"
 zg361m.14.desc:0 "【C · 申诉、PIP 与末位退出／P0】\n\n决策：被评人以“计算错误、漏记成果、利益冲突、强制背档、目标不合理”之一申诉，并提交冻结证据；可先与直属上司沟通，再请求流程复核。\n\n后果：成功则回到直属上司重校准，逐笔退回 3.25 已缴的地方国库、个人金币与贤能，并立即停止尚未结束的一年俸禄 -25%，同时修正榜单；失败会消耗关系/威望，恶意申诉伤信用。"
 zg361m.14.a:0 "按错误类型收冻结证据，先沟通再独立复核，并逐项登记重校准、三笔即时退款与俸禄止扣，承担案卷工时。"
 zg361m.14.b:0 "由原上司当场驳回或凭印象快速改档，立刻止争，却可能二次处罚、错退钱并坐实利益冲突。"
 zg361m.14.c:0 "这季度先不碰，登记制度债"
 zg361m.15.t:0 "第015号 · PIP 改进任务书"
 zg361m.15.desc:0 "【C · 申诉、PIP 与末位退出／P0】\n\n决策：3.25 后从财政、治安、军备、发展、协作中选择可验证里程碑；受评人可接受、协商或拒绝。\n\n后果：成功减轻低绩效连击并给下轮有限补正；失败/超时升级降岗或退出；拒绝 PIP 本身成为下一轮重大负面证据。"
 zg361m.15.a:0 "与当事人协商其权限内的可验证里程碑、支持与复盘点，花资源换一次真正可完成的改进机会。"
 zg361m.15.b:0 "直接下达高压里程碑和硬期限，并把拒绝记为重大负面证据，见效快但更像预设退出。"
 zg361m.15.c:0 "这季度先不碰，登记制度债"
 zg361m.16.t:0 "第016号 · PIP 支持预算与“只给指标不给资源”"
 zg361m.16.desc:0 "【C · 申诉、PIP 与末位退出／P1】\n\n决策：上司可给导师、临时治理资源或关注度，也可省钱硬压目标。\n\n后果：支持提高可完成性但消耗组织资源；不给支持若最终失败，会成为申诉证据并降低上司管理 KPI。"
 zg361m.16.a:0 "为 PIP 配导师、临时治理资源和定期关注，并记录每项投入，承担预算以检验真实改善。"
 zg361m.16.b:0 "只给指标不给资源并按期硬验收，节省当期预算，却让失败成为申诉证据并反噬经理管理分。"
 zg361m.16.c:0 "这季度先不碰，登记制度债"
 zg361m.17.t:0 "第017号 · 末位处置阶梯"
 zg361m.17.desc:0 "【C · 申诉、PIP 与末位退出／P0】\n\n决策：首次 3.25 在沟通、PIP、调岗中选；连续低档在降岗、冻结晋升、释放 HC、辞退/剥夺任命中选。\n\n后果：激进处置快速提高“人才密度”但造成恐惧、申诉和空岗；保守处置保留经验却让上司质疑管理者。"
 zg361m.17.a:0 "首次低档依次沟通、PIP、合法调岗，连续失败后才降权或释放 HC，承担培养与空缺规划成本。"
 zg361m.17.b:0 "对末位立即冻结晋升、降岗或撤任以提升人才密度，快速腾位，却制造恐惧、空岗与集中申诉。"
 zg361m.17.c:0 "这季度先不碰，登记制度债"
 zg361m.18.t:0 "第018号 · 个人告身与四重后果清算单"
 zg361m.18.desc:0 "【C · 申诉、PIP 与末位退出／P0】\n\n决策：不是额外按钮，而是所有后续判断的事实入口。\n\n后果：清楚显示本轮绩效、KPI、名次、上司、主要理由，以及 3.25 的地方国库 -50、个人金币 -25、贤能 -60、一年俸禄 -25% 四重后果和申诉退款/止扣状态。"
 zg361m.18.a:0 "结算时冻结档位、名次、上司、理由，以及国库、个人金币、贤能三笔即时罚没与一年俸禄减成，逐项标记支付、退款和止扣状态。"
 zg361m.18.b:0 "按打开告身时的现值合并扣缴并即时展示，流程更短，却会因换上司、余额变化或重开而错算重算。"
 zg361m.18.c:0 "这季度先不碰，登记制度债"
 zg361m.19.t:0 "第019号 · 晋升资格门槛"
 zg361m.19.desc:0 "【D · 晋升包、薪酬与 HC／P0】\n\n决策：连续 3.75、价值观、无活跃 PIP、任职年限和合法空缺共同决定是否能“提包”；3.5 可积累但不能直接进入答辩。\n\n后果：高绩效终于兑现为机会，而不是自动塞头衔；低绩效冻结晋升但不永久抹杀职业生涯。"
 zg361m.19.a:0 "逐项核验连续高绩效、价值观、PIP、任职年限和合法空缺后才允许提包，承担候选审查成本。"
 zg361m.19.b:0 "由 sponsor 对本轮明星跳过部分门槛直接提名，迅速留人，却可能制造空心晋升和旧账争议。"
 zg361m.19.c:0 "这季度先不碰，登记制度债"
 zg361m.20.t:0 "第020号 · 晋升包与跨部门答辩"
 zg361m.20.desc:0 "【D · 晋升包、薪酬与 HC／P1】\n\n决策：候选人选择展示真实治理成果、团队影响、方法沉淀或包装可见度；评委从其他同级管理单元抽取，恩主可 sponsor 但不能改硬证据。\n\n后果：强表达能改善边界判断，却不能让空心材料碾压持续政绩；失败可能“延期晋升”而非清空履历。"
 zg361m.20.a:0 "用冻结治理成果、团队影响和方法沉淀组成晋升包，由跨部门评委答辩并记录边界判断。"
 zg361m.20.b:0 "让恩主主持一次口头陈述快速拍板，表达出色者更易过关，却可能让包装压过持续政绩。"
 zg361m.20.c:0 "这季度先不碰，登记制度债"
 zg361m.21.t:0 "第021号 · 奖金—调薪矩阵"
 zg361m.21.desc:0 "【D · 晋升包、薪酬与 HC／P1】\n\n决策：领主在有限奖金池内决定头档奖金厚度；3.75 可获一次奖金或短期晋薪，3.5 保持，3.25 继续四重处罚。\n\n后果：奖励头部会真实挤占财政；欠赏的连续 3.75 人才会请求转岗或被挖走。"
 zg361m.21.a:0 "事前公布档位—奖金—调薪矩阵并锁定总池，真实拨款兑现头档，承担当期财政压力。"
 zg361m.21.b:0 "把有限资金集中给少数头档并推迟固定调薪，迅速强化信号，却积累欠赏、倒挂和被挖风险。"
 zg361m.21.c:0 "这季度先不碰，登记制度债"
 zg361m.22.t:0 "第022号 · 软 HC / 编制预算"
 zg361m.22.desc:0 "【D · 晋升包、薪酬与 HC／P1】\n\n决策：HC 不直接等于 CK3 角色数量，而是“可资助的招募、培养、晋升与补员名额”；公爵以上根据团队成果、财政和空缺向上司申请增编、保编或临时借调。\n\n后果：高绩效团队获得人才资源，低绩效团队可能冻结补员；裁掉末位可释放名额，却可能因无替补损害治理。"
 zg361m.22.a:0 "按团队成果、财政与空缺制定年度招募、培养和补员预算，逐项追踪名额用途与回收。"
 zg361m.22.b:0 "按当前压力和上司偏好临时增编或冻结，能迅速支援重点，却让低曝光团队长期缺人并诱发占坑。"
 zg361m.22.c:0 "这季度先不碰，登记制度债"
 zg361m.23.t:0 "第023号 · HC 答辩与团队投入产出"
 zg361m.23.desc:0 "【D · 晋升包、薪酬与 HC／P1】\n\n决策：管理者用团队目标完成、翻案率、人才流失和财政效率申请资源；可以夸大需求、借调别组名额或主动瘦身。\n\n后果：夸大成功会暂时拿到资源，后续未兑现则伤管理绩效；瘦身提高短期效率但增加倦怠与单点风险。"
 zg361m.23.a:0 "用目标完成、翻案、流失和财政效率答辩 HC，并登记承诺供下轮回写，承担年度复核工时。"
 zg361m.23.b:0 "凭紧急故事和关系当场借调或加编，马上解压，却在未兑现时放大 HC 信用与倦怠风险。"
 zg361m.23.c:0 "这季度先不碰，登记制度债"
 zg361m.24.t:0 "第024号 · 内部活水与转岗博弈"
 zg361m.24.desc:0 "【D · 晋升包、薪酬与 HC／P1】\n\n决策：PIP 人员可申请错岗救济，连续 3.75 人员可申请更好岗位；原上司可放人、加薪挽留或卡人。\n\n后果：卡住明星会短期保产出、长期伤管理信誉并触发挖角；低绩效转岗成功后按新岗位重新建基线，但旧账不消失。"
 zg361m.24.a:0 "为转岗冻结旧履历、建立新基线并约定交接与 backfill，花时间给错岗者和明星合法流动路径。"
 zg361m.24.b:0 "原上司立即卡人或新上司抢人，短期保住或获得产出，却留下雪藏、空缺和管理信誉债。"
 zg361m.24.c:0 "这季度先不碰，登记制度债"
 zg361m.25.t:0 "第025号 · 高绩效人才被挖与反 offer"
 zg361m.25.desc:0 "【D · 晋升包、薪酬与 HC／P2】\n\n决策：其他天朝制领主可对连续 3.75 且晋升停滞的人才发出合法邀请；原上司选择晋升提名、加薪、画饼或放人。\n\n后果：绩效体系产生跨组织人才市场；滥发 3.75 也会抬高自己的留人成本。"
 zg361m.25.a:0 "只对有合法空缺且晋升停滞的连续头档发有成本的书面邀请，并让原上司用真实职位或加俸回应。"
 zg361m.25.b:0 "广挖可见明星并用晋升口头承诺抢人，迅速补强，却推高薪酬、空心承诺和团队报复。"
 zg361m.25.c:0 "这季度先不碰，登记制度债"
 zg361m.26.t:0 "第026号 · 真实贡献 / 上司可见度双账"
 zg361m.26.desc:0 "【E · 向上管理、跨部门抢功与指标异化／P0】\n\n决策：官员每轮在“埋头做事、主动汇报、经营关系”间分配有限精力；上司也可主动做 skip-level 访谈降低信息差。\n\n后果：可见度只影响主观分与证据被采纳概率，不直接制造治理成果；高可见低产出短期占优，换上司或审计时容易露馅。"
 zg361m.26.a:0 "分别冻结真实贡献与上司可见度，并用隔级访谈补查低曝光成果，承担额外核证工时。"
 zg361m.26.b:0 "按本轮汇报质量和关系热度快速分配主观分，立刻奖励会展示者，却让空心材料暂时胜过治理。"
 zg361m.26.c:0 "这季度先不碰，登记制度债"
 zg361m.27.t:0 "第027号 · 跨部门贡献账本"
 zg361m.27.desc:0 "【E · 向上管理、跨部门抢功与指标异化／P1】\n\n决策：共同参与战争支援、治理任务或联合项目时，冻结 owner、主责、协作者、救火者和 blocker；结束后各方申报贡献。\n\n后果：给背靠背 360 和晋升包提供硬证据，也为抢功争议提供同一事实底座。"
 zg361m.27.a:0 "为联合项目冻结 owner、主责、协作者、救火者与 blocker，按唯一成果总量分摊并接受维护成本。"
 zg361m.27.b:0 "由项目 owner 独占结果，其他人靠事后口供争取份额，结算迅速却鼓励截功和重复申报。"
 zg361m.27.c:0 "这季度先不碰，登记制度债"
 zg361m.28.t:0 "第028号 · 抢功仲裁 / 甩锅复盘"
 zg361m.28.desc:0 "【E · 向上管理、跨部门抢功与指标异化／P1】\n\n决策：成功项目可独占、共享或让功；失败项目可认责、分责或甩锅。上司按贡献账本、证人、关系和口才裁定。\n\n后果：抢功成功提高可见度但伤同侪信用；错误裁决伤管理者信誉并成为申诉理由；认责可保价值观但承担短期 KPI。"
 zg361m.28.a:0 "给成果或事故设唯一责任 ID，依据贡献账本、证人和冻结版本分责，承担听证与复盘成本。"
 zg361m.28.b:0 "立即指定一个英雄或替罪羊以结束争执，快速稳定叙事，却伤害同侪信用并给错误裁决留下申诉口。"
 zg361m.28.c:0 "这季度先不碰，登记制度债"
 zg361m.29.t:0 "第029号 · 指标包装、造假与京察审计"
 zg361m.29.desc:0 "【E · 向上管理、跨部门抢功与指标异化／P1】\n\n决策：官员可追求真实改善、选择有副作用的“刷指标”，或直接虚报；管理者可深查、抽查或睁眼闭眼。\n\n后果：刷税收/治安数字带来短期 KPI 和延迟领地代价；查实虚报会追回奖励、加 PIP、降低价值观，并反噬包庇者。"
 zg361m.29.a:0 "从真实治理基线抽查指标，记录刷数副作用并在查实时追奖问责包庇者，承担审计预算。"
 zg361m.29.b:0 "先按亮眼税收或治安数字发分，只有爆雷才深查，能刺激短期数字，却放大延迟损失和造假收益。"
 zg361m.29.c:0 "这季度先不碰，登记制度债"
 zg361m.30.t:0 "第030号 · 资源赛马与抢预算"
 zg361m.30.desc:0 "【E · 向上管理、跨部门抢功与指标异化／P2】\n\n决策：两个团队争取同一项目、HC 或奖金池；可提交真实小规模试点，也可靠 sponsor 抢先拿资源。\n\n后果：胜者获得资源和曝光，败者可能重组；如果胜者只会包装而交付失败，下一轮产生更大的管理问责。"
 zg361m.30.a:0 "给竞争团队拨小规模试点并用统一里程碑决胜，冻结预算守恒与失败回收日期，承担双试点成本。"
 zg361m.30.b:0 "让 sponsor 选中一队并一次性押上 HC 与预算，快速形成重点，却可能把包装失败放大为组织损失。"
 zg361m.30.c:0 "这季度先不碰，登记制度债"
 zg361m.31.t:0 "第031号 · 恩主 / Sponsor 网络"
 zg361m.31.desc:0 "【E · 向上管理、跨部门抢功与指标异化／P2】\n\n决策：高层可为晋升包、HC 或复核提供背书；官员可经营恩主，也可选择只靠硬业绩。\n\n后果：Sponsor 只提高进入讨论桌的机会，不能改原始 KPI；恩主倒台会让过度依附者失去可见度和信用。"
 zg361m.31.a:0 "允许恩主把候选送上讨论桌，但必须披露关系、限期背书并保留硬证据门槛。"
 zg361m.31.b:0 "让恩主直接插队晋升、HC 或复核，迅速动员权力，却把组织押在人脉与恩主存亡上。"
 zg361m.31.c:0 "这季度先不碰，登记制度债"
 zg361m.32.t:0 "第032号 · 管理者自己的团队绩效"
 zg361m.32.desc:0 "【F · 管理者与制度反馈／P0】\n\n决策：公爵以上不仅看个人能力，还要为目标完成、按期京察、校准质量、PIP 成功、翻案率、人才留存和 HC 效率负责。\n\n后果：拒办京察的 -50 成为这套管理分的一条重大理由；护人、乱打分、不给资源和高流失会沿直属链向上反馈。"
 zg361m.32.a:0 "用上一轮冻结的目标、京察、翻案、PIP、留才与 HC 数据考核经理，承担跨周期记账成本。"
 zg361m.32.b:0 "只看本轮团队排名并对拒办、低档和流失立即重罚，执行有力，却把孙级个案递归成经理罪责。"
 zg361m.32.c:0 "这季度先不碰，登记制度债"
 zg361m.33.t:0 "第033号 · 管理者画像与可解释理由码"
 zg361m.33.desc:0 "【F · 管理者与制度反馈／P0】\n\n决策：数据派、护犊型、政治型、仁厚型、残酷型 AI 对校准、申诉、PIP、奖金和 HC 有不同稳定偏好。\n\n后果：同一个分数遇到不同上司会有不同处置，但个人告身能说明命中了哪类理由，而不是暗骰黑箱。"
 zg361m.33.a:0 "为数据派、护犊型等偏好建立稳定权重和理由码，并用硬证据上限约束，承担解释维护成本。"
 zg361m.33.b:0 "允许上司性格和关系直接压过边界证据以快速处置，人物更强烈，却让同案不同判难以复核。"
 zg361m.33.c:0 "这季度先不碰，登记制度债"
 zg361m.34.t:0 "第034号 · 绩效×潜力九宫格"
 zg361m.34.desc:0 "【F · 管理者与制度反馈／P1】\n\n决策：历史绩效为一轴，成长、岗位适配和能力潜力为另一轴；决定培养、导师、关键人才、调岗或淘汰建议。\n\n后果：区分“当前明星”“高潜新人”“稳定贡献者”“错岗人才”和“待退出者”，不让一次 3.75 决定一生。"
 zg361m.34.a:0 "用多轮冻结绩效、成长速度与岗位适配校准九宫格，并为各象限配置培养或调岗预算。"
 zg361m.34.b:0 "依据本轮档位和天赋快速贴高潜或待退标签，便于集中资源，却让一次结果决定长期命运。"
 zg361m.34.c:0 "这季度先不碰，登记制度债"
 zg361m.35.t:0 "第035号 · 严格 361 / 松绑 361 / 混合门槛"
 zg361m.35.desc:0 "【F · 管理者与制度反馈／P2】\n\n决策：严格模式必须背 C；松绑模式保留三档但不强制 10%；混合模式仍横向排名，但绝对达标者的末位处分减轻。\n\n后果：让玩家亲自看到强制分布提升人才密度与制造内耗的两面性。"
 zg361m.35.a:0 "采用绝对达标线加横向排名的混合制，保留分布信号但为全员达标者减轻末位处分，并承担双重校验。"
 zg361m.35.b:0 "严格执行 3-6-1 并强制填满末位，制度最清晰、出榜最快，却在全员优秀时也制造牺牲者。"
 zg361m.35.c:0 "这季度先不碰，登记制度债"
 zg361m.36.t:0 "第036号 · 十年制度报告"
 zg361m.36.desc:0 "【F · 管理者与制度反馈／P2】\n\n决策：按领主展示档位、翻案、PIP 成功、晋升、淘汰、奖金净流、HC、人才外流、真实治理和管理者信誉。\n\n后果：玩家能判断这套制度究竟提高了治理，还是只制造更漂亮的榜和更高的流失率。"
 zg361m.36.a:0 "逐年冻结档位、翻案、PIP、晋升、HC、奖金、流失与真实治理，再汇总十年趋势，承担长期统计成本。"
 zg361m.36.b:0 "只公布当前榜和少数亮眼指标，立刻形成政绩叙事，却无法识别漂亮分布背后的流失与治理倒退。"
 zg361m.36.c:0 "这季度先不碰，登记制度债"
 zg361m.37.t:0 "第037号 · 跨团队配额互换"
 zg361m.37.desc:0 "【G · 强制分布的配额工程／P1】\n\n决策：同一上司治下的两个小团队可交换一个 3.75 或 3.25 名额；双方经理要拿真实贡献、团队难度或历史欠账出价，也可拒绝交易。\n\n后果：救下本组末位会消耗政治信用或下轮资源；口头让档却不兑现，会形成可追索的校准债务并伤害两位经理关系。"
 zg361m.37.a:0 "允许两队凭贡献、难度和历史欠账交换一个档位，并登记政治信用、资源与下轮偿还义务。"
 zg361m.37.b:0 "禁止协商并强令各队按本地配额落档，迅速关榜，却让小队偶然末位和真实团队差异无法纠正。"
 zg361m.37.c:0 "这季度先不碰，登记制度债"
 zg361m.38.t:0 "第038号 · 小样本合池校准"
 zg361m.38.desc:0 "【G · 强制分布的配额工程／P1】\n\n决策：直属人数过少时，选择与同职能单位合池、按绝对门槛暂缓强排，或仍在三四个人里硬切 361。\n\n后果：合池更稳定但把本组命运交给外部评委；硬切可保自主权，却提高偶然背 C、申诉和离职风险。"
 zg361m.38.a:0 "把小样本与同职能单位合池，或由外部席按绝对门槛暂缓强排，承担跨组协调与解释成本。"
 zg361m.38.b:0 "在三四人内照常硬切 361 以保自主权，省去合池，却大幅提高偶然背 C、申诉和离职。"
 zg361m.38.c:0 "这季度先不碰，登记制度债"
 zg361m.39.t:0 "第039号 · 分母管理与名单锁定"
 zg361m.39.desc:0 "【G · 强制分布的配额工程／P1】\n\n决策：校准前决定借调者、长期缺勤者、刚转入者和将离任者是否进入 cohort；名单锁定后只能以正式理由变更。\n\n后果：把强者移出分母能保护本组头档，把弱者塞入分母能替人背 C；审计发现临时调名单会扣管理绩效并重开校准。"
 zg361m.39.a:0 "校准前冻结借调、缺勤、转入和离任人员名单，任何变更都须正式理由与审计轨迹。"
 zg361m.39.b:0 "在截止前临时移出强者或塞入弱者以填配额，能立刻保护核心，却可能触发重开校准和管理问责。"
 zg361m.39.c:0 "这季度先不碰，登记制度债"
 zg361m.40.t:0 "第040号 · “离职者背 C”灰色操作"
 zg361m.40.desc:0 "【G · 强制分布的配额工程／P1】\n\n决策：对已请辞、将被撤职或转出的官员，经理可按实际表现评级，或把末位名额记在即将离开的人身上。\n\n后果：现团队短期皆大欢喜，但该名额若被审计为“死人头”，管理者承担分布造假、错误 backfill 和人才判断失真。"
 zg361m.40.a:0 "按离任者实际冻结表现评级，并把组织裁撤、离职与 backfill 分账，承担真实空缺和配额压力。"
 zg361m.40.b:0 "把末位记给即将离开的人，让现团队迅速全员过关，却留下分布造假、错配补缺和人才判断失真。"
 zg361m.40.c:0 "这季度先不碰，登记制度债"
 zg361m.41.t:0 "第041号 · 新人保护、参评与献祭三路线"
 zg361m.41.desc:0 "【G · 强制分布的配额工程／P1】\n\n决策：制度可规定首轮不入分布、入榜但不占配额，或完整参评；经理也可违法把新人当最便宜的末位。\n\n后果：保护降低新人恐惧但压缩老员工名额；完整参评提高竞争，新人被献祭则打击导师、招募口碑和经理自己的育人分。"
 zg361m.41.a:0 "首轮把新人从配额中保护出来，另设爬坡目标、导师和次轮纳入日期，承担培养与老员配额压力。"
 zg361m.41.b:0 "新人立即完整参评并优先承担末位，最快填满 C 档，却伤害导师成绩、招募口碑和新人留存。"
 zg361m.41.c:0 "这季度先不碰，登记制度债"
 zg361m.42.t:0 "第042号 · 轮流背 C 的跨周期合谋"
 zg361m.42.desc:0 "【G · 强制分布的配额工程／P2】\n\n决策：团队成员可私下约定今年甲背 C、明年乙补偿；经理可默许维稳、拆穿合谋或假意承诺后毁约。\n\n后果：轮值降低短期内耗，却让绩效失去区分度；毁约会造成强烈怨恨，抽查出固定轮转模式则整组互评信用下调。"
 zg361m.42.a:0 "跨周期抽查固定轮转模式，重建个人证据并调解补偿承诺，花复核工时恢复评级区分度。"
 zg361m.42.b:0 "发现疑似轮流背 C 就整组降权并立即拆约，迅速震慑合谋，却可能误伤真实波动并激化毁约怨恨。"
 zg361m.42.c:0 "这季度先不碰，登记制度债"
 zg361m.43.t:0 "第043号 · 校准会发言席与注意力预算"
 zg361m.43.desc:0 "【G · 强制分布的配额工程／P1】\n\n决策：经理只能为少数边界候选人做完整陈述，必须选择保明星、救末位、替隐形贡献者补证或把席位让给另一团队。\n\n后果：没被讲到的人更依赖硬证据；每次越时争辩会提高某人翻档概率，同时消耗上司耐心和经理政治资本。"
 zg361m.43.a:0 "预分少量发言席，要求边界候选人的书面证据并记录经理使用的注意力和政治资本。"
 zg361m.43.b:0 "允许经理为亲信持续越时争辩直到翻档，可能快速救下一人，却挤掉沉默贡献者并耗尽上司耐心。"
 zg361m.43.c:0 "这季度先不碰，登记制度债"
 zg361m.44.t:0 "第044号 · 盲审初排、实名复议"
 zg361m.44.desc:0 "【G · 强制分布的配额工程／P2】\n\n决策：制度可先隐藏姓名、亲缘和关系只排证据，再在实名阶段处理岗位难度与组织影响；也可从头实名校准。\n\n后果：盲审压低裙带和仇怨，却可能误判不可量化的救火工作；两阶段差异过大时自动暴露潜在偏见供复核。"
 zg361m.44.a:0 "先隐藏姓名与关系按证据初排，再实名补看岗位难度，并把两阶段差异送复核，承担双轮工时。"
 zg361m.44.b:0 "从头实名并由熟悉业务的上司一次定序，出榜更快，却让裙带、仇怨和声量提前进入结果。"
 zg361m.44.c:0 "这季度先不碰，登记制度债"
 zg361m.45.t:0 "第045号 · “不得惊讶”反馈债"
 zg361m.45.desc:0 "【G · 强制分布的配额工程／P1】\n\n决策：经理发现问题时可立即留下一条辅导记录，也可拖到年终突然给低档；下属可确认、补充或拒绝承认记录。\n\n后果：没有期中反馈却年末判 3.25，会显著提高申诉成功率并扣经理管理分；滥发警告则损伤士气和反馈信用。"
 zg361m.45.a:0 "问题出现即记录事实、辅导和下属回应，并在终评前复查改进，承担持续反馈与确认工时。"
 zg361m.45.b:0 "年终首次亮出 3.25 并以结果硬压接受，迅速结束难谈话，却显著增加翻案和经理反馈债。"
 zg361m.45.c:0 "这季度先不碰，登记制度债"
 zg361m.46.t:0 "第046号 · 机会分配审计"
 zg361m.46.desc:0 "【G · 强制分布的配额工程／P1】\n\n决策：校准时同时展示谁获得了富庶领地、关键项目、援军和高层曝光；经理可承认机会不均、做小幅校正或坚持只看结果。\n\n后果：长期把好项目给亲信再称其“高潜”会被识别；校正只能解释表现，不能把失败者直接送进 3.75。"
 zg361m.46.a:0 "校准前审计富庶领地、关键项目、援军和曝光机会，承认不均并只做有上限的难度校正。"
 zg361m.46.b:0 "坚持只看最终结果并快速奖励获好机会者，维持简单标准，却把偏爱循环包装成高潜和高绩效。"
 zg361m.46.c:0 "这季度先不碰，登记制度债"
 zg361m.47.t:0 "第047号 · 近因偏差与证据时间窗"
 zg361m.47.desc:0 "【G · 强制分布的配额工程／P2】\n\n决策：采用全年等权、近期加权或重大里程碑加权；受评人可用期初成果反驳“只记得最近一次事故”。\n\n后果：近期加权鼓励年底冲刺和藏雷，全年等权更稳但反应迟缓；制度切换只影响新周期，不重算旧榜。"
 zg361m.47.a:0 "周期初冻结全年等权或重大里程碑窗口，并保留早期成果供反驳，承担完整证据存储成本。"
 zg361m.47.b:0 "终评时重押最近一次成败，迅速响应新局势，却鼓励年底冲刺、藏雷并抹去早期贡献。"
 zg361m.47.c:0 "这季度先不碰，登记制度债"
 zg361m.48.t:0 "第048号 · 评价者工时与邀评额度"
 zg361m.48.desc:0 "【H · 背靠背互评的微观博弈／P1】\n\n决策：每人只能认真评价有限对象；可优先写共同项目伙伴、上级指定对象或政治盟友，也可拒绝无真实接触的邀评。\n\n后果：广撒邀请会得到更多声量却降低反馈质量；敷衍模板和超量打分使评价者信用下降，不能靠填表数量刷存在感。"
 zg361m.48.a:0 "限制每人只评真实合作对象，抽查案例质量并允许无接触拒评，牺牲覆盖率保护评价工时。"
 zg361m.48.b:0 "强令所有人广泛互评并按填表量算协作，快速补齐数据，却产生模板灌水、疲劳和政治邀评。"
 zg361m.48.c:0 "这季度先不碰，登记制度债"
 zg361m.49.t:0 "第049号 · 封存提交与截止时点"
 zg361m.49.desc:0 "【H · 背靠背互评的微观博弈／P1】\n\n决策：互评在截止前背靠背封存，提交后不可看他人再改；迟交者只能缺席，或付出信用请求一次补交。\n\n后果：阻止看风向跟票和即时互抬；故意拖延会让自己的证据也可能无人补充，并计入协作履责。"
 zg361m.49.a:0 "互评背靠背封存，迟交仅能用一次信用申请监督补交，并记录补交对证据完整性的影响。"
 zg361m.49.b:0 "截止即永久关门、迟交全部作废，执行最干脆，却可能让真实协作无人作证并诱发抢在截止前串供。"
 zg361m.49.c:0 "这季度先不碰，登记制度债"
 zg361m.50.t:0 "第050号 · 互相抬轿契约与背叛"
 zg361m.50.desc:0 "【H · 背靠背互评的微观博弈／P1】\n\n决策：同僚可暗示互给高评；玩家可履约、给诚实反馈或抢先揭发，经理可对高度互惠的评价对抽查。\n\n后果：合谋未暴露时能推高边界判断，但相关系数异常会双双降权；背叛赢得短期合规信用，却结下私人仇怨。"
 zg361m.50.a:0 "用互惠相关性筛查评价对，再抽取共同项目证据核验，承担反串谋分析与听证成本。"
 zg361m.50.b:0 "对疑似互抬者立即双双降权或奖励先揭发者，迅速破盟，却刺激抢先背叛和虚假举报。"
 zg361m.50.c:0 "这季度先不碰，登记制度债"
 zg361m.51.t:0 "第051号 · 可推断匿名与最小样本阈值"
 zg361m.51.desc:0 "【H · 背靠背互评的微观博弈／P1】\n\n决策：反馈不足三人时可合并摘要、延后公开或征得署名；不得用“一名匿名下属说”假装匿名。\n\n后果：保护举报者会降低细节，强行公开可提高可操作性但制造报复风险；猜出作者后报复会进入独立审计。"
 zg361m.51.a:0 "不足最小样本时合并摘要、延后披露或征得署名，并维护反馈权限，牺牲细节保护评价者。"
 zg361m.51.b:0 "立即公开少量匿名原话以便行动，信息更尖锐，却让作者可被推断并产生报复与寒蝉效应。"
 zg361m.51.c:0 "这季度先不碰，登记制度债"
 zg361m.52.t:0 "第052号 · 保留评价形状，不只看均分"
 zg361m.52.desc:0 "【H · 背靠背互评的微观博弈／P1】\n\n决策：GUI 同时显示“稳定好评”“两极分化”“只获上司好评”“只获下属好评”等结构；经理选择追问冲突还是直接取平均。\n\n后果：同样 3.5 均分可以指向可靠协作者、对上不对下或跨部门冲突者，产生不同辅导、晋升和管理风险。"
 zg361m.52.a:0 "保存各来源分布与两极结构，对上下评价冲突另开追问，承担更多分析而不把差异压成均分。"
 zg361m.52.b:0 "把所有互评取一个均分直接入榜，比较最迅速，却把可靠协作者和对上不对下者混为一类。"
 zg361m.52.c:0 "这季度先不碰，登记制度债"
 zg361m.53.t:0 "第053号 · 360 只作发展、不入奖金的制度路线"
 zg361m.53.desc:0 "【H · 背靠背互评的微观博弈／P2】\n\n决策：可将 360 用于校准加权、只用于发展建议，或只在价值观红线时影响档位。\n\n后果：与奖金脱钩会提高坦诚度但降低填写认真度；直接挂钩更有分量，也更容易催生结盟、报复与匿名黑箱。"
 zg361m.53.a:0 "将 360 用于发展建议和价值观红线，奖金仍由冻结绩效决定，承担另行辅导却换取更坦诚反馈。"
 zg361m.53.b:0 "把互评分直接挂入奖金和档位以提高填写分量，立刻强化约束，却催生结盟、报复与匿名黑箱。"
 zg361m.53.c:0 "这季度先不碰，登记制度债"
 zg361m.54.t:0 "第054号 · 汇报工时挤占真实产出"
 zg361m.54.desc:0 "【I · 周报、汇报与可见度军备竞赛／P1】\n\n决策：官员每轮在办事、写材料和经营关系间分配有限精力；经理可以要求长周报、短周报或只报异常。\n\n后果：材料越精美越容易被看见，但治理进度相应受损；长期只奖励包装会把整个团队推向低产出的汇报均衡。"
 zg361m.54.a:0 "限定一页事实卡和异常上报，为办事工时设保护线并抽查事实，承担模板设计与经理深读成本。"
 zg361m.54.b:0 "要求所有人每周提交精美长材料来强化可见度，短期信息充足，却把治理工时挤成汇报竞赛。"
 zg361m.54.c:0 "这季度先不碰，登记制度债"
 zg361m.55.t:0 "第055号 · 上司注意力席位"
 zg361m.55.desc:0 "【I · 周报、汇报与可见度军备竞赛／P1】\n\n决策：上司每周期只能深读少数报告、接见少数人；官员可争取汇报席、把机会让给团队，或走 sponsor 插队。\n\n后果：获得席位提高证据被采纳率，不会创造硬成绩；反复占席而无交付会反噬信誉并挤压真正救火者。"
 zg361m.55.a:0 "按风险、里程碑和长期低曝光轮换深读与接见席位，并记录占席后的交付，承担排期成本。"
 zg361m.55.b:0 "让 sponsor 和最会争取者随时插队，能迅速听见强声量，却挤掉救火者并奖励无交付占席。"
 zg361m.55.c:0 "这季度先不碰，登记制度债"
 zg361m.56.t:0 "第056号 · 逐级汇报中的截功"
 zg361m.56.desc:0 "【I · 周报、汇报与可见度军备竞赛／P1】\n\n决策：中层可原样转报下属成果、署为团队成果，或改写成自己的统筹功劳；下属可留痕、私下越级抄送或忍耐。\n\n后果：截功帮助中层向上管理，却降低团队忠诚并积累申诉证据；正确让功牺牲个人曝光，换取育人和留才分。"
 zg361m.56.a:0 "逐级转报时附原作者、版本和团队贡献签名，让功计入经理育人分，承担归属维护成本。"
 zg361m.56.b:0 "中层把下属成果统一署为自己的统筹功劳，快速提高上层可见度，却积累越级证据、离心和流失。"
 zg361m.56.c:0 "这季度先不碰，登记制度债"
 zg361m.57.t:0 "第057号 · 贡献留痕与版本签名"
 zg361m.57.desc:0 "【I · 周报、汇报与可见度军备竞赛／P1】\n\n决策：项目节点可花少量管理注意力冻结主责、协作和版本；不留痕则依赖事后口供与关系。\n\n后果：留痕降低抢功空间但增加流程负担；只有发生争议、晋升或审计时才兑现价值，不能日常直接加 KPI。"
 zg361m.57.a:0 "在关键节点冻结主责、协作与版本签名，只在争议、晋升和审计时调用，花少量持续注意力换可追溯性。"
 zg361m.57.b:0 "不留版本轨迹，事后由权力和口才一次裁定贡献，日常最省事，却让抢功者掌握争议。"
 zg361m.57.c:0 "这季度先不碰，登记制度债"
 zg361m.58.t:0 "第058号 · 越级抄送（CC）与信息政治"
 zg361m.58.desc:0 "【I · 周报、汇报与可见度军备竞赛／P1】\n\n决策：官员可把重大成果或风险抄送隔级上司；直属经理可鼓励透明、要求先沟通或把它视为挑战权威。\n\n后果：越级能救回被压住的信息，也可能伤直属关系；隔级只获得审计线索，仍不能直接替孙级官员定档。"
 zg361m.58.a:0 "只准重大成果或风险按协议越级抄送，要求直属经理同步回应并留审计线索，承担额外信息处理。"
 zg361m.58.b:0 "禁止越级并强令所有信息由直属经理转报，迅速巩固指挥链，却可能截留坏消息和隐形贡献。"
 zg361m.58.c:0 "这季度先不碰，登记制度债"
 zg361m.59.t:0 "第059号 · 坏消息早报、迟报与隐瞒"
 zg361m.59.desc:0 "【I · 周报、汇报与可见度军备竞赛／P1】\n\n决策：项目出险时立即上报求援、等到有方案再报，或藏到考核后；上司决定支援、追责或奖励透明。\n\n后果：早报短期伤可见 KPI 却降低最终损失；隐瞒若侥幸解决可保分，爆雷则叠加诚信扣分和经理监督责任。"
 zg361m.59.a:0 "风险出现即冻结早报时间、已知事实和求援决定，给透明者支援并在结果后复盘，承担救火预算。"
 zg361m.59.b:0 "要求团队先自行解决、考核后再报，短期保住指标和注意力，爆雷时却叠加诚信与监督责任。"
 zg361m.59.c:0 "这季度先不碰，登记制度债"
 zg361m.60.t:0 "第060号 · 材料泄露与创意窃取"
 zg361m.60.desc:0 "【I · 周报、汇报与可见度军备竞赛／P2】\n\n决策：竞争团队得到未公开方案后，可归还、共同立项或抢先包装上报；原作者可公开争执或走证据仲裁。\n\n后果：抢跑可能拿到资源，但版本留痕会决定翻案；无留痕时人脉与口才影响裁决，推动玩家建设证据制度。"
 zg361m.60.a:0 "封存原方案版本、接触记录和共同立项条件，由独立席裁定归属，承担证据保存与仲裁成本。"
 zg361m.60.b:0 "拿到材料的团队立即抢先包装上报以夺资源，可能赢得短期先手，却在签名证据出现时遭追责和反噬。"
 zg361m.60.c:0 "这季度先不碰，登记制度债"
 zg361m.61.t:0 "第061号 · 短文档 / 长叙事汇报制度"
 zg361m.61.desc:0 "【I · 周报、汇报与可见度军备竞赛／P2】\n\n决策：领主可要求一页事实卡、完整叙事材料或仅异常上报；制度决定哪些角色更易获得可见度。\n\n后果：短文档节省工时但不利于解释复杂协作，长叙事容纳背景却奖励文胆和形式主义；两者都不直接改硬成果。"
 zg361m.61.a:0 "统一一页事实卡并为复杂协作链接附录，只让异常进入长叙事，承担模板和材料索引维护。"
 zg361m.61.b:0 "要求所有人交完整叙事材料以便上司一次掌握背景，短期详尽，却奖励文胆并扩大形式主义工时。"
 zg361m.61.c:0 "这季度先不碰，登记制度债"
 zg361m.62.t:0 "第062号 · 实线与虚线目标冲突"
 zg361m.62.desc:0 "【J · 矩阵汇报、换老板与重组／P1】\n\n决策：矩阵官员面对地方上司和项目上司的相反要求时，选择服从一方、请求联合裁决或两边都口头答应。\n\n后果：押对方向可获一方高评，另一方会留下协作差评；两头隐瞒一旦暴露，价值观和晋升包同时受损。"
 zg361m.62.a:0 "触发冲突即让两位上司联合裁定优先级、责任和证据归属，承担协调延迟但给官员单一可执行口径。"
 zg361m.62.b:0 "强令官员服从实线上司并忽略虚线交付，指挥立刻清晰，却留下项目差评和跨部门关系债。"
 zg361m.62.c:0 "这季度先不碰，登记制度债"
 zg361m.63.t:0 "第063号 · 周期初权重契约"
 zg361m.63.desc:0 "【J · 矩阵汇报、换老板与重组／P1】\n\n决策：两位上司在开局冻结 70/30、50/50 等评分权重和交付边界；中途改权重必须有危机理由和双方确认。\n\n后果：事前约定减少年末抢人抢功；拒绝签约保留弹性，却让冲突由更高层校准并扣双方管理质量。"
 zg361m.63.a:0 "周期初双签评分权重、交付边界和危机改权条件，承担谈判与版本维护成本。"
 zg361m.63.b:0 "允许更强势上司在年终重写权重以保重点结果，迅速解决冲突，却让员工两头承诺并伤害管理质量。"
 zg361m.63.c:0 "这季度先不碰，登记制度债"
 zg361m.64.t:0 "第064号 · 换老板交接双签"
 zg361m.64.desc:0 "【J · 矩阵汇报、换老板与重组／P1】\n\n决策：旧上司冻结已完成事项与辅导记录，新上司确认剩余目标、可重置一次优先级或拒认旧承诺。\n\n后果：完整交接保护员工免受“新官重算账”；拒签者短期获得裁量，后续申诉时承担证据不连续的责任。"
 zg361m.64.a:0 "旧上司冻结完成事项和辅导记录，新上司双签剩余目标并只重置一次优先级，承担交接会议成本。"
 zg361m.64.b:0 "新上司宣布旧承诺作废、按新口径立即重算，迅速取得裁量，却造成证据断裂和高成功率申诉。"
 zg361m.64.c:0 "这季度先不碰，登记制度债"
 zg361m.65.t:0 "第065号 · 空降主管与旧部包"
 zg361m.65.desc:0 "【J · 矩阵汇报、换老板与重组／P2】\n\n决策：新主管可沿用旧团队、带入少量亲信或全面洗牌；老成员可表忠、靠硬成果自保或申请内部流动。\n\n后果：亲信提升执行一致性却放大机会不均和裙带审计；全盘清洗会获得空岗，却损失组织记忆与团队士气。"
 zg361m.65.a:0 "允许空降主管带少量有明确职责的亲信，同时审计机会分配、留任和知识交接，承担过渡双轨成本。"
 zg361m.65.b:0 "全面洗牌并以旧部替换原团队，迅速统一执行，却制造空岗、裙带审计和组织记忆断层。"
 zg361m.65.c:0 "这季度先不碰，登记制度债"
 zg361m.66.t:0 "第066号 · 项目取消：业务失败与个人失败分离"
 zg361m.66.desc:0 "【J · 矩阵汇报、换老板与重组／P1】\n\n决策：战略转向叫停项目时，校准会选择按已验证里程碑认可贡献、全部归零，或追究是否早该止损。\n\n后果：合理承认探索能鼓励挑战目标；一律归零会让所有人只做短平快项目，错误坚持则把沉没成本写进经理绩效。"
 zg361m.66.a:0 "冻结已验证里程碑、止损判断和取消原因，分别评价战略与个人贡献，承担一次专项复盘。"
 zg361m.66.b:0 "取消即把全部成果归零并追责项目组，快速止账，却迫使所有人只做短平快项目并掩盖错误战略。"
 zg361m.66.c:0 "这季度先不碰，登记制度债"
 zg361m.67.t:0 "第067号 · 合并后“一岗两人”"
 zg361m.67.desc:0 "【J · 矩阵汇报、换老板与重组／P2】\n\n决策：组织合并产生重复负责人时，可公开竞聘、双人过渡、按绩效留一，或把其中一人调入新赛道。\n\n后果：公开竞聘较公平但加剧短期内斗；暗定人选更快，却提高申诉、人才外流和新团队派系化。"
 zg361m.67.a:0 "用公开竞聘、双人过渡和合法调岗处理重复负责人，记录比较证据并承担短期双岗成本。"
 zg361m.67.b:0 "暗定亲信并立即撤换另一人，迅速消除重叠，却加剧派系、申诉和关键经验流失。"
 zg361m.67.c:0 "这季度先不碰，登记制度债"
 zg361m.68.t:0 "第068号 · 可携带履历与本地重新证明"
 zg361m.68.desc:0 "【J · 矩阵汇报、换老板与重组／P1】\n\n决策：转岗者携带冻结历史档位、成果语境和争议记录；新上司选择给予保护期、立即纳入本组分布或要求试运行。\n\n后果：旧 3.75 只是可信先验，不自动占新组名额；旧 3.25 也不能永久定罪，但未完成 PIP 仍需明确承接或关闭。"
 zg361m.68.a:0 "携带冻结档位、成果语境、争议与未结 PIP，在新岗设一次保护期和明确重证目标。"
 zg361m.68.b:0 "转入即完整参加新组分布，由新上司选择性采信旧账，快速融入竞争，却可能重复惩罚或占用名额。"
 zg361m.68.c:0 "这季度先不碰，登记制度债"
 zg361m.69.t:0 "第069号 · 正式送达与申诉时钟"
 zg361m.69.desc:0 "【K · 结果送达、申诉正义与裁员边界／P0】\n\n决策：上司必须当面反馈并送达冻结告身；受评人可签收、注明异议签收或拒收，拒收后由见证人送达。\n\n后果：只有送达才启动申诉期限和奖惩；故意不送达不能让上司无限拖延，程序超时会自动扣其管理履责。"
 zg361m.69.a:0 "当面送达冻结告身，允许异议签收并以见证处理拒收，逐项启动申诉与奖惩时钟。"
 zg361m.69.b:0 "榜单发布即视为全部送达并立即结算，最快进入执行，却可能让未见理由者错过申诉并引发程序翻案。"
 zg361m.69.c:0 "这季度先不碰，登记制度债"
 zg361m.70.t:0 "第070号 · 申诉后的反报复观察期"
 zg361m.70.desc:0 "【K · 结果送达、申诉正义与裁员边界／P1】\n\n决策：申诉后一年内，调岗、撤职、降俸和新增软性差评必须附新事实；上司可正常管理，也可冒险借题报复。\n\n后果：时间相近不自动等于报复，但缺新证据、理由突然反转会提高独立复核概率；恶意申诉者同样不能获得永久免考护盾。"
 zg361m.70.a:0 "一年内对调岗、撤职、降俸与新增差评要求新事实并由独立席抽查，承担持续监督工时。"
 zg361m.70.b:0 "允许经理在申诉后立即重排岗位和权限以恢复控制，行动迅速，却让理由反转被认定为报复。"
 zg361m.70.c:0 "这季度先不碰，登记制度债"
 zg361m.71.t:0 "第071号 · 内部论坛长文与公开升级"
 zg361m.71.desc:0 "【K · 结果送达、申诉正义与裁员边界／P2】\n\n决策：私下沟通和正式申诉失败后，当事人可发布实名长文、匿名爆料或保持沉默离开。\n\n后果：公开升级迅速提高隔级关注和同僚站队，也损害双方声誉；硬证据充分时推动重审，纯情绪控诉则可能反噬可信度。"
 zg361m.71.a:0 "穷尽私下沟通和正式申诉后，允许附冻结证据的实名长文进入受控复核，并投入调解与事实核查。"
 zg361m.71.b:0 "当事人立即公开实名或匿名爆料争取站队，能迅速获得高层注意，却同时烧毁双方声誉和内部信任。"
 zg361m.71.c:0 "这季度先不碰，登记制度债"
 zg361m.72.t:0 "第072号 · 提前泄露绩效档位"
 zg361m.72.desc:0 "【K · 结果送达、申诉正义与裁员边界／P1】\n\n决策：校准参与者可严守封存、私下提醒亲信准备申诉，或向团队放风试探反应。\n\n后果：被提醒者获得准备材料的先机；泄露会引发抢跑离职、互评串供和校准信任下降，查出来源则扣管理信誉。"
 zg361m.72.a:0 "限制校准材料权限、记录访问并统一送达时间，让所有人同步准备申诉，承担保密管理成本。"
 zg361m.72.b:0 "私下提醒亲信或向全队放风试探反应，能提前控场，却引发抢跑离职、串供和校准席互疑。"
 zg361m.72.c:0 "这季度先不碰，登记制度债"
 zg361m.73.t:0 "第073号 · 恶意泄密与善意吹哨分流"
 zg361m.73.desc:0 "【K · 结果送达、申诉正义与裁员边界／P1】\n\n决策：收到内部材料时，复核席判断其揭示程序造假、仅为报复，还是两者兼有；举报者选择实名担责或匿名降低证明力。\n\n后果：揭出真实问题者受保护并触发专项审计；篡改、断章取义或卖给竞争团队者受罚，不能把所有泄密都包装成正义。"
 zg361m.73.a:0 "由独立席核验材料真伪、公益目的和报复成分，保护真实举报并处罚篡改，承担专项调查成本。"
 zg361m.73.b:0 "把所有未经授权的泄露一律定为违纪并立即处罚，迅速恢复保密，却压住真实造假线索。"
 zg361m.73.c:0 "这季度先不碰，登记制度债"
 zg361m.74.t:0 "第074号 · 诚实裁撤与“洗成绩裁人”"
 zg361m.74.desc:0 "【K · 结果送达、申诉正义与裁员边界／P1】\n\n决策：财政或战略需要缩编时，领主可公开按组织原因撤岗并支付代价，或先强塞 3.25 再伪装成个人不胜任。\n\n后果：诚实裁撤花国库、伤短期士气但不污染个人履历；洗成绩更便宜，若翻案则追回处分、重创制度信任并问责两级经理。"
 zg361m.74.a:0 "按组织原因公开撤岗、由国库支付离开代价并保留中性履历，花钱换干净的绩效账。"
 zg361m.74.b:0 "先塞 3.25 再以个人不胜任低成本裁撤，迅速缩编，却在翻案时追回处分并重创两级经理信誉。"
 zg361m.74.c:0 "这季度先不碰，登记制度债"
 zg361m.75.t:0 "第075号 · 保履历自愿离开包"
 zg361m.75.desc:0 "【K · 结果送达、申诉正义与裁员边界／P2】\n\n决策：边界末位可接受一笔由国库支付的离开俸、保留中性履历并释放 HC，或拒绝后进入正常 PIP/申诉。\n\n后果：快速降本会真花组织金币且流失经验；强迫“自愿”若有证据，会被重新认定为程序性裁撤。"
 zg361m.75.a:0 "给边界末位真实离开俸、中性履历和清晰 HC 释放，承担国库支出并让其自由拒绝。"
 zg361m.75.b:0 "限时要求无补偿自愿离开，否则立即进入 PIP，能快速降本，却容易被认定为强迫裁撤。"
 zg361m.75.c:0 "这季度先不碰，登记制度债"
 zg361m.76.t:0 "第076号 · 程序失败的多级责任"
 zg361m.76.desc:0 "【K · 结果送达、申诉正义与裁员边界／P1】\n\n决策：翻案时区分直属经理漏证、隔级校准失察、制度设计错误和当事人虚报；可单责、分责或认定系统事故。\n\n后果：不再让一线经理或 HR 单独背锅；责任比例写入各自下一轮管理分，但孙级个体分仍由直属链重做。"
 zg361m.76.a:0 "翻案后按漏证、失察、制度错误和虚报逐项分责，并写入各自下轮管理分，承担联合复盘。"
 zg361m.76.b:0 "让直属经理或政委一人背下全部程序失败以迅速结案，问责清晰，却掩盖系统缺陷并诱发甩锅。"
 zg361m.76.c:0 "这季度先不碰，登记制度债"
 zg361m.77.t:0 "第077号 · 独立复核人轮换"
 zg361m.77.desc:0 "【K · 结果送达、申诉正义与裁员边界／P1】\n\n决策：从无直接关系的同级管理者中抽取复核席，或让原校准席自纠；当事人各有一次有因回避权。\n\n后果：独立复核更可信但耗费管理工时，原班复核更快却降低翻案公信力；复核人也会因草率结论积累质量记录。"
 zg361m.77.a:0 "从无直接关系的同级经理中轮换复核席，给双方一次有因回避并记录复核质量，承担人力成本。"
 zg361m.77.b:0 "由原校准席快速自纠并限制新证据，节省管理工时，却让同一批人维护自身结论、降低公信力。"
 zg361m.77.c:0 "这季度先不碰，登记制度债"
 zg361m.78.t:0 "第078号 · 分布公平性仪表盘"
 zg361m.78.desc:0 "【K · 结果送达、申诉正义与裁员边界／P2】\n\n决策：按新人、转岗者、亲族/非亲族、派系、岗位和任职年限查看历年档位差异；只提示异常，不自动判歧视。\n\n后果：经理可主动修正机会分配或解释业务原因；长期异常且无事实支持，会提高审计、流失和上司扣分概率。"
 zg361m.78.a:0 "按新人、转岗、亲族、派系、岗位和年限展示多年差异，并联查机会分配，只把异常送人工解释。"
 zg361m.78.b:0 "一旦某组比例异常就强制调档或处罚经理，纠偏最快，却把小样本和真实业务差异误判为歧视。"
 zg361m.78.c:0 "这季度先不碰，登记制度债"
 zg361m.79.t:0 "第079号 · 隔级接待日"
 zg361m.79.desc:0 "【K · 结果送达、申诉正义与裁员边界／P2】\n\n决策：高层每轮开放少量席位听取孙级官员的障碍、成果或申诉线索；下属可预约，直属经理可陪同但不能阻断。\n\n后果：降低信息截留，却会增加越级政治；接待日只产生证据和调查任务，高层不能在现场直接承诺孙级档位。"
 zg361m.79.a:0 "每轮开放少量预约席，只收障碍、成果和申诉线索并生成调查任务，承担高层时间且不现场改档。"
 zg361m.79.b:0 "高层接见时直接承诺资源或点改孙级档位，快速回应民意，却架空直属经理并刺激越级政治。"
 zg361m.79.c:0 "这季度先不碰，登记制度债"
 zg361m.80.t:0 "第080号 · 公开指标缺陷单"
 zg361m.80.desc:0 "【K · 结果送达、申诉正义与裁员边界／P1】\n\n决策：任何人可提交“指标可刷、目标冲突、数据失真”的缺陷单；指标 owner 可修复、解释接受风险或压下问题。\n\n后果：及时修复获得制度贡献，不因承认缺陷受罚；压下后爆雷则将个人刷分转为设计者和包庇者的共同责任。"
 zg361m.80.a:0 "公开登记可刷、冲突或失真的指标缺陷，由 owner 修复或书面接受风险，并保存发现者制度贡献。"
 zg361m.80.b:0 "要求 owner 立即关闭缺陷单、维持现指标到考核后，短期保住可比口径，却让爆雷责任扩散到设计者。"
 zg361m.80.c:0 "这季度先不碰，登记制度债"
 zg361m.81.t:0 "第081号 · 绩效信息层级压缩"
 zg361m.81.desc:0 "【K · 结果送达、申诉正义与裁员边界／P2】\n\n决策：选择逐级汇总、隔级可读原始证据，或由中央复核席看完整案卷；权限只改变信息流，不改变直属评分权。\n\n后果：层级越多越容易截功和失真，中央全看则增加行政负担与黑箱恐惧；玩家需在速度、隐私和纠偏能力间取舍。"
 zg361m.81.a:0 "按角色开放原始证据、逐级汇总和中央复核权限，并记录谁看过什么，承担权限与隐私治理成本。"
 zg361m.81.b:0 "强令每层只上报一张排名摘要以加快决策，信息流最短，却放大截功、失真和无法纠偏的黑箱。"
 zg361m.81.c:0 "这季度先不碰，登记制度债"
 zg361m.82.t:0 "第082号 · 总回报配方"
 zg361m.82.desc:0 "【L · 薪酬、奖金与长期激励／P1】\n\n决策：把待遇拆为固定品级俸、岗位津贴、绩效奖金、专项奖和递延奖；领主可偏稳定、偏绩效或偏长期。\n\n后果：所有奖励都由地方/上级国库流向个人金币，不凭空造钱；高浮动强化 361 刺激，也放大焦虑、抢功和财务波动。"
 zg361m.82.a:0 "拆分固定俸、岗位津贴、绩效、专项和递延奖，逐笔由国库拨付并设置可负担上限。"
 zg361m.82.b:0 "把待遇大幅转成当期绩效浮动奖来强化 361，短期刺激强，却放大焦虑、抢功和财政波动。"
 zg361m.82.c:0 "这季度先不碰，登记制度债"
 zg361m.83.t:0 "第083号 · 公司—团队—个人三层奖金系数"
 zg361m.83.desc:0 "【L · 薪酬、奖金与长期激励／P1】\n\n决策：奖金依次乘天朝总体、直属团队和个人档位系数；制度可提高团队权重鼓励协作，或提高个人权重强化竞争。\n\n后果：明星身处失败团队可能拿不到高奖，普通档身处强团队也能分享成果；调整权重改变合作均衡而不改绩效历史。"
 zg361m.83.a:0 "周期初冻结天朝、团队和个人三层系数，保留团队分享与个人兑现，并承担复杂结算工时。"
 zg361m.83.b:0 "临时把奖金重押个人档位，迅速拉开头档差距，却让失败团队的抢功和内部竞争失控。"
 zg361m.83.c:0 "这季度先不碰，登记制度债"
 zg361m.84.t:0 "第084号 · 递延奖金与分期归属"
 zg361m.84.desc:0 "【L · 薪酬、奖金与长期激励／P2】\n\n决策：连续 3.75 可把部分奖金立即领取，或换成未来三年分期的“长期功赏”；离任、翻案和项目反噬决定剩余归属。\n\n后果：递延减少当期国库压力并提高留任，却制造未归属金手铐；若从不兑现，组织信用和人才市场吸引力下跌。"
 zg361m.84.a:0 "为长期功赏建立三年分期账，预留国库、写明离任与反噬条件并逐年兑现，承担未来财政承诺。"
 zg361m.84.b:0 "本轮把奖金全额发清以强刺激留人，结算简单，却在造假或项目反噬时难以追回并加重当期国库。"
 zg361m.84.c:0 "这季度先不碰，登记制度债"
 zg361m.85.t:0 "第085号 · 续期激励断崖"
 zg361m.85.desc:0 "【L · 薪酬、奖金与长期激励／P2】\n\n决策：旧递延奖即将归属完毕时，上司可发新一轮留才包、只给口头承诺或允许人才自由流动。\n\n后果：不续期会出现“到点即走”；滥发续期包透支未来国库，并让未获包的同档人员产生薪酬不公。"
 zg361m.85.a:0 "提前跟踪旧奖归属终点，按关键性和继任风险预留续期包并公开同档比较，承担长期预算。"
 zg361m.85.b:0 "等人才临近离开才给紧急反 offer 或口头续期，短期省钱，却制造到点即走、饼债和薪酬不公。"
 zg361m.85.c:0 "这季度先不碰，登记制度债"
 zg361m.86.t:0 "第086号 · 奖金暂扣与追索"
 zg361m.86.desc:0 "【L · 薪酬、奖金与长期激励／P1】\n\n决策：高风险项目的奖金可全发、暂扣一部分到审计后，或在证实造假时追索；暂扣比例必须事前写进规则。\n\n后果：全发激励强但追回困难，暂扣降低造假收益却伤即时激励；临时改规则会成为成功申诉和离职理由。"
 zg361m.86.a:0 "对高风险项目事前写明暂扣比例、审计日和造假追索条件，并为每笔款项保留结算记录。"
 zg361m.86.b:0 "出现疑点就临时全额扣住或追索已发奖金，迅速保护国库，却因事后改规则引发申诉和离职。"
 zg361m.86.c:0 "这季度先不碰，登记制度债"
 zg361m.87.t:0 "第087号 · 薪酬带宽与带内位置"
 zg361m.87.desc:0 "【L · 薪酬、奖金与长期激励／P1】\n\n决策：同一职级内按资历、市场稀缺和历史表现分布在低/中/高位；调薪可优先补低位、奖励明星或压缩倒挂。\n\n后果：高绩效但已在带顶者可能只拿奖金不再加固定俸；新招人才高于老臣会触发薪酬倒挂与留才压力。"
 zg361m.87.a:0 "审计资历、市场稀缺、历史绩效和带内位置，优先修补有证据的低位与倒挂，承担调薪预算。"
 zg361m.87.b:0 "严格封顶固定俸、只给带顶明星一次奖金，迅速守住带宽，却让高绩效者和被倒挂老臣更易流失。"
 zg361m.87.c:0 "这季度先不碰，登记制度债"
 zg361m.88.t:0 "第088号 · 市场调薪与绩效调薪争预算"
 zg361m.88.desc:0 "【L · 薪酬、奖金与长期激励／P1】\n\n决策：有限调薪池用于给稀缺岗位普调、给 3.75 奖励，或修复明显内部不公。\n\n后果：市场调薪不应伪装成高绩效，绩效调薪也不能解决整体外部竞争力；偏一端会让另一类关键人才流失。"
 zg361m.88.a:0 "把调薪池拆成市场稀缺、3.75 奖励和内部公平三账，以证据排队并公布预算取舍。"
 zg361m.88.b:0 "把全部调薪押给本轮 3.75 以强化绩效信号，短期鲜明，却放任稀缺岗位和倒挂人才被挖。"
 zg361m.88.c:0 "这季度先不碰，登记制度债"
 zg361m.89.t:0 "第089号 · 职级、任命、权力与现金解耦"
 zg361m.89.desc:0 "【L · 薪酬、奖金与长期激励／P1】\n\n决策：高绩效者可只加俸、升专业级、获得代理权，或等待真正职务空缺；玩家不必用封地承载每次晋升。\n\n后果：缓解 CK3 合法头衔稀缺，但长期“只给级不给钱/只给钱不给权”会形成晋升空心化和离职风险。"
 zg361m.89.a:0 "为加俸、专业级、代理权和正式空缺分别写清权限、现金与兑现日期，承担多轨职位管理成本。"
 zg361m.89.b:0 "先发一个无钱无权的级别或无限期代理名义稳住明星，成本最低，却积累空心晋升与离职风险。"
 zg361m.89.c:0 "这季度先不碰，登记制度债"
 zg361m.90.t:0 "第090号 · 专项即时奖"
 zg361m.90.desc:0 "【L · 薪酬、奖金与长期激励／P1】\n\n决策：对救火、跨部门支持和制度建设发一次性奖，不占 3.75 配额；经理选择真奖励、只表扬或侵占团队奖金池。\n\n后果：隐形贡献终于可兑现，又不改终评名次；专项奖过多会绕开 361、掏空国库并被上司质疑分配失控。"
 zg361m.90.a:0 "为救火、跨部门支持和制度建设设独立小池，凭唯一贡献 ID 发奖且不改终评名次。"
 zg361m.90.b:0 "经理从团队奖金池即时奖赏最显眼的救火者，激励立刻可见，却可能绕开 361、掏空他人奖金。"
 zg361m.90.c:0 "这季度先不碰，登记制度债"
 zg361m.91.t:0 "第091号 · 年功奖与绩效奖分账"
 zg361m.91.desc:0 "【L · 薪酬、奖金与长期激励／P2】\n\n决策：长期服务、艰苦任职和当年高绩效分别奖励，不允许用“忠诚多年”偷换本轮 3.75，也不让一次低档抹去全部年功。\n\n后果：稳定贡献者有留任价值，强制分布仍保有区分；两账同时透明会减少争议，也提高国库承诺成本。"
 zg361m.91.a:0 "把长期服务、艰苦任职和本轮绩效分账分池，逐项兑现，承担更高但可解释的国库承诺。"
 zg361m.91.b:0 "只按本轮档位发钱以保持强分布，结算最简单，却让稳定老臣的一次低档抹去全部留任价值。"
 zg361m.91.c:0 "这季度先不碰，登记制度债"
 zg361m.92.t:0 "第092号 · 专业 / 管理双通道"
 zg361m.92.desc:0 "【M · 职级、双通道与晋升校准／P1】\n\n决策：高绩效人才可走专家路线继续亲自办事，或走管理路线开始为团队分布、育人和 HC 负责。\n\n后果：不再把所有明星都逼成经理；两条路线待遇可相当，但管理权、风险和考核表不同。"
 zg361m.92.a:0 "建立待遇可比但权力、风险与量表不同的专家和管理通道，并为转轨提供试任与培训预算。"
 zg361m.92.b:0 "把最强业务明星直接升成经理填补空缺，立刻获得负责人，却可能同时失去专家产出并制造坏管理。"
 zg361m.92.c:0 "这季度先不碰，登记制度债"
 zg361m.93.t:0 "第093号 · 失败经理回归专家岗"
 zg361m.93.desc:0 "【M · 职级、双通道与晋升校准／P1】\n\n决策：个人业务强、团队管理差者可降管理权保留专业级，接受辅导后再竞聘，或硬撑管理岗。\n\n后果：回归不会等同人格羞辱和全额降薪；硬撑若继续高翻案、高流失，会升级为真正的管理 PIP。"
 zg361m.93.a:0 "撤去管理权但保留经验证的专业级和合理待遇，配辅导后再竞聘，承担岗位重配与培养成本。"
 zg361m.93.b:0 "立即全额降岗降俸或逼其继续硬撑管理岗，处置强硬，却可能赶走强专家或升级团队流失。"
 zg361m.93.c:0 "这季度先不碰，登记制度债"
 zg361m.94.t:0 "第094号 · 微职级与“升半级”缓冲"
 zg361m.94.desc:0 "【M · 职级、双通道与晋升校准／P2】\n\n决策：在大任命之间设置少量专业级台阶；玩家可用微晋升留人，也可把资源集中到真正跨级候选人。\n\n后果：减少“多年零晋升”的断层，但台阶过密会制造通胀、复杂薪酬倒挂和人人等升级的行政负担。"
 zg361m.94.a:0 "只设少量有真实职责、带宽和年限门槛的微职级，定期清理通胀，承担更复杂的职位管理。"
 zg361m.94.b:0 "频繁发半级称号、把现金与权限以后再说，能快速安抚晋升焦虑，却制造头衔通胀和饼债。"
 zg361m.94.c:0 "这季度先不碰，登记制度债"
 zg361m.95.t:0 "第095号 · 高级管理任命年度复审"
 zg361m.95.desc:0 "【M · 职级、双通道与晋升校准／P1】\n\n决策：公爵及以上的 361 管理资格每年根据按期京察、团队结果、翻案、流失和继任重新确认、辅导或收权。\n\n后果：封建头衔不被脚本非法剥夺，但其 361 预算、复核席和人才权限可暂时收紧；管理者也成为被管理者。"
 zg361m.95.a:0 "每年按京察履责、团队结果、翻案、流失和继任复审 361 权限，必要时辅导或收紧预算而不非法剥夺头衔。"
 zg361m.95.b:0 "一轮不佳就立即收走复核席、人才权和预算，迅速问责高管，却把短期波动变成组织震荡。"
 zg361m.95.c:0 "这季度先不碰，登记制度债"
 zg361m.96.t:0 "第096号 · 破格晋升包"
 zg361m.96.desc:0 "【M · 职级、双通道与晋升校准／P2】\n\n决策：对连续超预期或关键战功者使用极少破格额度；经理需说明为何跳过年限，并点名被延后的正常候选人。\n\n后果：快速留住明星，却透支公平感和未来名额；破格者次年若表现平庸，会反噬 sponsor 与评委信用。"
 zg361m.96.a:0 "只用极少额度处理连续超预期或关键战功，说明跳年限理由、被延后人选并次年复审，承担公平成本。"
 zg361m.96.b:0 "让 sponsor 对一次耀眼战功立即跳级晋升，快速留住英雄，却透支正常名额并把次年风险压给评委。"
 zg361m.96.c:0 "这季度先不碰，登记制度债"
 zg361m.97.t:0 "第097号 · 跨团队晋升校准"
 zg361m.97.desc:0 "【M · 职级、双通道与晋升校准／P1】\n\n决策：各经理提交候选包争夺有限晋升槽；评委比较当前级别之外的影响范围，而非简单重排当年 3.75。\n\n后果：团队内第一不必然战胜跨组织贡献者；经理可以强推亲信，但失败提包次数会影响其人才判断信誉。"
 zg361m.97.a:0 "让各队提交同格式晋升包，由跨组评委比较超出当前职级的影响范围并记录失败提包质量。"
 zg361m.97.b:0 "按经理声量和各队第一名快速分完晋升槽，能及时关会，却让本地排名压过跨组织贡献。"
 zg361m.97.c:0 "这季度先不碰，登记制度债"
 zg361m.98.t:0 "第098号 · 增长、补缺、项目三类 HC"
 zg361m.98.desc:0 "【N · HC 的来源、结构与回收／P1】\n\n决策：新增业务申请增长 HC，离任岗位申请 backfill，临时战役申请项目 HC；用途之间转换必须重新答辩。\n\n后果：三类名额有不同期限和验收责任，防止拿“补缺”暗中扩编；项目结束未回收会扣经理资源纪律。"
 zg361m.98.a:0 "把增长、补缺和项目 HC 分别登记用途、期限与验收，转换必须重答辩，承担三套名额管理。"
 zg361m.98.b:0 "把三类名额合成机动池让经理随时挪用，能快速支援热点，却让临时项目悄然变永久扩编。"
 zg361m.98.c:0 "这季度先不碰，登记制度债"
 zg361m.99.t:0 "第099号 · HC 到期、结转与年底突击招募"
 zg361m.99.desc:0 "【N · HC 的来源、结构与回收／P1】\n\n决策：未使用名额可到期回收、付出信用结转，或年底仓促招人保住分母。\n\n后果：突击招募能保名额却提高错配和试用失败；主动归还短期少人，换取下次申请的预算可信度。"
 zg361m.99.a:0 "按招聘管线决定到期归还或一次有据结转，并把主动归还写入下次预算信用，承担规划缺口。"
 zg361m.99.b:0 "年底仓促招人保住名额和分母，立即避免回收，却增加错配、试用失败和导师负担。"
 zg361m.99.c:0 "这季度先不碰，登记制度债"
 zg361m.100.t:0 "第100号 · 冻结期与关键岗位特批"
 zg361m.100.desc:0 "【N · HC 的来源、结构与回收／P1】\n\n决策：财政紧张时冻结增长 HC，只为关键岗位、承诺项目或安全底线开特批；经理可停招、换更低成本结构或向上争例外。\n\n后果：特批集中资源却制造寻租；把普通岗位包装成关键岗若未兑现，会连累后续所有 HC 申请。"
 zg361m.100.a:0 "冻结增长 HC，但以岗位风险、承诺项目和安全底线书面特批，并审计低成本替代方案。"
 zg361m.100.b:0 "全面停招，只给领主亲点的“关键岗”开口，短期稳住财政，却制造寻租并让普通关键工作断供。"
 zg361m.100.c:0 "这季度先不碰，登记制度债"
 zg361m.101.t:0 "第101号 · 一个资深 / 两个普通 / 学徒梯队"
 zg361m.101.desc:0 "【N · HC 的来源、结构与回收／P1】\n\n决策：同一预算可买一个高阶人才、两个中阶人才，或一名正式官员带若干培养名额。\n\n后果：资深者见效快但形成单点依赖，梯队成长慢却能产出继任；HC 不再等价于“多生成一个角色”。"
 zg361m.101.a:0 "按交付时点、单点依赖和继任需求设计资深、中阶与学徒组合，并为梯队预留导师预算。"
 zg361m.101.b:0 "把全部预算押给一个马上能交付的资深者，见效最快，却抬高议价力并留下无人继任的单点。"
 zg361m.101.c:0 "这季度先不碰，登记制度债"
 zg361m.102.t:0 "第102号 · 零基编制重审"
 zg361m.102.desc:0 "【N · HC 的来源、结构与回收／P2】\n\n决策：每隔数年让所有团队从零说明岗位价值，而不是自动沿用去年名额；高层可全量重审或只审低效/长期空缺部分。\n\n后果：能把资源从衰退部门挪向新战略，也会制造周期性不安和汇报风暴；频繁使用降低长期建设意愿。"
 zg361m.102.a:0 "每隔数年只对低效、长期空缺和战略转向岗位做证据化零基重审，并为迁移设置过渡预算。"
 zg361m.102.b:0 "每年让所有团队从零抢回全部编制，重分资源最快，却制造汇报风暴、不安和短期主义。"
 zg361m.102.c:0 "这季度先不碰，登记制度债"
 zg361m.103.t:0 "第103号 · 空编占坑审计"
 zg361m.103.desc:0 "【N · HC 的来源、结构与回收／P1】\n\n决策：岗位长期空缺时，经理可说明候选不足、主动归还、借给别组或用虚拟候选拖延。\n\n后果：占坑保留未来选择权却让当前团队超负荷；查出虚假招聘进度会立即回收并扣 HC 信用。"
 zg361m.103.a:0 "长期空编必须提交真实候选管线、主动归还或限期借出，并按月复核，承担放弃未来选择权的成本。"
 zg361m.103.b:0 "用虚拟候选和反复延期开岗保住名额，短期避免被收回，却让现团队过载并在查实时失去 HC 信用。"
 zg361m.103.c:0 "这季度先不碰，登记制度债"
 zg361m.104.t:0 "第104号 · 新人池 / 成熟人才池之争"
 zg361m.104.desc:0 "【N · HC 的来源、结构与回收／P2】\n\n决策：预算投向廉价可培养的新人、能马上交付的成熟人才，或内部转岗；三者使用不同 HC 与培养成本。\n\n后果：新人提高长期梯队但加重导师负担，成熟人才造成薪酬倒挂，内部转岗则把成本和名额争议转给原团队。"
 zg361m.104.a:0 "按长期梯队、即时交付和内部流动组合新人、成熟人才与转岗者，并分别预算导师、薪酬和 backfill。"
 zg361m.104.b:0 "集中购买马上能交付的成熟人才，短期产出最高，却造成薪酬倒挂、文化冲突和梯队断层。"
 zg361m.104.c:0 "这季度先不碰，登记制度债"
 zg361m.105.t:0 "第105号 · 离任后的 backfill 归属"
 zg361m.105.desc:0 "【N · HC 的来源、结构与回收／P1】\n\n决策：人员离开后，名额可自动回原组、由上级收回重分，或随业务责任一起转移；事前制度决定默认归属。\n\n后果：自动归还鼓励经理放人，中央回收提高结构调整能力；规则模糊会激励卡转岗和把人拖到考核后再放。"
 zg361m.105.a:0 "事前规定名额回原组、中央回收或随责任转移，并把放人与 backfill 优先联动，承担规则维护成本。"
 zg361m.105.b:0 "经理把人卡到考核后再放以保住 backfill，短期守住名额，却拖延流动并扭曲离任时点。"
 zg361m.105.c:0 "这季度先不碰，登记制度债"
 zg361m.106.t:0 "第106号 · 关键岗位与关键人才分离"
 zg361m.106.desc:0 "【O · 人才盘点、继任与关键人才／P1】\n\n决策：先标出一旦空缺就会伤害治理的岗位，再判断现任是否真是不可替代人才；可保岗位不保人，也可培养一人覆盖多岗。\n\n后果：避免把上司偏爱的明星自动叫作关键人才；岗位风险进入 HC 和继任优先级，个人标签则影响留任投入。"
 zg361m.106.a:0 "先评估岗位空缺冲击，再单独评估现任可替代性，为关键岗配置继任和留才预算。"
 zg361m.106.b:0 "把上司最偏爱的明星直接标成不可替代并集中资源，迅速稳住关系，却掩盖真正岗位风险和替补缺口。"
 zg361m.106.c:0 "这季度先不碰，登记制度债"
 zg361m.107.t:0 "第107号 · 继任准备度阶梯"
 zg361m.107.desc:0 "【O · 人才盘点、继任与关键人才／P1】\n\n决策：每个关键岗位列“现在可接、两年可接、长期培养、无人可接”候选；经理分配导师、代理任务和曝光机会。\n\n后果：有名字不等于可继任；长期无人可接会扣经理育人分并提高岗位空缺时的治理冲击。"
 zg361m.107.a:0 "为关键岗维护现在可接、两年可接、长期培养和无人可接四档，并投入导师、代理任务和曝光。"
 zg361m.107.b:0 "直接点名一位太子为随时可接以迅速消除空白，却可能把关系和潜力标签误当真实准备度。"
 zg361m.107.c:0 "这季度先不碰，登记制度债"
 zg361m.108.t:0 "第108号 · 代理任职试炼"
 zg361m.108.desc:0 "【O · 人才盘点、继任与关键人才／P1】\n\n决策：让候选人在原任离岗、短期战役或专项期代理管理权；可给充分授权、保留否决权或只让其背责任。\n\n后果：真实试炼更新潜力证据并可能提前暴露不适配；不给权只给责会成为候选申诉和经理育人失败的证据。"
 zg361m.108.a:0 "给候选明确期限、真实权限、资源和成功标准，结束后冻结试炼证据，承担原任监督与试错成本。"
 zg361m.108.b:0 "只把交付责任压给代理者、保留所有否决权，以最小风险快速试人，却让失败无法证明能力并构成申诉。"
 zg361m.108.c:0 "这季度先不碰，登记制度债"
 zg361m.109.t:0 "第109号 · 高潜标签的公开层级"
 zg361m.109.desc:0 "【O · 人才盘点、继任与关键人才／P2】\n\n决策：高潜名单可只对上级可见、告知本人但不公开，或全团队透明；经理也可拒绝固定名单。\n\n后果：公开能提高被选者投入，也制造“太子党”和未入选者流失；秘密降低攀比，却方便经理暗箱雪藏或偏爱。"
 zg361m.109.a:0 "只告知本人及必要上级，公开标准、复审日期和发展投入，并承担名单维护与未入选沟通。"
 zg361m.109.b:0 "向全团队公布高潜名单以立即强化投入和竞争，却制造太子党、未入选者流失与经理偏爱。"
 zg361m.109.c:0 "这季度先不碰，登记制度债"
 zg361m.110.t:0 "第110号 · 潜力校准与绩效校准分会"
 zg361m.110.desc:0 "【O · 人才盘点、继任与关键人才／P1】\n\n决策：先按当期成果排 361，再单独讨论学习速度、岗位跨度和未来责任；不得用一句“有潜力”挤掉本轮高绩效者的奖金。\n\n后果：高潜低绩效获得培养而非直接 3.75，稳定明星获得当期兑现但未必自动晋升；两张表减少概念偷换。"
 zg361m.110.a:0 "先结算当期 361，再另会核验学习速度、跨度与未来责任，维护两张冻结表并分别配置奖励和培养。"
 zg361m.110.b:0 "在同一会上用一句高潜直接抬档或挤掉稳定明星，快速集中资源，却混淆奖金与未来押注。"
 zg361m.110.c:0 "这季度先不碰，登记制度债"
 zg361m.111.t:0 "第111号 · 遗憾流失与健康流失分类"
 zg361m.111.desc:0 "【O · 人才盘点、继任与关键人才／P1】\n\n决策：人才离开时判断是应挽留的高绩效/关键人才、合理错配退出，还是被错误标记的低绩效；上司可承认误判或粉饰为“优化”。\n\n后果：遗憾流失扣经理留才和继任分，健康流失释放 HC；事后出现高成就会反向检验原评级与人才判断。"
 zg361m.111.a:0 "离任时按绩效、关键性、错配和程序争议分类，并在其后续成就出现时回写原人才判断。"
 zg361m.111.b:0 "把所有离开统一报成健康优化以保护本轮经理分，报表立刻好看，却掩盖留才失败和错误低评。"
 zg361m.111.c:0 "这季度先不碰，登记制度债"
 zg361m.112.t:0 "第112号 · 留任访谈（Stay Interview）"
 zg361m.112.desc:0 "【O · 人才盘点、继任与关键人才／P1】\n\n决策：对连续 3.75、关键继任者和明显不满者，经理可询问其要钱、机会、授权、换岗还是减少内耗，并选择兑现一项或画饼。\n\n后果：兑现消耗真实资源但降低离开概率；承诺未兑现形成可见的“饼债”，比从未沟通更伤信任。"
 zg361m.112.a:0 "对明星、继任者和不满者做结构化留任访谈，只承诺一项可预算的钱、机会、授权或减负并登记兑现。"
 zg361m.112.b:0 "等其提出离开才给高额反 offer 或口头画饼，短期可能留人，却抬高成本并让未兑现承诺伤信任。"
 zg361m.112.c:0 "这季度先不碰，登记制度债"
 zg361m.113.t:0 "第113号 · 关键人依赖与知识移交"
 zg361m.113.desc:0 "【O · 人才盘点、继任与关键人才／P1】\n\n决策：明星可垄断信息保持不可替代，也可培养副手、写下制度资产；经理决定奖励英雄救火还是团队可复制性。\n\n后果：单点英雄短期 KPI 高、议价力强，离开时造成严重冲击；培养副手会分走个人曝光，却提高晋升管理岗的资格。"
 zg361m.113.a:0 "奖励培养副手、制度文档和可复制流程，把知识移交写入晋升资格，承担明星分权与带教工时。"
 zg361m.113.b:0 "继续重奖单点英雄救火并用加俸锁住本人，短期交付强，却让其离开或失能时造成巨大冲击。"
 zg361m.113.c:0 "这季度先不碰，登记制度债"
 zg361m.114.t:0 "第114号 · 经理“人才输出”积分"
 zg361m.114.desc:0 "【P · 内部流动、招聘与新人落地／P1】\n\n决策：原上司放出优秀人才时，获得育人分、未来 backfill 优先或跨团队人情；也可继续卡人保当期产出。\n\n后果：把“培养的人被挖走”从纯损失变成部分荣誉；若输出后团队立刻崩溃，仍会暴露继任准备不足。"
 zg361m.114.a:0 "放出优秀人才可获得育人分、backfill 优先和跨组信用，但必须同时提交继任计划并承担过渡空缺。"
 zg361m.114.b:0 "以关键交付为由长期卡住明星保当期产出，团队眼下稳定，却损害人才输出分和内部市场信用。"
 zg361m.114.c:0 "这季度先不碰，登记制度债"
 zg361m.115.t:0 "第115号 · 匿名内部应聘"
 zg361m.115.desc:0 "【P · 内部流动、招聘与新人落地／P1】\n\n决策：员工可在初筛阶段隐藏申请，进入最终面谈才通知原上司；制度可保护隐私、要求全程透明或限制活跃 PIP 者。\n\n后果：匿名降低经理事前报复和雪藏，却增加突然空缺；最终转出仍走合法任命，不能凭申请瞬移角色或头衔。"
 zg361m.115.a:0 "初筛隐藏申请，终面才通知原上司并规划合法交接，承担突然空缺风险换取免报复通道。"
 zg361m.115.b:0 "要求申请前先获原上司批准以保护业务连续，信息最透明，却让卡人和雪藏发生在候选出现之前。"
 zg361m.115.c:0 "这季度先不碰，登记制度债"
 zg361m.116.t:0 "第116号 · 放人时限与一次交接延期"
 zg361m.116.desc:0 "【P · 内部流动、招聘与新人落地／P1】\n\n决策：内部录用后，原上司须在期限内放人，可因关键交付申请一次短延期并提交继任计划。\n\n后果：合理延期保护业务，反复拖延则扣人才输出和管理信用；新团队也要承担等待或放弃候选的选择。"
 zg361m.116.a:0 "内部录用后设固定放人期，只准凭关键交付和继任计划延期一次，承担交接与 backfill 协调。"
 zg361m.116.b:0 "由原上司以业务需要反复拖到项目结束，短期保住产出，却可能逼新团队放弃并形成卡人记录。"
 zg361m.116.c:0 "这季度先不碰，登记制度债"
 zg361m.117.t:0 "第117号 · 转岗爬坡保护期"
 zg361m.117.desc:0 "【P · 内部流动、招聘与新人落地／P1】\n\n决策：转岗者首轮按明确爬坡目标评价、部分参与分布或直接完整参评；保护只能使用一次，跨组来回不能无限刷新。\n\n后果：给错岗人才真正重启机会，同时保留旧履历；爬坡期结束仍不适配时，PIP 或再次流动理由更扎实。"
 zg361m.117.a:0 "为转岗者设置一次岗位化爬坡目标、部分参评比例和到期日，保留旧履历并投入辅导资源。"
 zg361m.117.b:0 "转岗首轮立即完整强排以防保护套利，迅速检验适配，却可能把学习曲线再次误判成低绩效。"
 zg361m.117.c:0 "这季度先不碰，登记制度债"
 zg361m.118.t:0 "第118号 · 试用期绝对门槛，不占末位配额"
 zg361m.118.desc:0 "【P · 内部流动、招聘与新人落地／P1】\n\n决策：新人按预先写明的胜任门槛决定通过、延长辅导或退出，不拿其失败去填正式员工 10% 的 C。\n\n后果：堵住“招一批新人专门背 C”的玩法；招聘质量差会回写招聘经理和导师，而不是给老员工腾出虚假好档。"
 zg361m.118.a:0 "事前写明试用胜任门槛，按证据通过、延长辅导或退出，另行回写招聘和导师且不占正式 C 档。"
 zg361m.118.b:0 "新人未即时达标就快速退出并计入团队末位，既腾岗又保护老员，却鼓励专招新人背 C。"
 zg361m.118.c:0 "这季度先不碰，登记制度债"
 zg361m.119.t:0 "第119号 · 招聘质量回写"
 zg361m.119.desc:0 "【P · 内部流动、招聘与新人落地／P1】\n\n决策：新人才入职若快速成功、错岗或试用失败，结果延迟写回提出 HC、选人和批准招聘的管理者。\n\n后果：低价乱招和只看关系会污染未来 HC 信用；高质量招募提高组织能力，但不能在入职当天提前算功。"
 zg361m.119.a:0 "等新人完成爬坡后，把成功、错岗或失败按证据回写 HC 提出者、选人者与批准者，承担延迟核算。"
 zg361m.119.b:0 "只按招聘速度和填满名额立即奖经理，迅速推动补员，却奖励低价乱招并把失败甩给新人导师。"
 zg361m.119.c:0 "这季度先不碰，登记制度债"
 zg361m.120.t:0 "第120号 · 导师与 onboarding 绩效"
 zg361m.120.desc:0 "【P · 内部流动、招聘与新人落地／P1】\n\n决策：为新人指派导师并选择轻量答疑、结构化带教或放养；导师获得时间成本和可验证的育人目标。\n\n后果：新人爬坡速度、留存和独立交付回写导师贡献；强者拒绝带人可保个人产出，却限制其管理晋升包。"
 zg361m.120.a:0 "给导师预留结构化带教工时、阶段目标和结果回写，把新人独立交付计为可验证育人贡献。"
 zg361m.120.b:0 "只要求明星导师随问随答、其余时间保个人交付，短期少损产出，却让新人爬坡、留存和管理梯队受损。"
 zg361m.120.c:0 "这季度先不碰，登记制度债"
 zg361m.121.t:0 "第121号 · 首次任经理试运行"
 zg361m.121.desc:0 "【Q · 管理者自己的绩效文化／P1】\n\n决策：新经理先管理小团队或一个周期，接受导师和隔级复盘；可提前转回专家岗，也可申请正式管理权限。\n\n后果：把“业务好所以必会带人”变成可验证假设；试运行失败不必直接职业死亡，但不能继续无成本管大团队。"
 zg361m.121.a:0 "先给小团队试管一周期，并配导师与隔级复盘"
 zg361m.121.b:0 "直接授予大团队正式管理权，只看首周期结果定去留"
 zg361m.121.c:0 "这季度先不碰，登记制度债"
 zg361m.122.t:0 "第122号 · 管理者 4-3-3 记分卡"
 zg361m.122.desc:0 "【Q · 管理者自己的绩效文化／P1】\n\n决策：默认以 40% 团队硬结果、30% 人才与组织、30% 价值观/管理过程评价经理；制度可小幅调权但不得只看短期结果。\n\n后果：经理压榨团队拿结果可能先赢 40 分，却在流失、继任、翻案和反馈债上失分；好人缘也不能掩盖长期不交付。"
 zg361m.122.a:0 "按四成结果、三成人才、三成过程留证打分"
 zg361m.122.b:0 "把当期硬结果提到绝对多数，流失与反馈债以后再算"
 zg361m.122.c:0 "这季度先不碰，登记制度债"
 zg361m.123.t:0 "第123号 · 下属评经理专表"
 zg361m.123.desc:0 "【Q · 管理者自己的绩效文化／P1】\n\n决策：下属只评价目标清晰、资源支持、反馈质量、授权、公平和育人，不对经理业务 KPI 投票。\n\n后果：与普通 360 分开可减少概念污染；一致性差评触发辅导或审计，单个仇敌的报复性低分会被可信度模型限权。"
 zg361m.123.a:0 "用六项专表收集下属评价，并按评价者可信度校正"
 zg361m.123.b:0 "用一次匿名好坏票快速判断经理是否得人心"
 zg361m.123.c:0 "这季度先不碰，登记制度债"
 zg361m.124.t:0 "第124号 · “先有接班人，才升经理”"
 zg361m.124.desc:0 "【Q · 管理者自己的绩效文化／P1】\n\n决策：经理进入更高管理岗前，需交出至少一名经代理验证的继任者；无继任时可延期、临时双岗或由上级冒险放行。\n\n后果：倒逼知识移交和人才输出；硬性执行过头会奖励经理藏着不升，上级放行则要承担原团队断层风险。"
 zg361m.124.a:0 "先让继任者代理并验收交接，再放经理升任"
 zg361m.124.b:0 "立即提拔明星经理，由原团队自行填补断层"
 zg361m.124.c:0 "这季度先不碰，登记制度债"
 zg361m.125.t:0 "第125号 · 亲自救火与授权取舍"
 zg361m.125.desc:0 "【Q · 管理者自己的绩效文化／P1】\n\n决策：经理遇到危机可亲自下场抢救、授权下属成长或从外部借人；个人产出和团队能力使用同一时间预算。\n\n后果：长期亲自救火能刷“英雄经理”可见度，却让下属无机会、继任永远空白；授权失败短期受损，成功则形成组织杠杆。"
 zg361m.125.a:0 "划出支持时间让下属主导一次危机，并复盘授权结果"
 zg361m.125.b:0 "经理亲自接管危机，以最快恢复换取英雄声望"
 zg361m.125.c:0 "这季度先不碰，登记制度债"
 zg361m.126.t:0 "第126号 · 绩效 × 价值观处置矩阵"
 zg361m.126.desc:0 "【Q · 管理者自己的绩效文化／P1】\n\n决策：高业绩低价值观的“野狗”、低业绩高价值观的“兔子”、双高明星和双低末位采取不同留用、辅导或退出策略。\n\n后果：玩家必须决定是否容忍能打但破坏协作的人；养兔子过多拖累结果，纵容野狗则提高抢功、报复和团队流失。"
 zg361m.126.a:0 "按业绩与价值观四象限分别留用、辅导、转岗或退出"
 zg361m.126.b:0 "保住所有高产者并立即清退低产者，不另审协作破坏"
 zg361m.126.c:0 "这季度先不碰，登记制度债"
 zg361m.127.t:0 "第127号 · 管理幅度与评分失真"
 zg361m.127.desc:0 "【Q · 管理者自己的绩效文化／P2】\n\n决策：团队过大时，经理可增设合法中层/项目负责人、减少汇报频率或继续一人直管；HC 结构与考核质量互相约束。\n\n后果：直管过多节省层级却增加漏证、近因偏差和模板反馈；层级过多则产生截功、信息衰减和更多管理成本。"
 zg361m.127.a:0 "直管超限就增设合法负责人并补齐分层证据"
 zg361m.127.b:0 "维持扁平直管，由经理按期末结果一次性评分"
 zg361m.127.c:0 "这季度先不碰，登记制度债"
 zg361m.128.t:0 "第128号 · 强制分布气候指标"
 zg361m.128.desc:0 "【Q · 管理者自己的绩效文化／P2】\n\n决策：制度报告跟踪压力、协作、主动报险、互评可信度和遗憾流失；高层可维持高压、减弱配额或只修复某一副作用。\n\n后果：361 的“人才密度”与内耗同时可见，不再只看平均 KPI；气候不会直接替个人翻档，但决定长期组织产能和招募吸引力。"
 zg361m.128.a:0 "逐轮记录压力、协作、报险、互评与遗憾流失并调政策"
 zg361m.128.b:0 "维持刚性配额，只用平均 KPI 和人才密度判断成败"
 zg361m.128.c:0 "这季度先不碰，登记制度债"
 zg361m.129.t:0 "第129号 · 晋升排队与职业平台期"
 zg361m.129.desc:0 "【R · 项目制、目标制与系统纠偏／P1】\n\n决策：资格已满但无槽位者进入有期限的候选队列；上司可给轮岗、扩大职责、现金补偿或继续画饼。\n\n后果：队列透明减少每年重复提包，长期停滞则显著提高被挖和消极工作；插队必须使用破格名额并解释被跳过者。"
 zg361m.129.a:0 "建立有期限的透明候选队列，并给轮岗或现金补偿"
 zg361m.129.b:0 "让主管逐年口头许诺，并为急需人选随时插队"
 zg361m.129.c:0 "这季度先不碰，登记制度债"
 zg361m.130.t:0 "第130号 · 把低绩效“倾倒”给别组"
 zg361m.130.desc:0 "【R · 项目制、目标制与系统纠偏／P1】\n\n决策：经理可诚实携带 PIP 和错岗证据转出，也可隐瞒问题把人包装成高潜；接收方可查履历、试用或拒绝。\n\n后果：真实错岗转岗可能救活人才，绩效洗白则在下一次失败时追责原经理并降低整个内部市场的信任。"
 zg361m.130.a:0 "随转岗移交 PIP、错岗证据与限期试用条件"
 zg361m.130.b:0 "把低绩效者包装成高潜，尽快交给愿接收的团队"
 zg361m.130.c:0 "这季度先不碰，登记制度债"
 zg361m.131.t:0 "第131号 · 探索型 OKR 与承诺型 KPI 双赛道"
 zg361m.131.desc:0 "【R · 项目制、目标制与系统纠偏／P1】\n\n决策：目标制定时声明是必须兑现的承诺，还是高不确定探索；探索目标按验证了什么、何时止损评价，不能临到失败才改标签。\n\n后果：允许真正挑战性目标而不逼人人报保守数；把日常职责伪装成探索会被校准席剔除并扣目标质量。"
 zg361m.131.a:0 "期初冻结探索或承诺标签，并写清验证点与止损线"
 zg361m.131.b:0 "期末按结果改标签，把未兑现承诺转称探索学习"
 zg361m.131.c:0 "这季度先不碰，登记制度债"
 zg361m.132.t:0 "第132号 · 及时砍项目也算功"
 zg361m.132.desc:0 "【R · 项目制、目标制与系统纠偏／P1】\n\n决策：项目 owner 可在证据表明不可行时主动停止、缩小范围或继续赌；上司判断是高质量止损还是逃避承诺。\n\n后果：正确止损保护剩余国库与 HC，并计入判断力；逢难就砍会失去 sponsor，死扛则积累沉没成本和坏消息隐瞒责任。"
 zg361m.132.a:0 "凭不可行证据止损，冻结节省预算并由 sponsor 复核"
 zg361m.132.b:0 "继续投入直到交付或彻底失败，以免承认沉没成本"
 zg361m.132.c:0 "这季度先不碰，登记制度债"
 zg361m.133.t:0 "第133号 · 无责复盘与有责追究分轨"
 zg361m.133.desc:0 "【R · 项目制、目标制与系统纠偏／P1】\n\n决策：事故后先冻结事实和系统原因，再单独判断造假、隐瞒或重大失职；可公开学习材料而不自动给所有参与者扣分。\n\n后果：认错和早报不会必然自杀式降档，故意违规仍被追责；把复盘变批斗会降低未来主动报险率。"
 zg361m.133.a:0 "先冻结事实与系统原因，再另审造假、隐瞒和失职"
 zg361m.133.b:0 "事故后立即点名主责，以公开处分快速恢复秩序"
 zg361m.133.c:0 "这季度先不碰，登记制度债"
 zg361m.134.t:0 "第134号 · 共享指标的唯一 owner 与仲裁"
 zg361m.134.desc:0 "【R · 项目制、目标制与系统纠偏／P1】\n\n决策：跨团队目标事前指定唯一结果 owner、共同责任人和依赖；依赖方未交付时，可协商改基线或提交事实仲裁。\n\n后果：避免成功人人领功、失败无人负责；owner 有最终协调权也承担整合责任，协作者则凭真实交付进入贡献账本。"
 zg361m.134.a:0 "事前登记唯一 owner、协作者、依赖和事实仲裁入口"
 zg361m.134.b:0 "继续共担目标，结算时由上级指定领功者和责任人"
 zg361m.134.c:0 "这季度先不碰，登记制度债"
 zg361m.135.t:0 "第135号 · 影子初评与预期窗口"
 zg361m.135.desc:0 "【S · 预校准、尾差与影子档位／P1】\n\n决策：正式校准前，上司可向下属透露“当前若今天结算”的影子档位；下属选择补证、纠偏、改目标或接受预期。\n\n后果：诚实预告减少年末惊雷，但并不锁死结果；用虚假好预期维稳、最终突降档，会同时触发反馈债和申诉加权。"
 zg361m.135.a:0 "校准前告知暂定档与证据缺口，保留纠偏窗口"
 zg361m.135.b:0 "封存影子档直到终评，一次公布以避免中途争议"
 zg361m.135.c:0 "这季度先不碰，登记制度债"
 zg361m.136.t:0 "第136号 · 跨经理预校准小会"
 zg361m.136.desc:0 "【S · 预校准、尾差与影子档位／P1】\n\n决策：正式大会前，三四位经理先交换边界案例、统一证据标准，也可暗中提前分完名额。\n\n后果：只讨论异常能缩短大会，私下定局则让正式辩论沦为表演；会议纪要与最终结果差异可供审计。"
 zg361m.136.a:0 "只预审边界案例并留纪要，不提前分完整名额"
 zg361m.136.b:0 "小会先把各档名额分完，让正式大会快速确认"
 zg361m.136.c:0 "这季度先不碰，登记制度债"
 zg361m.137.t:0 "第137号 · 议程顺序与锚定效应"
 zg361m.137.desc:0 "【S · 预校准、尾差与影子档位／P2】\n\n决策：校准按随机、先头档、先末位或先战略团队排序；主持者也可冒险把亲信放在注意力最充足的前段。\n\n后果：先讨论者更容易形成比较锚，后段受疲劳和剩余配额挤压；随机化较公平，却牺牲主持人的政治控制。"
 zg361m.137.a:0 "随机或轮换议程，并在会前公开排序规则"
 zg361m.137.b:0 "先审战略团队与亲信，趁注意力充足锁定锚点"
 zg361m.137.c:0 "这季度先不碰，登记制度债"
 zg361m.138.t:0 "第138号 · 人数取整与尾差归属"
 zg361m.138.desc:0 "【S · 预校准、尾差与影子档位／P1】\n\n决策：比例算出小数名额时，采用最大余数、跨年轮换、上级合池或由本轮主持人裁定。\n\n后果：取整规则决定小团队是否必须出一个 3.25；规则必须周期初公开，不能看完名单才把尾差甩给弱势组。"
 zg361m.138.a:0 "期初冻结最大余数与跨年轮换规则并公开尾差"
 zg361m.138.b:0 "看完名单后由主持人把尾差直接判给一个团队"
 zg361m.138.c:0 "这季度先不碰，登记制度债"
 zg361m.139.t:0 "第139号 · 跨周期配额债"
 zg361m.139.desc:0 "【S · 预校准、尾差与影子档位／P2】\n\n决策：极端优秀或极端困难团队可借用下一轮一个头档/末位名额，或坚持每年当场清零。\n\n后果：借档能避免荒唐强排，却把压力递延给未来 cohort；欠债换老板、重组或解散时由批准借档的经理承担。"
 zg361m.139.a:0 "允许借一个档位名额，但登记到期日、经理与重组责任"
 zg361m.139.b:0 "每轮刚性清零配额，不把头档或末位压力留给未来"
 zg361m.139.c:0 "这季度先不碰，登记制度债"
 zg361m.140.t:0 "第140号 · 重组中的配额归属日"
 zg361m.140.desc:0 "【S · 预校准、尾差与影子档位／P1】\n\n决策：官员跨组时按周期内服务天数、目标 owner 或期末组织决定由谁占配额，且在召集令时冻结。\n\n后果：防止两边都不想收末位、两边都想认头档；归属只影响分布，旧新上司仍分别提交自己观察期的证据。"
 zg361m.140.a:0 "按服务天数或目标 owner 归属，并在召集令时冻结"
 zg361m.140.b:0 "一律由期末组织吸收全部头档与末位配额"
 zg361m.140.c:0 "这季度先不碰，登记制度债"
 zg361m.141.t:0 "第141号 · 高层“保送 / 必杀”名单"
 zg361m.141.desc:0 "【S · 预校准、尾差与影子档位／P2】\n\n决策：隔级上司可用有限干预额度声明一名必须讨论的保留或问责对象，直属经理可接受、公开反驳或要求书面理由。\n\n后果：高层不能直接改孙级分，但会制造强烈校准压力；若事实推翻红线，提出名单者自己的判断信誉受损。"
 zg361m.141.a:0 "只给高层一次书面必议额度，并审计理由与最终命中"
 zg361m.141.b:0 "允许高层直接保送或必杀孙级官员，迅速结束争论"
 zg361m.141.c:0 "这季度先不碰，登记制度债"
 zg361m.142.t:0 "第142号 · 里程碑待定档"
 zg361m.142.desc:0 "【S · 预校准、尾差与影子档位／P2】\n\n决策：证据截止日前后恰有重大交付时，可按截止日立刻定档，或保留一个短期“待定”直到结果可验证。\n\n后果：待定保护真实临门成果，却延迟奖金和配额封账；里程碑失败后不得再用过程努力兑换头档。"
 zg361m.142.a:0 "设短期待定窗与验证责任人，奖金和配额同步暂缓"
 zg361m.142.b:0 "按截止日立即定档，迟到的里程碑统一记入下轮"
 zg361m.142.c:0 "这季度先不碰，登记制度债"
 zg361m.143.t:0 "第143号 · 截止后重大事故对称处理"
 zg361m.143.desc:0 "【S · 预校准、尾差与影子档位／P1】\n\n决策：封榜后发生重大成功或事故，制度可仅记下一轮，或在奖惩尚未发放前以同一门槛重开。\n\n后果：正负事件必须对称，不能只为爆雷追责、对成功装作没看见；重开一次即重新封存，禁止反复改榜。"
 zg361m.143.a:0 "奖惩发放前按同一重大门槛对称重开一次并再封榜"
 zg361m.143.b:0 "封榜后绝不重开，重大成功与事故都转入下一轮"
 zg361m.143.c:0 "这季度先不碰，登记制度债"
 zg361m.144.t:0 "第144号 · 校准异议票与少数意见"
 zg361m.144.desc:0 "【S · 预校准、尾差与影子档位／P1】\n\n决策：每位参会经理可对最终边界案留一条实名异议，也可服从多数不留记录。\n\n后果：后续翻案时，正确异议提高判断信用并暴露谁曾预警；滥留异议逃避共同责任则降低协作评价。"
 zg361m.144.a:0 "允许实名异议附事实理由，并在翻案后回写判断信用"
 zg361m.144.b:0 "要求全体签署共同结论，不留少数意见以便立即封账"
 zg361m.144.c:0 "这季度先不碰，登记制度债"
 zg361m.145.t:0 "第145号 · 三档之内的影子排序"
 zg361m.145.desc:0 "【S · 预校准、尾差与影子档位／P2】\n\n决策：管理者可在 3.5 大档内部维护发展用先后序，或禁止产生“B+ / B-”潜规则。\n\n后果：影子排序帮助分配晋升和机会，却可能让表面 60% 实际再切末位；若影响奖金必须公开，否则只能作辅导参考。"
 zg361m.145.a:0 "公开仅用于发展的 3.5 内部顺序，并禁止影响奖金"
 zg361m.145.b:0 "让经理私下维护 B 加减序列并据此快速分机会"
 zg361m.145.c:0 "这季度先不碰，登记制度债"
 zg361m.146.t:0 "第146号 · 直白档位 / 委婉话术制度"
 zg361m.146.desc:0 "【T · 绩效反馈、谈判与承诺债／P1】\n\n决策：反馈时先说最终档位与证据，或先谈发展再逐步揭示结果；经理可选择温度，但不能隐去实质奖惩。\n\n后果：直白降低误解却更伤当场关系，委婉减轻冲突却容易让“符合预期”被误读；理解偏差进入反馈质量。"
 zg361m.146.a:0 "开场直报档位，再逐项说明证据、奖惩与行动项"
 zg361m.146.b:0 "先用发展话术缓和关系，谈话末尾才揭示档位"
 zg361m.146.c:0 "这季度先不碰，登记制度债"
 zg361m.147.t:0 "第147号 · 强制“一扬一抑”反馈模板"
 zg361m.147.desc:0 "【T · 绩效反馈、谈判与承诺债／P2】\n\n决策：制度可要求每份反馈至少一条认可和一条改进，也可允许全好或全坏但必须附证据。\n\n后果：模板能逼出建设性建议，也会产生虚假夸奖和鸡蛋里挑骨头；重复套话使经理反馈信用下降。"
 zg361m.147.a:0 "允许全好或全坏，但每条判断都必须附具体证据"
 zg361m.147.b:0 "强制每人一扬一抑，用统一模板快速交齐反馈"
 zg361m.147.c:0 "这季度先不碰，登记制度债"
 zg361m.148.t:0 "第148号 · 先讲证据还是先报结果"
 zg361m.148.desc:0 "【T · 绩效反馈、谈判与承诺债／P1】\n\n决策：上司可先展示案卷让下属自行判断，或先宣布档位再解释；下属可逐项确认事实而非只争最后数字。\n\n后果：证据优先提高程序认同但耗时，结果优先更快却强化“结论早已定好”的感受；两路都不能在谈话中改原始数据。"
 zg361m.148.a:0 "先逐项核对冻结案卷，再宣读已经锁定的最终档"
 zg361m.148.b:0 "先宣布档位，再用有限时间解释最关键几项事实"
 zg361m.148.c:0 "这季度先不碰，登记制度债"
 zg361m.149.t:0 "第149号 · 绩效结果谈判包"
 zg361m.149.desc:0 "【T · 绩效反馈、谈判与承诺债／P2】\n\n决策：边界员工可接受较低档，换取明确奖金补差、下轮目标保护、转岗面试或晋升保留；也可拒绝交易走正式申诉。\n\n后果：谈判能减少零和翻案，却把上司承诺变成真实债务；私下只画饼不落盘，兑现失败时比直接拒绝更伤信誉。"
 zg361m.149.a:0 "把降档交换的补差、目标保护与转岗机会书面入账"
 zg361m.149.b:0 "要求边界员工先接受低档，再口头承诺以后补偿"
 zg361m.149.c:0 "这季度先不碰，登记制度债"
 zg361m.150.t:0 "第150号 · “这次先委屈你”的补偿承诺"
 zg361m.150.desc:0 "【T · 绩效反馈、谈判与承诺债／P1】\n\n决策：经理让某人因配额背低档时，可承诺下轮优先机会、专项奖或 PIP 减免；当事人选择信任、要求书面或拒绝。\n\n后果：承诺不能预定下轮 3.75，只能兑现资源和机会；跨周期失约会形成强烈背叛、申诉旁证和人才流失。"
 zg361m.150.a:0 "把专项奖或优先机会写明 owner、期限与非预定档声明"
 zg361m.150.b:0 "让员工先替团队背档，以经理个人信用口头担保下轮"
 zg361m.150.c:0 "这季度先不碰，登记制度债"
 zg361m.151.t:0 "第151号 · 签收不等于认同"
 zg361m.151.desc:0 "【T · 绩效反馈、谈判与承诺债／P1】\n\n决策：受评人可“确认收到并同意”“确认收到但保留异议”或拒绝确认事实错误；三者分别记录。\n\n后果：避免把签收当作放弃申诉，也避免拒签让流程永久悬停；虚假声称未收到可由送达见证反驳。"
 zg361m.151.a:0 "分别记录同意、保留异议与事实拒签，并保留送达见证"
 zg361m.151.b:0 "把任何签收都视为接受结论，并立即关闭申诉窗口"
 zg361m.151.c:0 "这季度先不碰，登记制度债"
 zg361m.152.t:0 "第152号 · 反馈可行动性评分"
 zg361m.152.desc:0 "【T · 绩效反馈、谈判与承诺债／P1】\n\n决策：下属在下一轮评价上司反馈是否具体、可控、有期限和资源；“提高格局”之类空话不能算可执行目标。\n\n后果：长期给模糊建议却持续扣分的经理会被上司问责；下属不能因不喜欢建议就抹掉其中的明确事实。"
 zg361m.152.a:0 "按具体、可控、期限和资源四项让下属次轮回评"
 zg361m.152.b:0 "由经理按下属是否迅速照做来判断反馈是否有效"
 zg361m.152.c:0 "这季度先不碰，登记制度债"
 zg361m.153.t:0 "第153号 · 反馈后行动项闭环"
 zg361m.153.desc:0 "【T · 绩效反馈、谈判与承诺债／P1】\n\n决策：谈话产生的辅导、资源、改进或调岗事项各有 owner 与期限；双方可完成、改期或说明取消。\n\n后果：完成事项进入下轮证据，长期无人跟进则成为经理或下属的履责扣分；不能把一次反馈无限复制成多轮功劳。"
 zg361m.153.a:0 "每项辅导、资源或调岗设 owner、期限与关闭凭证"
 zg361m.153.b:0 "只留口头待办，年末由经理判断是否算已改善"
 zg361m.153.c:0 "这季度先不碰，登记制度债"
 zg361m.154.t:0 "第154号 · 录音式完整纪要 / 摘要纪要"
 zg361m.154.desc:0 "【T · 绩效反馈、谈判与承诺债／P2】\n\n决策：制度可保存逐项完整纪要、双方确认的短摘要，或仅存结果；信息越全，隐私和行政成本越高。\n\n后果：完整留痕利于复杂申诉，摘要更易执行；无纪要时口才和关系权重上升，但不能伪造不存在的硬证据。"
 zg361m.154.a:0 "复杂案件保存逐项完整纪要，并由双方校正后签认"
 zg361m.154.b:0 "只记录档位和主管结论，以最少留痕快速结案"
 zg361m.154.c:0 "这季度先不碰，登记制度债"
 zg361m.155.t:0 "第155号 · 公开表扬与私下批评边界"
 zg361m.155.desc:0 "【T · 绩效反馈、谈判与承诺债／P2】\n\n决策：上司可公开头档理由、只公开团队成果，或连末位问题也公开；本人可请求对敏感反馈保密。\n\n后果：公开认可提高榜样效应，公开羞辱则增加恐惧和报复；隐藏所有理由会让抢功和黑箱猜疑抬头。"
 zg361m.155.a:0 "公开头档事实与团队成果，敏感改进只在私下送达"
 zg361m.155.b:0 "公开全部档位和末位问题，用群体压力推动整改"
 zg361m.155.c:0 "这季度先不碰，登记制度债"
 zg361m.156.t:0 "第156号 · 团队结果说明会"
 zg361m.156.desc:0 "【T · 绩效反馈、谈判与承诺债／P1】\n\n决策：出榜后经理向全组说明分布原则、共性问题和下一年资源，但不泄露个人申诉材料；也可只做一对一反馈。\n\n后果：说明会提升制度可预测性，却可能引发集体质疑；拒绝解释节省时间，但团队会用流言填补信息真空。"
 zg361m.156.a:0 "向全组说明分布原则、共性问题和资源，不泄露个案"
 zg361m.156.b:0 "取消集体说明，只做一对一通知以尽快结束考核季"
 zg361m.156.c:0 "这季度先不碰，登记制度债"
 zg361m.157.t:0 "第157号 · 自荐权与主管提名权"
 zg361m.157.desc:0 "【U · 晋升提名与部门预审／P1】\n\n决策：制度可只允许主管提名、允许合资格者自荐，或自荐后必须取得一名 sponsor；主管需明确支持或反对理由。\n\n后果：自荐打破雪藏却增加陪跑材料，主管独占入口更省事但放大人才控制；自荐成功不会绕过后续评审。"
 zg361m.157.a:0 "允许合资格者自荐，但须有 sponsor 和主管书面意见"
 zg361m.157.b:0 "把晋升入口完全交给直属主管，只审其正式提名"
 zg361m.157.c:0 "这季度先不碰，登记制度债"
 zg361m.158.t:0 "第158号 · 主管提名额度"
 zg361m.158.desc:0 "【U · 晋升提名与部门预审／P1】\n\n决策：每位经理只能提交少量晋升包，可集中押一名稳妥候选、分散押多名边界人，或主动归还额度。\n\n后果：提名成为真实稀缺资源；无差别全报会稀释辅导并降低经理判断信用，归还额度则可能被其他团队拿走。"
 zg361m.158.a:0 "给少量提名额并要求排序、理由与未使用额度归还"
 zg361m.158.b:0 "把全部名额押给一名主推者，并用弱包占满余位"
 zg361m.158.c:0 "这季度先不碰，登记制度债"
 zg361m.159.t:0 "第159号 · 雪藏明星不提名"
 zg361m.159.desc:0 "【U · 晋升提名与部门预审／P1】\n\n决策：经理可因无人接替而压住合资格明星、先培养接班人后提名，或立即放其竞争更高职责。\n\n后果：雪藏保住当期产出，却累积晋升停滞和内部流动风险；长期无正当理由不提名会扣经理人才输出分。"
 zg361m.159.a:0 "为明星设接班计划和最迟提名日，经理获得交接资源"
 zg361m.159.b:0 "因无人替补继续雪藏明星，优先保住本期团队产出"
 zg361m.159.c:0 "这季度先不碰，登记制度债"
 zg361m.160.t:0 "第160号 · 部门预审淘汰赛"
 zg361m.160.desc:0 "【U · 晋升提名与部门预审／P1】\n\n决策：正式答辩前，同部门候选先按材料完整度、职级证据和战略匹配争少量出线席；经理可亲自辩护或让候选独立应战。\n\n后果：预审避免正式评委淹没在弱包中，也可能成为派系提前封杀；落选者保留资格但消耗本轮窗口。"
 zg361m.160.a:0 "按冻结量表预审并记录淘汰理由，让候选独立答辩"
 zg361m.160.b:0 "由经理闭门排出战略名单，只把最稳的人送上会"
 zg361m.160.c:0 "这季度先不碰，登记制度债"
 zg361m.161.t:0 "第161号 · “陪跑包”与虚假竞争"
 zg361m.161.desc:0 "【U · 晋升提名与部门预审／P2】\n\n决策：经理可提交明显较弱候选凑数、衬托主推者，或只提交真正愿意支持的人；陪跑者可知情接受或公开退出。\n\n后果：陪跑成功能集中票源，却浪费候选声誉和准备工时；被识别后反噬经理公平信用与主推者合法性。"
 zg361m.161.a:0 "只提交真正支持的候选，并向弱包本人披露胜算与成本"
 zg361m.161.b:0 "用陪跑包凑足竞争人数，把票源集中给主推者"
 zg361m.161.c:0 "这季度先不碰，登记制度债"
 zg361m.162.t:0 "第162号 · 资历门槛例外申请"
 zg361m.162.desc:0 "【U · 晋升提名与部门预审／P2】\n\n决策：未满任职年限但证据强者，可占用破格审查额度；评委先判断是否准入，再评能力，不把两步混成一次人情投票。\n\n后果：准入不等于通过；频繁为普通表现申请例外，会压低主管未来所有破格包的可信度。"
 zg361m.162.a:0 "占用有限破格额，先独立审准入再审目标级能力"
 zg361m.162.b:0 "在同一轮投票中为强 sponsor 的人直接豁免资历"
 zg361m.162.c:0 "这季度先不碰，登记制度债"
 zg361m.163.t:0 "第163号 · 晋升绩效观察窗"
 zg361m.163.desc:0 "【U · 晋升提名与部门预审／P1】\n\n决策：采用最近一轮、最近两轮或完整当前级别履历；遇重组、病假或长期项目时可附语境但不得挑最漂亮年份。\n\n后果：短窗响应快却受偶然性影响，长窗奖励稳定却拖累真正转变者；规则周期初冻结。"
 zg361m.163.a:0 "期初冻结两轮或本级完整履历，并统一标注重组语境"
 zg361m.163.b:0 "只取最近最强一轮，快速奖励已经显露的上升势头"
 zg361m.163.c:0 "这季度先不碰，登记制度债"
 zg361m.164.t:0 "第164号 · 跨团队成果进入晋升包"
 zg361m.164.desc:0 "【U · 晋升提名与部门预审／P1】\n\n决策：转岗者可携带旧团队已验收成果，由旧 owner 共同签名；新主管选择主推、只作辅助证据或质疑贡献边界。\n\n后果：防止换组清零，也防止拿团队总成绩冒充个人影响；旧主管恶意拒签可走贡献账本复核。"
 zg361m.164.a:0 "由旧 owner 共签已验收成果，并按贡献账本拆分影响"
 zg361m.164.b:0 "由新主管选取最有利旧成果，直接写入当前候选包"
 zg361m.164.c:0 "这季度先不碰，登记制度债"
 zg361m.165.t:0 "第165号 · “先干到下一级”试岗证据"
 zg361m.165.desc:0 "【U · 晋升提名与部门预审／P1】\n\n决策：候选先承担一项更大范围职责，获得代理授权、明确期限和失败退出条件；也可拒绝无权无薪的无限试岗。\n\n后果：真实试岗提高评审确定性，长期只加活不评审则形成职级债和离职风险；失败只否定该职责适配，不自动改当期绩效。"
 zg361m.165.a:0 "授予明确权限、期限、薪酬与退出条件后再做升级试岗"
 zg361m.165.b:0 "先无限加上下一级工作，等候选证明自己再谈权薪"
 zg361m.165.c:0 "这季度先不碰，登记制度债"
 zg361m.166.t:0 "第166号 · 候选主动撤包"
 zg361m.166.desc:0 "【U · 晋升提名与部门预审／P2】\n\n决策：材料不足、评委不匹配或关键成果未验证时，候选可在预审前撤回，保存部分材料到下轮；主管也可劝其硬上。\n\n后果：撤包避免一次明显失败却失去本轮窗口；反复撤回会被视为准备度不足，不能永久占提名额度。"
 zg361m.166.a:0 "预审前允许撤包，封存已验证材料并立即释放名额"
 zg361m.166.b:0 "劝候选本轮硬上，以免浪费已经取得的提名窗口"
 zg361m.166.c:0 "这季度先不碰，登记制度债"
 zg361m.167.t:0 "第167号 · Sponsor 的晋升信用债"
 zg361m.167.desc:0 "【U · 晋升提名与部门预审／P1】\n\n决策：Sponsor 为候选作事实背书、强力担保或只提供上桌机会；支持强度与未来责任成比例。\n\n后果：被担保者晋升后持续胜任会提高 sponsor 话语权，迅速失配则使其下次背书折价；不直接追回候选已得的合法待遇。"
 zg361m.167.a:0 "记录 sponsor 背书强度，并用晋升后胜任结果回写信用"
 zg361m.167.b:0 "让 sponsor 用声望作强力担保，帮助候选快速越过边界票"
 zg361m.167.c:0 "这季度先不碰，登记制度债"
 zg361m.168.t:0 "第168号 · 经理提名命中率"
 zg361m.168.desc:0 "【U · 晋升提名与部门预审／P1】\n\n决策：系统跟踪提名通过、晋升后胜任和无故漏提三类结果；上司可辅导低命中经理或收紧其提名额度。\n\n后果：逼经理承担“推谁上桌”的判断责任，又避免只为保命而不提人；命中率需结合候选难度，不能奖励只报稳赢包。"
 zg361m.168.a:0 "按候选难度跟踪通过、胜任和漏提，再调整经理额度"
 zg361m.168.b:0 "按原始失败次数立刻削减低命中经理的提名额"
 zg361m.168.c:0 "这季度先不碰，登记制度债"
 zg361m.169.t:0 "第169号 · 评委专业匹配"
 zg361m.169.desc:0 "【V · 晋升答辩与评委政治／P1】\n\n决策：按候选职能匹配熟悉领域的评委、刻意加入外行检验表达，或使用混合席位。\n\n后果：专业席能判断深度却可能有圈内关系，外行席检验业务价值但易低估技术贡献；二者权重事前公开。"
 zg361m.169.a:0 "混合领域专家与外部评委，并事前公开两席权重"
 zg361m.169.b:0 "只用熟悉业务的圈内评委，迅速判断专业深度"
 zg361m.169.c:0 "这季度先不碰，登记制度债"
 zg361m.170.t:0 "第170号 · 随机评委与熟人评委"
 zg361m.170.desc:0 "【V · 晋升答辩与评委政治／P2】\n\n决策：评委完全随机、由候选团队推荐部分人，或从固定跨部门池抽取；候选可经营熟人但不能指定多数席。\n\n后果：熟悉背景减少解释成本也放大人脉优势，随机更中立却增加误判；长期同一评委组合触发轮换。"
 zg361m.170.a:0 "从跨部门池轮换随机抽席，只允许一次有因回避"
 zg361m.170.b:0 "让候选团队推荐熟人占多数，减少背景解释时间"
 zg361m.170.c:0 "这季度先不碰，登记制度债"
 zg361m.171.t:0 "第171号 · 答辩评委利益回避"
 zg361m.171.desc:0 "【V · 晋升答辩与评委政治／P1】\n\n决策：项目合作者、竞争 HC 的经理、亲族和仇敌必须披露；候选与评委各有一次有因回避，由备选席补位。\n\n后果：回避提升公信力但可能换来更陌生的评委；隐瞒冲突被发现会重审整包，而非直接保送对方。"
 zg361m.171.a:0 "强制披露合作、HC 竞争与关系冲突，并由备选席补位"
 zg361m.171.b:0 "为免延期保留原评委，只要求其口头承诺公正"
 zg361m.171.c:0 "这季度先不碰，登记制度债"
 zg361m.172.t:0 "第172号 · 一票否决 / 多数票 / 平均分"
 zg361m.172.desc:0 "【V · 晋升答辩与评委政治／P2】\n\n决策：高阶晋升可采用红线一票否决、简单多数或去极值平均；制度选择决定候选应争取广泛认可还是避免关键反对。\n\n后果：一票否决守住底线却易被政治阻击，平均分抗极端却掩盖致命短板；否决必须附可复核理由。"
 zg361m.172.a:0 "普通项用去极值平均，红线否决须附理由并复核"
 zg361m.172.b:0 "授权任一评委一票否决，以最快速度守住晋升门槛"
 zg361m.172.c:0 "这季度先不碰，登记制度债"
 zg361m.173.t:0 "第173号 · 盲材料审查与现场答辩"
 zg361m.173.desc:0 "【V · 晋升答辩与评委政治／P2】\n\n决策：先隐藏姓名审材料，再实名提问；也可完全现场或只看书面工件。\n\n后果：盲审减少关系锚定，现场能检验判断与表达，书面更照顾沉默实干者；三者结果差异进入评委质量复盘。"
 zg361m.173.a:0 "先匿名审工件，再实名答辩并对比两阶段差异"
 zg361m.173.b:0 "直接现场答辩，由评委依据表现快速决定"
 zg361m.173.c:0 "这季度先不碰，登记制度债"
 zg361m.174.t:0 "第174号 · 答辩时间预算"
 zg361m.174.desc:0 "【V · 晋升答辩与评委政治／P1】\n\n决策：候选在有限时长内分配背景、个人动作、结果、复盘和未来范围；可少讲项目数量、深讲代表案例。\n\n后果：罗列越多越显忙碌却更难证明个人杠杆；超时会压缩提问环节，不能靠无限 PPT 淹没评委。"
 zg361m.174.a:0 "固定时长深讲一个代表案例，并保留独立质询时间"
 zg361m.174.b:0 "允许堆满项目清单和长材料，以规模压缩评委质询"
 zg361m.174.c:0 "这季度先不碰，登记制度债"
 zg361m.175.t:0 "第175号 · 模拟答辩与辅导资源"
 zg361m.175.desc:0 "【V · 晋升答辩与评委政治／P1】\n\n决策：经理把有限辅导时数给最有希望者、平均分配，或建立跨团队公共教练池；候选也可请 sponsor 私教。\n\n后果：辅导提升表达但不制造成果；只辅导亲信会形成机会不均证据，公共池更公平却泄露竞争策略。"
 zg361m.175.a:0 "建立跨团队公共教练池，并公开有限辅导时数分配"
 zg361m.175.b:0 "让经理把全部模拟答辩资源押给最看好的候选"
 zg361m.175.c:0 "这季度先不碰，登记制度债"
 zg361m.176.t:0 "第176号 · 团队成绩的个人归因质询"
 zg361m.176.desc:0 "【V · 晋升答辩与评委政治／P1】\n\n决策：评委追问候选独有判断、资源杠杆、他人贡献和离开后的持续性；候选可诚实拆分或把团队成果全据为己有。\n\n后果：诚实让功可能减少表面规模，却提高领导力可信度；查出全盘抢功会同时伤晋升包和同侪信用。"
 zg361m.176.a:0 "冻结个人判断、动作、他人贡献与离岗后持续性证据"
 zg361m.176.b:0 "把团队结果主要记给台前 owner，迅速形成明确主功"
 zg361m.176.c:0 "这季度先不碰，登记制度债"
 zg361m.177.t:0 "第177号 · 项目规模与个人杠杆分离"
 zg361m.177.desc:0 "【V · 晋升答辩与评委政治／P1】\n\n决策：评委区分“大项目上的小角色”和“小项目里改变打法的人”，候选选择展示资源规模或自己改变了什么。\n\n后果：搭上战略快车不再自动晋升，逆风小项目也可证明能力；仍需达到目标职级要求的影响范围。"
 zg361m.177.a:0 "分别评分项目影响范围与候选改变打法的个人杠杆"
 zg361m.177.b:0 "直接用项目预算、人数与战略等级代理个人影响"
 zg361m.177.c:0 "这季度先不碰，登记制度债"
 zg361m.178.t:0 "第178号 · 可复核工件与故事表达双证据"
 zg361m.178.desc:0 "【V · 晋升答辩与评委政治／P1】\n\n决策：晋升包同时提交案卷、成果物和口头叙事；制度可偏工件、偏答辩或保持双门槛。\n\n后果：工件压低吹牛空间，叙事允许解释复杂背景；只强一项的候选可延期补齐，而不是随机过关。"
 zg361m.178.a:0 "要求可复核工件与口头叙事双门槛，缺一则延期"
 zg361m.178.b:0 "以现场故事和评委追问为主，快速判断复杂影响"
 zg361m.178.c:0 "这季度先不碰，登记制度债"
 zg361m.179.t:0 "第179号 · 失败答辩的具体反馈 owner"
 zg361m.179.desc:0 "【V · 晋升答辩与评委政治／P1】\n\n决策：每条“不通过”理由由一名评委负责写成可验证差距，主管与候选确认下一轮证据；也可记录“当前无槽位”而不伪装能力不足。\n\n后果：空洞拒绝会扣评委质量，明确差距可形成发展任务；完成任务不承诺必过，但评委下次不能无故换口径。"
 zg361m.179.a:0 "每条不通过理由指定评委、差距证据与下轮验收项"
 zg361m.179.b:0 "统一写准备不足，下一轮再由新评委重看整包"
 zg361m.179.c:0 "这季度先不碰，登记制度债"
 zg361m.180.t:0 "第180号 · 晋升冷却与材料刷新"
 zg361m.180.desc:0 "【V · 晋升答辩与评委政治／P1】\n\n决策：失败后立即重试、冷却一轮，或完成指定差距即可提前重开；旧材料可复用但必须补充新影响。\n\n后果：冷却避免反复消耗评委，过长则放大平台期；换评委不等于清空上次已确认的问题和改进证据。"
 zg361m.180.a:0 "完成指定差距即可重开，保留旧结论并只补新影响"
 zg361m.180.b:0 "所有失败者统一冷却一整轮，不审个别改进速度"
 zg361m.180.c:0 "这季度先不碰，登记制度债"
 zg361m.181.t:0 "第181号 · 能力、意愿、错岗三分诊"
 zg361m.181.desc:0 "【W · PIP 启动、毕业与复发／P1】\n\n决策：低绩效先判断是不会做、不愿做、目标失真还是岗位错配，再分别选择训练、纪律、改目标或转岗。\n\n后果：分诊错误会让 PIP 变成注定失败的处刑；正确错岗救济可保人才，但不能抹掉当期真实损失。"
 zg361m.181.a:0 "先分清能力、意愿、目标失真与错岗，再匹配处置"
 zg361m.181.b:0 "见一次低档就按意愿不足启动纪律型 PIP"
 zg361m.181.c:0 "这季度先不碰，登记制度债"
 zg361m.182.t:0 "第182号 · PIP 启动证据门槛"
 zg361m.182.desc:0 "【W · PIP 启动、毕业与复发／P1】\n\n决策：制度可规定一次严重失职、一次 3.25 加多条已反馈问题，或连续低档才启动正式 PIP；红线违规另走纪律链。\n\n后果：门槛低能快速施压却产生大量假 PIP，门槛高保护稳定性却拖延处理；强制分布名次本身不能替代证据。"
 zg361m.182.a:0 "以严重失职或低档加已反馈问题为正式启动门槛"
 zg361m.182.b:0 "任何一次 3.25 都自动转入正式 PIP"
 zg361m.182.c:0 "这季度先不碰，登记制度债"
 zg361m.183.t:0 "第183号 · PIP 目标双签与拒签理由"
 zg361m.183.desc:0 "【W · PIP 启动、毕业与复发／P1】\n\n决策：上司提出可控里程碑，当事人可签署、提出一次修改或说明目标超出权限；上司可接受调整或请求独立确认。\n\n后果：拒签不自动等于失败，恶意拖延也不能无限阻止启动；谁拒绝了何种合理条款会进入终局案卷。"
 zg361m.183.a:0 "设可控里程碑、一次修改权与独立确认并冻结拒签理由"
 zg361m.183.b:0 "由经理单方下达目标，把拒签立即视为不服从"
 zg361m.183.c:0 "这季度先不碰，登记制度债"
 zg361m.184.t:0 "第184号 · 经理的 PIP 承载量"
 zg361m.184.desc:0 "【W · PIP 启动、毕业与复发／P1】\n\n决策：每名经理只能同时认真辅导有限人数，可投入时间、指派导师、错峰启动或申请上级支持。\n\n后果：把半个团队都塞进 PIP 会稀释支持并扣管理质量；超量时失败责任不能全甩给被改进者。"
 zg361m.184.a:0 "限制同时辅导人数，超额须配导师、错峰或上级资源"
 zg361m.184.b:0 "把全部低档者同批纳入 PIP，用统一期限压缩管理成本"
 zg361m.184.c:0 "这季度先不碰，登记制度债"
 zg361m.185.t:0 "第185号 · PIP 中期检查"
 zg361m.185.desc:0 "【W · PIP 启动、毕业与复发／P1】\n\n决策：中途确认按计划、明显落后、目标已失效或上司未给资源；可继续、纠偏一次或提前结束。\n\n后果：及早纠偏降低无谓失败，频繁重写则破坏可验证性；中检证据同时约束双方的年末叙事。"
 zg361m.185.a:0 "中期核对进展、资源和目标有效性，只允许一次纠偏"
 zg361m.185.b:0 "取消中检，按期末最终结果一次判定毕业或失败"
 zg361m.185.c:0 "这季度先不碰，登记制度债"
 zg361m.186.t:0 "第186号 · PIP 目标膨胀锁"
 zg361m.186.desc:0 "【W · PIP 启动、毕业与复发／P1】\n\n决策：上司新增要求时必须替换同等工作量、延长期限或证明真正紧急；当事人可把“不断加码”提交复核。\n\n后果：堵住为逼退而移动终点；拒绝合理业务变化也会留下不适应证据，不能把目标锁变永久免疫。"
 zg361m.186.a:0 "新增要求必须等量替换、延期或通过紧急复核"
 zg361m.186.b:0 "允许经理随业务变化继续加码，保持改进压力"
 zg361m.186.c:0 "这季度先不碰，登记制度债"
 zg361m.187.t:0 "第187号 · PIP 毕业标准"
 zg361m.187.desc:0 "【W · PIP 启动、毕业与复发／P1】\n\n决策：按全部里程碑、关键里程碑加稳定期，或独立复核决定毕业；上司不能仅以“感觉还不放心”无限续期。\n\n后果：毕业关闭当期处分升级但不自动给 3.75；不透明的临门否决会提高翻案与经理问责。"
 zg361m.187.a:0 "以关键里程碑加稳定期结业，边界案交独立复核"
 zg361m.187.b:0 "由直属经理凭最终信心决定毕业或继续观察"
 zg361m.187.c:0 "这季度先不碰，登记制度债"
 zg361m.188.t:0 "第188号 · 毕业后的复发观察期"
 zg361m.188.desc:0 "【W · PIP 启动、毕业与复发／P1】\n\n决策：PIP 成功者进入一轮轻量观察，复发时区分同类问题、新问题或外部冲击；也可完全恢复普通管理。\n\n后果：同类快速复发可升级处置，新问题不得偷换成“从未改好”；观察期不能无限续命为永久污点。"
 zg361m.188.a:0 "只观察一轮并区分同类、新问题与外部冲击后到期"
 zg361m.188.b:0 "保留长期高风险标记，任何失误都快速升级处置"
 zg361m.188.c:0 "这季度先不碰，登记制度债"
 zg361m.189.t:0 "第189号 · 二次 PIP / 调岗 / 退出三岔口"
 zg361m.189.desc:0 "【W · PIP 启动、毕业与复发／P1】\n\n决策：复发或首次失败后，上司根据支持是否充分、错岗证据和替代岗位选择再给一次、内部救济或结束任用。\n\n后果：二次机会成本更高但可能保住稀缺人才；直接退出更快，却要承担招聘、交接和空岗的真实代价。"
 zg361m.189.a:0 "核对支持、错岗与替代职位，再在二次机会、转岗和退出间选择"
 zg361m.189.b:0 "首次失败或复发即结束任用，迅速释放岗位"
 zg361m.189.c:0 "这季度先不碰，登记制度债"
 zg361m.190.t:0 "第190号 · PIP 随转岗披露的最小范围"
 zg361m.190.desc:0 "【W · PIP 启动、毕业与复发／P1】\n\n决策：向接收经理披露原目标、支持、完成度和争议，而非只贴“低绩效”标签；当事人可附自己的陈述。\n\n后果：防止绩效洗白，也防止永久污名；无关匿名反馈和旧仇怨不得随包无限传播。"
 zg361m.190.a:0 "只移交目标、支持、完成度、争议与本人陈述"
 zg361m.190.b:0 "只贴低绩效标签通知接收经理，省去完整案卷审查"
 zg361m.190.c:0 "这季度先不碰，登记制度债"
 zg361m.191.t:0 "第191号 · PIP 退出后的团队成本单"
 zg361m.191.desc:0 "【W · PIP 启动、毕业与复发／P1】\n\n决策：人离开后冻结补缺周期、交接缺口、同事加班和招聘成本，分配给原岗位、经理或组织裁撤预算。\n\n后果：经理不能靠批量 PIP 只拿“人才密度”收益而不付替换成本；真实健康退出仍可获得长期效率改善。"
 zg361m.191.a:0 "冻结补缺、交接、加班与招聘成本，并分配责任预算"
 zg361m.191.b:0 "人员退出即记全额薪酬节省，不追踪团队后续负担"
 zg361m.191.c:0 "这季度先不碰，登记制度债"
 zg361m.192.t:0 "第192号 · 急务值守轮盘"
 zg361m.192.desc:0 "【X · 值守、故障与救火绩效／P1】\n\n决策：团队按平均轮值、能力分层、志愿换班或固定英雄值守；战争、灾害和财政爆雷进入同一急务队列。\n\n后果：平均轮值培养广度但短期响应较慢，固定英雄更稳却积累倦怠与单点依赖；漏值守有明确责任人。"
 zg361m.192.a:0 "按能力分层轮值并允许留痕换班，同时培训后备"
 zg361m.192.b:0 "把急务长期交给固定英雄，换取最快稳定响应"
 zg361m.192.c:0 "这季度先不碰，登记制度债"
 zg361m.193.t:0 "第193号 · 值守津贴 / 调休二选一"
 zg361m.193.desc:0 "【X · 值守、故障与救火绩效／P1】\n\n决策：额外值守由国库支付个人金币、兑换下一阶段减负，或混合补偿并设上限。\n\n后果：不给补偿会提高流失和消极响应；无限现金鼓励争抢事故，补偿上限同时限制过度值守。"
 zg361m.193.a:0 "按值守时数混合发金币与调休，并设个人年度上限"
 zg361m.193.b:0 "把值守列为岗位义务，不另付钱也不减下期任务"
 zg361m.193.c:0 "这季度先不碰，登记制度债"
 zg361m.194.t:0 "第194号 · 值守对项目目标的等量减免"
 zg361m.194.desc:0 "【X · 值守、故障与救火绩效／P1】\n\n决策：发生真实急务后，值守者可下调同周期普通交付、延长期限或要求临时替补；也可自愿两头全扛争头档。\n\n后果：减免让隐形劳动进入事实账，全扛成功有额外证据、失败则不能把过载全怪个人能力。"
 zg361m.194.a:0 "按已核实急务工时等量减交付、延期限或补替班"
 zg361m.194.b:0 "保持原目标不变，鼓励值守者两头全扛争头档"
 zg361m.194.c:0 "这季度先不碰，登记制度债"
 zg361m.195.t:0 "第195号 · 假警报与告警质量"
 zg361m.195.desc:0 "【X · 值守、故障与救火绩效／P1】\n\n决策：值守者可每次照单响应、调整过敏阈值或要求告警 owner 治理噪声；关闭告警需承担漏报风险。\n\n后果：大量假警报消耗团队时间并扣系统 owner 管理分；误关真正危机则把短期清静变成更大事故。"
 zg361m.195.a:0 "由告警 owner 量化噪声、试调阈值并演练漏报风险"
 zg361m.195.b:0 "立即关闭最吵的告警通道，先恢复值守专注"
 zg361m.195.c:0 "这季度先不碰，登记制度债"
 zg361m.196.t:0 "第196号 · 事故等级申报博弈"
 zg361m.196.desc:0 "【X · 值守、故障与救火绩效／P1】\n\n决策：owner 可按真实影响报级、压低等级保绩效，或抬高等级争取资源；复核席按损失、范围和恢复时间校正。\n\n后果：压级隐瞒会在后续扩大时加罚诚信，虚抬则浪费高层注意力；校正后的等级才进入绩效。"
 zg361m.196.a:0 "按损失、范围和恢复时间报级，并接受独立校正"
 zg361m.196.b:0 "先压低事故等级保住本期绩效，扩大后再升级"
 zg361m.196.c:0 "这季度先不碰，登记制度债"
 zg361m.197.t:0 "第197号 · 事故指挥官与技术救火者分功"
 zg361m.197.desc:0 "【X · 值守、故障与救火绩效／P1】\n\n决策：冻结谁发现、谁决策、谁执行、谁协调外部资源；上司可奖励个人英雄或完整协作链。\n\n后果：指挥与解决问题都是贡献，不能让最后动手者独占全部功劳；错误指令也由有权决策者承担。"
 zg361m.197.a:0 "按发现、决策、执行和协调时间线拆分功责"
 zg361m.197.b:0 "把主要救火功记给最后完成修复的台前英雄"
 zg361m.197.c:0 "这季度先不碰，登记制度债"
 zg361m.198.t:0 "第198号 · “纵火者拿救火奖”识别"
 zg361m.198.desc:0 "【X · 值守、故障与救火绩效／P1】\n\n决策：救火功劳必须与事故根因关联；若同一人制造风险又成功修复，上司可认可响应、抵消过失或只追根因。\n\n后果：堵住先造险再当英雄的刷分法；无过失的正常变更失败也不能被一概污名为纵火。"
 zg361m.198.a:0 "把救火功与根因过失净额结算，区分正常失败与造险"
 zg361m.198.b:0 "只按恢复速度发英雄奖，根因责任另案以后再议"
 zg361m.198.c:0 "这季度先不碰，登记制度债"
 zg361m.199.t:0 "第199号 · 未发生事故的预防功"
 zg361m.199.desc:0 "【X · 值守、故障与救火绩效／P2】\n\n决策：对演练发现的隐患、被采纳的防护和后续无事故期授予延迟证据，或只奖励真实交付。\n\n后果：预防难以证明但可减少救火偏见；收益延迟且有上限，不能靠声称“我阻止了未知灾难”无限邀功。"
 zg361m.199.a:0 "对被采纳防护设观察期，以后续无事故发有限延迟功"
 zg361m.199.b:0 "只奖励真实事故中的可见救火，不给未发生风险计功"
 zg361m.199.c:0 "这季度先不碰，登记制度债"
 zg361m.200.t:0 "第200号 · 紧急处置临时授权"
 zg361m.200.desc:0 "【X · 值守、故障与救火绩效／P1】\n\n决策：事故指挥官可短期越过正常审批调资源、回滚政策或封停项目；事后必须复核必要性。\n\n后果：授权提高恢复速度，也可能被借事故夺权；越权但救急与越权牟利进入不同责任链。"
 zg361m.200.a:0 "授予限时、限范围的越权权限，并保留命令日志与事后复核"
 zg361m.200.b:0 "危机期间开放全面越权，先恢复再补审批"
 zg361m.200.c:0 "这季度先不碰，登记制度债"
 zg361m.201.t:0 "第201号 · 不可改写的事故时间线"
 zg361m.201.desc:0 "【X · 值守、故障与救火绩效／P1】\n\n决策：事故开始即冻结发现、升级、命令、行动和恢复节点；参与者可补充注释，不能删除原记录。\n\n后果：复盘不再依赖谁嗓门大，早报和迟报可核对；记录行政成本只在真实事故触发。"
 zg361m.201.a:0 "事故开始即冻结发现、升级、命令、行动和恢复节点"
 zg361m.201.b:0 "恢复后由指挥官整理一份精简时间线并删除过程噪声"
 zg361m.201.c:0 "这季度先不碰，登记制度债"
 zg361m.202.t:0 "第202号 · 复盘行动项 owner"
 zg361m.202.desc:0 "【X · 值守、故障与救火绩效／P1】\n\n决策：每项修复指定唯一负责人、支持者、期限和验收人；可按风险排序，不要求一次修完所有愿望。\n\n后果：按期关闭形成质量贡献，写完复盘不落实会扣 owner 和经理；同一修复不能重复领奖。"
 zg361m.202.a:0 "每项修复指定唯一 owner、支持者、期限和独立验收人"
 zg361m.202.b:0 "把所有改进愿望列入复盘，由团队按空闲自行认领"
 zg361m.202.c:0 "这季度先不碰，登记制度债"
 zg361m.203.t:0 "第203号 · 重复事故升级到管理责任"
 zg361m.203.desc:0 "【X · 值守、故障与救火绩效／P1】\n\n决策：同类事故再次发生时，区分行动项未做、修复无效、资源被拒和新根因，并把责任提升到能配置资源的层级。\n\n后果：一线值守者不再永远背锅；经理若主动承担债务治理可挽回，持续拒绝则进入其上司的团队绩效。"
 zg361m.203.a:0 "区分未做、无效、资源被拒和新根因，再追到资源决策层"
 zg361m.203.b:0 "同类事故复发就加罚当班人员，以高压阻止第三次"
 zg361m.203.c:0 "这季度先不碰，登记制度债"
 zg361m.204.t:0 "第204号 · 可靠性预算与停止上线"
 zg361m.204.desc:0 "【X · 值守、故障与救火绩效／P2】\n\n决策：事故损耗超过年度容忍度时，团队必须暂停部分新项目修稳定性，也可由高层书面接受风险继续冲刺。\n\n后果：停冲刺会损失短期 KPI 却降低未来爆雷；强行继续的收益和后续损失都归签字决策者。"
 zg361m.204.a:0 "耗尽可靠性预算即暂停部分新项目，修复到书面门槛"
 zg361m.204.b:0 "由高层签字继续冲刺，把后续事故损失归入其决策账"
 zg361m.204.c:0 "这季度先不碰，登记制度债"
 zg361m.205.t:0 "第205号 · 重复运维（toil）比例上限"
 zg361m.205.desc:0 "【Y · 技术债、维护与隐形质量劳动／P1】\n\n决策：团队把巡检、催办、手工对账等重复劳动冻结为工时比例；超过上限时可自动化、停接需求或申请增援。\n\n后果：继续硬扛能保短期交付，却挤掉创新并积累倦怠；降低 toil 后减少可见忙碌，但提高长期产能。"
 zg361m.205.a:0 "冻结重复运维工时，超限就自动化、停接或补人"
 zg361m.205.b:0 "维持手工吞吐以保住本期交付，暂不计算隐形工时"
 zg361m.205.c:0 "这季度先不碰，登记制度债"
 zg361m.206.t:0 "第206号 · 积弊本金与利息账"
 zg361m.206.desc:0 "【Y · 技术债、维护与隐形质量劳动／P1】\n\n决策：每个赶工留下的制度/技术债记录原始省时、后续维护成本和风险增长；owner 选择承认、隐瞒或提前偿还。\n\n后果：欠债让当期 KPI 更漂亮，利息在以后项目和事故中兑现；换老板、换团队都不能让已知债务凭空消失。"
 zg361m.206.a:0 "为每笔赶工记录省时本金、维护利息、风险和责任 owner"
 zg361m.206.b:0 "只记录按时上线成果，把后续维护作为新团队日常工作"
 zg361m.206.c:0 "这季度先不碰，登记制度债"
 zg361m.207.t:0 "第207号 · 固定还债预算"
 zg361m.207.desc:0 "【Y · 技术债、维护与隐形质量劳动／P1】\n\n决策：每轮预留少量人力清积弊，或在业务高压期挪去冲指标；还债项目按风险下降而非新功能数量评价。\n\n后果：保留预算牺牲近期产出却降低复发，长期挪用会让经理承担债务膨胀和未来事故责任。"
 zg361m.207.a:0 "每轮锁定偿债人力，并以风险下降验收而非功能数"
 zg361m.207.b:0 "业务高压时收回全部还债人力，集中完成显性指标"
 zg361m.207.c:0 "这季度先不碰，登记制度债"
 zg361m.208.t:0 "第208号 · 渐进修补 / 全面重做"
 zg361m.208.desc:0 "【Y · 技术债、维护与隐形质量劳动／P2】\n\n决策：面对高债旧系统，可逐步修补、一次性重建或保持现状直到退役；三路有不同工期、失败面和可见度。\n\n后果：重做容易成为宏大晋升项目也可能烂尾，渐进收益小却稳定；现状路线把节省资源换成持续利息。"
 zg361m.208.a:0 "按风险分段修补并设可量化退出线，逐步替换旧务"
 zg361m.208.b:0 "宣布全面重做并冻结旧系统演进，押注一次性切换"
 zg361m.208.c:0 "这季度先不碰，登记制度债"
 zg361m.209.t:0 "第209号 · 旧系统危险津贴"
 zg361m.209.desc:0 "【Y · 技术债、维护与隐形质量劳动／P1】\n\n决策：无人愿接的积弊岗位可给专项金币、晋升证据或轮值减免，也可强派最弱势员工。\n\n后果：津贴让脏活有人做但花国库，强派省钱却提高离职和事故；危险岗位成功治理后津贴自动到期。"
 zg361m.209.a:0 "为积弊岗位提供限期金币、晋升证据或轮值减免"
 zg361m.209.b:0 "强派最弱势员工接手旧务，以最低成本补上空缺"
 zg361m.209.c:0 "这季度先不碰，登记制度债"
 zg361m.210.t:0 "第210号 · 维护 owner 轮换"
 zg361m.210.desc:0 "【Y · 技术债、维护与隐形质量劳动／P1】\n\n决策：核心旧务由固定专家、周期轮换或主创者终身负责；轮换必须配套交接和最小培训。\n\n后果：固定 owner 效率高却形成知识垄断，轮换扩散能力但短期变慢；主创终身背锅会抑制创新与主动承担。"
 zg361m.210.a:0 "定期轮换 owner，并为每次轮换配置交接与实操培训"
 zg361m.210.b:0 "让最高效专家永久负责，靠个人熟练度维持速度"
 zg361m.210.c:0 "这季度先不碰，登记制度债"
 zg361m.211.t:0 "第211号 · 文档与操作手册功劳"
 zg361m.211.desc:0 "【Y · 技术债、维护与隐形质量劳动／P1】\n\n决策：官员可花时间把经验写成可由新人完成的流程，并由另一人实际演练验收；也可保持口传心授。\n\n后果：有效手册降低爬坡、值守和单点风险；只写无人使用的长文不计功，口传垄断提高个人议价却限制晋升管理岗。"
 zg361m.211.a:0 "让新人按手册完成一次实操验收后再给作者计功"
 zg361m.211.b:0 "继续由专家口传心授，避免写作拖慢当前交付"
 zg361m.211.c:0 "这季度先不碰，登记制度债"
 zg361m.212.t:0 "第212号 · 自动化“做完就看不见”悖论"
 zg361m.212.desc:0 "【Y · 技术债、维护与隐形质量劳动／P1】\n\n决策：自动化项目按节省的未来工时、故障和交接难度记账，或仍按当期处理件数奖励。\n\n后果：正确计账鼓励消灭自己的重复工作；只看件数会逼人保留低效手工流程来维持可见产量。"
 zg361m.212.a:0 "按未来节省工时、故障与交接难度给自动化延迟计功"
 zg361m.212.b:0 "继续按当期处理件数发绩效，让可见吞吐优先"
 zg361m.212.c:0 "这季度先不碰，登记制度债"
 zg361m.213.t:0 "第213号 · 审阅与质量把关贡献"
 zg361m.213.desc:0 "【Y · 技术债、维护与隐形质量劳动／P1】\n\n决策：把审方案、复核公文、提前拦错的时间记给审阅者，同时记录阻塞时长；审阅者可严谨、快速或滥用门禁夺权。\n\n后果：高质量把关减少返工，过度挑刺拖慢交付；只统计“亲自完成”会系统性惩罚资深守门人。"
 zg361m.213.a:0 "同时记录审阅拦错、投入工时与阻塞时长，设周转目标"
 zg361m.213.b:0 "只给亲自交付者计功，要求审阅者尽快批准避免阻塞"
 zg361m.213.c:0 "这季度先不碰，登记制度债"
 zg361m.214.t:0 "第214号 · 覆盖率数字与真实质量"
 zg361m.214.desc:0 "【Y · 技术债、维护与隐形质量劳动／P1】\n\n决策：团队可刷检查数量、围绕高风险场景做少而深的验证，或以事故率反推质量；三种证据联合校准。\n\n后果：数量漂亮但漏掉关键风险会在爆雷时加倍反噬，少而深需留下为何选这些场景的记录。"
 zg361m.214.a:0 "围绕高风险场景做深测，并用真实事故反校验证选择"
 zg361m.214.b:0 "设检查数量和覆盖率硬线，月底集中补齐数字"
 zg361m.214.c:0 "这季度先不碰，登记制度债"
 zg361m.215.t:0 "第215号 · 退役旧制度也算交付"
 zg361m.215.desc:0 "【Y · 技术债、维护与隐形质量劳动／P1】\n\n决策：owner 可关闭无人使用的流程/平台、继续维护兼容，或把少数用户迁走后退役；用户有一次申诉必要性。\n\n后果：成功退役释放长期维护 HC，粗暴关停会把成本转嫁给边缘团队；“上线新物”不再是唯一可见功劳。"
 zg361m.215.a:0 "先迁移剩余用户、开放必要性申诉，再验收退役节省"
 zg361m.215.b:0 "立即关闭低使用旧务，把释放 HC 当期计入交付"
 zg361m.215.c:0 "这季度先不碰，登记制度债"
 zg361m.216.t:0 "第216号 · 离岗交接完整度"
 zg361m.216.desc:0 "【Y · 技术债、维护与隐形质量劳动／P1】\n\n决策：转岗、晋升或离任前按资产、风险、联系人和未结事项完成交接；上司可给时间、强行立即放人或暂扣部分专项奖。\n\n后果：完整交接减少后续事故并进入组织贡献；用交接无限卡人会扣人才输出，隐瞒烂账则追溯原 owner。"
 zg361m.216.a:0 "给交接时间并按资产、风险、联系人和未结项逐项验收"
 zg361m.216.b:0 "立即放人到新岗，把遗留问题交给接任者边做边查"
 zg361m.216.c:0 "这季度先不碰，登记制度债"
 zg361m.217.t:0 "第217号 · 共享平台强制采用 / 自愿采用"
 zg361m.217.desc:0 "【Z · 中台、共享官署与内部开源／P1】\n\n决策：高层可命令各团队使用统一制度工具、让平台凭价值争取采用，或只强制底线接口。\n\n后果：强制统一减少重复建设却可能压死本地需求，自愿采用更真实但扩散慢；采用率不能直接等同价值。"
 zg361m.217.a:0 "只强制底线接口，其余能力凭试点价值争取采用"
 zg361m.217.b:0 "命令所有团队一次切到统一平台，迅速消灭重复建设"
 zg361m.217.c:0 "这季度先不碰，登记制度债"
 zg361m.218.t:0 "第218号 · 内部客户满意与战略底座双评分"
 zg361m.218.desc:0 "【Z · 中台、共享官署与内部开源／P1】\n\n决策：平台团队同时接受使用者体验和高层长期能力评价；可修眼前痛点、建不可见底座或平衡两者。\n\n后果：只讨好客户会积累架构债，只做宏大底座则无人愿用；两张表共同进入校准，不由单个强势客户一票定生死。"
 zg361m.218.a:0 "客户体验与战略底座各设最低线，共同进入校准"
 zg361m.218.b:0 "让最大内部客户一票决定平台绩效，优先解决眼前痛点"
 zg361m.218.c:0 "这季度先不碰，登记制度债"
 zg361m.219.t:0 "第219号 · 采用数量 / 使用深度 / 节省成本"
 zg361m.219.desc:0 "【Z · 中台、共享官署与内部开源／P1】\n\n决策：平台 owner 选择追求接入团队数、关键流程依赖度或真实节省；制度要求至少一个结果指标与一个反指标。\n\n后果：刷浅接入能涨数字却制造迁移负担，深度少客群可能更有价值；虚荣采用率在审计中降权。"
 zg361m.219.a:0 "至少绑定一个真实节省结果和一个反指标，再看接入深度"
 zg361m.219.b:0 "以接入团队数为主指标，集中推动大量浅接入"
 zg361m.219.c:0 "这季度先不碰，登记制度债"
 zg361m.220.t:0 "第220号 · 共享成本展示与内部结算"
 zg361m.220.desc:0 "【Z · 中台、共享官署与内部开源／P2】\n\n决策：平台成本可由中央全包、按使用量分摊或只展示不扣款；使用团队决定继续、降配或自建。\n\n后果：中央全包鼓励采用也掩盖浪费，分摊促节制却诱发绕平台；任何路线都保持总体国库守恒。"
 zg361m.220.a:0 "先展示成本，再按可核使用量分摊大户并核对国库守恒"
 zg361m.220.b:0 "由中央国库全包平台费用，以零门槛迅速扩大采用"
 zg361m.220.c:0 "这季度先不碰，登记制度债"
 zg361m.221.t:0 "第221号 · 迁移成本谁来付"
 zg361m.221.desc:0 "【Z · 中台、共享官署与内部开源／P1】\n\n决策：统一平台发起方、使用团队或上级改革预算承担迁移 HC；可按未来受益比例共同出资。\n\n后果：只让使用方付钱会遭消极抵抗，平台全付限制扩张速度；成本归属写入双方绩效，不能只奖励发布者。"
 zg361m.221.a:0 "按未来受益比例冻结平台、使用方和改革预算的出资额"
 zg361m.221.b:0 "要求使用团队自付全部迁移 HC，以此检验真实需求"
 zg361m.221.c:0 "这季度先不碰，登记制度债"
 zg361m.222.t:0 "第222号 · 新旧双跑过渡期"
 zg361m.222.desc:0 "【Z · 中台、共享官署与内部开源／P1】\n\n决策：立即切换、限期双跑或按风险分批迁移；双跑期有明确结束条件和额外维护工时。\n\n后果：立即切换快但爆雷面大，长期双跑最安全却吞噬资源；无期限兼容会变成新的积弊债。"
 zg361m.222.a:0 "按风险分批双跑，并为旧路设明确退出日和额外工时"
 zg361m.222.b:0 "在统一日期立即切换，停止旧路以强迫问题快速暴露"
 zg361m.222.c:0 "这季度先不碰，登记制度债"
 zg361m.223.t:0 "第223号 · 重复造轮子扫描"
 zg361m.223.desc:0 "【Z · 中台、共享官署与内部开源／P1】\n\n决策：新项目立项前检索已有能力，选择复用、贡献改造或以明确差异批准自建。\n\n后果：复用节约 HC 但让功劳分散，自建更容易拿 owner 光环却承担重复成本；隐瞒已有方案会扣立项信用。"
 zg361m.223.a:0 "立项前检索复用、贡献改造与差异例外并留审批证据"
 zg361m.223.b:0 "为关键项目快速批准自建，避免等待共享方案协调"
 zg361m.223.c:0 "这季度先不碰，登记制度债"
 zg361m.224.t:0 "第224号 · 重复方案合并赛"
 zg361m.224.desc:0 "【Z · 中台、共享官署与内部开源／P2】\n\n决策：两个成熟方案并存时，可按公开试点选一、吸收双方优点重构，或继续多元竞争。\n\n后果：选一释放维护成本却伤落选团队，重构昂贵但保留贡献，多元竞争促进创新也持续重复投入。"
 zg361m.224.a:0 "用公开试点选主线，保留双方贡献并资助必要重构"
 zg361m.224.b:0 "由高层立即指定唯一胜者，并停止另一方案维护"
 zg361m.224.c:0 "这季度先不碰，登记制度债"
 zg361m.225.t:0 "第225号 · “不是我造的不用”与合法分叉"
 zg361m.225.desc:0 "【Z · 中台、共享官署与内部开源／P1】\n\n决策：团队可直接采用外组方案、提出改动回馈主线，或因真实安全/性能差异建立分叉并承担维护。\n\n后果：情绪性拒用会扣协作与 HC 可信度，合法分叉成功可形成新平台；分叉者不能把主线问题全甩给原团队。"
 zg361m.225.a:0 "先向主线提交改动，只有硬差异获批才分叉并自负维护"
 zg361m.225.b:0 "为本地速度立即分叉，之后再决定是否回馈主线"
 zg361m.225.c:0 "这季度先不碰，登记制度债"
 zg361m.226.t:0 "第226号 · 内部开源贡献归因"
 zg361m.226.desc:0 "【Z · 中台、共享官署与内部开源／P1】\n\n决策：跨组成员可提交修复、文档和新能力，由维护者接受、要求修改或说明拒绝；贡献进入双方案卷。\n\n后果：被采纳者获得跨组织影响，维护者的审阅也计功；刷无用提交或无理拒绝会降低各自社区信用。"
 zg361m.226.a:0 "按采纳修复、文档和能力给贡献者及审阅维护者双记功"
 zg361m.226.b:0 "按提交数量快速合并外组贡献，以活跃度扩大社区"
 zg361m.226.c:0 "这季度先不碰，登记制度债"
 zg361m.227.t:0 "第227号 · 创始人、贡献者与维护者分账"
 zg361m.227.desc:0 "【Z · 中台、共享官署与内部开源／P1】\n\n决策：平台成功后分别冻结最初创新、后续扩展和长期稳定贡献；晋升包选择展示哪一种而不能一人全拿。\n\n后果：解决“发布者升走、维护者背锅”；创始光环会随时间衰减，持续维护也不能抹去真正原创。"
 zg361m.227.a:0 "分别冻结原创、扩展与稳定贡献，并让创始光环逐期衰减"
 zg361m.227.b:0 "把平台成功主要记给创始 owner，以明确单一晋升故事"
 zg361m.227.c:0 "这季度先不碰，登记制度债"
 zg361m.228.t:0 "第228号 · 中台事故的爆炸半径责任"
 zg361m.228.desc:0 "【Z · 中台、共享官署与内部开源／P1】\n\n决策：共享平台出险时，区分平台根因、使用方违规和迁移决策；中央可快速止损、允许本地降级或强撑统一。\n\n后果：平台带来的规模效益伴随规模风险；高层强推统一后不能把所有损失甩给单个使用团队。"
 zg361m.228.a:0 "区分平台根因、用户违规和强推决策，并允许本地降级止损"
 zg361m.228.b:0 "强撑统一平台并把损失归给未按规范使用的各团队"
 zg361m.228.c:0 "这季度先不碰，登记制度债"
 zg361m.229.t:0 "第229号 · 指标字典与口径 owner"
 zg361m.229.desc:0 "【AA · 数据口径、实验与指标反噬／P1】\n\n决策：每个 KPI 写明定义、数据源、频率、适用范围和唯一 owner；变更需说明为何旧口径失效。\n\n后果：减少同词不同数，owner 也承担口径缺陷；指标字典本身不产生成绩，只保证比较对象一致。"
 zg361m.229.a:0 "登记定义、来源、频率、范围、唯一 owner 与版本变更理由"
 zg361m.229.b:0 "由业务主管快速宣布本期口径，先完成统一计算"
 zg361m.229.c:0 "这季度先不碰，登记制度债"
 zg361m.230.t:0 "第230号 · 多数据源对账"
 zg361m.230.desc:0 "【AA · 数据口径、实验与指标反噬／P1】\n\n决策：国库、地方报表和项目台账给出冲突数字时，选择权威源、联合核对或暂缓结算；不得挑最有利的一份。\n\n后果：对账会延迟绩效却降低错奖错罚；明知冲突仍选漂亮数，后续审计按虚报处理。"
 zg361m.230.a:0 "冲突时暂停结算，由多方签名核对并确定权威源"
 zg361m.230.b:0 "立即选一份官方报表结算，其他差异留待后续审计"
 zg361m.230.c:0 "这季度先不碰，登记制度债"
 zg361m.231.t:0 "第231号 · 业务指标分母变更"
 zg361m.231.desc:0 "【AA · 数据口径、实验与指标反噬／P1】\n\n决策：覆盖人口、辖地范围或统计对象变化时，保留旧分母、重算基线或并列展示新旧口径。\n\n后果：防止靠缩小服务对象刷增长；合理变更可解释趋势断点，但不能倒算已经发放的旧奖金。"
 zg361m.231.a:0 "并列展示新旧分母、重算基线且不追改旧奖金"
 zg361m.231.b:0 "立即采用更有利的新分母，并用它重述本期增长"
 zg361m.231.c:0 "这季度先不碰，登记制度债"
 zg361m.232.t:0 "第232号 · 缺失数据与人工回填"
 zg361m.232.desc:0 "【AA · 数据口径、实验与指标反噬／P1】\n\n决策：数据中断时使用保守估计、人工凭证或延期结算；回填者和审批者共同签名。\n\n后果：及时回填恢复决策，也创造篡改入口；事后与真实数据偏差过大时追责方法和审批，而非自动罚业务 owner。"
 zg361m.232.a:0 "用保守估计或人工凭证双签，并在真数到达后对账"
 zg361m.232.b:0 "由单一主管快速回填最合理数字，避免延期发奖"
 zg361m.232.c:0 "这季度先不碰，登记制度债"
 zg361m.233.t:0 "第233号 · 看板访问权不对称"
 zg361m.233.desc:0 "【AA · 数据口径、实验与指标反噬／P2】\n\n决策：关键指标可全员可见、只给 manager，或按岗位分层；没有访问权者获得目标调整或查询渠道。\n\n后果：数据透明利于自我纠偏也方便刷数，封闭则让上司垄断叙事；不能要求员工为从未可见的异常负责。"
 zg361m.233.a:0 "按岗位开放看板，并给无权限者查询渠道与目标调整"
 zg361m.233.b:0 "只给经理完整数据，仍要求下属对异常结果负责"
 zg361m.233.c:0 "这季度先不碰，登记制度债"
 zg361m.234.t:0 "第234号 · 领先指标与滞后结果分账"
 zg361m.234.desc:0 "【AA · 数据口径、实验与指标反噬／P1】\n\n决策：长期目标同时选择早期行为信号和最终治理结果；上司决定在结果尚未成熟时给暂定认可还是等待。\n\n后果：领先指标能提前纠偏却容易被刷，滞后结果更真实但反馈太慢；两者矛盾时进入校准说明。"
 zg361m.234.a:0 "同时冻结领先信号与滞后结果，暂定认可到期再转正"
 zg361m.234.b:0 "结果未成熟时先按领先指标发奖，以加快行为转向"
 zg361m.234.c:0 "这季度先不碰，登记制度债"
 zg361m.235.t:0 "第235号 · 主指标与护栏指标"
 zg361m.235.desc:0 "【AA · 数据口径、实验与指标反噬／P1】\n\n决策：追税收、发展或交付速度时，必须配一个民心、质量或协作护栏；可在危机中书面突破护栏。\n\n后果：主指标上涨而护栏崩溃不能拿完整 3.75；批准突破者享受成功也承担延迟副作用。"
 zg361m.235.a:0 "每个主指标绑定一项护栏，突破须书面批准并追延迟后果"
 zg361m.235.b:0 "危机期只追主指标，先拿结果再处理民心与质量"
 zg361m.235.c:0 "这季度先不碰，登记制度债"
 zg361m.236.t:0 "第236号 · KPI 达标悬崖"
 zg361m.236.desc:0 "【AA · 数据口径、实验与指标反噬／P2】\n\n决策：目标可采用 100% 才计功的硬门槛、连续区间，或关键底线加连续奖励。\n\n后果：硬门槛刺激最后冲刺却让 99% 与 0% 同奖惩，连续区间更公平但可能缺少紧迫感；制度决定不能年末改。"
 zg361m.236.a:0 "用连续区间计分并保留关键底线，期初冻结斜率"
 zg361m.236.b:0 "坚持百分百硬门槛，让未达标者统一承受完整后果"
 zg361m.236.c:0 "这季度先不碰，登记制度债"
 zg361m.237.t:0 "第237号 · 时间窗挑选与“截最美一段”"
 zg361m.237.desc:0 "【AA · 数据口径、实验与指标反噬／P1】\n\n决策：成果按完整周期、固定同比或预先指定里程碑计算；官员可申请解释异常，但不能自由截取峰值月份。\n\n后果：挑窗刷数短期提高故事性，审计还原全周期后会扣诚信；真实季节性由固定对照修正。"
 zg361m.237.a:0 "期初指定完整周期、同比或里程碑窗，并统一修正季节性"
 zg361m.237.b:0 "允许 owner 选最能代表成果的高峰时段来汇报"
 zg361m.237.c:0 "这季度先不碰，登记制度债"
 zg361m.238.t:0 "第238号 · 虚荣指标与最终价值"
 zg361m.238.desc:0 "【AA · 数据口径、实验与指标反噬／P1】\n\n决策：在访问数、活动数、文件数等易涨数字之外，选择一个实际采用、节省或治理改善结果。\n\n后果：只做热闹会先获得可见度，长期没有价值转化则追回专项功劳；难量化价值仍可用经验证据而非强塞假数。"
 zg361m.238.a:0 "把访问、活动或文件数绑定真实采用、节省或治理结果"
 zg361m.238.b:0 "先按快速上涨的可见数字计功，价值转化以后再看"
 zg361m.238.c:0 "这季度先不碰，登记制度债"
 zg361m.239.t:0 "第239号 · 失败实验的学习收益"
 zg361m.239.desc:0 "【AA · 数据口径、实验与指标反噬／P1】\n\n决策：试点未达主目标时，判断是否验证了关键假设、及时停止并留下可复用结论；也可掩盖失败或硬上线。\n\n后果：高质量负结果获得有限探索功，不等于成功 KPI；无假设、无记录的失败不能包装成“宝贵经验”。"
 zg361m.239.a:0 "预注册假设与止损线，负结果须形成可复用结论才计功"
 zg361m.239.b:0 "为挽回投入继续上线未达标方案，用真实采用争取翻盘"
 zg361m.239.c:0 "这季度先不碰，登记制度债"
 zg361m.240.t:0 "第240号 · 实验污染与多团队抢样本"
 zg361m.240.desc:0 "【AA · 数据口径、实验与指标反噬／P2】\n\n决策：多个试点同时影响同一辖地时，排队、划分样本或接受互相污染；高层分配稀缺实验窗口。\n\n后果：排队降低速度但结果可信，并行提高产量却难归因；明知污染仍宣称确定结论会伤数据信用。"
 zg361m.240.a:0 "由高层排实验窗口或划互斥样本，并登记样本占用"
 zg361m.240.b:0 "允许多团队同时试验重叠辖地，以更高产量接受污染"
 zg361m.240.c:0 "这季度先不碰，登记制度债"
 zg361m.241.t:0 "第241号 · 长尾效果归属期"
 zg361m.241.desc:0 "【AA · 数据口径、实验与指标反噬／P1】\n\n决策：项目上线后保留一段归因窗口，原 owner 转岗时可与接任者按建设、运营和改进分功。\n\n后果：防止发布即升走独占多年收益，也避免接任者只吃现成果；延迟副作用同样按这一窗口追溯。"
 zg361m.241.a:0 "在统一归因窗内冻结建设、运营、改进三段分功规则，并追溯延迟副作用"
 zg361m.241.b:0 "上线即把未来收益全记给首任 owner，却让接任者独自承担运营与延迟副作用"
 zg361m.241.c:0 "这季度先不碰，登记制度债"
 zg361m.242.t:0 "第242号 · 在场时长 / 真实成果双账"
 zg361m.242.desc:0 "【AB · 加班、会议与在线表演／P1】\n\n决策：上司可明确禁止用晚归作为绩效证据、把它仅作负荷信号，或继续奖励长期在场。\n\n后果：奖励时长会迅速形成全员表演性加班，短期可见度上升、长期效率和健康下降；结果制也不能忽略真实过载。"
 zg361m.242.a:0 "禁止晚归计功，只把在场时长作为过载预警并核对真实产出"
 zg361m.242.b:0 "按在线与晚归时长直接加可见度分，快速识别“最奋斗”者"
 zg361m.242.c:0 "这季度先不碰，登记制度债"
 zg361m.243.t:0 "第243号 · 非工作时段回复规则"
 zg361m.243.desc:0 "【AB · 加班、会议与在线表演／P1】\n\n决策：只有值守者必须即时回应、所有人限时回应，或一般消息次日处理；发送者要标明紧急级别。\n\n后果：全员随时在线提高短期响应，却制造假紧急与倦怠；真正紧急未响应只追值守链，不污染所有人的软评分。"
 zg361m.243.a:0 "消息标紧急级，只有排班值守者即时响应，普通消息次日处理"
 zg361m.243.b:0 "要求全员非工作时段限时回复，以统一强响应换取短期速度"
 zg361m.243.c:0 "这季度先不碰，登记制度债"
 zg361m.244.t:0 "第244号 · “自愿奋斗”与隐性强制"
 zg361m.244.desc:0 "【AB · 加班、会议与在线表演／P1】\n\n决策：官员可自愿冲刺换明确奖励，也可拒绝未写入目标的额外工时；经理不得用“大家都自愿”掩盖统一压力。\n\n后果：真自愿成功有专项证据，拒绝者不因单纯准点离开扣分；若拒绝合理急务仍按值守规则处理。"
 zg361m.244.a:0 "书面列明冲刺目标、奖励与拒绝豁免，逐人自愿报名"
 zg361m.244.b:0 "宣布全组“自愿奋斗”，拒绝额外工时者承担软评分压力"
 zg361m.244.c:0 "这季度先不碰，登记制度债"
 zg361m.245.t:0 "第245号 · 审批加班 / 影子加班"
 zg361m.245.desc:0 "【AB · 加班、会议与在线表演／P1】\n\n决策：额外工时需提前批准、事故后补录，或不允许记录；经理可能暗示“别申报但要做完”。\n\n后果：批准会花国库或调休额度，影子加班表面省钱却在审计时转为经理责任；员工虚报同样损害信用。"
 zg361m.245.a:0 "事前审批或事故后补录额外工时，逐笔兑现金币或调休"
 zg361m.245.b:0 "不准申报却维持原期限，以影子加班快速填平进度"
 zg361m.245.c:0 "这季度先不碰，登记制度债"
 zg361m.246.t:0 "第246号 · 加班金币 / 调休 / 目标减免"
 zg361m.246.desc:0 "【AB · 加班、会议与在线表演／P1】\n\n决策：真实额外劳动可在个人金币、未来休息或本轮目标下调中择一，管理者按财政和交付权衡。\n\n后果：三种补偿都消耗不同组织资源，不能重复领取；长期只许调休却不让休会形成未兑现债务。"
 zg361m.246.a:0 "让额外劳动在金币、可兑现调休、目标减免中三选一并记债"
 zg361m.246.b:0 "统一发放未来调休但不削任务，用延期承诺节省当期国库"
 zg361m.246.c:0 "这季度先不碰，登记制度债"
 zg361m.247.t:0 "第247号 · 战时冲刺的起止令"
 zg361m.247.desc:0 "【AB · 加班、会议与在线表演／P1】\n\n决策：重大活动、战争或灾害可开启有期限冲刺，写明目标、人员和结束日；到期必须关闭或由上级续批。\n\n后果：短冲刺提高交付并积累疲劳，常态化冲刺会被识别为管理失败；事后不得把普通赶工冒充危机功劳。"
 zg361m.247.a:0 "冲刺令写明目标、名单、结束日与复盘，到期关闭或上级续批"
 zg361m.247.b:0 "以危机名义无限期动员，所有赶工一律计作战功"
 zg361m.247.c:0 "这季度先不碰，登记制度债"
 zg361m.248.t:0 "第248号 · 长期缺编反噬经理"
 zg361m.248.desc:0 "【AB · 加班、会议与在线表演／P1】\n\n决策：经理可用加班长期填空岗、削减任务、申请 HC 或自动化；连续超负荷会进入其资源规划分。\n\n后果：靠团队透支达标不再是纯优秀管理，拒绝所有救济后爆雷由经理承担；短期合理过渡仍允许。"
 zg361m.248.a:0 "削减范围、申请 HC 或自动化，并把持续过载写入经理资源规划分"
 zg361m.248.b:0 "维持满额目标，长期靠团队加班覆盖空岗并只看交付"
 zg361m.248.c:0 "这季度先不碰，登记制度债"
 zg361m.249.t:0 "第249号 · 会议工时预算"
 zg361m.249.desc:0 "【AB · 加班、会议与在线表演／P1】\n\n决策：团队每周期设置会议上限，新增会议必须取消旧会、缩短时长或说明决策价值。\n\n后果：压会释放办事时间，也可能遗漏协作；无结论、无 owner 的长会消耗经理组织绩效，而非参与者个人 KPI。"
 zg361m.249.a:0 "设置周期会议上限；新会须替换旧会、等量缩时或举证决策价值，并留存 owner、议程与结论"
 zg361m.249.b:0 "允许经理随时召集全员长会，牺牲办事时间换取即时同步"
 zg361m.249.c:0 "这季度先不碰，登记制度债"
 zg361m.250.t:0 "第250号 · 出席人数 / 决策贡献分离"
 zg361m.250.desc:0 "【AB · 加班、会议与在线表演／P1】\n\n决策：会议只邀请决策者、提供信息者和受影响代表，其余人读纪要；也可全员列席换透明。\n\n后果：少数会议效率高但要求高质量纪要，全员出席透明却昂贵；到场本身不计协作功。"
 zg361m.250.a:0 "只邀请决策者、信息方与受影响代表，其余人凭完整纪要跟进"
 zg361m.250.b:0 "关键会议一律全员列席，以昂贵在场换取即时透明"
 zg361m.250.c:0 "这季度先不碰，登记制度债"
 zg361m.251.t:0 "第251号 · 拒绝无效会议的政治成本"
 zg361m.251.desc:0 "【AB · 加班、会议与在线表演／P2】\n\n决策：官员可拒绝无议程会议、派代表或仍去刷脸；召集者可接受质疑或视为不服从。\n\n后果：合理拒绝节省时间并推动流程改进，持续缺席关键决定则承担协作责任；上司报复性低评可被纪要反证。"
 zg361m.251.a:0 "赋予无议程会议拒绝或派代表权，用纪要核验是否错过关键决定"
 zg361m.251.b:0 "把拒会直接视为不服从，强制到场以维护召集者权威"
 zg361m.251.c:0 "这季度先不碰，登记制度债"
 zg361m.252.t:0 "第252号 · 休假与缺勤的目标归一化"
 zg361m.252.desc:0 "【AB · 加班、会议与在线表演／P1】\n\n决策：合法离岗按实际可工作期缩放目标、交给替补并分功，或保持原目标但提供更多资源。\n\n后果：防止把休假者天然塞入末位，也防止同一产出由本人和替补双领全功；未经批准的长期缺勤另行评价。"
 zg361m.252.a:0 "按可工作期缩放目标，替补成果分账并冻结未批准缺勤的例外规则"
 zg361m.252.b:0 "休假者保留全年目标，替补另领全功，以硬结果维持统一门槛"
 zg361m.252.c:0 "这季度先不碰，登记制度债"
 zg361m.253.t:0 "第253号 · 低绩效后的躺平反应"
 zg361m.253.desc:0 "【AB · 加班、会议与在线表演／P2】\n\n决策：感到不公者可继续冲刺求翻身、只完成最低职责、申请转岗或公开抗议；上司可修复信任、强压或置之不理。\n\n后果：最低履责不等于违纪，但会降低成长机会；若翻案证明不公，团队士气损失回写原经理和制度气候。"
 zg361m.253.a:0 "先核对不公证据并提供修复、转岗或最低职责协议，再观察下一轮"
 zg361m.253.b:0 "把躺平立即升级为强压与降档，逼其冲刺或退出"
 zg361m.253.c:0 "这季度先不碰，登记制度债"
 zg361m.254.t:0 "第254号 · 外包绕 HC"
 zg361m.254.desc:0 "【AC · 外包、派遣与借调灰区／P1】\n\n决策：HC 冻结时，经理可削减目标、申请特批或从采购预算买临时外部容量。\n\n后果：外包快速补人却不等于免费编制，费用、知识和质量风险都入账；长期用外包掩盖正式岗位会被零基审计。"
 zg361m.254.a:0 "先削目标或申请特批，临时外包须记全成本、知识风险与退出日"
 zg361m.254.b:0 "直接用采购预算长期补人，绕过正式 HC 审查保住交付"
 zg361m.254.c:0 "这季度先不碰，登记制度债"
 zg361m.255.t:0 "第255号 · 正式 HC / 外包总成本比较"
 zg361m.255.desc:0 "【AC · 外包、派遣与借调灰区／P1】\n\n决策：比较薪俸、招聘、管理、流失、供应商利润和交接成本后选择正式、外包或混合团队。\n\n后果：外包单价低不代表全周期便宜，正式人员贵却沉淀能力；只报采购价会构成 HC 答辩失真。"
 zg361m.255.a:0 "比较薪俸、招聘、管理、流失、利润和交接的全周期成本"
 zg361m.255.b:0 "只看采购报价，立即选择单价最低的用工方案"
 zg361m.255.c:0 "这季度先不碰，登记制度债"
 zg361m.256.t:0 "第256号 · 外部团队独立绩效池"
 zg361m.256.desc:0 "【AC · 外包、派遣与借调灰区／P1】\n\n决策：供应商按交付、质量和 SLA 评价，不拿外部人员给正式官员填 3.25；可续约、整改或换商。\n\n后果：堵住“两种身份同榜、弱势者专背 C”；供应商低评影响采购与项目，不直接改某个未建模外部人的性格或金币。"
 zg361m.256.a:0 "供应商按交付、质量与 SLA 独立评级，只影响整改、续约和换商"
 zg361m.256.b:0 "把外部团队塞进正式 361 池，用弱势身份直接填末位"
 zg361m.256.c:0 "这季度先不碰，登记制度债"
 zg361m.257.t:0 "第257号 · 外包转正式的有限通道"
 zg361m.257.desc:0 "【AC · 外包、派遣与借调灰区／P1】\n\n决策：表现稳定者可争少量正式 HC，按公开门槛、直属举荐或统一考试；也可保持双轨无转正。\n\n后果：通道提高外部团队动力并带来配额政治，黑箱转正诱发依附；转正后从下一轮进入正式 cohort，不带外包名次。"
 zg361m.257.a:0 "预留少量公开 HC，按统一门槛或考试转正并从下一轮入池"
 zg361m.257.b:0 "让直属经理直接点名转正最顺手的外包人员"
 zg361m.257.c:0 "这季度先不碰，登记制度债"
 zg361m.258.t:0 "第258号 · 权限差导致的绩效校正"
 zg361m.258.desc:0 "【AC · 外包、派遣与借调灰区／P1】\n\n决策：外部人员缺少数据、决策权和核心会议时，项目评价需冻结可控范围；经理可补权限、调目标或仍强压同一结果。\n\n后果：不给工具又罚交付会扣采购经理责任；过度开放则增加治理风险，必须与项目重要度相称。"
 zg361m.258.a:0 "冻结可控范围，补齐必要权限或同步下调目标并记录治理风险"
 zg361m.258.b:0 "不给数据与决策权仍压同一结果，用交付压力迫使团队绕路"
 zg361m.258.c:0 "这季度先不碰，登记制度债"
 zg361m.259.t:0 "第259号 · 供应商 SLA 与个体责任分开"
 zg361m.259.desc:0 "【AC · 外包、派遣与借调灰区／P1】\n\n决策：延期先判断合同能力、甲方需求变更、供应商管理还是具体执行失误；整改对象对应不同层级。\n\n后果：不能用“外包不行”替代事实，也不能把供应商违约算成甲方一线官员的 C；甲方 owner 仍为选择和协作负责。"
 zg361m.259.a:0 "按合同能力、需求变更、供应商管理和执行失误逐层归因整改"
 zg361m.259.b:0 "延期即整体归咎外包方，并让甲方一线 owner 同步背 C"
 zg361m.259.c:0 "这季度先不碰，登记制度债"
 zg361m.260.t:0 "第260号 · 人力补位 / 结果承包二种合同"
 zg361m.260.desc:0 "【AC · 外包、派遣与借调灰区／P2】\n\n决策：按工时购买可调度容量，或按明确成果验收；中途改需求时分别走增时或变更价款。\n\n后果：买人力灵活但管理负担留在内部，包结果省管理却怕需求变动；合同类型决定谁为延期负责。"
 zg361m.260.a:0 "按需求稳定度选择工时或成果合同，并预写增时与变更价款"
 zg361m.260.b:0 "一律签固定成果与硬期限，把内部管理和变更风险压给供应商"
 zg361m.260.c:0 "这季度先不碰，登记制度债"
 zg361m.261.t:0 "第261号 · 多层转包与真实执行者披露"
 zg361m.261.desc:0 "【AC · 外包、派遣与借调灰区／P1】\n\n决策：供应商再转包必须披露层级、关键人员和差价；甲方可批准、要求直签或终止。\n\n后果：层级越多，信息与报酬衰减越大；隐瞒转包出险时，同时问责采购、供应商和知情管理者。"
 zg361m.261.a:0 "披露转包层级、实际人员和差价，由甲方逐层批准或要求直签"
 zg361m.261.b:0 "默许供应商自由再转包，以最快扩容换取责任链模糊"
 zg361m.261.c:0 "这季度先不碰，登记制度债"
 zg361m.262.t:0 "第262号 · 借调人员双线评价"
 zg361m.262.desc:0 "【AC · 外包、派遣与借调灰区／P1】\n\n决策：借出经理评能力发展，借入项目 owner 评实际交付，周期初冻结权重；两边不能各把全部成果记给自己。\n\n后果：双线冲突进入联合校准，借调者不因没有本组日常产出被自动判低；名额和成本仍只记一次。"
 zg361m.262.a:0 "周期初冻结借出能力分与借入交付分权重，成本和成果各记一次"
 zg361m.262.b:0 "由借入 owner 单方定档，双方团队各自认领全部成果"
 zg361m.262.c:0 "这季度先不碰，登记制度债"
 zg361m.263.t:0 "第263号 · 借调结束的返岗权"
 zg361m.263.desc:0 "【AC · 外包、派遣与借调灰区／P1】\n\n决策：借调前写明原岗保留、同等级返岗或可转永久；结束时双方可协商续借，但本人有一次表达选择。\n\n后果：无返岗保障会降低参与跨部门急务意愿，永久抢人则需要 HC 和补缺结算；不能无限“临时”借调。"
 zg361m.263.a:0 "借调前写明原岗、同级返岗或永久转入条件，并给本人一次选择"
 zg361m.263.b:0 "无限续延“临时”借调，等项目结束后再临时决定归属"
 zg361m.263.c:0 "这季度先不碰，登记制度债"
 zg361m.264.t:0 "第264号 · 供应商退出的知识移交"
 zg361m.264.desc:0 "【AC · 外包、派遣与借调灰区／P1】\n\n决策：合同尾期安排文档、影子跟岗、实操验收和遗留问题；可付尾款换完整交接，或省钱立即切断。\n\n后果：尾款与交付绑定能减少知识蒸发，粗暴退出造成后续故障和重复采购；已验收内容成为内部资产。"
 zg361m.264.a:0 "尾款绑定文档、影子跟岗、实操验收和遗留清单后再退出"
 zg361m.264.b:0 "立即停约停款，以最快切割换取后续故障和重复采购风险"
 zg361m.264.c:0 "这季度先不碰，登记制度债"
 zg361m.265.t:0 "第265号 · 外包招聘舞弊与管理连责"
 zg361m.265.desc:0 "【AC · 外包、派遣与借调灰区／P1】\n\n决策：采购和招聘中的回扣、泄题、亲属输送可由抽查、举报或异常价格触发审计；直接、间接经理分别举证履责。\n\n后果：查实追回国库、冻结相关权限并扣价值观；只有确有监督缺失才连责，不能因下属偶发违规机械株连。"
 zg361m.265.a:0 "按回扣、泄题、亲属与异常价格触发审计，逐层核验经理履责"
 zg361m.265.b:0 "发现舞弊即冻结整条管理链权限并集体扣分，先震慑后取证"
 zg361m.265.c:0 "这季度先不碰，登记制度债"
 zg361m.266.t:0 "第266号 · 招人门槛 / 空岗紧急度"
 zg361m.266.desc:0 "【AD · 招聘门槛、面试官与 Offer／P1】\n\n决策：岗位急缺时坚持统一门槛、降一档快速补人，或用短期外部容量等更好候选。\n\n后果：降门槛缩短空岗却提高试用失败和导师成本，坚持门槛则让现团队继续超负荷；选择写回 HC 判断。"
 zg361m.266.a:0 "维持岗位门槛，以削范围或短期容量等待合格候选"
 zg361m.266.b:0 "紧急降一档快速补人，接受更高试用失败和导师成本"
 zg361m.266.c:0 "这季度先不碰，登记制度债"
 zg361m.267.t:0 "第267号 · 面试官先独立投票"
 zg361m.267.desc:0 "【AD · 招聘门槛、面试官与 Offer／P1】\n\n决策：每位面试官在集体讨论前封存“录用/保留/拒绝”和证据，之后可因新事实改票。\n\n后果：减少最高职级先发言导致的从众；无理由改票会降低面试官判断信用，候选不需要知道个别票身份。"
 zg361m.267.a:0 "讨论前封存录用、保留、拒绝及证据，新事实才能改票"
 zg361m.267.b:0 "由最高职级先定调，再让其余面试官快速形成共识"
 zg361m.267.c:0 "这季度先不碰，登记制度债"
 zg361m.268.t:0 "第268号 · 面试官手松手紧校准"
 zg361m.268.desc:0 "【AD · 招聘门槛、面试官与 Offer／P1】\n\n决策：展示各面试官历史通过率和入职后结果，选择仅提示、有限归一或暂停明显失真的面试资格。\n\n后果：长期放水和逢人必拒都会折价，新面试官有中性先验；统计只辅助，不替代本次具体证据。"
 zg361m.268.a:0 "展示通过率与入职结果，有限归一并训练长期失真的面试官"
 zg361m.268.b:0 "按历史通过率设硬配额，立即暂停最松或最严者资格"
 zg361m.268.c:0 "这季度先不碰，登记制度债"
 zg361m.269.t:0 "第269号 · 面试判断的延迟回写"
 zg361m.269.desc:0 "【AD · 招聘门槛、面试官与 Offer／P1】\n\n决策：候选入职数轮后，把其胜任、错配和流失分别写给各证据维度的面试官，而非只找最终拍板者。\n\n后果：能识人的面试官获得组织贡献，反复误判者接受训练；战略改变导致的失败不算面试官全责。"
 zg361m.269.a:0 "数轮后将胜任、错配和流失按证据维度回写给对应面试官"
 zg361m.269.b:0 "试用失败立即全责追究最终拍板者，不等待岗位与战略归因"
 zg361m.269.c:0 "这季度先不碰，登记制度债"
 zg361m.270.t:0 "第270号 · 误招 / 漏招成本偏好"
 zg361m.270.desc:0 "【AD · 招聘门槛、面试官与 Offer／P2】\n\n决策：关键岗位可偏保守避免误招，增长岗位可偏开放避免漏掉潜力，普通岗位保持平衡。\n\n后果：保守提高平均质量却延长空岗，开放增加人才多样性也提高培养成本；同一门槛不再硬套所有 HC。"
 zg361m.270.a:0 "按关键、增长、普通岗位分别冻结保守、开放或平衡门槛"
 zg361m.270.b:0 "全组织统一采用高门槛，优先消灭误招并接受长期空岗"
 zg361m.270.c:0 "这季度先不碰，登记制度债"
 zg361m.271.t:0 "第271号 · 内推奖励与利益回避"
 zg361m.271.desc:0 "【AD · 招聘门槛、面试官与 Offer／P1】\n\n决策：内推人可提供事实并在候选通过试用后领奖，不能参与最终录用票；亲族关系必须披露。\n\n后果：奖励扩大人才来源，先付会诱发撒网，后付使内推者关心质量；隐瞒冲突会追回奖励并重审录用流程。"
 zg361m.271.a:0 "试用通过后才发内推奖，内推人披露亲族并退出最终录用票"
 zg361m.271.b:0 "推荐即付奖并允许内推人参与拍板，以关系信用加速录用"
 zg361m.271.c:0 "这季度先不碰，登记制度债"
 zg361m.272.t:0 "第272号 · Offer 职级特批"
 zg361m.272.desc:0 "【AD · 招聘门槛、面试官与 Offer／P1】\n\n决策：候选超出岗位带宽时，可提高正式级别、给限期稀缺津贴或拒绝竞价；特批由跨团队席复核内部公平。\n\n后果：高定级抢到急才也增加倒挂和错误成本，津贴到期可重审；不能入职后偷偷改低已经承诺的级别。"
 zg361m.272.a:0 "跨团队复核正式高定级或限期稀缺津贴，并同步检查内部倒挂"
 zg361m.272.b:0 "直属经理为抢人当场承诺高职级，入职后再处理公平问题"
 zg361m.272.c:0 "这季度先不碰，登记制度债"
 zg361m.273.t:0 "第273号 · 候选人归属与“抢简历”"
 zg361m.273.desc:0 "【AD · 招聘门槛、面试官与 Offer／P2】\n\n决策：多个团队争同一候选时，按最初岗位、候选选择或组织优先级分配；招聘者可共享而非藏住简历。\n\n后果：藏候选保本组机会，却可能让公司整体错失匹配；共享成功给原发掘者部分人才贡献。"
 zg361m.273.a:0 "候选池跨团队共享，按候选选择和组织优先级分配并给发掘者分功"
 zg361m.273.b:0 "先接触的团队独占简历，抢在其他岗位前锁定候选"
 zg361m.273.c:0 "这季度先不碰，登记制度债"
 zg361m.274.t:0 "第274号 · 反 Offer 竞价上限"
 zg361m.274.desc:0 "【AD · 招聘门槛、面试官与 Offer／P1】\n\n决策：候选拿到外部或内部竞争条件后，团队可一次加价、改岗位/机会，或守住公平线退出竞价。\n\n后果：加价提高到岗率也制造新老倒挂，机会承诺必须可交付；反复抬价会降低候选和经理双方信用。"
 zg361m.274.a:0 "只给一次可交付的加价或岗位方案，达到公平线后退出竞价"
 zg361m.274.b:0 "连续加价直至候选接受，以到岗率优先处理后续倒挂"
 zg361m.274.c:0 "这季度先不碰，登记制度债"
 zg361m.275.t:0 "第275号 · Offer 拒绝与 HC 保留期"
 zg361m.275.desc:0 "【AD · 招聘门槛、面试官与 Offer／P1】\n\n决策：候选拒绝后，名额可为备选保留短期、立即回收或重新开招；拒绝原因写入岗位而非怪罪所有招聘者。\n\n后果：短保留提高补位速度，长期占坑浪费 HC；多次因同一条件拒绝会强制重审薪酬或岗位设计。"
 zg361m.275.a:0 "为备选短期保留名额，到期自动回收并复盘重复拒绝原因"
 zg361m.275.b:0 "由原经理无限占住名额，等待下一名候选而不重审岗位"
 zg361m.275.c:0 "这季度先不碰，登记制度债"
 zg361m.276.t:0 "第276号 · 离职人才回聘"
 zg361m.276.desc:0 "【AD · 招聘门槛、面试官与 Offer／P1】\n\n决策：旧员工可按冻结履历、离职原因和外部成长简化面试、完整重审或拒绝回聘。\n\n后果：回聘爬坡快且能纠正遗憾流失，也可能把旧冲突带回；旧 3.25 不自动清零，外部成果也不自动保送。"
 zg361m.276.a:0 "带入冻结履历、离职原因和外部成长，针对差距重审后回聘"
 zg361m.276.b:0 "凭旧关系快速免试回聘，并清空旧 3.25 与冲突记录"
 zg361m.276.c:0 "这季度先不碰，登记制度债"
 zg361m.277.t:0 "第277号 · PIP 退出不自动补 HC"
 zg361m.277.desc:0 "【AD · 招聘门槛、面试官与 Offer／P1】\n\n决策：低绩效者离开后，经理需说明工作仍存在、是否可自动化/合并及替代成本，才能取回正式名额。\n\n后果：堵住“先做低人再扩编”的循环；真实关键岗位可快速 backfill，虚构工作量则名额被上级重分。"
 zg361m.277.a:0 "先证明工作仍存在且不可合并或自动化，再批准正式 backfill"
 zg361m.277.b:0 "低绩效者一离开就自动返还名额，让经理立即招替代者"
 zg361m.277.c:0 "这季度先不碰，登记制度债"
 zg361m.278.t:0 "第278号 · 年度总包实得对账单"
 zg361m.278.desc:0 "【AE · 薪酬透明、发放纪律与公平修复／P1】\n\n决策：年末把承诺的固定俸、岗位津贴、绩效奖、专项奖和已归属长期奖，与实际支付逐笔对账。\n\n后果：差额形成有到期日的兑现债，不能被漂亮的“总包”数字掩盖；完全兑现提高组织信用但真花国库。"
 zg361m.278.a:0 "逐笔核对固定俸、津贴、奖金和已归属长期奖，差额写明到期日"
 zg361m.278.b:0 "只公布总包口径，不拆承诺与实付差额以维持漂亮数字"
 zg361m.278.c:0 "这季度先不碰，登记制度债"
 zg361m.279.t:0 "第279号 · 额外月份俸禄的契约属性"
 zg361m.279.desc:0 "【AE · 薪酬透明、发放纪律与公平修复／P1】\n\n决策：周期初明确额外一月俸是固定收入、达标奖金还是领主酌情赏赐，年末不得为省钱临时改名。\n\n后果：固定项无论档位都应支付，绩效项随规则变化，酌情项虽可不给却影响组织信用；三者分开记账。"
 zg361m.279.a:0 "周期初冻结额外月俸属于固定、绩效还是酌情赏赐并分别记账"
 zg361m.279.b:0 "年末按国库余量重新命名该月俸，优先压缩支出"
 zg361m.279.c:0 "这季度先不碰，登记制度债"
 zg361m.280.t:0 "第280号 · 年中入离职奖金折算"
 zg361m.280.desc:0 "【AE · 薪酬透明、发放纪律与公平修复／P1】\n\n决策：对中途入职、转岗或离任者按服务月份、里程碑贡献或全周期门槛折算，规则在其加入 cohort 时冻结。\n\n后果：合理折算减少“熬到发奖日再走”，全有全无更能留人却制造临界离职与不公平申诉。"
 zg361m.280.a:0 "入池时冻结按服务月、里程碑或周期门槛折算的单一公式"
 zg361m.280.b:0 "以发奖日是否仍在岗作为全有全无门槛，强化临界留任"
 zg361m.280.c:0 "这季度先不碰，登记制度债"
 zg361m.281.t:0 "第281号 · 奖金发放日与延期信用"
 zg361m.281.desc:0 "【AE · 薪酬透明、发放纪律与公平修复／P1】\n\n决策：国库紧张时准时少承诺、写明期限延期，或无期限拖欠已确定奖金。\n\n后果：延期款进入国库负债并在到期时自动复核；再次逾期降低招聘、留任和经理兑现分，不能当作免费融资。"
 zg361m.281.a:0 "国库紧张时少承诺或写明延期日，欠款到期自动复核"
 zg361m.281.b:0 "保留全额口头承诺却无期限拖欠，把奖金当免费融资"
 zg361m.281.c:0 "这季度先不碰，登记制度债"
 zg361m.282.t:0 "第282号 · 调薪生效日与追溯补发"
 zg361m.282.desc:0 "【AE · 薪酬透明、发放纪律与公平修复／P1】\n\n决策：调薪在出榜当日、下季度或周期起点生效；审批晚于承诺日时选择追溯补差或形成欠款。\n\n后果：流程慢不再偷偷吞掉个人收入；追溯会集中冲击国库，促使经理及时完成京察与薪酬审批。"
 zg361m.282.a:0 "冻结生效日，审批晚于承诺时追溯补差并对账国库"
 zg361m.282.b:0 "一律从最终批准日加俸，不为流程延迟补发"
 zg361m.282.c:0 "这季度先不碰，登记制度债"
 zg361m.283.t:0 "第283号 · “干升职”兑现期限"
 zg361m.283.desc:0 "【AE · 薪酬透明、发放纪律与公平修复／P1】\n\n决策：先升职责/职级、稍后加俸时必须写明最迟兑现轮次；候选可接受、拒绝或改走专家现金路线。\n\n后果：干升职短期省预算，逾期则形成职级债和离职风险；不能把持续承担高阶职责当作无偿忠诚测试。"
 zg361m.283.a:0 "先升职责须冻结最迟加俸轮次，逾期记职级债并允许拒绝"
 zg361m.283.b:0 "立即加职责与头衔但无限期缓发薪酬，以忠诚测试保交付"
 zg361m.283.c:0 "这季度先不碰，登记制度债"
 zg361m.284.t:0 "第284号 · 降级薪俸缓冲坡"
 zg361m.284.desc:0 "【AE · 薪酬透明、发放纪律与公平修复／P1】\n\n决策：撤回职责后立即降俸、分两轮递减，或保留专业薪级只撤管理津贴。\n\n后果：缓冲花国库却降低羞辱和申诉，骤降便宜但可能逼走仍有专业价值者；重大舞弊不享默认缓冲。"
 zg361m.284.a:0 "非舞弊降级分两轮递减，或只撤管理津贴保留专业薪级"
 zg361m.284.b:0 "撤责当天立即降到新岗底薪，以最低成本完成组织调整"
 zg361m.284.c:0 "这季度先不碰，登记制度债"
 zg361m.285.t:0 "第285号 · 同档调薪二次校准"
 zg361m.285.desc:0 "【AE · 薪酬透明、发放纪律与公平修复／P1】\n\n决策：361 定档后，另在同档内比较带内位置、稀缺性、历史欠账和留任风险；经理不能用调薪会偷偷改绩效名次。\n\n后果：同为 3.75 不必同幅上涨，也让长期低位者追赶；每项差异需理由码并守住总池。"
 zg361m.285.a:0 "按带内位置、稀缺、欠账和留任风险分配总池并逐项给理由码"
 zg361m.285.b:0 "经理在同档内直接倾斜最想保的人，不另留薪酬校准案卷"
 zg361m.285.c:0 "这季度先不碰，登记制度债"
 zg361m.286.t:0 "第286号 · 超带冻结与低带追赶"
 zg361m.286.desc:0 "【AE · 薪酬透明、发放纪律与公平修复／P1】\n\n决策：高于薪酬带上限者冻结固定俸改发一次奖，低于下限者优先补齐，或允许有期限的带外例外。\n\n后果：修结构会挤占明星增量，不修则积累倒挂；带外例外到期必须重审而非永久隐身。"
 zg361m.286.a:0 "优先补齐低于下限者，超上限改发一次奖，带外例外设到期日"
 zg361m.286.b:0 "继续按绩效普涨固定俸，不让薪酬带阻碍即时奖励"
 zg361m.286.c:0 "这季度先不碰，登记制度债"
 zg361m.287.t:0 "第287号 · 密薪 / 带宽公开 / 匿名分布"
 zg361m.287.desc:0 "【AE · 薪酬透明、发放纪律与公平修复／P2】\n\n决策：只让本人知金额、公开职级带宽和本人位置，或再公开同岗匿名分布；不得泄露申诉材料。\n\n后果：越透明越容易发现不公，也越会引发比较；全黑箱给经理议价空间，却提高猜忌、泄密和流失。"
 zg361m.287.a:0 "公开职级带宽、本人位置和同岗匿名分布，同时封存申诉材料"
 zg361m.287.b:0 "金额与带宽全部保密，由经理逐人议价维持灵活性"
 zg361m.287.c:0 "这季度先不碰，登记制度债"
 zg361m.288.t:0 "第288号 · 新老薪酬倒挂修复"
 zg361m.288.desc:0 "【AE · 薪酬透明、发放纪律与公平修复／P1】\n\n决策：高价招入新人后，可补关键老臣、压低新 offer、用限期稀缺津贴解释差额，或暂记公平债。\n\n后果：立即补齐昂贵但稳团队，放任倒挂会让稳定 3.5/3.75 人才集体打听市场；差额不直接改变绩效档位。"
 zg361m.288.a:0 "补关键老臣或用限期津贴解释差额，未补部分登记公平债"
 zg361m.288.b:0 "按市场变化容忍新人高薪，暂不修复老臣倒挂"
 zg361m.288.c:0 "这季度先不碰，登记制度债"
 zg361m.289.t:0 "第289号 · 薪酬申诉与绩效申诉分轨"
 zg361m.289.desc:0 "【AE · 薪酬透明、发放纪律与公平修复／P1】\n\n决策：员工可接受档位但质疑奖金计算、带宽位置或欠款，也可两案并行；薪酬复核只改钱账和规则执行。\n\n后果：避免所有不满都变成改分战争；计算错误补发金币，不能因此凭空改成 3.75 或重排名额。"
 zg361m.289.a:0 "另开奖金计算、带宽和欠款复核，算错只补钱不改榜"
 zg361m.289.b:0 "所有薪酬争议并入绩效申诉，一次裁定后不再对账"
 zg361m.289.c:0 "这季度先不碰，登记制度债"
 zg361m.290.t:0 "第290号 · 长期功赏提名池"
 zg361m.290.desc:0 "【AF · 长期激励、归属与流动性／P1】\n\n决策：有限长期奖在连续绩效、关键岗位、潜力和留任风险间分配；3.75 只是资格，不保证人人获授。\n\n后果：集中明星提高留任杠杆却扩大阶层差，广覆盖增强共同命运但单人激励弱；提名理由进入下一轮兑现审计。"
 zg361m.290.a:0 "按连续绩效、关键岗位、潜力与留任风险打分，留存提名理由审计"
 zg361m.290.b:0 "把有限长期奖集中给本轮最醒目的 3.75，迅速锁住明星"
 zg361m.290.c:0 "这季度先不碰，登记制度债"
 zg361m.291.t:0 "第291号 · 定份额 / 定授予价值"
 zg361m.291.desc:0 "【AF · 长期激励、归属与流动性／P2】\n\n决策：按固定份额、固定金币价值换算份额，或设置上下限；授予规则决定价格波动由个人还是组织承担。\n\n后果：定份额在组织上涨时奖励大、下跌时缩水，定价值会改变份额池稀释；不能事后挑对组织最省的一种。"
 zg361m.291.a:0 "授予时冻结份额或价值公式及上下限，价格风险按合同承担"
 zg361m.291.b:0 "兑现时再选对组织最省的份额或价值口径"
 zg361m.291.c:0 "这季度先不碰，登记制度债"
 zg361m.292.t:0 "第292号 · 高风险期权式 / 保底份额式"
 zg361m.292.desc:0 "【AF · 长期激励、归属与流动性／P2】\n\n决策：受奖者在高上限但可能归零的期权式功赏、归属即有价值的限制份额或较少现金间选择。\n\n后果：冒险型人才可能押注组织增长，保守者换确定性；选择不改变原绩效，也不能由经理强迫接“纸面财富”。"
 zg361m.292.a:0 "让受奖者知情选择期权、归属即有价值的限制份额或少量现金，并分别冻结风险"
 zg361m.292.b:0 "统一发可能归零的高上限期权，以纸面财富节省现金"
 zg361m.292.c:0 "这季度先不碰，登记制度债"
 zg361m.293.t:0 "第293号 · 当期奖金自愿换长期份额"
 zg361m.293.desc:0 "【AF · 长期激励、归属与流动性／P2】\n\n决策：合资格者可拿全现金、按比例换长期功赏或全额递延，转换价格和风险在选择前公开。\n\n后果：换份额缓解当前国库并增加留任，也把未来波动转给个人；选择后只能按既定退出规则处理。"
 zg361m.293.a:0 "事前公开转换价与退出规则，让个人自选现金、比例换股或全递延"
 zg361m.293.b:0 "将合资格奖金自动全额递延，迅速缓解当期国库"
 zg361m.293.c:0 "这季度先不碰，登记制度债"
 zg361m.294.t:0 "第294号 · 授予价、当前估值与可变现值三栏"
 zg361m.294.desc:0 "【AF · 长期激励、归属与流动性／P1】\n\n决策：界面只报历史授予额、定期重估，或同时给悲观/基准/乐观区间和当前流动性。\n\n后果：透明降低画饼能力却提高信任；长期拿历史高值当现值，兑现落差会集中触发离任和申诉。"
 zg361m.294.a:0 "同时展示授予额、三档估值区间和当前可变现能力并定期重估"
 zg361m.294.b:0 "长期只展示历史授予高值，把流动性留到兑现时说明"
 zg361m.294.c:0 "这季度先不碰，登记制度债"
 zg361m.295.t:0 "第295号 · 首授 Cliff 长短"
 zg361m.295.desc:0 "【AF · 长期激励、归属与流动性／P2】\n\n决策：选择一年后开始归属、两年后加速归属或从首季小额归属；只影响新授予批次。\n\n后果：长 Cliff 金手铐强、临界裁撤争议大，短 Cliff 可信但留任力弱；与续授断崖分别结算。"
 zg361m.295.a:0 "采用常规一年 Cliff 后开始归属，并保留所有旧批次合同"
 zg361m.295.b:0 "采用两年 Cliff 后加速归属，以更长等待强化金手铐"
 zg361m.295.c:0 "这季度先不碰，登记制度债"
 zg361m.296.t:0 "第296号 · 月度 / 季度 / 年度归属节奏"
 zg361m.296.desc:0 "【AF · 长期激励、归属与流动性／P2】\n\n决策：Cliff 后按细粒度、季度或年度兑现；制度改革保留旧批次合同，新批次才切换。\n\n后果：年度制产生归属日离职潮，细粒度降低断崖却增加账务负担；不得临近归属日单方面改慢。"
 zg361m.296.a:0 "Cliff 后按季度归属，旧批次仍按原合同执行"
 zg361m.296.b:0 "统一年度集中归属，以低账务成本换取归属日断崖"
 zg361m.296.c:0 "这季度先不碰，登记制度债"
 zg361m.297.t:0 "第297号 · 服务归属与绩效归属分轨"
 zg361m.297.desc:0 "【AF · 长期激励、归属与流动性／P1】\n\n决策：每批长期奖明确只需持续任职、需个人达档，还是服务与绩效各占一部分。\n\n后果：纯留任份额不会因一次 3.25 全没收，绩效份额则按冻结条件失效；防止模糊合同任意解释。"
 zg361m.297.a:0 "每批写明服务与绩效归属占比，用冻结条件分别结算"
 zg361m.297.b:0 "一次 3.25 即取消全部未归属份额，不再区分留任部分"
 zg361m.297.c:0 "这季度先不碰，登记制度债"
 zg361m.298.t:0 "第298号 · 组织门槛 × 个人门槛双闸"
 zg361m.298.desc:0 "【AF · 长期激励、归属与流动性／P1】\n\n决策：组织未达长期目标时，全体失效、同比缩减或顺延一次；个人条件仍独立判断。\n\n后果：明星不能只靠个人分越过组织失败，也不必无条件陪葬；顺延会占未来份额池和留任承诺。"
 zg361m.298.a:0 "组织未达标时按完成比例缩减，再独立判断个人门槛"
 zg361m.298.b:0 "组织门槛未过即全员归零，以共同风险强压结果"
 zg361m.298.c:0 "这季度先不碰，登记制度债"
 zg361m.299.t:0 "第299号 · Good Leaver / Bad Leaver 分类"
 zg361m.299.desc:0 "【AF · 长期激励、归属与流动性／P1】\n\n决策：离任按组织裁撤、正常调动、退休/死亡、主动跳槽或重大舞弊分类，决定未归属与已归属权益。\n\n后果：好离任者保留合法成果，坏离任者可能失去未归属并被追索；分类引用冻结事实，不能为省钱改写履历。"
 zg361m.299.a:0 "按裁撤、调动、退休、跳槽与舞弊的冻结事实分别处理权益"
 zg361m.299.b:0 "将所有主动离任归为 Bad Leaver，统一没收未归属权益"
 zg361m.299.c:0 "这季度先不碰，登记制度债"
 zg361m.300.t:0 "第300号 · 回购窗口与流动性队列"
 zg361m.300.desc:0 "【AF · 长期激励、归属与流动性／P1】\n\n决策：定期开有限回购、优先离任者、按申请排队或暂时关闭；开放金额必须由国库支付。\n\n后果：关闭窗口省现钱，却让长期奖折价并伤招聘；暗箱插队会触发份额公平审计。"
 zg361m.300.a:0 "按国库预算定期开窗，公开离任优先与申请队列并逐笔支付"
 zg361m.300.b:0 "关闭固定窗口，只为关键人才临时插队变现"
 zg361m.300.c:0 "这季度先不碰，登记制度债"
 zg361m.301.t:0 "第301号 · 核心业务光环折算"
 zg361m.301.desc:0 "【AG · 业务周期、组织形态与重组折算／P1】\n\n决策：校准时把战略顺风、资源倾斜与个人增量分开；核心团队可主张规模难度，边缘团队可主张资源劣势。\n\n后果：搭上大船不再自动 3.75，核心复杂度也不会被全抹掉；证据不足时只作小幅校正。"
 zg361m.301.a:0 "拆分战略顺风、资源倾斜与个人增量，只按证据小幅校正"
 zg361m.301.b:0 "按绝对规模直接排名，让核心团队以大盘结果优先拿高档"
 zg361m.301.c:0 "这季度先不碰，登记制度债"
 zg361m.302.t:0 "第302号 · 衰退业务的逆风责任"
 zg361m.302.desc:0 "【AG · 业务周期、组织形态与重组折算／P1】\n\n决策：市场/领地自然衰退时，官员选择守住基本盘、主动收缩、寻找第二曲线或继续报增长神话。\n\n后果：守住跌幅可能是高质量表现，长期借逆风免责则失去资源；隐瞒衰退会把业务问题升级为诚信问题。"
 zg361m.302.a:0 "以守住跌幅、主动收缩和第二曲线里程碑评价逆风贡献"
 zg361m.302.b:0 "继续下达统一增长硬指标，以末位压力淘汰未增长者"
 zg361m.302.c:0 "这季度先不碰，登记制度债"
 zg361m.303.t:0 "第303号 · 孵化团队的限期分布保护"
 zg361m.303.desc:0 "【AG · 业务周期、组织形态与重组折算／P1】\n\n决策：新业务在一两轮内按学习、试点和里程碑评价，不与成熟现金牛直接比绝对产出；到期必须毕业、转向或关闭。\n\n后果：保护探索不等于永久免 C，超期仍无证据会失去 HC；过早拉齐则逼孵化团队只做保守小事。"
 zg361m.303.a:0 "保护一至两轮，按学习、试点和里程碑考核，到期毕业、转向或关闭"
 zg361m.303.b:0 "新业务立即与成熟现金牛比较绝对产出，快速筛掉弱项目"
 zg361m.303.c:0 "这季度先不碰，登记制度债"
 zg361m.304.t:0 "第304号 · 项目归属与职能归属双家长"
 zg361m.304.desc:0 "【AG · 业务周期、组织形态与重组折算／P1】\n\n决策：跨职能项目中，项目 owner 评交付，职能经理评专业成长和长期配置，周期初冻结权重与最终主责。\n\n后果：项目成功与专业退化可以同时成立；两位经理冲突进入联合校准，不能让员工两边背满目标。"
 zg361m.304.a:0 "冻结项目交付分、职能成长分权重与最终主责，冲突联合校准"
 zg361m.304.b:0 "两位经理各下满额目标，项目 owner 在冲突时直接拍板"
 zg361m.304.c:0 "这季度先不碰，登记制度债"
 zg361m.305.t:0 "第305号 · 校准前重组静默期"
 zg361m.305.desc:0 "【AG · 业务周期、组织形态与重组折算／P1】\n\n决策：临近证据截止日禁止无危机理由的大规模转组、改汇报线和换岗位；确需重组则由上级签字承接名单。\n\n后果：堵住为配额临时挪人，又不阻止真实战略调整；违规重组会冻结旧 cohort 并扣发起者管理分。"
 zg361m.305.a:0 "截止日前禁止无危机重组，特批须上级承接名单并冻结旧 cohort"
 zg361m.305.b:0 "允许校准前快速换组与汇报线，以重新分配配额压力"
 zg361m.305.c:0 "这季度先不碰，登记制度债"
 zg361m.306.t:0 "第306号 · 双帽临时负责人容量拆分"
 zg361m.306.desc:0 "【AG · 业务周期、组织形态与重组折算／P1】\n\n决策：一人同时代管两组时明确 50/50、70/30 等精力和目标，给临时津贴、削减目标或补代理副手。\n\n后果：双帽成功体现范围能力，长期两份满额任务则把失败责任转向任命者；状态到期必须正式任命或卸任。"
 zg361m.306.a:0 "冻结 50/50 或 70/30 容量，配津贴、减目标或代理副手并设到期日"
 zg361m.306.b:0 "一人同时承担两组满额目标，以临时负责人名义强行保运转"
 zg361m.306.c:0 "这季度先不碰，登记制度债"
 zg361m.307.t:0 "第307号 · 利润中心 / 成本中心记分卡"
 zg361m.307.desc:0 "【AG · 业务周期、组织形态与重组折算／P1】\n\n决策：直接产出国库的团队看收益与质量，共享/保障团队看节省、稳定和内部价值；可跨表比较组织贡献但不硬套同一指标。\n\n后果：避免后台团队永远输给赚钱团队，也防止成本中心只讲不可量化重要性；预算仍需答辩。"
 zg361m.307.a:0 "收益团队看收益质量，共享团队看节省、稳定和内部采用并分别答辩"
 zg361m.307.b:0 "所有团队统一按直接国库产出排名，快速压缩低收益部门"
 zg361m.307.c:0 "这季度先不碰，登记制度债"
 zg361m.308.t:0 "第308号 · 管理岗与专业岗比例"
 zg361m.308.desc:0 "【AG · 业务周期、组织形态与重组折算／P2】\n\n决策：组织可压缩管理 HC、增加一线专家，或为过大团队补中层；每次调整同时改变审批速度和管理幅度。\n\n后果：管理层过多产生汇报税，过少造成评分失真与决策阻塞；不能只靠“扁平化”口号拿绩效。"
 zg361m.308.a:0 "按管理幅度、审批等待和评分误差增减中层与一线专家"
 zg361m.308.b:0 "立即扁平化压缩管理 HC，以更少层级换取短期成本下降"
 zg361m.308.c:0 "这季度先不碰，登记制度债"
 zg361m.309.t:0 "第309号 · 边远团队的可见度折损"
 zg361m.309.desc:0 "【AG · 业务周期、组织形态与重组折算／P1】\n\n决策：总部/京城外团队可定期轮值述职、由上司主动巡访，或继续依赖远程材料；出差曝光占真实管理时间。\n\n后果：补曝光降低地理偏见但花成本，长期忽视会让边远硬成果被总部关系网淹没并提高外流。"
 zg361m.309.a:0 "安排轮值述职与上司巡访，并从经理容量中扣除真实曝光成本"
 zg361m.309.b:0 "继续只收远程材料，让京城关系与自我宣传决定可见度"
 zg361m.309.c:0 "这季度先不碰，登记制度债"
 zg361m.310.t:0 "第310号 · 并入团队的旧档映射"
 zg361m.310.desc:0 "【AG · 业务周期、组织形态与重组折算／P1】\n\n决策：收并外部/异制团队时，旧评级可按等值表折算、只作背景或经过一轮共同基线后启用。\n\n后果：直接等值快却可能尺度失真，完全清零伤害履历；映射只影响历史解释，不预占新组配额。"
 zg361m.310.a:0 "保留旧制原值与映射说明，经一轮共同基线后再纳入新配额"
 zg361m.310.b:0 "立即按简单等值表折算并投入新组校准，快速统一尺度"
 zg361m.310.c:0 "这季度先不碰，登记制度债"
 zg361m.311.t:0 "第311号 · 战略转向不得倒改旧目标"
 zg361m.311.desc:0 "【AG · 业务周期、组织形态与重组折算／P1】\n\n决策：高层改变方向后，旧项目按当时已批准目标结算已完成部分，新方向从变更日立新责任书。\n\n后果：防止“昨天让你向东、今天罚你没向西”；若员工在明确信号后仍拒转，后半周期责任仍可追究。"
 zg361m.311.a:0 "按旧批准目标结算已完成部分，从变更日另立新责任书"
 zg361m.311.b:0 "用新战略倒改整轮目标，统一按最新方向追究结果"
 zg361m.311.c:0 "这季度先不碰，登记制度债"
 zg361m.312.t:0 "第312号 · 内部岗位全量挂牌"
 zg361m.312.desc:0 "【AH · 内部市场、离职与回流／P1】\n\n决策：空岗对所有合资格者公开、只在经理圈流转，或先内部后外招；岗位说明必须带汇报线、带宽和目标。\n\n后果：公开提高匹配并削弱私相授受，也让经理更难雪藏人；长期假挂牌会降低内部市场信用。"
 zg361m.312.a:0 "所有合资格者可见空岗、汇报线、薪酬带和目标，内部期后再外招"
 zg361m.312.b:0 "空岗只在经理圈流转，由熟悉的人选快速补位"
 zg361m.312.c:0 "这季度先不碰，登记制度债"
 zg361m.313.t:0 "第313号 · 原经理推荐信标准化"
 zg361m.313.desc:0 "【AH · 内部市场、离职与回流／P1】\n\n决策：转岗候选的原经理按成果、风险、PIP 和交接提供结构化事实，或拒绝推荐但必须说明可复核理由。\n\n后果：减少私下电话一句话封杀；隐瞒严重问题构成绩效洗白，夹带报复性软话则在复核时反噬。"
 zg361m.313.a:0 "按成果、风险、PIP 与交接写结构化事实，拒绝推荐也须可复核"
 zg361m.313.b:0 "允许原经理私下电话定性，以软评价快速阻止高风险转岗"
 zg361m.313.c:0 "这季度先不碰，登记制度债"
 zg361m.314.t:0 "第314号 · 跨地域调任包"
 zg361m.314.desc:0 "【AH · 内部市场、离职与回流／P2】\n\n决策：远距离转岗可给一次性金币、短期津贴、家属安置或拒绝补助；本人决定是否接受。\n\n后果：调任不再是免费瞬移，补助提高关键岗位到任率；临时津贴到期后仍需靠岗位本身留人。"
 zg361m.314.a:0 "按距离与家庭负担给一次金币、限期津贴或安置，并由本人接受"
 zg361m.314.b:0 "把跨地域调任视为任命义务，不给补助并限期到岗"
 zg361m.314.c:0 "这季度先不碰，登记制度债"
 zg361m.315.t:0 "第315号 · 转岗试运行与双向退出"
 zg361m.315.desc:0 "【AH · 内部市场、离职与回流／P1】\n\n决策：正式转任前用一段短试运行验证岗位匹配；本人、新经理或原经理可按事前条件结束试运行。\n\n后果：减少一次错误转岗毁掉两组，试运行期间成果按双线分账；失败返岗不自动等于 3.25。"
 zg361m.315.a:0 "先短期试岗，冻结双线分功和三方退出条件，失败可返岗"
 zg361m.315.b:0 "直接永久转任并立即切断原岗，以强承诺加速融入"
 zg361m.315.c:0 "这季度先不碰，登记制度债"
 zg361m.316.t:0 "第316号 · 转岗薪酬带映射"
 zg361m.316.desc:0 "【AH · 内部市场、离职与回流／P1】\n\n决策：新岗位带宽更高/更低时，保留原薪、分期调整或按新岗立即重定；专业级与岗位津贴分开。\n\n后果：保薪促进流动但可能产生同岗倒挂，立即降薪会阻塞低成本岗位的合理转入；规则入场前公开。"
 zg361m.316.a:0 "专业薪级与岗位津贴分开，保薪或分期调整并在申请前公开"
 zg361m.316.b:0 "到岗即按新岗位带宽重定全部薪俸，消除过渡例外"
 zg361m.316.c:0 "这季度先不碰，登记制度债"
 zg361m.317.t:0 "第317号 · 未录用转岗申请的保密"
 zg361m.317.desc:0 "【AH · 内部市场、离职与回流／P1】\n\n决策：初筛失败只通知本人，进入终面才告知原经理，或全程公开；泄露后针对性降评进入反报复审计。\n\n后果：保密鼓励人才探索，完全公开方便资源规划却强化卡人；最终录用仍必须走正式放人流程。"
 zg361m.317.a:0 "初筛仅通知本人，终面才告原经理，泄露降评进入反报复审计"
 zg361m.317.b:0 "申请一提交就全程公开，让原经理立即安排资源与留人"
 zg361m.317.c:0 "这季度先不碰，登记制度债"
 zg361m.318.t:0 "第318号 · 转岗申请频率与占位费"
 zg361m.318.desc:0 "【AH · 内部市场、离职与回流／P2】\n\n决策：每人每轮有有限正式申请，可撤回但消耗一次机会；高潜可获额外探索面谈而不占正式槽。\n\n后果：防止海投拖垮面试，也不把一次失败变永久封锁；经理不能用无故拖延耗尽下属次数。"
 zg361m.318.a:0 "每轮有限正式申请，另给高潜一次不占槽的探索面谈并约束拖延"
 zg361m.318.b:0 "每轮只准一次正式申请，错过或撤回即封闭本轮流动"
 zg361m.318.c:0 "这季度先不碰，登记制度债"
 zg361m.319.t:0 "第319号 · 原团队一次反 Offer 后必须放人"
 zg361m.319.desc:0 "【AH · 内部市场、离职与回流／P1】\n\n决策：收到内部录用后，原经理只能给一次真实的职责、薪酬或资源方案；本人拒绝后按时限交接。\n\n后果：给团队合理挽留机会，又防止无限加价和卡人；未兑现的反 Offer 会加重人才输出扣分。"
 zg361m.319.a:0 "原团队仅可给一次可交付方案，本人拒绝后按冻结时限交接放人"
 zg361m.319.b:0 "允许原经理连续加码并延迟交接，直到关键工作补齐"
 zg361m.319.c:0 "这季度先不碰，登记制度债"
 zg361m.320.t:0 "第320号 · 离职访谈的聚合信号"
 zg361m.320.desc:0 "【AH · 内部市场、离职与回流／P1】\n\n决策：离任者可选择实名、匿名或不答，反馈按经理、岗位和制度聚合，单条不能直接给在职者定罪。\n\n后果：重复出现的薪酬、报复、加班问题触发审计；经理无法只把所有离职都分类成“不适应文化”。"
 zg361m.320.a:0 "允许实名、匿名或不答，按经理和制度聚合重复信号后触发审计"
 zg361m.320.b:0 "将实名反馈直接交原经理处置，并逐案归类为文化不适应"
 zg361m.320.c:0 "这季度先不碰，登记制度债"
 zg361m.321.t:0 "第321号 · 离职人才库与回流关系"
 zg361m.321.desc:0 "【AH · 内部市场、离职与回流／P2】\n\n决策：将正常离任者保留为可联系校友、完全断联，或只保关键技能名单；维护关系有少量组织成本。\n\n后果：友好离任提高未来回聘、推荐和跨组织合作，恶意羞辱则把一次离职变长期声誉损失。"
 zg361m.321.a:0 "保留正常离任者为可联系校友，维护关键技能、回聘与推荐关系"
 zg361m.321.b:0 "离任即完全断联，以零维护成本保护内部信息"
 zg361m.321.c:0 "这季度先不碰，登记制度债"
 zg361m.322.t:0 "第322号 · 回流人才的旧账与新证据"
 zg361m.322.desc:0 "【AH · 内部市场、离职与回流／P1】\n\n决策：回聘时保留旧绩效案卷、离职原因和外部成长，按完整重审或针对差距简化评估。\n\n后果：外部成长可以纠正旧判断，旧舞弊不能凭回流清零；重新入职从新周期进 cohort，不占旧团队名额。"
 zg361m.322.a:0 "保留旧案卷与离职原因，加入外部成长后针对差距重审"
 zg361m.322.b:0 "回流即清空旧账，以当前急缺和外部头衔快速录用"
 zg361m.322.c:0 "这季度先不碰，登记制度债"
 zg361m.323.t:0 "第323号 · 学习预算争夺"
 zg361m.323.desc:0 "【AI · 学习、训练与知识扩散／P1】\n\n决策：有限培养金币和时间投向低绩效补短板、高潜扩能力、经理训练或全员基础课。\n\n后果：补弱提高底线，投高潜扩大上限，投经理产生团队杠杆；培训不能直接买成绩，需后验验证。"
 zg361m.323.a:0 "按能力缺口、岗位杠杆与应用任务组合投向补弱、高潜和经理训练"
 zg361m.323.b:0 "把预算集中给本轮高绩效者，以最短时间扩大可见产出"
 zg361m.323.c:0 "这季度先不碰，登记制度债"
 zg361m.324.t:0 "第324号 · 结课 / 应用 / 业务结果三阶段"
 zg361m.324.desc:0 "【AI · 学习、训练与知识扩散／P1】\n\n决策：课程完成只记学习，随后必须在真实任务应用，再观察是否改善结果；可中止无关课程。\n\n后果：堵住刷课时和证书，应用成功才进入绩效；合理学习失败仍可提供能力诊断。"
 zg361m.324.a:0 "结课只记学习，应用真实任务后再按业务改善兑现绩效"
 zg361m.324.b:0 "以结课和证书数量直接计绩效，快速鼓励全员参训"
 zg361m.324.c:0 "这季度先不碰，登记制度债"
 zg361m.325.t:0 "第325号 · 证书 KPI 与能力抽测"
 zg361m.325.desc:0 "【AI · 学习、训练与知识扩散／P1】\n\n决策：岗位可要求证书、实操抽测或二者结合；员工选择背题过证、真实练习或申请以既有成果免测。\n\n后果：只看证书会催生刷证，只有实操成本高；抽测失真会回写培训 owner 而非自动判员工 C。"
 zg361m.325.a:0 "证书结合实操抽测，已有成果可免测并校验题目是否失真"
 zg361m.325.b:0 "设置证书数量硬门槛，以统一凭证快速筛选能力"
 zg361m.325.c:0 "这季度先不碰，登记制度债"
 zg361m.326.t:0 "第326号 · 外部会议与行业曝光"
 zg361m.326.desc:0 "【AI · 学习、训练与知识扩散／P2】\n\n决策：派人才参加外部交流、对外分享成果或留在内部交付；出席者需带回可复用知识而非只刷名片。\n\n后果：外部曝光提高招募和专业声誉，也可能成为跳槽跳板；带回内容被采用后才兑现组织贡献。"
 zg361m.326.a:0 "参会须带回可复用知识并被团队采用，才兑现组织贡献"
 zg361m.326.b:0 "优先派明星对外露脸，以专业声誉和招募曝光换当期交付时间"
 zg361m.326.c:0 "这季度先不碰，登记制度债"
 zg361m.327.t:0 "第327号 · 内部授课分账"
 zg361m.327.desc:0 "【AI · 学习、训练与知识扩散／P1】\n\n决策：资深者可开课、写案例、带实操或拒绝教学专注个人项目；听课人数与后续应用分别记录。\n\n后果：有效教学提高影响范围并支持管理/专家晋升，空洞大课只有可见度；授课工时从个人目标中折算。"
 zg361m.327.a:0 "记录后续应用并从讲师目标中折算授课工时，按真实影响计功"
 zg361m.327.b:0 "按听课人数和课次直接计功，用大课迅速扩大可见度"
 zg361m.327.c:0 "这季度先不碰，登记制度债"
 zg361m.328.t:0 "第328号 · 专业共同体贡献"
 zg361m.328.desc:0 "【AI · 学习、训练与知识扩散／P2】\n\n决策：跨团队同职能官员可共同维护标准、案例库和评审规则；原经理选择支持、限制或索要本组回报。\n\n后果：共同体减少重复学习并提高跨组尺度一致，参与者短期少做本组项目；雪藏会伤经理人才输出。"
 zg361m.328.a:0 "预留跨组工时维护标准、案例和评审，并把成果带回原团队"
 zg361m.328.b:0 "经理限制共同体参与，要求所有容量优先本组短期项目"
 zg361m.328.c:0 "这季度先不碰，登记制度债"
 zg361m.329.t:0 "第329号 · 跨团队导师匹配"
 zg361m.329.desc:0 "【AI · 学习、训练与知识扩散／P1】\n\n决策：本组缺少合适导师时，从共同体匹配外部专家，由受益团队支付时间或人情；双方可因冲突换一次。\n\n后果：打破经理对成长资源的垄断，外部导师也获育人证据；无目标的泛聊不持续计功。"
 zg361m.329.a:0 "跨团队匹配有目标的导师，由受益组支付时间且冲突可换一次"
 zg361m.329.b:0 "导师资源只留本组，由直属经理指定最方便的人选"
 zg361m.329.c:0 "这季度先不碰，登记制度债"
 zg361m.330.t:0 "第330号 · 衰退业务再技能化"
 zg361m.330.desc:0 "【AI · 学习、训练与知识扩散／P1】\n\n决策：业务收缩时，把人员训练到增长岗位、直接外招替代、或维持旧技能直到退出。\n\n后果：再训练慢且有失败率，却减少健康人才流失；直接外招更快但增加裁撤、招聘和公平成本。"
 zg361m.330.a:0 "给受保护时间和阶段任务转训到增长岗，按真实应用决定转入"
 zg361m.330.b:0 "直接外招成熟技能并让旧岗位人员退出，以最快补齐能力"
 zg361m.330.c:0 "这季度先不碰，登记制度债"
 zg361m.331.t:0 "第331号 · 受保护的学习时间"
 zg361m.331.desc:0 "【AI · 学习、训练与知识扩散／P1】\n\n决策：每轮保留少量学习容量、只在项目间隙学习，或危机中挪用并承诺补回。\n\n后果：持续挪用让短期 KPI 稳定、长期技能和创新管线枯竭；硬保学习也不能无视真正急务。"
 zg361m.331.a:0 "每轮冻结少量学习容量，真危机挪用须写明补回日期"
 zg361m.331.b:0 "学习只准放在项目空档，交付吃紧时可永久取消"
 zg361m.331.c:0 "这季度先不碰，登记制度债"
 zg361m.332.t:0 "第332号 · 继任演练与灾备替岗"
 zg361m.332.desc:0 "【AI · 学习、训练与知识扩散／P1】\n\n决策：关键岗位定期让候选独立主持一次安全演练，现任只观察或保留紧急否决权。\n\n后果：暴露“名单上有人、实际接不了”的假继任；演练失败是发展证据，不等同真实事故或当期低档。"
 zg361m.332.a:0 "让继任候选定期独立主持安全演练，现任仅保留紧急否决权"
 zg361m.332.b:0 "不做演练，岗位突缺时直接按继任名单任命第一人"
 zg361m.332.c:0 "这季度先不碰，登记制度债"
 zg361m.333.t:0 "第333号 · 高价培训服务承诺"
 zg361m.333.desc:0 "【AI · 学习、训练与知识扩散／P2】\n\n决策：组织出资昂贵培养时，可要求合理服务期、按月递减返还，或完全无绑定；组织裁撤则免返。\n\n后果：绑定保护投资却降低参与意愿，粗暴全额追索伤人才品牌；培训收益仍需真实应用验证。"
 zg361m.333.a:0 "按月递减培训返还义务，组织裁撤豁免并以真实应用验收收益"
 zg361m.333.b:0 "培训后离任一律全额追索，以硬绑定保护投入"
 zg361m.333.c:0 "这季度先不碰，登记制度债"
 zg361m.334.t:0 "第334号 · 统一需求入口与来源标签"
 zg361m.334.desc:0 "【AJ · 需求入口、交付与跨部门依赖／P1】\n\n决策：每项新差事标明来自上司、属地、事故、同僚还是官员自荐，统一排队；也可允许私聊插单。\n\n后果：统一入口使被拒需求也可追踪，私聊成功提高 sponsor 债并挤掉无关系项目；来源决定谁为价值负责。"
 zg361m.334.a:0 "所有需求标来源进入统一队列，被拒事项也保留价值 owner"
 zg361m.334.b:0 "允许高权 sponsor 私聊插单，以关系优先迅速启动事项"
 zg361m.334.c:0 "这季度先不碰，登记制度债"
 zg361m.335.t:0 "第335号 · 紧急插单预算"
 zg361m.335.desc:0 "【AJ · 需求入口、交付与跨部门依赖／P1】\n\n决策：每周期预留少量急件槽，超出后必须延期旧目标、加资源或由插单者书面承担取舍。\n\n后果：真正危机得到响应，滥用“紧急”会降低提出者优先级信用；未用槽在期末释放而非奖励制造事故。"
 zg361m.335.a:0 "预留少量急件槽，超额须延旧目标、补资源或由插单者签取舍"
 zg361m.335.b:0 "紧急需求可随时挤掉原目标，以即时响应优先处理年底债务"
 zg361m.335.c:0 "这季度先不碰，登记制度债"
 zg361m.336.t:0 "第336号 · 需求准入完成定义"
 zg361m.336.desc:0 "【AJ · 需求入口、交付与跨部门依赖／P1】\n\n决策：未说明受益人、验收、边界和依赖的需求，可退回补充、以小额探索进入，或由高层强塞正式承诺。\n\n后果：强塞后返工不能全罚执行者，反复提交空洞需求会扣 owner 的目标质量；准入不是成功保证。"
 zg361m.336.a:0 "缺受益人、验收、边界或依赖时退回补充，或只批小额探索"
 zg361m.336.b:0 "高层可将模糊需求直接压成正式承诺，用执行团队边做边澄清"
 zg361m.336.c:0 "这季度先不碰，登记制度债"
 zg361m.337.t:0 "第337号 · 需求变更税"
 zg361m.337.desc:0 "【AJ · 需求入口、交付与跨部门依赖／P1】\n\n决策：冻结后改范围必须延长、删掉等量事项、增加预算或承认原需求失误；真实灾变可免一次。\n\n后果：把“领导一句话改需求”的成本写回提出者；合理变更仍能进行，但不再让执行者无条件背延期。"
 zg361m.337.a:0 "冻结后改范围须延时、删等量事项、加预算或承认原需求失误"
 zg361m.337.b:0 "领导可随时改需求且保持原期限，把返工压力留给执行者"
 zg361m.337.c:0 "这季度先不碰，登记制度债"
 zg361m.338.t:0 "第338号 · 范围—期限—质量三角签字"
 zg361m.338.desc:0 "【AJ · 需求入口、交付与跨部门依赖／P1】\n\n决策：约束冲突时明确砍范围、延期限、补 HC 或降低质量门槛，并冻结批准人。\n\n后果：取舍本身不自动扣分，假装三者全要却最终失约会同时伤预测与诚信；降质量后的事故追签字者。"
 zg361m.338.a:0 "冲突时由批准人签字选择砍范围、延期限、补 HC 或降质量"
 zg361m.338.b:0 "范围期限都不动，默认执行团队压缩质量以保表面承诺"
 zg361m.338.c:0 "这季度先不碰，登记制度债"
 zg361m.339.t:0 "第339号 · 估算校准而非只奖准时"
 zg361m.339.desc:0 "【AJ · 需求入口、交付与跨部门依赖／P1】\n\n决策：比较承诺与完成，区分复杂度误判、故意留水、外部阻塞；奖励逐轮变准，或仍只看是否准时。\n\n后果：只奖准时会让所有人报保守目标，校准制允许真实改善计划能力；频繁无因超支仍会受罚。"
 zg361m.339.a:0 "分解复杂度误判、故意留水和外部阻塞，按逐轮变准奖励估算"
 zg361m.339.b:0 "只奖是否准时，鼓励所有人报足缓冲以保证兑现"
 zg361m.339.c:0 "这季度先不碰，登记制度债"
 zg361m.340.t:0 "第340号 · 在制品上限（WIP）"
 zg361m.340.desc:0 "【AJ · 需求入口、交付与跨部门依赖／P1】\n\n决策：每名官员同时只承诺少量项目，可集中完成、申请临时超限或偷偷多开刷忙碌感。\n\n后果：集中减少可见项目数却更快交付，超限使所有项目延迟并把半成品带入下一轮容量。"
 zg361m.340.a:0 "每人只承诺少量在制项目，临时超限须审批并记录容量代价"
 zg361m.340.b:0 "允许多项目并开，以可见忙碌和抢先启动换取交付尾差"
 zg361m.340.c:0 "这季度先不碰，登记制度债"
 zg361m.341.t:0 "第341号 · 跨周期未完工债"
 zg361m.341.desc:0 "【AJ · 需求入口、交付与跨部门依赖／P1】\n\n决策：未完成事项可原样结转、拆小重估、诚实取消或伪装成“第一期完成”。\n\n后果：结转优先占下一轮容量，拆分保留已验收部分；虚假分期会产生重复计功和永不关单审计。"
 zg361m.341.a:0 "原样结转、拆小重估或诚实取消，保留已验收部分并占下轮容量"
 zg361m.341.b:0 "把未完事项改名“第一期完成”，立即关单并在下轮重新立项"
 zg361m.341.c:0 "这季度先不碰，登记制度债"
 zg361m.342.t:0 "第342号 · 阻塞时间归因"
 zg361m.342.desc:0 "【AJ · 需求入口、交付与跨部门依赖／P1】\n\n决策：项目暂停时记录等待谁、从何时、是否及时升级；被阻塞者可协助解阻、换方案或继续等待。\n\n后果：等待不直接等于个人低产，长期不升级则承担部分责任；制造瓶颈者进入协作 KPI。"
 zg361m.342.a:0 "记录等待对象、起点和升级动作，长期不升级者承担部分责任"
 zg361m.342.b:0 "不单列阻塞时间，最终延期统一由项目 owner 承担"
 zg361m.342.c:0 "这季度先不碰，登记制度债"
 zg361m.343.t:0 "第343号 · 提出、执行、验收三方签收"
 zg361m.343.desc:0 "【AJ · 需求入口、交付与跨部门依赖／P1】\n\n决策：提出者确认范围，执行者交付，受益方确认可用；可有条件接收、退回或变更需求。\n\n后果：提出者事后改口需付变更税，执行者不能用“动作做完”冒充被采用价值；验收拖延也有 owner。"
 zg361m.343.a:0 "提出者签范围、执行者交付、受益方验收，退回和变更各有 owner"
 zg361m.343.b:0 "执行者完成动作即可自报关单，受益方异议留到绩效后处理"
 zg361m.343.c:0 "这季度先不碰，登记制度债"
 zg361m.344.t:0 "第344号 · 上线 / 采用 / 价值三阶段结算"
 zg361m.344.desc:0 "【AJ · 需求入口、交付与跨部门依赖／P1】\n\n决策：项目上线先给有限交付分，经过真实采用和治理改善后再兑现剩余奖金；owner 可继续运营、修正或关停。\n\n后果：无人采用的上线项目不再永久占功，长期效果也不会全归后来运营者；三阶段共用一个项目 ID。"
 zg361m.344.a:0 "上线只发有限分，采用与价值验证后用同一项目 ID 兑现余奖"
 zg361m.344.b:0 "项目一上线即发全额功劳和奖金，后续运营另行考核"
 zg361m.344.c:0 "这季度先不碰，登记制度债"
 zg361m.345.t:0 "第345号 · 年度 / 半年度 / 季度周期"
 zg361m.345.desc:0 "【AK · 绩效制度本身的运营与审计／P2】\n\n决策：选择年评配一次期中、半年双评或季度轻评；频率越高，反馈越快，行政和 AI 事件负担也越大。\n\n后果：短周期响应快却鼓励短平快并制造考核疲劳，长周期适合长期结果但纠错慢；默认仍避免事件风暴。"
 zg361m.345.a:0 "采用年度终评加一次期中轻检查，以长期结果控制事件负担"
 zg361m.345.b:0 "每季度完整重跑考核与校准，以高频压力换快速纠偏"
 zg361m.345.c:0 "这季度先不碰，登记制度债"
 zg361m.346.t:0 "第346号 · 周期外重大表现信号"
 zg361m.346.desc:0 "【AK · 绩效制度本身的运营与审计／P1】\n\n决策：重大功过可立即记录为“off-cycle 信号”，只触发奖励、调查或目标调整，不当场重跑整组 361。\n\n后果：组织能及时响应又不反复开校准会；信号在正式周期消费一次，不能重复当即时奖和年末全额分。"
 zg361m.346.a:0 "重大功过即时记一次性信号，只调奖励、调查或目标，年末消费一次"
 zg361m.346.b:0 "重大事件立即重跑整组排名，以最快反映最新表现"
 zg361m.346.c:0 "这季度先不碰，登记制度债"
 zg361m.347.t:0 "第347号 · 经理人工 Override 预算"
 zg361m.347.desc:0 "【AK · 绩效制度本身的运营与审计／P1】\n\n决策：算法初排后，每位经理只有极少人工调整点，须点名受益者、承担者和理由；也可完全不用。\n\n后果：保留人类判断又限制任性改榜，Override 命中后续好结果会提高信用，翻案则降低下轮额度。"
 zg361m.347.a:0 "每位经理仅有少量调整点，点名受益者、承担者、理由并回写命中率"
 zg361m.347.b:0 "允许经理按整体判断自由改榜，以快速纠正算法不懂的人情"
 zg361m.347.c:0 "这季度先不碰，登记制度债"
 zg361m.348.t:0 "第348号 · 制度例外自动到期"
 zg361m.348.desc:0 "【AK · 绩效制度本身的运营与审计／P1】\n\n决策：新人保护、稀缺津贴、特殊 HC、配额豁免和临时权限均有到期日；续期必须提交新事实。\n\n后果：防止一次特批变永久特权，到期过快又会失去政策稳定；批量到期在京察案卷统一处理。"
 zg361m.348.a:0 "保护、津贴、HC、豁免和权限均设到期日，续期必须提交新事实"
 zg361m.348.b:0 "一次特批默认永久沿用，减少反复审批与人员不安"
 zg361m.348.c:0 "这季度先不碰，登记制度债"
 zg361m.349.t:0 "第349号 · 抽查率与审计成本"
 zg361m.349.desc:0 "【AK · 绩效制度本身的运营与审计／P2】\n\n决策：随机抽查少量、高风险定向审查或全面核验；经理可增加透明度换较低抽查。\n\n后果：抽查越强造假收益越低也越耗组织容量，过低则使包装蔓延；查无问题不是失败，能提高制度可信度。"
 zg361m.349.a:0 "随机抽样结合高风险定向审查，透明团队可换较低抽查率"
 zg361m.349.b:0 "维持极低抽查但查实即重罚，以小成本制造高威慑"
 zg361m.349.c:0 "这季度先不碰，登记制度债"
 zg361m.350.t:0 "第350号 · 档位通胀与跨年标杆漂移"
 zg361m.350.desc:0 "【AK · 绩效制度本身的运营与审计／P1】\n\n决策：比较历年 KPI、档位和后续兑现，发现“同样成果今年只算普通”；可更新标杆、保持稳定或承认战略变难。\n\n后果：控制人人越来越优秀的通胀，也防止门槛无止境抬高；变更只用于新轮，不重写旧榜。"
 zg361m.350.a:0 "比较跨年 KPI、档位与兑现，只为新轮更新标杆并解释战略难度"
 zg361m.350.b:0 "发现高档增多就自动抬高全员门槛，迅速压回原分布"
 zg361m.350.c:0 "这季度先不碰，登记制度债"
 zg361m.351.t:0 "第351号 · 分区域制度试点"
 zg361m.351.desc:0 "【AK · 绩效制度本身的运营与审计／P2】\n\n决策：在少数公爵领试行松绑分布、短文档或新奖金规则，设对照组与结束日，再决定扩张。\n\n后果：试点降低全境改革风险，也会产生暂时待遇差；必须按预注册结果判断，不能只挑成功领地宣传。"
 zg361m.351.a:0 "少数公爵领预注册规则、对照组和结束日，再按冻结结果扩张"
 zg361m.351.b:0 "全境立即切换新规则，以统一执行快速获得大样本"
 zg361m.351.c:0 "这季度先不碰，登记制度债"
 zg361m.352.t:0 "第352号 · 制度改版的旧记录映射"
 zg361m.352.desc:0 "【AK · 绩效制度本身的运营与审计／P1】\n\n决策：改变档位、职级或公式时，保留旧制原值并增加可比映射，或从新轮另起一条序列。\n\n后果：历史可解释却不假装精确等值；静默重算会污染申诉、晋升和十年报告，禁止采用。"
 zg361m.352.a:0 "保留旧制原值并附可比映射，或从新轮另起序列"
 zg361m.352.b:0 "按最新公式静默重算全部历史，使报表立即统一"
 zg361m.352.c:0 "这季度先不碰，登记制度债"
 zg361m.353.t:0 "第353号 · 绩效行政成本进入经理报表"
 zg361m.353.desc:0 "【AK · 绩效制度本身的运营与审计／P1】\n\n决策：统计填表、会议、申诉、校准和事件打断占用的总工时，高层可简化低价值环节或继续加码控制。\n\n后果：制度不再假装免费，过重会直接挤压治理成果；删流程若导致错误上升，同样在报告中可见。"
 zg361m.353.a:0 "统计填表、会议、申诉和打断工时，删低价值环节并跟踪错误反弹"
 zg361m.353.b:0 "继续加码流程控制但不计行政工时，以合规优先压住风险"
 zg361m.353.c:0 "这季度先不碰，登记制度债"
 zg361m.354.t:0 "第354号 · “公平指标”也会被刷"
 zg361m.354.desc:0 "【AK · 绩效制度本身的运营与审计／P2】\n\n决策：经理可为降低翻案率压制申诉、为降低流失把人归类健康退出，或接受真实坏数据；元审计抽查原始事实。\n\n后果：任何单一管理 KPI 都不能成为新目标迷信；主动暴露问题并修复比粉饰漂亮曲线更有长期收益。"
 zg361m.354.a:0 "元审计抽查原始申诉、流失与退出事实，奖励主动暴露并修复问题"
 zg361m.354.b:0 "把低翻案率和低流失设硬指标，要求经理迅速压平坏数据"
 zg361m.354.c:0 "这季度先不碰，登记制度债"
 zg361m.355.t:0 "第355号 · 高绩效目标棘轮"
 zg361m.355.desc:0 "【AL · 361 的制度极限与终局／P1】\n\n决策：上轮超额完成后，目标保持、限制增幅，或完全按峰值上调；经理须区分可复制能力与偶然红利。\n\n后果：重棘轮提高表面挑战，却诱发员工压产出、拒绝救火和只求刚好达标；合理加码需同步资源或权力。"
 zg361m.355.a:0 "区分可复制能力与偶然红利，限制目标增幅并同步资源或权力"
 zg361m.355.b:0 "以上轮峰值直接设新底线，以持续加压榨取更高产出"
 zg361m.355.c:0 "这季度先不碰，登记制度债"
 zg361m.356.t:0 "第356号 · 好消息雪藏与截止日套利"
 zg361m.356.desc:0 "【AL · 361 的制度极限与终局／P1】\n\n决策：官员可立即上报全部成果、只报达标部分，或把可控交付推迟到下一轮；审计按实际完成时点核对。\n\n后果：雪藏平滑两轮绩效却损失治理时机，查实后扣诚信；消除棘轮会降低藏成果收益。"
 zg361m.356.a:0 "按真实完成时点核对成果并限制目标棘轮，鼓励立即上报"
 zg361m.356.b:0 "只按截止日入账并持续抬目标，让官员自行平滑两轮产出"
 zg361m.356.c:0 "这季度先不碰，登记制度债"
 zg361m.357.t:0 "第357号 · 先锁事实、再套 361 配额"
 zg361m.357.desc:0 "【AL · 361 的制度极限与终局／P1】\n\n决策：校准第一阶段只判绝对表现与证据，第二阶段才执行相对分布；也可继续一次会倒推理由。\n\n后果：两阶段明确显示谁因配额降档，为申诉和管理者责任提供事实；流程更长但显著降低编理由填 C。"
 zg361m.357.a:0 "先冻结绝对表现与证据，再单独执行相对分布并标明配额降档"
 zg361m.357.b:0 "一次校准会直接定档，再倒推理由填满强制分布"
 zg361m.357.c:0 "这季度先不碰，登记制度债"
 zg361m.358.t:0 "第358号 · 申诉不加重原则"
 zg361m.358.desc:0 "【AL · 361 的制度极限与终局／P1】\n\n决策：复核只能维持或减轻当前处理；若发现独立新造假，必须另开新案而不能在原申诉中报复性加码。\n\n后果：提高正式渠道使用率，同时不给申诉者违法免疫；新案仍需完整送达与举证。"
 zg361m.358.a:0 "原申诉只能维持或减轻，新造假必须另立案、重新举证送达"
 zg361m.358.b:0 "复核时可一并加重处罚，以阻止无根据申诉占用资源"
 zg361m.358.c:0 "这季度先不碰，登记制度债"
 zg361m.359.t:0 "第359号 · 翻案后的配额回流与连环送达"
 zg361m.359.desc:0 "【AL · 361 的制度极限与终局／P1】\n\n决策：低档翻案后使用预留名额、重审原边界人，或把缺额记成经理下轮配额债；若波及他人必须重新送达。\n\n后果：守住配额与程序，却可能引发连环申诉；暗中改另一人档位会重创制度信用。"
 zg361m.359.a:0 "使用预留名额或重审边界人，凡受影响者均重新送达并允许申诉"
 zg361m.359.b:0 "暗中把边界人降档以立即补回配额，不重开连环程序"
 zg361m.359.c:0 "这季度先不碰，登记制度债"
 zg361m.360.t:0 "第360号 · 经理集体拒绝“硬背 C”"
 zg361m.360.desc:0 "【AL · 361 的制度极限与终局／P2】\n\n决策：当多名经理认为全员达标时，可各自硬切、联合申请例外、以管理分代价拒绝，或公开推动制度改革。\n\n后果：形成天朝范围的制度政治：强压可守住人才密度叙事却伤管理层信任，松动则需解释如何继续区分和兑现。"
 zg361m.360.a:0 "经理联合申请有证据的例外或公开改革，并承担管理分代价"
 zg361m.360.b:0 "命令各经理单独硬切末位，以组织强制力守住人才密度叙事"
 zg361m.360.c:0 "这季度先不碰，登记制度债"
 zg361m.361.t:0 "第361号 · 《三六一绩效宪章》"
 zg361m.361.desc:0 "【AL · 361 的制度极限与终局／P2】\n\n决策：长期运行后，最高领主从强制竞争、证据公平、长期创新和组织温度中确定优先顺序，锁定一套可再次修订的制度包。\n\n后果：宪章统一配额、申诉、奖金、HC、经理责任和透明度默认值，但没有“全是好处”的最优解；十年报告持续检验它究竟治理了天下，还是只治理了报表。"
 zg361m.361.a:0 "锁定证据公平、长期创新与组织温度优先的可修订宪章，并持续十年审计"
 zg361m.361.b:0 "锁定强制竞争与即时交付优先的硬宪章，用高压换人才密度"
 zg361m.361.c:0 "这季度先不碰，登记制度债"
