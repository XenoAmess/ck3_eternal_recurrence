 zg361m.215.t:0 "第215号 · 退役旧制度也算交付"
 zg361m.215.desc:0 "成功退役释放长期维护编制名额，粗暴关停会把成本转嫁给边缘团队；“上线新物”不再是唯一可见功劳。"
 zg361m.215.a:0 "先迁移剩余用户、开放必要性申诉，再验收退役节省。"
 zg361m.215.b:0 "立即关闭低使用旧务，把释放编制名额当期计入交付。"
