 zg361m.205.t:0 "第205号 · 重复运维（重复运维）比例上限"
 zg361m.205.desc:0 "继续硬扛能保短期交付，却挤掉创新并积累倦怠；降低重复运维后减少可见忙碌，但提高长期产能。"
 zg361m.205.a:0 "冻结重复运维工时，超限就自动化、停接或补人。"
 zg361m.205.b:0 "维持手工吞吐以保住本期交付，暂不计算隐形工时。"
