 zg361m.295.a.tt:0 "采用常规一年归属等待期后开始归属，并保留所有旧批次合同。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.295.b.tt:0 "采用两年归属等待期后加速归属，以更长等待强化金手铐。 本项只调整组织账目，不会直接执行具体业务动作。"
