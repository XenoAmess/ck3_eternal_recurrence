 zg361m.206.t:0 "第206号 · 积弊本金与利息账"
 zg361m.206.desc:0 "欠债让当期绩效指标更漂亮，利息在以后项目和事故中兑现；换老板、换团队都不能让已知债务凭空消失。"
 zg361m.206.a:0 "为每笔赶工记录省时本金、维护利息、风险和责任责任人。"
 zg361m.206.b:0 "只记录按时上线成果，把后续维护作为新团队日常工作。"
