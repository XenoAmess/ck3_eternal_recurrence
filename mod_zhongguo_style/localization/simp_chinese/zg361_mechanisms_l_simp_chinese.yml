 zg361_org_tech_debt_crisis_desc:0 "昨日的捷径已成为今日的收费站。"
 zg361_org_talent_healthy:0 "人才梯队健康"
 zg361_org_talent_healthy_desc:0 "明星、接班人和普通人都还有路可走。"
 zg361m.1.t:0 "第001号 · 绩效指标分项证据单"
 zg361m.1.desc:0 "高低分必须附具体事例；申诉、绩效改进计划和晋升包复用同一份冻结证据，杜绝让下一年的现值改写旧案。"
 zg361m.1.a:0 "建立分项证据单，逐项冻结产出、效率、增长、协作与价值观案例，并承担填报和复核工时。"
 zg361m.1.b:0 "凭总分和上司印象当场定档，迅速出榜，但让漏项与错项失去可追溯依据。"
 zg361m.1.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.1.a.tt:0 "建立分项证据单，逐项冻结产出、效率、增长、协作与价值观案例，并承担填报和复核工时。"
 zg361m.1.b.tt:0 "凭总分和上司印象当场定档，迅速出榜，但让漏项与错项失去可追溯依据。"
 zg361m.1.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.2.t:0 "第002号 · 年度目标责任书：目标方向与绩效结果"
 zg361m.2.desc:0 "激进目标提高 3.75 与“高潜”上限但失败风险更高；保守目标容易完成但不能只靠完成率获得头档。实际治理成果承担主要分值，目标只决定权重与证据上下文。"
 zg361m.2.a:0 "按岗位冻结方向、基线与正常目标，只允许危机时凭事实重定一次，承担持续跟踪成本。"
 zg361m.2.b:0 "给各单位统一压上进取目标并按原线追责，以短期冲刺换增长，但诱发刷指标和隐瞒风险。"
 zg361m.2.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.2.a.tt:0 "按岗位冻结方向、基线与正常目标，只允许危机时凭事实重定一次，承担持续跟踪成本。"
 zg361m.2.b.tt:0 "给各单位统一压上进取目标并按原线追责，以短期冲刺换增长，但诱发刷指标和隐瞒风险。"
 zg361m.2.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.3.t:0 "第003号 · 期中面谈与目标重置"
 zg361m.3.desc:0 "提前救回风险官员，或留下“上司早已预警/从未提供支持”的绩效改进计划与申诉证据。"
 zg361m.3.a:0 "安排期中辅导，记录风险、资源与一次有据可查的危机重设，花管理工时换取可解释终评。"
 zg361m.3.b:0 "维持年初目标并限期追赶；但可能把战略变化算成个人失败并逼人迟报坏消息。"
 zg361m.3.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.3.a.tt:0 "安排期中辅导，记录风险、资源与一次有据可查的危机重设，花管理工时换取可解释终评。"
 zg361m.3.b.tt:0 "维持年初目标并限期追赶，省去重设流程，却可能把战略变化算成个人失败并逼人迟报坏消息。"
 zg361m.3.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.4.t:0 "第004号 · 自评与认知差"
 zg361m.4.desc:0 "自评不会直接定档，但巨大高估会伤价值观/可信度，低估会错失曝光，高质量证据能进入校准案卷。"
 zg361m.4.a:0 "要求自评档位附代表性成果，由上司逐项回应认知差，承担谈话成本并留下可复核记录。"
 zg361m.4.b:0 "只收一页自我推介并据夸大或谦抑快速修正主观分，省时但把表达能力误当真实绩效。"
 zg361m.4.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.4.a.tt:0 "要求自评档位附代表性成果，由上司逐项回应认知差，承担谈话成本并留下可复核记录。"
 zg361m.4.b.tt:0 "只收一页自我推介并据夸大或谦抑快速修正主观分，省时但把表达能力误当真实绩效。"
 zg361m.4.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.5.t:0 "第005号 · 岗位化记分卡"
 zg361m.5.desc:0 "避免所有人都堆同一属性；转岗可以成为救济，也会失去原岗位优势。"
 zg361m.5.a:0 "为治理、军事、财政和管理岗位预先冻结不同权重；承担维护多套量表的成本。"
 zg361m.5.b:0 "所有岗位共用一张结果榜快速强排，便于执行，却会系统性牺牲难量化岗位并放大错配。"
 zg361m.5.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.5.a.tt:0 "为治理、军事、财政和管理岗位预先冻结不同权重，再在同一直属池中校准，承担维护多套量表的成本。"
 zg361m.5.b.tt:0 "所有岗位共用一张结果榜快速强排，便于执行，却会系统性牺牲难量化岗位并放大错配。"
 zg361m.5.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.6.t:0 "第006号 · 起点与难度校正"
 zg361m.6.desc:0 "考核改善量而非只看绝对繁荣；校正只能小幅封顶，不能成为长期失败豁免。"
 zg361m.6.a:0 "冻结接任基线、资源禀赋和岗位难度，只做有上限的小幅校正，花审计工时换横向可比。"
 zg361m.6.b:0 "只看期末绝对结果并对富庶单位加码，出榜更快，却可能奖励吃老本、惩罚收拾残局。"
 zg361m.6.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.6.a.tt:0 "冻结接任基线、资源禀赋和岗位难度，只做有上限的小幅校正，花审计工时换横向可比。"
 zg361m.6.b.tt:0 "只看期末绝对结果并对富庶单位加码，出榜更快，却可能奖励吃老本、惩罚收拾残局。"
 zg361m.6.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.7.t:0 "第007号 · 背靠背 360 邀评"
 zg361m.7.desc:0 "补足跨部门贡献的可见性；360 总权重封顶 10%–15%，不能单独跨越两个绩效档。"
 zg361m.7.a:0 "只邀请有真实协作的少数评价者，要求具体案例并交叉核验，承担邀评与去重工时。"
 zg361m.7.b:0 "广撒邀评并立刻按高低票加权，迅速放大声量，却给互抬、报复和模板灌水留下空间。"
 zg361m.7.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.7.a.tt:0 "只邀请有真实协作的少数评价者，要求具体案例并交叉核验，承担邀评与去重工时。"
 zg361m.7.b.tt:0 "广撒邀评并立刻按高低票加权，迅速放大声量，却给互抬、报复和模板灌水留下空间。"
 zg361m.7.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.8.t:0 "第008号 · 评价者“手松手紧”与同侪信用"
 zg361m.8.desc:0 "互相抬轿会逐轮贬值，恶意低分可能反噬评价者自己的价值观和管理信誉。"
 zg361m.8.a:0 "维护评价者历史均值、方差、翻案率与命中率，并据此校正权重，承担长期数据治理成本。"
 zg361m.8.b:0 "本轮照单全收原始互评分，待申诉再处罚失真者，能迅速结算但先让手松手紧左右名次。"
 zg361m.8.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.8.a.tt:0 "维护评价者历史均值、方差、翻案率与命中率，并据此校正权重，承担长期数据治理成本。"
 zg361m.8.b.tt:0 "本轮照单全收原始互评分，待申诉再处罚失真者，能迅速结算但先让手松手紧左右名次。"
 zg361m.8.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.9.t:0 "第009号 · 校准会驾驶舱"
 zg361m.9.desc:0 "最终仍由你作出“为什么是他，不是别人”的人事决定；其他主管会按数据、关系、性格和财政争档位。"
 zg361m.9.a:0 "在驾驶舱并列展示绩效指标、价值观、目标、360、趋势与申诉证据。"
 zg361m.9.b:0 "只按当前总分和剩余配额在一场会上拍板，快速关榜，但边界人物与隐形贡献容易被挤掉。"
 zg361m.9.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.9.a.tt:0 "在驾驶舱并列展示绩效指标、价值观、目标、360、趋势与申诉证据，所有翻档都以配额中性的交换留痕。"
 zg361m.9.b.tt:0 "只按当前总分和剩余配额在一场会上拍板，快速关榜，但边界人物与隐形贡献容易被挤掉。"
 zg361m.9.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.10.t:0 "第010号 · 末档归属与护人"
 zg361m.10.desc:0 "被列入末档者产生怨恨、申诉和流失风险；护人会让上司认为管理者“分布失真”，但提高团队忠诚。"
 zg361m.10.a:0 "按冻结硬证据确定末位；若护人则由经理公开支付威望和下轮管理绩效指标。"
 zg361m.10.b:0 "把末档直接压给新人或边缘人以满足配额，立即完成分布，却积累申诉、怨恨和流失风险。"
 zg361m.10.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.10.a.tt:0 "按冻结硬证据确定末位；若护人则由经理公开支付威望和下轮管理绩效指标，保留团队信任但承担制度债。"
 zg361m.10.b.tt:0 "把末档直接压给新人或边缘人以满足配额，立即完成分布，却积累申诉、怨恨和流失风险。"
 zg361m.10.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.11.t:0 "第011号 · 隔级校准与人事监督席"
 zg361m.11.desc:0 "压制护犊子和恶意打压，同时制造“业务经理与人事监督席”的权力矛盾。"
 zg361m.11.a:0 "让隔级上司只审分布、极端证据和程序。"
 zg361m.11.b:0 "由隔级席当场点改孙级档位以快速纠偏，省去退回流程，却破坏直属评分权并制造越级寻租。"
 zg361m.11.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.11.a.tt:0 "让隔级上司只审分布、极端证据和程序，并把缺证榜单退回直属经理重做，支付一次复会成本。"
 zg361m.11.b.tt:0 "由隔级席当场点改孙级档位以快速纠偏，省去退回流程，却破坏直属评分权并制造越级寻租。"
 zg361m.11.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.12.t:0 "第012号 · 利益冲突与回避"
 zg361m.12.desc:0 "不回避可短期保人/踩人，但提高申诉翻案率和管理者自身被扣分的风险。"
 zg361m.12.a:0 "校准前披露亲族、恩怨与恩主关系，由独立复核席替代回避者，承担组席和延时成本。"
 zg361m.12.b:0 "允许经理公开坚持或暗中操作以迅速保人踩人；但显著提高翻案和自身扣分风险。"
 zg361m.12.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.12.a.tt:0 "校准前披露亲族、恩怨与恩主关系，由独立复核席替代回避者，承担组席和延时成本。"
 zg361m.12.b.tt:0 "允许经理公开坚持或暗中操作以迅速保人踩人，短期掌控结果，却显著提高翻案和自身扣分风险。"
 zg361m.12.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.13.t:0 "第013号 · 透明 / 半透明 / 黑箱公示制度"
 zg361m.13.desc:0 "透明提高公平感但加剧竞争和羞辱；黑箱减少公开冲突却加剧猜忌、向上管理与申诉。"
 zg361m.13.a:0 "向本人开放冻结理由和申诉路径，向团队公开档位与汇总口径，并为敏感互评建立权限隔离。"
 zg361m.13.b:0 "只口头告知本人最终档位并封闭理由，能压低公开冲突，却把猜忌、向上管理和申诉推高。"
 zg361m.13.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.13.a.tt:0 "向本人开放冻结理由和申诉路径，向团队公开档位与汇总口径，并为敏感互评建立权限隔离。"
 zg361m.13.b.tt:0 "只口头告知本人最终档位并封闭理由，能压低公开冲突，却把猜忌、向上管理和申诉推高。"
 zg361m.13.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.14.t:0 "第014号 · 绩效申诉案卷"
 zg361m.14.desc:0 "成功则回到直属上司重校准，逐笔退回 3.25 已缴的地方国库、个人金币与贤能，并立即停止尚未结束的一年俸禄 -25%，同时修正榜单；失败会消耗关系/威望，恶意申诉伤信用。"
 zg361m.14.a:0 "按错误类型收冻结证据；承担案卷工时。"
 zg361m.14.b:0 "由原上司当场驳回或凭印象快速改档，立刻止争，却可能二次处罚、错退钱并坐实利益冲突。"
 zg361m.14.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.14.a.tt:0 "按错误类型收冻结证据，先沟通再独立复核，并逐项登记重校准、三笔即时退款与俸禄止扣，承担案卷工时。"
 zg361m.14.b.tt:0 "由原上司当场驳回或凭印象快速改档，立刻止争，却可能二次处罚、错退钱并坐实利益冲突。"
 zg361m.14.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.15.t:0 "第015号 · 绩效改进计划改进任务书"
 zg361m.15.desc:0 "成功减轻低绩效连击并给下轮有限补正；失败/超时升级降岗或退出；拒绝绩效改进计划本身成为下一轮重大负面证据。"
 zg361m.15.a:0 "与当事人协商其权限内的可验证里程碑、支持与复盘点。"
 zg361m.15.b:0 "直接下达高压里程碑和硬期限，并把拒绝记为重大负面证据，见效快但更像预设退出。"
 zg361m.15.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.15.a.tt:0 "与当事人协商其权限内的可验证里程碑、支持与复盘点，花资源换一次真正可完成的改进机会。"
 zg361m.15.b.tt:0 "直接下达高压里程碑和硬期限，并把拒绝记为重大负面证据，见效快但更像预设退出。"
 zg361m.15.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.16.t:0 "第016号 · 绩效改进计划支持预算与“只给指标不给资源”"
 zg361m.16.desc:0 "支持提高可完成性但消耗组织资源；不给支持若最终失败，会成为申诉证据并降低上司管理绩效指标。"
 zg361m.16.a:0 "为绩效改进计划配导师、临时治理资源和定期关注；承担预算以检验真实改善。"
 zg361m.16.b:0 "只给指标不给资源并按期硬验收，节省当期预算，却让失败成为申诉证据并反噬经理管理分。"
 zg361m.16.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.16.a.tt:0 "为绩效改进计划配导师、临时治理资源和定期关注，并记录每项投入，承担预算以检验真实改善。"
 zg361m.16.b.tt:0 "只给指标不给资源并按期硬验收，节省当期预算，却让失败成为申诉证据并反噬经理管理分。"
 zg361m.16.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.17.t:0 "第017号 · 末位处置阶梯"
 zg361m.17.desc:0 "激进处置快速提高“人才密度”但造成恐惧、申诉和空岗；保守处置保留经验却让上司质疑管理者。"
 zg361m.17.a:0 "首次低档依次沟通、绩效改进计划、合法调岗；承担培养与空缺规划成本。"
 zg361m.17.b:0 "对末位立即冻结晋升、降岗或撤任以提升人才密度；但制造恐惧、空岗与集中申诉。"
 zg361m.17.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.17.a.tt:0 "首次低档依次沟通、绩效改进计划、合法调岗，连续失败后才降权或释放编制名额，承担培养与空缺规划成本。"
 zg361m.17.b.tt:0 "对末位立即冻结晋升、降岗或撤任以提升人才密度，快速腾位，却制造恐惧、空岗与集中申诉。"
 zg361m.17.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.18.t:0 "第018号 · 个人告身与四重后果清算单"
 zg361m.18.desc:0 "清楚显示本轮绩效、绩效指标、名次、上司、主要理由，以及 3.25 的地方国库 -50、个人金币 -25、贤能 -60、一年俸禄 -25% 四重后果和申诉退款/止扣状态。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.18.a:0 "结算时冻结档位、名次、上司、理由（仅记账）。"
 zg361m.18.b:0 "按打开告身时的现值合并扣缴并即时展示；但会因换上司、余额变化或重开而错算重算（仅记账）。"
 zg361m.18.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.18.a.tt:0 "结算时冻结档位、名次、上司、理由，以及国库、个人金币、贤能三笔即时罚没与一年俸禄减成，逐项标记支付、退款和止扣状态。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.18.b.tt:0 "按打开告身时的现值合并扣缴并即时展示，流程更短，却会因换上司、余额变化或重开而错算重算。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.18.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.19.t:0 "第019号 · 晋升资格门槛"
 zg361m.19.desc:0 "高绩效终于兑现为机会，而不是自动塞头衔；低绩效冻结晋升但不永久抹杀职业生涯。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.19.a:0 "核验业绩、品行、改进状态、年限与空缺后再提包，承担候选审查成本（仅记账）。"
 zg361m.19.b:0 "由提名担保人对本轮明星跳过部分门槛直接提名；但可能制造空心晋升和旧账争议（仅记账）。"
 zg361m.19.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.19.a.tt:0 "逐项核验连续高绩效、价值观、绩效改进计划、任职年限和合法空缺后才允许提包，承担候选审查成本。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.19.b.tt:0 "由提名担保人对本轮明星跳过部分门槛直接提名，迅速留人，却可能制造空心晋升和旧账争议。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.19.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.20.t:0 "第020号 · 晋升包与跨部门答辩"
 zg361m.20.desc:0 "强表达能改善边界判断，却不能让空心材料碾压持续政绩；失败可能“延期晋升”而非清空履历。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.20.a:0 "用冻结治理成果、团队影响和方法沉淀组成晋升包（仅记账）。"
 zg361m.20.b:0 "让恩主主持一次口头陈述快速拍板；但可能让包装压过持续政绩（仅记账）。"
 zg361m.20.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.20.a.tt:0 "用冻结治理成果、团队影响和方法沉淀组成晋升包，由跨部门评委答辩并记录边界判断。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.20.b.tt:0 "让恩主主持一次口头陈述快速拍板，表达出色者更易过关，却可能让包装压过持续政绩。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.20.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.21.t:0 "第021号 · 奖金—调薪矩阵"
 zg361m.21.desc:0 "奖励头部会真实挤占财政；欠赏的连续 3.75 人才会请求转岗或被挖走。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.21.a:0 "事前公布档位—奖金—调薪矩阵并锁定总池；承担当期财政压力（仅记账）。"
 zg361m.21.b:0 "把有限资金集中给少数头档并推迟固定调薪；但积累欠赏、倒挂和被挖风险（仅记账）。"
 zg361m.21.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.21.a.tt:0 "事前公布档位—奖金—调薪矩阵并锁定总池，真实拨款兑现头档，承担当期财政压力。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.21.b.tt:0 "把有限资金集中给少数头档并推迟固定调薪，迅速强化信号，却积累欠赏、倒挂和被挖风险。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.21.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.22.t:0 "第022号 · 软编制名额 / 编制预算"
 zg361m.22.desc:0 "高绩效团队获得人才资源，低绩效团队可能冻结补员；裁掉末位可释放名额，却可能因无替补损害治理。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.22.a:0 "按团队成果、财政与空缺制定年度招募、培养和补员预算（仅记账）。"
 zg361m.22.b:0 "按当前压力和上司偏好临时增编或冻结；但让低曝光团队长期缺人并诱发占坑（仅记账）。"
 zg361m.22.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.22.a.tt:0 "按团队成果、财政与空缺制定年度招募、培养和补员预算，逐项追踪名额用途与回收。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.22.b.tt:0 "按当前压力和上司偏好临时增编或冻结，能迅速支援重点，却让低曝光团队长期缺人并诱发占坑。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.22.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.23.t:0 "第023号 · 编制名额答辩与团队投入产出"
 zg361m.23.desc:0 "夸大成功会暂时拿到资源，后续未兑现则伤管理绩效；瘦身提高短期效率但增加倦怠与单点风险。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.23.a:0 "用目标完成、翻案、流失和财政效率答辩编制名额；承担年度复核工时（仅记账）。"
 zg361m.23.b:0 "凭紧急故事和关系当场借调或加编；但在未兑现时放大编制名额信用与倦怠风险（仅记账）。"
 zg361m.23.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.23.a.tt:0 "用目标完成、翻案、流失和财政效率答辩编制名额，并登记承诺供下轮复核，承担年度复核工时。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.23.b.tt:0 "凭紧急故事和关系当场借调或加编，马上解压，却在未兑现时放大编制名额信用与倦怠风险。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.23.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.24.t:0 "第024号 · 内部活水与转岗博弈"
 zg361m.24.desc:0 "卡住明星会短期保产出、长期伤管理信誉并触发挖角；低绩效转岗成功后按新岗位重新建基线，但旧账不消失。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.24.a:0 "为转岗冻结旧履历、建立新基线并约定交接与补岗（仅记账）。"
 zg361m.24.b:0 "原上司立即卡人或新上司抢人；但留下雪藏、空缺和管理信誉债（仅记账）。"
 zg361m.24.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.24.a.tt:0 "为转岗冻结旧履历、建立新基线并约定交接与补岗，花时间给错岗者和明星合法流动路径。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.24.b.tt:0 "原上司立即卡人或新上司抢人，短期保住或获得产出，却留下雪藏、空缺和管理信誉债。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.24.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.25.t:0 "第025号 · 高绩效人才被挖与反录用邀约"
 zg361m.25.desc:0 "绩效体系产生跨组织人才市场；滥发 3.75 也会抬高自己的留人成本。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.25.a:0 "只对有合法空缺且晋升停滞的连续头档发有成本的书面邀请（仅记账）。"
 zg361m.25.b:0 "广挖可见明星并用晋升口头承诺抢人；但推高薪酬、空心承诺和团队报复（仅记账）。"
 zg361m.25.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.25.a.tt:0 "只对有合法空缺且晋升停滞的连续头档发有成本的书面邀请，并让原上司用真实职位或加俸回应。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.25.b.tt:0 "广挖可见明星并用晋升口头承诺抢人，迅速补强，却推高薪酬、空心承诺和团队报复。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.25.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.26.t:0 "第026号 · 真实贡献 / 上司可见度双账"
 zg361m.26.desc:0 "可见度只影响主观分与证据被采纳概率，不直接制造治理成果；高可见低产出短期占优，换上司或审计时容易露馅。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.26.a:0 "分别冻结真实贡献与上司可见度；承担额外核证工时（仅记账）。"
 zg361m.26.b:0 "按本轮汇报质量和关系热度快速分配主观分；但让空心材料暂时胜过治理（仅记账）。"
 zg361m.26.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.26.a.tt:0 "分别冻结真实贡献与上司可见度，并用隔级访谈补查低曝光成果，承担额外核证工时。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.26.b.tt:0 "按本轮汇报质量和关系热度快速分配主观分，立刻奖励会展示者，却让空心材料暂时胜过治理。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.26.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.27.t:0 "第027号 · 跨部门贡献账本"
 zg361m.27.desc:0 "给背靠背 360 和晋升包提供硬证据，也为抢功争议提供同一事实底座。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.27.a:0 "为联合项目冻结责任人、主责、协作者、救火者与阻塞责任人；承担维护成本（仅记账）。"
 zg361m.27.b:0 "由项目责任人独占结果（仅记账）。"
 zg361m.27.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.27.a.tt:0 "为联合项目冻结责任人、主责、协作者、救火者与阻塞责任人，按唯一成果总量分摊并接受维护成本。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.27.b.tt:0 "由项目责任人独占结果，其他人靠事后口供争取份额，结算迅速却鼓励截功和重复申报。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.27.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.28.t:0 "第028号 · 抢功仲裁 / 甩锅复盘"
 zg361m.28.desc:0 "抢功成功提高可见度但伤同侪信用；错误裁决伤管理者信誉并成为申诉理由；认责可保价值观但承担短期绩效指标。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.28.a:0 "给成果或事故设唯一责任编号；承担听证与复盘成本（仅记账）。"
 zg361m.28.b:0 "立即指定一个英雄或替罪羊以结束争执；但伤害同侪信用并给错误裁决留下申诉口（仅记账）。"
 zg361m.28.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.28.a.tt:0 "给成果或事故设唯一责任编号，依据贡献账本、证人和冻结版本分责，承担听证与复盘成本。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.28.b.tt:0 "立即指定一个英雄或替罪羊以结束争执，快速稳定叙事，却伤害同侪信用并给错误裁决留下申诉口。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.28.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.29.t:0 "第029号 · 指标包装、造假与京察审计"
 zg361m.29.desc:0 "刷税收/治安数字带来短期绩效指标和延迟领地代价；查实虚报会追回奖励、加绩效改进计划、降低价值观，并反噬包庇者。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.29.a:0 "从真实治理基线抽查指标；承担审计预算（仅记账）。"
 zg361m.29.b:0 "先按亮眼税收或治安数字发分；但放大延迟损失和造假收益（仅记账）。"
 zg361m.29.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.29.a.tt:0 "从真实治理基线抽查指标，记录刷数副作用并在查实时追奖问责包庇者，承担审计预算。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.29.b.tt:0 "先按亮眼税收或治安数字发分，只有爆雷才深查，能刺激短期数字，却放大延迟损失和造假收益。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.29.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.30.t:0 "第030号 · 资源赛马与抢预算"
 zg361m.30.desc:0 "胜者获得资源和曝光，败者可能重组；如果胜者只会包装而交付失败，下一轮产生更大的管理问责。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.30.a:0 "给竞争团队拨小规模试点并用统一里程碑决胜；承担双试点成本（仅记账）。"
 zg361m.30.b:0 "让提名担保人选中一队并一次性押上编制名额与预算；但可能把包装失败放大为组织损失（仅记账）。"
 zg361m.30.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.30.a.tt:0 "给竞争团队拨小规模试点并用统一里程碑决胜，冻结预算守恒与失败回收日期，承担双试点成本。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.30.b.tt:0 "让提名担保人选中一队并一次性押上编制名额与预算，快速形成重点，却可能把包装失败放大为组织损失。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.30.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.31.t:0 "第031号 · 恩主 / 提名担保人网络"
 zg361m.31.desc:0 "提名担保人只提高进入讨论桌的机会，不能改原始绩效指标；恩主倒台会让过度依附者失去可见度和信用。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.31.a:0 "允许恩主把候选送上讨论桌，但必须披露关系、限期背书并保留硬证据门槛（仅记账）。"
 zg361m.31.b:0 "让恩主直接插队晋升、编制名额或复核；但把组织押在人脉与恩主存亡上（仅记账）。"
 zg361m.31.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.31.a.tt:0 "允许恩主把候选送上讨论桌，但必须披露关系、限期背书并保留硬证据门槛。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.31.b.tt:0 "让恩主直接插队晋升、编制名额或复核，迅速动员权力，却把组织押在人脉与恩主存亡上。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.31.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.32.t:0 "第032号 · 管理者自己的团队绩效"
 zg361m.32.desc:0 "拒办京察的 -50 成为这套管理分的一条重大理由；护人、乱打分、不给资源和高流失会沿直属链向上反馈。"
 zg361m.32.a:0 "用上一轮冻结的目标、京察、翻案、绩效改进计划、留才与编制名额数据考核经理，承担跨周期记账成本。"
 zg361m.32.b:0 "只看本轮团队排名并对拒办、低档和流失立即重罚；但把孙级个案递归成经理罪责。"
 zg361m.32.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.32.a.tt:0 "用上一轮冻结的目标、京察、翻案、绩效改进计划、留才与编制名额数据考核经理，承担跨周期记账成本。"
 zg361m.32.b.tt:0 "只看本轮团队排名并对拒办、低档和流失立即重罚，执行有力，却把孙级个案递归成经理罪责。"
 zg361m.32.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.33.t:0 "第033号 · 管理者画像与可解释理由码"
 zg361m.33.desc:0 "同一个分数遇到不同上司会有不同处置，但个人告身能说明命中了哪类理由，而不是暗骰黑箱。"
 zg361m.33.a:0 "为数据派、护犊型等偏好建立稳定权重和理由码，并用硬证据上限约束，承担解释维护成本。"
 zg361m.33.b:0 "允许上司性格和关系直接压过边界证据以快速处置，人物更强烈，却让同案不同判难以复核。"
 zg361m.33.c:0 "这项制度本局不再提案；记下一笔制度债"
