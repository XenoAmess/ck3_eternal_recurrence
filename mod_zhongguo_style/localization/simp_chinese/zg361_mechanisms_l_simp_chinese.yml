 zg361m.355.t:0 "第355号 · 高绩效目标棘轮"
 zg361m.355.desc:0 "重棘轮提高表面挑战，却诱发员工压产出、拒绝救火和只求刚好达标；合理加码需同步资源或权力。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
