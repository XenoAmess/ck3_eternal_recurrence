 zg361m.361.desc:0 "宪章统一配额、申诉、奖金、编制名额、经理责任和透明度默认值，但没有“全是好处”的最优解；十年报告持续检验它究竟治理了天下，还是只治理了报表。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
