 zg361m.217.desc:0 "强制统一减少重复建设却可能压死本地需求，自愿采用更真实但扩散慢；采用率不能直接等同价值。"
 zg361m.217.a:0 "只强制底线接口，其余能力凭试点价值争取采用。"
 zg361m.217.b:0 "命令所有团队一次切到统一平台，迅速消灭重复建设。"
