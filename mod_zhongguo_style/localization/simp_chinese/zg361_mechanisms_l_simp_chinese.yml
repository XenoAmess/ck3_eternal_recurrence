 zg361m.34.b.tt:0 "依据本轮档位和天赋快速贴高潜或待退标签，便于集中资源，却让一次结果决定长期命运。"
 zg361m.34.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.35.t:0 "第035号 · 严格 361 / 松绑 361 / 混合门槛"
 zg361m.35.desc:0 "让你亲自看到强制分布提升人才密度与制造内耗的两面性。"
 zg361m.35.a:0 "采用绝对达标线加横向排名的混合制；承担双重校验。"
 zg361m.35.b:0 "严格执行 3-6-1 并强制填满末位；但在全员优秀时也制造牺牲者。"
 zg361m.35.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.35.a.tt:0 "采用绝对达标线加横向排名的混合制，保留分布信号但为全员达标者减轻末位处分，并承担双重校验。"
 zg361m.35.b.tt:0 "严格执行 3-6-1 并强制填满末位，制度最清晰、出榜最快，却在全员优秀时也制造牺牲者。"
 zg361m.35.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.36.t:0 "第036号 · 十年制度报告"
 zg361m.36.desc:0 "你能判断这套制度究竟提高了治理，还是只制造更漂亮的榜和更高的流失率。"
 zg361m.36.a:0 "逐年冻结档位、翻案、绩效改进计划、晋升、编制名额、奖金、流失与真实治理；承担长期统计成本。"
 zg361m.36.b:0 "只公布当前榜和少数亮眼指标；但无法识别漂亮分布背后的流失与治理倒退。"
 zg361m.36.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.36.a.tt:0 "逐年冻结档位、翻案、绩效改进计划、晋升、编制名额、奖金、流失与真实治理，再汇总十年趋势，承担长期统计成本。"
 zg361m.36.b.tt:0 "只公布当前榜和少数亮眼指标，立刻形成政绩叙事，却无法识别漂亮分布背后的流失与治理倒退。"
 zg361m.36.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.37.t:0 "第037号 · 跨团队配额互换"
 zg361m.37.desc:0 "救下本组末位会消耗政治信用或下轮资源；口头让档却不兑现，会形成可追索的校准债务并伤害两位经理关系。"
 zg361m.37.a:0 "允许两队凭贡献、难度和历史欠账交换一个档位，并登记政治信用、资源与下轮偿还义务。"
 zg361m.37.b:0 "禁止协商并强令各队按本地配额落档；但让小队偶然末位和真实团队差异无法纠正。"
 zg361m.37.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.37.a.tt:0 "允许两队凭贡献、难度和历史欠账交换一个档位，并登记政治信用、资源与下轮偿还义务。"
 zg361m.37.b.tt:0 "禁止协商并强令各队按本地配额落档，迅速关榜，却让小队偶然末位和真实团队差异无法纠正。"
 zg361m.37.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.38.t:0 "第038号 · 小样本合池校准"
 zg361m.38.desc:0 "合池更稳定但把本组命运交给外部评委；硬切可保自主权，却提高偶然被列入末档、申诉和离职风险。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.38.a:0 "把小样本与同职能单位合池；承担跨组协调与解释成本（仅记账）。"
 zg361m.38.b:0 "在三四人内照常硬切 361 以保自主权；但大幅提高偶然被列入末档、申诉和离职（仅记账）。"
 zg361m.38.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.38.a.tt:0 "把小样本与同职能单位合池，或由外部席按绝对门槛暂缓强排，承担跨组协调与解释成本。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.38.b.tt:0 "在三四人内照常硬切 361 以保自主权，省去合池，却大幅提高偶然被列入末档、申诉和离职。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.38.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.39.t:0 "第039号 · 分母管理与名单锁定"
 zg361m.39.desc:0 "把强者移出分母能保护本组头档，把弱者塞入分母能替人承担末档；审计发现临时调名单会扣管理绩效并重开校准。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.39.a:0 "校准前冻结借调、缺勤、转入和离任人员名单（仅记账）。"
 zg361m.39.b:0 "在截止前临时移出强者或塞入弱者以填配额；但可能触发重开校准和管理问责（仅记账）。"
 zg361m.39.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.39.a.tt:0 "校准前冻结借调、缺勤、转入和离任人员名单，任何变更都须正式理由与审计轨迹。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.39.b.tt:0 "在截止前临时移出强者或塞入弱者以填配额，能立刻保护核心，却可能触发重开校准和管理问责。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.39.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.40.t:0 "第040号 · 用离职者填末档的灰色操作"
 zg361m.40.desc:0 "现团队短期皆大欢喜，但该名额若被审计为“死人头”，管理者承担分布造假、错误补岗和人才判断失真。"
 zg361m.40.a:0 "按离任者实际冻结表现评级；承担真实空缺和配额压力。"
 zg361m.40.b:0 "把末位记给即将离开的人；但留下分布造假、错配补缺和人才判断失真。"
 zg361m.40.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.40.a.tt:0 "按离任者实际冻结表现评级，并把组织裁撤、离职与补岗分账，承担真实空缺和配额压力。"
 zg361m.40.b.tt:0 "把末位记给即将离开的人，让现团队迅速全员过关，却留下分布造假、错配补缺和人才判断失真。"
 zg361m.40.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.41.t:0 "第041号 · 新人保护、参评与献祭三路线"
 zg361m.41.desc:0 "保护降低新人恐惧但压缩老员工名额；完整参评提高竞争，新人被献祭则打击导师、招募口碑和经理自己的育人分。"
 zg361m.41.a:0 "首轮把新人从配额中保护出来；承担培养与老员配额压力。"
 zg361m.41.b:0 "新人立即完整参评并优先承担末位；但伤害导师成绩、招募口碑和新人留存。"
 zg361m.41.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.41.a.tt:0 "首轮把新人从配额中保护出来，另设爬坡目标、导师和次轮纳入日期，承担培养与老员配额压力。"
 zg361m.41.b.tt:0 "新人立即完整参评并优先承担末位，最快填满末档名额，却伤害导师成绩、招募口碑和新人留存。"
 zg361m.41.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.42.t:0 "第042号 · 轮流承担末档的跨周期合谋"
 zg361m.42.desc:0 "轮值降低短期内耗，却让绩效失去区分度；毁约会造成强烈怨恨，抽查出固定轮转模式则整组互评信用下调。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.42.a:0 "跨周期抽查固定轮转模式（仅记账）。"
 zg361m.42.b:0 "发现疑似轮流承担末档就整组降权并立即拆约；但可能误伤真实波动并激化毁约怨恨（仅记账）。"
 zg361m.42.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.42.a.tt:0 "跨周期抽查固定轮转模式，重建个人证据并调解补偿承诺，花复核工时恢复评级区分度。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.42.b.tt:0 "发现疑似轮流承担末档就整组降权并立即拆约，迅速震慑合谋，却可能误伤真实波动并激化毁约怨恨。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.42.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.43.t:0 "第043号 · 校准会发言席与注意力预算"
 zg361m.43.desc:0 "没被讲到的人更依赖硬证据；每次越时争辩会提高某人翻档概率，同时消耗上司耐心和经理政治资本。"
 zg361m.43.a:0 "预分少量发言席，要求边界候选人的书面证据并记录经理使用的注意力和政治资本。"
 zg361m.43.b:0 "允许经理为亲信持续越时争辩直到翻档；但挤掉沉默贡献者并耗尽上司耐心。"
 zg361m.43.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.43.a.tt:0 "预分少量发言席，要求边界候选人的书面证据并记录经理使用的注意力和政治资本。"
 zg361m.43.b.tt:0 "允许经理为亲信持续越时争辩直到翻档，可能快速救下一人，却挤掉沉默贡献者并耗尽上司耐心。"
 zg361m.43.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.44.t:0 "第044号 · 盲审初排、实名复议"
 zg361m.44.desc:0 "盲审压低裙带和仇怨，却可能误判不可量化的救火工作；两阶段差异过大时自动暴露潜在偏见供复核。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.44.a:0 "先隐藏姓名与关系按证据初排；承担双轮工时（仅记账）。"
 zg361m.44.b:0 "从头实名并由熟悉业务的上司一次定序；但让裙带、仇怨和声量提前进入结果（仅记账）。"
 zg361m.44.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.44.a.tt:0 "先隐藏姓名与关系按证据初排，再实名补看岗位难度，并把两阶段差异送复核，承担双轮工时。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.44.b.tt:0 "从头实名并由熟悉业务的上司一次定序，出榜更快，却让裙带、仇怨和声量提前进入结果。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.44.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.45.t:0 "第045号 · “不得惊讶”反馈债"
 zg361m.45.desc:0 "没有期中反馈却年末判 3.25，会显著提高申诉成功率并扣经理管理分；滥发警告则损伤士气和反馈信用。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.45.a:0 "问题出现即记录事实、辅导和下属回应；承担持续反馈与确认工时（仅记账）。"
 zg361m.45.b:0 "年终首次亮出 3.25 并以结果硬压接受；但显著增加翻案和经理反馈债（仅记账）。"
 zg361m.45.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.45.a.tt:0 "问题出现即记录事实、辅导和下属回应，并在终评前复查改进，承担持续反馈与确认工时。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.45.b.tt:0 "年终首次亮出 3.25 并以结果硬压接受，迅速结束难谈话，却显著增加翻案和经理反馈债。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.45.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.46.t:0 "第046号 · 机会分配审计"
 zg361m.46.desc:0 "长期把好项目给亲信再称其“高潜”会被识别；校正只能解释表现，不能把失败者直接送进 3.75。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.46.a:0 "校准前审计富庶领地、关键项目、援军和曝光机会（仅记账）。"
 zg361m.46.b:0 "坚持只看最终结果并快速奖励获好机会者；但把偏爱循环包装成高潜和高绩效（仅记账）。"
 zg361m.46.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.46.a.tt:0 "校准前审计富庶领地、关键项目、援军和曝光机会，承认不均并只做有上限的难度校正。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.46.b.tt:0 "坚持只看最终结果并快速奖励获好机会者，维持简单标准，却把偏爱循环包装成高潜和高绩效。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.46.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.47.t:0 "第047号 · 近因偏差与证据时间窗"
 zg361m.47.desc:0 "近期加权鼓励年底冲刺和藏雷，全年等权更稳但反应迟缓；制度切换只影响新周期，不重算旧榜。"
 zg361m.47.a:0 "周期初冻结全年等权或重大里程碑窗口，并保留早期成果供反驳，承担完整证据存储成本。"
 zg361m.47.b:0 "终评时重押最近一次成败，迅速响应新局势，却鼓励年底冲刺、藏雷并抹去早期贡献。"
 zg361m.47.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.47.a.tt:0 "周期初冻结全年等权或重大里程碑窗口，并保留早期成果供反驳，承担完整证据存储成本。"
 zg361m.47.b.tt:0 "终评时重押最近一次成败，迅速响应新局势，却鼓励年底冲刺、藏雷并抹去早期贡献。"
 zg361m.47.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.48.t:0 "第048号 · 评价者工时与邀评额度"
 zg361m.48.desc:0 "广撒邀请会得到更多声量却降低反馈质量；敷衍模板和超量打分使评价者信用下降，不能靠填表数量刷存在感。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.48.a:0 "限制每人只评真实合作对象（仅记账）。"
 zg361m.48.b:0 "强令所有人广泛互评并按填表量算协作；但产生模板灌水、疲劳和政治邀评（仅记账）。"
 zg361m.48.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.48.a.tt:0 "限制每人只评真实合作对象，抽查案例质量并允许无接触拒评，牺牲覆盖率保护评价工时。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.48.b.tt:0 "强令所有人广泛互评并按填表量算协作，快速补齐数据，却产生模板灌水、疲劳和政治邀评。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.48.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.49.t:0 "第049号 · 封存提交与截止时点"
 zg361m.49.desc:0 "阻止看风向跟票和即时互抬；故意拖延会让自己的证据也可能无人补充，并计入协作履责。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.49.a:0 "互评背靠背封存（仅记账）。"
 zg361m.49.b:0 "截止即永久关门、迟交全部作废；但可能让真实协作无人作证并诱发抢在截止前串供（仅记账）。"
 zg361m.49.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.49.a.tt:0 "互评背靠背封存，迟交仅能用一次信用申请监督补交，并记录补交对证据完整性的影响。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.49.b.tt:0 "截止即永久关门、迟交全部作废，执行最干脆，却可能让真实协作无人作证并诱发抢在截止前串供。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.49.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.50.t:0 "第050号 · 互相抬轿契约与背叛"
 zg361m.50.desc:0 "合谋未暴露时能推高边界判断，但相关系数异常会双双降权；背叛赢得短期合规信用，却结下私人仇怨。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.50.a:0 "用互惠相关性筛查评价对；承担反串谋分析与听证成本（仅记账）。"
 zg361m.50.b:0 "对疑似互抬者立即双双降权或奖励先揭发者；但刺激抢先背叛和虚假举报（仅记账）。"
 zg361m.50.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.50.a.tt:0 "用互惠相关性筛查评价对，再抽取共同项目证据核验，承担反串谋分析与听证成本。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.50.b.tt:0 "对疑似互抬者立即双双降权或奖励先揭发者，迅速破盟，却刺激抢先背叛和虚假举报。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.50.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.51.t:0 "第051号 · 可推断匿名与最小样本阈值"
 zg361m.51.desc:0 "保护举报者会降低细节，强行公开可提高可操作性但制造报复风险；猜出作者后报复会进入独立审计。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.51.a:0 "不足最小样本时合并摘要、延后披露或征得署名（仅记账）。"
 zg361m.51.b:0 "立即公开少量匿名原话以便行动；但让作者可被推断并产生报复与寒蝉效应（仅记账）。"
 zg361m.51.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.51.a.tt:0 "不足最小样本时合并摘要、延后披露或征得署名，并维护反馈权限，牺牲细节保护评价者。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.51.b.tt:0 "立即公开少量匿名原话以便行动，信息更尖锐，却让作者可被推断并产生报复与寒蝉效应。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.51.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.52.t:0 "第052号 · 保留评价形状，不只看均分"
 zg361m.52.desc:0 "同样 3.5 均分可以指向可靠协作者、对上不对下或跨部门冲突者，产生不同辅导、晋升和管理风险。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.52.a:0 "保存各来源分布与两极结构；承担更多分析而不把差异压成均分（仅记账）。"
 zg361m.52.b:0 "把所有互评取一个均分直接入榜；但把可靠协作者和对上不对下者混为一类（仅记账）。"
 zg361m.52.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.52.a.tt:0 "保存各来源分布与两极结构，对上下评价冲突另开追问，承担更多分析而不把差异压成均分。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.52.b.tt:0 "把所有互评取一个均分直接入榜，比较最迅速，却把可靠协作者和对上不对下者混为一类。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.52.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.53.t:0 "第053号 · 360 只作发展、不入奖金的制度路线"
 zg361m.53.desc:0 "与奖金脱钩会提高坦诚度但降低填写认真度；直接挂钩更有分量，也更容易催生结盟、报复与匿名黑箱。"
 zg361m.53.a:0 "将 360 用于发展建议和价值观红线；承担另行辅导却换取更坦诚反馈。"
 zg361m.53.b:0 "把互评分直接挂入奖金和档位以提高填写分量；但催生结盟、报复与匿名黑箱。"
 zg361m.53.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.53.a.tt:0 "将 360 用于发展建议和价值观红线，奖金仍由冻结绩效决定，承担另行辅导却换取更坦诚反馈。"
 zg361m.53.b.tt:0 "把互评分直接挂入奖金和档位以提高填写分量，立刻强化约束，却催生结盟、报复与匿名黑箱。"
 zg361m.53.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.54.t:0 "第054号 · 汇报工时挤占真实产出"
 zg361m.54.desc:0 "材料越精美越容易被看见，但治理进度相应受损；长期只奖励包装会把整个团队推向低产出的汇报均衡。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.54.a:0 "限定一页事实卡和异常上报；承担模板设计与经理深读成本（仅记账）。"
 zg361m.54.b:0 "要求所有人每周提交精美长材料来强化可见度；但把治理工时挤成汇报竞赛（仅记账）。"
 zg361m.54.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.54.a.tt:0 "限定一页事实卡和异常上报，为办事工时设保护线并抽查事实，承担模板设计与经理深读成本。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.54.b.tt:0 "要求所有人每周提交精美长材料来强化可见度，短期信息充足，却把治理工时挤成汇报竞赛。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.54.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.55.t:0 "第055号 · 上司注意力席位"
 zg361m.55.desc:0 "获得席位提高证据被采纳率，不会创造硬成绩；反复占席而无交付会反噬信誉并挤压真正救火者。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.55.a:0 "按风险、里程碑和长期低曝光轮换深读与接见席位；承担排期成本（仅记账）。"
 zg361m.55.b:0 "让提名担保人和最会争取者随时插队；但挤掉救火者并奖励无交付占席（仅记账）。"
