 zg361m.72.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.73.t:0 "第073号 · 恶意泄密与善意吹哨分流"
 zg361m.73.desc:0 "揭出真实问题者受保护并触发专项审计；篡改、断章取义或卖给竞争团队者受罚，不能把所有泄密都包装成正义。"
 zg361m.73.a:0 "由独立席核验材料真伪、公益目的和报复成分；承担专项调查成本。"
 zg361m.73.b:0 "把所有未经授权的泄露一律定为违纪并立即处罚，迅速恢复保密，却压住真实造假线索。"
 zg361m.73.c:0 "这项制度本局不再提案；记下一笔制度债"
