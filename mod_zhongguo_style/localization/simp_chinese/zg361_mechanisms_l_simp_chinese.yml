 zg361m.70.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.71.t:0 "第071号 · 内部论坛长文与公开升级"
 zg361m.71.desc:0 "公开升级迅速提高隔级关注和同僚站队，也损害双方声誉；硬证据充分时推动重审，纯情绪控诉则可能反噬可信度。"
 zg361m.71.a:0 "穷尽私下沟通和正式申诉后。"
 zg361m.71.b:0 "当事人立即公开实名或匿名爆料争取站队；但同时烧毁双方声誉和内部信任。"
 zg361m.71.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.71.a.tt:0 "穷尽私下沟通和正式申诉后，允许附冻结证据的实名长文进入受控复核，并投入调解与事实核查。"
 zg361m.71.b.tt:0 "当事人立即公开实名或匿名爆料争取站队，能迅速获得高层注意，却同时烧毁双方声誉和内部信任。"
 zg361m.71.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.72.t:0 "第072号 · 提前泄露绩效档位"
 zg361m.72.desc:0 "被提醒者获得准备材料的先机；泄露会引发抢跑离职、互评串供和校准信任下降，查出来源则扣管理信誉。"
 zg361m.72.a:0 "限制校准材料权限、记录访问并统一送达时间，让所有人同步准备申诉，承担保密管理成本。"
 zg361m.72.b:0 "私下提醒亲信或向全队放风试探反应，能提前控场，却引发抢跑离职、串供和校准席互疑。"
 zg361m.72.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.72.a.tt:0 "限制校准材料权限、记录访问并统一送达时间，让所有人同步准备申诉，承担保密管理成本。"
