 zg361m.74.t:0 "第074号 · 诚实裁撤与“洗成绩裁人”"
 zg361m.74.desc:0 "诚实裁撤花国库、伤短期士气但不污染个人履历；洗成绩更便宜，若翻案则追回处分、重创制度信任并问责两级经理。"
 zg361m.74.a:0 "按组织原因公开撤岗、由国库支付离开代价并保留中性履历，花钱换干净的绩效账。"
 zg361m.74.b:0 "先塞 3.25 再以个人不胜任低成本裁撤；但在翻案时追回处分并重创两级经理信誉。"
 zg361m.74.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.74.a.tt:0 "按组织原因公开撤岗、由国库支付离开代价并保留中性履历，花钱换干净的绩效账。"
 zg361m.74.b.tt:0 "先塞 3.25 再以个人不胜任低成本裁撤，迅速缩编，却在翻案时追回处分并重创两级经理信誉。"
 zg361m.74.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.75.t:0 "第075号 · 保履历自愿离开包"
 zg361m.75.desc:0 "快速降本会真花组织金币且流失经验；强迫“自愿”若有证据，会被重新认定为程序性裁撤。"
 zg361m.75.a:0 "给边界末位真实离开俸、中性履历和清晰编制名额释放，承担国库支出并让其自由拒绝。"
 zg361m.75.b:0 "限时要求无补偿自愿离开，否则立即进入绩效改进计划，能快速降本，却容易被认定为强迫裁撤。"
 zg361m.75.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.75.a.tt:0 "给边界末位真实离开俸、中性履历和清晰编制名额释放，承担国库支出并让其自由拒绝。"
 zg361m.75.b.tt:0 "限时要求无补偿自愿离开，否则立即进入绩效改进计划，能快速降本，却容易被认定为强迫裁撤。"
 zg361m.75.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.76.t:0 "第076号 · 程序失败的多级责任"
 zg361m.76.desc:0 "不再让一线经理或人事部门单独背锅；责任比例写入各自下一轮管理分，但孙级个体分仍由直属链重做。"
 zg361m.76.a:0 "翻案后按漏证、失察、制度错误和虚报逐项分责，并写入各自下轮管理分，承担联合复盘。"
 zg361m.76.b:0 "让直属经理或政委一人背下全部程序失败以迅速结案；但掩盖系统缺陷并诱发甩锅。"
 zg361m.76.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.76.a.tt:0 "翻案后按漏证、失察、制度错误和虚报逐项分责，并写入各自下轮管理分，承担联合复盘。"
 zg361m.76.b.tt:0 "让直属经理或政委一人背下全部程序失败以迅速结案，问责清晰，却掩盖系统缺陷并诱发甩锅。"
 zg361m.76.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.77.t:0 "第077号 · 独立复核人轮换"
 zg361m.77.desc:0 "独立复核更可信但耗费管理工时，原班复核更快却降低翻案公信力；复核人也会因草率结论积累质量记录。"
 zg361m.77.a:0 "从无直接关系的同级经理中轮换复核席；承担人力成本。"
 zg361m.77.b:0 "由原校准席快速自纠并限制新证据；但让同一批人维护自身结论、降低公信力。"
 zg361m.77.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.77.a.tt:0 "从无直接关系的同级经理中轮换复核席，给双方一次有因回避并记录复核质量，承担人力成本。"
 zg361m.77.b.tt:0 "由原校准席快速自纠并限制新证据，节省管理工时，却让同一批人维护自身结论、降低公信力。"
 zg361m.77.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.78.t:0 "第078号 · 分布公平性仪表盘"
 zg361m.78.desc:0 "经理可主动修正机会分配或解释业务原因；长期异常且无事实支持，会提高审计、流失和上司扣分概率。"
 zg361m.78.a:0 "按新人、转岗、亲族、派系、岗位和年限展示多年差异。"
 zg361m.78.b:0 "一旦某组比例异常就强制调档或处罚经理；但把小样本和真实业务差异误判为歧视。"
 zg361m.78.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.78.a.tt:0 "按新人、转岗、亲族、派系、岗位和年限展示多年差异，并联查机会分配，只把异常送人工解释。"
 zg361m.78.b.tt:0 "一旦某组比例异常就强制调档或处罚经理，纠偏最快，却把小样本和真实业务差异误判为歧视。"
 zg361m.78.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.79.t:0 "第079号 · 隔级接待日"
 zg361m.79.desc:0 "降低信息截留，却会增加越级政治；接待日只产生证据和调查任务，高层不能在现场直接承诺孙级档位。"
 zg361m.79.a:0 "每轮开放少量预约席；承担高层时间且不现场改档。"
 zg361m.79.b:0 "高层接见时直接承诺资源或点改孙级档位，快速回应民意，却架空直属经理并刺激越级政治。"
 zg361m.79.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.79.a.tt:0 "每轮开放少量预约席，只收障碍、成果和申诉线索并生成调查任务，承担高层时间且不现场改档。"
 zg361m.79.b.tt:0 "高层接见时直接承诺资源或点改孙级档位，快速回应民意，却架空直属经理并刺激越级政治。"
 zg361m.79.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.80.t:0 "第080号 · 公开指标缺陷单"
 zg361m.80.desc:0 "及时修复获得制度贡献，不因承认缺陷受罚；压下后爆雷则将个人刷分转为设计者和包庇者的共同责任。"
 zg361m.80.a:0 "公开登记可刷、冲突或失真的指标缺陷。"
 zg361m.80.b:0 "要求责任人立即关闭缺陷单、维持现指标到考核后；但让爆雷责任扩散到设计者。"
 zg361m.80.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.80.a.tt:0 "公开登记可刷、冲突或失真的指标缺陷，由责任人修复或书面接受风险，并保存发现者制度贡献。"
 zg361m.80.b.tt:0 "要求责任人立即关闭缺陷单、维持现指标到考核后，短期保住可比口径，却让爆雷责任扩散到设计者。"
 zg361m.80.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.81.t:0 "第081号 · 绩效信息层级压缩"
 zg361m.81.desc:0 "层级越多越容易截功和失真，中央全看则增加行政负担与黑箱恐惧；你需在速度、隐私和纠偏能力间取舍。"
 zg361m.81.a:0 "按角色开放原始证据、逐级汇总和中央复核权限；承担权限与隐私治理成本。"
 zg361m.81.b:0 "强令每层只上报一张排名摘要以加快决策；但放大截功、失真和无法纠偏的黑箱。"
 zg361m.81.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.81.a.tt:0 "按角色开放原始证据、逐级汇总和中央复核权限，并记录谁看过什么，承担权限与隐私治理成本。"
 zg361m.81.b.tt:0 "强令每层只上报一张排名摘要以加快决策，信息流最短，却放大截功、失真和无法纠偏的黑箱。"
 zg361m.81.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.82.t:0 "第082号 · 总回报配方"
 zg361m.82.desc:0 "所有奖励都由地方/上级国库流向个人金币，不凭空造钱；高浮动强化 361 刺激，也放大焦虑、抢功和财务波动。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.82.a:0 "拆分固定俸、岗位津贴、绩效、专项和递延奖（仅记账）。"
 zg361m.82.b:0 "把待遇大幅转成当期绩效浮动奖来强化 361；但放大焦虑、抢功和财政波动（仅记账）。"
 zg361m.82.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.82.a.tt:0 "拆分固定俸、岗位津贴、绩效、专项和递延奖，逐笔由国库拨付并设置可负担上限。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.82.b.tt:0 "把待遇大幅转成当期绩效浮动奖来强化 361，短期刺激强，却放大焦虑、抢功和财政波动。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.82.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.83.t:0 "第083号 · 公司—团队—个人三层奖金系数"
 zg361m.83.desc:0 "明星身处失败团队可能拿不到高奖，普通档身处强团队也能分享成果；调整权重改变合作均衡而不改绩效历史。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.83.a:0 "周期初冻结天朝、团队和个人三层系数；承担复杂结算工时（仅记账）。"
 zg361m.83.b:0 "临时把奖金重押个人档位；但让失败团队的抢功和内部竞争失控（仅记账）。"
 zg361m.83.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.83.a.tt:0 "周期初冻结天朝、团队和个人三层系数，保留团队分享与个人兑现，并承担复杂结算工时。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.83.b.tt:0 "临时把奖金重押个人档位，迅速拉开头档差距，却让失败团队的抢功和内部竞争失控。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.83.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.84.t:0 "第084号 · 递延奖金与分期归属"
 zg361m.84.desc:0 "递延减少当期国库压力并提高留任，却制造未归属金手铐；若从不兑现，组织信用和人才市场吸引力下跌。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.84.a:0 "为长期功赏建立三年分期账；承担未来财政承诺（仅记账）。"
 zg361m.84.b:0 "本轮把奖金全额发清以强刺激留人；但在造假或项目反噬时难以追回并加重当期国库（仅记账）。"
 zg361m.84.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.84.a.tt:0 "为长期功赏建立三年分期账，预留国库、写明离任与反噬条件并逐年兑现，承担未来财政承诺。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.84.b.tt:0 "本轮把奖金全额发清以强刺激留人，结算简单，却在造假或项目反噬时难以追回并加重当期国库。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.84.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.85.t:0 "第085号 · 续期激励断崖"
 zg361m.85.desc:0 "不续期会出现“到点即走”；滥发续期包透支未来国库，并让未获包的同档人员产生薪酬不公。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.85.a:0 "提前跟踪旧奖归属终点；承担长期预算（仅记账）。"
 zg361m.85.b:0 "等人才临近离开才给紧急反录用邀约或口头续期；但制造到点即走、饼债和薪酬不公（仅记账）。"
 zg361m.85.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.85.a.tt:0 "提前跟踪旧奖归属终点，按关键性和继任风险预留续期包并公开同档比较，承担长期预算。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.85.b.tt:0 "等人才临近离开才给紧急反录用邀约或口头续期，短期省钱，却制造到点即走、饼债和薪酬不公。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.85.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.86.t:0 "第086号 · 奖金暂扣与追索"
 zg361m.86.desc:0 "全发激励强但追回困难，暂扣降低造假收益却伤即时激励；临时改规则会成为成功申诉和离职理由。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.86.a:0 "对高风险项目事前写明暂扣比例、审计日和造假追索条件（仅记账）。"
 zg361m.86.b:0 "出现疑点就临时全额扣住或追索已发奖金；但因事后改规则引发申诉和离职（仅记账）。"
 zg361m.86.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.86.a.tt:0 "对高风险项目事前写明暂扣比例、审计日和造假追索条件，并为每笔款项保留结算记录。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.86.b.tt:0 "出现疑点就临时全额扣住或追索已发奖金，迅速保护国库，却因事后改规则引发申诉和离职。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.86.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.87.t:0 "第087号 · 薪酬带宽与带内位置"
 zg361m.87.desc:0 "高绩效但已在带顶者可能只拿奖金不再加固定俸；新招人才高于老臣会触发薪酬倒挂与留才压力。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.87.a:0 "审计资历、市场稀缺、历史绩效和带内位置；承担调薪预算（仅记账）。"
 zg361m.87.b:0 "严格封顶固定俸、只给带顶明星一次奖金；但让高绩效者和被倒挂老臣更易流失（仅记账）。"
 zg361m.87.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.87.a.tt:0 "审计资历、市场稀缺、历史绩效和带内位置，优先修补有证据的低位与倒挂，承担调薪预算。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.87.b.tt:0 "严格封顶固定俸、只给带顶明星一次奖金，迅速守住带宽，却让高绩效者和被倒挂老臣更易流失。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.87.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.88.t:0 "第088号 · 市场调薪与绩效调薪争预算"
 zg361m.88.desc:0 "市场调薪不应伪装成高绩效，绩效调薪也不能解决整体外部竞争力；偏一端会让另一类关键人才流失。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.88.a:0 "把调薪池拆成市场稀缺、3.75 奖励和内部公平三账（仅记账）。"
 zg361m.88.b:0 "把全部调薪押给本轮 3.75 以强化绩效信号；但放任稀缺岗位和倒挂人才被挖（仅记账）。"
 zg361m.88.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.88.a.tt:0 "把调薪池拆成市场稀缺、3.75 奖励和内部公平三账，以证据排队并公布预算取舍。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.88.b.tt:0 "把全部调薪押给本轮 3.75 以强化绩效信号，短期鲜明，却放任稀缺岗位和倒挂人才被挖。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.88.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.89.t:0 "第089号 · 职级、任命、权力与现金解耦"
 zg361m.89.desc:0 "缓解可授予的正式头衔稀缺，但长期“只给级不给钱/只给钱不给权”会形成晋升空心化和离职风险。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.89.a:0 "分别写清加俸、专业级、代理权及空缺的权责与兑现日，承担多轨职位管理成本（仅记账）。"
 zg361m.89.b:0 "先发一个无钱无权的级别或无限期代理名义稳住明星；但积累空心晋升与离职风险（仅记账）。"
 zg361m.89.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.89.a.tt:0 "为加俸、专业级、代理权和正式空缺分别写清权限、现金与兑现日期，承担多轨职位管理成本。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.89.b.tt:0 "先发一个无钱无权的级别或无限期代理名义稳住明星，成本最低，却积累空心晋升与离职风险。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.89.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.90.t:0 "第090号 · 专项即时奖"
 zg361m.90.desc:0 "隐形贡献终于可兑现，又不改终评名次；专项奖过多会绕开 361、掏空国库并被上司质疑分配失控。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.90.a:0 "为救火、跨部门支持和制度建设设独立小池（仅记账）。"
 zg361m.90.b:0 "经理从团队奖金池即时奖赏最显眼的救火者；但可能绕开 361、掏空他人奖金（仅记账）。"
 zg361m.90.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.90.a.tt:0 "为救火、跨部门支持和制度建设设独立小池，凭唯一贡献编号发奖且不改终评名次。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.90.b.tt:0 "经理从团队奖金池即时奖赏最显眼的救火者，激励立刻可见，却可能绕开 361、掏空他人奖金。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.90.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.91.t:0 "第091号 · 年功奖与绩效奖分账"
 zg361m.91.desc:0 "稳定贡献者有留任价值，强制分布仍保有区分；两账同时透明会减少争议，也提高国库承诺成本。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.91.a:0 "把长期服务、艰苦任职和本轮绩效分账分池；承担更高但可解释的国库承诺（仅记账）。"
 zg361m.91.b:0 "只按本轮档位发钱以保持强分布；但让稳定老臣的一次低档抹去全部留任价值（仅记账）。"
 zg361m.91.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.91.a.tt:0 "把长期服务、艰苦任职和本轮绩效分账分池，逐项兑现，承担更高但可解释的国库承诺。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.91.b.tt:0 "只按本轮档位发钱以保持强分布，结算最简单，却让稳定老臣的一次低档抹去全部留任价值。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.91.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.92.t:0 "第092号 · 专业 / 管理双通道"
 zg361m.92.desc:0 "不再把所有明星都逼成经理；两条路线待遇可相当，但管理权、风险和考核表不同。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.92.a:0 "建立待遇可比但权力、风险与量表不同的专家和管理通道（仅记账）。"
 zg361m.92.b:0 "把最强业务明星直接升成经理填补空缺；但可能同时失去专家产出并制造坏管理（仅记账）。"
 zg361m.92.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.92.a.tt:0 "建立待遇可比但权力、风险与量表不同的专家和管理通道，并为转轨提供试任与培训预算。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.92.b.tt:0 "把最强业务明星直接升成经理填补空缺，立刻获得负责人，却可能同时失去专家产出并制造坏管理。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.92.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.93.t:0 "第093号 · 失败经理回归专家岗"
 zg361m.93.desc:0 "回归不会等同人格羞辱和全额降薪；硬撑若继续高翻案、高流失，会升级为真正的管理绩效改进计划。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.93.a:0 "撤去管理权但保留经验证的专业级和合理待遇；承担岗位重配与培养成本（仅记账）。"
 zg361m.93.b:0 "立即全额降岗降俸或逼其继续硬撑管理岗；但可能赶走强专家或升级团队流失（仅记账）。"
 zg361m.93.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.93.a.tt:0 "撤去管理权但保留经验证的专业级和合理待遇，配辅导后再竞聘，承担岗位重配与培养成本。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.93.b.tt:0 "立即全额降岗降俸或逼其继续硬撑管理岗，处置强硬，却可能赶走强专家或升级团队流失。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.93.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.94.t:0 "第094号 · 微职级与“升半级”缓冲"
 zg361m.94.desc:0 "减少“多年零晋升”的断层，但台阶过密会制造通胀、复杂薪酬倒挂和人人等升级的行政负担。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.94.a:0 "只设少量有真实职责、带宽和年限门槛的微职级；承担更复杂的职位管理（仅记账）。"
 zg361m.94.b:0 "频繁发半级称号、把现金与权限以后再说；但制造头衔通胀和饼债（仅记账）。"
 zg361m.94.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.94.a.tt:0 "只设少量有真实职责、带宽和年限门槛的微职级，定期清理通胀，承担更复杂的职位管理。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.94.b.tt:0 "频繁发半级称号、把现金与权限以后再说，能快速安抚晋升焦虑，却制造头衔通胀和饼债。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.94.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.95.t:0 "第095号 · 高级管理任命年度复审"
 zg361m.95.desc:0 "封建头衔不会因此被违规剥夺，但其 361 预算、复核席和人才权限可暂时收紧；管理者也成为被管理者。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.95.a:0 "每年按京察履责、团队结果、翻案、流失和继任复审 361 权限（仅记账）。"
 zg361m.95.b:0 "一轮不佳就立即收走复核席、人才权和预算；但把短期波动变成组织震荡（仅记账）。"
 zg361m.95.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.95.a.tt:0 "每年按京察履责、团队结果、翻案、流失和继任复审 361 权限，必要时辅导或收紧预算而不非法剥夺头衔。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.95.b.tt:0 "一轮不佳就立即收走复核席、人才权和预算，迅速问责高管，却把短期波动变成组织震荡。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.95.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.96.t:0 "第096号 · 破格晋升包"
 zg361m.96.desc:0 "快速留住明星，却透支公平感和未来名额；破格者次年若表现平庸，会反噬提名担保人与评委信用。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.96.a:0 "只用极少额度处理连续超预期或关键战功；承担公平成本（仅记账）。"
 zg361m.96.b:0 "让提名担保人对一次耀眼战功立即跳级晋升；但透支正常名额并把次年风险压给评委（仅记账）。"
 zg361m.96.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.96.a.tt:0 "只用极少额度处理连续超预期或关键战功，说明跳年限理由、被延后人选并次年复审，承担公平成本。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.96.b.tt:0 "让提名担保人对一次耀眼战功立即跳级晋升，快速留住英雄，却透支正常名额并把次年风险压给评委。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.96.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.97.t:0 "第097号 · 跨团队晋升校准"
 zg361m.97.desc:0 "团队内第一不必然战胜跨组织贡献者；经理可以强推亲信，但失败提包次数会影响其人才判断信誉。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.97.a:0 "让各队提交同格式晋升包（仅记账）。"
 zg361m.97.b:0 "按经理声量和各队第一名快速分完晋升槽；但让本地排名压过跨组织贡献（仅记账）。"
 zg361m.97.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.97.a.tt:0 "让各队提交同格式晋升包，由跨组评委比较超出当前职级的影响范围并记录失败提包质量。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.97.b.tt:0 "按经理声量和各队第一名快速分完晋升槽，能及时关会，却让本地排名压过跨组织贡献。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.97.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.98.t:0 "第098号 · 增长、补缺、项目三类编制名额"
 zg361m.98.desc:0 "三类名额有不同期限和验收责任，防止拿“补缺”暗中扩编；项目结束未回收会扣经理资源纪律。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.98.a:0 "把增长、补缺和项目编制名额分别登记用途、期限与验收；承担三套名额管理（仅记账）。"
 zg361m.98.b:0 "把三类名额合成机动池让经理随时挪用；但让临时项目悄然变永久扩编（仅记账）。"
 zg361m.98.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.98.a.tt:0 "把增长、补缺和项目编制名额分别登记用途、期限与验收，转换必须重答辩，承担三套名额管理。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.98.b.tt:0 "把三类名额合成机动池让经理随时挪用，能快速支援热点，却让临时项目悄然变永久扩编。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.98.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.99.t:0 "第099号 · 编制名额到期、结转与年底突击招募"
 zg361m.99.desc:0 "突击招募能保名额却提高错配和试用失败；主动归还短期少人，换取下次申请的预算可信度。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.99.a:0 "按招聘管线决定到期归还或一次有据结转；承担规划缺口（仅记账）。"
 zg361m.99.b:0 "年底仓促招人保住名额和分母；但增加错配、试用失败和导师负担（仅记账）。"
 zg361m.99.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.99.a.tt:0 "按招聘管线决定到期归还或一次有据结转，并把主动归还写入下次预算信用，承担规划缺口。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.99.b.tt:0 "年底仓促招人保住名额和分母，立即避免回收，却增加错配、试用失败和导师负担。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.99.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.100.t:0 "第100号 · 冻结期与关键岗位特批"
 zg361m.100.desc:0 "特批集中资源却制造寻租；把普通岗位包装成关键岗若未兑现，会连累后续所有编制名额申请。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.100.a:0 "冻结增长编制名额，但以岗位风险、承诺项目和安全底线书面特批，并审计低成本替代方案（仅记账）。"
 zg361m.100.b:0 "全面停招；但制造寻租并让普通关键工作断供（仅记账）。"
 zg361m.100.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.100.a.tt:0 "冻结增长编制名额，但以岗位风险、承诺项目和安全底线书面特批，并审计低成本替代方案。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.100.b.tt:0 "全面停招，只给领主亲点的“关键岗”开口，短期稳住财政，却制造寻租并让普通关键工作断供。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.100.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.101.t:0 "第101号 · 一个资深 / 两个普通 / 学徒梯队"
 zg361m.101.desc:0 "资深者见效快但形成单点依赖，梯队成长慢却能产出继任；编制名额不再等价于“多生成一个角色”。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.101.a:0 "按交付时点、单点依赖和继任需求设计资深、中阶与学徒组合（仅记账）。"
 zg361m.101.b:0 "把全部预算押给一个马上能交付的资深者；但抬高议价力并留下无人继任的单点（仅记账）。"
 zg361m.101.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.101.a.tt:0 "按交付时点、单点依赖和继任需求设计资深、中阶与学徒组合，并为梯队预留导师预算。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.101.b.tt:0 "把全部预算押给一个马上能交付的资深者，见效最快，却抬高议价力并留下无人继任的单点。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.101.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.102.t:0 "第102号 · 零基编制重审"
 zg361m.102.desc:0 "能把资源从衰退部门挪向新战略，也会制造周期性不安和汇报风暴；频繁使用降低长期建设意愿。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.102.a:0 "每隔数年只对低效、长期空缺和战略转向岗位做证据化零基重审（仅记账）。"
 zg361m.102.b:0 "每年让所有团队从零抢回全部编制；但制造汇报风暴、不安和短期主义（仅记账）。"
 zg361m.102.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.102.a.tt:0 "每隔数年只对低效、长期空缺和战略转向岗位做证据化零基重审，并为迁移设置过渡预算。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.102.b.tt:0 "每年让所有团队从零抢回全部编制，重分资源最快，却制造汇报风暴、不安和短期主义。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.102.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.103.t:0 "第103号 · 空编占坑审计"
 zg361m.103.desc:0 "占坑保留未来选择权却让当前团队超负荷；查出虚假招聘进度会立即回收并扣编制名额信用。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.103.a:0 "长期空编必须提交真实候选管线、主动归还或限期借出；承担放弃未来选择权的成本（仅记账）。"
 zg361m.103.b:0 "用虚拟候选和反复延期开岗保住名额；但让现团队过载并在查实时失去编制名额信用（仅记账）。"
 zg361m.103.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.103.a.tt:0 "长期空编必须提交真实候选管线、主动归还或限期借出，并按月复核，承担放弃未来选择权的成本。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.103.b.tt:0 "用虚拟候选和反复延期开岗保住名额，短期避免被收回，却让现团队过载并在查实时失去编制名额信用。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.103.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.104.t:0 "第104号 · 新人池 / 成熟人才池之争"
 zg361m.104.desc:0 "新人提高长期梯队但加重导师负担，成熟人才造成薪酬倒挂，内部转岗则把成本和名额争议转给原团队。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.104.a:0 "按长期梯队、即时交付和内部流动组合新人、成熟人才与转岗者（仅记账）。"
 zg361m.104.b:0 "集中购买马上能交付的成熟人才；但造成薪酬倒挂、文化冲突和梯队断层（仅记账）。"
 zg361m.104.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.104.a.tt:0 "按长期梯队、即时交付和内部流动组合新人、成熟人才与转岗者，并分别预算导师、薪酬和补岗。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.104.b.tt:0 "集中购买马上能交付的成熟人才，短期产出最高，却造成薪酬倒挂、文化冲突和梯队断层。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.104.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.105.t:0 "第105号 · 离任后的补岗归属"
 zg361m.105.desc:0 "自动归还鼓励经理放人，中央回收提高结构调整能力；规则模糊会激励卡转岗和把人拖到考核后再放。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.105.a:0 "事前规定名额回原组、中央回收或随责任转移；承担规则维护成本（仅记账）。"
 zg361m.105.b:0 "经理把人卡到考核后再放以保住补岗；但拖延流动并扭曲离任时点（仅记账）。"
 zg361m.105.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.105.a.tt:0 "事前规定名额回原组、中央回收或随责任转移，并把放人与补岗优先联动，承担规则维护成本。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.105.b.tt:0 "经理把人卡到考核后再放以保住补岗，短期守住名额，却拖延流动并扭曲离任时点。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.105.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.106.t:0 "第106号 · 关键岗位与关键人才分离"
 zg361m.106.desc:0 "避免把上司偏爱的明星自动叫作关键人才；岗位风险进入编制名额和继任优先级，个人标签则影响留任投入。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.106.a:0 "先评估岗位空缺冲击（仅记账）。"
 zg361m.106.b:0 "把上司最偏爱的明星直接标成不可替代并集中资源；但掩盖真正岗位风险和替补缺口（仅记账）。"
 zg361m.106.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.106.a.tt:0 "先评估岗位空缺冲击，再单独评估现任可替代性，为关键岗配置继任和留才预算。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.106.b.tt:0 "把上司最偏爱的明星直接标成不可替代并集中资源，迅速稳住关系，却掩盖真正岗位风险和替补缺口。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.106.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.107.t:0 "第107号 · 继任准备度阶梯"
 zg361m.107.desc:0 "有名字不等于可继任；长期无人可接会扣经理育人分并提高岗位空缺时的治理冲击。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.107.a:0 "为关键岗维护现在可接、两年可接、长期培养和无人可接四档（仅记账）。"
 zg361m.107.b:0 "直接点名一位太子为随时可接以迅速消除空白，却可能把关系和潜力标签误当真实准备度（仅记账）。"
 zg361m.107.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.107.a.tt:0 "为关键岗维护现在可接、两年可接、长期培养和无人可接四档，并投入导师、代理任务和曝光。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.107.b.tt:0 "直接点名一位太子为随时可接以迅速消除空白，却可能把关系和潜力标签误当真实准备度。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.107.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.108.t:0 "第108号 · 代理任职试炼"
 zg361m.108.desc:0 "真实试炼更新潜力证据并可能提前暴露不适配；不给权只给责会成为候选申诉和经理育人失败的证据。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.108.a:0 "给候选明确期限、真实权限、资源和成功标准；承担原任监督与试错成本（仅记账）。"
 zg361m.108.b:0 "只把交付责任压给代理者、保留所有否决权；但让失败无法证明能力并构成申诉（仅记账）。"
 zg361m.108.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.108.a.tt:0 "给候选明确期限、真实权限、资源和成功标准，结束后冻结试炼证据，承担原任监督与试错成本。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.108.b.tt:0 "只把交付责任压给代理者、保留所有否决权，以最小风险快速试人，却让失败无法证明能力并构成申诉。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.108.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.109.t:0 "第109号 · 高潜标签的公开层级"
 zg361m.109.desc:0 "公开能提高被选者投入，也制造“太子党”和未入选者流失；秘密降低攀比，却方便经理暗箱雪藏或偏爱。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.109.a:0 "只告知本人及必要上级；承担名单维护与未入选沟通（仅记账）。"
 zg361m.109.b:0 "向全团队公布高潜名单以立即强化投入和竞争，却制造太子党、未入选者流失与经理偏爱（仅记账）。"
 zg361m.109.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.109.a.tt:0 "只告知本人及必要上级，公开标准、复审日期和发展投入，并承担名单维护与未入选沟通。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.109.b.tt:0 "向全团队公布高潜名单以立即强化投入和竞争，却制造太子党、未入选者流失与经理偏爱。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.109.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.110.t:0 "第110号 · 潜力校准与绩效校准分会"
 zg361m.110.desc:0 "高潜低绩效获得培养而非直接 3.75，稳定明星获得当期兑现但未必自动晋升；两张表减少概念偷换。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.110.a:0 "先结算当期 361（仅记账）。"
 zg361m.110.b:0 "在同一会上用一句高潜直接抬档或挤掉稳定明星；但混淆奖金与未来押注（仅记账）。"
 zg361m.110.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.110.a.tt:0 "先结算当期 361，再另会核验学习速度、跨度与未来责任，维护两张冻结表并分别配置奖励和培养。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.110.b.tt:0 "在同一会上用一句高潜直接抬档或挤掉稳定明星，快速集中资源，却混淆奖金与未来押注。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.110.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.111.t:0 "第111号 · 遗憾流失与健康流失分类"
 zg361m.111.desc:0 "遗憾流失扣经理留才和继任分，健康流失释放编制名额；事后出现高成就会反向检验原评级与人才判断。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.111.a:0 "离任时按绩效、关键性、错配和程序争议分类（仅记账）。"
 zg361m.111.b:0 "把所有离开统一报成健康优化以保护本轮经理分；但掩盖留才失败和错误低评（仅记账）。"
 zg361m.111.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.111.a.tt:0 "离任时按绩效、关键性、错配和程序争议分类，并据其后续成就校正原人才判断。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.111.b.tt:0 "把所有离开统一报成健康优化以保护本轮经理分，报表立刻好看，却掩盖留才失败和错误低评。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.111.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.112.t:0 "第112号 · 留任访谈（Stay Interview）"
 zg361m.112.desc:0 "兑现消耗真实资源但降低离开概率；承诺未兑现形成可见的“饼债”，比从未沟通更伤信任。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.112.a:0 "对明星、继任者和不满者做结构化留任访谈（仅记账）。"
 zg361m.112.b:0 "等其提出离开才给高额反录用邀约或口头画饼；但抬高成本并让未兑现承诺伤信任（仅记账）。"
 zg361m.112.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.112.a.tt:0 "对明星、继任者和不满者做结构化留任访谈，只承诺一项可预算的钱、机会、授权或减负并登记兑现。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.112.b.tt:0 "等其提出离开才给高额反录用邀约或口头画饼，短期可能留人，却抬高成本并让未兑现承诺伤信任。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.112.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.113.t:0 "第113号 · 关键人依赖与知识移交"
 zg361m.113.desc:0 "单点英雄短期绩效指标高、议价力强，离开时造成严重冲击；培养副手会分走个人曝光，却提高晋升管理岗的资格。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.113.a:0 "奖励培养副手、制度文档和可复制流程；承担明星分权与带教工时（仅记账）。"
 zg361m.113.b:0 "继续重奖单点英雄救火并用加俸锁住本人；但让其离开或失能时造成巨大冲击（仅记账）。"
 zg361m.113.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.113.a.tt:0 "奖励培养副手、制度文档和可复制流程，把知识移交写入晋升资格，承担明星分权与带教工时。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.113.b.tt:0 "继续重奖单点英雄救火并用加俸锁住本人，短期交付强，却让其离开或失能时造成巨大冲击。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.113.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.114.t:0 "第114号 · 经理“人才输出”积分"
 zg361m.114.desc:0 "把“培养的人被挖走”从纯损失变成部分荣誉；若输出后团队立刻崩溃，仍会暴露继任准备不足。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.114.a:0 "放行优秀人才；但必须同时提交继任计划并承担过渡空缺（仅记账）。"
 zg361m.114.b:0 "以关键交付为由长期卡住明星保当期产出；但损害人才输出分和内部市场信用（仅记账）。"
 zg361m.114.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.114.a.tt:0 "放出优秀人才可获得育人分、补岗优先和跨组信用，但必须同时提交继任计划并承担过渡空缺。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.114.b.tt:0 "以关键交付为由长期卡住明星保当期产出，团队眼下稳定，却损害人才输出分和内部市场信用。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.114.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.115.t:0 "第115号 · 匿名内部应聘"
 zg361m.115.desc:0 "匿名降低经理事前报复和雪藏，却增加突然空缺；最终转出仍走合法任命，不能凭申请瞬移角色或头衔。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.115.a:0 "初筛隐藏申请；承担突然空缺风险换取免报复通道（仅记账）。"
 zg361m.115.b:0 "要求申请前先获原上司批准以保护业务连续；但让卡人和雪藏发生在候选出现之前（仅记账）。"
 zg361m.115.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.115.a.tt:0 "初筛隐藏申请，终面才通知原上司并规划合法交接，承担突然空缺风险换取免报复通道。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.115.b.tt:0 "要求申请前先获原上司批准以保护业务连续，信息最透明，却让卡人和雪藏发生在候选出现之前。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.115.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.116.t:0 "第116号 · 放人时限与一次交接延期"
 zg361m.116.desc:0 "合理延期保护业务，反复拖延则扣人才输出和管理信用；新团队也要承担等待或放弃候选的选择。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.116.a:0 "内部录用后设固定放人期；承担交接与补岗协调（仅记账）。"
 zg361m.116.b:0 "由原上司以业务需要反复拖到项目结束；但可能逼新团队放弃并形成卡人记录（仅记账）。"
 zg361m.116.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.116.a.tt:0 "内部录用后设固定放人期，只准凭关键交付和继任计划延期一次，承担交接与补岗协调。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.116.b.tt:0 "由原上司以业务需要反复拖到项目结束，短期保住产出，却可能逼新团队放弃并形成卡人记录。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.116.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.117.t:0 "第117号 · 转岗爬坡保护期"
 zg361m.117.desc:0 "给错岗人才真正重启机会，同时保留旧履历；爬坡期结束仍不适配时，绩效改进计划或再次流动理由更扎实。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.117.a:0 "为转岗者设置一次岗位化爬坡目标、部分参评比例和到期日（仅记账）。"
 zg361m.117.b:0 "转岗首轮立即完整强排以防保护套利；但可能把学习曲线再次误判成低绩效（仅记账）。"
 zg361m.117.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.117.a.tt:0 "为转岗者设置一次岗位化爬坡目标、部分参评比例和到期日，保留旧履历并投入辅导资源。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.117.b.tt:0 "转岗首轮立即完整强排以防保护套利，迅速检验适配，却可能把学习曲线再次误判成低绩效。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.117.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.118.t:0 "第118号 · 试用期绝对门槛，不占末位配额"
 zg361m.118.desc:0 "团队不能靠让一批新人承担末档来保护老员工；招聘失误会追究招聘经理和导师的责任。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.118.a:0 "事前写明试用胜任门槛（仅记账）。"
 zg361m.118.b:0 "新人未即时达标就快速退出并计入团队末位；但鼓励专招新人充当末档（仅记账）。"
 zg361m.118.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.118.a.tt:0 "事前写明试用胜任门槛，按证据通过、延长辅导或退出，另行追究招聘与导师责任，且不占正式末档名额。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.118.b.tt:0 "新人未即时达标就快速退出并计入团队末位，既腾岗又保护老员，却鼓励专招新人充当末档。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.118.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.119.t:0 "第119号 · 招聘质量追责"
 zg361m.119.desc:0 "低价乱招和只看关系会污染未来编制名额信用；高质量招募提高组织能力，但不能在入职当天提前算功。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.119.a:0 "爬坡后再追究招聘各环节责任，承担延迟核算（仅记账）。"
 zg361m.119.b:0 "只按招聘速度和填满名额立即奖经理；但奖励低价乱招并把失败甩给新人导师（仅记账）。"
 zg361m.119.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.119.a.tt:0 "等新人完成爬坡后，把成功、错岗或失败按证据追记编制名额提出者、选人者与批准者，承担延迟核算。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.119.b.tt:0 "只按招聘速度和填满名额立即奖经理，迅速推动补员，却奖励低价乱招并把失败甩给新人导师。 本项只调整组织账目，不会直接执行具体业务动作。"
 zg361m.119.c.tt:0 "关闭本局内的这项提案；它不会自动再次出现，并会增加一笔制度债。"
 zg361m.120.t:0 "第120号 · 导师与入职融入绩效"
 zg361m.120.desc:0 "新人爬坡速度、留存和独立交付归入导师贡献记录；强者拒绝带人可保个人产出，却限制其管理晋升包。\n\n本次只确定制度取向并调整组织账目；没有具体案卷时，不会直接发放款项，也不会执行任命、招募、调岗或退款。"
 zg361m.120.a:0 "给导师预留结构化带教工时、阶段目标和结果追记（仅记账）。"
 zg361m.120.b:0 "只要求明星导师随问随答、其余时间保个人交付；但让新人爬坡、留存和管理梯队受损（仅记账）。"
 zg361m.120.c:0 "这项制度本局不再提案；记下一笔制度债"
 zg361m.120.a.tt:0 "给导师预留结构化带教工时、阶段目标和结果追记，把新人独立交付计为可验证育人贡献。 本项只调整组织账目，不会直接执行具体业务动作。"
