 zg361m.202.t:0 "第202号 · 复盘行动项责任人"
 zg361m.202.desc:0 "按期关闭形成质量贡献，写完复盘不落实会扣责任人和经理；同一修复不能重复领奖。"
 zg361m.202.a:0 "每项修复指定唯一责任人、支持者、期限和独立验收人。"
 zg361m.202.b:0 "把所有改进愿望列入复盘，由团队按空闲自行认领。"
 zg361m.202.c:0 "这项制度本局不再提案；记下一笔制度债"
