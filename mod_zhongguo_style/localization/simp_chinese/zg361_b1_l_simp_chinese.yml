 zg361b1.200.t:0 "本期成果要怎样写入自评？"
 zg361b1.200.desc:0 "证据窗口即将关闭。你的自陈会与期中记录一同封存，但已经查明的事实不会因此改变。"
 zg361b1.200.a:0 "照实提交期中证据，不修正自评分。"
 zg361b1.200.b:0 "将自评分最多上调 15 点后提交。"
 zg361b1.200.c:0 "将自评分最多下调 15 点后提交。"
 zg361b1.201.t:0 "暂定考绩"
 zg361b1.201.desc:0 "上司已经给出对你本期表现的初步判断。这份判断与冻结事实相差 [ROOT.Char.MakeScope.Var('zg361_b1_shadow_gap_magnitude').GetValue|0]；你有 [ROOT.Char.MakeScope.Var('zg361_b1_shadow_deadline_days').GetValue|0] 日回应。窗口关闭前不会结算奖惩，也不会占用最终档位名额。"
 zg361b1.201.grade_375:0 "当前暂定档位：#P 3.75——超出预期#!。"
 zg361b1.201.grade_35:0 "当前暂定档位：#V 3.5——符合预期#!。"
 zg361b1.201.grade_325:0 "当前暂定档位：#N 3.25——待改进#!。"
 zg361b1.201.a:0 "接受暂定档位，不作校准修正。"
 zg361b1.201.b:0 "核验当前成果，校准分最多变动 10 点。"
 zg361b1.126.t:0 "你的考绩已经张榜"
 zg361b1.126.desc:0 "即使同组还有待决案卷，你的最终档位也不再延后；这是本案第 [ROOT.Char.MakeScope.Var('zg361_b1_local_publish_revision').GetValue|0] 次定稿。奖惩仍按正式结算时间入账，其他官员的待定内容不会在这里公开。"
 zg361b1.126.grade_375:0 "当前公示档位：#P 3.75#!。"
 zg361b1.126.grade_35:0 "当前公示档位：#V 3.5#!。"
 zg361b1.126.grade_325:0 "当前公示档位：#N 3.25#!。"
 zg361b1.126.initial:0 "这是本案在本期的首次定稿。"
 zg361b1.126.appended:0 "此前待决事项已经结清，你的结果现已补入榜册。"
 zg361b1.126.reopened:0 "新证据触发重新审理，本次定稿取代先前结果。"
 zg361b1.126.a:0 "记下本版档位与修订号。"
