l_simp_chinese:
 zg361b1.200.t:0 "封存自评"
 zg361b1.200.desc:0 "证据窗口将闭。你的陈述会与期中记录一同封存：它可以说明成果为何未被看见，却不能改写已经发生的硬事实。"
 zg361b1.200.a:0 "据实陈述，不增不减。"
 zg361b1.200.b:0 "把最耀眼的一面写进案卷。"
 zg361b1.200.c:0 "收敛锋芒，保守自陈。"
 zg361b1.201.t:0 "非最终影子档"
 zg361b1.201.desc:0 "直属上司已经给出暂定评价。冻结差距幅度为 [ROOT.Char.MakeScope.Var('zg361_b1_shadow_gap_magnitude').GetValue|0]，回应窗口为 [ROOT.Char.MakeScope.Var('zg361_b1_shadow_deadline_days').GetValue|0] 天；这份评价尚不发放奖惩，也不占用最终配额。"
 zg361b1.201.grade_375:0 "暂定评价为 #P 3.75——超出预期#!。"
 zg361b1.201.grade_35:0 "暂定评价为 #V 3.5——符合预期#!。"
 zg361b1.201.grade_325:0 "暂定评价为 #N 3.25——待改进#!。"
 zg361b1.201.a:0 "接受这份影子记录。"
 zg361b1.201.b:0 "补交证据，交由校准复核。"
 zg361b1.126.t:0 "你的绩效行已公示"
 zg361b1.126.desc:0 "直属上司已先公示你的稳定结果，不再让无关的待定案卷拖住全组。这是你本人案卷的第 [ROOT.Char.MakeScope.Var('zg361_b1_local_publish_revision').GetValue|0] 次冻结发布；它不会提前发奖，也不会泄露其他人的待定内容。"
 zg361b1.126.grade_375:0 "当前公示档位：#P 3.75#!。"
 zg361b1.126.grade_35:0 "当前公示档位：#V 3.5#!。"
 zg361b1.126.grade_325:0 "当前公示档位：#N 3.25#!。"
 zg361b1.126.initial:0 "这是你这一行第一次稳定公示。"
 zg361b1.126.appended:0 "待定里程碑已经结清，你这一行现已独立追加。"
 zg361b1.126.reopened:0 "新证据触发了逐人重开；本次修订替代先前公示。"
 zg361b1.126.a:0 "至少不用陪整个部门一起等。"
