 zg361pp.5151.t:0 "绩效反馈送达：请本人确认收件"
 zg361pp.5151.desc:0 "案卷同时封存了本轮档位、理由与证据索引，交接双方为[scope:zg361_pp_subject_prompt_owner.GetShortUIName]与[scope:zg361_pp_subject_prompt_subject.GetShortUIName]。申诉时限为 90 日；签收只证明材料到手，不表示认可其中结论。"
 zg361pp.5151.evidence:0 "冻结证据摘要：绩效指标 [ROOT.MakeScope.Var('zg361_pp_t_frozen_kpi').GetValue|0]，队列名次 [ROOT.MakeScope.Var('zg361_pp_t_frozen_rank').GetValue|0]，案卷证据 [ROOT.MakeScope.Var('zg361_pp_t_evidence_component_count').GetValue|0] 项。"
 zg361pp.5151.reason.0:0 "事实档与最终档一致，没有发生校准或配额调整。"
 zg361pp.5151.reason.1:0 "校准交换把当事人从 3.75 档挤出。"
 zg361pp.5151.reason.2:0 "校准交换把当事人抬入 3.75 档。"
 zg361pp.5151.reason.3:0 "校准交换把当事人压入 3.25 档。"
 zg361pp.5151.reason.4:0 "校准交换把当事人从 3.25 档救回。"
 zg361pp.5151.reason.5:0 "事实档高于最终档；强制分布配额将其下调。这不构成错岗证据。"
 zg361pp.5151.reason.6:0 "新人保护规则把当事人抬升一档。"
 zg361pp.5151.reason.7:0 "横向配额规则把当事人抬升一档。"
 zg361pp.5151.reason.8:0 "队列过小，结果按中性档处理。"
 zg361pp.5151.reason.9:0 "灰色离任占用了既有的 3.25 名额。"
 zg361pp.5151.reason.10:0 "原 3.25 承担者与离任者按应得档完成对调。"
 zg361pp.5151.reason.unknown:0 "案卷没有可识别的调整理由；承办记录不会替缺失事实编造解释。"
