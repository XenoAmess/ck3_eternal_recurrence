 zg361pp.160.t:0 "部门预审淘汰赛"
 zg361pp.160.desc:0 "受评官员：[scope:zg361_pp_prompt_subject.GetShortUIName]；裁决者：[scope:zg361_pp_prompt_owner.GetShortUIName]。本案现在处理「部门预审淘汰赛」。选择会立即写入本案；需要后续核验的结果将在第 30 日到期。按钮中的数字与条件是本案采用的制度参数，只有已经存在的付款、证据或人物回执才会被当作既成事实。"
