 zg361pp.153.c:0 "本轮不采纳本项，登记制度债并继续下一项；本项不会自动重提。"
 zg361pp.154.t:0 "录音式完整纪要 / 摘要纪要"
 zg361pp.154.desc:0 "受评官员：[scope:zg361_pp_prompt_subject.GetShortUIName]；裁决者：[scope:zg361_pp_prompt_owner.GetShortUIName]。本案现在处理「录音式完整纪要 / 摘要纪要」。选择会立即写入本案；需要后续核验的结果将在第 7 日到期。按钮中的数字与条件是本案采用的制度参数，只有已经存在的付款、证据或人物回执才会被当作既成事实。"
