 zg361pp.170.t:0 "随机评委与熟人评委"
 zg361pp.170.desc:0 "复跑以同一 seed 得到同一无重复席位。这一步写入的是可复核案卷，不会凭一句‘业务需要’穿越状态机。"
 zg361pp.170.a:0 "从跨部门池按冻结种子抽唯一评委。"
 zg361pp.170.b:0 "接受团队推荐熟人，但候选不得指定多数。"
 zg361pp.170.c:0 "延期，但把负责人、期限和欠账写进案卷。"
 zg361pp.171.t:0 "答辩评委利益回避"
 zg361pp.171.desc:0 "投票器只接受回避后的活跃评委集合。这一步写入的是可复核案卷，不会凭一句‘业务需要’穿越状态机。"
 zg361pp.171.a:0 "披露冲突并用同专业的清洁备选席替换。"
 zg361pp.171.b:0 "隐瞒冲突；发现后整包进入重审债。"
