 zg361pp.149.c.tt:0 "本项暂缓；制度债在第 180 日到期。"
 zg361pp.150.t:0 "“这次先委屈你”的补偿承诺"
 zg361pp.150.desc:0 "当事人的本轮让步已经记入案卷，但所谓日后补偿尚无书面义务和到期状态。本案由[zg361_pp_prompt_owner.GetShortUIName]承办，[zg361_pp_prompt_subject.GetShortUIName]是当事人；第 365 日复核。"
 zg361pp.150.a:0 "建立有资金、有期限的非改档补偿义务。"
 zg361pp.150.b:0 "继续画饼，并公开它仍是未履约债。"
 zg361pp.150.c:0 "本轮不采纳本项，登记制度债并继续下一项；本项不会自动重提。"
 zg361pp.150.a.tt:0 "本项立即入卷；第 365 日复核。直属上司实付公帑五金与私库五金，当事人实收十金。"
 zg361pp.150.b.tt:0 "本项立即入卷；第 365 日复核。"
 zg361pp.150.c.tt:0 "本项暂缓；制度债在第 90 日到期。"
 zg361pp.151.t:0 "签收不等于认同"
 zg361pp.151.desc:0 "送达回执与申诉时钟已经进入案卷，签收、认同与异议仍须分栏保存。本案由[zg361_pp_prompt_owner.GetShortUIName]承办，[zg361_pp_prompt_subject.GetShortUIName]是当事人；第 7、90 日复核。"
 zg361pp.151.a:0 "把送达、认同、异议分别记录，保留申诉。"
