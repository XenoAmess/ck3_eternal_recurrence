 zg361pp.173.desc:0 "评委质量复盘比较不可变盲分与现场分。这一步写入的是可复核案卷，不会凭一句‘业务需要’穿越状态机。"
 zg361pp.173.a:0 "先冻结去身份材料分，再实名现场提问。"
 zg361pp.173.b:0 "直接现场看关系，仍保留书面工件缺口。"
