 zg361pp.172.t:0 "一票否决 / 多数票 / 平均分"
 zg361pp.172.desc:0 "最终决定只消费冻结规则下的一人一票。这一步写入的是可复核案卷，不会凭一句‘业务需要’穿越状态机。"
 zg361pp.172.a:0 "投票前冻结规则；否决必须附可复核理由。"
 zg361pp.172.b:0 "临场改规则帮助目标候选，并留下规则漂移债。"
 zg361pp.172.c:0 "延期，但把负责人、期限和欠账写进案卷。"
