 zg361pp.154.b:0 "保存摘要，但必须保留结果与证据索引。"
 zg361pp.154.c:0 "本轮不采纳本项，登记制度债并继续下一项；本项不会自动重提。"
 zg361pp.155.t:0 "公开表扬与私下批评边界"
 zg361pp.155.desc:0 "受评官员：[scope:zg361_pp_prompt_subject.GetShortUIName]；裁决者：[scope:zg361_pp_prompt_owner.GetShortUIName]。本案现在处理「公开表扬与私下批评边界」。选择会立即写入本案；需要后续核验的结果将在第 1 日到期。按钮中的数字与条件是本案采用的制度参数，只有已经存在的付款、证据或人物回执才会被当作既成事实。"
 zg361pp.155.a:0 "只公开获准成绩，敏感反馈留在本人案卷。"
 zg361pp.155.b:0 "公开点名末位，并承担羞辱与报复成本。"
 zg361pp.155.c:0 "本轮不采纳本项，登记制度债并继续下一项；本项不会自动重提。"
 zg361pp.156.t:0 "团队结果说明会"
 zg361pp.156.desc:0 "受评官员：[scope:zg361_pp_prompt_subject.GetShortUIName]；裁决者：[scope:zg361_pp_prompt_owner.GetShortUIName]。本案现在处理「团队结果说明会」。选择会立即写入本案；需要后续核验的结果将在第 30 日到期。按钮中的数字与条件是本案采用的制度参数，只有已经存在的付款、证据或人物回执才会被当作既成事实。"
