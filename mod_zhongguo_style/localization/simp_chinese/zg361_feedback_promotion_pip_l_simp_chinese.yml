 zg361pp.146.c.tt:0 "本项暂缓；制度债在第 90 日到期。"
 zg361pp.147.t:0 "褒评与批评登记模板"
 zg361pp.147.desc:0 "本轮证据索引已经封存，反馈稿尚未登记褒评、批评条目及其索引关联。本案由[zg361_pp_prompt_owner.GetShortUIName]承办，[zg361_pp_prompt_subject.GetShortUIName]是当事人；第 30 日复核。"
 zg361pp.147.a:0 "按本案模板各登记一条褒评和批评，并关联冻结证据索引。"
 zg361pp.147.b:0 "不区分褒贬依据，登记两句无证据套话。"
 zg361pp.147.c:0 "本轮不采纳本项，登记制度债并继续下一项；本项不会自动重提。"
 zg361pp.147.a.tt:0 "本项立即入卷；第 30 日复核。登记一条褒评和一条批评，并关联本轮冻结证据索引；不据此声称两条内容已经逐项获证。"
 zg361pp.147.b.tt:0 "本项立即入卷；第 30 日复核。"
 zg361pp.147.c.tt:0 "本项暂缓；制度债在第 180 日到期。"
 zg361pp.148.t:0 "先讲证据还是先报结果"
 zg361pp.148.desc:0 "档位与证据均已冻结，面谈纪要尚未记录二者的出示次序及当事人的异议。本案由[zg361_pp_prompt_owner.GetShortUIName]承办，[zg361_pp_prompt_subject.GetShortUIName]是当事人；第 30 日复核。"
 zg361pp.148.a:0 "逐项确认事实，再宣布档位。"
 zg361pp.148.b:0 "先报档位，但不得删改随后展示的证据。"
 zg361pp.148.c:0 "本轮不采纳本项，登记制度债并继续下一项；本项不会自动重提。"
 zg361pp.148.a.tt:0 "本项立即入卷；第 30 日复核。"
