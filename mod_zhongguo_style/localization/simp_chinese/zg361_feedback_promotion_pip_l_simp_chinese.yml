 zg361pp.151.c.tt:0 "本项暂缓；制度债在第 90 日到期。"
 zg361pp.152.t:0 "反馈可行动性评分"
 zg361pp.152.desc:0 "案卷里已有一份反馈稿，但它能否转化为具体、可控、有期限且有资源的行动仍未评分。本案由[zg361_pp_prompt_owner.GetShortUIName]承办，[zg361_pp_prompt_subject.GetShortUIName]是当事人；第 365 日复核。"
 zg361pp.152.a:0 "按具体、可控、期限、资源四项冻结评分。"
