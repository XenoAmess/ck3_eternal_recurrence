 zg361pp.178.b:0 "只凭故事放行，缺工件则延期补齐。"
 zg361pp.178.c:0 "延期，但把负责人、期限和欠账写进案卷。"
 zg361pp.179.t:0 "失败答辩的具体反馈 owner"
 zg361pp.179.desc:0 "下轮材料对照同一 gap，不得无故换口径。这一步写入的是可复核案卷，不会凭一句‘业务需要’穿越状态机。"
 zg361pp.179.a:0 "每条差距绑定一名实际评委和下一证据。"
 zg361pp.179.b:0 "写“再提升影响力”，空话扣评委质量。"
 zg361pp.179.c:0 "延期，但把负责人、期限和欠账写进案卷。"
 zg361pp.180.t:0 "晋升冷却与材料刷新"
 zg361pp.180.desc:0 "重试只复用版本化旧材料并追加新影响。这一步写入的是可复核案卷，不会凭一句‘业务需要’穿越状态机。"
 zg361pp.180.a:0 "冷却一轮；指定差距完成可提前重开。"
 zg361pp.180.b:0 "立即重复消耗评委，并累积评审拥塞。"
 zg361pp.180.c:0 "延期，但把负责人、期限和欠账写进案卷。"
 zg361pp.181.t:0 "能力、意愿、错岗三分诊"
 zg361pp.181.desc:0 "PIP 入口按唯一主类别选择训练、纪律或转岗。这一步写入的是可复核案卷，不会凭一句‘业务需要’穿越状态机。"
 zg361pp.181.a:0 "按证据分诊并把错岗导向真实转岗，不改本轮档位。"
 zg361pp.181.b:0 "一律归为不愿做，生成误诊与申诉风险。"
 zg361pp.181.c:0 "延期，但把负责人、期限和欠账写进案卷。"
 zg361pp.182.t:0 "PIP 启动证据门槛"
 zg361pp.182.desc:0 "启动门把红线违纪分流到独立纪律案。这一步写入的是可复核案卷，不会凭一句‘业务需要’穿越状态机。"
 zg361pp.182.a:0 "只有冻结证据组合过线才正式开案。"
 zg361pp.182.b:0 "看到 3.25 就自动开案，并记录误伤风险。"
 zg361pp.182.c:0 "延期，但把负责人、期限和欠账写进案卷。"
 zg361pp.183.t:0 "PIP 目标双签与拒签理由"
 zg361pp.183.desc:0 "任务页区分送达、认同、拒签和一次修订。这一步写入的是可复核案卷，不会凭一句‘业务需要’穿越状态机。"
 zg361pp.183.a:0 "目标、资源、期限双签后计时。"
 zg361pp.183.b:0 "保留拒签理由，交独立席判断合理性。"
 zg361pp.183.c:0 "延期，但把负责人、期限和欠账写进案卷。"
 zg361pp.184.t:0 "经理的 PIP 承载量"
 zg361pp.184.desc:0 "容量面板按终态一次释放每案预留。这一步写入的是可复核案卷，不会凭一句‘业务需要’穿越状态机。"
 zg361pp.184.a:0 "预留经理工时，或增加导师与错峰容量。"
 zg361pp.184.b:0 "超载开案，并把支持失败责任回写经理。"
 zg361pp.184.c:0 "延期，但把负责人、期限和欠账写进案卷。"
 zg361pp.185.t:0 "PIP 中期检查"
 zg361pp.185.desc:0 "PIP 时间线消费进度、资源交付和目标有效性。这一步写入的是可复核案卷，不会凭一句‘业务需要’穿越状态机。"
 zg361pp.185.a:0 "只做一次中检，并允许一次有证据修正。"
 zg361pp.185.b:0 "跳过中检，随后不得倒造资源或目标更正。"
 zg361pp.185.c:0 "延期，但把负责人、期限和欠账写进案卷。"
 zg361pp.186.t:0 "PIP 目标膨胀锁"
 zg361pp.186.desc:0 "变更账比较基线、当前工作量和补偿路线。这一步写入的是可复核案卷，不会凭一句‘业务需要’穿越状态机。"
 zg361pp.186.a:0 "加任务必须等量替换、延期或获紧急复核。"
 zg361pp.186.b:0 "直接加码，并生成目标膨胀违规。"
 zg361pp.186.c:0 "延期，但把负责人、期限和欠账写进案卷。"
 zg361pp.187.t:0 "PIP 毕业标准"
 zg361pp.187.desc:0 "毕业关闭升级并释放容量，但绝不直接写 3.75。这一步写入的是可复核案卷，不会凭一句‘业务需要’穿越状态机。"
 zg361pp.187.a:0 "关键里程碑、稳定期、独立复核全过才毕业。"
 zg361pp.187.b:0 "经理不透明延长，并增加申诉权重。"
 zg361pp.187.c:0 "延期，但把负责人、期限和欠账写进案卷。"
 zg361pp.188.t:0 "毕业后的复发观察期"
 zg361pp.188.desc:0 "观察标记到期一次；新问题必须另开案。这一步写入的是可复核案卷，不会凭一句‘业务需要’穿越状态机。"
 zg361pp.188.a:0 "只观察一个周期，且仅同类问题升级。"
 zg361pp.188.b:0 "贴长期标签，并记录过度披露风险。"
 zg361pp.188.c:0 "延期，但把负责人、期限和欠账写进案卷。"
 zg361pp.189.t:0 "二次 PIP / 调岗 / 退出三岔口"
 zg361pp.189.desc:0 "终局决定页只接受一个排他终态。这一步写入的是可复核案卷，不会凭一句‘业务需要’穿越状态机。"
 zg361pp.189.a:0 "按支持、错岗和真实空缺只选一条合法路线。"
 zg361pp.189.b:0 "强制退出，并结算空缺、交接和补员成本。"
 zg361pp.189.c:0 "延期，但把负责人、期限和欠账写进案卷。"
 zg361pp.190.t:0 "PIP 随转岗披露的最小范围"
 zg361pp.190.desc:0 "转岗包按 ACL 投影最小字段。这一步写入的是可复核案卷，不会凭一句‘业务需要’穿越状态机。"
 zg361pp.190.a:0 "只向真实接收经理披露目标、支持、结果和本人陈述。"
 zg361pp.190.b:0 "贴粗糙标签，但不得编造细节或改旧档位。"
 zg361pp.190.c:0 "延期，但把负责人、期限和欠账写进案卷。"
 zg361pp.191.t:0 "PIP 退出后的团队成本单"
 zg361pp.191.desc:0 "团队成本表和经理记分卡消费同一净额。这一步写入的是可复核案卷，不会凭一句‘业务需要’穿越状态机。"
 zg361pp.191.a:0 "以实际付款回执列空缺、交接、加班和补员净成本。"
 zg361pp.191.b:0 "只报节省，隐藏成本转为经理债。"
 zg361pp.191.c:0 "延期，但把负责人、期限和欠账写进案卷。"
