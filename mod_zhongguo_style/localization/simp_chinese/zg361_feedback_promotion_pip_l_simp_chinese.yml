l_simp_chinese:
 zg361pp.146.t:0 "直白档位 / 委婉话术制度"
 zg361pp.146.desc:0 "反馈会和申诉时钟读取同一冻结档位。这一步写入的是可复核案卷，不会凭一句‘业务需要’穿越状态机。"
 zg361pp.146.a:0 "直说冻结档位，并确认对方确实听懂。"
 zg361pp.146.b:0 "委婉表达，但保留同一档位并记录误解债。"
 zg361pp.146.c:0 "延期，但把负责人、期限和欠账写进案卷。"
 zg361pp.147.t:0 "强制“一扬一抑”反馈模板"
 zg361pp.147.desc:0 "反馈质量表消费证据链接与套话数。这一步写入的是可复核案卷，不会凭一句‘业务需要’穿越状态机。"
 zg361pp.147.a:0 "只写有冻结证据支撑的表扬或批评。"
 zg361pp.147.b:0 "硬凑一扬一抑，并标记无证据套话。"
 zg361pp.147.c:0 "延期，但把负责人、期限和欠账写进案卷。"
 zg361pp.148.t:0 "先讲证据还是先报结果"
 zg361pp.148.desc:0 "纪要保存步骤顺序、确认和异议。这一步写入的是可复核案卷，不会凭一句‘业务需要’穿越状态机。"
 zg361pp.148.a:0 "逐项确认事实，再宣布档位。"
 zg361pp.148.b:0 "先报档位，但不得删改随后展示的证据。"
 zg361pp.148.c:0 "延期，但把负责人、期限和欠账写进案卷。"
 zg361pp.149.t:0 "绩效结果谈判包"
 zg361pp.149.desc:0 "个人谈判页核销实际付款回执。这一步写入的是可复核案卷，不会凭一句‘业务需要’穿越状态机。"
 zg361pp.149.a:0 "书面冻结补偿条款、负责人和到期日；本轮低档不变。"
 zg361pp.149.b:0 "只留口头保证，不得冒充已经履约。"
 zg361pp.149.c:0 "延期，但把负责人、期限和欠账写进案卷。"
 zg361pp.150.t:0 "“这次先委屈你”的补偿承诺"
 zg361pp.150.desc:0 "承诺时间线到期后结算履约或背约。这一步写入的是可复核案卷，不会凭一句‘业务需要’穿越状态机。"
 zg361pp.150.a:0 "建立有资金、有期限的非改档补偿义务。"
 zg361pp.150.b:0 "继续画饼，并公开它仍是未履约债。"
 zg361pp.150.c:0 "延期，但把负责人、期限和欠账写进案卷。"
 zg361pp.151.t:0 "签收不等于认同"
 zg361pp.151.desc:0 "收据行、见证送达与申诉案卷分别消费。这一步写入的是可复核案卷，不会凭一句‘业务需要’穿越状态机。"
 zg361pp.151.a:0 "把送达、认同、异议分别记录，保留申诉。"
 zg361pp.151.b:0 "把签收强写成认同，并产生程序债。"
 zg361pp.151.c:0 "延期，但把负责人、期限和欠账写进案卷。"
 zg361pp.152.t:0 "反馈可行动性评分"
 zg361pp.152.desc:0 "经理反馈质量表按收件人一次性回写。这一步写入的是可复核案卷，不会凭一句‘业务需要’穿越状态机。"
 zg361pp.152.a:0 "按具体、可控、期限、资源四项冻结评分。"
 zg361pp.152.b:0 "只记满意度，模糊建议不得拿满分。"
 zg361pp.152.c:0 "延期，但把负责人、期限和欠账写进案卷。"
 zg361pp.153.t:0 "反馈后行动项闭环"
 zg361pp.153.desc:0 "行动时间线只接受一个终态回执。这一步写入的是可复核案卷，不会凭一句‘业务需要’穿越状态机。"
 zg361pp.153.a:0 "建立唯一负责人、原始期限和验收证据。"
 zg361pp.153.b:0 "允许改期或取消，但完整保留历史和理由。"
 zg361pp.153.c:0 "延期，但把负责人、期限和欠账写进案卷。"
 zg361pp.154.t:0 "录音式完整纪要 / 摘要纪要"
 zg361pp.154.desc:0 "申诉投影只读纪要版本和更正附录。这一步写入的是可复核案卷，不会凭一句‘业务需要’穿越状态机。"
 zg361pp.154.a:0 "保存附证据引用的完整追加式纪要。"
 zg361pp.154.b:0 "保存摘要，但必须保留结果与证据索引。"
 zg361pp.154.c:0 "延期，但把负责人、期限和欠账写进案卷。"
 zg361pp.155.t:0 "公开表扬与私下批评边界"
 zg361pp.155.desc:0 "团队公告与私人反馈使用不同字段投影。这一步写入的是可复核案卷，不会凭一句‘业务需要’穿越状态机。"
 zg361pp.155.a:0 "只公开获准成绩，敏感反馈留在本人案卷。"
 zg361pp.155.b:0 "公开点名末位，并承担羞辱与报复成本。"
 zg361pp.155.c:0 "延期，但把负责人、期限和欠账写进案卷。"
 zg361pp.156.t:0 "团队结果说明会"
 zg361pp.156.desc:0 "政策面板读取说明会收据或流言风险。这一步写入的是可复核案卷，不会凭一句‘业务需要’穿越状态机。"
 zg361pp.156.a:0 "出榜后说明分布原则、共性问题和资源计划。"
 zg361pp.156.b:0 "不解释，让信息真空生成传言债。"
 zg361pp.156.c:0 "延期，但把负责人、期限和欠账写进案卷。"
 zg361pp.157.t:0 "自荐权与主管提名权"
 zg361pp.157.desc:0 "提名队列生成一人一包的冻结案号。这一步写入的是可复核案卷，不会凭一句‘业务需要’穿越状态机。"
 zg361pp.157.a:0 "允许合资格者自荐，但绑定 sponsor 与主管意见。"
 zg361pp.157.b:0 "主管独占入口，并记录反对或支持理由。"
 zg361pp.157.c:0 "延期，但把负责人、期限和欠账写进案卷。"
 zg361pp.158.t:0 "主管提名额度"
 zg361pp.158.desc:0 "额度账校验已用、归还与剩余恒等。这一步写入的是可复核案卷，不会凭一句‘业务需要’穿越状态机。"
 zg361pp.158.a:0 "把稀缺额度集中给有证据的候选并排序。"
 zg361pp.158.b:0 "分散押边界包，辅导工时同步摊薄。"
 zg361pp.158.c:0 "延期，但把负责人、期限和欠账写进案卷。"
 zg361pp.159.t:0 "雪藏明星不提名"
 zg361pp.159.desc:0 "逾期审计每周期只扣一次经理人才分。这一步写入的是可复核案卷，不会凭一句‘业务需要’穿越状态机。"
 zg361pp.159.a:0 "先冻结接班计划，再给明星明确提名期限。"
 zg361pp.159.b:0 "为保当期产出继续雪藏，并生成逾期人才债。"
 zg361pp.159.c:0 "延期，但把负责人、期限和欠账写进案卷。"
 zg361pp.160.t:0 "部门预审淘汰赛"
 zg361pp.160.desc:0 "预审队列只把真实席位数量的包送进答辩。这一步写入的是可复核案卷，不会凭一句‘业务需要’穿越状态机。"
 zg361pp.160.a:0 "按材料、职级证据、战略匹配三维预审。"
 zg361pp.160.b:0 "派系先筛人，但保留本轮淘汰理由。"
 zg361pp.160.c:0 "延期，但把负责人、期限和欠账写进案卷。"
 zg361pp.161.t:0 "“陪跑包”与虚假竞争"
 zg361pp.161.desc:0 "经理公平信用和主推包合法性消费陪跑识别。这一步写入的是可复核案卷，不会凭一句‘业务需要’穿越状态机。"
 zg361pp.161.a:0 "只提交真愿意支持的候选。"
 zg361pp.161.b:0 "放入陪跑包，计入准备工时和公平债。"
 zg361pp.161.c:0 "延期，但把负责人、期限和欠账写进案卷。"
 zg361pp.162.t:0 "资历门槛例外申请"
 zg361pp.162.desc:0 "破格额度账与后续能力评审保持分离。这一步写入的是可复核案卷，不会凭一句‘业务需要’穿越状态机。"
 zg361pp.162.a:0 "先占破格额度并单独表决准入，再评能力。"
 zg361pp.162.b:0 "把普通表现包装成破格，并透支未来可信度。"
 zg361pp.162.c:0 "延期，但把负责人、期限和欠账写进案卷。"
 zg361pp.163.t:0 "晋升绩效观察窗"
 zg361pp.163.desc:0 "预审只读取冻结窗口内的完整候选历史。这一步写入的是可复核案卷，不会凭一句‘业务需要’穿越状态机。"
 zg361pp.163.a:0 "周期初冻结最近两轮，并给重组等事实附语境。"
 zg361pp.163.b:0 "只挑最漂亮一轮，留下选窗审计差异。"
 zg361pp.163.c:0 "延期，但把负责人、期限和欠账写进案卷。"
 zg361pp.164.t:0 "跨团队成果进入晋升包"
 zg361pp.164.desc:0 "晋升包消费有来源的贡献份额而非团队总分。这一步写入的是可复核案卷，不会凭一句‘业务需要’穿越状态机。"
 zg361pp.164.a:0 "旧 owner 共签或独立复核后按贡献份额入包。"
 zg361pp.164.b:0 "拿团队总成绩冒充个人影响，触发归因债。"
 zg361pp.164.c:0 "延期，但把负责人、期限和欠账写进案卷。"
 zg361pp.165.t:0 "“先干到下一级”试岗证据"
 zg361pp.165.desc:0 "预审消费试岗验收回执，不改当期绩效。这一步写入的是可复核案卷，不会凭一句‘业务需要’穿越状态机。"
 zg361pp.165.a:0 "同时冻结授权、补偿、期限和退出条件。"
 zg361pp.165.b:0 "只加活不给权，并记录职级债。"
 zg361pp.165.c:0 "延期，但把负责人、期限和欠账写进案卷。"
 zg361pp.166.t:0 "候选主动撤包"
 zg361pp.166.desc:0 "下轮材料版本读取已验证工件与准备度风险。这一步写入的是可复核案卷，不会凭一句‘业务需要’穿越状态机。"
 zg361pp.166.a:0 "预审前撤回，归还额度并只复用已验证材料。"
 zg361pp.166.b:0 "劝候选硬上，失败理由照实归档。"
 zg361pp.166.c:0 "延期，但把负责人、期限和欠账写进案卷。"
 zg361pp.167.t:0 "Sponsor 的晋升信用债"
 zg361pp.167.desc:0 "后续胜任观察只结算一次 sponsor 信用。这一步写入的是可复核案卷，不会凭一句‘业务需要’穿越状态机。"
 zg361pp.167.a:0 "按事实作有限背书，下一观察期再结算信用。"
 zg361pp.167.b:0 "强力担保，失配时按同等强度折价。"
 zg361pp.167.c:0 "延期，但把负责人、期限和欠账写进案卷。"
 zg361pp.168.t:0 "经理提名命中率"
 zg361pp.168.desc:0 "上司下一轮辅导或收紧额度时消费成熟样本。这一步写入的是可复核案卷，不会凭一句‘业务需要’穿越状态机。"
 zg361pp.168.a:0 "按难度加权通过与胜任，并计入无故漏提。"
 zg361pp.168.b:0 "只报稳赢包，命中率旁列风险规避债。"
 zg361pp.168.c:0 "延期，但把负责人、期限和欠账写进案卷。"
 zg361pp.169.t:0 "评委专业匹配"
 zg361pp.169.desc:0 "答辩计分器按事前权重消费每席评分。这一步写入的是可复核案卷，不会凭一句‘业务需要’穿越状态机。"
 zg361pp.169.a:0 "冻结专业席与外部席权重，合计一百。"
 zg361pp.169.b:0 "让熟悉团队的人占多数，并公开关系风险。"
