 zg361pp.149.desc:0 "本轮较低档位不会因协商改变，案卷仍缺补偿责任人、到期日和履约状态。本案由[zg361_pp_prompt_owner.GetShortUIName]承办，[zg361_pp_prompt_subject.GetShortUIName]是当事人；第 180 日复核。"
 zg361pp.149.a:0 "书面冻结补偿条款、负责人和到期日；本轮低档不变。"
 zg361pp.149.b:0 "只留口头保证，不得冒充已经履约。"
 zg361pp.149.c:0 "本轮不采纳本项，登记制度债并继续下一项；本项不会自动重提。"
