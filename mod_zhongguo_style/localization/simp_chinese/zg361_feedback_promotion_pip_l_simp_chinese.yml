l_simp_chinese:
 zg361pp.grade.375:0 "本轮冻结绩效：3.75。别急，这一页还没开始夸你。"
 zg361pp.grade.350:0 "本轮冻结绩效：3.5。翻译成人话：干得不少，坑也给你留着。"
 zg361pp.grade.325:0 "本轮冻结绩效：3.25。PPT 叫改进空间，账本叫证据起点。"
 zg361pp.outcome.evidence:0 "证据路线占优：流程没有变善良，只是这次终于留下了能对账的东西。"
 zg361pp.outcome.political:0 "政治路线占优：业务很灵活，责任很稳定——稳定地落在经理名下。"
 zg361pp.outcome.mixed:0 "路线打平：制度和人情各赢一半，只有会议时间全输了。"
 zg361pp.terminal.second_pip:0 "终局：二次绩效改进计划。恭喜，改进计划成功改进成了续费服务。"
 zg361pp.terminal.graduated:0 "终局：观察期内没有同类复发。这回改进计划没有续费成功。"
 zg361pp.terminal.transfer:0 "终局：真实转岗。不是把问题挪个群聊，而是连接收经理和空缺都写进了案卷。"
 zg361pp.terminal.exit:0 "终局：退出。空缺、交接、加班和补员成本一个都没被‘组织优化’优化掉。"
 zg361pp.151.subject.a:0 "确认收到；这不表示同意内容。"
 zg361pp.151.subject.b:0 "确认收到，保留异议并提出申诉。"
 zg361pp.166.subject.a:0 "撤回我的晋升包。"
 zg361pp.166.subject.b:0 "继续参评，由经理处理后续程序。"
 zg361pp.190.subject.a:0 "同意附上我的最小披露陈述。"
 zg361pp.190.subject.b:0 "拒绝扩散本人陈述，只保留程序回执。"
 zg361pp.5151.t:0 "绩效反馈送达：请本人确认收件"
 zg361pp.5151.desc:0 "受评官员：[scope:zg361_pp_subject_prompt_subject.GetShortUIName]。送达人：[scope:zg361_pp_subject_prompt_owner.GetShortUIName]。本轮冻结档位列在下方；冻结理由编号为 [ROOT.MakeScope.Var('zg361_pp_t_frozen_reason').GetValue|0]，案卷证据共 [ROOT.MakeScope.Var('zg361_pp_t_evidence_component_count').GetValue|0] 项。你有 90 日提出申诉。这里仅确认送达，不要求你同意档位、理由或证据。"
 zg361pp.146.t:0 "直白档位 / 委婉话术制度"
 zg361pp.146.desc:0 "受评官员：[scope:zg361_pp_prompt_subject.GetShortUIName]；裁决者：[scope:zg361_pp_prompt_owner.GetShortUIName]。本案现在处理「直白档位 / 委婉话术制度」。选择会立即写入本案；需要后续核验的结果将在第 30 日到期。按钮中的数字与条件是本案采用的制度参数，只有已经存在的付款、证据或人物回执才会被当作既成事实。"
 zg361pp.146.a:0 "直说冻结档位，并确认对方确实听懂。"
 zg361pp.146.b:0 "委婉表达，但保留同一档位并记录误解债。"
 zg361pp.146.c:0 "本轮不采纳本项，登记制度债并继续下一项；本项不会自动重提。"
 zg361pp.147.t:0 "强制“一扬一抑”反馈模板"
 zg361pp.147.desc:0 "受评官员：[scope:zg361_pp_prompt_subject.GetShortUIName]；裁决者：[scope:zg361_pp_prompt_owner.GetShortUIName]。本案现在处理「强制“一扬一抑”反馈模板」。选择会立即写入本案；需要后续核验的结果将在第 30 日到期。按钮中的数字与条件是本案采用的制度参数，只有已经存在的付款、证据或人物回执才会被当作既成事实。"
 zg361pp.147.a:0 "只写有冻结证据支撑的表扬或批评。"
 zg361pp.147.b:0 "硬凑一扬一抑，并标记无证据套话。"
 zg361pp.147.c:0 "本轮不采纳本项，登记制度债并继续下一项；本项不会自动重提。"
 zg361pp.148.t:0 "先讲证据还是先报结果"
 zg361pp.148.desc:0 "受评官员：[scope:zg361_pp_prompt_subject.GetShortUIName]；裁决者：[scope:zg361_pp_prompt_owner.GetShortUIName]。本案现在处理「先讲证据还是先报结果」。选择会立即写入本案；需要后续核验的结果将在第 30 日到期。按钮中的数字与条件是本案采用的制度参数，只有已经存在的付款、证据或人物回执才会被当作既成事实。"
 zg361pp.148.a:0 "逐项确认事实，再宣布档位。"
 zg361pp.148.b:0 "先报档位，但不得删改随后展示的证据。"
 zg361pp.148.c:0 "本轮不采纳本项，登记制度债并继续下一项；本项不会自动重提。"
 zg361pp.149.t:0 "绩效结果谈判包"
 zg361pp.149.desc:0 "受评官员：[scope:zg361_pp_prompt_subject.GetShortUIName]；裁决者：[scope:zg361_pp_prompt_owner.GetShortUIName]。本案现在处理「绩效结果谈判包」。选择会立即写入本案；需要后续核验的结果将在第 180 日到期。按钮中的数字与条件是本案采用的制度参数，只有已经存在的付款、证据或人物回执才会被当作既成事实。"
 zg361pp.149.a:0 "书面冻结补偿条款、负责人和到期日；本轮低档不变。"
 zg361pp.149.b:0 "只留口头保证，不得冒充已经履约。"
 zg361pp.149.c:0 "本轮不采纳本项，登记制度债并继续下一项；本项不会自动重提。"
 zg361pp.150.t:0 "“这次先委屈你”的补偿承诺"
 zg361pp.150.desc:0 "受评官员：[scope:zg361_pp_prompt_subject.GetShortUIName]；裁决者：[scope:zg361_pp_prompt_owner.GetShortUIName]。本案现在处理「“这次先委屈你”的补偿承诺」。选择会立即写入本案；需要后续核验的结果将在第 365 日到期。按钮中的数字与条件是本案采用的制度参数，只有已经存在的付款、证据或人物回执才会被当作既成事实。"
 zg361pp.150.a:0 "建立有资金、有期限的非改档补偿义务。"
 zg361pp.150.b:0 "继续画饼，并公开它仍是未履约债。"
 zg361pp.150.c:0 "本轮不采纳本项，登记制度债并继续下一项；本项不会自动重提。"
 zg361pp.151.t:0 "签收不等于认同"
 zg361pp.151.desc:0 "受评官员：[scope:zg361_pp_prompt_subject.GetShortUIName]；裁决者：[scope:zg361_pp_prompt_owner.GetShortUIName]。本案现在处理「签收不等于认同」。选择会立即写入本案；需要后续核验的结果将在第 7、90 日到期。按钮中的数字与条件是本案采用的制度参数，只有已经存在的付款、证据或人物回执才会被当作既成事实。"
 zg361pp.151.a:0 "把送达、认同、异议分别记录，保留申诉。"
 zg361pp.151.b:0 "把签收强写成认同，并产生程序债。"
 zg361pp.151.c:0 "本轮不采纳本项，登记制度债并继续下一项；本项不会自动重提。"
 zg361pp.152.t:0 "反馈可行动性评分"
 zg361pp.152.desc:0 "受评官员：[scope:zg361_pp_prompt_subject.GetShortUIName]；裁决者：[scope:zg361_pp_prompt_owner.GetShortUIName]。本案现在处理「反馈可行动性评分」。选择会立即写入本案；需要后续核验的结果将在第 365 日到期。按钮中的数字与条件是本案采用的制度参数，只有已经存在的付款、证据或人物回执才会被当作既成事实。"
 zg361pp.152.a:0 "按具体、可控、期限、资源四项冻结评分。"
 zg361pp.152.b:0 "只记满意度，模糊建议不得拿满分。"
 zg361pp.152.c:0 "本轮不采纳本项，登记制度债并继续下一项；本项不会自动重提。"
