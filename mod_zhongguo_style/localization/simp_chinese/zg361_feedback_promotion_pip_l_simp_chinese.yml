 zg361pp.156.b:0 "不解释，让信息真空生成传言债。"
 zg361pp.156.c:0 "本轮不采纳本项，登记制度债并继续下一项；本项不会自动重提。"
 zg361pp.157.t:0 "自荐权与主管提名权"
 zg361pp.157.desc:0 "受评官员：[scope:zg361_pp_prompt_subject.GetShortUIName]；裁决者：[scope:zg361_pp_prompt_owner.GetShortUIName]。本案现在处理「自荐权与主管提名权」。选择会立即写入本案；需要后续核验的结果将在第 30 日到期。按钮中的数字与条件是本案采用的制度参数，只有已经存在的付款、证据或人物回执才会被当作既成事实。"
 zg361pp.157.a:0 "允许合资格者自荐，但绑定提名担保人与主管意见。"
 zg361pp.157.b:0 "主管独占入口，并记录反对或支持理由。"
 zg361pp.157.c:0 "本轮不采纳本项，登记制度债并继续下一项；本项不会自动重提。"
 zg361pp.158.t:0 "主管提名额度"
 zg361pp.158.desc:0 "受评官员：[scope:zg361_pp_prompt_subject.GetShortUIName]；裁决者：[scope:zg361_pp_prompt_owner.GetShortUIName]。本案现在处理「主管提名额度」。选择会立即写入本案；需要后续核验的结果将在第 30 日到期。按钮中的数字与条件是本案采用的制度参数，只有已经存在的付款、证据或人物回执才会被当作既成事实。"
