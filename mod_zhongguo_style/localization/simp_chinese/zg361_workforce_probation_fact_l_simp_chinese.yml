l_simp_chinese:
 zg361wpf.2.t:0 "试用期结局回执"
 zg361wpf.2.desc:0 "你的试任期已经结束。官署正用实际任职结果复核当初的录用判断。"
 zg361wpf.2.quality_pass:0 "后续考核表明，当事人的任职表现达到了岗位要求。"
 zg361wpf.2.quality_mismatch:0 "改进期结束时仍未达到要求，这次结局记为岗位不匹配，不算正常离任。"
 zg361wpf.2.quality_attrition:0 "当事人在任命后正常离任，离任补偿与职位释放均已确认，这次结局记为自然流失。"
 zg361wpf.2.quality_role_change:0 "当事人因任职变动离开原岗位，这次结局既不算绩效失败，也不计入自然流失。"
 zg361wpf.2.followup_evidence:0 "官署会把这份结论与当初面试采用的证据逐项对照，用来复核那次判断是否可靠。"
 zg361wpf.2.followup_accountability:0 "官署会把这份结论归入最终任命决定者的责任记录。"
 zg361wpf.2.a:0 "记下任职结局与后续复核归属。"
