l_russian:
 # Game rules
 rule_zg361_enabled:0 "Vassal Performance Review (361 System)"
 setting_zg361_on:0 "Enabled"
 setting_zg361_on_desc:0 "Celestial rulers review their vassals every cycle, sorting them into 3.75 / 3.5 / 3.25 under a forced 30/60/10 distribution."
 setting_zg361_off:0 "Disabled"
 setting_zg361_off_desc:0 "Disables the performance review system."
 rule_zg361_frequency:0 "Review Cycle"
 setting_zg361_freq_yearly:0 "Annual Review"
 setting_zg361_freq_yearly_desc:0 "One performance season every year."
 setting_zg361_freq_three_year:0 "Triennial Review"
 setting_zg361_freq_three_year_desc:0 "One grand evaluation every three years, in the old style."
 rule_zg361_bottom_ratio:0 "Bottom Quota"
 setting_zg361_ratio_strict:0 "Strict 361 (10%)"
 setting_zg361_ratio_strict_desc:0 "The 361 distribution is enforced: even if everyone meets expectations, someone in a large enough pool must take the 3.25."
 setting_zg361_ratio_relaxed:0 "Relaxed (5%)"
 setting_zg361_ratio_relaxed_desc:0 "Keep the 361 grading, but loosen the rigid bottom-10 quota."
 setting_zg361_ratio_off:0 "Hands-off (0%)"
 setting_zg361_ratio_off_desc:0 "No forced bottom tier. The review becomes a formality."
 # Decision group & decisions
 decision_group_type_zg361:0 "Performance Review"
 zg361_review_now_decision:0 "Conduct Performance Review Now"
 zg361_review_now_decision_desc:0 "Order the Ministry of Personnel to rank the roster immediately instead of waiting for the annual season. Vassals already reviewed this year will be re-evaluated."
 zg361_review_now_decision_confirm:0 "Publish the rankings!"
 zg361_ratio_strict_decision:0 "Bottom Quota: Strict 361 (10%)"
 zg361_ratio_strict_decision_desc:0 "Enforce the distribution: with five or more in the pool, someone must take the 3.25."
 zg361_ratio_strict_decision_confirm:0 "Stay strict."
 zg361_ratio_relaxed_decision:0 "Bottom Quota: Relaxed (5%)"
 zg361_ratio_relaxed_decision_desc:0 "Keep the 361 grading, but loosen the rigid bottom-10 quota."
 zg361_ratio_relaxed_decision_confirm:0 "Loosen it."
 zg361_ratio_off_decision:0 "Bottom Quota: Hands-off (0%)"
 zg361_ratio_off_decision_desc:0 "No forced bottom tier. The review becomes a formality."
 zg361_ratio_off_decision_confirm:0 "Hands off."
 # Character interactions
 zg361_appeal_interaction:0 "Appeal Performance Review"
 zg361_appeal_interaction_desc:0 "Formally appeal this cycle's review result and demand a re-evaluation. Costs 150 influence."
 zg361_review_talk_interaction:0 "Performance Talk"
 zg361_review_talk_interaction_desc:0 "Hold a one-on-one performance talk with a vassal whose result has been posted this cycle. Calms nerves."
 zg361_recommend_interaction:0 "Recommend"
 zg361_recommend_interaction_desc:0 "Recommend this peer's record to the throne: +10 to their next review."
 zg361_slander_interaction:0 "Slander"
 zg361_slander_interaction_desc:0 "File a venomous memorial against this peer: 70% chance of -15 to their next review; if seen through, it backfires on you."
 zg361_purge_interaction:0 "Bottom-Tier Disposition: Strip Title"
 zg361_purge_interaction_desc:0 "Execute bottom-tier elimination on an official with two consecutive 3.25s: strip office (lawful cause, no tyranny)."
 zg361_force_retire_interaction:0 "Bottom-Tier Disposition: Forced Retirement"
 zg361_force_retire_interaction_desc:0 "Grant an official with two consecutive 3.25s a dignified exit: forced retirement, merit intact."
 # Modifiers (grades)
 zg361_grade_375:0 "Performance 3.75 · Exceeds Expectations"
 zg361_grade_375_desc:0 "This cycle's result: 3.75. Results, difficulty and impact clearly exceeded the expectations of the current rank. Promotion nomination granted."
 zg361_grade_35:0 "Performance 3.5 · Meets Expectations"
 zg361_grade_35_desc:0 "This cycle's result: 3.5. You did the job your rank requires. Good work. Keep it up."
 zg361_grade_325:0 "Performance 3.25 · Needs Improvement"
 zg361_grade_325_desc:0 "This cycle's result: 3.25. Output, influence or working style fell below team expectations. This is an unmistakably negative signal."
 zg361_pip:0 "Performance Improvement Plan"
 zg361_pip_desc:0 "Placed on a Performance Improvement Plan (PIP). Two consecutive 3.25 cycles trigger the bottom-tier elimination process."
 zg361_demoted:0 "Demoted but Retained"
 zg361_demoted_desc:0 "Lenient elimination outcome: demoted and retained, salary halved. We will see how next cycle goes."
 zg361_promotion_track:0 "Promotion Track"
 zg361_promotion_track_desc:0 "Two consecutive 3.75 cycles: the promotion track is open. Appointment candidate score greatly increased; merit level cap temporarily raised."
 # Opinions
 zg361_favored:0 "Imperial Favor"
 zg361_poor_review:0 "Poor Review"
 zg361_annoyed:0 "Tiresome Appeals"
 zg361_purged:0 "Eliminated as Bottom Tier"
 zg361_forced_retire:0 "Forced into Retirement"
 zg361_merciful:0 "Shown Mercy"
 zg361_rigged:0 "Rigged Review"
 zg361_appeal_rejected:0 "Appeal Rejected"
 zg361_talked:0 "Performance Talk"
 zg361_slandered_me:0 "Malicious Slander"
 zg361_jingcha_attended:0 "Attended the Grand Evaluation"
 # Activity
 activity_zg361_jingcha:0 "Grand Capital Evaluation"
 activity_zg361_jingcha_desc:0 "Summon every incumbent vassal official to the capital and review their records in person. When the assembly concludes, the rankings are posted immediately."
 activity_zg361_jingcha_host_desc:0 "Preside over the Grand Capital Evaluation, review the court's officials face to face, and post the rankings at its conclusion."
 activity_zg361_jingcha_guest_desc:0 "Travel to the capital and face His Majesty's evaluation in person."
 activity_zg361_jingcha_selection_tooltip:0 "Summon all incumbent vassal officials to the capital for evaluation."
 activity_zg361_jingcha_conclusion_desc:0 "The Grand Capital Evaluation has concluded, and the results are posted."
 zg361_jingcha_province_desc:0 "Hold the Grand Capital Evaluation at the capital."
 zg361_jingcha_phase:0 "Evaluation"
 # Events
 zg361.1.t:0 "Annual Performance Review Season"
 zg361.1.desc:0 "The Ministry of Personnel has delivered this cycle's review roster, and the 30/60/10 distribution has been settled.\n\nThis cycle: [TopScope.GetValue('zg361_n_375')|0] exceeded expectations, [TopScope.GetValue('zg361_n_35')|0] met them, [TopScope.GetValue('zg361_n_325')|0] must improve; [TopScope.GetValue('zg361_n_elim')|0] now face bottom-tier elimination.\n\nPerformance was never about whether you hit your targets — it is about how you rank against your peers. The results are posted. Rewards and punishments have been applied."
 zg361.1.a:0 "Noted."
 zg361.2.t:0 "Your Performance Is 3.75"
 zg361.2.desc:0 "The result is in: 3.75 — exceeds expectations.\n\nYour results, the difficulty of what you took on, and the scope of your impact clearly exceeded your current rank. The imperial vermilion brush has signed off: a promotion nomination and an immediate performance bonus.\n\n\"Let the results speak.\""
 zg361.2.a:0 "Thank you for your guidance, Your Majesty!"
 zg361.3.t:0 "Your Performance Is 3.5"
 zg361.3.desc:0 "The result is in: 3.5 — meets expectations.\n\nYou did the work your rank requires. Nothing more, nothing less.\n\n\"Good work. Keep it up next year.\""
 zg361.3.a:0 "...Keeping it up."
 zg361.4.t:0 "You Got a 3.25"
 zg361.4.desc:0 "The result is in: 3.25 — needs improvement.\n\nThe ministry's wording is polite, but the message is unmistakable: you are below the bar for your current post. A Performance Improvement Plan has already been arranged. One more of these, and it is bottom-tier elimination.\n\nYour fists clench."
 zg361.4.a:0 "Accept it. (Stress reduced)"
 zg361.4.b:0 "Appeal! This review is rigged! (Costs 150 influence, 30% chance to overturn)"
 zg361.4.c:0 "Give up. Just coast. (Stress reduced, -10 to next year's review)"
 zg361.4.d:0 "Grind. Let next year's results speak. (Stress increased, +10 to next year's review)"
 zg361.5.t:0 "Bottom-Tier Elimination List"
 zg361.5.desc:0 "This cycle, [TopScope.GetValue('zg361_n_elim')|0] officials have scored 3.25 twice in a row and are due for bottom-tier elimination. The list lies on the imperial desk; the vermilion brush is in your hand. (You may also dispose of them one by one from the court view.)\n\nHow will you dispose of them?"
 zg361.5.a:0 "By the book. (Each is judged by record, favor and ability: purge, forced retirement, or demotion)"
 zg361.5.b:0 "Show mercy — demote them all, but keep them. (-100 prestige)"
 zg361.5.c:0 "Grant one more year of observation. (-50 prestige, the court is grateful)"
 zg361.6.t:0 "You Are on the Elimination List"
 zg361.6.desc:0 "Two consecutive 3.25s, and the blade of bottom-tier elimination has finally fallen on you. His Majesty's eunuchs have already set out with the roster.\n\nYou have one last window."
 zg361.6.a:0 "Final appeal! Demand a re-review! (Costs 200 influence, 40% chance to be demoted instead — failure means losing your title)"
 zg361.6.b:0 "Spend your fortune on the right palms. (Costs 300 gold, demoted but retained)"
 zg361.6.c:0 "Accept retirement with dignity."
 zg361.6.d:0 "Rise up! (Found an independence faction against the emperor)"
 zg361.10.t:0 "Performance Calibration Meeting"
 zg361.10.desc:0 "The ministry's draft roster lies on your desk: [TopScope.GetValue('zg361_n_375')|0] marked as exceeding expectations, [TopScope.GetValue('zg361_n_35')|0] meeting them, [TopScope.GetValue('zg361_n_325')|0] needing improvement.\n\nBefore the results are posted, the brush is still yours. Lift someone up, push someone down — but if the court catches wind of tampering, they will call it what it is: a rigged review."
 zg361.10.a:0 "The list is correct. Post it."
 zg361.10.b:0 "Lift one up: swap the lowest 3.75 with the highest 3.5."
 zg361.10.c:0 "Push one down: drop the lowest 3.5 into 3.25."
 zg361.11.t:0 "The Vermilion Brush Has Fallen"
 zg361.11.desc:0 "You lift the vermilion brush and gently move a name up the list. The one pushed down will never know the throne changed its mind overnight."
 zg361.11.a:0 "Post the results."
 zg361.12.t:0 "The Vermilion Brush Has Fallen"
 zg361.12.desc:0 "You lift the vermilion brush and add a name at the edge of the list. Someone has to take this 3.25 — why not him?"
 zg361.12.a:0 "Post the results."
 zg361.20.t:0 "Performance Review"
 zg361.20.desc:0 "The performance review is underway."
 zg361.20.a:0 "Continue."
 zg361.30.t:0 "Wild Dogs and White Rabbits"
 zg361.30.desc:0 "The evaluation bureau appended a second page to its confidential memorial: [TopScope.GetValue('zg361_n_dog')|0] \"wild dogs\" — stellar results, rotten values; and [TopScope.GetValue('zg361_n_rabbit')|0] \"white rabbits\" — loyal to a fault, hopeless at the job.\n\nNeither kind is a long-term keeper. What is your pleasure?"
 zg361.30.a:0 "Balanced mercy: keep the wild dogs under watch, comfort the rabbits."
 zg361.30.b:0 "Punish the wild dogs and retire the rabbits. (+50 prestige; wild dogs lose merit and enter a PIP, rabbits are retired)"
