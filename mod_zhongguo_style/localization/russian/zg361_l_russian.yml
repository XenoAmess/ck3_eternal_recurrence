l_russian:
 # Game rules
 rule_zg361_enabled:0 "Аттестация вассалов (система 361)"
 setting_zg361_on:0 "Включено"
 setting_zg361_on_desc:0 "Небесные правители герцогского ранга и выше аттестуют своих прямых действующих чиновников, распределяя их по 3.75 / 3.5 / 3.25; графы и бароны проходят аттестацию, но сами никого не проверяют."
 setting_zg361_off:0 "Отключено"
 setting_zg361_off_desc:0 "Отключает систему аттестации."
 rule_zg361_frequency:0 "Цикл аттестации"
 setting_zg361_freq_yearly:0 "Ежегодная аттестация"
 setting_zg361_freq_yearly_desc:0 "Один аттестационный сезон в год."
 setting_zg361_freq_three_year:0 "Трёхлетняя аттестация"
 setting_zg361_freq_three_year_desc:0 "Большая проверка раз в три года, по старинному обычаю."
 rule_zg361_bottom_ratio:0 "Квота аутсайдеров"
 setting_zg361_ratio_strict:0 "Жёсткое 361 (10%)"
 setting_zg361_ratio_strict_desc:0 "Распределение 361 соблюдается неукоснительно: даже если все соответствуют ожиданиям, при достаточно большом пуле кто-то получит 3.25."
 setting_zg361_ratio_relaxed:0 "Мягкое (5%)"
 setting_zg361_ratio_relaxed_desc:0 "Грейды 361 сохраняются, но жёсткая квота нижних 10% ослаблена."
 setting_zg361_ratio_off:0 "Вольно (0%)"
 setting_zg361_ratio_off_desc:0 "Никакой принудительной нижней группы. Аттестация превращается в формальность."
 # Decision group & decisions
 decision_group_type_zg361:0 "Аттестация"
 zg361_review_now_decision:0 "Провести аттестацию немедленно"
 zg361_review_now_decision_desc:0 "Приказать экзаменационной палате немедленно ранжировать ваш прямой штат, не дожидаясь годового сезона. Чиновники, уже аттестованные в этом году, не будут аттестованы повторно."
 zg361_review_now_decision_tooltip:0 "Немедленно аттестовать хотя бы одного действующего прямого подчинённого чиновника; в том же календарном году повторная аттестация невозможна."
 zg361_review_now_decision_confirm:0 "Объявить результаты!"
 zg361_ratio_strict_decision:0 "Квота аутсайдеров: жёсткое 361 (10%)"
 zg361_ratio_strict_decision_desc:0 "Принудительное распределение: при пяти и более в пуле кто-то обязан получить 3.25."
 zg361_ratio_strict_decision_tooltip:0 "Установить принудительную квоту аутсайдеров в 10% для этого аттестационного подразделения."
 zg361_ratio_strict_decision_confirm:0 "Держать строго."
 zg361_ratio_relaxed_decision:0 "Квота аутсайдеров: мягкое (5%)"
 zg361_ratio_relaxed_decision_desc:0 "Грейды 361 сохраняются, но жёсткая квота нижних 10% ослаблена."
 zg361_ratio_relaxed_decision_tooltip:0 "Установить принудительную квоту аутсайдеров в 5% для этого аттестационного подразделения."
 zg361_ratio_relaxed_decision_confirm:0 "Ослабить."
 zg361_ratio_off_decision:0 "Квота аутсайдеров: вольно (0%)"
 zg361_ratio_off_decision_desc:0 "Никакой принудительной нижней группы. Аттестация превращается в формальность."
 zg361_ratio_off_decision_tooltip:0 "Снять принудительную квоту аутсайдеров с этого аттестационного подразделения."
 zg361_ratio_off_decision_confirm:0 "Пусть сами."
 # Character interactions
 zg361_appeal_interaction:0 "Оспорить аттестацию"
 zg361_appeal_interaction_desc:0 "Официально оспорить итог аттестации этого цикла и потребовать пересмотра. Стоит 150 влияния."
 zg361_review_talk_interaction:0 "Беседа по итогам"
 zg361_review_talk_interaction_desc:0 "Провести индивидуальную беседу с вассалом, чей результат уже объявлен в этом цикле. Успокаивает нервы."
 zg361_recommend_interaction:0 "Рекомендовать"
 zg361_recommend_interaction_desc:0 "Порекомендовать послужной список этого коллеги вашему общему прямому сюзерену: +10 к его следующей аттестации."
 zg361_slander_interaction:0 "Навет"
 zg361_slander_interaction_desc:0 "Подать ядовитый доклад против этого коллеги: в 70% случаев -15 к его следующей аттестации; если интрига раскроется, удар обрушится на вас."
 zg361_purge_interaction:0 "Кара для аутсайдера: лишение титула"
 zg361_purge_interaction_desc:0 "Применить кару для аутсайдера к чиновнику с двумя 3.25 подряд: лишить должности (законное основание, без тирании)."
 zg361_force_retire_interaction:0 "Кара для аутсайдера: принудительная отставка"
 zg361_force_retire_interaction_desc:0 "Дать чиновнику с двумя 3.25 подряд достойный выход: принудительная отставка с сохранением доброго имени."
 # Modifiers (grades)
 zg361_grade_375:0 "Оценка 3.75 · Превзошёл ожидания"
 zg361_grade_375_desc:0 "Итог этого цикла: 3.75. Результаты, сложность и влияние явно превзошли ожидания текущего ранга. Выдана рекомендация к повышению."
 zg361_grade_35:0 "Оценка 3.5 · Соответствует ожиданиям"
 zg361_grade_35_desc:0 "Итог этого цикла: 3.5. Вы выполнили работу, положенную по рангу. Хорошая работа. Так держать."
 zg361_grade_325:0 "Оценка 3.25 · Требует улучшения"
 zg361_grade_325_desc:0 "Итог цикла: 3.25. Четырёхкратные последствия: местная казна -50, личное золото -25, заслуги -60 при поддержке системы, а также оклад -25% на один год, где применимо."
 zg361_pip:0 "План улучшения показателей"
 zg361_pip_desc:0 "Внесён в план улучшения показателей (PIP). Два цикла 3.25 подряд запускают процедуру кары для аутсайдеров."
 zg361_demoted:0 "Понижен, но оставлен"
 zg361_demoted_desc:0 "Мягкий исход кары: понижение с оставлением в должности, жалованье уполовинено. Посмотрим, что покажет следующий цикл."
 zg361_promotion_track:0 "Путь к повышению"
 zg361_promotion_track_desc:0 "Два цикла 3.75 подряд: путь к повышению открыт. Балл кандидата на назначение сильно повышен; потолок ранга временно поднят."
 # Opinions
 zg361_favored:0 "Расположение сюзерена"
 zg361_poor_review:0 "Скверная аттестация"
 zg361_annoyed:0 "Надоедливые жалобы"
 zg361_purged:0 "Вычищен как аутсайдер"
 zg361_forced_retire:0 "Отправлен в отставку"
 zg361_merciful:0 "Явлена милость"
 zg361_rigged:0 "Подтасованная аттестация"
 zg361_appeal_rejected:0 "Жалоба отклонена"
 zg361_talked:0 "Беседа по итогам"
 zg361_slandered_me:0 "Злостный навет"
 zg361_jingcha_attended:0 "Присутствовал на большой проверке"
 # Activity
 activity_zg361_jingcha:0 "Большая административная проверка"
 activity_zg361_jingcha_desc:0 "Созвать прямых действующих чиновников в свою резиденцию и лично проверить их послужной список. По завершении собрания результаты объявляются немедленно."
 activity_zg361_jingcha_host_desc:0 "Председательствовать на большой административной проверке, лично аттестовать прямых чиновников и по завершении объявить результаты."
 activity_zg361_jingcha_guest_desc:0 "Отправиться в резиденцию прямого сюзерена и лично пройти его аттестацию."
 activity_zg361_jingcha_selection_tooltip:0 "Созвать прямых действующих чиновников в резиденцию для аттестации."
 activity_zg361_jingcha_conclusion_desc:0 "Большая административная проверка завершена, результаты вывешены на доску."
 zg361_jingcha_province_desc:0 "Провести большую административную проверку в своей резиденции."
 zg361_jingcha_phase:0 "Проверка"
 # Events
 zg361.1.t:0 "Проведённая вами аттестация: списки утверждены"
 zg361.1.desc:0 "Это аттестация, которую вы провели для своих прямых чиновников, а не ваша собственная оценка от вышестоящего. Экзаменационная палата утвердила списки по действующему правилу квоты аутсайдеров для этого уровня.\n\nВ этом цикле: превзошли ожидания [TopScope.GetValue('zg361_n_375')|0], соответствовали [TopScope.GetValue('zg361_n_35')|0], нуждаются в улучшении [TopScope.GetValue('zg361_n_325')|0]; в процедуру кары для аутсайдеров попали [TopScope.GetValue('zg361_n_elim')|0].\n\nЕсли вышестоящий аттестует вас, отдельным указом будут прямо указаны ваш балл, KPI и место."
 zg361.1.a:0 "Принято."
 zg361.2.t:0 "Оценка сюзерена: 3.75 · Превзошёл ожидания"
 zg361.2.desc:0 "[zg361_reviewing_superior.GetShortUIName] выставил вам оценку за этот цикл проверки.\n\nВаш балл: 3.75 (превзошёл ожидания)\nKPI: [TopScope.GetValue('zg361_result_kpi')|0]   Место в когорте: [TopScope.GetValue('zg361_result_rank')|0] из [TopScope.GetValue('zg361_result_cohort_n')|0]\n\nРезультаты, сложность и охват влияния превысили ваш текущий ранг. Начисляются награды за заслуги, местную казну и выдвижение — там, где ваш пост и учреждения это позволяют."
 zg361.2.a:0 "Благодарю за наставление, мой господин!"
 zg361.3.t:0 "Оценка сюзерена: 3.5 · Соответствует ожиданиям"
 zg361.3.desc:0 "[zg361_reviewing_superior.GetShortUIName] выставил вам оценку за этот цикл проверки.\n\nВаш балл: 3.5 (соответствует ожиданиям)\nKPI: [TopScope.GetValue('zg361_result_kpi')|0]   Место в когорте: [TopScope.GetValue('zg361_result_rank')|0] из [TopScope.GetValue('zg361_result_cohort_n')|0]\n\nВы сделали ровно то, что требуется от вашего ранга. Ни больше, ни меньше."
 zg361.3.a:0 "...Буду держать уровень."
 zg361.4.t:0 "Оценка сюзерена: 3.25 · Требует улучшения"
 zg361.4.desc:0 "[zg361_reviewing_superior.GetShortUIName] присвоил вам оценку за этот аттестационный цикл.\n\nВаш балл: 3.25 (требуется улучшение)\nKPI: [TopScope.GetValue('zg361_result_kpi')|0]   Место в оценочной группе: [TopScope.GetValue('zg361_result_rank')|0] из [TopScope.GetValue('zg361_result_cohort_n')|0]\n\nВы не дотягиваете до планки своей должности. Применяется четырёхкратное урегулирование: 50 из местной казны при её наличии, 25 личного золота, 60 заслуг при поддержке системы и сокращение жалованья на 25% на один год, где это применимо. Запущен план улучшения показателей — ещё один результат 3.25 означает отчисление нижнего эшелона."
 zg361.4.a:0 "Принимаю как есть. (Стресс снижен)"
 zg361.4.b:0 "Апелляция! Эта оценка подтасована! (Стоит 150 влияния, шанс 30% отменить)"
 zg361.4.c:0 "Сдаться. Плыть по течению. (Стресс снижен, −10 к оценке следующего года)"
 zg361.4.d:0 "Вкалывать. Пусть результаты следующего года скажут сами за себя. (Стресс повышен, +10 к оценке следующего года)"
 zg361.5.t:0 "Список на увольнение по нижнему разряду"
 zg361.5.desc:0 "В этом цикле [TopScope.GetValue('zg361_n_elim')|0] чиновников дважды подряд получили оценку 3.25 и подлежат увольнению по нижнему разряду. Список лежит на вашем столе; кисть с красной тушью — в вашей руке. (Можете также разобрать их по одному во вкладке двора.)\n\nКак вы их уладите?"
 zg361.5.a:0 "По букве закона. (Каждого судят по делам, благосклонности и способностям: опала, вынужденная отставка или понижение)"
 zg361.5.b:0 "Явить милость — понизить всех, но оставить на службе. (−100 престижа)"
 zg361.5.c:0 "Даровать ещё год испытательного срока. (−50 престижа, двор благодарен за мягкость)"
 zg361.6.t:0 "Вы в списке на увольнение"
 zg361.6.desc:0 "Две оценки 3.25 подряд — и лезвие увольнения по нижнему разряду наконец пало на вас. Приказные вашего сюзерена уже разъехались со списком по адресам.\n\nУ вас осталось последнее окно."
 zg361.6.a:0 "Последняя апелляция! Требовать пересмотра! (Стоит 200 влияния, шанс 40% заменить на понижение — неудача означает лишение титула)"
 zg361.6.b:0 "Потратить состояние на нужные ладони. (Стоит 300 золота, понижение с сохранением на службе)"
 zg361.6.c:0 "Принять отставку с достоинством."
 zg361.6.d:0 "Поднять мятеж! (Создать фракцию независимости против своего сюзерена)"
 zg361.10.t:0 "Калибровочное совещание по оценкам"
 zg361.10.desc:0 "На вашем столе — черновой реестр ведомства: [TopScope.GetValue('zg361_n_375')|0] отмечены как превзошедшие ожидания, [TopScope.GetValue('zg361_n_35')|0] — соответствующие им, [TopScope.GetValue('zg361_n_325')|0] — нуждающиеся в улучшении.\n\nПока результаты не вывешены, кисть ещё в ваших руках. Возвысить кого-то, сместить кого-то — но если придворные прознают о подтасовке, они назовут вещи своими именами: липовая проверка."
 zg361.10.a:0 "Список верен. Вывесить."
 zg361.10.b:0 "Возвысить одного: поменять местами последнего с 3.75 и первого с 3.5."
 zg361.10.c:0 "Сместить одного: столкнуть последнего с 3.5 в 3.25."
 zg361.11.t:0 "Красная кисть поставлена"
 zg361.11.desc:0 "Вы поднимаете красную кисть и мягко передвигаете имя вверх по списку. Тот, кого подвинули, никогда не узнает, что его сюзерен за одну ночь передумал."
 zg361.11.a:0 "Вывесить результаты."
 zg361.12.t:0 "Красная кисть поставлена"
 zg361.12.desc:0 "Вы поднимаете красную кисть и добавляете имя на край списка. Кто-то ведь должен получить эти 3.25 — почему бы не он?"
 zg361.12.a:0 "Вывесить результаты."
 zg361.20.t:0 "Оценка эффективности"
 zg361.20.desc:0 "Оценка эффективности идёт."
 zg361.20.a:0 "Продолжить."
 zg361.30.t:0 "Дикие псы и белые кролики"
 zg361.30.desc:0 "Оценочное ведомство приложило к своей секретной докладной вторую страницу: [TopScope.GetValue('zg361_n_dog')|0] \"диких псов\" — блестящие результаты, скверные ценности; и [TopScope.GetValue('zg361_n_rabbit')|0] \"белых кроликов\" — верны сверх меры, к работе непригодны.\n\nНи те, ни другие не годятся для долгой службы. Что прикажете?"
 zg361.30.a:0 "Сбалансированная милость: диких псов оставить под наблюдением, кроликам утешение."
 zg361.30.b:0 "Наказать диких псов и отправить кроликов на покой. (+50 престижа; дикие псы теряют заслуги и попадают в PIP, кролики уходят в отставку)"
 zg361_scoreboard_open:0 "Табло оценок"
 zg361_scoreboard_open_tooltip:0 "Открыть последнее опубликованное табло оценок чиновников."
 zg361_scoreboard_title:0 "Табло оценок небесных чиновников"
 zg361_scoreboard_year:0 "Год проверки"
 zg361_scoreboard_total:0 "Когорта"
 zg361_scoreboard_grade_375:0 "#P 3.75#!"
 zg361_scoreboard_grade_35:0 "#V 3.5#!"
 zg361_scoreboard_grade_325:0 "#N 3.25#!"
 zg361_scoreboard_dash:0 "—"
 zg361_scoreboard_status_promotion:0 "#P Путь повышения#!"
 zg361_scoreboard_status_pip:0 "#N PIP#!"
 zg361_scoreboard_col_rank:0 "Место"
 zg361_scoreboard_col_official:0 "Чиновник / Должность"
 zg361_scoreboard_col_kpi:0 "KPI"
 zg361_scoreboard_col_values:0 "Ценности"
 zg361_scoreboard_col_grade:0 "Оценка"
 zg361_scoreboard_col_streak:0 "Серия"
 zg361_scoreboard_col_status:0 "Статус"
 zg361_scoreboard_hint:0 "Выберите чиновника, чтобы открыть его карточку. В последнем опубликованном списке остаются те, кто позже покинул должность."
 zg361_scoreboard_tab_managed:0 "Ваши подчинённые"
 zg361_scoreboard_tab_received:0 "Ваша когорта оценки"
 zg361_scoreboard_reviewer:0 "Оценивающий сюзерен"
 zg361_scoreboard_former_official:0 "Бывший чиновник (оставлен в опубликованном списке)"
 zg361_jingcha_phase_desc:0 "Прямые подчинённые отчитываются о работе, пока их сюзерен лично проверяет записи."
 activity_zg361_jingcha_destination_selection:0 "Выберите место проведения ревизии"
 activity_zg361_jingcha_guest_help_text:0 "Прямые действующие чиновники будут приглашены в резиденцию сюзерена для оценки."
 activity_zg361_jingcha_cooldown:0 "Большая ревизия на перезарядке"
 activity_zg361_jingcha_predicted_cost:0 "Большая ревизия — установленная обязанность, не стоит ни казне, ни личному золоту."
 activity_zg361_jingcha_host_an_a:0 "$host_activity_a$"
 zg361_refused_jingcha:0 "Отказано в проведении большой ревизии"
 zg361.40.t:0 "Срок ревизии подошёл"
 zg361.40.desc:0 "Реестры, счета и записи о заслугах готовы. По закону я обязан созвать прямых действующих чиновников в мою резиденцию для большой ревизии, не взимая платы ни с казны, ни с моего собственного кошелька.\n\nЕсли я нарушу эту обязанность, мой прямой сюзерен запишет это как крупный провал в управлении. Если же сюзерена нет, пострадает авторитет самого учреждения."
 zg361.40.a:0 "Провести ревизию, как положено"
 zg361.40.a.tt:0 "Открыть бесплатный планировщик мероприятий. Ревизию нужно завершить за 300 дней; просто открыть и закрыть планировщик — долга не исполняет."
 zg361.40.b:0 "В этом году проводить не буду"
 zg361.40.b.tt:0 "Если есть прямой сюзерен: его отношение к вам падает, а ваша следующая проверка получает одноразовый штраф KPI в 50.\nКак независимый верховный сюзерен: −200 престижа, никакой поддельной самооценки."
 zg361.41.t:0 "Ревизия просрочена"
 zg361.41.desc:0 "Срок большой ревизии истёк, а она так и не завершилась."
 zg361.41.a:0 "Запись об исполнении закрыта"
 zg361_view_result_statement_decision:0 "Посмотреть личный лист оценки"
 zg361_view_result_statement_decision_desc:0 "Открыть последнее замороженное дело об оценке: фактический диапазон, итоговый балл, расшифровку KPI, статус вручения и реальные расчётные квитанции."
 zg361_view_result_statement_decision_tooltip:0 "Просмотреть последний личный лист оценки без пересчёта."
 zg361_view_result_statement_decision_confirm:0 "Открыть дело"
 zg361.50.t:0 "Уведомление об оценке 3.25: требуется подпись"
 zg361.50.desc:0 "[zg361_reviewing_superior.GetShortUIName] вручил(а) ваше официальное уведомление об оценке.\n\nИтоговый балл: 3.25 (нуждается в улучшении)\nЗамороженный KPI: [TopScope.GetValue('zg361_notice_kpi')|0]   Место в оценочной группе: [TopScope.GetValue('zg361_notice_rank')|0] из [TopScope.GetValue('zg361_notice_cohort')|0]\nКод фактического диапазона: [TopScope.GetValue('zg361_notice_absolute_grade')|0] (3=3.75, 2=3.5, 1=3.25)\n\nМожно подписать, а можно подписать с возражением. Отказ от подписи лишь меняет способ вручения на засвидетельствованное через семь дней; балл, PIP и четырёхкратный расчёт никуда не денутся. Коронная фраза системы уже готова: вы вправе не соглашаться, но уведомление всё равно будет показано как вручённое."
 zg361.50.a:0 "Принять к сведению. Получено — не значит понравилось."
 zg361.50.b:0 "Принять с возражением. Подпись — не согласие."
 zg361.50.c:0 "Отказаться от подписи. (Засвидетельствованное вручение через семь дней)"
 zg361.51.t:0 "Уведомление об оценке 3.25: засвидетельствованное вручение"
 zg361.51.desc:0 "Засвидетельствованное вручение после отказа проведено."
 zg361.52.t:0 "Часы апелляции по оценке"
 zg361.52.desc:0 "Срок формальной апелляции по данному делу истёк."
 zg361.53.t:0 "Личный расчётный лист оценки"
 zg361.53.desc:0 "Ответственный за оценку: [zg361_reviewing_superior.GetShortUIName]\nЗамороженный KPI: [TopScope.GetValue('zg361_stmt_kpi')|0]   Место в оценочной группе: [TopScope.GetValue('zg361_stmt_rank')|0] из [TopScope.GetValue('zg361_stmt_cohort')|0]"
 zg361.53.absolute_375:0 "\n#bold Фактический диапазон: 3.75 (абсолютные факты превзошли ожидания)#!"
 zg361.53.absolute_35:0 "\n#bold Фактический диапазон: 3.5 (абсолютные факты соответствуют ожиданиям)#!"
 zg361.53.absolute_325:0 "\n#bold Фактический диапазон: 3.25 (абсолютные факты требуют улучшения)#!"
 zg361.53.grade_375:0 "Итоговый балл: #P 3.75 (превосходит ожидания)#!"
 zg361.53.grade_35:0 "Итоговый балл: #V 3.5 (соответствует ожиданиям)#!"
 zg361.53.grade_325:0 "Итоговый балл: #N 3.25 (требуется улучшение)#!"
 zg361.53.reason_0:0 "Основание оценки: фактический и итоговый диапазоны совпадают."
 zg361.53.reason_1:0 "Основание оценки: на калибровке вас вытеснили из квоты 3.75."
 zg361.53.reason_2:0 "Основание оценки: на калибровке вас подняли в квоту 3.75."
 zg361.53.reason_3:0 "Основание оценки: калибровка перевела вас в 3.25."
 zg361.53.reason_4:0 "Основание оценки: калибровка вытащила вас из ячейки 3.25."
 zg361.53.reason_5_c:0 "Основание оценки: #N ваши факты дотягивали до планки, но принудительное распределение требовало C, и квота выбрала вас.#!"
 zg361.53.reason_5:0 "Основание оценки: принудительное распределение опустило итоговый диапазон ниже фактического."
 zg361.53.reason_6:0 "Основание оценки: защита новичка не позволила сразу повесить C в этом цикле."
 zg361.53.reason_7:0 "Основание оценки: место в рейтинге и квота подняли вас выше фактического диапазона."
 zg361.53.reason_8:0 "Основание оценки: в оценочной группе один-два человека, принудительное распределение не запускается, итоговый балл нейтрально приведён к 3.5."
 zg361.53.evidence:0 "\n#bold Расшифровка KPI#!\nУправление [TopScope.GetValue('zg361_stmt_governance')|0]   Компетенции [TopScope.GetValue('zg361_stmt_capability')|0]   Рост [TopScope.GetValue('zg361_stmt_growth')|0]   Оценка руководства [TopScope.GetValue('zg361_stmt_superior')|0]\nЦенности [TopScope.GetValue('zg361_stmt_values')|0]   Коллаборация [TopScope.GetValue('zg361_stmt_collaboration')|0]   Цинча [TopScope.GetValue('zg361_stmt_jingcha')|0]   Организационный климат [TopScope.GetValue('zg361_stmt_organization')|0]\nЗафиксированная оценка ценностей [TopScope.GetValue('zg361_stmt_values_score')|0]"
 zg361.53.service:0 "\n#bold Запись о вручении#!\nКод способа вручения [TopScope.GetValue('zg361_stmt_delivery_method')|0] (1 — принято, 2 — с возражением, 3 — засвидетельствовано, 4 — автоматически)   Год вручения [TopScope.GetValue('zg361_stmt_delivered_year')|0]   Флаг открытой апелляции [TopScope.GetValue('zg361_stmt_appeal_open')|0]"
 zg361.53.receipts:0 "\n#bold Квитанции четырёхкратного расчёта#!\nУдержано: местная казна [TopScope.GetValue('zg361_stmt_treasury_paid')|0]   личное золото [TopScope.GetValue('zg361_stmt_gold_paid')|0]   заслуги [TopScope.GetValue('zg361_stmt_merit_paid')|0]   флаг урезания жалованья [TopScope.GetValue('zg361_stmt_salary_cut')|0]\nВозвращено: местная казна [TopScope.GetValue('zg361_stmt_treasury_refunded')|0]   личное золото [TopScope.GetValue('zg361_stmt_gold_refunded')|0]   заслуги [TopScope.GetValue('zg361_stmt_merit_refunded')|0]"
 zg361.53.state_1:0 "\nСостояние дела: готово к вручению; четырёхкратный расчёт ещё не проведён."
 zg361.53.state_2:0 "\nСостояние дела: подпись отклонена, ожидается засвидетельствованное вручение; отказ не отменяет оценку."
 zg361.53.state_3:0 "\nСостояние дела: официально вручено/опубликовано; все применимые расчёты проведены идемпотентно."
 zg361.53.state_4:0 "\nСостояние дела: срок апелляции истёк без пересмотра."
 zg361.53.state_5:0 "\nСостояние дела: #P пересмотрено в 3.5; фиксированные штрафы возвращены однократно по квитанциям, дальнейшее удержание жалованья прекращено.#!"
 zg361.53.a:0 "Закрыть дело."
