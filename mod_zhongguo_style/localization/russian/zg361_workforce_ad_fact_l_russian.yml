l_russian:
 zg361wad.referral.t:0 "A Referral Must Have an Author"
 zg361wad.referral.desc:0 "You are the named referrer for [scope:zg361_wad_referral_subject_scope.GetShortUIName]. Submit the relationship openly and leave a case-bound receipt, or deny authorship; nobody else may sign in your place."
 zg361wad.referral.submit:0 "Submit my referral and disclose the relationship"
 zg361wad.referral.decline:0 "I did not make this referral"
 zg361wad.vote.t:0 "Seal Your Own Interview Vote"
 zg361wad.vote.desc:0 "You are one of three distinct managers interviewing [scope:zg361_wad_panel_subject_scope.GetShortUIName]. Record your own judgment before any debrief; the receipt binds this vote to you and this named candidate."
 zg361wad.vote.a:0 "Strong evidence: advance the candidate"
 zg361wad.vote.b:0 "Mixed evidence: keep the candidate under review"
 zg361wad.vote.c:0 "Insufficient evidence: do not advance"
 zg361wad.offer.t:0 "The Offer Is Yours to Answer"
 zg361wad.offer.desc:0 "[ROOT.MakeScope.Var('zg361_wad_offer_source_owner').Char.GetShortUIName] has delivered an appointment offer to you. The current game source exposes no more detailed pay or authority schedule on this card, so accept only if the proposal is sufficient; otherwise record the exact blocking category. The manager cannot answer for you."
 zg361wad.offer.accept:0 "Accept the offer"
 zg361wad.offer.refuse_pay:0 "Refuse: compensation is inadequate"
 zg361wad.offer.refuse_role:0 "Refuse: the role or authority is wrong"
 zg361wad.offer.refuse_move:0 "Refuse: relocation or reporting terms are unacceptable"
