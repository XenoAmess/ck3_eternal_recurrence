 zg361m.25.t:0 "No.025 · Переманивание сильных и контрпредложения"
 zg361m.25.desc:0 "[D / P2] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review. This item has no connected business case yet: it configures policy and changes only the organizational ledger; it does not directly execute the example personnel, payment, or resource action."
 zg361m.25.a:0 "Record route A preference: Make costed written offers only to sustained top performers with stalled advancement and a lawful vacancy, requiring the old manager to answer with a real role or pay. (organizational ledger only)"
 zg361m.25.b:0 "Record route B preference: Raid visible stars with verbal promotion promises to strengthen quickly, driving pay inflation, hollow commitments, and inter-team retaliation. (organizational ledger only)"
 zg361m.25.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.26.t:0 "No.026 · Реальный вклад и видимость для руководства: два реестра"
 zg361m.26.desc:0 "[E / P0] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review. This item has no connected business case yet: it configures policy and changes only the organizational ledger; it does not directly execute the example personnel, payment, or resource action."
 zg361m.26.a:0 "Record route A preference: Freeze real contribution and superior visibility separately and use skip-level interviews to recover low-visibility work, accepting extra verification effort. (organizational ledger only)"
 zg361m.26.b:0 "Record route B preference: Allocate subjective points quickly from this cycle's presentation quality and relationship heat, rewarding showmanship now while letting hollow material beat governance temporarily. (organizational ledger only)"
 zg361m.26.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.27.t:0 "No.027 · Реестр межотдельческого вклада"
 zg361m.27.desc:0 "[E / P1] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review. This item has no connected business case yet: it configures policy and changes only the organizational ledger; it does not directly execute the example personnel, payment, or resource action."
 zg361m.27.a:0 "Record route A preference: Freeze owner, lead, collaborator, rescuer, and blocker roles for joint work and divide one capped outcome pool, accepting ledger maintenance cost. (organizational ledger only)"
 zg361m.27.b:0 "Record route B preference: Let the project owner claim the result and leave others to argue afterward, settling fast while encouraging credit capture and duplicate claims. (organizational ledger only)"
