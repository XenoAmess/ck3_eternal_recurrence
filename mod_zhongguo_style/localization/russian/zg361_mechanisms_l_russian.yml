 zg361m.250.t:0 "#250 · Явка против вклада в решение"
 zg361m.250.desc:0 "[AB / P1] Эта политика ведётся через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и потому влияет на дальнейшие результаты команды и оценку самого руководителя."
