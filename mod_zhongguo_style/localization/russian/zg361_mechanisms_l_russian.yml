 zg361m.29.desc:0 "[E / P1] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review. This item has no connected business case yet: it configures policy and changes only the organizational ledger; it does not directly execute the example personnel, payment, or resource action."
 zg361m.29.a:0 "Record route A preference: Audit metrics against real governance baselines, record gaming side effects, and claw back rewards while charging enablers when fraud is proven. (organizational ledger only)"
 zg361m.29.b:0 "Record route B preference: Reward striking tax or order numbers first and investigate only after failure, stimulating short-term figures while magnifying delayed harm and fraud payoff. (organizational ledger only)"
