 zg361m.28.t:0 "No.028 · Арбитраж перехвата заслуг и разбор сваливания вины"
 zg361m.28.desc:0 "[E / P1] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review. This item has no connected business case yet: it configures policy and changes only the organizational ledger; it does not directly execute the example personnel, payment, or resource action."
 zg361m.28.a:0 "Record route A preference: Assign a unique responsibility ID to each result or incident and apportion credit or blame from ledgers, witnesses, and frozen versions, paying for a hearing. (organizational ledger only)"
 zg361m.28.b:0 "Record route B preference: Name a hero or scapegoat immediately to end the dispute, stabilizing the story fast while damaging peer trust and creating an appeal path for a bad ruling. (organizational ledger only)"
