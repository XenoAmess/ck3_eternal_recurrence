 zg361m.67.a:0 "Record route A preference: Resolve duplicate leaders through open competition, a two-person transition, and lawful reassignment, recording comparison evidence and paying temporary dual-role cost. (organizational ledger only)"
 zg361m.67.b:0 "Record route B preference: Preselect a favorite and remove the other leader immediately, eliminating overlap fast while worsening factions, appeals, and loss of critical experience. (organizational ledger only)"
 zg361m.67.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.68.t:0 "No.068 · Переносимая история и местное повторное доказательство"
 zg361m.68.desc:0 "[J / P1] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review. This item has no connected business case yet: it configures policy and changes only the organizational ledger; it does not directly execute the example personnel, payment, or resource action."
 zg361m.68.a:0 "Record route A preference: Carry frozen ratings, result context, disputes, and open PIP into the new role and set one protected ramp with explicit re-proof goals. (organizational ledger only)"
 zg361m.68.b:0 "Record route B preference: Put the transferee into full local distribution immediately and let the new superior use prior history selectively, integrating competition fast while risking duplicate punishment or quota capture. (organizational ledger only)"
 zg361m.68.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.69.t:0 "No.069 · Формальная доставка и часы апелляции"
 zg361m.69.desc:0 "[K / P0] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и тем самым влияет на последующие результаты команды и собственную оценку руководителя."
 zg361m.69.a:0 "Доставлять замороженную запись лично, разрешать подписанное несогласие и использовать свидетеля при отказе, запуская часы апелляции и расчёта по каждому пункту."
 zg361m.69.b:0 "Считать каждый результат доставленным при публикации и немедленно проводить расчёт, действуя быстрее всего, но заставляя людей без оснований пропускать апелляции и опрокидывая процесс."
 zg361m.69.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.70.t:0 "No.070 · Окно анти-мести после апелляции"
 zg361m.70.desc:0 "[K / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и тем самым влияет на последующие результаты команды и собственную оценку руководителя."
 zg361m.70.a:0 "Требовать новых фактов для перевода, снятия, снижения жалования и новой негативной обратной связи в течение года и выборочно проверять их независимо, принимая работу по надзору."
 zg361m.70.b:0 "Позволять менеджеру сразу после апелляции переставлять роли и полномочия ради восстановления контроля, действуя быстро, но делая обратные основания похожими на месть."
 zg361m.70.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.71.t:0 "No.071 · Эссе во внутреннем форуме и публичная эскалация"
 zg361m.71.desc:0 "[K / P2] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и тем самым влияет на последующие результаты команды и собственную оценку руководителя."
 zg361m.71.a:0 "После исчерпания частного обсуждения и формальной апелляции разрешать подкреплённое доказательствами подписанное эссе для модерируемой проверки и финансировать посредничество и фактчекинг."
 zg361m.71.b:0 "Позволять субъекту сразу публиковать подписанный или анонимный разоблачитель, добиваясь поддержки и быстрого внимания руководства, но сжигая репутацию обеих сторон и внутреннее доверие."
 zg361m.71.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.72.t:0 "No.072 · Преждевременная утечка грейдов эффективности"
 zg361m.72.desc:0 "[K / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и тем самым влияет на последующие результаты команды и собственную оценку руководителя."
 zg361m.72.a:0 "Ограничить доступ к материалам калибровки, вести журнал просмотров и использовать единое время доставки, чтобы все готовили апелляции одинаково, принимая затраты на администрирование конфиденциальности."
 zg361m.72.b:0 "Предупреждать фаворитов втихую или распускать рейтинги для проверки реакции команды, управляя реакцией рано, но провоцируя досрочные уходы, согласованные истории и недоверие панели."
 zg361m.72.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.73.t:0 "No.073 · Разделение злонамеренных утечек и добросовестного сигнализирования"
 zg361m.73.desc:0 "[K / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и тем самым влияет на последующие результаты команды и собственную оценку руководителя."
 zg361m.73.a:0 "Независимое место проверяет подлинность, общественную цель и элементы мести, защищая настоящие сообщения и наказывая манипуляции ценой специального расследования."
 zg361m.73.b:0 "Классифицировать каждую несанкционированную утечку как нарушение и немедленно наказывать, быстро восстанавливая секретность, но подавляя настоящие доказательства мошенничества."
 zg361m.73.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.74.t:0 "No.074 · Честное сокращение против «отмытых оценок»"
 zg361m.74.desc:0 "[K / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и тем самым влияет на последующие результаты команды и собственную оценку руководителя."
 zg361m.74.a:0 "Открыто убирать должность по организационным причинам, оплачивать выход из казны и сохранять нейтральную запись, тратя деньги ради чистой истории эффективности."
 zg361m.74.b:0 "Сначала ставить 3.25, а затем дёшево сокращать человека за низкую эффективность, быстро сжимаясь, но рискуя восстановлением санкций и тяжёлым ударом по двум уровням менеджмента."
 zg361m.74.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.75.t:0 "No.075 · Пакет добровольного ухода с чистой записью"
 zg361m.75.desc:0 "[K / P2] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и тем самым влияет на последующие результаты команды и собственную оценку руководителя."
 zg361m.75.a:0 "Предложить аутсайдеру реальное выходное пособие, нейтральную запись в послужном списке и явное кадровое (HC) освобождение, оплатив расходы из казны и сохранив его настоящее право отказаться."
 zg361m.75.b:0 "Требовать к сроку неоплачиваемый добровольный уход или немедленно запускать PIP, быстро сокращая затраты, но рискуя переквалификацией как принудительного сокращения."
 zg361m.75.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.76.t:0 "No.076 · Многоуровневая ответственность за сбой процедуры"
 zg361m.76.desc:0 "[K / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет доставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную оценку руководителя."
 zg361m.76.a:0 "После пересмотра — разделить ответственность за недостающие доказательства, слабый контроль, проектную ошибку и ложные заявления между участниками и записать долю каждого в следующую управленческую оценку, приняв совместный разбор."
 zg361m.76.b:0 "Возложить весь сбой процедуры на прямого руководителя или партийного куратора ради быстрого закрытия дела: наказание прозрачно, но это прячет системный изъян и поощряет перекладывание вины."
 zg361m.76.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.77.t:0 "No.077 · Ротация независимых рецензентов"
 zg361m.77.desc:0 "[K / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет доставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную оценку руководителя."
 zg361m.77.a:0 "Ротировать рецензентов из числа равных руководителей без прямых связей, давать каждой стороне по одному мотивированному отводу и вести учёт качества проверок, принимая кадровые издержки."
 zg361m.77.b:0 "Поручить исходной комиссии быстро исправить решение при ограниченном объёме новых доказательств: экономится управленческое время, но те же люди защищают собственный вывод, что снижает доверие."
 zg361m.77.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.78.t:0 "No.078 · Панель справедливости распределения"
 zg361m.78.desc:0 "[K / P2] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет доставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную оценку руководителя."
 zg361m.78.a:0 "Показывать многолетние различия по новичкам, переводам, родству, фракции, должности и стажу, сопоставляя их с данными о возможностях, и направлять аномалии только людям для разъяснений."
 zg361m.78.b:0 "При малейшей аномалии доли в подгруппе принудительно менять оценки или наказывать руководителя: коррекция самая быстрая, но малые выборки и реальные деловые различия принимаются за дискриминацию."
 zg361m.78.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.79.t:0 "No.079 · Приёмные часы через уровень"
 zg361m.79.desc:0 "[K / P2] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет доставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную оценку руководителя."
 zg361m.79.a:0 "Каждый цикл открывать несколько мест по записи для сигналов о препятствиях, результатах и апелляциях, формировать задачи на расследование, тратить время старших, не меняя оценки на месте."
 zg361m.79.b:0 "Разрешить старшему правителю прямо на аудиенции обещать ресурсы или точечно менять оценку внука-подчинённого: быстрый отклик на настроения, но это обходит прямых руководителей и подогревает «прыжки через уровень»."
 zg361m.79.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.80.t:0 "No.080 · Публичный тикет на дефект метрики"
 zg361m.80.desc:0 "[K / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет доставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную оценку руководителя."
 zg361m.80.a:0 "Открыто регистрировать дефекты «накручиваемых», конфликтующих или искажённых метрик, требовать от владельца метрики письменно исправить их или принять риск и учитывать институциональный вклад автора сигнала."
 zg361m.80.b:0 "Приказать владельцу немедленно закрыть тикет и удержать текущую метрику до конца оценки: в краткосрочной перспективе сопоставимость сохраняется, но при будущем скандале вина расползается на разработчика метрики."
 zg361m.80.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.81.t:0 "No.081 · Иерархическое сжатие информации об эффективности"
 zg361m.81.desc:0 "[K / P2] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет доставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную оценку руководителя."
 zg361m.81.a:0 "Открывать по ролям доступ к исходным доказательствам, сводкам и центральной проверке и фиксировать, кто что видел, принимая издержки на администрирование прав и приватность."
 zg361m.81.b:0 "Заставить каждый уровень подавать лишь одну сводную таблицу рейтинга ради скорости решений: поток информации самый короткий, но это усиливает присвоение заслуг, искажения и непоправимый «чёрный ящик»."
 zg361m.81.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.82.t:0 "No.082 · Формула совокупного вознаграждения"
 zg361m.82.desc:0 "[L / P1] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review. This item has no connected business case yet: it configures policy and changes only the organizational ledger; it does not directly execute the example personnel, payment, or resource action."
 zg361m.82.a:0 "Record route A preference: Separate base stipend, role allowance, performance, spot, and deferred awards, funding each from the treasury under affordability caps. (organizational ledger only)"
 zg361m.82.b:0 "Record route B preference: Shift compensation heavily into current performance awards to intensify 361, producing a strong short-term stimulus while magnifying anxiety, credit grabs, and fiscal volatility. (organizational ledger only)"
 zg361m.82.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.83.t:0 "No.083 · Множители премии королевство — команда — личность"
 zg361m.83.desc:0 "[L / P1] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review. This item has no connected business case yet: it configures policy and changes only the organizational ledger; it does not directly execute the example personnel, payment, or resource action."
 zg361m.83.a:0 "Record route A preference: Freeze realm, team, and individual multipliers at cycle start, preserving team sharing and individual reward at the cost of more complex settlement. (organizational ledger only)"
 zg361m.83.b:0 "Record route B preference: Shift bonus weight abruptly to individual ratings, widening top-tier rewards fast while letting credit grabs and competition in failing teams run wild. (organizational ledger only)"
 zg361m.83.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.84.t:0 "No.084 · Отложенная премия и переход прав"
 zg361m.84.desc:0 "[L / P2] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review. This item has no connected business case yet: it configures policy and changes only the organizational ledger; it does not directly execute the example personnel, payment, or resource action."
 zg361m.84.a:0 "Record route A preference: Create a three-year vesting ledger for long-term awards, reserve treasury funds, specify exit and reversal terms, and pay annually, accepting future fiscal commitments. (organizational ledger only)"
 zg361m.84.b:0 "Record route B preference: Pay the entire award now for a strong retention signal, simplifying settlement while making fraud or project reversals hard to claw back and straining the current treasury. (organizational ledger only)"
 zg361m.84.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.85.t:0 "No.085 · Обрыв стимула продления"
 zg361m.85.desc:0 "[L / P2] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review. This item has no connected business case yet: it configures policy and changes only the organizational ledger; it does not directly execute the example personnel, payment, or resource action."
 zg361m.85.a:0 "Record route A preference: Track vesting endpoints early, reserve renewal packages by criticality and succession risk, and compare peers openly, accepting long-term budget cost. (organizational ledger only)"
 zg361m.85.b:0 "Record route B preference: Wait until departure is imminent and make an emergency counteroffer or verbal renewal, saving money now while creating cliff exits, promise debt, and pay inequity. (organizational ledger only)"
 zg361m.85.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.86.t:0 "No.086 · Удержание и взыскание премии"
 zg361m.86.desc:0 "[L / P1] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review. This item has no connected business case yet: it configures policy and changes only the organizational ledger; it does not directly execute the example personnel, payment, or resource action."
 zg361m.86.a:0 "Record route A preference: Predeclare holdback ratios, audit dates, and fraud clawback terms for high-risk projects and retain a settlement record for every payment. (organizational ledger only)"
 zg361m.86.b:0 "Record route B preference: Hold or claw back the full award as soon as suspicion appears, protecting the treasury fast while inviting appeals and exits through retroactive rules. (organizational ledger only)"
 zg361m.86.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.87.t:0 "No.087 · Зарплатные вилки и позиция внутри вилки"
 zg361m.87.desc:0 "[L / P1] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review. This item has no connected business case yet: it configures policy and changes only the organizational ledger; it does not directly execute the example personnel, payment, or resource action."
 zg361m.87.a:0 "Record route A preference: Audit tenure, scarcity, performance history, and band position and repair evidenced low placement and inversion first, accepting salary-budget cost. (organizational ledger only)"
 zg361m.87.b:0 "Record route B preference: Cap base pay firmly and give band-top stars only a spot bonus, defending the band quickly while increasing exits among top performers and inverted veterans. (organizational ledger only)"
 zg361m.87.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.88.t:0 "No.088 · Рыночные и результативные повышения — борьба за бюджет"
 zg361m.88.desc:0 "[L / P1] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review. This item has no connected business case yet: it configures policy and changes only the organizational ledger; it does not directly execute the example personnel, payment, or resource action."
 zg361m.88.a:0 "Record route A preference: Split the raise pool into market scarcity, 3.75 reward, and internal-equity ledgers, queue them by evidence, and publish the budget tradeoff. (organizational ledger only)"
 zg361m.88.b:0 "Record route B preference: Give the entire raise pool to current 3.75 performers to sharpen the signal, acting decisively while leaving scarce roles and inverted employees open to poaching. (organizational ledger only)"
