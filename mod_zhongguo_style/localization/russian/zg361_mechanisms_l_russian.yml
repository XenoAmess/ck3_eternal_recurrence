 zg361m.39.t:0 "No.039 · Управление знаменателем и заморозка списков"
 zg361m.39.desc:0 "[G / P1] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review. This item has no connected business case yet: it configures policy and changes only the organizational ledger; it does not directly execute the example personnel, payment, or resource action."
 zg361m.39.a:0 "Record route A preference: Lock the roster of secondees, absentees, transfers, and leavers before calibration and require a formal reason and audit trail for every change. (organizational ledger only)"
 zg361m.39.b:0 "Record route B preference: Move strong people out or weak people in just before the deadline to fill quotas, protecting the core now while risking reopened calibration and managerial charges. (organizational ledger only)"
