 zg361m.32.t:0 "No.032 · Собственная командная результативность руководителя"
 zg361m.32.desc:0 "[F / P0] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную аттестацию руководителя."
 zg361m.32.a:0 "Оценивать руководителей по замороженным целям прошлого цикла, Цзинча, пересмотрам, PIP, удержанию и HC, принимая расходы межциклового учёта."
 zg361m.32.b:0 "Судить только по рангу команды в текущем цикле и сразу жёстко наказывать за отказ от ревизий, низкие оценки и утечку кадров: исполнение твёрдое, но дела внуков рекурсивно становятся виной руководителя."
 zg361m.32.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.33.t:0 "No.033 · Архетипы руководителей и объяснимые коды причин"
 zg361m.33.desc:0 "[F / P0] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную аттестацию руководителя."
 zg361m.33.a:0 "Закрепить за стилями «аналитик», «защитник» и другими стабильные веса и коды причин, ограниченные жёсткими доказательствами, приняв расходы на сопровождение объяснений."
 zg361m.33.b:0 "Позволить характеру и связям руководителя перебивать пограничные доказательства ради быстрого решения: правители ярче, но одинаковые дела становятся невоспроизводимыми."
 zg361m.33.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.34.t:0 "No.034 · Матрица «результативность × потенциал» 3×3"
 zg361m.34.desc:0 "[F / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную аттестацию руководителя."
 zg361m.34.a:0 "Калибровать матрицу по замороженной результативности за несколько циклов, темпу роста и соответствию роли, затем финансировать развитие или мобильность по квадрантам."
 zg361m.34.b:0 "Быстро помечать высокий потенциал и выход по оценке и таланту этого цикла, концентрируя ресурсы, но позволяя одному результату определять карьеру."
 zg361m.34.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.35.t:0 "No.035 · Жёсткая 361, мягкая 361 или смешанный порог"
 zg361m.35.desc:0 "[F / P2] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную аттестацию руководителя."
 zg361m.35.a:0 "Использовать смесь абсолютных порогов и относительного ранжирования, сохраняя распределение, но смягчая санкции низа для реально прошедших, оплачивая двойную проверку."
 zg361m.35.b:0 "Жёстко соблюдать 3-6-1 и заполнять каждую нижнюю позицию: правило ясное и быстрое, но и при всеобщей успешности создаёт жертву."
 zg361m.35.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.36.t:0 "No.036 · Десятилетний доклад об институте"
 zg361m.36.desc:0 "[F / P2] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную аттестацию руководителя."
 zg361m.36.a:0 "Заморозить годовые оценки, пересмотры, PIP, повышения, HC, бонусы, убыль и реальное управление и собрать десятилетний тренд, приняв расходы на долгосрочную отчётность."
 zg361m.36.b:0 "Публиковать только текущую таблицу и несколько ярких метрик: историю успеха создать сразу, но убыль и упадок управления скрыты за аккуратным распределением."
 zg361m.36.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.37.t:0 "No.037 · Обмен квотами между командами"
 zg361m.37.desc:0 "[G / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную аттестацию руководителя."
 zg361m.37.a:0 "Разрешить двум командам обмен одной оценочной ячейкой по вкладу, сложности и историческому долгу, регистрируя политический кредит, ресурсы и возврат в следующем цикле."
 zg361m.37.b:0 "Запретить переговоры и заставить каждую команду заполнять локальную квоту: закрытие быстрое, но случайный низкий результат малой группы и реальные различия остаются без коррекции."
 zg361m.37.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.38.t:0 "No.038 · Объединённая калибровка малых когорт"
 zg361m.38.desc:0 "[G / P1] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review. This item has no connected business case yet: it configures policy and changes only the organizational ledger; it does not directly execute the example personnel, payment, or resource action."
 zg361m.38.a:0 "Record route A preference: Pool small samples with comparable functions or use an external absolute-threshold review, accepting cross-unit coordination and explanation cost. (organizational ledger only)"
 zg361m.38.b:0 "Record route B preference: Force 3-6-1 within three or four people to preserve autonomy, avoiding pooling while sharply increasing accidental Cs, appeals, and exits. (organizational ledger only)"
