 zg361m.355.b:0 "Сделать пик прошлого цикла новым минимумом и продолжать наращивать давление ради большей отдачи"
 zg361m.355.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.356.t:0 "#356 · Накопление хороших новостей и арбитраж на дедлайнах"
