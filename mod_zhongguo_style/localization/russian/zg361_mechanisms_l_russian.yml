 zg361m.356.b:0 "Учитывать только на дедлайне и продолжать наращивать цели, оставляя чиновникам сглаживание"
 zg361m.356.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.357.t:0 "#357 · Сначала зафиксировать факты, затем применять квоту 361"
