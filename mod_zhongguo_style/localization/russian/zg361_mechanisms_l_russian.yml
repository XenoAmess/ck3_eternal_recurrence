l_russian:
 zg361_next_mechanism_decision:0 "Рассмотреть следующую политику эффективности"
 zg361_next_mechanism_decision_desc:0 "Откройте следующий нерешённый пункт в каталоге политик 361 и сделайте выбор, который попадёт в организационный реестр."
 zg361_next_mechanism_decision_tooltip:0 "Открыть следующую карту политик 361."
 zg361_next_mechanism_decision_confirm:0 "Вызвать следующего владельца политики"
 zg361_reference_charter_decision:0 "Развернуть эталонный устав 361"
 zg361_reference_charter_decision_desc:0 "Примите рекомендуемые значения по умолчанию для всех 361 политик разом. Это экономит десятки лет совещаний и сразу же несёт полные административные, финансовые и организационные последствия."
 zg361_reference_charter_decision_tooltip:0 "Разрешить все 361 пункт одним реальным, изменяющим состояние пакетом."
 zg361_reference_charter_decision_confirm:0 "Внедрить всё портфолио целиком"
 zg361_mechanism_choice_a_tt:0 "Долгосрочный путь: улучшает доказательную базу, доверие или возможности, но расходует административный, финансовый или краткосрочный ресурс поставок."
 zg361_mechanism_choice_b_tt:0 "Спринтерский путь: улучшает немедленный результат, но переносит риск, выгорание, техдолг или долг по апелляциям в будущие проверки."
 zg361_mechanism_choice_c_tt:0 "Путь отсрочки: экономит усилия сейчас, но фиксирует долг политик, который попадёт в оценку вашего вышестоящего."
 zg361_scoreboard_tab_system:0 "Кокпит политик"
 zg361_ledger_title:0 "Реестр политик 361: что скрывается под панелью показателей"
 zg361_ledger_configured:0 "Утверждённые механизмы"
 zg361_ledger_checksum:0 "Контрольная сумма портфолио"
 zg361_ledger_explainer:0 "Положительное — не всегда хорошо: административная нагрузка, риск апелляций, техдолг, выгорание, давление HC, долг по оплате, долг политик и бюджетное давление становятся опасными по мере роста."
 zg361_ledger_evidence:0 "Качество доказательств"
 zg361_ledger_trust:0 "Организационное доверие"
 zg361_ledger_admin_load:0 "Нагрузка администрирования эффективности"
 zg361_ledger_appeal_risk:0 "Риск апелляций и процедур"
 zg361_ledger_delivery:0 "Поставленная ценность"
 zg361_ledger_stability:0 "Стабильность"
 zg361_ledger_tech_debt:0 "Технический долг"
 zg361_ledger_data_quality:0 "Качество данных"
 zg361_ledger_burnout:0 "Организационное выгорание"
 zg361_ledger_talent:0 "Здоровье талантов"
 zg361_ledger_hc_pressure:0 "Давление численности"
 zg361_ledger_pay_debt:0 "Долг по оплате"
 zg361_ledger_policy_debt:0 "Долг политик"
 zg361_ledger_budget_pressure:0 "Бюджетное давление"
 zg361_ledger_hint:0 "Эти реестры влияют на следующий KPI команды и на оценку вашего менеджмента вышестоящим."
 zg361_org_high_trust:0 "Организационное доверие: руководство держит слово"
 zg361_org_high_trust_desc:0 "Доказательства, обратная связь и поставки усиливают друг друга."
 zg361_org_admin_overload:0 "Перегрузка администрирования эффективности"
 zg361_org_admin_overload_desc:0 "Все заняты тем, что объясняют, почему все заняты."
 zg361_org_burnout_crisis:0 "Кризис организационного выгорания"
 zg361_org_burnout_crisis_desc:0 "Часы онлайн выглядят отлично; заряд людей — не очень."
 zg361_org_delivery_stable:0 "Стабильная культура поставки"
 zg361_org_delivery_stable_desc:0 "Не каждый релиз начинается с составления извинений."
 zg361_org_tech_debt_crisis:0 "Накопление технического долга"
 zg361_org_tech_debt_crisis_desc:0 "Вчерашняя короткая дорога стала сегодняшним пунктом оплаты."
 zg361_org_talent_healthy:0 "Здоровый кадровый конвейер"
 zg361_org_talent_healthy_desc:0 "Звёзды, преемники и стабильные сотрудники — у всех есть путь вперёд."
 zg361m.1.t:0 "#001 · Детализированный лист доказательств KPI"
 zg361m.1.desc:0 "[A / P0] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставки, доказательства, доверие, нагрузку, риск, таланты или финансовое давление и потому влияет на дальнейшие результаты команды и собственную оценку руководителя."
 zg361m.1.a:0 "Создайте детализированный лист доказательств, зафиксируйте кейсы по результативности, эффективности, росту, взаимодействию и ценностям, а также оплатите работу по оформлению и ревизии."
 zg361m.1.b:0 "Немедленно установить грейд по итоговому баллу и впечатлению руководителя, быстро обнародовать, но затруднить отслеживание пропусков и ошибок."
 zg361m.1.c:0 "Отложить и зафиксировать явный долг политик"
 zg361m.2.t:0 "#002 · Годовой OKR-направление и KPI-контракт"
 zg361m.2.desc:0 "[A / P0] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставки, доказательства, доверие, нагрузку, риск, таланты или финансовое давление и потому влияет на дальнейшие результаты команды и собственную оценку руководителя."
 zg361m.2.a:0 "Заморозить направления по ролям, базовые линии и нормальные цели, разрешив один сброс при кризисе с подтверждением, ценой постоянного отслеживания."
 zg361m.2.b:0 "Всем подразделениям задать агрессивные цели и удерживать исходную линию, купив короткий спринт риском манипуляций метриками и сокрытия проблем."
 zg361m.2.c:0 "Отложить и зафиксировать явный долг политик"
 zg361m.3.t:0 "#003 · Серединный чек-ин и сброс целей"
 zg361m.3.desc:0 "[A / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставки, доказательства, доверие, нагрузку, риск, таланты или финансовое давление и потому влияет на дальнейшие результаты команды и собственную оценку руководителя."
 zg361m.3.a:0 "Провести серединный коучинг-обзор, записать риски и ресурсы, разрешить один задокументированный сброс при кризисе, потратив время руководителя ради объяснимой итоговой оценки."
 zg361m.3.b:0 "Удержать стартовые цели и требовать догоняющего дедлайна, избегая работы по сбросу, но рискуя приписать стратегические изменения личным провалам и задержать плохие новости."
 zg361m.3.c:0 "Отложить и зафиксировать явный долг политик"
 zg361m.4.t:0 "#004 · Самооценка и разрыв восприятия"
 zg361m.4.desc:0 "[A / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставки, доказательства, доверие, нагрузку, риск, таланты или финансовое давление и потому влияет на дальнейшие результаты команды и собственную оценку руководителя."
 zg361m.4.a:0 "Требовать самооценку с подтверждающими результатами и обязывать руководителя отвечать на каждый разрыв восприятия, принимая затраты на обсуждение ради проверяемой записи."
 zg361m.4.b:0 "Получить одностраничную самопрезентацию и быстро скорректировать субъективный балл за хвастовство или скромность, экономя время, но путая подачу с результатом."
 zg361m.4.c:0 "Отложить и зафиксировать явный долг политик"
 zg361m.5.t:0 "#005 · Ролевые скоринговые карты"
 zg361m.5.desc:0 "[A / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставки, доказательства, доверие, нагрузку, риск, таланты или финансовое давление и потому влияет на дальнейшие результаты команды и собственную оценку руководителя."
 zg361m.5.a:0 "Заморозить разные веса для управленческих, военных, финансовых и административных ролей до калибровки в той же прямой когорте, приняв расходы на множество скоринговых карт."
 zg361m.5.b:0 "Принудительно ранжировать все роли по одной таблице результатов для быстрого исполнения, систематически наказывая плохо измеримую работу и усиливая ролевое несоответствие."
 zg361m.5.c:0 "Отложить и зафиксировать явный долг политик"
 zg361m.6.t:0 "#006 · Корректировка стартовой точки и сложности"
 zg361m.6.desc:0 "[A / P2] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставки, доказательства, доверие, нагрузку, риск, таланты или финансовое давление и потому влияет на дальнейшие результаты команды и собственную оценку руководителя."
 zg361m.6.a:0 "Заморозить унаследованные базовые линии, ресурсы и сложность роли, разрешая только ограниченные корректировки, потратив аудиторские усилия ради более справедливых сравнений."
 zg361m.6.b:0 "Оценивать только абсолютные годовые результаты и давить на богатые подразделения сильнее, получая быструю таблицу, но поощряя наследственное богатство и наказывая работу по расчистке."
 zg361m.6.c:0 "Отложить и зафиксировать явный долг политик"
 zg361m.7.t:0 "#007 · Спина к спине приглашения к 360° оценке"
 zg361m.7.desc:0 "[B / P0] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставки, доказательства, доверие, нагрузку, риск, таланты или финансовое давление и потому влияет на дальнейшие результаты команды и собственную оценку руководителя."
 zg361m.7.a:0 "Приглашать небольшое число реальных соисполнителей, требовать конкретные кейсы и перекрёстно их проверять, оплачивая административные расходы на приглашение и дедупликацию."
 zg361m.7.b:0 "Широко рассылать приглашения и сразу взвешивать высокие и низкие голоса, быстро усиливая сигнал, но открывая пространство для взаимной похвалы, мести и шаблонной воды."
 zg361m.7.c:0 "Отложить и зафиксировать явный долг политик"
 zg361m.8.t:0 "#008 · Мягкость/жёсткость оценщика и кредит доверия коллег"
 zg361m.8.desc:0 "[B / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставки, доказательства, доверие, нагрузку, риск, таланты или финансовое давление и потому влияет на дальнейшие результаты команды и собственную оценку руководителя."
 zg361m.8.a:0 "Поддерживать историческое среднее, дисперсию, долю отмен и точность каждого оценщика и калибровать его вес, принимая долгосрочные затраты на управление данными."
 zg361m.8.b:0 "Принять в этом цикле сырые оценки коллег и наказывать исказителей только после апелляций, быстро закрывая цикл, но позволяя мягким и жёстким оценщикам формировать рейтинг первыми."
 zg361m.8.c:0 "Отложить и зафиксировать явный долг политик"
 zg361m.9.t:0 "#009 · Панель калибровочного совещания"
 zg361m.9.desc:0 "[B / P0] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставки, доказательства, доверие, нагрузку, риск, таланты или финансовое давление и потому влияет на дальнейшие результаты команды и собственную оценку руководителя."
 zg361m.9.a:0 "Показывать вместе KPI, ценности, цели, 360°, тренды и доказательства апелляций, фиксируя каждый перевод грейда как квотно-нейтральный обмен."
 zg361m.9.b:0 "Закрыть таблицу за одно совещание по текущим итогам и остаткам квот, действуя быстро, но выдавливая пограничные случаи и невидимый вклад."
 zg361m.9.c:0 "Отложить и зафиксировать явный долг политик"
 zg361m.10.t:0 "#010 · Назначение C и защита подчинённого"
 zg361m.10.desc:0 "[B / P0] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставки, доказательства, доверие, нагрузку, риск, таланты или финансовое давление и потому влияет на дальнейшие результаты команды и собственную оценку руководителя."
 zg361m.10.a:0 "Выбирать низший грейд по замороженным доказательствам; если руководитель защищает, открыто списать престиж и KPI управления следующего цикла, сохраняя доверие ценой реального институционального расхода."
 zg361m.10.b:0 "Назначить C сразу новичку или периферийному участнику ради квоты, закрывая распределение сейчас, но копя риск апелляций, обиды и оттока."
 zg361m.10.c:0 "Отложить и зафиксировать явный долг политик"
 zg361m.11.t:0 "#011 · Калибровка через уровень и место HR-комиссара"
 zg361m.11.desc:0 "[B / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставки, доказательства, доверие, нагрузку, риск, таланты или финансовое давление и потому влияет на дальнейшие результаты команды и собственную оценку руководителя."
 zg361m.11.a:0 "Позволить вышестоящему через уровень проверять только распределение, крайние доказательства и процесс, возвращая слабые списки прямому руководителю ценой ещё одного совещания."
 zg361m.11.b:0 "Позволить креслу через уровень напрямую править грейды внучатых сотрудников для быстрой коррекции, обходя переделку, но подрывая власть прямого руководителя и открывая лоббизм."
 zg361m.11.c:0 "Отложить и зафиксировать явный долг политик"
 zg361m.12.t:0 "#012 · Раскрытие конфликта интересов и отвод"
 zg361m.12.desc:0 "[B / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставки, доказательства, доверие, нагрузку, риск, таланты или финансовое давление и потому влияет на дальнейшие результаты команды и собственную оценку руководителя."
 zg361m.12.a:0 "Раскрывать родство, близость, вражду и покровительство до калибровки и заменять отведённых оценщиков независимым креслом, принимая расходы на формирование состава и задержки."
 zg361m.12.b:0 "Позволить руководителю открыто настаивать или действовать втихую, чтобы быстро защитить или наказать, контролируя результат, но резко повышая риск отмены и собственного штрафа."
 zg361m.12.c:0 "Отложить и зафиксировать явный долг политик"
 zg361m.13.t:0 "#013 · Прозрачная, поэтапная или чёрноящичная публикация"
 zg361m.13.desc:0 "[B / P2] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставки, доказательства, доверие, нагрузку, риск, таланты или финансовое давление и потому влияет на дальнейшие результаты команды и собственную оценку руководителя."
 zg361m.13.a:0 "Дать каждому субъекту замороженные основания и путь апелляции, публиковать команде грейды и сводные правила, ввести контроль доступа для чувствительных оценок коллег."
 zg361m.13.b:0 "Сообщать каждому только итоговый грейд и засекречивать основания, быстро снижая открытые конфликты, но усиливая подозрения, управление вверх и апелляции."
 zg361m.13.c:0 "Отложить и зафиксировать явный долг политик"
 zg361m.14.t:0 "#014 · Досье апелляции по эффективности"
 zg361m.14.desc:0 "[C / P0] Чиновник подаёт апелляцию с замороженными доказательствами после обсуждения дела с прямым начальником. В случае удовлетворения начальник пересчитывает результат, по отдельности возвращает три немедленных сбора 3.25 в местную казну, личное золото и заслуги, немедленно прекращает незавершённое годичное удержание жалованья в 25% и корректирует место в рейтинге; отклонённая или злонамеренная апелляция обходится в положение и доверие."
 zg361m.14.a:0 "Собрать замороженные доказательства по типу ошибки, потребовать обсуждения перед независимой проверкой и согласовать пересчёт, все три немедленных возврата и прекращение удержания жалованья по отдельности."
 zg361m.14.b:0 "Позволить прежнему руководителю отклонить или пересмотреть грейд на месте, быстро закрывая спор, но рискуя двойными штрафами, неверными возвратами и закреплением конфликта."
 zg361m.14.c:0 "Отложить и зафиксировать явный долг политик"
 zg361m.15.t:0 "#015 · Карта улучшений PIP"
 zg361m.15.desc:0 "[C / P0] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставки, доказательства, доверие, нагрузку, риск, таланты или финансовое давление и потому влияет на дальнейшие результаты команды и собственную оценку руководителя."
 zg361m.15.a:0 "Согласовать проверяемые вехи, поддержку и контрольные точки в рамках полномочий субъекта, потратив ресурсы на действительно достижимый шанс улучшения."
 zg361m.15.b:0 "Установить жёсткие вехи и твёрдый дедлайн, записать отказ как серьёзное отрицательное доказательство, действуя быстро, но создавая видимость предрешённого ухода."
 zg361m.15.c:0 "Отложить и зафиксировать явный долг политик"
 zg361m.16.t:0 "#016 · Бюджет поддержки PIP и «только метрики, без ресурсов»"
 zg361m.16.desc:0 "[C / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставки, доказательства, доверие, нагрузку, риск, таланты или финансовое давление и потому влияет на дальнейшие результаты команды и собственную оценку руководителя."
 zg361m.16.a:0 "Профинансировать наставника, временные ресурсы управления и расписание внимания для PIP, записывая каждое вложение, платя из бюджета ради проверки реального улучшения."
 zg361m.16.b:0 "Ставить цели без ресурсов и принудительно проверять к дедлайну, экономя текущий бюджет, но превращая провал в доказательство апелляции и удар по менеджеру."
 zg361m.16.c:0 "Отложить и зафиксировать явный долг политик"
 zg361m.17.t:0 "#017 · Лестница действий для слабейших"
 zg361m.17.desc:0 "[C / P0] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставки, доказательства, доверие, нагрузку, риск, таланты или финансовое давление и потому влияет на дальнейшие результаты команды и собственную оценку руководителя."
 zg361m.17.a:0 "При первом низком грейде использовать обсуждение, PIP и законный перевод; снижать полномочия или освобождать HC только после повторных неудач, оплачивая расходы на развитие."
 zg361m.17.b:0 "Сразу замораживать повышение, понижать или снимать слабейшего для роста плотности талантов, быстро освобождая позиции, но создавая страх, вакансии и концентрированные апелляции."
 zg361m.17.c:0 "Отложить и зафиксировать явный долг политик"
 zg361m.18.t:0 "#018 · Личная грамота и четверной расчёт"
 zg361m.18.desc:0 "[C / P0] В этой замороженной записи показаны оценка, KPI, место в рейтинге, начальник и причины. Для 3.25 также указаны местная казна -50, личное золото -25, заслуги -60, жалованье -25% на один год и статус возврата или прекращения удержания по апелляции."
 zg361m.18.a:0 "Заморозить при расчёте оценку, место в рейтинге, начальника, причины, три немедленных сбора в казну, личное золото и заслуги, а также годичное удержание жалованья, отдельно отмечая каждую выплату, возврат и прекращение."
 zg361m.18.b:0 "Объединять списания по живым значениям при открытии дела и показывать их сразу, укорачивая процесс, но рискуя ошибками при смене руководителя, изменении баланса и повторных открытиях."
 zg361m.18.c:0 "Отложить и зафиксировать явный долг политик"
 zg361m.19.t:0 "#019 · Входные ворота для повышения"
 zg361m.19.desc:0 "[D / P0] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставки, доказательства, доверие, нагрузку, риск, таланты или финансовое давление и потому влияет на дальнейшие результаты команды и собственную оценку руководителя."
 zg361m.19.a:0 "Проверять устойчиво высокую результативность, ценности, статус PIP, выслугу и законную вакансию до открытия повышения, принимая затраты на разбор кандидатов."
 zg361m.19.b:0 "Позволить спонсору выдвинуть звезду цикла в обход части ворот, чтобы быстро удержать, рискуя пустым повышением и спорами о прошлом."
 zg361m.19.c:0 "Отложить и зафиксировать явный долг политик"
 zg361m.20.t:0 "#020 · Пакет повышения и межподразделенческая защита"
 zg361m.20.desc:0 "[D / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставки, доказательства, доверие, нагрузку, риск, таланты или финансовое давление и потому влияет на дальнейшие результаты команды и собственную оценку руководителя."
 zg361m.20.a:0 "Построить пакет повышения из замороженных управленческих результатов, влияния на команду и повторно используемых методов, затем записать пограничное решение межподразделенческой комиссии."
 zg361m.20.b:0 "Позволить спонсору вести одну устную презентацию и решить быстро, благоприятствуя сильной подаче, но рискуя тем, что упаковка перевесит устойчивые результаты."
 zg361m.20.c:0 "Отложить и зафиксировать явный долг политик"
 zg361m.21.t:0 "#021 · Матрица бонусов и повышения оклада"
 zg361m.21.desc:0 "[D / P1] Правитель распределяет ограниченный премиальный пул оценки: оценка 3.75 получает премию или краткосрочное повышение оклада, 3.5 остаётся без изменений, а 3.25 сохраняет четыре вида взысканий. Награды за верхний сегмент реально истощают казну, тогда как неоднократно обойдённые вниманием таланты с оценкой 3.75 могут попросить перевода или уйти."
 zg361m.21.a:0 "Заранее опубликовать матрицу грейд—бонус—повышение и зафиксировать общий пул, реально профинансировав выполнение верхних грейдов ценой текущих финансов."
 zg361m.21.b:0 "Сконцентрировать ограниченные средства на нескольких верхних грейдах и отложить повышение базового оклада, быстро усиливая сигнал, но копя долги по оплате, инверсии и риск переманивания."
 zg361m.21.c:0 "Отложить и зафиксировать явный долг политик"
 zg361m.22.t:0 "#022 · Мягкий бюджет HC / штатное расписание"
 zg361m.22.desc:0 "[D / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставки, доказательства, доверие, нагрузку, риск, таланты или финансовое давление и потому влияет на дальнейшие результаты команды и собственную оценку руководителя."
 zg361m.22.a:0 "Установить годовой бюджет набора, развития и доукомплектования по результатам команды, финансам и вакансиям, отслеживая каждую позицию по использованию и возврату."
 zg361m.22.b:0 "Расширять или замораживать мощности по текущему давлению и предпочтениям руководителя, быстро поддерживая приоритеты, но оставляя низковидимые команды без людей и поощряя накопление слотов."
 zg361m.22.c:0 "Отложить и зафиксировать явный долг политик"
 zg361m.23.t:0 "#023 · Защита HC и окупаемость инвестиций в команду"
 zg361m.23.desc:0 "[D / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставки, доказательства, доверие, нагрузку, риск, таланты или финансовое давление и потому влияет на дальнейшие результаты команды и собственную оценку руководителя."
 zg361m.23.a:0 "Защищать HC достижением целей, отменами, оттоком и финансовой эффективностью и регистрировать обязательства для проверки следующего цикла, принимая годовую работу по ревизии."
 zg361m.23.b:0 "Срочно занимать или добавлять мощности по срочности и отношениям, снимая давление сейчас, но усиливая кредит HC и риск выгорания при провале обещаний."
 zg361m.23.c:0 "Отложить и зафиксировать явный долг политик"
 zg361m.24.t:0 "#024 · Внутренняя мобильность и торг о переводах"
 zg361m.24.desc:0 "[D / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставки, доказательства, доверие, нагрузку, риск, таланты или финансовое давление и потому влияет на дальнейшие результаты команды и собственную оценку руководителя."
 zg361m.24.a:0 "Заморозить предыдущую историю, установить новую базовую линию и согласовать передачу и доукомплектование при переводах, тратя время на законный путь для неподходящих и звёзд."
 zg361m.24.b:0 "Позволить прежнему руководителю блокировать или новому руководителю немедленно забирать сотрудника, сохраняя или получая выпуск сейчас, но создавая заначки, вакансии и долг репутации."
 zg361m.24.c:0 "Отложить и зафиксировать явный долг политик"
 zg361m.25.t:0 "#025 · Переманивание сильных и контрпредложения"
 zg361m.25.desc:0 "[D / P2] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставки, доказательства, доверие, нагрузку, риск, таланты или финансовое давление и потому влияет на дальнейшие результаты команды и собственную оценку руководителя."
 zg361m.25.a:0 "Делать стоящие письменные предложения только устойчивым топ-исполнителям с застрявшим ростом и законной вакансией, требуя от прежнего руководителя ответа реальной ролью или оплатой."
 zg361m.25.b:0 "Охотиться на видимых звёзд устными обещаниями повышения для быстрого усиления, разгоняя рост оплаты, пустые обещания и межкомандную месть."
 zg361m.25.c:0 "Отложить и зафиксировать явный долг политик"
 zg361m.26.t:0 "#026 · Реальный вклад и видимость для руководства: два реестра"
 zg361m.26.desc:0 "[E / P0] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную аттестацию руководителя."
 zg361m.26.a:0 "Заморозить реальный вклад и видимость руководством по отдельности и провести проверки вышестоящим руководителем, чтобы выявить работу с низкой видимостью, согласившись на дополнительные усилия по проверке."
 zg361m.26.b:0 "Быстро распределять субъективные баллы по качеству презентации этого цикла и близости отношений, награждая показуху сразу, но позволяя пустым материалам временно побеждать управление."
 zg361m.26.c:0 "Отложить решение и записать явный долг политики"
 zg361m.27.t:0 "#027 · Реестр межотдельческого вклада"
 zg361m.27.desc:0 "[E / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную аттестацию руководителя."
 zg361m.27.a:0 "Заморозить роли владельца, ведущего, соисполнителя, спасателя и блокера в совместной работе и распределить один ограниченный пул результата, приняв расходы на ведение реестра."
 zg361m.27.b:0 "Позволить владельцу проекта единолично присвоить результат, а остальным спорить постфактум: расчёт быстрый, но поощряется перехват заслуг и повторные заявки."
 zg361m.27.c:0 "Отложить решение и записать явный долг политики"
 zg361m.28.t:0 "#028 · Арбитраж перехвата заслуг и разбор сваливания вины"
 zg361m.28.desc:0 "[E / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную аттестацию руководителя."
 zg361m.28.a:0 "Назначить каждому результату или инциденту уникальный идентификатор ответственности и распределять заслугу или вину по реестрам, свидетелям и замороженным версиям, оплачивая слушание."
 zg361m.28.b:0 "Сразу назначить героя или козла отпущения, чтобы закрыть спор: нарратив стабилизируется быстро, но страдает доверие коллег и остаётся путь апелляции при плохом решении."
 zg361m.28.c:0 "Отложить решение и записать явный долг политики"
 zg361m.29.t:0 "#029 · Подкрутка метрик, подделка и ревизия Цзинча"
 zg361m.29.desc:0 "[E / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную аттестацию руководителя."
 zg361m.29.a:0 "Сверять метрики с реальной базой управления, фиксировать побочные эффекты подкрутки и отзывать награды при доказанном мошенничестве, наказывая пособников."
 zg361m.29.b:0 "Сначала выдавать баллы за яркие цифры налогов или порядка и проверять только после провала: стимулируются краткосрочные показатели, но растут отложенный ущерб и выгода от подделок."
 zg361m.29.c:0 "Отложить решение и записать явный долг политики"
 zg361m.30.t:0 "#030 · Ресурсные скачки и борьба за бюджет"
 zg361m.30.desc:0 "[E / P2] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную аттестацию руководителя."
 zg361m.30.a:0 "Профинансировать малые конкурирующие пилоты под общими вехами и заморозить сохранение бюджета и даты возврата, оплатив стоимость двух испытаний."
 zg361m.30.b:0 "Позволить спонсору сразу выбрать одну команду и поставить на кон HC и бюджет: фокус возникает быстро, но хорошо упакованный провал оборачивается организационным убытком."
 zg361m.30.c:0 "Отложить решение и записать явный долг политики"
 zg361m.31.t:0 "#031 · Сеть патронов / спонсоров"
 zg361m.31.desc:0 "[E / P2] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную аттестацию руководителя."
 zg361m.31.a:0 "Допускать патронов к столу обсуждения только при раскрытых связях, срочных поручительствах и при сохранённых порогах жёстких доказательств."
 zg361m.31.b:0 "Позволить патронам напрямую перепрыгивать очереди повышения, HC или ревизий, быстро мобилизуя власть, но привязывая организацию к связям и выживанию патрона."
 zg361m.31.c:0 "Отложить решение и записать явный долг политики"
 zg361m.32.t:0 "#032 · Собственная командная результативность руководителя"
 zg361m.32.desc:0 "[F / P0] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную аттестацию руководителя."
 zg361m.32.a:0 "Оценивать руководителей по замороженным целям прошлого цикла, Цзинча, пересмотрам, PIP, удержанию и HC, принимая расходы межциклового учёта."
 zg361m.32.b:0 "Судить только по рангу команды в текущем цикле и сразу жёстко наказывать за отказ от ревизий, низкие оценки и утечку кадров: исполнение твёрдое, но дела внуков рекурсивно становятся виной руководителя."
 zg361m.32.c:0 "Отложить решение и записать явный долг политики"
 zg361m.33.t:0 "#033 · Архетипы руководителей и объяснимые коды причин"
 zg361m.33.desc:0 "[F / P0] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную аттестацию руководителя."
 zg361m.33.a:0 "Закрепить за стилями «аналитик», «защитник» и другими стабильные веса и коды причин, ограниченные жёсткими доказательствами, приняв расходы на сопровождение объяснений."
 zg361m.33.b:0 "Позволить характеру и связям руководителя перебивать пограничные доказательства ради быстрого решения: правители ярче, но одинаковые дела становятся невоспроизводимыми."
 zg361m.33.c:0 "Отложить решение и записать явный долг политики"
 zg361m.34.t:0 "#034 · Матрица «результативность × потенциал» 3×3"
 zg361m.34.desc:0 "[F / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную аттестацию руководителя."
 zg361m.34.a:0 "Калибровать матрицу по замороженной результативности за несколько циклов, темпу роста и соответствию роли, затем финансировать развитие или мобильность по квадрантам."
 zg361m.34.b:0 "Быстро помечать высокий потенциал и выход по оценке и таланту этого цикла, концентрируя ресурсы, но позволяя одному результату определять карьеру."
 zg361m.34.c:0 "Отложить решение и записать явный долг политики"
 zg361m.35.t:0 "#035 · Жёсткая 361, мягкая 361 или смешанный порог"
 zg361m.35.desc:0 "[F / P2] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную аттестацию руководителя."
 zg361m.35.a:0 "Использовать смесь абсолютных порогов и относительного ранжирования, сохраняя распределение, но смягчая санкции низа для реально прошедших, оплачивая двойную проверку."
 zg361m.35.b:0 "Жёстко соблюдать 3-6-1 и заполнять каждую нижнюю позицию: правило ясное и быстрое, но и при всеобщей успешности создаёт жертву."
 zg361m.35.c:0 "Отложить решение и записать явный долг политики"
 zg361m.36.t:0 "#036 · Десятилетний доклад об институте"
 zg361m.36.desc:0 "[F / P2] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную аттестацию руководителя."
 zg361m.36.a:0 "Заморозить годовые оценки, пересмотры, PIP, повышения, HC, бонусы, убыль и реальное управление и собрать десятилетний тренд, приняв расходы на долгосрочную отчётность."
 zg361m.36.b:0 "Публиковать только текущую таблицу и несколько ярких метрик: историю успеха создать сразу, но убыль и упадок управления скрыты за аккуратным распределением."
 zg361m.36.c:0 "Отложить решение и записать явный долг политики"
 zg361m.37.t:0 "#037 · Обмен квотами между командами"
 zg361m.37.desc:0 "[G / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную аттестацию руководителя."
 zg361m.37.a:0 "Разрешить двум командам обмен одной оценочной ячейкой по вкладу, сложности и историческому долгу, регистрируя политический кредит, ресурсы и возврат в следующем цикле."
 zg361m.37.b:0 "Запретить переговоры и заставить каждую команду заполнять локальную квоту: закрытие быстрое, но случайный низкий результат малой группы и реальные различия остаются без коррекции."
 zg361m.37.c:0 "Отложить решение и записать явный долг политики"
 zg361m.38.t:0 "#038 · Объединённая калибровка малых когорт"
 zg361m.38.desc:0 "[G / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную аттестацию руководителя."
 zg361m.38.a:0 "Объединять малые выборки со схожими функциями или проводить внешнюю ревизию по абсолютному порогу, принимая расходы на межгрупповую координацию и объяснения."
 zg361m.38.b:0 "Принудительно держать 3-6-1 в группе из трёх-четырёх человек ради автономии, избегая объединения, но резко повышая случайные C, апелляции и увольнения."
 zg361m.38.c:0 "Отложить решение и записать явный долг политики"
 zg361m.39.t:0 "#039 · Управление знаменателем и заморозка списков"
 zg361m.39.desc:0 "[G / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную аттестацию руководителя."
 zg361m.39.a:0 "Заморозить список командированных, отсутствующих, переведённых и уходящих перед калибровкой и требовать формальную причину и аудиторский след для каждого изменения."
 zg361m.39.b:0 "Перед дедлайном перемещать сильных наружу или вталкивать слабых внутрь для заполнения квот: ядро защищено сейчас, но возможны переоткрытие калибровки и обвинения руководителя."
 zg361m.39.c:0 "Отложить решение и записать явный долг политики"
 zg361m.40.t:0 "#040 · Серая схема «уходящий получает C»"
 zg361m.40.desc:0 "[G / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную аттестацию руководителя."
 zg361m.40.a:0 "Оценивайте уходящих сотрудников по зафиксированным фактическим показателям и ведите отдельный учёт организационного выхода и замещения, принимая реальное давление вакансий и квот."
 zg361m.40.b:0 "Спишите нижнюю позицию на того, кто и так уходит, чтобы нынешняя команда прошла проверку: мгновенный покой ценой фальсификации распределения, замещения и оценки талантов."
 zg361m.40.c:0 "Отложить решение и записать явный долг политики"
 zg361m.41.t:0 "#041 · Защита, включение или жертва новичков"
 zg361m.41.desc:0 "[G / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную аттестацию руководителя."
 zg361m.41.a:0 "Защищать новичков от квоты первого цикла, задать цели адаптации, наставника и фиксированную дату включения, приняв расходы на развитие и давление на старожилов."
 zg361m.41.b:0 "Сразу полностью оценивать новичков и делать их первыми кандидатами на нижнюю ячейку: квота C заполняется быстро, но страдают успехи наставников, репутация найма и удержание."
 zg361m.41.c:0 "Отложить решение и записать явный долг политики"
 zg361m.42.t:0 "#042 · Поочерёдное несение C между циклами"
 zg361m.42.desc:0 "[G / P2] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную аттестацию руководителя."
 zg361m.42.a:0 "Межциклово проверять фиксированные схемы ротации, восстанавливать индивидуальные доказательства и медировать обещания компенсации, тратя усилия ревизии на возврат различимости оценок."
 zg361m.42.b:0 "При подозрении на ротацию сразу понижать вес всей группы и разрывать сговор: сдерживание быстрое, но возможны ложные срабатывания и обида от нарушения договорённостей."
 zg361m.42.c:0 "Отложить решение и записать явный долг политики"
 zg361m.43.t:0 "#043 · Места выступления и бюджет внимания на калибровке"
 zg361m.43.desc:0 "[G / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную аттестацию руководителя."
 zg361m.43.a:0 "Заблаговременно распределять несколько мест выступления, требовать письменные доказательства по пограничным кандидатам и учитывать потраченные внимание и политический капитал руководителя."
 zg361m.43.b:0 "Позволять руководителям перебивать время ради любимчиков, пока оценка не сдвинется: можно быстро спасти одного, но тихие вкладчики вытесняются и терпение начальства иссякает."
 zg361m.43.c:0 "Отложить решение и записать явный долг политики"
 zg361m.44.t:0 "#044 · Слепой первый проход и именная ревизия"
 zg361m.44.desc:0 "[G / P2] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную аттестацию руководителя."
 zg361m.44.a:0 "Сначала ранжировать доказательства без имён и связей, затем именным проходом учитывать сложность роли и направлять большие расхождения на ревизию, принимая два круга работы."
 zg361m.44.b:0 "Сразу ранжировать по именам под знакомым начальником: завершение быстрее, но фаворитизм, вражда и шум сразу попадают в результат."
 zg361m.44.c:0 "Отложить решение и записать явный долг политики"
 zg361m.45.t:0 "#045 · Обратная связь без сюрпризов: долг предупреждений"
 zg361m.45.desc:0 "[G / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную аттестацию руководителя."
 zg361m.45.a:0 "Фиксировать факт, наставление и ответ сотрудника сразу при появлении проблемы и до итоговой оценки проверять улучшение, принимая расходы на постоянную обратную связь."
 zg361m.45.b:0 "Впервые объявить 3.25 в конце года и силой итога заставить принять: трудный разговор быстро закончен, но резко растут пересмотры и долг руководителя по обратной связи."
 zg361m.45.c:0 "Отложить решение и записать явный долг политики"
 zg361m.46.t:0 "#046 · Аудит распределения возможностей"
 zg361m.46.desc:0 "[G / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную аттестацию руководителя."
 zg361m.46.a:0 "Перед калибровкой проводить аудит богатых земель, ключевых проектов, подкреплений и возможностей для видимости, признавать неравенство и применять только ограниченные поправки на сложность."
 zg361m.46.b:0 "Оценивать только итоговый результат и быстро награждать получивших лучшие возможности: стандарт прост, но фаворитизм отмывается в «потенциал» и «результативность»."
 zg361m.46.c:0 "Отложить решение и записать явный долг политики"
 zg361m.47.t:0 "#047 · Свежесть памяти и окно доказательств"
 zg361m.47.desc:0 "[G / P2] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную аттестацию руководителя."
 zg361m.47.a:0 "В начале цикла заморозить окно доказательств — равные веса за весь год или по ключевым вехам — и сохранить ранние результаты для оспаривания, принимая расходы на полное хранение доказательств."
 zg361m.47.b:0 "На итоговой ревизии сильно взвешивать последний успех или провал: быстрая реакция, но поощряются финишные рывки, скрытые риски и стирание ранней работы."
 zg361m.47.c:0 "Отложить решение и записать явный долг политики"
 zg361m.48.t:0 "#048 · Трудозатраты оценщика и лимит приглашений"
 zg361m.48.desc:0 "[H / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и поэтому влияет на последующие результаты команды и на собственную аттестацию руководителя."
 zg361m.48.a:0 "Ограничить каждого реальными соисполнителями, выборочно проверять качество кейсов и разрешать отказ без контакта, жертвуя охватом ради защиты времени на оценку."
 zg361m.48.b:0 "Обязать всех к широкой взаимной оценке и считать объём форм за сотрудничество: данные набираются быстро, но появляются шаблоны, усталость и политические приглашения."
 zg361m.48.c:0 "Отложить решение и записать явный долг политики"
 zg361m.49.t:0 "#049 · Запечатанная подача и дедлайн"
 zg361m.49.desc:0 "[H / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и поэтому влияет на последующие результаты команды и на собственную аттестацию руководителя."
 zg361m.49.a:0 "Запечатывать взаимные оценки спина к спине и разрешать одну контролируемую позднюю подачу ценой кредита доверия, фиксируя её влияние на полноту доказательств."
 zg361m.49.b:0 "На дедлайне закрыть навсегда и аннулировать все опоздавшие оценки: исполнение чистое, но реальное сотрудничество остаётся без подтверждения и провоцируется договорённость до дедлайна."
 zg361m.49.c:0 "Отложить решение и записать явный долг политики"
 zg361m.50.t:0 "#050 · Пакты взаимного восхваления и предательство"
 zg361m.50.desc:0 "[H / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и поэтому влияет на последующие результаты команды и на собственную аттестацию руководителя."
 zg361m.50.a:0 "Проверять пары оценщиков по взаимной корреляции и выборочно сверять доказательства по общим проектам, принимая расходы на антисговор-анализ и слушания."
 zg361m.50.b:0 "Сразу понижать вес подозреваемых взаимных поднимателей или награждать первого доносчика: пакты рушатся быстро, но стимулируются упреждающее предательство и ложные донесения."
 zg361m.50.c:0 "Отложить решение и записать явный долг политики"
 zg361m.51.t:0 "#051 · Допустимая анонимность и минимальный размер выборки"
 zg361m.51.desc:0 "[H / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и тем самым влияет на последующие результаты команды и собственную оценку руководителя."
 zg361m.51.a:0 "При нехватке минимальной выборки агрегировать, откладывать или запрашивать подписанное согласие и поддерживать контроль доступа к обратной связи, жертвуя детализацией ради защиты оценщиков."
 zg361m.51.b:0 "Немедленно публиковать несколько анонимных комментариев ради пригодности к действиям, получая резкие детали, но делая авторов вычислимыми и провоцируя месть и молчание."
 zg361m.51.c:0 "Отложить и зафиксировать явный долг политики"
 zg361m.52.t:0 "#052 · Сохранять форму оценки, а не только среднее"
 zg361m.52.desc:0 "[H / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и тем самым влияет на последующие результаты команды и собственную оценку руководителя."
 zg361m.52.a:0 "Сохранять исходные распределения и поляризацию и отдельно расследовать конфликты оценок сверху и снизу, принимая больший объём анализа вместо сглаживания в одно среднее."
 zg361m.52.b:0 "Сводить каждую оценку коллег в единый рейтинговый балл, сравнивая быстрее всего, но приравнивая надёжных сотрудников и тех, кто хорош только наверх."
 zg361m.52.c:0 "Отложить и зафиксировать явный долг политики"
 zg361m.53.t:0 "#053 · 360-градусная оценка только для развития"
 zg361m.53.desc:0 "[H / P2] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и тем самым влияет на последующие результаты команды и собственную оценку руководителя."
 zg361m.53.a:0 "Использовать 360-градусную обратную связь для развития и красных линий ценностей, а вознаграждение привязывать к замороженной результативности, оплачивая отдельный коучинг в обмен на откровенность."
 zg361m.53.b:0 "Напрямую привязать оценки коллег к бонусу и грейду ради их веса, укрепляя контроль сейчас, но плодя альянсы, месть и анонимную непрозрачность."
 zg361m.53.c:0 "Отложить и зафиксировать явный долг политики"
 zg361m.54.t:0 "#054 · Отчётность вытесняет реальную работу"
 zg361m.54.desc:0 "[I / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и тем самым влияет на последующие результаты команды и собственную оценку руководителя."
 zg361m.54.a:0 "Ограничить отчётность одностраничной картой фактов и исключениями, защитить часы на работу и выборочно проверять факты, принимая затраты на дизайн шаблона и вдумчивое чтение руководителем."
 zg361m.54.b:0 "Требовать от всех аккуратных длинных еженедельных отчётов ради максимальной видимости, получая сейчас информацию, но превращая время управления в гонку отчётности."
 zg361m.54.c:0 "Отложить и зафиксировать явный долг политики"
 zg361m.55.t:0 "#055 · Места во внимании начальника"
 zg361m.55.desc:0 "[I / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и тем самым влияет на последующие результаты команды и собственную оценку руководителя."
 zg361m.55.a:0 "Чередовать глубокое чтение и места на приёме по риску, вехам и долгой низкой видимости, отслеживая поставку после доступа, принимая затраты на планирование."
 zg361m.55.b:0 "Позволять спонсорам и самым напористым кандидатам перепрыгивать очередь, быстро слышать сильные голоса, но вытесняя тех, кто тушит пожары, и вознаграждая доступ без поставки."
 zg361m.55.c:0 "Отложить и зафиксировать явный долг политики"
 zg361m.56.t:0 "#056 · Перехват заслуг через слои отчётности"
 zg361m.56.desc:0 "[I / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и тем самым влияет на последующие результаты команды и собственную оценку руководителя."
 zg361m.56.a:0 "К восходящим отчётам прикладывать оригинальных авторов, версии и подписи вклада команды и засчитывать руководителям очки за развитие кадров, принимая затраты на поддержание атрибуции."
 zg361m.56.b:0 "Позволять средним менеджерам присваивать результат подчинённых как собственную координационную заслугу, быстро повышая видимость наверх, но накапливая доказательства обхода уровня, нелояльность и отток."
 zg361m.56.c:0 "Отложить и зафиксировать явный долг политики"
 zg361m.57.t:0 "#057 · Следы вклада и подписи версий"
 zg361m.57.desc:0 "[I / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и тем самым влияет на последующие результаты команды и собственную оценку руководителя."
 zg361m.57.a:0 "Фиксировать владельца, участников и подписи версий на ключевых вехах и обращаться к ним только при спорах, повышении или аудите, тратя немного постоянного внимания ради прослеживаемости."
 zg361m.57.b:0 "Не вести версионного следа и решать вклад задним числом через власть и убеждение, минимизируя ежедневную работу, но отдавая споры перехватчикам заслуг."
 zg361m.57.c:0 "Отложить и зафиксировать явный долг политики"
 zg361m.58.t:0 "#058 · Копирование через уровень (CC) и информационная политика"
 zg361m.58.desc:0 "[I / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и тем самым влияет на последующие результаты команды и собственную оценку руководителя."
 zg361m.58.a:0 "Разрешать копирование через уровень только ради значимых результатов или рисков по протоколу, требовать ответа прямого руководителя и сохранять аудиторский след, принимая дополнительную обработку информации."
 zg361m.58.b:0 "Запретить копирование через уровень и заставить всю информацию идти через прямого руководителя, быстро укрепляя цепь командования, но рискуя подавить плохие новости и невидимый вклад."
 zg361m.58.c:0 "Отложить и зафиксировать явный долг политики"
 zg361m.59.t:0 "#059 · Плохие новости: рано, поздно или скрытно"
 zg361m.59.desc:0 "[I / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и тем самым влияет на последующие результаты команды и собственную оценку руководителя."
 zg361m.59.a:0 "При раннем сообщении о риске зафиксировать время, известные факты и решение о помощи, поддержать прозрачных докладчиков и разобрать по итогам, принимая затраты на спасение."
 zg361m.59.b:0 "Требовать от команд решать проблему самостоятельно и отчитываться после оценки, защищая сейчас метрики и внимание, но накапливая ответственность за честность и надзор в случае взрыва."
 zg361m.59.c:0 "Отложить и зафиксировать явный долг политики"
 zg361m.60.t:0 "#060 · Утечка материалов и кража идей"
 zg361m.60.desc:0 "[I / P2] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и тем самым влияет на последующие результаты команды и собственную оценку руководителя."
 zg361m.60.a:0 "Сохранять исходные версии материалов, журналы доступа и условия совместного запуска, отдавая право решить принадлежность независимому месту, принимая затраты на доказательства и арбитраж."
 zg361m.60.b:0 "Позволить получившей команде немедленно упаковать утечку и отчитаться первой ради захвата ресурсов, получая возможную фору, но рискуя жёстким разворотом при появлении подписей."
 zg361m.60.c:0 "Отложить и зафиксировать явный долг политики"
 zg361m.61.t:0 "#061 · Короткие записки и длинные нарративные отчёты"
 zg361m.61.desc:0 "[I / P2] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и тем самым влияет на последующие результаты команды и собственную оценку руководителя."
 zg361m.61.a:0 "Стандартизировать одностраничную карту фактов с прилагаемыми приложениями для сложной кооперации и оставить длинный нарратив для исключений, принимая поддержание шаблонов и указателей."
 zg361m.61.b:0 "Требовать полные нарративные отчёты, чтобы начальник мог сразу впитать контекст, получая сейчас детали, но вознаграждая литературные способности и раздувая церемониальную нагрузку."
 zg361m.61.c:0 "Отложить и зафиксировать явный долг политики"
 zg361m.62.t:0 "#062 · Конфликт целей сплошной и пунктирной линии"
 zg361m.62.desc:0 "[J / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и тем самым влияет на последующие результаты команды и собственную оценку руководителя."
 zg361m.62.a:0 "При конфликте целей добиваться совместного решения обоих начальников по приоритету, ответственности и владению доказательствами, принимая задержку ради единого исполнимого направления."
 zg361m.62.b:0 "Приказать чиновнику подчиняться сплошному начальнику и игнорировать пунктирную поставку, проясняя командование сразу, но оставляя критику проекта и долги межотдельных отношений."
 zg361m.62.c:0 "Отложить и зафиксировать явный долг политики"
 zg361m.63.t:0 "#063 · Контракт о весах в начале цикла"
 zg361m.63.desc:0 "[J / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и тем самым влияет на последующие результаты команды и собственную оценку руководителя."
 zg361m.63.a:0 "Заставлять обоих начальников подписать веса оценок, границы поставки и условия изменения в кризисе в начале цикла, принимая затраты на переговоры и поддержание версий."
 zg361m.63.b:0 "Позволять более сильному начальнику переписывать веса в конце года ради защиты приоритетных результатов, быстро решая конфликт, но поощряя двойные обещания и ухудшая качество управления."
 zg361m.63.c:0 "Отложить и зафиксировать явный долг политики"
 zg361m.64.t:0 "#064 · Двусторонняя передача при смене начальника"
 zg361m.64.desc:0 "[J / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и тем самым влияет на последующие результаты команды и собственную оценку руководителя."
 zg361m.64.a:0 "Старый начальник замораживает выполненную работу и записи коучинга, новый начальник подписывает оставшиеся цели с единственным сбросом приоритетов, принимая совещание по передаче."
 zg361m.64.b:0 "Позволять новому начальнику аннулировать старые обязательства и сразу пересчитать, быстро получая дискрецию, но разрывая непрерывность доказательств и приглашая успешные апелляции."
 zg361m.64.c:0 "Отложить и зафиксировать явный долг политики"
 zg361m.65.t:0 "#065 · Парашютный менеджер и пакет лоялистов"
 zg361m.65.desc:0 "[J / P2] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и тем самым влияет на последующие результаты команды и собственную оценку руководителя."
 zg361m.65.a:0 "Разрешить парашютному менеджеру небольшую лояльную команду с чёткими ролями при аудите возможностей, удержания и передачи знаний, принимая затраты двойного переходного трека."
 zg361m.65.b:0 "Широко заменять унаследованную команду лоялистами, быстро объединяя исполнение, но создавая вакансии, аудиты фаворитизма и потерю организационной памяти."
 zg361m.65.c:0 "Отложить и зафиксировать явный долг политики"
 zg361m.66.t:0 "#066 · Отделение отмены проекта от личного провала"
 zg361m.66.desc:0 "[J / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и тем самым влияет на последующие результаты команды и собственную оценку руководителя."
 zg361m.66.a:0 "Замораживать подтверждённые вехи, решения о прекращении и причины отмены и оценивать стратегию отдельно от индивидуального вклада, принимая специальный разбор."
 zg361m.66.b:0 "Обнулять все заслуги и наказывать проектную команду при отмене работы, быстро закрывая книги, но толкая всех к коротким проектам и скрывая плохую стратегию."
 zg361m.66.c:0 "Отложить и зафиксировать явный долг политики"
 zg361m.67.t:0 "#067 · Двое на одной роли после слияния"
 zg361m.67.desc:0 "[J / P2] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и тем самым влияет на последующие результаты команды и собственную оценку руководителя."
 zg361m.67.a:0 "Разрешать дублирование лидеров через открытый конкурс, двухчеловечный переход и законное переназначение, фиксируя доказательства сравнения и оплачивая временные затраты на двойную роль."
 zg361m.67.b:0 "Заблаговременно выбирать фаворита и сразу убирать другого лидера, быстро ликвидируя пересечение, но усугубляя фракции, апелляции и потерю ключевого опыта."
 zg361m.67.c:0 "Отложить и зафиксировать явный долг политики"
 zg361m.68.t:0 "#068 · Переносимая история и местное повторное доказательство"
 zg361m.68.desc:0 "[J / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и тем самым влияет на последующие результаты команды и собственную оценку руководителя."
 zg361m.68.a:0 "Переносить замороженные грейды, контекст результатов, споры и открытые PIP в новую роль и устанавливать один защищённый разгон с явными целями повторного доказательства."
 zg361m.68.b:0 "Сразу включать переведённого в полное местное распределение и позволять новому начальнику избирательно использовать прежнюю историю, быстро встраивая в конкуренцию, но рискуя двойным наказанием или захватом квоты."
 zg361m.68.c:0 "Отложить и зафиксировать явный долг политики"
 zg361m.69.t:0 "#069 · Формальная доставка и часы апелляции"
 zg361m.69.desc:0 "[K / P0] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и тем самым влияет на последующие результаты команды и собственную оценку руководителя."
 zg361m.69.a:0 "Доставлять замороженную запись лично, разрешать подписанное несогласие и использовать свидетеля при отказе, запуская часы апелляции и расчёта по каждому пункту."
 zg361m.69.b:0 "Считать каждый результат доставленным при публикации и немедленно проводить расчёт, действуя быстрее всего, но заставляя людей без оснований пропускать апелляции и опрокидывая процесс."
 zg361m.69.c:0 "Отложить и зафиксировать явный долг политики"
 zg361m.70.t:0 "#070 · Окно анти-мести после апелляции"
 zg361m.70.desc:0 "[K / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и тем самым влияет на последующие результаты команды и собственную оценку руководителя."
 zg361m.70.a:0 "Требовать новых фактов для перевода, снятия, снижения жалования и новой негативной обратной связи в течение года и выборочно проверять их независимо, принимая работу по надзору."
 zg361m.70.b:0 "Позволять менеджеру сразу после апелляции переставлять роли и полномочия ради восстановления контроля, действуя быстро, но делая обратные основания похожими на месть."
 zg361m.70.c:0 "Отложить и зафиксировать явный долг политики"
 zg361m.71.t:0 "#071 · Эссе во внутреннем форуме и публичная эскалация"
 zg361m.71.desc:0 "[K / P2] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и тем самым влияет на последующие результаты команды и собственную оценку руководителя."
 zg361m.71.a:0 "После исчерпания частного обсуждения и формальной апелляции разрешать подкреплённое доказательствами подписанное эссе для модерируемой проверки и финансировать посредничество и фактчекинг."
 zg361m.71.b:0 "Позволять субъекту сразу публиковать подписанный или анонимный разоблачитель, добиваясь поддержки и быстрого внимания руководства, но сжигая репутацию обеих сторон и внутреннее доверие."
 zg361m.71.c:0 "Отложить и зафиксировать явный долг политики"
 zg361m.72.t:0 "#072 · Преждевременная утечка грейдов эффективности"
 zg361m.72.desc:0 "[K / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и тем самым влияет на последующие результаты команды и собственную оценку руководителя."
 zg361m.72.a:0 "Ограничить доступ к материалам калибровки, вести журнал просмотров и использовать единое время доставки, чтобы все готовили апелляции одинаково, принимая затраты на администрирование конфиденциальности."
 zg361m.72.b:0 "Предупреждать фаворитов втихую или распускать рейтинги для проверки реакции команды, управляя реакцией рано, но провоцируя досрочные уходы, согласованные истории и недоверие панели."
 zg361m.72.c:0 "Отложить и зафиксировать явный долг политики"
 zg361m.73.t:0 "#073 · Разделение злонамеренных утечек и добросовестного сигнализирования"
 zg361m.73.desc:0 "[K / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и тем самым влияет на последующие результаты команды и собственную оценку руководителя."
 zg361m.73.a:0 "Независимое место проверяет подлинность, общественную цель и элементы мести, защищая настоящие сообщения и наказывая манипуляции ценой специального расследования."
 zg361m.73.b:0 "Классифицировать каждую несанкционированную утечку как нарушение и немедленно наказывать, быстро восстанавливая секретность, но подавляя настоящие доказательства мошенничества."
 zg361m.73.c:0 "Отложить и зафиксировать явный долг политики"
 zg361m.74.t:0 "#074 · Честное сокращение против «отмытых оценок»"
 zg361m.74.desc:0 "[K / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и тем самым влияет на последующие результаты команды и собственную оценку руководителя."
 zg361m.74.a:0 "Открыто убирать должность по организационным причинам, оплачивать выход из казны и сохранять нейтральную запись, тратя деньги ради чистой истории эффективности."
 zg361m.74.b:0 "Сначала ставить 3.25, а затем дёшево сокращать человека за низкую эффективность, быстро сжимаясь, но рискуя восстановлением санкций и тяжёлым ударом по двум уровням менеджмента."
 zg361m.74.c:0 "Отложить и зафиксировать явный долг политики"
 zg361m.75.t:0 "#075 · Пакет добровольного ухода с чистой записью"
 zg361m.75.desc:0 "[K / P2] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и тем самым влияет на последующие результаты команды и собственную оценку руководителя."
 zg361m.75.a:0 "Предложить аутсайдеру реальное выходное пособие, нейтральную запись в послужном списке и явное кадровое (HC) освобождение, оплатив расходы из казны и сохранив его настоящее право отказаться."
 zg361m.75.b:0 "Требовать к сроку неоплачиваемый добровольный уход или немедленно запускать PIP, быстро сокращая затраты, но рискуя переквалификацией как принудительного сокращения."
 zg361m.75.c:0 "Отложить и зафиксировать явный долг политики"
 zg361m.76.t:0 "#076 · Многоуровневая ответственность за сбой процедуры"
 zg361m.76.desc:0 "[K / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет доставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную оценку руководителя."
 zg361m.76.a:0 "После пересмотра — разделить ответственность за недостающие доказательства, слабый контроль, проектную ошибку и ложные заявления между участниками и записать долю каждого в следующую управленческую оценку, приняв совместный разбор."
 zg361m.76.b:0 "Возложить весь сбой процедуры на прямого руководителя или партийного куратора ради быстрого закрытия дела: наказание прозрачно, но это прячет системный изъян и поощряет перекладывание вины."
 zg361m.76.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.77.t:0 "#077 · Ротация независимых рецензентов"
 zg361m.77.desc:0 "[K / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет доставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную оценку руководителя."
 zg361m.77.a:0 "Ротировать рецензентов из числа равных руководителей без прямых связей, давать каждой стороне по одному мотивированному отводу и вести учёт качества проверок, принимая кадровые издержки."
 zg361m.77.b:0 "Поручить исходной комиссии быстро исправить решение при ограниченном объёме новых доказательств: экономится управленческое время, но те же люди защищают собственный вывод, что снижает доверие."
 zg361m.77.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.78.t:0 "#078 · Панель справедливости распределения"
 zg361m.78.desc:0 "[K / P2] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет доставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную оценку руководителя."
 zg361m.78.a:0 "Показывать многолетние различия по новичкам, переводам, родству, фракции, должности и стажу, сопоставляя их с данными о возможностях, и направлять аномалии только людям для разъяснений."
 zg361m.78.b:0 "При малейшей аномалии доли в подгруппе принудительно менять оценки или наказывать руководителя: коррекция самая быстрая, но малые выборки и реальные деловые различия принимаются за дискриминацию."
 zg361m.78.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.79.t:0 "#079 · Приёмные часы через уровень"
 zg361m.79.desc:0 "[K / P2] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет доставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную оценку руководителя."
 zg361m.79.a:0 "Каждый цикл открывать несколько мест по записи для сигналов о препятствиях, результатах и апелляциях, формировать задачи на расследование, тратить время старших, не меняя оценки на месте."
 zg361m.79.b:0 "Разрешить старшему правителю прямо на аудиенции обещать ресурсы или точечно менять оценку внука-подчинённого: быстрый отклик на настроения, но это обходит прямых руководителей и подогревает «прыжки через уровень»."
 zg361m.79.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.80.t:0 "#080 · Публичный тикет на дефект метрики"
 zg361m.80.desc:0 "[K / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет доставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную оценку руководителя."
 zg361m.80.a:0 "Открыто регистрировать дефекты «накручиваемых», конфликтующих или искажённых метрик, требовать от владельца метрики письменно исправить их или принять риск и учитывать институциональный вклад автора сигнала."
 zg361m.80.b:0 "Приказать владельцу немедленно закрыть тикет и удержать текущую метрику до конца оценки: в краткосрочной перспективе сопоставимость сохраняется, но при будущем скандале вина расползается на разработчика метрики."
 zg361m.80.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.81.t:0 "#081 · Иерархическое сжатие информации об эффективности"
 zg361m.81.desc:0 "[K / P2] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет доставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную оценку руководителя."
 zg361m.81.a:0 "Открывать по ролям доступ к исходным доказательствам, сводкам и центральной проверке и фиксировать, кто что видел, принимая издержки на администрирование прав и приватность."
 zg361m.81.b:0 "Заставить каждый уровень подавать лишь одну сводную таблицу рейтинга ради скорости решений: поток информации самый короткий, но это усиливает присвоение заслуг, искажения и непоправимый «чёрный ящик»."
 zg361m.81.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.82.t:0 "#082 · Формула совокупного вознаграждения"
 zg361m.82.desc:0 "[L / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет доставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную оценку руководителя."
 zg361m.82.a:0 "Разделить базовый оклад, должностную надбавку, премию за результат, целевую и отложенную премии, финансируя каждую статью из казны в пределах доступности."
 zg361m.82.b:0 "Резко перенаправить вознаграждение в текущую премию за результат, чтобы усилить стимул 361: сильный краткосрочный эффект, но это множит тревогу, борьбу за заслуги и финансовые колебания."
 zg361m.82.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.83.t:0 "#083 · Множители премии королевство — команда — личность"
 zg361m.83.desc:0 "[L / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет доставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную оценку руководителя."
 zg361m.83.a:0 "Заморозить в начале цикла множители королевства, команды и личности, сохранив командный пай и личную выплату ценой более сложного расчёта."
 zg361m.83.b:0 "Временно перебросить вес премии на личный рейтинг, быстро раздвигая разрыв между верхними: ускоряется захват заслуг и внутренняя конкуренция даже в проигрывающих командах."
 zg361m.83.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.84.t:0 "#084 · Отложенная премия и переход прав"
 zg361m.84.desc:0 "[L / P2] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет доставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную оценку руководителя."
 zg361m.84.a:0 "Завести реестр трёхлетнего перехода прав на долгосрочные награды, зарезервировать средства в казне, прописать условия ухода и обратного хода и выплачивать поэтапно, принимая будущие финансовые обязательства."
 zg361m.84.b:0 "Выдать всю премию сейчас ради сильного сигнала удержания: расчёт прост, но при подлоге или реверсе проекта вернуть деньги сложно и текущая казна испытывает нагрузку."
 zg361m.84.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.85.t:0 "#085 · Обрыв стимула продления"
 zg361m.85.desc:0 "[L / P2] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет доставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную оценку руководителя."
 zg361m.85.a:0 "Заранее отслеживать даты перехода прав, бронировать пакеты продления по критичности и риску замены и публично сверяться с равными, принимая долгосрочную нагрузку на бюджет."
 zg361m.85.b:0 "Ждать ухода и в последний момент делать экстренный контр-офер или устное продление: сейчас экономия, но появляются «уход точно в срок», долги по обещаниям и зарплатная несправедливость."
 zg361m.85.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.86.t:0 "#086 · Удержание и взыскание премии"
 zg361m.86.desc:0 "[L / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет доставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную оценку руководителя."
 zg361m.86.a:0 "Заблаговременно прописать долю удержания, даты аудита и условия взыскания при подлоге для высокорисковых проектов и хранить расчётный документ по каждой выплате."
 zg361m.86.b:0 "При первых подозрениях временно удерживать или взыскивать всю премию целиком: казна быстро защищена, но задним числом менять правила — путь к апелляциям и увольнениям."
 zg361m.86.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.87.t:0 "#087 · Зарплатные вилки и позиция внутри вилки"
 zg361m.87.desc:0 "[L / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет доставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную оценку руководителя."
 zg361m.87.a:0 "Провести аудит стажа, дефицитности на рынке, истории результатов и позиции в вилке и в первую очередь исправить подтверждённые низкие позиции и инверсию, принимая нагрузку на зарплатный бюджет."
 zg361m.87.b:0 "Жёстко зафиксировать потолок базового оклада и давать звёздам на вершине вилки лишь разовую премию: вилка быстро защищена, но повышается отток лучших и «перевёрнутых» ветеранов."
 zg361m.87.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.88.t:0 "#088 · Рыночные и результативные повышения — борьба за бюджет"
 zg361m.88.desc:0 "[L / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет доставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную оценку руководителя."
 zg361m.88.a:0 "Разделить пул повышенных окладов на три реестра — рыночный дефицит, премию 3.75 и внутреннюю справедливость, выстроить их в очередь по доказательствам и опубликовать бюджетный компромисс."
 zg361m.88.b:0 "Отдать весь пул повышенных окладов текущим 3.75-исполнителям, чтобы усилить сигнал, действуя решительно, но оставить дефицитные роли и перевёрнутых сотрудников открытыми для переманивания."
 zg361m.88.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.89.t:0 "#089 · Разделение ранга, назначения, полномочий и денег"
 zg361m.89.desc:0 "[L / P1] Эта политика реализуется через общую организационную книгу. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, талант или финансовое давление и потому влияет на последующие результаты команды и собственную оценку руководителя."
 zg361m.89.a:0 "Для повышений оклада, экспертного ранга, исполняющих полномочий и формальных вакансий прописать раздельно полномочия, деньги и сроки исполнения, приняв многопутевое управление ролями."
 zg361m.89.b:0 "Выдать безденежный и безвластный уровень или бессрочный исполняющий титул, чтобы утихомирить звезду с минимальной ценой, накапливая риск пустого повышения и ухода."
 zg361m.89.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.90.t:0 "#090 · Разовые награды"
 zg361m.90.desc:0 "[L / P1] Эта политика реализуется через общую организационную книгу. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, талант или финансовое давление и потому влияет на последующие результаты команды и собственную оценку руководителя."
 zg361m.90.a:0 "Создать небольшой отдельный пул на тушение пожаров, межподразделенческую поддержку и строительство институтов и платить по уникальному идентификатору вклада без изменения итогового ранга."
 zg361m.90.b:0 "Позволить руководителю немедленно наградить самого заметного спасателя из командного пула, подавая быстрый сигнал, но обходя 361 и опустошая чужие бонусы."
 zg361m.90.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.91.t:0 "#091 · Разделение наград за выслугу и за результативность"
 zg361m.91.desc:0 "[L / P2] Эта политика реализуется через общую организационную книгу. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, талант или финансовое давление и потому влияет на последующие результаты команды и собственную оценку руководителя."
 zg361m.91.a:0 "Долголетнюю службу, тяжёлые назначения и текущую результативность вести в отдельных книгах и пулах и платить по каждой явно, принимая большее, но объяснимое обязательство казны."
 zg361m.91.b:0 "Платить только по текущему разряду, чтобы сохранить жёсткое распределение, упростив расчёт, но позволяя одному низкому циклу стереть всю ценность удержания ветерана."
 zg361m.91.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.92.t:0 "#092 · Экспертная и управленческая карьерные ветки"
 zg361m.92.desc:0 "[M / P1] Эта политика реализуется через общую организационную книгу. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, талант или финансовое давление и потому влияет на последующие результаты команды и собственную оценку руководителя."
 zg361m.92.a:0 "Построить экспертную и управленческую ветки со сравнимым вознаграждением, но разными полномочиями, рисками и оценочными листами, выделив бюджет на пробные назначения и обучение для перехода между ними."
 zg361m.92.b:0 "Повысить сильнейшего индивидуального исполнителя напрямую до руководителя, закрывая вакансию, получая лидера сразу, но рискуя и экспертной отдачей, и качеством управления."
 zg361m.92.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.93.t:0 "#093 · Возврат не справившегося руководителя на экспертную ветку"
 zg361m.93.desc:0 "[M / P1] Эта политика реализуется через общую организационную книгу. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, талант или финансовое давление и потому влияет на последующие результаты команды и собственную оценку руководителя."
 zg361m.93.a:0 "Снять управленческие полномочия, сохранив подтверждённый экспертный ранг и справедливую оплату, и открыть путь возврата с наставничеством, приняв расходы на переназначение и развитие."
 zg361m.93.b:0 "Сразу понизить и урезать оплату полностью либо заставить человека оставаться руководителем, действуя жёстко, но рискуя потерять сильного эксперта или усугубить уход из команды."
 zg361m.93.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.94.t:0 "#094 · Микроуровни и полуступенчатые повышения"
 zg361m.94.desc:0 "[M / P2] Эта политика реализуется через общую организационную книгу. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, талант или финансовое давление и потому влияет на последующие результаты команды и собственную оценку руководителя."
 zg361m.94.a:0 "Создать лишь несколько микроуровней с реальными обязанностями, вилками и стажевыми порогами и регулярно проводить аудит инфляции, принимая более сложную архитектуру должностей."
 zg361m.94.b:0 "Часто выдавать полууровневые титулы и откладывать деньги и полномочия, быстро снимая тревогу повышения, но создавая титульную инфляцию и долг обещаний."
 zg361m.94.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.95.t:0 "#095 · Ежегодный пересмотр назначений высшего руководства"
 zg361m.95.desc:0 "[M / P1] Эта политика реализуется через общую организационную книгу. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, талант или финансовое давление и потому влияет на последующие результаты команды и собственную оценку руководителя."
 zg361m.95.a:0 "Раз в год пересматривать полномочия 361 по соблюдению Цзинча, результатам команды, отменам, текучести и преемственности, проводя наставничество или ужимая бюджеты, но не отбирая титулы незаконно."
 zg361m.95.b:0 "После одного плохого цикла сразу отбирать места пересмотра, кадровые права и бюджеты, быстро привлекая лидеров к ответу, но превращая краткосрочные колебания в организационный шок."
 zg361m.95.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.96.t:0 "#096 · Пакет исключительного повышения"
 zg361m.96.desc:0 "[M / P2] Эта политика реализуется через общую организационную книгу. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, талант или финансовое давление и потому влияет на последующие результаты команды и собственную оценку руководителя."
 zg361m.96.a:0 "Использовать крошечную исключительную квоту только при устойчивой сверхрезультативности или решающей службе, назвать пропущенный стаж и отложенного кандидата и проверить в следующем году."
 zg361m.96.b:0 "Позволить поручителю сразу перепрыгнуть кого-то за один яркий подвиг, быстро удерживая героя, но расходуя обычные слоты и перекладывая риск следующего года на комиссию."
 zg361m.96.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.97.t:0 "#097 · Кросс-командная калибровка повышений"
 zg361m.97.desc:0 "[M / P1] Эта политика реализуется через общую организационную книгу. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, талант или финансовое давление и потому влияет на последующие результаты команды и собственную оценку руководителя."
 zg361m.97.a:0 "Требовать сопоставимые пакеты повышения и поручить кросс-командной комиссии оценивать влияние за пределами текущего уровня, фиксируя качество неудачных выдвижений."
 zg361m.97.b:0 "Быстро распределять слоты повышений по влиянию менеджера и местному первому номеру каждой команды, закрывая заседание, но позволяя местному рангу побеждать кросс-организационный вклад."
 zg361m.97.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.98.t:0 "#098 · Рост, замена и проектный HC"
 zg361m.98.desc:0 "[N / P1] Эта политика реализуется через общую организационную книгу. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, талант или финансовое давление и потому влияет на последующие результаты команды и собственную оценку руководителя."
 zg361m.98.a:0 "Регистрировать HC на рост, замену и проект раздельно по назначению, сроку и приёмке и требовать новой защиты для конверсии, принимая три реестра."
 zg361m.98.b:0 "Объединить все три в гибкий пул для немедленного использования менеджером, быстро поддерживая горячие точки, но позволяя временным проектам тайно становиться постоянным ростом."
 zg361m.98.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.99.t:0 "#099 · Истечение HC, перенос и найм в конце года"
 zg361m.99.desc:0 "[N / P1] Эта политика реализуется через общую организационную книгу. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, талант или финансовое давление и потому влияет на последующие результаты команды и собственную оценку руководителя."
 zg361m.99.a:0 "Опираясь на воронку найма, решать истечение или один обоснованный перенос и зачесть добровольный возврат в кредит следующего бюджета, принимая запланированный дефицит мощностей."
 zg361m.99.b:0 "В конце года спешно нанимать, чтобы сохранить слоты и знаменатель, избегая возврата сейчас, но увеличивая несоответствие, провалы испытательного срока и нагрузку на наставников."
 zg361m.99.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.100.t:0 "#100 · Заморозка найма и исключения для ключевых ролей"
 zg361m.100.desc:0 "[N / P1] Эта политика реализуется через общую организационную книгу. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, талант или финансовое давление и потому влияет на последующие результаты команды и собственную оценку руководителя."
 zg361m.100.a:0 "Заморозить HC на рост, но выдавать письменные исключения по риску роли, принятым проектам и порогу безопасности и проводить аудит более дешёвых альтернатив."
 zg361m.100.b:0 "Полностью остановить найм, кроме назначенных правителем ключевых ролей, стабилизируя финансы сейчас, но провоцируя рентоискательство и лишая менее заметную важную работу ресурсов."
 zg361m.100.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.101.t:0 "#101 · Один старший, два обычных или конвейер учеников"
 zg361m.101.desc:0 "[N / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательную базу, доверие, нагрузку, риск, талант или фискальное давление и тем самым влияет на дальнейшие результаты команды и оценку самого руководителя."
 zg361m.101.a:0 "Проектируйте сочетание старшего, обычных и учеников исходя из сроков поставки, риска ключевой персоны и потребностей преемственности, зарезервировав наставнический ресурс под конвейер."
 zg361m.101.b:0 "Потратьте весь бюджет на одного старшего, способного поставлять немедленно: это самое быстрое движение, но усиливает переговорную силу и оставляет единственную точку преемственности."
 zg361m.101.c:0 "Отложить и зафиксировать явный политический долг"
 zg361m.102.t:0 "#102 · Нулевой пересмотр штата"
 zg361m.102.desc:0 "[N / P2] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательную базу, доверие, нагрузку, риск, талант или фискальное давление и тем самым влияет на дальнейшие результаты команды и оценку самого руководителя."
 zg361m.102.a:0 "Проводите доказательный нулевой пересмотр каждые несколько лет для низкоэффективных, давно вакантных и перенаправленных ролей и финансируйте переходы перемещённого ресурса."
 zg361m.102.b:0 "Заставляйте каждую команду ежегодно отвоёвывать весь HC с нуля: перераспределение самое быстрое, но создаёт шторм отчётности, неуверенность и краткосрочность."
 zg361m.102.c:0 "Отложить и зафиксировать явный политический долг"
 zg361m.103.t:0 "#103 · Аудит удержания вакантных ставок"
 zg361m.103.desc:0 "[N / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательную базу, доверие, нагрузку, риск, талант или фискальное давление и тем самым влияет на дальнейшие результаты команды и оценку самого руководителя."
 zg361m.103.a:0 "Требуйте для давно вакантных ролей реальный канал кандидатов, возврат ставки или временную передачу с ежемесячным пересмотром, принимая снижение будущей опциональности."
 zg361m.103.b:0 "Используйте фантомных кандидатов и повторные задержки открытия ставки, чтобы удержать её: краткосрочно избегаете возврата, но перегружаете команду и теряете HC-кредит при обнаружении."
 zg361m.103.c:0 "Отложить и зафиксировать явный политический долг"
 zg361m.104.t:0 "#104 · Пул новичков и пул опытных"
 zg361m.104.desc:0 "[N / P2] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательную базу, доверие, нагрузку, риск, талант или фискальное давление и тем самым влияет на дальнейшие результаты команды и оценку самого руководителя."
 zg361m.104.a:0 "Объединяйте новичков, опытных сотрудников и переведённых специалистов ради кадрового резерва и быстрой отдачи, а бюджет на наставников, оплату труда и замену уходящих планируйте отдельно."
 zg361m.104.b:0 "Покупайте только опытных, готовых поставлять сразу: краткосрочный выход максимален, но возникает инверсия оплаты, культурный конфликт и разрыв конвейера."
 zg361m.104.c:0 "Отложить и зафиксировать явный политический долг"
 zg361m.105.t:0 "#105 · Ответственность за замену уходящего сотрудника"
 zg361m.105.desc:0 "[N / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательную базу, доверие, нагрузку, риск, талант или фискальное давление и тем самым влияет на дальнейшие результаты команды и оценку самого руководителя."
 zg361m.105.a:0 "Заранее определите, что замена уходящего возвращается в команду, в центральный пул или передаётся вместе с задачами, и привяжите решение о высвобождении сотрудников к будущим приоритетам, приняв сопровождение регламента."
 zg361m.105.b:0 "Удерживайте сотрудника до завершения оценки ради сохранения замены: сейчас вы сохраняете ставку, но задерживаете мобильность и искажаете сроки ухода."
 zg361m.105.c:0 "Отложить и зафиксировать явный политический долг"
 zg361m.106.t:0 "#106 · Разделение ключевых ролей и ключевых талантов"
 zg361m.106.desc:0 "[O / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательную базу, доверие, нагрузку, риск, талант или фискальное давление и тем самым влияет на дальнейшие результаты команды и оценку самого руководителя."
 zg361m.106.a:0 "Сначала оцените влияние вакансии, затем отдельно — заменяемость действующего сотрудника, и далее финансируйте преемственность для роли и удержание для персоны как разные потребности."
 zg361m.106.b:0 "Объявите любимую звезду начальника незаменимой и сконцентрируйте ресурсы на ней: отношения быстро стабилизируются, но скрывается реальный риск роли и пробелы в преемниках."
 zg361m.106.c:0 "Отложить и зафиксировать явный политический долг"
 zg361m.107.t:0 "#107 · Лестница готовности преемника"
 zg361m.107.desc:0 "[O / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательную базу, доверие, нагрузку, риск, талант или фискальное давление и тем самым влияет на дальнейшие результаты команды и оценку самого руководителя."
 zg361m.107.a:0 "Поддерживайте для ключевых ролей ступени «готов сейчас», «готов через два года», «долгосрочное развитие» и «нет преемника» и финансируйте наставников, замещающие задачи и видимость."
 zg361m.107.b:0 "Назовите одного наследника готовым сейчас, чтобы закрыть пробел немедленно, рискуя спутать патронаж и потенциал с реальной готовностью."
 zg361m.107.c:0 "Отложить и зафиксировать явный политический долг"
 zg361m.108.t:0 "#108 · Испытание замещающей роли"
 zg361m.108.desc:0 "[O / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательную базу, доверие, нагрузку, риск, талант или фискальное давление и тем самым влияет на дальнейшие результаты команды и оценку самого руководителя."
 zg361m.108.a:0 "Дайте кандидату фиксированный срок, реальные полномочия, ресурсы и критерии успеха, затем заморозьте доказательства испытания, приняв надзор и стоимость пробы."
 zg361m.108.b:0 "Возложите на замещающего кандидата ответственность за поставку, сохранив за собой все вето: дешёвая и быстрая проверка, но провал ничего не показывает и даёт основание для апелляции."
 zg361m.108.c:0 "Отложить и зафиксировать явный политический долг"
 zg361m.109.t:0 "#109 · Публичность ярлыка «высокий потенциал»"
 zg361m.109.desc:0 "[O / P2] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательную базу, доверие, нагрузку, риск, талант или фискальное давление и тем самым влияет на дальнейшие результаты команды и оценку самого руководителя."
 zg361m.109.a:0 "Сообщайте только самому сотруднику и необходимым руководителям, публикуйте критерии, даты пересмотра и инвестиции в развитие, неся расходы на ведение списка и разговоры с неотобранными."
 zg361m.109.b:0 "Опубликуйте список высокого потенциала для всей команды, чтобы немедленно усилить старание и конкуренцию: создаётся «партия наследника», уход неродовых и фаворитизм."
 zg361m.109.c:0 "Отложить и зафиксировать явный политический долг"
 zg361m.110.t:0 "#110 · Раздельная калибровка потенциала и результативности"
 zg361m.110.desc:0 "[O / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательную базу, доверие, нагрузку, риск, талант или фискальное давление и тем самым влияет на дальнейшие результаты команды и оценку самого руководителя."
 zg361m.110.a:0 "Сначала зафиксируйте текущий 361, затем отдельно оцените скорость обучения, широту охвата и будущую ответственность, ведя две замороженные таблицы для вознаграждения и развития."
 zg361m.110.b:0 "Используйте заявление о высоком потенциале на том же заседании, чтобы поднять рейтинг или вытеснить стабильную звезду: ресурсы концентрируются быстро, но смешиваются бонус и ставка на будущее."
 zg361m.110.c:0 "Отложить и зафиксировать явный политический долг"
 zg361m.111.t:0 "#111 · Досадная и здоровая убыль"
 zg361m.111.desc:0 "[O / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательную базу, доверие, нагрузку, риск, талант или фискальное давление и тем самым влияет на дальнейшие результаты команды и оценку самого руководителя."
 zg361m.111.a:0 "Классифицируйте уходы по результативности, критичности, несоответствию и процессуальным спорам и вписывайте последующие достижения обратно в исходную оценку таланта."
 zg361m.111.b:0 "Подавайте каждый уход как здоровую оптимизацию, чтобы защитить текущий балл руководителя: таблица сразу выглядит лучше, но скрываются провалы удержания и ошибочные низкие оценки."
 zg361m.111.c:0 "Отложить и зафиксировать явный политический долг"
 zg361m.112.t:0 "#112 · Интервью по удержанию"
 zg361m.112.desc:0 "[O / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательную базу, доверие, нагрузку, риск, талант или фискальное давление и тем самым влияет на дальнейшие результаты команды и оценку самого руководителя."
 zg361m.112.a:0 "Проводите структурированные интервью удержания для звёзд, преемников и недовольных и обещайте одно бюджетируемое изменение в оплате, возможностях, полномочиях или нагрузке с отслеживанием исполнения."
 zg361m.112.b:0 "Ждите угрозы ухода и отвечайте крупным контр-офером или устным обещанием: возможно краткосрочное удержание, но растут затраты и страдает доверие при неисполнении."
 zg361m.112.c:0 "Отложить и зафиксировать явный политический долг"
 zg361m.113.t:0 "#113 · Зависимость от ключевой персоны и передача знаний"
 zg361m.113.desc:0 "[O / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательную базу, доверие, нагрузку, риск, талант или фискальное давление и тем самым влияет на дальнейшие результаты команды и оценку самого руководителя."
 zg361m.113.a:0 "Поощрять заместителей, институциональную документацию и повторяемые процессы, сделать передачу знаний условием повышения, приняв размытие звёзд и время на наставничество."
 zg361m.113.b:0 "Продолжать вознаграждать одиночного героя и удерживать его оплатой, максимизируя немедленную отдачу, делая уход или потерю трудоспособности катастрофой."
 zg361m.113.c:0 "Отложить и зафиксировать явный долг политики"
 zg361m.114.t:0 "#114 · Менеджерский кредит за экспорт талантов"
 zg361m.114.desc:0 "[P / P1] Эта политика реализуется через общий организационный реестр. Её выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, талант или фискальное давление и поэтому влияет на дальнейшие результаты команды и собственный отзыв менеджера."
 zg361m.114.a:0 "Вознаграждать менеджеров, отпускающих сильных сотрудников, кредитом развития, приоритетом на замену и кросс-командным доброжелательством, требуя план преемственности и принимая кадровую брешь на время перехода."
 zg361m.114.b:0 "Блокировать звезду бессрочно ради критической поставки, сохраняя текущий результат, но подрывая кредит экспорта талантов и доверие внутреннего рынка."
 zg361m.114.c:0 "Отложить и зафиксировать явный долг политики"
 zg361m.115.t:0 "#115 · Анонимные внутренние заявки"
 zg361m.115.desc:0 "[P / P1] Эта политика реализуется через общий организационный реестр. Её выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, талант или фискальное давление и поэтому влияет на дальнейшие результаты команды и собственный отзыв менеджера."
 zg361m.115.a:0 "Скрывать заявки до отборочного этапа, уведомлять прежнего менеджера только на финальном интервью и планировать законную передачу, принимая риск внезапной вакансии ради защиты от мести."
 zg361m.115.b:0 "Требовать одобрение прежнего менеджера до подачи заявки ради преемственности, максимизируя прозрачность, но позволяя блокировку и месть до появления кандидата."
 zg361m.115.c:0 "Отложить и зафиксировать явный долг политики"
 zg361m.116.t:0 "#116 · Срок отпуска и одно продление передачи"
 zg361m.116.desc:0 "[P / P1] Эта политика реализуется через общий организационный реестр. Её выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, талант или фискальное давление и поэтому влияет на дальнейшие результаты команды и собственный отзыв менеджера."
 zg361m.116.a:0 "Установить фиксированное окно отпуска после внутреннего найма и разрешить одно продление только ради критической поставки с планом преемственности, принимая координацию передачи и замены."
 zg361m.116.b:0 "Позволять прежнему менеджеру многократно задерживать до конца проекта ради бизнес-потребности, сохраняя краткосрочный результат, но отталкивая новую команду и создавая запись о блокировке."
 zg361m.116.c:0 "Отложить и зафиксировать явный долг политики"
 zg361m.117.t:0 "#117 · Защита периода разгона при переводе"
 zg361m.117.desc:0 "[P / P1] Эта политика реализуется через общий организационный реестр. Её выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, талант или фискальное давление и поэтому влияет на дальнейшие результаты команды и собственный отзыв менеджера."
 zg361m.117.a:0 "Дать переведённому одну роль-специфическую рамп-кривую, частичный вес распределения и срок действия, сохранив прежнюю историю и финансируя коучинг."
 zg361m.117.b:0 "Полностью ранжировать переведённого в первом цикле по принуждению, предотвращая игру с защитой, быстро проверяя соответствие, но рискуя снова ошибочно принять кривую обучения за низкую результативность."
 zg361m.117.c:0 "Отложить и зафиксировать явный долг политики"
 zg361m.118.t:0 "#118 · Абсолютный порог испытательного срока вне квоты нижних"
 zg361m.118.desc:0 "[P / P1] Эта политика реализуется через общий организационный реестр. Её выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, талант или фискальное давление и поэтому влияет на дальнейшие результаты команды и собственный отзыв менеджера."
 zg361m.118.a:0 "Заранее объявить стандарты испытательного срока, прохождение, продлённое наставничество или выход по доказательствам и записывать результаты в найм и наставникам без использования обычной квоты C."
 zg361m.118.b:0 "Немедленно увольнять новичков за непрохождение раннего порога и считать их нижним рейтингом команды, освобождая мощности и защищая ветеранов, но поощряя жертвенный найм."
 zg361m.118.c:0 "Отложить и зафиксировать явный долг политики"
 zg361m.119.t:0 "#119 · Обратная запись качества найма"
 zg361m.119.desc:0 "[P / P1] Эта политика реализуется через общий организационный реестр. Её выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, талант или фискальное давление и поэтому влияет на дальнейшие результаты команды и собственный отзыв менеджера."
 zg361m.119.a:0 "После рамп-апа записать успех, несоответствие или провал обратно заявителю HC, селектору и утверждающему по доказательствам, принимая отложенный учёт."
 zg361m.119.b:0 "Немедленно вознаграждать менеджеров за скорость найма и заполненные слоты, ускоряя укомплектование, но поощряя дешёвые несоответствия и перекладывая провалы на новичков и наставников."
 zg361m.119.c:0 "Отложить и зафиксировать явный долг политики"
 zg361m.120.t:0 "#120 · Результативность наставника и онбординга"
 zg361m.120.desc:0 "[P / P1] Эта политика реализуется через общий организационный реестр. Её выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, талант или фискальное давление и поэтому влияет на дальнейшие результаты команды и собственный отзыв менеджера."
 zg361m.120.a:0 "Выделять структурированное время на наставничество, поэтапные цели и обратную запись результатов, считая независимую поставку новичка проверяемым вкладом в развитие талантов."
 zg361m.120.b:0 "Требовать от звёздного наставника только отвечать на эпизодические вопросы и защищать личную поставку, сохраняя краткосрочный результат, но ухудшая скорость разгона, удержание и кадровый резерв менеджеров."
 zg361m.120.c:0 "Отложить и зафиксировать явный долг политики"
 zg361m.121.t:0 "#121 · Пробный период первого менеджера"
 zg361m.121.desc:0 "[Q / P1] Эта политика реализуется через общий организационный реестр. Её выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, талант или фискальное давление и поэтому влияет на дальнейшие результаты команды и собственный отзыв менеджера."
 zg361m.121.a:0 "Запустить пробный цикл для малой команды с наставничеством и проверкой вышестоящим руководителем"
 zg361m.121.b:0 "Дать полный контроль над большой командой и судить только по первому циклу"
 zg361m.121.c:0 "Отложить и зафиксировать явный долг политики"
 zg361m.122.t:0 "#122 · Карта оценки менеджера 40-30-30"
 zg361m.122.desc:0 "[Q / P1] Эта политика реализуется через общий организационный реестр. Её выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, талант или фискальное давление и поэтому влияет на дальнейшие результаты команды и собственный отзыв менеджера."
 zg361m.122.a:0 "Оценивать задокументированные результаты, управление талантами и процесс менеджмента по шкале 40-30-30"
 zg361m.122.b:0 "Дать текущим жёстким результатам доминировать и отложить долг текучки и обратной связи"
 zg361m.122.c:0 "Отложить и зафиксировать явный долг политики"
 zg361m.123.t:0 "#123 · Форма оценки менеджера подчинёнными"
 zg361m.123.desc:0 "[Q / P1] Эта политика реализуется через общий организационный реестр. Её выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, талант или фискальное давление и поэтому влияет на дальнейшие результаты команды и собственный отзыв менеджера."
 zg361m.123.a:0 "Собирать шесть специфичных для менеджера измерений и взвешивать их по достоверности рецензента"
 zg361m.123.b:0 "Использовать единое анонимное голосование одобрения для быстрой оценки менеджера"
 zg361m.123.c:0 "Отложить и зафиксировать явный долг политики"
 zg361m.124.t:0 "#124 · Без преемника нет повышения менеджера"
 zg361m.124.desc:0 "[Q / P1] Эта политика реализуется через общий организационный реестр. Её выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, талант или фискальное давление и поэтому влияет на дальнейшие результаты команды и собственный отзыв менеджера."
 zg361m.124.a:0 "Проверить действующего преемника и передачу дел до повышения менеджера"
 zg361m.124.b:0 "Немедленно повысить звёздного менеджера и оставить старую команду заполнять брешь"
 zg361m.124.c:0 "Отложить и зафиксировать явный долг политики"
 zg361m.125.t:0 "#125 · Личное тушение пожаров и делегирование"
 zg361m.125.desc:0 "[Q / P1] Эта политика реализуется через общий организационный реестр. Её выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, талант или фискальное давление и поэтому влияет на дальнейшие результаты команды и собственный отзыв менеджера."
 zg361m.125.a:0 "Выделить поддержанное время, чтобы подчинённый возглавил кризис, и разобрать результат делегирования"
 zg361m.125.b:0 "Поручить руководителю взять командование на себя для скорейшего восстановления и получения публичной славы героя"
 zg361m.125.c:0 "Отложить и зафиксировать явный долг политики"
 zg361m.126.t:0 "#126 · Матрица действий «результативность–ценности»"
 zg361m.126.desc:0 "[Q / P1] Эта политика внедряется через общий организационный реестр. Выбранное правило изменяет поставку, доказательную базу, доверие, нагрузку, риск, кадры или финансовое давление и поэтому влияет на дальнейшие результаты команды и на собственный аттестационный отзыв руководителя."
 zg361m.126.a:0 "Применять четыре доказательные квадранта для удержания, коучинга, перевода или вывода"
 zg361m.126.b:0 "Удерживать всех высокопроизводительных сотрудников и увольнять низкопроизводительных без отдельной проверки поведения"
 zg361m.126.c:0 "Отложить решение и зафиксировать явный долг по политике"
 zg361m.127.t:0 "#127 · Норма управляемости и искажение оценок"
 zg361m.127.desc:0 "[Q / P2] Эта политика внедряется через общий организационный реестр. Выбранное правило изменяет поставку, доказательную базу, доверие, нагрузку, риск, кадры или финансовое давление и поэтому влияет на дальнейшие результаты команды и на собственный аттестационный отзыв руководителя."
 zg361m.127.a:0 "Назначать легитимных ведущих и добавлять многоуровневые доказательства при превышении лимита прямых подчинённых"
 zg361m.127.b:0 "Сохранять плоскую структуру и позволять одному руководителю оценивать всех только по итоговым результатам"
 zg361m.127.c:0 "Отложить решение и зафиксировать явный долг по политике"
 zg361m.128.t:0 "#128 · Индекс климата принудительного ранжирования"
 zg361m.128.desc:0 "[Q / P2] Эта политика внедряется через общий организационный реестр. Выбранное правило изменяет поставку, доказательную базу, доверие, нагрузку, риск, кадры или финансовое давление и поэтому влияет на дальнейшие результаты команды и на собственный аттестационный отзыв руководителя."
 zg361m.128.a:0 "Отслеживать давление, сотрудничество, сообщения о рисках, доверие к ревью и досадные потери каждый цикл"
 zg361m.128.b:0 "Сохранять жёсткие квоты и оценивать успех только по среднему KPI и плотности талантов"
 zg361m.128.c:0 "Отложить решение и зафиксировать явный долг по политике"
 zg361m.129.t:0 "#129 · Очередь на повышение и карьерное плато"
 zg361m.129.desc:0 "[R / P1] Эта политика внедряется через общий организационный реестр. Выбранное правило изменяет поставку, доказательную базу, доверие, нагрузку, риск, кадры или финансовое давление и поэтому влияет на дальнейшие результаты команды и на собственный аттестационный отзыв руководителя."
 zg361m.129.a:0 "Вести ограниченную по сроку прозрачную очередь с ротациями или денежной компенсацией"
 zg361m.129.b:0 "Опираться на ежегодные устные обещания и позволять срочным фаворитам перепрыгивать очередь"
 zg361m.129.c:0 "Отложить решение и зафиксировать явный долг по политике"
 zg361m.130.t:0 "#130 · Сброс низкорезультативных в чужие команды"
 zg361m.130.desc:0 "[R / P1] Эта политика внедряется через общий организационный реестр. Выбранное правило изменяет поставку, доказательную базу, доверие, нагрузку, риск, кадры или финансовое давление и поэтому влияет на дальнейшие результаты команды и на собственный аттестационный отзыв руководителя."
 zg361m.130.a:0 "Передавать вместе с сотрудником запись PIP, доказательства несоответствия роли и ограниченный испытательный срок"
 zg361m.130.b:0 "Переупаковывать низкорезультативного сотрудника как высокого потенциала и сразу передавать"
 zg361m.130.c:0 "Отложить решение и зафиксировать явный долг по политике"
 zg361m.131.t:0 "#131 · Разведывательные OKR и обязательственные KPI — два трека"
 zg361m.131.desc:0 "[R / P1] Эта политика внедряется через общий организационный реестр. Выбранное правило изменяет поставку, доказательную базу, доверие, нагрузку, риск, кадры или финансовое давление и поэтому влияет на дальнейшие результаты команды и на собственный аттестационный отзыв руководителя."
 zg361m.131.a:0 "В начале цикла заморозить метки разведки или обязательства с точками проверки и линиями остановки"
 zg361m.131.b:0 "В конце года менять метки и относить невыполненные обязательства к учебным результатам разведки"
 zg361m.131.c:0 "Отложить решение и зафиксировать явный долг по политике"
 zg361m.132.t:0 "#132 · Заслуга за своевременное закрытие проекта"
 zg361m.132.desc:0 "[R / P1] Эта политика внедряется через общий организационный реестр. Выбранное правило изменяет поставку, доказательную базу, доверие, нагрузку, риск, кадры или финансовое давление и поэтому влияет на дальнейшие результаты команды и на собственный аттестационный отзыв руководителя."
 zg361m.132.a:0 "Останавливать по доказательствам нежизнеспособности, фиксировать сэкономленные ресурсы и проводить ревью у спонсора"
 zg361m.132.b:0 "Продолжать финансирование до поставки или краха, не признавая невозвратные затраты"
 zg361m.132.c:0 "Отложить решение и зафиксировать явный долг по политике"
 zg361m.133.t:0 "#133 · Безвиновое обучение и ответственность — по разным трекам"
 zg361m.133.desc:0 "[R / P1] Эта политика внедряется через общий организационный реестр. Выбранное правило изменяет поставку, доказательную базу, доверие, нагрузку, риск, кадры или финансовое давление и поэтому влияет на дальнейшие результаты команды и на собственный аттестационный отзыв руководителя."
 zg361m.133.a:0 "Сначала зафиксировать факты и системные причины, затем отдельно разбирать обман, сокрытие и халатность"
 zg361m.133.b:0 "Сразу назвать и наказать главного виновника, чтобы быстро восстановить порядок"
 zg361m.133.c:0 "Отложить решение и зафиксировать явный долг по политике"
 zg361m.134.t:0 "#134 · Единый владелец и арбитраж для общих метрик"
 zg361m.134.desc:0 "[R / P1] Эта политика внедряется через общий организационный реестр. Выбранное правило изменяет поставку, доказательную базу, доверие, нагрузку, риск, кадры или финансовое давление и поэтому влияет на дальнейшие результаты команды и на собственный аттестационный отзыв руководителя."
 zg361m.134.a:0 "Зарегистрировать одного владельца, соисполнителей, зависимости и фактический маршрут арбитража"
 zg361m.134.b:0 "Сохранять коллективное владение и поручать руководству назначать героев и виноватых при закрытии"
 zg361m.134.c:0 "Отложить решение и зафиксировать явный долг по политике"
 zg361m.135.t:0 "#135 · Теневая предварительная оценка и окно ожиданий"
 zg361m.135.desc:0 "[S / P1] Эта политика внедряется через общий организационный реестр. Выбранное правило изменяет поставку, доказательную базу, доверие, нагрузку, риск, кадры или финансовое давление и поэтому влияет на дальнейшие результаты команды и на собственный аттестационный отзыв руководителя."
 zg361m.135.a:0 "Раскрывать предварительную оценку и пробелы в доказательствах до калибровки"
 zg361m.135.b:0 "Держать теневую оценку закрытой и объявлять её только на финальном ревью"
 zg361m.135.c:0 "Отложить решение и зафиксировать явный долг по политике"
 zg361m.136.t:0 "#136 · Межруководительская предкалибровочная встреча"
 zg361m.136.desc:0 "[S / P1] Эта политика внедряется через общий организационный реестр. Выбранное правило изменяет поставку, доказательную базу, доверие, нагрузку, риск, кадры или финансовое давление и поэтому влияет на дальнейшие результаты команды и на собственный аттестационный отзыв руководителя."
 zg361m.136.a:0 "Предварительно разбирать только граничные случаи с протоколом, не распределяя все слоты"
 zg361m.136.b:0 "Заблаговременно распределять все оценки в частном порядке, чтобы формальная встреча быстро их утвердила"
 zg361m.136.c:0 "Отложить решение и зафиксировать явный долг по политике"
 zg361m.137.t:0 "#137 · Порядок повестки и эффект якоря"
 zg361m.137.desc:0 "[S / P2] Эта политика внедряется через общий организационный реестр. Выбранное правило изменяет поставку, доказательную базу, доверие, нагрузку, риск, кадры или финансовое давление и поэтому влияет на дальнейшие результаты команды и на собственный аттестационный отзыв руководителя."
 zg361m.137.a:0 "Рандомизировать или чередовать повестку по правилу, опубликованному до встречи"
 zg361m.137.b:0 "Сначала рассматривать стратегические команды и союзников, закрепляя якоря при высоком внимании"
 zg361m.137.c:0 "Отложить решение и зафиксировать явный долг по политике"
 zg361m.138.t:0 "#138 · Округление квот и распределение остатков"
 zg361m.138.desc:0 "[S / P1] Эта политика внедряется через общий организационный реестр. Выбранное правило изменяет поставку, доказательную базу, доверие, нагрузку, риск, кадры или финансовое давление и поэтому влияет на дальнейшие результаты команды и на собственный аттестационный отзыв руководителя."
 zg361m.138.a:0 "До начала оценок заморозить правила максимального остатка и межцикловой ротации и обнародовать их"
 zg361m.138.b:0 "Позволить председателю после ознакомления со списком отдать остаток одной команде"
 zg361m.138.c:0 "Отложить решение и зафиксировать явный долг по политике"
 zg361m.139.t:0 "#139 · Межцикловой долг квот"
 zg361m.139.desc:0 "[S / P2] Эта политика внедряется через общий организационный реестр. Выбранное правило изменяет поставку, доказательную базу, доверие, нагрузку, риск, кадры или финансовое давление и поэтому влияет на дальнейшие результаты команды и на собственный аттестационный отзыв руководителя."
 zg361m.139.a:0 "Разрешить заём одного слота квоты со сроком, ответственным руководителем и обязательством при реорганизации"
 zg361m.139.b:0 "Жёстко закрывать квоты каждый цикл и не переносить долг по оценкам дальше"
 zg361m.139.c:0 "Отложить решение и зафиксировать явный долг по политике"
 zg361m.140.t:0 "#140 · Дата владения квотой при реорганизациях"
 zg361m.140.desc:0 "[S / P1] Эта политика внедряется через общий организационный реестр. Выбранное правило изменяет поставку, доказательную базу, доверие, нагрузку, риск, кадры или финансовое давление и поэтому влияет на дальнейшие результаты команды и на собственный аттестационный отзыв руководителя."
 zg361m.140.a:0 "Назначать владение квотой по дням службы или владельцу цели и замораживать его указом о сборе"
 zg361m.140.b:0 "Передавать все квоты верхнего и нижнего уровня итоговой организации года"
 zg361m.140.c:0 "Отложить решение и зафиксировать явный долг по политике"
 zg361m.141.t:0 "#141 · Список «спасти/казнить» от руководства"
 zg361m.141.desc:0 "[S / P2] Эта политика внедряется через общий организационный реестр. Выбранное правило изменяет поставку, доказательную базу, доверие, нагрузку, риск, кадры или финансовое давление и поэтому влияет на дальнейшие результаты команды и на собственный аттестационный отзыв руководителя."
 zg361m.141.a:0 "Давать руководителям один задокументированный флаг обязательного обсуждения и аудировать его обоснование и точность"
 zg361m.141.b:0 "Позволять руководителям напрямую спасать или карать сотрудников через уровень, быстро завершая спор"
 zg361m.141.c:0 "Отложить решение и зафиксировать явный долг по политике"
 zg361m.142.t:0 "#142 · Ожидающая оценка для непроверенных вех"
 zg361m.142.desc:0 "[S / P2] Эта политика внедряется через общий организационный реестр. Выбранное правило изменяет поставку, доказательную базу, доверие, нагрузку, риск, кадры или финансовое давление и поэтому влияет на дальнейшие результаты команды и на собственный аттестационный отзыв руководителя."
 zg361m.142.a:0 "Открывать короткое окно ожидания с ответственным проверяющим и замораживать выплаты и закрытие квоты"
 zg361m.142.b:0 "Оценивать по дате отсечения и относить все опоздавшие вехи в следующий цикл"
 zg361m.142.c:0 "Отложить решение и зафиксировать явный долг по политике"
 zg361m.143.t:0 "#143 · Симметричное обращение с событиями после отсечения"
 zg361m.143.desc:0 "[S / P1] Эта политика внедряется через общий организационный реестр. Выбранное правило изменяет поставку, доказательную базу, доверие, нагрузку, риск, кадры или финансовое давление и поэтому влияет на дальнейшие результаты команды и на собственный аттестационный отзыв руководителя."
 zg361m.143.a:0 "До выплат один раз переоткрыть по тому же порогу существенности для успехов и провалов"
 zg361m.143.b:0 "Никогда не переоткрывать закрытый список, перенося крупные успехи и инциденты вперёд"
 zg361m.143.c:0 "Отложить решение и зафиксировать явный долг по политике"
 zg361m.144.t:0 "#144 · Голоса несогласия при калибровке"
 zg361m.144.desc:0 "[S / P1] Эта политика внедряется через общий организационный реестр. Выбранное правило изменяет поставку, доказательную базу, доверие, нагрузку, риск, кадры или финансовое давление и поэтому влияет на дальнейшие результаты команды и на собственный аттестационный отзыв руководителя."
 zg361m.144.a:0 "Фиксировать именные несогласия с доказательствами и обновлять кредит суждения после апелляций"
 zg361m.144.b:0 "Требовать единогласного подписания без записи меньшинства, чтобы сразу закрыть расчёт"
 zg361m.144.c:0 "Отложить решение и зафиксировать явный долг по политике"
 zg361m.145.t:0 "#145 · Теневое упорядочение внутри грейда"
 zg361m.145.desc:0 "[S / P2] Эта политика внедряется через общий организационный реестр. Выбранное правило изменяет поставку, доказательную базу, доверие, нагрузку, риск, кадры или финансовое давление и поэтому влияет на дальнейшие результаты команды и на собственный аттестационный отзыв руководителя."
 zg361m.145.a:0 "Публиковать только развивающий внутренний порядок 3.5 и запрещать его влияние на оплату"
 zg361m.145.b:0 "Позволять руководителям тайно вести порядок B-плюс/B-минус для распределения возможностей"
 zg361m.145.c:0 "Отложить решение и зафиксировать явный долг по политике"
 zg361m.146.t:0 "#146 · Прямые оценки против дипломатичной обратной связи"
 zg361m.146.desc:0 "[T / P1] Эта политика внедряется через общий организационный реестр. Выбранное правило изменяет поставку, доказательную базу, доверие, нагрузку, риск, кадры или финансовое давление и поэтому влияет на дальнейшие результаты команды и на собственный аттестационный отзыв руководителя."
 zg361m.146.a:0 "Сначала назвать оценку, затем разобрать доказательства, последствия и действия"
 zg361m.146.b:0 "Начать с языка развития и раскрыть оценку только в конце разговора"
 zg361m.146.c:0 "Отложить решение и зафиксировать явный долг по политике"
 zg361m.147.t:0 "#147 · Обязательный шаблон «похвала и критика»"
 zg361m.147.desc:0 "[T / P2] Эта политика внедряется через общий организационный реестр. Выбранное правило изменяет поставку, доказательную базу, доверие, нагрузку, риск, кадры или финансовое давление и поэтому влияет на дальнейшие результаты команды и на собственный аттестационный отзыв руководителя."
 zg361m.147.a:0 "Разрешать полностью положительную или полностью отрицательную обратную связь при наличии доказательств у каждого суждения"
 zg361m.147.b:0 "Заставлять каждого давать одну похвалу и одну критику через единый шаблон"
 zg361m.147.c:0 "Отложить решение и зафиксировать явный долг по политике"
 zg361m.148.t:0 "#148 · Сначала доказательства или сначала оценка"
 zg361m.148.desc:0 "[T / P1] Эта политика внедряется через общий организационный реестр. Выбранное правило изменяет поставку, доказательную базу, доверие, нагрузку, риск, кадры или финансовое давление и поэтому влияет на дальнейшие результаты команды и на собственный аттестационный отзыв руководителя."
 zg361m.148.a:0 "Сначала сверить замороженное дело пункт за пунктом, затем огласить зафиксированную итоговую оценку"
 zg361m.148.b:0 "Сначала объявить оценку и объяснить лишь самые важные факты"
 zg361m.148.c:0 "Отложить решение и зафиксировать явный долг по политике"
 zg361m.149.t:0 "#149 · Пакет переговоров по результатам"
 zg361m.149.desc:0 "[T / P2] Эта политика внедряется через общий организационный реестр. Выбранное правило изменяет поставку, доказательную базу, доверие, нагрузку, риск, кадры или финансовое давление и поэтому влияет на дальнейшие результаты команды и на собственный аттестационный отзыв руководителя."
 zg361m.149.a:0 "Вносить в реестр каждую корректировку оплаты, защиту целей и вариант перевода, обмениваемые на пониженную оценку"
 zg361m.149.b:0 "Требовать от пограничного сотрудника принять пониженную оценку в обмен на устное будущее обещание"
 zg361m.149.c:0 "Отложить решение и зафиксировать явный долг по политике"
 zg361m.150.t:0 "#150 · Обещание компенсации «потерпи в этот раз»"
 zg361m.150.desc:0 "[T / P1] Эта политика внедряется через общий организационный реестр. Выбранное правило изменяет поставку, доказательную базу, доверие, нагрузку, риск, кадры или финансовое давление и поэтому влияет на дальнейшие результаты команды и на собственный аттестационный отзыв руководителя."
 zg361m.150.a:0 "Документировать награду или возможность, владельца, срок и оговорку о негарантированной оценке"
 zg361m.150.b:0 "Заставлять сотрудника взять квоту сейчас под личную устную гарантию руководителя"
 zg361m.150.c:0 "Отложить решение и зафиксировать явный долг по политике"
 zg361m.151.t:0 "#151 · Подпись не равна согласию"
 zg361m.151.desc:0 "[T / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет порядок передачи, доказательств, доверия, нагрузки, риска, кадров и финансового давления и потому влияет на последующие результаты команды и на собственную аттестацию руководителя."
 zg361m.151.a:0 "Раздельно фиксировать согласие, оговорки и отказ от фактов с подтверждением доставки"
 zg361m.151.b:0 "Считать любую подпись принятием и немедленно закрывать окно апелляции"
 zg361m.151.c:0 "Отложить на квартал и зафиксировать явный долг политики"
 zg361m.152.t:0 "#152 · Оценка пригодности обратной связи"
 zg361m.152.desc:0 "[T / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет порядок передачи, доказательств, доверия, нагрузки, риска, кадров и финансового давления и потому влияет на последующие результаты команды и на собственную аттестацию руководителя."
 zg361m.152.a:0 "В следующем цикле подчинённые оценивают конкретность, контролируемость, сроки и ресурсы"
 zg361m.152.b:0 "Руководители судят о качестве обратной связи по тому, как быстро подчинённые подчиняются"
 zg361m.152.c:0 "Отложить на квартал и зафиксировать явный долг политики"
 zg361m.153.t:0 "#153 · Закрытие цикла действий по обратной связи"
 zg361m.153.desc:0 "[T / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет порядок передачи, доказательств, доверия, нагрузки, риска, кадров и финансового давления и потому влияет на последующие результаты команды и на собственную аттестацию руководителя."
 zg361m.153.a:0 "Назначать ответственного, срок и подтверждение закрытия для каждого наставничества, ресурса или перевода"
 zg361m.153.b:0 "Оставить только устные контрольные точки и пусть руководитель в конце года решит, были ли они выполнены"
 zg361m.153.c:0 "Отложить на квартал и зафиксировать явный долг политики"
 zg361m.154.t:0 "#154 · Полная расшифровка или краткие протоколы"
 zg361m.154.desc:0 "[T / P2] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет порядок передачи, доказательств, доверия, нагрузки, риска, кадров и финансового давления и потому влияет на последующие результаты команды и на собственную аттестацию руководителя."
 zg361m.154.a:0 "В сложных случаях хранить поэтапные протоколы и получать исправленное двустороннее подтверждение"
 zg361m.154.b:0 "Записывать только грейд и вывод руководителя ради быстрого закрытия"
