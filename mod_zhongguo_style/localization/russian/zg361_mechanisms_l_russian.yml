 zg361m.345.t:0 "#345 · Годовой, полугодовой или квартальный цикл"
 zg361m.345.desc:0 "[AK / P2] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательную базу, доверие, нагрузку, риски, кадры или финансовое давление и поэтому влияет на дальнейшие результаты команды и собственный аттестационный цикл руководителя."
 zg361m.345.a:0 "Использовать годовой итог плюс лёгкую полугодовую проверку ради долгих результатов и контроля нагрузки"
 zg361m.345.b:0 "Каждый квартал заново прогонять полный обзор и калибровку ради быстрой правки под постоянным давлением"
 zg361m.345.c:0 "Отложить решение и зафиксировать явный долг по политике"
 zg361m.346.t:0 "#346 · Значимые сигналы результативности вне цикла"
 zg361m.346.desc:0 "[AK / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательную базу, доверие, нагрузку, риски, кадры или финансовое давление и поэтому влияет на дальнейшие результаты команды и собственный аттестационный цикл руководителя."
 zg361m.346.a:0 "Фиксировать одноразовый внецикловый сигнал для награды, разбора или корректировки целей и списать его один раз"
 zg361m.346.b:0 "Сразу после крупного события заново прогонять рейтинг всей когорты, чтобы быстрее отразить результаты"
 zg361m.346.c:0 "Отложить решение и зафиксировать явный долг по политике"
 zg361m.347.t:0 "#347 · Бюджет на ручное вмешательство руководителя"
 zg361m.347.desc:0 "[AK / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательную базу, доверие, нагрузку, риски, кадры или финансовое давление и поэтому влияет на дальнейшие результаты команды и собственный аттестационный цикл руководителя."
 zg361m.347.a:0 "Руководителям выдаётся лишь несколько очков вмешательства с указанием бенефициара, ответственного, причины и последующей точностью"
 zg361m.347.b:0 "Разрешать руководителям свободно переписывать рейтинги ради быстрой правки алгоритмических слепых зон"
 zg361m.347.c:0 "Отложить решение и зафиксировать явный долг по политике"
 zg361m.348.t:0 "#348 · Автоматическое истечение исключений из правил"
 zg361m.348.desc:0 "[AK / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательную базу, доверие, нагрузку, риски, кадры или финансовое давление и поэтому влияет на дальнейшие результаты команды и собственный аттестационный цикл руководителя."
 zg361m.348.a:0 "Защиты, надбавки, HC, исключения и доступы ставить на таймер; продление требует новых фактов"
 zg361m.348.b:0 "Любое исключение оставлять навсегда ради снижения повторных согласований и неопределённости"
 zg361m.348.c:0 "Отложить решение и зафиксировать явный долг по политике"
 zg361m.349.t:0 "#349 · Доля проверок и стоимость аудита"
 zg361m.349.desc:0 "[AK / P2] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательную базу, доверие, нагрузку, риски, кадры или финансовое давление и поэтому влияет на дальнейшие результаты команды и собственный аттестационный цикл руководителя."
 zg361m.349.a:0 "Сочетать случайную выборку с риск-таргетированными проверками, снижая долю для прозрачных команд"
 zg361m.349.b:0 "Держать долю проверок очень низкой, но карать жёстко за найденное ради дешёвого сдерживания"
 zg361m.349.c:0 "Отложить решение и зафиксировать явный долг по политике"
 zg361m.350.t:0 "#350 · Раздувание грейдов и дрейф ориентиров между годами"
 zg361m.350.desc:0 "[AK / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательную базу, доверие, нагрузку, риски, кадры или финансовое давление и поэтому влияет на дальнейшие результаты команды и собственный аттестационный цикл руководителя."
