 zg361m.30.t:0 "No.030 · Ресурсные скачки и борьба за бюджет"
 zg361m.30.desc:0 "[E / P2] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review. This item has no connected business case yet: it configures policy and changes only the organizational ledger; it does not directly execute the example personnel, payment, or resource action."
 zg361m.30.a:0 "Record route A preference: Fund small competing pilots under common milestones and freeze budget conservation and recovery dates, paying the cost of two trials. (organizational ledger only)"
 zg361m.30.b:0 "Record route B preference: Let a sponsor choose one team and stake HC and budget at once, creating focus quickly while magnifying a well-packaged failure into organizational loss. (organizational ledger only)"
