 zg361m.354.b:0 "Поставить низкие показатели отмен и текучести как жёсткие KPI и заставить руководителей сглаживать плохие данные"
 zg361m.354.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.355.t:0 "#355 · Храповый механизм целей для высокой результативности"
 zg361m.355.desc:0 "[AL / P1] Эта политика реализуется через общий организационный реестр. Её выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную оценку руководителя."
