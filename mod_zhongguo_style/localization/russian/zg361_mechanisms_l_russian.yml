 zg361m.340.b:0 "Открывать много проектов сразу, обменивая готовность на видимую занятость и ранние старты"
 zg361m.340.c:0 "Отложить решение и зафиксировать явный долг по политике"
 zg361m.341.t:0 "#341 · Долг незавершённой работы между циклами"
