 zg361m.24.t:0 "No.024 · Внутренняя мобильность и торг о переводах"
 zg361m.24.desc:0 "[D / P1] This policy is implemented through the shared organizational ledger. Its selected rule changes delivery, evidence, trust, workload, risk, talent, or fiscal pressure and therefore affects later team results and the manager's own review. This item has no connected business case yet: it configures policy and changes only the organizational ledger; it does not directly execute the example personnel, payment, or resource action."
 zg361m.24.a:0 "Record route A preference: Freeze prior history, set a new baseline, and agree handoff and backfill for transfers, spending time on a lawful path for mismatches and stars. (organizational ledger only)"
 zg361m.24.b:0 "Record route B preference: Let the old manager block or the new manager seize the employee immediately, preserving or gaining output now while creating hoarding, vacancy, and reputation debt. (organizational ledger only)"
