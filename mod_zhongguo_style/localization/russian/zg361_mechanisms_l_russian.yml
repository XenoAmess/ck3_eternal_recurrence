 zg361m.361.a:0 "Принять пересматриваемый устав с приоритетом доказательств, долгосрочных инноваций и здоровья организации с десятилетним аудитом"
 zg361m.361.b:0 "Принять жёсткий устав с приоритетом принудительной конкуренции и немедленной поставки ради плотности талантов"
 zg361m.361.c:0 "Отложить и зафиксировать явный долг по политике"
