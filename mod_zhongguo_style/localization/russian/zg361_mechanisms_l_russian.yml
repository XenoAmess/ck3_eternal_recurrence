 zg361m.353.a:0 "Измерить формы, совещания, апелляции и перебивания; убрать шаги с низкой ценностью и отслеживать ошибки"
 zg361m.353.b:0 "Добавлять контроль без измерения администрирования, ставя соответствие выше мощности"
 zg361m.353.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.354.t:0 "#354 · Манипуляции метрикой справедливости"
