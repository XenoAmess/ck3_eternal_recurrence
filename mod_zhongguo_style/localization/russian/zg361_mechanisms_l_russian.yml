 zg361m.271.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.272.t:0 "#272 · Исключение по уровню оффера"
 zg361m.272.desc:0 "[AD / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риски, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную аттестацию руководителя."
 zg361m.272.a:0 "Межкомандный пересмотр повышенного уровня или ограниченной по сроку надбавки за дефицитность и проверка внутренней инверсии"
 zg361m.272.b:0 "Позволить нанимающему менеджеру тут же обещать более высокий уровень ради скорости, разбираясь со справедливостью после найма"
 zg361m.272.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.273.t:0 "#273 · Принадлежность кандидата и «придерживание резюме»"
 zg361m.273.desc:0 "[AD / P2] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риски, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную аттестацию руководителя."
 zg361m.273.a:0 "Делиться кандидатами между командами, распределять по выбору кандидата и приоритету, отмечая вклад нашедшего"
 zg361m.273.b:0 "Закрепить кандидата за командой первого контакта и блокировать его раньше других ролей"
 zg361m.273.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.274.t:0 "#274 · Предел встречного предложения"
 zg361m.274.desc:0 "[AD / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риски, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную аттестацию руководителя."
 zg361m.274.a:0 "Сделать одно исполнимое контрпредложение по оплате или роли и выйти из аукциона на линии справедливости"
 zg361m.274.b:0 "Повышать ставку до согласия, ставя выход на работу выше и откладывая инверсию оплаты"
 zg361m.274.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.275.t:0 "#275 · Удержание HC после отказа от оффера"
 zg361m.275.desc:0 "[AD / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставку, доказательства, доверие, нагрузку, риски, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную аттестацию руководителя."
 zg361m.275.a:0 "Кратко удержать HC для запасного кандидата, затем вернуть его и разобрать причины повторных отказов"
 zg361m.275.b:0 "Позволить менеджеру бессрочно держать HC ради другого кандидата, не пересматривая роль"
 zg361m.275.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.276.t:0 "#276 · Повторный приём бывших сотрудников"
 zg361m.276.desc:0 "[AD / P1] Эта политика реализуется через общий организационный реестр. Её выбранное правило изменяет поставку, доказательства, доверие, нагрузку, риск, таланты или фискальное давление и поэтому влияет на последующие результаты команды и собственный отзыв руководителя."
 zg361m.276.a:0 "Принять повторно через целевую проверку замороженной истории, причины ухода и внешнего роста"
 zg361m.276.b:0 "Ускоренно принять знакомого бывшего сотрудника и стереть старые оценки 3.25 и конфликты"
 zg361m.276.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.277.t:0 "#277 · Без автоматического возврата HC после ухода по PIP"
 zg361m.277.desc:0 "[AD / P1] Эта политика реализуется через общий организационный реестр. Её выбранное правило изменяет поставку, доказательства, доверие, нагрузку, риск, таланты или фискальное давление и поэтому влияет на последующие результаты команды и собственный отзыв руководителя."
 zg361m.277.a:0 "Докажите, что работа по-прежнему существует и не может быть объединена или автоматизирована, прежде чем одобрять доукомплектование"
 zg361m.277.b:0 "Автоматически вернуть HC при уходе слабого сотрудника, чтобы руководитель мог сразу нанять замену"
 zg361m.277.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.278.t:0 "#278 · Годовая сверка общего вознаграждения"
 zg361m.278.desc:0 "[AE / P1] Эта политика реализуется через общий организационный реестр. Её выбранное правило изменяет поставку, доказательства, доверие, нагрузку, риск, таланты или фискальное давление и поэтому влияет на последующие результаты команды и собственный отзыв руководителя."
 zg361m.278.a:0 "Сверять жалованье, надбавки, премии и зачисленные награды построчно с указанием сроков"
 zg361m.278.b:0 "Публиковать только общий пакет и скрывать разрывы между обещанным и выплаченным"
 zg361m.278.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.279.t:0 "#279 · Договорной статус дополнительного месяца жалованья"
 zg361m.279.desc:0 "[AE / P1] Эта политика реализуется через общий организационный реестр. Её выбранное правило изменяет поставку, доказательства, доверие, нагрузку, риск, таланты или фискальное давление и поэтому влияет на последующие результаты команды и собственный отзыв руководителя."
 zg361m.279.a:0 "В начале цикла зафиксировать, является ли дополнительный месяц фиксированным, результативным или дискреционным, и вести раздельный учёт"
 zg361m.279.b:0 "В конце года переименовать дополнительный месяц ради казны и сократить расходы"
 zg361m.279.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.280.t:0 "#280 · Пропорциональный расчёт премий при входе, переводе и выходе в середине года"
 zg361m.280.desc:0 "[AE / P1] Эта политика реализуется через общий организационный реестр. Её выбранное правило изменяет поставку, доказательства, доверие, нагрузку, риск, таланты или фискальное давление и поэтому влияет на последующие результаты команды и собственный отзыв руководителя."
 zg361m.280.a:0 "Заморозить одну формулу (по месяцам службы, этапам или полному циклу) для новых сотрудников, переводов и увольнений в середине года"
 zg361m.280.b:0 "Сделать присутствие в день выплаты условием «всё или ничего», чтобы удерживать уходящих"
 zg361m.280.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.281.t:0 "#281 · Дата выплаты премии и доверие к отсрочке"
 zg361m.281.desc:0 "[AE / P1] Эта политика реализуется через общий организационный реестр. Её выбранное правило изменяет поставку, доказательства, доверие, нагрузку, риск, таланты или фискальное давление и поэтому влияет на последующие результаты команды и собственный отзыв руководителя."
 zg361m.281.a:0 "При напряжённой казне меньше обещать или устанавливать датированную отсрочку с автоматической проверкой срока"
 zg361m.281.b:0 "Сохранить полное устное обещание, но откладывать бессрочно, используя премии как бесплатное финансирование"
 zg361m.281.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.282.t:0 "#282 · Дата вступления в силу повышения и ретро-довыплата"
 zg361m.282.desc:0 "[AE / P1] Эта политика реализуется через общий организационный реестр. Её выбранное правило изменяет поставку, доказательства, доверие, нагрузку, риск, таланты или фискальное давление и поэтому влияет на последующие результаты команды и собственный отзыв руководителя."
 zg361m.282.a:0 "Зафиксировать дату вступления в силу и при задержке согласования доплатить задним числом со сверкой казны"
 zg361m.282.b:0 "Любое повышение засчитывать только с даты окончательного одобрения и не доплачивать за задержку процесса"
 zg361m.282.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.283.t:0 "#283 · Срок реализации «сухого повышения»"
 zg361m.283.desc:0 "[AE / P1] Эта политика реализуется через общий организационный реестр. Её выбранное правило изменяет поставку, доказательства, доверие, нагрузку, риск, таланты или фискальное давление и поэтому влияет на последующие результаты команды и собственный отзыв руководителя."
 zg361m.283.a:0 "При повышении обязанностей первым делом зафиксировать крайний срок выплаты, при просрочке копить долг уровня и разрешить отказ"
 zg361m.283.b:0 "Сейчас дать обязанности и титул, но откладывать оплату бессрочно как тест на лояльность"
 zg361m.283.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.284.t:0 "#284 · Скольжение буфера жалованья после понижения"
 zg361m.284.desc:0 "[AE / P1] Эта политика реализуется через общий организационный реестр. Её выбранное правило изменяет поставку, доказательства, доверие, нагрузку, риск, таланты или фискальное давление и поэтому влияет на последующие результаты команды и собственный отзыв руководителя."
 zg361m.284.a:0 "При понижении без мошенничества снижать в два цикла или снимать только управленческую надбавку"
 zg361m.284.b:0 "При снятии полномочий в тот же день срезать до минимума новой роли — дешевле всего"
 zg361m.284.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.285.t:0 "#285 · Вторая калибровка повышений внутри одной оценки"
 zg361m.285.desc:0 "[AE / P1] Эта политика реализуется через общий организационный реестр. Её выбранное правило изменяет поставку, доказательства, доверие, нагрузку, риск, таланты или фискальное давление и поэтому влияет на последующие результаты команды и собственный отзыв руководителя."
 zg361m.285.a:0 "Распределять пул по позиции в полосе, дефицитности, долгу и риску ухода с кодами причин"
 zg361m.285.b:0 "Позволить менеджерам тайно продвигать избранных внутри одной оценки без отдельной записи о жалованье"
 zg361m.285.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.286.t:0 "#286 · Заморозка выше полосы и догон ниже полосы"
 zg361m.286.desc:0 "[AE / P1] Эта политика реализуется через общий организационный реестр. Её выбранное правило изменяет поставку, доказательства, доверие, нагрузку, риск, таланты или фискальное давление и поэтому влияет на последующие результаты команды и собственный отзыв руководителя."
 zg361m.286.a:0 "Подтягивать ниже полосы, выше полосы выдавать разовые награды и устанавливать срок для исключений"
 zg361m.286.b:0 "Продолжать повышать фиксированное жалованье по оценке вне зависимости от полос, чтобы структура не мешала наградам"
 zg361m.286.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.287.t:0 "#287 · Секретность оплаты, публичные полосы или анонимное распределение"
 zg361m.287.desc:0 "[AE / P2] Эта политика реализуется через общий организационный реестр. Её выбранное правило изменяет поставку, доказательства, доверие, нагрузку, риск, таланты или фискальное давление и поэтому влияет на последующие результаты команды и собственный отзыв руководителя."
 zg361m.287.a:0 "Публиковать полосы, личную позицию и анонимное распределение среди коллег, запечатав апелляционные материалы"
 zg361m.287.b:0 "Держать суммы и полосы в секрете, чтобы менеджеры свободно договаривались по каждому случаю"
 zg361m.287.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.288.t:0 "#288 · Устранение инверсии оплаты новичков и старых сотрудников"
 zg361m.288.desc:0 "[AE / P1] Эта политика реализуется через общий организационный реестр. Её выбранное правило изменяет поставку, доказательства, доверие, нагрузку, риск, таланты или фискальное давление и поэтому влияет на последующие результаты команды и собственный отзыв руководителя."
 zg361m.288.a:0 "Подтянуть ключевых старых сотрудников или объяснить разрыв ограниченными по сроку надбавками, остальное занести в долг справедливости"
 zg361m.288.b:0 "Принять более высокие рыночные ставки новичков и оставить инверсию без исправления"
 zg361m.288.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.289.t:0 "#289 · Разделение апелляций по оплате и по оценке"
 zg361m.289.desc:0 "[AE / P1] Эта политика реализуется через общий организационный реестр. Её выбранное правило изменяет поставку, доказательства, доверие, нагрузку, риск, таланты или фискальное давление и поэтому влияет на последующие результаты команды и собственный отзыв руководителя."
 zg361m.289.a:0 "Открыть отдельную проверку премии, полосы и задолженности; исправлять деньги, не меняя ранга"
 zg361m.289.b:0 "Объединить все споры по оплате с апелляцией по оценке и закрыть расчёты одним решением"
 zg361m.289.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.290.t:0 "#290 · Пул номинаций на долгосрочные награды"
 zg361m.290.desc:0 "[AF / P1] Эта политика реализуется через общий организационный реестр. Её выбранное правило изменяет поставку, доказательства, доверие, нагрузку, риск, таланты или фискальное давление и поэтому влияет на последующие результаты команды и собственный отзыв руководителя."
 zg361m.290.a:0 "Оценивать устойчивую результативность, критичность, потенциал и риск ухода и проводить аудит номинаций"
 zg361m.290.b:0 "Концентрировать пул на самых заметных текущих 3.75, чтобы быстро удержать звёзд"
 zg361m.290.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.291.t:0 "#291 · Фиксированные доли против фиксированной стоимости гранта"
 zg361m.291.desc:0 "[AF / P2] Эта политика реализуется через общий организационный реестр. Её выбранное правило изменяет поставку, доказательства, доверие, нагрузку, риск, таланты или фискальное давление и поэтому влияет на последующие результаты команды и собственный отзыв руководителя."
 zg361m.291.a:0 "При гранте зафиксировать формулу долей или стоимости и потолки, распределяя ценовой риск по контракту"
 zg361m.291.b:0 "При расчёте выбирать ту базу долей или стоимости, что выгоднее организации"
 zg361m.291.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.292.t:0 "#292 · Высокорисковые опционы против защищённых долей"
 zg361m.292.desc:0 "[AF / P2] Эта политика реализуется через общий организационный реестр. Её выбранное правило изменяет поставку, доказательства, доверие, нагрузку, риск, таланты или фискальное давление и поэтому влияет на последующие результаты команды и собственный отзыв руководителя."
 zg361m.292.a:0 "Дать получателям осознанно выбирать между опционами, несущими стоимость ограниченными долями или меньшей суммой наличных с зафиксированными рисками"
 zg361m.292.b:0 "Выдавать всем высокодоходные, потенциально ничего не стоящие опционы ради экономии наличных"
 zg361m.292.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.293.t:0 "#293 · Добровольная конвертация текущей премии в долгосрочные доли"
 zg361m.293.desc:0 "[AF / P2] Эта политика реализуется через общий организационный реестр. Её выбранное правило изменяет поставку, доказательства, доверие, нагрузку, риск, таланты или фискальное давление и поэтому влияет на последующие результаты команды и собственный отзыв руководителя."
 zg361m.293.a:0 "Заранее раскрывать цену конвертации и правила выхода, позволяя добровольно выбрать наличные, частичный или полный перенос"
 zg361m.293.b:0 "Автоматически и полностью переносить каждую допустимую премию, чтобы облегчить текущую казну"
 zg361m.293.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.294.t:0 "#294 · Цена гранта, текущая оценка и ликвидная стоимость — три колонки"
 zg361m.294.desc:0 "[AF / P1] Эта политика реализуется через общий организационный реестр. Её выбранное правило изменяет поставку, доказательства, доверие, нагрузку, риск, таланты или фискальное давление и поэтому влияет на последующие результаты команды и собственный отзыв руководителя."
 zg361m.294.a:0 "Показывать сумму гранта, три сценария оценки и текущую ликвидность с периодической переоценкой"
 zg361m.294.b:0 "Долго показывать только историческую заглавную сумму гранта и раскрывать ликвидность лишь при реализации"
 zg361m.294.c:0 "Отложить и зафиксировать явный долг по политике"
