 zg361m.350.b:0 "При росте верхних грейдов автоматически поднимать планку для всех ради быстрого возврата к исходному распределению"
 zg361m.350.c:0 "Отложить решение и зафиксировать явный долг по политике"
 zg361m.351.t:0 "#351 · Региональный пилот политики"
 zg361m.351.desc:0 "[AK / P2] Эта политика реализуется через общий организационный реестр. Её выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную оценку руководителя."
