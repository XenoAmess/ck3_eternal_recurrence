 zg361m.351.b:0 "Переключить всё королевство немедленно ради единообразия и большой выборки"
 zg361m.351.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.352.t:0 "#352 · Сопоставление старых записей между версиями политики"
 zg361m.352.desc:0 "[AK / P1] Эта политика реализуется через общий организационный реестр. Её выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную оценку руководителя."
