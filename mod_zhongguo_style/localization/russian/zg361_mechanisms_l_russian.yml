l_russian:
 zg361_next_mechanism_decision:0 "Рассмотреть следующую политику эффективности"
 zg361_next_mechanism_decision_desc:0 "Open the next unresolved policy. Every choice enters the organizational ledger immediately; only items with a connected business case also execute character, payment, appointment, or transfer actions."
 zg361_next_mechanism_decision_tooltip:0 "Открыть следующую карту политик 361."
 zg361_next_mechanism_decision_confirm:0 "Вызвать следующего владельца политики"
 zg361_reference_charter_decision:0 "Развернуть эталонный устав 361"
 zg361_reference_charter_decision_desc:0 "Adopt all 361 recommended defaults and write their organizational indicators and policy debt immediately. This configures policy in bulk; items without a business case do not invent payments, appointments, hires, transfers, or refunds."
 zg361_reference_charter_decision_tooltip:0 "Configure all 361 ledger choices; concrete actions still require a connected business case."
 zg361_reference_charter_decision_confirm:0 "Внедрить всё портфолио целиком"
 zg361_mechanism_choice_a_tt:0 "Долгосрочный путь: улучшает доказательную базу, доверие или возможности, но расходует административный, финансовый или краткосрочный ресурс поставок."
 zg361_mechanism_choice_b_tt:0 "Спринтерский путь: улучшает немедленный результат, но переносит риск, выгорание, техдолг или долг по апелляциям в будущие проверки."
 zg361_mechanism_choice_c_tt:0 "Shelve for this campaign: this item will not be proposed again automatically; policy debt is recorded immediately and feeds your superior's review."
 zg361_scoreboard_tab_system:0 "Кокпит политик"
 zg361_ledger_title:0 "Реестр политик 361: что скрывается под панелью показателей"
 zg361_ledger_configured:0 "Утверждённые механизмы"
 zg361_ledger_checksum:0 "Контрольная сумма портфолио"
 zg361_ledger_explainer:0 "Положительное — не всегда хорошо: административная нагрузка, риск апелляций, техдолг, выгорание, давление HC, долг по оплате, долг политик и бюджетное давление становятся опасными по мере роста."
 zg361_ledger_evidence:0 "Качество доказательств"
 zg361_ledger_trust:0 "Организационное доверие"
 zg361_ledger_admin_load:0 "Нагрузка администрирования эффективности"
 zg361_ledger_appeal_risk:0 "Риск апелляций и процедур"
 zg361_ledger_delivery:0 "Поставленная ценность"
 zg361_ledger_stability:0 "Стабильность"
 zg361_ledger_tech_debt:0 "Технический долг"
 zg361_ledger_data_quality:0 "Качество данных"
 zg361_ledger_burnout:0 "Организационное выгорание"
 zg361_ledger_talent:0 "Здоровье талантов"
 zg361_ledger_hc_pressure:0 "Давление численности"
 zg361_ledger_pay_debt:0 "Долг по оплате"
 zg361_ledger_policy_debt:0 "Долг политик"
 zg361_ledger_budget_pressure:0 "Бюджетное давление"
 zg361_ledger_hint:0 "Эти реестры влияют на следующий KPI команды и на оценку вашего менеджмента вышестоящим."
 zg361_org_high_trust:0 "Организационное доверие: руководство держит слово"
 zg361_org_high_trust_desc:0 "Доказательства, обратная связь и поставки усиливают друг друга."
 zg361_org_admin_overload:0 "Перегрузка администрирования эффективности"
 zg361_org_admin_overload_desc:0 "Все заняты тем, что объясняют, почему все заняты."
 zg361_org_burnout_crisis:0 "Кризис организационного выгорания"
 zg361_org_burnout_crisis_desc:0 "Часы онлайн выглядят отлично; заряд людей — не очень."
 zg361_org_delivery_stable:0 "Стабильная культура поставки"
 zg361_org_delivery_stable_desc:0 "Не каждый релиз начинается с составления извинений."
 zg361_org_tech_debt_crisis:0 "Накопление технического долга"
 zg361_org_tech_debt_crisis_desc:0 "Вчерашняя короткая дорога стала сегодняшним пунктом оплаты."
 zg361_org_talent_healthy:0 "Здоровый кадровый конвейер"
 zg361_org_talent_healthy_desc:0 "Звёзды, преемники и стабильные сотрудники — у всех есть путь вперёд."
 zg361m.1.t:0 "No.001 · Детализированный лист доказательств KPI"
 zg361m.1.desc:0 "[A / P0] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставки, доказательства, доверие, нагрузку, риск, таланты или финансовое давление и потому влияет на дальнейшие результаты команды и собственную оценку руководителя."
 zg361m.1.a:0 "Создайте детализированный лист доказательств, зафиксируйте кейсы по результативности, эффективности, росту, взаимодействию и ценностям, а также оплатите работу по оформлению и ревизии."
 zg361m.1.b:0 "Немедленно установить грейд по итоговому баллу и впечатлению руководителя, быстро обнародовать, но затруднить отслеживание пропусков и ошибок."
 zg361m.1.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.2.t:0 "No.002 · Годовой OKR-направление и KPI-контракт"
 zg361m.2.desc:0 "[A / P0] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставки, доказательства, доверие, нагрузку, риск, таланты или финансовое давление и потому влияет на дальнейшие результаты команды и собственную оценку руководителя."
 zg361m.2.a:0 "Заморозить направления по ролям, базовые линии и нормальные цели, разрешив один сброс при кризисе с подтверждением, ценой постоянного отслеживания."
 zg361m.2.b:0 "Всем подразделениям задать агрессивные цели и удерживать исходную линию, купив короткий спринт риском манипуляций метриками и сокрытия проблем."
 zg361m.2.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.3.t:0 "No.003 · Серединный чек-ин и сброс целей"
 zg361m.3.desc:0 "[A / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставки, доказательства, доверие, нагрузку, риск, таланты или финансовое давление и потому влияет на дальнейшие результаты команды и собственную оценку руководителя."
 zg361m.3.a:0 "Провести серединный коучинг-обзор, записать риски и ресурсы, разрешить один задокументированный сброс при кризисе, потратив время руководителя ради объяснимой итоговой оценки."
 zg361m.3.b:0 "Удержать стартовые цели и требовать догоняющего дедлайна, избегая работы по сбросу, но рискуя приписать стратегические изменения личным провалам и задержать плохие новости."
 zg361m.3.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.4.t:0 "No.004 · Самооценка и разрыв восприятия"
 zg361m.4.desc:0 "[A / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставки, доказательства, доверие, нагрузку, риск, таланты или финансовое давление и потому влияет на дальнейшие результаты команды и собственную оценку руководителя."
 zg361m.4.a:0 "Требовать самооценку с подтверждающими результатами и обязывать руководителя отвечать на каждый разрыв восприятия, принимая затраты на обсуждение ради проверяемой записи."
 zg361m.4.b:0 "Получить одностраничную самопрезентацию и быстро скорректировать субъективный балл за хвастовство или скромность, экономя время, но путая подачу с результатом."
 zg361m.4.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.5.t:0 "No.005 · Ролевые скоринговые карты"
 zg361m.5.desc:0 "[A / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставки, доказательства, доверие, нагрузку, риск, таланты или финансовое давление и потому влияет на дальнейшие результаты команды и собственную оценку руководителя."
 zg361m.5.a:0 "Заморозить разные веса для управленческих, военных, финансовых и административных ролей до калибровки в той же прямой когорте, приняв расходы на множество скоринговых карт."
 zg361m.5.b:0 "Принудительно ранжировать все роли по одной таблице результатов для быстрого исполнения, систематически наказывая плохо измеримую работу и усиливая ролевое несоответствие."
 zg361m.5.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.6.t:0 "No.006 · Корректировка стартовой точки и сложности"
 zg361m.6.desc:0 "[A / P2] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставки, доказательства, доверие, нагрузку, риск, таланты или финансовое давление и потому влияет на дальнейшие результаты команды и собственную оценку руководителя."
 zg361m.6.a:0 "Заморозить унаследованные базовые линии, ресурсы и сложность роли, разрешая только ограниченные корректировки, потратив аудиторские усилия ради более справедливых сравнений."
 zg361m.6.b:0 "Оценивать только абсолютные годовые результаты и давить на богатые подразделения сильнее, получая быструю таблицу, но поощряя наследственное богатство и наказывая работу по расчистке."
 zg361m.6.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.7.t:0 "No.007 · Спина к спине приглашения к 360° оценке"
 zg361m.7.desc:0 "[B / P0] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставки, доказательства, доверие, нагрузку, риск, таланты или финансовое давление и потому влияет на дальнейшие результаты команды и собственную оценку руководителя."
 zg361m.7.a:0 "Приглашать небольшое число реальных соисполнителей, требовать конкретные кейсы и перекрёстно их проверять, оплачивая административные расходы на приглашение и дедупликацию."
 zg361m.7.b:0 "Широко рассылать приглашения и сразу взвешивать высокие и низкие голоса, быстро усиливая сигнал, но открывая пространство для взаимной похвалы, мести и шаблонной воды."
 zg361m.7.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.8.t:0 "No.008 · Мягкость/жёсткость оценщика и кредит доверия коллег"
 zg361m.8.desc:0 "[B / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставки, доказательства, доверие, нагрузку, риск, таланты или финансовое давление и потому влияет на дальнейшие результаты команды и собственную оценку руководителя."
 zg361m.8.a:0 "Поддерживать историческое среднее, дисперсию, долю отмен и точность каждого оценщика и калибровать его вес, принимая долгосрочные затраты на управление данными."
 zg361m.8.b:0 "Принять в этом цикле сырые оценки коллег и наказывать исказителей только после апелляций, быстро закрывая цикл, но позволяя мягким и жёстким оценщикам формировать рейтинг первыми."
 zg361m.8.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.9.t:0 "No.009 · Панель калибровочного совещания"
 zg361m.9.desc:0 "[B / P0] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставки, доказательства, доверие, нагрузку, риск, таланты или финансовое давление и потому влияет на дальнейшие результаты команды и собственную оценку руководителя."
 zg361m.9.a:0 "Показывать вместе KPI, ценности, цели, 360°, тренды и доказательства апелляций, фиксируя каждый перевод грейда как квотно-нейтральный обмен."
 zg361m.9.b:0 "Закрыть таблицу за одно совещание по текущим итогам и остаткам квот, действуя быстро, но выдавливая пограничные случаи и невидимый вклад."
 zg361m.9.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.10.t:0 "No.010 · Назначение C и защита подчинённого"
 zg361m.10.desc:0 "[B / P0] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставки, доказательства, доверие, нагрузку, риск, таланты или финансовое давление и потому влияет на дальнейшие результаты команды и собственную оценку руководителя."
 zg361m.10.a:0 "Выбирать низший грейд по замороженным доказательствам; если руководитель защищает, открыто списать престиж и KPI управления следующего цикла, сохраняя доверие ценой реального институционального расхода."
 zg361m.10.b:0 "Назначить C сразу новичку или периферийному участнику ради квоты, закрывая распределение сейчас, но копя риск апелляций, обиды и оттока."
 zg361m.10.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.11.t:0 "No.011 · Калибровка через уровень и место HR-комиссара"
 zg361m.11.desc:0 "[B / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставки, доказательства, доверие, нагрузку, риск, таланты или финансовое давление и потому влияет на дальнейшие результаты команды и собственную оценку руководителя."
 zg361m.11.a:0 "Позволить вышестоящему через уровень проверять только распределение, крайние доказательства и процесс, возвращая слабые списки прямому руководителю ценой ещё одного совещания."
 zg361m.11.b:0 "Позволить креслу через уровень напрямую править грейды внучатых сотрудников для быстрой коррекции, обходя переделку, но подрывая власть прямого руководителя и открывая лоббизм."
 zg361m.11.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.12.t:0 "No.012 · Раскрытие конфликта интересов и отвод"
 zg361m.12.desc:0 "[B / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставки, доказательства, доверие, нагрузку, риск, таланты или финансовое давление и потому влияет на дальнейшие результаты команды и собственную оценку руководителя."
 zg361m.12.a:0 "Раскрывать родство, близость, вражду и покровительство до калибровки и заменять отведённых оценщиков независимым креслом, принимая расходы на формирование состава и задержки."
 zg361m.12.b:0 "Позволить руководителю открыто настаивать или действовать втихую, чтобы быстро защитить или наказать, контролируя результат, но резко повышая риск отмены и собственного штрафа."
 zg361m.12.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.13.t:0 "No.013 · Прозрачная, поэтапная или чёрноящичная публикация"
 zg361m.13.desc:0 "[B / P2] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставки, доказательства, доверие, нагрузку, риск, таланты или финансовое давление и потому влияет на дальнейшие результаты команды и собственную оценку руководителя."
 zg361m.13.a:0 "Дать каждому субъекту замороженные основания и путь апелляции, публиковать команде грейды и сводные правила, ввести контроль доступа для чувствительных оценок коллег."
 zg361m.13.b:0 "Сообщать каждому только итоговый грейд и засекречивать основания, быстро снижая открытые конфликты, но усиливая подозрения, управление вверх и апелляции."
 zg361m.13.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.14.t:0 "No.014 · Досье апелляции по эффективности"
 zg361m.14.desc:0 "[C / P0] Чиновник подаёт апелляцию с замороженными доказательствами после обсуждения дела с прямым начальником. В случае удовлетворения начальник пересчитывает результат, по отдельности возвращает три немедленных сбора 3.25 в местную казну, личное золото и заслуги, немедленно прекращает незавершённое годичное удержание жалованья в 25% и корректирует место в рейтинге; отклонённая или злонамеренная апелляция обходится в положение и доверие."
 zg361m.14.a:0 "Собрать замороженные доказательства по типу ошибки, потребовать обсуждения перед независимой проверкой и согласовать пересчёт, все три немедленных возврата и прекращение удержания жалованья по отдельности."
 zg361m.14.b:0 "Позволить прежнему руководителю отклонить или пересмотреть грейд на месте, быстро закрывая спор, но рискуя двойными штрафами, неверными возвратами и закреплением конфликта."
 zg361m.14.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.15.t:0 "No.015 · Карта улучшений PIP"
 zg361m.15.desc:0 "[C / P0] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставки, доказательства, доверие, нагрузку, риск, таланты или финансовое давление и потому влияет на дальнейшие результаты команды и собственную оценку руководителя."
 zg361m.15.a:0 "Согласовать проверяемые вехи, поддержку и контрольные точки в рамках полномочий субъекта, потратив ресурсы на действительно достижимый шанс улучшения."
 zg361m.15.b:0 "Установить жёсткие вехи и твёрдый дедлайн, записать отказ как серьёзное отрицательное доказательство, действуя быстро, но создавая видимость предрешённого ухода."
 zg361m.15.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.16.t:0 "No.016 · Бюджет поддержки PIP и «только метрики, без ресурсов»"
 zg361m.16.desc:0 "[C / P1] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставки, доказательства, доверие, нагрузку, риск, таланты или финансовое давление и потому влияет на дальнейшие результаты команды и собственную оценку руководителя."
 zg361m.16.a:0 "Профинансировать наставника, временные ресурсы управления и расписание внимания для PIP, записывая каждое вложение, платя из бюджета ради проверки реального улучшения."
 zg361m.16.b:0 "Ставить цели без ресурсов и принудительно проверять к дедлайну, экономя текущий бюджет, но превращая провал в доказательство апелляции и удар по менеджеру."
 zg361m.16.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.17.t:0 "No.017 · Лестница действий для слабейших"
 zg361m.17.desc:0 "[C / P0] Эта политика реализуется через общий организационный реестр. Выбранное правило меняет поставки, доказательства, доверие, нагрузку, риск, таланты или финансовое давление и потому влияет на дальнейшие результаты команды и собственную оценку руководителя."
 zg361m.17.a:0 "При первом низком грейде использовать обсуждение, PIP и законный перевод; снижать полномочия или освобождать HC только после повторных неудач, оплачивая расходы на развитие."
 zg361m.17.b:0 "Сразу замораживать повышение, понижать или снимать слабейшего для роста плотности талантов, быстро освобождая позиции, но создавая страх, вакансии и концентрированные апелляции."
 zg361m.17.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
 zg361m.18.t:0 "No.018 · Личная грамота и четверной расчёт"
