 zg361m.20.a:0 "Record route A preference: Build the promotion packet from frozen governance results, team impact, and reusable methods, then record a cross-unit panel's boundary judgment. (organizational ledger only)"
 zg361m.20.b:0 "Record route B preference: Let a sponsor drive a single oral pitch and decide quickly, favoring strong presentation while risking packaging outranking sustained results. (organizational ledger only)"
