 zg361m.22.a:0 "Record route A preference: Set an annual recruiting, development, and backfill budget from team results, finances, and vacancies, tracking each slot through use and recovery. (organizational ledger only)"
 zg361m.22.b:0 "Record route B preference: Expand or freeze capacity ad hoc from current pressure and superior preference, reinforcing priorities fast while starving low-visibility teams and encouraging slot hoarding. (organizational ledger only)"
