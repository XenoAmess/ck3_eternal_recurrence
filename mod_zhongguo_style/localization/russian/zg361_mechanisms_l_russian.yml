 zg361m.18.a:0 "Record route A preference: Freeze rating, rank, superior, reasons, the three immediate treasury, personal-gold, and merit charges, and the one-year salary cut at settlement, marking every payment, refund, and termination separately. (organizational ledger only)"
 zg361m.18.b:0 "Record route B preference: Combine charges from live values when the record is opened and display them immediately, shortening the flow while risking errors after superior or balance changes and repeated opens. (organizational ledger only)"
 zg361m.18.c:0 "Shelve this item for the campaign; it will not return automatically, and policy debt is recorded"
