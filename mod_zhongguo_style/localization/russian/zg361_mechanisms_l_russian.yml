 zg361m.21.a:0 "Record route A preference: Publish the rating-to-bonus-and-raise matrix in advance and lock the total pool, funding top ratings for real at a current fiscal cost. (organizational ledger only)"
 zg361m.21.b:0 "Record route B preference: Concentrate limited cash on a few top ratings and defer base-pay adjustments, sharpening the signal quickly while building pay debt, inversion, and poaching risk. (organizational ledger only)"
