 zg361m.359.a:0 "Использовать резерв квоты или пересмотреть пограничные случаи с повторной доставкой извещений всем затронутым и правом апелляции"
 zg361m.359.b:0 "Тихо понизить пограничный случай ради возврата квоты, не открывая цепочку заново"
 zg361m.359.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.360.t:0 "#360 · Коллективный отказ руководителей навязывать «жёсткое C»"
 zg361m.360.desc:0 "[AL / P2] Эта политика реализуется через общий организационный реестр. Её выбранное правило меняет поставку, доказательства, доверие, нагрузку, риск, кадры или финансовое давление и потому влияет на последующие результаты команды и на собственную оценку руководителя."
 zg361m.360.a:0 "Разрешить руководителям совместно добиваться подтверждённого исключения или публичной реформы ценой балла управления"
 zg361m.360.b:0 "Приказать каждому руководителю навязать нижнюю оценку и сохранить нарратив о плотности талантов"
 zg361m.360.c:0 "Отложить и зафиксировать явный долг по политике"
 zg361m.361.t:0 "#361 · Устав результативности 361"
