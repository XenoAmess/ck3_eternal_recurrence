l_german:
 rule_rmtm_hegemon_fate:0 "Schicksal des chinesischen Hegemons"
 setting_rmtm_reclaim_the_motherland:0 "Das Reich zurückerobern"
 setting_rmtm_reclaim_the_motherland_desc:0 "Wenn die chinesische Hegemonie ins Zeitalter der Kriegsherren eintritt, verliert der frühere Hegemon das Mandat des Himmels und die chinesische Hegemonie, behält jedoch alle persönlich gehaltenen Ländereien und anderen Titel. Direkte hegemonietreue Vasallen entscheiden nach der Wahl der hegemonietreuen Fürsten über ihren Verbleib, während die übrigen in den Wirren eigene Wege gehen. Eine Hegemonie der Späteren Dynastie ohne De-jure-Land führt die Herrscherlinie fort."
 setting_rmtm_vanilla_shattering:0 "Ursprüngliche Zersplitterung"
 setting_rmtm_vanilla_shattering_desc:0 "Der chinesische Hegemon und seine Vasallen folgen den ursprünglichen Regeln des Zeitalters der Kriegsherren."
 rule_rmtm_pro_hegemon_choice:0 "Die Wahl der Loyalisten"
 setting_rmtm_divided_hearts:0 "Geteilte Herzen"
 setting_rmtm_divided_hearts_desc:0 "Wenn das Zeitalter der Kriegsherren beginnt, überdenken direkte hegemonietreue Vasallen ihre Treue anhand ihrer Bindungen, ihres Charakters, ihrer Feindschaften und ihrer militärischen Stärke. Offene Feinde fallen ab, die Treuesten bleiben und alle anderen wählen ihren eigenen Weg."
 setting_rmtm_unwavering_loyalty:0 "Unerschütterliche Treue"
 setting_rmtm_unwavering_loyalty_desc:0 "Alle direkten hegemonietreuen Vasallen bleiben beim alten Kaiser; damit gilt weiterhin das Verhalten von Das Reich zurückerobern 0.1.1."
 rmtm_claim_restoration_decision:0 "Die Restauration ausrufen"
 rmtm_claim_restoration_decision_desc:0 "Das Reich liegt zerteilt, doch seine Glut erlischt nicht. Gewinne genug von China zurück, um vor dem Himmel zu stehen, und verkünde die Wiederherstellung der alten Dynastie."
 rmtm_claim_restoration_decision_tooltip:0 "Verkünde, dass das Reich fortbesteht und das Mandat des Himmels zurückgekehrt ist. Der Name der Späteren Dynastie wird beigelegt, sobald die Wiederherstellung vollendet ist."
 rmtm_claim_restoration_decision_confirm:0 "Das Reich wiederherstellen"
 rmtm_restoration_title_prefix:0 "Spätere "
 rmtm_restoration_hegemony_fallback_name:0 "Spätere Dynastie"
 rmtm_restoration_hegemony_fallback_name_adj:0 "der Späteren Dynastie"
 rmtm_claim_mandate_blocked_by_restoration_tt:0 "Die Dynastie besteht noch fort; sie bedarf keines neuen Mandats. Gewinne das alte Reich zurück und verkünde seine Wiederherstellung."
 rmtm_loyalty_summary_title:0 "Wo die Treue liegt"
 rmtm_loyalty_summary_both:0 "Als das Reich zerbricht, folgt [rmtm_loyal_notable.GetFirstName] dem Ruf und behält den alten Titel unter deinem Banner. [rmtm_defector_notable.GetFirstName] hingegen wägt alte Pflichten gegen gegenwärtige Stärke ab, sagt sich vom Hof los und kämpft um das Reich."
 rmtm_loyalty_summary_loyal_only:0 "Als das Reich zerbricht, folgt [rmtm_loyal_notable.GetFirstName] dem Ruf und behält den alten Titel unter deinem Banner. Vorerst halten die alten Bande von Gnade und Pflicht."
 rmtm_loyalty_summary_defector_only:0 "Als das Reich zerbricht, sagt sich [rmtm_defector_notable.GetFirstName] vom Hof los. Feindschaft, Ehrgeiz und die Macht der Waffen wiegen schwerer als das einstige Treuebekenntnis."
 rmtm_loyalty_summary_acknowledge:0 "Taten sollen zeigen, wer das Reich wiederherstellen kann."
