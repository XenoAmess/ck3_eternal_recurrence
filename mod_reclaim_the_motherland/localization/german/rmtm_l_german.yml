l_german:
 rule_rmtm_hegemon_fate:0 "Schicksal des chinesischen Hegemons"
 setting_rmtm_reclaim_the_motherland:0 "Das Reich zurückerobern"
 setting_rmtm_reclaim_the_motherland_desc:0 "Wenn die chinesische Hegemonie ins Zeitalter der Kriegsherren eintritt, verliert der frühere Hegemon das Mandat des Himmels und die chinesische Hegemonie, behält jedoch seine Ländereien, anderen Titel und direkten hegemonietreuen Vasallen unter einer de-jure-landlosen Hegemonie der Späteren Dynastie."
 setting_rmtm_vanilla_shattering:0 "Ursprüngliche Zersplitterung"
 setting_rmtm_vanilla_shattering_desc:0 "Der chinesische Hegemon und seine Vasallen folgen den ursprünglichen Regeln des Zeitalters der Kriegsherren."
 rmtm_claim_restoration_decision:0 "Die Restauration ausrufen"
 rmtm_claim_restoration_decision_desc:0 "Das alte Reich ist zerspalten, doch seine Glut ist noch nicht erloschen. Gewinne denselben Anteil Chinas zurück, der für den Anspruch auf das Mandat nötig ist, stelle die chinesische Hegemonie wieder her und führe die Spätere Dynastie zu ihrem bestimmten Ende."
 rmtm_claim_restoration_decision_tooltip:0 "Stelle die chinesische Hegemonie mit allen Effekten der ursprünglichen Entscheidung Das Mandat beanspruchen wieder her und vernichte anschließend alle Hegemonien der Späteren Dynastie, die du hältst."
 rmtm_claim_restoration_decision_confirm:0 "Das Reich wiederherstellen"
 rmtm_restoration_title_prefix:0 "Spätere "
 rmtm_restoration_hegemony_fallback_name:0 "Spätere Dynastie"
 rmtm_restoration_hegemony_fallback_name_adj:0 "der Späteren Dynastie"
 rmtm_claim_mandate_blocked_by_restoration_tt:0 "Ein Herrscher mit einer Hegemonie der Späteren Dynastie kann kein neues Mandat beanspruchen und muss stattdessen eine Restauration ausrufen."
