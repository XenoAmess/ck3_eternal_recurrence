l_japanese:
 rule_rmtm_hegemon_fate:0 "中華覇権の行く末"
 setting_rmtm_reclaim_the_motherland:0 "山河を取り戻す"
 setting_rmtm_reclaim_the_motherland_desc:0 "中華覇権が群雄割拠の時代に入ると、旧天子は天命と中華覇権を失うが、直轄領とその他の称号はすべて保持する。尊王派の直属封臣は「尊王諸侯の選択」に従って去就を決め、その他の諸侯は乱世の中で離散する。法理領土を持たない「後＋元の朝号」の覇権を新設し、国祚をつなぐ。"
 setting_rmtm_vanilla_shattering:0 "群雄割拠（原版）"
 setting_rmtm_vanilla_shattering_desc:0 "中華覇権の支配者と封臣は、原版の群雄割拠ルールに従う。"
 rule_rmtm_pro_hegemon_choice:0 "尊王派の選択"
 setting_rmtm_divided_hearts:0 "離反する心"
 setting_rmtm_divided_hearts_desc:0 "群雄割拠の世が始まると、尊王派の直属封臣は縁、人物の気質、敵対関係、兵力に応じて去就を改める。公然と敵対する者は離反し、最も忠義篤い者は留まり、その他は己の道を選ぶ。"
 setting_rmtm_unwavering_loyalty:0 "揺るがぬ忠義"
 setting_rmtm_unwavering_loyalty_desc:0 "尊王派の直属封臣はすべて旧天子に従い、『山河を取り戻す』0.1.1 の挙動を維持する。"
 rmtm_claim_restoration_decision:0 "復辟を宣言する"
 rmtm_claim_restoration_decision_desc:0 "天下は裂けようとも、残り火はいまだ消えず。中華の地を鼎を問うに足るほど奪還したなら、宗廟と天に告げ、旧朝の再興を宣言せよ。"
 rmtm_claim_restoration_decision_tooltip:0 "天下に告げよ――故国は蘇り、天命は帰した。後朝の名は復辟の成就とともに封じられる。"
 rmtm_claim_restoration_decision_confirm:0 "山河を復す"
 rmtm_restoration_title_prefix:0 "後"
 rmtm_restoration_hegemony_fallback_name:0 "後朝"
 rmtm_restoration_hegemony_fallback_name_adj:0 "後朝の"
 rmtm_claim_mandate_blocked_by_restoration_tt:0 "国祚はいまだ絶えぬ。何ゆえ新たな天命を受ける必要があろう。旧土を取り戻し、復辟を宣言せよ。"
 rmtm_loyalty_summary_title:0 "人心の向く所"
 rmtm_loyalty_summary_both:0 "山河崩るるの折、[rmtm_loyal_notable.GetFirstName]は詔に応じて朝に留まり、旧き号のまま旗下に在り続ける。[rmtm_defector_notable.GetFirstName]は旧き務めと今の兵勢を秤にかけ、朝を去りて天下を争う。"
 rmtm_loyalty_summary_loyal_only:0 "山河崩るるの折、[rmtm_loyal_notable.GetFirstName]は詔に応じて朝に留まり、旧き号のまま旗下に在り続ける。旧き恩義はなお結ばれている。"
 rmtm_loyalty_summary_defector_only:0 "山河崩るるの折、[rmtm_defector_notable.GetFirstName]は朝を去りて立つ。隔意、野心、兵の勢いが、ついに旧き尊王の誓いを圧した。"
 rmtm_loyalty_summary_acknowledge:0 "河山を復するは誰の手か、行いをもって示させよう。"
