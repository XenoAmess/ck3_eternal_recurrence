l_japanese:
 rule_rmtm_hegemon_fate:0 "中華覇権の行く末"
 setting_rmtm_reclaim_the_motherland:0 "山河を取り戻す"
 setting_rmtm_reclaim_the_motherland_desc:0 "中華覇権が群雄割拠の時代に入ると、旧覇権者は天命と中華覇権を失うが、所領、他の称号、尊王派の直属封臣を保持し、空法理の「後＋元の朝号」覇権のもとで国祚を継承する。"
 setting_rmtm_vanilla_shattering:0 "群雄割拠（原版）"
 setting_rmtm_vanilla_shattering_desc:0 "中華覇権の支配者と封臣は、原版の群雄割拠ルールに従う。"
 rmtm_claim_restoration_decision:0 "復辟を宣言する"
 rmtm_claim_restoration_decision_desc:0 "旧き国は分かたれたが、その残り火はまだ消えていない。天命を主張するのに必要な割合と同じだけ中華の領土を奪還し、中華覇権を復興して、後朝に定められた終わりを迎えさせよ。"
 rmtm_claim_restoration_decision_tooltip:0 "原版の「天命を主張する」の全効果で中華覇権を復興し、その後、自らが保持するすべての後朝覇権を破棄する。"
 rmtm_claim_restoration_decision_confirm:0 "山河を復す"
 rmtm_restoration_title_prefix:0 "後"
 rmtm_restoration_hegemony_fallback_name:0 "後朝"
 rmtm_restoration_hegemony_fallback_name_adj:0 "後朝の"
 rmtm_claim_mandate_blocked_by_restoration_tt:0 "後朝の覇権を持つ支配者は新たな天命を主張できず、代わりに復辟を宣言しなければならない。"
 dynastic_cycle_entered_chaos_hunagdi_tt:0 "天子は退位して天命を失い、天下は分裂する。"
