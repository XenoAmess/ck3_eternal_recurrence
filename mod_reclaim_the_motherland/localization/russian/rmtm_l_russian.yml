l_russian:
 rule_rmtm_hegemon_fate:0 "Судьба гегемона Китая"
 setting_rmtm_reclaim_the_motherland:0 "Вернуть родные земли"
 setting_rmtm_reclaim_the_motherland_desc:0 "Когда гегемония Китая вступает в Эпоху военачальников, прежний гегемон утрачивает Мандат Неба и гегемонию Китая, но сохраняет все лично принадлежащие ему земли и прочие титулы. Прямые вассалы — сторонники гегемона решают, остаться ли им, по правилу «Выбор сторонников гегемона», а остальные расходятся в смуте. Не имеющая земель де-юре гегемония Поздней династии продолжает династическую линию."
 setting_rmtm_vanilla_shattering:0 "Обычная раздробленность"
 setting_rmtm_vanilla_shattering_desc:0 "Гегемон Китая и его вассалы следуют исходным правилам Эпохи военачальников."
 rule_rmtm_pro_hegemon_choice:0 "Выбор сторонников гегемона"
 setting_rmtm_divided_hearts:0 "Разделённые сердца"
 setting_rmtm_divided_hearts_desc:0 "С началом Эпохи военачальников прямые вассалы — сторонники гегемона пересматривают свою верность, учитывая личные узы, характер, вражду и военную мощь. Открытые враги отпадают, самые стойкие остаются, а остальные избирают собственный путь."
 setting_rmtm_unwavering_loyalty:0 "Непоколебимая верность"
 setting_rmtm_unwavering_loyalty_desc:0 "Все прямые вассалы — сторонники гегемона остаются при прежнем императоре; это сохраняет поведение версии 0.1.1 мода Вернуть родные земли."
 rmtm_claim_restoration_decision:0 "Провозгласить реставрацию"
 rmtm_claim_restoration_decision_desc:0 "Царство раздроблено, но его искры ещё не угасли. Верните достаточно земель Китая, чтобы предстать перед Небом, а затем провозгласите восстановление старой династии."
 rmtm_claim_restoration_decision_tooltip:0 "Объявите, что держава выстояла и Мандат Неба вернулся. Имя Поздней династии будет предано покою, когда восстановление завершится."
 rmtm_claim_restoration_decision_confirm:0 "Восстановить державу"
 rmtm_restoration_title_prefix:0 "Поздняя "
 rmtm_restoration_hegemony_fallback_name:0 "Поздняя династия"
 rmtm_restoration_hegemony_fallback_name_adj:0 "Поздней династии"
 rmtm_claim_mandate_blocked_by_restoration_tt:0 "Династия всё ещё жива и не нуждается в новом Мандате. Верните старое царство и провозгласите его восстановление."
 rmtm_loyalty_summary_title:0 "Куда склоняется верность"
 rmtm_loyalty_summary_both:0 "Когда держава распадается, [rmtm_loyal_notable.GetTitledFirstName] является на призыв и сохраняет прежний титул под вашим знаменем. [rmtm_defector_notable.GetTitledFirstName], взвесив прежний долг и нынешнюю силу, покидает двор и вступает в борьбу за державу."
 rmtm_loyalty_summary_loyal_only:0 "Когда держава распадается, [rmtm_loyal_notable.GetTitledFirstName] является на призыв и сохраняет прежний титул под вашим знаменем. Пока старые узы милости и долга ещё держатся."
 rmtm_loyalty_summary_defector_only:0 "Когда держава распадается, [rmtm_defector_notable.GetTitledFirstName] покидает двор. Вражда, честолюбие и военная мощь перевесили прежнюю клятву верности."
 rmtm_loyalty_summary_acknowledge:0 "Пусть дела покажут, кто сможет восстановить державу."
