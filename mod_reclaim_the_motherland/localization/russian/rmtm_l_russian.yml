l_russian:
 rule_rmtm_hegemon_fate:0 "Судьба гегемона Китая"
 setting_rmtm_reclaim_the_motherland:0 "Вернуть родные земли"
 setting_rmtm_reclaim_the_motherland_desc:0 "Когда гегемония Китая вступает в Эпоху военачальников, прежний гегемон утрачивает Мандат Неба и гегемонию Китая, но сохраняет все лично принадлежащие ему земли и прочие титулы. Прямые вассалы — сторонники гегемона остаются верны, а остальные расходятся в смуте. Не имеющая земель де-юре гегемония Поздней династии продолжает династическую линию."
 setting_rmtm_vanilla_shattering:0 "Обычная раздробленность"
 setting_rmtm_vanilla_shattering_desc:0 "Гегемон Китая и его вассалы следуют исходным правилам Эпохи военачальников."
 rmtm_claim_restoration_decision:0 "Провозгласить реставрацию"
 rmtm_claim_restoration_decision_desc:0 "Царство раздроблено, но его искры ещё не угасли. Верните достаточно земель Китая, чтобы предстать перед Небом, а затем провозгласите восстановление старой династии."
 rmtm_claim_restoration_decision_tooltip:0 "Объявите, что держава выстояла и Мандат Неба вернулся. Имя Поздней династии будет предано покою, когда восстановление завершится."
 rmtm_claim_restoration_decision_confirm:0 "Восстановить державу"
 rmtm_restoration_title_prefix:0 "Поздняя "
 rmtm_restoration_hegemony_fallback_name:0 "Поздняя династия"
 rmtm_restoration_hegemony_fallback_name_adj:0 "Поздней династии"
 rmtm_claim_mandate_blocked_by_restoration_tt:0 "Династия всё ещё жива и не нуждается в новом Мандате. Верните старое царство и провозгласите его восстановление."
