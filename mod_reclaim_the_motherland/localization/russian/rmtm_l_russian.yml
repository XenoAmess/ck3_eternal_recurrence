l_russian:
 rule_rmtm_hegemon_fate:0 "Судьба гегемона Китая"
 setting_rmtm_reclaim_the_motherland:0 "Вернуть родные земли"
 setting_rmtm_reclaim_the_motherland_desc:0 "Когда гегемония Китая вступает в Эпоху военачальников, прежний гегемон утрачивает Мандат Неба и гегемонию Китая, но сохраняет свои земли, прочие титулы и прямых вассалов — сторонников гегемона под властью не имеющей земель де-юре гегемонии Поздней династии."
 setting_rmtm_vanilla_shattering:0 "Обычная раздробленность"
 setting_rmtm_vanilla_shattering_desc:0 "Гегемон Китая и его вассалы следуют исходным правилам Эпохи военачальников."
 rmtm_claim_restoration_decision:0 "Провозгласить реставрацию"
 rmtm_claim_restoration_decision_desc:0 "Старое царство расколото, но его угли ещё не остыли. Верните ту же долю Китая, что требуется для притязания на Мандат, восстановите гегемонию Китая и доведите Позднюю династию до предначертанного конца."
 rmtm_claim_restoration_decision_tooltip:0 "Восстановите гегемонию Китая со всеми эффектами исходного решения «Притязание на Мандат», а затем уничтожьте все удерживаемые вами гегемонии Поздней династии."
 rmtm_claim_restoration_decision_confirm:0 "Восстановить державу"
 rmtm_restoration_title_prefix:0 "Поздняя "
 rmtm_restoration_hegemony_fallback_name:0 "Поздняя династия"
 rmtm_restoration_hegemony_fallback_name_adj:0 "Поздней династии"
 rmtm_claim_mandate_blocked_by_restoration_tt:0 "Правитель, владеющий гегемонией Поздней династии, не может притязать на новый Мандат и должен вместо этого провозгласить реставрацию."
