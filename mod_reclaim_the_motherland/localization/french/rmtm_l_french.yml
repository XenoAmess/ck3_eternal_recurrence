l_french:
 rule_rmtm_hegemon_fate:0 "Destin de l'hégémon chinois"
 setting_rmtm_reclaim_the_motherland:0 "Reconquérir la patrie"
 setting_rmtm_reclaim_the_motherland_desc:0 "Lorsque l'hégémonie chinoise entre dans l'ère des seigneurs de la guerre, l'ancien hégémon perd le Mandat du Ciel et l'hégémonie chinoise, mais conserve tous ses domaines personnels et ses autres titres. Ses vassaux directs favorables à l'hégémon décident de leur sort selon le Choix des seigneurs pro-hégémon, tandis que les autres se dispersent dans la tourmente. Une hégémonie de Dynastie postérieure sans territoire de jure perpétue la lignée."
 setting_rmtm_vanilla_shattering:0 "Fragmentation d'origine"
 setting_rmtm_vanilla_shattering_desc:0 "L'hégémon chinois et ses vassaux suivent les règles d'origine de l'ère des seigneurs de la guerre."
 rule_rmtm_pro_hegemon_choice:0 "Le choix des loyalistes"
 setting_rmtm_divided_hearts:0 "Cœurs divisés"
 setting_rmtm_divided_hearts_desc:0 "Lorsque l'ère des seigneurs de la guerre commence, les vassaux directs favorables à l'hégémon reconsidèrent leur allégeance selon leurs liens, leur caractère, leur hostilité et leur puissance militaire. Les ennemis déclarés font défection, les plus fermes demeurent, et les autres peuvent suivre leur propre voie."
 setting_rmtm_unwavering_loyalty:0 "Loyauté inébranlable"
 setting_rmtm_unwavering_loyalty_desc:0 "Tous les vassaux directs favorables à l'hégémon restent auprès de l'ancien empereur, conservant le comportement de Reconquérir la patrie 0.1.1."
 rmtm_claim_restoration_decision:0 "Proclamer la Restauration"
 rmtm_claim_restoration_decision_desc:0 "Le royaume est divisé, mais ses braises perdurent. Reprenez suffisamment de terres en Chine pour vous présenter devant le Ciel, puis proclamez la restauration de l'ancienne dynastie."
 rmtm_claim_restoration_decision_tooltip:0 "Annoncez que le royaume perdure et que le Mandat du Ciel est revenu. Le nom de la Dynastie postérieure sera mis au repos lorsque la restauration sera achevée."
 rmtm_claim_restoration_decision_confirm:0 "Restaurer le royaume"
 rmtm_restoration_title_prefix:0 "Postérieure "
 rmtm_restoration_hegemony_fallback_name:0 "Dynastie postérieure"
 rmtm_restoration_hegemony_fallback_name_adj:0 "de la Dynastie postérieure"
 rmtm_claim_mandate_blocked_by_restoration_tt:0 "La dynastie perdure encore ; elle n'a nul besoin d'un nouveau Mandat du Ciel. Reprenez l'ancien royaume et proclamez sa restauration."
 rmtm_loyalty_summary_title:0 "Là où va l'allégeance"
 rmtm_loyalty_summary_both:0 "Alors que le royaume se disloque, [rmtm_loyal_notable.GetFirstName] répond à l'appel et conserve son ancien titre sous votre bannière. [rmtm_defector_notable.GetFirstName], après avoir pesé les anciens devoirs face à la force du présent, abandonne la cour et dispute le royaume."
 rmtm_loyalty_summary_loyal_only:0 "Alors que le royaume se disloque, [rmtm_loyal_notable.GetFirstName] répond à l'appel et conserve son ancien titre sous votre bannière. Pour l'heure, les anciens liens de grâce et de devoir tiennent encore."
 rmtm_loyalty_summary_defector_only:0 "Alors que le royaume se disloque, [rmtm_defector_notable.GetFirstName] abandonne la cour. L'hostilité, l'ambition et le poids des armes ont eu raison de son ancienne profession de loyauté."
 rmtm_loyalty_summary_acknowledge:0 "Que les actes révèlent qui peut restaurer le royaume."
