l_french:
 rule_rmtm_hegemon_fate:0 "Destin de l'hégémon chinois"
 setting_rmtm_reclaim_the_motherland:0 "Reconquérir la patrie"
 setting_rmtm_reclaim_the_motherland_desc:0 "Lorsque l'hégémonie chinoise entre dans l'ère des seigneurs de la guerre, l'ancien hégémon perd le Mandat du Ciel et l'hégémonie chinoise, mais conserve ses terres, ses autres titres et ses vassaux directs favorables à l'hégémon sous une hégémonie de Dynastie postérieure sans territoire de jure."
 setting_rmtm_vanilla_shattering:0 "Fragmentation d'origine"
 setting_rmtm_vanilla_shattering_desc:0 "L'hégémon chinois et ses vassaux suivent les règles d'origine de l'ère des seigneurs de la guerre."
 rmtm_claim_restoration_decision:0 "Proclamer la Restauration"
 rmtm_claim_restoration_decision_desc:0 "L'ancien royaume est divisé, mais ses braises ne sont pas éteintes. Récupérez la même part de la Chine que celle requise pour revendiquer le Mandat, restaurez l'hégémonie chinoise et menez la Dynastie postérieure à son terme."
 rmtm_claim_restoration_decision_tooltip:0 "Restaurez l'hégémonie chinoise avec tous les effets de la décision d'origine Revendiquer le Mandat, puis détruisez toutes les hégémonies de Dynastie postérieure que vous détenez."
 rmtm_claim_restoration_decision_confirm:0 "Restaurer le royaume"
 rmtm_restoration_title_prefix:0 "Postérieure "
 rmtm_restoration_hegemony_fallback_name:0 "Dynastie postérieure"
 rmtm_restoration_hegemony_fallback_name_adj:0 "de la Dynastie postérieure"
 rmtm_claim_mandate_blocked_by_restoration_tt:0 "Un dirigeant qui détient une hégémonie de Dynastie postérieure ne peut revendiquer un nouveau Mandat et doit proclamer une restauration."
