l_spanish:
 rule_rmtm_hegemon_fate:0 "Destino del hegemón chino"
 setting_rmtm_reclaim_the_motherland:0 "Recuperar la patria"
 setting_rmtm_reclaim_the_motherland_desc:0 "Cuando la Hegemonía china entra en la Era de los Señores de la Guerra, el antiguo hegemón pierde el Mandato del Cielo y la Hegemonía china, pero conserva sus tierras, otros títulos y vasallos directos favorables al hegemón bajo una hegemonía de la Dinastía Posterior sin tierras de iure."
 setting_rmtm_vanilla_shattering:0 "Fragmentación original"
 setting_rmtm_vanilla_shattering_desc:0 "El hegemón chino y sus vasallos siguen las reglas originales de la Era de los Señores de la Guerra."
 rmtm_claim_restoration_decision:0 "Proclamar la Restauración"
 rmtm_claim_restoration_decision_desc:0 "El antiguo reino está dividido, pero sus brasas aún no se han apagado. Recupera la misma proporción de China necesaria para reclamar el Mandato, restaura la Hegemonía china y lleva a la Dinastía Posterior a su fin señalado."
 rmtm_claim_restoration_decision_tooltip:0 "Restaura la Hegemonía china con todos los efectos de la decisión original Reclamar el Mandato y, a continuación, destruye todas las hegemonías de la Dinastía Posterior que poseas."
 rmtm_claim_restoration_decision_confirm:0 "Restaurar el reino"
 rmtm_restoration_title_prefix:0 "Posterior "
 rmtm_restoration_hegemony_fallback_name:0 "Dinastía Posterior"
 rmtm_restoration_hegemony_fallback_name_adj:0 "de la Dinastía Posterior"
 rmtm_claim_mandate_blocked_by_restoration_tt:0 "Un gobernante que posee una hegemonía de la Dinastía Posterior no puede reclamar un nuevo Mandato y debe proclamar una restauración."
 dynastic_cycle_entered_chaos_hunagdi_tt:0 "El emperador abdica y pierde el Mandato, y Todo Bajo el Cielo se fragmenta."
