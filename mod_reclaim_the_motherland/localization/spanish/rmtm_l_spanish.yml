l_spanish:
 rule_rmtm_hegemon_fate:0 "Destino del hegemón chino"
 setting_rmtm_reclaim_the_motherland:0 "Recuperar la patria"
 setting_rmtm_reclaim_the_motherland_desc:0 "Cuando la Hegemonía china entra en la Era de los Señores de la Guerra, el antiguo hegemón pierde el Mandato del Cielo y la Hegemonía china, pero conserva todos sus dominios personales y sus demás títulos. Los vasallos directos favorables al hegemón deciden si permanecen según la Elección de los señores prohegemón, mientras los demás se dispersan en la agitación. Una hegemonía de la Dinastía Posterior sin tierras de iure mantiene la línea dinástica."
 setting_rmtm_vanilla_shattering:0 "Fragmentación original"
 setting_rmtm_vanilla_shattering_desc:0 "El hegemón chino y sus vasallos siguen las reglas originales de la Era de los Señores de la Guerra."
 rule_rmtm_pro_hegemon_choice:0 "La elección de los lealistas"
 setting_rmtm_divided_hearts:0 "Corazones divididos"
 setting_rmtm_divided_hearts_desc:0 "Cuando comienza la Era de los Señores de la Guerra, los vasallos directos favorables al hegemón reconsideran su lealtad según sus lazos, su carácter, sus enemistades y su poder militar. Los enemigos declarados desertan, los más firmes permanecen y los demás eligen su propio camino."
 setting_rmtm_unwavering_loyalty:0 "Lealtad inquebrantable"
 setting_rmtm_unwavering_loyalty_desc:0 "Todos los vasallos directos favorables al hegemón permanecen junto al antiguo emperador, conservando el comportamiento de Recuperar la patria 0.1.1."
 rmtm_claim_restoration_decision:0 "Proclamar la Restauración"
 rmtm_claim_restoration_decision_desc:0 "El reino está dividido, mas sus brasas aún perduran. Reconquista suficiente parte de China para presentarte ante el Cielo y proclama restaurada la antigua dinastía."
 rmtm_claim_restoration_decision_tooltip:0 "Anuncia que el reino perdura y que el Mandato del Cielo ha regresado. El nombre de la Dinastía Posterior quedará sellado cuando la restauración culmine."
 rmtm_claim_restoration_decision_confirm:0 "Restaurar el reino"
 rmtm_restoration_title_prefix:0 "Posterior "
 rmtm_restoration_hegemony_fallback_name:0 "Dinastía Posterior"
 rmtm_restoration_hegemony_fallback_name_adj:0 "de la Dinastía Posterior"
 rmtm_claim_mandate_blocked_by_restoration_tt:0 "La dinastía aún perdura; no necesita un nuevo Mandato. Reconquista el antiguo reino y proclama su restauración."
 rmtm_loyalty_summary_title:0 "Dónde reside la lealtad"
 rmtm_loyalty_summary_both:0 "Mientras el reino se fragmenta, [rmtm_loyal_notable.GetFirstName] acude al llamado y conserva el antiguo título bajo tu estandarte. [rmtm_defector_notable.GetFirstName], tras sopesar las antiguas obligaciones frente al poder presente, abandona la corte y contiende por el reino."
 rmtm_loyalty_summary_loyal_only:0 "Mientras el reino se fragmenta, [rmtm_loyal_notable.GetFirstName] acude al llamado y conserva el antiguo título bajo tu estandarte. Por ahora, los viejos lazos de gracia y deber se mantienen."
 rmtm_loyalty_summary_defector_only:0 "Mientras el reino se fragmenta, [rmtm_defector_notable.GetFirstName] abandona la corte. La hostilidad, la ambición y el poder de las armas han vencido su antigua profesión de lealtad."
 rmtm_loyalty_summary_acknowledge:0 "Que los hechos demuestren quién puede restaurar el reino."
