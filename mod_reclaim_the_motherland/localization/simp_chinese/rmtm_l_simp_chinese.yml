 rule_rmtm_hegemon_fate:0 "中华霸权统治者的命运"
 setting_rmtm_reclaim_the_motherland:0 "重整河山"
 setting_rmtm_reclaim_the_motherland_desc:0 "中华霸权进入群雄割据时，旧天子失去天命与中华霸权，却仍保有亲自持有的领地和其他头衔；尊王派直属封臣继续奉其为主，余众在乱世中各自离散。新立一个不承中华法理的“后＋原朝号”霸权，以续国祚。"
 setting_rmtm_vanilla_shattering:0 "群雄割据（原版）"
 setting_rmtm_vanilla_shattering_desc:0 "中华霸权统治者及其封臣完全按照原版群雄割据规则运转。"
 rmtm_claim_restoration_decision:0 "宣称复辟"
 rmtm_claim_restoration_decision_desc:0 "故国虽裂，余烬未熄。若能重据足以问鼎的中华疆土，便可告庙祭天，重光旧朝。"
 rmtm_claim_restoration_decision_tooltip:0 "昭告天下：故国已复，天命重归。后朝之号将随复辟功成而封存。"
 rmtm_claim_restoration_decision_confirm:0 "复我河山"
 rmtm_restoration_title_prefix:0 "后"
 rmtm_restoration_hegemony_fallback_name:0 "后朝"
 rmtm_restoration_hegemony_fallback_name_adj:0 "后朝"
 rmtm_claim_mandate_blocked_by_restoration_tt:0 "国祚未绝，何须另受新命？收复故土，宣告复辟。"
