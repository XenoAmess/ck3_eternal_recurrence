l_english:
 rule_rmtm_hegemon_fate:0 "Fate of the Chinese Hegemon"
 setting_rmtm_reclaim_the_motherland:0 "Reclaim the Motherland"
 setting_rmtm_reclaim_the_motherland_desc:0 "When the Chinese Hegemony enters the Age of Warlords, the former hegemon loses the Mandate and the Chinese Hegemony but keeps every personally held domain and other title. Direct Pro-Hegemon vassals remain loyal while the rest scatter in the upheaval, and a Later Dynasty hegemony with no de-jure lands carries on the dynastic line."
 setting_rmtm_vanilla_shattering:0 "Vanilla Shattering"
 setting_rmtm_vanilla_shattering_desc:0 "The Chinese Hegemon and their vassals follow the original Age of Warlords rules."
 rule_rmtm_pro_hegemon_choice:0 "The Choice of the Loyalists"
 setting_rmtm_divided_hearts:0 "Divided Hearts"
 setting_rmtm_divided_hearts_desc:0 "When the Age of Warlords begins, direct Pro-Hegemon vassals reconsider their allegiance according to bonds, character, hostility, and military power. Open enemies defect, the most steadfast remain, and all others may choose their own course."
 setting_rmtm_unwavering_loyalty:0 "Unwavering Loyalty"
 setting_rmtm_unwavering_loyalty_desc:0 "Every direct Pro-Hegemon vassal remains with the old emperor, preserving the behavior of Reclaim the Motherland 0.1.1."
 rmtm_claim_restoration_decision:0 "Proclaim the Restoration"
 rmtm_claim_restoration_decision_desc:0 "The realm lies divided, yet its embers endure. Reclaim enough of China to stand before Heaven, then proclaim the old dynasty restored."
 rmtm_claim_restoration_decision_tooltip:0 "Announce that the realm endures and the Mandate has returned. The Later Dynasty name will be laid to rest when the restoration is complete."
 rmtm_claim_restoration_decision_confirm:0 "Restore the realm"
 rmtm_restoration_title_prefix:0 "Later "
 rmtm_restoration_hegemony_fallback_name:0 "Later Dynasty"
 rmtm_restoration_hegemony_fallback_name_adj:0 "Later Dynastic"
 rmtm_claim_mandate_blocked_by_restoration_tt:0 "The dynasty yet endures; it has no need of a new Mandate. Reclaim the old realm and proclaim its restoration."
 rmtm_loyalty_summary_title:0 "Where Allegiance Lies"
 rmtm_loyalty_summary_both:0 "As the realm breaks apart, [rmtm_loyal_notable.GetTitledFirstName] answers the summons and keeps the old title beneath your banner. [rmtm_defector_notable.GetTitledFirstName], having weighed old obligations against present strength, casts off the court and contends for the realm."
 rmtm_loyalty_summary_loyal_only:0 "As the realm breaks apart, [rmtm_loyal_notable.GetTitledFirstName] answers the summons and keeps the old title beneath your banner. For now, the old bonds of grace and duty hold."
 rmtm_loyalty_summary_defector_only:0 "As the realm breaks apart, [rmtm_defector_notable.GetTitledFirstName] casts off the court. Hostility, ambition, and the weight of arms have overcome the old profession of loyalty."
 rmtm_loyalty_summary_acknowledge:0 "Let deeds reveal who can restore the realm."
