l_english:
 rule_rmtm_hegemon_fate:0 "Fate of the Chinese Hegemon"
 setting_rmtm_reclaim_the_motherland:0 "Reclaim the Motherland"
 setting_rmtm_reclaim_the_motherland_desc:0 "When the Chinese Hegemony enters the Age of Warlords, the former hegemon loses the Mandate and the Chinese Hegemony but keeps every personally held domain and other title. Direct Pro-Hegemon vassals remain loyal while the rest scatter in the upheaval, and a Later Dynasty hegemony with no de-jure lands carries on the dynastic line."
 setting_rmtm_vanilla_shattering:0 "Vanilla Shattering"
 setting_rmtm_vanilla_shattering_desc:0 "The Chinese Hegemon and their vassals follow the original Age of Warlords rules."
 rmtm_claim_restoration_decision:0 "Proclaim the Restoration"
 rmtm_claim_restoration_decision_desc:0 "The realm lies divided, yet its embers endure. Reclaim enough of China to stand before Heaven, then proclaim the old dynasty restored."
 rmtm_claim_restoration_decision_tooltip:0 "Announce that the realm endures and the Mandate has returned. The Later Dynasty name will be laid to rest when the restoration is complete."
 rmtm_claim_restoration_decision_confirm:0 "Restore the realm"
 rmtm_restoration_title_prefix:0 "Later "
 rmtm_restoration_hegemony_fallback_name:0 "Later Dynasty"
 rmtm_restoration_hegemony_fallback_name_adj:0 "Later Dynastic"
 rmtm_claim_mandate_blocked_by_restoration_tt:0 "The dynasty yet endures; it has no need of a new Mandate. Reclaim the old realm and proclaim its restoration."
