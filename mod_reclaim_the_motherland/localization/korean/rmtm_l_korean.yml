l_korean:
 rule_rmtm_hegemon_fate:0 "중화 패권자의 운명"
 setting_rmtm_reclaim_the_motherland:0 "강산을 되찾다"
 setting_rmtm_reclaim_the_motherland_desc:0 "중화 패권이 군웅할거 시대에 들어서면, 옛 패권자는 천명과 중화 패권을 잃지만 영지, 다른 작위, 직속 존왕파 봉신은 유지하며 빈 규범 권역의 ‘후＋옛 왕조명’ 패권으로 국통을 이어 간다."
 setting_rmtm_vanilla_shattering:0 "군웅할거(원본)"
 setting_rmtm_vanilla_shattering_desc:0 "중화 패권자와 그 봉신들은 원본 군웅할거 규칙을 그대로 따른다."
 rmtm_claim_restoration_decision:0 "복벽을 선포하다"
 rmtm_claim_restoration_decision_desc:0 "옛 나라는 갈라졌지만 그 불씨는 아직 식지 않았다. 천명을 주장하는 데 필요한 것과 같은 비율의 중화 영토를 수복하고, 중화 패권을 회복하여 후조가 예정된 끝을 맞이하게 하라."
 rmtm_claim_restoration_decision_tooltip:0 "원본 ‘천명 주장’ 결정의 모든 효과로 중화 패권을 회복한 뒤, 자신이 보유한 모든 후조 패권을 파기한다."
 rmtm_claim_restoration_decision_confirm:0 "강산을 회복하라"
 rmtm_restoration_title_prefix:0 "후"
 rmtm_restoration_hegemony_fallback_name:0 "후조"
 rmtm_restoration_hegemony_fallback_name_adj:0 "후조의"
 rmtm_claim_mandate_blocked_by_restoration_tt:0 "후조 패권을 보유한 통치자는 새로운 천명을 주장할 수 없으며, 대신 복벽을 선포해야 한다."
 dynastic_cycle_entered_chaos_hunagdi_tt:0 "천자가 물러나 천명을 잃고, 천하가 분열된다."
