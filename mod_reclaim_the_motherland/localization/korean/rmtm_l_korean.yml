l_korean:
 rule_rmtm_hegemon_fate:0 "중화 패권자의 운명"
 setting_rmtm_reclaim_the_motherland:0 "강산을 되찾다"
 setting_rmtm_reclaim_the_motherland_desc:0 "중화 패권이 군웅할거 시대에 접어들면 옛 천자는 천명과 중화 패권을 잃지만, 본인이 직접 보유한 영지와 다른 작위는 모두 유지합니다. 직속 존왕파 봉신은 ‘존왕 제후의 선택’ 규칙에 따라 거취를 정하고 나머지 제후들은 난세 속에서 흩어집니다. 법리 영토가 없는 ‘후＋원래 왕조명’ 패권을 새로 세워 왕통을 이어갑니다."
 setting_rmtm_vanilla_shattering:0 "군웅할거(원본)"
 setting_rmtm_vanilla_shattering_desc:0 "중화 패권자와 그 봉신들은 원본 군웅할거 규칙을 그대로 따른다."
 rule_rmtm_pro_hegemon_choice:0 "존왕파 제후의 선택"
 setting_rmtm_divided_hearts:0 "흩어진 민심"
 setting_rmtm_divided_hearts_desc:0 "군웅할거가 시작되면 존왕파 직속 봉신들은 유대, 성품, 적대 관계와 군사력을 따져 충성을 다시 정합니다. 공공연한 적은 이탈하고 가장 굳건한 충신은 남으며, 나머지는 저마다 거취를 정합니다."
 setting_rmtm_unwavering_loyalty:0 "변함없는 충성"
 setting_rmtm_unwavering_loyalty_desc:0 "모든 존왕파 직속 봉신이 옛 천자 곁에 남아, ‘강산을 되찾다’ 0.1.1의 동작을 유지합니다."
 rmtm_claim_restoration_decision:0 "복벽을 선포하다"
 rmtm_claim_restoration_decision_desc:0 "천하는 갈라졌으나 불씨는 꺼지지 않았다. 중원의 땅을 천하를 다툴 만큼 되찾았다면 종묘와 하늘에 고하고 옛 왕조의 부흥을 선포하라."
 rmtm_claim_restoration_decision_tooltip:0 "천하에 고하노라. 옛 나라가 되살아 천명이 돌아왔다. 후조의 이름은 복벽이 이루어지는 날 봉해질 것이다."
 rmtm_claim_restoration_decision_confirm:0 "강산을 회복하라"
 rmtm_restoration_title_prefix:0 "후"
 rmtm_restoration_hegemony_fallback_name:0 "후조"
 rmtm_restoration_hegemony_fallback_name_adj:0 "후조의"
 rmtm_claim_mandate_blocked_by_restoration_tt:0 "왕조의 명맥이 끊기지 않았거늘 어찌 새 천명을 받겠는가? 옛 강토를 되찾고 복벽을 선포하라."
 rmtm_loyalty_summary_title:0 "민심의 향방"
 rmtm_loyalty_summary_both:0 "강산이 무너지는 순간, [rmtm_loyal_notable.GetFirstName]은 황명에 응해 조정에 남고 옛 칭호 그대로 그대의 깃발 아래 영지를 지킵니다. [rmtm_defector_notable.GetFirstName]은 옛 의리와 오늘의 병세를 저울질한 끝에 조정을 떠나 천하를 다툽니다."
 rmtm_loyalty_summary_loyal_only:0 "강산이 무너지는 순간, [rmtm_loyal_notable.GetFirstName]은 황명에 응해 조정에 남고 옛 칭호 그대로 그대의 깃발 아래 영지를 지킵니다. 옛 은의와 의무는 아직 굳건합니다."
 rmtm_loyalty_summary_defector_only:0 "강산이 무너지는 순간, [rmtm_defector_notable.GetFirstName]은 조정을 떠나 자립합니다. 적의와 야심, 군사력이 옛 존왕의 명분을 압도했습니다."
 rmtm_loyalty_summary_acknowledge:0 "누가 강산을 되찾을지는 행동으로 드러날 것이다."
