l_polish:
 rule_rmtm_hegemon_fate:0 "Los chińskiego hegemona"
 setting_rmtm_reclaim_the_motherland:0 "Odzyskać ojczyste ziemie"
 setting_rmtm_reclaim_the_motherland_desc:0 "Gdy hegemonia chińska wkracza w Erę Władców Wojennych, dawny hegemon traci Mandat Niebios i hegemonię chińską, lecz zachowuje swe ziemie, inne tytuły oraz bezpośrednich wasali popierających hegemona pod władzą pozbawionej ziem de iure hegemonii Późniejszej Dynastii."
 setting_rmtm_vanilla_shattering:0 "Pierwotne rozbicie"
 setting_rmtm_vanilla_shattering_desc:0 "Chiński hegemon i jego wasale podlegają pierwotnym zasadom Ery Władców Wojennych."
 rmtm_claim_restoration_decision:0 "Proklamować restaurację"
 rmtm_claim_restoration_decision_desc:0 "Dawne państwo jest podzielone, lecz jego żar jeszcze nie zgasł. Odzyskaj taką samą część Chin, jakiej wymaga zdobycie Mandatu, przywróć hegemonię chińską i doprowadź Późniejszą Dynastię do przeznaczonego kresu."
 rmtm_claim_restoration_decision_tooltip:0 "Przywróć hegemonię chińską ze wszystkimi efektami pierwotnej decyzji Zdobycie Mandatu, a następnie zniszcz wszystkie posiadane hegemonie Późniejszej Dynastii."
 rmtm_claim_restoration_decision_confirm:0 "Przywrócić państwo"
 rmtm_restoration_title_prefix:0 "Późniejsza "
 rmtm_restoration_hegemony_fallback_name:0 "Późniejsza Dynastia"
 rmtm_restoration_hegemony_fallback_name_adj:0 "Późniejszej Dynastii"
 rmtm_claim_mandate_blocked_by_restoration_tt:0 "Władca dzierżący hegemonię Późniejszej Dynastii nie może zdobyć nowego Mandatu i musi zamiast tego proklamować restaurację."
