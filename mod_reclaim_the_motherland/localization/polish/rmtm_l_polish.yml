l_polish:
 rule_rmtm_hegemon_fate:0 "Los chińskiego hegemona"
 setting_rmtm_reclaim_the_motherland:0 "Odzyskać ojczyste ziemie"
 setting_rmtm_reclaim_the_motherland_desc:0 "Gdy hegemonia chińska wkracza w Erę Władców Wojennych, dawny hegemon traci Mandat Niebios i hegemonię chińską, lecz zachowuje wszystkie osobiście posiadane domeny i inne tytuły. Bezpośredni wasale popierający hegemona decydują o pozostaniu zgodnie z Wyborem stronników hegemona, podczas gdy pozostali rozpraszają się w zamęcie. Pozbawiona ziem de iure hegemonia Późniejszej Dynastii podtrzymuje linię dynastyczną."
 setting_rmtm_vanilla_shattering:0 "Pierwotne rozbicie"
 setting_rmtm_vanilla_shattering_desc:0 "Chiński hegemon i jego wasale podlegają pierwotnym zasadom Ery Władców Wojennych."
 rule_rmtm_pro_hegemon_choice:0 "Wybór lojalistów"
 setting_rmtm_divided_hearts:0 "Podzielone serca"
 setting_rmtm_divided_hearts_desc:0 "Gdy rozpoczyna się Era Władców Wojennych, bezpośredni wasale popierający hegemona ponownie rozważają swoją lojalność, kierując się więziami, charakterem, wrogością i potęgą militarną. Jawni wrogowie odchodzą, najwierniejsi zostają, a pozostali obierają własną drogę."
 setting_rmtm_unwavering_loyalty:0 "Niezachwiana lojalność"
 setting_rmtm_unwavering_loyalty_desc:0 "Wszyscy bezpośredni wasale popierający hegemona pozostają przy dawnym cesarzu, zachowując zasady wersji 0.1.1 moda Odzyskać ojczyste ziemie."
 rmtm_claim_restoration_decision:0 "Proklamować restaurację"
 rmtm_claim_restoration_decision_desc:0 "Królestwo leży podzielone, lecz jego żar jeszcze nie wygasł. Odzyskaj dość ziem Chin, by stanąć przed Niebem, a następnie ogłoś odrodzenie dawnej dynastii."
 rmtm_claim_restoration_decision_tooltip:0 "Ogłoś, że państwo przetrwało, a Mandat Niebios powrócił. Miano Późniejszej Dynastii zostanie złożone, gdy restauracja się dokona."
 rmtm_claim_restoration_decision_confirm:0 "Przywrócić państwo"
 rmtm_restoration_title_prefix:0 "Późniejsza "
 rmtm_restoration_hegemony_fallback_name:0 "Późniejsza Dynastia"
 rmtm_restoration_hegemony_fallback_name_adj:0 "Późniejszej Dynastii"
 rmtm_claim_mandate_blocked_by_restoration_tt:0 "Dynastia wciąż trwa; nie potrzebuje nowego Mandatu. Odzyskaj stare królestwo i ogłoś jego odrodzenie."
 rmtm_loyalty_summary_title:0 "Dokąd zwraca się lojalność"
 rmtm_loyalty_summary_both:0 "Gdy państwo się rozpada, [rmtm_loyal_notable.GetTitledFirstName] odpowiada na wezwanie i zachowuje dawny tytuł pod twoim sztandarem. [rmtm_defector_notable.GetTitledFirstName], rozważywszy dawny obowiązek i obecną siłę, porzuca dwór i przystępuje do walki o państwo."
 rmtm_loyalty_summary_loyal_only:0 "Gdy państwo się rozpada, [rmtm_loyal_notable.GetTitledFirstName] odpowiada na wezwanie i zachowuje dawny tytuł pod twoim sztandarem. Na razie dawne więzi łaski i obowiązku trwają."
 rmtm_loyalty_summary_defector_only:0 "Gdy państwo się rozpada, [rmtm_defector_notable.GetTitledFirstName] porzuca dwór. Wrogość, ambicja i siła oręża przeważyły nad dawnym wyznaniem lojalności."
 rmtm_loyalty_summary_acknowledge:0 "Niech czyny pokażą, kto zdoła odbudować państwo."
