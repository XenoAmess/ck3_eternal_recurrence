l_polish:
 rule_rmtm_hegemon_fate:0 "Los chińskiego hegemona"
 setting_rmtm_reclaim_the_motherland:0 "Odzyskać ojczyste ziemie"
 setting_rmtm_reclaim_the_motherland_desc:0 "Gdy hegemonia chińska wkracza w Erę Władców Wojennych, dawny hegemon traci Mandat Niebios i hegemonię chińską, lecz zachowuje wszystkie osobiście posiadane domeny i inne tytuły. Bezpośredni wasale popierający hegemona pozostają lojalni, podczas gdy pozostali rozpraszają się w zamęcie. Pozbawiona ziem de iure hegemonia Późniejszej Dynastii podtrzymuje linię dynastyczną."
 setting_rmtm_vanilla_shattering:0 "Pierwotne rozbicie"
 setting_rmtm_vanilla_shattering_desc:0 "Chiński hegemon i jego wasale podlegają pierwotnym zasadom Ery Władców Wojennych."
 rmtm_claim_restoration_decision:0 "Proklamować restaurację"
 rmtm_claim_restoration_decision_desc:0 "Królestwo leży podzielone, lecz jego żar jeszcze nie wygasł. Odzyskaj dość ziem Chin, by stanąć przed Niebem, a następnie ogłoś odrodzenie dawnej dynastii."
 rmtm_claim_restoration_decision_tooltip:0 "Ogłoś, że państwo przetrwało, a Mandat Niebios powrócił. Miano Późniejszej Dynastii zostanie złożone, gdy restauracja się dokona."
 rmtm_claim_restoration_decision_confirm:0 "Przywrócić państwo"
 rmtm_restoration_title_prefix:0 "Późniejsza "
 rmtm_restoration_hegemony_fallback_name:0 "Późniejsza Dynastia"
 rmtm_restoration_hegemony_fallback_name_adj:0 "Późniejszej Dynastii"
 rmtm_claim_mandate_blocked_by_restoration_tt:0 "Dynastia wciąż trwa; nie potrzebuje nowego Mandatu. Odzyskaj stare królestwo i ogłoś jego odrodzenie."
