name: Dynastic Esotericism Static

on:
  push:
    branches: [master]
    paths:
      - 'mod_dynastic_esotericism/**'
      - 'java/ck3-save-core/**'
      - 'tools/ck3_mod_acceptance_prepare.py'
      - 'tools/ck3_mod_acceptance.py'
      - 'tools/ck3_mod_acceptance_background_types.py'
      - 'tools/test_product_acceptance_purpose.py'
      - 'tools/ck3_mod_acceptance_allocate.py'
      - 'tools/ck3_mod_acceptance_client.py'
      - 'tools/test_ck3_mod_acceptance_failed_resource_closure.py'
      - 'tools/test_ck3_mod_acceptance_split_public_closure.py'
      - 'ck3_autonomous_player/src/xar_autoplayer/bridge/normal_exit_*.py'
      - 'ck3_autonomous_player/tests/unit/test_normal_exit_*.py'
      - 'tools/test_preserved_failure_native_os0.py'
      - 'tools/fixtures/ck3_R0001_preserved_failure_native_os0.json'
      - 'tools/fixtures/ck3_R0020_case_client_failure_native_cleanup.json'
      - 'tools/ck3_mod_acceptance_unrun.py'
      - 'tools/ck3_mod_acceptance_launcher_protocol_v1.py'
      - 'tools/test_ck3_mod_acceptance_offline_ttl_unrun.py'
      - 'tools/fixtures/ck3_R0002_pre_intent_offline_ttl.json'
      - 'ck3_autonomous_player/src/xar_autoplayer/vanilla_events/records_faith_creation1021_12004.py'
      - 'ck3_autonomous_player/tests/unit/test_faith_creation1021_12004.py'
      - 'ck3_autonomous_player/tests/unit/test_vanilla_event_migration_12004.py'
      - 'ck3_autonomous_player/native_bridge/research/run_ck3_12002_mcp_live.py'
      - 'tools/ck3_mod_acceptance_products.json'
      - 'tools/ck3_mod_acceptance_build_runtime.py'
      - 'tools/ck3_mod_acceptance_saved_profile_v2.py'
      - 'tools/ck3_mod_acceptance_cases/dynastic_esotericism*.json'
      - 'tools/ck3_mod_acceptance_cases/generic_product_adapter.py'
      - 'tools/test_prebuilt_fixture_prepare.py'
      - 'tools/test_canonical_host_successor.py'
      - 'ck3_workshop_mcp/src/ck3_workshop_mcp/compatibility_tags.py'
      - 'java/ck3-control/build-tools/src/main/java/org/xar/ck3/control/build/CiBootstrap.java'
      - 'java/ck3-control/ci-profile.json'
      - 'docs/storage-retention-policy.json'
      - '.github/workflows/dynastic-esotericism-static.yml'
  pull_request:
    paths:
      - 'mod_dynastic_esotericism/**'
      - 'java/ck3-save-core/**'
      - 'tools/ck3_mod_acceptance_prepare.py'
      - 'tools/ck3_mod_acceptance.py'
      - 'tools/ck3_mod_acceptance_background_types.py'
      - 'tools/test_product_acceptance_purpose.py'
      - 'tools/ck3_mod_acceptance_allocate.py'
      - 'tools/ck3_mod_acceptance_client.py'
      - 'tools/test_ck3_mod_acceptance_failed_resource_closure.py'
      - 'tools/test_ck3_mod_acceptance_split_public_closure.py'
      - 'ck3_autonomous_player/src/xar_autoplayer/bridge/normal_exit_*.py'
      - 'ck3_autonomous_player/tests/unit/test_normal_exit_*.py'
      - 'tools/test_preserved_failure_native_os0.py'
      - 'tools/fixtures/ck3_R0001_preserved_failure_native_os0.json'
      - 'tools/fixtures/ck3_R0020_case_client_failure_native_cleanup.json'
      - 'tools/ck3_mod_acceptance_unrun.py'
      - 'tools/ck3_mod_acceptance_launcher_protocol_v1.py'
      - 'tools/test_ck3_mod_acceptance_offline_ttl_unrun.py'
      - 'tools/fixtures/ck3_R0002_pre_intent_offline_ttl.json'
      - 'ck3_autonomous_player/src/xar_autoplayer/vanilla_events/records_faith_creation1021_12004.py'
      - 'ck3_autonomous_player/tests/unit/test_faith_creation1021_12004.py'
      - 'ck3_autonomous_player/tests/unit/test_vanilla_event_migration_12004.py'
      - 'ck3_autonomous_player/native_bridge/research/run_ck3_12002_mcp_live.py'
      - 'tools/ck3_mod_acceptance_products.json'
      - 'tools/ck3_mod_acceptance_build_runtime.py'
      - 'tools/ck3_mod_acceptance_saved_profile_v2.py'
      - 'tools/ck3_mod_acceptance_cases/dynastic_esotericism*.json'
      - 'tools/ck3_mod_acceptance_cases/generic_product_adapter.py'
      - 'tools/test_prebuilt_fixture_prepare.py'
      - 'tools/test_canonical_host_successor.py'
      - 'ck3_workshop_mcp/src/ck3_workshop_mcp/compatibility_tags.py'
      - 'java/ck3-control/build-tools/src/main/java/org/xar/ck3/control/build/CiBootstrap.java'
      - 'java/ck3-control/ci-profile.json'
      - 'docs/storage-retention-policy.json'
      - '.github/workflows/dynastic-esotericism-static.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      PYTHONPATH: ${{ github.workspace }}/ck3_autonomous_player/src
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Ensure the default Maven in its existing installation
        run: java -Xms32m -Xmx128m -Djava.io.tmpdir="%RUNNER_TEMP%" java/ck3-control/build-tools/src/main/java/org/xar/ck3/control/build/CiBootstrap.java --ensure-default-maven-only --repo-root "%GITHUB_WORKSPACE%" --work-root "%RUNNER_TEMP%\dynastic-esotericism-maven" --python-executable "%pythonLocation%\python.exe" --system-growth-reserve-bytes 2147483648 --max-project-bytes 8589934592
      - name: Read back the actual default Maven observations
        run: java -Xms32m -Xmx128m -Djava.io.tmpdir="%RUNNER_TEMP%" java/ck3-control/build-tools/src/main/java/org/xar/ck3/control/build/CiBootstrap.java --verify-maven-evidence-root "%RUNNER_TEMP%\dynastic-esotericism-maven"
      - name: Observe default Maven
        run: mvn --version
      - name: Install the shared SDK and strict type-check dependencies
        run: python -m pip install mcp==2.0.0 pydantic==2.13.5 mypy==2.4.0 psutil==7.2.2 types-psutil==7.2.2.20260906 opencv-python==5.0.0.93 numpy==2.5.2 Pillow==12.3.0
      - name: Verify and install the exact shared save leaf
        run: |
          set "MAVEN_OPTS=%MAVEN_OPTS% -Dorg.slf4j.simpleLogger.log.org.eclipse.aether.internal.impl.DefaultLocalRepositoryProvider=debug -Dorg.slf4j.simpleLogger.showLogName=true"
          if not exist "%RUNNER_TEMP%\des-save-resolver-diagnostic" mkdir "%RUNNER_TEMP%\des-save-resolver-diagnostic"
          call mvn --batch-mode --no-transfer-progress -f java/ck3-save-core/pom.xml -Dsave.build.root="%RUNNER_TEMP%/ck3-save-core-build" install > "%RUNNER_TEMP%\des-save-resolver-diagnostic\leaf.stdout.log" 2> "%RUNNER_TEMP%\des-save-resolver-diagnostic\leaf.stderr.log"
          set "resolver_exit=%ERRORLEVEL%"
          type "%RUNNER_TEMP%\des-save-resolver-diagnostic\leaf.stdout.log"
          type "%RUNNER_TEMP%\des-save-resolver-diagnostic\leaf.stderr.log" 1>&2
          exit /b %resolver_exit%
      - name: Bind Quarkus TEST to the actual installed leaf repository
        # BootstrapMavenContext.resolveLocalRepo reads QUARKUS_LOCAL_REPO first.
        # Use only this successful leaf process observed LRM/install targets.
        if: success()
        shell: python {0}
        run: |
          from datetime import datetime, timezone
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys

          root = Path(os.environ['RUNNER_TEMP']) / 'des-save-resolver-diagnostic'
          repositories: set[Path] = set()
          targets: set[Path] = set()
          logs = []
          ansi = re.compile(r'\x1b\[[0-?]*[ -/]*[@-~]')
          for stream in ('stdout', 'stderr'):
              path = root / ('leaf.' + stream + '.log')
              with path.open('rb') as handle:
                  raw = handle.read(2 * 1024**2 + 1)
              if len(raw) > 2 * 1024**2:
                  raise RuntimeError('Leaf repository observations exceed the bounded log read')
              logs.append({'path': str(path), 'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()})
              for line in raw.decode('utf-8', errors='strict').splitlines():
                  line = ansi.sub('', line)
                  match = re.search(r'Using manager .+? for (.+)$', line)
                  if match:
                      repositories.add(Path(match.group(1)).resolve())
                  match = re.search(r'Installing .+ to (.+ck3-save-core-0\.1\.0\.(?:jar|pom))$', line)
                  if match:
                      targets.add(Path(match.group(1)).resolve())
          if len(repositories) != 1:
              raise RuntimeError('Successful leaf must expose one actual Maven local repository; no guessed fallback')
          repository = next(iter(repositories))
          gav = repository / 'org/xar/ck3/ck3-save-core/0.1.0'
          expected = {gav / ('ck3-save-core-0.1.0.' + extension) for extension in ('jar', 'pom')}
          if not repository.is_absolute() or targets != expected:
              raise RuntimeError('Actual leaf install jar/pom targets conflict with its observed Maven repository')
          files = []
          for path in sorted(expected):
              with path.open('rb') as handle:
                  raw = handle.read(1024**2 + 1)
              if not raw or len(raw) > 1024**2:
                  raise RuntimeError('Actual installed leaf jar/pom is unreadable or exceeds the selected GAV bound')
              files.append({'path': str(path), 'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()})
          machine = subprocess.run([sys.executable, '-B', 'tools/ck3_live_run_id.py', 'machine'],
                                   capture_output=True, text=True, check=True).stdout.strip()
          receipt = {'schema': 'ck3-quarkus-observed-maven-repository-binding-v1',
                     'machine_id': machine, 'observed_at_utc': datetime.now(timezone.utc).isoformat(),
                     'source_commit': os.environ['GITHUB_SHA'], 'repository': str(repository),
                     'leaf_original_success_required_by_step_order': True, 'leaf_logs': logs,
                     'actual_installed_leaf': files, 'environment_field': 'QUARKUS_LOCAL_REPO',
                     'scope': 'Bind the following product Quarkus bootstrap to this job actual Maven install repository. No repository copy, new cache or resolver-policy change.'}
          with (root / 'repository-binding.actual.json').open('x', encoding='utf-8') as handle:
              json.dump(receipt, handle, indent=2)
              handle.write('\n')
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8', newline='\n') as handle:
              handle.write('QUARKUS_LOCAL_REPO=' + str(repository) + '\n')
          print(json.dumps(receipt))
      - name: Compile and verify the actual product builder and fixture producer
        # The Java source composer tests consume the actual SDK normal-exit chain.
        run: |
          set "MAVEN_OPTS=%MAVEN_OPTS% -Dorg.slf4j.simpleLogger.log.org.eclipse.aether.internal.impl.DefaultLocalRepositoryProvider=debug -Dorg.slf4j.simpleLogger.showLogName=true"
          if not exist "%RUNNER_TEMP%\des-save-resolver-diagnostic" mkdir "%RUNNER_TEMP%\des-save-resolver-diagnostic"
          call mvn --batch-mode --no-transfer-progress -f mod_dynastic_esotericism/tools/pom.xml -Ddes.build.root=${{ runner.temp }}/dynastic-esotericism-build verify > "%RUNNER_TEMP%\des-save-resolver-diagnostic\product.stdout.log" 2> "%RUNNER_TEMP%\des-save-resolver-diagnostic\product.stderr.log"
          set "resolver_exit=%ERRORLEVEL%"
          type "%RUNNER_TEMP%\des-save-resolver-diagnostic\product.stdout.log"
          type "%RUNNER_TEMP%\des-save-resolver-diagnostic\product.stderr.log" 1>&2
          exit /b %resolver_exit%
      - name: Observe bounded shared save GAV and actual local-repository managers
        if: always()
        shell: python {0}
        run: |
          from datetime import datetime, timezone
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys

          root = Path(os.environ['RUNNER_TEMP']) / 'des-save-resolver-diagnostic'
          root.mkdir(parents=True, exist_ok=True)
          machine = subprocess.run([sys.executable, '-B', 'tools/ck3_live_run_id.py', 'machine'],
                                   capture_output=True, text=True, check=False)
          report = {'schema': 'ck3-quarkus-local-repository-diagnostic-v1',
                    'machine_id': machine.stdout.strip() if machine.returncode == 0 else 'unknown',
                    'machine_observation_returncode': machine.returncode,
                    'observed_at_utc': datetime.now(timezone.utc).isoformat(),
                    'source_commit': os.environ['GITHUB_SHA'], 'diagnostic_only': True,
                    'resolver_configuration_changed': bool(os.environ.get('QUARKUS_LOCAL_REPO'))}
          logs = []
          managers = []
          installs = []
          gav_directories: set[Path] = set()
          gav = Path('org/xar/ck3/ck3-save-core/0.1.0')
          ansi = re.compile(r'\x1b\[[0-?]*[ -/]*[@-~]')
          for phase in ('leaf', 'product'):
              for stream in ('stdout', 'stderr'):
                  path = root / (phase + '.' + stream + '.log')
                  if not path.is_file():
                      logs.append({'path': str(path), 'state': 'NOT_OBSERVED'})
                      continue
                  size = path.stat().st_size
                  with path.open('rb') as handle:
                      raw = handle.read(2 * 1024**2)
                  logs.append({'path': str(path), 'bytes': size, 'read_bytes': len(raw),
                               'truncated': size > len(raw),
                               'sha256': hashlib.sha256(raw).hexdigest() if size == len(raw) else None})
                  after_test_marker = False
                  for line in raw.decode('utf-8', errors='replace').splitlines():
                      line = ansi.sub('', line)
                      if '--- quarkus:' in line and ':generate-code-tests ' in line:
                          after_test_marker = True
                      match = re.search(r'Using manager (.+?) for (.+)$', line)
                      if match:
                          manager, repository = match.groups()
                          if len(repository) <= 1024 and len(manager) <= 512:
                              row = {'phase': phase, 'stream': stream,
                                     'after_generate_code_tests_marker': after_test_marker,
                                     'manager_and_classloader': manager, 'repository': repository}
                              if row not in managers and len(managers) < 24:
                                  managers.append(row)
                                  if len(gav_directories) < 8:
                                      gav_directories.add(Path(repository) / gav)
                      match = re.search(r'Installing .+ to (.+ck3-save-core-0\.1\.0\.(?:jar|pom))$', line)
                      if match and len(match.group(1)) <= 1024:
                          target = Path(match.group(1))
                          row = {'phase': phase, 'stream': stream, 'installed_target': str(target)}
                          if row not in installs and len(installs) < 8:
                              installs.append(row)
                              if len(gav_directories) < 8:
                                  gav_directories.add(target.parent)
          override = os.environ.get('QUARKUS_LOCAL_REPO')
          test_repositories = {Path(row['repository']).resolve() for row in managers
                               if row['phase'] == 'product' and row['after_generate_code_tests_marker']}
          report.update(quarkus_local_repo_override=override,
                        test_repository_matches_explicit_binding=(
                            None if override is None or not test_repositories else
                            test_repositories == {Path(override).resolve()}))
          report.update(logs=logs, local_repository_manager_observations=managers,
                        install_target_observations=installs,
                        product_test_phase_manager_observed=any(
                            row['phase'] == 'product' and row['after_generate_code_tests_marker']
                            for row in managers))
          directories = []
          remaining_text_bytes = 16 * 1024
          for directory in sorted(gav_directories):
              row = {'path': str(directory), 'exists': directory.is_dir(), 'files': []}
              files = row['files']
              for name in ('ck3-save-core-0.1.0.jar', 'ck3-save-core-0.1.0.pom',
                           '_remote.repositories', 'ck3-save-core-0.1.0.jar.lastUpdated',
                           'ck3-save-core-0.1.0.pom.lastUpdated', 'maven-metadata-local.xml'):
                  path = directory / name
                  if not path.is_file():
                      files.append({'name': name, 'exists': False})
                      continue
                  size = path.stat().st_size
                  item = {'name': name, 'exists': True, 'bytes': size, 'sha256': None}
                  with path.open('rb') as handle:
                      raw = handle.read(1024**2 + 1)
                  if size == len(raw) and len(raw) <= 1024**2:
                      item['sha256'] = hashlib.sha256(raw).hexdigest()
                  if name not in ('ck3-save-core-0.1.0.jar', 'ck3-save-core-0.1.0.pom'):
                      limit = min(4096, remaining_text_bytes)
                      text = raw[:limit]
                      remaining_text_bytes -= len(text)
                      item.update(text=text.decode('utf-8', errors='replace'),
                                  text_truncated=size > len(text))
                  files.append(item)
              directories.append(row)
          bound = None if override is None else (Path(override) / gav).resolve()
          observed = [row for row in directories if Path(row['path']).resolve() == bound]
          report['bound_gav_readable'] = (None if bound is None else any(
              row['exists'] and all(any(item['name'] == name and item.get('sha256') is not None
                  for item in row['files']) for name in ('ck3-save-core-0.1.0.jar', 'ck3-save-core-0.1.0.pom'))
              for row in observed))
          report.update(gav_directories=directories,
                        scope='Only GAV paths derived from actual LRM/install logs; no recursive local-repository scan. Missing TEST observations remain unknown; null/absent data is not a successful resolution.')
          encoded = (json.dumps(report, ensure_ascii=False, indent=2) + '\n').encode('utf-8')
          if len(encoded) > 64 * 1024:
              for directory in directories:
                  for item in directory['files']:
                      if 'text' in item:
                          del item['text']
                          item['text_omitted_for_report_limit'] = True
              report['report_text_omitted_for_64KiB_limit'] = True
              encoded = (json.dumps(report, ensure_ascii=False, indent=2) + '\n').encode('utf-8')
          if len(encoded) > 64 * 1024:
              raise RuntimeError('Bounded GAV diagnostic metadata exceeds 64KiB; no report was written')
          destination = root / 'gav-readback.actual.json'
          with destination.open('xb') as handle:
              handle.write(encoded)
          print(encoded.decode('utf-8'), end='')
      - name: Verify the shared prebuilt fixture consumer
        run: python -B -X utf8 tools/test_prebuilt_fixture_prepare.py
      - name: Verify the canonical host producer and actual SDK factory
        run: python -B -X utf8 tools/test_canonical_host_successor.py
      - name: Verify the explicit product-purpose producer and actual host clock
        run: python -B -X utf8 tools/test_product_acceptance_purpose.py
      - name: Verify preserved OS0 and failed case-client native cleanup resource closure
        run: python -B -X utf8 tools/test_preserved_failure_native_os0.py
      - name: Verify pre-intent offline TTL refusal resource closure and exact modified scope types
        run: python -B -X utf8 tools/test_ck3_mod_acceptance_offline_ttl_unrun.py
      - name: Strict types for the complete new regression modules
        env:
          MYPYPATH: tools;ck3_autonomous_player/src
        run: python -B -X utf8 -m mypy --strict --strict-equality --follow-imports=silent --no-incremental --cache-dir=${{ runner.temp }}/dynastic-esotericism-mypy tools/test_prebuilt_fixture_prepare.py tools/test_canonical_host_successor.py tools/test_product_acceptance_purpose.py tools/test_preserved_failure_native_os0.py tools/test_ck3_mod_acceptance_offline_ttl_unrun.py tools/ck3_mod_acceptance_launcher_protocol_v1.py tools/ck3_mod_acceptance_background_types.py
      - name: Verify complete stock event knowledge and migration modules without skips
        run: python -B -X utf8 -c "import sys,unittest; names=['ck3_autonomous_player.tests.unit.test_faith_creation1021_12004','ck3_autonomous_player.tests.unit.test_vanilla_event_migration_12004']; suites=[unittest.defaultTestLoader.loadTestsFromName(name) for name in names]; counts=[suite.countTestCases() for suite in suites]; suite=unittest.TestSuite(suites); result=unittest.TextTestRunner(verbosity=2).run(suite); sys.exit(0 if all(count>0 for count in counts) and result.testsRun==sum(counts) and result.wasSuccessful() and not result.skipped else 1)"
      - name: Strict types for the complete stock event migration regression and faith record
        env:
          MYPYPATH: tools;ck3_autonomous_player/src
        run: python -B -X utf8 -m mypy --strict --strict-equality --follow-imports=skip --no-incremental --cache-dir=nul ck3_autonomous_player/tests/unit/test_vanilla_event_migration_12004.py ck3_autonomous_player/src/xar_autoplayer/vanilla_events/records_faith_creation1021_12004.py
      - name: Preserve default Maven observations and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynastic-esotericism-static-evidence
          path: |
            ${{ runner.temp }}/ck3-save-core-build/surefire-reports/
            ${{ runner.temp }}/dynastic-esotericism-maven/logs/
            ${{ runner.temp }}/dynastic-esotericism-build/dynastic-esotericism-tools/surefire-reports/
            ${{ runner.temp }}/des-save-resolver-diagnostic/
