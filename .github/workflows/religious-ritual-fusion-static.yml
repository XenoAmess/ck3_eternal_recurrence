name: Religious Ritual Fusion Static

on:
  push:
    branches: [master]
    paths:
      - 'mod_religious_ritual_fusion/**'
      - 'java/ck3-save-core/**'
      - 'mod_dynastic_esotericism/common/on_action/des_on_actions.txt'
      - 'mod_dynastic_esotericism/common/scripted_effects/des_initialization_effects.txt'
      - 'mod_dynastic_esotericism/common/scripted_effects/des_maintenance_effects.txt'
      - 'tools/ck3_mod_acceptance.py'
      - 'tools/ck3_mod_acceptance_prepare.py'
      - 'tools/ck3_mod_acceptance_cases/generic_product_adapter.py'
      - 'tools/ck3_mod_acceptance_cases/religious_ritual_fusion_core.json'
      - 'tools/test_compatibility_mod_profiles.py'
      - 'tools/test_prebuilt_fixture_prepare.py'
      - 'tools/test_religious_ritual_fusion_prebuilt.py'
      - '.github/workflows/religious-ritual-fusion-static.yml'
      - 'java/ck3-control/build-tools/src/main/java/org/xar/ck3/control/build/CiBootstrap.java'
  pull_request:
    paths:
      - 'mod_religious_ritual_fusion/**'
      - 'java/ck3-save-core/**'
      - 'mod_dynastic_esotericism/common/on_action/des_on_actions.txt'
      - 'mod_dynastic_esotericism/common/scripted_effects/des_initialization_effects.txt'
      - 'mod_dynastic_esotericism/common/scripted_effects/des_maintenance_effects.txt'
      - 'tools/ck3_mod_acceptance.py'
      - 'tools/ck3_mod_acceptance_prepare.py'
      - 'tools/ck3_mod_acceptance_cases/generic_product_adapter.py'
      - 'tools/ck3_mod_acceptance_cases/religious_ritual_fusion_core.json'
      - 'tools/test_compatibility_mod_profiles.py'
      - 'tools/test_prebuilt_fixture_prepare.py'
      - 'tools/test_religious_ritual_fusion_prebuilt.py'
      - '.github/workflows/religious-ritual-fusion-static.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Ensure default Maven in its existing installation
        run: java -Xms32m -Xmx128m -Djava.io.tmpdir="%RUNNER_TEMP%" java/ck3-control/build-tools/src/main/java/org/xar/ck3/control/build/CiBootstrap.java --ensure-default-maven-only --repo-root "%GITHUB_WORKSPACE%" --work-root "%RUNNER_TEMP%\rrf-maven" --python-executable "%pythonLocation%\python.exe" --system-growth-reserve-bytes 2147483648 --max-project-bytes 8589934592
      - name: Verify actual default Maven observations
        run: java -Xms32m -Xmx128m -Djava.io.tmpdir="%RUNNER_TEMP%" java/ck3-control/build-tools/src/main/java/org/xar/ck3/control/build/CiBootstrap.java --verify-maven-evidence-root "%RUNNER_TEMP%\rrf-maven"
      - name: Read default Maven version
        run: mvn --version
      - name: Install the shared consumer and strict type-check dependencies
        run: python -m pip install mcp==2.0.0 pydantic==2.13.5 mypy==2.4.0 psutil==7.2.2 types-psutil==7.2.2.20260906 opencv-python==5.0.0.93 numpy==2.5.2 Pillow==12.3.0
      - name: Verify and install the exact shared save leaf
        run: mvn --batch-mode --no-transfer-progress -f java/ck3-save-core/pom.xml -Dsave.build.root="%RUNNER_TEMP%/ck3-save-core-build" install
      - name: Verify full product producer and staging chain
        run: mvn --batch-mode --no-transfer-progress -f mod_religious_ritual_fusion/tools/pom.xml -Drrf.build.root=${{ runner.temp }}/rrf-build verify
      - name: Verify full shared fixture and independent compatibility profile consumers
        working-directory: tools
        env:
          RRF_FIXTURE_CLI_JAR: ${{ runner.temp }}/rrf-build/quarkus-app/quarkus-run.jar
        run: python -B -X utf8 -m unittest test_religious_ritual_fusion_prebuilt test_prebuilt_fixture_prepare test_compatibility_mod_profiles test_ck3_mod_acceptance_adapters test_saved_campaign_profile_inventory_v2
      - name: Strict-check independent compatibility tests and actual contract AST
        env:
          MYPYPATH: tools;ck3_autonomous_player/src
        # The unittest above also strict-checks the unchanged AST of eight new
        # production contract helpers; legacy orchestration is not claimed clean.
        run: python -B -X utf8 -m mypy --strict --strict-equality --follow-imports=silent --no-incremental --cache-dir=${{ runner.temp }}/rrf-compat-mypy tools/test_compatibility_mod_profiles.py
      - name: Preserve Maven observations and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: religious-ritual-fusion-static-evidence
          path: |
            ${{ runner.temp }}/ck3-save-core-build/surefire-reports/
            ${{ runner.temp }}/rrf-maven/logs/
            ${{ runner.temp }}/rrf-build/**/surefire-reports/
