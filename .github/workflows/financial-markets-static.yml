name: Financial Markets Static

on:
  push:
    branches: [master]
    paths:
      - 'mod_financial_markets/**'
      - 'java/ck3-save-core/**'
      - '.github/workflows/financial-markets-static.yml'
      - 'java/ck3-control/build-tools/src/main/java/org/xar/ck3/control/build/CiBootstrap.java'
  pull_request:
    paths:
      - 'mod_financial_markets/**'
      - 'java/ck3-save-core/**'
      - '.github/workflows/financial-markets-static.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  software:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Ensure qualified default Maven
        run: java -Xms32m -Xmx128m java/ck3-control/build-tools/src/main/java/org/xar/ck3/control/build/CiBootstrap.java --ensure-default-maven-only --repo-root "%GITHUB_WORKSPACE%" --work-root "%RUNNER_TEMP%\xfm-maven" --python-executable "%pythonLocation%\python.exe" --system-growth-reserve-bytes 2147483648 --max-project-bytes 8589934592
      - name: Verify default Maven observations
        run: java -Xms32m -Xmx128m java/ck3-control/build-tools/src/main/java/org/xar/ck3/control/build/CiBootstrap.java --verify-maven-evidence-root "%RUNNER_TEMP%\xfm-maven"
      - name: Bind outer Maven and embedded Quarkus to one local repository
        run: |
          if not exist "%RUNNER_TEMP%\xfm-resolver" mkdir "%RUNNER_TEMP%\xfm-resolver"
          if errorlevel 1 exit /b %ERRORLEVEL%
          set "xfm_native_repo=%USERPROFILE%\.m2\repository"
          echo XFM_MAVEN_LOCAL_REPO=%xfm_native_repo%>>"%GITHUB_ENV%"
          echo QUARKUS_LOCAL_REPO=file:///%xfm_native_repo:\=/%>>"%GITHUB_ENV%"
      - name: Test and install shared save reader
        run: |
          call mvn --batch-mode --no-transfer-progress "-Dmaven.repo.local=%XFM_MAVEN_LOCAL_REPO%" -Dorg.slf4j.simpleLogger.log.org.eclipse.aether.internal.impl.DefaultLocalRepositoryProvider=debug -Dorg.slf4j.simpleLogger.showLogName=true -f java/ck3-save-core/pom.xml install > "%RUNNER_TEMP%\xfm-resolver\shared-install.log" 2>&1
          set "xfm_shared_exit=%ERRORLEVEL%"
          type "%RUNNER_TEMP%\xfm-resolver\shared-install.log"
          exit /b %xfm_shared_exit%
      - name: Inspect the installed shared GAV in the bound repository
        run: |
          echo XFM_MAVEN_LOCAL_REPO=%XFM_MAVEN_LOCAL_REPO%
          echo QUARKUS_LOCAL_REPO=%QUARKUS_LOCAL_REPO%
          if not exist "%XFM_MAVEN_LOCAL_REPO%\org\xar\ck3\ck3-save-core\0.1.0\ck3-save-core-0.1.0.jar" exit /b 1
          if not exist "%XFM_MAVEN_LOCAL_REPO%\org\xar\ck3\ck3-save-core\0.1.0\ck3-save-core-0.1.0.pom" exit /b 1
          certutil -hashfile "%XFM_MAVEN_LOCAL_REPO%\org\xar\ck3\ck3-save-core\0.1.0\ck3-save-core-0.1.0.jar" SHA256
          if errorlevel 1 exit /b %ERRORLEVEL%
          certutil -hashfile "%XFM_MAVEN_LOCAL_REPO%\org\xar\ck3\ck3-save-core\0.1.0\ck3-save-core-0.1.0.pom" SHA256
          if errorlevel 1 exit /b %ERRORLEVEL%
      - name: Test and package development tools
        run: |
          call mvn --batch-mode --no-transfer-progress "-Dmaven.repo.local=%XFM_MAVEN_LOCAL_REPO%" -Dorg.slf4j.simpleLogger.log.org.eclipse.aether.internal.impl.DefaultLocalRepositoryProvider=debug -Dorg.slf4j.simpleLogger.showLogName=true -f mod_financial_markets/tools/pom.xml verify > "%RUNNER_TEMP%\xfm-resolver\financial-verify.log" 2>&1
          set "xfm_financial_exit=%ERRORLEVEL%"
          type "%RUNNER_TEMP%\xfm-resolver\financial-verify.log"
          exit /b %xfm_financial_exit%
      - name: Validate production source
        run: java -jar mod_financial_markets/tools/target/quarkus-app/quarkus-run.jar validate --source mod_financial_markets
      - name: Build allowlisted candidate
        run: java -jar mod_financial_markets/tools/target/quarkus-app/quarkus-run.jar build --source mod_financial_markets --output "%RUNNER_TEMP%\xfm-candidate" --revision %GITHUB_SHA%
      - name: Preserve software test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: financial-markets-software-tests
          path: |
            java/ck3-save-core/target/surefire-reports
            mod_financial_markets/tools/target/surefire-reports
            ${{ runner.temp }}/xfm-maven/logs/
            ${{ runner.temp }}/xfm-resolver/

# No Steam/game execution on hosted runners. Software PASS grants no CK3 acceptance.
