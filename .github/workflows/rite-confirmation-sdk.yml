  push:
    branches: [master]
    paths:
      - 'ck3_autonomous_player/src/xar_autoplayer/bridge/rite_creation_action*.py'
      - 'ck3_autonomous_player/src/xar_autoplayer/bridge/mcp_server.py'
      - 'ck3_autonomous_player/src/xar_autoplayer/bridge/gui_window_tree_contract.py'
      - 'ck3_autonomous_player/src/xar_autoplayer/bridge/native_driver.py'
      - 'ck3_autonomous_player/src/xar_autoplayer/bridge/service.py'
      - 'ck3_autonomous_player/native_bridge/include/xar_bridge/scripted_widget_control12004.hpp'
      - 'ck3_autonomous_player/native_bridge/src/scripted_widget_control12004*.cpp'
      - 'ck3_autonomous_player/native_bridge/tests/scripted_widget_control12004_test.cpp'
      - 'ck3_autonomous_player/native_bridge/CMakeLists.txt'
      - 'ck3_autonomous_player/native_bridge/cmake/religion_ui12004.cmake'
      - 'ck3_autonomous_player/native_bridge/cmake/player_inventory_window12004.cmake'
      - 'ck3_autonomous_player/native_bridge/include/xar_bridge/ingame_ui_navigation_v1.hpp'
      - 'ck3_autonomous_player/native_bridge/include/xar_bridge/title_window12004*.hpp'
      - 'ck3_autonomous_player/native_bridge/src/title_window12004.cpp'
      - 'ck3_autonomous_player/native_bridge/src/ingame_ui_navigation_v1.cpp'
      - 'ck3_autonomous_player/native_bridge/src/faith_power_presentation_request12004.inc'
      - 'ck3_autonomous_player/native_bridge/src/frontend_gui_route_v1.cpp'
      - 'ck3_autonomous_player/native_bridge/tests/ingame_ui_navigation_v1_test.cpp'
      - 'ck3_autonomous_player/native_bridge/tests/title_window12004_test.cpp'
      - 'ck3_autonomous_player/src/xar_autoplayer/bridge/ingame_ui_contract.py'
      - 'ck3_autonomous_player/tests/unit/test_ingame_ui_navigation_v1.py'
      - 'tools/ck3_mod_acceptance_background_types.py'
      - 'ck3_autonomous_player/tests/unit/test_gui_window_tree_root_contract.py'
      - 'ck3_autonomous_player/tests/fixtures/scripted_widget_native_campaign_R0003_snapshot.json'
      - 'ck3_autonomous_player/tests/fixtures/scripted_widget_owner_sampling_R0007.json'
      - 'ck3_autonomous_player/tests/unit/test_rite_creation_action_private_v1.py'
      - 'ck3_autonomous_player/tests/unit/test_mcp_service_override_factory.py'
      - 'tools/ck3_mod_acceptance.py'
      - 'tools/ck3_mod_acceptance_allocate.py'
      - 'tools/test_ck3_mod_acceptance_allocated_normal_exit.py'
      - 'mod_living_artifacts/tools/test_threshold_acceptance_adapter.py'
      - 'ck3_autonomous_player/src/xar_autoplayer/bridge/normal_exit_host_terminal_v1.py'
      - 'ck3_autonomous_player/native_bridge/research/run_ck3_12002_mcp_live.py'
      - 'tools/ck3_mod_acceptance_queue_control.py'
      - 'tools/test_ck3_mod_acceptance_failed_host_normal_exit.py'
      - 'tools/test_ck3_mod_acceptance_queue_control.py'
      - '.github/workflows/rite-confirmation-sdk.yml'
  pull_request:
    paths:
      - 'ck3_autonomous_player/src/xar_autoplayer/bridge/rite_creation_action*.py'
      - 'ck3_autonomous_player/src/xar_autoplayer/bridge/mcp_server.py'
      - 'ck3_autonomous_player/src/xar_autoplayer/bridge/gui_window_tree_contract.py'
      - 'ck3_autonomous_player/src/xar_autoplayer/bridge/native_driver.py'
      - 'ck3_autonomous_player/src/xar_autoplayer/bridge/service.py'
      - 'ck3_autonomous_player/native_bridge/include/xar_bridge/scripted_widget_control12004.hpp'
      - 'ck3_autonomous_player/native_bridge/src/scripted_widget_control12004*.cpp'
      - 'ck3_autonomous_player/native_bridge/tests/scripted_widget_control12004_test.cpp'
      - 'ck3_autonomous_player/native_bridge/CMakeLists.txt'
      - 'ck3_autonomous_player/native_bridge/cmake/religion_ui12004.cmake'
      - 'ck3_autonomous_player/native_bridge/cmake/player_inventory_window12004.cmake'
      - 'ck3_autonomous_player/native_bridge/include/xar_bridge/ingame_ui_navigation_v1.hpp'
      - 'ck3_autonomous_player/native_bridge/include/xar_bridge/title_window12004*.hpp'
      - 'ck3_autonomous_player/native_bridge/src/title_window12004.cpp'
      - 'ck3_autonomous_player/native_bridge/src/ingame_ui_navigation_v1.cpp'
      - 'ck3_autonomous_player/native_bridge/src/faith_power_presentation_request12004.inc'
      - 'ck3_autonomous_player/native_bridge/src/frontend_gui_route_v1.cpp'
      - 'ck3_autonomous_player/native_bridge/tests/ingame_ui_navigation_v1_test.cpp'
      - 'ck3_autonomous_player/native_bridge/tests/title_window12004_test.cpp'
      - 'ck3_autonomous_player/src/xar_autoplayer/bridge/ingame_ui_contract.py'
      - 'ck3_autonomous_player/tests/unit/test_ingame_ui_navigation_v1.py'
      - 'tools/ck3_mod_acceptance_background_types.py'
      - 'ck3_autonomous_player/tests/unit/test_gui_window_tree_root_contract.py'
      - 'ck3_autonomous_player/tests/fixtures/scripted_widget_native_campaign_R0003_snapshot.json'
      - 'ck3_autonomous_player/tests/fixtures/scripted_widget_owner_sampling_R0007.json'
      - 'ck3_autonomous_player/tests/unit/test_rite_creation_action_private_v1.py'
      - 'ck3_autonomous_player/tests/unit/test_mcp_service_override_factory.py'
      - 'tools/ck3_mod_acceptance.py'
      - 'tools/ck3_mod_acceptance_allocate.py'
      - 'tools/test_ck3_mod_acceptance_allocated_normal_exit.py'
      - 'mod_living_artifacts/tools/test_threshold_acceptance_adapter.py'
      - 'ck3_autonomous_player/src/xar_autoplayer/bridge/normal_exit_host_terminal_v1.py'
      - 'ck3_autonomous_player/native_bridge/research/run_ck3_12002_mcp_live.py'
      - 'tools/ck3_mod_acceptance_queue_control.py'
      - 'tools/test_ck3_mod_acceptance_failed_host_normal_exit.py'
      - 'tools/test_ck3_mod_acceptance_queue_control.py'
      - '.github/workflows/rite-confirmation-sdk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: cmd
        working-directory: ck3_autonomous_player
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONPATH: ${{ github.workspace }}/ck3_autonomous_player/src
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Map temporary files to the runner volume
        run: |
          echo TMP=%RUNNER_TEMP%>>"%GITHUB_ENV%"
          if not "%errorlevel%"=="0" exit /b %errorlevel%
          echo TEMP=%RUNNER_TEMP%>>"%GITHUB_ENV%"
          if not "%errorlevel%"=="0" exit /b %errorlevel%
          echo PIP_CACHE_DIR=%RUNNER_TEMP%\rite-confirmation-pip>>"%GITHUB_ENV%"
          if not "%errorlevel%"=="0" exit /b %errorlevel%
      - name: Install transport and type-check dependencies
        # The actual MCP server imports its shared CoA framebuffer module.
        run: python -m pip install mcp==2.0.0 pydantic==2.13.5 mypy==2.4.0 opencv-python==5.0.0.93 numpy==2.5.2 Pillow==12.3.0 psutil==7.2.2
      - name: Check both maintained production modules
        run: python -B -m mypy --strict --follow-imports=skip --no-incremental --cache-dir=${{ runner.temp }}/rite-confirmation-mypy src/xar_autoplayer/bridge/rite_creation_action_private_v1.py src/xar_autoplayer/bridge/rite_creation_action_mcp_v1.py
      - name: Exercise the actual MCP transport and persisted successor chain
        run: python -B -m unittest discover -s tests/unit -p test_rite_creation_action_private_v1.py -v
      - name: Check and exercise the shared service factory boundary
        run: python -B -m unittest discover -s tests/unit -p test_mcp_service_override_factory.py -v
      - name: Build the shared production UI graph and native serializer fixtures
        run: |
          cmake -S native_bridge -B "%RUNNER_TEMP%\scripted-widget-native" -A x64 -DBUILD_TESTING=ON -DXAR_ENABLE_RELIGION_UI12004_PRESENTATION=ON -DXAR_ENABLE_WAR_DECLARED_OVERVIEW_V1=ON -DXAR_CK3_ENABLE_ORDINARY_INTERACTION_PRIVATE_V1=ON -DXAR_CK3_ENABLE_PLAYER_INVENTORY_WINDOW_OPEN_PRIVATE_V1=OFF
          if not "%errorlevel%"=="0" exit /b %errorlevel%
          cmake --build "%RUNNER_TEMP%\scripted-widget-native" --config Release --parallel 2 --target xar_ck3_bridge xar_ck3_12002_runtime xar_ck3_adapter_registry_test xar_ck3_ingame_ui_navigation_v1_test xar_ck3_title_window12004_test xar_ck3_scripted_widget_control12004_test
          if not "%errorlevel%"=="0" exit /b %errorlevel%
          ctest --test-dir "%RUNNER_TEMP%\scripted-widget-native" -C Release --output-on-failure --no-tests=error -R "^(xar_ck3_ingame_ui_navigation_v1_test|xar_ck3_title_window12004_test|xar_ck3_native_bridge_adapter_registry|xar_ck3_12003_frontend_private_capabilities|xar_ck3_scripted_widget_control12004_test|xar_ck3_ordinary_interaction_production_registry_v1)$"
          if not "%errorlevel%"=="0" exit /b %errorlevel%
          "%RUNNER_TEMP%\scripted-widget-native\Release\xar_ck3_ingame_ui_navigation_v1_test.exe" "%RUNNER_TEMP%\title-native-wire"
          if not "%errorlevel%"=="0" exit /b %errorlevel%
      - name: Check Title queries through actual native serialization and every SDK consumer
        run: |
          python -B -m mypy --follow-imports=skip --no-incremental --cache-dir=nul src/xar_autoplayer/bridge/ingame_ui_contract.py src/xar_autoplayer/bridge/mcp_server.py
          if not "%errorlevel%"=="0" exit /b %errorlevel%
          python -B -m mypy --follow-imports=skip --follow-untyped-imports --no-incremental --cache-dir=nul tests/unit/test_ingame_ui_navigation_v1.py ../tools/ck3_mod_acceptance_background_types.py
          if not "%errorlevel%"=="0" exit /b %errorlevel%
          python -B -m unittest discover -s tests/unit -p test_ingame_ui_navigation_v1.py -v
          if not "%errorlevel%"=="0" exit /b %errorlevel%
          python -B tests/unit/test_ingame_ui_navigation_v1.py --title-native-wire "%RUNNER_TEMP%\title-native-wire\title-window-observed.json"
          if not "%errorlevel%"=="0" exit /b %errorlevel%
      - name: Check generic scripted widgets through native serializer, SDK, MCP and host
        run: |
          python -B -m mypy --strict --follow-imports=skip --no-incremental --cache-dir=nul src/xar_autoplayer/bridge/gui_window_tree_contract.py
          if not "%errorlevel%"=="0" exit /b %errorlevel%
          set "XAR_SCRIPTED_WIDGET_NATIVE_TEST_EXE=%RUNNER_TEMP%\scripted-widget-native\Release\xar_ck3_scripted_widget_control12004_test.exe"
          python -B -m unittest discover -s tests/unit -p test_gui_window_tree_root_contract.py -v
          if not "%errorlevel%"=="0" exit /b %errorlevel%
      - name: Check failed-host typed normal-exit transport
        run: |
          python -B -m mypy --strict --follow-imports=silent --no-incremental --cache-dir=nul src/xar_autoplayer/bridge/normal_exit_host_terminal_v1.py ../tools/ck3_mod_acceptance_queue_control.py
          if not "%errorlevel%"=="0" exit /b %errorlevel%
          python -B -X utf8 -m unittest discover -s ../tools -p "test_ck3_mod_acceptance_*normal_exit.py" -v
          if not "%errorlevel%"=="0" exit /b %errorlevel%
          python -B -X utf8 ../tools/test_ck3_mod_acceptance_queue_control.py
          if not "%errorlevel%"=="0" exit /b %errorlevel%
          python -B -X utf8 ../tools/test_ck3_mod_acceptance_queue_inprocess.py
          if not "%errorlevel%"=="0" exit /b %errorlevel%
          python -B -X utf8 ../tools/test_ck3_mod_acceptance_failure_shutdown.py
          if not "%errorlevel%"=="0" exit /b %errorlevel%
          python -B -X utf8 ../tools/test_ck3_mod_acceptance_normal_exit_profile.py
          if not "%errorlevel%"=="0" exit /b %errorlevel%
          python -B -X utf8 ../tools/test_ck3_host_terminal_observation.py
          if not "%errorlevel%"=="0" exit /b %errorlevel%
          python -B -X utf8 ../tools/test_ck3_mod_acceptance_initial_plan_failure_hold.py --host-source native_bridge/research/run_ck3_12002_mcp_live.py
          if not "%errorlevel%"=="0" exit /b %errorlevel%
