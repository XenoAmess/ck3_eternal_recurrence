name: Rite Confirmation SDK Contract

on:
  push:
    branches: [master]
    paths:
      - 'ck3_autonomous_player/src/xar_autoplayer/bridge/rite_creation_action*.py'
      - 'ck3_autonomous_player/tests/unit/test_rite_creation_action_private_v1.py'
      - 'tools/ck3_mod_acceptance.py'
      - '.github/workflows/rite-confirmation-sdk.yml'
  pull_request:
    paths:
      - 'ck3_autonomous_player/src/xar_autoplayer/bridge/rite_creation_action*.py'
      - 'ck3_autonomous_player/tests/unit/test_rite_creation_action_private_v1.py'
      - 'tools/ck3_mod_acceptance.py'
      - '.github/workflows/rite-confirmation-sdk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: cmd
        working-directory: ck3_autonomous_player
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONPATH: ${{ github.workspace }}/ck3_autonomous_player/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Map temporary files to the runner volume
        run: |
          echo TMP=%RUNNER_TEMP%>>"%GITHUB_ENV%"
          if not "%errorlevel%"=="0" exit /b %errorlevel%
          echo TEMP=%RUNNER_TEMP%>>"%GITHUB_ENV%"
          if not "%errorlevel%"=="0" exit /b %errorlevel%
          echo PIP_CACHE_DIR=%RUNNER_TEMP%\rite-confirmation-pip>>"%GITHUB_ENV%"
          if not "%errorlevel%"=="0" exit /b %errorlevel%
      - name: Install transport and type-check dependencies
        # The actual MCP server imports its shared CoA framebuffer module.
        run: python -m pip install mcp==2.0.0 pydantic==2.13.5 mypy==2.4.0 opencv-python==5.0.0.93 numpy==2.5.2 Pillow==12.3.0
      - name: Check both maintained production modules
        run: python -B -m mypy --strict --follow-imports=skip --no-incremental --cache-dir=${{ runner.temp }}/rite-confirmation-mypy src/xar_autoplayer/bridge/rite_creation_action_private_v1.py src/xar_autoplayer/bridge/rite_creation_action_mcp_v1.py
      - name: Exercise the actual MCP transport and persisted successor chain
        run: python -B -m unittest discover -s tests/unit -p test_rite_creation_action_private_v1.py -v
