name: XAR Promo Toolchain Release

on:
  push:
    tags:
      - "xar-promo-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and verify package artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged source
        # Node24 action major; keeps the release path valid after Node20 removal.
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        # Node24 action major; keep this package-only workflow future-proof.
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: xar_promo_toolchain/pyproject.toml

      - name: Install packaging tools
        run: python -m pip install --upgrade build twine

      - name: Verify tag and package metadata
        working-directory: xar_promo_toolchain
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "${REF_TYPE:-}" == "tag" ]]; then
            case "$REF_NAME" in
              xar-promo-v*) tag_version="${REF_NAME#xar-promo-v}" ;;
              *) echo "unexpected release tag: $REF_NAME" >&2; exit 1 ;;
            esac
            [[ "$tag_version" == "$project_version" ]] || {
              echo "tag version $tag_version does not match pyproject version $project_version" >&2
              exit 1
            }
          fi
          printf 'xar-promo-toolchain version: %s\n' "$project_version"

      - name: Run package tests
        working-directory: xar_promo_toolchain
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src/xar_promo
          python -m unittest discover -s tests -v
          python -O -m unittest discover -s tests -v

      - name: Build wheel and source distribution
        working-directory: xar_promo_toolchain
        run: |
          set -euo pipefail
          # SOURCE_DATE_EPOCH gives wheel metadata a stable timestamp tied to
          # the reviewed source revision. The sdist remains a run artifact;
          # setuptools may retain filesystem mtimes in its tar members.
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python -m build --sdist --wheel --outdir dist
          compgen -G 'dist/xar_promo_toolchain-*.whl' > /dev/null
          compgen -G 'dist/xar_promo_toolchain-*.tar.gz' > /dev/null

      - name: Validate source distribution contents
        working-directory: xar_promo_toolchain
        run: |
          set -euo pipefail
          sdist_path="$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          [[ -n "$sdist_path" ]] || { echo 'sdist was not built' >&2; exit 1; }
          python - "$sdist_path" <<'PY'
          import sys
          import tarfile
          from pathlib import PurePosixPath

          archive_path = sys.argv[1]
          with tarfile.open(archive_path, "r:gz") as archive:
              names = [PurePosixPath(name) for name in archive.getnames()]

          roots = {path.parts[0] for path in names if path.parts}
          assert len(roots) == 1, roots
          root = next(iter(roots))
          assert root.startswith("xar_promo_toolchain-"), root
          relative = {path.relative_to(root).as_posix() for path in names if len(path.parts) > 1}
          required = {
              "LICENSE",
              "README.md",
              "pyproject.toml",
              "docs/installation.md",
              "src/xar_promo/__init__.py",
              "src/xar_promo/schemas/install-contract-v1.json",
              "src/xar_promo/schemas/promo-project-config-v1.schema.json",
              "src/xar_promo/schemas/promo-run-manifest-v1.schema.json",
              "src/xar_promo/schemas/phase2-capture-contract-v1.schema.json",
          }
          assert required <= relative, sorted(required - relative)
          forbidden_parts = {".github", "artifacts", "build", "dist", "mod_zhongguo_style"}
          forbidden_suffixes = (".pyc", ".pyo", ".avi", ".mkv", ".mov", ".mp3", ".mp4", ".wav", ".webm")
          for name in relative:
              path = PurePosixPath(name)
              assert ".." not in path.parts, name
              assert not forbidden_parts.intersection(path.parts), name
              assert not name.endswith(forbidden_suffixes), name
          print(f"sdist content contract OK: {len(relative)} entries")
          PY

      - name: Validate distribution metadata
        run: python -m twine check xar_promo_toolchain/dist/*.whl xar_promo_toolchain/dist/*.tar.gz

      - name: Install and smoke-test the wheel
        env:
          VENV_DIR: ${{ runner.temp }}/xar-promo-toolchain-install
        run: |
          set -euo pipefail
          python -m venv "$VENV_DIR"
          wheel_path="$(find xar_promo_toolchain/dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          [[ -n "$wheel_path" ]] || { echo 'wheel was not built' >&2; exit 1; }
          "$VENV_DIR/bin/python" -m pip install --no-index --no-deps "$wheel_path"
          expected_version="$(python -c 'import tomllib; print(tomllib.load(open("xar_promo_toolchain/pyproject.toml", "rb"))["project"]["version"])')"
          [[ "$("$VENV_DIR/bin/xar-promo" --version)" == "xar-promo $expected_version" ]]
          [[ "$("$VENV_DIR/bin/python" -m xar_promo --version)" == "xar-promo $expected_version" ]]
          "$VENV_DIR/bin/python" -m pip check
          "$VENV_DIR/bin/python" -c 'from importlib.resources import files; import json; root=files("xar_promo").joinpath("schemas"); names=("install-contract-v1.json", "promo-project-config-v1.schema.json", "promo-run-manifest-v1.schema.json", "phase2-capture-contract-v1.schema.json"); missing=[name for name in names if not root.joinpath(name).is_file()]; assert not missing, missing; [json.loads(root.joinpath(name).read_text(encoding="utf-8")) for name in names]'
          for command in init start-run validate preserve signoff plan build audit review export; do
            "$VENV_DIR/bin/xar-promo" "$command" --help > /dev/null
          done

      - name: Install and smoke-test the source distribution
        env:
          VENV_DIR: ${{ runner.temp }}/xar-promo-toolchain-sdist-install
        run: |
          set -euo pipefail
          sdist_path="$(find xar_promo_toolchain/dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          [[ -n "$sdist_path" ]] || { echo 'sdist was not built' >&2; exit 1; }
          build_wheelhouse="${RUNNER_TEMP}/xar-promo-toolchain-build-wheelhouse"
          mkdir -p "$build_wheelhouse"
          # Seed the isolated smoke environment from a local backend wheel;
          # the sdist install itself must remain offline and non-isolated.
          python -m pip download --only-binary=:all: --no-deps --dest "$build_wheelhouse" 'setuptools>=77'
          python -m venv "$VENV_DIR"
          "$VENV_DIR/bin/python" -m pip install --no-index --no-deps --find-links "$build_wheelhouse" 'setuptools>=77'
          "$VENV_DIR/bin/python" -m pip install --no-index --no-deps --no-build-isolation "$sdist_path"
          expected_version="$(python -c 'import tomllib; print(tomllib.load(open("xar_promo_toolchain/pyproject.toml", "rb"))["project"]["version"])')"
          [[ "$("$VENV_DIR/bin/xar-promo" --version)" == "xar-promo $expected_version" ]]
          [[ "$("$VENV_DIR/bin/python" -m xar_promo --version)" == "xar-promo $expected_version" ]]
          "$VENV_DIR/bin/python" -m pip check
          "$VENV_DIR/bin/python" -c 'from importlib.resources import files; import json; root=files("xar_promo").joinpath("schemas"); names=("install-contract-v1.json", "promo-project-config-v1.schema.json", "promo-run-manifest-v1.schema.json", "phase2-capture-contract-v1.schema.json"); missing=[name for name in names if not root.joinpath(name).is_file()]; assert not missing, missing; [json.loads(root.joinpath(name).read_text(encoding="utf-8")) for name in names]'
          for command in init start-run validate preserve signoff plan build audit review export; do
            "$VENV_DIR/bin/xar-promo" "$command" --help > /dev/null
          done

      - name: Write artifact checksums
        working-directory: xar_promo_toolchain
        run: |
          set -euo pipefail
          (cd dist && sha256sum xar_promo_toolchain-*.whl xar_promo_toolchain-*.tar.gz > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Upload package release artifact
        # Preserve the checked bytes as a workflow artifact as well as a release asset.
        uses: actions/upload-artifact@v6
        with:
          # run_id/attempt are slash-free and unique across reruns.
          name: xar-promo-toolchain-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            xar_promo_toolchain/dist/xar_promo_toolchain-*.whl
            xar_promo_toolchain/dist/xar_promo_toolchain-*.tar.gz
            xar_promo_toolchain/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#xar-promo-v}"
          assets=(
            xar_promo_toolchain/dist/xar_promo_toolchain-*.whl
            xar_promo_toolchain/dist/xar_promo_toolchain-*.tar.gz
            xar_promo_toolchain/dist/SHA256SUMS
          )
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "XAR Promo Toolchain v${version}" --latest=false
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "XAR Promo Toolchain v${version}" --generate-notes --latest=false
          fi
