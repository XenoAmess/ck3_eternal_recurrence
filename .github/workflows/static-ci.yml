name: Official Runner CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: windows-latest
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: "true"
    # cmd keeps running after failed commands unless each command checks its exit.
    defaults:
      run:
        shell: cmd
    steps:
      - name: Require non-C task workspace and temp
        run: |
          if /I "%GITHUB_WORKSPACE:~0,2%"=="C:" exit /b 1
          if not "%errorlevel%"=="0" exit /b %errorlevel%
          if /I "%RUNNER_TEMP:~0,2%"=="C:" exit /b 1
          if not "%errorlevel%"=="0" exit /b %errorlevel%
          echo TEMP=%RUNNER_TEMP%>>"%GITHUB_ENV%"
          if not "%errorlevel%"=="0" exit /b %errorlevel%
          echo TMP=%RUNNER_TEMP%>>"%GITHUB_ENV%"
          if not "%errorlevel%"=="0" exit /b %errorlevel%
          echo PIP_CACHE_DIR=%RUNNER_TEMP%\pip-cache>>"%GITHUB_ENV%"
          if not "%errorlevel%"=="0" exit /b %errorlevel%
          echo PYTHONPYCACHEPREFIX=%RUNNER_TEMP%\python-bytecode>>"%GITHUB_ENV%"
          if not "%errorlevel%"=="0" exit /b %errorlevel%
          echo XDG_CACHE_HOME=%RUNNER_TEMP%\cache>>"%GITHUB_ENV%"
          if not "%errorlevel%"=="0" exit /b %errorlevel%
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            tools/requirements-static.txt
            tools/requirements-promo-toolchain.txt
      - name: Install task packages outside C
        run: |
          python -m venv "%RUNNER_TEMP%\g2-static-venv"
          if not "%errorlevel%"=="0" exit /b %errorlevel%
          echo %RUNNER_TEMP%\g2-static-venv\Scripts>>"%GITHUB_PATH%"
          if not "%errorlevel%"=="0" exit /b %errorlevel%
      - name: Install static dependencies
        run: python -m pip install -r tools/requirements-static.txt
      - name: Install released promo toolchain
        run: |
          python -m pip install -r tools/requirements-promo-toolchain.txt
          if not "%errorlevel%"=="0" exit /b %errorlevel%
          python -m xar_promo --version
          if not "%errorlevel%"=="0" exit /b %errorlevel%
          python -m xar_promo --help >NUL
          if not "%errorlevel%"=="0" exit /b %errorlevel%
          python tools/test_promo_toolchain_loader.py
          if not "%errorlevel%"=="0" exit /b %errorlevel%
      - name: Compile Python tools
        run: |
          python -m compileall -q tools
          if not "%errorlevel%"=="0" exit /b %errorlevel%
          python -m compileall -q mod_zhongguo_style/tools
          if not "%errorlevel%"=="0" exit /b %errorlevel%
      - name: Test CoA runtime-registry claim boundary
        run: python tools/test_audit_coa_runtime_registry_boundary.py
      - name: Test Steam CK3 version skill without Steam or desktop access
        run: python -B -X utf8 tools/test_steam_ck3_versions.py
      - name: Test native research planning and evidence rendering
        run: python tools/test_native_research_plan.py
      - name: Test protected project EXE broker source without privileged actions
        run: python -B -X utf8 -m unittest discover -s tools/project_exe_broker/tests -p "test_*.py"
      - name: Test offline vanilla event research tools
        run: python -m unittest discover -s tools -p "test_*vanilla_event_research.py"
      - name: Test native verifier evidence scope without CK3
        run: python ck3_autonomous_player/native_bridge/research/test_native_verifier_evidence_scope.py
      - name: Test managed normal-exit profile and terminal host execution without CK3
        run: python -B -X utf8 tools/test_ck3_mod_acceptance_normal_exit_profile.py
      - name: Test failed-attempt resource closure without normal-exit credit
        run: python -B -X utf8 tools/test_ck3_mod_acceptance_failed_resource_closure.py
      - name: Test isolated native army route producer without CK3
        run: python -X utf8 tools/check_native_army_routes_ci.py --build-dir "%RUNNER_TEMP%\native-army-route-ci"
      - name: Test keyed query completion diagnostics without CK3
        run: |
          python -B -X utf8 tools/check_keyed_query_completion_test_source.py
          if not "%errorlevel%"=="0" exit /b %errorlevel%
          python -B -X utf8 tools/run_native_msvc.py --build-dir "%RUNNER_TEMP%\native-decision-completion-ci" --configuration Release --jobs 3 --target xar_ck3_ingame_decision_outcome_contract_v1_test xar_ck3_12004_holy_site_relic_recognition_matrix_test xar_test_county_primary_direct_owner_v2_12004 xar_test_county_primary_owner_12004 --cmake-define BUILD_TESTING=ON --cmake-define XAR_CK3_ENABLE_INGAME_DECISION_OUTCOME_PRIVATE_V1=ON --cmake-define XAR_CK3_ENABLE_INGAME_DECISION_ITEM_ACTIONS_PRIVATE_V1=ON --cmake-define XAR_CK3_ENABLE_INGAME_DECISIONS_OPEN_PRIVATE_V1=ON --cmake-define XAR_CK3_ENABLE_FEUDAL_1066_BOOKMARK_MODEL_PRIVATE_V1=ON --cmake-define XAR_CK3_ENABLE_FEUDAL_1066_SELECTED_BOOKMARK_START_PRIVATE_V1=ON --cmake-define XAR_ENABLE_ACTUAL_COUNTY_PRIMARY_OWNER_12004=ON --configure --build
          if not "%errorlevel%"=="0" exit /b %errorlevel%
          "%RUNNER_TEMP%\native-decision-completion-ci\xar_ck3_ingame_decision_outcome_contract_v1_test.exe"
          if not "%errorlevel%"=="0" exit /b %errorlevel%
          "%RUNNER_TEMP%\native-decision-completion-ci\effect-observation-tests\xar_ck3_12004_holy_site_relic_recognition_matrix_test.exe" "%RUNNER_TEMP%\native-decision-completion-ci\effect-observation-new-packets"
          if not "%errorlevel%"=="0" exit /b %errorlevel%
      - name: Test county direct-owner native wire and strict v1 boundary without CK3
        run: |
          ctest --test-dir "%RUNNER_TEMP%\native-decision-completion-ci" -C Release -R "^xar_test_county_primary_(direct_owner_v2_12004|owner_12004)$" --output-on-failure
          if not "%errorlevel%"=="0" exit /b %errorlevel%
          python -B -O -X utf8 -c "import hashlib,pathlib,subprocess,sys; p=pathlib.Path(r'%RUNNER_TEMP%\native-decision-completion-ci\wire\county-primary-direct-owner-v2\NATIVE-WIRE.json'); b=p.read_bytes(); subprocess.run([sys.executable,'-B','-O','-X','utf8','ck3_autonomous_player/tests/unit/consume_county_primary_direct_owner_native_wire_12004.py','--repo','.','--wire',str(p),'--wire-bytes',str(len(b)),'--wire-sha256',hashlib.sha256(b).hexdigest(),'--output',str(p.with_name('CONSUMED.actual.json'))],check=True)"
          if not "%errorlevel%"=="0" exit /b %errorlevel%
          python -B -O -X utf8 ck3_autonomous_player/tests/unit/test_county_primary_direct_owner_12004.py --repo . --output "%RUNNER_TEMP%\native-decision-completion-ci\wire\county-primary-direct-owner-v2\PYTHON-COMPOUND.actual.json"
          if not "%errorlevel%"=="0" exit /b %errorlevel%
      - name: Retain focused county direct-owner cold wire
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: county-primary-direct-owner-cold-wire
          path: ${{ runner.temp }}/native-decision-completion-ci/wire/county-primary-direct-owner-v2/*.json
          if-no-files-found: ignore
      - name: Test terminal readonly route unavailable and exact strategy lease without CK3
        run: python -B -X utf8 -m unittest discover -s ck3_autonomous_player/tests/unit -p "test_*route*unavailable*.py"
      - name: Test ordinary Sway complete planner integration without CK3
        run: python -B -X utf8 ck3_autonomous_player/tests/unit/test_ordinary_sway_service_v1.py
      - name: Test active Sway observation after an ordinary war query without CK3
        run: python -B -X utf8 ck3_autonomous_player/tests/unit/test_ordinary_sway_quiet_observation_v1.py
      - name: Test actual4 Sway receipt identity and independent instance without CK3
        run: python -B -X utf8 ck3_autonomous_player/tests/unit/test_sway_actual4_start_observation.py
      - name: Test actual natural sentinel boundary contract without CK3
