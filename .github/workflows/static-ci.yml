      - name: Test atomic decision text replacement with a Windows reader without CK3
        run: python -B -X utf8 tools/g2_saved_campaign/test_decision_text_replace_retry.py
      - name: Test unresolved successor event and timeline observations without CK3
        run: python -B -X utf8 ck3_autonomous_player/tests/unit/test_succession_ui_observation_v1.py
      - name: Test closed owner cold evidence projection without CK3
        run: python -B -X utf8 -m unittest discover -s tools -p "test_extract_g2_owner_cold_evidence.py"
      - name: Test strict army route read-status contract
        run: |
          python -X utf8 ck3_autonomous_player/tests/unit/test_army_route_read_status_contract.py
          if not "%errorlevel%"=="0" exit /b %errorlevel%
          python -O -X utf8 ck3_autonomous_player/tests/unit/test_army_route_read_status_contract.py
