name: Living Artifacts cold persistence source checks

on:
  push:
    paths:
      - 'mod_living_artifacts/**'
      - 'tools/ck3_mod_acceptance_saved_profile_v2.py'
      - 'tools/test_saved_campaign_profile_inventory_v2.py'
      - 'ck3_autonomous_player/src/xar_autoplayer/saved_campaign_profile_inventory_v2.py'
      - 'ck3_autonomous_player/native_bridge/research/run_ck3_12002_mcp_live.py'
      - '.github/workflows/living-artifacts-cold-persistence.yml'
  pull_request:
    paths:
      - 'mod_living_artifacts/**'
      - 'tools/ck3_mod_acceptance_saved_profile_v2.py'
      - 'tools/test_saved_campaign_profile_inventory_v2.py'
      - 'ck3_autonomous_player/src/xar_autoplayer/saved_campaign_profile_inventory_v2.py'
      - 'ck3_autonomous_player/native_bridge/research/run_ck3_12002_mcp_live.py'
      - '.github/workflows/living-artifacts-cold-persistence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install static dependencies
        run: python -m pip install -r tools/requirements-static.txt
      - name: Test complete product consumers and strict cold source without CK3
        env:
          PYTHONPATH: ${{ github.workspace }};${{ github.workspace }}\tools;${{ github.workspace }}\mod_living_artifacts\tools;${{ github.workspace }}\ck3_autonomous_player\src
          MYPYPATH: ${{ github.workspace }}\tools;${{ github.workspace }}\mod_living_artifacts\tools;${{ github.workspace }}\ck3_autonomous_player\src
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -B -X utf8 -m unittest discover -s mod_living_artifacts/tools -p test_*.py
          if not "%errorlevel%"=="0" exit /b %errorlevel%
          python -B -X utf8 -m mypy --strict --follow-imports=silent --no-incremental --cache-dir nul mod_living_artifacts/tools/acceptance_adapter.py mod_living_artifacts/tools/saved_campaign_actor_binding.py mod_living_artifacts/tools/cold_persistence_observer.py mod_living_artifacts/tools/cold_persistence_acceptance_adapter.py mod_living_artifacts/tools/test_saved_campaign_actor_binding.py mod_living_artifacts/tools/test_cold_persistence_acceptance_adapter.py
          if not "%errorlevel%"=="0" exit /b %errorlevel%
          python -B -X utf8 tools/test_saved_campaign_profile_inventory_v2.py
          if not "%errorlevel%"=="0" exit /b %errorlevel%
          python -B -X utf8 -m unittest discover -s ck3_autonomous_player/tests/unit -p test_saved_campaign_vanilla_profile.py
          if not "%errorlevel%"=="0" exit /b %errorlevel%
