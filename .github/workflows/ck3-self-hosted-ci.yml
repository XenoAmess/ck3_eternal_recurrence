name: CK3 L1-L3

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: xar-ck3-desktop
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: [self-hosted, Windows, X64, ck3, interactive]
    timeout-minutes: 120
    env:
      XAR_CK3_CI: "1"
      XAR_CK3_EXE: ${{ vars.XAR_CK3_EXE }}
      XAR_CK3_USER_DIR: ${{ vars.XAR_CK3_USER_DIR }}
      XAR_CK3_UGC_DIR: ${{ vars.XAR_CK3_UGC_DIR }}
      XAR_CK3_VERSION: ${{ vars.XAR_CK3_VERSION }}
      XAR_CI_ROOT: ${{ runner.temp }}\xar-ci\${{ github.run_id }}-${{ github.run_attempt }}
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Install acceptance dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Verify dedicated interactive desktop
        run: python tools/run_acceptance.py --preflight

      - name: L1 engine parse and disabled baseline
        id: l1_off
        continue-on-error: true
        run: python tools/run_acceptance.py --scenario off --artifacts-dir "$env:XAR_CI_ROOT\L1\off"
      - name: Upload L1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ck3-l1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.XAR_CI_ROOT }}\L1
          if-no-files-found: warn
          retention-days: 14

      - name: L2 mechanism matrix
        id: l2_selftest
        continue-on-error: true
        run: python tools/run_acceptance.py --scenario selftest --artifacts-dir "$env:XAR_CI_ROOT\L2\selftest"
      - name: L2 two-process persistence
        id: l2_persistence
        continue-on-error: true
        run: python tools/run_acceptance.py --scenario persistence-restart --artifacts-dir "$env:XAR_CI_ROOT\L2\persistence-restart"
      - name: L2 actual death edges
        id: l2_death
        continue-on-error: true
        run: python tools/run_acceptance.py --scenario death-edges --artifacts-dir "$env:XAR_CI_ROOT\L2\death-edges"
      - name: Upload L2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ck3-l2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.XAR_CI_ROOT }}\L2
          if-no-files-found: warn
          retention-days: 14

      - name: L3 first-life production UI
        id: l3_first
        continue-on-error: true
        run: python tools/run_acceptance.py --scenario on-first-life --artifacts-dir "$env:XAR_CI_ROOT\L3\on-first-life"
      - name: L3 recorded-life production UI
        id: l3_recorded
        continue-on-error: true
        run: python tools/run_acceptance.py --scenario on-recorded --artifacts-dir "$env:XAR_CI_ROOT\L3\on-recorded"
      - name: L3 high-budget production UI
        id: l3_high_budget
        continue-on-error: true
        run: python tools/run_acceptance.py --scenario on-high-budget --artifacts-dir "$env:XAR_CI_ROOT\L3\on-high-budget"
      - name: Upload L3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ck3-l3-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.XAR_CI_ROOT }}\L3
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce L1-L3 gate
        if: always()
        env:
          OUTCOMES: >-
            ${{ steps.l1_off.outcome }}
            ${{ steps.l2_selftest.outcome }}
            ${{ steps.l2_persistence.outcome }}
            ${{ steps.l2_death.outcome }}
            ${{ steps.l3_first.outcome }}
            ${{ steps.l3_recorded.outcome }}
            ${{ steps.l3_high_budget.outcome }}
        run: |
          $failed = @($env:OUTCOMES -split '\s+' | Where-Object { $_ -ne 'success' })
          if ($failed.Count -gt 0) {
            throw "L1-L3 gate failed: $env:OUTCOMES"
          }

      - name: Build tagged release candidate
        if: success() && startsWith(github.ref, 'refs/tags/v')
        run: python tools/build_release.py --release
      - name: Upload tagged release candidate
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ github.ref_name }}
          path: |
            dist/*.zip
            dist/*.manifest.json
          if-no-files-found: error
          retention-days: 30
