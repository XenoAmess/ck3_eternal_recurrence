[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xar-autoplayer"
version = "0.1.0"
description = "Auditable visual autonomous player for CK3 and Eternal Recurrence"
requires-python = ">=3.11"
dependencies = [
  "attrs==26.1.0",
  "jsonschema-specifications==2025.9.1",
  "numpy==2.5.2",
  "onnxruntime==1.28.0",
  "opencv-python==5.0.0.93",
  "Pillow==12.3.0",
  "PyAutoGUI==0.9.54",
  "pyclipper==1.4.0",
  "PyYAML==6.0.3",
  "Shapely==2.1.2",
  "jsonschema==4.25.1",
  "rfc3339-validator==0.1.4",
  "referencing==0.37.0",
  "rpds-py==2026.6.3",
  "six==1.17.0",
  "pywin32==312; platform_system == 'Windows'",
  "rapidocr-onnxruntime==1.2.3",
  "onnxruntime-gpu[cuda,cudnn]==1.28.0",
  "nvidia-cublas==13.6.0.2",
  "nvidia-cuda-nvrtc==13.3.33",
  "nvidia-cuda-runtime==13.3.29",
  "nvidia-cudnn-cu13==9.24.0.43",
  "nvidia-cufft==12.3.0.29",
  "nvidia-curand==10.4.3.29",
  "nvidia-nvjitlink==13.3.33",
]

[project.scripts]
xar-autoplayer = "xar_autoplayer.cli:main"
xar-ck3-mcp = "xar_autoplayer.bridge.mcp_server:main"

[project.optional-dependencies]
mcp = ["mcp==2.0.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"xar_autoplayer.simulation" = ["data/*.json"]
