l_russian:
 RRF_DISMISS_TT:0 "Закройте черновик или скройте нерешённые диагностические данные, не очищая и не повторяя попытку."
 rrf_view_pending_fusion_decision:0 "Просмотреть нерешённое слияние"
 rrf_view_pending_fusion_decision_desc:0 "Просмотрите сохранённые источники слияния, результат и списанную сумму. Это не повторяет создание и не списывает плату."
 rrf_view_pending_fusion_decision_tooltip:0 "Показать сохранённые диагностические данные слияния."
 rrf_view_pending_fusion_decision_confirm:0 "Просмотреть"
 RRF_REQUIRE_TENET_KNOWN:0 "Чтобы заимствовать этот принцип из другого обряда, сначала изучите его; выбранные принципы всегда можно убрать."
 RRF_REQUIRE_DOCTRINE_KNOWN:0 "Должно быть известно это учение или его уже практикуют, либо должен быть навык Пророка."
 rrf_begin_rite_fusion_decision:0 "Слить религиозные обряды"
 rrf_begin_rite_fusion_decision_desc:0 "Объедините наш текущий обряд с другим обрядом той же веры. Сравните основные принципы и учения обеих сторон и выберите основу нового обряда. Открытие черновика не расходует благочестие."
 rrf_begin_rite_fusion_decision_tooltip:0 "Выберите другой обряд нашей веры в качестве источника нового обряда"
 rrf_begin_rite_fusion_decision_confirm:0 "Сравнить обряды"
 rrf_begin_faith_fusion_decision:0 "Слить веры"
 rrf_begin_faith_fusion_decision_desc:0 "Объедините наш текущий обряд с обрядом другой веры, в том числе принадлежащим другой религии. Новая вера будет принадлежать нашей текущей религии. Ограничения знаний, учений и несовместимых вариантов по-прежнему действуют. Открытие черновика не расходует благочестие."
 rrf_begin_faith_fusion_decision_tooltip:0 "Выберите обряд другой веры в качестве источника новой веры"
 rrf_begin_faith_fusion_decision_confirm:0 "Сравнить веры"
 RRF_SELECT_SOURCE:0 "Выбрать источник"
 RRF_WINDOW_TITLE:0 "Слияние религий и обрядов"
 RRF_MODE_RITE:0 "Новый обряд в рамках нашей веры"
 RRF_MODE_FAITH:0 "Новая вера в рамках нашей религии"
 RRF_RITE_COST:0 "Стоимость: @piety_icon! [GuiScope.SetRoot( GetPlayer.MakeScope ).ScriptValue( 'rrf_rite_cost_value' )|0]"
 RRF_FAITH_COST:0 "Стоимость: @piety_icon! [GuiScope.SetRoot( GetPlayer.MakeScope ).ScriptValue( 'rrf_faith_cost_value' )|0]"
 RRF_COST_TT:0 "Эта стоимость слияния списывается однократно после проверки нового результата. Успешное слияние устанавливает для этого персонажа десятилетний перезаряд."
 RRF_SELECTION_GUIDANCE:0 "Выберите ровно три разных основных принципа. Каждый источник должен дать хотя бы один уникальный принцип или учение; общее содержание не считается уникальным вкладом."
 RRF_SOURCE_A:0 "Наш обряд"
 RRF_SOURCE_B:0 "Другой источник"
 RRF_SOURCE_CORE_TENETS:0 "Текущие основные принципы"
 RRF_CANDIDATE_TENETS:0 "Выберите основные принципы"
 RRF_SELECTED_TENET_COUNT:0 "Выбрано основных принципов: [GetDataModelSize( GetPlayer.MakeScope.GetList( 'rrf_selected_tenets' ) )]/3"
 RRF_CANDIDATE_DOCTRINES:0 "Выберите учения"
 RRF_DOCTRINE_GUIDANCE:0 "Выберите по одному учению в каждой группе. Выбор другого варианта в той же группе заменит прежний выбор."
 RRF_FINAL_CORE_PREVIEW:0 "Выбранные основные принципы"
 RRF_CONTRIBUTION_OK:0 "#P Выбран уникальный вклад этой стороны#!"
 RRF_CONTRIBUTION_MISSING:0 "#X По-прежнему требуется уникальный вклад этой стороны#!"
 RRF_CONTRIBUTION_TT:0 "Хотя бы один итоговый основной принцип или учение должно происходить только из этого источника. Общий для обеих сторон вариант не удовлетворяет требованию об уникальном вкладе."
 RRF_KNOWLEDGE_REQUIRED:0 "@warning_icon! Требуются знания"
 RRF_KNOWLEDGE_TT:0 "Неизвестное содержание может быть недоступно. Принцип, уже являющийся основным в нашем обряде, можно сохранить. Навык Пророка удовлетворяет требованию знания учений. Другие ограничения по-прежнему действуют."
 RRF_ADOPTION_PREVIEW:0 "Основатель принимает проверенный результат. Это не обязывает всех последователей, вассалов или графства любого из источников обратиться в новую веру. Невыбранные прежние основные принципы могут остаться допустимыми."
 RRF_COMMITTING:0 "Создание и проверка результата. Повторная отправка отключена."
 RRF_UNRESOLVED:0 "@warning_icon! Результат не удалось полностью проверить, ссылки на фактический результат сохранены. Не отправляйте это же слияние повторно; сохраните текущее сохранение для проверки."
 RRF_CANCEL:0 "Отмена"
 RRF_CANCEL_TT:0 "Закройте черновик, не создавая обряд и не расходуя благочестие. Отправку, ожидающую обработки, или нерешённый результат отменить нельзя."
 RRF_REFRESH:0 "Проверить варианты"
 RRF_REFRESH_TT:0 "Повторно проверить текущие источники, варианты и требования. Это ничего не создаёт и не расходует благочестие."
 RRF_COMMIT:0 "Создать результат слияния"
 RRF_COMMIT_TT:0 "Повторно проверьте полный черновик, создайте результат один раз, затем проверьте его перед списанием благочестия и принятием. Невыполненные требования указаны выше."
 RRF_SUBMISSION_REFUSED:0 "Требования к слиянию изменились"
 RRF_SUBMISSION_REFUSED_DESC:0 "Полный черновик больше не соответствует требованиям слияния, поэтому эта отправка не создала результат. Проверьте требования в окне слияния и повторно проверьте варианты."
 RRF_FUSION_SUCCEEDED:0 "Слияние завершено"
 RRF_FUSION_SUCCEEDED_DESC:0 "Вы приняли [GetPlayer.MakeScope.Var( 'rrf_last_result_rite' ).Rite.GetName], результат и оба источника записаны. Невыбранные прежние основные принципы могут остаться допустимыми; принятие результата также может повлиять на близких родственников по обычным правилам обращения."
 RRF_FUSION_UNRESOLVED:0 "Результат слияния требует проверки"
 RRF_FUSION_UNRESOLVED_DESC:0 "Результат не удалось полностью проверить; ссылки на фактический результат и источники сохранены, не повторяйте эту отправку. Записанная стоимость: @piety_icon! [GetPlayer.MakeScope.Var( 'rrf_charged_cost' ).GetValue|0]. Сохраните текущее сохранение для проверки."
 rrf_view_last_fusion_decision:0 "Просмотреть последнее слияние"
 rrf_view_last_fusion_decision_desc:0 "Результат: [GetPlayer.MakeScope.Var( 'rrf_last_result_rite' ).Rite.GetName]\nПервый источник: [GetPlayer.MakeScope.Var( 'rrf_last_result_rite' ).Rite.MakeScope.Var( 'rrf_origin_a' ).Rite.GetName]\nВторой источник: [GetPlayer.MakeScope.Var( 'rrf_last_result_rite' ).Rite.MakeScope.Var( 'rrf_origin_b' ).Rite.GetName]\n\nЭти ссылки указывают на источники, записанные при создании слияния. Просмотр записи ничего не создаёт и не принимает, а также не расходует благочестие."
 rrf_view_last_fusion_decision_tooltip:0 "Прочитать результат и два источника, записанные для последнего слияния"
 rrf_view_last_fusion_decision_confirm:0 "Показать запись"
 RRF_HISTORY_TITLE:0 "Запись слияния"
 RRF_REQUIRE_NO_COOLDOWN:0 "Десятилетний перезаряд после предыдущего слияния завершён"
 RRF_REQUIRE_NO_PENDING:0 "Нет отправок слияния, ожидающих проверки"
 RRF_REQUIRE_SOURCE_CURRENT:0 "Оба источника по-прежнему существуют и соответствуют черновику; ваш обряд и вера не изменились"
 RRF_REQUIRE_REVALIDATED:0 "Текущие варианты проверены"
 RRF_REQUIRE_CONTENT_VALID:0 "Полный выбор соответствует требованиям знаний, DLC, ограничениям учений и правилам совместимости"
 RRF_REQUIRE_THREE_CORES:0 "Выбрано ровно три разных основных принципа"
 RRF_REQUIRE_BOTH_SOURCES:0 "Каждая сторона даёт хотя бы один уникальный итоговый принцип или учение"
 RRF_REQUIRE_COST:0 "Вы можете оплатить указанную стоимость слияния"
 RRF_OPEN_FUSION_DRAFT:0 "Откройте черновик слияния, чтобы выбрать основные принципы и учения."
