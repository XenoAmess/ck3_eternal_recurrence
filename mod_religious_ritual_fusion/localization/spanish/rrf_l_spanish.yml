l_spanish:
 RRF_DISMISS_TT:0 "Cierra el borrador o oculta los diagnósticos pendientes sin borrarlos ni reintentar ese intento."
 rrf_view_pending_fusion_decision:0 "Inspeccionar fusión pendiente"
 rrf_view_pending_fusion_decision_desc:0 "Inspecciona las fuentes, el resultado y el importe cobrado de la fusión conservados. Esto no reintenta la creación ni cobra una tasa."
 rrf_view_pending_fusion_decision_tooltip:0 "Vuelve a mostrar los diagnósticos conservados de la fusión."
 rrf_view_pending_fusion_decision_confirm:0 "Inspeccionar"
 RRF_REQUIRE_TENET_KNOWN:0 "Aprende este principio antes de tomarlo prestado del otro ritual. Los principios seleccionados siempre pueden retirarse."
 RRF_REQUIRE_DOCTRINE_KNOWN:0 "Debes conocer esta doctrina, practicarla ya o tener la perk de Profeta."
 rrf_begin_rite_fusion_decision:0 "Fusionar rituales religiosos"
 rrf_begin_rite_fusion_decision_desc:0 "Combina nuestro ritual actual con otro ritual de la misma fe. Compara sus principios y doctrinas centrales, y elige las bases de un nuevo ritual. Abrir el borrador no consume piedad."
 rrf_begin_rite_fusion_decision_tooltip:0 "Elige otro ritual de nuestra fe como fuente para un nuevo ritual"
 rrf_begin_rite_fusion_decision_confirm:0 "Comparar rituales"
 rrf_begin_faith_fusion_decision:0 "Fusionar feas"
 rrf_begin_faith_fusion_decision_desc:0 "Combina nuestro ritual actual con un ritual de otra fe, incluso de otra religión. La nueva fe pertenecerá a nuestra religión actual. Se siguen aplicando las restricciones de conocimiento, doctrinales y de incompatibilidad. Abrir el borrador no consume piedad."
 rrf_begin_faith_fusion_decision_tooltip:0 "Elige un ritual de otra fe como fuente para una nueva fe"
 rrf_begin_faith_fusion_decision_confirm:0 "Comparar feas"
 RRF_SELECT_SOURCE:0 "Elegir fuente"
 RRF_WINDOW_TITLE:0 "Fusión religiosa y ritual"
 RRF_MODE_RITE:0 "Nuevo ritual dentro de nuestra fe"
 RRF_MODE_FAITH:0 "Nueva fe dentro de nuestra religión"
 RRF_RITE_COST:0 "Coste: @piety_icon! [GuiScope.SetRoot( GetPlayer.MakeScope ).ScriptValue( 'rrf_rite_cost_value' )|0]"
 RRF_FAITH_COST:0 "Coste: @piety_icon! [GuiScope.SetRoot( GetPlayer.MakeScope ).ScriptValue( 'rrf_faith_cost_value' )|0]"
 RRF_COST_TT:0 "Este coste de fusión se cobra una sola vez después de verificar el nuevo resultado. Una fusión correcta impose a este personaje un enfriamiento de diez años."
 RRF_SELECTION_GUIDANCE:0 "Elige exactamente tres principios centrales distintos. Cada fuente debe aportar al menos un principio o doctrina exclusivos; el contenido compartido no cuenta como aportación exclusiva."
 RRF_SOURCE_A:0 "Nuestro ritual"
 RRF_SOURCE_B:0 "Otra fuente"
 RRF_SOURCE_CORE_TENETS:0 "Principios centrales actuales"
 RRF_CANDIDATE_TENETS:0 "Elegir principios centrales"
 RRF_SELECTED_TENET_COUNT:0 "Seleccionados: [GetDataModelSize( GetPlayer.MakeScope.GetList( 'rrf_selected_tenets' ) )]/3 principios centrales"
 RRF_CANDIDATE_DOCTRINES:0 "Elegir doctrinas"
 RRF_DOCTRINE_GUIDANCE:0 "Elige una doctrina en cada grupo. Seleccionar otra opción del mismo grupo sustituirá la elección anterior."
 RRF_FINAL_CORE_PREVIEW:0 "Principios centrales seleccionados"
 RRF_CONTRIBUTION_OK:0 "#P Se ha seleccionado una aportación exclusiva de esta fuente#!"
 RRF_CONTRIBUTION_MISSING:0 "#X Todavía se requiere una aportación exclusiva de esta fuente#!"
 RRF_CONTRIBUTION_TT:0 "Al menos uno de los principios o doctrinas centrales finales debe proceder exclusivamente de esta fuente. Una opción compartida por ambas fuentes no cumple este requisito."
 RRF_KNOWLEDGE_REQUIRED:0 "@warning_icon! Se requiere conocimiento"
 RRF_KNOWLEDGE_TT:0 "El contenido desconocido puede no estar disponible. Un principio que ya sea central de nuestro ritual puede conservarse. La perk de Profeta cumple el requisito de conocimiento de doctrina. Se siguen aplicando otras restricciones."
 RRF_ADOPTION_PREVIEW:0 "El fundador adopta el resultado verificado. Esto no obliga a todos los seguidores, vasallos o condados de ninguna fuente a convertirse. Los principios centrales anteriores que no se seleccionen pueden seguir permitidos."
 RRF_COMMITTING:0 "Creando y comprobando el resultado. Se han desactivado nuevos envíos."
 RRF_UNRESOLVED:0 "@warning_icon! No se pudo verificar por completo el resultado; se han conservado las referencias del resultado real. No envíes la misma fusión otra vez; conserva esta partida para inspeccionarla."
 RRF_CANCEL:0 "Cancelar"
 RRF_CANCEL_TT:0 "Cierra el borrador sin crear un ritual ni cobrar piedad. No se puede cancelar un envío pendiente o sin resolver."
 RRF_REFRESH:0 "Comprobar opciones"
 RRF_REFRESH_TT:0 "Vuelve a comprobar las fuentes, opciones y requisitos actuales. Esto no crea nada ni cobra piedad."
 RRF_COMMIT:0 "Crear fusión"
 RRF_COMMIT_TT:0 "Vuelve a comprobar el borrador completo, crea el resultado una sola vez y verifícalo antes de cobrar la piedad y adoptarlo. Los requisitos no cumplidos se indican arriba."
 RRF_SUBMISSION_REFUSED:0 "Los requisitos de fusión han cambiado"
 RRF_SUBMISSION_REFUSED_DESC:0 "El borrador completo ya no cumple los requisitos de fusión, y este envío no creó ningún resultado. Revisa los requisitos en la ventana de fusión y vuelve a comprobar tus opciones."
 RRF_FUSION_SUCCEEDED:0 "Fusión completada"
 RRF_FUSION_SUCCEEDED_DESC:0 "Has adoptado [GetPlayer.MakeScope.Var( 'rrf_last_result_rite' ).Rite.GetName]. El resultado y sus dos fuentes han quedado registrados. Los principios centrales anteriores que no se seleccionaron pueden seguir permitidos. Adoptar el resultado también puede afectar a los parientes cercanos según las reglas habituales de conversión."
 RRF_FUSION_UNRESOLVED:0 "El resultado de fusión necesita inspección"
 RRF_FUSION_UNRESOLVED_DESC:0 "No se pudo verificar por completo el resultado; se han conservado las referencias del resultado real y sus fuentes, por lo que no debes reintentar este envío. Coste registrado: @piety_icon! [GetPlayer.MakeScope.Var( 'rrf_charged_cost' ).GetValue|0]. Conserva esta partida para inspeccionarla."
 rrf_view_last_fusion_decision:0 "Ver la última fusión"
 rrf_view_last_fusion_decision_desc:0 "Resultado: [GetPlayer.MakeScope.Var( 'rrf_last_result_rite' ).Rite.GetName]\nPrimera fuente: [GetPlayer.MakeScope.Var( 'rrf_last_result_rite' ).Rite.MakeScope.Var( 'rrf_origin_a' ).Rite.GetName]\nSegunda fuente: [GetPlayer.MakeScope.Var( 'rrf_last_result_rite' ).Rite.MakeScope.Var( 'rrf_origin_b' ).Rite.GetName]\n\nEstas referencias identifican las fuentes registradas al crear la fusión. Esta vista no crea ni adopta nada y no cobra piedad."
 rrf_view_last_fusion_decision_tooltip:0 "Consulta el resultado y las dos fuentes registrados en tu última fusión"
 rrf_view_last_fusion_decision_confirm:0 "Mostrar registro"
 RRF_HISTORY_TITLE:0 "Fusión registrada"
 RRF_REQUIRE_NO_COOLDOWN:0 "El enfriamiento de diez años de tu última fusión ha terminado"
 RRF_REQUIRE_NO_PENDING:0 "No tienes ninguna fusión pendiente de verificación"
 RRF_REQUIRE_SOURCE_CURRENT:0 "Ambas fuentes siguen existiendo y coinciden con este borrador; tu ritual y tu fe no han cambiado"
 RRF_REQUIRE_REVALIDATED:0 "Se han comprobado las opciones actuales"
 RRF_REQUIRE_CONTENT_VALID:0 "La selección completa cumple los requisitos de conocimiento, DLC, restricciones doctrinales y reglas de compatibilidad"
 RRF_REQUIRE_THREE_CORES:0 "Se han seleccionado exactamente tres principios centrales distintos"
 RRF_REQUIRE_BOTH_SOURCES:0 "Cada fuente aporta al menos un principio o doctrina final exclusivos"
 RRF_REQUIRE_COST:0 "Puedes pagar el coste de fusión mostrado"
 RRF_OPEN_FUSION_DRAFT:0 "Abre el borrador de fusión para elegir principios centrales y doctrinas."
