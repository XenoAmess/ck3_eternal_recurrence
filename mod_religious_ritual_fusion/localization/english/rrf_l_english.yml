l_english:
 RRF_DISMISS_TT:0 "Close the draft, or hide unresolved diagnostics without clearing or retrying that attempt."
 rrf_view_pending_fusion_decision:0 "Inspect Unresolved Fusion"
 rrf_view_pending_fusion_decision_desc:0 "Inspect the retained fusion sources, result and charged amount. This does not retry creation or charge a fee."
 rrf_view_pending_fusion_decision_tooltip:0 "Show retained fusion diagnostics."
 rrf_view_pending_fusion_decision_confirm:0 "Inspect"
 RRF_REQUIRE_TENET_KNOWN:0 "Learn this tenet before borrowing it from the other Rite. Selected tenets can always be removed."
 RRF_REQUIRE_DOCTRINE_KNOWN:0 "Know this doctrine, already practice it, or have the Prophet perk."
 rrf_begin_rite_fusion_decision:0 "Fuse Religious Rites"
 rrf_begin_rite_fusion_decision_desc:0 "Combine our current rite with another rite of the same faith. Compare their core tenets and doctrines, then choose the foundations of a new rite. Opening the draft costs no piety."
 rrf_begin_rite_fusion_decision_tooltip:0 "Choose another rite of our faith as a source for a new rite"
 rrf_begin_rite_fusion_decision_confirm:0 "Compare Rites"
 rrf_begin_faith_fusion_decision:0 "Fuse Faiths"
 rrf_begin_faith_fusion_decision_desc:0 "Combine our current rite with a rite of another faith, including one from another religion. The new faith will belong to our current religion. Knowledge, doctrinal restrictions and incompatible choices still apply. Opening the draft costs no piety."
 rrf_begin_faith_fusion_decision_tooltip:0 "Choose a rite of another faith as a source for a new faith"
 rrf_begin_faith_fusion_decision_confirm:0 "Compare Faiths"
 RRF_SELECT_SOURCE:0 "Choose Source"
 RRF_WINDOW_TITLE:0 "Religious and Ritual Fusion"
 RRF_MODE_RITE:0 "New Rite within Our Faith"
 RRF_MODE_FAITH:0 "New Faith within Our Religion"
 RRF_RITE_COST:0 "Cost: @piety_icon! [GuiScope.SetRoot( GetPlayer.MakeScope ).ScriptValue( 'rrf_rite_cost_value' )|0]"
 RRF_FAITH_COST:0 "Cost: @piety_icon! [GuiScope.SetRoot( GetPlayer.MakeScope ).ScriptValue( 'rrf_faith_cost_value' )|0]"
 RRF_COST_TT:0 "This fusion cost is charged once after the new result has been verified. Successful fusion gives this character a ten-year cooldown."
 RRF_SELECTION_GUIDANCE:0 "Choose exactly three different core tenets. Each source must contribute at least one unique tenet or doctrine; shared content does not count as a unique contribution."
 RRF_SOURCE_A:0 "Our Rite"
 RRF_SOURCE_B:0 "Other Source"
 RRF_SOURCE_CORE_TENETS:0 "Current Core Tenets"
 RRF_CANDIDATE_TENETS:0 "Choose Core Tenets"
 RRF_SELECTED_TENET_COUNT:0 "Selected: [GetDataModelSize( GetPlayer.MakeScope.GetList( 'rrf_selected_tenets' ) )]/3 core tenets"
 RRF_CANDIDATE_DOCTRINES:0 "Choose Doctrines"
 RRF_DOCTRINE_GUIDANCE:0 "Choose one doctrine in each group. Selecting another option in the same group replaces the previous choice."
 RRF_FINAL_CORE_PREVIEW:0 "Selected Core Tenets"
 RRF_CONTRIBUTION_OK:0 "#P Unique contribution selected#!"
 RRF_CONTRIBUTION_MISSING:0 "#X A unique contribution is still required#!"
 RRF_CONTRIBUTION_TT:0 "At least one final core tenet or doctrine must come only from this source. A choice shared by both sources cannot satisfy this requirement."
 RRF_KNOWLEDGE_REQUIRED:0 "@warning_icon! Knowledge required"
 RRF_KNOWLEDGE_TT:0 "Unknown content may be unavailable. A tenet already core to our rite can be retained. The Prophet perk satisfies the doctrine knowledge requirement. Other restrictions still apply."
 RRF_ADOPTION_PREVIEW:0 "The founder adopts the verified result. This does not force every follower, vassal or county of either source to convert. Former core tenets that are not selected may remain permitted."
 RRF_COMMITTING:0 "Creating and checking the result. Further submissions are disabled."
 RRF_UNRESOLVED:0 "@warning_icon! The result could not be fully verified. Existing result references have been retained. Do not submit the same fusion again; preserve this save for inspection."
 RRF_CANCEL:0 "Cancel"
 RRF_CANCEL_TT:0 "Close the draft without creating a rite or charging piety. A pending or unresolved submission cannot be cancelled."
 RRF_REFRESH:0 "Check Choices"
 RRF_REFRESH_TT:0 "Check the current sources, choices and requirements again. This does not create anything or charge piety."
 RRF_COMMIT:0 "Create Fusion"
 RRF_COMMIT_TT:0 "Recheck the complete draft, create the result once, then verify it before charging piety and adopting it. Unavailable requirements are listed above."
 RRF_SUBMISSION_REFUSED:0 "Fusion Requirements Have Changed"
 RRF_SUBMISSION_REFUSED_DESC:0 "The complete draft no longer satisfies the fusion requirements. No result was created by this submission. Review the requirements in the fusion window and check your choices again."
 RRF_FUSION_SUCCEEDED:0 "Fusion Complete"
 RRF_FUSION_SUCCEEDED_DESC:0 "You have adopted [GetPlayer.MakeScope.Var( 'rrf_last_result_rite' ).Rite.GetName]. The result and its two sources have been recorded. Former core tenets that were not selected may remain permitted. Adopting the result may also affect close family through the usual conversion rules."
 RRF_FUSION_UNRESOLVED:0 "Fusion Result Needs Inspection"
 RRF_FUSION_UNRESOLVED_DESC:0 "The result could not be fully verified. References to the actual result and its sources have been retained; do not retry this submission. Recorded cost: @piety_icon! [GetPlayer.MakeScope.Var( 'rrf_charged_cost' ).GetValue|0]. Preserve this save for inspection."
 rrf_view_last_fusion_decision:0 "View the Last Fusion"
 rrf_view_last_fusion_decision_desc:0 "Result: [GetPlayer.MakeScope.Var( 'rrf_last_result_rite' ).Rite.GetName]\nFirst source: [GetPlayer.MakeScope.Var( 'rrf_last_result_rite' ).Rite.MakeScope.Var( 'rrf_origin_a' ).Rite.GetName]\nSecond source: [GetPlayer.MakeScope.Var( 'rrf_last_result_rite' ).Rite.MakeScope.Var( 'rrf_origin_b' ).Rite.GetName]\n\nThese references identify the sources recorded when the fusion was created. This view does not create or adopt anything and charges no piety."
 rrf_view_last_fusion_decision_tooltip:0 "Read the result and two sources recorded for your last fusion"
 rrf_view_last_fusion_decision_confirm:0 "Show Record"
 RRF_HISTORY_TITLE:0 "Recorded Fusion"
 RRF_REQUIRE_NO_COOLDOWN:0 "Your previous fusion's ten-year cooldown has ended"
 RRF_REQUIRE_NO_PENDING:0 "You have no fusion submission awaiting verification"
 RRF_REQUIRE_SOURCE_CURRENT:0 "Both sources still exist and match this draft; your rite and faith have not changed"
 RRF_REQUIRE_REVALIDATED:0 "The current choices have been checked"
 RRF_REQUIRE_CONTENT_VALID:0 "The complete selection satisfies knowledge, DLC, doctrine restrictions and compatibility rules"
 RRF_REQUIRE_THREE_CORES:0 "Exactly three different core tenets are selected"
 RRF_REQUIRE_BOTH_SOURCES:0 "Each source contributes at least one unique final tenet or doctrine"
 RRF_REQUIRE_COST:0 "You can afford the displayed fusion cost"
