 rrf_native_setup_cost_waiver:0 "Free Fusion Rite Customization"
 rrf_native_setup_cost_waiver_desc:0 "The fusion fee has been paid. Completing customization of this new rite costs no further piety."
 RRF_NATIVE_SETUP_TITLE:0 "Customize the Fused Rite"
 RRF_NATIVE_SETUP_INTRO:0 "The new rite has been created and adopted, and the fusion fee settled. Use the native controls to finish its names, appearance and doctrines. This step edits the same rite. When changing doctrines, retain at least one originally selected exclusive contribution from each source. If you made no changes, keep the default configuration before requesting the first save confirmation."
 RRF_NATIVE_SETUP_NAMES_TAB:0 "Names and Color"
 RRF_NATIVE_SETUP_ICONS_TAB:0 "Faith Icon"
