l_english:
 RRF_DISMISS_TT:0 "Close the draft, or hide unresolved diagnostics without clearing or retrying that attempt."
 rrf_view_pending_fusion_decision:0 "Inspect Unresolved Fusion"
 rrf_view_pending_fusion_decision_desc:0 "Inspect the retained fusion sources, result and charged amount. This does not retry creation or charge a fee."
 rrf_view_pending_fusion_decision_tooltip:0 "Show retained fusion diagnostics."
 rrf_view_pending_fusion_decision_confirm:0 "Inspect"
 RRF_REQUIRE_TENET_KNOWN:0 "Learn this tenet before borrowing it from the other Rite. Selected tenets can always be removed."
 RRF_REQUIRE_DOCTRINE_KNOWN:0 "Know this doctrine, already practice it, or have the Prophet perk."
 rrf_begin_rite_fusion_decision:0 "Fuse Rites of Our Faith"
 rrf_begin_rite_fusion_decision_desc:0 "Combine our current rite with another rite of the same faith. Compare their core tenets and doctrines, then choose the foundations of a new rite. Opening the draft costs no piety."
 rrf_begin_rite_fusion_decision_tooltip:0 "Choose another rite of our faith as a source for a new rite"
 rrf_begin_rite_fusion_decision_confirm:0 "Compare Rites"
 rrf_begin_faith_fusion_decision:0 "Fuse Other Rites"
 rrf_begin_faith_fusion_decision_desc:0 "Combine our current rite with a rite of another faith, including one from another religion. The new faith will belong to our current religion. Knowledge, doctrinal restrictions and incompatible choices still apply. Opening the draft costs no piety."
 rrf_begin_faith_fusion_decision_tooltip:0 "Choose a rite of another faith as a source for a new faith"
 rrf_begin_faith_fusion_decision_confirm:0 "Compare Faiths"
 RRF_SELECT_SOURCE:0 "Choose Source"
 RRF_WINDOW_TITLE:0 "Religious and Ritual Fusion"
 RRF_MODE_RITE:0 "New Rite within Our Faith"
 RRF_MODE_FAITH:0 "New Faith within Our Religion"
 RRF_RITE_COST:0 "Cost: @piety_icon! [GuiScope.SetRoot( GetPlayer.MakeScope ).ScriptValue( 'rrf_rite_cost_value' )|0]"
