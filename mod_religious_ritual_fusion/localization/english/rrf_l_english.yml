 RRF_VIEW_RESULT:0 "View Fusion and Conversion Results"
 RRF_VIEW_RESULT_TT:0 "Inspect the actual fused rite, close family record and vassal conversion preview. Opening this window costs nothing and sends no invitations."
 RRF_CONVERSION_REQUIRE_CONFIGURED_RESULT:0 "You still follow the fusion rite you founded and have completed its customization"
 RRF_CONVERSION_REQUIRE_CURRENT_VASSAL:0 "The target is still your living direct vassal and does not follow your rite"
 RRF_CONVERSION_NATIVE_UNAVAILABLE:0 "The target meets the native conversion interaction's current eligibility and cost requirements"
