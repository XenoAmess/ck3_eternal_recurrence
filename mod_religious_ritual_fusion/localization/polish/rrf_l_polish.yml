l_polish:
 RRF_DISMISS_TT:0 "Zamknij szkic lub tylko ukryj nierozwiązane diagnostyki; ukrycie nie usuwa zapisu, nie znosi oczekującego stanu ani nie ponawia utworzenia."
 rrf_view_pending_fusion_decision:0 "Przejrzyj nierozwiązaną fuzję"
 rrf_view_pending_fusion_decision_desc:0 "Przejrzyj zachowane źródła fuzji, wynik i naliczoną kwotę. Nie ponawia to utworzenia ani nie pobiera opłaty."
 rrf_view_pending_fusion_decision_tooltip:0 "Ponownie wyświetl zachowane diagnostyki fuzji."
 rrf_view_pending_fusion_decision_confirm:0 "Przejrzyj"
 RRF_REQUIRE_TENET_KNOWN:0 "Najpierw poznaj ten dogmat, zanim przejmiesz go z innego rytuału; wybrane dogmaty można zawsze usunąć."
 RRF_REQUIRE_DOCTRINE_KNOWN:0 "Musisz znać tę doktrynę, już ją praktykować lub mieć talent Proroka."
 rrf_begin_rite_fusion_decision:0 "Fuse Rites of Our Faith"
 rrf_begin_rite_fusion_decision_desc:0 "Połącz nasz obecny rytuał z innym rytuałem w tej samej wierze. Porównaj podstawowe dogmaty i doktryny obu stron, aby wybrać fundamenty nowego rytuału. Otwarcie szkicu nie kosztuje pobożności."
 rrf_begin_rite_fusion_decision_tooltip:0 "Wybierz inny rytuał naszej wiary jako źródło nowego rytuału"
 rrf_begin_rite_fusion_decision_confirm:0 "Porównaj rytuały"
 rrf_begin_faith_fusion_decision:0 "Fuse Other Rites"
 rrf_begin_faith_fusion_decision_desc:0 "Połącz nasz obecny rytuał z rytuałem innej wiary, także z innej religii. Nowa wiara będzie należeć do naszej obecnej religii. Nadal obowiązują wymagania wiedzy, ograniczenia doktrynalne i zasady wykluczania. Otwarcie szkicu nie kosztuje pobożności."
 rrf_begin_faith_fusion_decision_tooltip:0 "Wybierz rytuał innej wiary jako źródło nowej wiary"
 rrf_begin_faith_fusion_decision_confirm:0 "Porównaj religie"
 RRF_SELECT_SOURCE:0 "Wybierz źródło"
 RRF_WINDOW_TITLE:0 "Fuzja religii i rytuałów"
 RRF_MODE_RITE:0 "Nowy rytuał w naszej wierze"
 RRF_MODE_FAITH:0 "Nowa wiara w naszej religii"
 RRF_RITE_COST:0 "Koszt: @piety_icon! [GuiScope.SetRoot( GetPlayer.MakeScope ).ScriptValue( 'rrf_rite_cost_value' )|0]"
 RRF_FAITH_COST:0 "Koszt: @piety_icon! [GuiScope.SetRoot( GetPlayer.MakeScope ).ScriptValue( 'rrf_faith_cost_value' )|0]"
 RRF_COST_TT:0 "Successful fusion charges this fee once and starts a ten-year cooldown. The following customization of the new rite's names, icon, color and extension doctrines is free."
 RRF_SELECTION_GUIDANCE:0 "Choose 3 to [GetPlayer.MakeScope.Var( 'rrf_core_limit' ).GetValue|0] different core tenets. Each source must contribute at least one unique tenet or doctrine; shared content does not count as a unique contribution."
 RRF_SOURCE_A:0 "Nasz rytuał"
 RRF_SOURCE_B:0 "Inne źródło"
 RRF_SOURCE_CORE_TENETS:0 "Obecne podstawowe dogmaty"
 RRF_CANDIDATE_TENETS:0 "Wybierz podstawowe dogmaty"
 RRF_SELECTED_TENET_COUNT:0 "Selected: [GetDataModelSize( GetPlayer.MakeScope.GetList( 'rrf_selected_tenets' ) )] · Limit: [GetPlayer.MakeScope.Var( 'rrf_core_limit' ).GetValue|0]"
 RRF_CANDIDATE_DOCTRINES:0 "Wybierz doktryny"
 RRF_DOCTRINE_GUIDANCE:0 "Wybierz jedną doktrynę z każdej grupy. Wybranie innej opcji w tej samej grupie zastępuje poprzedni wybór."
 RRF_FINAL_CORE_PREVIEW:0 "Wybrane podstawowe dogmaty"
 RRF_CONTRIBUTION_OK:0 "#P Wybrano wyłączny wkład tej strony#!"
 RRF_CONTRIBUTION_MISSING:0 "#X Ta strona nadal musi wnieść wyłączną treść#!"
 RRF_CONTRIBUTION_TT:0 "Co najmniej jeden ostateczny podstawowy dogmat lub doktryna musi pochodzić wyłącznie z tego źródła. Opcja wspólna dla obu źródeł nie spełnia wymogu wyłącznego wkładu."
 RRF_KNOWLEDGE_REQUIRED:0 "@warning_icon! Wymagana wiedza"
 RRF_KNOWLEDGE_TT:0 "Nieznana treść może być niedostępna. Dogmat będący już podstawowym dogmatem naszego rytuału można zachować. Talent Proroka spełnia wymóg wiedzy doktrynalnej. Obowiązują pozostałe ograniczenia."
 RRF_ADOPTION_PREVIEW:0 "You adopt the result. Eligible close family may follow through the usual conversion rules. After customization, preview and invite vassals, who respond under the native interaction rules. Unselected former core tenets may remain permitted."
 RRF_COMMITTING:0 "Trwa tworzenie i sprawdzanie wyniku. Ponowne wysłanie jest wyłączone."
 RRF_UNRESOLVED:0 "@warning_icon! Nie ukończono weryfikacji wyniku, ale zachowano odwołania do rzeczywistego wyniku. Nie wysyłaj ponownie tej samej fuzji; zachowaj bieżący zapis do sprawdzenia."
 RRF_CANCEL:0 "Anuluj"
 RRF_CANCEL_TT:0 "Zamknij szkic bez utworzenia rytuału i bez pobrania pobożności. Nie można anulować wysłania ani nierozwiązanego wyniku."
 RRF_REFRESH:0 "Sprawdź opcje"
 RRF_REFRESH_TT:0 "Ponownie sprawdź bieżące źródła, opcje i wymagania. Nie tworzy to niczego ani nie pobiera pobożności."
 RRF_COMMIT:0 "Create and Customize"
 RRF_COMMIT_TT:0 "Create and adopt a new rite with the selected core tenets and doctrines, paying the fusion fee once. Then customize its names, icon, color and extension doctrines for free."
 RRF_SUBMISSION_REFUSED:0 "Wymagania fuzji uległy zmianie"
 RRF_SUBMISSION_REFUSED_DESC:0 "Cały szkic nie spełnia już wymagań fuzji, więc to wysłanie nie utworzyło wyniku. Przejrzyj wymagania w oknie fuzji i ponownie sprawdź opcje."
 RRF_FUSION_SUCCEEDED:0 "Fuzja ukończona"
 RRF_FUSION_SUCCEEDED_DESC:0 "You have adopted [GetPlayer.MakeScope.Var( 'rrf_last_result_rite' ).Rite.GetName]. The fusion fee has been settled and both sources recorded. You can now customize this rite's names, icon, color and extension doctrines for free, then inspect the vassal conversion preview."
 RRF_FUSION_UNRESOLVED:0 "Wynik fuzji wymaga sprawdzenia"
 RRF_FUSION_UNRESOLVED_DESC:0 "Nie ukończono weryfikacji wyniku, ale zachowano odwołania do rzeczywistego wyniku i jego źródeł; nie ponawiaj tego wysłania. Zapisany koszt: @piety_icon! [GetPlayer.MakeScope.Var( 'rrf_charged_cost' ).GetValue|0]. Zachowaj bieżący zapis do sprawdzenia."
 rrf_view_last_fusion_decision:0 "Wyświetl ostatnią fuzję"
 rrf_view_last_fusion_decision_desc:0 "Wynik: [GetPlayer.MakeScope.Var( 'rrf_last_result_rite' ).Rite.GetName]\nPierwsze źródło: [GetPlayer.MakeScope.Var( 'rrf_last_result_rite' ).Rite.MakeScope.Var( 'rrf_origin_a' ).Rite.GetName]\nDrugie źródło: [GetPlayer.MakeScope.Var( 'rrf_last_result_rite' ).Rite.MakeScope.Var( 'rrf_origin_b' ).Rite.GetName]\n\nTe odwołania wskazują źródła zapisane podczas utworzenia fuzji. Ten widok niczego nie tworzy ani nie przyjmuje i nie pobiera pobożności."
 rrf_view_last_fusion_decision_tooltip:0 "Odczytaj wynik i dwa źródła zapisane podczas ostatniej fuzji"
 rrf_view_last_fusion_decision_confirm:0 "Pokaż zapis"
 RRF_HISTORY_TITLE:0 "Zapisana fuzja"
 RRF_REQUIRE_NO_COOLDOWN:0 "Dziesięcioletnia przerwa po poprzedniej fuzji dobiegła końca"
 RRF_REQUIRE_NO_PENDING:0 "Nie ma wysłania fuzji oczekującego na weryfikację"
 RRF_REQUIRE_SOURCE_CURRENT:0 "Oba źródła nadal istnieją i odpowiadają temu szkicowi; nasz rytuał i wiara nie uległy zmianie"
 RRF_REQUIRE_REVALIDATED:0 "Bieżące opcje zostały sprawdzone"
 RRF_REQUIRE_CONTENT_VALID:0 "Pełny wybór spełnia wymagania wiedzy, DLC, ograniczenia doktrynalne i zasady zgodności"
 RRF_REQUIRE_THREE_CORES:0 "At least three different core tenets are selected, within the current limit"
 RRF_REQUIRE_BOTH_SOURCES:0 "Każde źródło wnosi co najmniej jeden wyłączny ostateczny dogmat lub doktrynę"
 RRF_REQUIRE_COST:0 "Starcza środków na wyświetlony koszt fuzji"
 RRF_OPEN_FUSION_DRAFT:0 "Otwórz szkic fuzji, aby wybrać podstawowe dogmaty i doktryny."
