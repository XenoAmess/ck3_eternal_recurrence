l_korean:
 RRF_DISMISS_TT:0 "초안을 닫거나 미해결 진단을 숨깁니다. 숨겨도 기록이 지워지거나 미해결 상태가 해제되거나 생성이 재시도되지 않습니다."
 rrf_view_pending_fusion_decision:0 "미해결 융합 확인"
 rrf_view_pending_fusion_decision_desc:0 "보존된 융합 출처, 결과 및 과금 금액을 확인합니다. 이 작업은 생성을 재시도하거나 비용을 부과하지 않습니다."
 rrf_view_pending_fusion_decision_tooltip:0 "보존된 융합 진단을 다시 표시합니다."
 rrf_view_pending_fusion_decision_confirm:0 "확인"
 RRF_REQUIRE_TENET_KNOWN:0 "다른 의식에서 핵심 교훈을 차용하기 전에 먼저 배워야 합니다. 선택한 교훈은 언제든 제거할 수 있습니다."
 RRF_REQUIRE_DOCTRINE_KNOWN:0 "해당 교리를 알고 있거나 이미 실천하고 있거나, 예언자 특성을 보유해야 합니다."
 rrf_begin_rite_fusion_decision:0 "Fuse Rites of Our Faith"
 rrf_begin_rite_fusion_decision_desc:0 "현재 의식을 같은 신앙의 다른 의식과 융합합니다. 양쪽의 핵심 교훈과 교리를 비교한 뒤 새 의식의 토대를 선택하세요. 초안을 열어도 경건도를 소모하지 않습니다."
 rrf_begin_rite_fusion_decision_tooltip:0 "융합의 기반으로 같은 신앙의 다른 의례를 선택합니다. 초안 열기는 무료입니다. 생성 시 표시된 비용을 확인하고 성공한 경우에만 차감합니다.\n[GetPlayer.Custom('RrfCooldownStatus')]\n[GetPlayer.Custom('RrfPendingStatus')]"
 rrf_begin_rite_fusion_decision_confirm:0 "의식 비교"
 rrf_begin_faith_fusion_decision:0 "Fuse Other Rites"
 rrf_begin_faith_fusion_decision_desc:0 "현재 의식을 다른 신앙의 의식과 융합하며, 다른 종교의 의식도 선택할 수 있습니다. 새 신앙은 현재 종교에 속합니다. 지식, 교리 제한 및 상호 배타 규칙은 그대로 적용됩니다. 초안을 열어도 경건도를 소모하지 않습니다."
 rrf_begin_faith_fusion_decision_tooltip:0 "융합의 기반으로 다른 신앙의 의례를 선택합니다. 초안 열기는 무료입니다. 생성 시 표시된 비용을 확인하고 성공한 경우에만 차감합니다.\n[GetPlayer.Custom('RrfCooldownStatus')]\n[GetPlayer.Custom('RrfPendingStatus')]"
 rrf_begin_faith_fusion_decision_confirm:0 "신앙 비교"
 RRF_SELECT_SOURCE:0 "출처 선택"
 RRF_WINDOW_TITLE:0 "종교 및 의식 융합"
 RRF_MODE_RITE:0 "현재 신앙 안에서 새 의식 생성"
 RRF_MODE_FAITH:0 "현재 종교 안에서 새 신앙 생성"
 RRF_RITE_COST:0 "비용: @piety_icon! [GuiScope.SetRoot( GetPlayer.MakeScope ).ScriptValue( 'rrf_rite_cost_value' )|0]"
 RRF_FAITH_COST:0 "비용: @piety_icon! [GuiScope.SetRoot( GetPlayer.MakeScope ).ScriptValue( 'rrf_faith_cost_value' )|0]"
 RRF_COST_TT:0 "Successful fusion charges this fee once and starts a ten-year cooldown. The following customization of the new rite's names, icon, color and extension doctrines is free."
 RRF_SELECTION_GUIDANCE:0 "Choose 3 to [GetPlayer.MakeScope.Var( 'rrf_core_limit' ).GetValue|0] different core tenets. Each source must contribute at least one unique tenet or doctrine; shared content does not count as a unique contribution."
 RRF_SOURCE_A:0 "우리의 의식"
 RRF_SOURCE_B:0 "다른 출처"
 RRF_SOURCE_CORE_TENETS:0 "현재 핵심 교훈"
 RRF_CANDIDATE_TENETS:0 "핵심 교훈 선택"
 RRF_SELECTED_TENET_COUNT:0 "Selected: [GetDataModelSize( GetPlayer.MakeScope.GetList( 'rrf_selected_tenets' ) )] · Limit: [GetPlayer.MakeScope.Var( 'rrf_core_limit' ).GetValue|0]"
 RRF_CANDIDATE_DOCTRINES:0 "교리 선택"
 RRF_DOCTRINE_GUIDANCE:0 "각 그룹에서 교리를 하나씩 선택하세요. 같은 그룹의 다른 항목을 선택하면 기존 선택이 교체됩니다."
 RRF_FINAL_CORE_PREVIEW:0 "선택한 핵심 교훈"
 RRF_CONTRIBUTION_OK:0 "#P 이쪽에만 있는 항목을 선택함#!"
 RRF_CONTRIBUTION_MISSING:0 "#X 이쪽에만 있는 항목이 아직 필요함#!"
 RRF_CONTRIBUTION_TT:0 "최종 핵심 교훈 또는 교리 중 최소 한 항목은 해당 출처에만 있어야 합니다. 양쪽이 공유하는 선택은 독보적인 기여 요건을 충족할 수 없습니다."
 RRF_KNOWLEDGE_REQUIRED:0 "@warning_icon! 관련 지식 필요"
 RRF_KNOWLEDGE_TT:0 "알 수 없는 항목은 선택할 수 없을 수 있습니다. 현재 의식에 이미 포함된 핵심 교훈은 유지할 수 있습니다. 예언자 특성은 교리 지식 요건을 충족합니다. 그 밖의 제한도 그대로 적용됩니다."
 RRF_ADOPTION_PREVIEW:0 "You adopt the result. Eligible close family may follow through the usual conversion rules. After customization, preview and invite vassals, who respond under the native interaction rules. Unselected former core tenets may remain permitted."
 RRF_COMMITTING:0 "결과를 생성하고 검증하는 중입니다. 다시 제출할 수 없습니다."
 RRF_UNRESOLVED:0 "@warning_icon! 결과 검증을 완료하지 못했지만 실제 결과의 참조는 보존했습니다. 같은 융합을 다시 제출하지 마세요. 검사를 위해 현재 세이브를 보관하십시오."
 RRF_CANCEL:0 "취소"
 RRF_CANCEL_TT:0 "의식을 생성하거나 경건도를 소모하지 않고 초안을 닫습니다. 제출 중이거나 결과가 미해결된 경우 취소할 수 없습니다."
 RRF_REFRESH:0 "선택 항목 검사"
 RRF_REFRESH_TT:0 "현재 출처, 선택 항목 및 요구 조건을 다시 검사합니다. 아무것도 생성하거나 경건도를 소모하지 않습니다."
 RRF_COMMIT:0 "Create and Customize"
 RRF_COMMIT_TT:0 "Create and adopt a new rite with the selected core tenets and doctrines, paying the fusion fee once. Then customize its names, icon, color and extension doctrines for free."
 RRF_SUBMISSION_REFUSED:0 "융합 요구 조건이 변경됨"
 RRF_SUBMISSION_REFUSED_DESC:0 "전체 초안이 융합 요구 조건을 더 이상 충족하지 않아 이번 제출에서는 결과가 생성되지 않았습니다. 융합 창에서 요구 조건을 확인하고 선택 항목을 다시 검사하세요."
 RRF_FUSION_SUCCEEDED:0 "융합 완료"
 RRF_FUSION_SUCCEEDED_DESC:0 "You have adopted [GetPlayer.MakeScope.Var( 'rrf_last_result_rite' ).Rite.GetName]. The fusion fee has been settled and both sources recorded. You can now customize this rite's names, icon, color and extension doctrines for free, then inspect the vassal conversion preview."
 RRF_FUSION_UNRESOLVED:0 "융합 결과 검사 필요"
 RRF_FUSION_UNRESOLVED_DESC:0 "결과 검증을 완료하지 못했지만 실제 결과와 출처의 참조는 보존했으므로 이번 제출을 재시도하지 마세요. 기록된 비용: @piety_icon! [GetPlayer.MakeScope.Var( 'rrf_charged_cost' ).GetValue|0]. 검사를 위해 현재 세이브를 보관하십시오."
 rrf_view_last_fusion_decision:0 "최근 융합 보기"
 rrf_view_last_fusion_decision_desc:0 "결과: [GetPlayer.MakeScope.Var( 'rrf_last_result_rite' ).Rite.GetName]\n첫 번째 출처: [GetPlayer.MakeScope.Var( 'rrf_last_result_rite' ).Rite.MakeScope.Var( 'rrf_origin_a' ).Rite.GetName]\n두 번째 출처: [GetPlayer.MakeScope.Var( 'rrf_last_result_rite' ).Rite.MakeScope.Var( 'rrf_origin_b' ).Rite.GetName]\n\n이 참조는 융합을 생성할 때 기록된 실제 출처를 가리킵니다. 이 보기를 띄우면 아무것도 생성하거나 채택하지 않으며 경건도도 소모하지 않습니다."
 rrf_view_last_fusion_decision_tooltip:0 "최근 융합에 기록된 결과와 양쪽 출처를 읽습니다."
 rrf_view_last_fusion_decision_confirm:0 "기록 표시"
