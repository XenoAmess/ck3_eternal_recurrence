 RRF_REQUIRE_NO_PENDING:0 "검증을 기다리는 융합 제출이 없음"
 RRF_REQUIRE_SOURCE_CURRENT:0 "양쪽 출처가 여전히 존재하며 초안과 일치하고 현재 의식과 신앙이 변경되지 않음"
 RRF_REQUIRE_REVALIDATED:0 "현재 선택 항목을 검사함"
 RRF_REQUIRE_CONTENT_VALID:0 "전체 선택이 지식, DLC, 교리 제한 및 호환성 규칙을 충족함"
 RRF_REQUIRE_THREE_CORES:0 "At least three different core tenets are selected, within the current limit"
 RRF_REQUIRE_BOTH_SOURCES:0 "양쪽 출처가 각각 독보적인 최종 교훈 또는 교리를 최소 한 개씩 제공함"
