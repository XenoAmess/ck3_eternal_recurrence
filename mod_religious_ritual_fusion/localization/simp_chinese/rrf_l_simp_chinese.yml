l_simp_chinese:
 RRF_DISMISS_TT:0 "关闭草稿，或仅隐藏未决诊断；隐藏不会清除记录、解除未决状态或重试创建。"
 rrf_view_pending_fusion_decision:0 "查看未决融合"
 rrf_view_pending_fusion_decision_desc:0 "查看保留的融合来源、结果与已收费金额。此操作不会重试创建或收取费用。"
 rrf_view_pending_fusion_decision_tooltip:0 "重新显示保留的融合诊断。"
 rrf_view_pending_fusion_decision_confirm:0 "查看"
 RRF_REQUIRE_TENET_KNOWN:0 "从另一礼仪吸收核心信条前，须先学会它；已选信条始终可以取消。"
 RRF_REQUIRE_DOCTRINE_KNOWN:0 "须已知或已经践行该教义，或拥有先知技能。"
 rrf_begin_rite_fusion_decision:0 "融合宗教礼仪"
 rrf_begin_rite_fusion_decision_desc:0 "将我们当前的礼仪与同一信仰下的另一礼仪相融合。对照双方的核心信条与教义，选择新礼仪的根基。打开草稿不会消耗虔诚。"
 rrf_begin_rite_fusion_decision_tooltip:0 "选择同信仰的另一礼仪，作为新礼仪的来源"
 rrf_begin_rite_fusion_decision_confirm:0 "对照礼仪"
 rrf_begin_faith_fusion_decision:0 "融合宗教信仰"
 rrf_begin_faith_fusion_decision_desc:0 "将我们当前的礼仪与另一信仰的礼仪相融合，也可选择其他宗教的礼仪。新信仰将归属我们当前的宗教。知识、教义限制与互斥规则仍然适用。打开草稿不会消耗虔诚。"
 rrf_begin_faith_fusion_decision_tooltip:0 "选择另一信仰的礼仪，作为新信仰的来源"
 rrf_begin_faith_fusion_decision_confirm:0 "对照信仰"
 RRF_SELECT_SOURCE:0 "选择来源"
 RRF_WINDOW_TITLE:0 "宗教礼仪融合"
 RRF_MODE_RITE:0 "在当前信仰内创建新礼仪"
 RRF_MODE_FAITH:0 "在当前宗教内创建新信仰"
 RRF_RITE_COST:0 "费用：@piety_icon! [GuiScope.SetRoot( GetPlayer.MakeScope ).ScriptValue( 'rrf_rite_cost_value' )|0]"
 RRF_FAITH_COST:0 "费用：@piety_icon! [GuiScope.SetRoot( GetPlayer.MakeScope ).ScriptValue( 'rrf_faith_cost_value' )|0]"
 RRF_COST_TT:0 "新结果核验完成后，一次性收取这笔融合费用。成功融合后，该角色进入十年冷却。"
 RRF_SELECTION_GUIDANCE:0 "恰好选择三个不同的核心信条。双方必须各贡献至少一项独有的信条或教义；共同内容不能充当独有贡献。"
 RRF_SOURCE_A:0 "我们的礼仪"
 RRF_SOURCE_B:0 "另一来源"
 RRF_SOURCE_CORE_TENETS:0 "当前核心信条"
 RRF_CANDIDATE_TENETS:0 "选择核心信条"
 RRF_SELECTED_TENET_COUNT:0 "已选 [GetDataModelSize( GetPlayer.MakeScope.GetList( 'rrf_selected_tenets' ) )]/3 项核心信条"
 RRF_CANDIDATE_DOCTRINES:0 "选择教义"
 RRF_DOCTRINE_GUIDANCE:0 "每组选择一项教义。选择同组的另一项时，将替换该组原来的选择。"
 RRF_FINAL_CORE_PREVIEW:0 "已选核心信条"
 RRF_CONTRIBUTION_OK:0 "#P 已选择该方独有的内容#!"
 RRF_CONTRIBUTION_MISSING:0 "#X 仍需该方独有的内容#!"
 RRF_CONTRIBUTION_TT:0 "最终的核心信条或教义中，至少一项必须仅来自该来源。双方共有的选项不能满足独有贡献要求。"
 RRF_KNOWLEDGE_REQUIRED:0 "@warning_icon! 需要相关知识"
 RRF_KNOWLEDGE_TT:0 "未知内容可能无法选择。我们当前礼仪已有的核心信条可以保留；先知技能可满足教义知识要求。其他限制仍然适用。"
 RRF_ADOPTION_PREVIEW:0 "核验结果后由创始者采用。不会强制双方的全部信徒、封臣或领地改宗。未选中的原核心信条可能继续保留为获准。"
 RRF_COMMITTING:0 "正在创建并核验结果，已禁用再次提交。"
 RRF_UNRESOLVED:0 "@warning_icon! 尚未完成结果核验，已保留实际结果的引用。请勿再次提交同一次融合；请保留当前存档以供检查。"
 RRF_CANCEL:0 "取消"
 RRF_CANCEL_TT:0 "关闭草稿，不创建礼仪，也不收取虔诚。正在提交或结果未决时不能取消。"
 RRF_REFRESH:0 "检查选项"
 RRF_REFRESH_TT:0 "重新检查当前来源、选项与要求。不会创建内容或收取虔诚。"
 RRF_COMMIT:0 "创建融合结果"
 RRF_COMMIT_TT:0 "重新核验完整草稿，只创建一次结果；确认结果后才收取虔诚并采用。尚未满足的要求显示于上方。"
 RRF_SUBMISSION_REFUSED:0 "融合要求已变化"
 RRF_SUBMISSION_REFUSED_DESC:0 "完整草稿已不满足融合要求，本次提交没有创建结果。请查看融合窗口中的要求，并重新检查选项。"
 RRF_FUSION_SUCCEEDED:0 "融合完成"
 RRF_FUSION_SUCCEEDED_DESC:0 "你已采用[GetPlayer.MakeScope.Var( 'rrf_last_result_rite' ).Rite.GetName]，结果与双方来源均已记录。未选中的原核心信条可能继续保留为获准；采用结果时，原版改宗规则也可能影响近亲。"
 RRF_FUSION_UNRESOLVED:0 "融合结果需要检查"
 RRF_FUSION_UNRESOLVED_DESC:0 "尚未完成结果核验，已保留实际结果与来源的引用，请勿重试本次提交。本次费用记录：@piety_icon! [GetPlayer.MakeScope.Var( 'rrf_charged_cost' ).GetValue|0]。请保留当前存档以供检查。"
 rrf_view_last_fusion_decision:0 "查看最近的融合"
 rrf_view_last_fusion_decision_desc:0 "融合结果：[GetPlayer.MakeScope.Var( 'rrf_last_result_rite' ).Rite.GetName]\n第一来源：[GetPlayer.MakeScope.Var( 'rrf_last_result_rite' ).Rite.MakeScope.Var( 'rrf_origin_a' ).Rite.GetName]\n第二来源：[GetPlayer.MakeScope.Var( 'rrf_last_result_rite' ).Rite.MakeScope.Var( 'rrf_origin_b' ).Rite.GetName]\n\n以上引用指向创建融合时记录的实际来源。查看记录不会创建或采用任何结果，也不收取虔诚。"
 rrf_view_last_fusion_decision_tooltip:0 "读取最近一次融合所记录的结果与双方来源"
 rrf_view_last_fusion_decision_confirm:0 "显示记录"
 RRF_HISTORY_TITLE:0 "融合记录"
 RRF_REQUIRE_NO_COOLDOWN:0 "上次融合的十年冷却已经结束"
 RRF_REQUIRE_NO_PENDING:0 "没有尚待核验的融合提交"
 RRF_REQUIRE_SOURCE_CURRENT:0 "双方来源仍存在且与草稿一致，你的当前礼仪和信仰未改变"
 RRF_REQUIRE_REVALIDATED:0 "已检查当前选项"
 RRF_REQUIRE_CONTENT_VALID:0 "完整选择符合知识、DLC、教义限制与互斥规则"
 RRF_REQUIRE_THREE_CORES:0 "恰好选择三个不同的核心信条"
 RRF_REQUIRE_BOTH_SOURCES:0 "双方各贡献至少一项独有的最终信条或教义"
 RRF_REQUIRE_COST:0 "能够支付所示的融合费用"
 RRF_OPEN_FUSION_DRAFT:0 "打开融合草稿，选择核心信条和教义。"
