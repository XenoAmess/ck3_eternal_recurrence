l_german:
 RRF_DISMISS_TT:0 "Schließe den Entwurf oder blende nur ungeprüfte Diagnosen aus. Das Ausblenden löscht keine Aufzeichnungen, hebt keinen ausstehenden Status auf und versucht keine erneute Erstellung."
 rrf_view_pending_fusion_decision:0 "Ungeklärte Fusion prüfen"
 rrf_view_pending_fusion_decision_desc:0 "Prüfe die gespeicherten Fusionsquellen, das Ergebnis und den berechneten Betrag. Dies versucht weder eine erneute Erstellung noch eine Gebührenerhebung."
 rrf_view_pending_fusion_decision_tooltip:0 "Zeige die gespeicherten Fusionsdiagnosen an."
 rrf_view_pending_fusion_decision_confirm:0 "Prüfen"
 RRF_REQUIRE_TENET_KNOWN:0 "Du musst dieses Glaubensprinzip zuerst erlernen, bevor du es aus der anderen Zeremonie übernehmen kannst. Ausgewählte Prinzipien können jederzeit entfernt werden."
 RRF_REQUIRE_DOCTRINE_KNOWN:0 "Du musst diese Lehre kennen, bereits praktizieren oder den Vorteil „Prophet“ besitzen."
 rrf_begin_rite_fusion_decision:0 "Religiöse Zeremonien vereinen"
 rrf_begin_rite_fusion_decision_desc:0 "Vereine unsere aktuelle Zeremonie mit einer anderen Zeremonie desselben Glaubens. Vergleiche ihre zentralen Prinzipien und Lehren und wähle die Grundlage der neuen Zeremonie. Das Öffnen des Entwurfs kostet keine Frömmigkeit."
 rrf_begin_rite_fusion_decision_tooltip:0 "Wähle eine andere Zeremonie unseres Glaubens als Quelle für eine neue Zeremonie"
 rrf_begin_rite_fusion_decision_confirm:0 "Zeremonien vergleichen"
 rrf_begin_faith_fusion_decision:0 "Glaubensrichtungen vereinen"
 rrf_begin_faith_fusion_decision_desc:0 "Vereine unsere aktuelle Zeremonie mit einer Zeremonie eines anderen Glaubens, auch aus einer anderen Religion. Der neue Glaube gehört unserer aktuellen Religion. Wissen, Lehrbeschränkungen und unvereinbare Auswahlmöglichkeiten gelten weiterhin. Das Öffnen des Entwurfs kostet keine Frömmigkeit."
 rrf_begin_faith_fusion_decision_tooltip:0 "Wähle eine Zeremonie eines anderen Glaubens als Quelle für einen neuen Glauben"
 rrf_begin_faith_fusion_decision_confirm:0 "Glaubensrichtungen vergleichen"
 RRF_SELECT_SOURCE:0 "Quelle wählen"
 RRF_WINDOW_TITLE:0 "Fusion religiöser Zeremonien"
 RRF_MODE_RITE:0 "Neue Zeremonie in unserem Glauben"
 RRF_MODE_FAITH:0 "Neuer Glaube in unserer Religion"
 RRF_RITE_COST:0 "Kosten: @piety_icon! [GuiScope.SetRoot( GetPlayer.MakeScope ).ScriptValue( 'rrf_rite_cost_value' )|0]"
 RRF_FAITH_COST:0 "Kosten: @piety_icon! [GuiScope.SetRoot( GetPlayer.MakeScope ).ScriptValue( 'rrf_faith_cost_value' )|0]"
 RRF_COST_TT:0 "Diese Fusionsgebühr wird einmalig nach der Überprüfung des neuen Ergebnisses berechnet. Nach erfolgreicher Fusion beginnt für diese Figur eine zehnjährige Abklingzeit."
 RRF_SELECTION_GUIDANCE:0 "Wähle genau drei verschiedene zentrale Prinzipien. Beide Quellen müssen jeweils mindestens ein uniques Prinzip oder eine unique Lehre beitragen; gemeinsame Inhalte zählen nicht als einzigartiger Beitrag."
 RRF_SOURCE_A:0 "Unsere Zeremonie"
 RRF_SOURCE_B:0 "Andere Quelle"
 RRF_SOURCE_CORE_TENETS:0 "Aktuelle zentrale Prinzipien"
 RRF_CANDIDATE_TENETS:0 "Zentrale Prinzipien wählen"
 RRF_SELECTED_TENET_COUNT:0 "Ausgewählt: [GetDataModelSize( GetPlayer.MakeScope.GetList( 'rrf_selected_tenets' ) )]/3 zentrale Prinzipien"
 RRF_CANDIDATE_DOCTRINES:0 "Lehren wählen"
 RRF_DOCTRINE_GUIDANCE:0 "Wähle in jeder Gruppe eine Lehre. Die Auswahl einer anderen Option in derselben Gruppe ersetzt die bisherige Wahl."
 RRF_FINAL_CORE_PREVIEW:0 "Ausgewählte zentrale Prinzipien"
 RRF_CONTRIBUTION_OK:0 "#P Einzigartiger Beitrag ausgewählt#!"
 RRF_CONTRIBUTION_MISSING:0 "#X Ein einzigartiger Beitrag ist weiterhin erforderlich#!"
 RRF_CONTRIBUTION_TT:0 "Mindestens eines der endgültigen zentralen Prinzipien oder Lehren muss ausschließlich aus dieser Quelle stammen. Eine von beiden Quellen gemeinsam gewählte Option erfüllt diese Anforderung nicht."
 RRF_KNOWLEDGE_REQUIRED:0 "@warning_icon! Wissen erforderlich"
 RRF_KNOWLEDGE_TT:0 "Unbekannte Inhalte könnten nicht verfügbar sein. Ein bereits zentrales Prinzip unserer Zeremonie kann beibehalten werden. Der Vorteil „Prophet“ erfüllt die Wissensanforderung für Lehren. Weitere Einschränkungen gelten weiterhin."
 RRF_ADOPTION_PREVIEW:0 "Der Gründer übernimmt das überprüfte Ergebnis. Dadurch werden nicht alle Anhänger, Vasallen oder Grafschaften beider Quellen zur Konvertierung gezwungen. Nicht ausgewählte frühere zentrale Prinzipien können weiterhin zulässig bleiben."
 RRF_COMMITTING:0 "Ergebnis wird erstellt und überprüft. Weitere Übermittlungen sind deaktiviert."
 RRF_UNRESOLVED:0 "@warning_icon! Das Ergebnis konnte nicht vollständig überprüft werden. Bestehende Ergebnisverweise wurden beibehalten. Übermittle dieselbe Fusion nicht erneut; bewahre den aktuellen Spielstand zur Prüfung auf."
 RRF_CANCEL:0 "Abbrechen"
 RRF_CANCEL_TT:0 "Schließe den Entwurf, ohne eine Zeremonie zu erstellen oder Frömmigkeit zu berechnen. Eine ausstehende oder ungeklärte Übermittlung kann nicht abgebrochen werden."
 RRF_REFRESH:0 "Auswahl überprüfen"
 RRF_REFRESH_TT:0 "Prüfe die aktuellen Quellen, Auswahlen und Anforderungen erneut. Dadurch wird nichts erstellt und keine Frömmigkeit berechnet."
 RRF_COMMIT:0 "Fusion erstellen"
 RRF_COMMIT_TT:0 "Prüfe den vollständigen Entwurf erneut, erstelle das Ergebnis einmalig und überprüfe es, bevor Frömmigkeit berechnet und es übernommen wird. Nicht erfüllte Anforderungen werden oben angezeigt."
 RRF_SUBMISSION_REFUSED:0 "Fusionsanforderungen haben sich geändert"
 RRF_SUBMISSION_REFUSED_DESC:0 "Der vollständige Entwurf erfüllt die Fusionsanforderungen nicht mehr. Bei dieser Übermittlung wurde kein Ergebnis erstellt. Prüfe die Anforderungen im Fusionsfenster und überprüfe deine Auswahl erneut."
 RRF_FUSION_SUCCEEDED:0 "Fusion abgeschlossen"
 RRF_FUSION_SUCCEEDED_DESC:0 "Du hast [GetPlayer.MakeScope.Var( 'rrf_last_result_rite' ).Rite.GetName] übernommen. Das Ergebnis und beide Quellen wurden aufgezeichnet. Nicht ausgewählte frühere zentrale Prinzipien können weiterhin zulässig bleiben. Bei der Übernahme können durch die üblichen Konvertierungsregeln auch nahe Verwandte betroffen sein."
 RRF_FUSION_UNRESOLVED:0 "Fusionsergebnis muss geprüft werden"
 RRF_FUSION_UNRESOLVED_DESC:0 "Das Ergebnis konnte nicht vollständig überprüft werden. Verweise auf das tatsächliche Ergebnis und seine Quellen wurden beibehalten; versuche diese Übermittlung nicht erneut. Aufgezeichnete Kosten: @piety_icon! [GetPlayer.MakeScope.Var( 'rrf_charged_cost' ).GetValue|0]. Bewahre den aktuellen Spielstand zur Prüfung auf."
 rrf_view_last_fusion_decision:0 "Letzte Fusion ansehen"
 rrf_view_last_fusion_decision_desc:0 "Ergebnis: [GetPlayer.MakeScope.Var( 'rrf_last_result_rite' ).Rite.GetName]\nErste Quelle: [GetPlayer.MakeScope.Var( 'rrf_last_result_rite' ).Rite.MakeScope.Var( 'rrf_origin_a' ).Rite.GetName]\nZweite Quelle: [GetPlayer.MakeScope.Var( 'rrf_last_result_rite' ).Rite.MakeScope.Var( 'rrf_origin_b' ).Rite.GetName]\n\nDiese Verweise bezeichnen die bei der Erstellung der Fusion aufgezeichneten tatsächlichen Quellen. Diese Ansicht erstellt oder übernimmt nichts und berechnet keine Frömmigkeit."
 rrf_view_last_fusion_decision_tooltip:0 "Lese das Ergebnis und die beiden Quellen deiner letzten Fusion"
 rrf_view_last_fusion_decision_confirm:0 "Aufzeichnung anzeigen"
 RRF_HISTORY_TITLE:0 "Fusionsaufzeichnung"
 RRF_REQUIRE_NO_COOLDOWN:0 "Die zehnjährige Abklingzeit deiner letzten Fusion ist abgelaufen"
 RRF_REQUIRE_NO_PENDING:0 "Es gibt keine Fusionsübermittlung, die auf Überprüfung wartet"
 RRF_REQUIRE_SOURCE_CURRENT:0 "Beide Quellen bestehen weiterhin und stimmen mit diesem Entwurf überein; deine Zeremonie und dein Glaube haben sich nicht geändert"
 RRF_REQUIRE_REVALIDATED:0 "Die aktuellen Auswahlen wurden überprüft"
 RRF_REQUIRE_CONTENT_VALID:0 "Die vollständige Auswahl erfüllt die Wissens-, DLC-, Lehr- und Kompatibilitätsanforderungen"
 RRF_REQUIRE_THREE_CORES:0 "Es sind genau drei verschiedene zentrale Prinzipien ausgewählt"
 RRF_REQUIRE_BOTH_SOURCES:0 "Beide Quellen tragen jeweils mindestens ein uniques finales Prinzip oder eine unique finale Lehre bei"
 RRF_REQUIRE_COST:0 "Du kannst die angezeigten Fusionskosten bezahlen"
 RRF_OPEN_FUSION_DRAFT:0 "Öffne den Fusionsentwurf, um zentrale Prinzipien und Lehren auszuwählen."
