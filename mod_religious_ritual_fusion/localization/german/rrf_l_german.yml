l_german:
 RRF_DISMISS_TT:0 "Schließe den Entwurf oder blende nur ungeprüfte Diagnosen aus. Das Ausblenden löscht keine Aufzeichnungen, hebt keinen ausstehenden Status auf und versucht keine erneute Erstellung."
 rrf_view_pending_fusion_decision:0 "Ungeklärte Fusion prüfen"
 rrf_view_pending_fusion_decision_desc:0 "Prüfe die gespeicherten Fusionsquellen, das Ergebnis und den berechneten Betrag. Dies versucht weder eine erneute Erstellung noch eine Gebührenerhebung."
 rrf_view_pending_fusion_decision_tooltip:0 "Zeige die gespeicherten Fusionsdiagnosen an."
 rrf_view_pending_fusion_decision_confirm:0 "Prüfen"
 RRF_REQUIRE_TENET_KNOWN:0 "Du musst dieses Glaubensprinzip zuerst erlernen, bevor du es aus der anderen Zeremonie übernehmen kannst. Ausgewählte Prinzipien können jederzeit entfernt werden."
 RRF_REQUIRE_DOCTRINE_KNOWN:0 "Du musst diese Lehre kennen, bereits praktizieren oder den Vorteil „Prophet“ besitzen."
 rrf_begin_rite_fusion_decision:0 "Fuse Rites of Our Faith"
 rrf_begin_rite_fusion_decision_desc:0 "Vereine unsere aktuelle Zeremonie mit einer anderen Zeremonie desselben Glaubens. Vergleiche ihre zentralen Prinzipien und Lehren und wähle die Grundlage der neuen Zeremonie. Das Öffnen des Entwurfs kostet keine Frömmigkeit."
 rrf_begin_rite_fusion_decision_tooltip:0 "Wähle eine andere Zeremonie unseres Glaubens als Quelle für eine neue Zeremonie"
 rrf_begin_rite_fusion_decision_confirm:0 "Zeremonien vergleichen"
 rrf_begin_faith_fusion_decision:0 "Fuse Other Rites"
 rrf_begin_faith_fusion_decision_desc:0 "Vereine unsere aktuelle Zeremonie mit einer Zeremonie eines anderen Glaubens, auch aus einer anderen Religion. Der neue Glaube gehört unserer aktuellen Religion. Wissen, Lehrbeschränkungen und unvereinbare Auswahlmöglichkeiten gelten weiterhin. Das Öffnen des Entwurfs kostet keine Frömmigkeit."
 rrf_begin_faith_fusion_decision_tooltip:0 "Wähle eine Zeremonie eines anderen Glaubens als Quelle für einen neuen Glauben"
 rrf_begin_faith_fusion_decision_confirm:0 "Glaubensrichtungen vergleichen"
 RRF_SELECT_SOURCE:0 "Quelle wählen"
 RRF_WINDOW_TITLE:0 "Fusion religiöser Zeremonien"
 RRF_MODE_RITE:0 "Neue Zeremonie in unserem Glauben"
 RRF_MODE_FAITH:0 "Neuer Glaube in unserer Religion"
 RRF_RITE_COST:0 "Kosten: @piety_icon! [GuiScope.SetRoot( GetPlayer.MakeScope ).ScriptValue( 'rrf_rite_cost_value' )|0]"
 RRF_FAITH_COST:0 "Kosten: @piety_icon! [GuiScope.SetRoot( GetPlayer.MakeScope ).ScriptValue( 'rrf_faith_cost_value' )|0]"
 RRF_COST_TT:0 "Successful fusion charges this fee once and starts a ten-year cooldown. The following customization of the new rite's names, icon, color and extension doctrines is free."
 RRF_SELECTION_GUIDANCE:0 "Choose 3 to [GetPlayer.MakeScope.Var( 'rrf_core_limit' ).GetValue|0] different core tenets. Each source must contribute at least one unique tenet or doctrine; shared content does not count as a unique contribution."
 RRF_SOURCE_A:0 "Unsere Zeremonie"
 RRF_SOURCE_B:0 "Andere Quelle"
 RRF_SOURCE_CORE_TENETS:0 "Aktuelle zentrale Prinzipien"
 RRF_CANDIDATE_TENETS:0 "Zentrale Prinzipien wählen"
 RRF_SELECTED_TENET_COUNT:0 "Selected: [GetDataModelSize( GetPlayer.MakeScope.GetList( 'rrf_selected_tenets' ) )] · Limit: [GetPlayer.MakeScope.Var( 'rrf_core_limit' ).GetValue|0]"
 RRF_CANDIDATE_DOCTRINES:0 "Lehren wählen"
 RRF_DOCTRINE_GUIDANCE:0 "Wähle in jeder Gruppe eine Lehre. Die Auswahl einer anderen Option in derselben Gruppe ersetzt die bisherige Wahl."
 RRF_FINAL_CORE_PREVIEW:0 "Ausgewählte zentrale Prinzipien"
 RRF_CONTRIBUTION_OK:0 "#P Einzigartiger Beitrag ausgewählt#!"
 RRF_CONTRIBUTION_MISSING:0 "#X Ein einzigartiger Beitrag ist weiterhin erforderlich#!"
 RRF_CONTRIBUTION_TT:0 "Mindestens eines der endgültigen zentralen Prinzipien oder Lehren muss ausschließlich aus dieser Quelle stammen. Eine von beiden Quellen gemeinsam gewählte Option erfüllt diese Anforderung nicht."
 RRF_KNOWLEDGE_REQUIRED:0 "@warning_icon! Wissen erforderlich"
 RRF_KNOWLEDGE_TT:0 "Unbekannte Inhalte könnten nicht verfügbar sein. Ein bereits zentrales Prinzip unserer Zeremonie kann beibehalten werden. Der Vorteil „Prophet“ erfüllt die Wissensanforderung für Lehren. Weitere Einschränkungen gelten weiterhin."
 RRF_ADOPTION_PREVIEW:0 "You adopt the result. Eligible close family may follow through the usual conversion rules. After customization, preview and invite vassals, who respond under the native interaction rules. Unselected former core tenets may remain permitted."
 RRF_COMMITTING:0 "Ergebnis wird erstellt und überprüft. Weitere Übermittlungen sind deaktiviert."
 RRF_UNRESOLVED:0 "@warning_icon! Das Ergebnis konnte nicht vollständig überprüft werden. Bestehende Ergebnisverweise wurden beibehalten. Übermittle dieselbe Fusion nicht erneut; bewahre den aktuellen Spielstand zur Prüfung auf."
 RRF_CANCEL:0 "Abbrechen"
 RRF_CANCEL_TT:0 "Schließe den Entwurf, ohne eine Zeremonie zu erstellen oder Frömmigkeit zu berechnen. Eine ausstehende oder ungeklärte Übermittlung kann nicht abgebrochen werden."
 RRF_REFRESH:0 "Auswahl überprüfen"
 RRF_REFRESH_TT:0 "Prüfe die aktuellen Quellen, Auswahlen und Anforderungen erneut. Dadurch wird nichts erstellt und keine Frömmigkeit berechnet."
 RRF_COMMIT:0 "Create and Customize"
 RRF_COMMIT_TT:0 "Create and adopt a new rite with the selected core tenets and doctrines, paying the fusion fee once. Then customize its names, icon, color and extension doctrines for free."
 RRF_SUBMISSION_REFUSED:0 "Fusionsanforderungen haben sich geändert"
 RRF_SUBMISSION_REFUSED_DESC:0 "Der vollständige Entwurf erfüllt die Fusionsanforderungen nicht mehr. Bei dieser Übermittlung wurde kein Ergebnis erstellt. Prüfe die Anforderungen im Fusionsfenster und überprüfe deine Auswahl erneut."
 RRF_FUSION_SUCCEEDED:0 "Fusion abgeschlossen"
 RRF_FUSION_SUCCEEDED_DESC:0 "You have adopted [GetPlayer.MakeScope.Var( 'rrf_last_result_rite' ).Rite.GetName]. The fusion fee has been settled and both sources recorded. You can now customize this rite's names, icon, color and extension doctrines for free, then inspect the vassal conversion preview."
 RRF_FUSION_UNRESOLVED:0 "Fusionsergebnis muss geprüft werden"
 RRF_FUSION_UNRESOLVED_DESC:0 "Das Ergebnis konnte nicht vollständig überprüft werden. Verweise auf das tatsächliche Ergebnis und seine Quellen wurden beibehalten; versuche diese Übermittlung nicht erneut. Aufgezeichnete Kosten: @piety_icon! [GetPlayer.MakeScope.Var( 'rrf_charged_cost' ).GetValue|0]. Bewahre den aktuellen Spielstand zur Prüfung auf."
 rrf_view_last_fusion_decision:0 "Letzte Fusion ansehen"
 rrf_view_last_fusion_decision_desc:0 "Ergebnis: [GetPlayer.MakeScope.Var( 'rrf_last_result_rite' ).Rite.GetName]\nErste Quelle: [GetPlayer.MakeScope.Var( 'rrf_last_result_rite' ).Rite.MakeScope.Var( 'rrf_origin_a' ).Rite.GetName]\nZweite Quelle: [GetPlayer.MakeScope.Var( 'rrf_last_result_rite' ).Rite.MakeScope.Var( 'rrf_origin_b' ).Rite.GetName]\n\nDiese Verweise bezeichnen die bei der Erstellung der Fusion aufgezeichneten tatsächlichen Quellen. Diese Ansicht erstellt oder übernimmt nichts und berechnet keine Frömmigkeit."
 rrf_view_last_fusion_decision_tooltip:0 "Lese das Ergebnis und die beiden Quellen deiner letzten Fusion"
 rrf_view_last_fusion_decision_confirm:0 "Aufzeichnung anzeigen"
 RRF_HISTORY_TITLE:0 "Fusionsaufzeichnung"
 RRF_REQUIRE_NO_COOLDOWN:0 "Die zehnjährige Abklingzeit deiner letzten Fusion ist abgelaufen"
 RRF_REQUIRE_NO_PENDING:0 "Es gibt keine Fusionsübermittlung, die auf Überprüfung wartet"
 RRF_REQUIRE_SOURCE_CURRENT:0 "Beide Quellen bestehen weiterhin und stimmen mit diesem Entwurf überein; deine Zeremonie und dein Glaube haben sich nicht geändert"
 RRF_REQUIRE_REVALIDATED:0 "Die aktuellen Auswahlen wurden überprüft"
 RRF_REQUIRE_CONTENT_VALID:0 "Die vollständige Auswahl erfüllt die Wissens-, DLC-, Lehr- und Kompatibilitätsanforderungen"
 RRF_REQUIRE_THREE_CORES:0 "At least three different core tenets are selected, within the current limit"
 RRF_REQUIRE_BOTH_SOURCES:0 "Beide Quellen tragen jeweils mindestens ein uniques finales Prinzip oder eine unique finale Lehre bei"
 RRF_REQUIRE_COST:0 "Du kannst die angezeigten Fusionskosten bezahlen"
 RRF_OPEN_FUSION_DRAFT:0 "Öffne den Fusionsentwurf, um zentrale Prinzipien und Lehren auszuwählen."
 decision_group_type_rrf_fusion:0 "Religious and Ritual Fusion"
 RRF_REQUIRE_SAME_FAITH_SOURCE:0 "Another adoptable rite exists within our faith"
 RRF_REQUIRE_OTHER_FAITH_SOURCE:0 "An adoptable rite exists in another faith"
 RRF_REQUIRE_CORE_RANGE:0 "Select 3 to [GetPlayer.MakeScope.Var( 'rrf_core_limit' ).GetValue|0] distinct core tenets"
 RRF_REQUIRE_CORE_CAPACITY:0 "The [GetPlayer.MakeScope.Var( 'rrf_core_limit' ).GetValue|0]-tenet limit has not been reached; selected tenets can still be removed"
 RRF_TAB_TENETS:0 "Core Tenets"
 RRF_TAB_DOCTRINES:0 "Doctrines"
 RRF_TAB_IDENTITY:0 "Fusion Effects"
 RRF_TENET_LIMIT_TT:0 "Choose at least 3, up to [GetPlayer.MakeScope.Var( 'rrf_core_limit' ).GetValue|0] core tenets. A compatible More Tenets mod expands the limit to 100. Only real tenets held by the two sources appear here."
 RRF_RESULT_TITLE:0 "Fusion Preview"
 RRF_RESULT_NAME_DEFAULT:0 "New Fused Rite"
 RRF_RESULT_NAME_NEXT_STEP:0 "Customize all four names after creation"
 RRF_RESULT_ICON_INHERITED:0 "Choose an icon and map color after creation"
 RRF_COST_AND_COOLDOWN:0 "Cost and Cooldown"
 RRF_COOLDOWN_PREVIEW:0 "On success: ten-year fusion cooldown"
 RRF_COMMIT_BLOCKED_TITLE:0 "Unmet Requirements"
 RRF_CONVERSION_TITLE:0 "Adoption and Conversion"
 RRF_POST_SETUP_GUIDANCE:0 "After choosing the fusion content, use the native controls to customize this new rite's name, adjective, adherent name and plural adherent name, icon and map color. Extension options in standard doctrine groups are available, with a live virtues and sins preview. This customization is included in the fusion fee."
 RRF_FAMILY_PREVIEW:0 "Close Family Conversion Preview"
 RRF_FAMILY_GUIDANCE:0 "These close family members currently meet the native conditions for following their founder's conversion. Actual conversion occurs when you adopt the new rite and depends on their state and event processing at that time."
 RRF_CONVERSION_PREVIEW_EMPTY:0 "No characters currently meet the preview conditions."
 RRF_REQUIRE_OWN_FUSION_RESULT:0 "You currently follow the new fusion rite recorded with you as its founder"
 RRF_REQUIRE_FREE_SETUP_SESSION:0 "This fusion's free customization session is still active"
 RRF_NO_SECOND_NATIVE_CREATION:0 "Finish customizing the current fusion rite first; this step only edits the existing result"
 rrf_native_setup_cost_waiver:0 "Free Fusion Rite Customization"
 rrf_native_setup_cost_waiver_desc:0 "The fusion fee has been paid. Completing customization of this new rite costs no further piety."
 RRF_NATIVE_SETUP_TITLE:0 "Customize the Fused Rite"
 RRF_NATIVE_SETUP_INTRO:0 "The new rite has been created and adopted, and the fusion fee settled. Use the native controls to finish its names, appearance and doctrines. This step edits the same rite. When changing doctrines, retain at least one originally selected exclusive contribution from each source. If you made no changes, keep the default configuration before requesting the first save confirmation."
 RRF_NATIVE_SETUP_NAMES_TAB:0 "Names and Color"
 RRF_NATIVE_SETUP_ICONS_TAB:0 "Faith Icon"
 RRF_NATIVE_SETUP_DOCTRINES_TAB:0 "Doctrines and Extensions"
 RRF_NATIVE_SETUP_SPECIAL_DOCTRINES:0 "Special Doctrines"
 RRF_NATIVE_SETUP_BELIEFS:0 "Virtues and Sins Preview"
 RRF_NATIVE_SETUP_LOCKED_CORES:0 "Chosen Fusion Tenets"
 RRF_NATIVE_SETUP_LOCKED_CORES_TT:0 "These core tenets were chosen in the fusion draft and remain fixed in this step. Ordinary doctrines and compatible mods' standard doctrine options can be adjusted on the left."
 RRF_NATIVE_SETUP_FREE:0 "This customization: Free"
 RRF_NATIVE_SETUP_BLOCKERS:0 "Unmet Requirements"
 RRF_NATIVE_SETUP_COST_NONZERO:0 "The native cost has not reached zero, so submission is unavailable. Preserve this save for inspection."
 RRF_NATIVE_SETUP_APPLY:0 "Save Customization"
 RRF_NATIVE_SETUP_APPLY_TT:0 "Save the current names, icon, color and doctrine settings to this fused rite. No further fusion fee is charged for this customization."
 RRF_NATIVE_SETUP_SKIP:0 "Keep Default Settings"
 RRF_NATIVE_SETUP_SKIP_TT:0 "Available only before first clicking Save Customization. Keep the settings from creation, end this free customization session and view conversion results; unsaved changes will be discarded. After opening the save confirmation, this option remains disabled even if you decline. Continue customization, make at least one change and save."
 RRF_RESULT_COMPLETE_TITLE:0 "Fused Rite"
 RRF_RESULT_COMPLETE_GUIDANCE:0 "These are the new rite's actual settings. The close family list preserves candidates from adoption; their current rites reflect actual state. After customization, preview and invite vassals through native interactions, then refresh to inspect actual conversions."
 RRF_RESULT_FAMILY:0 "Close Family Conversion Record"
 RRF_RESULT_ACCEPTS:0 "Vassals Expected to Accept"
 RRF_RESULT_DECLINES:0 "Vassals Expected to Decline"
 RRF_RESULT_INELIGIBLE:0 "Currently Ineligible Vassals"
 RRF_RESULT_PLAYERS:0 "Vassals Requiring a Player Response"
 RRF_RESULT_CONVERTED:0 "Confirmed Conversions"
 RRF_RESULT_PENDING:0 "Conversion Not Yet Confirmed"
 RRF_INVITE_VASSALS:0 "Invite Previewed Vassals"
 RRF_INVITE_VASSALS_TT:0 "Start native conversion interactions with the previewed vassals expected to accept and player vassals. Native interaction costs may apply, and eligibility is checked again. Responses and actual conversions depend on the resulting state. Attempted invitations with unknown results are not retried."
 RRF_REFRESH_RESULT:0 "Refresh Conversion Preview"
 RRF_REFRESH_RESULT_TT:0 "Read characters' current rites and update the vassal preview using native interaction eligibility and acceptance rules. This does not send invitations."
 RRF_RESULT_CLOSE:0 "Close"
 RRF_RESULT_EMPTY:0 "None"
 RRF_RESUME_SETUP:0 "Continue Fusion Rite Customization"
 RRF_RESUME_SETUP_TT:0 "Resume this fusion rite's unfinished free customization without creating another rite."
 RRF_VIEW_RESULT:0 "View Fusion and Conversion Results"
 RRF_VIEW_RESULT_TT:0 "Inspect the actual fused rite, close family record and vassal conversion preview. Opening this window costs nothing and sends no invitations."
 RRF_CONVERSION_REQUIRE_CONFIGURED_RESULT:0 "You still follow the fusion rite you founded and have completed its customization"
 RRF_CONVERSION_REQUIRE_CURRENT_VASSAL:0 "The target is still your living direct vassal and does not follow your rite"
 RRF_CONVERSION_NATIVE_UNAVAILABLE:0 "The target meets the native conversion interaction's current eligibility and cost requirements"
 RRF_CONVERSION_REQUIRE_PREVIEW:0 "The current fusion result has a preview of vassals expected to accept or awaiting a player response"
 RRF_NATIVE_SETUP_DEFER:0 "Customize Later"
 RRF_NATIVE_SETUP_DEFER_TT:0 "The new rite has been created, but customization is unfinished. Unsaved changes will be discarded. Resume this free customization through the fusion record within one year of the fusion. Native rite creation is unavailable until this session ends."
 RRF_FINAL_CONFIGURATION_INVALID:0 "Fusion Settings Still Conflict"
 RRF_FINAL_CONFIGURATION_INVALID_DESC:0 "The final core tenets must exactly match the first step, and each source must retain at least one unique tenet or doctrine selected then. Continue customization and correct doctrine choices that removed this content. The fusion fee will not be charged again."
