l_japanese:
 decision_group_type_ervc_courtier_creator:0 "@ervc_decision_group_icon! Eternal Recurrence: Glassfire Courtier Creator - Vivhite Edition"
 ervc_courtier_creator_decision:0 "琉焰の廷臣を誂える"
 ervc_courtier_creator_decision_desc:0 "琉焰卿に、廷臣の肉体、才覚、特性、出自、血統を望みどおりに形作らせる。あらゆる細工には対価があり、完成した魂はあなたの宮廷に加わる。"
 ervc_courtier_creator_decision_tooltip:0 "有料の特注廷臣を設計し、仕立てを依頼する"
 ervc_courtier_creator_decision_confirm:0 "委嘱の契頁を開く"
 ervc.cc.title:0 "委嘱される魂"
 ervc.cc.intro:0 "旅人よ、宮廷には必ず空席が一つあるものです。玉座の傍にどんな温もりを据えたいかお選びください。魂が一歩を踏み入れたその時に、初めて代価を頂戴いたします。"
 ervc.cc.tab.basic:0 "基本"
 ervc.cc.tab.education:0 "教育"
 ervc.cc.tab.commander:0 "統率"
 ervc.cc.tab.physical:0 "血と骨"
 ervc.cc.tab.personality:0 "気質"
 ervc.cc.tab.other:0 "その他の特性"
 ervc.cc.tab.origin:0 "出自"
 ervc.cc.sex:0 "性別"
 ervc.cc.age:0 "年齢"
 ervc.cc.skill.diplomacy:0 "外交"
 ervc.cc.skill.martial:0 "軍事"
 ervc.cc.skill.stewardship:0 "管理"
 ervc.cc.skill.intrigue:0 "策略"
 ervc.cc.skill.learning:0 "学識"
 ervc.cc.skill.prowess:0 "武勇"
 ervc.cc.numeric.minus_10:0 "-10"
 ervc.cc.numeric.minus_1:0 "-1"
 ervc.cc.numeric.plus_1:0 "+1"
 ervc.cc.numeric.plus_10:0 "+10"
 ervc.cc.base_stats:0 "年齢は0から120まで正確に調整できる。6本の読み取り専用バーは、補正前の基本能力を0から100まで正確に示す。ステップボタンで調整すること。価格はゲーム本体の統治者デザイナーと同じ非線形の絶対値曲線に従い、その後に教育と特性の補正が加わる。"
 ervc.cc.education.help:0 "ゲーム本体の教育特性をすべて掲載している。16歳以上の成人は必ず1つを選ぶ必要があり、子供には教育特性が付かない。"
 ervc.cc.commander.help:0 "ゲーム本体の指揮官特性17種をすべて掲載している。最大2つまで選択でき、それぞれ熟練度0の基礎段階から始まる。選択数：[GetPlayer.MakeScope.Var('ervc_cc_commander_count').GetValue|0]/2。"
 ervc.cc.physical.help:0 "通常は隠されている$trait_impotent$を含む、ゲーム本体の身体特性38種をすべて掲載している。互換性のある選択は組み合わせられる。"
 ervc.cc.personality.help:0 "ゲーム本体の性格特性36種をすべて掲載している。最大3つまで選択でき、対立する特性を選ぶと既存の反対側が置き換わる。選択数：[GetPlayer.MakeScope.Var('ervc_cc_personality_count').GetValue|0]/3。"
 ervc.cc.other.help:0 "統治者デザイナーに表示される、ゲーム本体の残り108種の特性を掲載している。強力な地位、健康、その他の重大な選択も含まれる。"
 ervc.cc.origin.help:0 "読み込まれたすべての文化と宗派から選び、その魂を庶民にするか、あなたの王朝と家門に加える。家門がなければ後者は選べない。"
 ervc.cc.culture:0 "文化"
 ervc.cc.faith:0 "宗派"
 ervc.cc.dynasty_house:0 "王朝と家門"
 ervc.cc.lowborn:0 "庶民"
 ervc.cc.same_house:0 "あなたの王朝と家門"
 ervc.cc.price:0 "代価 / 所持黄金"
 ervc.cc.confirm:0 "委嘱を封じる"
 ervc.cc.cancel:0 "頁を白紙のまま閉じる"
 ervc.cc.insufficient_gold:0 "現在の代価をお支払いいただけません。"
 ervc.cc.invalid_configuration:0 "求めし魂は内に矛盾を抱いております。"
 ervc.cc.toast.title:0 "委嘱は果たされた"
 ervc.cc.toast.desc:0 "新たに誂えられた廷臣が到着しました。"
