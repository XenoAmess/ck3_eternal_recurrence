l_simp_chinese:
 decision_group_type_ervc_courtier_creator:0 "@ervc_decision_group_icon! 琉焰卿的永恒轮回：典造琉焰廷臣·白绮特供版"
 ervc_courtier_creator_decision:0 "典造琉焰廷臣·白绮特供版"
 ervc_courtier_creator_decision_desc:0 "请琉焰卿依照你的心意，为宫廷塑成一具性别、年岁、才学、特质、来处与血脉皆可落笔的灵魂。每一笔雕琢都有价码；待它跨过门槛，便会侍立于你的庭中。"
 ervc_courtier_creator_decision_tooltip:0 "设计并付费典造一名自定义廷臣"
 ervc_courtier_creator_decision_confirm:0 "翻开典造契页"
 ervc.cc.title:0 "待价而塑的灵魂"
 ervc.cc.intro:0 "旅人，每座宫廷总有一把空椅。挑一份合意的温度，放在你的王座旁吧；等灵魂真正跨过门槛，我才会收账。"
 ervc.cc.tab.basic:0 "根骨"
 ervc.cc.tab.education:0 "教育"
 ervc.cc.tab.commander:0 "将才"
