 ervc.cc.numeric.plus_10:0 "+10"
 ervc.cc.base_stats:0 "Возраст задаётся точно от 0 до 120. Шесть полос только для чтения показывают неизменённые базовые навыки от 0 до 100; используй кнопки шага. Цены следуют нелинейной абсолютной кривой Редактора правителя из основной игры, после чего применяются модификаторы образования и свойств."
 ervc.cc.education.help:0 "Перечислены все свойства образования из основной игры. Взрослые от 16 лет должны иметь ровно одно; у детей свойство образования отсутствует."
 ervc.cc.commander.help:0 "Перечислены все 17 свойств командира из основной игры. Можно выбрать до двух; каждое начинается с базового мастерства и нулевого опыта. Выбрано: [GetPlayer.MakeScope.Var('ervc_cc_commander_count').GetValue|0]/2."
 ervc.cc.physical.help:0 "Перечислены все 38 физических свойств из основной игры, включая обычно скрытое $trait_impotent$. Совместимые варианты можно комбинировать."
 ervc.cc.personality.help:0 "Перечислены все 36 свойств характера из основной игры. Можно выбрать до трёх; выбор противоположного заменяет его аналог. Выбрано: [GetPlayer.MakeScope.Var('ervc_cc_personality_count').GetValue|0]/3."
 ervc.cc.other.help:0 "Здесь перечислены остальные 108 свойств из основной игры, видимых в Редакторе правителя. Среди них могущественные свойства статуса, здоровья и иные значимые варианты."
 ervc.cc.origin.help:0 "Выбери любую загруженную культуру и конфессию, затем сделай душу худородной или помести её в свою династию и дом. Последнее недоступно, если у тебя нет дома."
