 decision_group_type_ervc_courtier_creator:0 "@ervc_decision_group_icon! Вечное Перерождение: Создатель придворного Стеклянного Пламени - Издание Vivhite"
 ervc_courtier_creator_decision:0 "Заказать придворного Стеклянного Пламени"
 ervc_courtier_creator_decision_desc:0 "Попроси Владыку Стеклянного Пламени сотворить на заказ тело, таланты, свойства, происхождение и родословную придворного. Каждое усовершенствование имеет свою цену; готовая душа присоединится к твоему двору."
 ervc_courtier_creator_decision_tooltip:0 "Создай и закажи собственного придворного за плату"
 ervc_courtier_creator_decision_confirm:0 "Открыть заказ"
 ervc.cc.title:0 "Душа на заказ"
 ervc.cc.intro:0 "Странник, в каждом дворе есть пустой стул. Выбери, какое тепло должно сесть рядом с твоим троном; я беру плату лишь тогда, когда душа переступит порог."
