l_german:
 decision_group_type_ervc_courtier_creator:0 "@ervc_decision_group_icon! Ewige Wiederkehr: Glasfeuer-Höflingsschöpfer - Vivhite-Edition"
 ervc_courtier_creator_decision:0 "Beauftrage einen Glasfeuerhöfling"
 ervc_courtier_creator_decision_desc:0 "Bitte den Glasfeuerlord, Körper, Talente, Eigenschaften, Herkunft und Blutlinie eines Höflings nach Wunsch zu formen. Jede Verfeinerung hat ihren Preis; die vollendete Seele wird deinem Hof beitreten."
 ervc_courtier_creator_decision_tooltip:0 "Entwirf und beauftrage einen bezahlten Höfling nach Maß"
 ervc_courtier_creator_decision_confirm:0 "Auftrag eröffnen"
 ervc.cc.title:0 "Eine Seele auf Bestellung"
 ervc.cc.intro:0 "Reisender, jeder Hof hat einen leeren Stuhl. Wähle, welche Wärme neben deinem Thron sitzen soll; ich verlange erst, wenn die Seele eintritt."
 ervc.cc.tab.basic:0 "Grundlagen"
 ervc.cc.tab.education:0 "Ausbildung"
 ervc.cc.tab.commander:0 "Kommando"
 ervc.cc.tab.physical:0 "Blut und Knochen"
 ervc.cc.tab.personality:0 "Gemüt"
 ervc.cc.tab.other:0 "Sonstige Eigenschaften"
 ervc.cc.tab.origin:0 "Herkunft"
 ervc.cc.sex:0 "Geschlecht"
 ervc.cc.age:0 "Alter"
 ervc.cc.skill.diplomacy:0 "Diplomatie"
 ervc.cc.skill.martial:0 "Kriegsführung"
 ervc.cc.skill.stewardship:0 "Verwaltung"
 ervc.cc.skill.intrigue:0 "Ränkespiel"
 ervc.cc.skill.learning:0 "Bildung"
 ervc.cc.skill.prowess:0 "Kampfgeschick"
 ervc.cc.numeric.minus_10:0 "-10"
 ervc.cc.numeric.minus_1:0 "-1"
 ervc.cc.numeric.plus_1:0 "+1"
 ervc.cc.numeric.plus_10:0 "+10"
 ervc.cc.base_stats:0 "Das Alter lässt sich exakt von 0 bis 120 einstellen. Die sechs schreibgeschützten Balken zeigen die unveränderten Grundfertigkeiten exakt von 0 bis 100; nutze die Schritt-Schaltflächen. Die Preise folgen der nichtlinearen absoluten Kurve des Herrscher-Designers aus dem Grundspiel; Ausbildungs- und Eigenschaftsmodifikatoren werden danach angewendet."
 ervc.cc.education.help:0 "Alle Ausbildungseigenschaften des Grundspiels sind aufgelistet. Erwachsene ab 16 Jahren benötigen genau eine; Kinder haben keine Ausbildungseigenschaft."
 ervc.cc.commander.help:0 "Alle 17 Befehlshabereigenschaften des Grundspiels sind aufgelistet. Wähle bis zu zwei; jede beginnt mit Grundbeherrschung und null EP. Gewählt: [GetPlayer.MakeScope.Var('ervc_cc_commander_count').GetValue|0]/2."
 ervc.cc.physical.help:0 "Alle 38 körperlichen Eigenschaften des Grundspiels sind aufgelistet, einschließlich der normalerweise verborgenen $trait_impotent$. Verträgliche Wahlen können kombiniert werden."
 ervc.cc.personality.help:0 "Alle 36 Persönlichkeitseigenschaften des Grundspiels sind aufgelistet. Wähle bis zu drei; die Wahl eines Gegenteils ersetzt sein Gegenstück. Gewählt: [GetPlayer.MakeScope.Var('ervc_cc_personality_count').GetValue|0]/3."
 ervc.cc.other.help:0 "Die übrigen 108 im Herrscher-Designer sichtbaren Eigenschaften des Grundspiels sind hier aufgelistet. Sie umfassen mächtige Status-, Gesundheits- und andere folgenschwere Wahlen."
 ervc.cc.origin.help:0 "Wähle aus allen geladenen Kulturen und Glauben, dann gib der Seele eine niedrige Geburt oder füge sie deiner Dynastie und deinem Haus hinzu. Letzteres ist nicht verfügbar, wenn du kein Haus hast."
 ervc.cc.culture:0 "Kultur"
