l_polish:
 decision_group_type_ervc_courtier_creator:0 "@ervc_decision_group_icon! Eternal Recurrence: Glassfire Courtier Creator - Vivhite Edition"
 ervc_courtier_creator_decision:0 "Zamów dworzanina ze Szklanego Ognia"
 ervc_courtier_creator_decision_desc:0 "Poproś Władcę Szklanego Ognia, aby ukształtował na zamówienie ciało, talenty, cechy, pochodzenie i ród dworzanina. Każdy szlif ma swoją cenę; gotowa dusza dołączy do twojego dworu."
 ervc_courtier_creator_decision_tooltip:0 "Zaprojektuj i zamów płatnego, własnego dworzanina"
 ervc_courtier_creator_decision_confirm:0 "Otwórz zamówienie"
 ervc.cc.title:0 "Dusza na zamówienie"
 ervc.cc.intro:0 "Wędrowcze, w każdym dworze stoi puste krzesło. Wybierz, jakie ciepło ma zasiąść obok twojego tronu; pobieram zapłatę dopiero, gdy dusza stanie u progu."
