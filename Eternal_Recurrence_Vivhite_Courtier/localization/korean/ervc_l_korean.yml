 ervc.cc.skill.martial:0 "전투"
 ervc.cc.skill.stewardship:0 "관리"
 ervc.cc.skill.intrigue:0 "계책"
 ervc.cc.skill.learning:0 "학습"
 ervc.cc.skill.prowess:0 "기량"
 ervc.cc.numeric.minus_10:0 "-10"
 ervc.cc.numeric.minus_1:0 "-1"
 ervc.cc.numeric.plus_1:0 "+1"
 ervc.cc.numeric.plus_10:0 "+10"
 ervc.cc.base_stats:0 "나이는 0부터 120까지 정확히 조정할 수 있습니다. 읽기 전용 막대 여섯 개는 보정 전 기본 능력치를 0부터 100까지 정확히 보여 주며, 단계 버튼으로 조정합니다. 가격은 게임 본편 영주 생성기의 비선형 절대 곡선을 따르고, 교육과 특성 보정은 그 뒤에 적용됩니다."
 ervc.cc.education.help:0 "게임 본편의 교육 특성이 모두 나열됩니다. 16세 이상 성인은 정확히 하나가 필요하며, 어린이는 교육 특성이 없습니다."
 ervc.cc.commander.help:0 "게임 본편의 지휘관 특성 17개가 모두 나열됩니다. 최대 2개까지 선택할 수 있으며, 각각 경험치 0의 기본 숙련도에서 시작합니다. 선택: [GetPlayer.MakeScope.Var('ervc_cc_commander_count').GetValue|0]/2."
 ervc.cc.physical.help:0 "평소 숨겨진 $trait_impotent$를 포함하여 게임 본편의 육체 특성 38개가 모두 나열됩니다. 서로 호환되는 선택은 함께 적용할 수 있습니다."
 ervc.cc.personality.help:0 "게임 본편의 성격 특성 36개가 모두 나열됩니다. 최대 3개까지 선택할 수 있으며, 상반되는 특성을 고르면 기존 반대 특성이 대체됩니다. 선택: [GetPlayer.MakeScope.Var('ervc_cc_personality_count').GetValue|0]/3."
 ervc.cc.other.help:0 "영주 생성기에 표시되는 게임 본편의 나머지 특성 108개가 나열됩니다. 강력한 신분, 건강 등 중대한 선택도 포함됩니다."
 ervc.cc.origin.help:0 "불러온 모든 문화와 신앙에서 선택한 뒤, 그 영혼을 평민으로 두거나 당신의 가문과 집안에 넣습니다. 집안이 없다면 후자는 선택할 수 없습니다."
