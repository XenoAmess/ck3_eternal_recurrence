 ervc.cc.insufficient_gold:0 "현재 가격을 감당할 수 없습니다."
 ervc.cc.invalid_configuration:0 "요청한 영혼이 내부적으로 모순됩니다."
 ervc.cc.toast.title:0 "의뢰가 완료되었도다"
 ervc.cc.toast.desc:0 "새로 빚어진 궁정 신하가 도착하였습니다."
