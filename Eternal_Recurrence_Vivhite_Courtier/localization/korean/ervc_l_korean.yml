l_korean:
 decision_group_type_ervc_courtier_creator:0 "@ervc_decision_group_icon! Eternal Recurrence: Glassfire Courtier Creator - Vivhite Edition"
 ervc_courtier_creator_decision:0 "유리불꽃 궁정 신하 의뢰"
 ervc_courtier_creator_decision_desc:0 "유리불꽃 군주에게 신하의 몸, 재능, 특성, 출신과 혈통까지 주문대로 빚어 달라고 청합니다. 모든 다듬음에는 값이 따르며, 완성된 영혼은 당신의 궁정에 합류합니다."
 ervc_courtier_creator_decision_tooltip:0 "유료 맞춤 궁정 신하를 설계하고 의뢰합니다"
 ervc_courtier_creator_decision_confirm:0 "의뢰를 시작하다"
 ervc.cc.title:0 "의뢰 중인 영혼"
 ervc.cc.intro:0 "나그네, 어느 궁정이나 빈 자리가 있기 마련이옵니다. 옥좌 곁에 어떤 온기를 앉히고 싶으신지 고르시지요; 영혼이 문을 넘어설 때에야 값을 받겠사옵니다."
 ervc.cc.tab.basic:0 "기본"
 ervc.cc.tab.education:0 "교육"
 ervc.cc.tab.commander:0 "지휘"
 ervc.cc.tab.physical:0 "혈과 뼈"
 ervc.cc.tab.personality:0 "기질"
 ervc.cc.tab.other:0 "기타 특성"
 ervc.cc.tab.origin:0 "출신"
 ervc.cc.sex:0 "성별"
 ervc.cc.age:0 "연령"
