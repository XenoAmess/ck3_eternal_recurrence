l_french:
 decision_group_type_ervc_courtier_creator:0 "@ervc_decision_group_icon! Eternal Recurrence: Glassfire Courtier Creator - Vivhite Edition"
 ervc_courtier_creator_decision:0 "Commander un courtisan du Feu de Verre"
 ervc_courtier_creator_decision_desc:0 "Demande au Seigneur du Feu de Verre de façonner sur commande le corps, les talents, les traits, l'origine et la lignée d'un courtisan. Chaque raffinement a son prix ; l'âme achevée rejoindra ta cour."
 ervc_courtier_creator_decision_tooltip:0 "Concevoir et commander un courtisan personnalisé contre paiement"
 ervc_courtier_creator_decision_confirm:0 "Ouvrir la commande"
 ervc.cc.title:0 "Une âme sur commande"
 ervc.cc.intro:0 "Voyageur, toute cour a une chaise vide. Choisis quelle sorte de chaleur devrait s'asseoir près de ton trône ; je ne réclame mon dû que lorsque l'âme franchit le seuil."
 ervc.cc.tab.basic:0 "Essentiels"
 ervc.cc.tab.education:0 "Éducation"
 ervc.cc.tab.commander:0 "Commandement"
 ervc.cc.tab.physical:0 "Sang et os"
 ervc.cc.tab.personality:0 "Tempérament"
 ervc.cc.tab.other:0 "Autres traits"
 ervc.cc.tab.origin:0 "Origine"
 ervc.cc.sex:0 "Sexe"
 ervc.cc.age:0 "Âge"
 ervc.cc.skill.diplomacy:0 "Diplomatie"
 ervc.cc.skill.martial:0 "Martialité"
 ervc.cc.skill.stewardship:0 "Intendance"
 ervc.cc.skill.intrigue:0 "Intrigue"
 ervc.cc.skill.learning:0 "Érudition"
 ervc.cc.skill.prowess:0 "Prouesse"
 ervc.cc.numeric.minus_10:0 "-10"
 ervc.cc.numeric.minus_1:0 "-1"
 ervc.cc.numeric.plus_1:0 "+1"
 ervc.cc.numeric.plus_10:0 "+10"
 ervc.cc.base_stats:0 "L'âge se règle exactement de 0 à 120. Les six barres en lecture seule indiquent les compétences de base exactes et non modifiées, de 0 à 100 ; utilise les boutons de pas. Les prix suivent la courbe absolue non linéaire du Créateur de dirigeant du jeu de base, puis les modificateurs d'éducation et de traits sont appliqués."
 ervc.cc.education.help:0 "Tous les traits d'éducation du jeu de base sont listés. Une âme de 16 ans ou plus doit en avoir exactement un ; un enfant n'en a aucun."
 ervc.cc.commander.help:0 "Les 17 traits de commandant du jeu de base sont listés. Choisis-en jusqu'à deux ; chacun commence à la maîtrise de base avec zéro XP. Sélectionnés : [GetPlayer.MakeScope.Var('ervc_cc_commander_count').GetValue|0]/2."
 ervc.cc.physical.help:0 "Les 38 traits physiques du jeu de base sont listés, y compris le $trait_impotent$ normalement caché. Les choix compatibles peuvent être combinés."
 ervc.cc.personality.help:0 "Les 36 traits de personnalité du jeu de base sont listés. Choisis-en jusqu'à trois ; choisir un opposé remplace son pendant. Sélectionnés : [GetPlayer.MakeScope.Var('ervc_cc_personality_count').GetValue|0]/3."
 ervc.cc.other.help:0 "Les 108 autres traits du jeu de base visibles dans le Créateur de dirigeant sont listés ici. Ils comprennent de puissants statuts, des états de santé et d'autres choix lourds de conséquences."
 ervc.cc.origin.help:0 "Choisis parmi toutes les cultures et les fois chargées, puis fais de cette âme un être de basse extraction ou place-la dans ta dynastie et ta maison. Cette dernière option est indisponible si tu n'as pas de maison."
 ervc.cc.culture:0 "Culture"
 ervc.cc.faith:0 "Foi"
 ervc.cc.dynasty_house:0 "Dynastie et maison"
 ervc.cc.lowborn:0 "Basse extraction"
 ervc.cc.same_house:0 "Ta dynastie et ta maison"
 ervc.cc.price:0 "Prix / or disponible"
 ervc.cc.confirm:0 "Sceller la commande"
