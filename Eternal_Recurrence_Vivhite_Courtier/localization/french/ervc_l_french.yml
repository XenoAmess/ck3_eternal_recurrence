 ervc.cc.invalid_configuration:0 "L'âme demandée est incohérente en elle-même."
 ervc.cc.toast.title:0 "La commande est accomplie"
 ervc.cc.toast.desc:0 "Ton courtisan nouvellement façonné est arrivé."
