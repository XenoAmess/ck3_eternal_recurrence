 ervc.cc.tab.origin:0 "Origen"
 ervc.cc.sex:0 "Sexo"
 ervc.cc.age:0 "Edad"
 ervc.cc.skill.diplomacy:0 "Diplomacia"
 ervc.cc.skill.martial:0 "Marcialidad"
 ervc.cc.skill.stewardship:0 "Administración"
 ervc.cc.skill.intrigue:0 "Intriga"
 ervc.cc.skill.learning:0 "Aprendizaje"
 ervc.cc.skill.prowess:0 "Destreza"
 ervc.cc.numeric.minus_10:0 "-10"
 ervc.cc.numeric.minus_1:0 "-1"
 ervc.cc.numeric.plus_1:0 "+1"
 ervc.cc.numeric.plus_10:0 "+10"
 ervc.cc.base_stats:0 "La edad se ajusta exactamente de 0 a 120. Las seis barras de solo lectura muestran las habilidades base sin modificar de 0 a 100; usa los botones de paso. Los precios siguen la curva absoluta no lineal del Diseñador de gobernantes del juego base, y después se aplican los modificadores de educación y rasgos."
 ervc.cc.education.help:0 "Se enumeran todos los rasgos de educación del juego base. Los adultos de 16 años o más requieren exactamente uno; los niños no tienen rasgo de educación."
 ervc.cc.commander.help:0 "Se enumeran los 17 rasgos de comandante del juego base. Elige hasta dos; cada uno comienza con dominio base y cero EXP. Seleccionados: [GetPlayer.MakeScope.Var('ervc_cc_commander_count').GetValue|0]/2."
 ervc.cc.physical.help:0 "Se enumeran los 38 rasgos físicos del juego base, incluido el normalmente oculto $trait_impotent$. Las opciones compatibles pueden combinarse."
 ervc.cc.personality.help:0 "Se enumeran los 36 rasgos de personalidad del juego base. Elige hasta tres; seleccionar un opuesto sustituye a su contraparte. Seleccionados: [GetPlayer.MakeScope.Var('ervc_cc_personality_count').GetValue|0]/3."
 ervc.cc.other.help:0 "Aquí se enumeran los 108 rasgos restantes del juego base visibles en el Diseñador de gobernantes. Incluyen poderosas opciones de estatus, salud y otras de gran trascendencia."
 ervc.cc.origin.help:0 "Elige entre todas las culturas y fes cargadas, y luego haz que el alma sea de baja cuna o colócala en tu dinastía y casa. Esta última opción no está disponible si no tienes casa."
 ervc.cc.culture:0 "Cultura"
 ervc.cc.faith:0 "Fe"
