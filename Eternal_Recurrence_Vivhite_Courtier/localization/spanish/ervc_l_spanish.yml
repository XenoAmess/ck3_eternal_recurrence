l_spanish:
 decision_group_type_ervc_courtier_creator:0 "@ervc_decision_group_icon! Eternal Recurrence: Glassfire Courtier Creator - Vivhite Edition"
 ervc_courtier_creator_decision:0 "Encargar un cortesano del Fuego de Cristal"
 ervc_courtier_creator_decision_desc:0 "Pídele al Señor del Fuego de Cristal que forje a medida el cuerpo, talentos, rasgos, origen y linaje de un cortesano. Cada refinamiento tiene su precio; el alma terminada se unirá a tu corte."
 ervc_courtier_creator_decision_tooltip:0 "Diseña y encarga un cortesano personalizado a tu costa"
 ervc_courtier_creator_decision_confirm:0 "Abrir el encargo"
 ervc.cc.title:0 "Un alma por encargo"
 ervc.cc.intro:0 "Viajero, toda corte tiene una silla vacía. Elige qué clase de calor debería sentarse junto a tu trono; solo cobro cuando el alma entra por la puerta."
 ervc.cc.tab.basic:0 "Esenciales"
 ervc.cc.tab.education:0 "Educación"
