l_english:
 decision_group_type_ervc_courtier_creator:0 "@ervc_decision_group_icon! Eternal Recurrence: Glassfire Courtier Creator - Vivhite Edition"
 ervc_courtier_creator_decision:0 "Commission a Glassfire Courtier"
 ervc_courtier_creator_decision_desc:0 "Ask the Glassfire Lord to fashion a courtier's body, talents, traits, origin, and lineage to order. Every refinement has its price; the finished soul will join your court."
 ervc_courtier_creator_decision_tooltip:0 "Design and commission a paid custom courtier"
 ervc_courtier_creator_decision_confirm:0 "Open the commission"
 ervc.cc.title:0 "A Soul on Commission"
 ervc.cc.intro:0 "Traveler, every court has an empty chair. Choose what sort of warmth should sit beside your throne; I charge only when the soul steps through."
 ervc.cc.tab.basic:0 "Essentials"
 ervc.cc.tab.education:0 "Education"
 ervc.cc.tab.commander:0 "Command"
 ervc.cc.tab.physical:0 "Blood and Bone"
 ervc.cc.tab.personality:0 "Temperament"
