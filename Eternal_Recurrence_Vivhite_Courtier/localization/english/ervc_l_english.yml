 ervc.cc.skill.intrigue:0 "Intrigue"
 ervc.cc.skill.learning:0 "Learning"
 ervc.cc.skill.prowess:0 "Prowess"
 ervc.cc.numeric.minus_10:0 "-10"
 ervc.cc.numeric.minus_1:0 "-1"
 ervc.cc.numeric.plus_1:0 "+1"
 ervc.cc.numeric.plus_10:0 "+10"
 ervc.cc.base_stats:0 "Age is exact from 0 to 120. The six read-only bars show exact unmodified base skills from 0 to 100; use the step buttons. Skill prices follow the vanilla Ruler Designer's nonlinear absolute curve, with education and trait modifiers applied afterward."
 ervc.cc.education.help:0 "Every native education trait is listed. Adults aged 16 or older require exactly one; children have no education trait."
 ervc.cc.commander.help:0 "All 17 native commander traits are listed. Choose up to two; each starts at base mastery with zero XP. Selected: [GetPlayer.MakeScope.Var('ervc_cc_commander_count').GetValue|0]/2."
 ervc.cc.physical.help:0 "All 38 native physical traits are listed, including the normally hidden $trait_impotent$. Compatible choices may be combined."
 ervc.cc.personality.help:0 "All 36 native personality traits are listed. Choose up to three; selecting an opposite replaces its counterpart. Selected: [GetPlayer.MakeScope.Var('ervc_cc_personality_count').GetValue|0]/3."
 ervc.cc.other.help:0 "The 108 remaining native Ruler Designer-visible traits are listed here. They include powerful status, health, and other consequential choices."
 ervc.cc.origin.help:0 "Choose from every loaded culture and faith, then make the soul lowborn or place it in your dynasty and house. The latter is unavailable if you have no house."
 ervc.cc.culture:0 "Culture"
 ervc.cc.faith:0 "Faith"
