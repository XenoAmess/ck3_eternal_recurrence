 ervc.cc.cancel:0 "Leave the page blank"
 ervc.cc.insufficient_gold:0 "You cannot meet the current price."
 ervc.cc.invalid_configuration:0 "The requested soul is internally inconsistent."
 ervc.cc.toast.title:0 "The Commission Is Fulfilled"
 ervc.cc.toast.desc:0 "Your newly fashioned courtier has arrived."
