 decision_group_type_ox_here:0 "Bœuf, viens"
 ox_here_decision:0 "Bœuf, viens !"
 ox_here_decision_desc:0 "Personne n’aime les bœufs… Pourtant, face aux tigres, aux léopards et aux chacals, nous n’avons parfois pas le choix…"
 ox_here_decision_tooltip:0 "Invitez un redoutable guerrier lorsque le pays en a besoin."
 ox_here_decision_option_recruit:0 "Maman…"
 ox_here_decision_option_recruit_desc:0 "Invitez un guerrier d’exception pour vous aider à traverser cette épreuve."
 ox_here_recruit_tooltip:0 "Invitez un guerrier d’exception pour vous aider à traverser cette épreuve."
 ox_here_decision_option_decline:0 "Je préfère les léoparder"
 ox_here_decision_option_decline_desc:0 "Il ne se passe rien."
 ox_here_decline_tooltip:0 "Il ne se passe rien."
 ox_here_decision_confirm:0 "Confirmer"
 ox_here_secret_affair:0 "[CHARACTER.GetShortUIName|U] et [TARGET_CHARACTER.GetShortUIName] se rencontrent en secret à la cour."
 ox_here_secret_affair_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] et [CHARACTER.GetShortUIName] se rencontrent en secret à la cour."
 ox_here_arrival_event_title:0 "Le bœuf est là !"
 ox_here_arrival_event_desc:0 "« Vous ai-je bien entendu dire à l’instant : “Bœuf, viens !” ? »\n\n[ox_here_warrior.GetShortUIName|U] est arrivé à votre cour précisément en réponse à la décision « Bœuf, viens ! » que vous venez de prendre ; il est désormais votre courtisan. Il a été contraint de servir comme chevalier et se tient prêt à combattre pour vous."
 ox_here_arrival_event_desc_champion:0 "« Vous ai-je bien entendu dire à l’instant : “Bœuf, viens !” ? »\n\n[ox_here_warrior.GetShortUIName|U] est arrivé à votre cour précisément en réponse à la décision « Bœuf, viens ! » que vous venez de prendre ; il est désormais votre courtisan. Il a été contraint de servir comme chevalier et nommé votre champion personnel ; cette charge ne lui rapporte aucun salaire."
 ox_here_arrival_event_option:0 "Bien. Qu’ils voient qui est le bœuf."
 ox_here_blond_kanuri:0 "Kanourie blonde — Bœuf, viens"
 ox_here_blond_kanuri_collective_noun:0 "Kanouris blonds — Bœuf, viens"
 ox_here_blond_kanuri_prefix:0 "Kanouro-blond — Bœuf, viens"
