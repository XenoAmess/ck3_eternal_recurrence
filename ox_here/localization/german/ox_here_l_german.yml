l_german:
 decision_group_type_ox_here:0 "Ochse, komm"
 ox_here_decision:0 "Ochse, komm!"
 ox_here_decision_desc:0 "Niemand mag Ochsen … Doch wenn man Tigern, Leoparden und Schakalen gegenübersteht, bleibt einem manchmal keine Wahl …"
 ox_here_decision_tooltip:0 "Ladet einen furchteinflößenden Krieger ein, wenn Euer Reich ihn braucht."
 ox_here_decision_option_recruit:0 "Mama …"
 ox_here_decision_option_recruit_desc:0 "Ladet einen außergewöhnlichen Krieger ein, damit er Euch durch die Krise hilft."
 ox_here_decision_option_decline:0 "Ich würde sie lieber leopardieren"
 ox_here_decision_option_decline_desc:0 "Nichts geschieht."
 ox_here_decision_confirm:0 "Bestätigen"
 ox_here_secret_affair:0 "[CHARACTER.GetShortUIName|U] und [TARGET_CHARACTER.GetShortUIName] treffen sich heimlich am Hof."
 ox_here_secret_affair_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] und [CHARACTER.GetShortUIName] treffen sich heimlich am Hof."
 ox_here_arrival_event_title:0 "Der Ochse ist da!"
 ox_here_arrival_event_desc:0 "„Habe ich da gerade ‚Ochse, komm!‘ gehört?“\n\n[ox_here_warrior.GetShortUIName|U] ist eigens an Euren Hof gekommen, weil Ihr soeben die Entscheidung „Ochse, komm!“ getroffen habt. Er ist nun Euer Höfling. Er wurde zum Ritterdienst gezwungen und steht bereit, für Euch zu kämpfen."
 ox_here_arrival_event_desc_champion:0 "„Habe ich da gerade ‚Ochse, komm!‘ gehört?“\n\n[ox_here_warrior.GetShortUIName|U] ist eigens an Euren Hof gekommen, weil Ihr soeben die Entscheidung „Ochse, komm!“ getroffen habt. Er ist nun Euer Höfling. Er wurde zum Ritterdienst gezwungen und zu Eurem Persönlichen Streiter ernannt; für dieses Amt erhält er kein Salär."
 ox_here_arrival_event_option:0 "Gut. Sollen sie sehen, wer hier der Ochse ist."
 ox_here_blond_kanuri:0 "Blondkanurisch „Ochse, komm“"
 ox_here_blond_kanuri_collective_noun:0 "Blonde Kanuri „Ochse, komm“"
 ox_here_blond_kanuri_prefix:0 "Blondkanuri „Ochse, komm“"
