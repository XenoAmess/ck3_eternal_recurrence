l_japanese:
 decision_group_type_ox_here:0 "牛よ、来い"
 ox_here_decision:0 "牛よ、来い！"
 ox_here_decision_desc:0 "誰も牛など好きではない……だが、虎、豹、ジャッカルを前にしては、時にほかに選択肢がない……"
 ox_here_decision_tooltip:0 "領国に戦士が必要な時、恐るべき戦士を招く。"
 ox_here_decision_option_recruit:0 "ママ……"
 ox_here_decision_option_recruit_desc:0 "並外れた戦士を招き、この危機を乗り越える力を借りる。"
 ox_here_recruit_tooltip:0 "並外れた戦士を招き、この危機を乗り越える力を借りる。"
 ox_here_decision_option_decline:0 "奴らを豹ってやるほうがましだ"
 ox_here_decision_option_decline_desc:0 "何も起こらない。"
 ox_here_decline_tooltip:0 "何も起こらない。"
 ox_here_decision_confirm:0 "確認"
 ox_here_secret_affair:0 "[CHARACTER.GetShortUIName|U]と[TARGET_CHARACTER.GetShortUIName]は宮廷で密会している。"
 ox_here_secret_affair_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U]と[CHARACTER.GetShortUIName]は宮廷で密会している。"
 ox_here_arrival_event_title:0 "牛が来た！"
 ox_here_arrival_event_desc:0 "「今、『牛よ、来い』と言ったのが聞こえたが？」\n\n[ox_here_warrior.GetShortUIName|U]は、あなたがたった今実行した「牛よ、来い！」という決断に応えてやって来て、今やあなたの廷臣となった。騎士として仕えることを強いられ、いつでもあなたのために戦える。"
 ox_here_arrival_event_desc_champion:0 "「今、『牛よ、来い』と言ったのが聞こえたが？」\n\n[ox_here_warrior.GetShortUIName|U]は、あなたがたった今実行した「牛よ、来い！」という決断に応えてやって来て、今やあなたの廷臣となった。騎士として仕えることを強いられ、給与なしであなたのパーソナルチャンピョンに任命された。"
 ox_here_arrival_event_option:0 "よし。誰が牛なのか、奴らに見せてやれ。"
 ox_here_blond_kanuri:0 "牛よ来い金髪カヌリ"
 ox_here_blond_kanuri_collective_noun:0 "牛よ来い金髪カヌリ人"
 ox_here_blond_kanuri_prefix:0 "牛よ来い金髪カヌリ"
