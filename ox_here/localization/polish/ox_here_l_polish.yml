l_polish:
 decision_group_type_ox_here:0 "Wole, przybądź"
 ox_here_decision:0 "Wole, przybądź!"
 ox_here_decision_desc:0 "Nikt nie lubi wołów… Jednak gdy trzeba stawić czoła tygrysom, lampartom i szakalom, czasem nie ma innego wyjścia…"
 ox_here_decision_tooltip:0 "Zaproś groźnego wojownika, gdy państwo go potrzebuje."
 ox_here_decision_option_recruit:0 "Mamo…"
 ox_here_decision_option_recruit_desc:0 "Zaproś wyjątkowego wojownika, który pomoże ci przetrwać kryzys."
 ox_here_recruit_tooltip:0 "Zaproś wyjątkowego wojownika, który pomoże ci przetrwać kryzys."
 ox_here_decision_option_decline:0 "Wolę ich zalampartować"
 ox_here_decision_option_decline_desc:0 "Nic się nie wydarzy."
 ox_here_decline_tooltip:0 "Nic się nie wydarzy."
 ox_here_decision_confirm:0 "Potwierdź"
 ox_here_secret_affair:0 "[CHARACTER.GetShortUIName|U] i [TARGET_CHARACTER.GetShortUIName] potajemnie spotykają się na dworze."
 ox_here_secret_affair_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] i [CHARACTER.GetShortUIName] potajemnie spotykają się na dworze."
 ox_here_arrival_event_title:0 "Wół przybył!"
 ox_here_arrival_event_desc:0 "„Czy właśnie usłyszałem, jak mówisz: «Wole, przybądź!»?”\n\n[ox_here_warrior.GetShortUIName|U] przybył na twój dwór specjalnie w odpowiedzi na dopiero co podjętą przez ciebie decyzję „Wole, przybądź!”. Jest teraz twoim dworzaninem. Zmuszono go do służby jako rycerz. Jest gotów walczyć za ciebie."
 ox_here_arrival_event_desc_champion:0 "„Czy właśnie usłyszałem, jak mówisz: «Wole, przybądź!»?”\n\n[ox_here_warrior.GetShortUIName|U] przybył na twój dwór specjalnie w odpowiedzi na dopiero co podjętą przez ciebie decyzję „Wole, przybądź!”. Jest teraz twoim dworzaninem. Zmuszono go do służby jako rycerz i mianowano go twoim osobistym czempionem; za ten urząd nie otrzymuje wynagrodzenia."
 ox_here_arrival_event_option:0 "Dobrze. Niech zobaczą, kto tu jest wołem."
 ox_here_blond_kanuri:0 "Jasnowłosa kanuryjska „Wole, przybądź”"
 ox_here_blond_kanuri_collective_noun:0 "Jasnowłosi Kanuri „Wole, przybądź”"
 ox_here_blond_kanuri_prefix:0 "Jasnowłoso-kanuryjsko „Wole, przybądź”"
