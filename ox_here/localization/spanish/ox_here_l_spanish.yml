l_spanish:
 decision_group_type_ox_here:0 "Buey, ven"
 ox_here_decision:0 "¡Buey, ven!"
 ox_here_decision_desc:0 "A nadie le gustan los bueyes… Sin embargo, ante tigres, leopardos y chacales, a veces no queda otra opción…"
 ox_here_decision_tooltip:0 "Invita a un guerrero formidable cuando el señorío lo necesite."
 ox_here_decision_option_recruit:0 "Mamá…"
 ox_here_decision_option_recruit_desc:0 "Invita a un guerrero excepcional para que te ayude a superar la crisis."
 ox_here_decision_option_decline:0 "Prefiero leopardearlos"
 ox_here_decision_option_decline_desc:0 "No ocurre nada."
 ox_here_decision_confirm:0 "Confirmar"
 ox_here_secret_affair:0 "[CHARACTER.GetShortUIName|U] y [TARGET_CHARACTER.GetShortUIName] se reúnen en secreto en la corte."
 ox_here_secret_affair_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] y [CHARACTER.GetShortUIName] se reúnen en secreto en la corte."
 ox_here_arrival_event_title:0 "¡Ha llegado el buey!"
 ox_here_arrival_event_desc:0 "«¿Acabo de oírte decir “¡Buey, ven!”?»\n\n[ox_here_warrior.GetShortUIName|U] ha llegado a tu corte expresamente porque acabas de tomar la decisión «¡Buey, ven!». Ahora es tu cortesano. Se le ha obligado a servir como caballero y está listo para luchar por ti."
 ox_here_arrival_event_desc_champion:0 "«¿Acabo de oírte decir “¡Buey, ven!”?»\n\n[ox_here_warrior.GetShortUIName|U] ha llegado a tu corte expresamente porque acabas de tomar la decisión «¡Buey, ven!». Ahora es tu cortesano. Se le ha obligado a servir como caballero y se le ha nombrado tu campeón personal; el cargo no conlleva salario."
 ox_here_arrival_event_option:0 "Bien. Que vean quién es el buey."
 ox_here_blond_kanuri:0 "Kanuri rubia «Buey, ven»"
 ox_here_blond_kanuri_collective_noun:0 "Kanuris rubios «Buey, ven»"
 ox_here_blond_kanuri_prefix:0 "Kanuro rubio «Buey, ven»"
