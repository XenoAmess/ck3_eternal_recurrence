l_korean:
 decision_group_type_ox_here:0 "소야, 와"
 ox_here_decision:0 "소야, 와!"
 ox_here_decision_desc:0 "소를 좋아하는 이는 아무도 없다…… 하지만 호랑이와 표범과 자칼을 마주하면, 때로는 달리 선택할 길이 없다……"
 ox_here_decision_tooltip:0 "봉역에 전사가 필요할 때 막강한 전사를 초대합니다."
 ox_here_decision_option_recruit:0 "엄마……"
 ox_here_decision_option_recruit_desc:0 "비범한 전사를 초대해 이 위기를 헤쳐 나갈 힘을 빌립니다."
 ox_here_decision_option_decline:0 "차라리 저들을 표범해 버리겠어"
 ox_here_decision_option_decline_desc:0 "아무 일도 일어나지 않습니다."
 ox_here_decision_confirm:0 "확인"
 ox_here_secret_affair:0 "[CHARACTER.GetShortUIName|U](와)과 [TARGET_CHARACTER.GetShortUIName](이)가 궁정에서 몰래 만납니다."
 ox_here_secret_affair_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U](와)과 [CHARACTER.GetShortUIName](이)가 궁정에서 몰래 만납니다."
 ox_here_arrival_event_title:0 "소가 왔다!"
 ox_here_arrival_event_desc:0 "“방금 ‘소야, 와!’라고 말씀하신 게 들렸는데요?”\n\n[ox_here_warrior.GetShortUIName|U](은)는 당신이 방금 실행한 “소야, 와!”라는 결단에 응해 이곳에 왔으며, 이제 당신의 궁정 신하가 되었습니다. 강제로 기사로 복무하게 되었고, 언제든 당신을 위해 싸울 준비가 되어 있습니다."
 ox_here_arrival_event_desc_champion:0 "“방금 ‘소야, 와!’라고 말씀하신 게 들렸는데요?”\n\n[ox_here_warrior.GetShortUIName|U](은)는 당신이 방금 실행한 “소야, 와!”라는 결단에 응해 이곳에 왔으며, 이제 당신의 궁정 신하가 되었습니다. 강제로 기사로 복무하게 되었으며, 봉급 없이 당신의 개인 투사로 임명되었습니다."
 ox_here_arrival_event_option:0 "좋아. 누가 소인지 똑똑히 보여 줘라."
 ox_here_blond_kanuri:0 "소야 와 금발 카누리"
 ox_here_blond_kanuri_collective_noun:0 "소야 와 금발 카누리"
 ox_here_blond_kanuri_prefix:0 "소야 와 금발 카누리계"
