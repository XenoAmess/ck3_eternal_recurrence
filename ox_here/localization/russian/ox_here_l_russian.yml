l_russian:
 decision_group_type_ox_here:0 "Вол, приди"
 ox_here_decision:0 "Вол, приди!"
 ox_here_decision_desc:0 "Никто не любит волов… Но когда приходится противостоять тиграм, леопардам и шакалам, порой выбора нет…"
 ox_here_decision_tooltip:0 "Пригласить грозного воина, когда он нужен державе."
 ox_here_decision_option_recruit:0 "Мама…"
 ox_here_decision_option_recruit_desc:0 "Пригласить выдающегося воина, который поможет вам преодолеть кризис."
 ox_here_recruit_tooltip:0 "Пригласить выдающегося воина, который поможет вам преодолеть кризис."
 ox_here_decision_option_decline:0 "Я лучше их леопардну"
 ox_here_decision_option_decline_desc:0 "Ничего не произойдет."
 ox_here_decline_tooltip:0 "Ничего не произойдет."
 ox_here_decision_confirm:0 "Подтвердить"
 ox_here_secret_affair:0 "[CHARACTER.GetShortUIName|U] и [TARGET_CHARACTER.GetShortUIName] тайно встречаются при дворе."
 ox_here_secret_affair_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] и [CHARACTER.GetShortUIName] тайно встречаются при дворе."
 ox_here_arrival_event_title:0 "Вол пришел!"
 ox_here_arrival_event_desc:0 "«Я правильно расслышал — вы только что сказали: „Вол, приди!“?»\n\n[ox_here_warrior.GetShortUIName|U] прибыл ко двору именно потому, что вы только что приняли решение «Вол, приди!». Теперь он ваш придворный. Его принудили служить рыцарем, и он готов сражаться за вас."
 ox_here_arrival_event_desc_champion:0 "«Я правильно расслышал — вы только что сказали: „Вол, приди!“?»\n\n[ox_here_warrior.GetShortUIName|U] прибыл ко двору именно потому, что вы только что приняли решение «Вол, приди!». Теперь он ваш придворный. Его принудили служить рыцарем и назначили вашим личным воителем; жалования за эту должность он не получает."
 ox_here_arrival_event_option:0 "Хорошо. Пусть увидят, кто здесь вол."
 ox_here_blond_kanuri:0 "Светловолосые канури «Вол, приди»"
 ox_here_blond_kanuri_collective_noun:0 "Светловолосые канури «Вол, приди»"
 ox_here_blond_kanuri_prefix:0 "Светловолосо-кануро «Вол, приди»"
