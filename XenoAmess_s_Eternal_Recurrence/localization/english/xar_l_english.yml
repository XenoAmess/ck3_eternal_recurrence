 xar_track_growth_50:0 "GROWTH · 50% · v2"
 xar_track_growth_100:0 "GROWTH · 100% · v2"
 xar.challenge.summary:0 "\n\n— Challenge Track —\nTrack: #V [ROOT.Char.Custom('xar_track_name')]#!\nInheritance: [TopScope.GetValue('xar_challenge_ratio')|0]% (no budget cap)\nGrowth baseline: [TopScope.GetValue('xar_challenge_baseline')|1]"

 # Tutorial lesson step sentinel text. Must stay identical in every language.
 xar_silent_step:0 "XAR_SYNC_SENTINEL"

 # Sentinel returned by the record-level customizable localization.
 xar_top_bit_sentinel:0 "XAR_TOP_SENTINEL"

 # Sentinel for the exit-to-menu bridge.
 xar_quit_sentinel:0 "XAR_QUIT_SENTINEL"

 # Trait
 trait_xar_glassfire_gaze:0 "Glassfire Gaze"
 trait_xar_glassfire_gaze_desc:0 "This character is watched by that glass-colored flame, watched... until the very end."
 trait_xar_glassfire_gaze_character_desc:0 "This character is watched by that glass-colored flame, watched... until the very end.\n\nCurrent weight: #V [SCOPE.ScriptValue('xar_current_score_value')|1]#! (preview only; settlement is not updated)"
 trait_track_xar_glassfire_gaze:0 "Glassfire Embers"
 trait_track_xar_glassfire_gaze_desc:0 "Gain 1 experience for each completed blessing and curse pair. Every 10 experience grants a level and another 10% stress gain."

 # The pact (game start)
 xar.0002.title:0 "Pact of the End"
 xar.0002.desc:0 "—We meet again, traveler.\n\nI am the Glassfire Lord, an intermediary demon dwelling between curses. Every road you have walked, I have gathered its embers at the end.\n\nSign this pact once more, and every ounce of your past lives shall become this life's bargaining chips.\n\nThe glassfire never hurries. It simply... keeps watching."
 xar.0002.accept:0 "I accept. Let the glassfire bear witness."
 xar.0002.decline:0 "No. This life, I walk alone."

 # Polite farewell
 xar.0003.title:0 "The Glassfire's Regards"
 xar.0003.desc:0 "No matter. The glassfire never insists.\n\nMay your story belong to you alone—until we meet again. Or perhaps... nevermore."
 xar.0003.ok:0 "Farewell."

 # Opening shop event
 xar.0001.title:0 "Pawnshop of Recurrence"
 xar.0001.desc:0 "Welcome, traveler. These scattered glimmers are the embers of your last life.\n\nYou hold [TopScope.GetValue('xar_points')] points. What catches your eye?"
 xar.0001.diplomacy:0 "Buy +1 Diplomacy ([TopScope.GetValue('xar_pr_dip')|0] points)"
 xar.0001.martial:0 "Buy +1 Martial ([TopScope.GetValue('xar_pr_mar')|0] points)"
 xar.0001.stewardship:0 "Buy +1 Stewardship ([TopScope.GetValue('xar_pr_ste')|0] points)"
 xar.0001.intrigue:0 "Buy +1 Intrigue ([TopScope.GetValue('xar_pr_int')|0] points)"
 xar.0001.learning:0 "Buy +1 Learning ([TopScope.GetValue('xar_pr_lea')|0] points)"
 xar.0001.prowess:0 "Buy +1 Prowess ([TopScope.GetValue('xar_pr_pro')|0] points)"
 xar.0001.gold:0 "Trade for 100 gold ([TopScope.GetValue('xar_pr_gold')|0] points)"
 xar.0001.prestige:0 "Trade for 100 prestige ([TopScope.GetValue('xar_pr_pres')|0] points)"
 xar.0001.piety:0 "Trade for 100 piety ([TopScope.GetValue('xar_pr_pie')|0] points)"
 xar.0001.influence:0 "Trade for 100 influence ([TopScope.GetValue('xar_pr_inf')|0] points)"
 xar.0001.dynasty_prestige:0 "Trade for 100 dynasty prestige ([TopScope.GetValue('xar_pr_dyn')|0] points)"
 xar.0001.lifespan:0 "Trade for 1 year of life expectancy ([TopScope.GetValue('xar_pr_life')|0] points)"
 xar.0001.reform:0 "One free faith reformation ([TopScope.GetValue('xar_pr_reform')|0] points, once per run)"
 xar.0001.reform_hint:0 "After purchase, reform via the faith window; the piety cost is waived."
 xar.0001.prev_page:0 "Previous page"
 xar.0001.next_page:0 "Next page"
 xar.0001.finish:0 "Begin this life (the remaining [TopScope.GetValue('xar_points')] points become an equal amount of gold)"

 # First life and Glassfire Ledger
 xar.0010.title:0 "A Life Yet Unkindled"
 xar.0010.desc:0 "Traveler, this page is still clean. You have no past-life embers to pawn, so the shop would offer only silent price tags.\n\nLet me extend you one story's worth of credit. This life's weight will be measured at its end; reach a new ember tier, and your next life will have bargaining chips.\n\nAs for the first favor... I shall put it on your account."
 xar.0010.begin:0 "Then let this life begin."
 xar_ledger_decision:0 "Glassfire Ledger"
 xar_ledger_decision_desc:0 "Open the account the Glassfire Lord keeps for this life and inspect its current weight and next ember threshold. Read-only; no bargain is struck."
 xar_ledger_decision_tooltip:0 "View the current score, historical ember tier, and next tier"
 xar_ledger_decision_confirm:0 "Open the ledger"
 xar.0011.title:0 "Glassfire Ledger"
 xar.0011.desc:0 "Traveler, your page is always waiting. Rest assured: merely looking at the figures does not seal a bargain.\n\nCurrent read-only score: #V [TopScope.GetValue('xar_ledger_score')|1]#!\nHistorical ember tier: #V [TopScope.GetValue('xar_ledger_history')|0]#!\nCurrent candidate tier: #V [TopScope.GetValue('xar_ledger_candidate')|0]#!\nNext tier: #V [TopScope.GetValue('xar_ledger_next')|0]#!\nDistance to next tier: #V [TopScope.GetValue('xar_ledger_gap')|1]#!\nCompleted blessing/curse pairs: #V [TopScope.GetValue('xar_ledger_pairs')|0]#!\nRefusals: #V [TopScope.GetValue('xar_ledger_refusals')|0]#!"
 xar.0011.desc_cap:0 "$xar.0011.desc$\n\n#P This account has reached the current ember-tier cap; the next tier remains the cap and the distance is zero.#!"
 xar.0011.close:0 "Close it. The embers are still burning."

 # Death score event
 xar.1001.title:0 "The Recurrence Ends"
 xar.1001.new_record:0 "Well done. This account is now written into eternity."
 xar.1001.no_record:0 "Do not despair. The glassfire will await your return."
 xar.1001.desc:0 "Well done, traveler. The weight of this life has been carefully measured.\n\n—— Attributes (1 point each) ——\nDiplomacy: [TopScope.GetValue('xar_a_dip')] × 1 = [TopScope.GetValue('xar_p_dip')]\nMartial: [TopScope.GetValue('xar_a_mar')] × 1 = [TopScope.GetValue('xar_p_mar')]\nStewardship: [TopScope.GetValue('xar_a_ste')] × 1 = [TopScope.GetValue('xar_p_ste')]\nIntrigue: [TopScope.GetValue('xar_a_int')] × 1 = [TopScope.GetValue('xar_p_int')]\nLearning: [TopScope.GetValue('xar_a_lea')] × 1 = [TopScope.GetValue('xar_p_lea')]\nProwess: [TopScope.GetValue('xar_a_pro')] × 1 = [TopScope.GetValue('xar_p_pro')]\n\n—— Blood (must be your descendants) ——\nLiving dynasty members: [TopScope.GetValue('xar_a_dyn')] × 0.1 = [TopScope.GetValue('xar_p_dyn')]\nLiving house members (extra): [TopScope.GetValue('xar_a_hou')] × 0.1 = [TopScope.GetValue('xar_p_hou')]\n\n—— Resources (log₂ floored) ——\nGold: [TopScope.GetValue('xar_a_gold')] → [TopScope.GetValue('xar_l_gold')] × 5 = [TopScope.GetValue('xar_p_gold')]\nPrestige: [TopScope.GetValue('xar_a_pres')] → [TopScope.GetValue('xar_l_pres')] × 3 = [TopScope.GetValue('xar_p_pres')]\nPiety: [TopScope.GetValue('xar_a_pie')] → [TopScope.GetValue('xar_l_pie')] × 3 = [TopScope.GetValue('xar_p_pie')]\nInfluence: [TopScope.GetValue('xar_a_inf')] → [TopScope.GetValue('xar_l_inf')] × 3 = [TopScope.GetValue('xar_p_inf')]\n\n—— Titles held at death ——\nCounty ×1: [TopScope.GetValue('xar_n_t1')] = [TopScope.GetValue('xar_p_t1')]\nDuchy ×2.5: [TopScope.GetValue('xar_n_t2')] = [TopScope.GetValue('xar_p_t2')]\nKingdom ×5: [TopScope.GetValue('xar_n_t3')] = [TopScope.GetValue('xar_p_t3')]\nEmpire ×10: [TopScope.GetValue('xar_n_t4')] = [TopScope.GetValue('xar_p_t4')]\nHegemony ×20: [TopScope.GetValue('xar_n_t5')] = [TopScope.GetValue('xar_p_t5')]\n\n—— Descendants (highest title of living descendants) ——\nCounty ×0.25: [TopScope.GetValue('xar_d_t1')] = [TopScope.GetValue('xar_p_d1')]\nDuchy ×1: [TopScope.GetValue('xar_d_t2')] = [TopScope.GetValue('xar_p_d2')]\nKingdom ×2.5: [TopScope.GetValue('xar_d_t3')] = [TopScope.GetValue('xar_p_d3')]\nEmpire ×5: [TopScope.GetValue('xar_d_t4')] = [TopScope.GetValue('xar_p_d4')]\nHegemony ×10: [TopScope.GetValue('xar_d_t5')] = [TopScope.GetValue('xar_p_d5')]\n\n—— Realm (if landed) ——\nRealm size (counties incl. vassals): [TopScope.GetValue('xar_a_realm')] → [TopScope.GetValue('xar_l_realm')] × 10 = [TopScope.GetValue('xar_p_realm')]\n\n—— Refusal Penalty ——\nBlessing sessions declined: [TopScope.GetValue('xar_reject_n')] × -1% (total multiplier cannot fall below 0)\n\nTotal = [TopScope.GetValue('xar_p_dip')]+[TopScope.GetValue('xar_p_mar')]+[TopScope.GetValue('xar_p_ste')]+[TopScope.GetValue('xar_p_int')]+[TopScope.GetValue('xar_p_lea')]+[TopScope.GetValue('xar_p_pro')]+[TopScope.GetValue('xar_p_dyn')]+[TopScope.GetValue('xar_p_hou')]+[TopScope.GetValue('xar_p_gold')]+[TopScope.GetValue('xar_p_pres')]+[TopScope.GetValue('xar_p_pie')]+[TopScope.GetValue('xar_p_inf')]+[TopScope.GetValue('xar_p_t1')]+[TopScope.GetValue('xar_p_t2')]+[TopScope.GetValue('xar_p_t3')]+[TopScope.GetValue('xar_p_t4')]+[TopScope.GetValue('xar_p_t5')]+[TopScope.GetValue('xar_p_d1')]+[TopScope.GetValue('xar_p_d2')]+[TopScope.GetValue('xar_p_d3')]+[TopScope.GetValue('xar_p_d4')]+[TopScope.GetValue('xar_p_d5')]+[TopScope.GetValue('xar_p_realm')] = [TopScope.GetValue('xar_subtotal')]\nFavors declined: [TopScope.GetValue('xar_reject_n')] = -[TopScope.GetValue('xar_reject_n')]%\nFinal score: [TopScope.GetValue('xar_score')]\n\nPrevious record: [TopScope.GetValue('xar_old')]\nDifference: [TopScope.GetValue('xar_delta')|+0]"

 # Blessing/curse sessions (pools: docs/blessing-curse-pools.md)
 xar.0004.title:0 "The Glassfire's Favor"
 xar.0004.desc:0 "Well, traveler, our dealings are done. And yet—I happen to keep a few stray glimmers in my sleeve. I could spare you some.\n\nBut you know the rule: every favor demands a curse-mark in return. ...Fair trade, I promise.\n\nOne meeting, one pair. Once we trade—or you leave—I shall step away and find you again in three years.\n\n（Completed: [TopScope.GetValue('xar_bc_n')] pairs; declined: [TopScope.GetValue('xar_br_n')], final score -[TopScope.GetValue('xar_br_n')]%）"
 xar.0004.decline:0 "I want nothing."
 xar.0005.title:0 "The Curse-Mark's Price"
 xar.0005.desc:0 "Chosen? Then—it is time to settle the bill.\n\nDon't be afraid. It only stings for a moment. ...Probably."
