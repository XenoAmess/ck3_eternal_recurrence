l_english:
 # Game rule
 rule_xar_enabled:0 "XenoAmess's Eternal Recurrence"
 setting_xar_on:0 "Enabled"
 setting_xar_on_desc:0 "XenoAmess mode is active: the global high score is imported at game start and can be spent on attributes."
 setting_xar_off:0 "Disabled"
 setting_xar_off_desc:0 "XenoAmess mode is inactive."

 # Tutorial lesson step text shared by all high-score bits.
 # Must stay identical in every language: the GUI auto-clicker matches on it.
 xar_silent_step:0 "XAR_SYNC_SENTINEL"

 # Sentinel returned by the top-bit customizable localization.
 # Must stay identical in every language: GUI import states match on it.
 xar_top_bit_sentinel:0 "XAR_TOP_SENTINEL"

 # Opening shop event
 xar.0001.title:0 "Eternal Recurrence"
 xar.0001.desc:0 "The echoes of your past lives linger.\n\nYou have [TopScope.GetValue('xar_points')] points to spend (the global high score copy). Each attribute point costs 25."
 xar.0001.diplomacy:0 "Buy +1 Diplomacy (25 points)"
 xar.0001.martial:0 "Buy +1 Martial (25 points)"
 xar.0001.stewardship:0 "Buy +1 Stewardship (25 points)"
 xar.0001.intrigue:0 "Buy +1 Intrigue (25 points)"
 xar.0001.learning:0 "Buy +1 Learning (25 points)"
 xar.0001.prowess:0 "Buy +1 Prowess (25 points)"
 xar.0001.finish:0 "Begin this life"

 # Death score event
 xar.1001.title:0 "The Recurrence Ends"
 xar.1001.desc:0 "Your life has been weighed.\n\n—— Attributes (1 point each) ——\nDiplomacy: [TopScope.GetValue('xar_a_dip')] × 1 = [TopScope.GetValue('xar_p_dip')]\nMartial: [TopScope.GetValue('xar_a_mar')] × 1 = [TopScope.GetValue('xar_p_mar')]\nStewardship: [TopScope.GetValue('xar_a_ste')] × 1 = [TopScope.GetValue('xar_p_ste')]\nIntrigue: [TopScope.GetValue('xar_a_int')] × 1 = [TopScope.GetValue('xar_p_int')]\nLearning: [TopScope.GetValue('xar_a_lea')] × 1 = [TopScope.GetValue('xar_p_lea')]\nProwess: [TopScope.GetValue('xar_a_pro')] × 1 = [TopScope.GetValue('xar_p_pro')]\n\n—— Blood (must be your descendants) ——\nLiving dynasty members: [TopScope.GetValue('xar_a_dyn')] × 0.1 = [TopScope.GetValue('xar_p_dyn')]\nLiving house members (extra): [TopScope.GetValue('xar_a_hou')] × 0.1 = [TopScope.GetValue('xar_p_hou')]\n\n—— Resources (log₂ floored) ——\nGold: [TopScope.GetValue('xar_a_gold')] → [TopScope.GetValue('xar_l_gold')] × 5 = [TopScope.GetValue('xar_p_gold')]\nPrestige: [TopScope.GetValue('xar_a_pres')] → [TopScope.GetValue('xar_l_pres')] × 3 = [TopScope.GetValue('xar_p_pres')]\nPiety: [TopScope.GetValue('xar_a_pie')] → [TopScope.GetValue('xar_l_pie')] × 3 = [TopScope.GetValue('xar_p_pie')]\nInfluence: [TopScope.GetValue('xar_a_inf')] → [TopScope.GetValue('xar_l_inf')] × 3 = [TopScope.GetValue('xar_p_inf')]\n\n—— Titles held at death ——\nCounty ×1: [TopScope.GetValue('xar_n_t1')] = [TopScope.GetValue('xar_p_t1')]\nDuchy ×2.5: [TopScope.GetValue('xar_n_t2')] = [TopScope.GetValue('xar_p_t2')]\nKingdom ×5: [TopScope.GetValue('xar_n_t3')] = [TopScope.GetValue('xar_p_t3')]\nEmpire ×10: [TopScope.GetValue('xar_n_t4')] = [TopScope.GetValue('xar_p_t4')]\nHegemony ×20: [TopScope.GetValue('xar_n_t5')] = [TopScope.GetValue('xar_p_t5')]\n\n—— Descendants (highest title of living descendants) ——\nCounty ×0.25: [TopScope.GetValue('xar_d_t1')] = [TopScope.GetValue('xar_p_d1')]\nDuchy ×1: [TopScope.GetValue('xar_d_t2')] = [TopScope.GetValue('xar_p_d2')]\nKingdom ×2.5: [TopScope.GetValue('xar_d_t3')] = [TopScope.GetValue('xar_p_d3')]\nEmpire ×5: [TopScope.GetValue('xar_d_t4')] = [TopScope.GetValue('xar_p_d4')]\nHegemony ×10: [TopScope.GetValue('xar_d_t5')] = [TopScope.GetValue('xar_p_d5')]\n\n—— Realm (if landed) ——\nRealm size (counties incl. vassals): [TopScope.GetValue('xar_a_realm')] → [TopScope.GetValue('xar_l_realm')] × 10 = [TopScope.GetValue('xar_p_realm')]\n\nTotal = [TopScope.GetValue('xar_p_dip')]+[TopScope.GetValue('xar_p_mar')]+[TopScope.GetValue('xar_p_ste')]+[TopScope.GetValue('xar_p_int')]+[TopScope.GetValue('xar_p_lea')]+[TopScope.GetValue('xar_p_pro')]+[TopScope.GetValue('xar_p_dyn')]+[TopScope.GetValue('xar_p_hou')]+[TopScope.GetValue('xar_p_gold')]+[TopScope.GetValue('xar_p_pres')]+[TopScope.GetValue('xar_p_pie')]+[TopScope.GetValue('xar_p_inf')]+[TopScope.GetValue('xar_p_t1')]+[TopScope.GetValue('xar_p_t2')]+[TopScope.GetValue('xar_p_t3')]+[TopScope.GetValue('xar_p_t4')]+[TopScope.GetValue('xar_p_t5')]+[TopScope.GetValue('xar_p_d1')]+[TopScope.GetValue('xar_p_d2')]+[TopScope.GetValue('xar_p_d3')]+[TopScope.GetValue('xar_p_d4')]+[TopScope.GetValue('xar_p_d5')]+[TopScope.GetValue('xar_p_realm')] = [TopScope.GetValue('xar_score')]\n\nPrevious record: [TopScope.GetValue('xar_old')]\nDifference: [TopScope.GetValue('xar_delta')|+0]"
 xar.1001.new_record:0 "A new record! It will echo across all future lives."
 xar.1001.no_record:0 "The record stands. Another life awaits."
