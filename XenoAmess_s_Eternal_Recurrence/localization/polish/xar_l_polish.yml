l_polish:
 # Game rule
 rule_xar_enabled:0 "Wieczny Cykl Władcy Szklanego Ognia"
 setting_xar_on:0 "Włączone"
 setting_xar_on_desc:0 "Tryb Władcy Szklanego Ognia jest aktywny: globalny rekord zostaje zaimportowany na początku gry i można go wydać na ulepszenia."
 setting_xar_off:0 "Wyłączone"
 setting_xar_off_desc:0 "Tryb Władcy Szklanego Ognia jest nieaktywny."
 setting_xar_selftest:0 "Autotest"
 setting_xar_selftest_desc:0 "Zautomatyzowany test odbiorczy. Tylko do celów deweloperskich."

