 # Trait
 trait_xar_glassfire_gaze:0 "Spojrzenie Szklanego Ognia"
 trait_xar_glassfire_gaze_desc:0 "Tej postaci przygląda się tamten szklany płomień, przygląda... aż po sam koniec."
 trait_xar_glassfire_gaze_character_desc:0 "Tej postaci przygląda się szklany płomień... aż po sam koniec.\n\nObecny ciężar: #V [SCOPE.ScriptValue('xar_current_score_value')|1]#! (tylko podgląd)"
 trait_track_xar_glassfire_gaze:0 "Żar Szklanego Ognia"
 trait_track_xar_glassfire_gaze_desc:0 "Zyskaj 1 punkt doświadczenia za każdą ukończoną parę przysługi i znamienia klątwy. Co 10 punktów doświadczenia otrzymujesz poziom: kolejne 10% przyrostu stresu oraz wzrost podstawowych atrybutów, przerzuty i pieczęcie."

 # The pact (game start)
 xar.0002.title:0 "Pakt Końca"
 xar.0002.desc:0 "—Znów się spotykamy, wędrowcze.\n\nJestem Władcą Szklanego Ognia, demonem-pośrednikiem mieszkającym między klątwami. Na każdej drodze, którą przeszedłeś, zbierałem na końcu jej żar.\n\nPodpisz ten pakt po raz kolejny, a każda uncja twoich przeszłych żyć stanie się walutą tego życia.\n\nSzklany ogień nigdy się nie spieszy. On po prostu... wciąż patrzy."
 xar.0002.accept:0 "Przyjmuję. Niech szklany ogień będzie świadkiem."
 xar.0002.decline:0 "Nie. To życie przejdę sam."

 # Polite farewell
 xar.0003.title:0 "Pozdrowienia Szklanego Ognia"
 xar.0003.desc:0 "W porządku. Szklany ogień nigdy nie nalega.\n\nNiech twoja historia należy tylko do ciebie — do zobaczenia. A może... już nigdy."
 xar.0003.ok:0 "Żegnaj."

 # Opening shop event
 xar.0001.title:0 "Lombard Wiecznego Cyklu"
 xar.0001.desc:0 "Witaj, wędrowcze. Te rozproszone błyski to żar twojego poprzedniego życia.\n\nMasz [TopScope.GetValue('xar_points')] punktów. Coś cię kusi?"
 xar.0001.diplomacy:0 "Kup +1 Dyplomacji ([TopScope.GetValue('xar_pr_dip')|0] punktów)"
 xar.0001.martial:0 "Kup +1 Kunsztu wojennego ([TopScope.GetValue('xar_pr_mar')|0] punktów)"
 xar.0001.stewardship:0 "Kup +1 Zarządzania ([TopScope.GetValue('xar_pr_ste')|0] punktów)"
 xar.0001.intrigue:0 "Kup +1 Intrygi ([TopScope.GetValue('xar_pr_int')|0] punktów)"
 xar.0001.learning:0 "Kup +1 Wiedzy ([TopScope.GetValue('xar_pr_lea')|0] punktów)"
 xar.0001.prowess:0 "Kup +1 Zalet bojowych ([TopScope.GetValue('xar_pr_pro')|0] punktów)"
 xar.0001.gold:0 "Wymień na 100 złota ([TopScope.GetValue('xar_pr_gold')|0] punktów)"
 xar.0001.prestige:0 "Wymień na 100 prestiżu ([TopScope.GetValue('xar_pr_pres')|0] punktów)"
 xar.0001.piety:0 "Wymień na 100 pobożności ([TopScope.GetValue('xar_pr_pie')|0] punktów)"
 xar.0001.influence:0 "Wymień na 100 wpływów ([TopScope.GetValue('xar_pr_inf')|0] punktów)"
 xar.0001.dynasty_prestige:0 "Wymień na 100 prestiżu dynastii ([TopScope.GetValue('xar_pr_dyn')|0] punktów)"
 xar.0001.lifespan:0 "Wymień na 1 poziom pożyczonego życia (+1 Zdrowia; [TopScope.GetValue('xar_pr_life')|0] punktów)"
 xar.0001.reform:0 "Jedna darmowa reformacja wiary ([TopScope.GetValue('xar_pr_reform')|0] punktów, raz na podejście)"
 xar.0001.reform_hint:0 "Po zakupie przeprowadź reformację w oknie wiary; koszt pobożności zostanie zniesiony."
 xar.0001.grand_tribute:0 "Złóż Wielki Trybut: +1500 prestiżu, pobożności, wpływów i prestiżu dynastii ([TopScope.GetValue('xar_pr_grand_tribute')|0] punktów)"
 xar.0001.borrowed_generation:0 "Pożycz pokolenie: uzupełnij do 25 poziomów życia (+1 Zdrowia każdy; [TopScope.GetValue('xar_pr_borrowed_generation')|0] punktów)"
 xar.0001.sixfold_apotheosis:0 "Sześciokrotna apoteoza: +30 do wszystkich umiejętności ([TopScope.GetValue('xar_pr_sixfold_apotheosis')|0] punktów)"
 xar.0001.reroll_token:0 "Kup jeden przerzut przysługi ([TopScope.GetValue('xar_pr_reroll')|0] punktów)"
 xar.0001.seal_token:0 "Kup jedną pieczęć znamienia klątwy ([TopScope.GetValue('xar_pr_seal')|0] punktów)"
 xar.0001.dread:0 "Zastaw Szeptaną Potworność: zyskaj 20 Postrachu ([TopScope.GetValue('xar_pr_dread')|0] punktów, raz na przebieg)"
 xar.0001.legitimacy:0 "Spraw, by Korona cię zapamiętała: zyskaj 100 Legitymacji ([TopScope.GetValue('xar_pr_legitimacy')|0] punktów, raz na przebieg)"
 xar.0001.tyranny:0 "Spal dziesięć linii z Księgi: strać 10 Tyranii ([TopScope.GetValue('xar_pr_tyranny')|0] punktów, raz na przebieg)"
 xar.0001.prev_page:0 "Poprzednia strona"
 xar.0001.next_page:0 "Następna strona"
 xar.0001.finish:0 "Rozpocznij to życie (pozostałe [TopScope.GetValue('xar_points')] punktów zamieni się w równą ilość złota)"

 # Pierwsze życie i księga
 xar.0010.title:0 "Życie Jeszcze Nierozpalone"
 xar.0010.desc:0 "Wędrowcze, ta strona jest jeszcze czysta. Nie masz żaru z poprzedniego życia pod zastaw, więc sklep pokazałby jedynie milczące ceny.\n\nUdzielę ci kredytu na jedną opowieść. Ciężar tego życia zostanie zważony na końcu; osiągnij nowy próg żaru, a następne życie otrzyma kapitał do targu.\n\nPierwszą łaskę... dopiszę do rachunku."
 xar.0010.begin:0 "Niech więc zacznie się to życie."
 xar_ledger_decision:0 "Księga Szklanego Ognia"
 xar_ledger_decision_desc:0 "Otwórz rachunek prowadzony przez Władcę Szklanego Ognia i sprawdź obecny ciężar oraz następny próg żaru. Tylko do odczytu."
 xar_ledger_decision_tooltip:0 "Zobacz obecny wynik, historyczny próg żaru i następny próg"
 xar_ledger_decision_confirm:0 "Otwórz księgę"
 xar.0011.title:0 "Księga Szklanego Ognia"
 xar.0011.desc:0 "Wędrowcze, twoja strona zawsze czeka. Samo spojrzenie na liczby nie zawiera umowy.\n\nObecny wynik tylko do odczytu: #V [TopScope.GetValue('xar_ledger_score')|1]#!\nHistoryczny próg żaru: #V [TopScope.GetValue('xar_ledger_history')|0]#!\nObecny próg kandydujący: #V [TopScope.GetValue('xar_ledger_candidate')|0]#!\nNastępny próg: #V [TopScope.GetValue('xar_ledger_next')|0]#!\nBrakująca wartość: #V [TopScope.GetValue('xar_ledger_gap')|1]#!\nUkończone pary błogosławieństw i klątw: #V [TopScope.GetValue('xar_ledger_pairs')|0]#!\nOdmowy: #V [TopScope.GetValue('xar_ledger_refusals')|0]#!"
 xar.0011.desc_cap:0 "$xar.0011.desc$\n\n#P Rachunek osiągnął obecny limit progów żaru; następny próg pozostaje limitem, a różnica wynosi zero.#!"
 xar.0011.close:0 "Zamknij. Żar wciąż płonie."

 # Death score event
 xar.1001.title:0 "Koniec Wiecznego Cyklu"
 xar.1001.new_record:0 "Dobra robota. To konto zostało zapisane w wieczności."
 xar.1001.no_record:0 "Nie rozpaczaj. Szklany ogień poczeka na twój powrót."
 xar.1001.desc:0 "Dobra robota, wędrowcze. Ciężar tego życia został starannie zważony.\n\n—— Atrybuty (po 1 punkcie) ——\nDyplomacja: [TopScope.GetValue('xar_a_dip')] × 1 = [TopScope.GetValue('xar_p_dip')]\nKunszt wojenny: [TopScope.GetValue('xar_a_mar')] × 1 = [TopScope.GetValue('xar_p_mar')]\nZarządzanie: [TopScope.GetValue('xar_a_ste')] × 1 = [TopScope.GetValue('xar_p_ste')]\nIntryga: [TopScope.GetValue('xar_a_int')] × 1 = [TopScope.GetValue('xar_p_int')]\nWiedza: [TopScope.GetValue('xar_a_lea')] × 1 = [TopScope.GetValue('xar_p_lea')]\nZalety bojowe: [TopScope.GetValue('xar_a_pro')] × 1 = [TopScope.GetValue('xar_p_pro')]\n\n—— Krew (muszą być twoimi potomkami) ——\nŻyjący członkowie dynastii: [TopScope.GetValue('xar_a_dyn')] × 0.1 = [TopScope.GetValue('xar_p_dyn')]\nŻyjący członkowie rodu (dodatkowo): [TopScope.GetValue('xar_a_hou')] × 0.1 = [TopScope.GetValue('xar_p_hou')]\n\n—— Zasoby (log₂ w dół) ——\nZłoto: [TopScope.GetValue('xar_a_gold')] → [TopScope.GetValue('xar_l_gold')] × 5 = [TopScope.GetValue('xar_p_gold')]\nPrestiż: [TopScope.GetValue('xar_a_pres')] → [TopScope.GetValue('xar_l_pres')] × 3 = [TopScope.GetValue('xar_p_pres')]\nPobożność: [TopScope.GetValue('xar_a_pie')] → [TopScope.GetValue('xar_l_pie')] × 3 = [TopScope.GetValue('xar_p_pie')]\nWpływy: [TopScope.GetValue('xar_a_inf')] → [TopScope.GetValue('xar_l_inf')] × 3 = [TopScope.GetValue('xar_p_inf')]\n\n—— Tytuły w chwili śmierci ——\nHrabstwo ×1: [TopScope.GetValue('xar_n_t1')] = [TopScope.GetValue('xar_p_t1')]\nKsięstwo ×2.5: [TopScope.GetValue('xar_n_t2')] = [TopScope.GetValue('xar_p_t2')]\nKrólestwo ×5: [TopScope.GetValue('xar_n_t3')] = [TopScope.GetValue('xar_p_t3')]\nCesarstwo ×10: [TopScope.GetValue('xar_n_t4')] = [TopScope.GetValue('xar_p_t4')]\nHegemonia ×20: [TopScope.GetValue('xar_n_t5')] = [TopScope.GetValue('xar_p_t5')]\n\n—— Potomkowie (najwyższy tytuł żyjących potomków) ——\nHrabstwo ×0.25: [TopScope.GetValue('xar_d_t1')] = [TopScope.GetValue('xar_p_d1')]\nKsięstwo ×1: [TopScope.GetValue('xar_d_t2')] = [TopScope.GetValue('xar_p_d2')]\nKrólestwo ×2.5: [TopScope.GetValue('xar_d_t3')] = [TopScope.GetValue('xar_p_d3')]\nCesarstwo ×5: [TopScope.GetValue('xar_d_t4')] = [TopScope.GetValue('xar_p_d4')]\nHegemonia ×10: [TopScope.GetValue('xar_d_t5')] = [TopScope.GetValue('xar_p_d5')]\n\n—— Włości (jeśli posiadasz ziemie) ——\nRozmiar włości (hrabstwa wraz z wasalami): [TopScope.GetValue('xar_a_realm')] → [TopScope.GetValue('xar_l_realm')] × 10 = [TopScope.GetValue('xar_p_realm')]\n\n—— Cena odmowy ——\nOdrzucone sesje łaski: [TopScope.GetValue('xar_reject_n')] × -1% (minimalny mnożnik 0)\n\nRazem = [TopScope.GetValue('xar_p_dip')]+[TopScope.GetValue('xar_p_mar')]+[TopScope.GetValue('xar_p_ste')]+[TopScope.GetValue('xar_p_int')]+[TopScope.GetValue('xar_p_lea')]+[TopScope.GetValue('xar_p_pro')]+[TopScope.GetValue('xar_p_dyn')]+[TopScope.GetValue('xar_p_hou')]+[TopScope.GetValue('xar_p_gold')]+[TopScope.GetValue('xar_p_pres')]+[TopScope.GetValue('xar_p_pie')]+[TopScope.GetValue('xar_p_inf')]+[TopScope.GetValue('xar_p_t1')]+[TopScope.GetValue('xar_p_t2')]+[TopScope.GetValue('xar_p_t3')]+[TopScope.GetValue('xar_p_t4')]+[TopScope.GetValue('xar_p_t5')]+[TopScope.GetValue('xar_p_d1')]+[TopScope.GetValue('xar_p_d2')]+[TopScope.GetValue('xar_p_d3')]+[TopScope.GetValue('xar_p_d4')]+[TopScope.GetValue('xar_p_d5')]+[TopScope.GetValue('xar_p_realm')] = [TopScope.GetValue('xar_subtotal')]\nOdrzucone łaski: [TopScope.GetValue('xar_reject_n')] = -[TopScope.GetValue('xar_reject_n')]%\nWynik końcowy: [TopScope.GetValue('xar_score')]\n\nPoprzedni rekord: [TopScope.GetValue('xar_old')]\nRóżnica: [TopScope.GetValue('xar_delta')|+0]"

 # Blessing/curse sessions (pools: docs/blessing-curse-pools.md)
 xar.0004.title:0 "Łaska Szklanego Ognia"
 xar.0004.desc:0 "Cóż, wędrowcze, nasze interesy dobiegły końca. A jednak — w rękawie zostało mi kilka rozproszonych błysków. Mógłbym ci nieco użyczyć.\n\nAle znasz zasadę: każda łaska wymaga w zamian znamienia klątwy. ...Uczciwa wymiana, obiecuję.\n\nJedno spotkanie, jedna para. Po wymianie — lub odmowie — odnajdę cię za trzy lata.\n\n（Ukończono [TopScope.GetValue('xar_bc_n')]; odrzucono [TopScope.GetValue('xar_br_n')], wynik końcowy -[TopScope.GetValue('xar_br_n')]%）"
 xar.0004.decline:0 "Nic nie chcę."
 xar.0005.title:0 "Cena Znamienia Klątwy"
 xar.0005.desc:0 "Wybrałeś? Zatem — czas uregulować rachunek.\n\nNie bój się. Boli tylko chwilę. ...Prawdopodobnie."
