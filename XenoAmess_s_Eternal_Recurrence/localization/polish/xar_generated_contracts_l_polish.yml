 xar.gaze.milestone.10:0 "Pierwszy krąg szklanego ognia otwiera się. Słowa znajdują węższe drzwi i ja daję ci jeden przerzut, aby przysługa lepiej pasowała do twego gustu."
 xar.gaze.milestone.20:0 "Drugi krąg poznaje miarę ostrza. Zyskujesz jedną pieczęć; uchylenie od czasu do czasu znamienia klątwy osładza następny zastaw."
 xar.gaze.milestone.30:0 "Trzeci krąg liczy każdy żar dla ciebie. Dwa przerzuty są twoje, wędrowcze; im więcej wyborów zaoferowanych, tym bardziej pożądanie upodabnia się do zgody."
 xar.gaze.milestone.40:0 "Czwarty krąg kryje sekrety między mrugnięciami. Dwie pieczęcie ostygły, wystarczy by wybrać, które znamię klątwy zechcesz zatrzymać."
 xar.gaze.milestone.50:0 "Piąty krąg odsłania odwrotną stronę paktu. Zachowaj dwa przerzuty i jedną pieczęć; wiedza nigdy nie usuwa ceny, jedynie ją ujawnia."
 xar.gaze.milestone.60:0 "Szósty krąg pali wzdłuż kości, łagodnie jak uścisk. Jeden przerzut, dwie pieczęcie i ostrzejsze naczynie to cała moja przysługa."
 xar.gaze.milestone.70:0 "Siódmy krąg daje prawdzie i kłamstwu tę samą temperaturę. Trzy przerzuty i jedna pieczęć mogą wyciosać szansę w twój wymarzony los."
 xar.gaze.milestone.80:0 "Ósmy krąg potrafi zważyć koronę. Jeden przerzut i trzy pieczęcie pozwalają ci sięgać śmielej, podczas gdy ja prowadzę cierpliwy rejestr."
 xar.gaze.milestone.90:0 "Dziewiąty krąg niemal pokrywa się z duszą. Cztery przerzuty i dwie pieczęcie; koniec jest daleki, lecz nauczyłeś się nazywać jego cenę."
 xar.gaze.milestone.100:0 "Dziesiąty krąg zamyka się w pełne Spojrzenie Szklanego Ognia. Trzy przerzuty, cztery pieczęcie i jeden ostatni wzrost: wędrowcze, stałeś się pamiątką wartą zachowania."
