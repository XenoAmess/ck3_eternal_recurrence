 xar.2000.desc:0 "Wędrowcze, ostateczny rejestr jest kuszący, lecz z przyjemnością patrzę, jak płomień wybiera swój wiatr. Wybierz jeden; każdy krok doda ciężaru temu życiu."
 xar.0010.desc_clean:0 "Wędrowcze, twoje dawne żary pozostają, lecz ten ślad nie zostawia dziedzictwa, które można wydać. Dobrze — przybycie na koniec z pustymi rękoma czyni ważenie ciekawszym. Mimo to zaksięguję pierwszą przysługę na poczet."
