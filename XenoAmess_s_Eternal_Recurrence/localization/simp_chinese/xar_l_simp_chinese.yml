 xar_quit_sentinel:0 "XAR_QUIT_SENTINEL"

 # 特质
 trait_xar_glassfire_gaze:0 "琉焰之视"
 trait_xar_glassfire_gaze_desc:0 "该角色被那琉璃色的火焰凝视着，凝视着……直到终末。"
 trait_xar_glassfire_gaze_character_desc:0 "该角色被那琉璃色的火焰凝视着，凝视着……直到终末。\n\n当前分量：#V [SCOPE.ScriptValue('xar_current_score_value')|1]#!（仅预览，不更新结算）"
 trait_track_xar_glassfire_gaze:0 "琉焰余烬"
 trait_track_xar_glassfire_gaze_desc:0 "每完成一对垂青与咒痕获得 1 经验。每 10 经验提升一级：额外增加 10% 压力获取，同时解锁原生属性成长、重抽与封印。"

 # 抉择事件（开局）
 xar.0002.title:0 "终末之契"
 xar.0002.desc:0 "——又见面了，旅人。\n\n我是琉焰卿，栖于咒间的仲魔。你走过的每一条路，我都曾在尽头替你拾捡余温。\n\n若肯再签一次这纸契约，你前世的每一两分量，都将成为你今生的筹码。\n\n琉焰从不催促。它只是……一直看着。"
 xar.0002.accept:0 "我接受。让琉璃色的火见证。"
 xar.0002.decline:0 "罢了。这一生，我要自己走。"

 # 拒绝后的礼貌回复
 xar.0003.title:0 "琉焰的致意"
 xar.0003.desc:0 "无妨。琉焰从不强求任何人。\n\n愿你的故事只属于你自己——后会有期。也或许……后会无期。"
 xar.0003.ok:0 "珍重。"

 # 开局商店事件
 xar.0001.title:0 "轮回当铺"
 xar.0001.desc:0 "欢迎，旅人。这些散落的辉光，是你上一世的余烬。\n\n你持有 [TopScope.GetValue('xar_points')] 分。想换点什么？"
 xar.0001.diplomacy:0 "购买 +1 外交（[TopScope.GetValue('xar_pr_dip')|0] 分）"
 xar.0001.martial:0 "购买 +1 军事（[TopScope.GetValue('xar_pr_mar')|0] 分）"
 xar.0001.stewardship:0 "购买 +1 管理（[TopScope.GetValue('xar_pr_ste')|0] 分）"
 xar.0001.intrigue:0 "购买 +1 谋略（[TopScope.GetValue('xar_pr_int')|0] 分）"
 xar.0001.learning:0 "购买 +1 学识（[TopScope.GetValue('xar_pr_lea')|0] 分）"
 xar.0001.prowess:0 "购买 +1 勇武（[TopScope.GetValue('xar_pr_pro')|0] 分）"
 xar.0001.gold:0 "换取 100 金币（[TopScope.GetValue('xar_pr_gold')|0] 分）"
 xar.0001.prestige:0 "换取 100 威望（[TopScope.GetValue('xar_pr_pres')|0] 分）"
 xar.0001.piety:0 "换取 100 虔诚（[TopScope.GetValue('xar_pr_pie')|0] 分）"
 xar.0001.influence:0 "换取 100 影响力（[TopScope.GetValue('xar_pr_inf')|0] 分）"
 xar.0001.dynasty_prestige:0 "换取 100 宗族威望（[TopScope.GetValue('xar_pr_dyn')|0] 分）"
 xar.0001.lifespan:0 "换取 1 层借命（+1 健康；[TopScope.GetValue('xar_pr_life')|0] 分）"
 xar.0001.reform:0 "一次免费的宗教改革（[TopScope.GetValue('xar_pr_reform')|0] 分，每局限一次）"
 xar.0001.reform_hint:0 "购买后前往信仰窗口进行改革，虔诚费用将被免除。"
 xar.0001.grand_tribute:0 "献上万国贡火：威望、虔诚、影响力与宗族威望各 +1500（[TopScope.GetValue('xar_pr_grand_tribute')|0] 分）"
 xar.0001.borrowed_generation:0 "借来一代：将借命补至 25 层（每层 +1 健康；[TopScope.GetValue('xar_pr_borrowed_generation')|0] 分）"
 xar.0001.sixfold_apotheosis:0 "六维登神：六项能力各 +30（[TopScope.GetValue('xar_pr_sixfold_apotheosis')|0] 分）"
 xar.0001.reroll_token:0 "买下一次垂青重抽（[TopScope.GetValue('xar_pr_reroll')|0] 分）"
 xar.0001.seal_token:0 "买下一枚咒痕封印（[TopScope.GetValue('xar_pr_seal')|0] 分）"
 xar.0001.dread:0 "典下一缕恶名：获得 20 恐怖值（[TopScope.GetValue('xar_pr_dread')|0] 分，每局限一次）"
 xar.0001.legitimacy:0 "让王冠记起你：获得 100 正统性（[TopScope.GetValue('xar_pr_legitimacy')|0] 分，每局限一次）"
 xar.0001.tyranny:0 "烧去十行旧账：失去 10 暴政（[TopScope.GetValue('xar_pr_tyranny')|0] 分，每局限一次）"
 xar.0001.prev_page:0 "上一页"
 xar.0001.next_page:0 "下一页"
 xar.0001.finish:0 "开始此生（剩余 [TopScope.GetValue('xar_points')] 分将化作等量金币）"

 # 首世与琉焰账簿
 xar.0010.title:0 "未燃之世"
 xar.0010.desc:0 "旅人，这一页尚且洁白。你没有可供典当的前世余烬，打开当铺，也只会看见一排沉默的价签。\n\n不妨先欠我一个故事。此生的分量会在终末称量；只要抵达新的余烬位阶，下一世便有筹码可用。\n\n至于第一道垂青……我愿意先记在账上。"
 xar.0010.begin:0 "那么，开始此生。"
 xar_ledger_decision:0 "琉焰账簿"
 xar_ledger_decision_desc:0 "翻开琉焰卿为此生誊写的账页，查看当前分量与下一道余烬门槛。只读，不成交。"
 xar_ledger_decision_tooltip:0 "查看当前分数、历史余烬位阶与下一位阶"
 xar_ledger_decision_confirm:0 "翻开账簿"
 xar.0011.title:0 "琉焰账簿"
 xar.0011.desc:0 "旅人，账页一直为你留着。放心，目光落在数字上，并不算成交。\n\n当前只读分量：#V [TopScope.GetValue('xar_ledger_score')|1]#!\n历史余烬位阶：#V [TopScope.GetValue('xar_ledger_history')|0]#!\n当前候选位阶：#V [TopScope.GetValue('xar_ledger_candidate')|0]#!\n下一位阶：#V [TopScope.GetValue('xar_ledger_next')|0]#!\n距下一位阶：#V [TopScope.GetValue('xar_ledger_gap')|1]#!\n完成祝福/诅咒对数：#V [TopScope.GetValue('xar_ledger_pairs')|0]#!\n拒绝次数：#V [TopScope.GetValue('xar_ledger_refusals')|0]#!"
 xar.0011.desc_cap:0 "$xar.0011.desc$\n\n#P 此账已抵达当前余烬位阶上限；下一位阶仍记作上限，差值为零。#!"
 xar.0011.close:0 "合上吧。余烬还在燃烧。"

 # 死亡结算事件
 xar.1001.title:0 "轮回终结"
 xar.no_heir_settlement.desc:0 "旅人，原生的终幕想替你合上账本。可这份分量属于我，也属于你。"
 xar.no_heir.score:0 "最终分量"
 xar.no_heir.subtotal:0 "拒绝前分量"
 xar.no_heir.pairs:0 "完成交易"
 xar.no_heir.refusals:0 "拒绝垂青"
 xar.no_heir.contract:0 "契约进度"
 xar.no_heir.old:0 "此前余烬位阶"
 xar.no_heir.candidate:0 "本世候选位阶"
 xar.no_heir.delta:0 "纪录差值"
 xar.no_heir.footer:0 "没有继承人，并不意味着没有留下分量。余烬已经写入永恒；下一位旅人抵达时，我仍会温柔地翻开这一页。"
 xar.1001.desc:0 "辛苦了，旅人。这一生的分量，我已仔细称过。\n\n—— 属性（每点 1 分）——\n外交：[TopScope.GetValue('xar_a_dip')] × 1 = [TopScope.GetValue('xar_p_dip')]\n军事：[TopScope.GetValue('xar_a_mar')] × 1 = [TopScope.GetValue('xar_p_mar')]\n管理：[TopScope.GetValue('xar_a_ste')] × 1 = [TopScope.GetValue('xar_p_ste')]\n谋略：[TopScope.GetValue('xar_a_int')] × 1 = [TopScope.GetValue('xar_p_int')]\n学识：[TopScope.GetValue('xar_a_lea')] × 1 = [TopScope.GetValue('xar_p_lea')]\n勇武：[TopScope.GetValue('xar_a_pro')] × 1 = [TopScope.GetValue('xar_p_pro')]\n\n—— 血脉（须为你的后代）——\n在世宗族成员：[TopScope.GetValue('xar_a_dyn')] × 0.1 = [TopScope.GetValue('xar_p_dyn')]\n在世家族成员（额外）：[TopScope.GetValue('xar_a_hou')] × 0.1 = [TopScope.GetValue('xar_p_hou')]\n\n—— 资源（log₂ 向下取整）——\n金钱：[TopScope.GetValue('xar_a_gold')] → [TopScope.GetValue('xar_l_gold')] × 5 = [TopScope.GetValue('xar_p_gold')]\n威望：[TopScope.GetValue('xar_a_pres')] → [TopScope.GetValue('xar_l_pres')] × 3 = [TopScope.GetValue('xar_p_pres')]\n虔诚：[TopScope.GetValue('xar_a_pie')] → [TopScope.GetValue('xar_l_pie')] × 3 = [TopScope.GetValue('xar_p_pie')]\n影响力：[TopScope.GetValue('xar_a_inf')] → [TopScope.GetValue('xar_l_inf')] × 3 = [TopScope.GetValue('xar_p_inf')]\n\n—— 死时持有头衔 ——\n伯爵级 ×1：[TopScope.GetValue('xar_n_t1')] 个 = [TopScope.GetValue('xar_p_t1')]\n公国级 ×2.5：[TopScope.GetValue('xar_n_t2')] 个 = [TopScope.GetValue('xar_p_t2')]\n王国级 ×5：[TopScope.GetValue('xar_n_t3')] 个 = [TopScope.GetValue('xar_p_t3')]\n帝国级 ×10：[TopScope.GetValue('xar_n_t4')] 个 = [TopScope.GetValue('xar_p_t4')]\n霸权级 ×20：[TopScope.GetValue('xar_n_t5')] 个 = [TopScope.GetValue('xar_p_t5')]\n\n—— 后代成就（在世后代的最高头衔）——\n伯爵级 ×0.25：[TopScope.GetValue('xar_d_t1')] 人 = [TopScope.GetValue('xar_p_d1')]\n公国级 ×1：[TopScope.GetValue('xar_d_t2')] 人 = [TopScope.GetValue('xar_p_d2')]\n王国级 ×2.5：[TopScope.GetValue('xar_d_t3')] 人 = [TopScope.GetValue('xar_p_d3')]\n帝国级 ×5：[TopScope.GetValue('xar_d_t4')] 人 = [TopScope.GetValue('xar_p_d4')]\n霸权级 ×10：[TopScope.GetValue('xar_d_t5')] 人 = [TopScope.GetValue('xar_p_d5')]\n\n—— 领地（有地时）——\n领地规模（含封臣伯爵领数）：[TopScope.GetValue('xar_a_realm')] → [TopScope.GetValue('xar_l_realm')] × 10 = [TopScope.GetValue('xar_p_realm')]\n\n—— 拒绝代价 ——\n已拒绝垂青会：[TopScope.GetValue('xar_reject_n')] 次 × -1%（总倍率最低为 0）\n\n总分 = [TopScope.GetValue('xar_p_dip')]+[TopScope.GetValue('xar_p_mar')]+[TopScope.GetValue('xar_p_ste')]+[TopScope.GetValue('xar_p_int')]+[TopScope.GetValue('xar_p_lea')]+[TopScope.GetValue('xar_p_pro')]+[TopScope.GetValue('xar_p_dyn')]+[TopScope.GetValue('xar_p_hou')]+[TopScope.GetValue('xar_p_gold')]+[TopScope.GetValue('xar_p_pres')]+[TopScope.GetValue('xar_p_pie')]+[TopScope.GetValue('xar_p_inf')]+[TopScope.GetValue('xar_p_t1')]+[TopScope.GetValue('xar_p_t2')]+[TopScope.GetValue('xar_p_t3')]+[TopScope.GetValue('xar_p_t4')]+[TopScope.GetValue('xar_p_t5')]+[TopScope.GetValue('xar_p_d1')]+[TopScope.GetValue('xar_p_d2')]+[TopScope.GetValue('xar_p_d3')]+[TopScope.GetValue('xar_p_d4')]+[TopScope.GetValue('xar_p_d5')]+[TopScope.GetValue('xar_p_realm')] = [TopScope.GetValue('xar_subtotal')]\n拒绝垂青: [TopScope.GetValue('xar_reject_n')] = -[TopScope.GetValue('xar_reject_n')]%\n最终分数: [TopScope.GetValue('xar_score')]\n\n此前纪录：[TopScope.GetValue('xar_old')]\n差值：[TopScope.GetValue('xar_delta')|+0]"
 xar.1001.new_record:0 "很好。这笔账，已记入永恒。"
 xar.1001.no_record:0 "不必气馁。琉焰会等你下次再来。"

 # Blessing/curse sessions (pools: docs/blessing-curse-pools.md)
 xar.0004.title:0 "琉焰的垂青"
 xar.0004.desc:0 "旅人，典当已毕。不过——我这儿还攒着些零碎的辉光，倒是可以赏你。\n\n只是规矩你懂：每一份垂青，都要用一道咒痕来换。……放心，很公平的。\n\n一会一契，恰好一对。成交或离席之后，我便退开——三年后，再来寻你。\n\n（累计完成 [TopScope.GetValue('xar_bc_n')] 对；已拒绝 [TopScope.GetValue('xar_br_n')] 次，最终结算 -[TopScope.GetValue('xar_br_n')]%）"
 xar.0004.decline:0 "什么都不领。"
 xar.0005.title:0 "等价的咒痕"
 xar.0005.desc:0 "挑好了？那么——该付账了。\n\n别怕，疼一下就过去了。……大概。"

 # 付费自定义廷臣
 xar_courtier_creator_decision:0 "典造琉焰廷臣"
 xar_courtier_creator_decision_desc:0 "请琉焰卿依照你的心意，为宫廷塑成一具性别、年岁、才学、特质、来处与血脉皆可落笔的灵魂。每一笔雕琢都有价码；待它跨过门槛，便会侍立于你的庭中。"
