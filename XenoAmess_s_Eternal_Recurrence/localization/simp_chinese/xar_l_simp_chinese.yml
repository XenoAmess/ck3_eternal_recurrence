 xar_courtier_creator_decision_confirm:0 "翻开典造契页"
 xar.cc.title:0 "待价而塑的灵魂"
 xar.cc.intro:0 "旅人，每座宫廷总有一把空椅。挑一份合意的温度，放在你的王座旁吧；等灵魂真正跨过门槛，我才会收账。"
