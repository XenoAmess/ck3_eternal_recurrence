l_simp_chinese:
 # 游戏规则
 rule_xar_enabled:0 "琉焰卿的永恒轮回"
 setting_xar_on:0 "启用"
 setting_xar_on_desc:0 "启用琉焰卿模式：开局时导入全局最高分副本，可用于购买属性。"
 setting_xar_off:0 "禁用"
 setting_xar_off_desc:0 "关闭琉焰卿模式。"

 # 教程课程 step 哨兵文本。所有语言必须保持一致：GUI 自动点击按它匹配。
 xar_silent_step:0 "XAR_SYNC_SENTINEL"

 # 顶位自定义本地化返回的哨兵。所有语言必须保持一致：GUI 导入 state 按它匹配。
 xar_top_bit_sentinel:0 "XAR_TOP_SENTINEL"

 # 退出到主菜单桥的哨兵。所有语言必须保持一致。
 xar_quit_sentinel:0 "XAR_QUIT_SENTINEL"

 # 特质
 trait_xar_glassfire_gaze:0 "琉焰之视"
 trait_xar_glassfire_gaze_desc:0 "该角色被那琉璃色的火焰凝视着，凝视着……直到终末。"

 # 抉择事件（开局）
 xar.0002.title:0 "终末之契"
 xar.0002.desc:0 "——又见面了，旅人。\n\n我是琉焰卿，栖于咒间的仲魔。你走过的每一条路，我都曾在尽头替你拾捡余温。\n\n若肯再签一次这纸契约，你前世的每一两分量，都将成为你今生的筹码。\n\n琉焰从不催促。它只是……一直看着。"
 xar.0002.accept:0 "我接受。让琉璃色的火见证。"
 xar.0002.decline:0 "罢了。这一生，我要自己走。"

 # 拒绝后的礼貌回复
 xar.0003.title:0 "琉焰的致意"
 xar.0003.desc:0 "无妨。琉焰从不强求任何人。\n\n愿你的故事只属于你自己——后会有期。也或许……后会无期。"
 xar.0003.ok:0 "珍重。"

 # 开局商店事件
 xar.0001.title:0 "轮回当铺"
 xar.0001.desc:0 "欢迎，旅人。这些散落的辉光，是你上一世的余烬。\n\n你持有 [TopScope.GetValue('xar_points')] 分。想换点什么？"
 xar.0001.diplomacy:0 "购买 +1 外交（[TopScope.GetValue('xar_pr_dip')|0] 分）"
 xar.0001.martial:0 "购买 +1 军事（[TopScope.GetValue('xar_pr_mar')|0] 分）"
 xar.0001.stewardship:0 "购买 +1 管理（[TopScope.GetValue('xar_pr_ste')|0] 分）"
 xar.0001.intrigue:0 "购买 +1 谋略（[TopScope.GetValue('xar_pr_int')|0] 分）"
 xar.0001.learning:0 "购买 +1 学识（[TopScope.GetValue('xar_pr_lea')|0] 分）"
 xar.0001.prowess:0 "购买 +1 勇武（[TopScope.GetValue('xar_pr_pro')|0] 分）"
 xar.0001.gold:0 "换取 100 金币（[TopScope.GetValue('xar_pr_gold')|0] 分）"
 xar.0001.prestige:0 "换取 100 威望（[TopScope.GetValue('xar_pr_pres')|0] 分）"
 xar.0001.piety:0 "换取 100 虔诚（[TopScope.GetValue('xar_pr_pie')|0] 分）"
 xar.0001.influence:0 "换取 100 影响力（[TopScope.GetValue('xar_pr_inf')|0] 分）"
 xar.0001.dynasty_prestige:0 "换取 100 宗族威望（[TopScope.GetValue('xar_pr_dyn')|0] 分）"
 xar.0001.lifespan:0 "换取 1 年预期寿命（[TopScope.GetValue('xar_pr_life')|0] 分）"
 xar.0001.reform:0 "一次免费的宗教改革（[TopScope.GetValue('xar_pr_reform')|0] 分，每局限一次）"
 xar.0001.reform_hint:0 "购买后前往信仰窗口进行改革，虔诚费用将被免除。"
 xar.0001.prev_page:0 "上一页"
 xar.0001.next_page:0 "下一页"
 xar.0001.finish:0 "开始此生（剩余 [TopScope.GetValue('xar_points')] 分将化作等量金币）"

 # 死亡结算事件
 xar.1001.title:0 "轮回终结"
 xar.1001.desc:0 "辛苦了，旅人。这一生的分量，我已仔细称过。\n\n—— 属性（每点 1 分）——\n外交：[TopScope.GetValue('xar_a_dip')] × 1 = [TopScope.GetValue('xar_p_dip')]\n军事：[TopScope.GetValue('xar_a_mar')] × 1 = [TopScope.GetValue('xar_p_mar')]\n管理：[TopScope.GetValue('xar_a_ste')] × 1 = [TopScope.GetValue('xar_p_ste')]\n谋略：[TopScope.GetValue('xar_a_int')] × 1 = [TopScope.GetValue('xar_p_int')]\n学识：[TopScope.GetValue('xar_a_lea')] × 1 = [TopScope.GetValue('xar_p_lea')]\n勇武：[TopScope.GetValue('xar_a_pro')] × 1 = [TopScope.GetValue('xar_p_pro')]\n\n—— 血脉（须为你的后代）——\n在世宗族成员：[TopScope.GetValue('xar_a_dyn')] × 0.1 = [TopScope.GetValue('xar_p_dyn')]\n在世家族成员（额外）：[TopScope.GetValue('xar_a_hou')] × 0.1 = [TopScope.GetValue('xar_p_hou')]\n\n—— 资源（log₂ 向下取整）——\n金钱：[TopScope.GetValue('xar_a_gold')] → [TopScope.GetValue('xar_l_gold')] × 5 = [TopScope.GetValue('xar_p_gold')]\n威望：[TopScope.GetValue('xar_a_pres')] → [TopScope.GetValue('xar_l_pres')] × 3 = [TopScope.GetValue('xar_p_pres')]\n虔诚：[TopScope.GetValue('xar_a_pie')] → [TopScope.GetValue('xar_l_pie')] × 3 = [TopScope.GetValue('xar_p_pie')]\n影响力：[TopScope.GetValue('xar_a_inf')] → [TopScope.GetValue('xar_l_inf')] × 3 = [TopScope.GetValue('xar_p_inf')]\n\n—— 死时持有头衔 ——\n伯爵级 ×1：[TopScope.GetValue('xar_n_t1')] 个 = [TopScope.GetValue('xar_p_t1')]\n公国级 ×2.5：[TopScope.GetValue('xar_n_t2')] 个 = [TopScope.GetValue('xar_p_t2')]\n王国级 ×5：[TopScope.GetValue('xar_n_t3')] 个 = [TopScope.GetValue('xar_p_t3')]\n帝国级 ×10：[TopScope.GetValue('xar_n_t4')] 个 = [TopScope.GetValue('xar_p_t4')]\n霸权级 ×20：[TopScope.GetValue('xar_n_t5')] 个 = [TopScope.GetValue('xar_p_t5')]\n\n—— 后代成就（在世后代的最高头衔）——\n伯爵级 ×0.25：[TopScope.GetValue('xar_d_t1')] 人 = [TopScope.GetValue('xar_p_d1')]\n公国级 ×1：[TopScope.GetValue('xar_d_t2')] 人 = [TopScope.GetValue('xar_p_d2')]\n王国级 ×2.5：[TopScope.GetValue('xar_d_t3')] 人 = [TopScope.GetValue('xar_p_d3')]\n帝国级 ×5：[TopScope.GetValue('xar_d_t4')] 人 = [TopScope.GetValue('xar_p_d4')]\n霸权级 ×10：[TopScope.GetValue('xar_d_t5')] 人 = [TopScope.GetValue('xar_p_d5')]\n\n—— 领地（有地时）——\n领地规模（含封臣伯爵领数）：[TopScope.GetValue('xar_a_realm')] → [TopScope.GetValue('xar_l_realm')] × 10 = [TopScope.GetValue('xar_p_realm')]\n\n总分 = [TopScope.GetValue('xar_p_dip')]+[TopScope.GetValue('xar_p_mar')]+[TopScope.GetValue('xar_p_ste')]+[TopScope.GetValue('xar_p_int')]+[TopScope.GetValue('xar_p_lea')]+[TopScope.GetValue('xar_p_pro')]+[TopScope.GetValue('xar_p_dyn')]+[TopScope.GetValue('xar_p_hou')]+[TopScope.GetValue('xar_p_gold')]+[TopScope.GetValue('xar_p_pres')]+[TopScope.GetValue('xar_p_pie')]+[TopScope.GetValue('xar_p_inf')]+[TopScope.GetValue('xar_p_t1')]+[TopScope.GetValue('xar_p_t2')]+[TopScope.GetValue('xar_p_t3')]+[TopScope.GetValue('xar_p_t4')]+[TopScope.GetValue('xar_p_t5')]+[TopScope.GetValue('xar_p_d1')]+[TopScope.GetValue('xar_p_d2')]+[TopScope.GetValue('xar_p_d3')]+[TopScope.GetValue('xar_p_d4')]+[TopScope.GetValue('xar_p_d5')]+[TopScope.GetValue('xar_p_realm')] = [TopScope.GetValue('xar_score')]\n\n此前纪录：[TopScope.GetValue('xar_old')]\n差值：[TopScope.GetValue('xar_delta')|+0]"
 xar.1001.new_record:0 "很好。这笔账，已记入永恒。"
 xar.1001.no_record:0 "不必气馁。琉焰会等你下次再来。"
