 xar.cc.skill.diplomacy:0 "外交"
 xar.cc.skill.martial:0 "军事"
 xar.cc.skill.stewardship:0 "管理"
 xar.cc.skill.intrigue:0 "谋略"
 xar.cc.skill.learning:0 "学识"
 xar.cc.skill.prowess:0 "勇武"
 xar.cc.numeric.minus_10:0 "-10"
 xar.cc.numeric.minus_1:0 "-1"
 xar.cc.numeric.plus_1:0 "+1"
 xar.cc.numeric.plus_10:0 "+10"
 xar.cc.base_stats:0 "年龄可在 0 至 120 岁间精确落笔。六道只读刻度显示 0 至 100 的确切基础能力，请用四枚步进按钮调整；价码沿原生统治者设计器的非线性绝对曲线称量，教育与特质的原生修正随后覆上。"
 xar.cc.education.help:0 "原生教育特质尽列于此。年满 16 岁的灵魂必须恰选一项；孩子则不携任何教育特质。旅人，空白与贪多都会让契页拒绝封缄。"
 xar.cc.commander.help:0 "17 项原生将领特质尽列于此，至多典入两项；每项皆从零经验的基础掌握起步。已选：[GetPlayer.MakeScope.Var('xar_cc_commander_count').GetValue|0]/2。"
 xar.cc.physical.help:0 "38 项原生身体特质尽列于此，连原生设计器藏起的$trait_impotent$也在账上。相容的骨血雕琢可以并存。"
 xar.cc.personality.help:0 "36 项原生性格特质尽列于此，至多典入三项；若新选项与旧有心性相反，旧项会被替换。已选：[GetPlayer.MakeScope.Var('xar_cc_personality_count').GetValue|0]/3。"
 xar.cc.other.help:0 "其余 108 项原生统治者设计器可见特质都收在此页，其中不乏权势、身份、健康与足以改写命途的选择。价签很诚实，旅人。"
