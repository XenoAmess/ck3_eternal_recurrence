 xar.gaze.milestone.10:0 "El primer anillo del fuego de cristal se abre. Las palabras encuentran puertas más estrechas, y te concedo una nueva tirada para que el favor se adapte mejor a tu gusto."
 xar.gaze.milestone.20:0 "El segundo anillo aprende la medida de una hoja. Obtienes un sello; anular una marca de maldición de vez en cuando endulza la próxima prenda."
 xar.gaze.milestone.30:0 "El tercer anillo cuenta cada brasa por ti. Dos nuevas tiradas son tuyas, viajero; cuantas más opciones se ofrezcan, más se parece el deseo al consentimiento."
 xar.gaze.milestone.40:0 "El cuarto anillo esconde secretos entre parpadeos. Dos sellos se han enfriado, suficientes para elegir qué marcas de maldición estás dispuesto a conservar."
 xar.gaze.milestone.50:0 "El quinto anillo ilumina el reverso del pacto. Conserva dos nuevas tiradas y un sello; el conocimiento nunca elimina un precio, solo lo revela."
 xar.gaze.milestone.60:0 "El sexto anillo arde a lo largo del hueso, suave como un abrazo. Una nueva tirada, dos sellos y un cuerpo más firme: todo mi favor."
 xar.gaze.milestone.70:0 "El séptimo anillo otorga a la verdad y a la mentira el mismo calor. Tres nuevas tiradas y un sello pueden tallar el azar en tu destino preferido."
 xar.gaze.milestone.80:0 "El octavo anillo puede sopesar una corona. Una nueva tirada y tres sellos te permiten llegar más lejos mientras yo llevo paciente la cuenta."
 xar.gaze.milestone.90:0 "El noveno anillo casi se solapa con el alma. Cuatro nuevas tiradas y dos sellos; el final está lejos, aunque ya has aprendido a nombrar su precio."
 xar.gaze.milestone.100:0 "El décimo anillo se cierra en la Mirada del Fuego de Cristal completa. Tres nuevas tiradas, cuatro sellos y un último crecimiento: viajero, te has convertido en una reliquia digna de conservarse."
