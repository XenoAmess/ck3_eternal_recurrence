 xar.0010.desc_clean:0 "Viajero, tus brasas anteriores permanecen, pero esta huella no deja herencia gastable. Bien —llegar al final con las manos vacías hace que el pesaje resulte más interesante. Aun así, anotaré el primer favor en cuenta."
