 # Trait
 trait_xar_glassfire_gaze:0 "Mirada del Fuego de Cristal"
 trait_xar_glassfire_gaze_desc:0 "Este personaje es observado por esa llama color cristal, observado... hasta el mismísimo final."
 trait_xar_glassfire_gaze_character_desc:0 "Este personaje es observado por esa llama de cristal... hasta el final.\n\nPeso actual: #V [SCOPE.ScriptValue('xar_current_score_value')|1]#! (solo vista previa)"
 trait_track_xar_glassfire_gaze:0 "Ascuas de Fuego de Cristal"
 trait_track_xar_glassfire_gaze_desc:0 "Cada pareja completada de bendición y maldición otorga 1 de experiencia. Cada 10 de experiencia, un nivel añade otro 10% de ganancia de estrés."

 # The pact (game start)
 xar.0002.title:0 "Pacto del Fin"
 xar.0002.desc:0 "—Nos reencontramos, viajero.\n\nSoy el Señor del Fuego de Cristal, un demonio intermediario que mora entre maldiciones. Cada camino que has recorrido, he recogido sus brasas al final.\n\nFirma este pacto una vez más, y cada onza de tus vidas pasadas se convertirá en la moneda de cambio de esta vida.\n\nEl fuego de cristal nunca tiene prisa. Simplemente... sigue observando."
 xar.0002.accept:0 "Acepto. Que el fuego de cristal sea testigo."
 xar.0002.decline:0 "No. Esta vida la camino solo."

 # Polite farewell
 xar.0003.title:0 "Los Saludos del Fuego de Cristal"
 xar.0003.desc:0 "No importa. El fuego de cristal nunca insiste.\n\nQue tu historia te pertenezca solo a ti — hasta la próxima. O quizás... nunca más."
 xar.0003.ok:0 "Adiós."

 # Opening shop event
 xar.0001.title:0 "La Casa de Empeños de la Recurrencia"
 xar.0001.desc:0 "Bienvenido, viajero. Estos destellos dispersos son las brasas de tu vida pasada.\n\nTienes [TopScope.GetValue('xar_points')] puntos. ¿Qué te llama la atención?"
 xar.0001.diplomacy:0 "Comprar +1 Diplomacia ([TopScope.GetValue('xar_pr_dip')|0] puntos)"
 xar.0001.martial:0 "Comprar +1 Marcial ([TopScope.GetValue('xar_pr_mar')|0] puntos)"
 xar.0001.stewardship:0 "Comprar +1 Administración ([TopScope.GetValue('xar_pr_ste')|0] puntos)"
 xar.0001.intrigue:0 "Comprar +1 Intriga ([TopScope.GetValue('xar_pr_int')|0] puntos)"
 xar.0001.learning:0 "Comprar +1 Erudición ([TopScope.GetValue('xar_pr_lea')|0] puntos)"
 xar.0001.prowess:0 "Comprar +1 Proeza ([TopScope.GetValue('xar_pr_pro')|0] puntos)"
 xar.0001.gold:0 "Cambiar por 100 de oro ([TopScope.GetValue('xar_pr_gold')|0] puntos)"
 xar.0001.prestige:0 "Cambiar por 100 de prestigio ([TopScope.GetValue('xar_pr_pres')|0] puntos)"
 xar.0001.piety:0 "Cambiar por 100 de piedad ([TopScope.GetValue('xar_pr_pie')|0] puntos)"
 xar.0001.influence:0 "Cambiar por 100 de influencia ([TopScope.GetValue('xar_pr_inf')|0] puntos)"
 xar.0001.dynasty_prestige:0 "Cambiar por 100 de prestigio de dinastía ([TopScope.GetValue('xar_pr_dyn')|0] puntos)"
 xar.0001.lifespan:0 "Cambiar por 1 acumulación de vida prestada (+1 Salud; [TopScope.GetValue('xar_pr_life')|0] puntos)"
 xar.0001.reform:0 "Una reforma de fe gratuita ([TopScope.GetValue('xar_pr_reform')|0] puntos, una vez por partida)"
 xar.0001.reform_hint:0 "Tras la compra, reforma desde la ventana de fe; el coste de piedad queda anulado."
 xar.0001.grand_tribute:0 "Ofrecer el Gran Tributo: +1500 de prestigio, piedad, influencia y prestigio dinástico ([TopScope.GetValue('xar_pr_grand_tribute')|0] puntos)"
 xar.0001.borrowed_generation:0 "Tomar prestada una generación: completar 25 acumulaciones de vida (+1 Salud cada una; [TopScope.GetValue('xar_pr_borrowed_generation')|0] puntos)"
 xar.0001.sixfold_apotheosis:0 "Apoteosis séxtuple: +30 a todas las habilidades ([TopScope.GetValue('xar_pr_sixfold_apotheosis')|0] puntos)"
 xar.0001.reroll_token:0 "Buy one favor reroll ([TopScope.GetValue('xar_pr_reroll')|0] points)"
 xar.0001.seal_token:0 "Buy one curse-mark seal ([TopScope.GetValue('xar_pr_seal')|0] points)"
 xar.0001.dread:0 "Pawn a Whispered Atrocity: gain 20 Dread ([TopScope.GetValue('xar_pr_dread')|0] points, once per run)"
 xar.0001.legitimacy:0 "Make the Crown Remember You: gain 100 Legitimacy ([TopScope.GetValue('xar_pr_legitimacy')|0] points, once per run)"
 xar.0001.tyranny:0 "Burn Ten Lines from the Ledger: lose 10 Tyranny ([TopScope.GetValue('xar_pr_tyranny')|0] points, once per run)"
 xar.0001.prev_page:0 "Página anterior"
 xar.0001.next_page:0 "Página siguiente"
 xar.0001.finish:0 "Comenzar esta vida (los [TopScope.GetValue('xar_points')] puntos restantes se convierten en la misma cantidad de oro)"

 # Primera vida y libro mayor
 xar.0010.title:0 "Una Vida Aún Sin Encender"
 xar.0010.desc:0 "Viajero, esta página sigue en blanco. No tienes brasas de una vida pasada que empeñar; la tienda solo mostraría precios silenciosos.\n\nTe concederé una historia a crédito. El peso de esta vida se medirá al final; alcanza un nuevo nivel de brasas y tu próxima vida tendrá con qué negociar.\n\nEl primer favor... lo apuntaré en tu cuenta."
 xar.0010.begin:0 "Entonces, que comience esta vida."
 xar_ledger_decision:0 "Libro Mayor del Fuego de Cristal"
 xar_ledger_decision_desc:0 "Abre la cuenta que guarda el Señor del Fuego de Cristal y consulta el peso actual y el siguiente umbral de brasas. Solo lectura."
 xar_ledger_decision_tooltip:0 "Ver la puntuación actual, el nivel histórico de brasas y el siguiente nivel"
 xar_ledger_decision_confirm:0 "Abrir el libro"
 xar.0011.title:0 "Libro Mayor del Fuego de Cristal"
 xar.0011.desc:0 "Viajero, tu página siempre espera. Mirar las cifras no sella ningún trato.\n\nPuntuación actual de solo lectura: #V [TopScope.GetValue('xar_ledger_score')|1]#!\nNivel histórico de brasas: #V [TopScope.GetValue('xar_ledger_history')|0]#!\nNivel candidato actual: #V [TopScope.GetValue('xar_ledger_candidate')|0]#!\nSiguiente nivel: #V [TopScope.GetValue('xar_ledger_next')|0]#!\nDistancia al siguiente nivel: #V [TopScope.GetValue('xar_ledger_gap')|1]#!\nPares de bendición y maldición completados: #V [TopScope.GetValue('xar_ledger_pairs')|0]#!\nRechazos: #V [TopScope.GetValue('xar_ledger_refusals')|0]#!"
 xar.0011.desc_cap:0 "$xar.0011.desc$\n\n#P Esta cuenta ha alcanzado el límite actual de niveles de brasas; el siguiente nivel sigue siendo el límite y la distancia es cero.#!"
 xar.0011.close:0 "Cerrar. Las brasas aún arden."

 # Death score event
 xar.1001.title:0 "La Recurrencia Termina"
 xar.1001.new_record:0 "Bien hecho. Esta cuenta queda escrita en la eternidad."
 xar.1001.no_record:0 "No te desanimes. El fuego de cristal esperará tu regreso."
 xar.1001.desc:0 "Bien hecho, viajero. El peso de esta vida ha sido medido con esmero.\n\n—— Atributos (1 punto cada uno) ——\nDiplomacia: [TopScope.GetValue('xar_a_dip')] × 1 = [TopScope.GetValue('xar_p_dip')]\nMarcial: [TopScope.GetValue('xar_a_mar')] × 1 = [TopScope.GetValue('xar_p_mar')]\nAdministración: [TopScope.GetValue('xar_a_ste')] × 1 = [TopScope.GetValue('xar_p_ste')]\nIntriga: [TopScope.GetValue('xar_a_int')] × 1 = [TopScope.GetValue('xar_p_int')]\nErudición: [TopScope.GetValue('xar_a_lea')] × 1 = [TopScope.GetValue('xar_p_lea')]\nProeza: [TopScope.GetValue('xar_a_pro')] × 1 = [TopScope.GetValue('xar_p_pro')]\n\n—— Sangre (deben ser tus descendientes) ——\nMiembros vivos de la dinastía: [TopScope.GetValue('xar_a_dyn')] × 0.1 = [TopScope.GetValue('xar_p_dyn')]\nMiembros vivos de la casa (extra): [TopScope.GetValue('xar_a_hou')] × 0.1 = [TopScope.GetValue('xar_p_hou')]\n\n—— Recursos (log₂ redondeado abajo) ——\nOro: [TopScope.GetValue('xar_a_gold')] → [TopScope.GetValue('xar_l_gold')] × 5 = [TopScope.GetValue('xar_p_gold')]\nPrestigio: [TopScope.GetValue('xar_a_pres')] → [TopScope.GetValue('xar_l_pres')] × 3 = [TopScope.GetValue('xar_p_pres')]\nPiedad: [TopScope.GetValue('xar_a_pie')] → [TopScope.GetValue('xar_l_pie')] × 3 = [TopScope.GetValue('xar_p_pie')]\nInfluencia: [TopScope.GetValue('xar_a_inf')] → [TopScope.GetValue('xar_l_inf')] × 3 = [TopScope.GetValue('xar_p_inf')]\n\n—— Títulos al morir ——\nCondado ×1: [TopScope.GetValue('xar_n_t1')] = [TopScope.GetValue('xar_p_t1')]\nDucado ×2.5: [TopScope.GetValue('xar_n_t2')] = [TopScope.GetValue('xar_p_t2')]\nReino ×5: [TopScope.GetValue('xar_n_t3')] = [TopScope.GetValue('xar_p_t3')]\nImperio ×10: [TopScope.GetValue('xar_n_t4')] = [TopScope.GetValue('xar_p_t4')]\nHegemonía ×20: [TopScope.GetValue('xar_n_t5')] = [TopScope.GetValue('xar_p_t5')]\n\n—— Descendientes (título más alto de descendientes vivos) ——\nCondado ×0.25: [TopScope.GetValue('xar_d_t1')] = [TopScope.GetValue('xar_p_d1')]\nDucado ×1: [TopScope.GetValue('xar_d_t2')] = [TopScope.GetValue('xar_p_d2')]\nReino ×2.5: [TopScope.GetValue('xar_d_t3')] = [TopScope.GetValue('xar_p_d3')]\nImperio ×5: [TopScope.GetValue('xar_d_t4')] = [TopScope.GetValue('xar_p_d4')]\nHegemonía ×10: [TopScope.GetValue('xar_d_t5')] = [TopScope.GetValue('xar_p_d5')]\n\n—— Dominio (si posees tierras) ——\nTamaño del dominio (condados incl. vasallos): [TopScope.GetValue('xar_a_realm')] → [TopScope.GetValue('xar_l_realm')] × 10 = [TopScope.GetValue('xar_p_realm')]\n\n—— Precio del rechazo ——\nSesiones de favor rechazadas: [TopScope.GetValue('xar_reject_n')] × -1% (multiplicador mínimo 0)\n\nTotal = [TopScope.GetValue('xar_p_dip')]+[TopScope.GetValue('xar_p_mar')]+[TopScope.GetValue('xar_p_ste')]+[TopScope.GetValue('xar_p_int')]+[TopScope.GetValue('xar_p_lea')]+[TopScope.GetValue('xar_p_pro')]+[TopScope.GetValue('xar_p_dyn')]+[TopScope.GetValue('xar_p_hou')]+[TopScope.GetValue('xar_p_gold')]+[TopScope.GetValue('xar_p_pres')]+[TopScope.GetValue('xar_p_pie')]+[TopScope.GetValue('xar_p_inf')]+[TopScope.GetValue('xar_p_t1')]+[TopScope.GetValue('xar_p_t2')]+[TopScope.GetValue('xar_p_t3')]+[TopScope.GetValue('xar_p_t4')]+[TopScope.GetValue('xar_p_t5')]+[TopScope.GetValue('xar_p_d1')]+[TopScope.GetValue('xar_p_d2')]+[TopScope.GetValue('xar_p_d3')]+[TopScope.GetValue('xar_p_d4')]+[TopScope.GetValue('xar_p_d5')]+[TopScope.GetValue('xar_p_realm')] = [TopScope.GetValue('xar_subtotal')]\nFavores rechazados: [TopScope.GetValue('xar_reject_n')] = -[TopScope.GetValue('xar_reject_n')]%\nPuntuación final: [TopScope.GetValue('xar_score')]\n\nRécord anterior: [TopScope.GetValue('xar_old')]\nDiferencia: [TopScope.GetValue('xar_delta')|+0]"

 # Blessing/curse sessions (pools: docs/blessing-curse-pools.md)
 xar.0004.title:0 "El Favor del Fuego de Cristal"
 xar.0004.desc:0 "Bien, viajero, nuestro trato ha concluido. Y sin embargo — aún guardo algunos destellos dispersos en la manga. Podría concederte alguno.\n\nPero conoces la regla: cada favor exige a cambio una marca de maldición. ...Un trato justo, lo prometo.\n\nUn encuentro, un par. Tras el trato — o tu rechazo — volveré a buscarte en tres años.\n\n（Completados [TopScope.GetValue('xar_bc_n')]; rechazados [TopScope.GetValue('xar_br_n')], puntuación final -[TopScope.GetValue('xar_br_n')]%）"
 xar.0004.decline:0 "No quiero nada."
 xar.0005.title:0 "El Precio de la Marca"
 xar.0005.desc:0 "¿Elegiste? Entonces — es hora de saldar la cuenta.\n\nNo temas. Solo escuece un instante. ...Probablemente."
