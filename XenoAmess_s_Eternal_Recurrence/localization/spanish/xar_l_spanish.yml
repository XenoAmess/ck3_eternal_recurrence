l_spanish:
 # Game rule
 rule_xar_enabled:0 "La Recurrencia Eterna del Señor del Fuego de Cristal"
 setting_xar_on:0 "Activado"
 setting_xar_on_desc:0 "El modo del Señor del Fuego de Cristal está activo: el récord global se importa al comenzar la partida y puede gastarse en mejoras."
 setting_xar_off:0 "Desactivado"
 setting_xar_off_desc:0 "El modo del Señor del Fuego de Cristal está inactivo."
 setting_xar_selftest:0 "Autoprueba"
 setting_xar_selftest_desc:0 "Autoprueba de aceptación automatizada. Solo para desarrollo."

 # Tutorial lesson step sentinel text. Must stay identical in every language.
 xar_silent_step:0 "XAR_SYNC_SENTINEL"

 # Sentinel returned by the record-level customizable localization.
 xar_top_bit_sentinel:0 "XAR_TOP_SENTINEL"

