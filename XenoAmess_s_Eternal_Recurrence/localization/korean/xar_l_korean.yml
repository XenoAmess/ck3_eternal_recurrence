l_korean:
 xar.no_heir_settlement.desc:0 "나그네, 기본 게임의 결말은 그대의 장부를 닫았을 것입니다. 하지만 이 무게는 제 것이자 그대의 것입니다."
 xar.no_heir.score:0 "최종 무게"
 xar.no_heir.subtotal:0 "거절 이전의 무게"
 xar.no_heir.pairs:0 "완료된 거래"
 xar.no_heir.refusals:0 "거절한 호의"
 xar.no_heir.contract:0 "계약 진행"
 xar.no_heir.old:0 "이전 잔불 등급"
 xar.no_heir.candidate:0 "후보 잔불 등급"
 xar.no_heir.delta:0 "기록 차이"
 xar.no_heir.footer:0 "후계자를 남기지 않는다 해서 무게까지 남기지 않는 것은 아닙니다. 잔불은 영원에 기록되어, 다음 나그네가 도착하면 제가 다시 이 장을 조용히 펼칠 것입니다."
 # Game rule
 rule_xar_enabled:0 "유리불꽃 군주의 영원한 윤회"
 setting_xar_on:0 "활성화"
 setting_xar_on_desc:0 "유리불꽃 군주 모드 활성화: 게임 시작 시 전역 최고 기록을 불러와 강화 구매에 사용할 수 있습니다. 새로 달성한 잔불 단계를 기록하려면 튜토리얼(Tutorial)을 활성화해 두어야 합니다."
 setting_xar_off:0 "비활성화"
 setting_xar_off_desc:0 "유리불꽃 군주 모드가 비활성화되었습니다."
 setting_xar_selftest:0 "자가 테스트"
 setting_xar_selftest_desc:0 "자동화 인수 테스트. 개발용."
 rule_xar_inheritance:0 "잔불 상속"
 setting_xar_inherit_0:0 "청결: 0%"
 setting_xar_inherit_0_desc:0 "시작 예산을 상속하지 않습니다; 잔불 등급은 여전히 반입되어 표시됩니다."
 setting_xar_inherit_25:0 "억제: 25%"
 setting_xar_inherit_25_desc:0 "역사적 잔불 등급의 25%를 내림하여 상속하며 예산 상한은 없습니다."
 setting_xar_inherit_50:0 "균형: 50%"
 setting_xar_inherit_50_desc:0 "역사적 잔불 등급의 50%를 내림하여 상속하며 예산 상한은 없습니다."
 setting_xar_inherit_100:0 "완전: 100%"
 setting_xar_inherit_100_desc:0 "역사적 잔불 등급 전체를 예산 상한 없이 상속합니다."
 rule_xar_score_basis:0 "점수 산정 기준"
 setting_xar_score_absolute:0 "절대치"
 setting_xar_score_absolute_desc:0 "사망 시 군주의 전체 상태를 점수화합니다."
 setting_xar_score_growth:0 "평생 성장"
 setting_xar_score_growth_desc:0 "개막 거래와 첫 협상 이후의 순성장분만 점수화합니다."
 xar_track_abs_0:0 "절대 · 0% · v2"
 xar_track_abs_25:0 "절대 · 25% · v2"
 xar_track_abs_50:0 "절대 · 50% · v2"
 xar_track_abs_100:0 "절대 · 100% · v2"
 xar_track_growth_0:0 "성장 · 0% · v2"
 xar_track_growth_25:0 "성장 · 25% · v2"
 xar_track_growth_50:0 "성장 · 50% · v2"
 xar_track_growth_100:0 "성장 · 100% · v2"
 xar.challenge.summary:0 "\n\n— 도전 트랙 —\n트랙: #V [ROOT.Char.Custom('xar_track_name')]#!\n상속: [TopScope.GetValue('xar_challenge_ratio')|0]% (예산 상한 없음)\n성장 기준치: [TopScope.GetValue('xar_challenge_baseline')|1]"

 # Tutorial lesson step sentinel text. Must stay identical in every language.
 xar_silent_step:0 "XAR_SYNC_SENTINEL"

 # Sentinel returned by the record-level customizable localization.
 xar_top_bit_sentinel:0 "XAR_TOP_SENTINEL"

 # Sentinel for the exit-to-menu bridge.
 xar_quit_sentinel:0 "XAR_QUIT_SENTINEL"

 # Trait
 trait_xar_glassfire_gaze:0 "유리불꽃의 시선"
 trait_xar_glassfire_gaze_desc:0 "이 캐릭터는 유리빛 불꽃의 시선을 받고 있습니다, 받고 있습니다... 마지막 순간까지."
 trait_xar_glassfire_gaze_character_desc:0 "이 캐릭터는 유리빛 불꽃의 시선을 받고 있습니다... 마지막 순간까지.\n\n현재 무게: #V [SCOPE.ScriptValue('xar_current_score_value')|1]#! (미리보기 전용)"
 trait_track_xar_glassfire_gaze:0 "유리불꽃의 잔불"
 trait_track_xar_glassfire_gaze_desc:0 "완료된 은혜와 주흔 쌍마다 경험치를 1 얻습니다. 경험치 10마다 레벨이 하나 올라, 추가 스트레스 10% 증가와 함께 기본 능력치 성장, 재추첨, 인장을 얻습니다."

 # The pact (game start)
 xar.0002.title:0 "종말의 계약"
 xar.0002.desc:0 "—다시 만났군, 나그네.\n\n나는 유리불꽃 군주, 저주의 틈새에 깃든 중개의 마귀다. 네가 걸어온 모든 길, 나는 그 끝에서 잔불을 주워 모았다.\n\n이 계약에 다시 한번 서명한다면, 전생의 모든 무게가 이번 생의 흥정 자본이 되리라.\n\n유리불꽃은 재촉하지 않는다. 그저... 계속 지켜볼 뿐."
 xar.0002.accept:0 "받아들이겠다. 유리빛 불꽃이 증인이 되어라."
 xar.0002.decline:0 "아니. 이번 생은 혼자 걷겠다."

 # Polite farewell
 xar.0003.title:0 "유리불꽃의 인사"
 xar.0003.desc:0 "좋다. 유리불꽃은 누구에게도 강요하지 않는다.\n\n네 이야기가 오직 너만의 것이길——다시 만나자. 어쩌면... 영원히."
 xar.0003.ok:0 "잘 가라."

 # Opening shop event
 xar.0001.title:0 "윤회의 전당포"
 xar.0001.desc:0 "어서 오게, 나그네. 흩어진 이 빛들은 지난 생의 잔불이네.\n\n[TopScope.GetValue('xar_points')] 포인트를 가지고 있네. 무엇을 원하는가?"
 xar.0001.diplomacy:0 "외교 +1 구매 ([TopScope.GetValue('xar_pr_dip')|0] 포인트)"
 xar.0001.martial:0 "군사 +1 구매 ([TopScope.GetValue('xar_pr_mar')|0] 포인트)"
 xar.0001.stewardship:0 "관리 +1 구매 ([TopScope.GetValue('xar_pr_ste')|0] 포인트)"
 xar.0001.intrigue:0 "모략 +1 구매 ([TopScope.GetValue('xar_pr_int')|0] 포인트)"
 xar.0001.learning:0 "학문 +1 구매 ([TopScope.GetValue('xar_pr_lea')|0] 포인트)"
 xar.0001.prowess:0 "무력 +1 구매 ([TopScope.GetValue('xar_pr_pro')|0] 포인트)"
 xar.0001.gold:0 "금화 100으로 교환 ([TopScope.GetValue('xar_pr_gold')|0] 포인트)"
 xar.0001.prestige:0 "위신 100으로 교환 ([TopScope.GetValue('xar_pr_pres')|0] 포인트)"
 xar.0001.piety:0 "경건 100으로 교환 ([TopScope.GetValue('xar_pr_pie')|0] 포인트)"
 xar.0001.influence:0 "영향력 100으로 교환 ([TopScope.GetValue('xar_pr_inf')|0] 포인트)"
 xar.0001.dynasty_prestige:0 "왕조 위신 100으로 교환 ([TopScope.GetValue('xar_pr_dyn')|0] 포인트)"
 xar.0001.lifespan:0 "빌린 수명 1중첩으로 교환 (건강 +1; [TopScope.GetValue('xar_pr_life')|0] 포인트)"
 xar.0001.reform:0 "무료 종교 개혁 1회 ([TopScope.GetValue('xar_pr_reform')|0] 포인트, 플레이당 1회)"
 xar.0001.reform_hint:0 "구매 후 신앙 창에서 개혁을 진행하면 경건 비용이 면제됩니다."
 xar.0001.grand_tribute:0 "만국의 공물: 위신, 신앙심, 영향력, 왕조 위신 각각 +1,500 ([TopScope.GetValue('xar_pr_grand_tribute')|0] 포인트)"
 xar.0001.borrowed_generation:0 "한 세대를 빌리기: 빌린 수명을 25중첩까지 충전 (각 건강 +1; [TopScope.GetValue('xar_pr_borrowed_generation')|0] 포인트)"
 xar.0001.sixfold_apotheosis:0 "육능 승천: 모든 능력 +30 ([TopScope.GetValue('xar_pr_sixfold_apotheosis')|0] 포인트)"
 xar.0001.reroll_token:0 "은혜 재추첨 한 회 구매 ([TopScope.GetValue('xar_pr_reroll')|0] 점)"
 xar.0001.seal_token:0 "주흔 인장 한 회 구매 ([TopScope.GetValue('xar_pr_seal')|0] 점)"
 xar.0001.dread:0 "속삭여진 잔혹을 전당으로 잡다: 공포 20 획득 ([TopScope.GetValue('xar_pr_dread')|0] 점, 한 차례당 1회)"
 xar.0001.legitimacy:0 "왕관을 당신을 기억하게 하다: 정통성 100 획득 ([TopScope.GetValue('xar_pr_legitimacy')|0] 점, 한 차례당 1회)"
 xar.0001.tyranny:0 "장부에서 열 줄을 태우다: 폭정 10 손실 ([TopScope.GetValue('xar_pr_tyranny')|0] 점, 한 차례당 1회)"
 xar.0001.prev_page:0 "이전 페이지"
 xar.0001.next_page:0 "다음 페이지"
 xar.0001.finish:0 "이번 생을 시작 (남은 [TopScope.GetValue('xar_points')] 포인트는 동량의 금화가 됨)"

 # 첫 생과 유리불꽃 장부
 xar.0010.title:0 "아직 타오르지 않은 생"
 xar.0010.desc:0 "나그네, 이 장은 아직 비어 있네. 저당 잡힐 전생의 잔불이 없으니, 가게를 열어도 말없는 가격표만 보일 뿐이지.\n\n우선 이야기 하나를 외상으로 빌려주겠네. 이번 생의 무게는 종말에 달아 볼 것이고, 새 잔불 단계에 닿으면 다음 생에는 흥정할 밑천이 생길 걸세.\n\n첫 총애는... 장부에 달아 두지."
 xar.0010.begin:0 "그럼, 이번 생을 시작하지."
 xar_ledger_decision:0 "유리불꽃 장부"
 xar_ledger_decision_desc:0 "유리불꽃 군주가 기록한 이번 생의 장부를 열어 현재 무게와 다음 잔불 문턱을 확인합니다. 읽기 전용입니다."
 xar_ledger_decision_tooltip:0 "현재 점수, 역사적 잔불 단계, 다음 단계 확인"
 xar_ledger_decision_confirm:0 "장부 열기"
 xar.0011.title:0 "유리불꽃 장부"
 xar.0011.desc:0 "나그네, 자네의 장은 언제나 기다리고 있네. 숫자를 보기만 하는 것은 거래가 아니니 안심하게.\n\n현재 읽기 전용 점수: #V [TopScope.GetValue('xar_ledger_score')|1]#!\n역사적 잔불 단계: #V [TopScope.GetValue('xar_ledger_history')|0]#!\n현재 후보 단계: #V [TopScope.GetValue('xar_ledger_candidate')|0]#!\n다음 단계: #V [TopScope.GetValue('xar_ledger_next')|0]#!\n다음 단계까지의 차이: #V [TopScope.GetValue('xar_ledger_gap')|1]#!\n완료한 축복/저주 쌍: #V [TopScope.GetValue('xar_ledger_pairs')|0]#!\n거절 횟수: #V [TopScope.GetValue('xar_ledger_refusals')|0]#!"
 xar.0011.desc_cap:0 "$xar.0011.desc$\n\n#P 이 장부는 현재 잔불 단계 상한에 도달했네. 다음 단계도 상한으로 표시되며 차이는 0일세.#!"
 xar.0011.close:0 "덮어 두게. 잔불은 아직 타고 있으니."

 # Death score event
 xar.1001.title:0 "윤회의 종말"
 xar.1001.new_record:0 "잘했네. 이 장부는 영원에 기록되었네."
 xar.1001.no_record:0 "낙담하지 말게. 유리불꽃은 자네의 귀환을 기다리고 있네."
 xar.1001.desc:0 "잘했네, 나그네. 이번 생의 무게는 꼼꼼히 저울질했네.\n\n—— 속성 (각 1포인트) ——\n외교: [TopScope.GetValue('xar_a_dip')] × 1 = [TopScope.GetValue('xar_p_dip')]\n군사: [TopScope.GetValue('xar_a_mar')] × 1 = [TopScope.GetValue('xar_p_mar')]\n관리: [TopScope.GetValue('xar_a_ste')] × 1 = [TopScope.GetValue('xar_p_ste')]\n모략: [TopScope.GetValue('xar_a_int')] × 1 = [TopScope.GetValue('xar_p_int')]\n학문: [TopScope.GetValue('xar_a_lea')] × 1 = [TopScope.GetValue('xar_p_lea')]\n무력: [TopScope.GetValue('xar_a_pro')] × 1 = [TopScope.GetValue('xar_p_pro')]\n\n—— 혈통 (자네의 후손이어야 함) ——\n생존 왕조 구성원: [TopScope.GetValue('xar_a_dyn')] × 0.1 = [TopScope.GetValue('xar_p_dyn')]\n생존 가문 구성원 (추가): [TopScope.GetValue('xar_a_hou')] × 0.1 = [TopScope.GetValue('xar_p_hou')]\n\n—— 자원 (log₂ 내림) ——\n금화: [TopScope.GetValue('xar_a_gold')] → [TopScope.GetValue('xar_l_gold')] × 5 = [TopScope.GetValue('xar_p_gold')]\n위신: [TopScope.GetValue('xar_a_pres')] → [TopScope.GetValue('xar_l_pres')] × 3 = [TopScope.GetValue('xar_p_pres')]\n경건: [TopScope.GetValue('xar_a_pie')] → [TopScope.GetValue('xar_l_pie')] × 3 = [TopScope.GetValue('xar_p_pie')]\n영향력: [TopScope.GetValue('xar_a_inf')] → [TopScope.GetValue('xar_l_inf')] × 3 = [TopScope.GetValue('xar_p_inf')]\n\n—— 사망 시 보유 칭호 ——\n백작령급 ×1: [TopScope.GetValue('xar_n_t1')] = [TopScope.GetValue('xar_p_t1')]\n공국급 ×2.5: [TopScope.GetValue('xar_n_t2')] = [TopScope.GetValue('xar_p_t2')]\n왕국급 ×5: [TopScope.GetValue('xar_n_t3')] = [TopScope.GetValue('xar_p_t3')]\n제국급 ×10: [TopScope.GetValue('xar_n_t4')] = [TopScope.GetValue('xar_p_t4')]\n패권급 ×20: [TopScope.GetValue('xar_n_t5')] = [TopScope.GetValue('xar_p_t5')]\n\n—— 후손 (생존 후손의 최고 칭호) ——\n백작령급 ×0.25: [TopScope.GetValue('xar_d_t1')] = [TopScope.GetValue('xar_p_d1')]\n공국급 ×1: [TopScope.GetValue('xar_d_t2')] = [TopScope.GetValue('xar_p_d2')]\n왕국급 ×2.5: [TopScope.GetValue('xar_d_t3')] = [TopScope.GetValue('xar_p_d3')]\n제국급 ×5: [TopScope.GetValue('xar_d_t4')] = [TopScope.GetValue('xar_p_d4')]\n패권급 ×10: [TopScope.GetValue('xar_d_t5')] = [TopScope.GetValue('xar_p_d5')]\n\n—— 영지 (영지 보유 시) ——\n영지 규모 (봉신 백작령 포함): [TopScope.GetValue('xar_a_realm')] → [TopScope.GetValue('xar_l_realm')] × 10 = [TopScope.GetValue('xar_p_realm')]\n\n—— 거절의 대가 ——\n총애를 거절한 횟수: [TopScope.GetValue('xar_reject_n')] × -1% (총 배율 최저 0)\n\n합계 = [TopScope.GetValue('xar_p_dip')]+[TopScope.GetValue('xar_p_mar')]+[TopScope.GetValue('xar_p_ste')]+[TopScope.GetValue('xar_p_int')]+[TopScope.GetValue('xar_p_lea')]+[TopScope.GetValue('xar_p_pro')]+[TopScope.GetValue('xar_p_dyn')]+[TopScope.GetValue('xar_p_hou')]+[TopScope.GetValue('xar_p_gold')]+[TopScope.GetValue('xar_p_pres')]+[TopScope.GetValue('xar_p_pie')]+[TopScope.GetValue('xar_p_inf')]+[TopScope.GetValue('xar_p_t1')]+[TopScope.GetValue('xar_p_t2')]+[TopScope.GetValue('xar_p_t3')]+[TopScope.GetValue('xar_p_t4')]+[TopScope.GetValue('xar_p_t5')]+[TopScope.GetValue('xar_p_d1')]+[TopScope.GetValue('xar_p_d2')]+[TopScope.GetValue('xar_p_d3')]+[TopScope.GetValue('xar_p_d4')]+[TopScope.GetValue('xar_p_d5')]+[TopScope.GetValue('xar_p_realm')] = [TopScope.GetValue('xar_subtotal')]\n호의 거절: [TopScope.GetValue('xar_reject_n')] = -[TopScope.GetValue('xar_reject_n')]%\n최종 점수: [TopScope.GetValue('xar_score')]\n\n이전 기록: [TopScope.GetValue('xar_old')]\n차이: [TopScope.GetValue('xar_delta')|+0]"

 # Blessing/curse sessions (pools: docs/blessing-curse-pools.md)
 xar.0004.title:0 "유리불꽃의 총애"
 xar.0004.desc:0 "나그네, 거래는 끝났네. 허나——내 소매에는 아직 흩날리는 빛이 남아 있지. 조금 나눠줘도 좋네.\n\n다만 규칙은 알고 있겠지: 총애 하나에는 주흔 하나가 대가로 따라오네. ...걱정 말게, 아주 공정한 거래일세.\n\n한 번의 자리에 한 쌍. 거래하거나 떠나면——삼 년 뒤, 다시 찾아오겠네.\n\n（완료 [TopScope.GetValue('xar_bc_n')]쌍; 거절 [TopScope.GetValue('xar_br_n')]회, 최종 점수 -[TopScope.GetValue('xar_br_n')]%）"
 xar.0004.decline:0 "아무것도 받지 않겠네."
 xar.0005.title:0 "등가의 주흔"
 xar.0005.desc:0 "골랐는가? 그럼——장부를 갚을 시간일세.\n\n두려워 말게. 아픔은 잠깐이네. ...아마도."
