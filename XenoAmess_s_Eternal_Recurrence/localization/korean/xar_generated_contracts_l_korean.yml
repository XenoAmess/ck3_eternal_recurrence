 xar.2000.title:0 "전당 잡힌 이 삶"
 xar.2000.desc:0 "나그네여, 마지막 장부는 마음에 듭니다만, 불꽃이 어느 바람을 고르는지 보는 것도 즐기지요. 하나를 고르십시오; 매 단계가 이 삶의 무게를 더할 것입니다."
 xar.0010.desc_clean:0 "나그네여, 옛 잔불은 남아 있으나 이 이력은 쓸 수 있는 유산을 남기지 않습니다. 좋군요—빈손으로 끝에 다다르면 저울질이 더욱 흥미로워집니다. 그래도 첫 번째 호의는 외상으로 장부에 올려두겠습니다."
