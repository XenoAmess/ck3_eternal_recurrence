 xar.gaze.milestone.10:0 "유리불꽃의 첫 번째 고리가 열린다. 말문이 좁아지나, 재추첨을 하나 들여 보내니 호의가 나그네 입맛에 맞을 것이다."
 xar.gaze.milestone.20:0 "두 번째 고리가 칼날의 분간을 익힌다. 인장을 하나 얻으리라; 이따금 주흔을 면해 주면 다음 전당이 더 달콤해진다."
 xar.gaze.milestone.30:0 "세 번째 고리가 나그네를 위해 모든 잔불을 센다. 재추첨 둘이 그대 것이니, 나그네여; 선택지가 많을수록 욕망이 동의에 더 가까워진다."
 xar.gaze.milestone.40:0 "네 번째 고리가 눈짓 사이로 비밀을 감춘다. 식은 인장 둘이 생겼으니, 두고자 하는 주흔을 가려낼 만큼이다."
 xar.gaze.milestone.50:0 "다섯 번째 고리가 계약의 이면을 비춘다. 재추첨 두 개와 인장 하나를 지니라; 지식은 값을 없애지 못하나 그 값을 드러낼 뿐이다."
 xar.gaze.milestone.60:0 "여섯 번째 고리가 뼈를 따라 탄다, 포옹하듯 부드럽게. 재추첨 하나와 인장 둘, 그리고 더 날카로운 그릇이 내 호의의 전부다."
 xar.gaze.milestone.70:0 "일곱 번째 고리가 진실과 거짓에 같은 온기를 준다. 재추첨 셋과 인장 하나로 운명을 그대 뜻대로 깎을 수 있다."
 xar.gaze.milestone.80:0 "여덟 번째 고리가 왕관을 저울질한다. 재추첨 하나와 인장 셋으로 대담히 뻗을 수 있으나, 나는 묵묵히 장부를 적는다."
 xar.gaze.milestone.90:0 "아홉 번째 고리가 거의 영혼과 겹친다. 재추첨 넷과 인장 둘; 끝은 멀지만 그대는 그 값에 이름을 붙이는 법을 익혔다."
 xar.gaze.milestone.100:0 "열 번째 고리가 닫혀 완전한 유리불꽃의 시선이 된다. 재추첨 셋, 인장 넷, 그리고 마지막 성장 하나: 나그네여, 그대는 보존할 가치가 있는 유물이 되었네."
