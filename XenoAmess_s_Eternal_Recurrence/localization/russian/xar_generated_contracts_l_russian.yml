 xar.2000.title:0 "Эта жизнь в залоге"
 xar.2000.desc:0 "Странник, итоговая запись заманчива, но мне также нравится смотреть, как пламя выбирает свой ветер. Выбирай; каждый шаг прибавит веса этой жизни."
 xar.0010.desc_clean:0 "Странник, твои прежние угольки остаются, но эта стезя не оставляет наследуемого достояния. Хорошо — прийти к концу с пустыми руками делает взвешивание занятнее. Я всё же положу первую милость на счёт."
