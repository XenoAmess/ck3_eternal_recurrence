 xar_contract_pb_10:0 "PB 10"
 xar.gaze.milestone.10:0 "Первое кольцо стеклянного пламени раскрывается. Слова находят более узкие двери, и я дарую один переброс, чтобы милость лучше пришлась тебе по вкусу."
 xar.gaze.milestone.20:0 "Второе кольцо постигает меру клинка. Ты получаешь одну печать; снять знак проклятия время от времени делает следующий заклад слаще."
 xar.gaze.milestone.30:0 "Третье кольцо считает ради тебя каждый уголёк. Два переброса твои, странник; чем больше предложено выборов, тем больше желание походит на согласие."
 xar.gaze.milestone.40:0 "Четвёртое кольцо прячет тайны между мгновениями век. Две печати остыли — довольно, чтобы выбрать, какие знаки проклятия ты готов оставить."
 xar.gaze.milestone.50:0 "Пятое кольцо озаряет обратную сторону договора. Сохрани два переброса и одну печать; знание не отменяет цену, лишь открывает её."
 xar.gaze.milestone.60:0 "Шестое кольцо горит вдоль кости, нежно, как объятие. Один переброс, две печати и более острый сосуд — вся моя милость."
 xar.gaze.milestone.70:0 "Седьмое кольцо даёт правде и лжи одинаковое тепло. Три переброса и одна печать могут вырезать случай в угоду твоей судьбе."
 xar.gaze.milestone.80:0 "Восьмое кольцо способно взвесить корону. Один переброс и три печати позволят тебе дотянуться смелее, пока я терпеливо веду счёт."
 xar.gaze.milestone.90:0 "Девятое кольцо почти смыкается с душой. Четыре переброса и две печати; конец далёк, однако ты научился называть его цену."
 xar.gaze.milestone.100:0 "Десятое кольцо замыкается в полный Взор Стеклянного Пламени. Три переброса, четыре печати и один последний рост: странник, ты стал реликвией, достойной сохранения."
