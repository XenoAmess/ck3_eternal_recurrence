 # Trait
 trait_xar_glassfire_gaze:0 "Взор Стеклянного Пламени"
 trait_xar_glassfire_gaze_desc:0 "За этим персонажем наблюдает то самое стеклянное пламя, наблюдает... до самого конца."
 trait_xar_glassfire_gaze_character_desc:0 "За этим персонажем наблюдает стеклянное пламя... до самого конца.\n\nТекущий вес: #V [SCOPE.ScriptValue('xar_current_score_value')|1]#! (только предпросмотр)"
 trait_track_xar_glassfire_gaze:0 "Угли Стеклянного Пламени"
 trait_track_xar_glassfire_gaze_desc:0 "Получай 1 опыт за каждую завершённую пару услуги и знака проклятия. Каждые 10 опыта дают уровень: ещё 10% прироста стресса, а также рост основных характеристик, переброски и печати."

 # The pact (game start)
 xar.0002.title:0 "Договор Конца"
 xar.0002.desc:0 "—Мы встретились вновь, странник.\n\nЯ — Владыка Стеклянного Пламени, демон-посредник, обитающий меж проклятий. На каждом пути, что ты прошёл, я собирал его угли в конце.\n\nПодпиши этот договор ещё раз — и каждая унция твоих прошлых жизней станет разменной монетой этой.\n\nСтеклянное пламя никогда не торопит. Оно просто... продолжает смотреть."
 xar.0002.accept:0 "Я принимаю. Пусть стеклянное пламя будет свидетелем."
 xar.0002.decline:0 "Нет. Эту жизнь я пройду сам."

 # Polite farewell
 xar.0003.title:0 "Приветствие Стеклянного Пламени"
 xar.0003.desc:0 "Что ж. Стеклянное пламя никого не принуждает.\n\nПусть твоя история принадлежит только тебе — до встречи. А может... навсегда."
 xar.0003.ok:0 "Прощай."

 # Opening shop event
 xar.0001.title:0 "Ломбард Перерождений"
 xar.0001.desc:0 "Добро пожаловать, странник. Эти рассыпанные искры — угли твоей прошлой жизни.\n\nУ тебя [TopScope.GetValue('xar_points')] очков. Что приглянулось?"
 xar.0001.diplomacy:0 "Купить +1 Дипломатии ([TopScope.GetValue('xar_pr_dip')|0] очков)"
 xar.0001.martial:0 "Купить +1 Военного дела ([TopScope.GetValue('xar_pr_mar')|0] очков)"
 xar.0001.stewardship:0 "Купить +1 Управления ([TopScope.GetValue('xar_pr_ste')|0] очков)"
 xar.0001.intrigue:0 "Купить +1 Интриг ([TopScope.GetValue('xar_pr_int')|0] очков)"
 xar.0001.learning:0 "Купить +1 Образованности ([TopScope.GetValue('xar_pr_lea')|0] очков)"
 xar.0001.prowess:0 "Купить +1 Доблести ([TopScope.GetValue('xar_pr_pro')|0] очков)"
 xar.0001.gold:0 "Обменять на 100 золота ([TopScope.GetValue('xar_pr_gold')|0] очков)"
 xar.0001.prestige:0 "Обменять на 100 престижа ([TopScope.GetValue('xar_pr_pres')|0] очков)"
 xar.0001.piety:0 "Обменять на 100 благочестия ([TopScope.GetValue('xar_pr_pie')|0] очков)"
 xar.0001.influence:0 "Обменять на 100 влияния ([TopScope.GetValue('xar_pr_inf')|0] очков)"
 xar.0001.dynasty_prestige:0 "Обменять на 100 престижа династии ([TopScope.GetValue('xar_pr_dyn')|0] очков)"
 xar.0001.lifespan:0 "Обменять на 1 уровень заёмной жизни (+1 Здоровья; [TopScope.GetValue('xar_pr_life')|0] очков)"
 xar.0001.reform:0 "Одна бесплатная реформация веры ([TopScope.GetValue('xar_pr_reform')|0] очков, один раз за партию)"
 xar.0001.reform_hint:0 "После покупки проведите реформацию в окне веры; стоимость в благочестии будет снята."
 xar.0001.grand_tribute:0 "Принести Великий дар: +1500 престижа, благочестия, влияния и престижа династии ([TopScope.GetValue('xar_pr_grand_tribute')|0] очков)"
 xar.0001.borrowed_generation:0 "Одолжить поколение: восполнить до 25 уровней жизни (каждый +1 Здоровья; [TopScope.GetValue('xar_pr_borrowed_generation')|0] очков)"
 xar.0001.sixfold_apotheosis:0 "Шестикратный апофеоз: +30 ко всем навыкам ([TopScope.GetValue('xar_pr_sixfold_apotheosis')|0] очков)"
 xar.0001.reroll_token:0 "Купить одну переброску услуги ([TopScope.GetValue('xar_pr_reroll')|0] очков)"
 xar.0001.seal_token:0 "Купить одну печать проклятия ([TopScope.GetValue('xar_pr_seal')|0] очков)"
 xar.0001.dread:0 "Заложить шепотное злодеяние: получи 20 ужаса ([TopScope.GetValue('xar_pr_dread')|0] очков, один раз за партию)"
 xar.0001.legitimacy:0 "Пусть корона тебя запомнит: получи 100 легитимности ([TopScope.GetValue('xar_pr_legitimacy')|0] очков, один раз за партию)"
 xar.0001.tyranny:0 "Сожги десять строк из реестра: потеряй 10 тирании ([TopScope.GetValue('xar_pr_tyranny')|0] очков, один раз за партию)"
 xar.0001.prev_page:0 "Предыдущая страница"
 xar.0001.next_page:0 "Следующая страница"
 xar.0001.finish:0 "Начать эту жизнь (оставшиеся [TopScope.GetValue('xar_points')] очков превратятся в равное количество золота)"

 # Первая жизнь и книга
 xar.0010.title:0 "Ещё Не Зажжённая Жизнь"
 xar.0010.desc:0 "Странник, эта страница пока чиста. У тебя нет углей прошлой жизни для залога, и лавка показала бы лишь безмолвные ценники.\n\nЯ отпущу тебе одну историю в долг. Вес этой жизни будет измерен в конце; достигни новой ступени углей, и в следующей жизни появится чем торговаться.\n\nПервую милость... я запишу на твой счёт."
 xar.0010.begin:0 "Пусть эта жизнь начнётся."
 xar_ledger_decision:0 "Книга Стеклянного Пламени"
 xar_ledger_decision_desc:0 "Открыть счёт, который ведёт Владыка Стеклянного Пламени, и увидеть нынешний вес и следующий порог углей. Только для чтения."
 xar_ledger_decision_tooltip:0 "Посмотреть текущий счёт, историческую ступень углей и следующую ступень"
 xar_ledger_decision_confirm:0 "Открыть книгу"
 xar.0011.title:0 "Книга Стеклянного Пламени"
 xar.0011.desc:0 "Странник, твоя страница всегда ждёт. Один лишь взгляд на числа не заключает сделки.\n\nТекущий счёт только для чтения: #V [TopScope.GetValue('xar_ledger_score')|1]#!\nИсторическая ступень углей: #V [TopScope.GetValue('xar_ledger_history')|0]#!\nТекущая ступень-кандидат: #V [TopScope.GetValue('xar_ledger_candidate')|0]#!\nСледующая ступень: #V [TopScope.GetValue('xar_ledger_next')|0]#!\nДо следующей ступени: #V [TopScope.GetValue('xar_ledger_gap')|1]#!\nЗавершённые пары благословений и проклятий: #V [TopScope.GetValue('xar_ledger_pairs')|0]#!\nОтказы: #V [TopScope.GetValue('xar_ledger_refusals')|0]#!"
 xar.0011.desc_cap:0 "$xar.0011.desc$\n\n#P Этот счёт достиг нынешнего предела ступеней углей; следующей указана предельная ступень, а разница равна нулю.#!"
 xar.0011.close:0 "Закрыть. Угли ещё горят."

 # Death score event
 xar.1001.title:0 "Перерождение Окончено"
 xar.1001.new_record:0 "Отлично. Этот счёт вписан в вечность."
 xar.1001.no_record:0 "Не унывай. Стеклянное пламя будет ждать твоего возвращения."
 xar.1001.desc:0 "Отлично, странник. Вес этой жизни был тщательно измерен.\n\n—— Атрибуты (по 1 очку) ——\nДипломатия: [TopScope.GetValue('xar_a_dip')] × 1 = [TopScope.GetValue('xar_p_dip')]\nВоенное дело: [TopScope.GetValue('xar_a_mar')] × 1 = [TopScope.GetValue('xar_p_mar')]\nУправление: [TopScope.GetValue('xar_a_ste')] × 1 = [TopScope.GetValue('xar_p_ste')]\nИнтриги: [TopScope.GetValue('xar_a_int')] × 1 = [TopScope.GetValue('xar_p_int')]\nОбразованность: [TopScope.GetValue('xar_a_lea')] × 1 = [TopScope.GetValue('xar_p_lea')]\nДоблесть: [TopScope.GetValue('xar_a_pro')] × 1 = [TopScope.GetValue('xar_p_pro')]\n\n—— Кровь (должны быть вашими потомками) ——\nЖивые члены династии: [TopScope.GetValue('xar_a_dyn')] × 0.1 = [TopScope.GetValue('xar_p_dyn')]\nЖивые члены рода (дополнительно): [TopScope.GetValue('xar_a_hou')] × 0.1 = [TopScope.GetValue('xar_p_hou')]\n\n—— Ресурсы (log₂ округл. вниз) ——\nЗолото: [TopScope.GetValue('xar_a_gold')] → [TopScope.GetValue('xar_l_gold')] × 5 = [TopScope.GetValue('xar_p_gold')]\nПрестиж: [TopScope.GetValue('xar_a_pres')] → [TopScope.GetValue('xar_l_pres')] × 3 = [TopScope.GetValue('xar_p_pres')]\nБлагочестие: [TopScope.GetValue('xar_a_pie')] → [TopScope.GetValue('xar_l_pie')] × 3 = [TopScope.GetValue('xar_p_pie')]\nВлияние: [TopScope.GetValue('xar_a_inf')] → [TopScope.GetValue('xar_l_inf')] × 3 = [TopScope.GetValue('xar_p_inf')]\n\n—— Титулы на момент смерти ——\nГрафство ×1: [TopScope.GetValue('xar_n_t1')] = [TopScope.GetValue('xar_p_t1')]\nГерцогство ×2.5: [TopScope.GetValue('xar_n_t2')] = [TopScope.GetValue('xar_p_t2')]\nКоролевство ×5: [TopScope.GetValue('xar_n_t3')] = [TopScope.GetValue('xar_p_t3')]\nИмперия ×10: [TopScope.GetValue('xar_n_t4')] = [TopScope.GetValue('xar_p_t4')]\nГегемония ×20: [TopScope.GetValue('xar_n_t5')] = [TopScope.GetValue('xar_p_t5')]\n\n—— Потомки (высший титул живых потомков) ——\nГрафство ×0.25: [TopScope.GetValue('xar_d_t1')] = [TopScope.GetValue('xar_p_d1')]\nГерцогство ×1: [TopScope.GetValue('xar_d_t2')] = [TopScope.GetValue('xar_p_d2')]\nКоролевство ×2.5: [TopScope.GetValue('xar_d_t3')] = [TopScope.GetValue('xar_p_d3')]\nИмперия ×5: [TopScope.GetValue('xar_d_t4')] = [TopScope.GetValue('xar_p_d4')]\nГегемония ×10: [TopScope.GetValue('xar_d_t5')] = [TopScope.GetValue('xar_p_d5')]\n\n—— Владения (при наличии земель) ——\nРазмер владений (графства, включая вассалов): [TopScope.GetValue('xar_a_realm')] → [TopScope.GetValue('xar_l_realm')] × 10 = [TopScope.GetValue('xar_p_realm')]\n\n—— Цена отказа ——\nОтвергнуто сеансов благосклонности: [TopScope.GetValue('xar_reject_n')] × -1% (минимальный множитель 0)\n\nИтого = [TopScope.GetValue('xar_p_dip')]+[TopScope.GetValue('xar_p_mar')]+[TopScope.GetValue('xar_p_ste')]+[TopScope.GetValue('xar_p_int')]+[TopScope.GetValue('xar_p_lea')]+[TopScope.GetValue('xar_p_pro')]+[TopScope.GetValue('xar_p_dyn')]+[TopScope.GetValue('xar_p_hou')]+[TopScope.GetValue('xar_p_gold')]+[TopScope.GetValue('xar_p_pres')]+[TopScope.GetValue('xar_p_pie')]+[TopScope.GetValue('xar_p_inf')]+[TopScope.GetValue('xar_p_t1')]+[TopScope.GetValue('xar_p_t2')]+[TopScope.GetValue('xar_p_t3')]+[TopScope.GetValue('xar_p_t4')]+[TopScope.GetValue('xar_p_t5')]+[TopScope.GetValue('xar_p_d1')]+[TopScope.GetValue('xar_p_d2')]+[TopScope.GetValue('xar_p_d3')]+[TopScope.GetValue('xar_p_d4')]+[TopScope.GetValue('xar_p_d5')]+[TopScope.GetValue('xar_p_realm')] = [TopScope.GetValue('xar_subtotal')]\nОтвергнутые милости: [TopScope.GetValue('xar_reject_n')] = -[TopScope.GetValue('xar_reject_n')]%\nИтоговый счет: [TopScope.GetValue('xar_score')]\n\nПредыдущий рекорд: [TopScope.GetValue('xar_old')]\nРазница: [TopScope.GetValue('xar_delta')|+0]"

 # Blessing/curse sessions (pools: docs/blessing-curse-pools.md)
 xar.0004.title:0 "Благосклонность Стеклянного Пламени"
 xar.0004.desc:0 "Что ж, странник, наши дела завершены. И всё же — в рукаве у меня осталось несколько рассыпанных искр. Могу пожаловать тебе парочку.\n\nНо ты знаешь правило: каждая милость требует взамен знак проклятия. ...Честная сделка, обещаю.\n\nОдна встреча, одна пара. После сделки — или отказа — я найду тебя через три года.\n\n（Завершено [TopScope.GetValue('xar_bc_n')]; отказов [TopScope.GetValue('xar_br_n')], итоговый счёт -[TopScope.GetValue('xar_br_n')]%）"
 xar.0004.decline:0 "Мне ничего не нужно."
 xar.0005.title:0 "Цена Знака Проклятия"
 xar.0005.desc:0 "Выбрал? Тогда — пора расплатиться.\n\nНе бойся. Больно лишь мгновение. ...Наверное."

 # Paid custom courtier creator
 xar_courtier_creator_decision:0 "Заказать придворного Стеклянного Пламени"
 xar_courtier_creator_decision_desc:0 "Попроси Владыку Стеклянного Пламени сотворить на заказ тело, таланты, свойства, происхождение и родословную придворного. Каждое усовершенствование имеет свою цену; готовая душа присоединится к твоему двору."
 xar_courtier_creator_decision_tooltip:0 "Создай и закажи собственного придворного за плату"
 xar_courtier_creator_decision_confirm:0 "Открыть заказ"
 xar.cc.title:0 "Душа на заказ"
 xar.cc.intro:0 "Странник, в каждом дворе есть пустой стул. Выбери, какое тепло должно сесть рядом с твоим троном; я беру плату лишь тогда, когда душа переступит порог."
