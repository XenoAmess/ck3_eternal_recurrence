 xar.cc.numeric.minus_10:0 "-10"
 xar.cc.numeric.minus_1:0 "-1"
 xar.cc.numeric.plus_1:0 "+1"
 xar.cc.numeric.plus_10:0 "+10"
 xar.cc.base_stats:0 "Возраст задаётся точно от 0 до 120. Шесть полос только для чтения показывают неизменённые базовые навыки от 0 до 100; используй кнопки шага. Цены следуют нелинейной абсолютной кривой Редактора правителя из основной игры, после чего применяются модификаторы образования и свойств."
 xar.cc.education.help:0 "Перечислены все свойства образования из основной игры. Взрослые от 16 лет должны иметь ровно одно; у детей свойство образования отсутствует."
 xar.cc.commander.help:0 "Перечислены все 17 свойств командира из основной игры. Можно выбрать до двух; каждое начинается с базового мастерства и нулевого опыта. Выбрано: [GetPlayer.MakeScope.Var('xar_cc_commander_count').GetValue|0]/2."
 xar.cc.physical.help:0 "Перечислены все 38 физических свойств из основной игры, включая обычно скрытое $trait_impotent$. Совместимые варианты можно комбинировать."
 xar.cc.personality.help:0 "Перечислены все 36 свойств характера из основной игры. Можно выбрать до трёх; выбор противоположного заменяет его аналог. Выбрано: [GetPlayer.MakeScope.Var('xar_cc_personality_count').GetValue|0]/3."
 xar.cc.other.help:0 "Здесь перечислены остальные 108 свойств из основной игры, видимых в Редакторе правителя. Среди них могущественные свойства статуса, здоровья и иные значимые варианты."
