 setting_xar_off:0 "Deaktiviert"
 setting_xar_off_desc:0 "Der Glasfeuerlord-Modus ist inaktiv."
 setting_xar_selftest:0 "Selbsttest"
 setting_xar_selftest_desc:0 "Automatisierter Abnahme-Selbsttest. Nur für Entwicklung."

