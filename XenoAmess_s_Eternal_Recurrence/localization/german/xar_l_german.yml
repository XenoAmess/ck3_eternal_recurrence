 # Erstes Leben und Glasfeuerbuch
 xar.0010.title:0 "Ein Noch Unentfachtes Leben"
 xar.0010.desc:0 "Reisender, diese Seite ist noch leer. Du hast keine Glut eines früheren Lebens zu verpfänden; im Laden gäbe es nur schweigende Preisschilder.\n\nGewähre mir eine Geschichte auf Kredit. Das Gewicht dieses Lebens wird an seinem Ende gemessen; erreichst du eine neue Glutstufe, besitzt dein nächstes Leben Verhandlungsmasse.\n\nDie erste Gunst... schreibe ich auf deine Rechnung."
 xar.0010.begin:0 "Dann soll dieses Leben beginnen."
 xar_ledger_decision:0 "Glasfeuerbuch"
 xar_ledger_decision_desc:0 "Öffne die Rechnung des Glasfeuerlords für dieses Leben und prüfe Gewicht und nächste Glutschwelle. Nur lesbar; kein Handel."
 xar_ledger_decision_tooltip:0 "Aktuelle Wertung, historische Glutstufe und nächste Stufe ansehen"
 xar_ledger_decision_confirm:0 "Buch öffnen"
 xar.0011.title:0 "Glasfeuerbuch"
 xar.0011.desc:0 "Reisender, deine Seite wartet stets. Das bloße Betrachten der Zahlen besiegelt keinen Handel.\n\nAktuelle schreibgeschützte Wertung: #V [TopScope.GetValue('xar_ledger_score')|1]#!\nHistorische Glutstufe: #V [TopScope.GetValue('xar_ledger_history')|0]#!\nAktuelle Kandidatenstufe: #V [TopScope.GetValue('xar_ledger_candidate')|0]#!\nNächste Stufe: #V [TopScope.GetValue('xar_ledger_next')|0]#!\nAbstand zur nächsten Stufe: #V [TopScope.GetValue('xar_ledger_gap')|1]#!\nVollendete Segens-Fluch-Paare: #V [TopScope.GetValue('xar_ledger_pairs')|0]#!\nAblehnungen: #V [TopScope.GetValue('xar_ledger_refusals')|0]#!"
 xar.0011.desc_cap:0 "$xar.0011.desc$\n\n#P Diese Rechnung hat die derzeitige Obergrenze der Glutstufen erreicht; die nächste Stufe bleibt die Obergrenze und der Abstand ist null.#!"
 xar.0011.close:0 "Schließen. Die Glut brennt noch."

 # Death score event
 xar.1001.title:0 "Die Wiederkehr Endet"
 xar.1001.new_record:0 "Gut gemacht. Diese Rechnung ist nun in die Ewigkeit geschrieben."
 xar.1001.no_record:0 "Verzweifle nicht. Das Glasfeuer wird auf deine Rückkehr warten."
 xar.1001.desc:0 "Gut gemacht, Reisender. Das Gewicht dieses Lebens wurde sorgfältig bemessen.\n\n—— Attribute (je 1 Punkt) ——\nDiplomatie: [TopScope.GetValue('xar_a_dip')] × 1 = [TopScope.GetValue('xar_p_dip')]\nKriegskunst: [TopScope.GetValue('xar_a_mar')] × 1 = [TopScope.GetValue('xar_p_mar')]\nHaushaltsführung: [TopScope.GetValue('xar_a_ste')] × 1 = [TopScope.GetValue('xar_p_ste')]\nIntrige: [TopScope.GetValue('xar_a_int')] × 1 = [TopScope.GetValue('xar_p_int')]\nBildung: [TopScope.GetValue('xar_a_lea')] × 1 = [TopScope.GetValue('xar_p_lea')]\nTapferkeit: [TopScope.GetValue('xar_a_pro')] × 1 = [TopScope.GetValue('xar_p_pro')]\n\n—— Blut (müssen deine Nachkommen sein) ——\nLebende Dynastie-Mitglieder: [TopScope.GetValue('xar_a_dyn')] × 0.1 = [TopScope.GetValue('xar_p_dyn')]\nLebende Haus-Mitglieder (zusätzlich): [TopScope.GetValue('xar_a_hou')] × 0.1 = [TopScope.GetValue('xar_p_hou')]\n\n—— Ressourcen (log₂ abgerundet) ——\nGold: [TopScope.GetValue('xar_a_gold')] → [TopScope.GetValue('xar_l_gold')] × 5 = [TopScope.GetValue('xar_p_gold')]\nPrestige: [TopScope.GetValue('xar_a_pres')] → [TopScope.GetValue('xar_l_pres')] × 3 = [TopScope.GetValue('xar_p_pres')]\nFrömmigkeit: [TopScope.GetValue('xar_a_pie')] → [TopScope.GetValue('xar_l_pie')] × 3 = [TopScope.GetValue('xar_p_pie')]\nEinfluss: [TopScope.GetValue('xar_a_inf')] → [TopScope.GetValue('xar_l_inf')] × 3 = [TopScope.GetValue('xar_p_inf')]\n\n—— Titel beim Tod ——\nGrafschaft ×1: [TopScope.GetValue('xar_n_t1')] = [TopScope.GetValue('xar_p_t1')]\nHerzogtum ×2.5: [TopScope.GetValue('xar_n_t2')] = [TopScope.GetValue('xar_p_t2')]\nKönigreich ×5: [TopScope.GetValue('xar_n_t3')] = [TopScope.GetValue('xar_p_t3')]\nKaiserreich ×10: [TopScope.GetValue('xar_n_t4')] = [TopScope.GetValue('xar_p_t4')]\nHegemonie ×20: [TopScope.GetValue('xar_n_t5')] = [TopScope.GetValue('xar_p_t5')]\n\n—— Nachkommen (höchster Titel lebender Nachkommen) ——\nGrafschaft ×0.25: [TopScope.GetValue('xar_d_t1')] = [TopScope.GetValue('xar_p_d1')]\nHerzogtum ×1: [TopScope.GetValue('xar_d_t2')] = [TopScope.GetValue('xar_p_d2')]\nKönigreich ×2.5: [TopScope.GetValue('xar_d_t3')] = [TopScope.GetValue('xar_p_d3')]\nKaiserreich ×5: [TopScope.GetValue('xar_d_t4')] = [TopScope.GetValue('xar_p_d4')]\nHegemonie ×10: [TopScope.GetValue('xar_d_t5')] = [TopScope.GetValue('xar_p_d5')]\n\n—— Herrschaft (falls landbesitzend) ——\nHerrschaftsgröße (Grafschaften inkl. Vasallen): [TopScope.GetValue('xar_a_realm')] → [TopScope.GetValue('xar_l_realm')] × 10 = [TopScope.GetValue('xar_p_realm')]\n\n—— Preis der Ablehnung ——\nAbgelehnte Gunstsitzungen: [TopScope.GetValue('xar_reject_n')] × -1 % (Mindestmultiplikator 0)\n\nGesamt = [TopScope.GetValue('xar_p_dip')]+[TopScope.GetValue('xar_p_mar')]+[TopScope.GetValue('xar_p_ste')]+[TopScope.GetValue('xar_p_int')]+[TopScope.GetValue('xar_p_lea')]+[TopScope.GetValue('xar_p_pro')]+[TopScope.GetValue('xar_p_dyn')]+[TopScope.GetValue('xar_p_hou')]+[TopScope.GetValue('xar_p_gold')]+[TopScope.GetValue('xar_p_pres')]+[TopScope.GetValue('xar_p_pie')]+[TopScope.GetValue('xar_p_inf')]+[TopScope.GetValue('xar_p_t1')]+[TopScope.GetValue('xar_p_t2')]+[TopScope.GetValue('xar_p_t3')]+[TopScope.GetValue('xar_p_t4')]+[TopScope.GetValue('xar_p_t5')]+[TopScope.GetValue('xar_p_d1')]+[TopScope.GetValue('xar_p_d2')]+[TopScope.GetValue('xar_p_d3')]+[TopScope.GetValue('xar_p_d4')]+[TopScope.GetValue('xar_p_d5')]+[TopScope.GetValue('xar_p_realm')] = [TopScope.GetValue('xar_subtotal')]\nAbgelehnte Gunstbezeugungen: [TopScope.GetValue('xar_reject_n')] = -[TopScope.GetValue('xar_reject_n')]%\nEndpunktzahl: [TopScope.GetValue('xar_score')]\n\nBisheriger Rekord: [TopScope.GetValue('xar_old')]\nDifferenz: [TopScope.GetValue('xar_delta')|+0]"

 # Blessing/curse sessions (pools: docs/blessing-curse-pools.md)
 xar.0004.title:0 "Die Gunst des Glasfeuers"
 xar.0004.desc:0 "Nun, Reisender, unsere Geschäfte sind abgeschlossen. Und doch — ich habe noch ein paar verstreute Schimmer im Ärmel. Ich könnte dir welche schenken.\n\nAber du kennst die Regel: Jede Gunst verlangt ein Fluchmal als Gegenzug. ...Ein fairer Tausch, versprochen.\n\nEin Treffen, ein Paar. Nach dem Handel — oder deinem Abschied — finde ich dich in drei Jahren wieder.\n\n（Abgeschlossen: [TopScope.GetValue('xar_bc_n')]; abgelehnt: [TopScope.GetValue('xar_br_n')], Endwertung -[TopScope.GetValue('xar_br_n')] %）"
 xar.0004.decline:0 "Ich will nichts."
 xar.0005.title:0 "Der Preis des Fluchmals"
 xar.0005.desc:0 "Gewählt? Dann — Zeit, die Rechnung zu begleichen.\n\nKeine Angst. Es brennt nur einen Moment. ...Vermutlich."

