 xar.gaze.milestone.10:0 "Der erste Ring aus Glasfeuer öffnet sich. Worte finden engere Türen, und ich gewähre einen Neuwurf, damit der Gefallen besser zu deinem Geschmack passt."
 xar.gaze.milestone.20:0 "Der zweite Ring erlernt das Maß einer Klinge. Du erhältst ein Siegel; ein gelegentliches Erlassen eines Fluchmals versüßt das nächste Pfand."
 xar.gaze.milestone.30:0 "Der dritte Ring zählt jede Glut für dich. Zwei Neuwürfe gehören dir, Reisender; je mehr Wahlmöglichkeiten geboten werden, desto mehr ähnelt Begehren einer Zustimmung."
 xar.gaze.milestone.40:0 "Der vierte Ring verbirgt Geheimnisse zwischen den Lidern. Zwei Siegel sind erkaltet, genug, um zu wählen, welche Fluchmale du zu behalten bereit bist."
 xar.gaze.milestone.50:0 "Der fünfte Ring beleuchtet die Kehrseite des Pakts. Behalte zwei Neuwürfe und ein Siegel; Wissen entfernt nie einen Preis, es offenbart ihn nur."
 xar.gaze.milestone.60:0 "Der sechste Ring brennt am Knochen entlang, sanft wie eine Umarmung. Ein Neuwurf, zwei Siegel und ein schärferes Gefäß sind meine ganze Gunst."
 xar.gaze.milestone.70:0 "Der siebte Ring gibt Wahrheit und Lügen die gleiche Wärme. Drei Neuwürfe und ein Siegel können den Zufall in dein bevorzugtes Schicksal schnitzen."
 xar.gaze.milestone.80:0 "Der achte Ring vermag eine Krone zu wägen. Ein Neuwurf und drei Siegel lassen dich kühner zugreifen, während ich geduldig Rechnung führe."
 xar.gaze.milestone.90:0 "Der neunte Ring überschattet beinahe die Seele. Vier Neuwürfe und zwei Siegel; das Ende ist fern, doch du hast gelernt, seinen Preis zu benennen."
 xar.gaze.milestone.100:0 "Der zehnte Ring schließt sich zum vollen Glasfeuerblick. Drei Neuwürfe, vier Siegel und ein letztes Wachstum: Reisender, du bist ein Andenken geworden, das es zu bewahren lohnt."
