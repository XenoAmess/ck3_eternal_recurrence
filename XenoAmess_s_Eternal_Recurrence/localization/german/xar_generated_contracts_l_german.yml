 xar.2000.desc:0 "Reisender, das letzte Hauptbuch ist verlockend, doch ich beobachte auch gern, wie eine Flamme ihren Wind wählt. Wähle eines; jeder Schritt wird das Gewicht dieses Lebens mehren."
 xar.0010.desc_clean:0 "Reisender, deine frühere Glut bleibt, doch diese Spur hinterlässt kein verwertbares Erbe. Gut – am Ende mit leeren Händen anzukommen, macht die Wägung reizvoller. Ich werde den ersten Gefallen dennoch auf Rechnung setzen."
