 xar_contract_pb_6:0 "PB 6"
 xar_contract_pb_10:0 "PB 10"
 xar.gaze.milestone.10:0 "Le premier anneau du feu de verre s'ouvre. Les mots trouvent des portes plus étroites, et j'accorde une relance afin que la faveur convienne mieux à ton goût."
 xar.gaze.milestone.20:0 "Le second anneau apprend la mesure d'une lame. Tu gagnes un sceau ; lever une marque de malédiction de temps en temps adoucit le prochain gage."
 xar.gaze.milestone.30:0 "Le troisième anneau compte chaque braise pour toi. Deux relances sont tiennes, voyageur ; plus les choix offerts sont nombreux, plus le désir ressemble à un consentement."
 xar.gaze.milestone.40:0 "Le quatrième anneau dissimule des secrets entre les clignements. Deux sceaux ont tiédi, assez pour choisir quelles marques de malédiction tu es prêt à conserver."
 xar.gaze.milestone.50:0 "Le cinquième anneau éclaire l'envers du pacte. Garde deux relances et un sceau ; le savoir ne supprime jamais un prix, il ne fait que le révéler."
 xar.gaze.milestone.60:0 "Le sixième anneau brûle le long de l'os, doux comme une étreinte. Une relance, deux sceaux et un corps plus affûté sont toute ma faveur."
 xar.gaze.milestone.70:0 "Le septième anneau donne aux vérités et aux mensonges la même chaleur. Trois relances et un sceau peuvent tailler le hasard selon ton destin préféré."
 xar.gaze.milestone.80:0 "Le huitième anneau sait peser une couronne. Une relance et trois sceaux te permettent de viser plus haut tandis que je tiens patiemment les comptes."
 xar.gaze.milestone.90:0 "Le neuvième anneau frôle presque l'âme. Quatre relances et deux sceaux ; la fin est lointaine, pourtant tu as appris à nommer son prix."
 xar.gaze.milestone.100:0 "Le dixième anneau se referme pour former le Regard du Feu de Verre complet. Trois relances, quatre sceaux et une dernière croissance : voyageur, tu es devenu un souvenir qui mérite d'être conservé."
