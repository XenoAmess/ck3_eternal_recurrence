 xar.contract.milestone.6.ok:0 "L'encre tiédit."
 xar.contract.milestone.10.ok:0 "Ce gage est complet."
 xar.gaze.milestone.title:0 "Regard du Feu de Verre : une nouvelle marque"
 xar.gaze.milestone.ok:0 "J'accepte cette bienveillance tardive."
 xar.0004.reroll:0 "Dépense une relance pour de nouvelles faveurs"
 xar.0005.seal:0 "Dépense un sceau pour lever cette marque de malédiction"
