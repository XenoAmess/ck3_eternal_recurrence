 xar.2000.title:0 "Cette vie en gage"
 xar.2000.desc:0 "Voyageur, le grand livre final est tentant, mais j'aime aussi regarder une flamme choisir son vent. Choisis-en un ; chaque étape ajoutera au poids de cette vie."
 xar.0010.desc_clean:0 "Voyageur, tes anciennes braises subsistent, mais cette voie ne laisse aucun héritage à dépenser. Bien — arriver au bout les mains vides rend la pesée plus intéressante. Je placerai tout de même la première faveur sur ton compte."
