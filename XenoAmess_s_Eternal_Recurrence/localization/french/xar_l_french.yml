l_french:
 decision_group_type_xar_eternal_recurrence:0 "@xar_decision_group_icon! Éternelle Réincarnation"
 xar.ironman_terminal.title:0 "Les braises sont scellées"
 xar.ironman_terminal.desc:0 "Voyageur, le poids de cette vie est déjà inscrit dans le registre. [Localize('IRONMAN_ENABLED')] ne permet aucune observation ; je retiendrai donc le temps pour toi. Ouvre le menu du jeu et laisse la sauvegarde native apposer le dernier sceau, puis reviens au menu principal."
 xar.ironman_terminal.footer:0 "Si tu tentes de continuer, le temps s'arrêtera simplement de nouveau."
 xar.ironman_terminal.open_menu:0 "Ouvrir le menu du jeu"

 xar.no_heir_settlement.desc:0 "Voyageur, la fin du jeu de base refermerait le registre pour toi. Mais ce poids m'appartient — et t'appartient aussi."
 xar.no_heir.score:0 "Poids final"
 xar.no_heir.subtotal:0 "Poids avant les refus"
 xar.no_heir.pairs:0 "Marchés conclus"
 xar.no_heir.refusals:0 "Faveurs refusées"
 xar.no_heir.contract:0 "Avancée du contrat"
 xar.no_heir.old:0 "Palier de braise précédent"
 xar.no_heir.candidate:0 "Palier de braise candidat"
 xar.no_heir.delta:0 "Différence au registre"
 xar.no_heir.footer:0 "Ne pas laisser d'héritier ne signifie pas ne laisser aucun poids. Les braises sont inscrites dans l'éternité ; quand le prochain voyageur arrivera, j'ouvrirai doucement cette page à nouveau."
 # Game rule
 rule_xar_enabled:0 "L'Éternelle Réincarnation du Seigneur du Feu de Verre"
 setting_xar_on:0 "Activé"
 setting_xar_on_desc:0 "Le mode du Seigneur du Feu de Verre est actif : le record global est importé au début de la partie et peut être dépensé en améliorations. Les tutoriels (Tutorial) doivent rester activés pour inscrire les nouveaux rangs de braises."
 setting_xar_off:0 "Désactivé"
 setting_xar_off_desc:0 "Le mode du Seigneur du Feu de Verre est inactif."
 setting_xar_selftest:0 "Auto-test"
 setting_xar_selftest_desc:0 "Auto-test d'acceptation automatisé, réservé au développement."
 rule_xar_inheritance:0 "Héritage de Braise"
 setting_xar_inherit_0:0 "Vierge : 0 %"
 setting_xar_inherit_0_desc:0 "N'hérite d'aucun budget de départ ; ton Rang de Braise est tout de même importé et affiché."
 setting_xar_inherit_25:0 "Mesuré : 25 %"
 setting_xar_inherit_25_desc:0 "Hérite de 25 % du Rang de Braise historique, arrondi à l'inférieur, sans plafond de budget."
 setting_xar_inherit_50:0 "Équilibré : 50 %"
 setting_xar_inherit_50_desc:0 "Hérite de 50 % du Rang de Braise historique, arrondi à l'inférieur, sans plafond de budget."
 setting_xar_inherit_100:0 "Complet : 100 %"
 setting_xar_inherit_100_desc:0 "Hérite de l'intégralité du Rang de Braise historique, sans plafond de budget."
 rule_xar_score_basis:0 "Piste de score"
 setting_xar_score_absolute:0 "Absolu"
 setting_xar_score_absolute_desc:0 "Évalue l'état complet du dirigeant à sa mort."
 setting_xar_score_growth:0 "Croissance au fil du règne"
 setting_xar_score_growth_desc:0 "Évalue uniquement la croissance nette après l'ouverture de la boutique et le premier marchandage."
 xar_track_abs_0:0 "ABS · 0 % · v2"
 xar_track_abs_25:0 "ABS · 25 % · v2"
 xar_track_abs_50:0 "ABS · 50 % · v2"
 xar_track_abs_100:0 "ABS · 100 % · v2"
 xar_track_growth_0:0 "CROISSANCE · 0 % · v2"
 xar_track_growth_25:0 "CROISSANCE · 25 % · v2"
