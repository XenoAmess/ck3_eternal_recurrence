 xar_track_growth_100:0 "CROISSANCE · 100 % · v2"
 xar.challenge.summary:0 "\n\n— Piste de défi —\nPiste : #V [ROOT.Char.Custom('xar_track_name')]#!\nHéritage : [TopScope.GetValue('xar_challenge_ratio')|0] % (sans plafond de budget)\nBase de croissance : [TopScope.GetValue('xar_challenge_baseline')|1]"

 # Tutorial lesson step sentinel text. Must stay identical in every language.
 xar_silent_step:0 "XAR_SYNC_SENTINEL"

 # Sentinel returned by the record-level customizable localization.
 xar_top_bit_sentinel:0 "XAR_TOP_SENTINEL"

 # Sentinel for the exit-to-menu bridge.
 xar_quit_sentinel:0 "XAR_QUIT_SENTINEL"

 # Trait
 trait_xar_glassfire_gaze:0 "Regard du Feu de Verre"
 trait_xar_glassfire_gaze_desc:0 "Ce personnage est observé par cette flamme couleur de verre, observé... jusqu'à la toute fin."
 trait_xar_glassfire_gaze_character_desc:0 "Ce personnage est observé par cette flamme couleur de verre, observé... jusqu'à la toute fin.\n\nPoids actuel : #V [SCOPE.ScriptValue('xar_current_score_value')|1]#! (aperçu uniquement)"
 trait_track_xar_glassfire_gaze:0 "Braises de verre"
 trait_track_xar_glassfire_gaze_desc:0 "Gagne 1 point d'expérience pour chaque paire faveur et marque de malédiction accomplie. Tous les 10 points d'expérience, tu gagnes un niveau : 10 % de stress supplémentaires, plus une progression des caractéristiques de base, des relances et des sceaux."

 # The pact (game start)
 xar.0002.title:0 "Le Pacte de la Fin"
 xar.0002.desc:0 "—Nous nous revoilà, voyageur.\n\nJe suis le Seigneur du Feu de Verre, un démon intermédiaire demeurant entre les malédictions. Chaque chemin que tu as foulé, j'en ai ramassé les braises à la fin.\n\nSigne ce pacte une fois de plus, et chaque once de tes vies passées deviendra la monnaie d'échange de cette vie.\n\nLe feu de verre ne presse jamais. Il se contente... de regarder."
 xar.0002.accept:0 "J'accepte. Que le feu de verre en soit témoin."
 xar.0002.decline:0 "Non. Cette vie, je la parcourrai seul."

 # Polite farewell
 xar.0003.title:0 "Les Salutations du Feu de Verre"
 xar.0003.desc:0 "Soit. Le feu de verre n'insiste jamais.\n\nQue ton histoire t'appartienne en propre — à une prochaine fois. Ou peut-être... à jamais."
 xar.0003.ok:0 "Adieu."

 # Opening shop event
 xar.0001.title:0 "La Boutique des Réincarnations"
 xar.0001.desc:0 "Bienvenue, voyageur. Ces lueurs éparses sont les braises de ta vie passée.\n\nTu possèdes [TopScope.GetValue('xar_points')] points. Qu'est-ce qui te fait envie ?"
 xar.0001.diplomacy:0 "Acheter +1 Diplomatie ([TopScope.GetValue('xar_pr_dip')|0] points)"
 xar.0001.martial:0 "Acheter +1 Martial ([TopScope.GetValue('xar_pr_mar')|0] points)"
 xar.0001.stewardship:0 "Acheter +1 Intendance ([TopScope.GetValue('xar_pr_ste')|0] points)"
 xar.0001.intrigue:0 "Acheter +1 Intrigue ([TopScope.GetValue('xar_pr_int')|0] points)"
 xar.0001.learning:0 "Acheter +1 Érudition ([TopScope.GetValue('xar_pr_lea')|0] points)"
 xar.0001.prowess:0 "Acheter +1 Prouesse ([TopScope.GetValue('xar_pr_pro')|0] points)"
 xar.0001.gold:0 "Échanger contre 100 pièces d'or ([TopScope.GetValue('xar_pr_gold')|0] points)"
 xar.0001.prestige:0 "Échanger contre 100 de prestige ([TopScope.GetValue('xar_pr_pres')|0] points)"
 xar.0001.piety:0 "Échanger contre 100 de piété ([TopScope.GetValue('xar_pr_pie')|0] points)"
 xar.0001.influence:0 "Échanger contre 100 d'influence ([TopScope.GetValue('xar_pr_inf')|0] points)"
 xar.0001.dynasty_prestige:0 "Échanger contre 100 de prestige de dynastie ([TopScope.GetValue('xar_pr_dyn')|0] points)"
 xar.0001.lifespan:0 "Échanger contre 1 charge de vie empruntée (+1 Santé ; [TopScope.GetValue('xar_pr_life')|0] points)"
 xar.0001.reform:0 "Une réformation de foi gratuite ([TopScope.GetValue('xar_pr_reform')|0] points, une fois par partie)"
 xar.0001.reform_hint:0 "Après l'achat, réforme via la fenêtre de foi ; le coût en piété est annulé."
 xar.0001.grand_tribute:0 "Offrir le Grand Tribut : +1 500 prestige, piété, influence et prestige dynastique ([TopScope.GetValue('xar_pr_grand_tribute')|0] points)"
 xar.0001.borrowed_generation:0 "Emprunter une génération : atteindre 25 charges de vie (+1 Santé chacune ; [TopScope.GetValue('xar_pr_borrowed_generation')|0] points)"
 xar.0001.sixfold_apotheosis:0 "Apothéose sextuple : +30 à toutes les compétences ([TopScope.GetValue('xar_pr_sixfold_apotheosis')|0] points)"
 xar.0001.reroll_token:0 "Acheter une relance de faveur ([TopScope.GetValue('xar_pr_reroll')|0] points)"
 xar.0001.seal_token:0 "Acheter un sceau de marque de malédiction ([TopScope.GetValue('xar_pr_seal')|0] points)"
 xar.0001.dread:0 "Mettre en gage une Atrocité Murmurée : gagne 20 de Terreur ([TopScope.GetValue('xar_pr_dread')|0] points, une fois par parcours)"
 xar.0001.legitimacy:0 "Faire en sorte que la Couronne se souvienne de toi : gagne 100 de Légitimité ([TopScope.GetValue('xar_pr_legitimacy')|0] points, une fois par parcours)"
 xar.0001.tyranny:0 "Brûler dix lignes du Grand Livre : perds 10 de Tyrannie ([TopScope.GetValue('xar_pr_tyranny')|0] points, une fois par parcours)"
 xar.0001.prev_page:0 "Page précédente"
 xar.0001.next_page:0 "Page suivante"
 xar.0001.finish:0 "Commencer cette vie (les [TopScope.GetValue('xar_points')] points restants deviennent autant d'or)"

 # Première vie et registre
 xar.0010.title:0 "Une Vie Encore Inembrasée"
 xar.0010.desc:0 "Voyageur, cette page est encore vierge. Tu n'as aucune braise d'une vie passée à mettre en gage ; la boutique ne montrerait que des prix silencieux.\n\nAccorde-moi donc une histoire à crédit. Le poids de cette vie sera mesuré à sa fin ; atteins un nouveau rang de braises, et ta prochaine vie aura de quoi négocier.\n\nQuant à la première faveur... je la porterai à ton compte."
 xar.0010.begin:0 "Alors, que cette vie commence."
 xar_ledger_decision:0 "Registre du Feu de Verre"
 xar_ledger_decision_desc:0 "Ouvrir le compte tenu par le Seigneur du Feu de Verre et consulter le poids actuel et le prochain seuil de braises. Lecture seule."
 xar_ledger_decision_tooltip:0 "Voir le score actuel, le rang historique et le prochain rang"
 xar_ledger_decision_confirm:0 "Ouvrir le registre"
 xar.0011.title:0 "Registre du Feu de Verre"
 xar.0011.desc:0 "Voyageur, ta page t'attend toujours. Regarder les chiffres ne conclut aucun marché.\n\nScore actuel en lecture seule : #V [TopScope.GetValue('xar_ledger_score')|1]#!\nRang historique de braises : #V [TopScope.GetValue('xar_ledger_history')|0]#!\nRang candidat actuel : #V [TopScope.GetValue('xar_ledger_candidate')|0]#!\nProchain rang : #V [TopScope.GetValue('xar_ledger_next')|0]#!\nÉcart au prochain rang : #V [TopScope.GetValue('xar_ledger_gap')|1]#!\nPaires bénédiction-malédiction accomplies : #V [TopScope.GetValue('xar_ledger_pairs')|0]#!\nRefus : #V [TopScope.GetValue('xar_ledger_refusals')|0]#!"
 xar.0011.desc_cap:0 "$xar.0011.desc$\n\n#P Ce compte a atteint le plafond actuel des rangs de braises ; le prochain rang reste le plafond et l'écart est nul.#!"
 xar.0011.close:0 "Refermer. Les braises brûlent encore."

 # Death score event
 xar.1001.title:0 "La Réincarnation Prend Fin"
 xar.1001.new_record:0 "Bien joué. Ce compte est désormais inscrit dans l'éternité."
 xar.1001.no_record:0 "Ne te décourage pas. Le feu de verre attendra ton retour."
 xar.1001.desc:0 "Bien joué, voyageur. Le poids de cette vie a été soigneusement mesuré.\n\n—— Attributs (1 point chacun) ——\nDiplomatie : [TopScope.GetValue('xar_a_dip')] × 1 = [TopScope.GetValue('xar_p_dip')]\nMartial : [TopScope.GetValue('xar_a_mar')] × 1 = [TopScope.GetValue('xar_p_mar')]\nIntendance : [TopScope.GetValue('xar_a_ste')] × 1 = [TopScope.GetValue('xar_p_ste')]\nIntrigue : [TopScope.GetValue('xar_a_int')] × 1 = [TopScope.GetValue('xar_p_int')]\nÉrudition : [TopScope.GetValue('xar_a_lea')] × 1 = [TopScope.GetValue('xar_p_lea')]\nProuesse : [TopScope.GetValue('xar_a_pro')] × 1 = [TopScope.GetValue('xar_p_pro')]\n\n—— Sang (doivent être tes descendants) ——\nMembres vivants de la dynastie : [TopScope.GetValue('xar_a_dyn')] × 0.1 = [TopScope.GetValue('xar_p_dyn')]\nMembres vivants de la maison (bonus) : [TopScope.GetValue('xar_a_hou')] × 0.1 = [TopScope.GetValue('xar_p_hou')]\n\n—— Ressources (log₂ arrondi inf.) ——\nOr : [TopScope.GetValue('xar_a_gold')] → [TopScope.GetValue('xar_l_gold')] × 5 = [TopScope.GetValue('xar_p_gold')]\nPrestige : [TopScope.GetValue('xar_a_pres')] → [TopScope.GetValue('xar_l_pres')] × 3 = [TopScope.GetValue('xar_p_pres')]\nPiété : [TopScope.GetValue('xar_a_pie')] → [TopScope.GetValue('xar_l_pie')] × 3 = [TopScope.GetValue('xar_p_pie')]\nInfluence : [TopScope.GetValue('xar_a_inf')] → [TopScope.GetValue('xar_l_inf')] × 3 = [TopScope.GetValue('xar_p_inf')]\n\n—— Titres détenus à la mort ——\nComté ×1 : [TopScope.GetValue('xar_n_t1')] = [TopScope.GetValue('xar_p_t1')]\nDuché ×2.5 : [TopScope.GetValue('xar_n_t2')] = [TopScope.GetValue('xar_p_t2')]\nRoyaume ×5 : [TopScope.GetValue('xar_n_t3')] = [TopScope.GetValue('xar_p_t3')]\nEmpire ×10 : [TopScope.GetValue('xar_n_t4')] = [TopScope.GetValue('xar_p_t4')]\nHégémonie ×20 : [TopScope.GetValue('xar_n_t5')] = [TopScope.GetValue('xar_p_t5')]\n\n—— Descendants (titre le plus élevé des descendants vivants) ——\nComté ×0.25 : [TopScope.GetValue('xar_d_t1')] = [TopScope.GetValue('xar_p_d1')]\nDuché ×1 : [TopScope.GetValue('xar_d_t2')] = [TopScope.GetValue('xar_p_d2')]\nRoyaume ×2.5 : [TopScope.GetValue('xar_d_t3')] = [TopScope.GetValue('xar_p_d3')]\nEmpire ×5 : [TopScope.GetValue('xar_d_t4')] = [TopScope.GetValue('xar_p_d4')]\nHégémonie ×10 : [TopScope.GetValue('xar_d_t5')] = [TopScope.GetValue('xar_p_d5')]\n\n—— Domaine (si en possession de terres) ——\nTaille du domaine (comtés, vassaux inclus) : [TopScope.GetValue('xar_a_realm')] → [TopScope.GetValue('xar_l_realm')] × 10 = [TopScope.GetValue('xar_p_realm')]\n\n—— Prix du refus ——\nFaveurs refusées : [TopScope.GetValue('xar_reject_n')] × -1 % (multiplicateur minimum : 0)\n\nTotal = [TopScope.GetValue('xar_p_dip')]+[TopScope.GetValue('xar_p_mar')]+[TopScope.GetValue('xar_p_ste')]+[TopScope.GetValue('xar_p_int')]+[TopScope.GetValue('xar_p_lea')]+[TopScope.GetValue('xar_p_pro')]+[TopScope.GetValue('xar_p_dyn')]+[TopScope.GetValue('xar_p_hou')]+[TopScope.GetValue('xar_p_gold')]+[TopScope.GetValue('xar_p_pres')]+[TopScope.GetValue('xar_p_pie')]+[TopScope.GetValue('xar_p_inf')]+[TopScope.GetValue('xar_p_t1')]+[TopScope.GetValue('xar_p_t2')]+[TopScope.GetValue('xar_p_t3')]+[TopScope.GetValue('xar_p_t4')]+[TopScope.GetValue('xar_p_t5')]+[TopScope.GetValue('xar_p_d1')]+[TopScope.GetValue('xar_p_d2')]+[TopScope.GetValue('xar_p_d3')]+[TopScope.GetValue('xar_p_d4')]+[TopScope.GetValue('xar_p_d5')]+[TopScope.GetValue('xar_p_realm')] = [TopScope.GetValue('xar_subtotal')]\nFaveurs refusées: [TopScope.GetValue('xar_reject_n')] = -[TopScope.GetValue('xar_reject_n')]%\nScore final: [TopScope.GetValue('xar_score')]\n\nRecord précédent : [TopScope.GetValue('xar_old')]\nDifférence : [TopScope.GetValue('xar_delta')|+0]"

 # Blessing/curse sessions (pools: docs/blessing-curse-pools.md)
 xar.0004.title:0 "La Faveur du Feu de Verre"
 xar.0004.desc:0 "Voilà, voyageur, nos affaires sont closes. Et pourtant — il me reste quelques lueurs éparses dans la manche. Je pourrais t'en faire grâce.\n\nMais tu connais la règle : chaque faveur exige une marque de malédiction en retour. ...Un échange équitable, je t'assure.\n\nUne rencontre, une paire. Après l'échange — ou ton départ — je reviendrai dans trois ans.\n\n（Accomplies : [TopScope.GetValue('xar_bc_n')] ; refusées : [TopScope.GetValue('xar_br_n')], score final -[TopScope.GetValue('xar_br_n')] %）"
 xar.0004.decline:0 "Je ne veux rien."
 xar.0005.title:0 "Le Prix de la Marque"
 xar.0005.desc:0 "Tu as choisi ? Alors — l'heure est venue de régler la note.\n\nN'aie pas peur. Ça ne pique qu'un instant. ...Probablement."

 # Paid custom courtier creator
 xar_courtier_creator_decision:0 "Commander un courtisan du Feu de Verre"
 xar_courtier_creator_decision_desc:0 "Demande au Seigneur du Feu de Verre de façonner sur commande le corps, les talents, les traits, l'origine et la lignée d'un courtisan. Chaque raffinement a son prix ; l'âme achevée rejoindra ta cour."
 xar_courtier_creator_decision_tooltip:0 "Concevoir et commander un courtisan personnalisé contre paiement"
 xar_courtier_creator_decision_confirm:0 "Ouvrir la commande"
 xar.cc.title:0 "Une âme sur commande"
 xar.cc.intro:0 "Voyageur, toute cour a une chaise vide. Choisis quelle sorte de chaleur devrait s'asseoir près de ton trône ; je ne réclame mon dû que lorsque l'âme franchit le seuil."
