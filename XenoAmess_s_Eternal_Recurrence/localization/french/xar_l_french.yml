 xar.cc.numeric.plus_10:0 "+10"
 xar.cc.base_stats:0 "L'âge se règle exactement de 0 à 120. Les six barres en lecture seule indiquent les compétences de base exactes et non modifiées, de 0 à 100 ; utilise les boutons de pas. Les prix suivent la courbe absolue non linéaire du Créateur de dirigeant du jeu de base, puis les modificateurs d'éducation et de traits sont appliqués."
 xar.cc.education.help:0 "Tous les traits d'éducation du jeu de base sont listés. Une âme de 16 ans ou plus doit en avoir exactement un ; un enfant n'en a aucun."
 xar.cc.commander.help:0 "Les 17 traits de commandant du jeu de base sont listés. Choisis-en jusqu'à deux ; chacun commence à la maîtrise de base avec zéro XP. Sélectionnés : [GetPlayer.MakeScope.Var('xar_cc_commander_count').GetValue|0]/2."
 xar.cc.physical.help:0 "Les 38 traits physiques du jeu de base sont listés, y compris le $trait_impotent$ normalement caché. Les choix compatibles peuvent être combinés."
 xar.cc.personality.help:0 "Les 36 traits de personnalité du jeu de base sont listés. Choisis-en jusqu'à trois ; choisir un opposé remplace son pendant. Sélectionnés : [GetPlayer.MakeScope.Var('xar_cc_personality_count').GetValue|0]/3."
 xar.cc.other.help:0 "Les 108 autres traits du jeu de base visibles dans le Créateur de dirigeant sont listés ici. Ils comprennent de puissants statuts, des états de santé et d'autres choix lourds de conséquences."
 xar.cc.origin.help:0 "Choisis parmi toutes les cultures et les fois chargées, puis fais de cette âme un être de basse extraction ou place-la dans ta dynastie et ta maison. Cette dernière option est indisponible si tu n'as pas de maison."
