 # Trait
 trait_xar_glassfire_gaze:0 "琉焰の瞳"
 trait_xar_glassfire_gaze_desc:0 "このキャラクターは玻璃色の炎に見守られている、見守られている……終わりの時まで。"
 trait_xar_glassfire_gaze_character_desc:0 "このキャラクターは玻璃色の炎に見守られている……終わりの時まで。\n\n現在の重み：#V [SCOPE.ScriptValue('xar_current_score_value')|1]#!（プレビューのみ）"
 trait_track_xar_glassfire_gaze:0 "琉焰の残り火"
 trait_track_xar_glassfire_gaze_desc:0 "完了した恩恵と呪痕の組ごとに経験値を1得る。10経験値ごとにレベルが上がり、ストレス蓄積がさらに10%増加し、基本能力の成長、再抽選、封印が付与される。"

 # The pact (game start)
 xar.0002.title:0 "終末の契り"
 xar.0002.desc:0 "——また会ったな、旅人。\n\n我は琉焰卿、呪いの狭間に棲まう仲魔。汝の歩んだすべての道、その果てで残り火を拾い集めてきた。\n\nこの契りに再び調印するなら、前世のすべての重みが、今生の取引材料となるだろう。\n\n琉焰は急かさない。ただ……見守り続ける。"
 xar.0002.accept:0 "受け入れよう。玻璃色の炎が証人だ。"
 xar.0002.decline:0 "いや、この人生は一人で歩む。"

 # Polite farewell
 xar.0003.title:0 "琉焰の挨拶"
 xar.0003.desc:0 "構わぬ。琉焰は誰にも強要しない。\n\n汝の物語が汝だけのものでありますように——また会おう。あるいは……永遠に。"
 xar.0003.ok:0 "達者でな。"

