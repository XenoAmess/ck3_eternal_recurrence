 xar.0001.dynasty_prestige:0 "一族の威信 100 と交換（[TopScope.GetValue('xar_pr_dyn')|0] ポイント）"
 xar.0001.lifespan:0 "借命 1 層と交換（健康 +1、[TopScope.GetValue('xar_pr_life')|0] ポイント）"
 xar.0001.reform:0 "無料の宗教改革 1 回（[TopScope.GetValue('xar_pr_reform')|0] ポイント、1 プレイにつき 1 回）"
 xar.0001.reform_hint:0 "購入後、信仰ウィンドウで改革を実行。敬虔コストは免除される。"
 xar.0001.grand_tribute:0 "万国の貢火：威信・敬虔・影響力・一族の威信を各 +1,500（[TopScope.GetValue('xar_pr_grand_tribute')|0] ポイント）"
 xar.0001.borrowed_generation:0 "一代を借りる：借命を 25 層まで補充（各層 健康 +1、[TopScope.GetValue('xar_pr_borrowed_generation')|0] ポイント）"
 xar.0001.sixfold_apotheosis:0 "六能力の神化：全能力 +30（[TopScope.GetValue('xar_pr_sixfold_apotheosis')|0] ポイント）"
 xar.0001.reroll_token:0 "恩恵の再抽選を一つ買う（[TopScope.GetValue('xar_pr_reroll')|0] ポイント）"
 xar.0001.seal_token:0 "呪痕の封印を一つ買う（[TopScope.GetValue('xar_pr_seal')|0] ポイント）"
 xar.0001.dread:0 "囁かれし凶行を質草に差し出す：恐怖20を得る（[TopScope.GetValue('xar_pr_dread')|0] ポイント、一回限り）"
 xar.0001.legitimacy:0 "王冠に汝を覚えさせよ：正統性100を得る（[TopScope.GetValue('xar_pr_legitimacy')|0] ポイント、一回限り）"
 xar.0001.tyranny:0 "帳簿の十行を焼き捨てる：暴虐10を失う（[TopScope.GetValue('xar_pr_tyranny')|0] ポイント、一回限り）"
 xar.0001.prev_page:0 "前のページ"
 xar.0001.next_page:0 "次のページ"
 xar.0001.finish:0 "この人生を始める（残り [TopScope.GetValue('xar_points')] ポイントは同額の金貨になる）"

 # 初世と琉焰の帳簿
 xar.0010.title:0 "未だ燃えぬ生"
 xar.0010.desc:0 "旅人よ、この頁はまだ白い。質に入れる前世の残り火がない以上、店を開いても沈黙する値札しか並ばぬ。\n\nまずは一つ、物語を我に借りるがよい。この生の重みは終末に量られ、新たな残り火の位階へ届けば、次の生には取引の種が残る。\n\n最初の眷顧は……帳簿につけておこう。"
 xar.0010.begin:0 "では、この生を始めよう。"
 xar_ledger_decision:0 "琉焰の帳簿"
 xar_ledger_decision_desc:0 "琉焰卿が記す今生の帳簿を開き、現在の重みと次の残り火の境を確認する。閲覧のみで取引は生じない。"
 xar_ledger_decision_tooltip:0 "現在の点数、歴代の残り火位階、次の位階を確認する"
 xar_ledger_decision_confirm:0 "帳簿を開く"
 xar.0011.title:0 "琉焰の帳簿"
 xar.0011.desc:0 "旅人よ、汝の頁はいつでも待っている。数字を見るだけなら、取引には数えぬ。\n\n現在の閲覧用点数：#V [TopScope.GetValue('xar_ledger_score')|1]#!\n歴代の残り火位階：#V [TopScope.GetValue('xar_ledger_history')|0]#!\n現在の候補位階：#V [TopScope.GetValue('xar_ledger_candidate')|0]#!\n次の位階：#V [TopScope.GetValue('xar_ledger_next')|0]#!\n次の位階まで：#V [TopScope.GetValue('xar_ledger_gap')|1]#!\n完了した祝福と呪いの組：#V [TopScope.GetValue('xar_ledger_pairs')|0]#!\n拒絶回数：#V [TopScope.GetValue('xar_ledger_refusals')|0]#!"
 xar.0011.desc_cap:0 "$xar.0011.desc$\n\n#P この帳簿は現在の残り火位階の上限に達した。次の位階も上限として示され、差はゼロとなる。#!"
 xar.0011.close:0 "閉じよう。残り火はまだ燃えている。"

 # Death score event
 xar.1001.title:0 "輪廻の終わり"
 xar.1001.new_record:0 "よくやった。この帳簿は永遠に記された。"
 xar.1001.no_record:0 "落ち込むな。琉焰は汝の再来を待っている。"
 xar.1001.desc:0 "よくやった、旅人。この人生の重みは、丁寧に量らせてもらった。\n\n—— 属性（各 1 ポイント）——\n外交：[TopScope.GetValue('xar_a_dip')] × 1 = [TopScope.GetValue('xar_p_dip')]\n軍事：[TopScope.GetValue('xar_a_mar')] × 1 = [TopScope.GetValue('xar_p_mar')]\n管理：[TopScope.GetValue('xar_a_ste')] × 1 = [TopScope.GetValue('xar_p_ste')]\n謀略：[TopScope.GetValue('xar_a_int')] × 1 = [TopScope.GetValue('xar_p_int')]\n学識：[TopScope.GetValue('xar_a_lea')] × 1 = [TopScope.GetValue('xar_p_lea')]\n武勇：[TopScope.GetValue('xar_a_pro')] × 1 = [TopScope.GetValue('xar_p_pro')]\n\n—— 血統（汝の子孫に限る）——\n存命の一族メンバー：[TopScope.GetValue('xar_a_dyn')] × 0.1 = [TopScope.GetValue('xar_p_dyn')]\n存命の氏族メンバー（追加）：[TopScope.GetValue('xar_a_hou')] × 0.1 = [TopScope.GetValue('xar_p_hou')]\n\n—— 資源（log₂ 切り捨て）——\n金貨：[TopScope.GetValue('xar_a_gold')] → [TopScope.GetValue('xar_l_gold')] × 5 = [TopScope.GetValue('xar_p_gold')]\n威信：[TopScope.GetValue('xar_a_pres')] → [TopScope.GetValue('xar_l_pres')] × 3 = [TopScope.GetValue('xar_p_pres')]\n敬虔：[TopScope.GetValue('xar_a_pie')] → [TopScope.GetValue('xar_l_pie')] × 3 = [TopScope.GetValue('xar_p_pie')]\n影響力：[TopScope.GetValue('xar_a_inf')] → [TopScope.GetValue('xar_l_inf')] × 3 = [TopScope.GetValue('xar_p_inf')]\n\n—— 死時点の保有称号 ——\n伯爵級 ×1：[TopScope.GetValue('xar_n_t1')] = [TopScope.GetValue('xar_p_t1')]\n公爵級 ×2.5：[TopScope.GetValue('xar_n_t2')] = [TopScope.GetValue('xar_p_t2')]\n王級 ×5：[TopScope.GetValue('xar_n_t3')] = [TopScope.GetValue('xar_p_t3')]\n皇帝級 ×10：[TopScope.GetValue('xar_n_t4')] = [TopScope.GetValue('xar_p_t4')]\n覇権級 ×20：[TopScope.GetValue('xar_n_t5')] = [TopScope.GetValue('xar_p_t5')]\n\n—— 子孫（存命の子孫の最高称号）——\n伯爵級 ×0.25：[TopScope.GetValue('xar_d_t1')] = [TopScope.GetValue('xar_p_d1')]\n公爵級 ×1：[TopScope.GetValue('xar_d_t2')] = [TopScope.GetValue('xar_p_d2')]\n王級 ×2.5：[TopScope.GetValue('xar_d_t3')] = [TopScope.GetValue('xar_p_d3')]\n皇帝級 ×5：[TopScope.GetValue('xar_d_t4')] = [TopScope.GetValue('xar_p_d4')]\n覇権級 ×10：[TopScope.GetValue('xar_d_t5')] = [TopScope.GetValue('xar_p_d5')]\n\n—— 領地（領地保有時）——\n領地規模（封臣の伯爵領を含む）：[TopScope.GetValue('xar_a_realm')] → [TopScope.GetValue('xar_l_realm')] × 10 = [TopScope.GetValue('xar_p_realm')]\n\n—— 拒絶の代価 ——\n眷顧を断った回数：[TopScope.GetValue('xar_reject_n')] × -1%（総倍率の下限は0）\n\n合計 = [TopScope.GetValue('xar_p_dip')]+[TopScope.GetValue('xar_p_mar')]+[TopScope.GetValue('xar_p_ste')]+[TopScope.GetValue('xar_p_int')]+[TopScope.GetValue('xar_p_lea')]+[TopScope.GetValue('xar_p_pro')]+[TopScope.GetValue('xar_p_dyn')]+[TopScope.GetValue('xar_p_hou')]+[TopScope.GetValue('xar_p_gold')]+[TopScope.GetValue('xar_p_pres')]+[TopScope.GetValue('xar_p_pie')]+[TopScope.GetValue('xar_p_inf')]+[TopScope.GetValue('xar_p_t1')]+[TopScope.GetValue('xar_p_t2')]+[TopScope.GetValue('xar_p_t3')]+[TopScope.GetValue('xar_p_t4')]+[TopScope.GetValue('xar_p_t5')]+[TopScope.GetValue('xar_p_d1')]+[TopScope.GetValue('xar_p_d2')]+[TopScope.GetValue('xar_p_d3')]+[TopScope.GetValue('xar_p_d4')]+[TopScope.GetValue('xar_p_d5')]+[TopScope.GetValue('xar_p_realm')] = [TopScope.GetValue('xar_subtotal')]\n垂青の拒否: [TopScope.GetValue('xar_reject_n')] = -[TopScope.GetValue('xar_reject_n')]%\n最終スコア: [TopScope.GetValue('xar_score')]\n\n前回の記録：[TopScope.GetValue('xar_old')]\n差分：[TopScope.GetValue('xar_delta')|+0]"

 # Blessing/curse sessions (pools: docs/blessing-curse-pools.md)
 xar.0004.title:0 "琉焰の眷顧"
 xar.0004.desc:0 "旅人よ、取引は済んだ。だが——我の袖には、まだ零れた輝きが残っている。少しばかり恵んでやってもいい。\n\nただし掟は知っておろう：眷顧一つにつき、呪痕一つを代償とする。……安心せよ、公平な取引だ。\n\n一会に一組。取引の後も、汝が退いた後も——三年後、また尋ねよう。\n\n（完了 [TopScope.GetValue('xar_bc_n')] 組；拒絶 [TopScope.GetValue('xar_br_n')] 回、最終スコア -[TopScope.GetValue('xar_br_n')]%）"
 xar.0004.decline:0 "何もいらぬ。"
 xar.0005.title:0 "等価の呪痕"
 xar.0005.desc:0 "選んだか。では——勘定の時間だ。\n\n怖がるな。痛みは一瞬だ。……たぶんな。"

 # Paid custom courtier creator
 xar_courtier_creator_decision:0 "琉焰の廷臣を誂える"
 xar_courtier_creator_decision_desc:0 "琉焰卿に、廷臣の肉体、才覚、特性、出自、血統を望みどおりに形作らせる。あらゆる細工には対価があり、完成した魂はあなたの宮廷に加わる。"
 xar_courtier_creator_decision_tooltip:0 "有料の特注廷臣を設計し、仕立てを依頼する"
 xar_courtier_creator_decision_confirm:0 "委嘱の契頁を開く"
 xar.cc.title:0 "委嘱される魂"
 xar.cc.intro:0 "旅人よ、宮廷には必ず空席が一つあるものです。玉座の傍にどんな温もりを据えたいかお選びください。魂が一歩を踏み入れたその時に、初めて代価を頂戴いたします。"
