l_japanese:
 # Game rule
 rule_xar_enabled:0 "琉焰卿の永遠の輪廻"
 setting_xar_on:0 "有効"
 setting_xar_on_desc:0 "琉焰卿モードが有効：ゲーム開始時にグローバル最高記録がインポートされ、強化の購入に使用できます。"
 setting_xar_off:0 "無効"
 setting_xar_off_desc:0 "琉焰卿モードは無効です。"

 # Tutorial lesson step sentinel text. Must stay identical in every language.
 xar_silent_step:0 "XAR_SYNC_SENTINEL"

 # Sentinel returned by the record-level customizable localization.
 xar_top_bit_sentinel:0 "XAR_TOP_SENTINEL"

 # Sentinel for the exit-to-menu bridge.
 xar_quit_sentinel:0 "XAR_QUIT_SENTINEL"

 # Trait
 trait_xar_glassfire_gaze:0 "琉焰の瞳"
 trait_xar_glassfire_gaze_desc:0 "このキャラクターは玻璃色の炎に見守られている、見守られている……終わりの時まで。"

 # The pact (game start)
 xar.0002.title:0 "終末の契り"
 xar.0002.desc:0 "——また会ったな、旅人。\n\n我は琉焰卿、呪いの狭間に棲まう仲魔。汝の歩んだすべての道、その果てで残り火を拾い集めてきた。\n\nこの契りに再び調印するなら、前世のすべての重みが、今生の取引材料となるだろう。\n\n琉焰は急かさない。ただ……見守り続ける。"
 xar.0002.accept:0 "受け入れよう。玻璃色の炎が証人だ。"
 xar.0002.decline:0 "いや、この人生は一人で歩む。"

 # Polite farewell
 xar.0003.title:0 "琉焰の挨拶"
 xar.0003.desc:0 "構わぬ。琉焰は誰にも強要しない。\n\n汝の物語が汝だけのものでありますように——また会おう。あるいは……永遠に。"
 xar.0003.ok:0 "達者でな。"

 # Opening shop event
 xar.0001.title:0 "輪廻の質屋"
 xar.0001.desc:0 "ようこそ、旅人。この散らばった輝きは、前世の残り火だ。\n\n現在 [TopScope.GetValue('xar_points')] ポイントを所持している。何と交換しようか？"
 xar.0001.diplomacy:0 "外交 +1 を購入（[TopScope.GetValue('xar_pr_dip')|0] ポイント）"
 xar.0001.martial:0 "軍事 +1 を購入（[TopScope.GetValue('xar_pr_mar')|0] ポイント）"
 xar.0001.stewardship:0 "管理 +1 を購入（[TopScope.GetValue('xar_pr_ste')|0] ポイント）"
 xar.0001.intrigue:0 "謀略 +1 を購入（[TopScope.GetValue('xar_pr_int')|0] ポイント）"
 xar.0001.learning:0 "学識 +1 を購入（[TopScope.GetValue('xar_pr_lea')|0] ポイント）"
 xar.0001.prowess:0 "武勇 +1 を購入（[TopScope.GetValue('xar_pr_pro')|0] ポイント）"
 xar.0001.gold:0 "金貨 100 と交換（[TopScope.GetValue('xar_pr_gold')|0] ポイント）"
 xar.0001.prestige:0 "威信 100 と交換（[TopScope.GetValue('xar_pr_pres')|0] ポイント）"
 xar.0001.piety:0 "敬虔 100 と交換（[TopScope.GetValue('xar_pr_pie')|0] ポイント）"
 xar.0001.influence:0 "影響力 100 と交換（[TopScope.GetValue('xar_pr_inf')|0] ポイント）"
 xar.0001.dynasty_prestige:0 "一族の威信 100 と交換（[TopScope.GetValue('xar_pr_dyn')|0] ポイント）"
 xar.0001.lifespan:0 "平均寿命 1 年と交換（[TopScope.GetValue('xar_pr_life')|0] ポイント）"
 xar.0001.reform:0 "無料の宗教改革 1 回（[TopScope.GetValue('xar_pr_reform')|0] ポイント、1 プレイにつき 1 回）"
 xar.0001.reform_hint:0 "購入後、信仰ウィンドウで改革を実行。敬虔コストは免除される。"
 xar.0001.prev_page:0 "前のページ"
 xar.0001.next_page:0 "次のページ"
 xar.0001.finish:0 "この人生を始める（残り [TopScope.GetValue('xar_points')] ポイントは同額の金貨になる）"

 # Death score event
 xar.1001.title:0 "輪廻の終わり"
 xar.1001.new_record:0 "よくやった。この帳簿は永遠に記された。"
 xar.1001.no_record:0 "落ち込むな。琉焰は汝の再来を待っている。"
 xar.1001.desc:0 "よくやった、旅人。この人生の重みは、丁寧に量らせてもらった。\n\n—— 属性（各 1 ポイント）——\n外交：[TopScope.GetValue('xar_a_dip')] × 1 = [TopScope.GetValue('xar_p_dip')]\n軍事：[TopScope.GetValue('xar_a_mar')] × 1 = [TopScope.GetValue('xar_p_mar')]\n管理：[TopScope.GetValue('xar_a_ste')] × 1 = [TopScope.GetValue('xar_p_ste')]\n謀略：[TopScope.GetValue('xar_a_int')] × 1 = [TopScope.GetValue('xar_p_int')]\n学識：[TopScope.GetValue('xar_a_lea')] × 1 = [TopScope.GetValue('xar_p_lea')]\n武勇：[TopScope.GetValue('xar_a_pro')] × 1 = [TopScope.GetValue('xar_p_pro')]\n\n—— 血統（汝の子孫に限る）——\n存命の一族メンバー：[TopScope.GetValue('xar_a_dyn')] × 0.1 = [TopScope.GetValue('xar_p_dyn')]\n存命の氏族メンバー（追加）：[TopScope.GetValue('xar_a_hou')] × 0.1 = [TopScope.GetValue('xar_p_hou')]\n\n—— 資源（log₂ 切り捨て）——\n金貨：[TopScope.GetValue('xar_a_gold')] → [TopScope.GetValue('xar_l_gold')] × 5 = [TopScope.GetValue('xar_p_gold')]\n威信：[TopScope.GetValue('xar_a_pres')] → [TopScope.GetValue('xar_l_pres')] × 3 = [TopScope.GetValue('xar_p_pres')]\n敬虔：[TopScope.GetValue('xar_a_pie')] → [TopScope.GetValue('xar_l_pie')] × 3 = [TopScope.GetValue('xar_p_pie')]\n影響力：[TopScope.GetValue('xar_a_inf')] → [TopScope.GetValue('xar_l_inf')] × 3 = [TopScope.GetValue('xar_p_inf')]\n\n—— 死時点の保有称号 ——\n伯爵級 ×1：[TopScope.GetValue('xar_n_t1')] = [TopScope.GetValue('xar_p_t1')]\n公爵級 ×2.5：[TopScope.GetValue('xar_n_t2')] = [TopScope.GetValue('xar_p_t2')]\n王級 ×5：[TopScope.GetValue('xar_n_t3')] = [TopScope.GetValue('xar_p_t3')]\n皇帝級 ×10：[TopScope.GetValue('xar_n_t4')] = [TopScope.GetValue('xar_p_t4')]\n覇権級 ×20：[TopScope.GetValue('xar_n_t5')] = [TopScope.GetValue('xar_p_t5')]\n\n—— 子孫（存命の子孫の最高称号）——\n伯爵級 ×0.25：[TopScope.GetValue('xar_d_t1')] = [TopScope.GetValue('xar_p_d1')]\n公爵級 ×1：[TopScope.GetValue('xar_d_t2')] = [TopScope.GetValue('xar_p_d2')]\n王級 ×2.5：[TopScope.GetValue('xar_d_t3')] = [TopScope.GetValue('xar_p_d3')]\n皇帝級 ×5：[TopScope.GetValue('xar_d_t4')] = [TopScope.GetValue('xar_p_d4')]\n覇権級 ×10：[TopScope.GetValue('xar_d_t5')] = [TopScope.GetValue('xar_p_d5')]\n\n—— 領地（領地保有時）——\n領地規模（封臣の伯爵領を含む）：[TopScope.GetValue('xar_a_realm')] → [TopScope.GetValue('xar_l_realm')] × 10 = [TopScope.GetValue('xar_p_realm')]\n\n合計 = [TopScope.GetValue('xar_p_dip')]+[TopScope.GetValue('xar_p_mar')]+[TopScope.GetValue('xar_p_ste')]+[TopScope.GetValue('xar_p_int')]+[TopScope.GetValue('xar_p_lea')]+[TopScope.GetValue('xar_p_pro')]+[TopScope.GetValue('xar_p_dyn')]+[TopScope.GetValue('xar_p_hou')]+[TopScope.GetValue('xar_p_gold')]+[TopScope.GetValue('xar_p_pres')]+[TopScope.GetValue('xar_p_pie')]+[TopScope.GetValue('xar_p_inf')]+[TopScope.GetValue('xar_p_t1')]+[TopScope.GetValue('xar_p_t2')]+[TopScope.GetValue('xar_p_t3')]+[TopScope.GetValue('xar_p_t4')]+[TopScope.GetValue('xar_p_t5')]+[TopScope.GetValue('xar_p_d1')]+[TopScope.GetValue('xar_p_d2')]+[TopScope.GetValue('xar_p_d3')]+[TopScope.GetValue('xar_p_d4')]+[TopScope.GetValue('xar_p_d5')]+[TopScope.GetValue('xar_p_realm')] = [TopScope.GetValue('xar_score')]\n\n前回の記録：[TopScope.GetValue('xar_old')]\n差分：[TopScope.GetValue('xar_delta')|+0]"
