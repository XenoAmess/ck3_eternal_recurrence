 xar.cc.numeric.plus_10:0 "+10"
 xar.cc.base_stats:0 "年齢は0から120まで正確に調整できる。6本の読み取り専用バーは、補正前の基本能力を0から100まで正確に示す。ステップボタンで調整すること。価格はゲーム本体の統治者デザイナーと同じ非線形の絶対値曲線に従い、その後に教育と特性の補正が加わる。"
 xar.cc.education.help:0 "ゲーム本体の教育特性をすべて掲載している。16歳以上の成人は必ず1つを選ぶ必要があり、子供には教育特性が付かない。"
 xar.cc.commander.help:0 "ゲーム本体の指揮官特性17種をすべて掲載している。最大2つまで選択でき、それぞれ熟練度0の基礎段階から始まる。選択数：[GetPlayer.MakeScope.Var('xar_cc_commander_count').GetValue|0]/2。"
 xar.cc.physical.help:0 "通常は隠されている$trait_impotent$を含む、ゲーム本体の身体特性38種をすべて掲載している。互換性のある選択は組み合わせられる。"
 xar.cc.personality.help:0 "ゲーム本体の性格特性36種をすべて掲載している。最大3つまで選択でき、対立する特性を選ぶと既存の反対側が置き換わる。選択数：[GetPlayer.MakeScope.Var('xar_cc_personality_count').GetValue|0]/3。"
 xar.cc.other.help:0 "統治者デザイナーに表示される、ゲーム本体の残り108種の特性を掲載している。強力な地位、健康、その他の重大な選択も含まれる。"
 xar.cc.origin.help:0 "読み込まれたすべての文化と宗派から選び、その魂を庶民にするか、あなたの王朝と家門に加える。家門がなければ後者は選べない。"
