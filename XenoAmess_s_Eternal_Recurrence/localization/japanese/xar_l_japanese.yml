 xar.0001.desc:0 "ようこそ、旅人。この散らばった輝きは、前世の残り火だ。\n\n現在 [TopScope.GetValue('xar_points')] ポイントを所持している。何と交換しようか？"
 xar.0001.diplomacy:0 "外交 +1 を購入（[TopScope.GetValue('xar_pr_dip')|0] ポイント）"
 xar.0001.martial:0 "軍事 +1 を購入（[TopScope.GetValue('xar_pr_mar')|0] ポイント）"
 xar.0001.stewardship:0 "管理 +1 を購入（[TopScope.GetValue('xar_pr_ste')|0] ポイント）"
 xar.0001.intrigue:0 "謀略 +1 を購入（[TopScope.GetValue('xar_pr_int')|0] ポイント）"
