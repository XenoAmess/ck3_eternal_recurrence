 xar_contract_none:0 "契約なし"
 xar_contract_select_decision:0 "生涯契約を選ぶ"
 xar_contract_select_decision_desc:0 "琉焰卿に、今世の増分目標を記してもらおう。"
 xar_contract_select_decision_tooltip:0 "戦争・陰謀・信仰・家族・執政・歓宴の契約から一つを選ぶ"
 xar_contract_select_decision_confirm:0 "彼に書かせよう"
 xar.2000.title:0 "質草としての此の世"
 xar.2000.desc:0 "旅人よ、最終台帳は魅惑的だが、私はまた炎が風を選ぶ様を見守るのも好む。一つ選びなさい。歩むごとに、今生の重みが増すだろう。"
 xar.0010.desc_clean:0 "旅人よ、汝の以前の残り火は残るが、この道は使える遺産を残さぬ。よろしい——空手のまま終えることは、計量をもっと興味深いものにする。最初の好意は勘定につけておこう。"
 xar.contract.milestone.title:0 "契約が輝く"
 xar.contract.milestone.3.ok:0 "最初の記入が為された。"
 xar.contract.milestone.6.ok:0 "墨が温み始めている。"
 xar.contract.milestone.10.ok:0 "この質草は完了した。"
 xar.gaze.milestone.title:0 "琉焰の瞳：新しき刻"
 xar.gaze.milestone.ok:0 "この遅れた温情を受け入れよう。"
 xar.0004.reroll:0 "新たな好意を得るために再抽選を一つ費やす"
 xar.0005.seal:0 "この呪痕を免除するために封印を一つ費やす"
 xar_contract_grade_s:0 "S"
 xar_contract_grade_a:0 "A"
 xar_contract_grade_c:0 "C"
 xar_contract_grade_d:0 "D"
