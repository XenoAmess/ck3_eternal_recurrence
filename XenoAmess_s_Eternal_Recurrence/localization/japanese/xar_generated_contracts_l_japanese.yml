 xar_contract_pb_3:0 "PB 3"
 xar_contract_pb_6:0 "PB 6"
 xar_contract_pb_10:0 "PB 10"
 xar.gaze.milestone.10:0 "琉焰の最初の環が開く。言葉は狭き戸を見出し、私はお前の好みに合うよう、再抽選を一つ授けよう。"
 xar.gaze.milestone.20:0 "第二の環は刃の寸法を学ぶ。お前は封印を一つ得る。呪痕を時折免除すれば、次の質草がより甘くなる。"
 xar.gaze.milestone.30:0 "第三の環はお前のために全ての残り火を数える。再抽選が二つ授けられよう、旅人よ。選択肢を多く示されるほど、欲望は同意に近づく。"
 xar.gaze.milestone.40:0 "第四の環は瞬きの間に秘密を匿う。二つの封印が冷め、汝が残したい呪痕を選ぶには足りよう。"
 xar.gaze.milestone.50:0 "第五の環は契約の裏側を照らす。再抽選二つと封印一つを保つがよい。知識は代価を消すのではなく、晒すのみ。"
 xar.gaze.milestone.60:0 "第六の環は抱擁のごとく優しく、骨に沿って燃ゆ。再抽選一つ、封印二つ、そして研ぎ澄まされた器、これこそが我が好意の全て。"
 xar.gaze.milestone.70:0 "第七の環は真と偽に同じ温もりを与える。再抽選三つと封印一つで、汝は運命を好む姿に彫り刻める。"
 xar.gaze.milestone.80:0 "第八の環は王冠すら量れる。再抽選一つと封印三つで、私が辛抱強く見守る間、汝はより大胆に手を伸ばせる。"
 xar.gaze.milestone.90:0 "第九の環は魂とほぼ重なる。再抽選四つと封印二つ。終焉は遠いが、汝はその価格を呼ぶ術を学んだ。"
 xar.gaze.milestone.100:0 "第十の環は閉じて、完全なる琉焰の瞳となる。再抽選三つ、封印四つ、そして最後の成長が一つ。旅人よ、汝は保存するに値する形見となった。"
