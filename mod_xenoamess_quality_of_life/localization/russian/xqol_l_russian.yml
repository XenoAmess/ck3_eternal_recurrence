l_russian:
 decision_group_type_xqol_quality_of_life:0 "XenoAmess: улучшение качества жизни"
 xqol_enable_auto_appointment_decision:0 "Включить автоматические назначения"
 xqol_enable_auto_appointment_decision_desc:0 "Не позволяет правителю становиться резервным наследником подчинённых бюрократических должностей. Действующий закон о наследовании через назначение выберет подходящего кандидата с наивысшим приоритетом претензий."
 xqol_enable_auto_appointment_decision_tooltip:0 "После смерти или отстранения бюрократические губернаторства перейдут подходящему кандидату с наивысшим приоритетом претензий."
 xqol_enable_auto_appointment_decision_confirm:0 "Пусть решают заслуги"
 xqol_disable_auto_appointment_decision:0 "Отключить автоматические назначения"
 xqol_disable_auto_appointment_decision_desc:0 "Восстанавливает исходный порядок оценки кандидатов на подчинённые бюрократические должности."
 xqol_disable_auto_appointment_decision_tooltip:0 "Восстанавливает исходный порядок назначений."
 xqol_disable_auto_appointment_decision_confirm:0 "Восстановить старый порядок"
 xqol_auto_appointment_enabled_tt:0 "Автоматическое наследование через назначение #P включено#!"
 xqol_auto_appointment_disabled_tt:0 "Автоматическое наследование через назначение #N отключено#!"
 xqol_auto_appointment_score_penalty_desc:0 "Автоматическое наследование: правитель отказывается от этого назначения"
 xqol_enable_no_vassal_transfers_decision:0 "Не передавать мне вассалов"
 xqol_enable_no_vassal_transfers_decision_desc:0 "Запрещает подчинённым бюрократическим правителям передавать вам своих вассалов. Используется встроенный запрет на передачу вассалов для ИИ, который не мешает передачам, начатым вами."
 xqol_enable_no_vassal_transfers_decision_tooltip:0 "Бюрократические вассалы не будут передавать вам своих вассалов."
 xqol_enable_no_vassal_transfers_decision_confirm:0 "Не нарушать порядок"
 xqol_disable_no_vassal_transfers_decision:0 "Снова разрешить передачу вассалов"
 xqol_disable_no_vassal_transfers_decision_desc:0 "Снимает введённый этим модом запрет на передачу вассалов и возвращает исходное поведение ИИ."
 xqol_disable_no_vassal_transfers_decision_tooltip:0 "Восстанавливает исходное поведение ИИ при передаче вассалов."
 xqol_disable_no_vassal_transfers_decision_confirm:0 "Снова их принимать"
 xqol_no_vassal_transfers_enabled_tt:0 "Передача вассалов игроку со стороны ИИ #P заблокирована#!"
 xqol_no_vassal_transfers_disabled_tt:0 "Передача вассалов игроку со стороны ИИ #N возобновлена#!"
 xqol_enable_auto_call_defenders_decision:0 "Включить автоматический призыв защитников"
 xqol_enable_auto_call_defenders_decision_desc:0 "Когда другой правитель объявляет вам войну, немедленно призывайте в неё всех ИИ-правителей, которых игра позволяет позвать на защиту без расхода золота, престижа или благочестия."
 xqol_enable_auto_call_defenders_decision_tooltip:0 "Автоматически призывать всех доступных бесплатных ИИ-защитников."
 xqol_enable_auto_call_defenders_decision_confirm:0 "Позвать всех обязанных"
 xqol_disable_auto_call_defenders_decision:0 "Отключить автоматический призыв защитников"
 xqol_disable_auto_call_defenders_decision_desc:0 "Прекратить автоматически призывать союзников, гарантирующих сюзеренов, доступных данников, подходящих соправителей и бесплатно призываемых членов дома в новые оборонительные войны."
 xqol_disable_auto_call_defenders_decision_tooltip:0 "Вернуть ручное управление призывом защитников."
 xqol_disable_auto_call_defenders_decision_confirm:0 "Я сам их позову"
 xqol_auto_call_defenders_enabled_tt:0 "Автоматический бесплатный призыв защитников #P включён#!"
 xqol_auto_call_defenders_disabled_tt:0 "Автоматический бесплатный призыв защитников #N отключён#!"
 xqol_auto_call_defenders_result_title:0 "Защитники откликнулись"
 xqol_auto_call_defenders_result_desc:0 "[GetPlayer.MakeScope.Var('xqol_last_auto_called_count').GetValue|0] бесплатно призываемых ИИ-правителей присоединились к вашей оборонительной войне."
 xqol_mass_conversion_decision:0 "Массово потребовать обращения во владениях"
 xqol_mass_conversion_decision_desc:0 "Выберите минимальный порог принятия от 0 до 100. Все подходящие ИИ-придворные, вассалы, подчинённые правители и данники в ваших владениях, чья обычная готовность обратиться достигает порога, получат требование обращения."
 xqol_mass_conversion_decision_tooltip:0 "Открыть ползунок порога принятия и отправить все подходящие требования обращения."
 xqol_mass_conversion_decision_confirm:0 "Задать порог"
 xqol_mass_conversion_event_title:0 "Задать порог принятия обращения"
 xqol_mass_conversion_event_desc:0 "Требование получат только персонажи, чья обычная готовность обратиться не ниже этого значения. Их фактический ответ по-прежнему определяется стандартной проверкой принятия."
 xqol_mass_conversion_event_confirm:0 "Отправить все подходящие требования"
 xqol_mass_conversion_event_cancel:0 "Отмена"
 xqol_mass_conversion_threshold_label:0 "Минимальная готовность обратиться"
 xqol_mass_conversion_threshold_help:0 "Перетащите ползунок или щёлкните по нему. 0 охватывает всех возможных целей, а 100 — только тех, кто точно согласится."
 xqol_mass_conversion_results_title:0 "Ответы на обращение владений получены"
 xqol_mass_conversion_results_desc:0 "Согласились: #P [GetPlayer.MakeScope.Var('xqol_mass_conversion_accepted').GetValue|0]#!   Отказались: #N [GetPlayer.MakeScope.Var('xqol_mass_conversion_refused').GetValue|0]#!"
 xqol_bulk_demand_payment_full_decision:0 "Потребовать все полные выплаты за рычаги влияния"
 xqol_bulk_demand_payment_full_decision_desc:0 "Используйте стандартное взаимодействие «Потребовать платы» для каждого подходящего ИИ-персонажа, на которого у вас есть рычаг влияния и который может выплатить всё обязательство. Каждое успешное требование расходует рычаг влияния."
 xqol_bulk_demand_payment_full_decision_tooltip:0 "Получать только полные выплаты за рычаги влияния."
 xqol_bulk_demand_payment_full_decision_confirm:0 "Получить все полные выплаты"
 xqol_bulk_demand_payment_any_decision:0 "Потребовать все доступные выплаты за рычаги влияния"
 xqol_bulk_demand_payment_any_decision_desc:0 "Используйте стандартное взаимодействие «Потребовать платы» для каждого подходящего ИИ-персонажа, на которого у вас есть рычаг влияния и больше 1 золота. Если цель не может выплатить всю сумму, она отдаёт всё имеющееся целое золото; каждое требование расходует рычаг влияния."
 xqol_bulk_demand_payment_any_decision_tooltip:0 "Получать выплаты от всех подходящих ИИ-персонажей с рычагом влияния и более чем 1 золотом."
 xqol_bulk_demand_payment_any_decision_confirm:0 "Забрать сколько есть"
 xqol_bulk_payment_results_title:0 "Выплаты за рычаги влияния получены"
 xqol_bulk_payment_results_desc:0 "Завершённые требования: [GetPlayer.MakeScope.Var('xqol_last_bulk_payment_count').GetValue|0]."
 xqol_bulk_ransom_full_decision:0 "Отпустить за полный выкуп всех доступных узников"
 xqol_bulk_ransom_full_decision_desc:0 "Предложите стандартный выкуп золотом за каждого узника, чей согласный ИИ-плательщик может оплатить полную применимую сумму. После каждого выкупа средства проверяются заново."
 xqol_bulk_ransom_full_decision_tooltip:0 "Отпускать узников только за полную применимую цену в золоте."
 xqol_bulk_ransom_full_decision_confirm:0 "Забрать все полные выкупы"
 xqol_bulk_ransom_any_decision:0 "Отпустить всех узников за имеющееся золото"
 xqol_bulk_ransom_any_decision_desc:0 "Предложите стандартный выкуп за каждого узника, чей согласный ИИ-плательщик имеет хотя бы 1 золота. Если он не может покрыть полную цену, игра забирает всё его имеющееся целое золото."
 xqol_bulk_ransom_any_decision_tooltip:0 "Отпускать узников за выкуп согласных ИИ-плательщиков, у которых есть хотя бы 1 золота."
 xqol_bulk_ransom_any_decision_confirm:0 "Опустошить все кошельки"
 xqol_bulk_ransom_results_title:0 "Выкуп узников завершён"
 xqol_bulk_ransom_results_desc:0 "Отпущено узников за выкуп: [GetPlayer.MakeScope.Var('xqol_last_bulk_ransom_count').GetValue|0]."
 xqol_bulk_release_terms_decision:0 "Отпустить всех согласных узников на условиях"
 xqol_bulk_release_terms_decision_desc:0 "Отпустите каждого согласного ИИ-узника с наибольшим совместимым набором условий: «Получить рычаг влияния», «Завербовать» и «Потребовать обращения». При равном числе приоритетны рычаг влияния, вербовка, затем обращение."
 xqol_bulk_release_terms_decision_tooltip:0 "Согласовать сильнейшую принимаемую комбинацию условий для каждого узника."
 xqol_bulk_release_terms_decision_confirm:0 "Предложить сильнейшие условия"
 xqol_bulk_release_results_title:0 "Условные освобождения завершены"
 xqol_bulk_release_results_desc:0 "Освобождено узников на принятых условиях: [GetPlayer.MakeScope.Var('xqol_last_bulk_release_count').GetValue|0]."
