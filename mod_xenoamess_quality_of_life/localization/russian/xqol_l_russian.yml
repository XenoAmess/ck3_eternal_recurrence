l_russian:
 xqol_quality_of_life:0 "XenoAmess: улучшение качества жизни"
 xqol_enable_auto_appointment_decision:0 "Включить автоматические назначения"
 xqol_enable_auto_appointment_decision_desc:0 "Не позволяет правителю становиться резервным наследником подчинённых бюрократических должностей. Действующий закон о наследовании через назначение выберет подходящего кандидата с наивысшим приоритетом претензий."
 xqol_enable_auto_appointment_decision_tooltip:0 "После смерти или отстранения бюрократические губернаторства перейдут подходящему кандидату с наивысшим приоритетом претензий."
 xqol_enable_auto_appointment_decision_confirm:0 "Пусть решают заслуги"
 xqol_disable_auto_appointment_decision:0 "Отключить автоматические назначения"
 xqol_disable_auto_appointment_decision_desc:0 "Восстанавливает исходный порядок оценки кандидатов на подчинённые бюрократические должности."
 xqol_disable_auto_appointment_decision_tooltip:0 "Восстанавливает исходный порядок назначений."
 xqol_disable_auto_appointment_decision_confirm:0 "Восстановить старый порядок"
 xqol_auto_appointment_enabled_tt:0 "Автоматическое наследование через назначение #P включено#!"
