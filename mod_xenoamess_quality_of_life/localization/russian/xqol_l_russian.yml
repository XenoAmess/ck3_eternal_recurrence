 xqol_disable_no_vassal_transfers_decision_tooltip:0 "Восстанавливает исходное поведение ИИ при передаче вассалов."
 xqol_disable_no_vassal_transfers_decision_confirm:0 "Снова их принимать"
 xqol_no_vassal_transfers_enabled_tt:0 "Передача вассалов игроку со стороны ИИ #P заблокирована#!"
