l_japanese:
 decision_group_type_xqol_quality_of_life:0 "XenoAmess 生活の質"
 xqol_enable_auto_appointment_decision:0 "自動任命を有効化"
 xqol_enable_auto_appointment_decision_desc:0 "君主本人が下位の行政官職の予備継承者になることを防ぐ。各官職は既存の任命継承法に基づき、候補者スコアが最も高い適格者を選出する。"
 xqol_enable_auto_appointment_decision_tooltip:0 "官僚制の属州総督位は、死亡または解任時に候補者スコアが最も高い適格者へ継承される。"
 xqol_enable_auto_appointment_decision_confirm:0 "才ある者を選ぶ"
 xqol_disable_auto_appointment_decision:0 "自動任命を無効化"
 xqol_disable_auto_appointment_decision_desc:0 "下位の行政官職の任命スコア計算を本来の方式に戻す。"
 xqol_disable_auto_appointment_decision_tooltip:0 "本来の任命継承の挙動を復元する。"
 xqol_disable_auto_appointment_decision_confirm:0 "旧秩序を復元"
 xqol_auto_appointment_enabled_tt:0 "自動任命継承は #P 有効#!"
 xqol_auto_appointment_disabled_tt:0 "自動任命継承は #N 無効#!"
 xqol_auto_appointment_score_penalty_desc:0 "自動継承：君主はこの任命を辞退する"
 xqol_enable_no_vassal_transfers_decision:0 "私に封臣を与えない"
 xqol_enable_no_vassal_transfers_decision_desc:0 "下位の官僚制の統治者に対し、配下の封臣をあなたに与えないよう指示する。ゲーム既存の AI 移譲保護を利用するため、あなたが自ら開始する移譲は妨げない。"
 xqol_enable_no_vassal_transfers_decision_tooltip:0 "官僚制の封臣は、自らの封臣をあなたに与えない。"
 xqol_enable_no_vassal_transfers_decision_confirm:0 "序列を乱さぬよう"
 xqol_disable_no_vassal_transfers_decision:0 "封臣の移譲を再び許可"
 xqol_disable_no_vassal_transfers_decision_desc:0 "この Mod の移譲保護を除去し、本来の AI 挙動を復元する。"
 xqol_disable_no_vassal_transfers_decision_tooltip:0 "本来の AI による封臣移譲の挙動を復元する。"
 xqol_disable_no_vassal_transfers_decision_confirm:0 "再び受け入れる"
 xqol_no_vassal_transfers_enabled_tt:0 "AI によるプレイヤーへの封臣移譲は #P 禁止#!"
 xqol_no_vassal_transfers_disabled_tt:0 "AI によるプレイヤーへの封臣移譲は #N 再開#!"
 xqol_enable_auto_call_defenders_decision:0 "防衛戦への自動参戦要請を有効化"
 xqol_enable_auto_call_defenders_decision_desc:0 "他の支配者から宣戦布告された際、金・威信・信仰点を消費せずにその防衛戦へ呼べるAI支配者全員へ、即座に参戦を要請する。"
 xqol_enable_auto_call_defenders_decision_tooltip:0 "現在無料で呼べるAI防衛者全員へ自動的に参戦を要請する。"
 xqol_enable_auto_call_defenders_decision_confirm:0 "すべての助力を求める"
 xqol_disable_auto_call_defenders_decision:0 "防衛戦への自動参戦要請を無効化"
 xqol_disable_auto_call_defenders_decision_desc:0 "新たな防衛戦で、同盟者、保証された宗主、参戦を要請できる朝貢国、対象となる摂政、無料で呼べる家系の一員への自動要請を停止する。"
 xqol_disable_auto_call_defenders_decision_tooltip:0 "防衛戦への参戦要請を手動操作に戻す。"
 xqol_disable_auto_call_defenders_decision_confirm:0 "自分で要請する"
 xqol_auto_call_defenders_enabled_tt:0 "無料の自動参戦要請は #P 有効#!"
 xqol_auto_call_defenders_disabled_tt:0 "無料の自動参戦要請は #N 無効#!"
 xqol_auto_call_defenders_result_title:0 "防衛者が応じた"
 xqol_auto_call_defenders_result_desc:0 "[GetPlayer.MakeScope.Var('xqol_last_auto_called_count').GetValue|0]人の無料で呼べるAI支配者が防衛戦に参加した。"
 xqol_mass_conversion_decision:0 "領内の改宗を一括要求"
 xqol_mass_conversion_decision_desc:0 "0から100の最低受諾値を選択する。領内の対象となるAI廷臣、封臣、下位支配者、朝貢国のうち、通常の改宗受諾値がこの基準以上の全員に改宗を要求する。"
 xqol_mass_conversion_decision_tooltip:0 "受諾値のスライダーを開き、条件を満たす全員に改宗要求を送る。"
 xqol_mass_conversion_decision_confirm:0 "基準値を設定"
 xqol_mass_conversion_event_title:0 "改宗受諾値の基準を設定"
 xqol_mass_conversion_event_desc:0 "通常の改宗受諾値がこの値以上の人物だけに要求を送る。実際の返答には引き続きゲーム本来の受諾判定が使われる。"
 xqol_mass_conversion_event_confirm:0 "条件を満たす全員に要求する"
 xqol_mass_conversion_event_cancel:0 "キャンセル"
 xqol_mass_conversion_threshold_label:0 "最低改宗受諾値"
 xqol_mass_conversion_threshold_help:0 "バーをドラッグまたはクリックする。0が最も広く、100では確実に受諾する人物だけが対象となる。"
 xqol_mass_conversion_results_title:0 "領内の改宗返答が完了"
 xqol_mass_conversion_results_desc:0 "同意：#P [GetPlayer.MakeScope.Var('xqol_mass_conversion_accepted').GetValue|0]#!   拒否：#N [GetPlayer.MakeScope.Var('xqol_mass_conversion_refused').GetValue|0]#!"
 xqol_bulk_demand_payment_full_decision:0 "フックによる全額支払いを一括要求"
 xqol_bulk_demand_payment_full_decision_desc:0 "フックを持つ有効なAI人物のうち、義務の全額を支払える全員に通常の「支払いの要求」を実行する。成功した要求ごとにフックを消費する。"
 xqol_bulk_demand_payment_full_decision_tooltip:0 "フックによる全額支払いだけを回収する。"
 xqol_bulk_demand_payment_full_decision_confirm:0 "全額をすべて回収"
 xqol_bulk_demand_payment_any_decision:0 "フックによる支払いを一括要求"
 xqol_bulk_demand_payment_any_decision_desc:0 "フックを持ち、金を1より多く所持する有効なAI人物全員に通常の「支払いの要求」を実行する。義務の全額を払えない人物は現在の整数分の金をすべて支払い、要求ごとにフックを消費する。"
 xqol_bulk_demand_payment_any_decision_tooltip:0 "フックを持ち、金を1より多く所持する有効なAI人物全員から回収する。"
 xqol_bulk_demand_payment_any_decision_confirm:0 "持っている分を受け取る"
 xqol_bulk_payment_results_title:0 "フックによる支払いの回収完了"
 xqol_bulk_payment_results_desc:0 "完了した要求：[GetPlayer.MakeScope.Var('xqol_last_bulk_payment_count').GetValue|0]件。"
 xqol_bulk_ransom_full_decision:0 "全額を支払える囚人から身代金を一括回収"
 xqol_bulk_ransom_full_decision_desc:0 "支払う意思のあるAIが適用価格の全額を支払える囚人全員に、通常の金による身代金を提示する。各取引後に支払い能力を再確認する。"
 xqol_bulk_ransom_full_decision_tooltip:0 "適用される全額の身代金を支払える囚人だけを解放する。"
 xqol_bulk_ransom_full_decision_confirm:0 "全額の身代金を受け取る"
 xqol_bulk_ransom_any_decision:0 "所持金で囚人の身代金を一括回収"
 xqol_bulk_ransom_any_decision_desc:0 "支払う意思のあるAIが少なくとも1の金を持つ囚人全員に、通常の身代金を提示する。全額を支払えない場合、現在所持する整数分の金をすべて受け取る。"
 xqol_bulk_ransom_any_decision_tooltip:0 "支払う意思があり、少なくとも1の金を持つAIから身代金を受け取る。"
 xqol_bulk_ransom_any_decision_confirm:0 "財布をすべて空にする"
 xqol_bulk_ransom_results_title:0 "囚人の身代金回収が完了"
 xqol_bulk_ransom_results_desc:0 "身代金で解放した囚人：[GetPlayer.MakeScope.Var('xqol_last_bulk_ransom_count').GetValue|0]人。"
 xqol_bulk_release_terms_decision:0 "条件付きで囚人を一括解放"
 xqol_bulk_release_terms_decision_desc:0 "同意するAI囚人ごとに、「フック獲得」「雇用」「改宗要求」から同時に成立する最大数の条件を付けて解放する。同数ならフック、雇用、改宗の順に優先する。"
 xqol_bulk_release_terms_decision_tooltip:0 "囚人ごとに受諾される最も強い条件の組み合わせを交渉する。"
 xqol_bulk_release_terms_decision_confirm:0 "最も強い条件を提示"
 xqol_bulk_release_results_title:0 "条件付き解放が完了"
 xqol_bulk_release_results_desc:0 "受諾された条件で解放した囚人：[GetPlayer.MakeScope.Var('xqol_last_bulk_release_count').GetValue|0]人。"
