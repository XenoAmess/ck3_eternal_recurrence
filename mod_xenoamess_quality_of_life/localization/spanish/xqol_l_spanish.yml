l_spanish:
 decision_group_type_xqol_quality_of_life:0 "Calidad de vida de XenoAmess"
 xqol_enable_auto_appointment_decision:0 "Activar nombramientos automáticos"
 xqol_enable_auto_appointment_decision_desc:0 "Impide que el soberano sea el heredero suplente de los cargos administrativos subordinados. La ley de sucesión por nombramiento vigente escogerá al candidato apto con mayor puntuación de candidatura."
 xqol_enable_auto_appointment_decision_tooltip:0 "Las gobernaciones administrativas pasarán al candidato apto con mayor puntuación de candidatura tras una muerte o destitución."
 xqol_enable_auto_appointment_decision_confirm:0 "Que el mérito decida"
 xqol_disable_auto_appointment_decision:0 "Desactivar nombramientos automáticos"
 xqol_disable_auto_appointment_decision_desc:0 "Restaura el cálculo original de la puntuación de candidatura para los cargos administrativos subordinados."
 xqol_disable_auto_appointment_decision_tooltip:0 "Restaura el comportamiento original de los nombramientos."
 xqol_disable_auto_appointment_decision_confirm:0 "Restablecer el orden anterior"
 xqol_auto_appointment_enabled_tt:0 "La sucesión automática de nombramiento está #P activada#!"
 xqol_auto_appointment_disabled_tt:0 "La sucesión automática de nombramiento está #N desactivada#!"
 xqol_auto_appointment_score_penalty_desc:0 "Sucesión automática: el soberano rechaza este nombramiento"
 xqol_enable_no_vassal_transfers_decision:0 "No me otorguéis vasallos"
 xqol_enable_no_vassal_transfers_decision_desc:0 "Ordena a los gobernantes administrativos subordinados que no te otorguen sus vasallos. Usa la protección de transferencias de la IA del juego y no impide las transferencias que tú inicies."
 xqol_enable_no_vassal_transfers_decision_tooltip:0 "Los vasallos administrativos no te otorgarán sus propios vasallos."
 xqol_enable_no_vassal_transfers_decision_confirm:0 "Mantén la jerarquía en orden"
 xqol_disable_no_vassal_transfers_decision:0 "Volver a permitir otorgar vasallos"
 xqol_disable_no_vassal_transfers_decision_desc:0 "Elimina la protección de transferencias de este mod y restaura el comportamiento original de la IA."
 xqol_disable_no_vassal_transfers_decision_tooltip:0 "Restaura el comportamiento original de la IA al otorgar vasallos."
 xqol_disable_no_vassal_transfers_decision_confirm:0 "Volver a recibirlos"
 xqol_no_vassal_transfers_enabled_tt:0 "Las transferencias de vasallos de la IA al jugador están #P bloqueadas#!"
 xqol_no_vassal_transfers_disabled_tt:0 "Las transferencias de vasallos de la IA al jugador están #N restauradas#!"
 xqol_enable_auto_call_defenders_decision:0 "Activar llamadas defensivas automáticas"
 xqol_enable_auto_call_defenders_decision_desc:0 "Cuando otro gobernante te declare la guerra, llama de inmediato a todos los gobernantes de IA que el juego permita incorporar a esa guerra defensiva sin gastar oro, prestigio ni piedad."
 xqol_enable_auto_call_defenders_decision_tooltip:0 "Llama automáticamente a todos los defensores de IA válidos sin coste."
 xqol_enable_auto_call_defenders_decision_confirm:0 "Llamar a todos los obligados"
 xqol_disable_auto_call_defenders_decision:0 "Desactivar llamadas defensivas automáticas"
 xqol_disable_auto_call_defenders_decision_desc:0 "Deja de llamar automáticamente a aliados, soberanos garantes, tributarios disponibles, diarcas aptos y miembros de la Casa que puedan incorporarse gratis a nuevas guerras defensivas."
 xqol_disable_auto_call_defenders_decision_tooltip:0 "Devuelve las llamadas defensivas al control manual."
 xqol_disable_auto_call_defenders_decision_confirm:0 "Los llamaré yo mismo"
 xqol_auto_call_defenders_enabled_tt:0 "Las llamadas defensivas automáticas sin coste están #P activadas#!"
 xqol_auto_call_defenders_disabled_tt:0 "Las llamadas defensivas automáticas sin coste están #N desactivadas#!"
 xqol_auto_call_defenders_result_title:0 "Los defensores respondieron"
 xqol_auto_call_defenders_result_desc:0 "[GetPlayer.MakeScope.Var('xqol_last_auto_called_count').GetValue|0] gobernantes de IA sin coste se unieron a tu guerra defensiva."
 xqol_mass_conversion_decision:0 "Exigir conversiones en masa en el señorío"
 xqol_mass_conversion_decision_desc:0 "Elige un valor mínimo de aceptación de 0 a 100. Todos los cortesanos, vasallos, gobernantes subordinados y tributarios de IA válidos dentro de tu señorío cuya aceptación normal de conversión alcance ese umbral recibirán una exigencia de conversión."
 xqol_mass_conversion_decision_tooltip:0 "Abre el control deslizante del umbral de aceptación y envía todas las exigencias de conversión válidas."
 xqol_mass_conversion_decision_confirm:0 "Fijar el umbral"
 xqol_mass_conversion_event_title:0 "Fijar el umbral de aceptación de conversión"
 xqol_mass_conversion_event_desc:0 "Solo se contactará a personajes cuya aceptación normal de conversión sea al menos este valor. Sus respuestas reales seguirán usando la prueba de aceptación habitual del juego."
 xqol_mass_conversion_event_confirm:0 "Enviar todas las exigencias válidas"
 xqol_mass_conversion_event_cancel:0 "Cancelar"
 xqol_mass_conversion_threshold_label:0 "Aceptación mínima de conversión"
 xqol_mass_conversion_threshold_help:0 "Arrastra la barra o haz clic en ella. 0 incluye el grupo más amplio; 100 solo contacta a quienes aceptarán con certeza."
 xqol_mass_conversion_results_title:0 "Respuestas de conversión del señorío completadas"
 xqol_mass_conversion_results_desc:0 "Aceptaron: #P [GetPlayer.MakeScope.Var('xqol_mass_conversion_accepted').GetValue|0]#!   Rechazaron: #N [GetPlayer.MakeScope.Var('xqol_mass_conversion_refused').GetValue|0]#!"
 xqol_bulk_demand_payment_full_decision:0 "Exigir todos los pagos íntegros por anzuelos"
 xqol_bulk_demand_payment_full_decision_desc:0 "Usa la interacción normal «Exigir pago» sobre cada personaje de IA válido contra el que tengas un anzuelo y que pueda pagar toda la obligación. Cada exigencia completada consume el anzuelo."
 xqol_bulk_demand_payment_full_decision_tooltip:0 "Cobra solo pagos íntegros obtenidos mediante anzuelos."
 xqol_bulk_demand_payment_full_decision_confirm:0 "Cobrar todas las deudas íntegras"
 xqol_bulk_demand_payment_any_decision:0 "Exigir todos los pagos disponibles por anzuelos"
 xqol_bulk_demand_payment_any_decision_desc:0 "Usa la interacción normal «Exigir pago» sobre cada personaje de IA válido contra el que tengas un anzuelo y que posea más de 1 de oro. Si no puede cubrir la obligación, entrega todo su oro entero actual; cada exigencia consume el anzuelo."
 xqol_bulk_demand_payment_any_decision_tooltip:0 "Cobra a todo personaje de IA válido contra el que tengas un anzuelo y que posea más de 1 de oro."
 xqol_bulk_demand_payment_any_decision_confirm:0 "Tomar lo que tengan"
 xqol_bulk_payment_results_title:0 "Pagos por anzuelos cobrados"
 xqol_bulk_payment_results_desc:0 "Exigencias completadas: [GetPlayer.MakeScope.Var('xqol_last_bulk_payment_count').GetValue|0]."
 xqol_bulk_ransom_full_decision:0 "Cobrar el rescate íntegro de todos los prisioneros posibles"
 xqol_bulk_ransom_full_decision_desc:0 "Ofrece el rescate normal en oro para cada prisionero cuyo pagador de IA dispuesto pueda costear el precio aplicable completo. Los fondos se vuelven a comprobar tras cada rescate."
 xqol_bulk_ransom_full_decision_tooltip:0 "Rescata prisioneros solo por su precio completo aplicable en oro."
 xqol_bulk_ransom_full_decision_confirm:0 "Cobrar todos los rescates íntegros"
 xqol_bulk_ransom_any_decision:0 "Rescatar a todos los prisioneros por el oro disponible"
 xqol_bulk_ransom_any_decision_desc:0 "Ofrece el rescate normal a cada prisionero cuyo pagador de IA dispuesto tenga al menos 1 de oro. Si no puede cubrir el precio completo, el juego toma todo su oro entero actual."
 xqol_bulk_ransom_any_decision_tooltip:0 "Rescata prisioneros de pagadores de IA dispuestos con al menos 1 de oro."
 xqol_bulk_ransom_any_decision_confirm:0 "Vaciar todas las bolsas"
 xqol_bulk_ransom_results_title:0 "Rescates de prisioneros completados"
 xqol_bulk_ransom_results_desc:0 "Prisioneros rescatados: [GetPlayer.MakeScope.Var('xqol_last_bulk_ransom_count').GetValue|0]."
 xqol_bulk_release_terms_decision:0 "Liberar con condiciones a todos los prisioneros dispuestos"
 xqol_bulk_release_terms_decision_desc:0 "Libera a cada prisionero de IA dispuesto con el mayor conjunto compatible entre «Recibir un anzuelo», «Reclutar» y «Exigir conversión». En caso de empate, se priorizan el anzuelo, el reclutamiento y la conversión, en ese orden."
 xqol_bulk_release_terms_decision_tooltip:0 "Negocia la combinación aceptada más fuerte para cada prisionero."
 xqol_bulk_release_terms_decision_confirm:0 "Ofrecer las mejores condiciones"
 xqol_bulk_release_results_title:0 "Liberaciones condicionales completadas"
 xqol_bulk_release_results_desc:0 "Prisioneros liberados según las condiciones aceptadas: [GetPlayer.MakeScope.Var('xqol_last_bulk_release_count').GetValue|0]."
