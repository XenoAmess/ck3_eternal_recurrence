l_german:
 decision_group_type_xqol_quality_of_life:0 "XenoAmess – Lebensqualität"
 xqol_enable_auto_appointment_decision:0 "Automatische Ernennungen aktivieren"
 xqol_enable_auto_appointment_decision_desc:0 "Verhindert, dass der Herrscher selbst zum Ersatznachfolger untergeordneter Verwaltungsämter wird. Stattdessen wählt das bestehende Ernennungsnachfolgerecht den geeigneten Kandidaten mit dem höchsten Kandidatenwert aus."
 xqol_enable_auto_appointment_decision_tooltip:0 "Statthaltertümer einer Verwaltungsregierung gehen bei Tod oder Absetzung an den geeigneten Kandidaten mit dem höchsten Kandidatenwert über."
 xqol_enable_auto_appointment_decision_confirm:0 "Der Verdienst soll entscheiden"
 xqol_disable_auto_appointment_decision:0 "Automatische Ernennungen deaktivieren"
 xqol_disable_auto_appointment_decision_desc:0 "Stellt die ursprüngliche Berechnung des Kandidatenwerts für untergeordnete Verwaltungsämter wieder her."
 xqol_disable_auto_appointment_decision_tooltip:0 "Ursprüngliches Ernennungsverhalten wiederherstellen."
 xqol_disable_auto_appointment_decision_confirm:0 "Alte Ordnung wiederherstellen"
 xqol_auto_appointment_enabled_tt:0 "Automatische Ernennungsnachfolge ist #P aktiviert#!"
 xqol_auto_appointment_disabled_tt:0 "Automatische Ernennungsnachfolge ist #N deaktiviert#!"
 xqol_auto_appointment_score_penalty_desc:0 "Automatische Nachfolge: Der Herrscher lehnt diese Ernennung ab"
 xqol_enable_no_vassal_transfers_decision:0 "Gebt mir keine Vasallen"
 xqol_enable_no_vassal_transfers_decision_desc:0 "Weist untergeordnete Verwaltungsherrscher an, ihre Vasallen nicht an Euch weiterzugeben. Dies nutzt den KI-Transferschutz des Spiels und verhindert keine von Euch selbst veranlassten Übertragungen."
 xqol_enable_no_vassal_transfers_decision_tooltip:0 "Verwaltungsvasallen werden Euch ihre Vasallen nicht übertragen."
 xqol_enable_no_vassal_transfers_decision_confirm:0 "Die Hierarchie geordnet halten"
 xqol_disable_no_vassal_transfers_decision:0 "Vasallenübertragungen wieder erlauben"
 xqol_disable_no_vassal_transfers_decision_desc:0 "Entfernt den Transferschutz dieses Mods und stellt das ursprüngliche KI-Verhalten wieder her."
 xqol_disable_no_vassal_transfers_decision_tooltip:0 "Ursprüngliche KI-Vasallenübertragungen wiederherstellen."
 xqol_disable_no_vassal_transfers_decision_confirm:0 "Wieder annehmen"
 xqol_no_vassal_transfers_enabled_tt:0 "KI-Vasallenübertragungen an Euch sind #P blockiert#!"
 xqol_no_vassal_transfers_disabled_tt:0 "KI-Vasallenübertragungen an Euch sind #N wiederhergestellt#!"
 xqol_enable_auto_call_defenders_decision:0 "Enable Automatic Defensive Calls"
 xqol_enable_auto_call_defenders_decision_desc:0 "When another ruler declares war on you, immediately call every AI ruler whom the game currently allows you to call into that defensive war without paying Gold, Prestige, or Piety."
 xqol_enable_auto_call_defenders_decision_tooltip:0 "Automatically call all currently eligible cost-free AI defenders."
 xqol_enable_auto_call_defenders_decision_confirm:0 "Call every debt"
 xqol_disable_auto_call_defenders_decision:0 "Disable Automatic Defensive Calls"
 xqol_disable_auto_call_defenders_decision_desc:0 "Stop automatically calling allies, guaranteed suzerains, callable tributaries, eligible diarchs, and free House members into new defensive wars."
 xqol_disable_auto_call_defenders_decision_tooltip:0 "Return defensive calls to manual control."
 xqol_disable_auto_call_defenders_decision_confirm:0 "I will call them myself"
 xqol_auto_call_defenders_enabled_tt:0 "Automatic cost-free defensive calls are #P enabled#!"
 xqol_auto_call_defenders_disabled_tt:0 "Automatic cost-free defensive calls are #N disabled#!"
 xqol_auto_call_defenders_result_title:0 "Defenders Answered"
 xqol_auto_call_defenders_result_desc:0 "[GetPlayer.MakeScope.Var('xqol_last_auto_called_count').GetValue|0] cost-free AI rulers joined your defensive war."
 xqol_mass_conversion_decision:0 "Demand Realm Conversions in Bulk"
 xqol_mass_conversion_decision_desc:0 "Choose a minimum acceptance value from 0 to 100. Every eligible AI courtier, vassal, subordinate ruler, and tributary in your realm whose vanilla conversion acceptance meets that threshold will receive a conversion demand."
 xqol_mass_conversion_decision_tooltip:0 "Open the acceptance-threshold slider, then send every eligible conversion demand."
 xqol_mass_conversion_decision_confirm:0 "Set the threshold"
 xqol_mass_conversion_event_title:0 "Set Conversion Acceptance Threshold"
 xqol_mass_conversion_event_desc:0 "Only characters whose vanilla conversion acceptance is at least this value will be contacted. Their actual responses still use the game's normal acceptance roll."
 xqol_mass_conversion_event_confirm:0 "Send every qualifying demand"
 xqol_mass_conversion_event_cancel:0 "Cancel"
 xqol_mass_conversion_threshold_label:0 "Minimum conversion acceptance"
 xqol_mass_conversion_threshold_help:0 "Drag or click the bar. 0 is broadest; 100 contacts only certain acceptances."
 xqol_mass_conversion_results_title:0 "Realm Conversion Replies Complete"
 xqol_mass_conversion_results_desc:0 "Agreed: #P [GetPlayer.MakeScope.Var('xqol_mass_conversion_accepted').GetValue|0]#!   Refused: #N [GetPlayer.MakeScope.Var('xqol_mass_conversion_refused').GetValue|0]#!"
 xqol_bulk_demand_payment_full_decision:0 "Demand All Full Hook Payments"
 xqol_bulk_demand_payment_full_decision_desc:0 "Use the vanilla Demand Payment interaction on every valid hooked AI character who can currently pay the entire obligation. Each successful demand consumes its hook."
 xqol_bulk_demand_payment_full_decision_tooltip:0 "Collect only full hook payments."
 xqol_bulk_demand_payment_full_decision_confirm:0 "Collect every full debt"
 xqol_bulk_demand_payment_any_decision:0 "Demand All Available Hook Payments"
 xqol_bulk_demand_payment_any_decision_desc:0 "Use the vanilla Demand Payment interaction on every valid hooked AI character with more than 1 Gold. A target who cannot cover the obligation pays all current whole Gold; each demand consumes its hook."
 xqol_bulk_demand_payment_any_decision_tooltip:0 "Collect from every valid hooked AI character with more than 1 Gold."
 xqol_bulk_demand_payment_any_decision_confirm:0 "Take what they have"
 xqol_bulk_payment_results_title:0 "Hook Payments Collected"
 xqol_bulk_payment_results_desc:0 "Completed demands: [GetPlayer.MakeScope.Var('xqol_last_bulk_payment_count').GetValue|0]."
 xqol_bulk_ransom_full_decision:0 "Ransom All Fully Affordable Prisoners"
 xqol_bulk_ransom_full_decision_desc:0 "Offer the vanilla gold ransom for every prisoner whose willing AI payer can currently afford the full applicable cost. Funds are checked again after every ransom."
 xqol_bulk_ransom_full_decision_tooltip:0 "Ransom prisoners only for their full applicable gold price."
 xqol_bulk_ransom_full_decision_confirm:0 "Take every full ransom"
 xqol_bulk_ransom_any_decision:0 "Ransom All Prisoners for Available Gold"
 xqol_bulk_ransom_any_decision_desc:0 "Offer the vanilla gold ransom for every prisoner whose willing AI payer has at least 1 Gold. If the payer cannot cover the full price, the game takes all current whole Gold."
 xqol_bulk_ransom_any_decision_tooltip:0 "Ransom prisoners from willing AI payers with at least 1 Gold."
 xqol_bulk_ransom_any_decision_confirm:0 "Empty every purse"
 xqol_bulk_ransom_results_title:0 "Prisoner Ransoms Complete"
 xqol_bulk_ransom_results_desc:0 "Prisoners ransomed: [GetPlayer.MakeScope.Var('xqol_last_bulk_ransom_count').GetValue|0]."
 xqol_bulk_release_terms_decision:0 "Release All Willing Prisoners on Terms"
 xqol_bulk_release_terms_decision_desc:0 "Release each willing AI prisoner under the largest compatible subset of Gain Hook, Recruit, and Demand Conversion. Equal-sized choices prioritize Gain Hook, then Recruit, then Conversion."
 xqol_bulk_release_terms_decision_tooltip:0 "Negotiate the strongest accepted combination for every prisoner."
 xqol_bulk_release_terms_decision_confirm:0 "Offer the strongest terms"
 xqol_bulk_release_results_title:0 "Conditional Releases Complete"
 xqol_bulk_release_results_desc:0 "Prisoners released on accepted terms: [GetPlayer.MakeScope.Var('xqol_last_bulk_release_count').GetValue|0]."
