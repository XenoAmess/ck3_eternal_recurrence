l_german:
 decision_group_type_xqol_quality_of_life:0 "XenoAmess – Lebensqualität"
 xqol_enable_auto_appointment_decision:0 "Automatische Ernennungen aktivieren"
 xqol_enable_auto_appointment_decision_desc:0 "Verhindert, dass der Herrscher selbst zum Ersatznachfolger untergeordneter Verwaltungsämter wird. Stattdessen wählt das bestehende Ernennungsnachfolgerecht den geeigneten Kandidaten mit dem höchsten Kandidatenwert aus."
 xqol_enable_auto_appointment_decision_tooltip:0 "Statthaltertümer einer Verwaltungsregierung gehen bei Tod oder Absetzung an den geeigneten Kandidaten mit dem höchsten Kandidatenwert über."
 xqol_enable_auto_appointment_decision_confirm:0 "Der Verdienst soll entscheiden"
 xqol_disable_auto_appointment_decision:0 "Automatische Ernennungen deaktivieren"
 xqol_disable_auto_appointment_decision_desc:0 "Stellt die ursprüngliche Berechnung des Kandidatenwerts für untergeordnete Verwaltungsämter wieder her."
 xqol_disable_auto_appointment_decision_tooltip:0 "Ursprüngliches Ernennungsverhalten wiederherstellen."
 xqol_disable_auto_appointment_decision_confirm:0 "Alte Ordnung wiederherstellen"
 xqol_auto_appointment_enabled_tt:0 "Automatische Ernennungsnachfolge ist #P aktiviert#!"
 xqol_auto_appointment_disabled_tt:0 "Automatische Ernennungsnachfolge ist #N deaktiviert#!"
 xqol_auto_appointment_score_penalty_desc:0 "Automatische Nachfolge: Der Herrscher lehnt diese Ernennung ab"
 xqol_enable_no_vassal_transfers_decision:0 "Gebt mir keine Vasallen"
 xqol_enable_no_vassal_transfers_decision_desc:0 "Weist untergeordnete Verwaltungsherrscher an, ihre Vasallen nicht an Euch weiterzugeben. Dies nutzt den KI-Transferschutz des Spiels und verhindert keine von Euch selbst veranlassten Übertragungen."
 xqol_enable_no_vassal_transfers_decision_tooltip:0 "Verwaltungsvasallen werden Euch ihre Vasallen nicht übertragen."
 xqol_enable_no_vassal_transfers_decision_confirm:0 "Die Hierarchie geordnet halten"
 xqol_disable_no_vassal_transfers_decision:0 "Vasallenübertragungen wieder erlauben"
 xqol_disable_no_vassal_transfers_decision_desc:0 "Entfernt den Transferschutz dieses Mods und stellt das ursprüngliche KI-Verhalten wieder her."
 xqol_disable_no_vassal_transfers_decision_tooltip:0 "Ursprüngliche KI-Vasallenübertragungen wiederherstellen."
 xqol_disable_no_vassal_transfers_decision_confirm:0 "Wieder annehmen"
 xqol_no_vassal_transfers_enabled_tt:0 "KI-Vasallenübertragungen an Euch sind #P blockiert#!"
 xqol_no_vassal_transfers_disabled_tt:0 "KI-Vasallenübertragungen an Euch sind #N wiederhergestellt#!"
 xqol_enable_auto_call_defenders_decision:0 "Automatische Verteidigungsrufe aktivieren"
 xqol_enable_auto_call_defenders_decision_desc:0 "Wenn ein anderer Herrscher Euch den Krieg erklärt, ruft sofort jeden KI-Herrscher, den das Spiel derzeit ohne Gold-, Prestige- oder Frömmigkeitskosten in diesen Verteidigungskrieg rufen lässt."
 xqol_enable_auto_call_defenders_decision_tooltip:0 "Alle derzeit verfügbaren kostenlosen KI-Verteidiger automatisch rufen."
 xqol_enable_auto_call_defenders_decision_confirm:0 "Alle Verpflichtungen einfordern"
 xqol_disable_auto_call_defenders_decision:0 "Automatische Verteidigungsrufe deaktivieren"
 xqol_disable_auto_call_defenders_decision_desc:0 "Beendet automatische Rufe von Verbündeten, garantierten Suzeränen, rufbaren Tributzahlern, geeigneten Diarchen und kostenlos rufbaren Hausmitgliedern in neue Verteidigungskriege."
 xqol_disable_auto_call_defenders_decision_tooltip:0 "Verteidigungsrufe wieder manuell steuern."
 xqol_disable_auto_call_defenders_decision_confirm:0 "Ich rufe sie selbst"
 xqol_auto_call_defenders_enabled_tt:0 "Automatische kostenlose Verteidigungsrufe sind #P aktiviert#!"
 xqol_auto_call_defenders_disabled_tt:0 "Automatische kostenlose Verteidigungsrufe sind #N deaktiviert#!"
 xqol_auto_call_defenders_result_title:0 "Verteidiger sind gefolgt"
 xqol_auto_call_defenders_result_desc:0 "[GetPlayer.MakeScope.Var('xqol_last_auto_called_count').GetValue|0] kostenlose KI-Herrscher sind Eurem Verteidigungskrieg beigetreten."
 xqol_mass_conversion_decision:0 "Bekehrungen im Reich gesammelt verlangen"
 xqol_mass_conversion_decision_desc:0 "Wählt einen Mindestakzeptanzwert von 0 bis 100. Jeder geeignete KI-Höfling, Vasall, untergeordnete Herrscher und Tributzahler in Eurem Reich, dessen reguläre Bekehrungsakzeptanz den Schwellenwert erreicht, erhält eine Bekehrungsforderung."
 xqol_mass_conversion_decision_tooltip:0 "Den Akzeptanzregler öffnen und alle geeigneten Bekehrungsforderungen senden."
 xqol_mass_conversion_decision_confirm:0 "Schwellenwert festlegen"
 xqol_mass_conversion_event_title:0 "Akzeptanzschwelle für Bekehrungen festlegen"
 xqol_mass_conversion_event_desc:0 "Nur Charaktere, deren reguläre Bekehrungsakzeptanz mindestens diesem Wert entspricht, werden kontaktiert. Ihre tatsächlichen Antworten verwenden weiterhin die normale Akzeptanzprobe des Spiels."
 xqol_mass_conversion_event_confirm:0 "Alle geeigneten Forderungen senden"
 xqol_mass_conversion_event_cancel:0 "Abbrechen"
 xqol_mass_conversion_threshold_label:0 "Mindestakzeptanz für Bekehrung"
 xqol_mass_conversion_threshold_help:0 "Zieht oder klickt auf die Leiste. 0 ist am breitesten; 100 kontaktiert nur sichere Zusagen."
 xqol_mass_conversion_results_title:0 "Bekehrungsantworten im Reich abgeschlossen"
 xqol_mass_conversion_results_desc:0 "Zugesagt: #P [GetPlayer.MakeScope.Var('xqol_mass_conversion_accepted').GetValue|0]#!   Abgelehnt: #N [GetPlayer.MakeScope.Var('xqol_mass_conversion_refused').GetValue|0]#!"
 xqol_bulk_demand_payment_full_decision:0 "Alle vollständigen Druckmittelzahlungen fordern"
 xqol_bulk_demand_payment_full_decision_desc:0 "Nutzt die ursprüngliche Zahlungsforderung bei jedem gültigen KI-Charakter, gegen den Ihr ein Druckmittel besitzt und der die gesamte Verpflichtung bezahlen kann. Jede erfolgreiche Forderung verbraucht das Druckmittel."
 xqol_bulk_demand_payment_full_decision_tooltip:0 "Nur vollständige Druckmittelzahlungen eintreiben."
 xqol_bulk_demand_payment_full_decision_confirm:0 "Alle vollen Schulden eintreiben"
 xqol_bulk_demand_payment_any_decision:0 "Alle verfügbaren Druckmittelzahlungen fordern"
 xqol_bulk_demand_payment_any_decision_desc:0 "Nutzt die ursprüngliche Zahlungsforderung bei jedem gültigen KI-Charakter, gegen den Ihr ein Druckmittel besitzt und der mehr als 1 Gold hat. Wer die Verpflichtung nicht vollständig decken kann, zahlt sein gesamtes aktuelles Gold; jede Forderung verbraucht das Druckmittel."
 xqol_bulk_demand_payment_any_decision_tooltip:0 "Von jedem gültigen KI-Charakter mit Druckmittel und mehr als 1 Gold eintreiben."
 xqol_bulk_demand_payment_any_decision_confirm:0 "Nehmen, was sie haben"
 xqol_bulk_payment_results_title:0 "Druckmittelzahlungen eingezogen"
 xqol_bulk_payment_results_desc:0 "Abgeschlossene Forderungen: [GetPlayer.MakeScope.Var('xqol_last_bulk_payment_count').GetValue|0]."
 xqol_bulk_ransom_full_decision:0 "Alle vollständig bezahlbaren Gefangenen auslösen"
 xqol_bulk_ransom_full_decision_desc:0 "Fordert das ursprüngliche Lösegeld in Gold für jeden Gefangenen, dessen zahlungswilliger KI-Zahler den gesamten geltenden Preis aufbringen kann. Nach jedem Lösegeld werden die Mittel erneut geprüft."
 xqol_bulk_ransom_full_decision_tooltip:0 "Gefangene nur zum vollständigen geltenden Goldpreis auslösen."
 xqol_bulk_ransom_full_decision_confirm:0 "Alle vollen Lösegelder nehmen"
 xqol_bulk_ransom_any_decision:0 "Alle Gefangenen für verfügbares Gold auslösen"
 xqol_bulk_ransom_any_decision_desc:0 "Fordert das ursprüngliche Lösegeld für jeden Gefangenen, dessen zahlungswilliger KI-Zahler mindestens 1 Gold besitzt. Kann der Zahler den vollen Preis nicht decken, nimmt das Spiel sein gesamtes aktuelles Gold."
 xqol_bulk_ransom_any_decision_tooltip:0 "Gefangene bei zahlungswilligen KI-Zahlern mit mindestens 1 Gold auslösen."
 xqol_bulk_ransom_any_decision_confirm:0 "Alle Geldbeutel leeren"
 xqol_bulk_ransom_results_title:0 "Gefangenenlösegelder abgeschlossen"
 xqol_bulk_ransom_results_desc:0 "Ausgelöste Gefangene: [GetPlayer.MakeScope.Var('xqol_last_bulk_ransom_count').GetValue|0]."
 xqol_bulk_release_terms_decision:0 "Alle willigen Gefangenen unter Bedingungen freilassen"
 xqol_bulk_release_terms_decision_desc:0 "Lasst jeden willigen KI-Gefangenen mit der größten kompatiblen Teilmenge aus Druckmittel erhalten, Rekrutieren und Bekehrung verlangen frei. Bei gleicher Anzahl gilt die Reihenfolge Druckmittel, Rekrutierung, Bekehrung."
 xqol_bulk_release_terms_decision_tooltip:0 "Für jeden Gefangenen die stärkste akzeptierte Kombination aushandeln."
 xqol_bulk_release_terms_decision_confirm:0 "Die stärksten Bedingungen anbieten"
 xqol_bulk_release_results_title:0 "Bedingte Freilassungen abgeschlossen"
 xqol_bulk_release_results_desc:0 "Unter akzeptierten Bedingungen freigelassene Gefangene: [GetPlayer.MakeScope.Var('xqol_last_bulk_release_count').GetValue|0]."
