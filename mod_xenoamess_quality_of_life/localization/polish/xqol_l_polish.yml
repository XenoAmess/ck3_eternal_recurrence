l_polish:
 decision_group_type_xqol_quality_of_life:0 "XenoAmess — ulepszenia jakości życia"
 xqol_enable_auto_appointment_decision:0 "Włącz automatyczne mianowania"
 xqol_enable_auto_appointment_decision_desc:0 "Nie pozwala, by władca został zastępczym dziedzicem podległych urzędów administracyjnych. Obowiązujące prawo sukcesyjne mianowania wybierze zamiast niego uprawnioną osobę o najwyższym wyniku kandydata."
 xqol_enable_auto_appointment_decision_tooltip:0 "Gubernatorstwa administracyjne przejdą po śmierci lub odwołaniu na uprawnioną osobę o najwyższym wyniku kandydata."
 xqol_enable_auto_appointment_decision_confirm:0 "Niech zdecydują zasługi"
 xqol_disable_auto_appointment_decision:0 "Wyłącz automatyczne mianowania"
 xqol_disable_auto_appointment_decision_desc:0 "Przywraca pierwotne zasady obliczania wyniku kandydata dla podległych urzędów administracyjnych."
 xqol_disable_auto_appointment_decision_tooltip:0 "Przywraca pierwotne działanie sukcesji mianowania."
 xqol_disable_auto_appointment_decision_confirm:0 "Przywróć stary porządek"
 xqol_auto_appointment_enabled_tt:0 "Automatyczna sukcesja mianowania jest #P włączona#!"
 xqol_auto_appointment_disabled_tt:0 "Automatyczna sukcesja mianowania jest #N wyłączona#!"
 xqol_auto_appointment_score_penalty_desc:0 "Automatyczna sukcesja: władca odmawia przyjęcia tego mianowania"
 xqol_enable_no_vassal_transfers_decision:0 "Nie przekazuj mi wasali"
 xqol_enable_no_vassal_transfers_decision_desc:0 "Nakazuje podległym władcom administracyjnym nie przekazywać ci swoich wasali. Wykorzystuje wbudowane w grę zabezpieczenie przed przekazywaniem wasali przez SI i nie uniemożliwia ci samodzielnego przekazywania wasali."
 xqol_enable_no_vassal_transfers_decision_tooltip:0 "Wasale administracyjni nie będą przekazywać ci swoich wasali."
 xqol_enable_no_vassal_transfers_decision_confirm:0 "Zachowaj porządek hierarchii"
 xqol_disable_no_vassal_transfers_decision:0 "Znów zezwól na przekazywanie wasali"
 xqol_disable_no_vassal_transfers_decision_desc:0 "Usuwa wprowadzoną przez ten mod blokadę przekazywania wasali i przywraca pierwotne zachowanie SI."
 xqol_disable_no_vassal_transfers_decision_tooltip:0 "Przywraca pierwotne zachowanie SI przy przekazywaniu wasali."
 xqol_disable_no_vassal_transfers_decision_confirm:0 "Przyjmuj ich ponownie"
 xqol_no_vassal_transfers_enabled_tt:0 "Przekazywanie wasali graczowi przez SI zostało #P zablokowane#!"
 xqol_no_vassal_transfers_disabled_tt:0 "Przekazywanie wasali graczowi przez SI zostało #N przywrócone#!"
 xqol_enable_auto_call_defenders_decision:0 "Włącz automatyczne wezwania obronne"
 xqol_enable_auto_call_defenders_decision_desc:0 "Gdy inny władca wypowie ci wojnę, natychmiast wezwij wszystkich władców AI, których gra pozwala obecnie powołać do tej wojny obronnej bez wydawania złota, prestiżu ani pobożności."
 xqol_enable_auto_call_defenders_decision_tooltip:0 "Automatycznie wezwij wszystkich obecnie dostępnych, bezpłatnych obrońców AI."
 xqol_enable_auto_call_defenders_decision_confirm:0 "Wezwij wszystkich zobowiązanych"
 xqol_disable_auto_call_defenders_decision:0 "Wyłącz automatyczne wezwania obronne"
 xqol_disable_auto_call_defenders_decision_desc:0 "Przestań automatycznie wzywać sojuszników, gwarantowanych suzerenów, dostępnych trybutariuszy, odpowiednich diarchów i bezpłatnych członków rodu do nowych wojen obronnych."
 xqol_disable_auto_call_defenders_decision_tooltip:0 "Przywróć ręczne sterowanie wezwaniami obronnymi."
 xqol_disable_auto_call_defenders_decision_confirm:0 "Sam ich wezwę"
 xqol_auto_call_defenders_enabled_tt:0 "Automatyczne bezpłatne wezwania obronne są #P włączone#!"
 xqol_auto_call_defenders_disabled_tt:0 "Automatyczne bezpłatne wezwania obronne są #N wyłączone#!"
 xqol_auto_call_defenders_result_title:0 "Obrońcy odpowiedzieli"
 xqol_auto_call_defenders_result_desc:0 "[GetPlayer.MakeScope.Var('xqol_last_auto_called_count').GetValue|0] bezpłatnie wezwanych władców AI dołączyło do twojej wojny obronnej."
 xqol_mass_conversion_decision:0 "Masowo żądaj nawrócenia w domenie"
 xqol_mass_conversion_decision_desc:0 "Wybierz minimalną wartość akceptacji od 0 do 100. Każdy odpowiedni dworzanin, wasal, podległy władca i trybutariusz AI w twojej domenie, którego zwykła akceptacja nawrócenia osiąga ten próg, otrzyma żądanie nawrócenia."
 xqol_mass_conversion_decision_tooltip:0 "Otwórz suwak progu akceptacji, a następnie wyślij wszystkie odpowiednie żądania nawrócenia."
 xqol_mass_conversion_decision_confirm:0 "Ustal próg"
 xqol_mass_conversion_event_title:0 "Ustal próg akceptacji nawrócenia"
 xqol_mass_conversion_event_desc:0 "Kontaktowane będą tylko postacie, których zwykła akceptacja nawrócenia wynosi co najmniej tyle. Ich rzeczywiste odpowiedzi nadal podlegają normalnemu testowi akceptacji w grze."
 xqol_mass_conversion_event_confirm:0 "Wyślij wszystkie odpowiednie żądania"
 xqol_mass_conversion_event_cancel:0 "Anuluj"
 xqol_mass_conversion_threshold_label:0 "Minimalna akceptacja nawrócenia"
 xqol_mass_conversion_threshold_help:0 "Przeciągnij lub kliknij pasek. 0 obejmuje najszerszą grupę, a 100 tylko osoby, które na pewno zaakceptują."
 xqol_mass_conversion_results_title:0 "Odpowiedzi na nawrócenie domeny zakończone"
 xqol_mass_conversion_results_desc:0 "Zgody: #P [GetPlayer.MakeScope.Var('xqol_mass_conversion_accepted').GetValue|0]#!   Odmowy: #N [GetPlayer.MakeScope.Var('xqol_mass_conversion_refused').GetValue|0]#!"
 xqol_bulk_demand_payment_full_decision:0 "Zażądaj wszystkich pełnych opłat za haki"
 xqol_bulk_demand_payment_full_decision_desc:0 "Użyj zwykłej interakcji „Zażądaj opłaty” wobec każdej prawidłowej postaci AI, na którą masz hak i która może zapłacić całe zobowiązanie. Każde udane żądanie zużywa hak."
 xqol_bulk_demand_payment_full_decision_tooltip:0 "Pobieraj tylko pełne opłaty za haki."
 xqol_bulk_demand_payment_full_decision_confirm:0 "Pobierz wszystkie pełne długi"
 xqol_bulk_demand_payment_any_decision:0 "Zażądaj wszystkich dostępnych opłat za haki"
 xqol_bulk_demand_payment_any_decision_desc:0 "Użyj zwykłej interakcji „Zażądaj opłaty” wobec każdej prawidłowej postaci AI, na którą masz hak i która posiada więcej niż 1 sztukę złota. Cel, który nie może pokryć zobowiązania, oddaje całe obecne złoto; każde żądanie zużywa hak."
 xqol_bulk_demand_payment_any_decision_tooltip:0 "Pobieraj opłaty od każdej prawidłowej postaci AI, na którą masz hak i która posiada więcej niż 1 sztukę złota."
 xqol_bulk_demand_payment_any_decision_confirm:0 "Weź, ile mają"
 xqol_bulk_payment_results_title:0 "Opłaty za haki pobrane"
 xqol_bulk_payment_results_desc:0 "Zrealizowane żądania: [GetPlayer.MakeScope.Var('xqol_last_bulk_payment_count').GetValue|0]."
 xqol_bulk_ransom_full_decision:0 "Zażądaj pełnego okupu za wszystkich dostępnych więźniów"
 xqol_bulk_ransom_full_decision_desc:0 "Złóż zwykłą ofertę okupu za każdego więźnia, którego chętny płatnik AI może obecnie opłacić w pełnej należnej kwocie. Środki są sprawdzane ponownie po każdym okupie."
 xqol_bulk_ransom_full_decision_tooltip:0 "Uwalniaj więźniów tylko za pełną należną cenę w złocie."
 xqol_bulk_ransom_full_decision_confirm:0 "Pobierz wszystkie pełne okupy"
 xqol_bulk_ransom_any_decision:0 "Zażądaj okupu za wszystkich więźniów z dostępnym złotem"
 xqol_bulk_ransom_any_decision_desc:0 "Złóż zwykłą ofertę okupu za każdego więźnia, którego chętny płatnik AI ma co najmniej 1 sztukę złota. Jeśli nie może pokryć pełnej ceny, gra pobiera całe jego obecne złoto."
 xqol_bulk_ransom_any_decision_tooltip:0 "Uwalniaj więźniów za okup od chętnych płatników AI z co najmniej 1 sztuką złota."
 xqol_bulk_ransom_any_decision_confirm:0 "Opróżnij wszystkie sakiewki"
 xqol_bulk_ransom_results_title:0 "Okupy za więźniów zakończone"
 xqol_bulk_ransom_results_desc:0 "Więźniowie uwolnieni za okup: [GetPlayer.MakeScope.Var('xqol_last_bulk_ransom_count').GetValue|0]."
 xqol_bulk_release_terms_decision:0 "Zwolnij wszystkich chętnych więźniów na warunkach"
 xqol_bulk_release_terms_decision_desc:0 "Zwolnij każdego chętnego więźnia AI z największym zgodnym zestawem warunków: „Zyskaj hak”, „Zrekrutuj” i „Żądaj nawrócenia”. Przy równej liczbie priorytet mają kolejno hak, rekrutacja i nawrócenie."
 xqol_bulk_release_terms_decision_tooltip:0 "Wybierz najsilniejszą akceptowaną kombinację dla każdego więźnia."
 xqol_bulk_release_terms_decision_confirm:0 "Zaproponuj najsilniejsze warunki"
 xqol_bulk_release_results_title:0 "Zwolnienia warunkowe zakończone"
 xqol_bulk_release_results_desc:0 "Więźniowie zwolnieni na zaakceptowanych warunkach: [GetPlayer.MakeScope.Var('xqol_last_bulk_release_count').GetValue|0]."
