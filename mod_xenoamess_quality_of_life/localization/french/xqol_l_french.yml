l_french:
 xqol_quality_of_life:0 "Qualité de vie de XenoAmess"
 xqol_enable_auto_appointment_decision:0 "Activer les nominations automatiques"
 xqol_enable_auto_appointment_decision_desc:0 "Empêcher le souverain de devenir l'héritier par défaut des charges administratives subordonnées. La loi de succession par nomination existante choisira à sa place le candidat éligible ayant le score de candidature le plus élevé."
 xqol_enable_auto_appointment_decision_tooltip:0 "Les gouvernorats administratifs reviendront au candidat éligible ayant le score de candidature le plus élevé en cas de décès ou de destitution."
 xqol_enable_auto_appointment_decision_confirm:0 "Laisser le mérite décider"
 xqol_disable_auto_appointment_decision:0 "Désactiver les nominations automatiques"
 xqol_disable_auto_appointment_decision_desc:0 "Rétablir le calcul d'origine du score de candidature pour les charges administratives subordonnées."
 xqol_disable_auto_appointment_decision_tooltip:0 "Rétablir le comportement de nomination d'origine."
 xqol_disable_auto_appointment_decision_confirm:0 "Rétablir l'ancien ordre"
 xqol_auto_appointment_enabled_tt:0 "La succession automatique par nomination est #P activée#!"
 xqol_auto_appointment_disabled_tt:0 "La succession automatique par nomination est #N désactivée#!"
 xqol_auto_appointment_score_penalty_desc:0 "Succession automatique : le souverain décline cette nomination"
 xqol_enable_no_vassal_transfers_decision:0 "Ne plus me transférer de vassaux"
 xqol_enable_no_vassal_transfers_decision_desc:0 "Demander aux dirigeants administratifs subordonnés de ne plus vous transférer leurs vassaux. Cette fonction utilise la protection de transfert de l'IA du jeu et n'empêche pas les transferts que vous lancez vous-même."
 xqol_enable_no_vassal_transfers_decision_tooltip:0 "Les vassaux administratifs ne vous transféreront plus leurs propres vassaux."
 xqol_enable_no_vassal_transfers_decision_confirm:0 "Maintenir l'ordre hiérarchique"
 xqol_disable_no_vassal_transfers_decision:0 "Réautoriser le transfert de vassaux"
 xqol_disable_no_vassal_transfers_decision_desc:0 "Supprimer la protection de transfert de ce mod et rétablir le comportement d'origine de l'IA."
 xqol_disable_no_vassal_transfers_decision_tooltip:0 "Rétablir le comportement d'origine de l'IA pour le transfert de vassaux."
 xqol_disable_no_vassal_transfers_decision_confirm:0 "Les recevoir à nouveau"
 xqol_no_vassal_transfers_enabled_tt:0 "Les transferts de vassaux de l'IA vers le joueur sont #P bloqués#!"
 xqol_no_vassal_transfers_disabled_tt:0 "Les transferts de vassaux de l'IA vers le joueur sont #N rétablis#!"
