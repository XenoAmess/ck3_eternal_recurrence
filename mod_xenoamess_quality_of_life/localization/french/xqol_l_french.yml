l_french:
 decision_group_type_xqol_quality_of_life:0 "Qualité de vie de XenoAmess"
 xqol_enable_auto_appointment_decision:0 "Activer les nominations automatiques"
 xqol_enable_auto_appointment_decision_desc:0 "Empêcher le souverain de devenir l'héritier par défaut des charges administratives subordonnées. La loi de succession par nomination existante choisira à sa place le candidat éligible ayant le score de candidature le plus élevé."
 xqol_enable_auto_appointment_decision_tooltip:0 "Les gouvernorats administratifs reviendront au candidat éligible ayant le score de candidature le plus élevé en cas de décès ou de destitution."
 xqol_enable_auto_appointment_decision_confirm:0 "Laisser le mérite décider"
 xqol_disable_auto_appointment_decision:0 "Désactiver les nominations automatiques"
 xqol_disable_auto_appointment_decision_desc:0 "Rétablir le calcul d'origine du score de candidature pour les charges administratives subordonnées."
 xqol_disable_auto_appointment_decision_tooltip:0 "Rétablir le comportement de nomination d'origine."
 xqol_disable_auto_appointment_decision_confirm:0 "Rétablir l'ancien ordre"
 xqol_auto_appointment_enabled_tt:0 "La succession automatique par nomination est #P activée#!"
 xqol_auto_appointment_disabled_tt:0 "La succession automatique par nomination est #N désactivée#!"
 xqol_auto_appointment_score_penalty_desc:0 "Succession automatique : le souverain décline cette nomination"
 xqol_enable_no_vassal_transfers_decision:0 "Ne plus me transférer de vassaux"
 xqol_enable_no_vassal_transfers_decision_desc:0 "Demander aux dirigeants administratifs subordonnés de ne plus vous transférer leurs vassaux. Cette fonction utilise la protection de transfert de l'IA du jeu et n'empêche pas les transferts que vous lancez vous-même."
 xqol_enable_no_vassal_transfers_decision_tooltip:0 "Les vassaux administratifs ne vous transféreront plus leurs propres vassaux."
 xqol_enable_no_vassal_transfers_decision_confirm:0 "Maintenir l'ordre hiérarchique"
 xqol_disable_no_vassal_transfers_decision:0 "Réautoriser le transfert de vassaux"
 xqol_disable_no_vassal_transfers_decision_desc:0 "Supprimer la protection de transfert de ce mod et rétablir le comportement d'origine de l'IA."
 xqol_disable_no_vassal_transfers_decision_tooltip:0 "Rétablir le comportement d'origine de l'IA pour le transfert de vassaux."
 xqol_disable_no_vassal_transfers_decision_confirm:0 "Les recevoir à nouveau"
 xqol_no_vassal_transfers_enabled_tt:0 "Les transferts de vassaux de l'IA vers le joueur sont #P bloqués#!"
 xqol_no_vassal_transfers_disabled_tt:0 "Les transferts de vassaux de l'IA vers le joueur sont #N rétablis#!"
 xqol_enable_auto_call_defenders_decision:0 "Activer les appels défensifs automatiques"
 xqol_enable_auto_call_defenders_decision_desc:0 "Lorsqu’un autre dirigeant vous déclare la guerre, appelez immédiatement tous les dirigeants IA que le jeu vous autorise à appeler dans cette guerre défensive sans payer d’or, de prestige ni de piété."
 xqol_enable_auto_call_defenders_decision_tooltip:0 "Appeler automatiquement tous les défenseurs IA actuellement éligibles et gratuits."
 xqol_enable_auto_call_defenders_decision_confirm:0 "Appeler tous ceux qui me doivent aide"
 xqol_disable_auto_call_defenders_decision:0 "Désactiver les appels défensifs automatiques"
 xqol_disable_auto_call_defenders_decision_desc:0 "Cesser d’appeler automatiquement les alliés, suzerains garants, tributaires mobilisables, diarques éligibles et membres de la Maison appelables gratuitement dans les nouvelles guerres défensives."
 xqol_disable_auto_call_defenders_decision_tooltip:0 "Repasser les appels défensifs en contrôle manuel."
 xqol_disable_auto_call_defenders_decision_confirm:0 "Je les appellerai moi-même"
 xqol_auto_call_defenders_enabled_tt:0 "Les appels défensifs automatiques gratuits sont #P activés#!"
 xqol_auto_call_defenders_disabled_tt:0 "Les appels défensifs automatiques gratuits sont #N désactivés#!"
 xqol_auto_call_defenders_result_title:0 "Les défenseurs ont répondu"
 xqol_auto_call_defenders_result_desc:0 "[GetPlayer.MakeScope.Var('xqol_last_auto_called_count').GetValue|0] dirigeants IA appelables gratuitement ont rejoint votre guerre défensive."
 xqol_mass_conversion_decision:0 "Exiger des conversions en masse dans le domaine"
 xqol_mass_conversion_decision_desc:0 "Choisissez une valeur d’acceptation minimale de 0 à 100. Tous les courtisans, vassaux, dirigeants subordonnés et tributaires IA éligibles de votre domaine dont l’acceptation normale de la conversion atteint ce seuil recevront une exigence de conversion."
 xqol_mass_conversion_decision_tooltip:0 "Ouvrir le curseur du seuil d’acceptation, puis envoyer toutes les exigences de conversion éligibles."
 xqol_mass_conversion_decision_confirm:0 "Définir le seuil"
 xqol_mass_conversion_event_title:0 "Définir le seuil d’acceptation de la conversion"
 xqol_mass_conversion_event_desc:0 "Seuls les personnages dont l’acceptation normale de la conversion atteint au moins cette valeur seront contactés. Leurs réponses réelles utilisent toujours le test d’acceptation normal du jeu."
 xqol_mass_conversion_event_confirm:0 "Envoyer toutes les exigences éligibles"
 xqol_mass_conversion_event_cancel:0 "Annuler"
 xqol_mass_conversion_threshold_label:0 "Acceptation minimale de la conversion"
 xqol_mass_conversion_threshold_help:0 "Faites glisser ou cliquez sur la barre. 0 est le plus large ; 100 ne contacte que ceux qui accepteront certainement."
 xqol_mass_conversion_results_title:0 "Réponses de conversion du domaine terminées"
 xqol_mass_conversion_results_desc:0 "Acceptations : #P [GetPlayer.MakeScope.Var('xqol_mass_conversion_accepted').GetValue|0]#!   Refus : #N [GetPlayer.MakeScope.Var('xqol_mass_conversion_refused').GetValue|0]#!"
 xqol_bulk_demand_payment_full_decision:0 "Exiger tous les paiements intégraux par hameçon"
 xqol_bulk_demand_payment_full_decision_desc:0 "Utiliser l’interaction normale « Exiger un paiement » sur chaque personnage IA valide contre lequel vous avez un hameçon et qui peut régler toute l’obligation. Chaque exigence réussie consomme son hameçon."
 xqol_bulk_demand_payment_full_decision_tooltip:0 "Ne collecter que les paiements intégraux obtenus par hameçon."
 xqol_bulk_demand_payment_full_decision_confirm:0 "Recouvrer toutes les dettes intégrales"
 xqol_bulk_demand_payment_any_decision:0 "Exiger tous les paiements disponibles par hameçon"
 xqol_bulk_demand_payment_any_decision_desc:0 "Utiliser l’interaction normale « Exiger un paiement » sur chaque personnage IA valide contre lequel vous avez un hameçon et qui possède plus de 1 pièce d’or. Une cible incapable de couvrir l’obligation verse tout son or actuel ; chaque exigence consomme son hameçon."
 xqol_bulk_demand_payment_any_decision_tooltip:0 "Collecter auprès de chaque personnage IA valide avec hameçon et plus de 1 pièce d’or."
 xqol_bulk_demand_payment_any_decision_confirm:0 "Prendre ce qu’ils ont"
 xqol_bulk_payment_results_title:0 "Paiements par hameçon recouvrés"
 xqol_bulk_payment_results_desc:0 "Exigences accomplies : [GetPlayer.MakeScope.Var('xqol_last_bulk_payment_count').GetValue|0]."
 xqol_bulk_ransom_full_decision:0 "Rançonner tous les prisonniers au prix intégral"
 xqol_bulk_ransom_full_decision_desc:0 "Proposer la rançon normale en or pour chaque prisonnier dont le payeur IA consentant peut couvrir la totalité du prix applicable. Les fonds sont revérifiés après chaque rançon."
 xqol_bulk_ransom_full_decision_tooltip:0 "Ne rançonner les prisonniers qu’au prix intégral applicable en or."
 xqol_bulk_ransom_full_decision_confirm:0 "Encaisser toutes les rançons intégrales"
 xqol_bulk_ransom_any_decision:0 "Rançonner tous les prisonniers pour l’or disponible"
 xqol_bulk_ransom_any_decision_desc:0 "Proposer la rançon normale en or pour chaque prisonnier dont le payeur IA consentant possède au moins 1 pièce d’or. S’il ne peut couvrir le prix intégral, le jeu prend tout son or actuel."
 xqol_bulk_ransom_any_decision_tooltip:0 "Rançonner les prisonniers auprès des payeurs IA consentants possédant au moins 1 pièce d’or."
 xqol_bulk_ransom_any_decision_confirm:0 "Vider toutes les bourses"
 xqol_bulk_ransom_results_title:0 "Rançons des prisonniers terminées"
 xqol_bulk_ransom_results_desc:0 "Prisonniers rançonnés : [GetPlayer.MakeScope.Var('xqol_last_bulk_ransom_count').GetValue|0]."
 xqol_bulk_release_terms_decision:0 "Libérer sous conditions tous les prisonniers consentants"
 xqol_bulk_release_terms_decision_desc:0 "Libérer chaque prisonnier IA consentant avec le plus grand sous-ensemble compatible de « Obtenir un hameçon », « Recruter » et « Exiger une conversion ». À taille égale, l’ordre de priorité est hameçon, recrutement, conversion."
 xqol_bulk_release_terms_decision_tooltip:0 "Négocier la combinaison acceptée la plus forte pour chaque prisonnier."
 xqol_bulk_release_terms_decision_confirm:0 "Proposer les conditions les plus fortes"
 xqol_bulk_release_results_title:0 "Libérations conditionnelles terminées"
 xqol_bulk_release_results_desc:0 "Prisonniers libérés selon les conditions acceptées : [GetPlayer.MakeScope.Var('xqol_last_bulk_release_count').GetValue|0]."
