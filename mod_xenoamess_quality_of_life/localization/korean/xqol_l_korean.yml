l_korean:
 decision_group_type_xqol_quality_of_life:0 "XenoAmess 편의성 개선"
 xqol_enable_auto_appointment_decision:0 "자동 임명 활성화"
 xqol_enable_auto_appointment_decision_desc:0 "군주 본인이 하위 행정 관직의 대체 후계자가 되지 않게 합니다. 기존 임명 승계법에 따라 후보 점수가 가장 높은 적격 후보가 선출됩니다."
 xqol_enable_auto_appointment_decision_tooltip:0 "행정제 총독직은 사망 또는 해임 시 후보 점수가 가장 높은 적격 후보에게 승계됩니다."
 xqol_enable_auto_appointment_decision_confirm:0 "능력으로 결정한다"
 xqol_disable_auto_appointment_decision:0 "자동 임명 비활성화"
 xqol_disable_auto_appointment_decision_desc:0 "하위 행정 관직의 기존 임명 점수 산정 방식을 복원합니다."
 xqol_disable_auto_appointment_decision_tooltip:0 "기존 임명 승계 방식을 복원합니다."
 xqol_disable_auto_appointment_decision_confirm:0 "기존 질서를 복원한다"
 xqol_auto_appointment_enabled_tt:0 "자동 임명 승계가 #P 활성화#!되었습니다"
 xqol_auto_appointment_disabled_tt:0 "자동 임명 승계가 #N 비활성화#!되었습니다"
 xqol_auto_appointment_score_penalty_desc:0 "자동 승계: 군주가 이 임명을 거절합니다"
 xqol_enable_no_vassal_transfers_decision:0 "나에게 봉신을 넘기지 마라"
 xqol_enable_no_vassal_transfers_decision_desc:0 "하위 행정제 군주에게 자신의 봉신을 플레이어에게 수여하지 말 것을 지시합니다. 게임의 기존 AI 봉신 수여 방지 기능을 사용하며, 플레이어가 직접 시작한 봉신 수여는 차단하지 않습니다."
 xqol_enable_no_vassal_transfers_decision_tooltip:0 "행정 봉신은 자신의 봉신을 플레이어에게 수여하지 않습니다."
 xqol_enable_no_vassal_transfers_decision_confirm:0 "계층 질서를 유지한다"
 xqol_disable_no_vassal_transfers_decision:0 "봉신 수여 다시 허용"
 xqol_disable_no_vassal_transfers_decision_desc:0 "이 모드의 봉신 수여 방지 기능을 제거하고 기존 AI 동작을 복원합니다."
 xqol_disable_no_vassal_transfers_decision_tooltip:0 "기존 AI 봉신 수여 동작을 복원합니다."
 xqol_disable_no_vassal_transfers_decision_confirm:0 "다시 받아들인다"
 xqol_no_vassal_transfers_enabled_tt:0 "AI가 플레이어에게 봉신을 수여하는 행동이 #P 차단#!되었습니다"
 xqol_no_vassal_transfers_disabled_tt:0 "AI가 플레이어에게 봉신을 수여하는 행동이 #N 재개#!되었습니다"
 xqol_enable_auto_call_defenders_decision:0 "자동 방어전 참전 요청 활성화"
 xqol_enable_auto_call_defenders_decision_desc:0 "다른 군주가 당신에게 전쟁을 선포하면, 금화·위신·신앙심을 소모하지 않고 현재 해당 방어전에 부를 수 있는 모든 AI 군주에게 즉시 참전을 요청합니다."
 xqol_enable_auto_call_defenders_decision_tooltip:0 "현재 무료로 부를 수 있는 모든 AI 방어자에게 자동으로 참전을 요청합니다."
 xqol_enable_auto_call_defenders_decision_confirm:0 "모든 도움을 요청한다"
 xqol_disable_auto_call_defenders_decision:0 "자동 방어전 참전 요청 비활성화"
 xqol_disable_auto_call_defenders_decision_desc:0 "새로운 방어전에서 동맹, 보장된 종주국, 참전 가능한 조공국, 적격 섭정, 무료로 부를 수 있는 가문 구성원에게 자동으로 참전을 요청하지 않습니다."
 xqol_disable_auto_call_defenders_decision_tooltip:0 "방어전 참전 요청을 수동으로 되돌립니다."
 xqol_disable_auto_call_defenders_decision_confirm:0 "직접 요청하겠다"
 xqol_auto_call_defenders_enabled_tt:0 "무료 자동 방어전 참전 요청이 #P 활성화#!되었습니다"
 xqol_auto_call_defenders_disabled_tt:0 "무료 자동 방어전 참전 요청이 #N 비활성화#!되었습니다"
 xqol_auto_call_defenders_result_title:0 "방어자들이 응답함"
 xqol_auto_call_defenders_result_desc:0 "무료로 부를 수 있는 AI 군주 [GetPlayer.MakeScope.Var('xqol_last_auto_called_count').GetValue|0]명이 방어전에 합류했습니다."
 xqol_mass_conversion_decision:0 "영지 내 일괄 개종 요구"
 xqol_mass_conversion_decision_desc:0 "0부터 100 사이의 최소 수락 수치를 선택합니다. 영지 안의 적격 AI 궁정 신하, 봉신, 하위 군주, 조공국 가운데 일반 개종 수락 수치가 기준 이상인 모든 대상에게 개종을 요구합니다."
 xqol_mass_conversion_decision_tooltip:0 "수락 기준 슬라이더를 열고 조건을 충족하는 모든 대상에게 개종을 요구합니다."
 xqol_mass_conversion_decision_confirm:0 "기준치를 설정한다"
 xqol_mass_conversion_event_title:0 "개종 수락 기준 설정"
 xqol_mass_conversion_event_desc:0 "일반 개종 수락 수치가 이 값 이상인 인물에게만 요구를 보냅니다. 실제 답변에는 게임의 기존 수락 판정이 그대로 적용됩니다."
 xqol_mass_conversion_event_confirm:0 "조건을 충족하는 모두에게 요구한다"
 xqol_mass_conversion_event_cancel:0 "취소"
 xqol_mass_conversion_threshold_label:0 "최소 개종 수락 수치"
 xqol_mass_conversion_threshold_help:0 "막대를 드래그하거나 클릭하십시오. 0은 범위가 가장 넓고, 100은 확실히 수락할 대상만 포함합니다."
 xqol_mass_conversion_results_title:0 "영지 개종 응답 완료"
 xqol_mass_conversion_results_desc:0 "동의: #P [GetPlayer.MakeScope.Var('xqol_mass_conversion_accepted').GetValue|0]#!   거절: #N [GetPlayer.MakeScope.Var('xqol_mass_conversion_refused').GetValue|0]#!"
 xqol_bulk_demand_payment_full_decision:0 "구실로 전액 공여 일괄 요구"
 xqol_bulk_demand_payment_full_decision_desc:0 "구실을 가진 유효한 AI 인물 중 의무 금액 전부를 지불할 수 있는 모두에게 기존 ‘공여 요구’ 상호작용을 실행합니다. 성공한 요구마다 구실을 소모합니다."
 xqol_bulk_demand_payment_full_decision_tooltip:0 "구실로 받을 수 있는 전액 공여만 회수합니다."
 xqol_bulk_demand_payment_full_decision_confirm:0 "전액을 모두 회수한다"
 xqol_bulk_demand_payment_any_decision:0 "구실로 가능한 공여 일괄 요구"
 xqol_bulk_demand_payment_any_decision_desc:0 "구실을 가지고 금화가 1보다 많은 모든 유효한 AI 인물에게 기존 ‘공여 요구’ 상호작용을 실행합니다. 의무 금액을 전부 낼 수 없다면 현재 가진 정수 금화를 모두 지불하며, 요구마다 구실을 소모합니다."
 xqol_bulk_demand_payment_any_decision_tooltip:0 "구실을 가지고 금화가 1보다 많은 모든 유효한 AI 인물에게 공여를 요구합니다."
 xqol_bulk_demand_payment_any_decision_confirm:0 "가진 만큼 거둔다"
 xqol_bulk_payment_results_title:0 "구실 공여 회수 완료"
 xqol_bulk_payment_results_desc:0 "완료된 요구: [GetPlayer.MakeScope.Var('xqol_last_bulk_payment_count').GetValue|0]건."
 xqol_bulk_ransom_full_decision:0 "전액 지불 가능한 포로 몸값 일괄 회수"
 xqol_bulk_ransom_full_decision_desc:0 "지불 의사가 있는 AI가 현재 적용되는 몸값 전액을 감당할 수 있는 모든 포로에게 기존 금화 몸값을 제안합니다. 각 거래 뒤 지불 능력을 다시 확인합니다."
 xqol_bulk_ransom_full_decision_tooltip:0 "적용되는 몸값 전액을 지불할 수 있는 포로만 석방합니다."
 xqol_bulk_ransom_full_decision_confirm:0 "몸값 전액을 모두 받는다"
 xqol_bulk_ransom_any_decision:0 "보유 금화로 포로 몸값 일괄 회수"
 xqol_bulk_ransom_any_decision_desc:0 "지불 의사가 있는 AI가 최소 1의 금화를 가진 모든 포로에게 기존 몸값을 제안합니다. 전액을 감당할 수 없다면 현재 가진 정수 금화를 모두 받습니다."
 xqol_bulk_ransom_any_decision_tooltip:0 "지불 의사가 있고 최소 1의 금화를 가진 AI에게서 몸값을 받습니다."
 xqol_bulk_ransom_any_decision_confirm:0 "모든 주머니를 비운다"
 xqol_bulk_ransom_results_title:0 "포로 몸값 회수 완료"
 xqol_bulk_ransom_results_desc:0 "몸값으로 석방한 포로: [GetPlayer.MakeScope.Var('xqol_last_bulk_ransom_count').GetValue|0]명."
 xqol_bulk_release_terms_decision:0 "조건부 포로 일괄 석방"
 xqol_bulk_release_terms_decision_desc:0 "동의하는 AI 포로마다 ‘구실 획득’, ‘채용’, ‘개종 요구’ 중 함께 적용할 수 있는 가장 많은 조건을 붙여 석방합니다. 조건 수가 같으면 구실, 채용, 개종 순으로 우선합니다."
 xqol_bulk_release_terms_decision_tooltip:0 "각 포로에게 수락되는 가장 강한 조건 조합을 협상합니다."
 xqol_bulk_release_terms_decision_confirm:0 "가장 강한 조건을 제시한다"
 xqol_bulk_release_results_title:0 "조건부 석방 완료"
 xqol_bulk_release_results_desc:0 "수락된 조건으로 석방한 포로: [GetPlayer.MakeScope.Var('xqol_last_bulk_release_count').GetValue|0]명."
