l_simp_chinese:
 decision_group_type_xqol_quality_of_life:0 "XenoAmess的体验优化"
 xqol_enable_auto_appointment_decision:0 "开启自动选择继任"
 xqol_enable_auto_appointment_decision_desc:0 "不再让君主本人充当下属行政官职的兜底继承人。各头衔仍使用原版行政制、贤能制或天朝制的候选资格与继承分数，并由其中分数最高者接任。"
 xqol_enable_auto_appointment_decision_tooltip:0 "行政制封臣死亡或卸任时，由原版继承分数最高的合资格候选人接任。"
 xqol_enable_auto_appointment_decision_confirm:0 "唯才是举"
 xqol_disable_auto_appointment_decision:0 "关闭自动选择继任"
 xqol_disable_auto_appointment_decision_desc:0 "恢复下属行政官职的原版继承评分行为。"
 xqol_disable_auto_appointment_decision_tooltip:0 "恢复原版行政任命继承行为。"
 xqol_disable_auto_appointment_decision_confirm:0 "恢复旧制"
 xqol_auto_appointment_enabled_tt:0 "自动选择继任已#P 开启#!"
 xqol_auto_appointment_disabled_tt:0 "自动选择继任已#N 关闭#!"
 xqol_auto_appointment_score_penalty_desc:0 "自动选择继任：君主不接受这项任命"
 xqol_enable_no_vassal_transfers_decision:0 "开启：别把封臣给我"
 xqol_enable_no_vassal_transfers_decision_desc:0 "要求下属行政制统治者不要再把封臣向上转交给你。本功能复用原版 AI 转封保护标志，不会妨碍你亲自发起的封臣转移。"
 xqol_enable_no_vassal_transfers_decision_tooltip:0 "行政制封臣不会再把自己的封臣转交给你。"
 xqol_enable_no_vassal_transfers_decision_confirm:0 "各安其位"
 xqol_disable_no_vassal_transfers_decision:0 "关闭：别把封臣给我"
 xqol_disable_no_vassal_transfers_decision_desc:0 "移除本 Mod 设置的转封保护，恢复原版 AI 行为。"
 xqol_disable_no_vassal_transfers_decision_tooltip:0 "恢复原版 AI 封臣转移行为。"
 xqol_disable_no_vassal_transfers_decision_confirm:0 "照旧接收"
 xqol_no_vassal_transfers_enabled_tt:0 "AI 向上转交封臣已#P 禁止#!"
 xqol_no_vassal_transfers_disabled_tt:0 "AI 向上转交封臣已#N 恢复#!"
 xqol_enable_auto_call_defenders_decision:0 "开启自动召集防御援军"
 xqol_enable_auto_call_defenders_decision_desc:0 "当其他统治者向你宣战时，立即召集所有当前可免费加入该防御战争的 AI 统治者，包括盟友、受保证的宗主、可召集的朝贡国、合资格摄政以及免费的家族成员；不会支付金钱、威望或虔诚。"
 xqol_enable_auto_call_defenders_decision_tooltip:0 "自动召集所有当前合资格且无需资源的 AI 防御方。"
 xqol_enable_auto_call_defenders_decision_confirm:0 "唤来所有援手"
 xqol_disable_auto_call_defenders_decision:0 "关闭自动召集防御援军"
 xqol_disable_auto_call_defenders_decision_desc:0 "停止在新防御战争中自动召集盟友、受保证的宗主、可召集的朝贡国、合资格摄政与免费的家族成员。"
 xqol_disable_auto_call_defenders_decision_tooltip:0 "恢复手动召集防御方。"
 xqol_disable_auto_call_defenders_decision_confirm:0 "由我亲自召集"
 xqol_auto_call_defenders_enabled_tt:0 "自动召集免费防御援军已#P 开启#!"
 xqol_auto_call_defenders_disabled_tt:0 "自动召集免费防御援军已#N 关闭#!"
 xqol_auto_call_defenders_result_title:0 "援军应召"
 xqol_auto_call_defenders_result_desc:0 "已有 [GetPlayer.MakeScope.Var('xqol_last_auto_called_count').GetValue|0] 名无需资源的 AI 统治者加入你的防御战争。"
 xqol_mass_conversion_decision:0 "批量要求领内改信"
 xqol_mass_conversion_decision_desc:0 "选择一个 0 至 100 的最低接受值。领地范围内所有合资格的 AI 廷臣、封臣、下级统治者与朝贡国，只要其原版改信接受值达到门槛，都会收到改信要求。"
 xqol_mass_conversion_decision_tooltip:0 "打开接受值滑动条，并向所有达到门槛的目标发出改信要求。"
 xqol_mass_conversion_decision_confirm:0 "设定门槛"
 xqol_mass_conversion_event_title:0 "设定改信接受门槛"
 xqol_mass_conversion_event_desc:0 "仅联系原版改信接受值不低于此数值的人物；他们的实际答复仍按游戏原版接受概率判定。"
 xqol_mass_conversion_event_confirm:0 "发出全部合资格要求"
 xqol_mass_conversion_event_cancel:0 "取消"
 xqol_mass_conversion_threshold_label:0 "最低改信接受值"
 xqol_mass_conversion_threshold_help:0 "拖动或点击横条。0 的范围最广；100 只联系必然接受者。"
 xqol_mass_conversion_results_title:0 "领内改信答复完毕"
 xqol_mass_conversion_results_desc:0 "同意：#P [GetPlayer.MakeScope.Var('xqol_mass_conversion_accepted').GetValue|0]#!　拒绝：#N [GetPlayer.MakeScope.Var('xqol_mass_conversion_refused').GetValue|0]#!"
 xqol_bulk_demand_payment_full_decision:0 "批量索取足额牵制款"
 xqol_bulk_demand_payment_full_decision_desc:0 "对所有当前能足额支付且可合法索款的 AI 牵制目标执行原版“索取钱财”互动。每次成功索款都会消耗对应牵制。"
 xqol_bulk_demand_payment_full_decision_tooltip:0 "只向能足额付款的牵制目标批量索款。"
 xqol_bulk_demand_payment_full_decision_confirm:0 "收齐所有足额欠款"
 xqol_bulk_demand_payment_any_decision:0 "批量索取现有牵制款"
 xqol_bulk_demand_payment_any_decision_desc:0 "对所有金钱大于 1 且可合法索款的 AI 牵制目标执行原版“索取钱财”互动。付不起足额者将交出当前全部整数金钱；每次索款都会消耗对应牵制。"
 xqol_bulk_demand_payment_any_decision_tooltip:0 "向所有金钱大于 1 的有效 AI 牵制目标索取其现有款项。"
 xqol_bulk_demand_payment_any_decision_confirm:0 "有多少便取多少"
 xqol_bulk_payment_results_title:0 "牵制索款完毕"
 xqol_bulk_payment_results_desc:0 "已完成索款：[GetPlayer.MakeScope.Var('xqol_last_bulk_payment_count').GetValue|0] 人。"
 xqol_bulk_ransom_full_decision:0 "批量足额赎回囚犯"
 xqol_bulk_ransom_full_decision_desc:0 "对每名存在愿意且当前能足额付款的 AI 付款人的囚犯，执行原版金钱赎回。每笔赎金完成后都会重新检查剩余资金。"
 xqol_bulk_ransom_full_decision_tooltip:0 "只按当前适用的足额金钱价格赎回囚犯。"
 xqol_bulk_ransom_full_decision_confirm:0 "收取全部足额赎金"
 xqol_bulk_ransom_any_decision:0 "批量按现有钱财赎回囚犯"
 xqol_bulk_ransom_any_decision_desc:0 "对每名存在愿意且至少有 1 金钱的 AI 付款人的囚犯执行原版赎回。付不起足额者将交出当前全部整数金钱。"
 xqol_bulk_ransom_any_decision_tooltip:0 "向至少有 1 金钱且愿意付款的 AI 付款人批量索取赎金。"
 xqol_bulk_ransom_any_decision_confirm:0 "榨尽所有钱袋"
 xqol_bulk_ransom_results_title:0 "批量赎囚完毕"
 xqol_bulk_ransom_results_desc:0 "已赎回囚犯：[GetPlayer.MakeScope.Var('xqol_last_bulk_ransom_count').GetValue|0] 人。"
 xqol_bulk_release_terms_decision:0 "按最优条款批量释放囚犯"
 xqol_bulk_release_terms_decision_desc:0 "为每名愿意接受条件的 AI 囚犯选择“获得牵制、招募、要求改信”中数量最多的兼容组合；组合数量相同时，按获得牵制、招募、要求改信的顺序优先。"
 xqol_bulk_release_terms_decision_tooltip:0 "为每名囚犯自动选择其愿意接受的最强条款组合。"
 xqol_bulk_release_terms_decision_confirm:0 "提出最强条款"
 xqol_bulk_release_results_title:0 "附条件释放完毕"
 xqol_bulk_release_results_desc:0 "已按接受条款释放囚犯：[GetPlayer.MakeScope.Var('xqol_last_bulk_release_count').GetValue|0] 人。"
