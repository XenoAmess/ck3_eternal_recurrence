 aubd_fast_district_preparation:0 "Fixture construction preparation"
 aubd_start_title:0 "Duchy primary: GUI preparation"
 aubd_start_desc:0 "Keep day0 manually paused. This option checks actual Robert/Trani/Apulia ownership and holdingII, then prepares province innovations, funds and a temporary speed modifier before closing. Use Alt+S, confirm actual Trani, open its separate duchy slot and select Mustering Grounds District. Retain the enabled stock Construct action, Queue and actual active day0 construction before resuming. The GUI preparation cost has no product fee credit. This option never starts construction. Leave unrelated stock events untouched."
 aubd_start_confirm:0 "Prepare, close, and keep day0 paused for GUI construction."
 aubd_started_title:0 "Duchy primary: day1 GUI construction observed"
 aubd_started_desc:0 "Day1 readback found active construction without a built military primary01 and retained owner, holding and preparation inputs. Exact military GUI selection, enabled Construct/Queue and day0 active progress still require their actual GUI evidence. No script Native01 pass or business PASS is claimed. This option starts at most14 daily completion checks; total bound stays15 days. The minimum duration remains unqualified; incomplete construction is PARTIAL."
 aubd_started_confirm:0 "Observe real construction for at most14 days."
 aubd_ready_title:0 "Duchy primary: GUI preparation completed"
 aubd_ready_desc:0 "Actual built military primary01, its own district, and native primary02 eligibility were read back after real construction. The temporary modifier has been removed. This option freezes a fresh post-preparation wallet baseline and calls the existing military district chain once. Require primary01 to02, exact personal gold100/count1 and other resources unchanged."
 aubd_ready_confirm:0 "Run the single production-chain assertion."
 aubd_done_title:0 "GUI duchy primary: DONE"
 aubd_done_desc:0 "The production primary01 to02 assertion passed with exact personal gold100/count1 and other resources unchanged. This is one partial GUI-prepared cell. Actual day0 GUI construction evidence remains required. Keep this window and retain calendar, logs and normal exit evidence; do not merge it with the earlier failed script-first-tier scenes."
 aubd_stopped_title:0 "GUI duchy primary: stopped"
 aubd_stopped_desc:0 "GUI preparation/day1 readback failed, real construction reached its14-poll bound as PARTIAL, or the product assertion failed. Consult the exact AUBD marker. No continuation is scheduled here. Retain the current state and normally close the scene; do not advance time, repair a failed stage, clear other districts or consume unrelated stock events."
 aubd_close_confirm:0 "Close this fixture window."
