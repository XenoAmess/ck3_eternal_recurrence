l_simp_chinese:
 aubd_fast_district_preparation:0 "夹具施工准备"
 aubd_start_title:0 "公国主建筑：开始"
 aubd_start_desc:0 "仅为验收夹具。请在1066年选择阿普利亚的罗贝尔。本选项会核对特拉尼省、阿普利亚伯爵领与公爵领的真实持有关系及二级地产，再准备省文化科技与临时施工时间修正。不会授予头衔或直接创建主建筑。仅使用本夹具的已知选项；保留陌生原版事件。"
 aubd_start_confirm:0 "准备这次受控施工。"
 aubd_started_title:0 "公国主建筑：已开始施工"
 aubd_started_desc:0 "原生效果已开始军事区域一级主建筑的真实计时施工，尚未获得业务通过。本选项将开始最多14次逐日建成检查。实际最短工期仍未验证；未在上限内建成只记为部分完成。"
 aubd_started_confirm:0 "最多观察14个游戏日。"
 aubd_ready_title:0 "公国主建筑：准备已建成"
 aubd_ready_desc:0 "已读回真实建成的一级主建筑、它所属的区域及原生二级建造资格，临时施工修正已移除。本选项会重新冻结资金基线，仅调用一次现有军事区域生产升级链，检查一级到二级、个人金币准确扣除100、成功计数准确为1。"
 aubd_ready_confirm:0 "执行这一个生产链断言。"
 aubd_done_title:0 "公国主建筑：完成"
 aubd_done_desc:0 "一级到二级的断言通过，个人金币准确扣除100且成功计数为1。这只是产品的一项部分覆盖。保留此已知完成窗口，记录真实日期、日志与正常退出证据。"
 aubd_stopped_title:0 "公国主建筑：已停止"
 aubd_stopped_desc:0 "准备失败、真实施工达到14日观察上限仍未完成，或业务断言失败。请查具体AUBD日志标记。本窗口不会调度后续执行。保留当前状态并结束本场，不继续日历，也不消费陌生原版事件。"
 aubd_close_confirm:0 "关闭此夹具窗口。"
