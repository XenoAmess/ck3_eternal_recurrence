l_simp_chinese:
 aubd_fast_district_preparation:0 "夹具施工准备"
 aubd_start_title:0 "公国主建筑：GUI首建准备"
 aubd_start_desc:0 "保持第零日手动暂停。本选项核对罗贝尔、特拉尼、阿普利亚县与公国的真实持有关系及二级地产，准备省文化科技、资金和临时施工加速后关闭。随后按Alt+S，确认实际特拉尼县界面，在单独的公国槽选择“集合场区”；保留原版“建造”启用、实际Queue及第零日正在施工的证据，再恢复时间。GUI准备费用不计入产品付款成绩。本选项不会发起施工，陌生原版事件不选。"
 aubd_start_confirm:0 "准备并关闭，保持第零日暂停，转原版GUI建区。"
 aubd_started_title:0 "公国主建筑：第一日观察到GUI施工"
 aubd_started_desc:0 "第一日读回省份确在施工且军事一级主建筑尚未建成，所有权、地产和准备前提仍成立。实际选择集合场区、启用的建造与Queue、第零日正在施工仍须各自GUI证据，不宣称脚本Native01或业务通过。本选项开始最多14次逐日建成检查，总上限仍为15日。实际最短工期未验证；超限未建成只记部分完成。"
 aubd_started_confirm:0 "最多观察14个游戏日。"
 aubd_ready_title:0 "公国主建筑：GUI准备已建成"
 aubd_ready_desc:0 "已在真实计时施工后读回军事一级主建筑、它所属的区域及原生二级建造资格，临时加速已移除。本选项冻结全部准备结束后的新资金基线，仅调用一次现有军事区域生产链，要求一级到二级、个人金币准确扣除100、成功计数为1且其他资源不变。"
 aubd_ready_confirm:0 "执行这一个生产链断言。"
 aubd_done_title:0 "GUI公国主建筑：完成"
 aubd_done_desc:0 "生产链一级到二级通过，个人金币准确扣除100、成功计数为1且其他资源不变。这只是GUI准备的一项部分覆盖，第零日真实GUI施工证据仍不可少。保留本窗口、实际日期、日志与正常退出证据，不与此前脚本首建失败场次合并。"
 aubd_stopped_title:0 "GUI公国主建筑：已停止"
 aubd_stopped_desc:0 "GUI准备或第一日读回失败、真实施工达到14次逐日观察上限仍未建成，或产品断言失败。请查具体AUBD标记。本窗口不调度后续执行。保留现场并正常结束，不推进时间、不修补失败阶段、不清其他区域、不消费陌生原版事件。"
 aubd_close_confirm:0 "关闭此夹具窗口。"
