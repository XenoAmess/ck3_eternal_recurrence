l_simp_chinese:
 aubs_ready_title:0 "继承夹具：准备完成"
 aubs_ready_desc:0 "游戏保持暂停。原玩家仍控制特拉尼，实际仅一处直属地产，保留原生城堡三级和驻军一级。已取样的存活继承者预置了禁用和仅国库策略。开始后只启动一次新生产循环，并使原玩家真实死亡。必须使用原版默认的“继续扮演继承人”；切换角色不能替代继承。"
 aubs_arm_death:0 "开始真实死亡与继承"
 aubs_handover_title:0 "继承夹具：继承者检查点"
 aubs_handover_desc:0 "第二日，实际玩家为先前取样的继承者，保留了仅个人资金和超直辖暂停策略。第一次自动扫描使驻军升至二级，三级原生资格成立。保持暂停。现场负责人须另存原版继续操作及模态实际清除的证据。下一选项调用一次新的生产扫描，要求恰扣个人金币120且升级计数为一。"
 aubs_probe_confirm:0 "执行暂停帧的生产扣费检查"
 aubs_probe_title:0 "继承夹具：扣费检查完成"
 aubs_probe_desc:0 "单独的生产扫描已达驻军三级，恰扣个人金币120且计数为一。回调可用性单独记录，不能预先假定。保持暂停。下一选项会明确将普通见证链重备为一级，再对已经启动的生产入口调用两次；原排队种子保持不变。"
 aubs_rearm_confirm:0 "重备普通见证链"
 aubs_watch_title:0 "继承夹具：观察循环节奏"
 aubs_watch_desc:0 "第二日已重备普通见证链；城堡三级、实际所有者、继承策略和原排队种子均保留。关闭这个已知窗口，再通过已授权的GUI时间控制恢复时间。逐日检查持续至第十六日，第十七日读取最终后态。陌生原版事件不是夹具选项，应停止并保留给现场负责人处理。"
 aubs_watch_confirm:0 "关闭本检查点"
 aubs_done_title:0 "继承夹具：有界观察完成"
 aubs_done_desc:0 "来源、身份、策略、精确扣费和回调日期谓词已完成，仅证明约定窗口内的行为。原版继续操作证据仍须另核；未证明未来内部队列数量或全产品通过。后续生产种子保持原样。保留证据并正常退出，不新增存档。"
 aubs_partial_title:0 "继承夹具：回调资格仍不完整"
 aubs_partial_desc:0 "最终有界来源和身份检查已完成，但回调日期资格缺失或不一致。未授予精确十五日行为或循环通过标记。保留真实局部结果和正常退出证据，不在本世界重试或删除排队生产种子。"
 aubs_failed_title:0 "继承夹具：已停止"
 aubs_failed_desc:0 "必要准备或业务条件失败，该失败出口不再安排后续夹具阶段。保留原日志和实际暂停状态。不得修复策略、切换到继承者、删除排队种子或重放阶段来取得通过。"
 aubs_review_exit:0 "核对证据并正常退出"
