l_english:
 aubs_ready_title:0 "Succession fixture: ready"
 aubs_ready_desc:0 "Preparation is complete and the game remains paused. The original player still controls Trani, with one direct estate, native Castle III and garrison I. The sampled living heir carries disabled and treasury-only flags. Starting performs one fresh production loop start and one real original-player death. Use the original default Continue as heir; never switch characters to replace inheritance."
 aubs_arm_death:0 "Start the real death and inheritance"
 aubs_handover_title:0 "Succession fixture: heir checkpoint"
 aubs_handover_desc:0 "At day two, the sampled heir is the actual player with inherited personal-only and pause policies. The first automatic scan left garrison II with native III eligible. Stay paused. The live owner must separately retain the actual original Continue action and modal clearance. This next option performs one fresh production scan, expecting exactly 120 personal gold and count one."
 aubs_probe_confirm:0 "Run the paused production payment probe"
 aubs_probe_title:0 "Succession fixture: payment probe complete"
 aubs_probe_desc:0 "The separate production scan reached garrison III, charged exactly 120 personal gold and counted one upgrade. Review the callback observation separately; its availability is not assumed. Stay paused. The next option openly rearms the ordinary witness to garrison I and challenges the already-started production helper twice without removing its original queued seed."
 aubs_rearm_confirm:0 "Rearm the ordinary witness"
 aubs_watch_title:0 "Succession fixture: cadence observation"
 aubs_watch_desc:0 "The ordinary witness is rearmed at day two; Castle III, owner, inherited policies and the original queued seed remain intact. Close this known window, then resume through the authorized GUI time control. Daily source checks continue through day sixteen; final readback is day seventeen. An unfamiliar stock event is not a fixture option: stop and retain it for its owner."
 aubs_watch_confirm:0 "Close this checkpoint"
 aubs_done_title:0 "Succession fixture: bounded observations complete"
 aubs_done_desc:0 "The source, identity, policy, exact payment and callback date predicates completed. This proves the declared bounded behavior only. Official Continue evidence is still separate; future internal event-queue cardinality and whole-product acceptance are not proven. The next production seed was preserved. Retain evidence and exit normally without a new save."
 aubs_partial_title:0 "Succession fixture: callback qualification partial"
 aubs_partial_desc:0 "The bounded final source and identity checks completed, but callback date qualification was missing or inconsistent. Exact fifteen-day behavior and the loop marker were not awarded. Keep the actual partial result and normal-exit evidence. Do not retry or delete the pending production seed in this world."
 aubs_failed_title:0 "Succession fixture: stopped"
 aubs_failed_desc:0 "A required preparation or business predicate failed. No later fixture stage is scheduled from the failed path. Keep the original log and actual paused state. Do not repair flags, switch to the heir, delete a queued seed or replay this stage to obtain a pass."
 aubs_review_exit:0 "Review the evidence and exit normally"
