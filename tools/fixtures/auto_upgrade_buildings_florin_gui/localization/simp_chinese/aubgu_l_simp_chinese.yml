 aubgu_start_title:0 "AUB生产决议界面观察：起点"
 aubgu_start_desc:0 "已读回Robert1128存活、真人且四个生产旗标全关。本窗仅记录前提。保持日历手动暂停，关闭此已知窗口；真实打开生产“启用自动建造”，查看六项及提示，最终确认“优先国库｜超直辖继续”，再点击单独命名的夹具观察决议。不得推进一日，不自动选择陌生原版事件。"
 aubgu_enabled_title:0 "AUB只读观察：已启用状态相符"
 aubgu_enabled_desc:0 "已观察启用为开、三个策略旗标全无、日期未变且资源完全不变。这仅是状态证据，不证明GUI操作。保持暂停关闭本窗，真实执行生产“禁用自动建造”，然后使用禁用状态观察决议。"
 aubgu_disabled_title:0 "AUB只读观察：已禁用状态相符"
 aubgu_disabled_desc:0 "四个生产旗标全无，日期和资源未变。保持暂停关闭本窗；在同一日期立即重新打开真实生产“启用自动建造”，证明可用并再次实际确认默认“优先国库｜超直辖继续”，再使用重新启用观察决议。不宣称读到数值冷却getter。"
 aubgu_reenabled_title:0 "AUB只读观察：同日重新启用相符"
 aubgu_reenabled_desc:0 "原日期再次观察到已启用默认策略且资源未变。Root仍须独立保留同日真实GUI可用及执行证据。保持暂停关闭本窗，真实再禁用，再点击最终观察决议。"
 aubgu_done_title:0 "AUB决议界面只读观察序列完成"
 aubgu_done_desc:0 "最终为禁用、全部策略旗标清除、同一日期和资源不变。夹具没有操作生产决议或清理队列seed。实际GUI、冷却行为、暂停、资金日期与正常退出仍各需独立证据，不代表整产品验收。保持暂停。"
 aubgu_failed_title:0 "AUB界面只读观察：已停止"
 aubgu_failed_desc:0 "实际角色、阶段、日期、资源或生产旗标不符。没有修复生产状态，没有排后继事件。保留失败并保持暂停，不得用夹具标记冒充GUI操作。"
 aubgu_close:0 "关闭并保持日历暂停"
 aubgu_observer_tooltip:0 "只读生产旗标、日期与资源，绝不操作生产决议。"
 aubgu_observer_confirm:0 "只读观察当前状态"
 aubgu_observe_first_enabled_decision:0 "夹具：观察首次生产启用"
 aubgu_observe_first_enabled_desc:0 "只读生产旗标、日期与资源，绝不操作生产决议。"
 aubgu_observe_first_disabled_decision:0 "夹具：观察首次生产禁用"
 aubgu_observe_first_disabled_desc:0 "只读生产旗标、日期与资源，绝不操作生产决议。"
 aubgu_observe_reenabled_decision:0 "夹具：观察同日真实重新启用"
 aubgu_observe_reenabled_desc:0 "只读生产旗标、日期与资源，绝不操作生产决议。"
 aubgu_observe_final_disabled_decision:0 "夹具：观察最终生产禁用"
 aubgu_observe_final_disabled_desc:0 "只读生产旗标、日期与资源，绝不操作生产决议。"
