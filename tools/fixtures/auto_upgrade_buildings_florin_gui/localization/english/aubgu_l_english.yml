l_english:
 aubgu_start_title:0 "AUB production GUI observation: start"
 aubgu_start_desc:0 "Robert1128 is alive/human and all four production flags are disabled. This window records input only. Keep the calendar manually paused and close this known window. Use the actual production Enable decision, inspect all six choices and their hovers, and finish with treasury-first/continue. Then use the separately named fixture observer. Do not advance a day or resolve an unknown stock event automatically."
 aubgu_enabled_title:0 "AUB observation: enabled state matches"
 aubgu_enabled_desc:0 "The read-only observer saw Enable on, all three policy flags absent, the same date and unchanged resources. This is state evidence, not GUI proof. Close while paused; use the actual production Disable decision, then the disabled-state observer."
 aubgu_disabled_title:0 "AUB observation: disabled state matches"
 aubgu_disabled_desc:0 "All four production flags are absent, date and resources unchanged. Close while paused. Immediately reopen the actual production Enable decision on this same date, prove it is available, and actually enable treasury-first/continue again. Then use the re-enabled observer. No numeric cooldown getter is claimed."
 aubgu_reenabled_title:0 "AUB observation: same-day re-enable matches"
 aubgu_reenabled_desc:0 "Enabled/default policy was observed again on the original date, with unchanged resources. Root must independently retain actual same-day GUI availability and execution evidence. Close while paused; actually Disable again, then use the final observer."
 aubgu_done_title:0 "AUB GUI observer sequence complete"
 aubgu_done_desc:0 "The final state is disabled with all policy flags clear, same date and unchanged resources. The fixture did not operate the production decisions or clear queued seeds. Actual GUI, cooldown behavior, pause, money/date and normal-exit evidence remain independently mandatory. This is not whole-product acceptance. Stay paused."
 aubgu_failed_title:0 "AUB GUI observer: stopped"
 aubgu_failed_desc:0 "The actual actor, phase, day, resources or production flags did not match. No production state was repaired and no successor event was queued. Preserve this failure and remain paused. Do not use a fixture marker to claim a GUI action."
 aubgu_close:0 "Close; keep the calendar paused"
 aubgu_observer_tooltip:0 "Read current production flags, date and resources; never operate production decisions."
 aubgu_observer_confirm:0 "Observe current state"
 aubgu_observe_first_enabled_decision:0 "Fixture: observe first production Enable"
 aubgu_observe_first_enabled_desc:0 "Read current production flags, date and resources; never operate production decisions."
 aubgu_observe_first_disabled_decision:0 "Fixture: observe first production Disable"
 aubgu_observe_first_disabled_desc:0 "Read current production flags, date and resources; never operate production decisions."
 aubgu_observe_reenabled_decision:0 "Fixture: observe actual same-day re-enable"
 aubgu_observe_reenabled_desc:0 "Read current production flags, date and resources; never operate production decisions."
 aubgu_observe_final_disabled_decision:0 "Fixture: observe final production Disable"
 aubgu_observe_final_disabled_desc:0 "Read current production flags, date and resources; never operate production decisions."
