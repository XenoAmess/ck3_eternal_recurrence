l_simp_chinese:
 chtt_gui_probe:0 "地产转换验收"
 chtt_gui_record_baseline_decision:0 "记录城市转换前态"
 chtt_gui_record_baseline_decision_desc:0 "只记录当前个人金币。随后请用真实【地产转化为城市】决议选择【罗萨诺】，确认目标及费用后执行。本探针不转换地产、不扣金币。"
 chtt_gui_record_baseline_decision_tooltip:0 "记录暂停前态"
 chtt_gui_record_baseline_decision_confirm:0 "记录前态"
 chtt_gui_verify_city_decision:0 "核对真实城市转换"
 chtt_gui_verify_city_decision_desc:0 "在真实城市决议执行后，检查罗萨诺城市及所有权、未选择的首都仍为城堡、个人金币精确扣除原版费用，并检查同类转换被拒绝。不修正任何结果。"
 chtt_gui_verify_city_decision_tooltip:0 "只检查结果"
 chtt_gui_verify_city_decision_confirm:0 "核对转换"
 chtt_gui_verify_reload_decision:0 "核对已载入的城市结果"
 chtt_gui_verify_reload_decision_desc:0 "必须先通过官方界面实际保存并载入同一存档，再检查城市、首都与金币。仅执行此探针不能证明已保存载入。"
 chtt_gui_verify_reload_decision_tooltip:0 "只检查载入状态"
 chtt_gui_verify_reload_decision_confirm:0 "核对载入"
